name: corpus

# Checks every pull request the way the app reads the corpus. The checker is built from the
# current `main` of Cast Iron, so a corpus change that the app's content build would reject
# fails here, before a tag and a pin bump. Nine checks run:
#   1. `fmt --check`: every file is in canonical form.
#   2. `check`: references resolve (the compiler runs it first and stops on any problem).
#   3. The app's compiler, given the same inputs as `cargo xtask content`: every id in the app's
#      `sources/published-ids.txt` still resolves (directly or through `aliases.toml`), every
#      book has a slot in the app's `sources/published-books.txt`, and every entry is reachable.
#      The compiler's `--corpus-tag` is display metadata and is left out. A pull request that adds
#      a publication fails until the app appends its slot (`cargo xtask published-books`).
#   4. `scripts/rewrite-class-option-powers.py --check`: the class-option review queue is current,
#      and no resolution or exception (`power-exceptions.toml`) is stale, orphaned or obsolete.
#      It needs no build: it reads the corpus and Python 3.11 or later.
#   5. `scripts/feature-prose-540.py --self-test` and `--check` (phynics/cast-iron#540): the review
#      table of each book that is being rewritten into headed printed prose matches its entries (no
#      stale row, no entry that could be converted and was not). It needs no PDF.
#   5b. `scripts/feature-prose-540-class-options.py --self-test` and `--check` (phynics/cast-iron#540):
#      the ledger of the class options that are written (`scripts/class-options/540-<book>.tsv`) matches
#      their entries (no import row or label left, the printed text is in the entry), and no entry is
#      settled and not written. It needs no PDF.
#   6. `scripts/errata.py --self-test` and `--check` (phynics/cast-iron-data#309): `scripts/errata.tsv`
#      is well formed, every row's entry exists, and the entry holds the printed (or kept) value.
#   7. `scripts/spell-levels-284.py --self-test` and `--check` (phynics/cast-iron-data#284):
#      `scripts/spell-levels-284.tsv` is well formed, and every class level that print confirmed is in
#      its spell entry (the `levels` table and the stat block row).
#   8. `scripts/typed-field-spellings-287.py --self-test` and `--check` (phynics/cast-iron-data#287):
#      no typed field holds an old spelling (a legacy creature type, a capitalised size or
#      subschool, an abbreviated alignment, a hit die with a period, a bracket in a school, or
#      `glamer` among the descriptors).
#   9. `scripts/faction-traits-285.py generate --check` (phynics/cast-iron-data#285): the 85 faction
#      traits of the two Pathfinder Society guild guides are the files that
#      `scripts/faction-traits-285.tsv` writes, and no faction-trait file lacks a row.
# When Cast Iron `main` changes the corpus format, this workflow fails until a corpus pull
# request migrates the corpus; that is the point of building from `main`.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: corpus-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  corpus:
    name: check, fmt --check and content build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: corpus
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: phynics/cast-iron
          ref: main
          path: app
          persist-credentials: false
      - name: Pick the checker revision
        id: app
        working-directory: app
        run: |
          # The cache key names the toolchain and the trees that the two binaries are built
          # from, so a change to the app's UI does not rebuild them.
          toolchain=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          inputs=$(git rev-parse HEAD:crates/schema HEAD:crates/search HEAD:crates/corpus \
            HEAD:crates/content-compiler HEAD:Cargo.toml HEAD:Cargo.lock \
            HEAD:rust-toolchain.toml HEAD:.cargo | sha256sum | cut -c1-16)
          echo "Checker built from Cast Iron $(git rev-parse HEAD)"
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"
          echo "key=checker-$toolchain-$inputs" >> "$GITHUB_OUTPUT"
      - name: Cache the checker
        id: tool
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/checker
          key: ${{ steps.app.outputs.key }}
      - name: Build the checker
        if: steps.tool.outputs.cache-hit != 'true'
        working-directory: app
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.app.outputs.toolchain }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/target
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
          cargo build --release --locked -p cast-iron-corpus -p cast-iron-content-compiler
          mkdir -p "$RUNNER_TEMP/checker/bin"
          cp "$CARGO_TARGET_DIR/release/cast-iron-corpus" \
            "$CARGO_TARGET_DIR/release/cast-iron-compile" "$RUNNER_TEMP/checker/bin/"
      - name: Formatting
        run: '"$RUNNER_TEMP/checker/bin/cast-iron-corpus" fmt --check corpus'
      - name: Class-option power queue, resolutions and exceptions
        run: python3 corpus/scripts/rewrite-class-option-powers.py corpus --check
      - name: Feature prose review tables (#540)
        run: |
          python3 corpus/scripts/feature-prose-540.py --self-test
          python3 corpus/scripts/feature-prose-540.py corpus --check
      - name: Class options as printed prose (#540)
        run: |
          python3 corpus/scripts/feature-prose-540-class-options.py --self-test
          python3 corpus/scripts/feature-prose-540-class-options.py corpus --check
      - name: Errata review file (#309)
        run: |
          python3 corpus/scripts/errata.py --self-test
          python3 corpus/scripts/errata.py corpus --check
      - name: Spell class levels (#284)
        run: |
          python3 corpus/scripts/spell-levels-284.py --self-test
          python3 corpus/scripts/spell-levels-284.py corpus --check
      - name: Faction traits of the guild guides (#285)
        run: |
          python3 corpus/scripts/faction-traits-285.py generate --check \
            --tsv corpus/scripts/faction-traits-285.tsv --corpus corpus \
            --published-ids app/sources/published-ids.txt
      - name: Typed field spellings (#287)
        run: |
          python3 corpus/scripts/typed-field-spellings-287.py --self-test
          python3 corpus/scripts/typed-field-spellings-287.py corpus --check
      - name: Check and content build
        run: |
          "$RUNNER_TEMP/checker/bin/cast-iron-compile" \
            --corpus corpus \
            --published app/sources/published-ids.txt \
            --book-slots app/sources/published-books.txt \
            --out "$RUNNER_TEMP/content" \
            --reports "$RUNNER_TEMP/reports"
