[[edit]]
entry = "ref/arc-oracle/pei-zin-practitioner"
anchor = "master-healing-technique"
note = "the script's text with the four tiers written as the printed list under the feature (owner ruling 45), and the printed sentence \"This ability replaces the revelation gained at 7th level\" after the list, where print sets it (Healer's Handbook p. 20); the corpus had each tier as a section and the sentence inside the last one"
text = '''
At 7th level, whenever a Pei Zin practitioner heals a living creature with her healer's way ability, as a free action she can attempt a Profession (herbalist) check to remove a condition from the target, with each condition having an accompanying Profession (herbalist) DC (see the list below). She cannot take 10 or 20 on this check, nor can she receive aid from any creature except another Pei Zin practitioner (though the practitioner need not be an oracle; see pages 24–25 of _Pathfinder Player Companion: Alchemy Manual_). Failure by 5 or more causes the target to become [sickened](ref/misc/sickened) for 1 round (if the Pei Zin practitioner is attempting to remove the sickened condition, this extends it by 1 round). Similarly, failure by 10 or more instead causes the target to become [nauseated](ref/misc/nauseated) for 1 round or to have its existing nauseated condition extended by 1 round. A creature that cannot be sickened or nauseated cannot have conditions removed by this ability.

- Minor Conditions (DC 20): Fatigued, shaken, and sickened.
- Major Conditions (DC 25): Dazed and staggered.
- Severe Conditions (DC 30): Confused, exhausted, frightened, and nauseated.
- Dire Conditions (DC 35): Blinded, deafened, paralyzed, and stunned.

This ability replaces the revelation gained at 7th level.
'''
