[[entry.feature]]
anchor = "trick-shot"
head = "Trick Shot (Ex)"
listed = true
level = 3
print = '''
At 3rd level, an archer can choose one of the following combat maneuvers or actions: [disarm](ref/rule/disarm), [feint](ref/rule/feint), or [sunder](ref/rule/sunder). He can perform this action with a bow against any target within 30 feet, with a -4 penalty to his CMB. Every four levels beyond 3rd, he may choose an additional trick shot to learn. These maneuvers use up arrows as normal.

At 11th level, he may also choose from the following combat maneuvers: [bull rush](ref/rule/bull-rush), [grapple](ref/rule/grapple), [trip](ref/rule/trip). A target grappled by an arrow can break free by destroying the archer's arrow ([hardness](ref/umr/hardness) 5, hit points 1, break DC 13) or with an Escape Artist or CMB check (against the archer's CMD -4). This ability replaces armor training 1, 2, 3, and 4.'''

