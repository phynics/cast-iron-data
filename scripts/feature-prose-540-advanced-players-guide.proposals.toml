[[entry.feature]]
anchor = "torrid-endurance"
head = "Torrid Endurance (Ex)"
listed = true
level = 4
print = "At 4th level, a jungle druid ignores the effects of a hot climate as if under the effects of _[endure elements](ref/spell/endure-elements)_. She also gains a +4 bonus on saves against disease and the exceptional abilities of animals and magical beasts. This ability replaces resist nature's lure."

[[entry.feature]]
anchor = "wild-shape"
head = "Wild Shape (Su)"
listed = true
print = "A jungle druid gains this ability at 6th level, except that her effective druid level for the ability is equal to her druid level - 2."

[[entry.feature]]
anchor = "verdant-sentinel"
head = "Verdant Sentinel (Ex)"
listed = true
level = 13
print = "At 13th level, a jungle druid can cast _[tree shape](ref/spell/tree-shape)_ at will. This ability replaces a thousand faces."

