listed = true
level = 20
print = "At 20th level, a mobile fighter can make a full-attack action as a standard action. He may also use the [Whirlwind Attack](ref/feat/whirlwind-attack) feat as a standard action. This ability replaces weapon mastery."

[[entry]]
id = "ref/arc-fighter/phalanx-soldier"

[[entry.feature]]
anchor = "stand-firm"
head = "Stand Firm (Ex)"
listed = true
level = 2
print = "At 2nd level, a phalanx soldier gains a +1 bonus to CMD against [bull rush](ref/rule/bull-rush), drag, [overrun](ref/rule/overrun), and [trip](ref/rule/trip) attempts. This bonus also applies on saves against [trample](ref/umr/trample) attacks. The bonus increases by +1 for every four levels beyond 2nd. This ability replaces bravery."

[[entry.feature]]
anchor = "phalanx-fighting"
head = "Phalanx Fighting (Ex)"
listed = true
level = 3
print = "At 3rd level, when a phalanx soldier wields a shield, he can use any polearm or spear of his size as a one-handed weapon. This ability replaces armor training 1."

[[entry.feature]]
anchor = "ready-pike"
head = "Ready Pike (Ex)"
listed = true
level = 5
print = "At 5th level, a phalanx soldier can, once per day, [ready](ref/rule/ready) a weapon with the [brace](ref/misc/brace) property as an immediate action, gaining a +1 bonus on attack and damage rolls. For every four levels beyond 5th, this bonus increases by +1, and he can use the ability one additional time per day. He cannot use this ability when [flat-footed](ref/rule/flat-footed). This ability replaces weapon training 1."

[[entry.feature]]
anchor = "deft-shield"
head = "Deft Shield (Ex)"
listed = true
level = 7
print = "At 7th level, the armor check penalty from a shield and the attack roll penalty are reduced by -1 for a phalanx soldier using a [tower shield](ref/eq-armor/tower-shield). At 11th level, these penalties are reduced by -2. This ability replaces armor training 2 and 3."

[[entry.feature]]
anchor = "shield-ally"
head = "Shield Ally (Ex)"
listed = true
level = 9
print = '''
At 9th level, when a phalanx fighter is using a heavy or tower shield, he can, as a move action, provide partial [cover](ref/rule/cover) (+2 cover bonus to AC, +1 bonus on Reflex saves) to himself and all adjacent allies until the beginning of his next turn.

At 13th level, he can instead provide cover (+4 cover bonus to AC, +2 bonus on Reflex saves) and [evasion](ref/ability/evasion) (as a [rogue](ref/class/rogue)) to one adjacent ally until the beginning of his next turn. This cover does not allow Stealth checks.

At 17th level, he can provide cover to himself and all adjacent allies, or he can provide improved cover (+8 cover bonus to AC, +4 bonus on Reflex saves, [improved evasion](ref/ability/improved-evasion)) to a single adjacent ally. This ability replaces weapon training 2, 3, and 4.'''

[[entry.feature]]
anchor = "irresistible-advance"
head = "Irresistible Advance (Ex)"
listed = true
level = 15
print = "At 15th level, a phalanx fighter gains a bonus on bull rush and overrun CMB checks. This bonus depends on the type of shield used: +1 with a buckler, +2 with a light shield, +3 with a heavy shield, or +4 with a tower shield. This ability replaces armor training 4."

[[entry.feature]]
anchor = "shielded-fortress"
head = "Shielded Fortress (Ex)"
listed = true
level = 20
print = "At 20th level, a phalanx fighter's shield cannot be [disarmed](ref/rule/disarm) or [sundered](ref/rule/sunder). He gains evasion (as a rogue) when using a shield (improved evasion when using a tower shield). As a move action, a phalanx fighter can provide evasion to all adjacent allies until the beginning of his next turn. As an immediate action, he can provide improved evasion to an adjacent ally against one attack. This ability replaces weapon mastery."

[[entry]]
id = "ref/arc-fighter/polearm-master"
hold = "the alters trade `Weapon mastery` is not printed in a feature or in the opening text"

[[entry.feature]]
anchor = "pole-fighting"
head = "Pole Fighting (Ex)"
listed = true
level = 2
print = "At 2nd level, as an immediate action, a polearm master can shorten the grip on his spear or polearm with reach and use it against adjacent targets. This action results in a -4 penalty on attack rolls with that weapon until he spends another immediate action to return to the normal grip. The penalty is reduced by -1 for every four levels beyond 2nd. This ability replaces bravery."

[[entry.feature]]
anchor = "steadfast-pike"
head = "Steadfast Pike (Ex)"
listed = true
level = 3
print = "At 3rd level, a polearm master gains a +1 bonus on attack rolls with [readied](ref/rule/ready) attacks and attacks of opportunity made with a spear or polearm. The bonus increases by +1 for every four levels beyond 3rd. This ability replaces armor training 1, 2, 3, and 4."

[[entry.feature]]
anchor = "polearm-training"
head = "Polearm Training (Ex)"
listed = true
level = 5
print = "At 5th level, a polearm master gains a +1 bonus on attack and damage rolls with spears and polearms. The bonus increases by +1 for every four levels beyond 5th. This ability replaces weapon training 1."

[[entry.feature]]
anchor = "flexible-flanker"
head = "Flexible Flanker (Ex)"
listed = true
level = 9
print = "At 9th level, a polearm master may choose any square adjacent to him and treat that square as his location for determining who he is [flanking](ref/rule/flanking), even if that square is occupied by a creature, object, or solid barrier. This ability replaces weapon training 2."

[[entry.feature]]
anchor = "sweeping-fend"
head = "Sweeping Fend (Ex)"
listed = true
level = 13
print = "At 13th level, a polearm master can use any spear or pole arm to make a [bull rush](ref/rule/bull-rush) or [trip](ref/rule/trip) maneuver, though he takes a -4 penalty to his CMB when making such attempts. Weapons with the [trip](ref/misc/trip) property do not incur this penalty on trip maneuvers. This ability replaces weapon training 3."

[[entry.feature]]
anchor = "step-aside"
head = "Step Aside (Ex)"
listed = true
level = 17
print = "At 17th level, when a creature threatened by a polearm master takes [a 5-foot step](ref/rule/take-5-foot-step) into a square adjacent to him, he can take a 5-foot step as an immediate action. This 5-foot step must be subtracted from his movement on the next turn. He also gains a +2 dodge bonus to his AC against that opponent until the end of his next turn. This ability replaces weapon training 4."

[[entry.feature]]
anchor = "polearm-parry"
head = "Polearm Parry (Ex)"
listed = true
level = 19
print = "At 19th level, when an opponent threatened by a polearm master makes a melee attack against an ally, he may take an immediate action to grant his ally a +2 shield bonus to AC and DR 5/— against that attack. He may use this ability to protect himself, but only if the attacking creature is not adjacent to him. This ability replaces armor mastery."

[[entry.feature]]
anchor = "weapon-mastery"
head = "Weapon Mastery (Ex)"
listed = true
print = "A polearm master must choose a spear or polearm."

[[entry]]
id = "ref/arc-fighter/weapon-master"
hold = "head not printed: Chosen Weapon"

[[entry.feature]]
anchor = "weapon-guard"
head = "Weapon Guard (Ex)"
listed = true
level = 2
print = "At 2nd level, a weapon master gains a +1 bonus to CMD against [disarm](ref/rule/disarm) and [sunder](ref/rule/sunder) attempts while wielding his chosen weapon. This bonus also applies on saves against any effect that targets his chosen weapon (for example, _[grease](ref/spell/grease), [heat metal](ref/spell/heat-metal), [shatter](ref/spell/shatter), [warp wood](ref/spell/warp-wood)_). The bonus increases by +1 for every four levels beyond 2nd. This ability replaces bravery."

[[entry.feature]]
anchor = "weapon-training"
head = "Weapon Training (Ex)"
listed = true
level = 3
print = "At 3rd level, a weapon master gains a +1 bonus on attack and damage rolls with his chosen weapon. The bonus improves by +1 for every four levels beyond 3rd. This ability replaces armor training 1, 2, 3, and 4."

[[entry.feature]]
anchor = "reliable-strike"
head = "Reliable Strike (Ex)"
listed = true
level = 5
print = "At 5th level, a weapon master may reroll an attack roll, critical hit confirmation roll, miss chance check, or damage roll as an immediate action. He must accept the second roll even if it is worse. He can use this ability once per day at 5th level, plus one additional time per day for every five levels beyond 5th. This ability replaces weapon training 1."

[[entry.feature]]
anchor = "mirror-move"
head = "Mirror Move (Ex)"
listed = true
level = 9
print = "At 9th level, a weapon master gains his weapon training bonus as an insight bonus to AC when attacked by his chosen weapon. This ability replaces weapon training 2."

[[entry.feature]]
anchor = "deadly-critical"
head = "Deadly Critical (Ex)"
listed = true
level = 13
print = "At 13th level, when a weapon master confirms a critical hit with his chosen weapon, he can increase the weapon's damage multiplier by +1 as an immediate action. He can use this ability once per day at 13th level, plus one additional time per day for every three levels above 13th. This ability replaces weapon training 3."

[[entry.feature]]
anchor = "critical-specialist"
head = "Critical Specialist (Ex)"
listed = true
level = 17
print = "At 17th level, the save DCs of any effects caused by a critical hit with a weapon master's chosen weapon increase by +4. This ability replaces weapon training 4."

[[entry.feature]]
anchor = "unstoppable-strike"
head = "Unstoppable Strike (Ex)"
listed = true
level = 19
print = "At 19th level, a weapon master can take a standard action to make one attack with his chosen weapon as a touch attack that ignores [damage reduction](ref/rule/damage-reduction) (or [hardness](ref/umr/hardness), if attacking an object). This ability replaces armor mastery."

[[entry.feature]]
anchor = "chosen-weapon"
head = "Chosen Weapon"
listed = false
print = ""

[[entry]]
id = "ref/arc-monk/drunken-master"

[[entry.feature]]
anchor = "drunken-ki"
head = "Drunken Ki (Su)"
listed = true
level = 3
print = "At 3rd level, a drunken master can drink a tankard of ale or strong alcohol and gain one temporary _ki_ point. The act of drinking is a standard action that does not provoke attacks of opportunity. The monk can have a maximum number of drunken _ki_ points equal to 1 plus one additional point for every two levels thereafter (5th, 7th, and so on). The monk can gain this temporary _ki_ even before he gains a _ki_ pool at 4th level. These drunken _ki_ points last for 1 hour or until spent, whichever is shorter. As long as he has at least 1 drunken _ki_ point, the monk can spend 1 _ki_ point as a swift action to move 5 feet without provoking attacks of opportunity. This ability replaces still mind."

[[entry.feature]]
anchor = "drunken-strength"
head = "Drunken Strength (Su)"
listed = true
level = 5
print = "At 5th level, a drunken master can spend 1 point of _ki_ as a swift action to inflict 1d6 extra points of damage on a single successful melee attack. The monk can choose to apply the damage after the attack roll is made. At 10th level, the monk may spend 2 drunken _ki_ points to increase the extra damage to 2d6. At 15th level, the monk may spend 3 drunken _ki_ points to increase the extra damage to 3d6. At 20th level, the monk may spend 4 drunken _ki_ points to increase the extra damage to 4d6. The monk must have at least 1 drunken _ki_ point to use this ability. This ability replaces purity of body."

[[entry.feature]]
anchor = "drunken-courage"
head = "Drunken Courage (Su)"
listed = true
level = 11
print = "At 11th level, a drunken master is immune to fear as long as he has at least 1 point of drunken _ki_. This ability replaces diamond body."

[[entry.feature]]
anchor = "drunken-resilience"
head = "Drunken Resilience (Ex)"
listed = true
level = 13
print = "At 13th level, a drunken master gains [DR](ref/rule/damage-reduction) 1/— as long as he has at least 1 point of drunken _ki_. At 16th level, the DR increases to 2/—. At 19th level, it increases to 3/—. This ability replaces diamond soul."

[[entry.feature]]
anchor = "firewater-breath"
head = "Firewater Breath (Su)"
listed = true
level = 19
print = "At 19th level, a drunken master can take a drink and expel a gout of alcohol-fueled fire in a 30-foot cone. Creatures within the cone take 20d6 points of fire damage. A successful Reflex saving throw (DC 10 + 1/2 the monk's level + the monk's Wis modifier) halves the damage. Using this ability is a standard action that consumes 4 _ki_ points from the monk's _ki_ pool. The monk must have at least 1 drunken _ki_ point to use this ability. This ability replaces empty body."

[[entry]]
id = "ref/arc-monk/hungry-ghost-monk"

[[entry.feature]]
anchor = "punishing-kick"
head = "Punishing Kick (Ex)"
listed = true
level = 1
print = "At 1st level, a hungry ghost monk gains [Punishing Kick](ref/feat/punishing-kick) as a bonus feat, even if he does not meet the prerequisites. At 10th level, and every five levels thereafter, the monk can push the target of his Punishing Kick an additional 5 feet (10 feet at 10th level, 15 feet at 15th level, and 20 feet at 20th level). At 15th level, he can instead choose to push the target 5 feet and knock the target [prone](ref/rule/prone) with the same attack. The target still gets a saving throw to avoid being knocked prone. This ability replaces Stunning Fist."

[[entry.feature]]
anchor = "steal-ki"
head = "Steal Ki (Ex)"
listed = true
level = 5
print = "At 5th level, a hungry ghost monk can steal _ki_ from other creatures, though this ability is controversial in some circles of monks, who see it as nothing less than a form of vampirism. If the monk scores a confirmed critical hit against a living enemy or reduces a living enemy to 0 or fewer hit points, he can steal some of that creature's _ki_. This ability replenishes 1 spent _ki_ point to the monk's _ki_ pool, as long as the monk has at least 1 _ki_ point in his pool. He cannot exceed his _ki_ pool's maximum. At 11th level, each time the monk successfully steals _ki_, he can make an immediate saving throw against one disease he is suffering from. There is no penalty for failing this saving throw. The monk gains a bonus equal to his Wisdom modifier on the saving throw. This ability replaces purity of body."

[[entry.feature]]
anchor = "life-funnel"
head = "Life Funnel (Su)"
listed = true
level = 7
print = "At 7th level, a hungry ghost monk can steal a creature's life force to replenish his own. If the monk has at least 1 _ki_ point in his _ki_ pool and scores a confirmed critical hit against a living enemy or reduces a living enemy to 0 or fewer hit points, he heals a number of hit points equal to his monk level. As with steal _ki_, some monks believe that life funnel is an unsavory act, no better than what the undead do to the living. A monk with this ability cannot steal both _ki_ and hit points at the same time. This ability replaces wholeness of body."

[[entry.feature]]
anchor = "life-from-a-stone"
head = "Life from a Stone (Su)"
listed = true
level = 11
print = "At 11th level, a hungry ghost monk can steal _ki_ or life force from any creature, not just living creatures. If the monk has at least 1 ki point in his pool, he gains the benefit of life funnel and steal _ki_ when he confirms a critical hit against any creature or reduces any creature to 0 or fewer hit points. This ability replaces diamond body."

[[entry.feature]]
anchor = "sipping-demon"
head = "Sipping Demon (Su)"
listed = true
level = 13
print = "At 13th level, a hungry ghost monk gains 1 [temporary hit point](ref/rule/temporary-hit-points) each time he hits an enemy with a melee attack. The monk gains a number of temporary hit points equal to his Wisdom modifier when he scores a critical hit. The maximum number of temporary hit points the monk can have is equal to his monk level. The temporary hit points disappear 1 hour later. The monk can only use this ability when he has at least 1 _ki_ point in his _ki_ pool. This ability is a proscribed manipulation of _ki_ considered by many good monks to be a corruption. This ability replaces diamond soul."

[[entry]]
id = "ref/arc-monk/monk-of-the-empty-hand"
hold = "the replaces trade `Weapon proficiencies` is not printed in a feature or in the opening text; the alters trade `Flurry of blows` is not printed in a feature or in the opening text"

[[entry.feature]]
anchor = "weapon-and-armor-proficiency"
head = "Weapon and Armor Proficiency"
listed = false
print = "Monks of the empty hand are proficient with the [shuriken](ref/eq-weapon/shuriken) only. A monk of the empty hand treats normal weapons as [improvised weapons](ref/misc/improvised-weapons) with the following equivalencies (substituting all of their statistics for the listed weapon): a light weapon functions as a [light hammer](ref/eq-weapon/light-hammer), a one-handed weapon functions as a [club](ref/eq-weapon/club), and a two-handed weapon functions as a [quarterstaff](ref/eq-weapon/quarterstaff). This replaces the normal monk weapon proficiencies."

[[entry.feature]]
anchor = "flurry-of-blows"
head = "Flurry of Blows (Ex)"
listed = true
level = 1
print = "Starting at 1st level, a monk of the empty hand can make a flurry of blows using any combination of unarmed strikes or attacks with an improvised weapon. He may not make a flurry of blows with any other weapons, including special monk weapons. A monk of the empty hand's flurry of blows otherwise functions as normal for a monk of his level."

[[entry.feature]]
anchor = "bonus-feat"
head = "Bonus Feat"
listed = false
print = "A monk of the empty hand adds the following feats to his list of bonus feats at 6th level: [Improved Dirty Trick](ref/feat/improved-dirty-trick), [Improved Steal](ref/feat/improved-steal), and [Improvised Weapon Mastery](ref/feat/improvised-weapon-mastery)."

[[entry.feature]]
anchor = "versatile-improvisation"
head = "Versatile Improvisation (Ex)"
listed = true
level = 3
print = "At 3rd level, as a swift action, a monk of the empty hand may use an improvised weapon to deal damage as if it were another type (bludgeoning, piercing, or slashing) for 1 round, regardless of the weapon's normal damage type. This ability replaces still mind."

[[entry.feature]]
anchor = "ki-pool"
head = "Ki Pool (Su)"
listed = true
level = 4
print = "At 4th level, in addition to the normal abilities of his _ki_ pool, a monk of the empty hand may spend 1 point from his _ki_ pool to increase the range increment for an improvised thrown weapon or shuriken by 20 feet for 1 round."

[[entry.feature]]
anchor = "ki-weapons"
head = "Ki Weapons (Su)"
listed = true
level = 5
print = "At 5th level, a monk of the empty hand may spend 1 point from his _ki_ pool as a swift action to deal damage equal to his unarmed strike damage with an improvised weapon for 1 round. At 11th level, the monk may spend _ki_ to grant an enhancement bonus or magical weapon abilities to an improvised weapon for 1 round, at the rate of 1 point of _ki_ per +1 bonus or its equivalent. The monk may not spend more than 3 points of _ki_ at one time for this purpose. For example, a monk can spend 2 points of _ki_ to give his improvised weapon a +1 enhancement bonus and the _[ki focus](ref/magic-enh/ki-focus)_ quality, or just the _[flaming burst](ref/magic-enh/flaming-burst)_ quality. At 15th level, the limit increases to 5 _ki_ per round. The monk may use this ability to add magical weapon qualities to improvised weapons that could not normally have such a quality, such as adding the _[disruption](ref/magic-enh/disruption)_ quality to a slashing weapon, or the _[vorpal](ref/magic-enh/vorpal)_ quality to a bludgeoning weapon. This ability replaces purity of body and diamond body."

[[entry]]
id = "ref/arc-monk/monk-of-the-four-winds"

[[entry.feature]]
anchor = "elemental-fist"
head = "Elemental Fist (Su)"
listed = true
level = 1
print = "At 1st level, a monk of the four winds gains [Elemental Fist](ref/feat/elemental-fist) as a bonus feat, even if he does not meet the prerequisites. At 5th level, and every five levels thereafter, the monk increases the damage of his Elemental Fist by 1d6 (2d6 at 5th level, 3d6 at 10th level, and so on). This ability replaces Stunning Fist."

[[entry.feature]]
anchor = "slow-time"
head = "Slow Time (Su)"
listed = true
level = 12
print = "At 12th level, a monk of the four winds can use his _ki_ to slow time or quicken his movements, depending on the observer. As a swift action, the monk can expend 6 _ki_ points to gain three standard actions during his turn instead of just one. The monk can use these actions to do the following: take a melee attack action, use a skill, use an extraordinary ability, or take a move action. The monk cannot use these actions to cast spells or use [spell-like abilities](ref/umr/spell-like-abilities), and cannot combine them to take full-attack actions. Any move actions the monk makes this turn do not provoke attacks of opportunity. This ability replaces abundant step."

[[entry.feature]]
anchor = "aspect-master"
head = "Aspect Master (Su)"
listed = true
level = 17
print = "At 17th level, a monk of the four winds must choose an aspect of one of the great spirits of the world. Once made, this choice cannot be changed. This spirit grants the monk a new appearance and new abilities, as well as changing or augmenting the monk's personality in some way. Once this choice is made, it cannot be changed. The monk must abide by the alignment restrictions of the aspect. If the monk ever changes his alignment to something outside the aspect's alignment restrictions, he loses this ability and cannot regain it unless his alignment later changes again to match that of the aspect. This ability replaces timeless body."

[[entry.feature]]
anchor = "aspect-of-the-carp"
head = "Aspect of the Carp"
listed = true
print = "The monk's skin becomes a coat of golden, iridescent fish scales, his neck grows gills, and his fingers become webbed. He can breathe water and gains a swim speed equal to his land speed. The carp is heroic and adventurous—a monk must be nonevil to take on the aspect of the carp."

[[entry.feature]]
anchor = "aspect-of-the-ki-rin"
head = "Aspect of the Ki-Rin"
listed = true
print = "The monk's skin takes on a golden luminescence, and a silvery mane that cannot be bound grows atop his head. He gains a fly speed equal to his land speed, but he must end each turn on the ground. If the monk does not land by the end of his turn, he falls from whatever height he has attained. The ki-rin is honorable, honest, and self-sacrificing—a monk must be lawful good to take on the aspect of the ki-rin."

[[entry.feature]]
anchor = "aspect-of-the-monkey"
head = "Aspect of the Monkey"
listed = true
print = "The monk's face becomes that of a monkey, and he grows a prehensile tail. The monk can pick up objects and make unarmed attacks with his tail (though the tail does not grant additional unarmed attacks or natural attacks). In addition, the monk gains a climb speed equal to his land speed. The monkey is a creature of whimsy and a lover of pranks—a monk of any alignment can take on the aspect of the monkey."

[[entry.feature]]
anchor = "aspect-of-the-oni"
head = "Aspect of the Oni"
listed = true
print = "The monk's skin becomes pitch black, and his hair turns white, black, red, or violet. He can assume _[gaseous form](ref/spell/gaseous-form)_ (as the spell) as a standard action for 1 minute per day per monk level. This duration does not need to be consecutive, but it must be spent in 1-minute increments. The oni is treacherous and deceitful, and it hungers for the pain and death of living creatures—a monk must be evil to take on the aspect of the oni."

[[entry.feature]]
anchor = "aspect-of-the-owl"
head = "Aspect of the Owl"
listed = true
print = "The monk grows feathers, and his head becomes avian, with wide, unblinking eyes. He gains a fly speed of 30 feet. The owl is a sage creature, deeply serious, and driven toward a single goal—a monk of any alignment can take on the aspect of the owl."

[[entry.feature]]
anchor = "aspect-of-the-tiger"
head = "Aspect of the Tiger"
listed = true
print = "Dark stripes appear on the monk's skin, and his face becomes more feline. His eyes become catlike, with vertical pupils, and his canines enlarge. Once per hour, the monk can move at 10 times his normal land speed when he makes a charge and is treated as if he had the [pounce](ref/umr/pounce) ability. The tiger is swift, fierce, and deadly—a monk of any alignment can take on the aspect of the tiger."

[[entry.feature]]
anchor = "immortality"
head = "Immortality (Su)"
listed = true
level = 20
print = "At 20th level, a monk of the four winds no longer ages. He remains in his current age category forever. Even if the monk comes to a violent end, he spontaneously _[reincarnates](ref/spell/reincarnate)_ (as the spell) 24 hours later in a place of his choosing within 20 miles of the place he died. The monk must have visited the place in which he returns back to life at least once. This ability replaces perfect self."

[[entry]]
id = "ref/arc-monk/monk-of-the-healing-hand"
hold = "Ki Sacrifice (Su): the app's sentence reader does not read \"replaces both ...\""

[[entry.feature]]
anchor = "ancient-healing-hand"
head = "Ancient Healing Hand (Su)"
listed = true
level = 7
print = "At 7th level, a monk of the healing hand can heal another creature's wounds with a touch. As a full-round action, the monk can spend 2 _ki_ points to heal a number of hit points equal to the monk's level. He needs at least one hand free to use this ability, and cannot heal himself. If the action is interrupted, the subject heals no hit points, and the _ki_ points are lost. This ability replaces wholeness of body."

[[entry.feature]]
anchor = "ki-sacrifice"
head = "Ki Sacrifice (Su)"
listed = true
level = 11
print = "At 11th level, a monk of the healing hand can use his entire _ki_ pool to bring a person back to life. It takes 1 hour to perform this ritual. At the end of the ritual, the monk sacrifices all of his _ki_ in order to cast _[raise dead](ref/spell/raise-dead)_ (as the spell) with a caster level equal to his monk level. The ritual uses all of the _ki_ in the monk's _ki_ pool; the monk must have at least 6 points of _ki_ in his _ki_ pool to use this ability. At 15th level, the monk may sacrifice his _ki_ to cast _[resurrection](ref/spell/resurrection)_. The monk must have at least 8 points of _ki_ in his _ki_ pool to use this ability. These rituals do not require material components. When this ability is used, the monk's _ki_ pool is not replenished until 24 hours have passed. This ability replaces both diamond body and quivering palm."

[[entry.feature]]
anchor = "true-sacrifice"
head = "True Sacrifice (Su)"
listed = true
level = 20
print = "At 20th level, in a final selfless act, a monk of the healing hand can draw in his entire _ki_, which then explodes outward in a 50-foot-radius [emanation](ref/misc/emanation). All dead allies within the emanation are brought back to life, as if they were the subject of a _[true resurrection](ref/spell/true-resurrection)_ spell with a caster level equal to the monk's level. When the monk does this, he is truly and utterly destroyed. A monk destroyed in this way can never come back to life, not even by way of a _[wish](ref/spell/wish)_ or _[miracle](ref/spell/miracle)_ spell or by the power of a deity. Furthermore, the monk's name can never be spoken or written down again. All written mentions of his name become nothing more than a blank space. This ability replaces perfect self."

[[entry]]
id = "ref/arc-monk/monk-of-the-lotus"

[[entry.feature]]
anchor = "touch-of-serenity"
head = "Touch of Serenity (Su)"
listed = true
level = 1
print = "At 1st level, a monk of the lotus gains [Touch of Serenity](ref/feat/touch-of-serenity) as a bonus feat, even if he does not meet the prerequisites. At 6th level, and every six levels thereafter, the duration of Touch of Serenity increases by 1 round. Each round on its turn, the target may attempt a new Will save to end the effect. This duration does not stack; only the longest remaining duration applies. This ability replaces Stunning Fist."

[[entry.feature]]
anchor = "touch-of-surrender"
head = "Touch of Surrender (Su)"
listed = true
level = 12
print = "At 12th level, a monk of the lotus makes a foe into a friend with a single show of mercy. As an immediate action, when one of his melee attacks would reduce a creature to 0 or fewer hit points, the monk can spend 6 _ki_ points to make the target of that attack surrender. When the target surrenders, it is reduced to 0 hit points, becomes [disabled](ref/misc/disabled), and is charmed, as if the monk had cast _[charm monster](ref/spell/charm-monster)_ with a caster level equal to the monk's level. The target does not get a saving throw against this effect. This charm lasts until its duration expires, until the monk dismisses it or uses it on another creature, or until the target is again reduced to 0 or fewer hit points, whichever happens first. The monk can only have one creature charmed with touch of surrender at a time. This is a mind-affecting charm effect. This ability replaces abundant step."

[[entry.feature]]
anchor = "touch-of-peace"
head = "Touch of Peace (Su)"
listed = true
level = 15
print = "At 15th level, a monk of the lotus can set up vibrations within the body of another creature to win over the creature's mind. The monk can use touch of peace once per day, and must announce his intent before making his attack roll. On a successful hit, the attack deals no damage, but the target is charmed as if the monk had cast _[charm monster](ref/spell/charm-monster)_ with a caster level equal to the monk's level. The target does not get a saving throw against this effect. The creature is charmed for 1 day per level. If the monk or his allies attack the charmed creature, or if the monk asks or commands the charmed creature to take hostile actions, the effect ends. This is a mind-affecting charm effect. This ability replaces quivering palm."

[[entry.feature]]
anchor = "learned-master"
head = "Learned Master (Ex)"
listed = true
level = 17
print = "At 17th level, a monk of the lotus gains all [Knowledge](ref/skill/knowledge-all) skills and the [Linguistics](ref/skill/linguistics) skill as class skills. The monk uses Wisdom instead of Intelligence as the key ability for these skills. This ability replaces tongue of the sun and the moon."

[[entry]]
id = "ref/arc-monk/zen-archer"
hold = "the replaces trade `The monk's normal bonus feats` is not printed in a feature or in the opening text; the alters trade `Flurry of blows` is not printed in a feature or in the opening text; the alters trade `Ki pool` is not printed in a feature or in the opening text"

[[entry.feature]]
anchor = "weapon-and-armor-proficiency"
head = "Weapon and Armor Proficiency"
listed = false
print = "Zen archers are proficient with [longbows](ref/eq-weapon/longbow), [shortbows](ref/eq-weapon/shortbow), [composite longbows](ref/eq-weapon/composite-longbow), and [composite shortbows](ref/eq-weapon/composite-shortbow) in addition to their normal weapon proficiencies."

[[entry.feature]]
anchor = "flurry-of-blows"
head = "Flurry of Blows (Ex)"
listed = true
level = 1
print = '''
Starting at 1st level, a zen archer can make a flurry of blows as a full-attack action, but only when using a bow (even though it is a ranged weapon). He may not make a flurry of blows with his unarmed attacks or any other weapons. A zen archer does not apply his Strength bonus on damage rolls made with flurry of blows unless he is using a composite bow with a Strength rating. A zen archer's flurry of blows otherwise functions as normal for a monk of his level.

A zen archer cannot use [Rapid Shot](ref/feat/rapid-shot) or [Manyshot](ref/feat/manyshot) when making a flurry of blows with his bow.'''

[[entry.feature]]
anchor = "bonus-feats"
head = "Bonus Feats"
listed = false
print = "A zen archer's bonus feats must be taken from the following list: [Combat Reflexes](ref/feat/combat-reflexes), [Deflect Arrows](ref/feat/deflect-arrows), [Dodge](ref/feat/dodge), [Far Shot](ref/feat/far-shot), [Point-Blank Shot](ref/feat/point-blank-shot), [Precise Shot](ref/feat/precise-shot), and Rapid Shot. At 6th level, the following feats are added to the list: [Focused Shot](ref/feat/focused-shot), [Improved Precise Shot](ref/feat/improved-precise-shot), Manyshot, [Mobility](ref/feat/mobility), and [Parting Shot](ref/feat/parting-shot). At 10th level, the following feats are added to the list: [Improved Critical](ref/feat/improved-critical), [Pinpoint Targeting](ref/feat/pinpoint-targeting), [Shot on the Run](ref/feat/shot-on-the-run), and [Snatch Arrows](ref/feat/snatch-arrows). A monk need not have any of the prerequisites normally required for these feats to select them. These feats replace the monk's normal bonus feats."

[[entry.feature]]
anchor = "perfect-strike"
head = "Perfect Strike (Ex)"
listed = true
level = 1
print = "At 1st level, a zen archer gains [Perfect Strike](ref/feat/perfect-strike) as a bonus feat, even if he does not meet the prerequisites. A zen archer can use Perfect Strike with any bow. At 10th level, the monk can roll his attack roll three times and take the highest result. If one of these rolls is a critical threat, the monk must choose one of his other two rolls to use as his confirmation roll. This ability replaces Stunning Fist."

[[entry.feature]]
anchor = "way-of-the-bow"
head = "Way of the Bow (Ex)"
listed = true
level = 2
print = "At 2nd level, a zen archer gains [Weapon Focus](ref/feat/weapon-focus) as a bonus feat with one type of bow. At 6th level, the monk gains [Weapon Specialization](ref/feat/weapon-specialization) with the same weapon as a bonus feat, even if he does not meet the prerequisites. This ability replaces evasion."

[[entry.feature]]
anchor = "zen-archery"
head = "Zen Archery (Ex)"
listed = true
level = 3
print = "At 3rd level, a zen archer may use his Wisdom modifier instead of his Dexterity modifier on ranged attack rolls when using a bow. This ability replaces maneuver training."

[[entry.feature]]
anchor = "point-blank-master"
head = "Point Blank Master (Ex)"
listed = true
level = 3
print = "At 3rd level, a zen archer gains Point Blank Master as a bonus feat, even if he does not meet the prerequisites. This ability replaces still mind."

[[entry.feature]]
anchor = "ki-pool"
head = "Ki Pool (Su)"
listed = true
level = 4
print = "At 4th level, in addition to the normal abilities of his _ki_ pool, a zen archer may spend 1 point from his _ki_ pool to increase the range increment for his bow by 50 feet for 1 round."

[[entry.feature]]
anchor = "ki-arrows"
head = "Ki Arrows (Su)"
listed = true
level = 5
print = "At 5th level, a zen archer may spend 1 point from his _ki_ pool as a swift action to change the damage dice of arrows he shoots to that of his unarmed strikes. This lasts until the start of his next turn. For example, a Medium zen archer's short bow normally deals 1d6 damage; using this ability, his arrows deal 1d8 damage until the start of his next turn. This ability replaces purity of body."

[[entry.feature]]
anchor = "reflexive-shot"
head = "Reflexive Shot (Ex)"
listed = true
level = 9
print = "At 9th level, a zen archer can make attacks of opportunity with arrows from his bow. The monk still threatens squares he could reach with unarmed strikes, and can still only make one attack of opportunity per round (unless he has Combat Reflexes). This ability replaces improved evasion."

[[entry.feature]]
anchor = "trick-shot"
head = "Trick Shot (Su)"
listed = true
level = 11
print = "At 11th level, a zen archer may hit targets that he might otherwise miss. By spending 1 point from his _ki_ pool as a swift action, the zen archer can ignore [concealment](ref/rule/concealment). By spending 2 points, he can ignore total concealment or [cover](ref/rule/cover). By spending 3 points, he can ignore total cover, even firing arrows around corners. The arrow must still be able to reach the target; a target inside a closed building with no open doors or windows cannot be attacked. These effects last for 1 round. This ability replaces diamond body."

[[entry.feature]]
anchor = "ki-focus-bow"
head = "Ki Focus Bow (Su)"
listed = true
level = 17
print = "At 17th level, as long as he has at least 1 point of _ki_ in his _ki_ pool, a zen archer may treat arrows fired from his bow as if they were _[ki focus](ref/magic-enh/ki-focus)_ weapons, allowing him to use his special _ki_ attacks as if his arrows were unarmed attacks. This ability replaces tongue of the sun and moon."

[[entry]]
id = "ref/arc-paladin/divine-defender"

[[entry.feature]]
anchor = "shared-defense"
head = "Shared Defense (Su)"
listed = true
level = 3
print = "At 3rd level, a divine defender can spend one use of her lay on hands ability as a standard action to grant all adjacent allies (including paladins) a bonus. At 3rd level, adjacent allies receive a +1 sacred bonus to their AC and CMD and on their saving throws. These bonuses last for a number of rounds equal to the divine defender's Charisma modifier. At 9th level and 15th level, this bonus increases by +1. At 6th level, these bonuses are granted to all allies within 10 feet, and allies that are at fewer than 0 hit points within this area are automatically stabilized. At 12th level, these bonuses are granted to all allies within 15 feet, and allies within this area are immune to [bleed](ref/umr/bleed) damage. At 18th level, these bonuses are granted to all allies within 20 feet, and allies within this area gain a 25% chance to negate any sneak attack or critical hit scored against them. This ability does not stack with the chance provided from the light, medium, or heavy _fortification_ armor special abilities. These bonuses are cumulative with each other. Allies only benefit from these bonuses while in the listed area. This ability replaces mercy."

[[entry.feature]]
anchor = "divine-bond"
head = "Divine Bond (Su)"
listed = true
level = 5
print = "At 5th level, instead of forming a divine bond with her weapon or a mount, a divine defender can form a bond with her armor. As a standard action, a divine defender can enhance her armor by calling upon the aid of a celestial spirit. This bond lasts for 1 minute per paladin level. When called, the spirit causes the armor to shed light like a [torch](ref/eq-misc/torch). At 5th level, the spirit grants the armor a +1 enhancement bonus. For every three levels beyond 5th, the armor gains another +1 enhancement bonus, to a maximum of +6 at 20th level. These bonuses can be added to the armor, stacking with existing armor bonuses to a maximum of +3, or they can be used to add any of the following armor properties (asterisks note new armor properties found in Chapter 7): _[champion](ref/magic-enh/champion)_\\*, _[ghost touch](ref/magic-enh/ghost-touch-armor), [heavy fortification](ref/magic-enh/fortification-heavy), [invulnerability](ref/magic-enh/invulnerability), [light fortification](ref/magic-enh/fortification-light), [moderate fortification](ref/magic-enh/fortification-moderate), [spell resistance](ref/magic-enh/spell-resistance)_ (13, 15, 17, or 19). Adding these properties consumes an amount of bonus equal to the property's cost (see Table 15–4 of the _Core Rulebook_). In addition, the bonuses can be consumed at the listed amount to add any of the following armor properties: _[energy resistance](ref/magic-enh/energy-resistance)_ for +3 bonus, _[improved energy resistance](ref/magic-enh/energy-resistance-improved)_ for +5 bonus, or _[righteous](ref/magic-enh/righteous)_\\* for +4 bonus. These bonuses are added to any properties the armor already has, but duplicate abilities do not stack. If the armor is not magical, at least a +1 enhancement bonus must be added before any other properties can be added. The bonus and properties granted by the spirit are determined when the spirit is called and cannot be changed until the spirit is called again. The celestial spirit imparts no bonuses if the armor is worn by anyone other than the divine defender, but it resumes giving bonuses if the divine defender dons the armor again. A divine defender can use this ability once per day at 5th level, and one additional time per day for every four levels beyond 5th, to a total of four times per day at 17th level.\n\nIf a suit of armor with a celestial spirit is destroyed, the divine defender loses the use of this ability for 30 days, or until she gains a level, whichever comes first. During this 30-day period, the divine defender takes a -1 penalty on attack and weapon damage rolls."

[[entry]]
id = "ref/arc-paladin/hospitaler"
hold = "the alters trade `Smite evil` is not printed in a feature or in the opening text"

[[entry.feature]]
anchor = "smite-evil"
head = "Smite Evil (Su)"
listed = true
print = "This functions as the paladin ability, but the hospitaler can smite evil one additional time per day at 7th level, and every six levels thereafter (instead of 4th level and every three levels thereafter)."

[[entry.feature]]
anchor = "channel-positive-energy"
head = "Channel Positive Energy (Su)"
listed = true
print = "When a hospitaler reaches 4th level, she gains the ability to channel positive energy as a [cleric](ref/class/cleric) equal to her paladin level -3. She can use this ability a number of times per day equal to 3 + her Charisma modifier. Using this ability does not expend uses of lay on hands, as it does with other paladins. This replaces the standard paladin's channel positive energy ability."

[[entry.feature]]
anchor = "aura-of-healing"
head = "Aura of Healing (Su)"
listed = true
level = 11
print = "At 11th level, a hospitaler can expend one use of her channel positive energy ability to emit a 30-foot aura of healing for a number of rounds equal to her paladin level. Allies in this aura (including the hospitaler) automatically [stabilize](ref/misc/stable) if below 0 hit points and are immune to [bleed](ref/umr/bleed) damage. In addition, allies (including the paladin) that spend at least 1 full round inside the aura are healed an amount of damage equal to their total number of Hit Dice and may make a saving throw against any afflictions they are suffering from, such as a curse, disease, or poison. This saving throw only counts toward curing the affliction and does not impose any penalty on a failed save. Allies can only be healed once by a use of this ability and they can only attempt additional saving throws once per day, even if they are exposed to this aura multiple times. This ability replaces aura of justice."

[[entry]]
id = "ref/arc-paladin/sacred-servant"
hold = "the alters trade `Divine bond` is not printed in a feature or in the opening text"

[[entry.feature]]
anchor = "smite-evil"
head = "Smite Evil (Su)"
listed = true
print = "This functions as the paladin ability, but the sacred servant can smite evil one additional time per day at 7th level, and every six levels thereafter (instead of 4th level and every three levels thereafter). This replaces smite evil."

[[entry.feature]]
anchor = "spells"
head = "Spells"
listed = true
level = 4
print = "At 4th level, when a sacred servant gains the ability to cast spells, she also chooses one [domain](ref/ability/domains) associated with her deity. Her effective [cleric](ref/class/cleric) level for this domain is equal to her paladin level -3. In addition, she also gains one domain spell slot for each level of paladin spells she can cast. Every day she must prepare the domain spell from her chosen domain in that spell slot."

[[entry.feature]]
anchor = "divine-bond"
head = "Divine Bond (Su)"
listed = true
level = 5
print = '''
At 5th level, instead of forming a divine bond with her weapon or a mount, a sacred servant forms a bond with her holy symbol. As a standard action, a sacred servant can bind a celestial spirit to her holy symbol for 1 minute per paladin level. When called, the spirit causes the sacred servant's holy symbol to shed light like a [torch](ref/eq-misc/torch). At 5th level, the spirit grants one bonus. For every three levels beyond 5th, the spirit grants one additional bonus. These bonuses can be spent in a number of ways to grant the paladin enhanced abilities to channel positive energy and to cast spells. Each bonus can be used to grant one of the following enhancements: +1 caster level to any paladin spell cast, +1 to the DC to halve the damage of channel positive energy when used to harm undead, +1d6 to channel positive energy, +1 use/ day of lay on hands. These enhancements stack and can be selected multiple times. The enhancements granted by the spirit are determined when the spirit is called and cannot be changed until the spirit is called again. If the sacred servant increases her number of uses of lay on hands per day in this way, that choice is set for the rest of the day, and once used, these additional uses are not restored (even if the spirit is called again that day). The celestial spirit imparts no enhancements if the holy symbol is held by anyone other than the sacred servant, but resumes giving enhancements if returned to the sacred servant. A sacred servant can use this ability once per day at 5th level, and one additional time per day for every four levels beyond 5th, to a total of four times per day at 17th level.

If a holy symbol with a celestial spirit is destroyed, the sacred servant loses the use of this ability for 30 days, or until she gains a level, whichever comes first. During this 30-day period, the sacred servant takes a -1 penalty on attack and weapon damage rolls.'''

[[entry.feature]]
anchor = "call-celestial-ally"
head = "Call Celestial Ally (Sp)"
listed = true
level = 8
print = "At 8th level, a sacred servant can call upon her deity for aid, in the form of a powerful servant. This allows the sacred servant to cast _lesser [planar ally](ref/spell/planar-ally)_ once per week as a [spell-like ability](ref/umr/spell-like-abilities) without having to pay the material component cost or the servant (for reasonable tasks). At 12th level, this improves to _planar ally_ and at 16th level, this improves to _[greater planar ally](ref/spell/planar-ally-greater)_. The sacred servant's caster level for this effect is equal to her paladin level. This ability replaces aura of resolve."

[[entry]]
id = "ref/arc-paladin/shining-knight"
hold = "the alters trade `Divine bond` is not printed in a feature or in the opening text"

[[entry.feature]]
anchor = "skilled-rider"
head = "Skilled Rider (Ex and Su)"
listed = true
level = 3
print = "At 3rd level, a shining knight does not take any penalty to her Ride skill due to her armor check penalty. In addition, any mount she is riding gains the benefit of her divine grace class feature, adding her Charisma bonus (if any) to its saving throws. This ability replaces divine health."

[[entry.feature]]
anchor = "divine-bond"
head = "Divine Bond (Su)"
listed = true
print = "Upon reaching 5th level, a shining knight must form a bond with a mount. This ability otherwise functions as the paladin ability."

[[entry.feature]]
anchor = "knight-s-charge"
head = "Knight's Charge (Su)"
listed = true
level = 11
print = "At 11th level, whenever a mounted shining knight charges a foe, her movement does not provoke attacks of opportunity, for either her or her mount. In addition, if her target is also the target of her smite evil ability and the charge attack hits, the target must make a Will save or be [panicked](ref/misc/panicked) for a number of rounds equal to 1/2 the shining knight's level. The DC of this save is equal to 10 + 1/2 the shining knight's level + the shining knight's Charisma modifier. This ability replaces aura of justice."

[[entry]]
id = "ref/arc-paladin/warrior-of-the-holy-light"

[[entry.feature]]
anchor = "power-of-faith"
head = "Power of Faith (Su)"
listed = true
level = 4
print = '''
At 4th level, a warrior of the holy light learns to use the power of her faith to bolster her defenses and aid her allies. This class feature replaces the paladin's spells class feature. A warrior of the holy light does not gain any spells or spellcasting abilities, does not have a caster level, and cannot use spell trigger or spell completion magic items.

At 4th level, the warrior of the holy light gains one additional use of her lay on hands ability per day. She gains one additional use of lay on hands per day for every four levels she attains beyond 4th. She can spend a use of her lay on hands ability to call upon the power of her faith as a standard action. This causes a nimbus of _light_ to emanate from the warrior of the holy light in a 30-foot radius. All allies in this area (including the warrior of the holy light) receive a +1 morale bonus to AC and on attack rolls, damage rolls, and saving throws against fear as long as they remain in the area of light. This power lasts for 1 minute.

At 8th level, the nimbus of light heals the paladin and her allies, curing of them of 1d4 points of ability damage, as per the spell _[lesser restoration](ref/spell/restoration-lesser)_. A creature can only be healed in this way once per day.

At 12th level, the nimbus of light is treated as _[daylight](ref/spell/daylight)_ for the purposes of affecting creatures with sensitivity to light. In addition, the nimbus grants the warrior of the holy light and her allies in the area [resistance](ref/umr/resistance) 10 to one type of energy, selected by the warrior of the holy light when this power is activated.

At 16th level, the nimbus of light grants the warrior of the holy light and her allies protection from critical hits. There is a 25% chance that critical hits made against the warrior of the holy light and her allies in the area are instead treated as normal hits. This does not stack with other abilities that grant similar protection (such as _[light fortification](ref/magic-enh/fortification-light)_).

At 20th level, the nimbus of light increases in size out to a range of 60 feet. In addition, all of its bonuses increase. The morale bonus to AC and on attack rolls, damage rolls, and saving throws against fear increases to +2. The amount of ability damage healed increases to 2d4. The energy resistance increases to 20 against one energy type. Finally, protection against critical hits increases to 50%.'''

[[entry.feature]]
anchor = "shining-light"
head = "Shining Light (Su)"
listed = true
level = 14
print = "At 14th level, a warrior of the holy light can unleash a 30-foot [burst](ref/misc/burst) of pure, white light as a standard action. Evil creatures within this burst take 1d6 points of damage for every two paladin levels and are [blinded](ref/misc/blinded) for 1 round. Evil dragons, evil outsiders, and evil undead are blinded for 1d4 rounds on a failed save. A Reflex save halves this damage and negates the blindness. The DC of this save is equal to 10 + 1/2 the warrior of the holy light's level + the warrior of the holy light's Charisma modifier. Good creatures within this burst are healed 1d6 points of damage per two paladin levels and receive a +2 sacred bonus on ability checks, attack rolls, saving throws, and skill checks for 1 round. A warrior of the holy light can use this ability once per day at 14th level plus one additional time per day at 17th and 20th levels. This ability replaces aura of faith."

[[entry]]
id = "ref/arc-ranger/beast-master"

[[entry.feature]]
anchor = "class-skills"
head = "Class Skills"
listed = true
print = "A beast master's class skills are Acrobatics (Dex), Climb (Str), Craft (Int), Escape Artist (Dex), Handle Animal (Cha), Heal (Wis), Intimidate (Cha), Knowledge (nature) (Int), Perception (Wis), Ride (Dex), Stealth (Dex), Survival (Wis), and Swim (Wis). These replace the standard ranger class skills."

[[entry.feature]]
anchor = "animal-companion"
head = "Animal Companion (Ex)"
listed = true
print = '''
A beast master forms a close bond with an [animal companion](ref/sidekick/animal-companion). This ability functions like the druid animal companion ability except that the ranger's effective druid level is equal to his ranger level - 3. The ranger gains a +2 bonus on wild empathy and Handle Animal checks made regarding his animal companion. Unlike a normal ranger, a beast master's choice of animal companion is not limited to a subset of all possibile animal companion choices—he may choose freely among all animal companion choices, just as a druid can.

The beast master may have more than one animal companion, but he must divide up his effective druid level between his companions to determine the abilities of each companion. For example, a beast master with an effective druid level of 4 can have one 4th-level companion, two 2nd-level companions, or one 1st-level and one 3rd-level companion. Each time a beast master's effective druid level increases, he must decide how to allocate the increase among his animal companions (including the option of adding a new 1st-level companion). Once an effective druid level is allocated to a particular companion, it cannot be redistributed while that companion is in the ranger's service (he must release a companion or wait until a companion dies to allocate its levels to another companion). The share spells animal companion ability does not give the ranger the ability to cast a single spell so that it affects all of his animal companions. This ability replaces hunter's bond.'''

[[entry.feature]]
anchor = "improved-empathic-link"
head = "Improved Empathic Link (Su)"
listed = true
level = 6
print = "The beast master gains an empathic link with all of his animal companions. This functions like an empathic link with a [familiar](ref/sidekick/familiar), except the ranger can also see through a companion's eyes as a swift action, maintaining this connection as long as he likes (as long as the companion is within 1 mile) and ending it as a free action. The ranger can only see through the eyes of one companion at a time, and is [blinded](ref/misc/blinded) while maintaining this connection. This replaces the 6th-level combat style feat."

[[entry.feature]]
anchor = "strong-bond"
head = "Strong Bond (Ex)"
listed = true
level = 12
print = "At 12th level, the ranger strengthens his bond with his animal companions. The ranger's effective druid level for his animal companions is now equal to his ranger level; he may immediately allocate these additional levels to his companions as he sees fit. This ability replaces camouflage."

[[entry]]
id = "ref/arc-ranger/guide"

[[entry.feature]]
anchor = "ranger-s-focus"
head = "Ranger's Focus (Ex)"
listed = true
level = 1
print = '''
At 1st level, once per day, the guide can focus on a single enemy within line of sight as a swift action. That creature remains the ranger's focus until it is reduced to 0 or fewer hit points or surrenders, or until the ranger designates a new focus, whichever occurs first. The ranger gains a +2 bonus on attack and damage rolls against the target of his focus. At 5th level, and every five levels thereafter, this bonus increases by +2.

At 4th level, and every 3 levels thereafter, the ranger can use this ability one additional time per day. This ability replaces favored enemy.'''

[[entry.feature]]
anchor = "terrain-bond"
head = "Terrain Bond (Ex)"
listed = true
level = 4
print = "At 4th level, the guide forms a bond with the land itself, enabling him to direct others in such terrain. When in his favored terrain, the ranger grants all allies within line of sight and that can hear him a +2 bonus on initiative checks and Perception, Stealth, and Survival skill checks. Also, as long as they travel with him, the ranger's allies leave no trail and can't be tracked. The ranger can choose for the group to leave a trail, or even specific members of the group to leave a trail if he so desires. This ability replaces hunter's bond."

[[entry.feature]]
anchor = "ranger-s-luck"
head = "Ranger's Luck (Ex)"
listed = true
print = "Upon reaching 9th level, once per day the guide can either reroll one of his attack rolls or force an enemy who just hit him with an attack to reroll the attack roll. The ranger must take the result of the second roll even if it is worse. A ranger can use this ability once per day at 9th level, plus one additional time per day at 14th and 19th levels. This ability replaces evasion."

[[entry.feature]]
anchor = "inspired-moment"
head = "Inspired Moment (Ex)"
listed = true
level = 11
print = "At 11th level, the guide can have an inspired moment once per day as a free action. The ranger gains the following benefits until the end of his next turn. His speed increases by 10 feet. He can take an extra move or swift action on his turn. He gains a +4 bonus to AC and on attack rolls, skill checks, or ability checks. Finally, he automatically confirms any critical threat he scores. He can use this ability one additional time per day at 19th level. This ability replaces quarry and improved quarry."

[[entry.feature]]
anchor = "improved-ranger-s-luck"
head = "Improved Ranger's Luck (Ex)"
listed = true
print = "Upon reaching 16th level, the ranger's luck increases. He gains a +4 bonus on his rerolls made with the ranger's luck ability, or if he forces an enemy to reroll an attack, that enemy takes a -4 penalty on the roll. This bonus or penalty is also applied on any roll to confirm critical hits. This ability replaces improved evasion."

[[entry]]
id = "ref/arc-ranger/infiltrator"

[[entry.feature]]
anchor = "adaptation"
head = "Adaptation (Ex)"
listed = true
level = 3
print = '''
At 3rd level, an infiltrator learns how to copy the unusual abilities of his prey. He chooses one type of creature he has selected as a favored enemy, such as "aberrations." The ranger selects one ability or feat from the adaptation list for that type (see below). A ranger can use adaptations for 10 minutes per day per ranger level he possesses. This duration does not need to be consecutive, but it must be used in 10-minute increments. If the adaptation requires the ranger to make a more specific choice (such as what skill to use with [Skill Focus](ref/feat/skill-focus)), this choice is permanent and cannot be changed.

At 8th, 13th, and 15th-level, the ranger chooses another one of his favored enemy types and selects one adaptation from that type's list, as well as an additional adaptation from any one list of a creature type he's selected (including the one just chosen, if so desired). The infiltrator can only use one adaptation at a time. This class ability replaces favored terrain.'''

[[entry.feature]]
anchor = "aberration"
head = "Aberration"
listed = true
print = "[amphibious](ref/umr/amphibious), [darkvision](ref/rule/darkvision) 60 ft., [Iron Will](ref/feat/iron-will), natural armor +2."

[[entry.feature]]
anchor = "animal"
