[[entry]]
id = "ref/arc-barbarian/elemental-kin"

[[entry.feature]]
anchor = "elemental-fury"
head = "Elemental Fury (Ex)"
listed = true
level = 3
print = "At 3rd level, whenever the elemental kin takes an amount of energy damage equal to or greater than her barbarian level while raging, she adds 1 to the total number of rounds that she can rage that day. At 6th level, and every three levels thereafter, the number of extra rounds per energy attack increases by +1, to a maximum of +6 rounds per energy attack at at 18th level. This ability replaces trap sense."

[[entry.feature]]
anchor = "rage-powers"
head = "Rage Powers"
listed = false
print = "The following rage powers complement the elemental kin archetype: [elemental rage](ref/ragepower/elemental-rage), [energy absorption](ref/ragepower/energy-absorption), [energy eruption](ref/ragepower/energy-eruption), [energy resistance](ref/ragepower/energy-resistance), [greater elemental rage](ref/ragepower/greater-elemental-rage), [greater energy resistance](ref/ragepower/greater-energy-resistance), and [lesser elemental rage](ref/ragepower/lesser-elemental-rage)."

[[entry]]
id = "ref/arc-bard/arcane-duelist"
hold = "head not printed: Bonded Object; the replaces trade `Countersong` is not printed in a feature or in the opening text; the replaces trade `Versatile performance` is not printed in a feature or in the opening text; the replaces trade `well-versed` is not printed in a feature or in the opening text"

[[entry.feature]]
anchor = "arcane-strike"
head = "Arcane Strike"
listed = true
print = "Arcane duelists gain [Arcane Strike](ref/feat/arcane-strike) as a bonus feat at 1st level. This ability replaces bardic knowledge."

[[entry.feature]]
anchor = "bardic-performance"
head = "Bardic Performance"
listed = true
print = "An arcane duelist gains the following types of bardic performance."

[[entry.feature]]
anchor = "rallying-cry"
head = "Rallying Cry (Su)"
listed = true
level = 1
print = "At 1st level, an arcane duelist can use performance to rally dispirited allies. Each round he makes an Intimidate check. Any ally (including the bard) within 30 feet may use this check in place of his own saving throw against fear and despair effects. Those already under a fear or despair effect can attempt a new save each round using the bard's Intimidate check. Rallying cry does not work on effects that don't allow saves. This is a mind-affecting ability that uses audible components. This performance replaces countersong."

[[entry.feature]]
anchor = "bladethirst"
head = "Bladethirst (Su)"
listed = true
print = "An arcane duelist of 6th level or higher may use performance to grant one weapon, one natural weapon, one end of a double weapon, or 50 items of ammunition of the same type within 30 feet a +1 enhancement bonus. This enhancement bonus increases by +1 for every three levels after 6th (maximum +5 at 18th level). These bonuses stack with existing bonuses and may be used to increase the item's enhancement bonus up to +5 or to add any of the following weapon properties: _[defending](ref/magic-enh/defending)_, _[distance](ref/magic-enh/distance)_, _[ghost touch](ref/magic-enh/ghost-touch-weapon)_, _[keen](ref/magic-enh/keen)_, _[mighty cleaving](ref/magic-enh/mighty-cleaving)_, _[returning](ref/magic-enh/returning)_, _[shock](ref/magic-enh/shock)_, _[shocking burst](ref/magic-enh/shocking-burst)_, _[seeking](ref/magic-enh/seeking)_, _[speed](ref/magic-enh/speed)_, or _[wounding](ref/magic-enh/wounding)_. If the weapon is not magical, at least a +1 enhancement bonus must be added before adding special abilities. This performance replaces suggestion."

[[entry.feature]]
anchor = "mass-bladethirst"
head = "Mass Bladethirst (Su)"
listed = true
print = "An arcane duelist of 18th level or higher can use his bladethirst performance to enhance the weapons of as many allies as desired within 30 feet. The bonus provided by this power is +4 if conferred on two allies, +3 for three allies, +2 for four allies, and +1 for five or more allies. The power granted to each weapon must be identical. This ability replaces mass suggestion."

[[entry.feature]]
anchor = "bonus-feats"
head = "Bonus Feats"
listed = false
print = "An arcane duelist weaves might and magic in his combat style, gaining the following bonus feats at 2nd level and every four levels thereafter: 2nd level—[Combat Casting](ref/feat/combat-casting), 6th level—[Disruptive](ref/feat/disruptive), 10th level—[Spellbreaker](ref/feat/spellbreaker), 14th level—[Penetrating Strike](ref/feat/penetrating-strike), 18th level—[Greater Penetrating Strike](ref/feat/greater-penetrating-strike). This ability replaces versatile performance and well-versed."

[[entry.feature]]
anchor = "arcane-bond"
head = "Arcane Bond (Ex)"
listed = true
level = 5
print = "At 5th level, an arcane duelist gains the arcane bond ability as a [wizard](ref/class/wizard), using a weapon as his bonded item, allowing him to cast any one additional spell that he knows once per day. He may not choose a familiar or other type of bonded item. He may use the hand holding his bonded weapon for somatic components. This ability replaces lore master."

[[entry.feature]]
anchor = "arcane-armor"
head = "Arcane Armor (Ex)"
listed = true
level = 10
print = "At 10th level, an arcane duelist gains Medium Armor Proficiency and can cast bard spells in medium armor with no chance of arcane spell failure. At 16th level, he gains Heavy Armor Proficiency and can cast bard spells in heavy armor with no arcane spell failure. This ability replaces jack of all trades."

