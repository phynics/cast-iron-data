print = "At 9th level, a desert druid becomes immune to blinding and dazzling effects and gains a +2 bonus on saving throws against [gaze](ref/umr/gaze) attacks and illusions of the figment and pattern subschools. This ability replaces venom immunity."

[[entry.feature]]
anchor = "dunemeld"
head = "Dunemeld (Ex)"
listed = true
level = 13
print = "At 13th level, a desert druid can assume the form of a swirling mass of sand at will. This is equivalent to _[gaseous form](ref/spell/gaseous-form)_, but the druid gains a land and burrow speed of 10 feet rather than a fly speed. While in this form, the druid gains a circumstance bonus on Stealth checks made in desert terrain equal to her druid level. This ability replaces a thousand faces."

