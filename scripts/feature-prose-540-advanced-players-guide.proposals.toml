head = "Wild Empathy (Ex)"
listed = true
print = "A lion shaman can use wild empathy with felines as a full-round action with a +4 bonus."

[[entry.feature]]
anchor = "totem-transformation"
head = "Totem Transformation (Su)"
listed = true
level = 2
print = "At 2nd level, a lion shaman may adopt an aspect of the lion while retaining her normal form. This ability functions as the bear shaman ability, but the druid may select from the following bonuses: movement (+20 enhancement bonus to land speed), senses ([low-light vision](ref/rule/low-light-vision), [scent](ref/umr/scent)), or [natural weapons](ref/umr/natural-attacks) (bite \\[1d4\\], 2 claws \\[1d4\\] for a Medium druid, rake, +2 CMB to grapple). While using totem transformation, the lion shaman may speak normally and can cast _[speak with animals](ref/spell/speak-with-animals)_ (felines only) at will."

[[entry.feature]]
anchor = "totemic-summons"
head = "Totemic Summons (Su)"
listed = true
level = 5
print = "At 5th level, a lion shaman may cast _[summon nature's ally](ref/spell/summon-natures-ally)_ as a standard action when summoning felines, and these summoned creatures gain [temporary hit points](ref/rule/temporary-hit-points) equal to her druid level. This ability otherwise functions as the bear shaman ability."

[[entry.feature]]
anchor = "wild-shape"
head = "Wild Shape (Su)"
listed = true
level = 6
print = "At 6th level, a lion shaman's wild shape ability functions at her druid level - 2. If she takes on the form of a feline, she instead uses her druid level + 2."

[[entry.feature]]
anchor = "bonus-feat"
head = "Bonus Feat"
listed = false
print = "At 9th level and every 4 levels thereafter, a lion shaman gains one of the following bonus feats: [Dodge](ref/feat/dodge), [Lunge](ref/feat/lunge), [Improved Iron Will](ref/feat/improved-iron-will), [Iron Will](ref/feat/iron-will), or [Skill Focus](ref/feat/skill-focus) (Acrobatics). She must meet the prerequisites for these bonus feats. This ability replaces venom immunity."

