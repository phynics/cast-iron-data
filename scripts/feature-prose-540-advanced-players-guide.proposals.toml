anchor = "bonded-object"
head = "Bonded Object"
listed = false
print = ""

[[entry]]
id = "ref/arc-bard/court-bard"
hold = "the replaces trade `Inspire courage` is not printed in a feature or in the opening text; the replaces trade `Inspire competence` is not printed in a feature or in the opening text; the replaces trade `Dirge of doom` is not printed in a feature or in the opening text; the replaces trade `Frightening tune` is not printed in a feature or in the opening text"

[[entry.feature]]
anchor = "bardic-performance"
head = "Bardic Performance"
listed = true
print = "A court bard gains the following types of bardic performance."

[[entry.feature]]
anchor = "satire"
head = "Satire (Su)"
listed = true
print = "A court bard can use performance to undermine the confidence of enemies who hear it, causing them to take a -1 penalty on attack and damage rolls (minimum 1) and a -1 penalty on saves against fear and charm effects as long as the bard continues performing. This penalty increases by -1 at 5th level and every six levels thereafter. Satire is a language-dependent, mind-affecting ability that uses audible components. This performance replaces inspire courage."

[[entry.feature]]
anchor = "mockery"
head = "Mockery (Su)"
listed = true
print = "A court bard of 3rd level or higher can subtly ridicule and defame a specific individual. The bard selects one target who can hear his performance. That individual takes a -2 penalty on Charisma checks and Charisma-related skill checks as long as the bard continues performing. This penalty increases by -1 every four levels after 3rd. Mockery is a language-dependent, mind-affecting ability that relies on audible components. This performance replaces inspire competence."

[[entry.feature]]
anchor = "glorious-epic"
head = "Glorious Epic (Su)"
listed = true
print = "A court bard of 8th level or higher can weave captivating tales that engross those who hear them. Enemies within 30 feet become [flat-footed](ref/rule/flat-footed) unless they succeed at a Will save (DC 10 + 1/2 the bard's level + the bard's Cha modifier). A save renders them immune to this ability for 24 hours. Glorious epic is a language-dependent, mind-affecting ability that uses audible components. This performance replaces dirge of doom."

[[entry.feature]]
anchor = "scandal"
head = "Scandal (Su)"
listed = true
print = "A court bard of 14th level or higher can combine salacious gossip and biting calumny to incite a riot. Each enemy within 30 feet is affected as if by a _[song of discord](ref/spell/song-of-discord)_ for as long as it can hear the performance. A successful Will save (DC 10 + 1/2 the bard's level + the bard's Cha modifier) negates the effect, and that creature is immune to this ability for 24 hours. Scandal is a language-dependent, mind-affecting ability that uses audible components. This performance replaces frightening tune."

[[entry.feature]]
anchor = "heraldic-expertise"
head = "Heraldic Expertise (Ex)"
listed = true
print = "A court bard gains a bonus equal to half his bard level on Diplomacy, Knowledge (history), Knowledge (local), and Knowledge (nobility) checks (minimum +1). Once per day, the court bard can also reroll a check against one of these skills, though he must take the result of the second roll even if it is worse. He can reroll one additional time per day at 5th level and every five levels thereafter. This ability replaces bardic knowledge."

[[entry.feature]]
anchor = "wide-audience"
head = "Wide Audience (Su)"
listed = true
level = 5
print = "At 5th level, a court bard can choose to affect a 60-foot cone instead of a 30-foot radius with bardic performances that affect an area. In addition, for every five levels beyond 5th, the area of such powers is increased by 10 feet (radius) or 20 feet (cone). If the power instead affects multiple creatures, it affects one additional creature than normal for every five levels beyond 5th. This does not affect powers that affect only a single creature. This ability replaces lore master and jack of all trades."

[[entry]]
id = "ref/arc-bard/detective"
hold = "the replaces trade `Inspire courage` is not printed in a feature or in the opening text; the replaces trade `Inspire greatness` is not printed in a feature or in the opening text; the replaces trade `Inspire heroics` is not printed in a feature or in the opening text"

[[entry.feature]]
anchor = "bardic-performance"
head = "Bardic Performance"
listed = true
print = "A detective gains the following types of bardic performance."

[[entry.feature]]
anchor = "careful-teamwork"
head = "Careful Teamwork (Su)"
listed = true
print = "A detective uses performance to keep allies coordinated, alert, and ready for action. All allies within 30 feet gain a +1 bonus on Initiative checks, Perception, and Disable Device checks for 1 hour. They also gain a +1 insight bonus on Reflex saves and to AC against traps and when they are [flat-footed](ref/rule/flat-footed). These bonuses increase by +1 at 5th level and every six levels thereafter. Using this ability requires 3 rounds of continuous performance, and the targets must be able to see and hear the bard throughout the performance. This ability is language-dependent and requires visual and audible components. This performance replaces inspire courage."

[[entry.feature]]
anchor = "true-confession"
head = "True Confession (Su)"
listed = true
level = 9
print = "At 9th level, a detective can use performance to trick a creature into revealing its secrets. Using this ability requires a successful Sense Motive check to see through a Bluff or notice mental compulsion. After 3 continuous rounds of performance, the target must make a Will save (DC 10 + 1/2 the bard's level + the bard's Cha modifier). Success renders the target immune to this power for 24 hours. On a failed save, a liar inadvertently reveals the lie and the truth behind it. A creature under a charm or compulsion reveals the nature of its enchantment and who placed it (if the creature knows) and gains a new saving throw to break free from the enchantment. This ability is language-dependent and requires audible components. Using this power requires only 2 rounds of performance at 15th level, and 1 round of performance at 20th level. This performance replaces inspire greatness."

[[entry.feature]]
anchor = "show-yourselves"
head = "Show Yourselves (Ex)"
listed = true
level = 15
print = "At 15th level, a detective can use performance to compel creatures to reveal themselves when hiding. All enemies within 30 feet must make a Will save (DC 10 + 1/2 the bard's level + the bard's Cha modifier). If they fail, they must cease using Stealth, unlock and open doors between themselves and the detective, and dismiss, suppress, or dispel if necessary magical effects that grant [invisibility](ref/spell/invisibility) or any other form of [concealment](ref/rule/concealment) from the detective. As long as they can hear the performance, affected creatures may not attack or flee until they have eliminated every such effect, though they are freed from this compulsion immediately if attacked. Creatures in the area must make this save each round the bard continues his performance. This ability is language-dependent and requires audible components. This performance replaces inspire heroics."

[[entry.feature]]
anchor = "eye-for-detail"
head = "Eye for Detail (Ex)"
listed = true
print = "A detective gains a bonus equal to half his level on Knowledge (local), Perception, and Sense Motive checks, as well as Diplomacy checks to gather information (minimum +1). This ability replaces bardic knowledge."

[[entry.feature]]
anchor = "arcane-insight"
head = "Arcane Insight (Ex)"
listed = true
level = 2
print = "At 2nd level, a detective can find and disable magical traps, like a rogue's [trapfinding](ref/ability/trapfinding) ability. In addition, he gains a +4 bonus on saving throws made against illusions and a +4 bonus on caster level checks and saving throws to see through disguises and protections against divination (such as _[magic aura](ref/spell/magic-aura)_, _[misdirection](ref/spell/misdirection)_, and _[nondetection](ref/spell/nondetection)_). This ability replaces well-versed."

[[entry.feature]]
anchor = "arcane-investigation"
head = "Arcane Investigation"
listed = true
print = "In addition, a detective's class spell list includes the following: 1st—_[detect chaos](ref/spell/detect-chaos)/[evil](ref/spell/detect-evil)/[law](ref/spell/detect-law)/ [good](ref/spell/detect-good)_; 2nd—_[zone of truth](ref/spell/zone-of-truth)_; 3rd—_[arcane eye](ref/spell/arcane-eye), [speak with dead](ref/spell/speak-with-dead), [speak with plants](ref/spell/speak-with-plants)_; 4th—_[discern lies](ref/spell/discern-lies)_; 5th—_[prying eyes](ref/spell/prying-eyes), [stone tell](ref/spell/stone-tell)_; 6th—_[discern location](ref/spell/discern-location), [find the path](ref/spell/find-the-path), [greater prying eyes](ref/spell/prying-eyes-greater), [moment of prescience](ref/spell/moment-of-prescience)_. A detective may add one of these spells or any divination spell on the bard spell list to his list of spells known at 2nd level and every four levels thereafter. This ability replaces versatile performance."

[[entry]]
id = "ref/arc-bard/magician"
hold = "head not printed: Arcane Bond: Bonded Object; the replaces trade `Dirge of doom` is not printed in a feature or in the opening text; the replaces trade `Frightening tune` is not printed in a feature or in the opening text"

[[entry.feature]]
anchor = "bardic-performance"
head = "Bardic Performance"
listed = true
print = "A magician gains the following types of bardic performance."

[[entry.feature]]
anchor = "dweomercraft"
head = "Dweomercraft (Su)"
listed = true
print = "A magician can use performance to manipulate magical energies. Allies of the magician gain a +1 bonus on caster level checks, [concentration](ref/rule/concentration) checks, and attack rolls with spells and [spell-like abilities](ref/umr/spell-like-abilities). This bonus increases by +1 at 5th level and every six levels thereafter. This ability relies on visual and audible components. It replaces inspire courage."

[[entry.feature]]
anchor = "spell-suppression"
head = "Spell Suppression (Su)"
listed = true
level = 8
print = "At 8th level, a magician can use performance to counter the spells of his foes. Once the bard begins using this performance, he tracks the number of rounds it has been in use. While performing, as an immediate action, he can attempt to counter any spell that he can identify using Spellcraft, so long as that spell's level is equal or less than the total number of rounds he has been performing spell suppression. The attempt to counter the spell is made as if using _[dispel magic](ref/spell/dispel-magic)_, using the bard's level as the caster level. If successful, the bardic performance immediately ends. This ability requires audible components. This performance replaces dirge of doom."

[[entry.feature]]
anchor = "metamagic-mastery"
head = "Metamagic Mastery (Ex)"
listed = true
level = 14
print = "At 14th level, a magician can use performance to apply a metamagic feat to a spell he is about to cast without increasing the casting time. The bard must still expend a higher-level slot to cast this spell. This causes the performance to immediately end. This ability requires audible components. This performance replaces frightening tune."

[[entry.feature]]
anchor = "magical-talent"
head = "Magical Talent (Ex)"
listed = true
print = "A magician gains a bonus equal to [half](ref/misc/fractions-and-rounding) his level on Knowledge (arcana), Spellcraft, and Use Magic Device checks. This ability replaces bardic knowledge."

[[entry.feature]]
anchor = "improved-counterspell"
head = "Improved Counterspell"
listed = true
print = "A magician gains [Improved Counterspell](ref/feat/improved-counterspell) as a bonus feat. This ability replaces countersong."

[[entry.feature]]
anchor = "extended-performance"
head = "Extended Performance (Su)"
listed = true
level = 2
print = "At 2nd level, a magician can extend the duration of bardic performance after he stops concentrating by sacrificing a spell slot as a swift action. The performance effect lingers for 1 extra round per level of the spell. Only one spell may be sacrificed per performance, and performance types that take affect after a specific number of rounds cannot be extended. This ability replaces well-versed."

[[entry.feature]]
anchor = "expanded-repertoire"
head = "Expanded Repertoire (Ex)"
listed = true
level = 2
print = "At 2nd level and every four levels thereafter, a magician can add one spell to his spells known from the spell list of any arcane spellcasting class. The spell must be of a level he can cast. This ability replaces versatile performance."

[[entry.feature]]
anchor = "arcane-bond"
head = "Arcane Bond (Ex)"
listed = true
level = 5
print = "At 5th level, a magician gains the arcane bond ability as a [wizard](ref/class/wizard). He may not choose a familiar or a weapon as a bonded item. This ability replaces lore master."

[[entry.feature]]
anchor = "wand-mastery"
head = "Wand Mastery (Ex)"
listed = true
level = 10
print = "At 10th level, when a magician uses a wand containing a spell on his spell list, he uses his Charisma bonus to set the wand's save DC. At 16th level, when using such a wand, he uses his caster level in place of the wand's caster level. This ability replaces jack of all trades."

