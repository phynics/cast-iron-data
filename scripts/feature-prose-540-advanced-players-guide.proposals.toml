[[entry]]
id = "ref/arc-ranger/shapeshifter"

[[entry.feature]]
anchor = "combat-style-feat"
head = "Combat Style Feat (Ex)"
listed = true
level = 2
print = "At 2nd level, a shapeshifter ranger must choose the natural weapon [combat style](ref/ability/combat-styles)."

[[entry.feature]]
anchor = "shifter-s-blessing"
head = "Shifter's Blessing (Su)"
listed = true
level = 3
print = '''
At 3rd level, the shapeshifter can take on the aspects of a wild creature once per day as a swift action. He can remain in this form for a number of rounds equal to his ranger level + his Wisdom modifier. While in one of his shifter's blessing forms, the ranger gains the shapeshifter subtype.

The shapeshifter must choose one of the following forms. Once this choice is made, it cannot be changed.'''

[[entry.feature]]
anchor = "form-of-the-bear"
head = "Form of the Bear"
listed = true
print = "The ranger's muscles enlarge and tighten, and his facial features become more ursine. While in this form, the ranger gains a +4 enhancement bonus to Strength, but his base speed becomes 20 feet."

[[entry.feature]]
anchor = "form-of-the-cat"
head = "Form of the Cat"
listed = true
print = "The ranger's muscles become lean and defined, and his gait more deliberate and graceful. While in this form, the ranger increases his base speed by 10 feet, and he gains a +4 bonus on Acrobatics and Climb checks."

[[entry.feature]]
anchor = "form-of-the-dragon"
head = "Form of the Dragon"
listed = true
print = "The ranger's skin becomes rough and scaly. While in this form, the ranger gains a +2 natural armor bonus to AC."

[[entry.feature]]
anchor = "form-of-the-eagle"
head = "Form of the Eagle"
listed = true
print = "The ranger's skin stretches, his nose becomes hooked, and his eyes enlarge. While in this form, the ranger gains a +10 bonus on Perception checks."

[[entry.feature]]
anchor = "form-of-the-jackal"
head = "Form of the Jackal"
listed = true
print = "The ranger becomes thin and hyperactive, his movements taking on a nervous spryness. While in this form, the ranger can spend a move action to move up to 1/2 his speed without provoking attacks of opportunity."

[[entry.feature]]
anchor = "form-of-the-otter"
head = "Form of the Otter"
listed = true
print = '''
The ranger's hands and feet grow webs, and his body grows an oily fur that is water resistant. While in this form, the ranger gains a swim speed of 30 feet and a +8 bonus on Swim checks.

At 8th level and again every five levels thereafter, the ranger may select an additional form for his shifter's blessing and may use this ability one additional time per day. This is not a polymorph ability; a ranger with shifter's blessing in one of his shifted forms can be affected by a polymorph ability and retain his bonus and traits gained by the class feature. This ability replaces favored terrain.'''

[[entry.feature]]
anchor = "dual-form-shifter"
head = "Dual Form Shifter (Ex)"
listed = true
level = 12
print = "At 12th level, when the shapeshifter takes on a shifter's blessing form, he can take on a hybrid of two of his forms. He gains the bonuses for both forms. This ability replaces camouflage."

[[entry.feature]]
anchor = "master-shifter"
head = "Master Shifter (Su)"
listed = true
level = 20
print = "At 20th level, the ranger's shifter's blessing forms improve, and he can take on true forms of beasts. The ranger can use dual form shifter with this ability, although he cannot use more than one polymorph effect at any one time. This ability replaces master hunter. The ranger's forms from shifter's blessing improve to the following:"

[[entry.feature]]
anchor = "master-shifter-form-of-the-bear"
head = "Form of the Bear"
listed = true
print = "The ranger's muscles enlarge and tighten, and his facial features become more ursine. While in this form, the ranger gains a +8 enhancement bonus to Strength and he does not suffer any reduction of speed. Alternatively, the ranger can polymorph into the form of a bear as if the caster of _[beast shape IV](ref/spell/beast-shape-4)_."

[[entry.feature]]
anchor = "master-shifter-form-of-the-cat"
head = "Form of the Cat"
listed = true
print = "The ranger's muscles become lean and defined, and his gait more deliberate and graceful. While in this form, the ranger increases his base speed by 20 feet and he gains a +10 bonus on Acrobatics and Climb checks. Alternatively, the ranger can polymorph into the form of a cat of any size as if the caster of _[beast shape IV](ref/spell/beast-shape-4)_."

[[entry.feature]]
anchor = "master-shifter-form-of-the-dragon"
head = "Form of the Dragon"
listed = true
print = "The ranger's skin becomes rough and scaly. While in this form, the ranger gains a +4 natural armor bonus to AC and a fly speed of 30 feet with average maneuverability. Alternately, the ranger can polymorph into the form of a dragon as if the caster of _[form of the dragon I](ref/spell/form-of-the-dragon-1)_."

[[entry.feature]]
anchor = "master-shifter-form-of-the-eagle"
head = "Form of the Eagle"
listed = true
print = "The ranger's skin stretches, his nose becomes hooked, and his eyes enlarge. While in this form, the ranger gains a +10 bonus on Perception checks and a fly speed of 40 feet with good maneuverability. Alternatively, the ranger can polymorph into the form of an eagle or similar raptor as if the caster of _[beast shape IV](ref/spell/beast-shape-4)_."

[[entry.feature]]
anchor = "master-shifter-form-of-the-jackal"
head = "Form of the Jackal"
listed = true
print = "The ranger becomes thin and hyperactive, his movements taking on a nervous spryness. While in this form, the ranger does not provoke attacks of opportunity due to movement. Alternatively, the ranger can polymorph into the form of a jackal or other canine creature as if the caster of _[beast shape IV](ref/spell/beast-shape-4)_."

[[entry.feature]]
anchor = "master-shifter-form-of-the-otter"
head = "Form of the Otter"
listed = true
print = "The ranger's hands and feet grow webs, and his body grows an oily fur that is water resistant. While in this form, the ranger gains a swim speed of 60 feet and a +5 bonus on Swim checks. Alternatively, the ranger can polymorph into the form of an otter or similar river mammal as if the caster of _[beast shape IV](ref/spell/beast-shape-4)_."

[[entry]]
id = "ref/arc-ranger/skirmisher"
hold = "the replaces trade `Spellcasting ability` is not printed in a feature or in the opening text; Hunter's Tricks: the sentence \"This ability replaces the ranger's spells class feature\" names no trade"

[[entry.feature]]
anchor = "hunter-s-tricks"
head = "Hunter's Tricks"
listed = true
level = 5
print = '''
At 5th level, a skirmisher ranger learns the use of hunter's tricks, which typically grant a boon or bonus to the ranger or a nearby ally. At 5th level, the ranger learns one trick, selected from the list below. At 7th level, and every two levels thereafter, he learns another trick. A ranger can use these tricks a total number of times per day equal to 1/2 his ranger level + his Wisdom modifier. Tricks are usually swift actions, but sometimes move or free actions that modify a standard action, usually an attack action. Once a trick is chosen, it can't be retrained. A ranger cannot select an individual trick more than once. This ability replaces the ranger's spells class feature. Skirmishers do not gain any spells or spellcasting ability, do not have a caster level, and cannot use spell trigger and spell completion magic items.

The following is a list of hunter tricks and their effects.'''

[[entry.feature]]
anchor = "aiding-attack"
head = "Aiding Attack (Ex)"
listed = true
print = "The ranger can use this trick as a free action when he hits a creature with an attack. The next ally who makes an attack against the target creature before the start of the ranger's next turn gains a +2 circumstance bonus on that attack roll."

[[entry.feature]]
anchor = "bolster-companion"
head = "Bolster Companion (Ex)"
listed = true
print = "The ranger can use this trick as an immediate action when his animal companion is hit with an attack or a combat maneuver. The companion's AC and combat maneuver defense increase by +4 for the purposes of that attack. If the attack still hits, the animal companion only takes half damage (if any). The animal companion must be able to see and hear the ranger to benefit from this trick."

[[entry.feature]]
anchor = "catfall"
head = "Catfall (Ex)"
listed = true
print = "The ranger can use this trick as an immediate action when he falls 20 or more feet, ignoring the first 20 feet of the fall when calculating the [falling damage](ref/rule/falling). If the ranger takes no damage from the fall, he does not fall prone."

[[entry.feature]]
anchor = "chameleon-step"
head = "Chameleon Step (Ex)"
listed = true
print = "The ranger can move up to twice his speed as a move action. The ranger does not take any penalty on Stealth checks for movement during this move. This move provokes attacks of opportunity as normal."

[[entry.feature]]
anchor = "cunning-pantomime"
head = "Cunning Pantomime (Ex)"
listed = true
print = "As a standard action, the ranger can communicate with a single creature as if using the _[tongues](ref/spell/tongues)_ spell for 10 minutes. Because the communication is slow and lacks subtlety, the ranger suffers a -4 penalty on all Bluff and Diplomacy checks relating to the creature he is communicating with when using this trick."

[[entry.feature]]
anchor = "defensive-bow-stance"
head = "Defensive Bow Stance (Ex)"
listed = true
print = "The ranger can use this trick as a swift action. Until the start of his next turn, his ranged attacks do not provoke attacks of opportunity."

[[entry.feature]]
anchor = "deft-stand"
head = "Deft Stand (Ex)"
listed = true
print = "The ranger can spend a move action to stand up without provoking attacks of opportunity."

[[entry.feature]]
anchor = "distracting-attack"
head = "Distracting Attack (Ex)"
listed = true
print = "The ranger can use this trick as a free action before he makes an attack. If the attack hits, the target takes a -2 penalty on all attack rolls for 1 round."

[[entry.feature]]
anchor = "hateful-attack"
head = "Hateful Attack (Ex)"
listed = true
print = "The ranger can use this trick as a free action when he makes an attack against one of his favored enemies. The ranger doubles the threat range of his weapon for this attack. This does not stack with other abilities that increase a weapon's threat range."

[[entry.feature]]
anchor = "heel"
head = "Heel (Ex)"
listed = true
print = "The ranger can use this trick as an immediate action when his animal companion moves. When the companion moves, the square it starts out in is not considered threatened by any opponent it can see, and therefore visible enemies do not get attacks of opportunity against it when it moves from that square. The companion must end this movement in a square adjacent to the ranger. The animal companion must be able to see and hear the ranger to take this movement."

[[entry.feature]]
anchor = "hobbling-attack"
head = "Hobbling Attack (Ex)"
listed = true
print = "The ranger can use this trick as a free action when he hits with an attack. The target of the attack's land speed is reduced by 1/2 for 1d4 rounds."

[[entry.feature]]
anchor = "quick-climb"
head = "Quick Climb (Ex)"
listed = true
print = "The ranger can climb at his full speed as a move action without penalty."

[[entry.feature]]
anchor = "quick-healing"
head = "Quick Healing (Ex)"
listed = true
print = "As a swift action, the ranger can make a Heal check to administer first aid on an adjacent dying character. Alternatively, the ranger can administer a potion to an unconscious character as a move action."

[[entry.feature]]
anchor = "quick-swim"
head = "Quick Swim (Ex)"
listed = true
print = "The ranger can swim at his full speed as a move action without penalty."

[[entry.feature]]
anchor = "ranger-s-counsel"
head = "Ranger's Counsel (Ex)"
listed = true
print = "As a swift action, the ranger can grant all allies within 30 feet that are within line of sight and can hear him a +2 bonus on skill checks with a single skill of his choice. The ranger must have at least one rank in the chosen skill. This bonus lasts for 1 round."

[[entry.feature]]
anchor = "rattling-strike"
head = "Rattling Strike (Ex)"
listed = true
print = "The ranger can use this trick as a free action before he makes a melee attack. If the attack hits, the target is shaken for 1d4 rounds."

[[entry.feature]]
anchor = "second-chance-strike"
head = "Second Chance Strike (Ex)"
listed = true
print = "When he misses with a melee attack, the ranger may reroll his attack at a -5 penalty. Using this ability is an immediate action."

[[entry.feature]]
anchor = "sic-em"
head = "Sic 'Em (Ex)"
listed = true
print = "The ranger can use this trick as a swift action. His animal companion makes one melee attack against an adjacent creature. The animal companion must be able to see and hear the ranger to make this attack."

[[entry.feature]]
anchor = "skill-sage"
head = "Skill Sage (Ex)"
listed = true
print = "As a free action, the ranger can roll twice on any one skill check and take the better result. He must have at least 1 rank in that skill to use this ability."

[[entry.feature]]
anchor = "stag-s-leap"
head = "Stag's Leap (Ex)"
listed = true
print = "As a free action, the ranger can attempt a running jump without moving 10 feet before the jump."

[[entry.feature]]
anchor = "surprise-shift"
head = "Surprise Shift (Ex)"
listed = true
print = "The ranger can move 5 feet as a swift action. This movement does not provoke attacks of opportunity and does not count as a 5-foot step."

[[entry.feature]]
anchor = "tangling-attack"
head = "Tangling Attack (Ex)"
listed = true
print = "The ranger can use this attack as a free action when he makes an attack. If the attack hits, the target is entangled for 1 round."

[[entry.feature]]
anchor = "trick-shot"
head = "Trick Shot (Ex)"
listed = true
print = "As a standard action, the ranger can make a ranged attack that ignores [concealment](ref/rule/concealment) (but not total concealment), soft [cover](ref/rule/cover), and partial cover."

[[entry.feature]]
anchor = "uncanny-senses"
head = "Uncanny Senses (Ex)"
listed = true
print = "As an immediate action, the ranger gains a +10 insight bonus on Perception checks for 1 round."

[[entry.feature]]
anchor = "upending-strike"
head = "Upending Strike (Ex)"
listed = true
print = "The ranger can use this trick as a free action just before he makes a melee attack. If the attack hits, he may make a free [trip](ref/rule/trip) combat maneuver against the target."

[[entry.feature]]
anchor = "vengeance-strike"
head = "Vengeance Strike (Ex)"
listed = true
print = "The ranger can use this trick as an immediate action when an enemy adjacent to him hits an ally with a melee or ranged attack. The ranger can make a single melee attack at his highest base attack bonus against the creature who attacked his ally."

[[entry]]
id = "ref/arc-ranger/urban-ranger"

[[entry.feature]]
anchor = "urban-ranger"
head = "Urban Ranger"
listed = true
level = 1
print = "At 1st level, an urban ranger adds Disable Device and Knowledge (local) to his list of class skills and removes Handle Animal and Knowledge (nature) from his list of class skills."

[[entry.feature]]
anchor = "favored-community"
head = "Favored Community (Ex)"
listed = true
level = 3
print = '''
At 3rd level, the urban ranger forms a bond with a community. While inside the limits of this community, he gains a +2 bonus on initiative checks and Knowledge (local), Perception, Stealth, and Survival skill checks. An urban ranger traveling through his favored community leaves no trail and cannot be tracked (although he may leave a trail if he so desires).

At 8th level, and every five levels thereafter, an urban ranger may select an additional favored community. In addition, at each such interval, the skill bonus and initiative bonus in any one favored community (including the one just selected, if so desired) increases by +2.

For the purposes of this ability, a community is any settlement consisting of 100 or more individuals. The community may be larger than this minimum. Outlying farms, fields, and houses are not considered part of a community. This ability replaces favored terrain.'''

[[entry.feature]]
anchor = "trapfinding"
head = "Trapfinding (Ex)"
listed = true
level = 3
print = "At 3rd level, an urban ranger can find and disable traps, as the rogue class feature of the [same name](ref/ability/trapfinding). This ability replaces endurance."

[[entry.feature]]
anchor = "push-through"
head = "Push Through (Ex)"
listed = true
level = 7
print = "At 7th level, an urban ranger is never slowed by [difficult terrain](ref/rule/terrain-and-obstacles) in his favored communities. In addition, he can move through the space occupied by local citizens as if they were allies. This does not apply to creatures intent on harming the ranger. Areas that are enchanted or magically manipulated to impede motion, however, still affect him. This replaces woodland stride."

[[entry.feature]]
anchor = "blend-in"
head = "Blend In (Ex)"
listed = true
print = "An urban ranger of 12th level or higher can use his Stealth bonus in place of a Disguise skill check in any of his favored communities. This disguise does not take an action to don. He must make a check whenever someone attempts to pick him out from the local citizens. If his check is successful, he blends into the crowd. While not invisible, enemies do not notice his presence and take no actions against him unless they are taking actions against the local citizens in general. This replaces camouflage."

[[entry.feature]]
anchor = "invisibility-trick"
head = "Invisibility Trick (Sp)"
listed = true
level = 17
print = "At 17th level, the urban ranger can cast _[greater invisibility](ref/spell/invisibility-greater)_ on himself as a wizard of his ranger level as a swift action. He can use this spell-like ability a number of times per day equal to his Wisdom modifier (minimum 1). This ability replaces hide in plain sight."

[[entry]]
id = "ref/arc-rogue/acrobat"

[[entry.feature]]
anchor = "expert-acrobat"
head = "Expert Acrobat (Ex)"
listed = true
level = 1
print = "At 1st level, an acrobat does not suffer any armor check penalties on Acrobatics, Climb, Fly, Sleight of Hand, or Stealth skill checks while wearing light armor. When she is not wearing armor, she gains a +2 competency bonus on Acrobatics and Fly skill checks. This ability replaces trapfinding."

[[entry.feature]]
anchor = "second-chance"
head = "Second Chance (Ex)"
listed = true
level = 3
print = "At 3rd level, an acrobat can reroll any Acrobatics, Climb, or Fly skill check she has just made. This reroll is made at a -5 penalty. She must take the second result, even if it is worse. An acrobat can use this ability only once on any given skill check. She can use this ability once per day at 3rd level, plus one additional time per day for every 3 levels beyond 3rd. This ability replaces trap sense."

[[entry.feature]]
anchor = "rogue-talents"
head = "Rogue Talents"
listed = false
print = "The following rogue talents complement the acrobat archetype: expert leaper, ledge walker, nimble climber, peerless maneuver, rogue crawl, and stand up."

[[entry.feature]]
anchor = "advanced-talents"
head = "Advanced Talents"
listed = false
print = "The following advanced rogue talents complement the acrobat archetype: defensive roll, fast getaway, fast tumble, and improved evasion."
