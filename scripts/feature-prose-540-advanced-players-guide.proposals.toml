listed = true
level = 4
print = "At 4th level, a cave druid gains a +2 bonus on saves against exceptional, supernatural, and [spell-like abilities](ref/umr/spell-like-abilities) of oozes and aberrations. This ability replaces resist nature's lure."

[[entry.feature]]
anchor = "wild-shape"
head = "Wild Shape (Su)"
listed = true
print = "A cave druid gains this ability at 6th level, except that her effective druid level for this ability is equal to her druid level - 2. She cannot use wild shape to adopt a plant form. At 10th level, the cave druid can assume the form of a Small or Medium ooze as if using _[beast shape III](ref/spell/beast-shape-3)_, and at 12th level that of a Tiny or Large ooze as if using _[beast shape IV](ref/spell/beast-shape-4)_ (treating the ooze as if it were a magical beast without a natural armor bonus). When in ooze form, the cave druid has no discernible anatomy and is immune to poison, sneak attacks, and critical hits."

