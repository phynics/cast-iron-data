head = "Arcane Bond: Bonded Object"
listed = false
print = ""

[[entry]]
id = "ref/arc-bard/sandman"
hold = "the replaces trade `Inspire courage` is not printed in a feature or in the opening text; the replaces trade `Suggestion` is not printed in a feature or in the opening text; the replaces trade `Inspire heroics` is not printed in a feature or in the opening text; the replaces trade `Mass suggestion` is not printed in a feature or in the opening text; the replaces trade `Deadly performance` is not printed in a feature or in the opening text"

[[entry.feature]]
anchor = "bardic-performance"
head = "Bardic Performance"
listed = true
print = "A sandman gains the following types of bardic performance."

[[entry.feature]]
anchor = "stealspell"
head = "Stealspell (Su)"
listed = true
print = "A sandman can use performance to steal spells from his foes and add them to his list of spells known. Once the performance is started, the bard can steal a prepared spell or a spell known from another creature with a touch attack as a standard action. The target receives a Will save (DC 10 + 1/2 the bard's level + the bard's Cha bonus) to negate the effect. The sandman may choose a spell to steal, but if the target does not possess the spell, the bardic performance immediately ends. Otherwise the spell stolen is random, but it is always of the highest level that the bard can cast, if possible. The target loses the prepared spell or spell known and the sandman adds it to his list of spells known for as long as the performance continues, after which it reverts to the original recipient. While stolen, the bard can cast the spell using his available spell slots. This use does not consume the stolen spell. If the bard steals another spell while a spell is stolen, the previous spell immediately reverts to its original owner. This ability requires visual components. This performance replaces inspire courage."

[[entry.feature]]
anchor = "slumber-song"
head = "Slumber Song (Sp)"
listed = true
level = 6
print = "At 6th level, a sandman can use his performance to cause a creature he has already fascinated to fall asleep (as _[deep slumber](ref/spell/deep-slumber)_, but with no HD limit). Otherwise, this ability functions like [suggestion](ref/performance/suggestion). This performance replaces suggestion."

[[entry.feature]]
anchor = "dramatic-subtext"
head = "Dramatic Subtext (Su)"
listed = true
level = 9
print = "At 9th level, a sandman can use bardic performance to cast spells without obvious visual or audible components while retaining the spell's normal effects. Observers must succeed at a Perception check opposed by a sandman's Sleight of Hand check to notice that the sandman is the source of the spellcasting (though spellcasting still provokes attacks of opportunity). The bard must use this performance for at least 2 rounds before casting a spell; otherwise he is automatically detected and the performance ends. This ability replaces inspire greatness."

[[entry.feature]]
anchor = "greater-stealspell"
head = "Greater Stealspell (Su)"
listed = true
print = "A sandman's stealspell power improves at 15th level. When a target fails a save against his stealspell performance, the sandman discovers its [spell resistance](ref/rule/spell-resistance) (if any) and all spells it has prepared or knows. He can then choose which spell to steal. The sandman may forgo stealing a spell and instead reduce the target's SR by an amount equal to half his bard level and gain that amount of [spell resistance](ref/rule/spell-resistance) for as long as he continues performing. If he steals additional spell resistance, it stacks with previously stolen SR. If he steals a spell or ceases performing, the spell resistance immediately reverts back to its owner. This performance replaces inspire heroics."

[[entry.feature]]
anchor = "mass-slumber-song"
head = "Mass Slumber Song (Sp)"
listed = true
level = 18
print = "At 18th level, a sandman can use slumber song to affect any number of fascinated creatures within 30 feet. Otherwise, this ability functions like _[mass suggestion](ref/performance/mass-suggestion)_. This performance replaces _mass suggestion_."

[[entry.feature]]
anchor = "spell-catching"
head = "Spell Catching (Su)"
listed = true
level = 20
print = "At 20th level, a sandman who saves against a spell or [spell-like ability](ref/umr/spell-like-abilities) that targets only him (not including area spells) may use bardic performance as an immediate action. He must attempt a caster level check (DC 10 + the spell's original caster level). If it succeeds, the sandman can absorb the spell effect without harm and immediately recast that spell (using the original caster's level and save DC) or any spell he knows of that level or lower. Using this ability consumes a number of rounds of bardic performance equal to the spell's level, even if the check fails. This performance replaces deadly performance."

[[entry.feature]]
anchor = "master-of-deception"
head = "Master of Deception (Ex)"
listed = true
print = "A sandman gains a bonus equal to half his level on Bluff, Sleight of Hand, and Stealth checks. He may also disarm magical traps with Disable Device as a rogue's [trapfinding](ref/ability/trapfinding) ability. This ability replaces bardic knowledge."

[[entry.feature]]
anchor = "sneakspell"
head = "Sneakspell (Ex)"
listed = true
level = 2
print = "At 2nd level, a sandman adds +1 to the save DC of spells and bardic performance against opponents who are denied their Dex bonus. This increases to +2 at 10th level and +3 at 18th level. In addition, at 6th level he gains a +2 bonus on caster level checks to overcome [spell resistance](ref/rule/spell-resistance) against such foes, and this bonus increases to +4 at 14th level. This ability replaces versatile performance."

[[entry.feature]]
anchor = "trap-sense"
head = "Trap Sense (Ex)"
listed = true
level = 3
print = "At 3rd level, a sandman gains a +1 bonus on Reflex saves against traps and a +1 dodge bonus to AC against traps. These bonuses increase by +1 every three levels after 3rd. This ability replaces inspire competence."

[[entry.feature]]
anchor = "sneak-attack"
head = "Sneak Attack (Ex)"
listed = true
level = 5
print = "At 5th level, a sandman inflicts +1d6 points of damage against targets within 30 feet that he flanks or that are denied their Dex bonus to AC against him. This damage increases by +1d6 every five levels after 5th. This ability replaces lore master."

[[entry]]
id = "ref/arc-bard/savage-skald"
hold = "the replaces trade `Fascinate` is not printed in a feature or in the opening text; the replaces trade `Suggestion` is not printed in a feature or in the opening text; the replaces trade `Jack of all trades` is not printed in a feature or in the opening text; the replaces trade `Soothing performance` is not printed in a feature or in the opening text; the replaces trade `Mass suggestion` is not printed in a feature or in the opening text"

[[entry.feature]]
anchor = "bardic-performance"
head = "Bardic Performance"
listed = true
print = "A savage skald gains the following types of bardic performance."

[[entry.feature]]
anchor = "inspiring-blow"
head = "Inspiring Blow (Su)"
listed = true
print = "A savage skald roars his war-cries with each telling blow. When he confirms a critical hit, he can start this performance as an immediate action (ending any other performances). He gains [temporary hit points](ref/rule/temporary-hit-points) equal to his Charisma modifier (if positive), and all allies within 30 feet gain a +1 morale bonus on their next attack roll prior to the start of his next turn. These temporary hit points remain until the bard ends his performance. This performance replaces fascinate."

[[entry.feature]]
anchor = "incite-rage"
head = "Incite Rage (Su)"
listed = true
level = 6
print = "At 6th level, a savage skald can induce a furious [rage](ref/spell/rage) in one creature within 30 feet. This effect functions as a _rage_ spell that lasts as long as the target can hear the bard's performance; however, unwilling creatures can be affected if they fail a Will save (DC 10 + 1/2 the bard's level + the bard's Cha modifier). Success renders the target immune to this power for 24 hours. The bard cannot target himself with this ability. If the target has the rage class feature, it can instead immediately rage and stay in this rage without consuming rounds of rage per day as long as the bard continues performing. This mind-affecting effect requires audible components. This performance replaces suggestion."

[[entry.feature]]
anchor = "song-of-the-fallen"
head = "Song of the Fallen (Sp)"
listed = true
level = 10
print = "At 10th level, a savage skald can duplicate the effect of a _[horn of Valhalla](ref/magic-wondrous/horn-of-valhalla)_. This effect requires 10 continuous rounds of performance and summons barbarians as a silver horn at 10th level, as a brass horn at 13th level, as a bronze horn at 16th level, and as an iron horn at 19th level. The warriors remain only as long as the bard continues his performance. This ability requires audible components. This performance replaces jack of all trades."

[[entry.feature]]
anchor = "berserkergang"
head = "Berserkergang (Ex)"
listed = true
level = 12
print = "At 12th level, a savage skald can inspire a rapturous battle trance that suppresses pain, stunning, and fear effects for one creature, plus one additional creature per three levels after 12th. Affected creatures also gain DR 5/— (DR 10/— against nonlethal damage); this benefit stacks with the [damage reduction](ref/rule/damage-reduction) class ability of barbarians. This mind-affecting ability requires audible components. This performance replaces soothing performance."

[[entry.feature]]
anchor = "battle-song"
head = "Battle Song (Su)"
listed = true
level = 18
print = "At 18th level, a savage skald can affect all allies within 30 feet when using performance to incite rage. This performance replaces mass suggestion."

[[entry]]
id = "ref/arc-bard/sea-singer"
hold = "the replaces trade `Countersong` is not printed in a feature or in the opening text; the replaces trade `Inspire competence` is not printed in a feature or in the opening text; the replaces trade `Suggestion` is not printed in a feature or in the opening text; the replaces trade `Mass suggestion` is not printed in a feature or in the opening text"

[[entry.feature]]
anchor = "bardic-performance"
head = "Bardic Performance"
listed = true
print = "A sea singer gains the following types of bardic performance."

[[entry.feature]]
anchor = "sea-shanty"
head = "Sea Shanty (Su)"
listed = true
print = "A sea singer learns to counter seasickness and exhaustion during long sea voyages. Each round of a sea shanty, he makes a Perform skill check. Allies within 30 feet (including the sea singer) may use his Perform check in place of a saving throw against becoming exhausted, fatigued, nauseated, or sickened; if already under such an effect, a new save is allowed each round of the sea shanty, using the bard's Perform check for the save. A sea shanty has no effect on instantaneous effects or effects that do not allow saves. This ability requires audible components. This performance replaces countersong."

[[entry.feature]]
anchor = "still-water"
head = "Still Water (Su)"
listed = true
level = 3
print = "At 3rd level, a sea singer can use performance to calm rough waters within 30 feet, reducing the DC for Profession (sailor) and Swim checks, as well as for Acrobatics and Climb checks aboard ship, by an amount equal to the bard's level (to a minimum of DC 10) for as long he continues to perform. He can extend this duration to 1 hour by playing for 10 consecutive rounds. This ability requires audible components. This performance replaces inspire competence."

[[entry.feature]]
anchor = "whistle-the-wind"
head = "Whistle the Wind (Su)"
listed = true
print = "A sea singer of 6th level or higher can use performance to create a _[gust of wind](ref/spell/gust-of-wind)_. This wind lasts for as long as he continues his performance. He can extend this duration to 1 minute by playing for 5 consecutive rounds. This performance replaces suggestion."

[[entry.feature]]
anchor = "call-the-storm"
head = "Call the Storm (Su)"
listed = true
level = 18
print = "At 18th level, a sea singer can use performance to duplicate _[control water](ref/spell/control-water), [control weather](ref/spell/control-weather), [control winds](ref/spell/control-winds),_ or _[storm of vengeance](ref/spell/storm-of-vengeance)_, using his bard level as the caster level. Using this ability requires 1 round of continuous performance per level of the spell (as if he were a [druid](ref/class/druid)). These effects continue for as long as the bard continues performing (the effects of _[control weather](ref/spell/control-weather)_ happen immediately), but not longer than the spell's normal duration. This performance replaces mass suggestion."

[[entry.feature]]
anchor = "world-traveler"
head = "World Traveler (Ex)"
listed = true
print = "A sea singer gains a bonus equal to [half](ref/misc/fractions-and-rounding) his bard level on Knowledge (geography), Knowledge (local), Knowledge (nature), and Linguistics checks. He can reroll a check against one of these skills, but must take the result of the second roll even if it is worse. He can reroll one additional time per day at 5th level and every five levels thereafter. This ability replaces bardic knowledge."

[[entry.feature]]
anchor = "familiar"
head = "Familiar"
listed = true
level = 2
print = "At 2nd level, a sea singer acquires an exotic pet—a [monkey](ref/monster/familiar-monkey) or parrot (treat as [raven](ref/monster/familiar-raven))—that gains abilities as a wizard's [familiar](ref/ability/familiars), using the sea singer's bard level as his wizard level. This ability replaces versatile performance."

[[entry.feature]]
anchor = "sea-legs"
head = "Sea Legs (Ex)"
listed = true
level = 2
print = "At 2nd level, a sea singer gains a +4 bonus on saving throws against air and water effects and effects that would cause the sea singer to slip, trip, or otherwise be knocked [prone](ref/rule/prone). He gains a +2 bonus to CMD against grapple, overrun, and trip. This ability replaces well-versed."

[[entry]]
id = "ref/arc-bard/street-performer"
hold = "the replaces trade `Inspire courage` is not printed in a feature or in the opening text; the replaces trade `Inspire competence` is not printed in a feature or in the opening text; the replaces trade `Inspire greatness` is not printed in a feature or in the opening text; the replaces trade `Inspire heroics` is not printed in a feature or in the opening text"

[[entry.feature]]
anchor = "bardic-performance"
head = "Bardic Performance"
listed = true
print = "A street performer gains the following types of bardic performance."

[[entry.feature]]
anchor = "disappearing-act"
head = "Disappearing Act (Su)"
listed = true
print = "A street performer can use performance to divert attention from an ally. All creatures within 30 feet that fail a Will save (DC 10 + 1/2 the bard's level + the bard's Cha modifier) treat one creature chosen by the bard as if it were _[invisible](ref/rule/invisible)_. This performance affects one additional creature at 5th level and every 6 levels thereafter. If the targets take any action that would cause them to become visible, they become visible to everyone. The bard cannot use this ability on himself. This ability is a mind-affecting effect that requires visual components. This performance replaces inspire courage."

[[entry.feature]]
anchor = "harmless-performer"
head = "Harmless Performer (Su)"
listed = true
level = 3
print = "At 3rd level, a street performer can use performance to appear meek and unworthy of being attacked. While using this performance, whenever an enemy targets the street performer, the enemy must succeed at a Will save (DC 10 + 1/2 the bard's level + the bard's Cha bonus) or be unable to attack the bard this round, as per _[sanctuary](ref/spell/sanctuary)_. The enemy loses the attack that targeted the bard, but may spend additional attacks targeting other creatures. If the opponent was targeting the street performer with a spell, it must succeed at a [concentration](ref/rule/concentration) check at the same DC or lose the spell. If this check succeeds, it may target another creature with the spell instead. This mind-affecting ability requires audible or visual components. This performance replaces inspire competence."

[[entry.feature]]
anchor = "madcap-prank"
head = "Madcap Prank (Su)"
listed = true
level = 9
print = "At 9th level, a street performer can use performance to discomfit a target within 30 feet, causing its clothing to become tangled, its headgear to fall down over its eyes, or even causing it to slip and fall or otherwise be made to appear a fool. The target must make a Reflex save (DC 10 + 1/2 the bard's level + the bard's Cha modifier) each round that it hears or sees the performance, or it takes one of the following random effects each round: 1—[blinded](ref/misc/blinded), 2—[dazzled](ref/misc/dazzled), 3—[deafened](ref/misc/deafened), 4—[entangled](ref/rule/entangled), 5—fall [prone](ref/rule/prone), 6—[nauseated](ref/misc/nauseated). Each effect lasts 1 round. This performance replaces inspire greatness."

[[entry.feature]]
anchor = "slip-through-the-crowd"
head = "Slip through the Crowd (Su)"
listed = true
level = 15
print = "At 15th level, a street performer's disappearing act enables affected creatures to move through crowd squares and enemy-occupied squares without impediment. Affected creatures are treated as if having _[greater invisibility](ref/spell/invisibility-greater)_, but enemies gain a new saving throw to notice them each time they are attacked. This performance replaces inspire heroics."

[[entry.feature]]
anchor = "gladhanding"
head = "Gladhanding"
listed = true
print = "A street performer earns double the normal amount of money from [Perform](ref/skill/perform-any) checks. As a standard action, he may use a Bluff check in place of a Diplomacy check to improve a creature's attitude for 1 minute, after which its attitude becomes one step worse than originally. This ability replaces countersong."

[[entry.feature]]
anchor = "streetwise"
head = "Streetwise"
listed = true
print = "A street performer gains a bonus equal to half his level on Bluff, Disguise, Knowledge (local), and Sleight of Hand checks, Diplomacy or Intimidate checks made to influence crowds, and Diplomacy checks to gather information (minimum +1). This replaces bardic knowledge."

[[entry.feature]]
anchor = "quick-change"
head = "Quick Change (Ex)"
listed = true
level = 5
print = "At 5th level, a street performer can don a disguise as a standard action by taking a -5 penalty on his check. He can take 10 on Bluff and Disguise checks and use Bluff to create a diversion to hide as a swift action. He can take 20 on a Bluff or Disguise check once per day, plus one time per six levels beyond 5th. This ability replaces lore master."

[[entry]]
id = "ref/arc-druid/aquatic-druid"
hold = "the alters trade `Wild empathy` is not printed in a feature or in the opening text; the alters trade `Wild shape` is not printed in a feature or in the opening text"

[[entry.feature]]
anchor = "wild-empathy"
head = "Wild Empathy (Ex)"
listed = true
print = "An aquatic druid's wild empathy functions only on creatures that have a swim speed or the aquatic or water subtype; however, she can improve the attitude of any such creature with Intelligence 2 or less regardless of type, including mindless creatures."

[[entry.feature]]
anchor = "aquatic-adaptation"
head = "Aquatic Adaptation (Ex)"
listed = true
level = 2
print = "At 2nd level, an aquatic druid gains an insight bonus on Initiative checks and Knowledge (geography), Perception, Stealth, Survival, and Swim checks equal to 1/2 her druid level in aquatic terrain, and she cannot be tracked such environments. This ability replaces woodland stride."

[[entry.feature]]
anchor = "natural-swimmer"
head = "Natural Swimmer (Ex)"
listed = true
level = 3
print = "At 3rd level, an aquatic druid gains a swim speed equal to half her land speed. This ability replaces trackless step."

[[entry.feature]]
anchor = "resist-ocean-s-fury"
head = "Resist Ocean's Fury (Ex)"
listed = true
level = 4
print = "At 4th level, an aquatic druid gains a +4 bonus on saving throws against spells of the water type or the exceptional or supernatural abilities of creatures with the aquatic or water subtype. This ability replaces resist nature's lure."

[[entry.feature]]
anchor = "wild-shape"
head = "Wild Shape (Su)"
listed = true
print = "An aquatic druid gains this ability at 6th level, except that her effective druid level for the ability is equal to her druid level - 2."

[[entry.feature]]
anchor = "seaborn"
head = "Seaborn (Ex)"
listed = true
level = 9
print = "At 9th level, an [aquatic](ref/subtype/aquatic) druid gains the aquatic subtype, the [amphibious](ref/umr/amphibious) trait, and a swim speed equal to her land speed. She also can endure cold climate effects as if using _[endure elements](ref/spell/endure-elements)_. This ability replaces venom immunity."

[[entry.feature]]
anchor = "deep-diver"
head = "Deep Diver (Ex)"
listed = true
level = 13
print = "At 13th level, an aquatic druid gains DR/slashing or piercing equal to 1/2 her level. This [damage reduction](ref/rule/damage-reduction) also applies against spells and [spell-like abilities](ref/umr/spell-like-abilities) that inflict damage by grappling or crushing (e.g., _[black tentacles](ref/spell/black-tentacles)_, _[crushing hand](ref/spell/crushing-hand)_). She never takes [pressure damage](ref/rule/water-dangers) from deep water. This ability replaces a thousand faces."

[[entry]]
id = "ref/arc-druid/arctic-druid"
hold = "the alters trade `Wild shape` is not printed in a feature or in the opening text"

[[entry.feature]]
anchor = "arctic-native"
head = "Arctic Native (Ex)"
listed = true
level = 2
print = "At 2nd level, an arctic druid gains a bonus on Initiative checks and Knowledge (geography), Perception, Stealth, and Survival checks equal to 1/2 her druid level in cold or icy terrain, and she cannot be tracked in cold or icy terrain. This ability replaces woodland stride."

[[entry.feature]]
anchor = "icewalking"
head = "Icewalking (Ex)"
listed = true
level = 3
print = "At 3rd level, an arctic druid suffers no penalty to speed or on Acrobatics, Climb, or Stealth checks in snowy or icy terrain or weather conditions and can walk across snow crusts or thin ice without breaking through. This ability replaces trackless step."

[[entry.feature]]
anchor = "arctic-endurance"
head = "Arctic Endurance (Ex)"
listed = true
level = 4
print = "At 4th level, an arctic druid ignores the effects of a cold climate as if using _[endure elements](ref/spell/endure-elements)_. She is also immune to being dazzled. This ability replaces resist nature's lure."

[[entry.feature]]
anchor = "wild-shape"
head = "Wild Shape (Su)"
listed = true
print = "An arctic druid gains this ability at 6th level, except that her effective druid level for this ability is equal to her druid level - 2."

[[entry.feature]]
anchor = "snowcaster"
head = "Snowcaster (Su)"
listed = true
level = 9
print = "At 9th level, an arctic druid can see normally in _ice storm_, _sleet storm_, or similar natural snowstorms. In addition, she can prepare any druid spell with the fire subtype as a cold spell, with an identical effect but inflicting cold damage instead of fire damage. This ability replaces venom immunity."

[[entry.feature]]
anchor = "flurry-form"
head = "Flurry Form (Ex)"
listed = true
level = 13
print = "At 13th level, an arctic druid can assume the form of a swirling column of snow equivalent to _[gaseous form](ref/spell/gaseous-form)_ at will. While in this form, she gains a circumstance bonus on Stealth checks made in cold terrain equal to her druid level. This ability replaces a thousand faces."

[[entry]]
id = "ref/arc-druid/bear-shaman"
hold = "the replaces trade `Woodland stride` is not printed in a feature or in the opening text; the replaces trade `Wild shape` is not printed in a feature or in the opening text; the replaces trade `Venom immunity` is not printed in a feature or in the opening text; the alters trade `Nature bond` is not printed in a feature or in the opening text; the alters trade `Wild empathy` is not printed in a feature or in the opening text"

[[entry.feature]]
anchor = "nature-bond"
head = "Nature Bond"
listed = true
print = "A [bear](ref/companion/bear) shaman who chooses an [animal](ref/domain/animal) companion must select a bear. If choosing a domain, the bear shaman must choose from the Animal, [Earth](ref/domain/earth), [Protection](ref/domain/protection), and Strength domains."

[[entry.feature]]
anchor = "wild-empathy"
head = "Wild Empathy (Ex)"
listed = true
print = "A bear shaman can use wild empathy with bears and wolverines as a full-round action with a +4 bonus."

[[entry.feature]]
anchor = "totem-transformation"
head = "Totem Transformation (Su)"
listed = true
level = 2
print = "At 2nd level, a bear shaman may adopt an aspect of the bear while retaining her normal form. She gains one of the following bonuses: movement (+10 enhancement bonus to land speed, +4 racial bonus on Swim checks), senses ([low-light vision](ref/rule/low-light-vision), [scent](ref/umr/scent)), toughness (+2 natural armor bonus to AC, [Endurance](ref/feat/endurance) feat), or [natural weapons](ref/umr/natural-attacks) (bite \\[1d6\\] and 2 claws \\[1d4\\] for a Medium shaman, +2 to CMB on grapple checks). While using totem transformation, the bear shaman may speak normally and can cast _[speak with animals](ref/spell/speak-with-animals)_ (mammals only) at will. Using this ability is a standard action at 2nd level, a move action at 7th level, and a swift action at 12th level. The bear shaman can use this ability for a number of minutes per day equal to her druid level. These minutes do not need to be consecutive, but they must be used in 1-minute increments. This is a polymorph effect and cannot be used while the druid is using another polymorph effect, such as wild shape."

[[entry.feature]]
anchor = "totemic-summons"
head = "Totemic Summons (Su)"
listed = true
level = 5
print = "At 5th level, a bear shaman may cast _[summon nature's ally](ref/spell/summon-natures-ally)_ as a standard action when summoning bears, and summoned bears gain [temporary hit points](ref/rule/temporary-hit-points) equal to her druid level. She can apply the [young](ref/template/young) template to any bear to reduce the level of the summoning spell required by one. She can also increase the level of summoning required by one in order to apply either the [advanced](ref/template/advanced) or the [giant](ref/template/giant) template, or increase it by two to apply both the advanced and giant templates. This ability replaces a thousand faces."

[[entry.feature]]
anchor = "wild-shape"
head = "Wild Shape (Su)"
listed = true
level = 6
print = "At 6th level, a bear shaman's wild shape ability functions at her druid level - 2. If she takes on the form of a bear, she instead uses her druid level + 2."

[[entry.feature]]
anchor = "bonus-feat"
head = "Bonus Feat"
listed = false
print = "At 9th level and every 4 levels thereafter, a bear shaman gains one of the following bonus feats: [Diehard](ref/feat/diehard), Endurance, [Great Fortitude](ref/feat/great-fortitude), [Improved Great Fortitude](ref/feat/improved-great-fortitude), [Toughness](ref/feat/toughness). She must meet the prerequisites for these bonus feats. This ability replaces venom immunity."

[[entry]]
id = "ref/arc-druid/blight-druid"
hold = "the alters trade `Nature bond` is not printed in a feature or in the opening text"

[[entry.feature]]
anchor = "nature-bond"
head = "Nature Bond (Ex)"
listed = true
print = "A blight druid may not bond with an animal companion, but may either call a [familiar](ref/sidekick/familiar) as a [wizard](ref/class/wizard) of her druid level or select from the Darkness, Death, and [Destruction](ref/domain/destruction) domains in addition to those normally available."

[[entry.feature]]
anchor = "vermin-empathy"
head = "Vermin Empathy (Su)"
listed = true
print = "A blight druid can improve the attitude of vermin as a normal druid can with animals. Vermin have a starting attitude of unfriendly. The blight druid can also improve the attitude of animals and mindless undead creatures that were formerly animals, but she takes a -4 penalty on the check unless the animal or undead has a disease special attack. This ability replaces wild empathy."

[[entry.feature]]
anchor = "miasma"
head = "Miasma (Ex)"
listed = true
level = 5
print = "Starting at 5th level, if a blight druid is adjacent to a creature at the beginning of its turn, the creature must succeed at a Fortitude save with a DC of 10 + 1/2 the druid's level + the druid's Wisdom modifier or become [sickened](ref/misc/sickened) for 1 round. A creature of the animal, fey, or plant type that fails its save is [nauseated](ref/misc/nauseated) for 1 round and sickened for 1 minute thereafter. If the creature makes its save, it is immune to this effect for 24 hours, as are creatures immune to disease. This ability replaces trackless step and resist nature's lure."

[[entry.feature]]
anchor = "blightblooded"
head = "Blightblooded (Ex)"
listed = true
level = 9
print = "At 9th level, a blight druid gains immunity to all diseases, including natural and supernatural diseases. She also becomes immune to effects that would cause her to become sickened or nauseated. This ability replaces venom immunity."

[[entry.feature]]
anchor = "plaguebearer"
head = "Plaguebearer (Su)"
listed = true
level = 13
print = "Starting at 13th level, any creature that strikes a blight druid with a touch attack, unarmed strike, or natural weapon must succeed at a Fortitude save with a DC of 10 + 1/2 the druid's level + the druid's Wisdom modifier or contract a disease, as the _[contagion](ref/spell/contagion)_ spell. If the creature makes its save, it is immune to this effect for 24 hours. This ability replaces a thousand faces."

[[entry]]
