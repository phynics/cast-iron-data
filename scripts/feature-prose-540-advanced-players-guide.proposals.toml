[[entry.feature]]
anchor = "desert-endurance"
head = "Desert Endurance (Ex)"
listed = true
level = 4
print = "At 4th level, a desert druid ignores the effects of a hot climate as if using _[endure elements](ref/spell/endure-elements)_. She also has a reduced need to eat and drink, as if wearing a _[ring of sustenance](ref/magic-ring/ring-of-sustenance)_ (though normal sleep is still required). This ability replaces resist nature's lure."

[[entry.feature]]
anchor = "wild-shape"
head = "Wild Shape (Su)"
listed = true
print = "A desert druid gains this ability at 6th level, except that her effective druid level for the ability is equal to her druid level - 2. A desert druid cannot use wild shape to adopt a plant form. At 10th level she can assume the form of a Small or Medium vermin, at 12th level a Tiny or Large vermin, and at 14th level a Diminutive or Huge vermin. This effect functions as _[beast shape IV](ref/spell/beast-shape-4)_ (treating the vermin as an animal to determine its ability and natural armor modifiers)."

[[entry.feature]]
