listed = true
level = 2
print = "At 2nd level, a mountain druid gains a bonus on Initiative checks and Climb, Knowledge (geography), Perception, Stealth, and Survival checks equal to [half](ref/misc/fractions-and-rounding) her druid level in mountainous terrain, and she cannot be tracked in such an environment. This ability replaces woodland stride."

[[entry.feature]]
anchor = "sure-footed"
head = "Sure-Footed (Ex)"
listed = true
level = 3
print = "At 3rd level, a mountain druid suffers no penalty to speed or on Acrobatics or Stealth checks when walking across steep slopes, rubble, or scree. This ability replaces trackless step."

[[entry.feature]]
anchor = "spire-walker"
head = "Spire Walker (Ex)"
listed = true
level = 4
print = "At 4th level, a mountain druid does not lose her Dexterity bonus when climbing. A mountain druid is immune to [altitude sickness](ref/rule/mountain-travel) and ignores the effects of a cold climate as if under the effects of _[endure elements](ref/spell/endure-elements)_. This ability replaces resist nature's lure."

[[entry.feature]]
anchor = "wild-shape"
head = "Wild Shape (Su)"
listed = true
print = "A mountain druid gains this ability at 6th level, except that her effective druid level for the ability is equal to her druid level - 2. A mountain druid cannot use wild shape to adopt a plant form. However, at 12th level she can assume the form of a Large giant as if using _[giant form I](ref/spell/giant-form-1)_. At 16th level, she may assume the form of a Huge giant as if using _[giant form II](ref/spell/giant-form-2)_."

[[entry.feature]]
anchor = "mountain-stance"
head = "Mountain Stance (Ex)"
listed = true
level = 9
print = "At 9th level, a mountain druid gains immunity to petrification and receives a +4 bonus on saving throws or to CMD to resist any attempt to push, pull, bull rush, or drag her, or to resist any other effect that would physically move her from her position (e.g., _[repel wood](ref/spell/repel-wood), [reverse gravity](ref/spell/reverse-gravity),_ or being blown away by high winds). This does not protect her against being tripped, grappled, or overrun. This ability replaces venom immunity."

[[entry.feature]]
anchor = "mountain-stone"
head = "Mountain Stone (Ex)"
listed = true
level = 13
print = "At 13th level, a mountain druid can transform her body into a weathered stone outcrop and back at will. This effect functions as _[statue](ref/spell/statue)_. This ability replaces a thousand faces."

