entry = "ref/arc-fighter/titan-fighter"
anchor = "incredible-heft"
note = "hand-written from print (Giant Hunter's Handbook p. 21): the sentence runs around the art in the right column and the text layer sets its last words out of order (\"reduced by another (minimum)This ability replaces 1 0. armor training.\"); the text is the printed paragraph."
text = '''
At 3rd level, a titan fighter becomes more skilled at wielding weapons intended for creatures one size category larger than himself. The penalty on attack rolls for using such weapons is reduced by 1, including when using oversized two-handed weapons. At 7th level and every 4 levels thereafter, this penalty is reduced by another 1 (minimum 0). This ability replaces armor training.
'''
