print = "At 12th level, if an unarmed fighter succeeds on a [drag](ref/rule/drag) maneuver, he can attempt a trip maneuver against the same target as a swift action that does not provoke attacks of opportunity. At 15th level, he may do so after a successful grapple check. This ability replaces the 12th-level bonus feat."
import_trades = ["The 12th-level bonus feat"]

[[entry.feature]]
anchor = "eye-gouge"
