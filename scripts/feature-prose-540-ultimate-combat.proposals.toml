[[entry]]
id = "ref/arc-fighter/cad"
opening = ["In combat, most fighters have some sort of code of honor. Some believe that one should not kick enemies when they are down, or should limit use of other such dirty tricks to the most dire of circumstances. The cad places no such limitations on himself. Battles are for winning, and anything that gives the cad the upper hand against his enemies is a legitimate tactic. No trick is too treacherous if it leads to victory."]

[[entry.feature]]
anchor = "weapon-and-armor-proficiency"
head = "Weapon and Armor Proficiency"
listed = false
print = "A cad is not proficient with medium armor, heavy armor, or tower shields."

[[entry.feature]]
anchor = "skills"
head = "Skills"
listed = true
print = "Acrobatics (Dex), Bluff (Cha), Escape Artist (Dex), Sleight of Hand (Dex), and Stealth (Dex) are class skills for a cad."

[[entry.feature]]
anchor = "dirty-maneuvers"
head = "Dirty Maneuvers (Ex)"
listed = true
level = 2
print = "At 2nd level, a cad becomes skilled at deceiving and discomfiting his opponents. The cad gains a +1 bonus on [disarm](ref/rule/disarm), [dirty trick](ref/rule/dirty-trick), and [steal](ref/rule/steal) combat maneuver checks. The cad also gains a +1 bonus to CMD when attacked with the disarm, dirty trick, and steal combat maneuvers. These bonuses increase by 1 for every four levels after 2nd (to a maximum of +5 at 18th level). This ability replaces bravery."
import_trades = ["Bravery"]

[[entry.feature]]
anchor = "catch-off-guard"
head = "Catch Off-Guard"
listed = true
level = 3
print = "At 3rd level, the cad gains the [Catch Off-Guard](ref/feat/catch-off-guard) feat. This ability replaces armor training 1."
import_trades = ["Armor training 1"]

[[entry.feature]]
anchor = "payback"
head = "Payback (Ex)"
listed = true
level = 5
print = "At 5th level, a cad gains a +1 bonus on attack and damage rolls against any creature that has attacked the cad since the beginning of his last turn. This bonus increases by +1 for every four levels beyond 5th (to a maximum of +4 at 17th level). This ability replaces weapon training 1, 3, and 4."
import_trades = ["Weapon training 1", "3", "4"]

[[entry.feature]]
anchor = "deadly-surprise"
head = "Deadly Surprise (Ex)"
listed = true
level = 7
print = "At 7th level, when a cad hits an opponent that is denied its Dexterity bonus to AC against him with a weapon or unarmed attack, he may attempt a dirty trick combat maneuver as an immediate action as part of the attack. This ability replaces armor training 2."
import_trades = ["Armor training 2"]

[[entry.feature]]
anchor = "razor-sharp-chair-leg"
head = "Razor-Sharp Chair Leg (Ex)"
listed = true
level = 9
print = "At 9th level, as a swift action, a cad may alter the type of damage dealt by an [improvised weapon](ref/misc/improvised-weapons) to bludgeoning, piercing, or slashing damage. In addition, the cad has a critical threat range of 19–20/×2 with any improvised melee weapon. This ability replaces weapon training 2."
import_trades = ["Weapon training 2"]

[[entry.feature]]
anchor = "craven-combatant"
head = "Craven Combatant (Ex)"
listed = true
level = 11
print = "At 11th level, when [fighting defensively](ref/misc/fighting-defensively) or using [Combat Expertise](ref/feat/combat-expertise) or [total defense](ref/misc/total-defense), a cad cannot be [flanked](ref/rule/flanking) except by a rogue or ninja whose level is four or more higher than the cad's fighter level. This ability replaces armor training 3."
import_trades = ["Armor training 3"]

[[entry.feature]]
anchor = "sweeping-prank"
head = "Sweeping Prank (Ex)"
listed = true
level = 13
print = '''
At 13th level, as a standard action, a cad can use a dirty trick maneuver against any two adjacent opponents that he can reach, making a separate combat maneuver check against each opponent. He must use the same dirty trick maneuver against each opponent.

At 17th level, the cad can use this ability as a full-round action to attempt a dirty trick maneuver against a number of enemies equal to 2 + his Dexterity bonus (if any). This ability replaces weapon training 3 and 4.'''
import_trades = ["Weapon training 3", "4"]

[[entry.feature]]
anchor = "treacherous-blow"
head = "Treacherous Blow (Ex)"
listed = true
level = 15
print = "At 15th level, when a cad confirms a critical hit, he can attempt a dirty trick combat maneuver as part of that attack as an immediate action. This ability replaces armor training 4."
import_trades = ["Armor training 4"]

[[entry.feature]]
anchor = "ultimate-payback"
head = "Ultimate Payback (Ex)"
listed = true
level = 20
print = "At 20th level, any critical threats a cad makes against an opponent that has attacked him since the beginning of his last turn are automatically confirmed. This ability replaces weapon mastery."
import_trades = ["Weapon mastery"]

[[entry]]
id = "ref/arc-fighter/dragoon"
opening = ["These gallant lancers serve in the vanguard of many armies or as knights-errant. They are born leaders and masters of the mounted charge."]

[[entry.feature]]
anchor = "weapon-and-armor-proficiency"
head = "Weapon and Armor Proficiency"
listed = false
print = "A dragoon is not proficient with tower shields."

[[entry.feature]]
anchor = "skilled-rider"
head = "Skilled Rider (Ex)"
listed = true
level = 1
print = "At 1st level, a dragoon gains both the [Mounted Combat](ref/feat/mounted-combat) and [Skill Focus](ref/feat/skill-focus) (Ride) feats as bonus feats. This ability replaces the 1st-level fighter bonus combat feat."
import_trades = ["The 1st-level fighter bonus combat feat"]

[[entry.feature]]
anchor = "spear-training"
head = "Spear Training (Ex)"
listed = true
level = 5
print = "At 5th level, a dragoon must select weapon training with the [spear group](ref/ability/weapon-groups). The dragoon's weapon training bonus with spears improves by +1 on attack rolls and +2 on damage rolls for every four levels beyond 5th (to a maximum of +4 on attack rolls and +8 on damage rolls at 17th level). The dragoon does not gain weapon training in any other groups as he increases in level."
import_trades = ["Weapon training"]

[[entry.feature]]
anchor = "spinning-lance"
head = "Spinning Lance (Ex)"
listed = true
level = 7
print = "At 7th level, a dragoon may alternate attacks with the piercing head of his [lance](ref/eq-weapon/lance) with reach, or with the butt end (treat as a [club](ref/eq-weapon/club)) against adjacent targets. Unlike a double weapon, the masterwork quality and magical special abilities apply to both ends of the lance, except for those weapon special abilities that apply only to edged weapons. This ability replaces armor training 2."
import_trades = ["Armor training 2"]

[[entry.feature]]
anchor = "banner"
head = "Banner (Ex)"
listed = true
level = 9
print = "At 9th level, a dragoon may attach a banner to his lance. This is identical to the [cavalier](ref/class/cavalier) class feature. The bonuses provided by the dragoon's banner increase by +1 for every five levels beyond 9th (to a maximum of +3 at 19th level). Cavalier levels stack with his dragoon level for determining the effect of his banner, and he can take the better banner progression. This ability replaces weapon training 2, 3, and 4."
import_trades = ["Weapon training 2", "3", "4"]

[[entry.feature]]
anchor = "piercing-lance"
head = "Piercing Lance (Ex)"
listed = true
level = 11
print = "At 11th level, as a standard action or as part of a [charge](ref/rule/charge), a dragoon attacking a mounted opponent can make two attacks, one against the mount and the other against the rider, using his highest base attack bonus. Furthermore, if the mount is hit and its rider attempts to negate the hit with the Mounted Combat feat, the dragoon's attack roll is considered 4 higher when calculating the DC of the Ride check to negate the hit. This ability replaces armor training 3."
import_trades = ["Armor training 3"]

[[entry.feature]]
anchor = "leaping-lance"
head = "Leaping Lance (Ex)"
listed = true
level = 15
print = "At 15th level, a dragoon and his mount suffer no armor check penalty on Acrobatics checks while mounted. When charging, a dragoon may jump from his mount toward his target. If he jumps 10 feet, his charge modifiers on attack rolls and to AC are doubled and he is still considered mounted for lance damage, mounted combat feats, and so on. This ability replaces armor training 4."
import_trades = ["Armor training 4"]

[[entry.feature]]
anchor = "weapon-mastery"
head = "Weapon Mastery"
listed = true
print = "The dragoon must select the lance for this ability."
import_trades = ["Weapon mastery"]

[[entry]]
id = "ref/arc-fighter/gladiator"
hold = "the replaces trade `Proficiency with heavy armor` is not printed in a sentence, and no listed feature of that name prints it; the replaces trade `tower shields` is not printed in a sentence, and no listed feature of that name prints it"
opening = ["Most fighters battle out of necessity, with each battle a contest of life and death. Some, however, fight for glory and for the adulation of the crowd. The gladiator is both a cunning warrior and a consummate performer, knowing life and death are balanced not only on a sword's edge, but also on the cheers or jeers of the crowd."]

[[entry.feature]]
anchor = "skills"
head = "Skills"
listed = true
print = "A gladiator gains Perform (act, comedy, and dance) (Cha) as class skills."

[[entry.feature]]
anchor = "weapon-and-armor-proficiency"
head = "Weapon and Armor Proficiency"
listed = false
print = "A gladiator is not proficient with heavy armor or tower shields. Instead he gains the [Performance Weapon Mastery](ref/feat/performance-weapon-mastery) feat at 1st level as a bonus feat. This bonus feat is in addition to the bonus feat a fighter gains at 1st level. Furthermore, a gladiator using [piecemeal armor](ref/rule/piecemeal-armor) is considered to be wearing a suit of armor as long as he wearing two or three armor pieces, gaining the +1 to armor bonus but still taking the +5% chance of arcane spell failure if the pieces are mixed."
import_trades = ["Proficiency with heavy armor", "tower shields"]

[[entry.feature]]
anchor = "bonus-feats"
head = "Bonus Feats"
listed = false
print = "A gladiator may choose to take combat or performance feats as bonus feats."

[[entry.feature]]
anchor = "fame"
head = "Fame (Ex)"
listed = true
level = 2
print = "At 2nd level, when a gladiator begins a [performance combat](ref/rule/performance-combat), he always starts with at least 1 victory point. If he already has victory points, he gains 1 extra victory point. At 10th level, the gladiator starts out with at least 2 victory points. If he already has victory points, he gains 2 extra victory points. This ability replaces bravery."
import_trades = ["Bravery"]

[[entry]]
id = "ref/arc-fighter/tactician"
hold = "the alters trade `Proficiency with heavy armor` is not printed in a sentence, and no listed feature of that name prints it; the alters trade `tower shields` is not printed in a sentence, and no listed feature of that name prints it"
opening = ["While many fighters focus on the fundamentals of melee and ranged combat, there are those who are trained to view the bigger picture on the battlefield. These fighters use their training and tactical acumen to overcome challenges that would overwhelm mere brute strength and skill at arms."]

[[entry.feature]]
anchor = "weapon-and-armor-proficiency"
head = "Weapon and Armor Proficiency"
listed = false
print = "A tactician is not proficient with heavy armor or tower shields."

[[entry.feature]]
anchor = "strategic-training"
head = "Strategic Training (Ex)"
listed = true
level = 1
print = "A tactician gains 4 skill points + a number of skill points equal to his Intelligence modifier at each level, instead of the normal 2 skill points + Intelligence modifier at each level. Furthermore, [Diplomacy](ref/skill/diplomacy) (Cha), [Knowledge (geography)](ref/skill/knowledge-geography) (Int), [Knowledge (nobility)](ref/skill/knowledge-nobility) (Int), [Linguistics](ref/skill/linguistics) (Int), and [Sense Motive](ref/skill/sense-motive) (Wis) are all class skills for the tactician. This ability replaces the bonus fighter combat feat gained at 1st level."
import_trades = ["The bonus fighter combat feat gained at 1st level"]

[[entry.feature]]
anchor = "bonus-feats"
head = "Bonus Feats"
listed = false
print = "A tactician may choose [Skill Focus](ref/feat/skill-focus) or any teamwork feat, in addition to combat feats, as bonus feats."

[[entry.feature]]
anchor = "tactical-awareness"
head = "Tactical Awareness (Ex)"
listed = true
level = 2
print = "At 2nd level, a tactician gains a +1 bonus on initiative checks. This bonus increases by +1 for every four levels after 2nd level (to a maximum of +5 at 18th level). This ability replaces bravery."
import_trades = ["Bravery"]

[[entry.feature]]
anchor = "tactician"
head = "Tactician (Ex)"
listed = true
level = 5
print = "At 5th level, a tactician gains this ability as the [cavalier](ref/class/cavalier) class feature. He may use this ability once per day at 5th level, plus one additional time for every five levels after 5th (to a maximum of four times at 20th level). If the tactician also has cavalier levels, these levels stack for determining the number of uses per day, and he can take the better progression. This ability replaces weapon training 1."
import_trades = ["Weapon training 1"]

[[entry.feature]]
anchor = "cooperative-combatant"
head = "Cooperative Combatant (Ex)"
listed = true
level = 11
print = "At 11th level, when a tactician uses the [aid another](ref/rule/aid-another-2) special attack, he may affect one additional ally per point of Intelligence bonus. For each ally that a tactician aids, he can pick whether to grant that ally the +2 bonus on its next attack against the opponent or the +2 bonus to AC against the opponent's next attack on that ally, and can grant different allies different bonuses. This ability replaces armor training 3."
import_trades = ["Armor training 3"]

[[entry.feature]]
anchor = "battle-insight"
head = "Battle Insight (Ex)"
listed = true
level = 15
print = "At 15th level, as a swift action, a tactician can grant his Intelligence modifier as an insight bonus on the attack rolls made by a single ally within line of sight that can both see and hear the tactician. That ally gains the bonus until the end of the tactician's next turn. The tactician can use this ability a number of times per day equal to 3 + his Intelligence modifier. This ability replaces armor training 4."
import_trades = ["Armor training 4"]

[[entry]]
