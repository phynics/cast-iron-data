[[entry]]
id = "ref/arc-gunslinger/mysterious-stranger"
opening = ["Gunslingers use a potent mixture of common sense and manual dexterity in order to control the fickle power of their weapons. But a few rare gunslingers seem to accomplish their chosen tasks purely through willpower and an unwillingness to ever give up. These mysterious strangers use their force of personality to keep going when the chips are down, often moving on from a region as soon as they accomplish their goals—hence the name."]

[[entry.feature]]
anchor = "grit"
head = "Grit (Ex)"
listed = true
print = "A mysterious stranger is a force to be reckoned with. Instead of using her Wisdom to determine the number of grit points she gains at the start of each day, she uses Charisma. This ability works in all other ways like the gunslinger's grit class feature."
import_trades = ["Grit"]

[[entry.feature]]
anchor = "deeds"
head = "Deeds"
