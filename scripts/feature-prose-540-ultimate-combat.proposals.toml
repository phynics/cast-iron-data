level = 5
print = "At 5th level, an unarmed fighter gains a +1 bonus on attack and damage rolls with weapons in the monk and natural [weapon groups](ref/ability/weapon-groups), improving by +1 for every four levels beyond 5th (to a maximum of +4 at 17th level). This ability replaces weapon training 1, 2, 3, and 4."
import_trades = ["Weapon training 1", "2", "3", "4"]

[[entry.feature]]
anchor = "clever-wrestler"
head = "Clever Wrestler (Ex)"
listed = true
level = 7
print = "At 7th level, an unarmed fighter takes no penalties to Dexterity or on attack rolls while grappled, and retains his Dexterity bonus to AC while pinning an opponent. The unarmed fighter can make attacks of opportunity even when grappled and even against creatures attempting to [grapple](ref/rule/grapple) him if the opponent has the [Improved Grapple](ref/feat/improved-grapple) feat or the [grab](ref/umr/grab) ability. This ability replaces armor training 2."
