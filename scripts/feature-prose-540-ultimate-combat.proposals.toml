# Texts of the entries that feature-prose-540.py has not converted yet. Generated: never edit by hand
# except the `edit` text of a feature (status `edit` in the review TSV).

[[entry]]
id = "ref/arc-alchemist/beastmorph"
hold = "checker: [fields] trades = \"replaces: Poison resistance +2, +4, and +6; replaces: poison immunity\" disagrees with the trade sentences of the feature `greater-beastform-mutagen` = \"replaces: poison resistance +2, +4, and +6, as well as poison immunity\" (line 55)"
opening = ["Beastmorphs study the anatomy of monsters, learning how they achieve their strange powers. They use their knowledge to duplicate these abilities, but at the cost of taking on inhuman shapes when they use mutagens."]

[[entry.feature]]
anchor = "beastform-mutagen"
head = "Beastform Mutagen"
listed = true
level = 3
print = "At 3rd level, a beastmorph's mutagen causes him to take on animalistic features— whether those of an animal, a magical beast, an animal-like humanoid (such as a lizardfolk), or a monstrous humanoid. For example, when the beastmorph uses his mutagen, he may gain a furry muzzle and pointed ears like a werewolf, scaly skin like a lizardfolk or sahuagin, or compound eyes and mandibles like a giant insect. The beastmorph also gains his choice of one of the abilities listed in the _[alter self](ref/spell/alter-self)_ spell, which persists as long as the mutagen. He may select a different ability each time he creates a mutagen. This ability replaces swift alchemy."
import_trades = ["Swift alchemy"]

[[entry.feature]]
anchor = "improved-beastform-mutagen"
head = "Improved Beastform Mutagen"
listed = true
level = 6
print = "At 6th level, a beastmorph's mutagen grants him additional abilities and options. The alchemist gains his choice of two of the abilities listed in the _[beast shape I](ref/spell/beast-shape-1)_ spell, which persist as long as the mutagen. He may select two different abilities each time he creates a mutagen. This ability replaces swift poisoning."
import_trades = ["Swift poisoning"]

[[entry.feature]]
anchor = "greater-beastform-mutagen"
head = "Greater Beastform Mutagen"
listed = true
level = 10
print = "At 10th level, a beastmorph's mutagen grants him three of the abilities listed in the _[beast shape II](ref/spell/beast-shape-2)_ spell, which persist as long as the mutagen. He may select three different abilities each time he creates a mutagen. This ability replaces poison resistance +2, +4, and +6, as well as poison immunity."
import_trades = ["Poison resistance +2", "+4", "+6", "poison immunity"]

[[entry.feature]]
anchor = "grand-beastform-mutagen"
head = "Grand Beastform Mutagen"
listed = true
level = 14
print = "At 14th level, a beastmorph's mutagen grants him four of the abilities listed in the _[beast shape III](ref/spell/beast-shape-3)_ spell, which persist as long as the mutagen. He may select four different abilities each time he creates a mutagen. This ability replaces persistent mutagen."
import_trades = ["Persistent mutagen"]

[[entry.feature]]
anchor = "discoveries"
head = "Discoveries"
listed = false
print = "The following discoveries complement the beastmorph archetype: [feral mutagen](ref/discovery/feral-mutagen), [grand mutagen](ref/discovery/grand-mutagen), [greater mutagen](ref/discovery/greater-mutagen), [infuse mutagen](ref/discovery/infuse-mutagen), [mummification](ref/discovery/mummification), [spontaneous healing](ref/discovery/spontaneous-healing), [tentacle](ref/discovery/tentacle), and [wings](ref/discovery/wings)."

[[entry]]
id = "ref/arc-barbarian/true-primitive"
hold = "the alters trade `The barbarian's armor and weapon proficiencies` is not printed in a sentence, and no listed feature of that name prints it"
opening = ["Isolated and xenophobic tribes that dwell in areas untouched by civilization often see anything from cities and organized settlements as strange, dangerous, and decadent. They gain power from their truly primitive nature; their bodies and spirits are hardened by the wild and untainted existence far from the pathetic softness of so-called civilization. Even when forced to mingle with civilization, the true primitive stays apart in both traditions and trappings."]

[[entry.feature]]
anchor = "weapon-and-armor-proficiency"
head = "Weapon and Armor Proficiency"
listed = false
print = "A true primitive is proficient with [hide armor](ref/eq-armor/hide) and armors made from [bone](ref/eq-material/bone) (see page 146). A true primitive is also proficient with bone shields and the following weapons: [battleaxe](ref/eq-weapon/battleaxe), [blowgun](ref/eq-weapon/blowgun), [club](ref/eq-weapon/club), [greatclub](ref/eq-weapon/greatclub), [handaxe](ref/eq-weapon/handaxe), [longspear](ref/eq-weapon/longspear), [shortspear](ref/eq-weapon/shortspear), [sling](ref/eq-weapon/sling), and [spear](ref/eq-weapon/spear)."
import_trades = ["The barbarian's armor", "weapon proficiencies"]

[[entry.feature]]
anchor = "illiteracy"
head = "Illiteracy"
listed = true
print = "A true primitive cannot read or write, and her superstition about such things leads her to refuse to ever learn to read or write, even if she multiclasses into other classes."

[[entry.feature]]
anchor = "favored-terrain"
head = "Favored Terrain (Ex)"
listed = true
level = 1
print = "A true primitive has a [favored terrain](ref/ability/favored-terrain) representing her native homeland. This ability functions as the ranger class feature, and the true primitive's bonuses in that terrain improve by +2 at 5th level and every five levels thereafter. However, she does not gain any additional favored terrains. This ability replaces fast movement."
import_trades = ["Fast movement"]

[[entry.feature]]
anchor = "trophy-fetish"
head = "Trophy Fetish (Ex)"
listed = true
print = "A true primitive collects teeth, bones, hair, and other trophies from vanquished enemies, representing their power and strength. At 3rd level, a true primitive can attach a trophy fetish to one of the traditional true primitive weapons listed above. When wielding that weapon, the true primitive gains a +1 morale bonus on damage rolls. Furthermore, if that weapon has the [fragile](ref/misc/fragile) property, once per day, the true primitive can ignore the effects of a single natural 1 roll. A trophy fetish can also be attached to a suit of hide or bone armor, granting the true primitive a +1 morale bonus on saving throws. Furthermore, if that armor has the fragile property, once per day, the true primitive can chose not to have the armor break on the confirmation of a critical hit made against her. Every five levels beyond 3rd, a true primitive can use an additional trophy fetish. Multiple trophy fetishes can be attached to the same armor or weapon; their effects stack. A trophy fetish can be sundered ([hardness](ref/umr/hardness) 5, 1 hit point) but is not damaged by area attacks or attacks that do not specifically target it. It has no effect if attached to other types of weapons or armor. This ability replaces trap sense."
import_trades = ["Trap sense"]

[[entry.feature]]
anchor = "rage-powers"
head = "Rage Powers"
listed = false
print = "The following rage powers complement the true primitive archetype: [animal fury](ref/ragepower/animal-fury), [eater of magic](ref/ragepower/eater-of-magic), [ghost rager](ref/ragepower/ghost-rager), [low-light vision](ref/ragepower/low-light-vision), [night vision](ref/ragepower/night-vision), [primal scent](ref/ragepower/primal-scent), [scent](ref/ragepower/scent), [spell sunder](ref/ragepower/spell-sunder), [sunder enchantment](ref/ragepower/sunder-enchantment), [superstition](ref/ragepower/superstition), and [witch hunter](ref/ragepower/witch-hunter)."

[[entry]]
id = "ref/arc-bard/dervish-dancer"
hold = "the alters trade `Bardic performance` is not printed in a sentence, and no listed feature of that name prints it; Battle Dance: the sentence \"This ability replaces bardic performance\" names no trade"
opening = ["Not all bards inspire others with their performances. Dervish dancers enter a near-mystical trance that allows them to push their bodies beyond normal limits."]

[[entry.feature]]
anchor = "weapon-and-armor-proficiency"
head = "Weapon and Armor Proficiency"
listed = false
print = "Dervish dancers gain weapon proficiency with the [scimitar](ref/eq-weapon/scimitar) and [kukri](ref/eq-weapon/kukri). This ability replaces their proficiency with the rapier and whip."
import_trades = ["Proficiency with the rapier", "whip"]

[[entry.feature]]
anchor = "battle-dance"
head = "Battle Dance"
listed = true
print = '''
A dervish dancer is trained in the use of the Perform skill, especially dance, to create magical effects on himself. This works like bardic performance, except the dervish dancer only affects himself, and does not need to be able to see or hear his own performance. Battle dancing is treated as bardic performance for the purposes of feats, abilities, effects, and the like that affect bardic performance, except that battle dancing does not benefit from the [Lingering Performance](ref/feat/lingering-performance) feat or any other ability that allows a bardic performance to grant bonuses after it has ended. Battle dancing benefits apply only when the bard is wearing light or no armor. Like bardic performance, it cannot be maintained at the same time as other performance abilities.

Starting a battle dance is a move action, but it can be maintained each round as a free action. Changing a battle dance from one effect to another requires the dervish dancer to stop the previous performance and start the new one as a move action. Like a bard, a dervish dancer's performance ends immediately if he is killed, paralyzed, stunned, knocked unconscious, or otherwise prevented from taking a free action each round. A dervish dancer cannot perform more than one battle dance at a time. At 10th level, a dervish dancer can start a battle dance as a swift action instead of a move action.

Dervish dancers gain the inspire courage, inspire greatness, and inspire heroics bardic performance types as battle dances, but these only provide benefit to the dervish dancer himself. This ability replaces bardic performance.'''
import_trades = ["Bardic performance"]

[[entry.feature]]
anchor = "rain-of-blows"
head = "Rain of Blows (Su)"
listed = true
level = 6
print = "At 6th level, a dervish dancer can speed up his attacks. When making a [full attack](ref/rule/full-attack) action, he may make one extra attack with any weapon he is holding, as though under the effects of a _[haste](ref/spell/haste)_ spell. He also gains a +1 bonus on attack rolls and a +1 dodge bonus to AC and on Reflex saves. At 9th level, and every three bard levels thereafter, these bonuses increase by +1, to a maximum of +5 at 18th level. These bonuses do not stack with the _[haste](ref/spell/haste)_ spell. This ability replaces suggestion and mass suggestion."
import_trades = ["Suggestion", "mass suggestion"]

[[entry.feature]]
anchor = "razor-s-kiss"
head = "Razor's Kiss (Su)"
listed = true
level = 8
print = "At 8th level, a dervish dancer can use his battle dance to improve his weapons' critical range. All attacks he makes with manufactured weapons are treated as though he had the [Improved Critical](ref/feat/improved-critical) feat. Natural weapons and spells are not affected. This ability replaces dirge of doom."
import_trades = ["Dirge of doom"]

[[entry.feature]]
anchor = "leaf-on-the-wind"
head = "Leaf on the Wind (Su)"
listed = true
level = 14
print = '''
At 14th level, a dervish dancer can use his battle dance to evade attacks with unearthly grace and to shake off the effects of his wounds. Unlike other battle dances, leaf on the wind requires a standard action each round to start or maintain the performance. Each round it is maintained, including the first, the dervish dancer

gains a +6 dodge bonus to Armor Class and on

Reflex saves. If wounded, he heals 1 hit point

of damage per bard level. This ability

replaces frightening performance.'''
import_trades = ["Frightening performance"]

[[entry.feature]]
anchor = "fleet"
head = "Fleet (Su)"
listed = true
print = '''
While performing a

battle dance, a dervish dancer

gains a +10 enhancement bonus

to his land speed. This bonus

increases by 5 feet for every

four bard levels gained after 1st

level, to a maximum of +30 feet

at 19th level. This ability replaces

bardic knowledge and lore master.'''
import_trades = ["Bardic knowledge", "lore master"]

[[entry.feature]]
anchor = "versatile-dance"
head = "Versatile Dance (Ex)"
listed = true
level = 2
print = '''
At 2nd level, a dervish dancer

gains a bonus equal to [half](ref/misc/fractions-and-rounding) his level on Perform

(dance) checks. He can use his bonus for his Perform

(dance) skill in place of his bonus for Acrobatics. This

ability replaces versatile performance.'''
import_trades = ["Versatile performance"]

[[entry.feature]]
anchor = "dance-of-fury"
head = "Dance of Fury (Su)"
listed = true
level = 12
print = '''
At 12th level, a dervish dancer

can attack more than once as he moves while

performing a battle dance. He can combine a full-

attack action with a single move, taking the attacks

at any point during his movement, but must move

at least 5 feet between each attack. This movement

provokes attacks of opportunity as normal. This

ability replaces soothing performance.'''
import_trades = ["Soothing performance"]

[[entry.feature]]
anchor = "battle-fury"
head = "Battle Fury (Su)"
listed = true
level = 20
print = '''
At 20th level, the

dervish dancer can unleash a whirlwind

of blows while performing a battle dance.

As a full-round action, he can take a single

move action and unleash a single attack

at his highest bonus against each target

within his reach during any point of

his move, up to a maximum number of

attacks equal to the dervish dancer's

character level. This movement

provokes attacks of opportunity

as normal, and replaces

deadly performance.'''
import_trades = ["Deadly performance"]

[[entry]]
id = "ref/arc-cavalier/gendarme"
hold = "checker: [fields] trades = \"replaces: Tactician; replaces: greater tactician; replaces: master tactician; replaces: cavalier bonus feats\" disagrees with the trade sentences of the text outside any feature = \"replaces: tactician, greater tactician, and master tactician,; alters: the standard cavalier's select"
opening = ["The gendarme cares less for the finer points of tactical precision than he does for the exhilaration of the charge: the rush of wind through the visor of his helmet, the feel of his couched lance, the satisfying shriek of armor giving way before his weapon's force as the point drives past metal into his foes."]

[[entry.feature]]
anchor = "bonus-feats"
head = "Bonus Feats"
listed = false
print = "A gendarme trains to be a mounted terror, almost to the exclusion of all other abilities. He gains bonus feats at 1st level, 5th level, and then every three levels thereafter, but must select these bonus feats from the following list: [Improved Bull Rush](ref/feat/improved-bull-rush), [Mounted Combat](ref/feat/mounted-combat), [Power Attack](ref/feat/power-attack), [Ride-By Attack](ref/feat/ride-by-attack), [Spirited Charge](ref/feat/spirited-charge), [Spring Attack](ref/feat/spring-attack), and [Unseat](ref/feat/unseat). If the gendarme has already selected all of the listed feats, then he may select his bonus feats from those feats listed as combat feats. This ability replaces tactician, greater tactician, and master tactician, and alters the standard cavalier's selection of bonus feats."
import_trades = ["Tactician", "greater tactician", "master tactician", "cavalier bonus feats"]

[[entry.feature]]
anchor = "transfixing-charge"
head = "Transfixing Charge (Ex)"
listed = true
level = 20
print = "At 20th level, a gendarme represents the epitome of mounted combat. Whenever he makes a [charge](ref/rule/charge) attack while mounted, he deals triple the normal damage (quadruple if using a [lance](ref/eq-weapon/lance)); this damage includes all increases from the Spirited Charge feat and from the use of a lance. In addition, if the gendarme confirms a critical hit on a charge attack while mounted, the attack deals maximum damage for the weapon wielded. Additional damage from weapon properties, magic effects, precision-based bonuses, or other increases are rolled normally. This ability replaces supreme charge."
import_trades = ["Supreme charge"]

[[entry]]
id = "ref/arc-cleric/evangelist"
hold = "the replaces trade `The 1st-, 9th-, and 15th-level channel energy abilities` is not printed in a sentence, and no listed feature of that name prints it"
opening = ["The evangelist is the voice of her religion in the world. Where others nurture the faith among believers, an evangelist proclaims the coming glory of her deific patron and issues the clarion call to all around to heed the truth, or obey the call to war and crusade against the enemies of the church."]

[[entry.feature]]
anchor = "single-minded"
head = "Single-Minded"
listed = true
print = "An evangelist focuses her skills and learning on proclamation rather than the fine details of the church's deeper mysteries or martial training. Thus, she may select only one domain and does not gain Medium Armor Proficiency or Shield Proficiency."

[[entry.feature]]
anchor = "public-speaker"
head = "Public Speaker"
listed = true
print = "An evangelist gains [Perform](ref/skill/perform-any) as a class skill. In addition, she is trained to project her voice with great skill and effect; the DC to hear her speak in difficult conditions is reduced by an amount equal to her class level plus her Charisma modifier (minimum 0)."

[[entry.feature]]
anchor = "sermonic-performance"
head = "Sermonic Performance"
listed = true
print = "An evangelist gains the ability to deliver a select number of supernatural and spell-like performances through the force and power of her divinely inspired preaching and exhortation. This ability is similar in all respects to bardic performance as used by a bard of the same level (including interactions with feats, spells, and prestige classes), using Perform (oratory) as the evangelist's performance skill. However, an evangelist gains only the following types of bardic performance: [countersong](ref/performance/countersong), [fascinate](ref/performance/fascinate), and [inspire courage](ref/performance/inspire-courage) at 1st level; [inspire greatness](ref/performance/inspire-greatness) at 9th level; and [inspire heroics](ref/performance/inspire-heroics) at 15th level. Sermonic performance replaces the 1st-, 9th-, and 15th-level channel energy abilities. This caps the cleric's channel energy damage at 7d6 points."
import_trades = ["The 1st-", "9th-", "15th-level channel energy abilities"]

[[entry.feature]]
anchor = "spontaneous-casting"
head = "Spontaneous Casting"
listed = true
print = "An evangelist does not gain the ability to spontaneously cast cure or inflict spells by sacrificing prepared spells. However, an evangelist can spontaneously cast the following spells by sacrificing a prepared spell of the noted level or above: Spell Level Spontaneous Spell 1st level _command_ 2nd level _enthrall_ 3rd level _tongues_ 4th level _suggestion_ 5th level _greater command_ 6th level _geas/quest_ 7th level _mass suggestion_ 8th level _sympathy_ 9th level _demand_"
import_trades = ["Spontaneous casting"]

[[entry]]
id = "ref/arc-druid/world-walker"
hold = "the replaces trade `resist nature's lure` is not printed in a sentence, and no listed feature of that name prints it"
opening = ["While all druids traverse the wilderness with ease, the world walkers take it upon themselves to travel the entire world. Some act as messengers and scouts for druidic circles, while others have a seemingly unquenchable wanderlust; each new land provides new mysteries to discover and new wisdom to be gained from mastering those mysteries."]

[[entry.feature]]
anchor = "favored-terrain"
head = "Favored Terrain (Ex)"
listed = true
level = 3
print = '''
At 3rd level, the world walker gains the ranger's [favored terrain](ref/ability/favored-terrain) ability. She treats her druid level as her ranger level for this ability. If she has levels in both classes, both class's levels stack for determining the effect of this ability. This ability replaces

trackless step and resist nature's lore.'''
import_trades = ["Trackless step", "resist nature's lure"]

[[entry.feature]]
anchor = "path-of-trees"
head = "Path of Trees (Su)"
listed = true
level = 9
print = '''
At 9th level, once a day, a wanderer

can step within a tree and then teleport from that tree to

another one in a manner similar to the _[tree stride](ref/spell/tree-stride)_ spell. She gains an

extra use of this ability each

day at 12th level, and a

third use of this ability at

15th level. Furthermore,

a world walker of 13th level or

higher can use this ability to teleport

to any other tree of its type up to 100

miles away. This ability replaces

both venom immunity

and timeless body.'''
import_trades = ["Venom immunity", "timeless body"]

[[entry]]
id = "ref/arc-fighter/gladiator"
hold = "the replaces trade `Proficiency with heavy armor` is not printed in a sentence, and no listed feature of that name prints it; the replaces trade `tower shields` is not printed in a sentence, and no listed feature of that name prints it"
opening_from_print = true
opening = ["Most fighters battle out of necessity, with each battle a contest of life and death. Some, however, fight for glory and for the adulation of the crowd. The gladiator is both a cunning warrior and a consummate performer, knowing life and death are balanced not only on a sword's edge, but also on the cheers or jeers of the crowd."]

[[entry.feature]]
anchor = "skills"
head = "Skills"
listed = false
print = "A gladiator gains Perform (act, comedy, and dance) (Cha) as class skills."

[[entry.feature]]
anchor = "weapon-and-armor-proficiency"
head = "Weapon and Armor Proficiency"
listed = false
print = "A gladiator is not proficient with heavy armor or tower shields. Instead he gains the [Performance Weapon Mastery](ref/feat/performance-weapon-mastery) feat (see page 112) at 1st level as a bonus feat. This bonus feat is in addition to the bonus feat a fighter gains at 1st level. Furthermore, a gladiator using [piecemeal armor](ref/rule/piecemeal-armor) is considered to be wearing a suit of armor as long as he wearing two or three armor pieces, gaining the +1 to armor bonus but still taking the +5% chance of arcane spell failure if the pieces are mixed."
import_trades = ["Proficiency with heavy armor", "tower shields"]

[[entry.feature]]
anchor = "bonus-feats"
head = "Bonus Feats"
listed = false
print = "A gladiator may choose to take combat or performance feats as bonus feats."

[[entry.feature]]
anchor = "fame"
head = "Fame (Ex)"
listed = true
level = 2
print = "At 2nd level, when a gladiator begins a [performance combat](ref/rule/performance-combat) (see page 153), he always starts with at least 1 victory point. If he already has victory points, he gains 1 extra victory point. At 10th level, the gladiator starts out with at least 2 victory points. If he already has victory points, he gains 2 extra victory points. This ability replaces bravery."
import_trades = ["Bravery"]

[[entry]]
id = "ref/arc-fighter/tactician"
hold = "the alters trade `Proficiency with heavy armor` is not printed in a sentence, and no listed feature of that name prints it; the alters trade `tower shields` is not printed in a sentence, and no listed feature of that name prints it"
opening = ["While many fighters focus on the fundamentals of melee and ranged combat, there are those who are trained to view the bigger picture on the battlefield. These fighters use their training and tactical acumen to overcome challenges that would overwhelm mere brute strength and skill at arms."]

[[entry.feature]]
anchor = "weapon-and-armor-proficiency"
head = "Weapon and Armor Proficiency"
listed = false
print = "A tactician is not proficient with heavy armor or tower shields."

[[entry.feature]]
anchor = "strategic-training"
head = "Strategic Training (Ex)"
listed = true
level = 1
print = "A tactician gains 4 skill points + a number of skill points equal to his Intelligence modifier at each level, instead of the normal 2 skill points + Intelligence modifier at each level. Furthermore, [Diplomacy](ref/skill/diplomacy) (Cha), [Knowledge (geography)](ref/skill/knowledge-geography) (Int), [Knowledge (nobility)](ref/skill/knowledge-nobility) (Int), [Linguistics](ref/skill/linguistics) (Int), and [Sense Motive](ref/skill/sense-motive) (Wis) are all class skills for the tactician. This ability replaces the bonus fighter combat feat gained at 1st level."
import_trades = ["The bonus fighter combat feat gained at 1st level"]

[[entry.feature]]
anchor = "bonus-feats"
head = "Bonus Feats"
listed = false
print = "A tactician may choose [Skill Focus](ref/feat/skill-focus) or any teamwork feat, in addition to combat feats, as bonus feats."

[[entry.feature]]
anchor = "tactical-awareness"
head = "Tactical Awareness (Ex)"
listed = true
level = 2
print = "At 2nd level, a tactician gains a +1 bonus on initiative checks. This bonus increases by +1 for every four levels after 2nd level (to a maximum of +5 at 18th level). This ability replaces bravery."
import_trades = ["Bravery"]

[[entry.feature]]
anchor = "tactician"
head = "Tactician (Ex)"
listed = true
level = 5
print = "At 5th level, a tactician gains this ability as the [cavalier](ref/class/cavalier) class feature. He may use this ability once per day at 5th level, plus one additional time for every five levels after 5th (to a maximum of four times at 20th level). If the tactician also has cavalier levels, these levels stack for determining the number of uses per day, and he can take the better progression. This ability replaces weapon training 1."
import_trades = ["Weapon training 1"]

[[entry.feature]]
anchor = "cooperative-combatant"
head = "Cooperative Combatant (Ex)"
listed = true
level = 11
print = "At 11th level, when a tactician uses the [aid another](ref/rule/aid-another-2) special attack, he may affect one additional ally per point of Intelligence bonus. For each ally that a tactician aids, he can pick whether to grant that ally the +2 bonus on its next attack against the opponent or the +2 bonus to AC against the opponent's next attack on that ally, and can grant different allies different bonuses. This ability replaces armor training 3."
import_trades = ["Armor training 3"]

[[entry.feature]]
anchor = "battle-insight"
head = "Battle Insight (Ex)"
listed = true
level = 15
print = "At 15th level, as a swift action, a tactician can grant his Intelligence modifier as an insight bonus on the attack rolls made by a single ally within line of sight that can both see and hear the tactician. That ally gains the bonus until the end of the tactician's next turn. The tactician can use this ability a number of times per day equal to 3 + his Intelligence modifier. This ability replaces armor training 4."
import_trades = ["Armor training 4"]

[[entry]]
id = "ref/arc-gunslinger/gun-tank"
hold = "the replaces trade `All bonus combat/grit feats` is not printed in a sentence, and no listed feature of that name prints it; Armor Training (Ex): the sentence \"This ability replaces the bonus feats the gunslinger gains at 4th level and every four levels thereafter\" names no trade"
opening = ["Gunslingers usually don't use heavy armor, but there are a few who use and modify their armor to protect themselves from both traditional weapons and gunfire. These gun tanks trundle into battle with barrels blazing, dealing out punishment with their firearms while knowing few can penetrate their hard protective shells."]

[[entry.feature]]
anchor = "armor-proficiency"
head = "Armor Proficiency"
listed = true
print = "A gun tank is proficient with all armors and shields, including tower shields."

[[entry.feature]]
anchor = "deeds"
head = "Deeds"
listed = true
print = "A gun tank swaps a pair of deeds for the following. The new deed descriptions include information on which deeds from the gunslinger class feature these new deeds replace."

[[entry.feature]]
anchor = "gun-tank-s-resolve"
head = "Gun Tank's Resolve (Ex)"
listed = true
level = 1
print = "At 1st level, the gun tank can shrug off the most serious of attacks. When the gun tank is wearing medium or heavy armor and is subject to a critical hit or [sneak attack](ref/ability/sneak-attack), she can spend 1 grit point as an immediate action to attempt to negate the critical hit or sneak attack damage. At 1st level, she has a 25% chance of doing so. At 10th level, the chance increases to 50%. At 15th level, the chance increases to 75%. While a gun tank's resolve does not stack with the _[fortification](ref/magic-enh/fortification-light)_ armor special ability, it does work in concert with that armor special ability or similar effects, so a gun tank can use this ability even after the _armor of fortification_ has failed to negate the critical hit or sneak attack damage. This deed replaces the gunslinger's dodge deed."
import_trades = ["Gunslinger's dodge deed"]

[[entry.feature]]
anchor = "gun-tank-s-resilience"
head = "Gun Tank's Resilience (Ex)"
listed = true
level = 15
print = "At 15th level, when the gun tank has at least 1 grit point and makes a successful Fortitude saving throw against an attack that would deal half damage or have a partial effect, she takes no damage or other effects from that attack. Furthermore, she gains a +2 bonus on all saving throws against fear and mind-affecting effects. This deed replaces the evasive deed."
import_trades = ["Evasive deed"]

[[entry.feature]]
anchor = "bullet-deflection"
head = "Bullet Deflection (Ex)"
listed = true
print = "A gun tank is adept at modifying and using her armor to stop firearm attacks. Starting at 2nd level, a gun tank wearing medium or heavy armor gains half the armor's bonus plus the armor's enhancement bonus (if any) as a deflection bonus against any non-siege firearm or splash weapon attack (including the alchemist's bomb class ability; _Advanced Player's Guide_ 28). This ability has no affect on spells, spell-like abilities, or supernatural abilities that make a touch attack. This ability replaces nimble."

[[entry.feature]]
anchor = "armor-training"
head = "Armor Training (Ex)"
listed = true
level = 4
print = "At 4th level, a gun tank learns to be more maneuverable while wearing armor. Whenever she is wearing armor, the armor check penalty is reduced by 1 (to a minimum of 0) and the maximum Dexterity bonus allowed by her armor increases by 1. Every four levels thereafter (8th, 12th, and 16th), the bonus increases by 1, to a maximum of a -4 reduction of the armor check penalty and a +4 increase to the maximum Dexterity bonus allowed. This ability stacks with the [fighter](ref/class/fighter) class ability of the same name. If the gun tank has both class features, she takes the most advantageous benefit of the two class features. This ability replaces the bonus feats the gunslinger gains at 4th level and every four levels thereafter."
import_trades = ["All bonus combat/grit feats"]

[[entry]]
id = "ref/arc-gunslinger/musket-master"
hold = "the replaces trade `Firearm training 1, 2, 3, and 4` is not printed in a sentence, and no listed feature of that name prints it"
opening = ["Pistols and other one-handed firearms are often easy to conceal and faster to load than other firearms, and do sufficient damage for most situations. But some gunslingers want a little more firepower and range. These are the musket masters; the best of these gunslingers can reload a musket with dazzling speed, potentially putting even their pistol-wielding brethren to shame."]

[[entry.feature]]
anchor = "weapon-proficiency"
head = "Weapon Proficiency"
listed = true
print = "Instead of proficiency with all firearms, a musket master only gains proficiency with two-handed firearms. She must take the [Exotic Weapon Proficiency](ref/feat/exotic-weapon-proficiency) (firearms) feat to gain proficiency with one-handed firearms and firearm siege engines."

[[entry.feature]]
anchor = "gunsmith"
head = "Gunsmith"
listed = true
