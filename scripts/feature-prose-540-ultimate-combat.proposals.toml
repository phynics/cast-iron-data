import_trades = ["Gun training 1-4"]

[[entry]]
id = "ref/arc-inquisitor/spellbreaker"
hold = "checker: [fields] trades = \"replaces: Teamwork feats\" disagrees with the trade sentences of the feature `defense-against-magic` = \"replaces: all bonus teamwork feats\" (line 43)"
opening = ["The world is full of dangerous magic, and many recoil in the face of such power. The spellbreaker, by contrast, learns to recognize and resist certain types of magic, wading through waves of magic to reach her foes."]

[[entry.feature]]
anchor = "strong-willed"
head = "Strong-Willed (Ex)"
listed = true
level = 1
print = "At 1st level, a spellbreaker is able to stand strong against magical effects that seek to control, compel, or persuade her. The spellbreaker rolls twice and takes the best result when making a Will saving throw against a mind-affecting effect. This ability replaces monster lore."
import_trades = ["Monster lore"]

[[entry.feature]]
anchor = "defense-against-magic"
head = "Defense against Magic (Ex)"
listed = true
level = 3
print = "At 3rd level, a spellbreaker picks a single [wizard school](ref/ability/arcane-schools). She gains a +1 bonus on saving throws against arcane spells of that school. Every four levels beyond 3rd, the spellbreaker picks a new school and gains this bonus against arcane spells of that school (to a maximum of five schools of magic at 19th level). Furthermore, each time the spellbreaker picks a new school, the bonuses for the schools she has already chosen increase by 1. This ability replaces all bonus teamwork feats."
import_trades = ["Teamwork feats"]

[[entry.feature]]
anchor = "foil-casting"
head = "Foil Casting (Su)"
listed = true
level = 3
print = "At 3rd level, when an opponent tries to cast an arcane spell within a spellbreaker's threatened area, the DC for that caster to cast defensively increases by 2. This increase stacks with the effects of the [Disruptive](ref/feat/disruptive) feat (see page 112 of the _Core Rulebook_). Furthermore, the spellbreaker knows where to hit foes to foil casting from a distance. Each time she hits an arcane spellcaster or a creature that uses [spell-like abilities](ref/umr/spell-like-abilities) with a ranged weapon attack, the DC of any [Concentration](ref/rule/concentration) checks the caster makes increases by 2 for 1 round. This ability replaces solo tactics."
import_trades = ["Solo tactics"]

[[entry.feature]]
anchor = "impervious"
head = "Impervious (Ex)"
listed = true
level = 20
print = "At 20th level, a spellbreaker becomes immune to the effects of a single school of arcane magic. That school of magic must be the first one she picked for defense against magic (see above). Neither harmful nor helpful arcane spells of that school have an effect on the spellbreaker. If a spell of that school is an area of effect spell, the spell goes off as normal, but the spellbreaker is untouched by its effects. Once per day, as a swift action, the spellbreaker can grant this imperviousness to all allies in a 60-foot [burst](ref/misc/burst) for 1 minute. This ability replaces true judgment."
import_trades = ["True judgment"]

[[entry]]
