[[entry.feature]]
anchor = "sucker-punch"
head = "Sucker Punch (Ex)"
listed = true
level = 17
print = "At 17th level, when an unarmed fighter strikes a creature that is denied its Dexterity bonus to AC, or that he has successfully pinned with a grapple check, he can attempt a dirty trick or trip combat maneuver against that target as a swift action. This ability replaces armor training 4."
