listed = true
level = 15
print = "At 15th level, when an unbreakable is [exhausted](ref/misc/exhausted), he only suffers the effects of the fatigued condition instead, but does require 1 hour of rest to reduce this condition to the actual fatigued condition. This ability replaces armor training 4."
import_trades = ["Armor training 4"]

[[entry.feature]]
anchor = "miraculous-recovery"
head = "Miraculous Recovery (Ex)"
listed = true
level = 17
print = "At 17th level, when an unbreakable makes a saving throw to recover from an ongoing effect, he may roll twice and choose the better roll. This ability replaces weapon training 4."
import_trades = ["Weapon training 4"]

[[entry.feature]]
anchor = "unbreakable-mind"
head = "Unbreakable Mind (Ex)"
listed = true
level = 20
print = "At 20th level, an unbreakable becomes nearly impossible to sway with honeyed words or magic. He gains immunity to mind-affecting effects. This ability replaces weapon mastery."
