head = "Twin Shot Knockdown (Ex)"
listed = true
level = 11
print = "At 11th level, when the pistolero hits a single target with two or more one-handed firearm attacks during her turn, she can spend 1 grit point to knock the target [prone](ref/rule/prone). She can choose to spend the grit point after the attacks are made. This deed replaces the bleeding wound deed."
import_trades = ["Bleeding wound deed"]

[[entry.feature]]
anchor = "pistol-training"
