[[entry.feature]]
anchor = "trick-throw"
head = "Trick Throw (Ex)"
listed = true
level = 8
print = "At 8th level, when an unarmed fighter successfully [trips](ref/rule/trip) an opponent with an unarmed attack, he can attempt a [dirty trick](ref/rule/dirty-trick) combat maneuver against that creature (before the opponent becomes prone) as an immediate action that does not provoke attacks of opportunity. This ability replaces the 8th-level bonus feat."
