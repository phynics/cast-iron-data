[[entry.feature]]
anchor = "tough-as-nails"
head = "Tough as Nails"
listed = true
level = 1
print = "An unbreakable gains [Endurance](ref/feat/endurance) and Die Hard as bonus feats. This ability replaces the fighter's 1st-level bonus feat."
import_trades = ["The fighter's 1st-level bonus feat"]

[[entry.feature]]
anchor = "unflinching"
head = "Unflinching (Ex)"
listed = true
level = 2
print = "At 2nd level, an unbreakable gains a +1 bonus on Will saves against mind-affecting effects. This bonus increases by +1 for every four levels after 2nd level (to a maximum of +5 at 18th level). This ability replaces bravery."
import_trades = ["Bravery"]

[[entry.feature]]
anchor = "heroic-recovery"
head = "Heroic Recovery (Ex)"
listed = true
level = 5
print = "At 5th level, an unbreakable gains the [Heroic Recovery](ref/feat/heroic-recovery) feat as a bonus feat, if he does not have it already. If he already has this feat, the unbreakable can choose any combat feat instead. In addition, he may use this feat one additional time per day for every four levels after 5th (to a maximum of 4 times per day at 17th level). This ability replaces weapon training 1."
import_trades = ["Weapon training 1"]

[[entry.feature]]
anchor = "heroic-defiance"
head = "Heroic Defiance (Ex)"
listed = true
level = 9
print = "At 9th level, an unbreakable gains the [Heroic Defiance](ref/feat/heroic-defiance) feat as a bonus feat, if he does not have it already. If he already has this feat, the unbreakable can choose any combat feat instead. In addition, he may use this feat one additional time per day for every four levels after 9th (to a maximum of 3 times per day at 19th level). This ability replaces weapon training 2."
import_trades = ["Weapon training 2"]

[[entry.feature]]
anchor = "quick-recovery"
