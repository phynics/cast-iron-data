anchor = "axes"
head = "Axes"
listed = true
print = "bardiche, battleaxe, dwarven waraxe, greataxe, handaxe, heavy pick, hooked axe\\*, knuckle axe\\*, light pick,\n\nmattock\\*, orc double axe, pata\\*, and throwing axe"

