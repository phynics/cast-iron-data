import_trades = ["Utility shot deed"]

[[entry.feature]]
anchor = "rapid-reloader"
head = "Rapid Reloader"
listed = true
level = 1
print = "At 1st level, a musket master gains [Rapid Reload](ref/feat/rapid-reload) (musket) as a bonus feat. Use the updated version of this feat on page 115."

[[entry.feature]]
anchor = "musket-training"
head = "Musket Training (Ex)"
listed = true
level = 5
print = "Starting at 5th level, a musket master increases her skill with two-handed firearms. She gains a bonus on damage rolls equal to her Dexterity modifier, and when she misfires with a two-handed firearm, the misfire value increases by 2 instead of 4. Every four levels thereafter (9th, 13th, and 17th), the bonus on damage rolls increases by +1. This replaces gun training 1, 2, 3, and 4."
import_trades = ["Firearm training 1", "2", "3", "4"]

[[entry]]
id = "ref/arc-gunslinger/pistolero"
