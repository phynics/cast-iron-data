[[entry]]
id = "ref/arc-fighter/tower-shield-specialist"
opening = ["Many fighters believe the tower shield is a tool suitable only for troops on the battlefield, claiming it is too large and bulky to use in skirmishes or within dungeon corridors. Tower shield specialists defy those notions, using their massive shields with startling skill and incredible effect. They use these seemingly clumsy shields to perform deft maneuvers that confound their enemies."]

[[entry.feature]]
anchor = "burst-barrier"
head = "Burst Barrier (Ex)"
listed = true
level = 2
print = "At 2nd level, a tower shield specialist can use his shield to screen himself from burst spells and effects, gaining a +1 bonus on Reflex saves against them while employing a tower shield. This bonus increases by +1 for every four levels after 2nd (to a maximum of +5 at 18th level). This ability replaces bravery."
import_trades = ["Bravery"]

[[entry.feature]]
anchor = "tower-shield-training"
head = "Tower Shield Training (Ex)"
listed = true
level = 3
print = "At 3rd level, a tower shield specialist gains armor training as normal, but while he employs a tower shield, the armor penalty is reduced by 3 and the maximum Dexterity bonus allowed by his armor increases by 2. The benefit increases every four levels thereafter as per standard armor training; if the tower shield specialist is not employing a tower shield, the benefits to armor training revert to the normal bonuses."

[[entry.feature]]
anchor = "tower-shield-specialist"
head = "Tower Shield Specialist (Ex)"
listed = true
level = 5
print = "At 5th level, when a tower shield specialist employs a tower shield in combat, he does not take the -2 penalty on attack rolls because of the shield's encumbrance. This ability replaces weapon training 1."
import_trades = ["Weapon training 1"]

[[entry.feature]]
anchor = "tower-shield-defense"
head = "Tower Shield Defense (Ex)"
listed = true
level = 9
print = "At 9th level, while using a tower shield, a tower shield specialist gains his shield bonus against touch attacks. This ability replaces weapon training 2."
import_trades = ["Weapon training 2"]

[[entry.feature]]
anchor = "immediate-repositioning"
head = "Immediate Repositioning (Ex)"
listed = true
level = 13
print = "At 13th level, as an immediate action, a tower shield specialist can reposition his tower shield to another facing, but he cannot use this ability to interrupt an attack. This ability replaces weapon training 3."
import_trades = ["Weapon training 3"]

[[entry.feature]]
anchor = "tower-shield-evasion"
head = "Tower Shield Evasion (Ex)"
listed = true
level = 16
print = "At 16th level, while using a tower shield, the tower shield specialist gains [evasion](ref/ability/evasion), as the [rogue](ref/class/rogue) class ability. At 20th level, the shield specialist gains [improved evasion](ref/talent/improved-evasion), as the rogue advanced talent, while using a tower shield. This ability replaces both weapon training 4 and weapon mastery."
import_trades = ["Weapon training 4", "weapon mastery"]

[[entry]]
id = "ref/arc-fighter/unarmed-fighter"
opening = ["Not all fighters need weapons to make their mark on the world. The unarmed fighter picks up a weapon only rarely, and when he does, he prefers the weapons of the monk. There are even those who mistake them for monks, but these fighters enter the fight without ki, and instead have a tough perseverance that few can rival."]

[[entry.feature]]
anchor = "weapon-and-armor-proficiency"
head = "Weapon and Armor Proficiency"
listed = false
print = "An unarmed fighter is not proficient with medium armor, heavy armor, or shields. An unarmed fighter is proficient with all [monk](ref/class/monk) weapons, including exotic monk weapons."

[[entry.feature]]
anchor = "unarmed-style"
head = "Unarmed Style"
listed = true
level = 1
print = "At 1st level, a unarmed fighter gains the [Improved Unarmed Strike](ref/feat/improved-unarmed-strike) feat and any single style feat as a bonus feat. The unarmed fighter need not meet all the prerequisites of the style feat he chooses, but style feats that grant additional uses of the [Elemental Fist](ref/feat/elemental-fist) feat cannot be taken until the unarmed fighter has that feat. This ability replaces the bonus feat at 1st level."
import_trades = ["The bonus feat at 1st level"]

[[entry.feature]]
anchor = "harsh-training"
head = "Harsh Training (Ex)"
listed = true
level = 2
print = "At 2nd level, an unarmed fighter gains a +1 bonus on saving throws against effects that cause the exhausted, fatigued, or staggered conditions or temporary penalties to ability scores. This bonus increases by +1 for every four levels after 2nd (to a maximum of +5 at 18th level). This ability replaces bravery."
import_trades = ["Bravery"]

[[entry.feature]]
anchor = "tough-guy"
head = "Tough Guy (Ex)"
listed = true
level = 3
print = "At 3rd level, an unarmed fighter gains DR/— equal to [half](ref/misc/fractions-and-rounding) his fighter level against nonlethal damage or damage taken while he is [grappled](ref/rule/grapple-conditions). This ability replaces armor training 1."
import_trades = ["Armor training 1"]

[[entry.feature]]
anchor = "weapon-training"
head = "Weapon Training (Ex)"
