anchor = "steady-aim"
head = "Steady Aim (Ex)"
listed = true
level = 1
print = "At 1st level, as long as a musket master has at least 1 grit point, she can take a move-equivalent action to increase the accuracy of a two-handed firearm. When she does, she increases the range increment of the firearm she is firing by 10 feet. This stacks with other abilities that increase her range increment. This deed replaces the gunslinger's dodge deed."
import_trades = ["Gunslinger's dodge deed"]

[[entry.feature]]
anchor = "fast-musket"
head = "Fast Musket (Ex)"
listed = true
level = 3
