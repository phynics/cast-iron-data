# Texts of the entries that feature-prose-540.py has not converted yet. Generated: never edit by hand
# except the `edit` text of a feature (status `edit` in the review TSV).

[[entry]]
id = "ref/arc-alchemist/beastmorph"
opening = ["Beastmorphs study the anatomy of monsters, learning how they achieve their strange powers. They use their knowledge to duplicate these abilities, but at the cost of taking on inhuman shapes when they use mutagens."]

[[entry.feature]]
anchor = "beastform-mutagen"
head = "Beastform Mutagen"
listed = true
level = 3
print = "At 3rd level, a beastmorph's mutagen causes him to take on animalistic features— whether those of an animal, a magical beast, an animal-like humanoid (such as a lizardfolk), or a monstrous humanoid. For example, when the beastmorph uses his mutagen, he may gain a furry muzzle and pointed ears like a werewolf, scaly skin like a lizardfolk or sahuagin, or compound eyes and mandibles like a giant insect. The beastmorph also gains his choice of one of the abilities listed in the _[alter self](ref/spell/alter-self)_ spell, which persists as long as the mutagen. He may select a different ability each time he creates a mutagen. This ability replaces swift alchemy."
import_trades = ["Swift alchemy"]

[[entry.feature]]
anchor = "improved-beastform-mutagen"
head = "Improved Beastform Mutagen"
listed = true
level = 6
print = "At 6th level, a beastmorph's mutagen grants him additional abilities and options. The alchemist gains his choice of two of the abilities listed in the _[beast shape I](ref/spell/beast-shape-1)_ spell, which persist as long as the mutagen. He may select two different abilities each time he creates a mutagen. This ability replaces swift poisoning."
import_trades = ["Swift poisoning"]

[[entry.feature]]
anchor = "greater-beastform-mutagen"
head = "Greater Beastform Mutagen"
listed = true
level = 10
print = "At 10th level, a beastmorph's mutagen grants him three of the abilities listed in the _[beast shape II](ref/spell/beast-shape-2)_ spell, which persist as long as the mutagen. He may select three different abilities each time he creates a mutagen. This ability replaces poison resistance +2, +4, and +6, as well as poison immunity."
import_trades = ["Poison resistance +2", "+4", "+6", "poison immunity"]

[[entry.feature]]
anchor = "grand-beastform-mutagen"
head = "Grand Beastform Mutagen"
listed = true
level = 14
print = "At 14th level, a beastmorph's mutagen grants him four of the abilities listed in the _[beast shape III](ref/spell/beast-shape-3)_ spell, which persist as long as the mutagen. He may select four different abilities each time he creates a mutagen. This ability replaces persistent mutagen."
import_trades = ["Persistent mutagen"]

[[entry.feature]]
anchor = "discoveries"
head = "Discoveries"
listed = false
print = "The following discoveries complement the beastmorph archetype: [feral mutagen](ref/discovery/feral-mutagen), [grand mutagen](ref/discovery/grand-mutagen), [greater mutagen](ref/discovery/greater-mutagen), [infuse mutagen](ref/discovery/infuse-mutagen), [mummification](ref/discovery/mummification)\\*, [spontaneous healing](ref/discovery/spontaneous-healing)\\*, [tentacle](ref/discovery/tentacle)\\*, and [wings](ref/discovery/wings)\\*."

[[entry]]
id = "ref/arc-alchemist/ragechemist"
opening = ["Some alchemists create mutagens that tap into a primal anger that fuels their physical transformation. These alchemists have little control over their altered selves."]

[[entry.feature]]
anchor = "rage-mutagen"
head = "Rage Mutagen"
listed = true
level = 2
print = "At 2nd level, whenever a ragechemist creates a mutagen that improves his Strength, that mutagen's bonus to Strength increases by 2 and penalizes the alchemist's Intelligence score. Furthermore, while under the effects of this mutagen, whenever the alchemist takes damage, his rage grows, with detrimental effects. At the end of each turn that he takes hit point damage, the ragechemist must succeed at a Will saving throw (DC 15, or DC 20 if any of the damage came from a critical hit that turn) or take a -2 penalty on Will saving throws and to Intelligence. These penalties end 1 hour after the mutagen ends and stack with themselves. If the penalty lowers the ragechemist's Intelligence score to 0, the ragechemist is comatose until 1 hour after the mutagen expires. This ability replaces poison use."
import_trades = ["Poison use"]

[[entry.feature]]
anchor = "sturdy-rage"
head = "Sturdy Rage"
listed = true
level = 6
print = "At 6th level, whenever a ragechemist uses his rage mutagen, he also gains a +4 bonus to natural armor, but the penalty on Will saving throws and to Intelligence for taking damage increases to -4. This ability replaces swift poisoning."
import_trades = ["Swift poisoning"]

[[entry.feature]]
anchor = "lumbering-rage"
head = "Lumbering Rage"
listed = true
level = 10
print = "At 10th level, whenever a ragechemist uses his rage mutagen ability, he may have the mutagen also give him a +2 morale bonus to Constitution, but when he takes a penalty on Will saving throws and to Intelligence, he also takes a -1 penalty to Dexterity. This ability replaces poison immunity."
import_trades = ["Poison immunity"]

[[entry.feature]]
anchor = "discoveries"
head = "Discoveries"
listed = false
print = "The following discoveries complement the ragechemist: [feral mutagen](ref/discovery/feral-mutagen), [grand mutagen](ref/discovery/grand-mutagen), [greater mutagen](ref/discovery/greater-mutagen), [infuse mutagen](ref/discovery/infuse-mutagen), [tentacle](ref/discovery/tentacle)\\*, and [vestigial arm](ref/discovery/vestigial-arm)\\*."

[[entry]]
id = "ref/arc-antipaladin/knight-of-the-sepulcher"
opening = ["Not content with the antipaladin's mere corruption of the soul, the knight of the sepulcher sacrifices mortality along with morality.", "The knight of the sepulcher archetype is available only to the antipaladin alternate class."]

[[entry.feature]]
anchor = "touch-of-the-crypt"
head = "Touch of the Crypt (Ex)"
listed = true
level = 5
print = "At 5th level, a knight of the sepulcher gains a +2 bonus on saving throws against mind-affecting effects, death effects, and poison. He is harmed by positive energy effects and healed by negative energy effects as though he were undead, although negative energy effects that don't heal undead (such as [enervation](ref/spell/enervation)) affect him normally. The knight of the sepulcher has a 25% chance of ignoring critical hits and the bonus damage from [sneak attacks](ref/ability/sneak-attack) as though he were wearing _armor of [light fortification](ref/magic-enh/fortification-light)_. This ability replaces the fiendish boon ability."
import_trades = ["Fiendish boon"]

[[entry.feature]]
anchor = "fortitude-of-the-crypt"
head = "Fortitude of the Crypt (Ex)"
listed = true
level = 8
print = "At 8th level, a knight of the sepulcher gains immunity to poison. He also gains [darkvision](ref/rule/darkvision) 60 feet if he does not already possess it. This ability replaces the aura of despair ability."
import_trades = ["Aura of despair"]

[[entry.feature]]
anchor = "cloak-of-the-crypt"
head = "Cloak of the Crypt (Ex)"
listed = true
level = 10
print = "At 10th level, the knight of the sepulcher gains immunity to energy drain and harmful negative energy effects. His chance of ignoring critical hits and sneak attacks increases to 50%, as though he were wearing _armor of [moderate fortification](ref/magic-enh/fortification-moderate)_. This ability replaces the smite good use gained at 10th level."
import_trades = ["The smite good use gained at 10th level"]

[[entry.feature]]
anchor = "will-of-the-crypt"
head = "Will of the Crypt (Ex)"
listed = true
level = 11
print = "At 11th level, a knight of the sepulcher's bonus on saving throws against mind-affecting effects and death effects increases to +4. This ability replaces the aura of vengeance ability."
import_trades = ["Aura of vengeance"]

[[entry.feature]]
anchor = "weapons-of-sin"
head = "Weapons of Sin (Su)"
listed = true
level = 14
print = "At 14th level, a knight of the sepulcher's weapons are treated as evil-aligned for the purposes of overcoming [damage reduction](ref/rule/damage-reduction). This ability replaces aura of sin."
import_trades = ["Aura of sin"]

[[entry.feature]]
anchor = "crypt-lord"
head = "Crypt Lord (Ex)"
listed = true
level = 15
print = "At 15th level, a knight of the sepulcher's chance of ignoring critical hits and sneak attacks increases to 75%, as though he were wearing _armor of [heavy fortification](ref/magic-enh/fortification-heavy)_. He gains immunity to death effects, paralysis, sleep effects, and stunning. He no longer sleeps. The knight of the sepulcher also gains immunity to effects that cause fatigue, and effects that would cause him to become [exhausted](ref/misc/exhausted) instead cause him to become [fatigued](ref/misc/fatigued). This ability replaces cruelty."
import_trades = ["Cruelty"]

[[entry.feature]]
anchor = "soul-of-the-crypt"
head = "Soul of the Crypt (Su)"
listed = true
level = 17
print = "At 17th level, a knight of the sepulcher gains DR 5/bludgeoning and good. This ability replaces aura of depravity."
import_trades = ["Aura of depravity"]

[[entry.feature]]
anchor = "undying-champion"
head = "Undying Champion (Ex)"
listed = true
level = 20
print = "At 20th level, a knight of the sepulcher joins the ranks of the [undead](ref/type/undead). His DR increases to 10/bludgeoning and good. His type changes to undead, and he acquires all [undead traits](ref/umr/undead-traits). Although immune to disease, he can still carry and spread diseases with the antipaladin's plague bringer ability. The undying champion no longer has a Constitution score. He uses his Charisma score for calculating hit points, Fortitude saves, and any special abilities that rely on Constitution. This ability replaces unholy champion."
import_trades = ["Unholy champion"]

[[entry]]
id = "ref/arc-barbarian/armored-hulk"
opening = ["Some barbarians disdain the hides and leather used as armor by most of their kin. Instead they master the heaviest of armors, even those created by more civilized people, to gain greater protection and stability in battle."]

[[entry.feature]]
anchor = "weapon-and-armor-proficiency"
head = "Weapon and Armor Proficiency"
listed = false
print = "An armored hulk gains proficiency in heavy armor."

[[entry.feature]]
anchor = "indomitable-stance"
head = "Indomitable Stance (Ex)"
listed = true
level = 1
print = "An armored hulk gains a +1 bonus on combat maneuver checks and to CMD for overrun combat maneuvers, and on Reflex saves against [trample](ref/umr/trample) attacks. She also gains a +1 bonus to her AC against charge attacks and on attack and damage rolls against charging creatures. This ability replaces fast movement."
import_trades = ["Fast movement"]

[[entry.feature]]
anchor = "armored-swiftness"
head = "Armored Swiftness (Ex)"
listed = true
level = 2
print = "At 2nd level, an armored hulk moves faster in medium and heavy armor. When wearing medium or heavy armor, an armored hulk can move 5 feet faster than normal, to a maximum of her speed. This ability replaces uncanny dodge."
import_trades = ["Uncanny dodge"]

[[entry.feature]]
anchor = "resilience-of-steel"
head = "Resilience of Steel (Ex)"
listed = true
level = 3
print = "At 3rd level, an armored hulk is able to use her armor to help avoid deadly hits. While wearing heavy armor, she gains a +1 bonus to AC that applies only on critical hit confirmation rolls. This bonus increases by +1 every 3 levels beyond 3rd (maximum +6 at 18th level). This ability replaces trap sense."
import_trades = ["Trap sense"]

[[entry.feature]]
anchor = "improved-armored-swiftness"
head = "Improved Armored Swiftness (Ex)"
listed = true
level = 5
print = "At 5th level, an armored hulk's land speed is faster than the norm for her race by +10 feet. This benefit applies when she is wearing any armor, including heavy armor, but not while carrying a heavy load. Apply this bonus before modifying the armored hulk's speed because of any load carried or armor worn. This bonus stacks with any other bonuses to the barbarian's land speed. This ability replaces improved uncanny dodge."
import_trades = ["Improved uncanny dodge"]

[[entry.feature]]
anchor = "rage-powers"
head = "Rage Powers"
listed = false
print = "The following rage powers complement the armored hulk archetype: [boasting taunt](ref/ragepower/boasting-taunt)\\*, [greater guarded life](ref/ragepower/greater-guarded-life), [guarded life](ref/ragepower/guarded-life)\\*, [guarded stance](ref/ragepower/guarded-stance), [increased damage reduction](ref/ragepower/increased-damage-reduction), [no escape](ref/ragepower/no-escape), [overbearing advance](ref/ragepower/overbearing-advance)\\*, [overbearing onslaught](ref/ragepower/overbearing-onslaught)\\*, [reflexive dodge](ref/ragepower/reflexive-dodge), [rolling dodge](ref/ragepower/rolling-dodge), and [unexpected strike](ref/ragepower/unexpected-strike)."

[[entry]]
id = "ref/arc-barbarian/scarred-rager"
opening = ["Some barbarians wear marks of prowess and savagery upon their bodies. The scarred rager believes each wound tells the tales of her prowess and bravery. She augments these ragged trophies with brands and tattoos in order to win the notice and favor of her gods, ancestors, or totem spirits. The scarred rager's gnarled and exotic appearance terrifies civilized onlookers, but is awe-inspiring to her savage kin."]

[[entry.feature]]
anchor = "terrifying-visage"
head = "Terrifying Visage (Ex)"
listed = true
level = 1
print = "A scarred rager adds 1/2 her barbarian level on Intimidate checks against humanoids who are not members of barbarian tribes. When dealing with barbarians, the scarred rager may choose to add this bonus on Diplomacy checks instead. The DC of any fear effect created by the scarred rager also increases by 1. This ability replaces fast movement."
import_trades = ["Fast movement"]

[[entry.feature]]
anchor = "tolerance"
head = "Tolerance (Ex)"
listed = true
level = 2
print = "At 2nd level, a scarred rager who fails a save against an effect that causes her to become nauseated, sickened, fatigued, or exhausted can make a second save to negate the effect on the start of her next turn. Only one additional save is allowed. If the effect does not allow a saving throw, its duration is halved instead (minimum of 1 round). This ability replaces uncanny dodge."
import_trades = ["Uncanny dodge"]

[[entry.feature]]
anchor = "scarification"
head = "Scarification (Ex)"
listed = true
level = 3
print = "At 3rd level, a scarred rager can ignore 1 point of bleed damage per round. This amount increases by 1 every three levels beyond 3rd. At 15th level, a scarred rager can ignore 1 bleed effect each round. This ability replaces trap sense."
import_trades = ["Trap sense"]

[[entry.feature]]
anchor = "improved-tolerance"
head = "Improved Tolerance (Ex)"
listed = true
level = 5
print = "At 5th level, a scarred rager's tolerance ability also applies to effects that would cause her to become dazed, frightened, shaken, or stunned. This replaces improved uncanny dodge."
import_trades = ["Improved uncanny dodge"]

[[entry.feature]]
anchor = "rage-powers"
head = "Rage Powers"
listed = false
print = "The following rage powers complement the scarred rager archetype: [auspicious mark](ref/ragepower/auspicious-mark), [body bludgeon](ref/ragepower/body-bludgeon), [come and get me](ref/ragepower/come-and-get-me)\\*, [increased damage reduction](ref/ragepower/increased-damage-reduction), [inspire ferocity](ref/ragepower/inspire-ferocity)\\*, [internal fortitude](ref/ragepower/internal-fortitude), [intimidating glare](ref/ragepower/intimidating-glare), [reckless abandon](ref/ragepower/reckless-abandon)\\*, [regenerative vigor](ref/ragepower/regenerative-vigor), [renewed life](ref/ragepower/renewed-life), [renewed vigor](ref/ragepower/renewed-vigor), [renewed vitality](ref/ragepower/renewed-vitality), [roused anger](ref/ragepower/roused-anger), and [terrifying howl](ref/ragepower/terrifying-howl)."

[[entry]]
id = "ref/arc-barbarian/sea-reaver"
opening = ["Not all barbarians hunt forests, plains, and mountains. Some are raiding terrors on the sea and coasts, pillaging those who hoard treasure and pursuing monsters of the deep. Some sea reavers are no more than hunters of the open sea, while others are raiders striking fear into coastal settlements within reach of the sea reavers' longships."]

[[entry.feature]]
anchor = "weapon-and-armor-proficiency"
head = "Weapon and Armor Proficiency"
listed = false
print = "A sea reaver is not proficient with medium armor."

[[entry.feature]]
anchor = "marine-terror"
head = "Marine Terror (Ex)"
listed = true
level = 1
print = "A sea reaver can [hold her breath](ref/misc/hold-your-breath) for a number of rounds equal to four times her Constitution score. In addition, a sea reaver can move normally though squares of standing water or bog that is 1 foot deep. It does not cost her extra movement to traverse these terrains. Lastly, a sea reaver ignores the normal [cover](ref/rule/cover) bonus to AC when attacking creatures that are partially immersed in water. This ability replaces fast movement."
import_trades = ["Fast movement"]

[[entry.feature]]
anchor = "eyes-of-the-storm"
head = "Eyes of the Storm (Ex)"
listed = true
level = 2
print = "At 2nd level, a sea reaver ignores any [concealment](ref/rule/concealment) provided by fog, rain, sleet, mist, wind, or other weather effects that is less than total concealment, and any penalties weather applies on Perception checks are halved. This ability replaces uncanny dodge."
import_trades = ["Uncanny dodge"]

[[entry.feature]]
anchor = "savage-sailor"
head = "Savage Sailor (Ex)"
listed = true
level = 3
print = "At 3rd level, a sea reaver gains a +1 bonus on Acrobatics, Climb, Profession (sailor), Survival, and Swim checks made in aquatic terrain, including aboard a ship or along shorelines. These bonuses improve by +1 every three levels after 3rd. This ability replaces trap sense."
import_trades = ["Trap sense"]

[[entry.feature]]
anchor = "sure-footed"
head = "Sure-Footed (Ex)"
listed = true
level = 5
print = "At 5th level, a sea reaver takes no penalties when moving across slick surfaces, whether natural or magical (e.g., _[grease](ref/spell/grease)_, _[ice storm](ref/spell/ice-storm)_, and _[sleet storm](ref/spell/sleet-storm)_). She is not at risk of falling, is not denied her Dexterity bonus when moving across such areas, and does not treat them as difficult terrain. This ability replaces improved uncanny dodge."
import_trades = ["Improved uncanny dodge"]

[[entry.feature]]
anchor = "rage-powers"
head = "Rage Powers"
listed = false
print = "The following rage powers complement the sea reaver archetype: [bestial leaper](ref/ragepower/bestial-leaper), [bestial swimmer](ref/ragepower/bestial-swimmer), [come and get me](ref/ragepower/come-and-get-me)\\*, [hurling charge](ref/ragepower/hurling-charge)\\*, [raging leaper](ref/ragepower/raging-leaper), [raging swimmer](ref/ragepower/raging-swimmer), [rolling dodge](ref/ragepower/rolling-dodge), and [smasher](ref/ragepower/smasher)\\*."

[[entry]]
id = "ref/arc-barbarian/titan-mauler"
opening = ["In lands overrun by giants, dragons, and other hulking beasts, entire fellowships of barbarians hone tactics and traditions with one purpose—to bring low these massive foes. While her enemies' size makes the creatures strong, the titan mauler is even stronger, taking up weapons from her fallen foes that no lesser warrior can lift, and using them when she beseeches the spirits to grant her increased size and greater ferocity against her titanic foes."]

[[entry.feature]]
anchor = "big-game-hunter"
head = "Big Game Hunter (Ex)"
listed = true
level = 1
print = "A titan mauler gains a +1 bonus on attack rolls and a +1 dodge bonus to AC in melee with creatures larger than themselves. This ability replaces fast movement."
import_trades = ["Fast movement"]

[[entry.feature]]
anchor = "jotungrip"
head = "Jotungrip (Ex)"
listed = true
level = 2
print = "At 2nd level, a titan mauler may choose to wield a two-handed melee weapon in one hand with a -2 penalty on attack rolls while doing so. The weapon must be appropriately sized for her, and it is treated as one-handed when determining the effect of [Power Attack](ref/feat/power-attack), Strength bonus to damage, and the like. This ability replaces uncanny dodge."
import_trades = ["Uncanny dodge"]

[[entry.feature]]
anchor = "massive-weapons"
head = "Massive Weapons (Ex)"
listed = true
level = 3
print = "At 3rd level, a titan mauler becomes skilled in the use of massive weapons looted from her titanic foes. She can use two-handed weapons meant for creatures one size category larger, but the penalty for doing so is increased by 4. However, the attack roll penalty for using weapons too large for her size is reduced by 1, and this reduction increases by 1 for every three levels beyond 3rd (to a minimum of 0). This ability replaces trap sense."
import_trades = ["Trap sense"]

[[entry.feature]]
anchor = "evade-reach"
head = "Evade Reach (Ex)"
listed = true
level = 5
print = "At 5th level, as a swift action, a titan mauler may choose one creature within her line of sight. Until the end of her turn, that target's reach is treated as if it were 5 feet shorter with respect to reaching the titan mauler, and this reduction increases by 5 feet for every five levels beyond 5th. This ability replaces improved uncanny dodge."
import_trades = ["Improved uncanny dodge"]

[[entry.feature]]
anchor = "titanic-rage"
head = "Titanic Rage (Su)"
listed = true
level = 14
print = "At 14th level, a titan mauler may choose to gain the benefits of _[enlarge person](ref/spell/enlarge-person)_ when she enters a rage. While using titanic rage, she must spend 2 rounds of rage per round, and she becomes [exhausted](ref/misc/exhausted) rather than fatigued when the rage ends. This ability replaces indomitable will."
import_trades = ["Indomitable will"]

[[entry.feature]]
anchor = "rage-powers"
head = "Rage Powers"
listed = false
print = "The following rage powers complement the titan mauler archetype: [body bludgeon](ref/ragepower/body-bludgeon), [greater ground breaker](ref/ragepower/greater-ground-breaker), [ground breaker](ref/ragepower/ground-breaker)\\*, [knockback](ref/ragepower/knockback), [mighty swing](ref/ragepower/mighty-swing), [powerful blow](ref/ragepower/powerful-blow), [smasher](ref/ragepower/smasher)\\*, and [strength surge](ref/ragepower/strength-surge)."

[[entry]]
id = "ref/arc-barbarian/true-primitive"
hold = "the alters trade `The barbarian's armor and weapon proficiencies` is not printed in a sentence, and no listed feature of that name prints it"
opening = ["Isolated and xenophobic tribes that dwell in areas untouched by civilization often see anything from cities and organized settlements as strange, dangerous, and decadent. They gain power from their truly primitive nature; their bodies and spirits are hardened by the wild and untainted existence far from the pathetic softness of so-called civilization. Even when forced to mingle with civilization, the true primitive stays apart in both traditions and trappings."]

[[entry.feature]]
anchor = "weapon-and-armor-proficiency"
head = "Weapon and Armor Proficiency"
listed = false
print = "A true primitive is proficient with [hide armor](ref/eq-armor/hide) and armors made from [bone](ref/eq-material/bone). A true primitive is also proficient with bone shields and the following weapons: [battleaxe](ref/eq-weapon/battleaxe), [blowgun](ref/eq-weapon/blowgun), [club](ref/eq-weapon/club), [greatclub](ref/eq-weapon/greatclub), [handaxe](ref/eq-weapon/handaxe), [longspear](ref/eq-weapon/longspear), [shortspear](ref/eq-weapon/shortspear), [sling](ref/eq-weapon/sling), and [spear](ref/eq-weapon/spear)."
import_trades = ["The barbarian's armor", "weapon proficiencies"]

[[entry.feature]]
anchor = "illiteracy"
head = "Illiteracy"
listed = true
print = "A true primitive cannot read or write, and her superstition about such things leads her to refuse to ever learn to read or write, even if she multiclasses into other classes."

[[entry.feature]]
anchor = "favored-terrain"
head = "Favored Terrain (Ex)"
listed = true
level = 1
print = "A true primitive has a [favored terrain](ref/ability/favored-terrain) representing her native homeland. This ability functions as the ranger class feature, and the true primitive's bonuses in that terrain improve by +2 at 5th level and every five levels thereafter. However, she does not gain any additional favored terrains. This ability replaces fast movement."
import_trades = ["Fast movement"]

[[entry.feature]]
anchor = "trophy-fetish"
head = "Trophy Fetish (Ex)"
listed = true
print = "A true primitive collects teeth, bones, hair, and other trophies from vanquished enemies, representing their power and strength. At 3rd level, a true primitive can attach a trophy fetish to one of the traditional true primitive weapons listed above. When wielding that weapon, the true primitive gains a +1 morale bonus on damage rolls. Furthermore, if that weapon has the [fragile](ref/misc/fragile) property, once per day, the true primitive can ignore the effects of a single natural 1 roll. A trophy fetish can also be attached to a suit of hide or bone armor, granting the true primitive a +1 morale bonus on saving throws. Furthermore, if that armor has the fragile property, once per day, the true primitive can chose not to have the armor break on the confirmation of a critical hit made against her. Every five levels beyond 3rd, a true primitive can use an additional trophy fetish. Multiple trophy fetishes can be attached to the same armor or weapon; their effects stack. A trophy fetish can be sundered ([hardness](ref/umr/hardness) 5, 1 hit point) but is not damaged by area attacks or attacks that do not specifically target it. It has no effect if attached to other types of weapons or armor. This ability replaces trap sense."
import_trades = ["Trap sense"]

[[entry.feature]]
anchor = "rage-powers"
head = "Rage Powers"
listed = false
print = "The following rage powers complement the true primitive archetype: [animal fury](ref/ragepower/animal-fury), [eater of magic](ref/ragepower/eater-of-magic), [ghost rager](ref/ragepower/ghost-rager), [low-light vision](ref/ragepower/low-light-vision), [night vision](ref/ragepower/night-vision), [primal scent](ref/ragepower/primal-scent), [scent](ref/ragepower/scent), [spell sunder](ref/ragepower/spell-sunder), [sunder enchantment](ref/ragepower/sunder-enchantment), [superstition](ref/ragepower/superstition), and [witch hunter](ref/ragepower/witch-hunter)\\*."

[[entry]]
id = "ref/arc-barbarian/urban-barbarian"
opening = ["Every barbarian knows that city life can soften the spirit and the body, but some barbarians take on the trappings and ways of their adoptive homes and bend their savage powers to its challenges. While these urban barbarians' rough edges are smoothed into civility, they can use their primal nature and upbringing to move with the ebb and flow of civilization's natural rhythms."]

[[entry.feature]]
anchor = "weapon-and-armor-proficiency"
head = "Weapon and Armor Proficiency"
listed = false
print = "An urban barbarian is not proficient with medium armor."

[[entry.feature]]
anchor = "skills"
head = "Skills"
listed = true
print = "An urban barbarian does not gain Handle Animal (Cha), Knowledge (nature) (Int), or Survival (Wis) as class skills; instead, she gains Diplomacy (Cha), Knowledge (local) (Int), Knowledge (nobility) (Int), Linguistics (Int), and Profession (Wis) as class skills."

[[entry.feature]]
anchor = "crowd-control"
head = "Crowd Control (Ex)"
listed = true
level = 1
print = "At 1st level, an urban barbarian gains a +1 bonus on attack rolls and a +1 dodge bonus to AC when adjacent to two or more enemies. In addition, her movement is not impeded by [crowds](ref/rule/city-streets), and she gains a bonus equal to 1/2 her barbarian level on Intimidate checks to influence crowds. This ability replaces fast movement."
import_trades = ["Fast movement"]

[[entry.feature]]
anchor = "controlled-rage"
head = "Controlled Rage (Ex)"
listed = true
print = "When an urban barbarian rages, instead of making a normal rage she applies a +4 morale bonus to her Strength, Dexterity, or Constitution. This bonus increases to +6 when she gains greater rage and +8 when she gains mighty rage. She may apply the full bonus to one ability score or may split the bonus between several scores in increments of +2. When using a controlled rage, an urban barbarian gains no bonus on Will saves, takes no penalties to AC, and can still use Intelligence-, Dexterity-, and Charisma-based skills. This ability otherwise follows the normal rules for rage. This ability alters rage."
import_trades = ["Rage"]

[[entry.feature]]
anchor = "rage-powers"
head = "Rage Powers"
listed = false
print = "The following rage powers complement the urban barbarian archetype: [boasting taunt](ref/ragepower/boasting-taunt)\\*, [clear mind](ref/ragepower/clear-mind), [deadly accuracy](ref/ragepower/deadly-accuracy), [guarded stance](ref/ragepower/guarded-stance), [intimidating glare](ref/ragepower/intimidating-glare), [lethal accuracy](ref/ragepower/lethal-accuracy), [no escape](ref/ragepower/no-escape), [quick reflexes](ref/ragepower/quick-reflexes), [perfect clarity](ref/ragepower/perfect-clarity), [sharpened accuracy](ref/ragepower/sharpened-accuracy), [surprise accuracy](ref/ragepower/surprise-accuracy), and [unexpected strike](ref/ragepower/unexpected-strike)."

[[entry]]
id = "ref/arc-barbarian/wild-rager"
opening = ["Rages are barely controlled, but there are those who wholly give in to their more savage side, letting their rages take them to a confusing and uncontrolled place of terrible savagery. These barbarians become beasts, consumed with absolute bloodlust to the point where they cannot tell friend from foe."]

[[entry.feature]]
anchor = "uncontrolled-rage"
head = "Uncontrolled Rage (Ex)"
listed = true
print = "A wild rager's rage functions as normal, except that when she reduces a creature to 0 or fewer hit points, she must attempt a Will save (DC 10 + 1/2 the barbarian's level + the barbarian's Constitution modifier) or become confused. For the remainder of her current turn, she attacks the nearest creature other than herself. On the following round, refer to the _[confusion](ref/spell/confusion)_ spell to determine her actions. At the end of this round, and each round thereafter, she can attempt a new saving throw to end the _confusion_ effect. The rounds during which she is confused do not count against the rounds she has spent raging that day, but she cannot end her rage voluntarily, nor can she use rage powers while confused."

[[entry.feature]]
anchor = "wild-fighting"
head = "Wild Fighting (Ex)"
listed = true
level = 2
print = "At 2nd level, even when not raging, wild ragers often fight with reckless, savage abandon. A wild rager using the [full-attack](ref/rule/full-attack) action can make one extra attack per round at her highest base attack bonus. Until the beginning of her next turn, however, she takes a -2 penalty on attack rolls and -4 penalty to AC. This ability replaces uncanny dodge."
import_trades = ["Uncanny dodge"]

[[entry.feature]]
anchor = "rage-conversion"
head = "Rage Conversion (Ex)"
listed = true
level = 5
print = "At 5th level, a wild rager who fails a saving throw against any mind-affecting effect can attempt a new saving throw at the beginning of her next turn. If the save succeeds, that effect ends and she instead rages and becomes confused as noted above. This ability replaces improved uncanny dodge."
import_trades = ["Improved uncanny dodge"]

[[entry.feature]]
anchor = "rage-powers"
head = "Rage Powers"
listed = false
print = "The following rage powers complement the wild rager archetype: [animal fury](ref/ragepower/animal-fury), bloody blow, [body bludgeon](ref/ragepower/body-bludgeon), [brawler](ref/ragepower/brawler)\\*, [crippling blow](ref/ragepower/crippling-blow), [greater brawler](ref/ragepower/greater-brawler)\\*, [intimidating glare](ref/ragepower/intimidating-glare), [mighty swing](ref/ragepower/mighty-swing), [no escape](ref/ragepower/no-escape), [powerful blow](ref/ragepower/powerful-blow), and [quick reflexes](ref/ragepower/quick-reflexes)."

[[entry]]
id = "ref/arc-bard/archaeologist"
opening = ["No stodgy researcher, this archaeologist meets his research head-on in the field. Archaeologists sacrifice the bard's inspirational performance for a smattering of rogue talents. This archetype also fits roguelike characters that focus more on learning than on stabbing foes in the back."]

[[entry.feature]]
anchor = "bardic-performance"
head = "Bardic Performance"
listed = true
print = "Archaeologists do not gain the bardic performance ability or any of its performance types."

[[entry.feature]]
anchor = "archaeologist-s-luck"
head = "Archaeologist's Luck (Ex)"
listed = true
print = "Fortune favors the archaeologist. As a swift action, an archaeologist can call on fortune's favor, giving him a +1 luck bonus on attack rolls, saving throws, skill checks, and weapon damage rolls. He can use this ability for a number of rounds per day equal to 4 + his Charisma modifier. Maintaining this bonus is a free action, but it ends immediately if the archaeologist is killed, paralyzed, stunned, knocked unconscious, or otherwise prevented from taking a free action to maintain it each round. Archaeologist's luck is treated as bardic performance for the purposes of feats, abilities, effects, and the like that affect bardic performance. Like bardic performance, it cannot be maintained at the same time as other performance abilities. This bonus increases to +2 at 5th level, +3 at 11th level, and +4 at 17th level."

[[entry.feature]]
anchor = "clever-explorer"
head = "Clever Explorer (Ex)"
listed = true
level = 2
print = "At 2nd level, an archaeologist gains a bonus equal to [half](ref/misc/fractions-and-rounding) his class level on Disable Device and Perception checks. He can disable intricate and complex devices in half the normal amount of time (minimum 1 round) and open a lock as a standard action. At 6th level, an archaeologist can take 10 on Disable Device checks, even if distracted or endangered, and can disarm magical traps. This ability replaces the versatile performance ability."
import_trades = ["Versatile performance"]

[[entry.feature]]
anchor = "uncanny-dodge"
head = "Uncanny Dodge (Ex)"
listed = true
level = 2
print = "At 2nd level, an archaeologist gains [uncanny dodge](ref/ability/uncanny-dodge), as the rogue class feature of the same name. This ability replaces well-versed."
import_trades = ["Well-versed"]

[[entry.feature]]
anchor = "trap-sense"
head = "Trap Sense (Ex)"
listed = true
level = 3
print = "At 3rd level, an archaeologist gains [trap sense](ref/ability/trap-sense) +1, as the rogue class feature of the same name. This bonus improves by +1 for every three levels gained after 3rd, to a maximum of +6 at 18th level."

[[entry.feature]]
anchor = "rogue-talents"
head = "Rogue Talents"
listed = true
level = 4
print = "At 4th level, an archaeologist gains a rogue talent. He gains an additional rogue talent for every four levels of archaeologist gained after 4th level. Otherwise, this works as the rogue's rogue talent ability."

[[entry.feature]]
anchor = "evasion"
head = "Evasion (Ex)"
listed = true
level = 6
print = "At 6th level, an archaeologist gains [evasion](ref/ability/evasion), as the rogue ability of the same name."

[[entry.feature]]
anchor = "advanced-talent"
head = "Advanced Talent"
listed = true
level = 12
print = "At 12th level, and every four levels thereafter, an archaeologist can choose an advanced rogue talent in place of a rogue talent."

[[entry]]
id = "ref/arc-bard/daredevil"
opening = ["As quick at wordplay as at swordplay, daredevils are dashing heroes, inspiring their allies to match their clever repartee and acrobatic feats. Daredevils often lean toward comedy, dance, oratory, and singing."]

[[entry.feature]]
anchor = "agile"
head = "Agile (Ex)"
listed = true
print = "A daredevil adds [half](ref/misc/fractions-and-rounding) her class level (minimum 1) on Acrobatics, Bluff, Climb, and Escape Artist checks. This ability replaces bardic knowledge."
import_trades = ["Bardic knowledge"]

[[entry.feature]]
anchor = "bardic-performance"
head = "Bardic Performance"
listed = true
print = "A daredevil gains the following type of bardic performance."

[[entry.feature]]
anchor = "derring-do"
head = "Derring-do (Su)"
listed = true
print = "A daredevil can use her performance to bring out grace in the clumsiest allies. The daredevil and any allies who see her receive a +1 morale bonus on Reflex saving throws and a +2 competence bonus on Dexterity-based skill checks. Allies who move at least 10 feet during their turn gain a +1 dodge bonus to their Armor Class until the start of their next turn. At 5th level, and every six bard levels thereafter, the saving throw and Armor Class bonuses increase by +1, to a maximum of +4 at 17th level, and the skill check bonuses increase by +2, to a maximum of +8 at 17th level. This is a mind-affecting ability that uses visual components. This ability replaces inspire courage."
import_trades = ["Inspire courage"]

[[entry.feature]]
anchor = "canny-foe"
head = "Canny Foe (Ex)"
listed = true
level = 2
print = "At 2nd level, a daredevil can choose one type of [combat maneuver](ref/rule/combat-maneuvers). She gains a +2 bonus on her combat maneuver checks to attempt the chosen maneuver and to her CMD to resist that maneuver. At 6th level, and every four levels thereafter, the daredevil gains a +2 bonus for an additional type of combat maneuver. She may not choose the same maneuver twice. This ability replaces versatile performance."
import_trades = ["Versatile performance"]

[[entry.feature]]
anchor = "dauntless"
head = "Dauntless (Ex)"
listed = true
level = 2
print = "At 2nd level, a daredevil gains a +1 morale bonus on saving throws against mind-affecting effects, including all fear effects. This bonus increases by +1 for every four levels gained after 2nd level, to a maximum of +5 at 18th level. This ability replaces well-versed."
import_trades = ["Well-versed"]

[[entry.feature]]
anchor = "scoundrel-s-fortune"
head = "Scoundrel's Fortune (Ex)"
listed = true
level = 5
print = "At 5th level, once per day a daredevil can choose to roll two dice instead of one for any skill check, keeping the best result. She can use this ability one additional time per day for every three levels she possesses beyond 5th, to a maximum of six times per day at 20th level. This ability replaces lore master."
import_trades = ["Lore master"]

[[entry]]
id = "ref/arc-bard/dervish-dancer"
hold = "the alters trade `Bardic performance` is not printed in a sentence, and no listed feature of that name prints it; Battle Dance: the sentence \"This ability replaces bardic performance\" names no trade"
opening = ["Not all bards inspire others with their performances. Dervish dancers enter a near-mystical trance that allows them to push their bodies beyond normal limits."]

[[entry.feature]]
anchor = "weapon-and-armor-proficiency"
head = "Weapon and Armor Proficiency"
listed = false
print = "Dervish dancers gain weapon proficiency with the [scimitar](ref/eq-weapon/scimitar) and [kukri](ref/eq-weapon/kukri). This ability replaces their proficiency with the rapier and whip."
import_trades = ["Proficiency with the rapier", "whip"]

[[entry.feature]]
anchor = "battle-dance"
head = "Battle Dance"
listed = true
print = '''
A dervish dancer is trained in the use of the Perform skill, especially dance, to create magical effects on himself. This works like bardic performance, except the dervish dancer only affects himself, and does not need to be able to see or hear his own performance. Battle dancing is treated as bardic performance for the purposes of feats, abilities, effects, and the like that affect bardic performance, except that battle dancing does not benefit from the [Lingering Performance](ref/feat/lingering-performance) feat or any other ability that allows a bardic performance to grant bonuses after it has ended. Battle dancing benefits apply only when the bard is wearing light or no armor. Like bardic performance, it cannot be maintained at the same time as other performance abilities.

Starting a battle dance is a move action, but it can be maintained each round as a free action. Changing a battle dance from one effect to another requires the dervish dancer to stop the previous performance and start the new one as a move action. Like a bard, a dervish dancer's performance ends immediately if he is killed, paralyzed, stunned, knocked unconscious, or otherwise prevented from taking a free action each round. A dervish dancer cannot perform more than one battle dance at a time. At 10th level, a dervish dancer can start a battle dance as a swift action instead of a move action.

Dervish dancers gain the inspire courage, inspire greatness, and inspire heroics bardic performance types as battle dances, but these only provide benefit to the dervish dancer himself. This ability replaces bardic performance.'''
import_trades = ["Bardic performance"]

[[entry.feature]]
anchor = "rain-of-blows"
head = "Rain of Blows (Su)"
listed = true
level = 6
print = "At 6th level, a dervish dancer can speed up his attacks. When making a [full attack](ref/rule/full-attack) action, he may make one extra attack with any weapon he is holding, as though under the effects of a _[haste](ref/spell/haste)_ spell. He also gains a +1 bonus on attack rolls and a +1 dodge bonus to AC and on Reflex saves. At 9th level, and every three bard levels thereafter, these bonuses increase by +1, to a maximum of +5 at 18th level. These bonuses do not stack with the _[haste](ref/spell/haste)_ spell. This ability replaces suggestion and mass suggestion."
import_trades = ["Suggestion", "mass suggestion"]

[[entry.feature]]
anchor = "razor-s-kiss"
head = "Razor's Kiss (Su)"
listed = true
level = 8
print = "At 8th level, a dervish dancer can use his battle dance to improve his weapons' critical range. All attacks he makes with manufactured weapons are treated as though he had the [Improved Critical](ref/feat/improved-critical) feat. Natural weapons and spells are not affected. This ability replaces dirge of doom."
import_trades = ["Dirge of doom"]

[[entry.feature]]
anchor = "leaf-on-the-wind"
head = "Leaf on the Wind (Su)"
listed = true
level = 14
print = '''
At 14th level, a dervish dancer can use his battle dance to evade attacks with unearthly grace and to shake off the effects of his wounds. Unlike other battle dances, leaf on the wind requires a standard action each round to start or maintain the performance. Each round it is maintained, including the first, the dervish dancer

gains a +6 dodge bonus to Armor Class and on

Reflex saves. If wounded, he heals 1 hit point

of damage per bard level. This ability

replaces frightening performance.'''
import_trades = ["Frightening performance"]

[[entry.feature]]
anchor = "fleet"
head = "Fleet (Su)"
listed = true
print = '''
While performing a

battle dance, a dervish dancer

gains a +10 enhancement bonus

to his land speed. This bonus

increases by 5 feet for every

four bard levels gained after 1st

level, to a maximum of +30 feet

at 19th level. This ability replaces

bardic knowledge and lore master.'''
import_trades = ["Bardic knowledge", "lore master"]

[[entry.feature]]
anchor = "versatile-dance"
head = "Versatile Dance (Ex)"
listed = true
level = 2
print = '''
At 2nd level, a dervish dancer

gains a bonus equal to [half](ref/misc/fractions-and-rounding) his level on Perform

(dance) checks. He can use his bonus for his Perform

(dance) skill in place of his bonus for Acrobatics. This

ability replaces versatile performance.'''
import_trades = ["Versatile performance"]

[[entry.feature]]
anchor = "dance-of-fury"
head = "Dance of Fury (Su)"
listed = true
level = 12
print = '''
At 12th level, a dervish dancer

can attack more than once as he moves while

performing a battle dance. He can combine a full-

attack action with a single move, taking the attacks

at any point during his movement, but must move

at least 5 feet between each attack. This movement

provokes attacks of opportunity as normal. This

ability replaces soothing performance.'''
import_trades = ["Soothing performance"]

[[entry.feature]]
anchor = "battle-fury"
head = "Battle Fury (Su)"
listed = true
level = 20
print = '''
At 20th level, the

dervish dancer can unleash a whirlwind

of blows while performing a battle dance.

As a full-round action, he can take a single

move action and unleash a single attack

at his highest bonus against each target

within his reach during any point of

his move, up to a maximum number of

attacks equal to the dervish dancer's

character level. This movement

provokes attacks of opportunity

as normal, and replaces

deadly performance.'''
import_trades = ["Deadly performance"]

[[entry]]
id = "ref/arc-cavalier/beast-rider"
opening = ["The cavalier is defined not only by his dedication to his order or his skill on the battlefield, but also by the special relationship he maintains with his mount. Where some cavaliers are simply skilled with horses or well-trained knights, the beast rider spends his life in constant pursuit of the most perfect mount, forming bonds with greater, more powerful, and more exotic creatures."]

[[entry.feature]]
anchor = "armor-proficiency"
head = "Armor Proficiency"
listed = true
print = "A beast rider is proficient with light and medium armor, and with shields (with the exception of tower shields)."

[[entry.feature]]
anchor = "exotic-mount"
head = "Exotic Mount (Ex)"
listed = true
level = 1
print = '''
At 1st level, a beast rider forms a bond with a strong, loyal companion that permits him to ride it as a mount. This mount functions as a druid's [animal companion](ref/sidekick/animal-companion), using the beast rider's level as his effective druid level. The animal chosen as a mount must be large enough to carry the beast rider (Medium or Large for a Small character; Large or Huge for a Medium character).

The beast rider does not take an armor check penalty on [Ride](ref/skill/ride) checks while riding his mount. The mount is always considered combat trained, and begins play with [Endurance](ref/feat/endurance) as a bonus feat. A beast rider's mount does not gain the share spells special ability.

Each time the beast rider increases in level, he can choose to select a new, more impressive mount better suited to his increased power.

Small-sized beast riders can choose a pony or wolf mount at 1st level. At 4th level, a Small beast rider can also choose an allosaurus, ankylosaurus, arsinoitherium, aurochs, bison, boar, brachiosaurus, elephant, glyptodon, hippopotamus, mastodon, megaloceros, riding dog, snapping turtle (giant), triceratops, or tyrannosaurus. At 7th level, he can also choose a dinosaur (deinonychus or velociraptor).

Medium beast riders can choose a camel or horse mount at 1st level. At 4th level, a Medium beast rider can also choose an allosaurus, ankylosaurus, arsinoitherium, aurochs, bison, brachiosaurus, elephant, glyptodon, hippopotamus, lion, mastodon, megaloceros, snapping turtle (giant), tiger, triceratops, or tyrannosaurus as

his mount. Additional mounts might be

available with GM approval.

In addition, a 7th-level or higher Medium

beast rider can select any other creature whose

natural size is Large or Huge, provided that creature is normally available as a Medium-sized animal companion at 7th level (like a bear). To generate statistics for such a mount, apply the following modifications: Size Large; Ability Scores Str +2, Dex -2, Con +2. Increase the damage of each of the mount's natural attacks by one die size. A beast rider cannot choose a mount that is not capable of bearing his weight, that has fewer than four legs, or that has a fly speed (although the GM may allow mounts with a swim speed in certain environments).

Anytime a feat or ability allows a mount to make a hoof attack, it can make a claw, slam, or other analogous attack instead.

This ability replaces the standard cavalier's mount and expert trainer abilities.'''
import_trades = ["Mount", "expert trainer"]

[[entry]]
id = "ref/arc-cavalier/emissary"
opening = ["Cavaliers serve many roles on the battlefield, from bold leaders and shock troops to dashing knights and mounted juggernauts. Some cavaliers, however, focus more on speed and mobility than they do on the raw power of the mounted charge. On foot or in the saddle, the emissary is usually first to meet the enemy, with a pointed lance, a drawn sword, or terms for surrender."]

[[entry.feature]]
anchor = "armor-proficiency"
head = "Armor Proficiency"
listed = true
print = "An emissary does not gain proficiency with heavy armor."

[[entry.feature]]
anchor = "bonus-feats"
head = "Bonus Feats"
listed = false
print = "An emissary can select [Endurance](ref/feat/endurance), [Fleet](ref/feat/fleet), or [Run](ref/feat/run) in addition to the list of combat feats whenever he gains a bonus feat."

[[entry.feature]]
anchor = "in-or-out-of-the-saddle"
head = "In or Out of the Saddle (Ex)"
listed = true
level = 1
print = "At 1st level, an emissary gains [Mounted Combat](ref/feat/mounted-combat) as a bonus feat. In addition, he can move at normal speed when wearing medium armor. This ability replaces tactician."
import_trades = ["Tactician"]

[[entry.feature]]
anchor = "battlefield-agility"
head = "Battlefield Agility (Ex)"
listed = true
level = 5
print = "At 5th level, an emissary learns to be more aware of the threats that surround him in combat, and shares this awareness with his loyal steed. Both the emissary and his mount gain [Mobility](ref/feat/mobility) as a bonus feat. This ability replaces banner."
import_trades = ["Banner"]

[[entry.feature]]
anchor = "mounted-acrobatics"
head = "Mounted Acrobatics (Ex)"
listed = true
level = 9
print = "At 9th level, an emissary is even more adept at hopping on and off his steed, and even dropping alongside its flanks mid-gallop. He gains [Trick Riding](ref/feat/trick-riding) as a bonus feat, even if he does not meet the prerequisites. The emissary can employ this feat even when wearing medium armor. This ability replaces greater tactician."
import_trades = ["Greater tactician"]

[[entry.feature]]
anchor = "mounted-dervish"
head = "Mounted Dervish (Ex)"
listed = true
level = 14
print = "At 14th level, an emissary becomes a fearsome, mobile foe on the battlefield. He gains [Mounted Skirmisher](ref/feat/mounted-skirmisher) as a bonus feat, even if he does not meet the prerequisites. In addition, whenever the emissary is mounted and takes the [charge](ref/rule/charge) action, he adds 10 feet to his mount's speed. This ability replaces greater banner."
import_trades = ["Greater banner"]

[[entry.feature]]
anchor = "erratic-charge"
head = "Erratic Charge (Ex)"
listed = true
level = 20
print = "At 20th level, an emissary learns to ride through the thick of combat, striking and then moving away with blinding speed. Whenever the emissary is mounted and takes the [charge](ref/rule/charge) action, he can first move 10 feet and make a melee attack. This first attack is not a charge, but a regular melee attack, and the movement counts toward the total allowed movement for the round. After making this attack, the emissary must still move in a straight line to reach the target of his charge, and he takes a -5 penalty on the attack roll for the attack at the end of his charge. This ability replaces supreme charge."
import_trades = ["Supreme charge"]

[[entry]]
id = "ref/arc-cavalier/gendarme"
hold = "the replaces trade `cavalier bonus feats` is not printed in a sentence, and no listed feature of that name prints it"
opening = ["The gendarme cares less for the finer points of tactical precision than he does for the exhilaration of the charge: the rush of wind through the visor of his helmet, the feel of his couched lance, the satisfying shriek of armor giving way before his weapon's force as the point drives past metal into his foes."]

[[entry.feature]]
anchor = "bonus-feats"
head = "Bonus Feats"
listed = false
print = "A gendarme trains to be a mounted terror, almost to the exclusion of all other abilities. He gains bonus feats at 1st level, 5th level, and then every three levels thereafter, but must select these bonus feats from the following list: [Improved Bull Rush](ref/feat/improved-bull-rush), [Mounted Combat](ref/feat/mounted-combat), [Power Attack](ref/feat/power-attack), [Ride-By Attack](ref/feat/ride-by-attack), [Spirited Charge](ref/feat/spirited-charge), [Spring Attack](ref/feat/spring-attack), and [Unseat](ref/feat/unseat). If the gendarme has already selected all of the listed feats, then he may select his bonus feats from those feats listed as combat feats. This ability replaces tactician, greater tactician, and master tactician, and alters the standard cavalier's selection of bonus feats."
import_trades = ["Tactician", "greater tactician", "master tactician", "cavalier bonus feats"]

[[entry.feature]]
anchor = "transfixing-charge"
head = "Transfixing Charge (Ex)"
listed = true
level = 20
print = "At 20th level, a gendarme represents the epitome of mounted combat. Whenever he makes a [charge](ref/rule/charge) attack while mounted, he deals triple the normal damage (quadruple if using a [lance](ref/eq-weapon/lance)); this damage includes all increases from the Spirited Charge feat and from the use of a lance. In addition, if the gendarme confirms a critical hit on a charge attack while mounted, the attack deals maximum damage for the weapon wielded. Additional damage from weapon properties, magic effects, precision-based bonuses, or other increases are rolled normally. This ability replaces supreme charge."
import_trades = ["Supreme charge"]

[[entry]]
id = "ref/arc-cavalier/honor-guard"
opening = ["Certain cavaliers are trained not as advance combatants, but as loyal guards, standing as firm defenders in the face of threats to their chosen charge. These honor guards are sometimes merely ornamental, performing their functions on a ceremonial basis, but a surprising number are capable, deadly opponents, able to take down a threat long before their liege knows of the danger. To be an honor guard is to constantly place one's self in harm's way, and to always be willing to lay down one's life at a moment's notice."]

[[entry.feature]]
anchor = "sworn-defense"
head = "Sworn Defense (Ex)"
listed = true
level = 1
print = "At 1st level, whenever an honor guard issues a challenge, he can select one ally as his ward for the duration of the challenge. Whenever the honor guard is adjacent to his ward, he takes a -1 penalty to Armor Class, and the ward receives a +1 dodge bonus to AC. This modifies the challenge ability"
import_trades = ["Challenge"]

[[entry.feature]]
anchor = "intercept"
head = "Intercept (Ex)"
listed = true
level = 3
print = "At 3rd level, an honor guard learns to better disrupt the attacks of his enemies. He gains [Bodyguard](ref/feat/bodyguard) as a bonus feat, even if he does not meet the prerequisite. In addition, whenever the honor guard uses the [aid another](ref/rule/aid-another-2) action to increase an ally's Armor Class, the bonus to Armor Class granted by the aid another action increases by +1. This ability replaces cavalier's charge."
import_trades = ["Cavalier's charge"]

[[entry.feature]]
anchor = "warding-charge"
head = "Warding Charge (Ex)"
listed = true
level = 11
print = "At 11th level, an honor guard can flash across the battlefield to protect his ward against the target of his challenge. Whenever the target of the honor guard's challenge makes an attack against his ward, the honor guard can move up to his speed and make a single melee attack against the target of his challenge as an immediate action. This movement and attack can be made as a [charge](ref/rule/charge) if the movement qualifies. This ability replaces mighty charge."
import_trades = ["Mighty charge"]

[[entry.feature]]
anchor = "defensive-challenge"
head = "Defensive Challenge (Ex)"
listed = true
level = 12
print = "At 12th level, whenever an honor guard declares a challenge, his target must pay particular attention to him and his ability to intercept attacks. As long as the target is within the threatened area of the cavalier, it takes a -2 penalty on attack rolls against anyone other than the honor guard. This ability replaces demanding challenge."
import_trades = ["Demanding challenge"]

[[entry]]
id = "ref/arc-cavalier/luring-cavalier"
opening = ["Those who study the perfection of strategy and tactics know that picking the battlefield can grant advantages that only overwhelming numbers of allies can eclipse. The luring cavalier is a special type of cavalier that helps accomplish that goal. Typically, he uses a bow or other ranged weapon to lure opponents toward him, and then makes strategic retreats to position his enemies exactly where he wants them."]

[[entry.feature]]
anchor = "far-challenge"
head = "Far Challenge (Ex)"
listed = true
print = '''
Once per day, a luring cavalier can use his far challenge ability as a swift action. When he does, the luring cavalier chooses one target within sight to challenge. The luring cavalier's ranged attacks deal extra damage whenever the attacks are made against the target of his challenge. This extra damage is equal to the luring cavalier's level. The luring cavalier can use this ability once per day at 1st level, plus one additional time per day for every three levels beyond 1st, to a maximum of seven times per day at 19th level. Furthermore, once per day, the luring cavalier may spend a use of his far challenge ability to double the potential extra damage of his ranged attack. Before making the attack roll, he can choose to spend a use of his challenge to deal twice his cavalier level in extra damage on a successful hit instead of just his cavalier level in extra damage. If the attack misses, the use of the challenge is wasted.

Challenging a foe requires subtle deceits and strategies. The cavalier must make it look like he is a soft target. The subject of the far challenge gains a +4 bonus on attack rolls made against him.

This challenge remains in effect until the target is dead or unconscious, until the target hits the luring cavalier with a melee attack, or until the combat ends. If this challenge ends because the target hits the luring cavalier with a melee attack, this challenge changes to the effects of the normal cavalier challenge, and gains any order benefit the luring cavalier has. Far challenge replaces the challenge ability.'''
import_trades = ["Challenge"]

[[entry.feature]]
anchor = "careful-aim"
head = "Careful Aim (Ex)"
listed = true
level = 3
print = "At 3rd level, when a luring cavalier makes a ranged attack with his highest base attack bonus, he can ignore the penalties for firing up to three range increments away. If he is using a firearm, he can target touch AC up to two range increments away. This effect stacks with effects that allow the cavalier to make ranged attacks farther without penalty or that allow him to target touch AC with a firearm beyond the first range increment. This ability replaces cavalier's charge."
import_trades = ["Cavalier's charge"]

[[entry.feature]]
anchor = "infuriating-aim"
head = "Infuriating Aim (Ex)"
listed = true
level = 11
print = "At 11th level, when a luring cavalier confirms a critical hit with a ranged attack made at his highest base attack bonus against the target of a far challenge, the target becomes infuriated for 1 round. While infuriated, the target must spend its turn moving closer to the cavalier, making move, [run](ref/rule/run), or [charge](ref/rule/charge) actions only (challenged creature's choice). This is a mind-affecting effect. This ability replaces mighty charge."
import_trades = ["Mighty charge"]

[[entry.feature]]
anchor = "versatile-challenge"
head = "Versatile Challenge (Ex)"
listed = true
level = 12
print = "At 12th level, a luring cavalier can expend a use of his challenge to gain the benefit of far challenge or the normal cavalier challenge. He can even change the type of challenge an opponent is under the effects of as a swift action, as long as the target of the challenge is within line of sight. This ability replaces demanding challenge."
import_trades = ["Demanding challenge"]

[[entry.feature]]
anchor = "supreme-aim"
head = "Supreme Aim (Ex)"
listed = true
level = 20
print = "At 20th level, the luring cavalier gains the careful aim bonus and the effect of infuriating aim on all ranged attacks. This ability replaces supreme charge."
import_trades = ["Supreme charge"]

[[entry]]
id = "ref/arc-cavalier/musketeer"
opening = ["Some cavaliers are entrusted by their masters with the care and use of expensive and powerful oddities—firearms. Capable of inf licting shocking amounts of destruction without the aid of magic, these musketeers lead the advance of their troops, firing devastating fusillades long before the enemy can prepare for the armed charge that follows."]

[[entry.feature]]
anchor = "weapon-and-armor-proficiency"
head = "Weapon and Armor Proficiency"
listed = false
print = "A musketeer does not gain proficiency in heavy armor. Musketeers are proficient with all simple and martial weapons, and with firearms. A cavalier's levels stack with any fighter levels he possesses for the purpose of meeting the level prerequisite for feats that specifically select a firearm, such as [Weapon Specialization](ref/feat/weapon-specialization)."

[[entry.feature]]
anchor = "gifted-firearm"
head = "Gifted Firearm (Ex)"
listed = true
level = 1
print = '''
At 1st level, a musketeer is gifted by his order with a firearm (either a [pistol](ref/eq-weapon/pistol) or a [musket](ref/eq-weapon/musket)). This weapon is both a symbol of the cavalier's duty and a focus for much of his talent. He cannot sell this weapon. He also gains the [Gunsmithing](ref/feat/gunsmithing) feat.

Beginning at 8th level, the musketeer can focus himself when wielding his gifted weapon. As a standard action, he can focus himself to gain a number of benefits for 1 minute per cavalier level. The musketeer can use this ability twice per day, plus one additional time per day for every four levels beyond 8th, to a total of five times per day at 20th level.

At 8th level, the cavalier gains the benefit of the [Improved Critical](ref/feat/improved-critical) feat. At 11th level, he can reduce the misfire chance of his weapon by 1 (to a minimum of 1), and at 17th level, the musketeer can double the range increment of his weapon. The reduction of the weapon's misfire chance and the doubled range increment abilities don't stack with the similar benefits of the _[reliable](ref/magic-enh/reliable)_ and _[distance](ref/magic-enh/distance)_ magic weapon special abilities.

Finally, at 20th level, during a period of such focus, the musketeer can engage in a flurry of gunfire. The cavalier can expend one of his daily challenges to make a [full attack](ref/rule/full-attack) with his firearm. The musketeer ignores the normal load times for his weapon, but must still expend enough doses of powder and enough bullets to complete each attack.

If the musketeer's gifted firearm is destroyed, the cavalier loses this ability for 30 days while a replacement weapon is crafted for him. During this 30-day period, the musketeer takes a -1 penalty on weapon and damage rolls. This ability replaces the standard cavalier's mount ability.'''
import_trades = ["Mount"]

[[entry.feature]]
anchor = "swift-powder"
head = "Swift Powder (Ex)"
listed = true
level = 4
print = "At 4th level, the musketeer gains [Rapid Reload](ref/feat/rapid-reload) (musket) or Rapid Reload (pistol) as a bonus feat. At 14th level, each time the musketeer issues a challenge, he may reload a wielded firearm as a free action. This ability replaces expert trainer."
import_trades = ["Expert trainer"]

[[entry]]
id = "ref/arc-cavalier/standard-bearer"
opening = ["Not all cavaliers are content to ride at the head of a charge, leading from the front and facing down their enemies directly. Some prefer to stand away from the fray, their banners a beacon shining brightly over the battlefield, rallying their troops to victory. The standard bearer employs the banner of his order, his lord, or his own house to raise the spirits of his allies and warns enemies of impending doom."]

[[entry.feature]]
anchor = "banner"
head = "Banner (Ex)"
listed = true
level = 1
print = "At 1st level, a standard bearer gains the banner ability. This ability is identical to the standard cavalier's banner ability, except that the morale bonuses on saving throws against fear effects and on attack rolls made as part of a charge increase at 5th level, and every five levels thereafter. This ability replaces the standard cavalier's mount ability."
import_trades = ["Mount"]

[[entry.feature]]
anchor = "mount"
head = "Mount (Ex)"
listed = true
level = 5
print = "At 5th level, a standard bearer gains the service of a loyal and trusted mount. This mount is identical in all ways to the standard cavalier's mount. This ability replaces the standard cavalier's banner ability."
import_trades = ["Banner"]

[[entry.feature]]
anchor = "banner-of-solace"
head = "Banner of Solace (Ex)"
listed = true
level = 11
print = "At 11th level, a standard bearer's banner becomes an even more potent symbol of protection and inspiration to those around him. Once per day, while his banner is displayed, the standard bearer can wave it through the air as a full-round action, granting all allies within 60 feet [temporary hit points](ref/rule/temporary-hit-points) equal to 1/2 his cavalier level, and a +2 morale bonus on their next damage rolls. At 15th level, and every four levels thereafter, this bonus increases by +1 (to a maximum of +4 at 19th level). The temporary hit points last for 10 minutes or until depleted, whichever occurs first. This ability replaces mighty charge."
import_trades = ["Mighty charge"]

[[entry.feature]]
anchor = "awesome-pennon"
head = "Awesome Pennon (Ex)"
listed = true
level = 20
print = "At 20th level, a standard bearer's banner has become a powerful rallying point to his allies, and a bane to his foes. Whenever his banner is visible, allies of the standard bearer within 60 feet gain a +1 morale bonus on attack rolls, immunity to fear effects, and a +3 morale bonus on saving throws against mind-affecting effects. This ability replaces supreme charge."
import_trades = ["Supreme charge"]

[[entry]]
id = "ref/arc-cavalier/strategist"
opening = ["Some cavaliers make a lifelong mission out of their exceptional ability to direct troops on the battlefield, combining tactical insight with a preternatural skill at improving the teamwork of their allies in order to win the day. Such strategists are masters at learning the strengths and weaknesses of those they fight alongside, and at employing those observations at the most opportune moments. The best of them are also skilled at determining the strengths and weaknesses of their enemies, as well as at countering some of those strengths with their own formidable abilities."]

[[entry.feature]]
anchor = "tactician"
head = "Tactician (Ex)"
listed = true
print = "As the cavalier class feature, except that a strategist can use this ability once per day at 1st level, plus one additional time per day at 5th level and for every four levels thereafter (to a maximum of five times per day at 17th level)."
import_trades = ["Tactician"]

[[entry.feature]]
anchor = "drill-instructor"
head = "Drill Instructor (Ex)"
listed = true
level = 4
print = "At 4th level, a strategist learns to train his fellow adventurers in the nuances of squad combat. By spending 10 minutes and expending 1 use of his challenge ability, the strategist can grant the use of a teamwork feat that he knows to up to four of his allies, similar to the tactician ability. As with tactician, allies need not meet the prerequisites of the granted feat, but they retain the use of this feat for 10 minutes plus 1 minute for every two levels the cavalier possesses, as long as the cavalier is visible and can be heard by his allies. If the cavalier falls unconscious or cannot be both seen and heard, his allies lose the benefit of the granted feat until the condition is remedied. This ability replaces expert trainer."
import_trades = ["Expert trainer"]

[[entry.feature]]
anchor = "tactical-advantage"
head = "Tactical Advantage (Ex)"
listed = true
level = 14
print = "At 14th level, whenever a strategist uses his tactician ability to grant the use of a teamwork feat to his allies, he can move up to his speed as a free action either before or after granting the feat. This movement provokes attacks of opportunity normally. This ability replaces greater banner."
import_trades = ["Greater banner"]

[[entry.feature]]
anchor = "strategic-supremacy"
head = "Strategic Supremacy (Ex)"
listed = true
level = 18
print = "At 18th level, a strategist gains the ability not only to improve his allies' abilities, but also to disrupt the teamwork of his enemies. Whenever the strategist uses the tactician ability, he can choose to cancel out the effects of one teamwork feat employed by any of his opponents within 30 feet instead of granting the use of a teamwork feat to his allies. This ability replaces the cavalier's 18th-level bonus feat."
import_trades = ["The cavalier's 18th-level bonus feat"]

[[entry]]
id = "ref/arc-cleric/crusader"
opening = ["Crusaders serve the militant arm of a church, ready to stand guard over the religion's holy places and to be its swift, avenging arm against those who resist its truth."]

[[entry.feature]]
anchor = "diminished-spellcasting"
head = "Diminished Spellcasting"
listed = true
print = "A crusader chooses only one domain and gains one fewer spell of each level than normal. If this reduces the number to 0, she may cast spells of that level only if they are domain spells or if her Wisdom allows [bonus spells](ref/rule/determine-bonuses) of that level."
import_trades = ["Domain", "spellcasting"]

[[entry.feature]]
anchor = "bonus-feat"
head = "Bonus Feat"
listed = true
print = "A crusader gains a bonus feat at 1st level, then again at 5th level and every five levels thereafter (to a maximum of five at 20th level). These bonus feats must be chosen from the following list: [Heavy Armor Proficiency](ref/feat/armor-proficiency-heavy), [Improved Shield Bash](ref/feat/improved-shield-bash), [Martial Weapon Proficiency](ref/feat/martial-weapon-proficiency), [Saving Shield](ref/feat/saving-shield), [Shield Focus](ref/feat/shield-focus), [Tower Shield Proficiency](ref/feat/tower-shield-proficiency), and [Weapon Focus](ref/feat/weapon-focus). At 10th level, a crusader may also choose from the following feats: [Exotic Weapon Proficiency](ref/feat/exotic-weapon-proficiency), [Greater Shield Focus](ref/feat/greater-shield-focus), [Greater Weapon Focus](ref/feat/greater-weapon-focus), [Improved Critical](ref/feat/improved-critical), [Shield Slam](ref/feat/shield-slam), [Shield Specialization](ref/feat/shield-specialization), and [Weapon Specialization](ref/feat/weapon-specialization). At 20th level, a crusader may also choose from the following feats: [Greater Shield Specialization](ref/feat/greater-shield-specialization) and [Greater Weapon Specialization](ref/feat/greater-weapon-specialization). Bonus feats marked with an asterisk (\\*) must be applied to the favored weapon of the crusader's deity. A crusader need not meet the normal class-or level-based prerequisites for these bonus feats."

[[entry.feature]]
anchor = "legion-s-blessing"
head = "Legion's Blessing (Su)"
listed = true
level = 8
print = "At 8th level, a crusader gains the ability to confer beneficial spells quickly to a large group of allies. As a full-round action, the crusader may confer the effects of a single harmless spell with a range of touch to a number of creatures equal to [half](ref/misc/fractions-and-rounding) her cleric level. The spell's range remains touch, so all intended recipients must be within the crusader's reach when the spell is cast. Using the legion's blessing expends the prepared spell, but it also requires the crusader to sacrifice another prepared spell three levels higher, as when spontaneously using a cure or inflict spell. The higher-level spell is not cast but is simply lost, its magical energy used to power the legion's blessing."

[[entry]]
id = "ref/arc-cleric/divine-strategist"
opening = ["The divine strategist leads the armies of the faithful, not from the front lines but through her clever strategy and tactical acumen."]

[[entry.feature]]
anchor = "domains"
head = "Domains"
listed = true
print = "A divine strategist gains only a single domain."

[[entry.feature]]
anchor = "master-tactician"
head = "Master Tactician (Ex)"
listed = true
print = "A divine strategist can always act in a surprise round even if she fails to make a Perception check to notice enemies, though she is considered [flat-footed](ref/rule/flat-footed) until she acts. In addition, the divine strategist gains a bonus on initiative checks equal to 1/2 her cleric level. At 20th level, a divine strategist's initiative roll is automatically a natural 20. Allies able to see and hear the divine strategist gain a bonus on initiative checks equal to 1/4 the divine strategist's level. This is a language-dependent ability. This ability replaces channel energy."
import_trades = ["Channel energy"]

[[entry.feature]]
anchor = "caster-support"
head = "Caster Support (Su)"
listed = true
print = "A divine strategist can use the [aid another](ref/rule/aid-another-2) action to assist another divine spellcaster, granting a +2 circumstance bonus on caster level checks and [concentration](ref/rule/concentration) checks until the beginning of the divine strategist's next turn. This bonus increases by +1 at 4th level and every four levels thereafter (to a maximum of +7 at 20th level). The allied caster must remain adjacent to the divine strategist to gain this benefit. Caster support can be used to assist arcane spellcasters or characters using magical items, but they gain only half the normal bonus."

[[entry.feature]]
anchor = "tactical-expertise"
head = "Tactical Expertise (Ex)"
listed = true
level = 8
print = "At 8th level, a divine strategist knows how to take best advantage of tactical opportunities. Whenever she is [flanking](ref/rule/flanking) or makes an attack of opportunity, she may add her Intelligence bonus (if any) as a bonus on the attack roll. In addition, once per day as a swift action she may add her Intelligence modifier as a bonus on any single d20 roll made as part of a [readied action](ref/rule/ready). She can use this ability one additional time per day for every two levels after 8th."

[[entry]]
id = "ref/arc-cleric/evangelist"
hold = "the replaces trade `The 1st-, 9th-, and 15th-level channel energy abilities` is not printed in a sentence, and no listed feature of that name prints it"
opening = ["The evangelist is the voice of her religion in the world. Where others nurture the faith among believers, an evangelist proclaims the coming glory of her deific patron and issues the clarion call to all around to heed the truth, or obey the call to war and crusade against the enemies of the church."]

[[entry.feature]]
anchor = "single-minded"
head = "Single-Minded"
listed = true
print = "An evangelist focuses her skills and learning on proclamation rather than the fine details of the church's deeper mysteries or martial training. Thus, she may select only one domain and does not gain Medium Armor Proficiency or Shield Proficiency."

[[entry.feature]]
anchor = "public-speaker"
head = "Public Speaker"
listed = true
print = "An evangelist gains [Perform](ref/skill/perform-any) as a class skill. In addition, she is trained to project her voice with great skill and effect; the DC to hear her speak in difficult conditions is reduced by an amount equal to her class level plus her Charisma modifier (minimum 0)."

[[entry.feature]]
anchor = "sermonic-performance"
head = "Sermonic Performance"
listed = true
print = "An evangelist gains the ability to deliver a select number of supernatural and spell-like performances through the force and power of her divinely inspired preaching and exhortation. This ability is similar in all respects to bardic performance as used by a bard of the same level (including interactions with feats, spells, and prestige classes), using Perform (oratory) as the evangelist's performance skill. However, an evangelist gains only the following types of bardic performance: [countersong](ref/performance/countersong), [fascinate](ref/performance/fascinate), and [inspire courage](ref/performance/inspire-courage) at 1st level; [inspire greatness](ref/performance/inspire-greatness) at 9th level; and [inspire heroics](ref/performance/inspire-heroics) at 15th level. Sermonic performance replaces the 1st-, 9th-, and 15th-level channel energy abilities. This caps the cleric's channel energy damage at 7d6 points."
import_trades = ["The 1st-", "9th-", "15th-level channel energy abilities"]

[[entry.feature]]
anchor = "spontaneous-casting"
head = "Spontaneous Casting"
listed = true
print = "An evangelist does not gain the ability to spontaneously cast cure or inflict spells by sacrificing prepared spells. However, an evangelist can spontaneously cast the following spells by sacrificing a prepared spell of the noted level or above: Spell Level Spontaneous Spell 1st level _command_ 2nd level _enthrall_ 3rd level _tongues_ 4th level _suggestion_ 5th level _greater command_ 6th level _geas/quest_ 7th level _mass suggestion_ 8th level _sympathy_ 9th level _demand_"
import_trades = ["Spontaneous casting"]

[[entry]]
id = "ref/arc-cleric/merciful-healer"
opening = ["The merciful healer is a master of battlefield revivification, sustaining and restoring allies to keep them in the fight."]

[[entry.feature]]
anchor = "willing-healer"
head = "Willing Healer"
listed = true
print = "A merciful healer must choose the [Healing](ref/domain/healing) domain. She does not gain a second domain. If the cleric worships a deity, that deity must be one that grants the Healing domain. A merciful healer must channel positive energy."

[[entry.feature]]
anchor = "channel-energy"
head = "Channel Energy (Su)"
listed = true
print = "As the cleric ability, save that a merciful healer must channel positive energy, and when she does, she cannot choose to target undead. This ability is otherwise identical to the cleric ability of the same name."
import_trades = ["Channel energy"]

[[entry.feature]]
anchor = "combat-medic"
head = "Combat Medic (Ex)"
listed = true
print = "A merciful healer does not provoke attacks of opportunity when using the Heal skill to stabilize another creature or casting healing spells."

[[entry.feature]]
anchor = "merciful-healing"
head = "Merciful Healing (Su)"
listed = true
level = 3
print = "At 3rd level, a merciful healer can channel positive energy to relieve one or more harmful conditions. The merciful healer chooses one of the following harmful conditions at 3rd level: [fatigued](ref/misc/fatigued), [shaken](ref/misc/shaken), or [sickened](ref/misc/sickened). When the merciful healer channels energy she can remove the chosen condition from one living creature that she heals within her channel energy burst. At 6th level, she can choose another condition. It can be one of those she didn't choose at 3rd level, or one of the following conditions: [dazed](ref/misc/dazed), diseased, or [staggered](ref/misc/staggered). She can remove the selected condition or the one she chose at 3rd level from up to two creatures within her channel energy burst. She gains another condition at 9th level, and can choose an above condition or one of the following conditions: cursed, [exhausted](ref/misc/exhausted), [frightened](ref/misc/frightened), [nauseated](ref/misc/nauseated), or poisoned. She can remove that condition, or a condition she previously chose, from one or two creatures within the burst. Finally, at 12th level, she can choose a lower-level condition or one of the following conditions: [blinded](ref/misc/blinded), [deafened](ref/misc/deafened), [paralyzed](ref/rule/paralyzed), or [stunned](ref/misc/stunned). She can remove that condition or one she previously chose from one, two, or three creatures within her channel energy burst. Feats and effects that affect a paladin's mercy also affect this ability."

[[entry.feature]]
anchor = "true-healer"
head = "True Healer (Su)"
listed = true
level = 8
print = "At 8th level, when a merciful healer uses channel energy, she can choose to apply the benefits of merciful healing or to reroll any 1s when determining how much damage she heals with channel energy. She must choose which benefit to take before she rolls to see how much damage she heals."

[[entry]]
id = "ref/arc-druid/ape-shaman"
opening = ["A shaman with this totem calls upon the mighty ape, a peaceful but powerful simian whose strength is beyond compare. An ape shaman is a friendly protector of the forest, but will crush those enemies who rouse her anger."]

[[entry.feature]]
anchor = "nature-bond"
head = "Nature Bond"
listed = true
print = "An [ape](ref/companion/ape) shaman who chooses an animal companion must select an ape or related primate. If choosing a domain, the ape shaman must choose from the [Animal](ref/domain/animal), Community (Family subdomain), [Destruction](ref/domain/destruction) (Rage subdomain), and Strength domains."
import_trades = ["Nature bond"]

[[entry.feature]]
anchor = "wild-empathy"
head = "Wild Empathy (Ex)"
listed = true
print = "An ape shaman can use wild empathy with apes and other primates as a full-round action with a +4 bonus."
import_trades = ["Wild empathy"]

[[entry.feature]]
anchor = "totem-transformation"
head = "Totem Transformation (Su)"
listed = true
level = 2
print = "At 2nd level, an ape shaman may adopt an aspect of the ape while retaining her normal form. The druid gains one of the following sets of bonuses and abilities: movement (climb speed 20 ft., +4 racial bonus on Climb checks), senses ([low-light vision](ref/rule/low-light-vision), [scent](ref/umr/scent)), [natural weapons](ref/umr/natural-attacks) (2 slams \\[1d6 for a Medium shaman\\], +2 on combat maneuver checks to [grapple](ref/rule/grapple)), or toughness (+2 natural armor bonus to AC, [Endurance](ref/feat/endurance) feat).\n\nWhile using totem transformation, the ape shaman may speak normally and can cast _[speak with animals](ref/spell/speak-with-animals)_ (primates only) at will. Using this ability is a standard action at 2nd level, a move action at 7th level, and a swift action at 12th level. The ape shaman can use this ability for a number of minutes per day equal to her druid level. These minutes do not need to be consecutive, but they must be used in 1-minute increments. This is a polymorph effect and cannot be used while the druid is using another polymorph effect, such as wild shape. This ability replaces woodland stride."
import_trades = ["Woodland stride"]

[[entry.feature]]
anchor = "totemic-summons"
head = "Totemic Summons (Su)"
listed = true
level = 5
print = "At 5th level, an ape shaman may cast _[summon nature's ally](ref/spell/summon-natures-ally)_ as a standard action when summoning primates, and these summoned creatures gain [temporary hit points](ref/rule/temporary-hit-points) equal to her druid level. She can apply the [young](ref/template/young) template to any primate to reduce the level of the summoning spell required by one. She can also increase the level of summoning required by one in order to apply either the [advanced](ref/template/advanced) or the [giant](ref/template/giant) template, or increase it by two to apply both the advanced and giant templates. This ability replaces a thousand faces."
import_trades = ["A thousand faces"]

[[entry.feature]]
anchor = "wild-shape"
head = "Wild Shape (Su)"
listed = true
level = 6
print = "At 6th level, an ape shaman's wild shape ability functions at her druid level -2. If she takes on the form of an ape, she instead uses her druid level +2."
import_trades = ["Wild shape"]

[[entry.feature]]
anchor = "bonus-feat"
head = "Bonus Feat"
listed = true
level = 9
print = "At 9th level and every four levels thereafter, an ape shaman gains one of the following bonus feats: [Diehard](ref/feat/diehard), [Endurance](ref/feat/endurance), [Great Fortitude](ref/feat/great-fortitude), [Improved Bull Rush](ref/feat/improved-bull-rush), and [Toughness](ref/feat/toughness). She must meet the prerequisites for these bonus feats. This ability replaces venom immunity."
import_trades = ["Venom immunity"]

[[entry]]
id = "ref/arc-druid/bat-shaman"
opening = ["The bat shaman's totem is the agile bat, flitting and turning with incredible speed through even the most convoluted mazes. Her enemies do not know when she will appear, and when she does, she strikes fast and hard before disappearing into the night."]

[[entry.feature]]
anchor = "nature-bond"
head = "Nature Bond"
listed = true
print = "A [bat](ref/companion/dire-bat) shaman who chooses an animal companion must select a bat. If choosing a domain, the bat shaman must choose from [Air](ref/domain/air), [Animal](ref/domain/animal), Darkness (Night subdomain), and Trickery (Deception subdomain)."
import_trades = ["Nature bond"]

[[entry.feature]]
anchor = "wild-empathy"
head = "Wild Empathy (Ex)"
listed = true
print = "A bat shaman can use wild empathy with bats as a full-round action with a +4 bonus."
import_trades = ["Wild empathy"]

[[entry.feature]]
anchor = "totem-transformation"
head = "Totem Transformation (Su)"
listed = true
level = 2
print = "At 2nd level, a bat shaman may adopt an aspect of the bat while retaining her normal form. This ability functions as the ape shaman ability, but the druid may select from the following sets of bonuses and abilities: movement (fly speed 30 ft. \\[average\\]; the druid must be at least 5th level to select this bonus), [natural weapons](ref/umr/natural-attacks) (bite \\[1d4 for a Medium shaman\\]), or senses ([blindsense](ref/umr/blindsense) 20 ft.).\n\nWhile using totem transformation, the bat shaman may speak normally and can cast _[speak with animals](ref/spell/speak-with-animals)_ (bats only) at will. This ability replaces woodland stride."
import_trades = ["Woodland stride"]

[[entry.feature]]
anchor = "totemic-summons"
head = "Totemic Summons (Su)"
listed = true
level = 5
print = "At 5th level, a bat shaman may cast _[summon nature's ally](ref/spell/summon-natures-ally)_ as a standard action when summoning bats, and these summoned creatures gain [temporary hit points](ref/rule/temporary-hit-points) equal to her druid level. This ability otherwise functions as the ape shaman ability."

[[entry.feature]]
anchor = "wild-shape"
head = "Wild Shape (Su)"
listed = true
level = 6
print = "At 6th level, a bat shaman's wild shape ability functions at her druid level -2. If she takes on the form of a bat, she instead uses her druid level + 2."
import_trades = ["Wild shape"]

[[entry.feature]]
anchor = "bonus-feat"
head = "Bonus Feat"
listed = true
level = 9
print = "At 9th level and every four levels thereafter, a bat shaman gains one of the following bonus feats: [Acrobatic](ref/feat/acrobatic), [Agile Maneuvers](ref/feat/agile-maneuvers), [Improved Initiative](ref/feat/improved-initiative), [Lightning Reflexes](ref/feat/lightning-reflexes), or [Skill Focus](ref/feat/skill-focus) (Perception). She must meet the prerequisites for these bonus feats. This ability replaces venom immunity."
import_trades = ["Venom immunity"]

[[entry]]
id = "ref/arc-druid/boar-shaman"
opening = ["A boar shaman chooses the stolid and ferocious boar as her totem. Content to be left alone, she becomes one of the most dangerous creatures of the wild when provoked."]

[[entry.feature]]
anchor = "nature-bond"
head = "Nature Bond"
listed = true
print = "A [boar](ref/companion/boar) shaman who chooses an animal companion must select a boar. If choosing a domain, the boar shaman must choose from the [Animal](ref/domain/animal), [Destruction](ref/domain/destruction) (Rage), [Protection](ref/domain/protection), and Strength domains."
import_trades = ["Nature bond"]

[[entry.feature]]
anchor = "wild-empathy"
head = "Wild Empathy (Ex)"
listed = true
print = "A boar shaman can use wild empathy with porcine creatures as a full-round action with a +4 bonus."
import_trades = ["Wild empathy"]

[[entry.feature]]
anchor = "totem-transformation"
head = "Totem Transformation (Su)"
listed = true
level = 2
print = "At 2nd level, a boar shaman may adopt an aspect of the boar while retaining her normal form. This ability functions as the ape shaman ability, but the druid may select from the following sets of bonuses and abilities: movement (+10 enhancement bonus to land speed), senses ([low-light vision](ref/rule/low-light-vision), [scent](ref/umr/scent)), [natural weapons](ref/umr/natural-attacks) (gore \\[1d8 for a Medium druid\\], +2 on combat maneuver checks to overrun), or toughness (+2 natural armor bonus to AC, [Endurance](ref/feat/endurance) feat). While using totem transformation, the boar shaman may speak normally and can cast _[speak with animals](ref/spell/speak-with-animals)_ (boars and related animals only) at will. This ability replaces woodland stride."
import_trades = ["Woodland stride"]

[[entry.feature]]
anchor = "totemic-summons"
head = "Totemic Summons (Su)"
listed = true
level = 5
print = "At 5th level, a boar shaman may cast _[summon nature's ally](ref/spell/summon-natures-ally)_ as a standard action when summoning [boars](ref/monster/boar) or other porcine creatures, and these summoned creatures gain [temporary hit points](ref/rule/temporary-hit-points) equal to her druid level. This ability otherwise functions as the ape shaman ability."

[[entry.feature]]
anchor = "wild-shape"
head = "Wild Shape (Su)"
listed = true
level = 6
print = "At 6th level, a boar shaman's wild shape ability functions at her druid level -2. If she takes on the form of a boar, she instead uses her druid level +2."
import_trades = ["Wild shape"]

[[entry.feature]]
anchor = "bonus-feat"
head = "Bonus Feat"
listed = true
level = 9
print = "At 9th level and every four levels thereafter, a boar shaman gains one of the following bonus feats: [Bleeding Critical](ref/feat/bleeding-critical), [Blind-Fight](ref/feat/blind-fight), [Diehard](ref/feat/diehard), or [Improved Overrun](ref/feat/improved-overrun). She must meet the prerequisites for these bonus feats. This ability replaces venom immunity."
import_trades = ["Venom immunity"]

[[entry]]
id = "ref/arc-druid/world-walker"
hold = "the replaces trade `resist nature's lure` is not printed in a sentence, and no listed feature of that name prints it"
opening = ["While all druids traverse the wilderness with ease, the world walkers take it upon themselves to travel the entire world. Some act as messengers and scouts for druidic circles, while others have a seemingly unquenchable wanderlust; each new land provides new mysteries to discover and new wisdom to be gained from mastering those mysteries."]

[[entry.feature]]
anchor = "favored-terrain"
head = "Favored Terrain (Ex)"
listed = true
level = 3
print = '''
At 3rd level, the world walker gains the ranger's [favored terrain](ref/ability/favored-terrain) ability. She treats her druid level as her ranger level for this ability. If she has levels in both classes, both class's levels stack for determining the effect of this ability. This ability replaces

trackless step and resist nature's lore.'''
import_trades = ["Trackless step", "resist nature's lure"]

[[entry.feature]]
anchor = "path-of-trees"
head = "Path of Trees (Su)"
listed = true
level = 9
print = '''
At 9th level, once a day, a wanderer

can step within a tree and then teleport from that tree to

another one in a manner similar to the _[tree stride](ref/spell/tree-stride)_ spell. She gains an

extra use of this ability each

day at 12th level, and a

third use of this ability at

15th level. Furthermore,

a world walker of 13th level or

higher can use this ability to teleport

to any other tree of its type up to 100

miles away. This ability replaces

both venom immunity

and timeless body.'''
import_trades = ["Venom immunity", "timeless body"]

[[entry]]
id = "ref/arc-fighter/armor-master"
opening = ["All fighters have two main tools of their trade—weapons and armor. While many fighters hone their weapon skills to a point of inescapable grace and lethality, there are those who live under the maxim that a good offense can be accomplished though an impenetrable defense. To these fighters, proper use of armor and shields ensures that they can fight another day, and that the frustration of enemies who can't seem to crack an armor master's superior defenses is just the first symptom of his foes' eventual defeat."]

[[entry.feature]]
anchor = "deflective-shield"
head = "Deflective Shield (Ex)"
listed = true
level = 2
print = "At 2nd level, an armor master specializes in using his shield to deflect attacks. He gains a +1 bonus to his touch AC, and this bonus increases for every four levels beyond 2nd (to a maximum of +5 at 18th level); however, this bonus cannot exceed the sum of the armor and enhancement bonus to AC provided by the shield that the armor master is currently carrying. This ability replaces bravery."
import_trades = ["Bravery"]

[[entry.feature]]
anchor = "armored-defense"
head = "Armored Defense (Ex)"
listed = true
level = 5
print = "At 5th level, an armor master gains DR 1/— when wearing light armor, DR 2/— when wearing medium armor, and DR 3/— when wearing heavy armor. At 19th level, this [damage reduction](ref/rule/damage-reduction) increases to DR 4/— when wearing light armor, DR 8/— when wearing medium armor, and DR 12/— when wearing heavy armor. This [damage reduction](ref/rule/damage-reduction) stacks with that provided by [adamantine](ref/eq-material/adamantine) armor, but not with other forms of damage reduction. This damage reduction does not apply if the armor master is stunned, unconscious, or helpless. This ability replaces weapon training 1 and 3, and armor mastery."
import_trades = ["Weapon training 1", "3", "armor mastery"]

[[entry.feature]]
anchor = "fortification"
head = "Fortification (Ex)"
listed = true
level = 9
print = "At 9th level, an armor master can use his armor to shield critical areas from injury. He treats any armor he wears as if it had the _[light fortification](ref/magic-enh/fortification-light)_ special ability. At 13th level, his armor gains the _[moderate fortification](ref/magic-enh/fortification-moderate)_ special ability. This fortification does not stack in any way with armor that has these special abilities. In these cases the armor master takes the better of the two fortifications. This ability replaces weapon training 2 and 4."
import_trades = ["Weapon training 2", "4"]

[[entry.feature]]
anchor = "indestructible"
head = "Indestructible (Ex)"
listed = true
level = 20
print = "At 20th level, an armor master gains complete immunity to critical hits and sneak attacks while he is wearing armor. In addition, unless his armor has the [fragile](ref/misc/fragile) armor quality, it cannot be [sundered](ref/rule/sunder) while he is wearing it. This ability replaces weapon mastery."
import_trades = ["Weapon mastery"]

[[entry]]
id = "ref/arc-fighter/brawler"
opening = ["All melee is up close and personal, but some warriors bring it as close as they can get. Brawlers can be found anywhere, among all races and societies. A brawler could be hired muscle in a tavern, a local crime syndicate enforcer, or a hotheaded recruit among the ranks of a baron's guard. Often brawlers' in-your-face attitudes are as powerful as their tactics."]

[[entry.feature]]
anchor = "close-control"
head = "Close Control (Ex)"
listed = true
level = 2
print = "At 2nd level, a brawler becomes skilled at forcefully moving his opponent around the battlefield. The brawler gains a +1 bonus on [bull rush](ref/rule/bull-rush), [drag](ref/rule/drag), and [reposition](ref/rule/reposition) combat maneuver checks. The brawler also gains a +1 bonus to CMD when attacked with the bull rush, drag, and reposition maneuvers. These bonuses increase by +1 for every four levels after 2nd (to a maximum of +5 at 18th level). This ability replaces armor training 1."
import_trades = ["Armor training 1"]

[[entry.feature]]
anchor = "close-combatant"
head = "Close Combatant (Ex)"
listed = true
level = 3
print = "At 3rd level, a brawler gains a +1 bonus on attack rolls and a +3 bonus on damage rolls with weapons in the close [weapon group](ref/ability/weapon-groups). Both of these bonuses increase by +1 for every four levels beyond 3rd (to a maximum of +5 on attack rolls and +7 on damage rolls at 19th level). This ability replaces weapon training 1 and 2."
import_trades = ["Weapon training 1", "2"]

[[entry.feature]]
anchor = "menacing-stance"
head = "Menacing Stance (Ex)"
listed = true
level = 7
print = "At 7th level, a brawler constantly harries and distracts his enemies. While adjacent to the brawler, enemies take a -1 penalty on attack rolls and a -4 penalty on [concentration](ref/rule/concentration) checks. These penalties increase by 1 for every four levels after 7th level (to a maximum of -4 on attack rolls and -7 on concentration checks at 19th level). Creatures do not take these penalties if the brawler is dazed, helpless, staggered, stunned, or unconscious. This ability replaces armor training 2, 3, and 4 and armor mastery."
import_trades = ["Armor training 2", "3", "4", "armor mastery"]

[[entry.feature]]
anchor = "no-escape"
head = "No Escape (Ex)"
listed = true
level = 9
print = "At 9th level, taking [a 5-foot step](ref/rule/take-5-foot-step) out of the area of a brawler's menacing stance or moving out of the area of a brawler's menacing stance with a [withdraw](ref/rule/withdraw) action provokes an attack of opportunity from the brawler. This ability replaces weapon training 3 and 4."
import_trades = ["Weapon training 3", "4"]

[[entry.feature]]
anchor = "stand-still"
head = "Stand Still"
listed = true
level = 13
print = "At 13th level, a brawler gains [Stand Still](ref/feat/stand-still) as a bonus feat, even if he does not have the [Combat Reflexes](ref/feat/combat-reflexes) feat. If the brawler already has the Stand Still feat, he can take any other combat feat instead. Furthermore, he gains a bonus equal to 1/2 his fighter level on combat maneuver checks when using the Stand Still feat."

[[entry.feature]]
anchor = "weapon-mastery"
head = "Weapon Mastery (Ex)"
listed = true
print = "A brawler must select a close weapon for this ability.\n\nExpanded Weapon Groups\n\nThis book and the _Advanced Player's Guide_ present a number of weapons not on the weapon group lists in the _Core Rulebook_.\n\nBelow is an update of that list, with all the weapons from those two books as well as new weapons introduced in this book. It\n\nalso presents two new groups: firearms and siege weapons. Weapons with one asterisk (\\*) can be found in the _Advanced Player's_\n\n_Guide_. Weapons with two asterisks (\\*\\*) can be found in this book.\n\nWeapon groups are defined as follows (GMs may add other weapons to these groups, or add entirely new groups):"
import_trades = ["Weapon mastery"]

