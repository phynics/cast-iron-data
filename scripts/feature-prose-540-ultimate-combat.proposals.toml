[[entry.feature]]
anchor = "sorcerous-shield"
head = "Sorcerous Shield (Ex)"
listed = true
level = 1
print = "At 1st level, skirnirs are proficient with all types of shields, including tower shields, and do not suffer an arcane spell failure chance when casting magus spells while using a shield. They treat their magus levels as their fighter levels for the purpose of qualifying for shield-related feats. This ability replaces spell combat."
