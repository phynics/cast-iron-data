T _he ettin's enormous mace slammed into the packed-dirt floor of the arena, its curving spikes digging deep furrows as it rebounded. Already airborne, Alain avoided the clumsy swing easily, yet could still imagine those same furrows torn through his flesh. Against his will, the mercenary's gaze flicked up toward the stands, past the blank-eyed, poxy faces of the cheering peasants, up to the shaded gallery where the duchess sat. She met his eyes and smiled. Conniving wench. When she'd asked him to be her champion, he'd thought she meant in some petty squabble of honor—or maybe just for the night. Stupid. Behind him, two heads screamed._

Feats

Feats represent special tricks or abilities a character has acquired through training, luck, or as a quirk of his birth. They grant characters abilities that others lack, giving them an edge in the right situation. While some feats specifically interact with a PC's race or class, most are available to anyone who meets the prerequisites. The feats in this book expand upon those in the _Pathfinder RPG Core Rulebook_, the _Pathfinder RPG Advanced Player's Guide_, _Pathfinder RPG Ultimate Magic_, and other sources, introducing new combat feats, critical feats, metamagic feats, and teamwork feats. This book also introduces two new types of feats— grit feats and style feats. Grit feats expand a gunslinger's ability to use grit and deeds, while style feats each grant a style of martial arts that can be used by monks and other characters who learn the style.'''
import_trades = ["Arcane school"]

[[entry.feature]]
anchor = "types-of-feats"
head = "TYPES OF FEATS"
listed = true
print = '''
While most of the feats presented here are general and have no special rules governing them, some feats belong to a type or types of feats that feature special shared rules. The type or types a feat belongs to appear in parentheses after the feat name. This chapter features the following types of feats.

Combat Feats

Fighters and gunslingers can select combat feats as bonus feats. Member of other classes can take these feats as long as they meet the prerequisites.

Critical Feats

Critical feats modify the effects of a critical hit by inflicting an additional condition on the victim. Characters without the Critical Mastery feat can only apply the effects of one critical feat to an individual critical hit. Characters with multiple critical feats can decide which feat to apply after confirming a critical hit.

Grit Feats

Grit feats interact with the gunslinger's grit class ability or the grit granted by the Amateur Gunslinger feat, usually by adding to her set of deeds. Sometimes these feats increase the number of grit points a character has or how that character regains grit points. Gunslingers can take grit feats as bonus feats.

Metamagic Feats

Metamagic feats allow spellcasters to modify their spells, granting the spells new powers and effects. Such spells generally take up a higher-level spell slot than the normal spell. For complete rules on how to apply metamagic feats to spells, see pages 112–113 of the _Core Rulebook_.

Performance Feats

Performance feats are used when you make a performance combat check, typically granting a special action that occurs when you make that check. Unless you have the Masterful Display feat, you can only apply the effect of one performance feat to each performance combat check you make.

Style Feats

For centuries, great warriors have looked to nature and the multiverse to find inspiration in battle. Countless monastic and contemplative orders have crafted intricate unarmed fighting styles based on the deadliness and grace of natural and supernatural creatures. Although many such fighting techniques were created by secretive orders, they have since spread to practitioners the world over.

As a swift action, you can enter the stance employed by the fighting style a style feat embodies. Although you cannot use a style feat before combat begins, the style you are in persists until you spend a swift action to switch to a different combat style. You can use a feat that has a style feat as a prerequisite only while in the stance of the associated style. For example, if you have feats associated with Mantis Style and Tiger Style, you can use a swift action to adopt Tiger Style at the start of one turn, and then can use other feats that have Tiger Style as a prerequisite. By using another swift action at the start of your next turn, you could adopt Mantis Style and use other feats that have Mantis Style as a prerequisite.

The styles presented in this book follow, along with specific feat paths—feats that complement each style.'''

[[entry.feature]]
anchor = "boar-style"
head = "Boar Style"
listed = true
print = '''
A tribe of orcs who disdained the use of weapons originally developed this savage unarmed fighting style. They preferred to slaughter their enemies with their bare hands and teeth. Over the centuries, a variety of races have adopted the Boar Style, most notably goblinoids, ogres, and trolls. The objective of the Boar Style is to attack with as much viciousness and cruelty as possible in order to break enemy morale. Fanatical followers of the style use herbal and alchemical reagents to harden their nails and teeth, sometimes performing self-mutilating procedures that result in clawlike nails and sharpened teeth.

_Feat Path_: Boar Style, Boar Ferocity, Boar Shred.'''

[[entry.feature]]
anchor = "crane-style"
head = "Crane Style"
listed = true
print = '''
Crane style focuses on defense and agile counterattacks. Practitioners are known for graceful, one-legged stances and folding arm techniques that mimic a crane's enormous wings.

_Feat Path_: Crane Style, Crane Wing, Crane Riposte.'''

[[entry.feature]]
anchor = "djinni-style"
head = "Djinni Style"
listed = true
print = '''
Adherents to this style call on the spirits of storms to outmaneuver and outwit their opponents. Masters of the style can absorb and deflect electrical attacks while summoning peals of thunder to pummel their enemies.

_Feat Path_: Djinni Style, Djinni Spirit, Djinni Spin.'''

[[entry.feature]]
anchor = "dragon-style"
head = "Dragon Style"
listed = true
print = '''
Dragon style captures the overwhelming power, grace, and ferocity of dragons. Practitioners use acrobatic footwork and strong attacks to overwhelm foes. The deepest secrets of the style require imbibing alchemical tonics and deep meditations similar to the long sleeps of dragons.

_Feats Path_: Dragon Style, Dragon Ferocity, Dragon Roar.'''

[[entry.feature]]
anchor = "earth-child-style"
head = "Earth Child Style"
listed = true
print = '''
A warrior cadre of dwarves and gnomes dedicated to fighting and slaying giants developed this style. Students of the style learn how to enhance their defensive training to become even more elusive when facing giants. They also spend long hours studying the anatomy of the various giant races to increase the effectiveness of their unarmed strikes. Eventually, masters of this fighting style learn how to bring down even the mightiest creatures by targeting feet, ankles, and knees.

_Feat Path_: Earth Child Style, Earth Child Topple, Earth Child Binder.'''

[[entry.feature]]
anchor = "efreeti-style"
head = "Efreeti Style"
listed = true
print = '''
The efreeti style focuses on aggression and speed, taking inspiration from beings of living fire. Masters of the style can deflect and control fire, immolate their enemies, and summon forth gouts of elemental flame.

_Feats Path_: Efreeti Style, Efreeti Stance, Efreeti Touch.'''

[[entry.feature]]
anchor = "janni-style"
head = "Janni Style"
listed = true
print = '''
This style, originating humbly from the folk traditions of disparate peoples, represents several similar unarmed fighting arts practiced around the world. Regardless of variations in technique, all practitioners have a f luid fighting stance that emphasizes rapid, powerful kicks. The style's constant motion and graceful footwork lead many to mistakenly view practitioners as highly skilled dancers, a misconception that has allowed the technique to be taught in secret, the hidden weapon of the downtrodden and the oppressed. Openly martial versions of this style lose some of the dancelike qualities but retain the style's extraordinary kicking techniques and agility.

_Feat Path_: Janni Style, Janni Tempest, Janni Rush.'''

[[entry.feature]]
anchor = "kirin-style"
head = "Kirin Style"
listed = true
print = '''
The school of the kirin employs critical observations as weapons against opponents. Practitioners catalogue a foe's weaknesses and seek the perfect moment to strike, ensuring that no movement or effort is ever wasted. Popular among those rare orders that blend monastic training with arcane study, kirin style is sometimes practiced by wizards who seek to hone their bodies along with their minds.

_Feat Path_: Kirin Style, Kirin Strike, Kirin Path.'''

[[entry.feature]]
anchor = "mantis-style"
head = "Mantis Style"
listed = true
print = '''
Based on the hunting techniques of the praying mantis, practitioners of this style fight with their hands turned down to emulate the insect's sharp grasping forelimbs. Mantis style uses precise, accurate strikes to pinpoint an opponent's vital areas, such as eyes, throat, and pressure points.

_Feat Path_: Mantis Style, Mantis Wisdom, Mantis Torment.'''

[[entry.feature]]
anchor = "marid-style"
head = "Marid Style"
listed = true
print = '''
Marid style emulates the f luid strength of flowing rivers and the cold of the ocean depths. Masters of the style can withstand severe cold, manipulate water to lash at enemies from afar, and freeze their foes in place.

_Feat Path_: Marid Style, Marid Spirit, Marid Coldsnap.'''

[[entry.feature]]
anchor = "monkey-style"
head = "Monkey Style"
listed = true
print = '''
Renowned for its speed and agility, monkey style blends jumping strikes, rolling blows, and ground fighting into a continuous onslaught aimed at disorienting and damaging an opponent through superior mobility.

_Feat Path_: Monkey Style, Monkey Moves, Monkey Shine.'''

[[entry.feature]]
anchor = "panther-style"
head = "Panther Style"
listed = true
print = '''
Students of the panther throw caution to the wind as they weave recklessly among their foes. Those who master the style turn their unrivaled mobility into a weapon, striking their enemies with a series of swift retaliatory strikes.

_Feat Path_: Panther Style, Panther Claws, Panther Parry.'''

[[entry.feature]]
anchor = "shaitan-style"
head = "Shaitan Style"
listed = true
print = '''
Practitioners of this style imbue their fists with the mineral acids of the deep earth. Their forceful blows conjure forth caustic elements to dissolve and disable their enemies.

_Feat Path_: Shaitan Style, Shaitan Skin, Shaitan Earthblast.'''

[[entry.feature]]
anchor = "snake-style"
head = "Snake Style"
listed = true
print = '''
Snake style emphasizes quick, shifting movements. Its practitioners normally hold their hands flat with the fingers together to mimic the head of a snake. Able to strike when least expected, snake stylists are known for opportunism and blinding speed.

_Feat Path_: Snake Style, Snake Sidewinder, Snake Fang.'''

[[entry.feature]]
anchor = "snapping-turtle-style"
head = "Snapping Turtle Style"
listed = true
print = '''
The snapping turtle style emphasizes active defense with one hand. Students of the style utilize a variety of locks, grabs, and circular blocks to protect themselves, as well as employing a debilitating clutch.

_Feat Path_: Snapping Turtle Style, Snapping Turtle Clutch, Snapping Turtle Shell.'''

[[entry.feature]]
anchor = "tiger-style"
head = "Tiger Style"
listed = true
print = '''
This style seeks to emulate the power and fury of the great tiger. Practitioners use their hands like claws, perfecting overpowering double hand strikes and driving attack chains.

_Feat Path_: Tiger Style, Tiger Claws, Tiger Pounce.

Teamwork Feats

Teamwork feats first appeared in the _Advanced Player's Guide_. They grant significant bonuses but only function under specific circumstances. In most cases, these feats require an ally with the same feat to have a specific position on the battlefield. Teamwork feats provide no bonus if the listed conditions are not met. Note that allies who are paralyzed, stunned, unconscious, or otherwise unable to act do not count for the purposes of these feats. Inquisitors and cavaliers have special class abilities that allow them to use teamwork feats even when their allies do not have the feats.'''
