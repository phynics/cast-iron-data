print = "A mysterious stranger swaps a pair of deeds for the following."

[[entry.feature]]
anchor = "focused-aim"
head = "Focused Aim (Ex)"
listed = true
level = 1
print = "At 1st level, as a swift action, the mysterious stranger can spend 1 grit point to gain a bonus on all firearm damage rolls equal to her Charisma modifier (minimum 1) with all firearm attacks she makes until the end of her turn. At 7th level, when she uses the [dead shot](ref/deed/dead-shot) deed, she multiplies this bonus by the number of hits she made while rolling the Dead Shot attack. This deed replaces the quick clear deed."
import_trades = ["Quick clear deed"]

[[entry.feature]]
anchor = "clipping-shot"
head = "Clipping Shot (Ex)"
listed = true
level = 11
print = "At 11th level, when the mysterious stranger misses with a firearm attack, she can spend 1 grit point to deal half the damage that attack would have dealt if it were a hit (roll damage normally). She can decide to use this deed and spend the grit point after making the attack. This deed has no effect if the attack used the dead shot deed. The cost of using this deed cannot be reduced with the [Signature Deed](ref/feat/signature-deed) feat, the true grit class feature, or any similar effect. This replaces the bleeding wound deed."
import_trades = ["Bleeding wound deed"]

[[entry.feature]]
anchor = "lucky"
head = "Lucky (Ex)"
listed = true
level = 2
print = "Starting at 2nd level, a mysterious stranger gains a +1 luck bonus on Will saving throws. This bonus increases by +1 for every four levels beyond 2nd level (to a maximum of +5 at 18th level). This ability replaces nimble."
import_trades = ["Nimble"]

[[entry.feature]]
anchor = "stranger-s-fortune"
head = "Stranger's Fortune (Ex)"
listed = true
level = 5
print = "Starting at 5th level, a mysterious stranger can ignore a firearm misfire a number of times per day equal to her Charisma bonus. She can use this ability as a free action. This ability replaces gun training 1."
import_trades = ["Gun training 1"]

[[entry]]
id = "ref/arc-gunslinger/pistolero"
hold = "the replaces trade `Gun training 1-4` is not printed in a sentence, and no listed feature of that name prints it; Pistol Training (Ex): the sentence \"This ability replaces gun training 1 to 4\" names no trade"
opening = ["While most gunslingers have favorite firearms, there are those rare ones who choose to specialize in one-handed firearms exclusively. These gunslingers are called pistoleros. While they lack the flexibility of being able to pick up any kind of firearm and use it with reasonable proficiency, they are crackerjack shots with pistols and similar firearms. Their skill and aim with these firearms at close range is second to none, and they rarely misfire with these weapons."]

[[entry.feature]]
anchor = "weapon-proficiency"
head = "Weapon Proficiency"
listed = true
print = "Instead of proficiency with all firearms, a pistolero only gains proficiency with one-handed firearms. She must take [Exotic Weapon Proficiency](ref/feat/exotic-weapon-proficiency) (firearms) to gain proficiency with two-handed firearms and firearm siege engines."

[[entry.feature]]
anchor = "gunsmith"
head = "Gunsmith"
listed = true
print = "A pistolero must take a [pistol](ref/eq-weapon/pistol) when she chooses a battered firearm at 1st level."
import_trades = ["Gunsmith"]

[[entry.feature]]
anchor = "deeds"
head = "Deeds"
listed = true
print = "A pistolero swaps a trio of deeds for the following."

[[entry.feature]]
anchor = "up-close-and-deadly"
head = "Up Close and Deadly (Ex)"
listed = true
level = 1
print = "At 1st level, when the pistolero hits a target with a one-handed firearm that is not making a scatter shot, she can spend 1 grit point to deal 1d6 points of extra damage on a hit. If she misses with the attack, she grazes the target, dealing half the extra damage anyway. This is precision damage and is not multiplied if the attack is a critical hit. This precision damage increases to 2d6 at 5th level, to 3d6 at 10th level, to 4d6 at 15th level, and to 5d6 at 20th level. This precision damage stacks with [sneak attack](ref/ability/sneak-attack) and other forms of precision damage. The cost of using this deed cannot be reduced with the [Signature Deed](ref/feat/signature-deed) feat, the true grit class feature, or any similar effect. This deed replaces the deadeye deed."
import_trades = ["_Deadeye_ deed"]

[[entry.feature]]
anchor = "deadeye"
head = "Deadeye (Ex)"
listed = true
level = 7
print = "At 7th level, the pistolero gains the [deadeye](ref/deed/deadeye) deed, which is normally a 1st-level gunslinger deed. This deed replaces the startling shot deed."
import_trades = ["Startling shot deed"]

[[entry.feature]]
anchor = "twin-shot-knockdown"
head = "Twin Shot Knockdown (Ex)"
listed = true
level = 11
print = "At 11th level, when the pistolero hits a single target with two or more one-handed firearm attacks during her turn, she can spend 1 grit point to knock the target [prone](ref/rule/prone). She can choose to spend the grit point after the attacks are made. This deed replaces the bleeding wound deed."
import_trades = ["Bleeding wound deed"]

[[entry.feature]]
anchor = "pistol-training"
head = "Pistol Training (Ex)"
listed = true
level = 5
print = "Starting at 5th level, a pistolero increases her skill with one-handed firearms. She gains a bonus on damage rolls equal to her Dexterity modifier, and when she misfires with a one-handed firearm, the misfire value increases by 2 instead of 4. Every four levels thereafter (9th, 13th, and 17th), the bonus on damage rolls increases by +1. This ability replaces gun training 1 to 4."
import_trades = ["Gun training 1-4"]

[[entry]]
id = "ref/arc-inquisitor/iconoclast"
opening = ["Some magic items are heretical by nature, enabling the unfaithful to spread wickedness. Iconoclasts seek out and remove such crutches, cleansing the taint these items exude."]

[[entry.feature]]
anchor = "shake-effects"
head = "Shake Effects (Ex)"
listed = true
level = 1
print = "At 1st level, an iconoclast gains a +2 bonus on all saving throws against effects that come from a magic item. This ability replaces monster lore."
import_trades = ["Monster lore"]

[[entry.feature]]
anchor = "detect-magic"
head = "Detect Magic (Sp)"
listed = true
level = 2
print = "At 2nd level, an iconoclast gains the ability to _[detect magic](ref/spell/detect-magic)_ at will. This ability replaces _detect alignment_."
import_trades = ["Detect alignment"]

[[entry.feature]]
anchor = "dispelling-attack"
head = "Dispelling Attack (Sp)"
listed = true
level = 5
print = "At 5th level, once per day as a standard action, an iconoclast can make a melee or ranged attack against an opponent, and if she hits, she can affect that opponent as if she had cast _[dispel magic](ref/spell/dispel-magic)_, using the targeted dispel option. If she misses, this ability is wasted. Use her inquisitor level as the caster level of the _dispel magic_ effect. This ability replaces _discern lies_."
import_trades = ["Discern lies"]

[[entry.feature]]
anchor = "negating-critical"
head = "Negating Critical (Sp)"
listed = true
level = 14
print = "At 14th level, when an iconoclast confirms a critical hit, the creature she hit must succeed at a Fortitude save at DC 10 + 1/2 the iconoclast's caster level + the iconoclast's Wisdom modifier for each non-artifact magic item the target is wearing or carrying. On a failed saving throw, the target of the critical hit can neither use nor gain benefit from any [minor magic item](ref/misc/magic-items-by-category) for 1d4 rounds. This ability can be used in conjunction with critical feats. This ability replaces exploit weakness."
import_trades = ["Exploit weakness"]

[[entry.feature]]
anchor = "destroy-artifact"
head = "Destroy Artifact (Sp)"
listed = true
level = 20
print = "At 20th level, an iconoclast has the ability to destroy minor [artifacts](ref/rule/artifacts). The iconoclast must have possession of the minor artifact for at least a week, which she must spend in uninterrupted contemplation of the nature of the artifact. At the end of that week, she makes a DC 30 Spellcraft check to unweave the fabric of the item, and if she is successful, the artifact is destroyed. If the iconoclast fails, she cannot try to destroy the artifact again with this ability, but another iconoclast can. This ability replaces true judgment."
import_trades = ["True judgment"]

[[entry]]
id = "ref/arc-inquisitor/spellbreaker"
opening = ["The world is full of dangerous magic, and many recoil in the face of such power. The spellbreaker, by contrast, learns to recognize and resist certain types of magic, wading through waves of magic to reach her foes."]

[[entry.feature]]
anchor = "strong-willed"
head = "Strong-Willed (Ex)"
listed = true
level = 1
print = "At 1st level, a spellbreaker is able to stand strong against magical effects that seek to control, compel, or persuade her. The spellbreaker rolls twice and takes the best result when making a Will saving throw against a mind-affecting effect. This ability replaces monster lore."
import_trades = ["Monster lore"]

[[entry.feature]]
anchor = "defense-against-magic"
head = "Defense against Magic (Ex)"
listed = true
level = 3
print = "At 3rd level, a spellbreaker picks a single [wizard school](ref/ability/arcane-schools). She gains a +1 bonus on saving throws against arcane spells of that school. Every four levels beyond 3rd, the spellbreaker picks a new school and gains this bonus against arcane spells of that school (to a maximum of five schools of magic at 19th level). Furthermore, each time the spellbreaker picks a new school, the bonuses for the schools she has already chosen increase by 1. This ability replaces all bonus teamwork feats."
import_trades = ["Teamwork feats"]

[[entry.feature]]
anchor = "foil-casting"
head = "Foil Casting (Su)"
listed = true
level = 3
print = "At 3rd level, when an opponent tries to cast an arcane spell within a spellbreaker's threatened area, the DC for that caster to cast defensively increases by 2. This increase stacks with the effects of the [Disruptive](ref/feat/disruptive) feat. Furthermore, the spellbreaker knows where to hit foes to foil casting from a distance. Each time she hits an arcane spellcaster or a creature that uses [spell-like abilities](ref/umr/spell-like-abilities) with a ranged weapon attack, the DC of any [Concentration](ref/rule/concentration) checks the caster makes increases by 2 for 1 round. This ability replaces solo tactics."
import_trades = ["Solo tactics"]

[[entry.feature]]
anchor = "impervious"
head = "Impervious (Ex)"
listed = true
level = 20
print = "At 20th level, a spellbreaker becomes immune to the effects of a single school of arcane magic. That school of magic must be the first one she picked for defense against magic. Neither harmful nor helpful arcane spells of that school have an effect on the spellbreaker. If a spell of that school is an area of effect spell, the spell goes off as normal, but the spellbreaker is untouched by its effects. Once per day, as a swift action, the spellbreaker can grant this imperviousness to all allies in a 60-foot [burst](ref/misc/burst) for 1 minute. This ability replaces true judgment."
import_trades = ["True judgment"]

[[entry]]
id = "ref/arc-inquisitor/witch-hunter"
opening = ["When pursuing justice for their faith, inquisitors sometimes hunt sorcerers, witches, wizards, and other practitioners of arcane magic—but especially witches, since their devotion to a patron is often seen as suspect by many religions."]

[[entry.feature]]
anchor = "spell-sage"
head = "Spell Sage (Ex)"
listed = true
level = 1
print = "At 1st level, a witch hunter adds her Wisdom modifier on Spellcraft checks in addition to her Intelligence modifier when attempting to identify a spell as it is being cast, to identify the properties of a magic item using _[detect magic](ref/spell/detect-magic)_, or to decipher a scroll. This ability replaces monster lore."
import_trades = ["Monster lore"]

[[entry.feature]]
anchor = "knowledgeable-defense"
head = "Knowledgeable Defense"
listed = true
level = 2
print = "At 2nd level, a witch hunter who identifies a spell with Spellcraft gains a bonus against its effects, either a +1 bonus on saving throws or a +1 dodge bonus to AC against this spell. This bonus increases every four levels (to a maximum of +5 at 18th level). At 20th level, once per day as a swift action, she can grant this bonus to all her allies within 60 feet, for 1 minute. The allies gain the bonus when the witch hunter identifies the spell, and those among the allies who have at least 1 rank in Spellcraft can aid the witch hunter's next Spellcraft check as a swift action while under the effect of this ability. This ability replaces _detect alignment_, _discern lies_, and true judgment."
import_trades = ["Detect alignment", "discern lies", "true judgment"]

[[entry.feature]]
anchor = "spell-scent"
head = "Spell Scent"
listed = true
level = 6
print = "At 6th level, the witch hunter learns how to sense unique spell signatures, and can follow the trail of a cast spell or spell effect cast back to its source. Once per day, when the witch hunter comes into contact with or is exposed to a spell effect or a magic item, she can spend a full-round action to examine the spell effect or magic item, and then gains the effect of a _[locate creature](ref/spell/locate-creature)_ spell. She can do this even if the spell effect was instantaneous, but must start her examination within 1 round after she experienced the spell's effect. Instead of locating a known creature, the witch hunter locates the caster of the spell effect or magic item she examined. Doing so does not allow the witch hunter to gain any intelligence about the spellcaster other than its location. This ability replaces track."
import_trades = ["Track"]

[[entry.feature]]
anchor = "witch-s-bane-judgment"
head = "Witch's Bane Judgment (Ex)"
listed = true
level = 14
print = "At 14th level, a witch hunter gains the following judgment."
import_trades = ["Exploit weakness"]

[[entry.feature]]
anchor = "witch-s-bane"
head = "Witch's Bane"
listed = false
parent = "witch-s-bane-judgment"
print = "Any creature that casts an arcane spell within 30 feet of the witch hunter takes a -2 penalty to AC against her attacks and a -2 penalty on saving throws against her spells while this judgment remains in effect. This ability replaces exploit weakness."

[[entry]]
id = "ref/arc-magus/kensai"
hold = "the replaces trade `Magus arcana gained at 9th level` is not printed in a sentence, and no listed feature of that name prints it; Critical Perfection (Ex): the sentence \"This ability replaces the magus arcana normally gained at 9th level\" names no trade"
opening = ["A kensai spends his life focusing his training and meditation into a rapturous perfection of the use of a single weapon, which is usually but not always a sword, channeling his arcane might through it in a dizzying and deadly dance beyond the abilities of even the greatest of mundane warriors."]

[[entry.feature]]
anchor = "weapon-and-armor-proficiency"
head = "Weapon and Armor Proficiency"
listed = false
print = "A kensai is proficient in simple weapons and in a single martial or exotic melee weapon of his choice. A kensai is not proficient with armor or shields and suffers normal arcane spell failure chance when casting magus spells while armored."

[[entry.feature]]
anchor = "diminished-spellcasting"
head = "Diminished Spellcasting"
listed = true
print = "A kensai may cast one fewer spell of each level than normal. If this reduces the number to 0, he may cast spells of that level only if his Intelligence allows [bonus spells](ref/rule/determine-bonuses) of that level."

[[entry.feature]]
anchor = "canny-defense"
head = "Canny Defense (Ex)"
listed = true
level = 1
print = "At 1st level, when a kensai is wielding his chosen weapon, he gains the canny defense ability. This is identical to the [duelist prestige class](ref/pclass/duelist) ability of the same name, save that his chosen weapon may be of any type."

[[entry.feature]]
anchor = "weapon-focus"
head = "Weapon Focus (Ex)"
listed = true
level = 1
print = "At 1st level, a kensai gains [Weapon Focus](ref/feat/weapon-focus) with his chosen weapon as a bonus feat."

[[entry.feature]]
anchor = "perfect-strike"
head = "Perfect Strike (Ex)"
listed = true
level = 4
print = '''
At 4th level, when a kensai hits with his chosen weapon, he can spend 1 point from his arcane pool in order to maximize his weapon damage. Don't roll for damage—the weapon deals maximum damage. This affects only the weapon's base damage dice, not additional damage from [sneak attack](ref/ability/sneak-attack), magical weapon properties, spellstrike, or critical hits.

If the kensai confirms a critical hit, he can instead spend 2 points from his arcane pool to increase his weapon's critical multiplier by 1. This ability replaces spell recall.'''
import_trades = ["Spell recall"]

[[entry.feature]]
anchor = "fighter-training"
head = "Fighter Training (Ex)"
listed = true
level = 7
print = "Starting at 7th level, a kensai counts his magus level -3 as his fighter level for the purpose of qualifying for feats (if he has levels in fighter, these levels stack), but forfeits the benefit of such feats with weapons other than his favored weapon. This ability replaces knowledge pool."
import_trades = ["Knowledge pool"]

[[entry.feature]]
anchor = "iaijutsu"
head = "Iaijutsu (Ex)"
listed = true
level = 7
print = "At 7th level, a kensai applies his Intelligence modifier as well as his Dexterity modifier on initiative rolls (minimum 0). A kensai may make attacks of opportunity when flat-footed, and may draw his favored weapon as a free action as part of taking an attack of opportunity. This ability replaces the medium armor ability."
import_trades = ["Medium armor"]

[[entry.feature]]
anchor = "critical-perfection"
head = "Critical Perfection (Ex)"
listed = true
level = 9
print = "At 9th level, a kensai adds his Intelligence bonus (minimum 0) on critical hit confirmation rolls with his favored weapon. In addition, the kensai may use his magus levels in place of his base attack bonuses to qualify for [Critical Focus](ref/feat/critical-focus) and any feat for which it is a prerequisite; these feats apply only with a kensai's favored weapon. This ability replaces the magus arcana normally gained at 9th level."
import_trades = ["Magus arcana gained at 9th level"]

[[entry.feature]]
anchor = "superior-reflexes"
head = "Superior Reflexes (Ex)"
listed = true
level = 11
print = "At 11th level, kensai can make a number of attacks of opportunity in a round equal to his Intelligence modifier (minimum 1). This effect stacks with the [Combat Reflexes](ref/feat/combat-reflexes) feat. This ability replaces improved spell recall."
import_trades = ["Improved spell recall"]

[[entry.feature]]
anchor = "iaijutsu-focus"
head = "Iaijutsu Focus (Ex)"
listed = true
level = 13
print = "At 13th level, a kensai may always act and may draw his weapon as a swift action during a surprise round, though he is considered flat-footed until he acts. During a surprise round or when attacking a flat-footed opponent, he adds his Intelligence modifier on damage with his chosen weapon (minimum 0). This ability replaces heavy armor."
import_trades = ["Heavy armor"]

[[entry.feature]]
anchor = "iaijutsu-master"
head = "Iaijutsu Master (Ex)"
listed = true
level = 19
print = "At 19th level, a kensai's initiative roll is automatically a natural 20 and he is never surprised. This ability replaces greater spell access."
import_trades = ["Greater spell access"]

[[entry.feature]]
anchor = "weapon-mastery"
head = "Weapon Mastery (Ex)"
listed = true
level = 20
print = "At 20th level, a kensai gains weapon mastery with his favored weapon, as the [fighter](ref/class/fighter) class ability. This ability replaces true magus."
import_trades = ["True magus"]

[[entry.feature]]
anchor = "magus-arcana"
head = "Magus Arcana"
listed = false
print = "The following magus arcana complement the kensai archetype: [concentrate](ref/arcana/concentrate), [critical strike](ref/arcana/critical-strike), [prescient attack](ref/arcana/prescient-attack), [prescient defense](ref/arcana/prescient-defense), [spell shield](ref/arcana/spell-shield)."

[[entry]]
id = "ref/arc-magus/myrmidarch"
hold = "the replaces trade `Magus arcana gained at 6th, 12th, and 18th levels` is not printed in a sentence, and no listed feature of that name prints it; the replaces trade `10th-level fighter training` is not printed in a sentence, and no listed feature of that name prints it; Weapon Training (Ex): the sentence \"This ability replaces the magus arcana normally gained at 6th, 12th, and 18th levels\" names no trade"
opening = ["The myrmidarch is a skilled specialist, using magic to supplement and augment his martial mastery."]

[[entry.feature]]
anchor = "diminished-spellcasting"
head = "Diminished Spellcasting"
listed = true
print = "Myrmidarchs cast one fewer spell of each level than normal. If this reduces the number to 0, he may cast spells of that level only if his Intelligence allows [bonus spells](ref/rule/determine-bonuses) of that level."

[[entry.feature]]
anchor = "ranged-spellstrike"
head = "Ranged Spellstrike (Su)"
listed = true
level = 4
print = '''
At 4th level, a myrmidarch can use spellstrike to cast a single-target touch attack ranged spell and deliver it through a ranged weapon attack. Even if the spell can normally affect multiple targets, only a single missile, ray, or effect accompanies the attack.

At 11th level, a myrmidarch can spend a full-round action to cast a spell that includes multiple ranged touch attacks and deliver more than one using ranged attacks. The spell must have a casting time of 1 full-round action or less. This functions similarly to the base ability of ranged spellstrike, but the myrmidarch can deliver a number of missiles, rays, or effect up to the number of attacks he could make with a full attack. Attacks beyond the first take penalties as if the myrmidarch were making a full attack. Any effects not used in the round the spell is cast are lost, as are any additional ranged touch attacks the spell would allow beyond the myrmidarch's maximum number of attacks. This ability replaces spell recall and improved spell recall.'''
import_trades = ["Spell recall", "improved spell recall"]

[[entry.feature]]
anchor = "weapon-training"
head = "Weapon Training (Ex)"
listed = true
level = 6
print = "At 6th level, a myrmidarch gains weapon training, as the [fighter](ref/class/fighter) ability, adding an additional weapon group every six levels after 6th (to a maximum of three groups at 18th level) and increasing the bonus on attack and damage rolls for weapon groups already chosen by +1. This ability replaces the magus arcana normally gained at 6th, 12th, and 18th levels."
import_trades = ["Magus arcana gained at 6th", "12th", "18th levels"]

[[entry.feature]]
anchor = "fighter-training"
head = "Fighter Training (Ex)"
listed = true
level = 7
print = "At 7th level, a myrmidarch counts his magus level -3 as his fighter level for the purpose of qualifying for feats (if he has levels in fighter, these levels stack). At 10th level, the myrmidarch treats his magus levels as fighter levels for the purposes of fighter training. This ability replaces knowledge pool and the fighter training the magus gains at 10th level."
import_trades = ["Knowledge pool", "10th-level fighter training"]

[[entry.feature]]
anchor = "armor-training"
head = "Armor Training (Ex)"
listed = true
level = 8
print = "At 8th level, a myrmidarch gains armor training, as the fighter ability. At 14th level, he gains armor training 2. This ability replaces improved spell combat and greater spell combat."
import_trades = ["Improved spell combat", "greater spell combat"]

[[entry.feature]]
anchor = "armor-mastery"
head = "Armor Mastery (Ex)"
listed = true
level = 20
print = "At 20th level, a myrmidarch gains DR 5/– when wearing armor. This ability replaces true magus."
import_trades = ["True magus"]

[[entry.feature]]
anchor = "magus-arcana"
head = "Magus Arcana"
listed = false
print = "The following magus arcana complement the myrmidarch archetype: [accurate strike](ref/arcana/accurate-strike), [arcane edge](ref/arcana/arcane-edge), [lingering pain](ref/arcana/lingering-pain), [prescient attack](ref/arcana/prescient-attack), [prescient defense](ref/arcana/prescient-defense), [spell shield](ref/arcana/spell-shield), [spellbreaker](ref/arcana/spellbreaker)."

[[entry]]
id = "ref/arc-magus/skirnir"
hold = "the alters trade `Spell combat` is not printed in a sentence, and no listed feature of that name prints it"
opening = ["Sometimes called a shield-vassal or shieldmaiden, the skirnir has learned to infuse his power into his shield."]

[[entry.feature]]
anchor = "diminished-spellcasting"
head = "Diminished Spellcasting"
listed = true
print = "A skirnir casts one fewer spell of each level than normal. If this reduces the number to 0, he may cast spells of that level only if his Intelligence allows [bonus spells](ref/rule/determine-bonuses) of that level."

[[entry.feature]]
anchor = "arcane-bond"
head = "Arcane Bond (Su)"
listed = true
level = 1
print = "At 1st level, a skirnir gains a shield (except for a tower shield) as an arcane bond item. This is identical to the [wizard](ref/class/wizard) class ability, but the skirnir may only bond with a shield, not a familiar or other item."

[[entry.feature]]
anchor = "arcane-pool"
head = "Arcane Pool"
listed = true
level = 1
print = "At 1st level, a skirnir can use his arcane pool to grant an enhancement bonus to a weapon as normal, as well as to his shield, paying the arcane pool cost separately for each. At 5th level and above, he can also add the following shield special abilities: _[animated](ref/magic-enh/animated)_, _[arrow catching](ref/magic-enh/arrow-catching)_, _[arrow deflection](ref/magic-enh/arrow-deflection)_, _[bashing](ref/magic-enh/bashing)_, _[blinding](ref/magic-enh/blinding)_, _[fortification](ref/magic-enh/fortification)_ (any), _[reflecting](ref/magic-enh/reflecting)_, _[spell resistance](ref/magic-enh/spell-resistance)_ (any)."

[[entry.feature]]
anchor = "sorcerous-shield"
head = "Sorcerous Shield (Ex)"
listed = true
level = 1
print = "At 1st level, skirnirs are proficient with all types of shields, including tower shields, and do not suffer an arcane spell failure chance when casting magus spells while using a shield. They treat their magus levels as their fighter levels for the purpose of qualifying for shield-related feats. This ability replaces spell combat."
import_trades = ["Spell combat"]

[[entry.feature]]
anchor = "spellstrike"
head = "Spellstrike (Su)"
listed = true
level = 1
print = "At 1st level, a skirnir may use this ability with a weapon or [shield bash](ref/misc/shield-bash) attack."
import_trades = ["Spellstrike"]

[[entry.feature]]
anchor = "shield-pool"
head = "Shield Pool (Ex)"
listed = true
level = 4
print = "At 4th level, as a free action, a skirnir may spend 1 point from his arcane pool to add his shield bonus to AC (not including enhancement bonuses) on a [concentration](ref/rule/concentration) check to cast defensively. He may also use a touch attack or shield bash with his shield in conjunction with any pool strike magus arcana. This ability replaces spell recall."
import_trades = ["Spell recall"]

[[entry.feature]]
anchor = "spellshield"
head = "Spellshield (Su)"
listed = true
level = 7
print = "At 7th level, as a standard action, a skirnir may store a magus spell in his shield by spending 1 point from his arcane pool per level of the spell. This functions as the _[spell storing](ref/magic-enh/spell-storing)_ weapon special ability, but activates only on a successful shield bash by the skirnir and is not limited to spells of 3rd level or less. This ability replaces knowledge pool."
import_trades = ["Knowledge pool"]

[[entry.feature]]
anchor = "shielded-spell-combat"
head = "Shielded Spell Combat (Su)"
listed = true
level = 8
print = '''
At 8th level, a skirnir gains the spell combat ability, but only when wielding his bonded shield. A skirnir may use his shield hand to perform somatic components for magus spells, forfeiting the shield's bonus to AC until the beginning of his next turn; if the bonded shield is a buckler, he retains its bonus to AC. At 14th level, he gains the benefits of improved spell combat.

At 19th level, he retains his shield's bonus to AC when using any type of shield with spell combat. This ability replaces improved spell combat, greater spell combat, and greater spell access.'''
import_trades = ["Spell combat", "Improved spell combat", "greater spell combat", "greater spell access"]

[[entry.feature]]
anchor = "greater-spellshield"
head = "Greater Spellshield (Su)"
listed = true
level = 16
print = "At 16th level, a skirnir may activate a stored spell as an immediate action after being struck in combat. He may choose to have the spell affect himself or the creature that struck him. This ability replaces counterstrike."
import_trades = ["Counterstrike"]

[[entry.feature]]
anchor = "magus-arcana"
head = "Magus Arcana"
listed = false
print = "The following magus arcana complement the skirnir archetype: [arcane redoubt](ref/arcana/arcane-redoubt), arcane redoubt (greater), [enduring blade](ref/arcana/enduring-blade) (may use on weapon or shield), [pool strike](ref/arcana/pool-strike), pool strike (arcing, clinging, thunderous), [prescient defense](ref/arcana/prescient-defense), [reflection](ref/arcana/reflection)."

[[entry]]
id = "ref/arc-magus/soul-forger"
opening = ["The soul forger has learned the skill of infusing the raw magical essence of his soul into armaments of surpassing power, combining the mystic arts with the arts of war in a unity of steely perfection."]

[[entry.feature]]
anchor = "diminished-spellcasting"
head = "Diminished Spellcasting"
listed = true
print = "A soul forger casts one fewer spell of each level than normal. If this reduces the number to 0, he may cast spells of that level only if his Intelligence allows [bonus spells](ref/rule/determine-bonuses) of that level."

[[entry.feature]]
anchor = "arcane-bond"
head = "Arcane Bond (Su)"
listed = true
level = 1
print = "At 1st level, a soul forger gains a weapon as an arcane bond item. This is identical to the [wizard](ref/class/wizard) class ability, but the soul forger must select a weapon."

[[entry.feature]]
anchor = "spell-combat"
head = "Spell Combat (Su)"
listed = true
print = "A soul forger may use this ability only when wielding his bonded weapon."
import_trades = ["Spell combat"]

[[entry.feature]]
anchor = "spellstrike"
head = "Spellstrike (Su)"
listed = true
print = "A soul forger may use this ability only when wielding his bonded weapon."
import_trades = ["Spellstrike"]

[[entry.feature]]
anchor = "master-smith"
head = "Master Smith (Ex)"
listed = true
print = '''
A soul forger adds his magus class level on [Craft](ref/skill/craft-any) checks to manufacture armor, shields, and weapons. This bonus applies on skill checks required when using [Craft Magic Arms and Armor](ref/feat/craft-magic-arms-and-armor).

At 7th level, a soul forger uses the 1/10 gp value of armor, shields, and weapons to determine how much time it takes to craft mundane items, and he requires only half the normal amount of time to enchant magical arms and armor. This ability replaces knowledge pool.'''
import_trades = ["Knowledge pool"]

[[entry.feature]]
anchor = "fortify-bond"
head = "Fortify Bond (Su)"
listed = true
level = 4
print = "At 4th level, a soul forger may spend 1 point from his arcane pool to increase the [hardness](ref/umr/hardness) and hit points of his bonded item by an amount equal to his magus level. These hit points last until expended or until the soul forger next prepares spells. Multiple uses of this ability overlap and do not stack. This ability replaces spell recall."
import_trades = ["Spell recall"]

[[entry.feature]]
anchor = "reforge"
head = "Reforge (Su)"
listed = true
level = 11
print = '''
At 11th level, as a standard action, a soul forger can restore a number of hit points equal to his magus level to a damaged object by touching it and spending 1 point from his arcane pool. Repairing a destroyed object takes 1 minute and materials equal to 1/4 the item's sale value, and restores the object to 1 hit point.

Restoring the enchantments of a destroyed magical item requires additional points from the soul forger's arcane pool equal to the item's caster level. The soul forger gains one temporary [negative level](ref/rule/energy-drain-and-negative-levels) if the item's caster level is lower than his own, two negative levels if equal or greater (or none if the item is his bonded weapon); the save DC to remove these negative levels is equal to 10 + the item's caster level. This ability replaces improved spell recall.'''
import_trades = ["Improved spell recall"]

[[entry.feature]]
anchor = "destructive-counterstrike"
head = "Destructive Counterstrike (Su)"
listed = true
level = 16
print = "At 16th level, an opponent who activates a magical item while threatened by a soul forger provokes an attack of opportunity, either against the target or to [sunder](ref/rule/sunder) the item. If the item is destroyed, its effects are negated. This ability replaces counterstrike."
import_trades = ["Counterstrike"]

[[entry.feature]]
anchor = "instantaneous-reconstruction"
head = "Instantaneous Reconstruction (Su)"
listed = true
level = 19
print = "At 19th level, a soul forger can reforge a destroyed item by touch as a standard action that does not provoke attacks of opportunity. This ability replaces greater spell access."
import_trades = ["Greater spell access"]

[[entry.feature]]
anchor = "magus-arcana"
head = "Magus Arcana"
listed = false
print = "The following magus arcana complement the soul forger archetype: [arcane accuracy](ref/arcana/arcane-accuracy), [bane blade](ref/arcana/bane-blade), [devoted blade](ref/arcana/devoted-blade), [dispelling strike](ref/arcana/dispelling-strike), [enduring blade](ref/arcana/enduring-blade), and [ghost blade](ref/arcana/ghost-blade)."

[[entry]]
id = "ref/arc-monk/flowing-monk"
opening = ["The flowing monk is the wind and the river. He knows how the world flows, and forces his enemies to flow with it. Even the most powerful stone breaks under the graceful and persistent pressure of wind and water."]

[[entry.feature]]
anchor = "bonus-feat"
head = "Bonus Feat"
listed = true
print = "A flowing monk replaces the normal monk bonus feats with the following: [Agile Maneuvers](ref/feat/agile-maneuvers), [Combat Reflexes](ref/feat/combat-reflexes), [Deflect Arrows](ref/feat/deflect-arrows), [Dodge](ref/feat/dodge), [Improved Reposition](ref/feat/improved-reposition), [Improved Trip](ref/feat/improved-trip), [Nimble Moves](ref/feat/nimble-moves), and [Weapon Finesse](ref/feat/weapon-finesse). At 6th level, the following feats are also available: [Acrobatic Steps](ref/feat/acrobatic-steps), [Bodyguard](ref/feat/bodyguard), [Improved Disarm](ref/feat/improved-disarm), [Improved Feint](ref/feat/improved-feint), [Ki Throw](ref/feat/ki-throw), [Mobility](ref/feat/mobility), [Second Chance](ref/feat/second-chance), and [Sidestep](ref/feat/sidestep). At 10th level, the following feats are added: [In Harm's Way](ref/feat/in-harms-way), [Repositioning Strike](ref/feat/repositioning-strike), [Snatch Arrows](ref/feat/snatch-arrows), [Spring Attack](ref/feat/spring-attack), and [Tripping Strike](ref/feat/tripping-strike). (Asterisks denotes feats from the _Advanced Player's Guide._)"

[[entry.feature]]
anchor = "redirection"
head = "Redirection (Ex)"
listed = true
level = 1
print = '''
At 1st level, as an immediate action, a flowing monk can attempt a [reposition](ref/rule/reposition) or [trip](ref/rule/trip) combat maneuver against a creature that the flowing monk threatens and that attacks him. If the combat maneuver is successful, the attacker is [sickened](ref/misc/sickened) for 1 round (Reflex DC = 10 + 1/2 the monk's level + monk's Wisdom modifier to halve the duration), plus 1 additional round at 4th level and for every four levels afterward (to a maximum of 6 rounds at 20th level). The monk gains a +2 bonus on the reposition or trip combat maneuver check and the save DC for redirection increases by 2 if the attacker is using [Power Attack](ref/feat/power-attack) or is [charging](ref/rule/charge) when attacking him. The benefit increases to a +4 bonus and an increase of the saving throw by 4 if both apply.

At 4th level, a flowing monk can use redirection against an opponent that the flowing monk threatens and that attacks an ally with a melee attack. At 8th level, a flowing monk can make both a reposition and a trip maneuver as part of a single immediate action with this ability. At 12th level, a flowing monk can use redirection against any opponent that attacks him in melee, even if the flowing monk is not threatening the opponent who attacks him. A flowing monk can use this ability once per day per monk level, but no more than once per round. This ability replaces stunning fist.'''
import_trades = ["Stunning fist"]

[[entry.feature]]
anchor = "unbalancing-counter"
head = "Unbalancing Counter (Ex)"
listed = true
level = 2
print = "At 2nd level, a flowing monk's attacks of opportunity render a struck creature [flat-footed](ref/rule/flat-footed) until the end of the flowing monk's next turn (Reflex DC 10 + 1/2 the monk's level + Wisdom modifier negates). This ability replaces the bonus feat gained at 2nd level."
import_trades = ["The bonus feat gained at 2nd level"]

[[entry.feature]]
anchor = "flowing-dodge"
head = "Flowing Dodge (Ex)"
listed = true
level = 3
print = "At 3rd level, a flowing monk gains a +1 dodge bonus to AC for each enemy adjacent to him, up to a maximum bonus equal to his Wisdom modifier (minimum 1). This ability replaces fast movement."
import_trades = ["Fast movement"]

[[entry.feature]]
anchor = "elusive-target"
head = "Elusive Target (Ex)"
listed = true
level = 5
print = "At 5th level, as an immediate action, a flowing monk may spend 2 points from his ki pool to attempt a Reflex save opposed by an attacker's attack roll to halve damage from that attack. At 11th level and above, the flowing monk suffers no damage on a successful save, or half damage on a failed save. If the attacker is [flanking](ref/rule/flanking) the monk, the flanking opponent who is not attacking becomes the target of the attack. Use the same attack roll, and if the attack hits the new target, that creatures takes half damage (or full damage if the attack is completely avoided). Any associated effects from the attack (such as [bleed](ref/umr/bleed), poison, or spell effects) apply fully even if the attack deals only half damage. This ability replaces purity of body and diamond body."
import_trades = ["Purity of body", "diamond body"]

[[entry.feature]]
anchor = "volley-spell"
head = "Volley Spell (Su)"
listed = true
level = 15
print = "At 15th level, when a targeted spell or [spell-like ability](ref/umr/spell-like-abilities) fails to overcome a flowing monk's [spell resistance](ref/rule/spell-resistance), he may reflect the effect onto its caster as [spell turning](ref/spell/spell-turning) by spending a number of points from his ki pool equal to 1/2 the spell's level (minimum 1). This ability replaces quivering palm."
import_trades = ["Quivering palm"]

[[entry]]
id = "ref/arc-monk/maneuver-master"
opening = ["The maneuver master specializes in more complicated moves than simple damage-dealing strikes."]

[[entry.feature]]
anchor = "bonus-feat"
head = "Bonus Feat"
listed = true
print = "In addition to normal monk bonus feats, a maneuver master may select any Improved combat maneuver feat (such as [Improved Overrun](ref/feat/improved-overrun)) as a bonus feat. At 6th level and above, he may select any Greater combat maneuver feat (such as [Greater Grapple](ref/feat/greater-grapple)) as a bonus feat. At 10th level and above, he may select any maneuver Strike feat (such as [Tripping Strike](ref/feat/tripping-strike)) as a bonus feat."

[[entry.feature]]
anchor = "flurry-of-maneuvers"
head = "Flurry of Maneuvers (Ex)"
listed = true
level = 1
print = "At 1st level, as part of a full-attack action, a maneuver master can make one additional combat maneuver, regardless of whether the maneuver normally replaces a melee attack or requires a standard action. The maneuver master uses his monk level in place of his base attack bonus to determine his CMB for the bonus maneuvers, though all combat maneuver checks suffer a -2 penalty when using a flurry. At 8th level, a maneuver master may attempt a second additional combat maneuver, with an additional -3 penalty on combat maneuver checks. A maneuver master loses this ability when wearing armor, using a shield, or carrying a medium or heavy load. At 15th level, a maneuver master may attempt a third additional combat maneuver, with an additional -7 penalty on combat maneuver checks. This ability replaces flurry of blows."
import_trades = ["Flurry of blows"]

[[entry.feature]]
anchor = "maneuver-defense"
head = "Maneuver Defense (Ex)"
listed = true
level = 3
print = "At 3rd level, if a maneuver master has an Improved combat maneuver feat, any creature attempting that maneuver against the maneuver master provokes an attack of opportunity, even if it would not normally do so. This ability replaces still mind."
import_trades = ["Still mind"]

[[entry.feature]]
anchor = "reliable-maneuver"
head = "Reliable Maneuver (Ex)"
listed = true
level = 4
print = "At 4th level, as a swift action, a maneuver master may spend 1 point from his ki pool before attempting a combat maneuver. He can roll his combat maneuver check for that maneuver twice and use the better result. This ability replaces slow fall."
import_trades = ["Slow fall"]

[[entry.feature]]
anchor = "meditative-maneuver"
head = "Meditative Maneuver (Ex)"
listed = true
level = 5
print = "At 5th level, as a swift action, a maneuver master can add his Wisdom modifier on any combat maneuver check he makes before the beginning of his next turn. He must choose which combat maneuver check to grant the bonus to before making the combat maneuver check. This ability replaces purity of body."
import_trades = ["Purity of body"]

[[entry.feature]]
anchor = "sweeping-maneuver"
head = "Sweeping Maneuver (Ex)"
listed = true
level = 11
print = "At 11th level, a maneuver master can make two combat maneuvers as a standard action, as long as neither maneuver requires the maneuver master to move. He may perform two identical maneuvers against two adjacent enemies, or he may perform two different combat maneuvers against the same target. This ability replaces diamond body."
import_trades = ["Diamond body"]

[[entry.feature]]
anchor = "whirlwind-maneuver"
head = "Whirlwind Maneuver (Ex)"
listed = true
level = 15
print = "At 15th level, once per day as a full-round action, a maneuver master can attempt a single combat maneuver against every opponent he threatens, as long as the combat maneuver does not require movement. He makes a single combat maneuver check, and it applies to all targets. This ability replaces quivering palm."
import_trades = ["Quivering palm"]

[[entry]]
id = "ref/arc-monk/martial-artist"
opening = ["The martial artist pursues a mastery of pure martial arts without the monastic traditions. He is a master of form, but lacks the ability to harness his ki."]

[[entry.feature]]
anchor = "alignment"
head = "Alignment"
listed = true
print = "A martial artist may be of any alignment."

[[entry.feature]]
anchor = "pain-points"
head = "Pain Points (Ex)"
listed = true
level = 3
print = "At 3rd level, a martial artist's advanced knowledge of anatomy grants a +1 bonus on critical hit confirmation rolls and increases the DC of his stunning fist and quivering palm by 1. This ability replaces still mind."
import_trades = ["Still mind"]

[[entry.feature]]
anchor = "martial-arts-master"
head = "Martial Arts Master (Ex)"
listed = true
level = 4
print = "At 4th level, a martial artist may use his monk level to qualify for feats with a fighter level prerequisite when those feats are applied to unarmed strikes or weapons with the monk special quality. This ability replaces slow fall."
import_trades = ["Slow fall"]

[[entry.feature]]
anchor = "exploit-weakness"
head = "Exploit Weakness (Ex)"
listed = true
level = 4
print = '''
At 4th level, as a swift action, a martial artist can observe a creature or object to find its weak point by making a Wisdom check and adding his monk level against a DC of 10 + the object's [hardness](ref/umr/hardness) or the target's CR. If the check succeeds, the martial artist gains a +2 bonus on attack rolls until the end of his turn, and any attacks he makes until the end of his turn ignore the creature or object's DR or hardness.

A martial artist may instead use this ability as a swift action to analyze the movements and expressions of one creature within 30 feet, granting a bonus on Sense Motive checks and Reflex saves and a dodge bonus to AC against that opponent equal to 1/2 his monk level until the start of his next turn.

This ability replaces ki pool.'''
import_trades = ["Ki pool"]

[[entry.feature]]
anchor = "extreme-endurance"
head = "Extreme Endurance (Ex)"
listed = true
level = 5
print = "At 5th level, a martial artist gains immunity to [fatigue](ref/misc/fatigued). At 10th level, he also gains immunity to [exhaustion](ref/misc/exhausted). At 15th level, he gains immunity to stunning. At 20th level, he gains immunity to death effects and [energy drain](ref/rule/energy-drain-and-negative-levels). This ability replaces purity of body, diamond body, and perfect self."
import_trades = ["Purity of body", "diamond body", "perfect self"]

[[entry.feature]]
anchor = "physical-resistance"
head = "Physical Resistance (Ex)"
listed = true
level = 7
print = "At 7th level, if a martial artist suffers any effect that causes [ability damage](ref/rule/ability-damage-drain), ability drain, or temporary ability score penalties, the effect is reduced by 1 point. This reduction increases by 1 for every three levels beyond 7th (to a maximum reduction of 5 at 19th level). This ability replaces wholeness of body, timeless body, and tongue of the sun and moon."
import_trades = ["Wholeness of body", "timeless body", "tongue of sun", "moon"]

[[entry.feature]]
anchor = "bonus-feat"
head = "Bonus Feat"
listed = true
level = 12
print = "At 12th level, a martial artist gains an additional bonus feat, selected from those available in the monk class feature. This ability replaces abundant step."

[[entry.feature]]
anchor = "defensive-roll"
head = "Defensive Roll (Ex)"
listed = true
level = 13
print = "At 13th level, a martial artist may use the defensive roll advanced rogue talent once per day, plus once per three levels beyond 13th (to a maximum of 3 times a day at 19th level). This ability replaces diamond soul."
import_trades = ["Diamond soul"]

[[entry.feature]]
anchor = "quivering-palm"
head = "Quivering Palm"
listed = true
print = "A martial artist may use this ability one additional time per day per level above 15th, but may not have more than one in effect at a time."
import_trades = ["Quivering palm"]

[[entry.feature]]
anchor = "greater-defensive-roll"
head = "Greater Defensive Roll (Ex)"
listed = true
level = 19
print = "At 19th level, a martial artist suffers no damage on a successful defensive roll, and only half damage if the Reflex saving throw fails. This ability replaces empty body."
import_trades = ["Empty body"]

[[entry]]
id = "ref/arc-monk/master-of-many-styles"
opening = ["The master of many styles is a collector. For every move, he seeks a counter. For every style, he has a riposte. Ultimately, he seeks perfection through the fusion of styles."]

[[entry.feature]]
anchor = "bonus-feat"
head = "Bonus Feat"
listed = true
level = 1
print = "At 1st level, 2nd level, and every four levels thereafter, a master of many styles may select a bonus style feat or the [Elemental Fist](ref/feat/elemental-fist) feat. He does not need to meet the prerequisites of that feat, except the Elemental Fist feat. Starting at 6th level, a master of many styles can choose to instead gain a wildcard style slot. Whenever he enters one or more styles, he can spend his wildcard style slots to gain feats in those styles' feat paths (such as [Earth Child Topple](ref/feat/earth-child-topple)) as long as he meets the prerequisites. Each time he changes styles, he can also change these wildcard style slots. This ability replaces a monk's standard bonus feats."
import_trades = ["Standard bonus feats"]

[[entry.feature]]
anchor = "fuse-style"
head = "Fuse Style (Ex)"
listed = true
level = 1
print = '''
At 1st level, a master of many styles can fuse two of the styles he knows into a more perfect style. The master of many styles can have two style feat stances active at once. Starting a stance provided by a style feat is still a swift action, but when the master of many styles switches to another style feat, he can choose one style whose stance is already active to persist. He may only have two style feat stances active at a time.

At 8th level, the master of many styles can fuse three styles at once. He can have the stances of three style feats active at the same time. He gains a bonus on attack rolls equal to the number of styles whose stances he currently has active. Furthermore, he can enter up to three stances as a swift action.

At 15th level, the master of many styles can fuse four styles at once. He can have the stances of four style feats active at the same time. Furthermore, he can enter up to four stances as a free action by spending 1 point from his ki pool.

This ability replaces flurry of blows.'''
import_trades = ["Flurry of blows"]

[[entry.feature]]
anchor = "perfect-style"
head = "Perfect Style (Ex)"
listed = true
level = 20
print = "At 20th level, a master of many styles can have the stances of five style feats active at once, and can change those stances as a free action. This ability replaces perfect self."
import_trades = ["Perfect self"]

[[entry]]
id = "ref/arc-monk/sensei"
hold = "the replaces trade `Bonus feats gained at 6th, 10th, and 14th level` is not printed in a sentence, and no listed feature of that name prints it; Mystic Wisdom (Su): the sentence \"This ability replaces the bonus feats at 6th, 10th, and 14th level\" names no trade"
opening = ["The sensei is a revered teacher who imparts lessons on the oneness of mind, body, and spirit, along with occasional correction that is subtle and swift. Rather than using wisdom for his own benefit alone, he uses it to better those around him."]

[[entry.feature]]
anchor = "skills"
head = "Skills"
listed = true
print = "A sensei gains Diplomacy, Linguistics, and all Knowledge skills as class skills."

[[entry.feature]]
anchor = "advice"
head = "Advice (Ex)"
listed = true
print = "A sensei's advice is identical to bardic performance (using oratory), allowing him to [inspire courage](ref/performance/inspire-courage) at 1st level, [inspire competence](ref/performance/inspire-competence) at 3rd level, and [inspire greatness](ref/performance/inspire-greatness) at 9th level, as a bard of the sensei's level, usable a total number of rounds per day equal to his level + his Wisdom modifier (minimum 1). This ability replaces flurry of blows, fast movement, and improved evasion."
import_trades = ["Flurry of blows", "fast movement", "improved evasion"]

[[entry.feature]]
anchor = "insightful-strike"
head = "Insightful Strike (Ex)"
listed = true
level = 2
print = "At 2nd level, a sensei may use his Wisdom bonus in lieu of his Strength or Dexterity on attack rolls and combat maneuver checks with unarmed strikes or monk weapons. This ability replaces evasion and the bonus feat gained at 2nd level."
import_trades = ["Evasion", "bonus feat gained at 2nd level"]

[[entry.feature]]
anchor = "mystic-wisdom"
head = "Mystic Wisdom (Su)"
listed = true
level = 6
print = '''
At 6th level, a sensei may use his advice ability when spending points from his ki pool to activate a class ability (using the normal actions required for each) in order to have that ability affect one ally within 30 feet rather than the sensei himself. At 12th level, a sensei may affect all allies within 30 feet rather than himself (spending points from his ki pool only once, not once for each target).

At 10th level, a sensei may instead spend 1 point from his ki pool (as a swift action) while using advice to provide a single ally within 30 feet with evasion, fast movement, high jump, purity of body, or slow fall. At 14th level, a sensei may spend 2 points to grant one of the abilities listed above to all allies within 30 feet, or diamond body, diamond soul, or improved evasion to a single ally within 30 feet. These abilities function at the sensei's level and last 1 round. This ability replaces the bonus feats at 6th, 10th, and 14th level.'''
import_trades = ["Bonus feats gained at 6th", "10th", "14th level"]

[[entry]]
id = "ref/arc-monk/sohei"
opening = ["The sohei are masters of the horse and the hunt. A monastic soldier, the sohei is equally adept at combat afoot or on horseback."]

[[entry.feature]]
anchor = "skills"
head = "Skills"
listed = true
print = "A sohei gains Handle Animal as a class skill."

[[entry.feature]]
anchor = "weapon-and-armor-proficiency"
head = "Weapon and Armor Proficiency"
listed = false
print = "A sohei is proficient with all simple and martial weapons and with light armor, instead of a monk's usual weapon and armor proficiencies. This ability alters the monk's weapon and armor proficiencies."
import_trades = ["Weapon", "armor proficiencies"]

[[entry.feature]]
anchor = "bonus-feats"
head = "Bonus Feats"
listed = false
print = "A sohei may select [mounted combat](ref/feat/mounted-combat) feats as bonus feats."

[[entry.feature]]
anchor = "devoted-guardian"
head = "Devoted Guardian (Ex)"
listed = true
level = 1
print = "At 1st level, a sohei can always act in a surprise round even if he does not notice his enemies, though he remains [flat-footed](ref/rule/flat-footed) until he acts. In addition, a sohei gains a bonus on initiative rolls equal to 1/2 his monk level. At 20th level, a sohei's initiative roll is automatically a natural 20. This ability replaces stunning fist."
import_trades = ["Stunning fist"]

[[entry.feature]]
anchor = "unarmed-strike"
head = "Unarmed Strike"
listed = true
print = "A sohei's unarmed strike damage does not increase at 4th level and above."

[[entry.feature]]
anchor = "monastic-mount"
head = "Monastic Mount (Su)"
listed = true
level = 4
print = "At 4th level, a sohei may spend 1 point from his ki pool to grant his mount [temporary hit points](ref/rule/temporary-hit-points) equal to twice his level for 1 hour per level. In addition, as long as the sohei and his mount are adjacent, including when mounted, the mount gains any of the following abilities the sohei possesses: AC bonus, diamond soul, evasion, high jump, improved evasion, ki strike (as long as the sohei has at least 1 point in his ki pool), perfect self, and still mind. When a sohei spends points from his ki pool, his mount gains the same benefits as the sohei. This ability replaces fast movement and increased unarmed damage."
import_trades = ["Fast movement", "increased unarmed damage"]

[[entry.feature]]
anchor = "ki-weapon"
head = "Ki Weapon (Su)"
listed = true
level = 4
print = "At 4th level, as a swift action, a sohei may spend 1 point from his ki pool to grant any weapon he wields (including his unarmed strike) a +1 enhancement bonus on attack and damage rolls, increasing by +1 per four levels after 4th to a maximum bonus of +5 at 20th level, until the end of his next turn. This ability replaces slow fall and abundant step."
import_trades = ["Slow fall", "abundant step"]

[[entry.feature]]
anchor = "weapon-training"
head = "Weapon Training (Ex)"
listed = true
level = 6
print = "At 6th level, a sohei gains weapon training in one of the following [weapon groups](ref/ability/weapon-groups), as the [fighter](ref/class/fighter) class feature: bows, crossbows, monk weapons, polearms, spears, or thrown weapons. He may select an additional group of weapons for every six levels after 6th, to a maximum of three at 18th level. A sohei may use flurry of blows and ki strike with any weapon in which he has weapon training. This ability replaces purity of body, diamond body, quivering palm, timeless body, and tongue of the sun and moon."
import_trades = ["Purity of body", "diamond body", "quivering palm", "timeless body", "tongue of sun", "moon"]

[[entry]]
id = "ref/arc-monk/tetori"
opening = ["The style of the tetori is that of the majestic wrestler—a warrior with a dizzying array of grabs, holds, and locks with which to bewilder and incapacitate his foes."]

[[entry.feature]]
anchor = "bonus-feat"
head = "Bonus Feat"
listed = true
print = "A tetori gains the following bonus feats: 1st level—[Improved Grapple](ref/feat/improved-grapple), 2nd level—[Stunning Pin](ref/feat/stunning-pin), 6th level—[Greater Grapple](ref/feat/greater-grapple), 10th level—Pinning Knockout, 14th level—[Chokehold](ref/feat/chokehold), 18th level—[Neckbreaker](ref/feat/neckbreaker). These feats replace a monk's normal bonus feats."
import_trades = ["Bonus feats"]

[[entry.feature]]
anchor = "graceful-grappler"
head = "Graceful Grappler (Ex)"
listed = true
print = "A tetori uses his monk level in place of his base attack bonus to determine CMB and CMD for grappling. At 4th level, he suffers no penalties on attack rolls, can make attacks of opportunity while grappling, and retains his Dexterity bonus to AC when pinning an opponent or when [grappled](ref/rule/grapple-conditions). At 8th level, a tetori gains the [grab](ref/umr/grab) special attack when using unarmed strikes, and can use this ability against creatures his own size or smaller by spending 1 point from his ki pool, or against larger creatures by spending 2 points from his ki pool. At 15th level, a tetori gains the [constrict](ref/umr/constrict) special attack, inflicting his unarmed strike damage on any successful [grapple](ref/rule/grapple) check. This ability replaces flurry of blows."
import_trades = ["Flurry of blows"]

[[entry.feature]]
anchor = "counter-grapple"
head = "Counter-Grapple (Ex)"
listed = true
level = 4
print = "At 4th level, a tetori wrestler may make an attack of opportunity against a creature attempting to grapple him. This ability does not allow the tetori to make an attack of opportunity against a creature with the Greater Grapple feat. At 6th level, he may use counter-grapple even if his attacker has [concealment](ref/rule/concealment) or total concealment, at 8th level even if he is flat-footed, and at 10th level even if his attacker has exceptional reach. This ability replaces slow fall."
import_trades = ["Slow fall"]

[[entry.feature]]
anchor = "break-free"
head = "Break Free (Ex)"
listed = true
level = 5
print = "At 5th level, a tetori adds his monk level on combat maneuver or Escape Artist checks made to escape a grapple. If a tetori fails a save against an effect that causes him to become [entangled](ref/rule/entangled), [paralyzed](ref/rule/paralyzed), [slowed](ref/spell/slow), or [staggered](ref/misc/staggered), he may spend 1 point from his ki pool as an immediate action to attempt a new save. This ability replaces high jump."
import_trades = ["High jump"]

[[entry.feature]]
anchor = "inescapable-grasp"
head = "Inescapable Grasp (Su)"
listed = true
level = 9
print = "At 9th level, a tetori can spend 1 point from his ki pool to suppress his opponents' _[freedom of movement](ref/spell/freedom-of-movement)_ and magical bonuses to Escape Artist or on checks to escape a grapple. At 13th level, this ability also duplicates the effect of _[dimensional anchor](ref/spell/dimensional-anchor)_. At 17th level, the tetori's unarmed strike gains the _[ghost touch](ref/magic-enh/ghost-touch-weapon)_ special ability, and an [incorporeal](ref/subtype/incorporeal) creature that he strikes gains the grappled condition (Reflex negates, DC 10 + 1/2 the wrestler's level + his Wisdom modifier). Inescapable grasp is a swift action and lasts until the beginning of the wrestler's next turn. This ability replaces abundant step, improved evasion, timeless body, and tongue of the sun and moon."
import_trades = ["Abundant step", "improved evasion", "timeless body", "tongue of sun", "moon"]

[[entry.feature]]
anchor = "form-lock"
head = "Form Lock (Su)"
listed = true
level = 13
print = "At 13th level, a tetori can negate a polymorph effect by touch with a Wisdom check, adding a bonus equal to his monk level, against a DC of 11 + the caster level of the effect (or HD of the creature, for supernatural polymorph effects). This is a standard action requiring 2 points from the tetori's ki pool, or an immediate action if a creature the tetori is grappling attempts to use a polymorph effect. This ability replaces diamond soul."
import_trades = ["Diamond soul"]

[[entry.feature]]
anchor = "iron-body"
head = "Iron Body (Su)"
listed = true
level = 19
print = "At 19th level, as a move action, a tetori can make his tissues ultra-dense for 1 minute as the _[iron body](ref/spell/iron-body)_ spell by spending 3 points from his ki pool. This ability replaces empty body."
import_trades = ["Empty body"]

[[entry]]
id = "ref/arc-paladin/divine-hunter"
hold = "the replaces trade `Aura of righteousness` is not printed in a sentence, and no listed feature of that name prints it; Righteous Hunter (Su): the sentence \"This ability replaces aura of faith\" names no trade"
opening = ["Most paladins rush into battle, meeting evil toe-to-toe. The divine hunter prefers to engage evil from afar, striking down her foes before they can threaten her allies."]

[[entry.feature]]
anchor = "precise-shot"
head = "Precise Shot"
listed = true
print = "A divine hunter gains [Precise Shot](ref/feat/precise-shot) as a bonus feat at 1st level, even if she doesn't meet the prerequisites. This ability replaces her Heavy Armor Proficiency."
import_trades = ["Heavy Armor Proficiency"]

[[entry.feature]]
anchor = "shared-precision"
head = "Shared Precision (Su)"
listed = true
level = 3
print = "At 3rd level, when a divine hunter hits a creature with a ranged attack, she grants her allies within 10 feet of her the benefit of the Precise Shot feat against that target until the start of her next turn. Her allies must remain within 10 feet of her, and must be able both to see and hear the divine hunter to gain this benefit. This ability replaces aura of courage."
import_trades = ["Aura of courage"]

[[entry.feature]]
anchor = "divine-bond"
head = "Divine Bond (Su)"
listed = true
level = 5
print = "At 5th level, a divine hunter forms a bond with her deity. This functions as the paladin's divine bond ability, except the bond must always take the form of a ranged or throwing weapon (excluding ammunition). In addition to the listed abilities, a divine hunter can add the _[distance](ref/magic-enh/distance)_, _[returning](ref/magic-enh/returning)_, or _[seeking](ref/magic-enh/seeking)_ special abilities to her weapon, but she cannot add the _defending_ or _disruption_ special abilities. Special abilities added to throwing weapons function normally when the weapon is used in melee. This ability replaces the standard paladin's divine bond."
import_trades = ["Divine bond"]

[[entry.feature]]
anchor = "distant-mercy"
head = "Distant Mercy (Sp)"
listed = true
level = 6
print = "At 6th level, a divine hunter can expend two uses of her lay on hand abilities to use her lay on hands ability on a target within 5 feet per paladin level. Distant mercy has no effect on creatures harmed by positive energy, such as undead. This ability replaces the paladin's 6th-level mercy."
import_trades = ["6th-level mercy"]

[[entry.feature]]
anchor = "aura-of-care"
head = "Aura of Care (Su)"
listed = true
level = 8
print = "At 8th level, a divine hunter and her allies gain a preternatural awareness of each other's position in battle. She and any allies within 10 feet of her no longer provide [cover](ref/rule/cover) against each other's ranged attacks unless they wish to. Allies who cannot move or otherwise take actions still provide cover, as do [flat-footed](ref/rule/flat-footed) allies. The divine hunter and her allies must be able to see or hear each other to use this ability. This ability replaces aura of resolve."
import_trades = ["Aura of resolve"]

[[entry.feature]]
anchor = "hunter-s-blessing"
head = "Hunter's Blessing (Su)"
listed = true
level = 11
print = "At 11th level, a divine hunter can expend a use of her smite evil ability as a swift action to grant herself and all allies within 10 feet the [Deadly Aim](ref/feat/deadly-aim), Precise Shot, and [Improved Precise Shot](ref/feat/improved-precise-shot) feats, even if they lack the prerequisites. The effects last for 1 minute. Evil creatures gain no benefit from this ability. This ability replaces aura of justice."
import_trades = ["Aura of justice"]

[[entry.feature]]
anchor = "righteous-hunter"
head = "Righteous Hunter (Su)"
listed = true
level = 14
print = '''
At 14th level, a divine hunter's ranged weapons are treated as good-aligned for the purposes of overcoming [damage reduction](ref/rule/damage-reduction). Any ranged attacks made by an ally within 10 feet of her are likewise treated as good-aligned for the purposes of overcoming damage reduction.

This ability functions only while the divine hunter is conscious. This ability replaces aura of faith.'''
import_trades = ["Aura of righteousness"]

[[entry]]
id = "ref/arc-paladin/empyreal-knight"
opening = ["The empyreal knight dedicates her life to serving the celestial beings that guide mortals in their struggle toward the light."]

[[entry.feature]]
anchor = "voices-of-the-spheres"
head = "Voices of the Spheres"
listed = true
level = 2
print = "At 2nd level, an empyreal knight learns to speak and read Celestial, if she could not already. This ability replaces divine grace."
import_trades = ["Divine grace"]

[[entry.feature]]
anchor = "celestial-heart"
head = "Celestial Heart (Su)"
listed = true
print = '''
As an empyreal knight advances, her ties with the celestial realms grant her a portion of the abilities and defenses of true [angels](ref/family/angel). At 3rd level, she gains resistance 5 against acid, cold, and electricity. At 6th level, she gains a +4 racial bonus on saves against poison. At 9th level, her defenses improve to resistance 10 against acid, cold, and electricity. At 12th level, she gains immunity to petrification.

At 15th level, she gains truespeech, the ability to speak with any creature that has a language as though using a _[tongues](ref/spell/tongues)_ spell. This ability functions with a caster level equal to her character level, and is always active.

At 18th level, as a swift action, the empyreal knight can manifest a protective aura against evil. Against abilities or effects created by evil creatures, this ability provides a +4 deflection bonus to AC and a +4 resistance bonus on saving throws to anyone within 20 feet of her. It otherwise functions as a _[magic circle against evil](ref/spell/magic-circle-against-evil)_. She can use this ability for a maximum of 1 round per day per paladin level. These rounds do not need to be consecutive. These abilities replace mercy.'''
import_trades = ["Mercy"]

[[entry.feature]]
anchor = "celestial-ally"
head = "Celestial Ally (Sp)"
listed = true
level = 4
print = "At 4th level, an empyreal knight can summon a [celestial](ref/template/celestial) ally as a full-round action. This functions as _[summon monster I](ref/spell/summon-monster-1)_, except it can only be used to summon celestial creatures, [archons](ref/family/archon), and angels. At 6th level, this improves to _summon monster II_, increasing by one spell level for every two levels thereafter, to a maximum of _summon monster IX_ at 20th level. This ability can be used a number of times per day equal to the empyreal knight's Charisma modifier (minimum 1), but only one ally can be summoned at a time. This ability replaces lay on hands and channel positive energy."
import_trades = ["Lay on hands", "channel positive energy"]

[[entry.feature]]
anchor = "divine-bond"
head = "Divine Bond (Su)"
listed = true
level = 5
print = "At 5th level, an empyreal knight forms a bond with a mount, as the standard paladin ability. Her mount gains the celestial template at 8th level. At 12th level, her mount sprouts wings if it cannot already fly, and gains a fly speed of twice its land speed and good maneuverability. If the mount could already fly, its fly speed and maneuverability improve to at least this level. This ability otherwise functions as the paladin ability of the same name."
import_trades = ["Divine bond"]

[[entry.feature]]
anchor = "empyreal-champion"
head = "Empyreal Champion"
listed = true
level = 20
print = "At 20th level, an empyreal knight transcends her mortal self. Her DR increases to 10/evil. Her type is treated as [outsider](ref/type/outsider) for the purposes of spells and magical effects. She gains [darkvision](ref/rule/darkvision) 60 feet and [low-light vision](ref/rule/low-light-vision). As a standard action and a supernatural ability, she can sprout wings that allow her to fly at twice her land speed with average maneuverability. Any armor or clothing reshapes to allow her to fly when she uses this ability. She can retract the wings as a free action. Unlike other outsiders, an empyreal knight can still be brought back from the dead as if she were a member of her previous creature type. This ability replaces holy champion."
import_trades = ["Holy champion"]

[[entry]]
id = "ref/arc-paladin/holy-gun"
opening = ["Not all paladins are knights in shining armor. Holy guns roam the world searching for evil. And where they find it, they put it down."]

[[entry.feature]]
anchor = "weapon-and-armor-proficiency"
head = "Weapon and Armor Proficiency"
listed = false
print = "Holy guns are proficient with all simple and martial weapons, firearms, and light armor."

[[entry.feature]]
anchor = "have-gun"
head = "Have Gun"
listed = true
level = 1
print = "At 1st level, the holy gun gains the [Amateur Gunslinger](ref/feat/amateur-gunslinger) feat and [Gunsmithing](ref/feat/gunsmithing) as a bonus feat. She also gains a battered gun identical to the one gained by the [gunslinger](ref/class/gunslinger). This ability replaces detect evil."
import_trades = ["Detect evil"]

[[entry.feature]]
anchor = "divine-deed"
head = "Divine Deed"
listed = true
level = 2
print = "At 2nd level, the holy gun gains the following deed. This deed works and interacts with grit the same way as gunslinger deeds, but only the holy gun can use it. If the holy gun also has levels in gunslinger, she can spend grit points from that class to use this deed."
import_trades = ["Smite evil"]

[[entry.feature]]
anchor = "smiting-shot"
head = "Smiting Shot (Su)"
listed = true
print = "A holy gun can spend 1 grit point to make a smiting shot with a firearm attack as a standard action. If the target is evil, the holy gun adds her Charisma bonus and her paladin level to the damage of the firearm attack. If the target of the smiting shot is an outsider with the evil subtype, an evil-aligned dragon, or an undead creature, the bonus to damage increases to the Charisma modifier plus 2 points of damage per level the paladin possess. Regardless of the target, smiting shot automatically bypasses any DR the creature might have. This ability replaces smite evil."

[[entry.feature]]
anchor = "divine-bond"
head = "Divine Bond"
listed = true
level = 5
print = "At 5th level, a holy gun forms a bond with her deity. This functions as the paladin's divine bond ability, except the bond must always take the form of a firearm. In addition to the listed abilities, a holy gun can add the _[distance](ref/magic-enh/distance)_, _[reliable](ref/magic-enh/reliable)_, or _[seeking](ref/magic-enh/seeking)_ special abilities to her weapon, but she cannot add the _defending_ or _disruption_ special abilities. This ability replaces the standard paladin's divine bond."
import_trades = ["Divine bond"]

[[entry.feature]]
anchor = "holy-grit"
head = "Holy Grit (Ex)"
listed = true
level = 11
print = "At 11th level, a holy gun gains a number of grit points equal to her Charisma modifier (minimum 1) and gains the use of a single gunslinger deed. She can select any deed that a gunslinger of her paladin level -4 could use. At 14th level, and every three levels beyond 14th, the holy gun gains another point of grit and another gunslinger deed that a gunslinger of her level -4 could use. If she already has levels in gunslinger, she gains a bonus to the maximum amount of grit she can have each day, equal to her Charisma bonus (if any) but gains no extra grit as the start of each day."

[[entry.feature]]
anchor = "holy-slinger"
head = "Holy Slinger (Ex)"
listed = true
print = "This ability function like the holy champion paladin class feature, but the _banishment_ occurs when she hits an evil outsider with the smiting shot deed."
import_trades = ["Holy champion"]

[[entry]]
id = "ref/arc-paladin/holy-tactician"
opening = ["The holy tactician inspires her allies on the field of battle. Her place is at their side against overwhelming odds, and her guidance brings out their true potential."]

[[entry.feature]]
anchor = "weal-s-champion"
head = "Weal's Champion (Su)"
listed = true
print = '''
Once per day as swift action, a holy tactician can call on the powers of good to aid her against evil. Against evil targets, the holy tactician gains her Charisma bonus (if any) on her attack rolls against evil creatures, and if she hits, she adds 1/2 her paladin level on her weapon damage rolls as well. These bonuses last for 1 round for every two paladin levels the holy tactician has attained (minimum 1 round).

In addition, for 1 round after the holy tactician successfully strikes an evil creature, all non-evil allies within 30 feet of her gain a competence bonus on attack rolls equal to 1/2 her Charisma bonus against that creature as well as a +1 competence bonus on damage rolls. The bonus on damage rolls increases by +1 for every five levels the holy tactician attains (to a maximum of +5 at 20th level). She can grant this bonus against more than one creature at a time. To gain this benefit, the holy tactician's allies must be able to see or hear her, and she must be conscious.

At 4th level, and every three levels thereafter, the holy tactician may use weal's champion one additional time per day (to a maximum of seven times per day at 19th level). This ability replaces smite evil.'''
import_trades = ["Smite evil"]

[[entry.feature]]
anchor = "tactical-acumen"
head = "Tactical Acumen (Ex)"
listed = true
level = 3
print = "At 3rd level, a holy tactician gains a teamwork feat as a bonus feat. She must meet the prerequisites for this feat. She gains an additional bonus feat for every four levels attained after 3rd, to a maximum of five bonus feats at 19th level. This ability replaces divine health and divine bond."
import_trades = ["Divine health", "divine bond"]

[[entry.feature]]
anchor = "battlefield-presence"
head = "Battlefield Presence (Su)"
listed = true
level = 3
print = "At 3rd level, a tactician can direct her allies in battle, granting each ally within 30 feet one teamwork feat she possesses as a bonus feat as a standard action. All allies must receive the same feat, but do not need to meet the prerequisites of this bonus feat. This ability does not function if the paladin is [flat-footed](ref/rule/flat-footed) or unconscious. Allies must be able to see and hear the holy tactician in order to gain this benefit. Changing the bonus feat granted is a swift action. This ability replaces aura of courage."
import_trades = ["Aura of courage"]

[[entry.feature]]
anchor = "guide-the-battle"
head = "Guide the Battle (Ex)"
listed = true
level = 8
print = "At 8th level, the paladin can direct her allies into an advantageous position once per round as a move action. Each ally (if physically able to) can move 5 feet without expending an action. This movement does not provoke attacks of opportunity. The allies must be able to see or hear the paladin in order to make this movement and cannot be flat-footed. At 15th level, her allies can make this 5-foot move and ignore [difficult terrain](ref/rule/terrain-and-obstacles). This ability replaces aura of resolve."
import_trades = ["Aura of resolve"]

[[entry.feature]]
anchor = "weal-s-wrath"
head = "Weal's Wrath (Su)"
listed = true
level = 11
print = "At 11th level, a tactician can expend two uses of her weal's champion ability at once to enhance its effects. This functions as weal's champion, except the bonus she provides to her allies lasts until each creature she strikes is slain, her weal's champion ability expires, or the paladin herself is slain or knocked unconscious, whichever happens first. This ability replaces aura of justice."
import_trades = ["Aura of justice"]

[[entry.feature]]
anchor = "masterful-presence"
head = "Masterful Presence (Su)"
listed = true
level = 20
print = "At 20th level, a tactician gains the ability to grant a different bonus feat to each ally affected by her battlefield presence. In addition, all critical threats made by her and her allies against creatures affected by her weal's champion ability are automatically confirmed (no confirmation roll is needed). This ability replaces holy champion."
import_trades = ["Holy champion"]

[[entry]]
id = "ref/arc-paladin/sacred-shield"
opening = ["When faced by evil, the sacred shield reaches first not for a weapon, but for her trusty shield. With her faith, she can ward others from harm."]

[[entry.feature]]
anchor = "bastion-of-good"
head = "Bastion of Good (Su)"
listed = true
level = 1
print = "At 1st level, a sacred shield can call upon the powers of good to defend her and her allies against evil. This ability functions as smite evil, except that the paladin gains no benefit on attack or damage rolls against her target. Instead, any attacks the target makes against allies within 10 feet of the paladin deal half damage. Attacks against the paladin deal full damage, but the paladin gains a deflection bonus to her AC equal to her Charisma bonus (if any) against attacks made by the target of the smite. This bonus increases by +1 for every four paladin levels (to a maximum of +6 at 20th level). As with smite evil, if the paladin targets a creature that is not evil, her bastion of good ability is wasted with no effect. Feats, abilities, and the like that increase a paladin's number of uses of smite evil per day increase a sacred shield's uses of bastion of good per day. This ability replaces smite evil."
import_trades = ["Smite evil"]

[[entry.feature]]
anchor = "holy-shield"
head = "Holy Shield (Su)"
listed = true
level = 4
print = "At 4th level, a sacred shield can channel her faith into her shield, protecting any nearby allies. All allies adjacent to the paladin gain a shield bonus equal to the sacred shield's own shield bonus, including any increase from the shield's enhancement bonus. This bonus does not stack with any existing shield bonuses. The paladin herself radiates [light](ref/spell/light) as a _light_ spell while the shielding is active. At 11th level, this protection expands to cover any allies within 10 feet and the radiance increases to the effects of a _[daylight](ref/spell/daylight)_ spell. At 20th level, any allies within 20 feet are protected. Using this ability consumes two uses of the sacred shield's lay on hands ability, and the effects last for 3 rounds plus a number of rounds equal to her Charisma bonus (if any). This ability replaces channel positive energy."
import_trades = ["Channel positive energy"]

[[entry.feature]]
anchor = "divine-bond"
head = "Divine Bond (Su)"
listed = true
level = 5
print = '''
At 5th level, instead of forming a divine bond with her weapon or a mount, a sacred shield forms a bond with her shield. As a standard action, a sacred shield can enhance her shield by calling on the aid of a celestial spirit. This bond lasts for 1 minute per paladin level. When called, the spirit causes the shield to shed light like a [torch](ref/eq-misc/torch). At 5th level, the spirit grants the shield a +1 enhancement bonus. For every three levels beyond 5th, the shield gains another +1 enhancement bonus, to a maximum of +6 at 20th level. These bonuses can be added to the shield, stacking with existing enhancement bonuses to a maximum of +5, or they can be used to add any of the following armor special abilities: _[arrow deflection](ref/magic-enh/arrow-deflection)_, _[bashing](ref/magic-enh/bashing)_, _[blinding](ref/magic-enh/blinding)_, _[fortification](ref/magic-enh/fortification)_ (any), _[reflecting](ref/magic-enh/reflecting)_, and _[spell resistance](ref/magic-enh/spell-resistance)_ (any). The _reflecting_ enhancement may be used once each time the sacred shield makes use of her divine bond. Adding these armor special abilities consumes an amount of bonus equal to the property's cost. These bonuses are added to any properties the shield already has, but duplicate special abilities do not grant any extra benefit. If the shield is not magical, at least a +1 enhancement bonus must be added before any other special abilities can be added. The bonus and special abilities granted by the spirit are determined when the spirit is called and cannot be changed until the spirit is called again. The celestial spirit imparts no bonuses if the shield is used by anyone other than the sacred shield, but it resumes giving bonuses if the sacred shield resumes using the shield. A sacred shield can use this ability once per day at 5th level, and one additional time per day for every four levels beyond 5th, to a maximum of four times per day at 17th level.

If a shield with a celestial spirit is destroyed, the sacred shield loses the use of this ability for 30 days, or until she gains a level, whichever comes first. During this period, the sacred shield takes a -1 penalty to her armor class and on saving throws.'''

[[entry.feature]]
anchor = "improved-bastion"
head = "Improved Bastion"
listed = true
level = 11
print = "At 11th level, the radius of a sacred shield's bastion of good ability increases to 20 feet. This ability replaces the paladin's aura of justice."
import_trades = ["Aura of justice"]

[[entry.feature]]
anchor = "perfect-bastion"
head = "Perfect Bastion"
listed = true
level = 20
print = "At 20th level, a sacred shield and her allies within 20 feet gain [regeneration](ref/umr/regeneration) 10 against the target of her bastion of good ability (essentially regeneration that is overcome by any damage not caused by the target). This ability replaces the sacred shield's holy champion ability."
import_trades = ["Holy champion"]

[[entry]]
id = "ref/arc-ranger/battle-scout"
hold = "the replaces trade `2nd favored enemy` is not printed in a sentence, and no listed feature of that name prints it; the replaces trade `3rd favored enemy` is not printed in a sentence, and no listed feature of that name prints it; the replaces trade `4th favored enemy` is not printed in a sentence, and no listed feature of that name prints it; Advantageous Terrain (Ex): the sentence \"This ability replaces the ranger's second favored enemy\" names no trade; Infiltration (Ex): the sentence \"This ability replaces the ranger's third favored enemy\" names no trade; Superior Tactics (Ex): the sentence \"This ability replaces the ranger's fourth favored enemy\" names no trade"
opening = ["Armies need clean water, safe routes, and intelligence about their enemies. Though regular outdoorsmen might suffice in many cases, some large forces look to battle scouts to keep the body of their troops safe and prepared for the terrain and whatever dangers that terrain hides."]

[[entry.feature]]
anchor = "hunter-s-bond"
head = "Hunter's Bond (Ex)"
listed = true
level = 4
print = "At 4th level, when a battle scout gains the hunter's bond ability, he must choose to bond with his companions. Battle scouts do not have animal companions."
import_trades = ["Hunter's bond"]

[[entry.feature]]
anchor = "advantageous-terrain"
head = "Advantageous Terrain (Ex)"
listed = true
level = 5
print = "At 5th level, when a battle scout is within one of his favored terrains, he can spend up to 3 consecutive rounds studying an area of terrain to gain the benefits below. Each round of studying terrain is a standard action. During the first round of studying terrain, the battle scout designates a 60-foot-radius-[burst](ref/misc/burst) area from anywhere within line of sight. Depending on how many rounds the battle scout spends studying the area, he or his allies gain the following benefits for 10 minutes per ranger level he possesses. (For example, if he spends 2 rounds, he or his allies gain the first two benefits.)"
import_trades = ["2nd favored enemy"]

[[entry.feature]]
anchor = "1st-round"
head = "1st Round"
listed = false
parent = "advantageous-terrain"
print = "Allies within line of sight and that can hear the battle scout gain a +2 bonus on initiative checks while within the advantageous terrain area."

[[entry.feature]]
anchor = "2nd-round"
head = "2nd Round"
listed = false
parent = "advantageous-terrain"
print = "Allies within line of sight and that can hear the battle scout gain a +2 on Perception, Stealth, and Survival checks while within the advantageous terrain area."

[[entry.feature]]
anchor = "3rd-round"
head = "3rd Round"
listed = false
parent = "advantageous-terrain"
print = '''
The battle scout's movement is not hampered by [difficult terrain](ref/rule/terrain-and-obstacles) while within the advantageous terrain area. Furthermore, the battle scout can take 10 on Climb and Swim checks and checks to jump while within the area, even when in immediate danger or distracted.

This ability replaces the ranger's second favored enemy.'''

[[entry.feature]]
anchor = "infiltration"
head = "Infiltration (Ex)"
listed = true
level = 10
print = "At 10th level, once per day, a battle scout can choose a single terrain type that is not his favored terrain. For the next hour per ranger level, he treats that terrain as if it were one of his favored terrains. This ability replaces the ranger's third favored enemy."
import_trades = ["3rd favored enemy"]

[[entry.feature]]
anchor = "superior-tactics"
head = "Superior Tactics (Ex)"
listed = true
level = 15
print = "At 15th level, once per day, after a battle scout and his allies roll initiative, the battle scout can arrange his and his allies' initiative rolls any way he wishes. If he has already taken 3 rounds to scout out the terrain with his advantageous terrain ability and both he and his allies are within the effect area, they gain a +2 bonus to initiative checks. Using this ability is not an action. This ability replaces the ranger's fourth favored enemy."
import_trades = ["4th favored enemy"]

[[entry.feature]]
anchor = "perfect-advantage"
head = "Perfect Advantage (Ex)"
listed = true
level = 20
print = "At 20th level, when using his advantageous terrain ability, a battle scout needs only to study the terrain as a standard action to gain all of the benefits. Furthermore, the area of his advantageous terrain increases to a 1-mile-radius [spread](ref/misc/spread) from the single square within line of sight. This ability replaces master hunter."
import_trades = ["Master hunter"]

[[entry]]
id = "ref/arc-ranger/deep-walker"
opening = ["Some rangers devote their lives to the woods, becoming hunters, protectors, and wilderness guides among its diverse terrain types. The deep walker is instead a master of the strange terrain of the deep earth, exploring its caverns and caves, becoming a master of the dark corridors most surface dwellers fear to explore—and perhaps the reason they fear to explore them."]

[[entry.feature]]
anchor = "deep-knowledge"
head = "Deep Knowledge (Ex)"
listed = true
level = 3
print = "At 3rd level, a deep walker gains a +2 bonus on initiative checks and Knowledge (dungeoneering), Perception, Stealth, and Survival skill checks while underground (in caves and dungeons). Every 5 levels thereafter, the deep walker gains an additional +3 on each of those checks while underground (to a maximum of +11 at 18th level). This ability replaces favored terrain."
import_trades = ["Favored terrain"]

[[entry.feature]]
anchor = "rock-hopper"
head = "Rock Hopper (Ex)"
listed = true
level = 7
print = "At 7th level, a deep walker instinctively grasps for the most stable surfaces and holds on tighter while moving over underground rock and stone. The deep walker gains a +5 bonus on all Acrobatics and Climb checks made to traverse underground terrain. Furthermore, the deep walker ignores [difficult terrain](ref/rule/terrain-and-obstacles) created by underground terrain and subterranean flora. This ability replaces woodland stride."
import_trades = ["Woodland stride"]

[[entry.feature]]
anchor = "deep-walker-camouflage"
head = "Deep Walker Camouflage (Ex)"
listed = true
level = 12
print = "At 12th level, a deep walker can use the Stealth skill to hide in underground environments, even if the terrain does not grant cover or concealment. This ability replaces camouflage."
import_trades = ["Camouflage"]

[[entry.feature]]
anchor = "one-with-the-stone"
head = "One with the Stone (Ex)"
listed = true
level = 17
print = "At 17th level, a deep walker can use the Stealth skill while he is underground, even when being observed. This ability replaces hide in plain sight."
import_trades = ["Hide in plain sight"]

[[entry]]
id = "ref/arc-ranger/falconer"
hold = "the replaces trade `6th-level combat style feat` is not printed in a sentence, and no listed feature of that name prints it; Swoop for the Kill (Ex): the sentence \"This ability replaces the combat style feat the ranger gains at 6th level\" names no trade"
opening = ["Rangers have always enjoyed a special bond with a specific animal, but the falconer takes this bond to a deeper level. Falconers begin with their companion earlier than other rangers, and have the ability to teach their companions special tricks."]

[[entry.feature]]
anchor = "feathered-companion"
head = "Feathered Companion (Ex)"
listed = true
level = 1
print = '''
At 1st level, a falconer earns the trust and companionship of a [bird](ref/companion/bird) of prey. The bird can be of any type of large hunting or scavenging bird (even a vulture). This ability functions like the druid [animal companion](ref/sidekick/animal-companion) ability (which is part of the nature bond class feature), but the falconer must take the bird animal companion, and that companion has only half the normal hit points.

The falconer cannot teach the bird of prey the work trick, but can teach it either the roam or distract trick for free. Whichever trick the falconer does not pick then can be picked as a trick later.'''
import_trades = ["Wild empathy"]

[[entry.feature]]
anchor = "roam-dc-15"
head = "Roam (DC 15)"
listed = false
parent = "feathered-companion"
print = "The falconer can let his animal companion loose to roam and forage. He must let it roam for no more than a week. When the falconer lets it roam, it agrees to return to the place he let it loose within the time period he designates."

[[entry.feature]]
anchor = "distract-dc-20-bird-only"
head = "Distract (DC 20; bird only)"
listed = false
parent = "feathered-companion"
print = '''
The animal companion flutters wildly around any enemy it would normally attack with the attack trick. It makes an attack roll against that enemy. On a hit, the enemy is [shaken](ref/misc/shaken) for 1 round.

This ability replaces wild empathy.'''

[[entry.feature]]
anchor = "hunter-s-bond"
head = "Hunter's Bond (Ex)"
listed = true
level = 4
print = "At 4th level, a falconer must select an animal companion when he gains hunter's bond. He does not gain a new companion at 4th level; rather, his feathered companion gains full hit points."

[[entry.feature]]
anchor = "swoop-for-the-kill"
head = "Swoop for the Kill (Ex)"
listed = true
level = 6
print = "At 6th level, when outdoors, a falconer can direct his feathered companion to strike an enemy from high above. His feathered companion gains the following trick as a bonus trick."
import_trades = ["6th-level combat style feat"]

[[entry.feature]]
anchor = "swooping-charge-dc-20-bird"
head = "Swooping Charge (DC 20; bird)"
listed = false
parent = "swoop-for-the-kill"
print = '''
The falconer's bird companion flies up and then swoops down into a [charge](ref/rule/charge). To perform this trick, the companion must be able to fly, and it must be outdoors or someplace with enough room for the bird to fly great distances in (a grand cathedral may have enough room, but dungeons usually do not). It spends a full-round action flying to a high vantage point, and on the next round makes a charge attack upon an enemy the falconer designates. If that charge attack hits, the bird deals 2d4 points of damage instead of 1d4 with its bite and gains a ×4 critical modifier when making the attack. If the bird hits, the target is [staggered](ref/misc/staggered) for 1 round.

This ability replaces the combat style feat the ranger gains at 6th level.'''

[[entry]]
id = "ref/arc-ranger/trophy-hunter"
opening = ["Some rangers have taken up the mysteries of black powder in order to become big game hunters. Finding firearms useful for taking down large and dangerous prey, they enter the fight with the crack of black powder fire, often ranging far and wide in their safaris and searches for ever-more-dangerous denizens of the wild to track, study, appreciate—and kill. While this might strike some as going against the ranger's usual respect for nature and the creatures of the wild, trophy hunters understand that they are just more pieces in nature's grand puzzle, and that the laws of the jungle—the right to kill and feed on those weaker than you, and the need to establish dominance through cunning and bloodshed—are both their rights and their duty as the current top of the food chain."]

[[entry.feature]]
anchor = "improved-tracking"
head = "Improved Tracking (Ex)"
listed = true
level = 1
print = "At 1st level, a trophy hunter gains a +2 bonus on Survival skill checks when following or identifying tracks. When he tracks, he can also attempt a Knowledge (nature) check at DC 15. On a success, the trophy hunter can discern the type and condition of any animals or magical beasts he tracks. By studying their tracks, the trophy hunter is able to identify a rough approximation of their health, maneuverability, and their general behavior as compared to the norm. This ability replaces wild empathy."
import_trades = ["Wild empathy"]

[[entry.feature]]
anchor = "firearm-style"
head = "Firearm Style"
listed = true
level = 2
print = "At 2nd level, a trophy hunter gains the [Amateur Gunslinger](ref/feat/amateur-gunslinger) feat and [Exotic Weapon Proficiency](ref/feat/exotic-weapon-proficiency) (firearms), and can use any 1st-level gunslinger deed. At every four levels thereafter, the trophy hunter can take a grit feat or select a gunslinger deed of his level or lower, ranger's choice. This ability replaces all combat style feats."
import_trades = ["All combat style feats"]

[[entry.feature]]
anchor = "hunter-s-aim"
head = "Hunter's Aim (Ex)"
listed = true
level = 4
print = "At 4th level, a trophy hunter gains a specific understanding of the weaknesses and vulnerabilities of his favored enemies, and his careful study of these enemies reveals the best way to hurt them. When the trophy hunter makes a firearm attack against a favored enemy, he can target touch AC in the first two range increments of his firearm. This ability stacks with other effects that increase the range increments to target touch AC, adding one range increment to the effect. This ability replaces hunter's bond."
import_trades = ["Hunter's bond"]

[[entry]]
id = "ref/arc-ranger/warden"
hold = "the replaces trade `1st favored enemy` is not printed in a sentence, and no listed feature of that name prints it; the replaces trade `2nd, 3rd, and 4th favored enemies` is not printed in a sentence, and no listed feature of that name prints it; the replaces trade `5th favored enemy` is not printed in a sentence, and no listed feature of that name prints it; Master of Terrain (Ex): the sentence \"This ability replaces the ranger's first favored enemy ability\" names no trade; Able Explorer (Ex): the sentence \"This ability replaces the ranger's second, third, and fourth favored enemies\" names no trade"
opening = ["All rangers have a bond with the wilderness, but the warden may have the strongest. This protector sits guard in the middle of the wilderness, keeping a lookout for any dangers that might spill from the deeper wilderness beyond, and protecting civilization from the savagery of nature—and vice versa. His long weeks, months, and sometimes years of isolation cause him to \"hear\" what the land is saying. Not all are crazy."]

[[entry.feature]]
anchor = "master-of-terrain"
head = "Master of Terrain (Ex)"
listed = true
level = 1
print = "At 1st level, a warden selects his first favored terrain. He gains another one at 3rd level, and then every five levels thereafter (for a maximum of five favored terrains at 18th level). This ability replaces the ranger's first favored enemy ability."
import_trades = ["1st favored enemy"]

[[entry.feature]]
anchor = "live-in-comfort"
head = "Live in Comfort (Ex)"
listed = true
level = 2
print = "At 2nd level, a warden is truly at home within his favored terrains. He knows all the signs of the wilderness. He rarely gets lost. He can easily live off the land in comfort, and can provide for companions. The warden can take 10 on any Survival check involving any of his favored terrains, even when in immediate danger and distracted. If the warden is not in immediate danger and distracted, he can take 20 even if the check has a penalty for failure. This ability replaces all combat style feats."
import_trades = ["All combat style feats"]

[[entry.feature]]
anchor = "terrain-bond"
head = "Terrain Bond (Ex)"
listed = true
level = 4
print = "At 4th level, a warden forms a bond with the land itself, enabling him to direct others in such terrain. When in his favored terrain, the warden grants all allies within line of sight and that can hear him a +2 bonus on initiative checks and Perception, Stealth, and Survival skill checks. Also, as long as they travel with him, the warden's allies leave no trail and can't be tracked. The warden can choose for the group to leave a trail, or even for specific members of the group to leave a trail if he so desires. This ability replaces hunter's bond."
import_trades = ["Hunter's bond"]

[[entry.feature]]
anchor = "able-explorer"
head = "Able Explorer (Ex)"
listed = true
level = 5
print = "At 5th level, when making an Acrobatics, Climb, Fly, Ride, or Swim check in any of his favored terrains, a warden can make two skill checks and take the higher. This ability replaces the ranger's second, third, and fourth favored enemies."
import_trades = ["2nd", "3rd", "4th favored enemies"]

[[entry.feature]]
anchor = "wilderness-whispers"
head = "Wilderness Whispers (Su)"
listed = true
level = 20
print = "At 20th level, a warden cannot be surprised and always acts as if he had rolled a natural 20 on any initiative check while within any of his favored terrains. A warden can always move at full speed while using Survival to follow tracks without penalty. This ability replaces the ranger's fifth favored enemy and master hunter."
import_trades = ["5th favored enemy", "master hunter"]

[[entry]]
id = "ref/arc-ranger/wild-stalker"
hold = "the replaces trade `1st favored enemy` is not printed in a sentence, and no listed feature of that name prints it; the replaces trade `2nd, 3rd, 4th, and 5th favored enemy` is not printed in a sentence, and no listed feature of that name prints it; the replaces trade `6th-, 10th-, 14th-, and 18th-level combat style feat` is not printed in a sentence, and no listed feature of that name prints it; Strong Senses (Ex): the sentence \"This ability replaces the ranger's first favored enemy ability\" names no trade; Rage Powers: the sentence \"This ability replaces the ranger's second, third, fourth, and fifth favored enemy abilities\" names no trade; Wild Talents (Ex): the sentence \"This ability replaces the ranger's 6th-, 1oth-, 14th-, and 18th-level combat style feat abilities\" names no trade"
opening = ["Civilization grows stronger and more decadent with each passing year. It tears into unclaimed wilderness and destroys the fragile ecology in its constant push for expansion and exploitation. The wild stalker forsakes the bonds of community and lives in the trackless wilds far from others of his kind, or perhaps grew up there, never knowing of civilization as anything more than his enemy. He drives pioneers back to civilization and strives to keep the land unspoiled."]

[[entry.feature]]
anchor = "strong-senses"
head = "Strong Senses (Ex)"
listed = true
level = 1
print = "At 1st level, a wild stalker's life among the wild has sharpened his senses. He gains [low-light vision](ref/rule/low-light-vision) and a +1 bonus on Perception checks. If he already has low-light vision, he gains a +2 bonus on Perception checks instead. This bonus increases by +1 for every four levels after 1st (to a maximum of +6 at 20th level, or +7 if the character did not gain low-light vision from this ability). This ability replaces the ranger's first favored enemy ability."
import_trades = ["1st favored enemy"]

[[entry.feature]]
anchor = "uncanny-dodge"
head = "Uncanny Dodge (Ex)"
listed = true
level = 2
print = "At 2nd level, a wild stalker gains [uncanny dodge](ref/ability/uncanny-dodge) as the barbarian's class feature. This ability replaces the ranger's 2nd-level combat style feat."
import_trades = ["2nd-level combat style feat"]

[[entry.feature]]
anchor = "rage-of-the-wild"
head = "Rage of the Wild (Ex)"
listed = true
level = 4
print = "At 4th level, a wild stalker gains the rage ability as the [barbarian](ref/class/barbarian) class feature, but its barbarian level is considered to be his ranger level -3. This ability replaces hunter's bond."
import_trades = ["Hunter's bond"]

[[entry.feature]]
anchor = "rage-powers"
head = "Rage Powers"
listed = true
level = 5
print = "At 5th level, a wild stalker ranger gains a single rage power, as the barbarian class feature. He gains another rage power each five levels after 5th (to a maximum of four rage powers at 20th level). This ability replaces the ranger's second, third, fourth, and fifth favored enemy abilities."
import_trades = ["2nd", "3rd", "4th", "5th favored enemy"]

[[entry.feature]]
anchor = "wild-talents"
head = "Wild Talents (Ex)"
listed = true
level = 6
print = "At 6th level, a wild stalker can either take a rage power, or gains a +2 insight bonus into any one of the following skills: Acrobatics, Climb, Perception, Stealth, Survival, or Swim. The wild stalker can gain one of these two benefits again every five levels after 6th (to a maximum of 4 times at 20th level). This ability replaces the ranger's 6th-, 1oth-, 14th-, and 18th-level combat style feat abilities."
import_trades = ["6th-", "10th-", "14th-", "18th-level combat style feat"]

[[entry]]
id = "ref/arc-rogue/bandit"
opening = ["Bandits, brigands, and highwaymen hone their craft along the roadsides and byways of the world, where they leap from the shadows to plunder the spoils of passing travelers. Bandits tend to have a variety of skills; sometimes these skills are similar to a ranger's, but a bandit's tactics always deal with surprise followed by intimidation, with the clear threat of naked force if intimidation does not do the trick. But not all bandits are ruthless thugs. There are those who become outlaws in opposition to tyrants or similar oppressors. These bandits target the status quo and distribute their spoils back into the needy hands of the peasantry."]

[[entry.feature]]
anchor = "ambush"
head = "Ambush (Ex)"
listed = true
level = 4
print = "At 4th level, a bandit becomes fully practiced in the art of ambushing. When she acts in the surprise round, she can take a move action, standard action, and swift action during the surprise round, not just a move or standard action. This ability replaces uncanny dodge."
import_trades = ["Uncanny dodge"]

[[entry.feature]]
anchor = "fearsome-strike"
head = "Fearsome Strike (Ex)"
listed = true
level = 8
print = "At 8th level, a bandit can terrify an opponent with a single hit. A number of times per day equal to her Charisma modifier (minimum 1), when a bandit confirms a critical hit and deals sneak attack damage to an opponent, she can choose to make the opponent [frightened](ref/misc/frightened) for a number of rounds equal to her Charisma modifier (minimum 1). She cannot use this ability in conjunction with a critical feat. This ability replaces improved uncanny dodge."
import_trades = ["Improved uncanny dodge"]

[[entry.feature]]
anchor = "rogue-talents"
head = "Rogue Talents"
listed = false
print = "The following rogue talents complement the bandit archetype: assault leader \\*\\*, combat trick, cunning trigger\\*, snap shot\\*, strong impression\\*, surprise attack, terrain mastery, underhanded, and weapon training."

[[entry.feature]]
anchor = "advanced-talents"
head = "Advanced Talents"
listed = false
print = "The following advanced rogue talents complement the bandit archetype: hide in plain sight, knock-out blow\\*, and opportunist."

[[entry]]
id = "ref/arc-rogue/chameleon"
opening = ["An absolute master of disguise, a chameleon effortlessly blends into any environment. Whether disappearing into crowded city streets, vanishing into desert sands, or slipping into the darkness of subterranean tunnels, the chameleon relies upon her ability to become part of her surroundings."]

[[entry.feature]]
anchor = "misdirection"
head = "Misdirection (Ex)"
listed = true
level = 1
print = "At 1st level, a chameleon begins her career knowing that the secret to disappearing lies in deceiving the senses of her observers. Every day she gains a pool of stealth points equal to her ranks in Bluff. These points refresh at the start of each day. Before making a Stealth check, she can choose to put stealth points into the roll, gaining a bonus on Stealth checks equal to the number of stealth points she puts into the roll. If she gains a bonus on Bluff checks because of a feat (such as [Skill Focus](ref/feat/skill-focus) \\[Bluff\\]), she adds a number of points to her stealth pool equal to the bonus the feat grants. This ability replaces trapfinding."
import_trades = ["Trapfinding"]

[[entry.feature]]
anchor = "effortless-sneak"
head = "Effortless Sneak (Sp)"
listed = true
level = 3
print = "At 3rd level, the chameleon chooses a single terrain from the ranger's [favored terrain](ref/ability/favored-terrain) class feature. While she is within that terrain, she can take 10 on any Stealth check she can make within that terrain. When the chameleon reaches 6th level, and every three levels thereafter, she chooses a new type of terrain from the ranger's favored terrain list. She gains this ability with the newly picked terrain. This ability replaces trap sense."
import_trades = ["Trap sense"]

[[entry.feature]]
anchor = "rogue-talents"
head = "Rogue Talents"
listed = false
print = "The following rogue talents complement the chameleon archetype: camouflage\\*, fast stealth, quick disguise\\*, and terrain mastery."

[[entry.feature]]
anchor = "advanced-talents"
head = "Advanced Talents"
listed = false
print = "The following advanced rogue talents complement the chameleon archetype: hide in plain sight and master of disguise\\*."

[[entry]]
id = "ref/arc-rogue/charlatan"
opening = ["A charlatan is a master of lies and deception. Whether creating simple cons or elaborately woven hoaxes capable of swaying the masses and those in positions of power, a charlatan is often a purveyor of snake-oil, forgeries, and rumormongering."]

[[entry.feature]]
anchor = "natural-born-liar"
head = "Natural Born Liar (Ex)"
listed = true
level = 1
print = "At 1st level, when a charlatan successfully deceives a creature with a Bluff, that creature takes a -2 penalty on the charlatan's Bluff checks for the next 24 hours. This ability does not stack with itself. This ability replaces trapfinding."
import_trades = ["Trapfinding"]

[[entry.feature]]
anchor = "grand-hoax"
head = "Grand Hoax (Ex)"
listed = true
level = 3
print = "At 3rd level, the charlatan begins to master the art of the grand hoax and learns to create deceptions designed to bestow harm upon her foes. She gains the [rumormonger](ref/talent/rumormonger) advanced talent, even though she is not yet 10th level. This ability takes the place of trap sense."
import_trades = ["Trap sense"]

[[entry.feature]]
anchor = "rogue-talents"
head = "Rogue Talents"
listed = false
print = "The following rogue talents complement the charlatan archetype: black market connections, coax information\\*, convincing lie, honeyed words\\*, and underhanded."

[[entry.feature]]
anchor = "advanced-talents"
head = "Advanced Talents"
listed = false
print = "The following advanced rogue talents complement the charlatan archetype: hard to fool, skill mastery, and unwitting ally."

[[entry]]
id = "ref/arc-rogue/driver"
opening = ["A driver makes her living driving vehicles in the service of those who can pay for her considerable talents. She may be a wagon-driver practiced at smuggling contraband, an accomplished musher blazing arctic trails, or a seemingly refined coach driver placing her roguish talents in the service of a wealthy patron. This archetype works best with the vehicle combat rules in Chapter 4."]

[[entry.feature]]
anchor = "hard-drive"
head = "Hard Drive (Ex)"
listed = true
level = 1
print = "When driving a vehicle that uses a group of animals or magical beasts as muscle propulsion, the DCs of all driving checks are reduced by 2, the maximum speed of the vehicle increases by 10 feet, and the acceleration increases by 5 feet. This ability takes the place of trapfinding."
import_trades = ["Trapfinding"]

[[entry.feature]]
anchor = "driver-s-fortitude"
head = "Driver's Fortitude (Ex)"
listed = true
level = 3
print = "At 3rd level, the driver learns to keep driving and maintain control of her vehicle, even when mortally wounded. If the driver drops below 0 hit points but is not dead, she can attempt a DC 15 Fortitude save each round to remain conscious and in control of her vehicle, though she may take no other actions. This ability replaces trap sense."
import_trades = ["Trap sense"]

[[entry.feature]]
anchor = "rogue-talents"
head = "Rogue Talents"
listed = false
print = "The following rogue talents complement the driver archetype: firearm training and getaway artist."

[[entry.feature]]
anchor = "advanced-talents"
head = "Advanced Talents"
listed = false
print = "The following advanced rogue talents complement the driver archetype: feat and getaway master."

[[entry]]
id = "ref/arc-rogue/knife-master"
opening = ["The knife master is a trained killer who specializes in close-up combat and the wave and weave of knife fighting. In her hands, daggers and other similar light blades become truly deadly instruments.."]

[[entry.feature]]
anchor = "hidden-blade"
head = "Hidden Blade"
listed = true
level = 1
print = "A knife master adds 1/2 her level on Sleight of Hand checks made to conceal a light blade. This ability replaces trapfinding."
import_trades = ["Trapfinding"]

[[entry.feature]]
anchor = "sneak-stab"
head = "Sneak Stab (Ex)"
listed = true
print = "A knife master focuses her ability to deal sneak attack damage with daggers and similar weapons to such a degree that she can deal more sneak attack damage with those weapons at the expense of sneak attacks with other weapons. When she makes a sneak attack with a [dagger](ref/eq-weapon/dagger), [kerambit](ref/eq-weapon/kerambit), [kukri](ref/eq-weapon/kukri), [punching daggers](ref/eq-weapon/punching-dagger), [starknife](ref/eq-weapon/starknife), or [swordbreaker dagger](ref/eq-weapon/swordbreaker-dagger), she uses d8s to roll sneak attack damage instead of d6s. For sneak attacks with all other weapons, she uses d4s instead of d6s. This ability is identical in all other ways to sneak attack, and supplements that ability."
import_trades = ["Sneak attack"]

[[entry.feature]]
anchor = "blade-sense"
head = "Blade Sense (Ex)"
listed = true
level = 3
print = "At 3rd level, a knife master is so skilled in combat involving light blades that she gains a +1 dodge bonus to AC against attacks made against her with light blades. This bonus increases by +1 for every three levels, to a maximum of +6 at 18th level. This ability replaces trap sense."
import_trades = ["Trap sense"]

[[entry.feature]]
anchor = "rogue-talents"
head = "Rogue Talents"
listed = false
print = "The following rogue talents complement the knife master archetype: befuddling strike\\*, combat trick, offensive defense\\*, surprise attack, underhanded, and weapon training."

[[entry.feature]]
anchor = "advanced-talents"
head = "Advanced Talents"
listed = false
print = "The following advanced rogue talents complement the knife master archetype: another day\\*, confounding blades, deadly sneak\\*, entanglement of blades\\*, and unwitting ally."

[[entry]]
id = "ref/arc-rogue/pirate"
opening = ["A pirate breaks from the confines of country and king to commit her crimes upon the high seas. She holds allegiance only to her ship and its captain (if even that much is true), and lives a lawless life upon the waves, plundering ships and shorelines as suits her whim."]

[[entry.feature]]
anchor = "sea-legs"
head = "Sea Legs (Ex)"
listed = true
level = 1
print = "At 1st level, a pirate becomes adept at moving on ships, boats, and similar vessels. She gains the [Sea Legs](ref/feat/sea-legs) feat as a bonus feat, even if she does not meet the prerequisites. This ability replaces trapfinding."
import_trades = ["Trapfinding"]

[[entry.feature]]
anchor = "swinging-reposition"
head = "Swinging Reposition (Ex)"
listed = true
level = 2
print = "At 2nd level, a pirate incorporates a ship's masts, rigging, ropes, sails, and other such structures into her combat style. Provided she is wearing light armor or no armor, when fighting in an environment where such structures exist, the rogue incorporates them into her movement, and does not have to move in a straight line when making either a [charge](ref/rule/charge) attack or a [bull rush](ref/rule/bull-rush) combat maneuver. Once she completes her attack or maneuver, she can reposition herself. Immediately after making the charge or bull rush, she can move 5 feet as a free action, even if the charge ends her turn. This movement does not provoke attacks of opportunity. This ability replaces the 2nd-level rogue talent."
import_trades = ["2nd-level rogue talent"]

[[entry.feature]]
anchor = "unflinching"
head = "Unflinching (Ex)"
listed = true
print = "Pirates are a salty and steadfast lot. At 3rd level, a pirate gains a +1 bonus on saving throws against fear and mind-affecting effects. This bonus increases by +1 for every three levels, to a maximum of +6 at 18th level. This ability replaces trap sense."
import_trades = ["Trap sense"]

[[entry.feature]]
anchor = "rogue-talents"
head = "Rogue Talents"
listed = false
print = "The following rogue talents complement the pirate archetype: black market connections, combat trick, finesse rogue, firearm training, hold breath, rope master, and strong stroke."

[[entry.feature]]
anchor = "advanced-talents"
head = "Advanced Talents"
listed = false
print = "The following advanced rogue talents complement the pirate archetype: getaway master, hard to fool, and unwitting ally."

[[entry]]
id = "ref/arc-rogue/roof-runner"
opening = ["A specialized urban acrobat, the roof runner makes her home high atop the spires and gables of great cities. She is skilled at traveling these uneven surfaces at full speed, performing daring leaps and deftly balancing upon narrow and precarious ledges."]

[[entry.feature]]
anchor = "roof-running"
head = "Roof Running (Ex)"
listed = true
level = 1
print = "At 1st level, a roof runner becomes entirely adept at moving across the tops of buildings, spires, and similar locations. Provided she is wearing light armor or no armor, the roof runner can move at full speed while traveling across the tops of buildings or similar structures, and takes no penalties on any Dexterity-based Skill checks or Reflex saves that might be incurred from moving about on a roof. This ability replaces trapfinding."
import_trades = ["Trapfinding"]

[[entry.feature]]
anchor = "tumbling-descent"
head = "Tumbling Descent (Ex)"
listed = true
level = 2
print = "At 2nd level, a roof runner can use her acrobatics skill to attempt a rapid descent from a rooftop or another surface, ricocheting against another surface and then diving through an opening (such as a balcony or window) directly below. So long as she has at least two surfaces no farther than 10 feet apart to bounce against, she can ricochet her body back from one to the next, descending great distances with a single check. The DC is 10 + 5 for every additional 10-foot increment descended beyond the initial 10 feet dropped. If she fails, she falls the full distance. This ability replaces trap sense."
import_trades = ["Trap sense"]

[[entry.feature]]
anchor = "rogue-talents"
head = "Rogue Talents"
listed = false
print = "The following rogue talents complement the roof runner archetype: expert leaper\\*, ledge walker, nimble climber\\*, stand up, and terrain mastery."

[[entry.feature]]
anchor = "advanced-talents"
head = "Advanced Talents"
listed = true
print = "The following advanced rogue talent complements the roof runner archetype: fast tumble\\*."

[[entry]]
id = "ref/arc-rogue/sanctified-rogue"
opening = ["The sanctified rogue serves a higher purpose, acting as a representative of a church or cult, or following the tenets of a specific faith or deity. While most sanctified rogues share the beliefs or ideals of the religions they represent, not all of them are necessarily pious. A handful of disreputable holy thieves serve purely as mercenaries. At the other end of spectrum, however, more sanctified rogues adhere to the tenets of their faith with fanatical devotion. Regardless, all seem blessed with the ability to call upon divine favor to aid them in times of need."]

[[entry.feature]]
anchor = "divine-purpose"
head = "Divine Purpose (Su)"
listed = true
level = 4
print = "At 4th level, the favor of a deity or religious institution grants a special blessing on a sanctified rogue, shoring up some of her weaknesses. She gains a +1 sacred bonus on Fortitude and Will saving throws. This ability replaces uncanny dodge."
import_trades = ["Uncanny dodge"]

[[entry.feature]]
anchor = "divine-epiphany"
head = "Divine Epiphany (Su)"
listed = true
level = 8
print = "At 8th level, once per day, a sanctified rogue can peer into the immediate future and predict the results of a specific action as if she had cast an _[augury](ref/spell/augury)_ spell. The caster level of this spell is equal to the sanctified rogue's rogue class level. This ability replaces improved uncanny dodge."
import_trades = ["Improved uncanny dodge"]

[[entry.feature]]
anchor = "rogue-talents"
head = "Rogue Talents"
listed = false
print = "The following rogue talents complement the sanctified rogue archetype: esoteric scholar, major magic, and minor magic."

[[entry.feature]]
anchor = "advanced-talents"
head = "Advanced Talents"
listed = false
print = "The following advanced rogue talents complement the sanctified rogue archetype: feat and skill mastery."

[[entry]]
id = "ref/arc-rogue/survivalist"
opening = ["The survivalist focuses her talents on surviving harsh and unforgiving conditions that would kill a lesser rogue. Whether in blazing deserts or frigid arctic wastes—or simply the cold, hard reality of the streets—the survivalist uses her training to both ensure her own success and provide for the safety of her allies."]

[[entry.feature]]
anchor = "hardy"
head = "Hardy (Ex)"
listed = true
level = 1
print = "At 1st level, a survivalist is already prepared to endure extreme hardships and environmental conditions. She can go twice the normal number of days without water and triple the normal number of days without food before feeling the effects of either thirst or starvation. This ability replaces trapfinding."
import_trades = ["Trapfinding"]

[[entry.feature]]
anchor = "endure-elements"
head = "Endure Elements (Sp)"
listed = true
level = 3
print = "At 3rd level, a survivalist rogue can use _[endure elements](ref/spell/endure-elements)_ once per day as a [spell-like ability](ref/umr/spell-like-abilities). The survivalist's caster level is the same as her rogue level. This ability replaces trap sense."
import_trades = ["Trap sense"]

[[entry.feature]]
anchor = "rogue-talents"
head = "Rogue Talents"
listed = false
print = "The following rogue talents complement the survivalist archetype: hold breath, iron guts, resiliency, strong stroke, survivalist\\*, terrain mastery, and wall scramble."

[[entry.feature]]
anchor = "advanced-talents"
head = "Advanced Talents"
listed = false
print = "The following advanced rogue talents complement the survivalist archetype: another day\\*, defensive roll, feat, and skill mastery."

[[entry]]
id = "ref/arc-wizard/arcane-bomber"
opening = ["To many wizards, the experimentation of the alchemist seems quaint, if not dangerous or frightening. A few wizards take up the secrets of the bomb, however, fusing alchemy with their already considerable magical power."]

[[entry.feature]]
anchor = "bomb"
head = "Bomb (Su)"
listed = true
level = 1
print = "At 1st level, the arcane bomber gains an ability nearly identical to the [alchemist's](ref/class/alchemist) bomb ability. Unlike the alchemist, at 1st level, the arcane bomber chooses one type of energy from the following list: acid, cold, fire, and electricity. He can throw bombs of that type, but cannot modify them with discoveries. This ability stacks with the alchemist bomb ability to determine the level of bomb damage, but an arcane bomber that becomes an alchemist does not gain that class's bomb ability, nor does an alchemist that becomes an arcane bomber gain this bomb ability. This ability replaces arcane bond."
import_trades = ["Arcane bond"]

[[entry.feature]]
anchor = "spellblast-bombs"
head = "Spellblast Bombs (Su)"
listed = true
level = 1
print = "At 1st level, as a swift action, an arcane bomber can sacrifice one of his spells to empower the next bomb he throws during his turn. When he does, he gains a bonus to hit with the next bomb he throws before the end of his turn equal to the level of the spell he sacrificed, and a bonus to damage equal to twice the level of the spell. This ability replaces cantrips, but the arcana bomber gains the _[detect magic](ref/spell/detect-magic)_ and _[read magic](ref/spell/read-magic)_ cantrips and places them in his spellbook. He can cast either of these as 1st-level spells."
import_trades = ["Cantrips"]

[[entry.feature]]
anchor = "school-of-the-bomb"
head = "School of the Bomb"
listed = true
print = "The creation and use of bombs is often so engrossing or intellectually taxing that an arcane bomber forsakes four schools of magic. These opposition schools are chosen at 1st level and cannot be changed later. An arcane bomber who prepares spells from his opposition school must use two spell slots of that level to prepare the spell. In addition, the arcane bomber takes a -4 penalty on any skill checks made when crafting a magic item that has a spell from one of his opposition schools. This ability replaces arcane school."
import_trades = ["Arcane school"]

[[entry]]
id = "ref/arc-wizard/siege-mage"
opening = ["The siege mage combines his arcane mastery with a supernatural link to siege engines."]

[[entry.feature]]
anchor = "siege-engineer"
head = "Siege Engineer"
listed = true
level = 1
print = "At 1st level, the siege mage gains [Siege Engineer](ref/feat/siege-engineer) as a bonus feat, even though he does not meet the prerequisites for that feat. This ability replaces scribe scroll."
import_trades = ["Scribe scroll"]

[[entry.feature]]
anchor = "siege-engine-bond"
head = "Siege Engine Bond (Su)"
listed = true
level = 1
print = "At 1st level, a siege mage can bond with a single siege engine within 30 feet and line of sight as a standard action. He can utilize the power of this link to aim and fire the siege engine remotely (as long as he's within 30 feet), though it still requires a crew to reload the siege engine. At 10th level, he can reload, aim, and fire the siege engine purely by the power of this link, and no longer needs a crew to control the siege engine. It still takes the normal required amount of time and actions to control a siege engine in this manner. This ability replaces arcane bond. The siege mage can end this bond with a free action. A siege mage can bond with a siege engine in this manner a number of times per day equal to his Intelligence modifier (minimum 1) but can only be bonded with one siege engine at a time."
import_trades = ["Arcane bond"]

[[entry.feature]]
anchor = "empower-siege-engine"
head = "Empower Siege Engine (Su)"
listed = true
print = "As a swift action, a siege mage can sacrifice one of his spells to empower the next attack he makes before the end of his turn with a siege engine he is bonded with. When he does, the siege engine attack gains a bonus on its attack roll or targeting roll equal to the level of the spell he sacrificed, and a bonus to damage equal to 3 × the level of the spell. This ability replaces cantrips, but the siege mage gains the _[detect magic](ref/spell/detect-magic)_ and _[read magic](ref/spell/read-magic)_ cantrips and places them in his spellbook. He can cast either of these as 1st-level spells."
import_trades = ["Cantrips"]

[[entry.feature]]
anchor = "siege-school"
head = "Siege School"
listed = true
print = "The strange rituals needed to empower all forms of siege engines takes a level of dedication and perseverance that limits a wizard's time to unlock other arcane mysteries. At 1st level, the siege mage forsakes three schools of magic. Once chosen, these opposition schools cannot be changed. A siege mage who prepares spells from his opposition school must use two spell slots of that level to prepare the spell. In addition, the siege mage takes a -4 penalty on any skill checks made when crafting a magic item that has a spell from one of his opposition schools. This ability replaces arcane school."
import_trades = ["Arcane school"]

[[entry]]
id = "ref/arc-wizard/spellslinger"
opening = ["While few contest the seductive allure of commanding arcane and occult powers, there are those wizards who become obsessed with the natural mysteries of black powder. Combining this emerging technology with their considerable arcane skills, they transform firearms into a powerful focus."]

[[entry.feature]]
anchor = "arcane-gun"
head = "Arcane Gun (Su)"
listed = true
print = '''
The spellslinger gains the [Exotic Weapon Proficiency](ref/feat/exotic-weapon-proficiency) (firearms) feat, and one or two of his firearms can be _arcane guns_. _Arcane guns_ are normal one-handed or two-handed firearms in the hands of others, as they were normal firearms before the spellslinger imbued them with magic. In a spellslinger's hands, they both fire projectiles (bullets and pellets) and cast magic. At 1st level, the spellslinger decides whether he wants to have one or two _arcane guns_ at a time. If the spellslinger chooses to have only one arcane gun at a time, spells fired through the arcane gun that require an attack roll have a ×3 critical hit multiplier.

A spellslinger can cast any ranged touch attack, cone, line, or ray spells through his _arcane gun_. When he casts through the _arcane gun_, the gun's enhancement bonus (if any) is a bonus to the spell's attack rolls or to the spell's saving throw DCs. Yet there are dangers inherent to this method. If any of the spells' attack rolls result in a natural 1 (a misfire), or a natural 20 is rolled on any saving throw made against the spell by a target (an overload), the _arcane gun_ gains the [broken](ref/misc/broken) condition. If the _arcane gun_ already has the broken condition, the gun explodes. When a gun explodes, it lets loose a blast of force, or if the spell has the acid, cold, electricity, or sonic descriptor, it deals that type of energy damage instead. In the case of spells with multiple descriptors, roll randomly among the descriptors to determine the type of damage dealt by the blast. The blast is centered on a single intersection within the spellslinger's space (spellslinger's choice) and deals 1d6 points of the appropriate energy damage or force damage per level of the spell cast. Any creature within the blast other than the spellslinger can make a Reflex saving throw to halve the damage. The Reflex save DC is calculated using the spell level of the spell being sacrificed.

A spellslinger can attune his _arcane guns_ at the start of each day. That attunement lasts until the spellslinger attunes to a new gun, even if a formally attuned gun is destroyed. This ability replaces arcane bond.'''
import_trades = ["Arcane bond"]

[[entry.feature]]
anchor = "gunsmith"
head = "Gunsmith"
listed = true
print = "The spellslinger gains the [Gunsmithing](ref/feat/gunsmithing) feat and a battered gun that is identical to the gun a [gunslinger](ref/class/gunslinger) gains at first level. If the spellslinger chooses the ability to attune two arcane guns, he still only starts out with one gun. Like a gunslinger, a spellslinger can use the Gunsmithing feat to restore his battered gun. This ability replaces scribe scroll."
import_trades = ["Scribe scroll"]

[[entry.feature]]
anchor = "mage-bullets"
head = "Mage Bullets (Su)"
listed = true
print = "A spellslinger is adept at transferring spell energy into his _arcane gun_ attacks. As a swift action, he can sacrifice a spell and transform that energy into a weapon bonus equal to the level of the spell sacrificed on a single barrel of his firearm. With that weapon bonus the spellslinger can apply any of the following to his arcane bond: enhancement bonuses (up to +5) and _[dancing](ref/magic-enh/dancing)_, _[defending](ref/magic-enh/defending)_, _[distance](ref/magic-enh/distance)_, _[flaming](ref/magic-enh/flaming)_, _[flaming burst](ref/magic-enh/flaming-burst)_, _[frost](ref/magic-enh/frost)_, _[ghost touch](ref/magic-enh/ghost-touch-weapon)_, _[icy burst](ref/magic-enh/icy-burst)_, _[merciful](ref/magic-enh/merciful)_, _[seeking](ref/magic-enh/seeking), [shock](ref/magic-enh/shock)_, _[shocking burst](ref/magic-enh/shocking-burst)_, _[spell storing](ref/magic-enh/spell-storing)_, _[thundering](ref/magic-enh/thundering)_, _[vicious](ref/magic-enh/vicious)_, and _[wounding](ref/magic-enh/wounding)_. An arcane gun gains no benefit from having two of the same weapon special abilities on the same barrel. The effect of the mage bullets ability lasts for a number of minutes equal to the level of the spell sacrificed, or until this ability is used again to assign the barrel different enhancements. This ability replaces cantrips, but the spellslinger gains the _[detect magic](ref/spell/detect-magic)_ and _[read magic](ref/spell/read-magic)_ cantrips and places them in his spellbook. He can cast either of these as 1st-level spells."
import_trades = ["Cantrips"]

[[entry.feature]]
anchor = "school-of-the-gun"
head = "School of the Gun"
listed = true
print = '''
The rigor and care required by arcane guns is so great that a spellslinger forsakes four schools of magic. These opposition schools are chosen at 1st level and cannot be changed later. A spellslinger who prepares a spell from his opposition school must use two spell slots of that level to prepare the spell. In addition, the spellslinger takes a -4 penalty on any skill checks made when crafting a magic item that has a spell from one of his opposition schools as a prerequisite. This ability replaces arcane school.

