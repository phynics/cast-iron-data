head = "Weapon and Armor Proficiency"
listed = false
print = "A kensai is proficient in simple weapons and in a single martial or exotic melee weapon of his choice. A kensai is not proficient with armor or shields and suffers normal arcane spell failure chance when casting magus spells while armored."

[[entry.feature]]
anchor = "diminished-spellcasting"
