[[edit]]
entry = "ref/arc-shifter/adaptive-shifter"
anchor = "reactive-form"
note = "hand-written by the batch lead from print (Distant Realms pp. 12-13): the introduction of the section without its list of forms; the 15 forms are its unlisted sections (ruling 53)"
text = '''
An adaptive shifter learns two reactive forms from the list below. At 2nd level and every 2 levels thereafter, an adaptive shifter learns an additional reactive form. Forms marked with an asterisk (\*) are lasting forms. An adaptive shifter can spend two uses of reactive aspect to increase a lasting form's duration to 1 minute. Forms not marked with an asterisk always last only until the beginning of her next turn.
'''

[[add]]
entry = "ref/arc-shifter/adaptive-shifter"
anchor = "adaptive-defense"
head = "Adaptive Defense"
parent = "reactive-form"
after = "reactive-form"
note = "hand-written by the batch lead from print (Distant Realms pp. 12-13, owner ruling 53): a reactive form, a choice of Reactive Form that print sets as a run-in paragraph led by its key; an unlisted subheading of it, not a class feature"
text = '''
When assuming this form, the adaptive shifter chooses one saving throw and gains a competence bonus on the selected save equal to her Wisdom modifier.
'''

[[add]]
entry = "ref/arc-shifter/adaptive-shifter"
anchor = "aligned-adaptation"
head = "Aligned Adaptation*"
parent = "reactive-form"
after = "adaptive-defense"
note = "hand-written by the batch lead from print (Distant Realms pp. 12-13, owner ruling 53): a reactive form, a choice of Reactive Form that print sets as a run-in paragraph led by its key; an unlisted subheading of it, not a class feature"
text = '''
When assuming this form, the adaptive shifter chooses one alignment within one step of her own alignment on either the law/chaos axis or the good/evil axis. All spells, effects, and magic items affect the adaptive shifter as though that were her actual alignment. If she is at least 10th level, her natural weapon attacks overcome [damage reduction](ref/rule/damage-reduction) as if they were weapons of her assumed alignment.
'''

[[add]]
entry = "ref/arc-shifter/adaptive-shifter"
anchor = "aquatic-form"
head = "Aquatic Form*"
parent = "reactive-form"
after = "aligned-adaptation"
note = "hand-written by the batch lead from print (Distant Realms pp. 12-13, owner ruling 53): a reactive form, a choice of Reactive Form that print sets as a run-in paragraph led by its key; an unlisted subheading of it, not a class feature"
text = '''
The adaptive shifter gains a swim speed equal to her base speed, and she can breathe underwater.
'''

[[add]]
entry = "ref/arc-shifter/adaptive-shifter"
anchor = "climbing-form"
head = "Climbing Form*"
parent = "reactive-form"
after = "aquatic-form"
note = "hand-written by the batch lead from print (Distant Realms pp. 12-13, owner ruling 53): a reactive form, a choice of Reactive Form that print sets as a run-in paragraph led by its key; an unlisted subheading of it, not a class feature"
text = '''
The adaptive shifter gains a climb speed equal to her base speed.
'''

[[add]]
entry = "ref/arc-shifter/adaptive-shifter"
anchor = "durable-form"
head = "Durable Form"
parent = "reactive-form"
after = "climbing-form"
note = "hand-written by the batch lead from print (Distant Realms pp. 12-13, owner ruling 53): a reactive form, a choice of Reactive Form that print sets as a run-in paragraph led by its key; an unlisted subheading of it, not a class feature"
text = '''
The adaptive shifter gains DR 5/adamantine. This damage reduction increases by 1 for every 2 levels she has beyond 8th. She must be at least 8th level to select this form.
'''

[[add]]
entry = "ref/arc-shifter/adaptive-shifter"
anchor = "evasive-form"
head = "Evasive Form*"
parent = "reactive-form"
after = "durable-form"
note = "hand-written by the batch lead from print (Distant Realms pp. 12-13, owner ruling 53): a reactive form, a choice of Reactive Form that print sets as a run-in paragraph led by its key; an unlisted subheading of it, not a class feature"
text = '''
The adaptive shifter gains [compression](ref/umr/compression), a +4 dodge bonus to her CMD against grapple combat maneuvers, and a competence bonus equal to her Wisdom modifier on Escape Artist checks.
'''

[[add]]
entry = "ref/arc-shifter/adaptive-shifter"
anchor = "giant-form"
head = "Giant Form*"
parent = "reactive-form"
after = "evasive-form"
note = "hand-written by the batch lead from print (Distant Realms pp. 12-13, owner ruling 53): a reactive form, a choice of Reactive Form that print sets as a run-in paragraph led by its key; an unlisted subheading of it, not a class feature"
text = '''
The adaptive shifter increases in size, as per _[enlarge person](ref/spell/enlarge-person)_. The adaptive shifter can assume this form only as a swift action.
'''

[[add]]
entry = "ref/arc-shifter/adaptive-shifter"
anchor = "resistant-form"
head = "Resistant Form*"
parent = "reactive-form"
after = "giant-form"
note = "hand-written by the batch lead from print (Distant Realms pp. 12-13, owner ruling 53): a reactive form, a choice of Reactive Form that print sets as a run-in paragraph led by its key; an unlisted subheading of it, not a class feature"
text = '''
When assuming this form, the adaptive shifter chooses acid, cold, electricity, fire, or sonic damage. She gains [resistance](ref/umr/resistance) to the chosen damage type equal to 5 plus [half](ref/misc/fractions-and-rounding) her level. She can learn this form a second time, increasing the resistance granted to 10 plus her level.
'''

[[add]]
entry = "ref/arc-shifter/adaptive-shifter"
anchor = "restoring-form"
head = "Restoring Form"
parent = "reactive-form"
after = "resistant-form"
note = "hand-written by the batch lead from print (Distant Realms pp. 12-13, owner ruling 53): a reactive form, a choice of Reactive Form that print sets as a run-in paragraph led by its key; an unlisted subheading of it, not a class feature"
text = '''
The adaptive shifter regains 1d8 hit points. For every 4 levels she has, the number of hit points she regains increases by 1d8. The adaptive shifter can assume this form only as a swift action.
'''

[[add]]
entry = "ref/arc-shifter/adaptive-shifter"
anchor = "scouting-form"
head = "Scouting Form*"
parent = "reactive-form"
after = "restoring-form"
note = "hand-written by the batch lead from print (Distant Realms pp. 12-13, owner ruling 53): a reactive form, a choice of Reactive Form that print sets as a run-in paragraph led by its key; an unlisted subheading of it, not a class feature"
text = '''
The adaptive shifter gains a competence bonus equal to her Wisdom modifier on Stealth checks, and she gains the benefits of the shifter's trackless step ability. At 12th level, she can use Stealth to hide, even if she does not have cover or concealment (but not if observed).
'''

[[add]]
entry = "ref/arc-shifter/adaptive-shifter"
anchor = "sensory-form"
head = "Sensory Form*"
parent = "reactive-form"
after = "scouting-form"
note = "hand-written by the batch lead from print (Distant Realms pp. 12-13, owner ruling 53): a reactive form, a choice of Reactive Form that print sets as a run-in paragraph led by its key; an unlisted subheading of it, not a class feature"
text = '''
The adaptive shifter gains [low-light vision](ref/rule/low-light-vision) and [scent](ref/umr/scent). She can learn this form a second time to also gain [darkvision](ref/rule/darkvision) with a range of 60 feet and a competence bonus on Perception checks equal to her Wisdom modifier.
'''

[[add]]
entry = "ref/arc-shifter/adaptive-shifter"
anchor = "sky-hunter-form"
head = "Sky Hunter Form*"
parent = "reactive-form"
after = "sensory-form"
note = "hand-written by the batch lead from print (Distant Realms pp. 12-13, owner ruling 53): a reactive form, a choice of Reactive Form that print sets as a run-in paragraph led by its key; an unlisted subheading of it, not a class feature"
text = '''
The adaptive shifter gains a fly speed equal to her base speed with average maneuverability. She must be at least 6th level to select this form. She can learn this form a second time, increasing her fly speed by 20 feet and improving her maneuverability to good.
'''

[[add]]
entry = "ref/arc-shifter/adaptive-shifter"
anchor = "spiked-form"
head = "Spiked Form*"
parent = "reactive-form"
after = "sky-hunter-form"
note = "hand-written by the batch lead from print (Distant Realms pp. 12-13, owner ruling 53): a reactive form, a choice of Reactive Form that print sets as a run-in paragraph led by its key; an unlisted subheading of it, not a class feature"
text = '''
The adaptive shifter grows spines over her body. Any foe striking her with an unarmed strike or a melee natural weapon takes an amount of piercing damage equal to the base damage of her shifter claws, which ignores any [damage reduction](ref/rule/damage-reduction) her shifter claws would ignore. She can learn this form a second time, allowing her to fling her spines as thrown natural weapons that deal piercing damage, have a range increment of 30 feet, and allow her to make multiple attacks with her spines as part of a full attack; these otherwise deal damage and overcome [damage reduction](ref/rule/damage-reduction) as her shifter claws.
'''

[[add]]
entry = "ref/arc-shifter/adaptive-shifter"
anchor = "sprinting-form"
head = "Sprinting Form*"
parent = "reactive-form"
after = "spiked-form"
note = "hand-written by the batch lead from print (Distant Realms pp. 12-13, owner ruling 53): a reactive form, a choice of Reactive Form that print sets as a run-in paragraph led by its key; an unlisted subheading of it, not a class feature"
text = '''
The adaptive shifter's base speed increases by 20 feet.
'''

[[add]]
entry = "ref/arc-shifter/adaptive-shifter"
anchor = "stretching-form"
head = "Stretching Form"
parent = "reactive-form"
after = "sprinting-form"
note = "hand-written by the batch lead from print (Distant Realms pp. 12-13, owner ruling 53): a reactive form, a choice of Reactive Form that print sets as a run-in paragraph led by its key; an unlisted subheading of it, not a class feature"
text = '''
The adaptive shifter's reach with natural weapons increases by 5 feet.
'''
