[[entry]]
id = "ref/arc-witch/patron-familiars"
hold = "head not printed: Spells, Supernatural Speed (Su), Animal Speaker (Su), Distracting (Su and Sp), Elemental Touch (Su), Endure Afflictions (Su), Diseased Touch (Ex), Fearsome Shadows (Sp), Strength of Mind (Su), Shapechanging Familiar (Su), Familiar's Illusions (Sp), Amphibious Familiar (Su), Preternatural Wisdom (Su)"
opening_from_print = true
opening = ["Witches' familiars are often tied to their patrons, enhancing and reinforcing the spellcasters' connections to the sources of their magical might. Just as a [sorcerer](ref/class/sorcerer) can gain a [bloodline familiar](ref/arc-sorcerer/bloodline-familiars), a witch can gain a patron familiar by choosing one at 1st level in place of her standard familiar. A patron familiar acts in all ways like a standard witch's familiar, with the addition of the special ability indicated below according to the witch's patron. In addition, the witch gains her patron spells 1 level later than she normally would—gaining the patron spell she'd normally receive at 2nd level at 3rd level instead, and so on."]

[[entry.feature]]
anchor = "agility-supernatural-speed"
head = "Agility—Supernatural Speed (Su)"
listed = false
print = "The familiar is incredibly fast for its type. It gains an enhancement bonus of +10 feet to each of its movement speeds. This bonus increases to +20 feet at 10th level, and to +30 feet at 20th level."

[[entry.feature]]
anchor = "animals-animal-speaker"
head = "Animals—Animal Speaker (Su)"
listed = false
print = "The familiar gains the ability to speak with animals of its kind at 1st level. If it would normally gain this ability at 7th level, the familiar gains the ability to speak with all animals (as though constantly under the effects of _speak with animals_) at 7th level."

[[entry.feature]]
anchor = "deception-distracting"
head = "Deception—Distracting (Su and Sp)"
listed = false
print = "The familiar gains Bluff and Sense Motive as class skills. At 10th level, the familiar can throw its voice at will, as if using _ventriloquism_."

[[entry.feature]]
anchor = "elements-elemental-touch"
head = "Elements—Elemental Touch (Su)"
listed = false
print = "Choose an energy type: acid, cold, electricity, or fire. The familiar gains resistance 5 to the selected energy type. Whenever the familiar delivers a touch spell that deals energy damage, it can change the type of energy damage dealt to the selected energy type."

[[entry.feature]]
anchor = "endurance-endure-afflictions"
head = "Endurance—Endure Afflictions (Su)"
listed = false
print = "The familiar is unnaturally talented at resisting bodily corruption. The familiar and any ally touching it gains a +2 resistance bonus on saving throws against nonmagical poisons and diseases. At 10th level, this bonus also applies against magical diseases and poisons. At 20th level, this bonus also applies against curses."

[[entry.feature]]
anchor = "plague-diseased-touch"
head = "Plague—Diseased Touch (Ex)"
listed = false
print = "Once per day, the familiar can inflict filth fever with its natural attacks for 1 round. At 10th level, the familiar can inflict red ache instead. At 20th level, it can inflict demon fever instead. See page 557 of the _Pathfinder RPG Core Rulebook_ for details on these diseases. The familiar may be able to inflict other injury diseases instead at the GM's discretion."

[[entry.feature]]
anchor = "shadow-fearsome-shadows"
head = "Shadow—Fearsome Shadows (Sp)"
listed = false
print = "Once per day, the familiar can use _cause fear_ as a spell-like ability as long as it is in an area of normal or dim light, affecting a single living creature with a number of Hit Dice up to the familiar's Intelligence score. Thus, creatures normally immune to _cause fear_ because they have 6 or more Hit Dice may not be immune to the familiar's _cause fear_ spell-like ability."

[[entry.feature]]
anchor = "strength-strength-of-mind"
head = "Strength—Strength of Mind (Su)"
listed = false
print = "A number of times per day equal to its master's Intelligence modifier (minimum once per day), the familiar can swap its Strength and Intelligence scores as a standard action. This effect lasts for a number of rounds equal to 1/2 the master's caster level."

[[entry.feature]]
anchor = "transformation-shapechanging-familiar"
head = "Transformation—Shapechanging Familiar (Su)"
listed = false
print = "The familiar is able to transform itself. For a number of minutes per day equal to its master's witch level, the familiar can alter its appearance so that it looks like a different creature of its type and size. The duration doubles at 8th level, and triples at 16th level. This duration need not be consecutive, but it must be used in 1 minute increments. For instance, a cat familiar could appear as any Tiny animal. This change is purely cosmetic, and doesn't alter the familiar's statistics."

[[entry.feature]]
anchor = "trickery-familiar-s-illusions"
head = "Trickery—Familiar's Illusions (Sp)"
listed = false
print = "The familiar has a mischievous predilection toward simple illusions. Once per day, the familiar can use a 0-level illusion spell on its master's spell list as a spell-like ability. At 10th level, it can also use a 1st-level illusion spell on its master's spell list once per day. At 20th level, it can also use a 2nd-level illusion spell on its master's spell list once per day."

[[entry.feature]]
anchor = "water-amphibious-familiar"
head = "Water—Amphibious Familiar (Su)"
listed = false
print = "The familiar can breathe water for a number of minutes per day equal to 1/2 its master's witch level. These minutes need not be consecutive, but they must be spent in 1-minute intervals. If the familiar can already breathe water, it can breathe air for the same duration. At 10th level, the familiar gains a swim speed of 30 feet (or a land speed of 30 feet if it already has a swim speed) while using this ability. At 20th level, the familiar can move through water as though under the effects of _freedom of movement_ while using this ability."

[[entry.feature]]
anchor = "wisdom-preternatural-wisdom"
head = "Wisdom—Preternatural Wisdom (Su)"
listed = false
print = "The familiar gains a Wisdom score of 6. This score increases by 1 point at 3rd level and every 2 levels thereafter (at the same rate as its Intelligence score). This may cause a familiar whose Wisdom score is typically higher than 6 to start with a lower Wisdom score than normal."

