[[edit]]
entry = "ref/arc-paladin/silver-champion"
anchor = "dragon-magic"
note = "hand-written by the batch lead from print (Legacy of Dragons p. 25, page checked as an image): print breaks the line after \"1st-\" of \"1st- through 4th-level\"; the extraction joined it as \"1st-through\", and the suspended hyphen is written with its space as the corpus has it. The paragraph and the closing sentence are print's."
text = '''
The silver champion does not have access to the normal paladin spell list. She instead adds the 1st- through 4th-level spells from the domains granted by Apsu (Artifice, Good, Law, [Scalykind](ref/domain/scalykind), [Travel](ref/domain/travel)) and the god's associated subdomains (Archon, Construct, Dragon, Exploration, Toil, and Trade) to her class spell list. A silver champion casts one fewer spell of each level than normal. If this reduces the number to less than 0, she can't cast spells of that level.

This ability modifies the paladin's spellcasting.
'''
