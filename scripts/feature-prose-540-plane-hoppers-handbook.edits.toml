[[edit]]
entry = "ref/arc-paladin/chaos-knight"
anchor = "blessings-of-the-maelstrom"
note = "hand-written from print (Plane-Hopper's Handbook p. 18): the table of the blessings stands at the foot of the page, across both columns, and the extraction runs its rows into the next feature (Aura of Chaos); the table has no title in print, only the header row \"d4 | Blessing\" (ruling 44), and follows the feature."
text = '''
At 3rd level, a chaos knight can harness the unpredictable essence of the Maelstrom to bless a creature. When he uses his entropic touch ability, the chaos knight can grant the touched creature a blessing from the table below that lasts for a number of rounds equal to 1 + the chaos knight's Charisma modifier (minimum 1 round). Only one creature can have this blessing at a time. If another creature gains the blessing, the previous blessing ends. The creature rolls 1d4 and compares the result to the table below to determine the blessing. If the chaos knight targets himself with the blessing, he can roll twice and choose his preferred result.

At 5th level and every 3 levels thereafter, the chaos knight can grant a blessing to one additional creature at a time.

This replaces mercy.

|D4|Blessing|
| --- | --- |
|1|The creature gains a sacred bonus to AC equal to 1/5 the paladin's level (minimum +1).|
|2|The creature gains a sacred bonus on weapon damage rolls equal to the chaos knight's Charisma modifier.|
|3|The creature gains [fast healing](ref/umr/fast-healing) 2. This fast healing increases by 1 for every 3 levels the chaos knight has.|
|4|The creature gains an enhancement bonus to its movement speeds, adding 5 feet of movement for every 2 levels the chaos knight has (to a maximum of +40 feet).|
'''

[[edit]]
entry = "ref/arc-paladin/chaos-knight"
anchor = "aura-of-chaos"
note = "hand-written from print (Plane-Hopper's Handbook p. 18): the sentence continues in the next column, and the extraction sets the rows of the table of the blessings (foot of the page) inside it; the text is the printed paragraph with the corpus's link."
text = '''
At 14th level, a chaos knight treats his weapons as chaos-aligned for the purposes of bypassing [damage reduction](ref/rule/damage-reduction). In addition, the chaos knight treats attacks targeting enemies within 10 feet of him as chaos-aligned for the purpose of overcoming damage reduction.

This replaces aura of faith.
'''
