[[edit]]
entry = "ref/arc-bard/juggler"
anchor = "combat-juggling"
note = "hand-written from print (Ranged Tactics Toolbox p. 7): the text runs around the art in the left column and the layer loses the words of one sentence (\"At 6th level and 4 levels thereafter, the maximum maximum of seven objects at 18th level\"); the text is the printed ability."
text = '''
At 2nd level, a juggler can hold and wield (in other words, "juggle") up to three items or weapons in his hands. The juggler must be able to hold and wield an object in one hand in order to juggle it. This ability doesn't grant the juggler additional attacks, though it does allow him to use different weapons as part of a [full attack](ref/rule/full-attack). As long as he is juggling fewer than three objects, the juggler is considered to have a free hand (for the purposes of drawing a weapon, using somatic components, using Deflect Arrows, and so on). At 6th level and every 4 levels thereafter, the maximum number of objects the juggler can juggle increases by one, to a maximum of seven objects at 18th level.

If the juggler is affected by any action or condition that would require a [concentration](ref/rule/concentration) check while he is juggling, he must attempt a Sleight of Hand check to continue juggling and avoid losing concentration. The check's DC is the same as a concentration check, treating the spell level as twice the number of objects being juggled. If the juggler fails his Sleight of Hand check, he drops all juggled objects but one, determined randomly. This ability replaces versatile performance.
'''

[[edit]]
entry = "ref/arc-ranger/toxophilite"
anchor = "greater-intercept"
note = "hand-written from print (Ranged Tactics Toolbox p. 11): the text runs around the art in the right column and the layer loses the words of one sentence (\"she target within 30 feet\"); the text is the printed ability."
text = '''
At 19th level, whenever a toxophilite successfully deflects an attack with her intercept arrow ability, she can redirect the attack against a target within 30 feet, using the intercepted attack's attack roll against the new target's AC. This ability replaces improved quarry.
'''
