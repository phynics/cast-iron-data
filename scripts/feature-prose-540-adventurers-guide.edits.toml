[[edit]]
entry = "ref/arc-unchained-summoner/devil-binder"
anchor = "infernal-affinity-ex-su-or-sp"
note = "hand-written from print (Adventurer's Guide p. 95): the sidebar The Test, which print sets at the foot of the page, was read in the middle of the paragraph; the paragraph is whole here and the sidebar is left out"
text = '''
A devil binder wrenches Hell's power from her eidolon. This grants the devil binder the bloodline powers of the [infernal](ref/sorcbloodline/infernal) sorcerer bloodline (gained at the following levels): corrupting touch (4th), infernal resistances (8th), hellfire (12th), on dark wings (16th), and power of the Pit (20th). The devil binder treats her summoner level as her sorcerer level for the purpose of determining their effects.

This replaces bond senses, shield ally, transposition, greater shield ally, merge forms, and twin eidolon.
'''
