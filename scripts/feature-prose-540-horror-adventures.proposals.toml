[[entry]]
id = "ref/arc-vigilante/serial-killer"
hold = "checker: [fields] trades = \"replaces: 4th- and 14th-level vigilante talents; replaces: 9th- and 19th-level social talents\" disagrees with the trade sentences of the feature `studied-target` = \"replaces: the 4th- and 14th-level vigilante talents and the 9th- and 19th-level social talents\" (line 68)"
opening = ["Some vigilantes adopt an innocent guise to cloak their acts of brutal murder."]

[[entry.feature]]
anchor = "alignment"
head = "Alignment"
listed = false
print = "A serial killer's vigilante identity must be evil. A serial killer whose vigilante identity becomes nonevil cannot gain new levels as a vigilante but retains all of her class abilities."

[[entry.feature]]
anchor = "vigilante-specialization"
head = "Vigilante Specialization"
listed = true
print = '''
A serial killer must choose the stalker specialization. Her hidden strike is considered equivalent to a [sneak attack](ref/ability/sneak-attack) with the same number of dice for the purpose of meeting prerequisites or using abilities that depend on sneak attack.

This alters vigilante specialization.'''
import_trades = ["Vigilante specialization"]

[[entry.feature]]
anchor = "thwart-pursuit"
head = "Thwart Pursuit (Ex)"
listed = true
level = 3
print = '''
At 3rd level, a serial killer adds 1/2 her vigilante level as a bonus on all checks in [a chase](ref/rule/chases) and to the DCs of Diplomacy checks to gather information about her and checks to track her or notice her tracks (though not to the DC of the [profiler's](ref/arc-investigator/profiler) expert profiler ability; see page 55).

This ability replaces unshakable.'''
import_trades = ["Unshakable"]

[[entry.feature]]
anchor = "studied-target"
head = "Studied Target (Ex)"
listed = true
level = 4
print = '''
At 4th level, a serial killer gains the studied target ability of a [slayer](ref/class/slayer) 3 levels lower, including the ability to study multiple targets simultaneously at the appropriate levels. The serial killer does not provoke attacks of opportunity when attempting a [coup de grace](ref/misc/helpless) against a studied target.

This ability replaces the 4th- and 14th-level vigilante talents and the 9th- and 19th-level social talents.'''
import_trades = ["4th- and 14th-level vigilante talents, 9th- and 19th-level social talents", "4th-", "14th-level vigilante talents", "9th-", "19th-level social talents"]

[[entry.feature]]
anchor = "charming"
head = "Charming (Ex)"
listed = true
level = 5
print = '''
At 5th level, a serial killer gains the [charm](ref/hex/charm) hex as if she were a witch of her vigilante level, but she can't affect animals. The DC is based on her Charisma, and the ability is nonmagical.

This ability replaces startling appearance.'''
import_trades = ["Startling appearance"]

[[entry.feature]]
anchor = "death-attack"
head = "Death Attack (Ex)"
listed = true
level = 6
print = '''
At 6th level, a serial killer gains the ability to make a death attack as if she were an [assassin](ref/pclass/assassin) (DC = 10 + 1/2 her vigilante level + her Charisma modifier).

This ability replaces the 6th-level vigilante talent.'''
import_trades = ["6th-level vigilante talent"]

[[entry.feature]]
anchor = "calling-card"
head = "Calling Card (Ex)"
listed = true
level = 7
print = '''
At 7th level, when a serial killer slays a humanoid with a coup de grace or death attack, she can leave a telltale token or clue behind identifying this death as her work. The serial killer chooses her calling card when she gains this ability, and the first time she uses it in an area where she has [renown](ref/soctalent/renown) (as per the renown social talent), it becomes associated with her killings. After that, once citizens of a new settlement find this calling card, the serial killer immediately establishes the settlement as an area of renown for her vigilante identity without spending additional time to spread tales, and the Intimidate bonus from renown increases by 2. She still must spend time to establish her social identity's renown.

This replaces the 7th-level social talent.'''
import_trades = ["7th-level social talent"]

[[entry.feature]]
anchor = "grisly-murder"
head = "Grisly Murder (Ex)"
listed = true
level = 11
print = '''
At 11th level, a serial killer gains [Dreadful Carnage](ref/feat/dreadful-carnage) as a bonus feat, and if she leaves a calling card, the murder is so horrifying that creatures examining the corpse are affected as per _[nightmare](ref/spell/nightmare)_ that night (DC = 10 + 1/2 the serial killer's vigilante level + her Charisma modifier). The [nightmare](ref/spell/nightmare) affects a number of creatures equal to the serial killer's Charisma modifier, starting with the first creature to examine the corpse.

This replaces frightening appearance.'''
import_trades = ["Frightening appearance"]

[[entry.feature]]
anchor = "quiet-death"
head = "Quiet Death (Ex)"
listed = true
level = 12
print = '''
At 12th level, a serial killer gains the quiet death class feature as if she were an assassin.

This ability replaces the 12th-level vigilante talent.'''
import_trades = ["12th-level vigilante talent"]

[[entry.feature]]
anchor = "swift-death"
head = "Swift Death (Ex)"
listed = true
level = 17
print = '''
At 17th level, a serial killer gains the swift death class feature as an assassin.

This ability replaces the vigilante's stunning appearance.'''
import_trades = ["Stunning appearance"]
