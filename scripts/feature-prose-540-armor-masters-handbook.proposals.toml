[[entry]]
id = "ref/arc-warpriest/shieldbearer"
opening = ["Shieldbearers are divine warriors who stand on the front lines of battle, shoulder to shoulder with the soldiers of their people. The shieldbearer tradition has long been a strong legacy among the dwarves of the Five Kings Mountains, while many young women throughout the Lands of the Linnorm Kings and Realm of the Mammoth Lords become shieldbearers known as shield maidens. Shieldbearers among the Shoanti are often advisors as well as combatants, while in the Mwangi Expanse shieldbearers are known for defending entire villages from the Gorilla King's minions."]

[[entry.feature]]
anchor = "shield-adept"
head = "Shield Adept (Ex)"
listed = true
level = 1
print = '''
At 1st level, a shieldbearer receives [Improved Shield Bash](ref/feat/improved-shield-bash) as a bonus feat. When carrying a shield, the shieldbearer adds his shield bonus on [concentration](ref/rule/concentration) checks to cast defensively.

This ability replaces focus weapon.'''
import_trades = ["Focus weapon"]

[[entry.feature]]
anchor = "sacred-weapon"
head = "Sacred Weapon (Su)"
listed = true
level = 1
print = '''
A shieldbearer treats shields as sacred weapons (instead of his god's favored weapon), though the shieldbearer can still designate additional weapons as sacred weapons by selecting them with the [Weapon Focus](ref/feat/weapon-focus) feat. The shieldbearer's sacred weapon damage applies only to attacks made with shields. The shieldbearer does not gain the ability to enhance sacred weapons until 7th level. For every 3 warpriest levels beyond 7th, this bonus increases by 1 (to a maximum of +5 at 19th level).

This ability alters sacred weapon and also replaces sacred armor.'''
import_trades = ["Sacred weapon, sacred armor", "Sacred weapon", "sacred armor"]

[[entry.feature]]
anchor = "sacred-shield"
head = "Sacred Shield (Su)"
listed = true
level = 4
print = '''
At 4th level, a shieldbearer gains the ability to enhance his shield with divine power as a swift action. This ability functions as the sacred armor ability, except as follows. This power grants the shield a +1 enhancement bonus (this bonus does not act as an attack or damage bonus when the shield is used in a shield bash). For every 4 warpriest levels beyond 4th, this bonus increases by 1 (to a maximum of +5 at 20th level). The shieldbearer can enhance a shield with any of the following armor special abilities (instead of those listed for sacred armor): _[arrow deflection](ref/magic-enh/arrow-deflection)_, _[blinding](ref/magic-enh/blinding)_, _[fortification](ref/magic-enh/fortification)_ (heavy, light, or moderate), _[reflecting](ref/magic-enh/reflecting)_, and _[spell resistance](ref/magic-enh/spell-resistance)_ (13, 15, 17, and 19).

Armor Master Archetypes and Prestige Classes Many organizations of the Inner Sea region and beyond can be recognized by their armor. Members of these groups often take archetypes and prestige classes that allow them to wear heavier armor, gain greater benefits from their armor, or magically enhance their armor. Armor-focused prestige classes can be found in _Pathfinder Campaign Setting: The Inner Sea World Guide_ (Hellknight and low templar) and _Pathfinder Campaign Setting: Paths of Prestige_ (Golden Legionnaire, Hellknight signifier, Knight of Ozem, and skyseeker). The following books present numerous archetypes suitable for armor-focused characters: _Pathfinder Campaign Setting: Inner Sea Magic_ (Chelish diva and Mendevian priest), _Pathfinder RPG Advanced Class Guide_ (forgepriest, shield champion, and steelblood), _Pathfinder RPG Advanced Player's Guide_ (arcane duelist, divine defender, phalanx fighter, and shielded fighter), _Pathfinder RPG Advanced Race Guide_ (forgemaster), _Pathfinder RPG Occult Adventures_ (battle host), and _Pathfinder RPG Ultimate Combat_ (armor master, armored hulk, crusader, gun tank, myrmidarch, sacred shield, skirnir, sohei, and tower shield specialist).'''

[[entry.feature]]
anchor = "channel-energy"
head = "Channel Energy (Su)"
listed = true
print = '''
The shieldbearer can channel energy only when carrying a shield, and the ability manifests as a 30-foot-cone burst, rather than as a radius.

This ability modifies channel energy.'''
