[[entry]]
id = "ref/arc-cavalier/knight-of-arnisant"
opening = ["The cavaliers known as knights of Arnisant revere the famous general who was crucial in the defeat of the Whispering Tyrant, the powerful wizard-king. Knights of Arnisant call upon Arnisant to grant them protection from evil magic, just as the _Shield of Aroden_ protected him. Many of these cavaliers further emulate him by joining the order of the shield. Most knights of Arnisant serve at Lastwall, where the movement originated, but they can be found everywhere from the general's homeland of Taldor to the front lines of the Worldwound."]

[[entry.feature]]
anchor = "shield-expertise"
head = "Shield Expertise"
listed = true
level = 1
print = '''
At 1st level, a knight of Arnisant gains the [Shield Focus](ref/feat/shield-focus) feat as a bonus feat. His cavalier levels count as fighter levels for the purpose of qualifying for all feats that list the Shield Focus feat as a prerequisite.

This ability replaces tactician.'''
import_trades = ["Tactician"]

[[entry.feature]]
anchor = "deflective-shield"
head = "Deflective Shield (Ex)"
listed = true
level = 4
print = '''
At 4th level, a knight of Arnisant specializes in using his shield to deflect attacks. He adds a bonus equal to his shield bonus to AC to his touch AC and his CMD, up to a maximum of [half](ref/misc/fractions-and-rounding) his cavalier level. He does not include any enhancement bonus he has from a magic shield in this calculation.

This ability replaces expert trainer.'''
import_trades = ["Expert trainer"]

[[entry.feature]]
anchor = "heraldic-banner"
head = "Heraldic Banner (Ex)"
listed = true
level = 5
print = '''
At 5th level, a knight of Arnisant uses his shield as a banner, though its benefits apply only to allies within 30 feet.

This ability alters banner.'''
import_trades = ["Banner"]

[[entry.feature]]
anchor = "soul-shield"
head = "Soul Shield (Su)"
listed = true
level = 9
print = '''
At 9th level, when carrying a shield, a knight of Arnisant adds a bonus equal to his shield bonus to AC on all saving throws against curse spells and effects, up to a maximum of half his cavalier level. He does not include any enhancement bonus from a magic shield in this calculation.

This ability replaces greater tactician.'''
import_trades = ["Greater tactician"]

[[entry.feature]]
anchor = "defensive-challenge"
head = "Defensive Challenge (Ex)"
listed = true
level = 12
print = '''
At 12th level, whenever a knight of Arnisant declares a challenge, his target must pay particular attention to him. As long as the target is within the threatened area of the cavalier, it takes a -2 penalty on attack rolls against anyone other than the knight of Arnisant.

This ability replaces demanding challenge.'''
import_trades = ["Demanding challenge"]

[[entry.feature]]
anchor = "heart-shield"
head = "Heart Shield (Su)"
listed = true
level = 17
print = '''
At 17th level, when carrying a shield, a knight of Arnisant adds a bonus equal to his shield bonus to AC on saving throws against death spells and magical death effects, up to a maximum of half his cavalier level. He does not include any enhancement bonus from a magic shield in this calculation.

This ability replaces greater tactician.'''
import_trades = ["Greater tactician"]

[[entry]]
id = "ref/arc-fighter/molthuni-defender"
opening = ["Molthuni defenders occupy and protect contested territory in their war against Nirmathas. These heavily armored soldiers don't train for maneuverability, but rather for immovability. Taking advantage of their weighty armor, Molthuni defenders can hold back an onslaught of enemies intent on breaking through their line. The majority of Molthuni defenders were laborers who joined the military to gain citizenship, though a noteworthy minority are from stouter non-human races."]

[[entry.feature]]
anchor = "armored-defense"
head = "Armored Defense (Ex)"
listed = true
level = 3
print = '''
At 3rd level, a Molthuni defender gains a bonus to his CMD against bull rush, dirty trick, drag, grapple, overrun, reposition, and trip combat maneuver checks.

This bonus also applies to the DC of foes' Acrobatics checks to move through squares he threatens. This bonus is +1 when the Molthuni defender is wearing medium armor, and +3 when he is wearing heavy armor. At 7th, 11th, and 15th levels, these bonuses increase by 1.

In addition to this, the Molthuni defender is able to choose one of the following combat maneuvers: bull rush, dirty trick, drag, grapple, overrun, reposition, or trip. When he is wearing medium or heavy armor, the Molthuni defender adds [half](ref/misc/fractions-and-rounding) his armor training bonus on combat maneuver checks for the selected maneuver. He can choose an additional combat maneuver at 7th, 11th, and 15th levels.

This ability replaces armor training 1 through 4, but counts as armor training for the purposes of qualifying for feats and prestige classes. It does not count as advanced armor training (see page 14).'''
import_trades = ["Armor training 1 through 4"]

[[entry]]
id = "ref/arc-magus/armored-battlemage"
hold = "head not printed: Armor Training (Ex), Armor Training (Ex), Heavy Armor (Ex), Expanded Arcane Pool (Su); the replaces trade `Magus arcana gained at 3rd and 18th levels` is not printed in a sentence, and no listed feature of that name prints it; the replaces trade `improved spell combat` is not printed in a sentence, and no listed feature of that name prints it; the replaces trade `Greater spell combat` is not printed in a sentence, and no listed feature of that name prints it"
opening = ["Though it hasn't been at war with its southern neighbor for centuries, Nex continues to train battlemages at its arcane schools in Ecanus. Many battlemages focus purely on destructive evocations, but some extend their tactical studies to include use of the tried-and-true protection of steel. These armored battlemages learn to move and cast spells in even the most restrictive armors, and have developed new methods to magically enhance their armor. Most armored battlemages strongly support the Arclords of Nex. Many travel beyond their homelands seeking some method of contacting the archmage Nex, and hope for some excuse to convince the Council of Three and Nine to renew hostilities with the nation of Geb."]

[[entry.feature]]
anchor = "medium-armor"
head = "Medium Armor (Ex)"
listed = true
level = 1
print = '''
An armored battlemage gains this ability at 1st level instead of 7th. When wearing medium or heavy armor, the armored battlemage gains a +4 bonus on [concentration](ref/rule/concentration) checks to cast defensively. This stacks with the bonus from the [Combat Casting](ref/feat/combat-casting) feat.

This ability replaces spell combat and alters the medium armor ability.'''
import_trades = ["Medium armor", "Spell combat"]

[[entry.feature]]
anchor = "arcane-pool"
head = "Arcane Pool (Su)"
listed = true
level = 1
print = '''
An armored battlemage cannot spend points from his arcane pool to enhance weapons. Instead, he can expend 1 point from his arcane pool as a swift action to grant armor he is wearing a +1 enhancement bonus for 1 minute. For every 4 magus levels he has beyond 1st, the armor gains another +1 enhancement bonus, to a maximum of +5 at 17th level. These bonuses stack with existing armor enhancement bonuses to a maximum of +5. Multiple uses of this ability do not stack with themselves.

At 5th level, these bonuses can be used to add any of the following armor special abilities: _[balanced](ref/magic-enh/balanced)_, _[bitter](ref/magic-enh/bitter)_, _fortification_ (heavy, light, or medium), _[ghost touch](ref/magic-enh/ghost-touch-armor)_, _[invulnerability](ref/magic-enh/invulnerability)_, _spell resistance_ (13, 15, 17, or 19), or _[spell storing](ref/magic-enh/spell-storing-armor)_. Adding these special abilities consumes an amount of bonus equal to the ability's base price modifier. In addition, the armored battlemage can grant his armor the _[energy resistance](ref/magic-enh/energy-resistance)_ special ability at the cost of a +3 bonus or the _[improved energy resistance](ref/magic-enh/energy-resistance-improved)_ special ability at the cost of a +5 bonus. These special abilities are added to any the armor already has, but duplicates do not stack. If the armor is not magical, at least'''
import_trades = ["Arcane pool"]

