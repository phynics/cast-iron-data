[[entry]]
id = "ref/arc-paladin/legate"
opening = ["The first legates in the Inner Sea region were ambassadors from Holomog, a celestial-worshiping confederation in southern Garund. Though they hold to the same strict paladin code, legates present themselves not as armed crusaders, but as peaceful envoys and advisors, bringing wisdom garnered from the long, stable history of their nation. They often serve as diplomats (and sometimes spies) for good organizations. Yet woe to those who believe them defenseless, for a legate can call upon her divine patron to provide her with armor and weapons."]

[[entry.feature]]
anchor = "celestial-armor"
head = "Celestial Armor (Sp)"
listed = true
level = 3
print = '''
At 3rd level, a legate can conjure armor as a standard action. This ability acts as the spell _[instant armor](ref/spell/instant-armor)_, using her paladin level as her caster level, except as follows. At 6th level and every 3 paladin levels thereafter, the armor gains an additional +1 enhancement bonus. These bonuses can be used to add any of the following armor special abilities: _[champion](ref/magic-enh/champion)_, _[fortification](ref/magic-enh/fortification)_ (heavy, light, or medium), _[invulnerability](ref/magic-enh/invulnerability)_, or _[spell resistance](ref/magic-enh/spell-resistance)_ (13, 15, 17, or 19). In addition, the legate can grant her armor the _[energy resistance](ref/magic-enh/energy-resistance)_ special ability at the cost of a +3 bonus, the _[improved energy resistance](ref/magic-enh/energy-resistance-improved)_ special ability at the cost of a +5 bonus, or the _[righteous](ref/magic-enh/righteous)_ special ability at a cost of a +4 bonus. The armor must have least a +1 enhancement bonus before any special abilities can be added. The bonus and special abilities granted are determined when this ability is used and cannot be changed until this ability is used again. If the legate has a steed bond and is riding her steed, she can include her steed when summoning celestial armor, granting the steed barding with the same bonuses and special abilities as her own.

The legate can use this ability a number of times per day equal to her Wisdom bonus plus [half](ref/misc/fractions-and-rounding) her paladin level.

This ability replaces mercy.'''
import_trades = ["Mercy"]

[[entry]]
id = "ref/arc-samurai/yojimbo"
hold = "head not printed: Armor Training (Ex)"
opening = ["Yojimbo are highly trained bodyguards favored by the nobles and warlords of distant Minkai. Yojimbo who follow the order of the warrior loyally guard a single master, while ronin serve whoever can pay for their protection. Yojimbo often accompany visitors to the Inner Sea region from Tian Xia; a few have chosen to stay, and some have even passed on their training to bodyguards of this region."]

[[entry.feature]]
anchor = "resolute-defense"
head = "Resolute Defense (Ex)"
listed = true
level = 1
print = '''
At 1st level, whenever a yojimbo issues a challenge, he can select one ally as his ward for the duration of the challenge. Whenever the yojimbo is adjacent to his ward, he can use resolve, greater resolve, and true resolve on his ward rather than targeting himself.

This ability replaces mount.'''
import_trades = ["Mount"]

[[entry.feature]]
anchor = "armor-expertise"
head = "Armor Expertise (Ex)"
listed = true
level = 3
print = '''
At 3rd level, a yojimbo selects one type of armor, such as [chain shirt](ref/eq-armor/chain-shirt) or [scale mail](ref/eq-armor/scale-mail). The yojimbo gains armor training, treating his samurai level as his [fighter](ref/class/fighter) level, when wearing the selected armor.

This ability replaces weapon expertise.'''
import_trades = ["Weapon expertise"]

[[entry.feature]]
anchor = "intercept"
head = "Intercept (Ex)"
listed = true
level = 4
print = '''
At 4th level, a yojimbo learns to better disrupt the attacks of his enemies. He gains [Bodyguard](ref/feat/bodyguard) as a bonus feat, even if he does not meet the prerequisite. In addition, whenever the yojimbo uses the [aid another](ref/rule/aid-another-2) action to increase an ally's Armor Class, the bonus to Armor Class from the aid another action increases by 1.

This ability replaces mounted archer.'''
import_trades = ["Mounted archer"]

