[[entry]]
id = "ref/arc-magus/card-caster"
opening = ["Though it is known primarily as a tool of knowledge, the harrow is also an instrument of defense and even war. The card caster is an ancient, martial offshoot of the traditional harrower, learning to not only draw power from the harrow, but also to invest each card with deadly power."]

[[entry.feature]]
anchor = "deadly-dealer"
head = "Deadly Dealer (Su)"
listed = true
level = 1
print = "At 1st level, the card caster gains [Deadly Dealer](ref/feat/deadly-dealer) (see page 15) as a bonus feat, even if he does not meet the prerequisites. A card caster can invest cards with enough magic to deal lethal damage even without the [Arcane Strike](ref/feat/arcane-strike) feat so long as he has at least 1 point in his arcane pool."

[[entry.feature]]
anchor = "arcane-pool-focus"
head = "Arcane Pool Focus (Su)"
listed = true
level = 1
print = "A card caster's arcane pool can be used to augment only ranged weapons. At 5th level, a card caster can use his arcane pool to add the following weapon special abilities to ranged weapons: _brilliant energy, distance, flaming, flaming burst, frost, icy burst, returning, seeking, shock, shocking burst, and speed_. He can use his arcane pool to augment an entire [harrow deck](ref/eq-misc/harrow-deck) as if it were ammunition. All cards from a deck enhanced with a special ability, such as _[flaming](ref/magic-enh/flaming)_, must share the same bonus. This ability modifies arcane pool."
import_trades = ["Arcane pool"]

[[entry.feature]]
anchor = "harrowed-spellstrike"
head = "Harrowed Spellstrike (Su)"
listed = true
level = 2
print = "Beginning at 2nd level, a card caster can invest a single thrown weapon with a single touch or ranged spell as part of the spell's normal casting time. The spell must target a single creature, and the spell's range changes to match the thrown weapon's range increment. This ability otherwise functions identically to spellstrike, except it can only be applied to thrown ranged weapons instead of melee attacks. This ability replaces and modifies spellstrike."
import_trades = ["Spellstrike"]

[[entry.feature]]
anchor = "role-dealer"
head = "Role Dealer (Su)"
listed = true
level = 3
print = "Beginning at 3rd level, whenever the card caster randomly draws and throws a harrow card matching one axis of his alignment, the card's critical threat range increases to 19-20. If the card caster draws and throws a harrow card matching his alignment exactly, the attack's critical multiplier also increases to ×3 and the magus gains a +4 bonus on his confirmation roll. This ability replaces the magus arcana gained at 3rd level."
import_trades = ["Magus arcana gained at 3rd level"]
