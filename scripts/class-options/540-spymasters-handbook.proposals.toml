[[entry]]
id = "ref/soctalent/entrepreneur"
anchor = "entrepreneur"
print = "Select any one Intelligence-, Wisdom-, or Charisma-based skill other than Perception or Use Magic Device. The vigilante can use the selected skill to earn money as if he were using a Profession skill. If he selects Perform or Profession, the vigilante instead gains the skill unlock powers for those skills as appropriate for his number of ranks in that skill (_Pathfinder RPG Pathfinder Unchained_ 82). If he has the [social grace](ref/soctalent/social-grace) social talent, he can apply this benefit to all skills selected with the social grace talent."

[[entry]]
id = "ref/soctalent/guise-of-life"
anchor = "guise-of-life"
print = "An undead vigilante with this talent gains an additional social identity in the form of one living creature identical to the vigilante's appearance in life. Successful Knowledge checks reveal information about the vigilante as if he were a living creature, and he counts as living for the purpose of divination spells and effects. He gains no other benefit from appearing to be a living creature, and remains vulnerable to positive energy and spells that effect undead. The vigilante must be a corporeal undead creature to select this talent. Humanoid vigilantes with the [negative energy affinity](ref/carried/bestiary/rules/universal-monster-rules/negative-energy-affinity) racial trait can also select this talent, gaining a human social identity."

[[entry]]
id = "ref/soctalent/guise-of-unlife"
anchor = "guise-of-unlife"
print = "A vigilante with this talent gains an additional social identity in the form of an undead version of one of his existing social identities, such as a [ghoul](ref/monster/ghoul), [vampire](ref/template/vampire), or [zombie](ref/template/zombie). Successful Knowledge checks reveal information about the vigilante as if he were undead, and he counts as undead for the purpose of divination spells and effects. He gains no other benefit from appearing to be an undead creature, and remains vulnerable to negative energy and spells that effect the living. The vigilante must be a living creature to select this talent."

[[entry]]
id = "ref/soctalent/intrigue-feats"
anchor = "intrigue-feats"
print = "The vigilante gains one of the following feats as a bonus feat: [Blustering Bluff](ref/feat/blustering-bluff), [But a Scratch](ref/feat/but-a-scratch), [Call Truce](ref/feat/call-truce), [Confabulist](ref/feat/confabulist), [Criminal Reputation](ref/feat/criminal-reputation), [Cutting Humiliation](ref/feat/cutting-humiliation), [Esoteric Linguistics](ref/feat/esoteric-linguistics), [Intoxicating Flattery](ref/feat/intoxicating-flattery), [Ironclad Logic](ref/feat/ironclad-logic), [Nerve-Racking Negotiator](ref/feat/nerve-racking-negotiator), [Orator](ref/feat/orator), [Persuasive Bribery](ref/feat/persuasive-bribery), [Play to the Crowd](ref/feat/play-to-the-crowd), [Quick Favor](ref/feat/quick-favor), [Rhetorical Flourish](ref/feat/rhetorical-flourish), [Sense Assumptions](ref/feat/sense-assumptions), [Sense Relationships](ref/feat/sense-relationships), or [Street Smarts](ref/feat/street-smarts). He must meet the feat's prerequisites. This talent can be selected multiple times; each time, the vigilante gains a new feat from the above list."

[[entry]]
id = "ref/soctalent/well-known-expert"
anchor = "well-known-expert"
print = '''
The vigilante's social identity is known as an expert in numerous fields, including areas and topics the vigilante hasn't actually taken the time to study. As a result the vigilante is skilled at encouraging others to discover solutions to difficult problems themselves by asking probing questions, while appearing to give the information himself.

In his social identity, the vigilante can take 10 when attempting to [aid another](ref/rule/aid-another) on [Appraise](ref/skill/appraise), [Craft](ref/skill/craft-any), and [Knowledge](ref/skill/knowledge-all) checks. He also gains a bonus equal to [half](ref/misc/fractions-and-rounding) his class level (minimum +1) on Bluff checks to appear knowledgeable in Appraise, Craft (all), and Knowledge (all). If he has the [renown](ref/soctalent/renown) social talent, he grants a +3 bonus when he successfully aids another on these skill checks, rather than +2.

In his area of renown, the vigilante's social identity is so trusted as an expert that scholars are inspired to make amazing deductions and intuitive leaps in discussions with him. A creature that has already failed a Knowledge check on a specific subject can attempt one additional check to gain information on the same topic if it receives an aid another bonus from the vigilante when doing so.'''

