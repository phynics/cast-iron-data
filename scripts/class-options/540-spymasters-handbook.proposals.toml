# The printed text of the powers of the class options of the book, written ones included (the check reads an entry against it). Generated: never edit by hand.

[[entry]]
id = "ref/arcanedisc/observant-illusion"
anchor = "observant-illusion"
print = "You can project your senses into any ongoing figment or shadow illusion you create with a spell of at least 3rd level. You can see through its eyes and hear through its ears as if you were standing where it is, and during your turn you can switch from using its senses to using your own, or back again, as a swift or move action. While you are using its senses, your body is considered [blinded](ref/misc/blinded) and [deafened](ref/misc/deafened). You must be at least a 9th-level wizard to choose this discovery."

[[entry]]
id = "ref/discovery/glimmering-infusion"
anchor = "glimmering-infusion"
print = "The alchemist can expend any prepared extract to produce a cube of glowing motes that act as per _[glitterdust](ref/spell/glitterdust)_. The area must be adjacent to the alchemist and covers one 5-foot square per level of extract sacrificed, and the effect's save DC is calculated using the level of the sacrificed extract. The alchemist must have the [infusion](ref/discovery/infusion) discovery to choose this discovery."

[[entry]]
