anchor = "mockery"
print = "The vigilante gains [Antagonize](ref/feat/antagonize) as a bonus feat. He can target a creature with the Intimidate version of Antagonize twice each day, rather than just once. At 12th level, the effects of the Intimidate version of Antagonize last a number of rounds equal to the vigilante's Charisma modifier (minimum 1)."

[[entry]]
id = "ref/vigtalent/take-em-alive"
anchor = "take-em-alive"
print = '''
The vigilante doesn't take the usual -4 penalty on attack rolls made to deal nonlethal damage with weapons that normally deal lethal damage.

In addition, the vigilante gains a +1 bonus on all attack and damage rolls for attacks that deal only nonlethal damage and have no secondary effects (such as poison). This bonus increases by 1 at 5th level and every 3 levels thereafter, to a maximum of +5 at 20th level.'''

