[[entry]]
id = "ref/vigtalent/fantastic-stride"
anchor = "fantastic-stride"
print = "The vigilante gains [Spring Attack](ref/feat/spring-attack) as a bonus feat, ignoring its prerequisites. At 10th level and every 4 levels thereafter, the vigilante can designate one additional creature when he uses Spring Attack. The vigilante's movement this round does not provoke attacks of opportunity from any of these secondary creatures. A vigilante must be at least 6th level to select this talent."

[[entry]]
id = "ref/vigtalent/major-magic"
anchor = "major-magic"
print = "A vigilante with this talent gains the ability to cast a 1st-level spell drawn from the same spell list as the [minor magic](ref/vigtalent/minor-magic) talent. The vigilante can cast this spell once per day as a [spell-like ability](ref/umr/spell-like-abilities) for every 4 vigilante levels he has. The caster level for this ability is equal to the vigilante's level. The save DC for this spell is equal to 10 + the vigilante's Intelligence modifier (for psychic, sorcerer/wizard, and witch spells), Wisdom (for cleric, druid, and shaman spells), or Charisma (for bard spells). A vigilante must be at least 4th level, have the [minor magic](ref/vigtalent/minor-magic) vigilante talent, and have a score of at least 11 in the appropriate ability to select this talent."

[[entry]]
id = "ref/vigtalent/minor-magic"
anchor = "minor-magic"
print = '''
A vigilante with this talent selects one of the following spells lists: bard, cleric, druid, psychic, shaman, sorcerer/wizard, or witch. Once this decision is made, the selection cannot be changed. The vigilante gains the ability to cast a 0-level spell from the selected spell list. This spell can be cast two times per day as a [spell-like ability](ref/umr/spell-like-abilities). The caster level for this ability is equal to the vigilante's level.

The save DC for this spell is equal to 10 + the vigilante's Intelligence modifier (for psychic, sorcerer/wizard, and witch spells), Wisdom (for cleric, druid, and shaman spells), or Charisma (for bard spells).'''

[[entry]]
