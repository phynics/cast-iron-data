anchor = "one-of-those-faces"
print = "Each day, you can use _[disguise self](ref/spell/disguise-self)_ as a [spell-like ability](ref/umr/spell-like-abilities) for up to 10 minutes per character level. This duration need not be continuous, but it must be used in 10-minute increments. Additionally, once you have used this ability, whenever you use it for the next 24 hours you must take the same alternate appearance."

[[entry]]
id = "ref/invtalent/scrying-familiarity"
anchor = "scrying-familiarity"
print = "You are well acquainted with scrying sensors. You can roll twice and take the better result on saving throws against divination (scrying) spells and effects, on [Perception](ref/skill/perception) checks to notice scrying sensors, and on caster level checks to overcome [spell resistance](ref/rule/spell-resistance) when you use a scrying spell or effect. If you notice a magical sensor, you can attempt a [Stealth](ref/skill/stealth) check opposed by the caster's caster level check to avoid being detected by the sensor."

