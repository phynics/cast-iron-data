[[entry]]
id = "ref/eidolon/archon"
anchor = "base-evolutions"
print = '''
Starting at 1st level, devil eidolons gain the resistance (fire) evolution and the skilled (Bluff) evolution. They also gain a +4 bonus on saving throws against poison.

At 4th level, devil eidolons gain acid resistance 10 and cold resistance 10.

At 8th level, devil eidolons gain the skilled (Diplomacy) evolution and gain immunity to poison.

At 12th level, devil eidolons gain DR 5/good. They also gain see in darkness (see the devil subtype on page 311 of the _Bestiary_).

At 16th level, devil eidolons lose the resistance (fire) evolution, and instead gain the immunity (fire) evolution. They also gain telepathy (_Bestiary_ 305).

At 20th level, devil eidolons gain regeneration 5 (good weapons, good spells). They are still banished to Hell as normal for eidolons if they take enough damage.

Div Formed of hatred and spite, div eidolons seek to despoil and ruin all things beautiful and joyous. Div eidolons particularly resent having mortal masters, and seek to doom their summoners to existences full of suffering and loss. Each div eidolon has a unique compulsion it must follow—usually something similar to the doru's obsession with secrets—that leads it to bargain its loyalty for something the summoner provides. The div's summoner uses his eidolon's compulsion to entrap and control the eidolon. Still, div eidolons never fully give in, and continue to plot ways they might corrupt that which their masters hold dearest.'''

