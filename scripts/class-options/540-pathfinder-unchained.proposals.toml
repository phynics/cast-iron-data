[[entry]]
id = "ref/eidolon/daemon"
anchor = "base-evolutions"
print = '''
At 1st level, inevitable eidolons count as both constructs and outsiders for the purpose of effects such as the _bane_ weapon special ability and the favored enemy class feature. They gain a +4 bonus on saving throws against death effects, disease, necromancy effects, paralysis, poison, sleep, and stun.

At 4th level, inevitable eidolons gain a +4 bonus on saving throws against mind-affecting effects and immunity to nonlethal damage, fatigue, and exhaustion.

At 8th level, inevitable eidolons gain immunity to death effects, disease, and poison.

At 12th level, inevitable eidolons gain DR 5/chaotic. They also gain immunity to sleep, as well as the true speech ability (see the inevitable subtype on page 307 of _Bestiary 2_).

At 16th level, inevitable eidolons lose the +4 bonus on saving throws against necromancy effects and gain immunity to ability damage, ability drain, energy drain, and necromancy effects.

At 20th level, inevitable eidolons gain immunity to paralysis, sleep, stun, and any effect that requires a Fortitude save (unless the effect also works on objects). Protean Serpentine beings of pure chaos, proteans seek to reshape reality. Protean eidolons appreciate creative summoners who often rebuild their forms and make liberal use of the _transmogrify_ spell. Beyond that, protean eidolons are happy to work with their summoners for any purpose, though they are quick to remind their summoners that while they have a mutually beneficial relationship, they are not servants.'''

[[entry]]
id = "ref/eidolon/daemon"
anchor = "alignment"
print = "Chaotic neutral."

[[entry]]
id = "ref/eidolon/daemon"
anchor = "base-form"
print = "Serpentine (bite, grab \\[tail slap\\], tail, tail slap)."

[[entry]]
id = "ref/eidolon/daemon"
anchor = "base-evolutions"
print = '''
At 1st level, protean eidolons gain the resistance (acid) evolution as well as the grab evolution, tied to an attack type of the summoner's choice. Whenever the summoner changes the protean eidolon's evolutions, he can also change the attack type for grab.

At 4th level, protean eidolons gain electricity resistance 10 and sonic resistance 10.

At 8th level, protean eidolons gain the constrict evolution.

At 12th level, protean eidolons gain DR 5/lawful. They also gain the blindsense evolution and the ability to fly without wings with perfect maneuverability, as the flight evolution with 4 points spent.

At 16th level, protean eidolons lose the resistance (acid) evolution and instead gain the immunity (acid) evolution. They also gain the amorphous anatomy ability (see the protean subtype on page 308 of _Bestiary 2_).

At 20th level, protean eidolons gain constant _freedom of movement_ and the protean version of the change shape (_greater polymorph_) ability (see the protean subtype on page 308 of _Bestiary 2_). Psychopomp Stewards, chroniclers, and guides of all things that die, psychopomps make dispassionate yet loyal eidolons. When they deal with the world of mortals, psychopomp eidolons nearly always wear masks. They do not tolerate summoners who traffic with daemons, undead, and other entities that interfere with the transmigration of souls, but otherwise they are comfortable with most actions on the summoner's part. When the summoner dies, a psychopomp eidolon personally escorts him to the afterlife and serves as an expert witness when it is time for him to be judged.'''

