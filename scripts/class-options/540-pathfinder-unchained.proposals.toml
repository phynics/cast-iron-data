anchor = "base-evolutions"
print = '''
At 1st level, archon eidolons gain the resistance (electricity) evolution and the skilled (Intimidate) evolution. They also gain a +4 bonus on saving throws against poison.

At 4th level, archon eidolons add 1 point to their evolution pools.

At 8th level, archon eidolons gain the ability increase evolution, applied to an ability score the summoner chooses.

At 12th level, archon eidolons gain DR 5/evil. They also gain immunity to petrification and the truespeech ability (see the archon subtype on page 310 of the _Bestiary_).

At 16th level, archon eidolons lose the resistance (electricity) evolution and skilled (Intimidate) evolution, and instead gain the immunity (electricity) evolution. In addition, they gain the aura of menace ability (see the archon subtype on page 310 of the _Bestiary_).

At 20th level, archon eidolons gain the ability to use _greater teleport_ at will, as the spell (caster level 14th), except they can teleport only themselves and up to 50 pounds of carried objects. Azata Embodiments of the untamable beauty and noble passion of Elysium, azata eidolons have wild and beautiful features. They often take graceful forms reminiscent of elves or fey, but they occasionally appear like lillends, with serpentine tails. Azata eidolons are flighty and independent, and they often have their own ideas about how to defeat evil or have a good time. Thus, an azata eidolon is likely to balk if its summoner commands it to perform offensive or nefarious actions. On the other hand, an azata eidolon in sync with its summoner is a passionate and devoted companion.'''

