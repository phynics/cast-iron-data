# The printed text of the powers of the class options of the book, written ones included (the check reads an entry against it). Generated: never edit by hand.

[[entry]]
id = "ref/eidolon/agathion"
anchor = "opening"
print = '''
suspended until the summoner emerges from the eidolon (although durations continue to expire).

The summoner can cast spells while inside the eidolon by taking control of the eidolon for the duration of the casting. Any material components used for these spells are taken from the summoner's gear, even though they are otherwise inaccessible. The summoner can direct all of the eidolon's actions while merged, can perceive through its senses, and can speak through its voice.

The summoner can use this ability for a number of rounds per day equal to his summoner level. He can end this effect at any time as a swift action. The summoner emerges in a square adjacent to the eidolon if able. If the eidolon is returned to its home plane while the summoner is merged with it, the summoner is immediately ejected, takes 4d6 points of damage, and is stunned for 1 round.'''

[[entry]]
id = "ref/eidolon/agathion"
anchor = "greater-aspect"
print = "At 18th level, a summoner can divert more of his eidolon's evolutions to himself. This ability functions as the aspect ability, but the maximum number of evolution points the summoner can divert increases to 6. In addition, the eidolon loses 1 point from its evolution pool for every 2 points (or fraction thereof) diverted to the summoner instead of losing 1 point from the evolution pool for each point diverted."

[[entry]]
id = "ref/eidolon/agathion"
anchor = "twin-eidolon"
print = "At 20th level, a summoner and his eidolon share a true connection. As a standard action, the summoner can assume the shape of his eidolon, copying all of its evolutions, form, and abilities. His Strength, Dexterity, and Constitution scores change to match the base scores of his eidolon. He can choose to have any gear that he carries become absorbed by his new form, as with spells from the polymorph subschool. Items with continuous effects continue to function while absorbed in this way. The summoner loses his natural attacks and all racial traits (except bonus feats, skills, and languages) in favor of the abilities granted by his eidolon's evolutions. The summoner retains all of his class features. The summoner can keep this form for a number of minutes per day equal to his summoner level. This duration does not need to be consecutive, but it must be spent in 1-minute increments. The summoner can end this effect as a free action."

[[entry]]
id = "ref/eidolon/agathion"
anchor = "eidolons"
print = "An eidolon's abilities are determined by the summoner's level and by the choices made using its evolution pool. Table 1–6: Eidolon Base Statistics determines many of the base statistics of the eidolon. Each eidolon possesses a base form that modifies these base statistics. Eidolons are outsiders for the purpose of determining which spells affect them."

[[entry]]
id = "ref/eidolon/agathion"
anchor = "class-level"
print = "This is the character's summoner level."

[[entry]]
id = "ref/eidolon/agathion"
anchor = "hd"
print = "This is the total number of 10-sided (d10) Hit Dice the eidolon possesses, each of which gains a Constitution modifier, as normal."

[[entry]]
id = "ref/eidolon/agathion"
anchor = "bab"
print = "This is the eidolon's base attack bonus. An eidolon's base attack bonus is equal to its Hit Dice. Eidolons do not gain additional attacks using their natural weapons for a high base attack bonus."

[[entry]]
id = "ref/eidolon/agathion"
anchor = "good-saves-and-poor-save"
print = "These are the eidolon's base saving throw bonuses. An eidolon possesses two good saving throws and one poor saving throw, determined by the creature's base form."

[[entry]]
id = "ref/eidolon/agathion"
anchor = "skills"
print = "This lists the eidolon's total skill ranks. An eidolon can assign skill ranks to any skill, but it must possess the appropriate appendages to use some skills. Eidolons with Intelligence scores above the base value modify these totals as normal (an eidolon gains a number of skill ranks equal to 6 + its Intelligence modifier per Hit Die). An eidolon cannot have more ranks in a skill than it has Hit Dice. Eidolon skill ranks are set once chosen, even if the creature's evolutions change when the summoner gains a new level."

[[entry]]
id = "ref/eidolon/agathion"
anchor = "feats"
print = "This is the total number of feats possessed by an eidolon. Eidolons can select any feat they qualify for, but they must possess the appropriate appendages to use some feats. Eidolon feats are set once chosen, even if the creature changes when the summoner gains a new level. If, due to such changes, the eidolon no longer qualifies for a feat, the feat has no effect until the eidolon once again qualifies for the feat."

[[entry]]
id = "ref/eidolon/agathion"
anchor = "armor-bonus"
print = "The number noted here is the eidolon's base total armor bonus. This bonus can be split between an armor bonus and a natural armor bonus, as decided by the summoner. This number is modified by the eidolon's base form and some options available through its evolution pool. An eidolon cannot wear armor of any kind, as the armor interferes with the summoner's connection to the eidolon."

[[entry]]
id = "ref/eidolon/agathion"
anchor = "str-dex-bonus"
print = "Add this modifier to the eidolon's Strength and Dexterity scores, which are determined by its base form. Some options available through the eidolon's evolution pool might modify these scores."

[[entry]]
id = "ref/eidolon/agathion"
anchor = "evolution-pool"
print = "The value given in this column is the total number of points in the eidolon's evolution pool. Points in this pool can be spent on a wide variety of modifications and upgrades that add new abilities, attacks, and powers to the eidolon. Whenever the summoner gains a level, the number of points in this pool increases and the summoner can spend these points to change the abilities of the eidolon. These choices are not set—the summoner can change them whenever he gains a level (and through the _transmogrify_ spell)."

[[entry]]
id = "ref/eidolon/agathion"
anchor = "max-attacks"
print = "This indicates the maximum number of attacks that the eidolon is allowed to possess at the given level. If the eidolon is at its maximum, it cannot take evolutions that grant additional attacks. Attacks made with weapons, including those granted by a high base attack bonus, are counted against this maximum."

[[entry]]
id = "ref/eidolon/agathion"
anchor = "special"
print = "This includes a number of abilities gained by all eidolons as they increase in power (see Table 1–6: Eidolon Base Statistics). Each of these bonuses is described below."

[[entry]]
id = "ref/eidolon/agathion"
anchor = "darkvision"
print = '''
The eidolon has darkvision with a range of 60 feet.

_Link (Ex)_: A summoner and his eidolon share a mental link that allows for communication across any distance (as long as they are on the same plane). This communication is a free action, allowing the summoner to give orders to his eidolon at any time. In addition, magic items interfere with the summoner's connection to his eidolon. As a result, the summoner and his eidolon share magic item slots. For example, if the summoner is wearing a ring, his eidolon can wear no more than one ring. In case of a conflict, the items worn by the summoner remain active, and those used by the eidolon become dormant. The eidolon must possess the appropriate appendages to use a magic item.

_Share Spells (Ex)_: The summoner can cast a spell with a target of "you" on his eidolon (as a spell with a range of touch) instead of on himself. A summoner can cast spells on his eidolon even if the spells normally do not affect creatures of the eidolon's type (outsider). Spells cast in this way must come from the summoner spell list. This ability does not allow the eidolon to share abilities that are not spells, even if they function like spells.'''

[[entry]]
id = "ref/eidolon/agathion"
anchor = "evasion"
print = '''
If the eidolon is subjected to an attack that normally allows a Reflex save for half damage, it takes no damage if it succeeds at its saving throw.

_Ability Score Increase (Ex)_: The eidolon adds 1 to one of its ability scores.'''

[[entry]]
id = "ref/eidolon/agathion"
anchor = "devotion"
print = '''
An eidolon gains a +4 morale bonus on Will saves against enchantment spells and effects.

_Multiattack_: An eidolon gains Multiattack as a bonus feat if it has three or more natural attacks and does not already have that feat. If it does not have the requisite three or more natural attacks (or it is reduced to fewer than three attacks), the eidolon instead gains a second attack with one of its natural weapons, albeit at a -5 penalty. If the eidolon later gains three or more natural attacks, it loses this additional attack and instead gains Multiattack.'''

[[entry]]
id = "ref/eidolon/agathion"
anchor = "improved-evasion"
print = "When subjected to an attack that allows a Reflex saving throw for half damage, an eidolon takes no damage if it succeeds at its saving throw and only half damage if it fails."

[[entry]]
id = "ref/eidolon/agathion"
anchor = "eidolon-skills"
print = "The following skills are class skills for eidolons: Bluff (Cha), Craft (Int), Knowledge (planes) (Int), Perception (Wis), Sense Motive (Wis), and Stealth (Dex). In addition, at 1st level, the summoner can choose four additional skills to be class skills for his eidolon. Note that eidolons with a fly speed gain Fly (Dex) as a free class skill, even if they do not gain a fly speed until a later level."

[[entry]]
id = "ref/eidolon/agathion"
anchor = "eidolon-subtypes"
print = '''
The first time a summoner calls his eidolon, he must decide on its subtype. The eidolon's subtype determines a number of its base statistics and abilities, as well as its overall look and theme. The subtype also determines what sort of evolutions the summoner can select for his eidolon using the evolution pool. Once the choice of subtype is made, it cannot be changed.

As a summoner gains levels, his eidolon gains specific evolutions based on its subtype. Each subtype entry below includes the following information.'''

[[entry]]
id = "ref/eidolon/agathion"
anchor = "name"
print = "This is the name of the eidolon's subtype. The eidolon gains this as a subtype, but unless otherwise noted, it does not gain any of the features, abilities, or weaknesses of that subtype."

[[entry]]
id = "ref/eidolon/agathion"
anchor = "description"
print = "This gives a basic overview of eidolons of this subtype, including general guidelines on appearance and personality."

[[entry]]
id = "ref/eidolon/agathion"
anchor = "alignment"
print = "The eidolon is a creature of this alignment. If its alignment is chaotic, evil, lawful, or good, it gains that subtype."

[[entry]]
id = "ref/eidolon/agathion"
anchor = "base-form"
print = "Eidolons of some subtypes are restricted in their choice of base form. Restrictions are spelled out here. The evolutions listed here are gained automatically, and do not cost points from the eidolon's evolution pool. (See page 34.)"

[[entry]]
id = "ref/eidolon/agathion"
anchor = "base-evolutions"
print = "This describes the base evolutions possessed by all eidolons of this subtype. Following the entry is a list of evolutions gained as the summoner gains levels; these evolutions are gained automatically, and do not cost points from the eidolon's evolution pool. In some cases, eidolons of certain subtypes will gain abilities that are not evolutions. Unless otherwise noted, such abilities function as described in the Universal Monster Rules section beginning on page 297 of the _Pathfinder RPG Bestiary_. (See page 34.) Agathion Patient and enlightened liaisons of the good-aligned Outer Planes, agathion eidolons seek to vanquish evil and protect that which is good. Agathion eidolons always have aspects of a single animal or creature, rather than a hodgepodge of several. Though they have patience for summoners with unorthodox methods and even those who stray from the path of good, they will not brook their powers being used for evil ends. An agathion eidolon seeks to bring its summoner closer to its own enlightenment."

[[entry]]
id = "ref/eidolon/agathion"
anchor = "alignment"
print = "Neutral good."

[[entry]]
id = "ref/eidolon/agathion"
anchor = "base-form"
print = "Biped (claws, limbs \\[arms\\], limbs \\[legs\\]) or quadruped (limbs \\[legs, 2\\], bite)."

[[entry]]
id = "ref/eidolon/agathion"
anchor = "base-evolutions"
print = '''
Starting at 1st level, agathion eidolons gain the resistance (electricity) evolution. They also gain a +4 bonus on saving throws against poison and petrification.

At 4th level, agathion eidolons gain cold resistance 10 and sonic resistance 10.

At 8th level, agathion eidolons gain lay on hands as paladins with levels equal to their Hit Dice.

At 12th level, agathion eidolons gain DR 5/evil. They also gain immunity to petrification and the truespeech ability (see the agathion subtype on page 306 of _Pathfinder RPG Bestiary 2_).

At 16th level, agathion eidolons lose the resistance (electricity) evolution, and instead gain the immunity (electricity) evolution. They also gain the agathion's speak with animals ability (see the agathion subtype on page 306 of _Bestiary 2_).

At 20th level, agathion eidolons gain _detect thoughts_ as a spell-like ability at will and also increase their damage reduction to DR 10/evil. Angel Hailing from the higher planes, angel eidolons are creatures of exquisite beauty. They usually appear in idealized humanoid forms, with smooth skin, shining hair, and bright eyes. Angel eidolons are impeccably honorable, trustworthy, and diplomatic, but they do not shy away from confrontation when facing off against evil and its minions.'''

[[entry]]
id = "ref/eidolon/agathion"
anchor = "alignment"
print = "Any good."

[[entry]]
id = "ref/eidolon/agathion"
anchor = "base-form"
print = "Biped (limbs \\[arms\\], limbs \\[legs\\], slam)."

[[entry]]
id = "ref/eidolon/agathion"
anchor = "base-evolutions"
print = '''
At 1st level, angel eidolons gain the resistance (acid) and resistance (cold) evolutions. They also gain a +4 bonus on saving throws against poison.

At 4th level, angel eidolons gain electricity resistance 10 and fire resistance 10.

At 8th level, angel eidolons grow large, feathery wings, gaining the flight evolution.

At 12th level, angel eidolons gain DR 5/evil. They also gain immunity to petrification and the truespeech ability (see the angel subtype on page 310 of the _Bestiary_).

At 16th level, angel eidolons lose the resistance (acid) and resistance (cold) evolutions, and instead gain the immunity (acid) and immunity (cold) evolutions.

At 20th level, angel eidolons gain the protective aura ability (see the angel subtype on page 310 of the _Bestiary_). Archon Summoned from heaven, archon eidolons are the embodiments of righteousness. They often take on powerful, graceful forms, rippling with muscles but refined in their movements. Archon eidolons are totally dedicated to the cause of good, and have little patience for those who violate their oaths and ideals—including the summoner who called them. Archons will do whatever it takes to stop the advance of evil and protect the innocent.'''

[[entry]]
id = "ref/eidolon/agathion"
anchor = "alignment"
print = "Lawful good."

[[entry]]
id = "ref/eidolon/agathion"
anchor = "base-form"
print = "Biped (limbs \\[arms\\], limbs \\[legs\\], slam)."

[[entry]]
id = "ref/eidolon/agathion"
anchor = "base-evolutions"
print = '''
At 1st level, archon eidolons gain the resistance (electricity) evolution and the skilled (Intimidate) evolution. They also gain a +4 bonus on saving throws against poison.

At 4th level, archon eidolons add 1 point to their evolution pools.

At 8th level, archon eidolons gain the ability increase evolution, applied to an ability score the summoner chooses.

At 12th level, archon eidolons gain DR 5/evil. They also gain immunity to petrification and the truespeech ability (see the archon subtype on page 310 of the _Bestiary_).

At 16th level, archon eidolons lose the resistance (electricity) evolution and skilled (Intimidate) evolution, and instead gain the immunity (electricity) evolution. In addition, they gain the aura of menace ability (see the archon subtype on page 310 of the _Bestiary_).

At 20th level, archon eidolons gain the ability to use _greater teleport_ at will, as the spell (caster level 14th), except they can teleport only themselves and up to 50 pounds of carried objects. Azata Embodiments of the untamable beauty and noble passion of Elysium, azata eidolons have wild and beautiful features. They often take graceful forms reminiscent of elves or fey, but they occasionally appear like lillends, with serpentine tails. Azata eidolons are flighty and independent, and they often have their own ideas about how to defeat evil or have a good time. Thus, an azata eidolon is likely to balk if its summoner commands it to perform offensive or nefarious actions. On the other hand, an azata eidolon in sync with its summoner is a passionate and devoted companion.'''

[[entry]]
id = "ref/eidolon/agathion"
anchor = "alignment"
print = "Chaotic good."

[[entry]]
id = "ref/eidolon/agathion"
anchor = "base-form"
print = "Biped (limbs \\[arms\\], limbs \\[legs\\]) or serpentine (limbs \\[arms\\], tail, tail slap)."

[[entry]]
id = "ref/eidolon/agathion"
anchor = "base-evolutions"
print = '''
At 1st level, azata eidolons gain the resistance (electricity) evolution and the 4-point weapon training evolution (proficiency in martial weapons).

At 4th level, azata eidolons gain cold resistance 10 and fire resistance 10.

At 8th level, azata eidolons grow large, feathery wings, gaining the flight evolution.

At 12th level, azata eidolons gain DR 5/evil. They also gain immunity to petrification and the truespeech ability (see the azata subtype on page 311 of the _Bestiary_).

At 16th level, azata eidolons lose the resistance (electricity) evolution, and instead gain the immunity (electricity) evolution. They also gain the ability increase evolution, applied to an ability score of the summoner's choice.

At 20th level, an azata eidolon gains the ability to switch between its normal form and an energy form as a standard action. In its energy form, an azata eidolon is incorporeal and doubles its fly speed, but it can't make natural or manufactured weapon attacks; it can, however, activate any spell-like ability evolutions it possesses.

Table 1–6: Eidolon Base Statistics Class Good Poor Armor Str/Dex Level HD BAB Saves Save Skills Feats Bonus Bonus 1st 1 +1 +2 +0 4 1 +0 2nd 2 +2 +3 +0 8 1 +2 3rd 3 +3 +3 +1 12 2 +2 4th 3 +3 +3 +1 12 2 +2 5th 4 +4 +4 +1 16 2 +4 6th 5 +5 +4 +1 20 3 +4 7th 6 +6 +5 +2 24 3 +6 8th 6 +6 +5 +2 24 3 +6 9th 7 +7 +5 +2 28 4 +6 10th 8 +8 +6 +2 32 4 +8 11th 9 +9 +6 +3 36 5 +8 12th 9 +9 +6 +3 36 5 +10 13th 10 +10 +7 +3 40 5 +10 14th 11 +11 +7 +3 44 6 +10 15th 12 +12 +8 +4 48 6 +12 16th 12 +12 +8 +4 48 6 +12 17th 13 +13 +8 +4 52 7 +14 18th 14 +14 +9 +4 56 7 +14 19th 15 +15 +9 +5 60 8 +14 20th 15 +15 +9 +5 60 8 +16 Daemon The agents of horrible deaths, daemon eidolons desire the utter annihilation of all things. Their forms vary wildly depending on which type of death they embody, and daemon eidolons sometimes represent a more obscure kind of death than the most famous daemons. Daemon eidolons wish to sow death and misery through a variety of means. Most are capable of seeing the big picture, and will obediently follow even a neutral summoner. Ending lives is a typical part of an adventurer's career, so following along with a summoner gives a daemon eidolon many opportunities to gather mortal soul energy for its own dark and inscrutable purposes.'''

