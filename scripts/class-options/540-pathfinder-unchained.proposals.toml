[[entry]]
id = "ref/eidolon/demon"
anchor = "evolution-max"
print = "Pool Attacks Special +0 1 3 Darkvision, link, share spells +1 2 3 Evasion +1 3 3 — +1 3 4 — +2 4 4 Ability score increase +2 5 4 Devotion +3 6 4 — +3 6 4 — +3 7 5 Multiattack +4 8 5 Ability score increase +4 9 5 — +5 9 5 — +5 10 5 — +5 11 6 Improved evasion +6 12 6 Ability score increase +6 12 6 — +7 13 6 — +7 14 6 — +7 15 7 — +8 15 7 — At 20th level, as a standard action, a daemon eidolon can devour a portion of the soul of a dying creature or a creature that died no earlier than 1 round ago. This kills the creature and provides the daemon eidolon a profane bonus on attack rolls, saving throws, and skill checks for 24 hours. The bonus is equal to +1 per 5 Hit Dice the slain creature possessed. A creature whose soul was devoured in this way requires _resurrection_ or more powerful magic to return from the dead. Demon Raw destruction given material substance, demon eidolons form out of the Abyss's stew of soul energy, leading some scholars to speculate that the summoner's arts are related to the magical tampering that gave rise to the first demons. Demon eidolons revel in causing destruction and inflicting suffering, and they will do so for their summoners without question, taking pleasure in whatever havoc they can create. For a demon eidolon, the means justify the ends."

