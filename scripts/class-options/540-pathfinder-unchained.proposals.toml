[[entry]]
id = "ref/eidolon/elemental"
anchor = "resistance"
print = "The eidolon's form takes on a resiliency to one particular energy type, which is usually ref lected in its physical body (ashen hide for fire, icy breath for cold, and so on). Select one energy type (acid, cold, electricity, fire, or sonic). The eidolon gains resistance 5 against that energy type. This resistance increases by 5 for every 5 levels the summoner possesses, to a maximum of 15 at 10th level. This evolution can be selected more than once. Its effects do not stack. Each time the eidolon selects this evolution, it applies to a different energy type."

[[entry]]
id = "ref/eidolon/elemental"
anchor = "scent"
print = "The eidolon's sense of smell becomes quite acute. The eidolon gains the scent special quality, allowing it to detect opponents within 30 feet by sense of smell. If the opponent is upwind, the range increases to 60 feet; if the opponent is downwind, the range drops to 15 feet. Strong scents can be detected at twice the normal range. Scent does not allow the eidolon to precisely locate the creature, only to detect its presence. It can detect the direction as a move action. The eidolon can pinpoint the creature's location if it is within 5 feet. The eidolon can use scent to track creatures."

[[entry]]
id = "ref/eidolon/elemental"
anchor = "skilled"
print = "The eidolon becomes especially adept at a specific skill, gaining a +8 racial bonus on that skill. This evolution can be selected more than once. Its effects do not stack. Each time the eidolon selects this evolution, it applies to a different skill."

[[entry]]
id = "ref/eidolon/elemental"
anchor = "slam"
print = "The eidolon can deliver a devastating slam attack. This attack is a primary attack. The slam deals 1d8 points of damage (2d6 if Large, 2d8 if Huge). The eidolon must have the limbs (arms) evolution to take this evolution. Alternatively, the eidolon can replace the claws from its base form with this slam attack (this still costs 1 evolution point). This evolution can be selected more than once, up to the number of the eidolon's limbs (arms) evolutions."

[[entry]]
id = "ref/eidolon/elemental"
anchor = "sting"
print = "The eidolon possesses a long, barbed stinger at the end of its tail, granting it a sting attack. This attack is a primary attack. The sting deals 1d4 points of damage (1d6 if Large, 1d8 if Huge). This evolution can be selected more than once, up to the number of tail evolutions the eidolon possesses. _Requirements_: Agathion, daemon, demon, devil, div, elemental, protean, or psychopomp subtype; tail evolution."

[[entry]]
id = "ref/eidolon/elemental"
anchor = "swim"
print = "The eidolon gains webbed hands, webbed feet, or powerful flippers, giving it a swim speed equal to its base speed. This evolution does not give the eidolon the ability to breathe underwater. This evolution can be selected more than once. Each additional time it is selected, increase the eidolon's swim speed by 20 feet."

[[entry]]
id = "ref/eidolon/elemental"
anchor = "tail"
print = "The eidolon grows a long, powerful tail. This grants it a +2 racial bonus on Acrobatics checks to balance on a surface. This evolution can be selected more than once. _Requirements_: Agathion, daemon, demon, devil, div, elemental, protean, or psychopomp subtype."

[[entry]]
id = "ref/eidolon/elemental"
anchor = "tail-slap"
print = "The eidolon can use its tail to bash nearby foes, granting it a tail slap attack. This attack is a secondary attack. The tail slap deals 1d6 points of damage (1d8 if Large, 2d6 if Huge). This evolution can be selected more than once, up to the number of tail evolutions the eidolon possesses. _Requirements_: Agathion, daemon, demon, devil, div, elemental, protean, or psychopomp subtype; tail evolution."

[[entry]]
id = "ref/eidolon/elemental"
anchor = "tentacle"
print = "The eidolon possesses a long, sinuous tentacle, granting it a tentacle attack. This attack is a secondary attack. The tentacle attack deals 1d4 points of damage (1d6 if Large, 1d8 if Huge). This evolution can be selected more than once. _Requirements_: Daemon, demon, or protean subtype."

[[entry]]
id = "ref/eidolon/elemental"
anchor = "wing-buffet"
print = "The eidolon learns to use its wings to batter foes, granting it two wing buffet attacks. These attacks are secondary attacks. The wing buffets deal 1d4 points of damage (1d6 if Large, 1d8 if Huge). _Requirements_: Flight (wings) evolution."

[[entry]]
id = "ref/eidolon/elemental"
anchor = "2-point-evolutions"
print = "The following evolutions cost 2 points from the eidolon's evolution pool."

[[entry]]
id = "ref/eidolon/elemental"
anchor = "ability-increase"
print = "The eidolon grows larger muscles, gains faster reflexes, achieves greater intelligence, or acquires another increase to one of its abilities. Increase one of the eidolon's ability scores by 2. This evolution can be selected more than once. It can be applied only once to an individual ability score, plus one additional time for every 6 levels the summoner possesses."

[[entry]]
id = "ref/eidolon/elemental"
anchor = "constrict"
print = "The eidolon gains powerful muscles that allow it to crush those it grapples. Whenever the eidolon successfully grapples a foe using the grab evolution, it deals additional damage equal to the amount of damage dealt by the attack the grab evolution is tied to. _Requirements_: Serpentine base form, grab evolution."

[[entry]]
id = "ref/eidolon/elemental"
anchor = "energy-attacks"
print = "The eidolon's attacks become charged with energy. Select one energy type: acid, cold, electricity, or fire. All of the eidolon's natural attacks deal 1d6 points of energy damage of the chosen type on a successful hit. _Requirements_: Summoner level 5th."

[[entry]]
id = "ref/eidolon/inevitable"
anchor = "opening"
print = '''
At 8th level, demon eidolons lose the +4 bonus on saving throws against poison and gain immunity to poison. They also add 1 point to their evolution pools.

At 12th level, demon eidolons gain DR 5/good. They also gain the ability increase evolution in an ability score of the summoner's choice.

At 16th level, demon eidolons lose the resistance (electricity) evolution, and instead gain the immunity (electricity) evolution. They also gain telepathy (_Bestiary_ 305).

At 20th level, demon eidolons gain _true seeing_ as a constant spell-like ability. Devil Corruptors, tempters, and despoilers, devil eidolons often serve their summoners obediently and efficiently, all in a long-term attempt to damn the summoner's soul to the deepest depths of Hell. While some types of devils have truly unusual forms, devil eidolons have found that the more traditional bipedal form allows them to build up a strong rapport with their summoners—and consequently to corrupt them—more easily than if they possessed a more monstrous appearance.'''

[[entry]]
id = "ref/eidolon/inevitable"
anchor = "alignment"
print = "Lawful evil."

[[entry]]
id = "ref/eidolon/inevitable"
anchor = "base-form"
print = "Biped (claws, [limbs](ref/unchevolution/limbs) \\[arms\\], limbs \\[legs\\])."

[[entry]]
id = "ref/eidolon/inevitable"
anchor = "base-evolutions"
print = '''
Starting at 1st level, devil eidolons gain the resistance (fire) evolution and the skilled (Bluff) evolution. They also gain a +4 bonus on saving throws against poison.

At 4th level, devil eidolons gain acid resistance 10 and cold resistance 10.

At 8th level, devil eidolons gain the skilled (Diplomacy) evolution and gain immunity to poison.

At 12th level, devil eidolons gain DR 5/good. They also gain see in darkness (see the devil subtype on page 311 of the _Bestiary_).

At 16th level, devil eidolons lose the resistance (fire) evolution, and instead gain the immunity (fire) evolution. They also gain telepathy (_Bestiary_ 305).

At 20th level, devil eidolons gain regeneration 5 (good weapons, good spells). They are still banished to Hell as normal for eidolons if they take enough damage.

Div Formed of hatred and spite, div eidolons seek to despoil and ruin all things beautiful and joyous. Div eidolons particularly resent having mortal masters, and seek to doom their summoners to existences full of suffering and loss. Each div eidolon has a unique compulsion it must follow—usually something similar to the doru's obsession with secrets—that leads it to bargain its loyalty for something the summoner provides. The div's summoner uses his eidolon's compulsion to entrap and control the eidolon. Still, div eidolons never fully give in, and continue to plot ways they might corrupt that which their masters hold dearest.'''

[[entry]]
id = "ref/eidolon/inevitable"
anchor = "alignment"
print = "Neutral evil."

[[entry]]
id = "ref/eidolon/inevitable"
anchor = "base-form"
print = "Biped (claws, limbs \\[arms\\], limbs \\[legs\\])."

[[entry]]
id = "ref/eidolon/inevitable"
anchor = "base-evolutions"
print = '''
Starting at 1st level, div eidolons gain the resistance (fire) evolution. They also gain a +4 bonus on saving throws against poison.

At 4th level, div eidolons gain acid resistance 10 and electricity resistance 10.

At 8th level, div eidolons add 1 point to their evolution pools and immunity to poison.

At 12th level, div eidolons gain DR 5/good. They also gain see in darkness (see the div subtype on page 305 of _Pathfinder RPG Bestiary 3_).

At 16th level, div eidolons lose the resistance (fire) evolution, and instead gain the immunity (fire) evolution. They also gain telepathy (_Bestiary_ 305).

At 20th level, div eidolons gain the ability to use _greater teleport_ at will, as per the spell (caster level 14th), except they can teleport only themselves and up to 50 pounds of carried objects. Elemental Pulled in from one of the four elemental planes, these eidolons are linked to one of the four elements: air, earth, fire, or water. Generally, an elemental eidolon appears as a creature made entirely of one element, but there is some variation. Elemental eidolons are decidedly moderate in their views and actions. They tend to avoid the conflicts of others when they can and seek to maintain balance. The only exception is when facing off against emissaries of their opposing elements, which they hate utterly.'''

[[entry]]
id = "ref/eidolon/inevitable"
anchor = "alignment"
print = "Neutral."

[[entry]]
id = "ref/eidolon/inevitable"
anchor = "base-form"
print = "Biped (limbs \\[arms\\], limbs \\[legs\\], slam), quadruped (limbs \\[legs, 2\\], bite), or serpentine (bite, improved natural armor, reach \\[bite\\], tail, tail slap)."

[[entry]]
id = "ref/eidolon/inevitable"
anchor = "base-evolutions"
print = '''
The base evolutions of an elemental eidolon depend entirely on its chosen element. When first summoning an elemental eidolon, the summoner must select air, earth, fire, or water. Once made, this choice cannot be changed. The eidolon gains the following evolutions and abilities, which can vary depending on its element.

At 1st level, all elemental eidolons gain immunity to paralysis and sleep. In addition, air elemental eidolons gain the immunity (electricity) evolution. Earth elemental eidolons gain the immunity (acid) evolution. Fire elemental eidolons gain the immunity (fire) evolution. Water elemental eidolons gain the immunity (cold) evolution.

At 4th level, all elemental eidolons add 1 point to their evolution pools.

At 8th level, air elemental eidolons gain the flight evolution (using magic) with a speed equal to their base speed. Earth elemental eidolons gain the burrow evolution. Fire elemental eidolons increase their base speed by 20 feet. Water elemental eidolons gain the swim evolution twice, gaining a swim speed equal to their base speed + 20 feet. They also gain the gills evolution, which allows them to breathe underwater.

At 12th level, all elemental eidolons gain immunity to bleed, poison, and stun. In addition, they can no longer be flanked.

At 16th level, all elemental eidolons gain immunity to critical hits and do not take additional damage from precision-based attacks, such as sneak attack.

At 20th level, an air elemental eidolon gains the whirlwind ability (_Bestiary_ 306), with a maximum height of 15 feet (30 feet for a Large air elemental) and dealing 1d6 points of damage (1d8 for a Large air elemental). Earth elemental eidolons gain the earth mastery ability (_Bestiary_ 122) and DR 5/—. Fire elemental eidolons gain the energy attacks (fire) evolution and the burn ability (_Bestiary_ 298). Water elemental eidolons gain the drench and vortex abilities (_Bestiary_ 126). The vortex ability works as the air elemental eidolon's whirlwind ability (except as noted in the vortex ability's description). Inevitable Implacable and ceaseless in their fight against chaos and those who break natural laws, inevitables make loyal, if literal-minded, companions for lawful summoners. Summoners of inevitables generally get along well with axiomites, who share their understanding of the process of forging and modifying an inevitable. Inevitable eidolons appear as a mixture between clockwork constructs and idealized humanoid statues.'''

[[entry]]
id = "ref/eidolon/inevitable"
anchor = "alignment"
print = "Lawful neutral."

[[entry]]
id = "ref/eidolon/inevitable"
anchor = "base-form"
print = "Biped (limbs \\[arms\\], limbs \\[legs\\], slam)."

[[entry]]
id = "ref/eidolon/inevitable"
anchor = "base-evolutions"
print = '''
At 1st level, inevitable eidolons count as both constructs and outsiders for the purpose of effects such as the _bane_ weapon special ability and the favored enemy class feature. They gain a +4 bonus on saving throws against death effects, disease, necromancy effects, paralysis, poison, sleep, and stun.

At 4th level, inevitable eidolons gain a +4 bonus on saving throws against mind-affecting effects and immunity to nonlethal damage, fatigue, and exhaustion.

At 8th level, inevitable eidolons gain immunity to death effects, disease, and poison.

At 12th level, inevitable eidolons gain DR 5/chaotic. They also gain immunity to sleep, as well as the true speech ability (see the inevitable subtype on page 307 of _Bestiary 2_).

At 16th level, inevitable eidolons lose the +4 bonus on saving throws against necromancy effects and gain immunity to ability damage, ability drain, energy drain, and necromancy effects.

At 20th level, inevitable eidolons gain immunity to paralysis, sleep, stun, and any effect that requires a Fortitude save (unless the effect also works on objects). Protean Serpentine beings of pure chaos, proteans seek to reshape reality. Protean eidolons appreciate creative summoners who often rebuild their forms and make liberal use of the _transmogrify_ spell. Beyond that, protean eidolons are happy to work with their summoners for any purpose, though they are quick to remind their summoners that while they have a mutually beneficial relationship, they are not servants.'''

[[entry]]
id = "ref/eidolon/inevitable"
anchor = "alignment"
print = "Chaotic neutral."

[[entry]]
id = "ref/eidolon/inevitable"
anchor = "base-form"
print = "Serpentine (bite, grab \\[tail slap\\], tail, tail slap)."

[[entry]]
id = "ref/eidolon/inevitable"
anchor = "base-evolutions"
print = '''
At 1st level, protean eidolons gain the resistance (acid) evolution as well as the grab evolution, tied to an attack type of the summoner's choice. Whenever the summoner changes the protean eidolon's evolutions, he can also change the attack type for grab.

At 4th level, protean eidolons gain electricity resistance 10 and sonic resistance 10.

At 8th level, protean eidolons gain the constrict evolution.

At 12th level, protean eidolons gain DR 5/lawful. They also gain the blindsense evolution and the ability to fly without wings with perfect maneuverability, as the flight evolution with 4 points spent.

At 16th level, protean eidolons lose the resistance (acid) evolution and instead gain the immunity (acid) evolution. They also gain the amorphous anatomy ability (see the protean subtype on page 308 of _Bestiary 2_).

At 20th level, protean eidolons gain constant _freedom of movement_ and the protean version of the change shape (_greater polymorph_) ability (see the protean subtype on page 308 of _Bestiary 2_). Psychopomp Stewards, chroniclers, and guides of all things that die, psychopomps make dispassionate yet loyal eidolons. When they deal with the world of mortals, psychopomp eidolons nearly always wear masks. They do not tolerate summoners who traffic with daemons, undead, and other entities that interfere with the transmigration of souls, but otherwise they are comfortable with most actions on the summoner's part. When the summoner dies, a psychopomp eidolon personally escorts him to the afterlife and serves as an expert witness when it is time for him to be judged.'''

[[entry]]
id = "ref/eidolon/inevitable"
anchor = "alignment"
print = "Neutral."

[[entry]]
id = "ref/eidolon/inevitable"
anchor = "base-form"
print = "Biped (limbs \\[arms\\], limbs \\[legs\\], slam), quadruped (bite, limbs \\[legs, 2\\]), or serpentine (bite, pull \\[bite\\], reach \\[bite\\], tail, tail slap)."

[[entry]]
id = "ref/eidolon/inevitable"
anchor = "base-evolutions"
print = '''
Starting at 1st level, psychopomp eidolons gain immunity to death effects, disease, and poison.

At 4th level, psychopomp eidolons gain cold resistance 10 and electricity resistance 10.

At 8th level, psychopomp eidolons gain the spirit touch ability (see the psychopomp subtype on page 308 of _Pathfinder RPG Bestiary 4_) and add 1 point to their evolution pools.

At 12th level, psychopomp eidolons gain DR 5/adamantine. They also gain the spiritsense ability (see the psychopomp subtype on page 308 of _Bestiary 4_).

At 16th level, psychopomp eidolons gain the ability increase evolution, applied to an ability score of the summoner's choice. They also gain the ability to cast _invisibility_ (self only) as a spell-like ability at will.

At 20th level, psychopomp eidolons increase their damage reduction to 10/adamantine and gain the immunity (cold) and immunity (electricity) evolutions.'''

[[entry]]
id = "ref/eidolon/inevitable"
anchor = "base-forms"
print = '''
Each eidolon has one of three base forms that determines its starting size, speed, AC, attacks, and ability scores. All natural attacks are made using the eidolon's full base attack bonus unless otherwise noted (such as in the case of secondary attacks). An eidolon's attacks add the eidolon's Strength modifier to the damage rolls, unless the eidolon has only one attack, in which case the attack adds 1-1/2 times the eidolon's Strength modifier.

Alternatively, any one of these base forms can be used to make a Small eidolon. If the eidolon is Small, it gains a +2 bonus to Dexterity. It takes a -4 penalty to Strength and a -2 penalty to Constitution. It also has a +1 size bonus to AC and on attack rolls, a -1 penalty on combat maneuver checks and to CMD, a +2 bonus on Fly checks, and a +4 bonus on Stealth checks. Reduce the damage of all of its attacks by one step (for example, 1d6 becomes 1d4, and 1d4 becomes 1d3). If this choice is made, the eidolon can be made Medium whenever the summoner can change the eidolon's evolution pool (which causes it to lose these modifiers for being Small). Likewise, a Medium eidolon can be made Small whenever the summoner can change the eidolon's evolution pool. Biped Starting Statistics: Size Medium; Speed 30 ft.; AC +2 natural armor; Saves Fort (good), Ref (poor), Will (good); Attack 2 claws (1d4); Ability Scores Str 16, Dex 12, Con 13, Int 7, Wis 10, Cha 11. Quadruped Starting Statistics: Size Medium; Speed 40 ft.; AC +2 natural armor; Saves Fort (good), Ref (good), Will (poor); Attack bite (1d6); Ability Scores Str 14, Dex 14, Con 13, Int 7, Wis 10, Cha 11. Serpentine Starting Statistics: Size Medium; Speed 20 ft., climb 20 ft.; AC +2 natural armor; Saves Fort (poor), Ref (good), Will (good); Attack bite (1d6), tail slap (1d6); Ability Scores Str 12, Dex 16, Con 13, Int 7, Wis 10, Cha 11.'''

[[entry]]
id = "ref/eidolon/inevitable"
anchor = "evolutions"
print = '''
Each eidolon gains a number of evolution points that can be spent to give the eidolon new abilities, powers, and other upgrades. These abilities, called evolutions, can be changed whenever the summoner gains a new level, but they are otherwise set. Some evolutions require that the eidolon have a specific base form or the summoner be of a specific level before they can be chosen. A number of evolutions grant the eidolon additional natural attacks. Natural attacks listed as primary are made using the eidolon's full base attack bonus and add the eidolon's Strength modifier on damage rolls. Natural attacks listed as secondary are made using the eidolon's base attack bonus - 5 and add 1/2 the eidolon's Strength modifier on damage rolls (if positive). If the eidolon has only a single natural attack, the attack is made using its full base attack bonus, and it adds 1-1/2 times its Strength modifier on damage rolls made with that attack, regardless of the attack's type.

Evolutions are grouped by their cost in evolution points. Evolution points cannot be saved. All of the points must be spent whenever the summoner gains a level. Unless otherwise noted, each evolution can be selected only once.'''

[[entry]]
id = "ref/eidolon/inevitable"
anchor = "1-point-evolutions"
print = "The following evolutions cost 1 point from the eidolon's evolution pool."

[[entry]]
id = "ref/eidolon/inevitable"
anchor = "bite"
print = "The eidolon's maw is full of razor-sharp teeth, giving it a bite attack. This attack is a primary attack. The bite deals 1d6 points of damage (1d8 if Large, 2d6 if Huge). If the eidolon already has a bite attack, this evolution allows it to deal 1-1/2 times its Strength modifier on damage rolls made with its bite. _Requirements_: Agathion, daemon, demon, devil, div, elemental, protean, or psychopomp subtype."

[[entry]]
id = "ref/eidolon/inevitable"
anchor = "claws"
print = "The eidolon has a pair of vicious claws at the ends of its limbs, giving it two claw attacks. These attacks are primary attacks. The claws deal 1d4 points of damage (1d6 if Large, 1d8 if Huge). The eidolon must have the limbs evolution to take this evolution. This evolution can be selected more than once, up to the number of limbs evolutions the eidolon possesses. This evolution can be applied to any number of limbs (arms) evolutions, but no more than one limbs (legs) evolution. _Requirements_: Agathion, daemon, demon, devil, div, elemental, protean, or psychopomp subtype."

[[entry]]
id = "ref/eidolon/inevitable"
anchor = "climb"
print = "The eidolon becomes a skilled climber, gaining a climb speed equal to its base speed. This evolution can be selected more than once. Each additional time it is selected, increase the eidolon's climb speed by 20 feet."

[[entry]]
id = "ref/eidolon/inevitable"
anchor = "gills"
print = "The eidolon has gills and can breathe underwater indefinitely."

[[entry]]
id = "ref/eidolon/inevitable"
anchor = "improved-damage"
print = "One of the eidolon's natural attacks is particularly deadly. Select one natural attack form and increase the damage die by one step. This evolution can be selected more than once. Its effects do not stack. Each time the eidolon selects this evolution, it applies to a different natural attack."

[[entry]]
id = "ref/eidolon/inevitable"
anchor = "improved-natural-armor"
print = "The eidolon's hide grows thick fur, rigid scales, or bony plates, giving it a +2 bonus to its natural armor. This evolution can be taken once, plus one additional time for every 5 levels the summoner possesses. Each additional time it's taken, the bonus increases by 2."

[[entry]]
id = "ref/eidolon/inevitable"
anchor = "magic-attacks"
print = "The eidolon is infused with magic, allowing it to treat all of its natural attacks as if they were magic for the purpose of overcoming damage reduction."

[[entry]]
id = "ref/eidolon/inevitable"
anchor = "eidolons-and-alignment"
print = "Generally, the summoner controls the actions of his eidolon, even during combat, either through verbal commands or through the link ability, but this does not mean that the eidolon is a puppet that follows every command without question. Eidolons have been known to refuse actions that are against their ethoses or alignments (subject to the GM's discretion) and are quick to chide the summoner about such requests. In addition, should the action of the summoner cause a shift in alignment such that the summoner's alignment is more than one step away from the eidolon's, the eidolon refuses the call of the summoner (although the summoner can still use his summon monster class feature). If the summoner manages to restore his alignment, the eidolon returns to his service. If the summoner is 10th level or higher, all of the eidolon's natural attacks are treated as the alignment of the eidolon for the purpose of overcoming damage reduction."

[[entry]]
id = "ref/eidolon/inevitable"
anchor = "mount"
print = "The eidolon is properly skilled and formed to serve as a combat-trained mount. The eidolon must be at least one size category larger than its rider. _Requirements_: Daemon, demon, devil, elemental, or protean subtype; quadruped or serpentine base form."

[[entry]]
id = "ref/eidolon/inevitable"
anchor = "pincers"
print = "An eidolon grows large pincers at the ends of one pair of its limbs, giving it two pincer attacks. These attacks are secondary attacks. The pincers deal 1d6 points of damage (1d8 if Large, 2d6 if Huge). Eidolons with the grab evolution linked to their pincers gain a +2 bonus on combat maneuver checks to grapple. The eidolon must have the limbs (arms) evolution to take this evolution. Alternatively, the eidolon can replace the claws from its base form with pincers (this still costs 1 evolution point). This evolution can be selected more than once, up to the number of limbs (arms) evolutions the eidolon possesses. _Requirements_: Agathion, daemon, demon, devil, div, elemental, protean, or psychopomp subtype."

[[entry]]
id = "ref/eidolon/inevitable"
anchor = "pull"
print = "The eidolon gains the ability to pull creatures closer with a successful attack. Select one type of natural attack. Whenever the eidolon makes a successful attack of the selected type, it can attempt a free combat maneuver check. If the eidolon succeeds at this check, it pulls the target of the attack 5 feet closer to it. This ability works only on creatures of a size category equal to or smaller than the eidolon. Creatures pulled in this way do not provoke attacks of opportunity. This evolution can be selected more than once. Its effects do not stack. Each time an eidolon selects this evolution, it applies to a different natural attack. _Requirements_: Reach of 10 feet or more."

[[entry]]
id = "ref/eidolon/inevitable"
anchor = "push"
print = "The eidolon gains the ability to push creatures away with a successful attack. Select one type of natural attack. Whenever the eidolon makes a successful attack of the selected type, it can attempt a free combat maneuver check. If the eidolon succeeds at this check, it pushes the target of the attack 5 feet directly away from it. This ability works only on creatures of a size category equal to or smaller than the eidolon. Creatures pushed in this way do not provoke attacks of opportunity. This evolution can be selected more than once. Its effects do not stack. Each time an eidolon selects this evolution, it applies to a different natural attack."

[[entry]]
id = "ref/eidolon/inevitable"
anchor = "reach"
print = "One of the eidolon's attacks is capable of striking foes at a distance. Select one attack. The eidolon's reach with that attack increases by 5 feet."

[[entry]]
id = "ref/eidolon/inevitable"
anchor = "resistance"
print = "The eidolon's form takes on a resiliency to one particular energy type, which is usually ref lected in its physical body (ashen hide for fire, icy breath for cold, and so on). Select one energy type (acid, cold, electricity, fire, or sonic). The eidolon gains resistance 5 against that energy type. This resistance increases by 5 for every 5 levels the summoner possesses, to a maximum of 15 at 10th level. This evolution can be selected more than once. Its effects do not stack. Each time the eidolon selects this evolution, it applies to a different energy type."

[[entry]]
id = "ref/eidolon/inevitable"
anchor = "scent"
print = "The eidolon's sense of smell becomes quite acute. The eidolon gains the scent special quality, allowing it to detect opponents within 30 feet by sense of smell. If the opponent is upwind, the range increases to 60 feet; if the opponent is downwind, the range drops to 15 feet. Strong scents can be detected at twice the normal range. Scent does not allow the eidolon to precisely locate the creature, only to detect its presence. It can detect the direction as a move action. The eidolon can pinpoint the creature's location if it is within 5 feet. The eidolon can use scent to track creatures."

[[entry]]
id = "ref/eidolon/inevitable"
anchor = "skilled"
print = "The eidolon becomes especially adept at a specific skill, gaining a +8 racial bonus on that skill. This evolution can be selected more than once. Its effects do not stack. Each time the eidolon selects this evolution, it applies to a different skill."

[[entry]]
id = "ref/eidolon/inevitable"
anchor = "slam"
print = "The eidolon can deliver a devastating slam attack. This attack is a primary attack. The slam deals 1d8 points of damage (2d6 if Large, 2d8 if Huge). The eidolon must have the limbs (arms) evolution to take this evolution. Alternatively, the eidolon can replace the claws from its base form with this slam attack (this still costs 1 evolution point). This evolution can be selected more than once, up to the number of the eidolon's limbs (arms) evolutions."

[[entry]]
id = "ref/eidolon/inevitable"
anchor = "sting"
print = "The eidolon possesses a long, barbed stinger at the end of its tail, granting it a sting attack. This attack is a primary attack. The sting deals 1d4 points of damage (1d6 if Large, 1d8 if Huge). This evolution can be selected more than once, up to the number of tail evolutions the eidolon possesses. _Requirements_: Agathion, daemon, demon, devil, div, elemental, protean, or psychopomp subtype; tail evolution."

[[entry]]
id = "ref/eidolon/inevitable"
anchor = "swim"
print = "The eidolon gains webbed hands, webbed feet, or powerful flippers, giving it a swim speed equal to its base speed. This evolution does not give the eidolon the ability to breathe underwater. This evolution can be selected more than once. Each additional time it is selected, increase the eidolon's swim speed by 20 feet."

[[entry]]
id = "ref/eidolon/inevitable"
anchor = "tail"
print = "The eidolon grows a long, powerful tail. This grants it a +2 racial bonus on Acrobatics checks to balance on a surface. This evolution can be selected more than once. _Requirements_: Agathion, daemon, demon, devil, div, elemental, protean, or psychopomp subtype."

[[entry]]
id = "ref/eidolon/inevitable"
anchor = "tail-slap"
print = "The eidolon can use its tail to bash nearby foes, granting it a tail slap attack. This attack is a secondary attack. The tail slap deals 1d6 points of damage (1d8 if Large, 2d6 if Huge). This evolution can be selected more than once, up to the number of tail evolutions the eidolon possesses. _Requirements_: Agathion, daemon, demon, devil, div, elemental, protean, or psychopomp subtype; tail evolution."

[[entry]]
id = "ref/eidolon/inevitable"
anchor = "tentacle"
print = "The eidolon possesses a long, sinuous tentacle, granting it a tentacle attack. This attack is a secondary attack. The tentacle attack deals 1d4 points of damage (1d6 if Large, 1d8 if Huge). This evolution can be selected more than once. _Requirements_: Daemon, demon, or protean subtype."

[[entry]]
id = "ref/eidolon/inevitable"
anchor = "wing-buffet"
print = "The eidolon learns to use its wings to batter foes, granting it two wing buffet attacks. These attacks are secondary attacks. The wing buffets deal 1d4 points of damage (1d6 if Large, 1d8 if Huge). _Requirements_: Flight (wings) evolution."

[[entry]]
id = "ref/eidolon/inevitable"
anchor = "2-point-evolutions"
print = "The following evolutions cost 2 points from the eidolon's evolution pool."

[[entry]]
id = "ref/eidolon/inevitable"
anchor = "ability-increase"
print = "The eidolon grows larger muscles, gains faster reflexes, achieves greater intelligence, or acquires another increase to one of its abilities. Increase one of the eidolon's ability scores by 2. This evolution can be selected more than once. It can be applied only once to an individual ability score, plus one additional time for every 6 levels the summoner possesses."

[[entry]]
id = "ref/eidolon/inevitable"
anchor = "constrict"
print = "The eidolon gains powerful muscles that allow it to crush those it grapples. Whenever the eidolon successfully grapples a foe using the grab evolution, it deals additional damage equal to the amount of damage dealt by the attack the grab evolution is tied to. _Requirements_: Serpentine base form, grab evolution."

[[entry]]
id = "ref/eidolon/inevitable"
anchor = "energy-attacks"
print = "The eidolon's attacks become charged with energy. Select one energy type: acid, cold, electricity, or fire. All of the eidolon's natural attacks deal 1d6 points of energy damage of the chosen type on a successful hit. _Requirements_: Summoner level 5th."

[[entry]]
id = "ref/eidolon/protean"
anchor = "opening"
print = '''
At 8th level, demon eidolons lose the +4 bonus on saving throws against poison and gain immunity to poison. They also add 1 point to their evolution pools.

At 12th level, demon eidolons gain DR 5/good. They also gain the ability increase evolution in an ability score of the summoner's choice.

At 16th level, demon eidolons lose the resistance (electricity) evolution, and instead gain the immunity (electricity) evolution. They also gain telepathy (_Bestiary_ 305).

At 20th level, demon eidolons gain _true seeing_ as a constant spell-like ability. Devil Corruptors, tempters, and despoilers, devil eidolons often serve their summoners obediently and efficiently, all in a long-term attempt to damn the summoner's soul to the deepest depths of Hell. While some types of devils have truly unusual forms, devil eidolons have found that the more traditional bipedal form allows them to build up a strong rapport with their summoners—and consequently to corrupt them—more easily than if they possessed a more monstrous appearance.'''

[[entry]]
id = "ref/eidolon/protean"
anchor = "alignment"
print = "Lawful evil."

[[entry]]
id = "ref/eidolon/protean"
anchor = "base-form"
print = "Biped (claws, limbs \\[arms\\], limbs \\[legs\\])."

[[entry]]
id = "ref/eidolon/protean"
anchor = "base-evolutions"
print = '''
Starting at 1st level, devil eidolons gain the [resistance](ref/unchevolution/resistance) (fire) evolution and the skilled (Bluff) evolution. They also gain a +4 bonus on saving throws against poison.

At 4th level, devil eidolons gain acid resistance 10 and cold resistance 10.

At 8th level, devil eidolons gain the skilled (Diplomacy) evolution and gain [immunity](ref/unchevolution/immunity) to poison.

At 12th level, devil eidolons gain DR 5/good. They also gain see in darkness (see the devil subtype on page 311 of the _Bestiary_).

At 16th level, devil eidolons lose the resistance (fire) evolution, and instead gain the immunity (fire) evolution. They also gain telepathy (_Bestiary_ 305).

At 20th level, devil eidolons gain regeneration 5 (good weapons, good spells). They are still banished to Hell as normal for eidolons if they take enough damage.

Div Formed of hatred and spite, div eidolons seek to despoil and ruin all things beautiful and joyous. Div eidolons particularly resent having mortal masters, and seek to doom their summoners to existences full of suffering and loss. Each div eidolon has a unique compulsion it must follow—usually something similar to the doru's obsession with secrets—that leads it to bargain its loyalty for something the summoner provides. The div's summoner uses his eidolon's compulsion to entrap and control the eidolon. Still, div eidolons never fully give in, and continue to plot ways they might corrupt that which their masters hold dearest.'''

[[entry]]
id = "ref/eidolon/protean"
anchor = "alignment"
print = "Neutral evil."

[[entry]]
id = "ref/eidolon/protean"
anchor = "base-form"
print = "Biped (claws, limbs \\[arms\\], limbs \\[legs\\])."

[[entry]]
id = "ref/eidolon/protean"
anchor = "base-evolutions"
print = '''
Starting at 1st level, div eidolons gain the resistance (fire) evolution. They also gain a +4 bonus on saving throws against poison.

At 4th level, div eidolons gain acid resistance 10 and electricity resistance 10.

At 8th level, div eidolons add 1 point to their evolution pools and immunity to poison.

At 12th level, div eidolons gain DR 5/good. They also gain see in darkness (see the div subtype on page 305 of _Pathfinder RPG Bestiary 3_).

At 16th level, div eidolons lose the resistance (fire) evolution, and instead gain the immunity (fire) evolution. They also gain telepathy (_Bestiary_ 305).

At 20th level, div eidolons gain the ability to use _greater teleport_ at will, as per the spell (caster level 14th), except they can teleport only themselves and up to 50 pounds of carried objects. Elemental Pulled in from one of the four elemental planes, these eidolons are linked to one of the four elements: air, earth, fire, or water. Generally, an elemental eidolon appears as a creature made entirely of one element, but there is some variation. Elemental eidolons are decidedly moderate in their views and actions. They tend to avoid the conflicts of others when they can and seek to maintain balance. The only exception is when facing off against emissaries of their opposing elements, which they hate utterly.'''

[[entry]]
id = "ref/eidolon/protean"
anchor = "alignment"
print = "Neutral."

[[entry]]
id = "ref/eidolon/protean"
anchor = "base-form"
print = "Biped (limbs \\[arms\\], limbs \\[legs\\], slam), quadruped (limbs \\[legs, 2\\], bite), or serpentine (bite, improved natural armor, reach \\[bite\\], tail, tail slap)."

[[entry]]
id = "ref/eidolon/protean"
anchor = "base-evolutions"
print = '''
The base evolutions of an elemental eidolon depend entirely on its chosen element. When first summoning an elemental eidolon, the summoner must select air, earth, fire, or water. Once made, this choice cannot be changed. The eidolon gains the following evolutions and abilities, which can vary depending on its element.

At 1st level, all elemental eidolons gain immunity to paralysis and sleep. In addition, air elemental eidolons gain the immunity (electricity) evolution. Earth elemental eidolons gain the immunity (acid) evolution. Fire elemental eidolons gain the immunity (fire) evolution. Water elemental eidolons gain the immunity (cold) evolution.

At 4th level, all elemental eidolons add 1 point to their evolution pools.

At 8th level, air elemental eidolons gain the flight evolution (using magic) with a speed equal to their base speed. Earth elemental eidolons gain the burrow evolution. Fire elemental eidolons increase their base speed by 20 feet. Water elemental eidolons gain the swim evolution twice, gaining a swim speed equal to their base speed + 20 feet. They also gain the gills evolution, which allows them to breathe underwater.

At 12th level, all elemental eidolons gain immunity to bleed, poison, and stun. In addition, they can no longer be flanked.

At 16th level, all elemental eidolons gain immunity to critical hits and do not take additional damage from precision-based attacks, such as sneak attack.

At 20th level, an air elemental eidolon gains the whirlwind ability (_Bestiary_ 306), with a maximum height of 15 feet (30 feet for a Large air elemental) and dealing 1d6 points of damage (1d8 for a Large air elemental). Earth elemental eidolons gain the earth mastery ability (_Bestiary_ 122) and DR 5/—. Fire elemental eidolons gain the energy attacks (fire) evolution and the burn ability (_Bestiary_ 298). Water elemental eidolons gain the drench and vortex abilities (_Bestiary_ 126). The vortex ability works as the air elemental eidolon's whirlwind ability (except as noted in the vortex ability's description). Inevitable Implacable and ceaseless in their fight against chaos and those who break natural laws, inevitables make loyal, if literal-minded, companions for lawful summoners. Summoners of inevitables generally get along well with axiomites, who share their understanding of the process of forging and modifying an inevitable. Inevitable eidolons appear as a mixture between clockwork constructs and idealized humanoid statues.'''

[[entry]]
id = "ref/eidolon/protean"
anchor = "alignment"
print = "Lawful neutral."

[[entry]]
id = "ref/eidolon/protean"
anchor = "base-form"
print = "Biped (limbs \\[arms\\], limbs \\[legs\\], slam)."

[[entry]]
id = "ref/eidolon/protean"
anchor = "base-evolutions"
print = '''
At 1st level, inevitable eidolons count as both constructs and outsiders for the purpose of effects such as the _bane_ weapon special ability and the favored enemy class feature. They gain a +4 bonus on saving throws against death effects, disease, necromancy effects, paralysis, poison, sleep, and stun.

At 4th level, inevitable eidolons gain a +4 bonus on saving throws against mind-affecting effects and immunity to nonlethal damage, fatigue, and exhaustion.

At 8th level, inevitable eidolons gain immunity to death effects, disease, and poison.

At 12th level, inevitable eidolons gain DR 5/chaotic. They also gain immunity to sleep, as well as the true speech ability (see the inevitable subtype on page 307 of _Bestiary 2_).

At 16th level, inevitable eidolons lose the +4 bonus on saving throws against necromancy effects and gain immunity to ability damage, ability drain, energy drain, and necromancy effects.

At 20th level, inevitable eidolons gain immunity to paralysis, sleep, stun, and any effect that requires a Fortitude save (unless the effect also works on objects). Protean Serpentine beings of pure chaos, proteans seek to reshape reality. Protean eidolons appreciate creative summoners who often rebuild their forms and make liberal use of the _transmogrify_ spell. Beyond that, protean eidolons are happy to work with their summoners for any purpose, though they are quick to remind their summoners that while they have a mutually beneficial relationship, they are not servants.'''

[[entry]]
id = "ref/eidolon/protean"
anchor = "alignment"
print = "Chaotic neutral."

[[entry]]
id = "ref/eidolon/protean"
anchor = "base-form"
print = "Serpentine (bite, grab \\[tail slap\\], tail, tail slap)."

[[entry]]
id = "ref/eidolon/protean"
anchor = "base-evolutions"
print = '''
At 1st level, protean eidolons gain the resistance (acid) evolution as well as the grab evolution, tied to an attack type of the summoner's choice. Whenever the summoner changes the protean eidolon's evolutions, he can also change the attack type for grab.

At 4th level, protean eidolons gain electricity resistance 10 and sonic resistance 10.

At 8th level, protean eidolons gain the constrict evolution.

At 12th level, protean eidolons gain DR 5/lawful. They also gain the blindsense evolution and the ability to fly without wings with perfect maneuverability, as the flight evolution with 4 points spent.

At 16th level, protean eidolons lose the resistance (acid) evolution and instead gain the immunity (acid) evolution. They also gain the amorphous anatomy ability (see the protean subtype on page 308 of _Bestiary 2_).

At 20th level, protean eidolons gain constant _freedom of movement_ and the protean version of the change shape (_greater polymorph_) ability (see the protean subtype on page 308 of _Bestiary 2_). Psychopomp Stewards, chroniclers, and guides of all things that die, psychopomps make dispassionate yet loyal eidolons. When they deal with the world of mortals, psychopomp eidolons nearly always wear masks. They do not tolerate summoners who traffic with daemons, undead, and other entities that interfere with the transmigration of souls, but otherwise they are comfortable with most actions on the summoner's part. When the summoner dies, a psychopomp eidolon personally escorts him to the afterlife and serves as an expert witness when it is time for him to be judged.'''

[[entry]]
id = "ref/eidolon/protean"
anchor = "alignment"
print = "Neutral."

[[entry]]
id = "ref/eidolon/protean"
anchor = "base-form"
print = "Biped (limbs \\[arms\\], limbs \\[legs\\], slam), quadruped (bite, limbs \\[legs, 2\\]), or serpentine (bite, pull \\[bite\\], reach \\[bite\\], tail, tail slap)."

[[entry]]
id = "ref/eidolon/protean"
anchor = "base-evolutions"
print = '''
Starting at 1st level, psychopomp eidolons gain immunity to death effects, disease, and poison.

At 4th level, psychopomp eidolons gain cold resistance 10 and electricity resistance 10.

At 8th level, psychopomp eidolons gain the spirit touch ability (see the psychopomp subtype on page 308 of _Pathfinder RPG Bestiary 4_) and add 1 point to their evolution pools.

At 12th level, psychopomp eidolons gain DR 5/adamantine. They also gain the spiritsense ability (see the psychopomp subtype on page 308 of _Bestiary 4_).

At 16th level, psychopomp eidolons gain the ability increase evolution, applied to an ability score of the summoner's choice. They also gain the ability to cast _invisibility_ (self only) as a spell-like ability at will.

At 20th level, psychopomp eidolons increase their damage reduction to 10/adamantine and gain the immunity (cold) and immunity (electricity) evolutions.'''

[[entry]]
id = "ref/eidolon/protean"
anchor = "base-forms"
print = '''
Each eidolon has one of three base forms that determines its starting size, speed, AC, attacks, and ability scores. All natural attacks are made using the eidolon's full base attack bonus unless otherwise noted (such as in the case of secondary attacks). An eidolon's attacks add the eidolon's Strength modifier to the damage rolls, unless the eidolon has only one attack, in which case the attack adds 1-1/2 times the eidolon's Strength modifier.

Alternatively, any one of these base forms can be used to make a Small eidolon. If the eidolon is Small, it gains a +2 bonus to Dexterity. It takes a -4 penalty to Strength and a -2 penalty to Constitution. It also has a +1 size bonus to AC and on attack rolls, a -1 penalty on combat maneuver checks and to CMD, a +2 bonus on Fly checks, and a +4 bonus on Stealth checks. Reduce the damage of all of its attacks by one step (for example, 1d6 becomes 1d4, and 1d4 becomes 1d3). If this choice is made, the eidolon can be made Medium whenever the summoner can change the eidolon's evolution pool (which causes it to lose these modifiers for being Small). Likewise, a Medium eidolon can be made Small whenever the summoner can change the eidolon's evolution pool. Biped Starting Statistics: Size Medium; Speed 30 ft.; AC +2 natural armor; Saves Fort (good), Ref (poor), Will (good); Attack 2 claws (1d4); Ability Scores Str 16, Dex 12, Con 13, Int 7, Wis 10, Cha 11. Quadruped Starting Statistics: Size Medium; Speed 40 ft.; AC +2 natural armor; Saves Fort (good), Ref (good), Will (poor); Attack bite (1d6); Ability Scores Str 14, Dex 14, Con 13, Int 7, Wis 10, Cha 11. Serpentine Starting Statistics: Size Medium; Speed 20 ft., climb 20 ft.; AC +2 natural armor; Saves Fort (poor), Ref (good), Will (good); Attack bite (1d6), tail slap (1d6); Ability Scores Str 12, Dex 16, Con 13, Int 7, Wis 10, Cha 11.'''

[[entry]]
id = "ref/eidolon/protean"
anchor = "evolutions"
print = '''
Each eidolon gains a number of evolution points that can be spent to give the eidolon new abilities, powers, and other upgrades. These abilities, called evolutions, can be changed whenever the summoner gains a new level, but they are otherwise set. Some evolutions require that the eidolon have a specific base form or the summoner be of a specific level before they can be chosen. A number of evolutions grant the eidolon additional natural attacks. Natural attacks listed as primary are made using the eidolon's full base attack bonus and add the eidolon's Strength modifier on damage rolls. Natural attacks listed as secondary are made using the eidolon's base attack bonus - 5 and add 1/2 the eidolon's Strength modifier on damage rolls (if positive). If the eidolon has only a single natural attack, the attack is made using its full base attack bonus, and it adds 1-1/2 times its Strength modifier on damage rolls made with that attack, regardless of the attack's type.

Evolutions are grouped by their cost in evolution points. Evolution points cannot be saved. All of the points must be spent whenever the summoner gains a level. Unless otherwise noted, each evolution can be selected only once.'''

[[entry]]
id = "ref/eidolon/protean"
anchor = "1-point-evolutions"
print = "The following evolutions cost 1 point from the eidolon's evolution pool."

[[entry]]
id = "ref/eidolon/protean"
anchor = "bite"
print = "The eidolon's maw is full of razor-sharp teeth, giving it a bite attack. This attack is a primary attack. The bite deals 1d6 points of damage (1d8 if Large, 2d6 if Huge). If the eidolon already has a bite attack, this evolution allows it to deal 1-1/2 times its Strength modifier on damage rolls made with its bite. _Requirements_: Agathion, daemon, demon, devil, div, elemental, protean, or psychopomp subtype."

[[entry]]
id = "ref/eidolon/protean"
anchor = "claws"
print = "The eidolon has a pair of vicious claws at the ends of its limbs, giving it two claw attacks. These attacks are primary attacks. The claws deal 1d4 points of damage (1d6 if Large, 1d8 if Huge). The eidolon must have the limbs evolution to take this evolution. This evolution can be selected more than once, up to the number of limbs evolutions the eidolon possesses. This evolution can be applied to any number of limbs (arms) evolutions, but no more than one limbs (legs) evolution. _Requirements_: Agathion, daemon, demon, devil, div, elemental, protean, or psychopomp subtype."

[[entry]]
id = "ref/eidolon/protean"
anchor = "climb"
print = "The eidolon becomes a skilled climber, gaining a climb speed equal to its base speed. This evolution can be selected more than once. Each additional time it is selected, increase the eidolon's climb speed by 20 feet."

[[entry]]
id = "ref/eidolon/protean"
anchor = "gills"
print = "The eidolon has gills and can breathe underwater indefinitely."

[[entry]]
id = "ref/eidolon/protean"
anchor = "improved-damage"
print = "One of the eidolon's natural attacks is particularly deadly. Select one natural attack form and increase the damage die by one step. This evolution can be selected more than once. Its effects do not stack. Each time the eidolon selects this evolution, it applies to a different natural attack."

[[entry]]
id = "ref/eidolon/protean"
anchor = "improved-natural-armor"
print = "The eidolon's hide grows thick fur, rigid scales, or bony plates, giving it a +2 bonus to its natural armor. This evolution can be taken once, plus one additional time for every 5 levels the summoner possesses. Each additional time it's taken, the bonus increases by 2."

[[entry]]
id = "ref/eidolon/protean"
anchor = "magic-attacks"
print = "The eidolon is infused with magic, allowing it to treat all of its natural attacks as if they were magic for the purpose of overcoming damage reduction."

[[entry]]
id = "ref/eidolon/protean"
anchor = "eidolons-and-alignment"
print = "Generally, the summoner controls the actions of his eidolon, even during combat, either through verbal commands or through the link ability, but this does not mean that the eidolon is a puppet that follows every command without question. Eidolons have been known to refuse actions that are against their ethoses or alignments (subject to the GM's discretion) and are quick to chide the summoner about such requests. In addition, should the action of the summoner cause a shift in alignment such that the summoner's alignment is more than one step away from the eidolon's, the eidolon refuses the call of the summoner (although the summoner can still use his summon monster class feature). If the summoner manages to restore his alignment, the eidolon returns to his service. If the summoner is 10th level or higher, all of the eidolon's natural attacks are treated as the alignment of the eidolon for the purpose of overcoming damage reduction."

[[entry]]
id = "ref/eidolon/protean"
anchor = "mount"
print = "The eidolon is properly skilled and formed to serve as a combat-trained mount. The eidolon must be at least one size category larger than its rider. _Requirements_: Daemon, demon, devil, elemental, or protean subtype; quadruped or serpentine base form."

[[entry]]
id = "ref/eidolon/protean"
anchor = "pincers"
print = "An eidolon grows large pincers at the ends of one pair of its limbs, giving it two pincer attacks. These attacks are secondary attacks. The pincers deal 1d6 points of damage (1d8 if Large, 2d6 if Huge). Eidolons with the grab evolution linked to their pincers gain a +2 bonus on combat maneuver checks to grapple. The eidolon must have the limbs (arms) evolution to take this evolution. Alternatively, the eidolon can replace the claws from its base form with pincers (this still costs 1 evolution point). This evolution can be selected more than once, up to the number of limbs (arms) evolutions the eidolon possesses. _Requirements_: Agathion, daemon, demon, devil, div, elemental, protean, or psychopomp subtype."

[[entry]]
id = "ref/eidolon/protean"
anchor = "pull"
print = "The eidolon gains the ability to pull creatures closer with a successful attack. Select one type of natural attack. Whenever the eidolon makes a successful attack of the selected type, it can attempt a free combat maneuver check. If the eidolon succeeds at this check, it pulls the target of the attack 5 feet closer to it. This ability works only on creatures of a size category equal to or smaller than the eidolon. Creatures pulled in this way do not provoke attacks of opportunity. This evolution can be selected more than once. Its effects do not stack. Each time an eidolon selects this evolution, it applies to a different natural attack. _Requirements_: Reach of 10 feet or more."

[[entry]]
id = "ref/eidolon/protean"
anchor = "push"
print = "The eidolon gains the ability to push creatures away with a successful attack. Select one type of natural attack. Whenever the eidolon makes a successful attack of the selected type, it can attempt a free combat maneuver check. If the eidolon succeeds at this check, it pushes the target of the attack 5 feet directly away from it. This ability works only on creatures of a size category equal to or smaller than the eidolon. Creatures pushed in this way do not provoke attacks of opportunity. This evolution can be selected more than once. Its effects do not stack. Each time an eidolon selects this evolution, it applies to a different natural attack."

[[entry]]
id = "ref/eidolon/protean"
anchor = "reach"
print = "One of the eidolon's attacks is capable of striking foes at a distance. Select one attack. The eidolon's reach with that attack increases by 5 feet."

[[entry]]
id = "ref/eidolon/protean"
anchor = "resistance"
print = "The eidolon's form takes on a resiliency to one particular energy type, which is usually ref lected in its physical body (ashen hide for fire, icy breath for cold, and so on). Select one energy type (acid, cold, electricity, fire, or sonic). The eidolon gains resistance 5 against that energy type. This resistance increases by 5 for every 5 levels the summoner possesses, to a maximum of 15 at 10th level. This evolution can be selected more than once. Its effects do not stack. Each time the eidolon selects this evolution, it applies to a different energy type."

[[entry]]
id = "ref/eidolon/protean"
anchor = "scent"
print = "The eidolon's sense of smell becomes quite acute. The eidolon gains the scent special quality, allowing it to detect opponents within 30 feet by sense of smell. If the opponent is upwind, the range increases to 60 feet; if the opponent is downwind, the range drops to 15 feet. Strong scents can be detected at twice the normal range. Scent does not allow the eidolon to precisely locate the creature, only to detect its presence. It can detect the direction as a move action. The eidolon can pinpoint the creature's location if it is within 5 feet. The eidolon can use scent to track creatures."

[[entry]]
id = "ref/eidolon/protean"
anchor = "skilled"
print = "The eidolon becomes especially adept at a specific skill, gaining a +8 racial bonus on that skill. This evolution can be selected more than once. Its effects do not stack. Each time the eidolon selects this evolution, it applies to a different skill."

[[entry]]
id = "ref/eidolon/protean"
anchor = "slam"
print = "The eidolon can deliver a devastating slam attack. This attack is a primary attack. The slam deals 1d8 points of damage (2d6 if Large, 2d8 if Huge). The eidolon must have the limbs (arms) evolution to take this evolution. Alternatively, the eidolon can replace the claws from its base form with this slam attack (this still costs 1 evolution point). This evolution can be selected more than once, up to the number of the eidolon's limbs (arms) evolutions."

[[entry]]
id = "ref/eidolon/protean"
anchor = "sting"
print = "The eidolon possesses a long, barbed stinger at the end of its tail, granting it a sting attack. This attack is a primary attack. The sting deals 1d4 points of damage (1d6 if Large, 1d8 if Huge). This evolution can be selected more than once, up to the number of tail evolutions the eidolon possesses. _Requirements_: Agathion, daemon, demon, devil, div, elemental, protean, or psychopomp subtype; tail evolution."

[[entry]]
id = "ref/eidolon/protean"
anchor = "swim"
print = "The eidolon gains webbed hands, webbed feet, or powerful flippers, giving it a swim speed equal to its base speed. This evolution does not give the eidolon the ability to breathe underwater. This evolution can be selected more than once. Each additional time it is selected, increase the eidolon's swim speed by 20 feet."

[[entry]]
id = "ref/eidolon/protean"
anchor = "tail"
print = "The eidolon grows a long, powerful tail. This grants it a +2 racial bonus on Acrobatics checks to balance on a surface. This evolution can be selected more than once. _Requirements_: Agathion, daemon, demon, devil, div, elemental, protean, or psychopomp subtype."

[[entry]]
id = "ref/eidolon/protean"
anchor = "tail-slap"
print = "The eidolon can use its tail to bash nearby foes, granting it a tail slap attack. This attack is a secondary attack. The tail slap deals 1d6 points of damage (1d8 if Large, 2d6 if Huge). This evolution can be selected more than once, up to the number of tail evolutions the eidolon possesses. _Requirements_: Agathion, daemon, demon, devil, div, elemental, protean, or psychopomp subtype; tail evolution."

[[entry]]
id = "ref/eidolon/protean"
anchor = "tentacle"
print = "The eidolon possesses a long, sinuous tentacle, granting it a tentacle attack. This attack is a secondary attack. The tentacle attack deals 1d4 points of damage (1d6 if Large, 1d8 if Huge). This evolution can be selected more than once. _Requirements_: Daemon, demon, or protean subtype."

[[entry]]
id = "ref/eidolon/protean"
anchor = "wing-buffet"
print = "The eidolon learns to use its wings to batter foes, granting it two wing buffet attacks. These attacks are secondary attacks. The wing buffets deal 1d4 points of damage (1d6 if Large, 1d8 if Huge). _Requirements_: Flight (wings) evolution."

[[entry]]
id = "ref/eidolon/protean"
anchor = "2-point-evolutions"
print = "The following evolutions cost 2 points from the eidolon's evolution pool."

[[entry]]
id = "ref/eidolon/protean"
anchor = "ability-increase"
print = "The eidolon grows larger muscles, gains faster reflexes, achieves greater intelligence, or acquires another increase to one of its abilities. Increase one of the eidolon's ability scores by 2. This evolution can be selected more than once. It can be applied only once to an individual ability score, plus one additional time for every 6 levels the summoner possesses."

[[entry]]
id = "ref/eidolon/protean"
anchor = "constrict"
print = "The eidolon gains powerful muscles that allow it to crush those it grapples. Whenever the eidolon successfully grapples a foe using the grab evolution, it deals additional damage equal to the amount of damage dealt by the attack the grab evolution is tied to. _Requirements_: Serpentine base form, grab evolution."

[[entry]]
id = "ref/eidolon/protean"
anchor = "energy-attacks"
print = "The eidolon's attacks become charged with energy. Select one energy type: acid, cold, electricity, or fire. All of the eidolon's natural attacks deal 1d6 points of energy damage of the chosen type on a successful hit. _Requirements_: Summoner level 5th."

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "opening"
print = "At 20th level, div eidolons gain the ability to use _greater teleport_ at will, as per the spell (caster level 14th), except they can teleport only themselves and up to 50 pounds of carried objects. Elemental Pulled in from one of the four elemental planes, these eidolons are linked to one of the four elements: air, earth, fire, or water. Generally, an elemental eidolon appears as a creature made entirely of one element, but there is some variation. Elemental eidolons are decidedly moderate in their views and actions. They tend to avoid the conflicts of others when they can and seek to maintain balance. The only exception is when facing off against emissaries of their opposing elements, which they hate utterly."

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "alignment"
print = "Neutral."

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "base-form"
print = "Biped ([limbs](ref/unchevolution/limbs) \\[arms\\], limbs \\[legs\\], [slam](ref/unchevolution/slam)), quadruped (limbs \\[legs, 2\\], [bite](ref/unchevolution/bite)), or serpentine (bite, improved natural armor, [reach](ref/unchevolution/reach) \\[bite\\], [tail](ref/unchevolution/tail), [tail slap](ref/unchevolution/tail-slap))."

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "base-evolutions"
print = '''
The base evolutions of an elemental eidolon depend entirely on its chosen element. When first summoning an elemental eidolon, the summoner must select air, earth, fire, or water. Once made, this choice cannot be changed. The eidolon gains the following evolutions and abilities, which can vary depending on its element.

At 1st level, all elemental eidolons gain [immunity](ref/unchevolution/immunity) to paralysis and sleep. In addition, air elemental eidolons gain the [immunity](ref/carried/bestiary/rules/universal-monster-rules/immunity) (electricity) evolution. Earth elemental eidolons gain the immunity (acid) evolution. Fire elemental eidolons gain the immunity (fire) evolution. Water elemental eidolons gain the immunity (cold) evolution.

At 4th level, all elemental eidolons add 1 point to their evolution pools.

At 8th level, air elemental eidolons gain the flight evolution (using magic) with a speed equal to their base speed. Earth elemental eidolons gain the burrow evolution. Fire elemental eidolons increase their base speed by 20 feet. Water elemental eidolons gain the swim evolution twice, gaining a swim speed equal to their base speed + 20 feet. They also gain the gills evolution, which allows them to breathe underwater.

At 12th level, all elemental eidolons gain immunity to bleed, poison, and stun. In addition, they can no longer be flanked.

At 16th level, all elemental eidolons gain immunity to critical hits and do not take additional damage from precision-based attacks, such as sneak attack.

At 20th level, an air elemental eidolon gains the whirlwind ability (_Bestiary_ 306), with a maximum height of 15 feet (30 feet for a Large air elemental) and dealing 1d6 points of damage (1d8 for a Large air elemental). Earth elemental eidolons gain the earth mastery ability (_Bestiary_ 122) and DR 5/—. Fire elemental eidolons gain the energy attacks (fire) evolution and the burn ability (_Bestiary_ 298). Water elemental eidolons gain the drench and vortex abilities (_Bestiary_ 126). The vortex ability works as the air elemental eidolon's whirlwind ability (except as noted in the vortex ability's description). Inevitable Implacable and ceaseless in their fight against chaos and those who break natural laws, inevitables make loyal, if literal-minded, companions for lawful summoners. Summoners of inevitables generally get along well with axiomites, who share their understanding of the process of forging and modifying an inevitable. Inevitable eidolons appear as a mixture between clockwork constructs and idealized humanoid statues.'''

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "alignment"
print = "Lawful neutral."

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "base-form"
print = "Biped (limbs \\[arms\\], limbs \\[legs\\], slam)."

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "base-evolutions"
print = '''
At 1st level, inevitable eidolons count as both constructs and outsiders for the purpose of effects such as the _bane_ weapon special ability and the favored enemy class feature. They gain a +4 bonus on saving throws against death effects, disease, necromancy effects, paralysis, poison, sleep, and stun.

At 4th level, inevitable eidolons gain a +4 bonus on saving throws against mind-affecting effects and immunity to nonlethal damage, fatigue, and exhaustion.

At 8th level, inevitable eidolons gain immunity to death effects, disease, and poison.

At 12th level, inevitable eidolons gain DR 5/chaotic. They also gain immunity to sleep, as well as the true speech ability (see the inevitable subtype on page 307 of _Bestiary 2_).

At 16th level, inevitable eidolons lose the +4 bonus on saving throws against necromancy effects and gain immunity to ability damage, ability drain, energy drain, and necromancy effects.

At 20th level, inevitable eidolons gain immunity to paralysis, sleep, stun, and any effect that requires a Fortitude save (unless the effect also works on objects). Protean Serpentine beings of pure chaos, proteans seek to reshape reality. Protean eidolons appreciate creative summoners who often rebuild their forms and make liberal use of the _transmogrify_ spell. Beyond that, protean eidolons are happy to work with their summoners for any purpose, though they are quick to remind their summoners that while they have a mutually beneficial relationship, they are not servants.'''

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "alignment"
print = "Chaotic neutral."

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "base-form"
print = "Serpentine (bite, grab \\[tail slap\\], tail, tail slap)."

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "base-evolutions"
print = '''
At 1st level, protean eidolons gain the resistance (acid) evolution as well as the grab evolution, tied to an attack type of the summoner's choice. Whenever the summoner changes the protean eidolon's evolutions, he can also change the attack type for grab.

At 4th level, protean eidolons gain electricity resistance 10 and sonic resistance 10.

At 8th level, protean eidolons gain the constrict evolution.

At 12th level, protean eidolons gain DR 5/lawful. They also gain the blindsense evolution and the ability to fly without wings with perfect maneuverability, as the flight evolution with 4 points spent.

At 16th level, protean eidolons lose the resistance (acid) evolution and instead gain the immunity (acid) evolution. They also gain the amorphous anatomy ability (see the protean subtype on page 308 of _Bestiary 2_).

At 20th level, protean eidolons gain constant _freedom of movement_ and the protean version of the change shape (_greater polymorph_) ability (see the protean subtype on page 308 of _Bestiary 2_). Psychopomp Stewards, chroniclers, and guides of all things that die, psychopomps make dispassionate yet loyal eidolons. When they deal with the world of mortals, psychopomp eidolons nearly always wear masks. They do not tolerate summoners who traffic with daemons, undead, and other entities that interfere with the transmigration of souls, but otherwise they are comfortable with most actions on the summoner's part. When the summoner dies, a psychopomp eidolon personally escorts him to the afterlife and serves as an expert witness when it is time for him to be judged.'''

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "alignment"
print = "Neutral."

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "base-form"
print = "Biped (limbs \\[arms\\], limbs \\[legs\\], slam), quadruped (bite, limbs \\[legs, 2\\]), or serpentine (bite, pull \\[bite\\], reach \\[bite\\], tail, tail slap)."

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "base-evolutions"
print = '''
Starting at 1st level, psychopomp eidolons gain immunity to death effects, disease, and poison.

At 4th level, psychopomp eidolons gain cold resistance 10 and electricity resistance 10.

At 8th level, psychopomp eidolons gain the spirit touch ability (see the psychopomp subtype on page 308 of _Pathfinder RPG Bestiary 4_) and add 1 point to their evolution pools.

At 12th level, psychopomp eidolons gain DR 5/adamantine. They also gain the spiritsense ability (see the psychopomp subtype on page 308 of _Bestiary 4_).

At 16th level, psychopomp eidolons gain the ability increase evolution, applied to an ability score of the summoner's choice. They also gain the ability to cast _invisibility_ (self only) as a spell-like ability at will.

At 20th level, psychopomp eidolons increase their damage reduction to 10/adamantine and gain the immunity (cold) and immunity (electricity) evolutions.'''

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "base-forms"
print = '''
Each eidolon has one of three base forms that determines its starting size, speed, AC, attacks, and ability scores. All natural attacks are made using the eidolon's full base attack bonus unless otherwise noted (such as in the case of secondary attacks). An eidolon's attacks add the eidolon's Strength modifier to the damage rolls, unless the eidolon has only one attack, in which case the attack adds 1-1/2 times the eidolon's Strength modifier.

Alternatively, any one of these base forms can be used to make a Small eidolon. If the eidolon is Small, it gains a +2 bonus to Dexterity. It takes a -4 penalty to Strength and a -2 penalty to Constitution. It also has a +1 size bonus to AC and on attack rolls, a -1 penalty on combat maneuver checks and to CMD, a +2 bonus on Fly checks, and a +4 bonus on Stealth checks. Reduce the damage of all of its attacks by one step (for example, 1d6 becomes 1d4, and 1d4 becomes 1d3). If this choice is made, the eidolon can be made Medium whenever the summoner can change the eidolon's evolution pool (which causes it to lose these modifiers for being Small). Likewise, a Medium eidolon can be made Small whenever the summoner can change the eidolon's evolution pool. Biped Starting Statistics: Size Medium; Speed 30 ft.; AC +2 natural armor; Saves Fort (good), Ref (poor), Will (good); Attack 2 claws (1d4); Ability Scores Str 16, Dex 12, Con 13, Int 7, Wis 10, Cha 11. Quadruped Starting Statistics: Size Medium; Speed 40 ft.; AC +2 natural armor; Saves Fort (good), Ref (good), Will (poor); Attack bite (1d6); Ability Scores Str 14, Dex 14, Con 13, Int 7, Wis 10, Cha 11. Serpentine Starting Statistics: Size Medium; Speed 20 ft., climb 20 ft.; AC +2 natural armor; Saves Fort (poor), Ref (good), Will (good); Attack bite (1d6), tail slap (1d6); Ability Scores Str 12, Dex 16, Con 13, Int 7, Wis 10, Cha 11.'''

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "evolutions"
print = '''
Each eidolon gains a number of evolution points that can be spent to give the eidolon new abilities, powers, and other upgrades. These abilities, called evolutions, can be changed whenever the summoner gains a new level, but they are otherwise set. Some evolutions require that the eidolon have a specific base form or the summoner be of a specific level before they can be chosen. A number of evolutions grant the eidolon additional natural attacks. Natural attacks listed as primary are made using the eidolon's full base attack bonus and add the eidolon's Strength modifier on damage rolls. Natural attacks listed as secondary are made using the eidolon's base attack bonus - 5 and add 1/2 the eidolon's Strength modifier on damage rolls (if positive). If the eidolon has only a single natural attack, the attack is made using its full base attack bonus, and it adds 1-1/2 times its Strength modifier on damage rolls made with that attack, regardless of the attack's type.

Evolutions are grouped by their cost in evolution points. Evolution points cannot be saved. All of the points must be spent whenever the summoner gains a level. Unless otherwise noted, each evolution can be selected only once.'''

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "1-point-evolutions"
print = "The following evolutions cost 1 point from the eidolon's evolution pool."

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "bite"
print = "The eidolon's maw is full of razor-sharp teeth, giving it a bite attack. This attack is a primary attack. The bite deals 1d6 points of damage (1d8 if Large, 2d6 if Huge). If the eidolon already has a bite attack, this evolution allows it to deal 1-1/2 times its Strength modifier on damage rolls made with its bite. _Requirements_: Agathion, daemon, demon, devil, div, elemental, protean, or psychopomp subtype."

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "claws"
print = "The eidolon has a pair of vicious claws at the ends of its limbs, giving it two claw attacks. These attacks are primary attacks. The claws deal 1d4 points of damage (1d6 if Large, 1d8 if Huge). The eidolon must have the limbs evolution to take this evolution. This evolution can be selected more than once, up to the number of limbs evolutions the eidolon possesses. This evolution can be applied to any number of limbs (arms) evolutions, but no more than one limbs (legs) evolution. _Requirements_: Agathion, daemon, demon, devil, div, elemental, protean, or psychopomp subtype."

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "climb"
print = "The eidolon becomes a skilled climber, gaining a climb speed equal to its base speed. This evolution can be selected more than once. Each additional time it is selected, increase the eidolon's climb speed by 20 feet."

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "gills"
print = "The eidolon has gills and can breathe underwater indefinitely."

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "improved-damage"
print = "One of the eidolon's natural attacks is particularly deadly. Select one natural attack form and increase the damage die by one step. This evolution can be selected more than once. Its effects do not stack. Each time the eidolon selects this evolution, it applies to a different natural attack."

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "improved-natural-armor"
print = "The eidolon's hide grows thick fur, rigid scales, or bony plates, giving it a +2 bonus to its natural armor. This evolution can be taken once, plus one additional time for every 5 levels the summoner possesses. Each additional time it's taken, the bonus increases by 2."

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "magic-attacks"
print = "The eidolon is infused with magic, allowing it to treat all of its natural attacks as if they were magic for the purpose of overcoming damage reduction."

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "eidolons-and-alignment"
print = "Generally, the summoner controls the actions of his eidolon, even during combat, either through verbal commands or through the link ability, but this does not mean that the eidolon is a puppet that follows every command without question. Eidolons have been known to refuse actions that are against their ethoses or alignments (subject to the GM's discretion) and are quick to chide the summoner about such requests. In addition, should the action of the summoner cause a shift in alignment such that the summoner's alignment is more than one step away from the eidolon's, the eidolon refuses the call of the summoner (although the summoner can still use his summon monster class feature). If the summoner manages to restore his alignment, the eidolon returns to his service. If the summoner is 10th level or higher, all of the eidolon's natural attacks are treated as the alignment of the eidolon for the purpose of overcoming damage reduction."

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "mount"
print = "The eidolon is properly skilled and formed to serve as a combat-trained mount. The eidolon must be at least one size category larger than its rider. _Requirements_: Daemon, demon, devil, elemental, or protean subtype; quadruped or serpentine base form."

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "pincers"
print = "An eidolon grows large pincers at the ends of one pair of its limbs, giving it two pincer attacks. These attacks are secondary attacks. The pincers deal 1d6 points of damage (1d8 if Large, 2d6 if Huge). Eidolons with the grab evolution linked to their pincers gain a +2 bonus on combat maneuver checks to grapple. The eidolon must have the limbs (arms) evolution to take this evolution. Alternatively, the eidolon can replace the claws from its base form with pincers (this still costs 1 evolution point). This evolution can be selected more than once, up to the number of limbs (arms) evolutions the eidolon possesses. _Requirements_: Agathion, daemon, demon, devil, div, elemental, protean, or psychopomp subtype."

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "pull"
print = "The eidolon gains the ability to pull creatures closer with a successful attack. Select one type of natural attack. Whenever the eidolon makes a successful attack of the selected type, it can attempt a free combat maneuver check. If the eidolon succeeds at this check, it pulls the target of the attack 5 feet closer to it. This ability works only on creatures of a size category equal to or smaller than the eidolon. Creatures pulled in this way do not provoke attacks of opportunity. This evolution can be selected more than once. Its effects do not stack. Each time an eidolon selects this evolution, it applies to a different natural attack. _Requirements_: Reach of 10 feet or more."

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "push"
print = "The eidolon gains the ability to push creatures away with a successful attack. Select one type of natural attack. Whenever the eidolon makes a successful attack of the selected type, it can attempt a free combat maneuver check. If the eidolon succeeds at this check, it pushes the target of the attack 5 feet directly away from it. This ability works only on creatures of a size category equal to or smaller than the eidolon. Creatures pushed in this way do not provoke attacks of opportunity. This evolution can be selected more than once. Its effects do not stack. Each time an eidolon selects this evolution, it applies to a different natural attack."

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "reach"
print = "One of the eidolon's attacks is capable of striking foes at a distance. Select one attack. The eidolon's reach with that attack increases by 5 feet."

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "resistance"
print = "The eidolon's form takes on a resiliency to one particular energy type, which is usually ref lected in its physical body (ashen hide for fire, icy breath for cold, and so on). Select one energy type (acid, cold, electricity, fire, or sonic). The eidolon gains resistance 5 against that energy type. This resistance increases by 5 for every 5 levels the summoner possesses, to a maximum of 15 at 10th level. This evolution can be selected more than once. Its effects do not stack. Each time the eidolon selects this evolution, it applies to a different energy type."

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "scent"
print = "The eidolon's sense of smell becomes quite acute. The eidolon gains the scent special quality, allowing it to detect opponents within 30 feet by sense of smell. If the opponent is upwind, the range increases to 60 feet; if the opponent is downwind, the range drops to 15 feet. Strong scents can be detected at twice the normal range. Scent does not allow the eidolon to precisely locate the creature, only to detect its presence. It can detect the direction as a move action. The eidolon can pinpoint the creature's location if it is within 5 feet. The eidolon can use scent to track creatures."

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "skilled"
print = "The eidolon becomes especially adept at a specific skill, gaining a +8 racial bonus on that skill. This evolution can be selected more than once. Its effects do not stack. Each time the eidolon selects this evolution, it applies to a different skill."

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "slam"
print = "The eidolon can deliver a devastating slam attack. This attack is a primary attack. The slam deals 1d8 points of damage (2d6 if Large, 2d8 if Huge). The eidolon must have the limbs (arms) evolution to take this evolution. Alternatively, the eidolon can replace the claws from its base form with this slam attack (this still costs 1 evolution point). This evolution can be selected more than once, up to the number of the eidolon's limbs (arms) evolutions."

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "sting"
print = "The eidolon possesses a long, barbed stinger at the end of its tail, granting it a sting attack. This attack is a primary attack. The sting deals 1d4 points of damage (1d6 if Large, 1d8 if Huge). This evolution can be selected more than once, up to the number of tail evolutions the eidolon possesses. _Requirements_: Agathion, daemon, demon, devil, div, elemental, protean, or psychopomp subtype; tail evolution."

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "swim"
print = "The eidolon gains webbed hands, webbed feet, or powerful flippers, giving it a swim speed equal to its base speed. This evolution does not give the eidolon the ability to breathe underwater. This evolution can be selected more than once. Each additional time it is selected, increase the eidolon's swim speed by 20 feet."

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "tail"
print = "The eidolon grows a long, powerful tail. This grants it a +2 racial bonus on Acrobatics checks to balance on a surface. This evolution can be selected more than once. _Requirements_: Agathion, daemon, demon, devil, div, elemental, protean, or psychopomp subtype."

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "tail-slap"
print = "The eidolon can use its tail to bash nearby foes, granting it a tail slap attack. This attack is a secondary attack. The tail slap deals 1d6 points of damage (1d8 if Large, 2d6 if Huge). This evolution can be selected more than once, up to the number of tail evolutions the eidolon possesses. _Requirements_: Agathion, daemon, demon, devil, div, elemental, protean, or psychopomp subtype; tail evolution."

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "tentacle"
print = "The eidolon possesses a long, sinuous tentacle, granting it a tentacle attack. This attack is a secondary attack. The tentacle attack deals 1d4 points of damage (1d6 if Large, 1d8 if Huge). This evolution can be selected more than once. _Requirements_: Daemon, demon, or protean subtype."

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "wing-buffet"
print = "The eidolon learns to use its wings to batter foes, granting it two wing buffet attacks. These attacks are secondary attacks. The wing buffets deal 1d4 points of damage (1d6 if Large, 1d8 if Huge). _Requirements_: Flight (wings) evolution."

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "2-point-evolutions"
print = "The following evolutions cost 2 points from the eidolon's evolution pool."

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "ability-increase"
print = "The eidolon grows larger muscles, gains faster reflexes, achieves greater intelligence, or acquires another increase to one of its abilities. Increase one of the eidolon's ability scores by 2. This evolution can be selected more than once. It can be applied only once to an individual ability score, plus one additional time for every 6 levels the summoner possesses."

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "constrict"
print = "The eidolon gains powerful muscles that allow it to crush those it grapples. Whenever the eidolon successfully grapples a foe using the grab evolution, it deals additional damage equal to the amount of damage dealt by the attack the grab evolution is tied to. _Requirements_: Serpentine base form, grab evolution."

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "energy-attacks"
print = "The eidolon's attacks become charged with energy. Select one energy type: acid, cold, electricity, or fire. All of the eidolon's natural attacks deal 1d6 points of energy damage of the chosen type on a successful hit. _Requirements_: Summoner level 5th."

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "flight"
print = "The eidolon grows large wings, like those of a bat, bird, insect, or dragon, gaining the ability to fly. The eidolon gains a fly speed equal to its base speed. The eidolon's maneuverability depends on its size. Medium or smaller eidolons have good maneuverability. Large eidolons have average maneuverability, while Huge eidolons have poor maneuverability. For 2 additional evolution points, the eidolon flies by means of magic. It loses its wings, but its maneuverability increases to perfect. If the eidolon flies by magic, this is a supernatural ability. The eidolon can increase its fly speed by spending additional evolution points, gaining a 20-foot increase to its fly speed for each additional point spent. _Requirements_: Summoner level 5th."

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "gore"
print = "The eidolon grows a number of horns on its head, giving it a gore attack. This attack is a primary attack. The gore deals 1d6 points of damage (1d8 if Large, 2d6 if Huge). _Requirements_: Agathion, daemon, demon, devil, div, elemental, protean, or psychopomp subtype."

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "grab"
print = "The eidolon becomes adept at grappling foes, gaining the grab ability. Select one of the following attacks: bite, claw, pincers, slam, tail slap, or tentacle. Whenever the eidolon makes a successful attack of the selected type, it can attempt a free combat maneuver check. If successful, the eidolon grapples the target. This ability works only on creatures at least one size category smaller than the eidolon. Eidolons with this evolution gain a +4 bonus on combat maneuver checks to grapple."

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "immunity"
print = "The eidolon's body becomes extremely resilient to one energy type. Select one energy type: acid, cold, electricity, fire, or sonic. The eidolon gains immunity to that energy type. This evolution can be selected more than once. Its effects do not stack. Each time it applies to a different energy type. _Requirements_: Summoner level 7th."

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "limbs"
print = "The eidolon grows an additional pair of limbs. These limbs can take one of two forms. They can be made into legs, complete with feet. Each pair of legs increases the eidolon's base speed by 10 feet. Alternatively, they can be made into arms, complete with hands. The eidolon does not gain any additional natural attacks for an additional pair of arms, but it can take other evolutions that add additional attacks (such as claws or slam). Arms that have hands can be used to wield weapons, if the eidolon is proficient. This evolution can be selected more than once."

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "poison"
print = "The eidolon secretes toxic venom, gaining a poison attack. Select one bite or sting attack. Whenever the selected attack hits, the target is poisoned."

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "eidolon-poison"
print = '''
Injury; _save_ Fort negates; _frequency_ 1/round for 4 rounds; _effect_ 1d4 Str damage; _cure_ 1 save.

The save DC is equal to 10 + 1/2 the eidolon's Hit Dice + the eidolon's Constitution modifier. For 2 additional evolution points, this poison deals Constitution damage instead. This poison can be used no more than once per round. _Requirements_: Summoner level 7th; daemon, demon, devil, elemental, or protean subtype; bite or sting evolution.'''

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "rake"
print = "The eidolon grows dangerous claws on its feet, allowing it to make two rake attacks against foes it is grappling. These attacks are primary attacks. The eidolon can make these additional attacks each time it succeeds at a grapple check against the target. These rake attacks deal 1d4 points of damage (1d6 if Large, 1d8 if Huge). This evolution counts as one natural attack toward the eidolon's maximum. _Requirements_: Summoner level 4th, quadruped base form."

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "rend"
print = "The eidolon learns to rip and tear the flesh of those it attacks with its claws, gaining the rend ability. Whenever the eidolon makes two successful claw attacks against the same target in 1 round, its claws latch on to the flesh and deal extra damage. This damage is equal to the damage dealt by one claw attack plus 1-1/2 times the eidolon's Strength modifier. _Requirements_: Summoner level 6th, claws evolution."

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "trample"
print = "The eidolon gains the ability to crush its foes underfoot, gaining the trample ability. As a full-round action, the eidolon can overrun any creature that is at least one size category smaller than itself. This works like the overrun combat maneuver, but the eidolon does not need to attempt a check; it merely has to move over opponents in its path. The creatures take 1d6 points of damage (1d8 if Large, 2d6 if Huge), plus 1-1/2 times the eidolon's Strength modifier. Targets of the trample can make attacks of opportunity at a -4 penalty. If a target forgoes this attack of opportunity, it can attempt a Reflex save for half damage. The DC of this save is 10 + 1/2 the eidolon's Hit Dice + the eidolon's Strength modifier. A trampling eidolon can deal trampling damage to a specific creature only once per round. _Requirements_: Biped or quadruped base form."

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "tremorsense"
print = "The eidolon becomes attuned to vibrations in the ground, gaining tremorsense with a range of 30 feet. This works like the blindsense evolution, but only if both the eidolon and the creature to be pinpointed are in contact with the ground. _Requirements_: Summoner level 7th."

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "trip"
print = "The eidolon becomes adept at knocking foes to the ground with its bite, granting it a trip attack. Whenever the eidolon makes a successful bite attack, it can attempt a free combat maneuver check. If the eidolon succeeds at this check, the target is knocked prone. If the eidolon fails, it is not tripped in return. This ability works only on creatures of a size category equal to or smaller than the eidolon. _Requirements_: Daemon, demon, devil, elemental, or protean subtype; bite evolution."

[[entry]]
id = "ref/eidolon/psychopomp"
anchor = "weapon-training"
print = "The eidolon learns to use a weapon, gaining Simple Weapon Proficiency as a bonus feat. If 2 additional evolution points are spent, it gains proficiency with all martial weapons as well."

[[entry]]
id = "ref/kipower/abundant-step"
anchor = "abundant-step"
print = "A monk with this ki power can slip magically between spaces, as if using the spell _[dimension door](ref/spell/dimension-door)_. Using this ability is a move action that consumes 2 points from his ki pool. The monk's caster level for this effect is equal to his monk level. He cannot take other creatures with him when he uses this ability. A monk must be at least 8th level before selecting this ki power."

[[entry]]
id = "ref/kipower/cobra-breath"
anchor = "cobra-breath"
print = "Whenever a monk with this ki power uses [diamond body](ref/kipower/diamond-body) to neutralize a poison, he can instead release that poison as a ranged touch attack against a single foe within 30 feet. If the attack hits, the foe must succeed at a saving throw (using the poison's original DC) or suffer the poison's effects, even if it was not originally a contact poison. A monk must be at least 12th level and must possess the [diamond body](ref/kipower/diamond-body) ki power before selecting this ki power."

[[entry]]
id = "ref/kipower/diamond-body"
anchor = "diamond-body"
print = "By spending 1 point from his ki pool, a monk with this power can remove one toxin from his body as if using _[neutralize poison](ref/spell/neutralize-poison)_, using his monk level as his caster level. He can remove only one poison in this way per use of this ability. A monk must be at least 8th level before selecting this ki power."

[[entry]]
id = "ref/kipower/diamond-mind"
anchor = "diamond-mind"
print = "By spending 1 point from his ki pool as a swift action, a monk with this power can suppress a fear effect affecting him as if using _[remove fear](ref/spell/remove-fear)_, using his monk level as his caster level. He can spend 2 ki points to activate this ability even when [frightened](ref/misc/frightened) or [panicked](ref/misc/panicked). A monk must be at least 6th level before selecting this ki power."

[[entry]]
id = "ref/kipower/diamond-resilience"
anchor = "diamond-resilience"
print = "By spending 1 ki point as a swift action, the monk gains DR 2/—. At 16th level, the [damage reduction](ref/rule/damage-reduction) increases to 4/—. At 19th level, it increases to DR 6/—. This DR lasts for 1 minute. A monk must be at least 12th level before selecting this ki power."

[[entry]]
id = "ref/kipower/diamond-soul"
anchor = "diamond-soul"
print = "A monk can spend 2 points from his ki pool as a swift action to gain [spell resistance](ref/rule/spell-resistance) equal to his monk level + 10. This spell resistance lasts for a number of rounds equal to the monk's level. A monk must be at least 12th level before selecting this ki power."

[[entry]]
id = "ref/kipower/elemental-burst"
anchor = "elemental-burst"
print = "A monk with this ability can spend 4 ki points to unleash a gout of energy in a 30-foot cone. Creatures within the cone take 20d6 points of damage of the same type as the monk's [elemental fury](ref/kipower/elemental-fury) ki power. A Reflex save (DC = 10 + 1/2 the monk's level + his Wisdom modifier) halves the damage. A monk must be at least 18th level and must possess the [elemental fury](ref/kipower/elemental-fury) ki power before selecting this ki power."

[[entry]]
id = "ref/kipower/elemental-fury"
anchor = "elemental-fury"
print = "A monk who selects this ki power must select one type of energy: acid, cold, electricity, or fire. Once this choice is made, it cannot be changed. The monk can expend 1 point from his ki pool as a swift action to imbue his natural attacks with this energy, causing them to deal 1d6 points of damage of the chosen type for a number of rounds equal to 1/2 his monk level. A monk must be at least 6th level before selecting this ki power."

[[entry]]
id = "ref/kipower/empty-body"
anchor = "empty-body"
print = "A monk with this ki power gains the ability to assume an ethereal state for 1 minute as though using the spell _[etherealness](ref/spell/etherealness)_, using his monk level as his caster level. Using this ability is a move action that consumes 3 points from the monk's ki pool. This ability affects only the monk and cannot be used to make other creatures ethereal."

[[entry]]
id = "ref/kipower/feather-balance"
anchor = "feather-balance"
print = "A monk with this ability can spend 1 ki point as a swift action to achieve perfect balance. While this is active, the monk treats any [Acrobatics](ref/skill/acrobatics) attempt made to balance as if he had rolled a 20. This ability lasts for 1 minute."

[[entry]]
id = "ref/kipower/formless-mastery"
anchor = "formless-mastery"
print = "A monk with this ability varies his styles, never repeating the same move twice and capitalizing on the weaknesses of an opponent's style. As long as he does not possess any style feat, the monk can spend 1 point from his ki pool as an immediate action to gain the following against opponents in the stance of a style feat: a +4 dodge bonus to AC, a +4 circumstance bonus on attack rolls, and a bonus equal to his monk level on damage rolls. These bonuses last until the end of the monk's next turn (or his current turn if he uses this ability on his own turn). The monk can activate this ability and the [furious defense](ref/kipower/furious-defense) ki power with the same immediate action for a total cost of 3 ki points. A monk must be at least 7th level before selecting this ki power."

[[entry]]
id = "ref/kipower/furious-defense"
anchor = "furious-defense"
print = "By spending 1 point from his ki pool as an immediate action, a monk with this ki power can grant himself a +4 dodge bonus to AC until the end of his next turn. The monk can activate this ability and the [formless mastery](ref/kipower/formless-mastery) ki power with the same immediate action for a total cost of 3 ki points. A monk must be at least 7th level before selecting this ki power."

[[entry]]
id = "ref/kipower/high-jump"
anchor = "high-jump"
print = "A monk with this ki power adds his level as a bonus on all [Acrobatics](ref/skill/acrobatics) checks to jump, both for vertical jumps and horizontal jumps. In addition, he always counts as having a running start when attempting Acrobatics checks to jump. By spending 1 point from his ki pool as a swift action, the monk gains a +20 bonus on Acrobatics checks to jump for 1 round."

[[entry]]
id = "ref/kipower/insightful-wisdom"
anchor = "insightful-wisdom"
print = "A monk with this ability can spend 2 ki points as an immediate action to give another ally within 30 feet just the right word of advice to prevent disaster. If the ally can hear the monk, she can reroll a single attack roll or saving throw. The ally must take the second result, even if it is worse. A monk must be at least 8th level before selecting this ki power."

[[entry]]
id = "ref/kipower/ki-blocker"
anchor = "ki-blocker"
print = "A monk with this ability can spend 1 ki point as a free action before making an unarmed strike against a foe. If the attack hits, the monk can interrupt the target's flow of ki. If the monk successfully damages the target of his attack, that opponent's cost to activate abilities with ki increases by 1 ki point for 1 hour. If the monk spends 2 points from his ki pool, he can use this ability to affect the target's arcane pool, arcane reservoir, grit points, inspiration, or panache points instead of its ki pool. The effects of this ability do not stack, but multiple hits increase the duration by 1 hour for each hit. A monk must be at least 10th level before selecting this ki power."

[[entry]]
id = "ref/kipower/ki-guardian"
anchor = "ki-guardian"
print = "As an immediate action before he rolls a saving throw against a targeted effect that also targets other allies or an area effect whose area includes other allies, a monk with this ability can spend any number of ki points and designate a number of adjacent allies equal to the number of ki points spent. The monk rolls one saving throw for each designated ally, using his bonus instead of the ally's. For each successful saving throw, the corresponding ally treats the effect as if that ally had succeeded at the saving throw, and for each saving throw failed, the corresponding ally treats the effect as if that ally had failed the saving throw. If the monk fails any of the saving throws (including his own original saving throw), the monk treats the effect as if he had failed the saving throw. A monk must be at least 6th level before selecting this ki power."

[[entry]]
id = "ref/kipower/ki-hurricane"
anchor = "ki-hurricane"
print = "As a full-round action, a monk with this ability can move up to twice his speed. At any point in that movement, the monk can spend 1 ki point to make the first attack in his flurry of blows. He can later spend another ki point to make the next attack in his flurry of blows, and so on, until he either stops spending ki points or has exhausted all the attacks from his flurry of blows. A monk must be at least 10th level and possess the [sudden speed](ref/kipower/sudden-speed) ki power before selecting this ki power."

[[entry]]
id = "ref/kipower/ki-metabolism"
anchor = "ki-metabolism"
print = "A monk with this ability uses his ki to control his metabolism. As long as he has at least 1 point remaining in his ki pool, the monk needs to eat and drink only 1/4 as often as normal, needs only 2 hours of sleep each night (including to replenish his ki pool), and can [hold his breath](ref/misc/hold-your-breath) for up to 1 hour per point of Constitution. As a move action, he can spend 1 ki point to enter a state of suspended animation, falling unconscious and appearing dead to all senses. At the time he enters this state, he indicates a preset period of time or a triggering condition, after which he awakens."

[[entry]]
id = "ref/kipower/ki-mount"
anchor = "ki-mount"
print = "A monk with this ability can spend 1 ki point as a standard action to grant 2 [temporary hit points](ref/rule/temporary-hit-points) per monk level he possesses to his mount for 1 hour per monk level. As long as the monk and his mount are adjacent or the monk is mounted, the mount shares the benefits of whichever of the AC bonus, evasion, high jump, improved evasion, ki strike, perfect self, and still mind abilities the monk possesses. A monk must be at least 6th level before selecting this ki power."

[[entry]]
id = "ref/kipower/ki-range"
anchor = "ki-range"
print = "A monk with this ability can spend 1 ki point as a swift action to increase the range increment of any thrown monk weapon by 20 feet. Apply this benefit before doubling the range increment with the [Far Shot](ref/feat/far-shot) feat."

[[entry]]
id = "ref/kipower/ki-visions"
anchor = "ki-visions"
print = "A monk with this ability often sees visions of spirits or hears the voice of his departed mentor in his dreams. On any given night during which the monk dreams, he can use this ability to gain the benefits of a _[divination](ref/spell/divination)_. If he does, he spends 2 ki points from the next day's total. A monk must be at least 10th level before selecting this ki power."

[[entry]]
id = "ref/kipower/ki-volley"
anchor = "ki-volley"
print = "When a targeted spell or [spell-like ability](ref/umr/spell-like-abilities) fails to overcome the monk's [spell resistance](ref/rule/spell-resistance) from [diamond soul](ref/kipower/diamond-soul), he can spend 2 ki points as an immediate action to send that spell back at its caster as _[spell turning](ref/spell/spell-turning)_. A monk must be 16th level or higher and possess the [diamond soul](ref/kipower/diamond-soul) ki power before selecting this ki power."

[[entry]]
id = "ref/kipower/light-steps"
anchor = "light-steps"
print = "A monk with this ki power can move effortlessly across nearly any surface. Whenever the monk activates his [feather balance](ref/kipower/feather-balance) ki power, he can also ignore all [difficult terrain](ref/rule/terrain-and-obstacles). In addition, while active, he can cross any solid surface, even if it would normally not support his weight. This does not allow him to walk on liquids. A monk must be at least 8th level and have the [feather balance](ref/kipower/feather-balance) ki power before selecting this ki power."

[[entry]]
id = "ref/kipower/one-touch"
anchor = "one-touch"
print = "As long as he has at least 1 point remaining in his ki pool, as a standard action, a monk with this power can make an unarmed strike against a foe as a touch attack. He adds 1/2 his monk level as a bonus on the damage roll. He can spend 1 ki point to double this bonus for that attack. A monk must be at least 12th level before selecting this ki power."

[[entry]]
id = "ref/kipower/qinggong-power"
anchor = "qinggong-power"
print = "A monk with this power selects any of the [qinggong monk](ref/arc-monk/qinggong-monk) ki powers for which he qualifies based on his monk level. A monk can select this ability multiple times. Each time, he must select a different qinggong monk ki power."

[[entry]]
id = "ref/kipower/quivering-palm"
anchor = "quivering-palm"
print = "A monk can set up vibrations within the body of another creature that can thereafter be fatal if the monk so desires. Using this ability is a standard action that costs 4 ki points, and the monk must announce his intent to use this ability (and spend the ki points) before making the attack roll. Creatures immune to critical hits cannot be affected. Otherwise, if the attack hits and the target takes damage from the blow, the quivering palm attack succeeds. Thereafter, the monk can try to slay the victim at any time within a number of days equal to his monk level. To make such an attempt, the monk merely wills the target to die (a free action); unless the target succeeds at a Fortitude saving throw (DC = 10 + 1/2 the monk's level + the monk's Wisdom modifier), it dies. If the saving throw is successful, the target is no longer in danger from that particular quivering palm attack, but it can still be affected by another one at a later time. A monk can have no more than one quivering palm in effect at one time. If a monk uses quivering palm while another is still in effect, the previous one is negated. A monk must be at least 16th level before selecting this ki power."

[[entry]]
id = "ref/kipower/slow-fall"
anchor = "slow-fall"
print = "A monk within arm's reach of a wall can use it to slow his descent by expending 1 point from his ki pool. When he uses this ability, he takes no damage from the fall (as if using _[feather fall](ref/spell/feather-fall)_), but he must be adjacent to a wall for the length of the fall (although this can be used to reduce the damage from a fall if only part of it is adjacent to a wall)."

[[entry]]
id = "ref/kipower/sudden-speed"
anchor = "sudden-speed"
print = "A monk with this ki power can spend 1 point from his ki pool as a swift action to grant himself a sudden burst of speed. This increases the monk's base land speed by 30 feet for 1 minute."

[[entry]]
id = "ref/kipower/water-sprint"
anchor = "water-sprint"
print = "A monk with this ki power can spend 1 point from his ki pool as a swift action to gain the ability to walk on water, as if under the effects of _[water walk](ref/spell/water-walk)_. Once activated, this ability lasts for 1 minute per monk level. A monk must be at least 6th level before selecting this ki power."

[[entry]]
id = "ref/kipower/wholeness-of-body"
anchor = "wholeness-of-body"
print = "A monk with this ki power can heal his own wounds as a standard action. By spending 2 points from his ki pool, he can heal an amount of damage equal to 1d8 + his monk level."

[[entry]]
id = "ref/kipower/wind-jump"
anchor = "wind-jump"
print = "A monk with this ki power can spend 1 point from his ki pool as a move action to grant himself a fly speed (with perfect maneuverability) equal to his base land speed. He must end his movement each round on solid ground (or some other surface that can support his weight) or fall as normal. Once activated, this ability lasts for 1 minute. A monk must be at least 8th level and have the [high jump](ref/kipower/high-jump) ki power before selecting this ki power."

[[entry]]
id = "ref/ragepower/accurate-stance"
anchor = "accurate-stance"
print = "The barbarian can focus her strikes. She gains a +1 competence bonus on melee attack rolls and thrown weapon attack rolls. This bonus increases by 1 for every 4 levels the barbarian has. This is a stance rage power."

[[entry]]
id = "ref/ragepower/calm-stance"
anchor = "calm-stance"
print = '''
The barbarian can enter a state of calm. While in this stance, the barbarian doesn't gain any benefits from rage other than the temporary hit points, but she doesn't take any of the penalties from rage (including the penalty to AC and the restriction on actions she can take).

Table 1–1: Barbarian Base Attack Fort Ref Will Level Bonus Save Save Save 1st +1 +2 +0 +0 2nd +2 +3 +0 +0 3rd +3 +3 +1 +1 4th +4 +4 +1 +1 5th +5 +4 +1 +1 6th +6/+1 +5 +2 +2 7th +7/+2 +5 +2 +2 8th +8/+3 +6 +2 +2 9th +9/+4 +6 +3 +3 10th +10/+5 +7 +3 +3 11th +11/+6/+1 +7 +3 +3 12th +12/+7/+2 +8 +4 +4 13th +13/+8/+3 +8 +4 +4 14th +14/+9/+4 +9 +4 +4 15th +15/+10/+5 +9 +5 +5 16th +16/+11/+6/+1 +10 +5 +5 17th +17/+12/+7/+2 +10 +5 +5 18th +18/+13/+8/+3 +11 +6 +6 19th +19/+14/+9/+4 +11 +6 +6 20th +20/+15/+10/+5 +12 +6 +6 Rounds spent in a calm stance still count against her total number of rounds of rage per day. This is a stance rage power.'''

[[entry]]
id = "ref/ragepower/elemental-stance"
anchor = "elemental-stance"
print = "When the barbarian adopts this stance, she chooses an energy type (acid, cold, electricity, or fire). Her melee attacks deal 1 additional point of damage of the chosen type. This damage increases to 1d6 points at 8th level. At 12th level, the barbarian's critical hits deal an additional 1d10 points of energy damage of the same type (2d10 if the weapon deals ×3 damage on a critical hit, 3d10 if the weapon deals ×4 damage on a critical hit). This is a stance rage power. A barbarian must be at least 4th level to select this rage power."

[[entry]]
id = "ref/ragepower/guarded-stance-stance"
anchor = "guarded-stance"
print = "The barbarian can take on a more defensive posture. This grants her a +1 dodge bonus to her Armor Class for the duration of her current rage. This bonus increases by 1 for every 4 levels the barbarian has. This is a stance rage power."

[[entry]]
id = "ref/ragepower/knockdown-stance"
anchor = "knockdown-stance"
print = "The barbarian can focus on toppling her foes. Once per round, she can make a [trip](ref/rule/trip) attack against one target in place of a melee attack. If she succeeds, the target is knocked [prone](ref/rule/prone). This trip attempt doesn't provoke an attack of opportunity. This is a stance rage power."

[[entry]]
id = "ref/ragepower/powerful-stance"
anchor = "powerful-stance"
print = '''
The barbarian can focus her ferocity. She gains a +1 bonus on melee damage rolls and thrown weapon damage rolls. This bonus increases by 1 for every 4 levels the barbarian has. This is a stance rage power.

_Protect Vitals (Ex)_: While in the guarded stance, the barbarian gains an additional +4 dodge bonus to AC against attack rolls made to confirm critical hits. A barbarian must have the guarded stance rage power and be at least 8th level to select this rage power.'''

[[entry]]
id = "ref/ragepower/reckless-stance"
anchor = "reckless-stance"
print = "The barbarian can attack with abandon at the expense of her defense. She gains a +1 bonus on attack rolls, but takes a –1 penalty to AC. This bonus and penalty increase by 1 at 4th level and every 4 levels thereafter. This is a stance rage power."

[[entry]]
id = "ref/ragepower/regenerative-stance"
anchor = "regenerative-stance"
print = "The barbarian can continually replenish her health. At the start of her turn, she regains 1 temporary hit point for every 4 levels she has (up to 5 hit points per round), but this cannot give her more than her maximum temporary hit points from rage. This is a stance rage power. A barbarian must be at least 4th level to select this rage power."

[[entry]]
id = "ref/ragepower/strength-stance"
anchor = "strength-stance"
print = "The barbarian can summon mighty strength. She gains a +1 competence bonus on combat maneuvers and to her CMD. These bonuses increase by 1 for every 4 levels the barbarian has. In addition, she gains a +8 competence bonus on Strength checks to lift, push, bend, or break objects (this does not apply to combat maneuvers). This is a stance rage power."

[[entry]]
id = "ref/ragepower/taunting-stance"
anchor = "taunting-stance"
print = "The barbarian can leave herself open to attacks while preparing devastating counterattacks. Enemies gain a +4 bonus on attack and damage rolls against the barbarian while she's in this stance, but every attack against the barbarian provokes an attack of opportunity from her, which is resolved prior to each provoking attack. This is a stance rage power. A barbarian must be at least 12th level to select this rage power."

[[entry]]
id = "ref/stylestrike/defensive-spin"
anchor = "defensive-spin"
print = "The monk spins about, confounding his foe. If the attack hits, the monk gains a +4 dodge bonus to AC against any attacks made by the target of the style strike until the start of his next turn. This bonus does not stack with itself. The monk must attack with a fist to use this style strike."

[[entry]]
id = "ref/stylestrike/elbow-smash"
anchor = "elbow-smash"
print = "The monk follows up a punch with a strike from his elbow. If the attack hits, the monk can make an additional attack using the same attack bonus as the punch at a –5 penalty. If this second attack hits, it deals damage as normal, but all of the damage is nonlethal. The monk must attack with a fist to use this style strike."

[[entry]]
id = "ref/stylestrike/flying-kick"
anchor = "flying-kick"
print = "The monk leaps through the air to strike a foe with a kick. Before the attack, the monk can move a distance equal to his fast movement bonus. This movement is made as part of the monk's flurry of blows attack and does not require an additional action. At the end of this movement, the monk must make an attack against an adjacent foe. This movement may be between attacks. This movement provokes an attack of opportunity as normal. The attack made after the movement must be a kick."

[[entry]]
id = "ref/stylestrike/foot-stomp"
anchor = "foot-stomp"
print = "The monk stomps on a foe's foot, preventing the opponent from escaping. If the attack hits and the monk ends his turn adjacent to that foe, the foe's movement is restricted. Until the start of the monk's next turn, the target of this attack can move only in such a way that the space it occupies is adjacent to the monk. Alternatively, it can attempt a combat maneuver check (against the monk's CMD) as a standard action to break free. This strike does not work against foes that cannot be tripped. The monk must attack with a kick to use this style strike."

[[entry]]
id = "ref/stylestrike/hammerblow"
anchor = "hammerblow"
print = "The monk links his hands together, swinging both arms like a club and dealing tremendous damage. If the attack hits, the monk rolls his unarmed strike damage twice, adding both rolls together before applying Strength and other modifiers to the damage. This bonus damage is not multiplied on a critical hit. The monk must attack with a fist to use this style strike, but must have both hands free."

[[entry]]
id = "ref/stylestrike/head-butt"
anchor = "head-butt"
print = "The monk slams his head into his enemy's head, leaving his foe reeling. If the attack hits and the foe is of the same size or one size smaller than the monk, the monk can make a free combat maneuver check against the target of this strike (using the base attack bonus of the attack used to hit the foe). If the foe is not of the same creature type as the monk, the monk takes a –8 penalty on this check. If the check is successful, the target is [staggered](ref/misc/staggered) for 1 round. Creatures without a discernible head are not affected by this style strike (subject to GM discretion). The monk must attack with a head-butt to use this style strike."

[[entry]]
id = "ref/stylestrike/knockback-kick"
anchor = "knockback-kick"
print = "The monk attempts to knock his foe back with a powerful kick. If the attack hits, the monk can attempt a free combat maneuver check against the foe (using the base attack bonus of the attack used to hit the foe). If the check is successful, the foe is knocked 10 feet directly away from the monk. This distance increases by 10 feet for every 5 by which the check exceeds the foe's CMD, to a maximum distance equal to the monk's fast movement bonus. This movement does not provoke an attack of opportunity. The foe stops moving if it strikes another creature, barrier, or otherwise solid object. The creature is not knocked prone by this movement. The monk must attack with a kick to use this style strike."

[[entry]]
id = "ref/stylestrike/leg-sweep"
anchor = "leg-sweep"
print = "The monk attempts to sweep his foe's leg, knocking the opponent down. If the attack hits, the monk can make a free [trip](ref/rule/trip) attempt against the target of this strike (using the base attack bonus of the attack used to hit the foe). This trip attempt does not provoke an attack of opportunity. The monk must attack with a kick to use this style strike."

[[entry]]
id = "ref/stylestrike/shattering-punch"
anchor = "shattering-punch"
print = "The monk delivers a brutal punch that can penetrate defenses. If the attack hits, it bypasses any [damage reduction](ref/rule/damage-reduction) or [hardness](ref/umr/hardness) possessed by the target of that attack. The monk must attack with a fist to use this style strike."

[[entry]]
id = "ref/stylestrike/spin-kick"
anchor = "spin-kick"
print = "The monk spins about, delivering a kick his foe did not expect. The monk makes his attack against the foe's [flat-footed](ref/rule/flat-footed) AC. Creatures with the [uncanny dodge](ref/ability/uncanny-dodge) class feature or a similar effect cannot be caught flat-footed by this style strike. The monk must attack with a kick to use this style strike."

[[entry]]
id = "ref/talent/certainty"
anchor = "certainty"
print = "The rogue chooses one of the skills she selected with rogue's edge (see page 23). Once per day, the rogue can reroll a skill check she just made with the selected skill and take the better result. She can use this reroll with the selected skill one additional time per day at 10th level and every 5 levels thereafter. A rogue can select this talent multiple times. Each time, the rogue must choose a different skill. A rogue must have the rogue's edge class feature before selecting this talent."

[[entry]]
id = "ref/talent/coax-information-unchained-rogue"
anchor = "coax-information"
print = "A rogue with this talent can use [Bluff](ref/skill/bluff) or [Diplomacy](ref/skill/diplomacy) in place of [Intimidate](ref/skill/intimidate) to force an opponent to act friendly toward her. When the duration"

[[entry]]
id = "ref/talent/combat-swipe-unchained-rogue"
anchor = "combat-swipe"
print = "A rogue with this talent gains [Improved Steal](ref/feat/improved-steal) as a bonus feat. At 6th level, she is treated as if she met all the prerequisites for [Greater Steal](ref/feat/greater-steal) (although she must take the feat as normal)."

[[entry]]
id = "ref/talent/cutting-edge"
anchor = "cutting-edge"
print = "A rogue with this ability immediately selects two additional skills with her rogue's edge ability. She can select this advanced talent multiple times."

[[entry]]
id = "ref/talent/deadly-sneak-unchained-rogue"
anchor = "deadly-sneak"
print = '''
Talents marked with an asterisk add effects to a rogue's sneak attack. Only one of these talents can be applied to an individual attack, and the decision must be made before the attack roll is made.

When a rogue with this talent uses the [powerful sneak](ref/talent/powerful-sneak) talent, she rerolls all sneak attack dice that resulted in 1s or 2s. She can reroll multiple dice, but she can't reroll any individual die more than once per attack. A rogue must have the [powerful sneak](ref/talent/powerful-sneak) talent before selecting this talent.'''

[[entry]]
id = "ref/talent/double-debilitation"
anchor = "double-debilitation"
print = '''
Talents marked with an asterisk add effects to a rogue's sneak attack. Only one of these talents can be applied to an individual attack, and the decision must be made before the attack roll is made.

Whenever the rogue inflicts a penalty against a target using the debilitating injury class feature, she can select two penalties to inflict. The target can never be subject to more than two penalties in this way at one time. If any additional penalties are inflicted, any previous penalties immediately end. Any effect that heals damage to the target negates both of the penalties.'''

[[entry]]
id = "ref/talent/expert-leaper-unchained-rogue"
anchor = "expert-leaper"
print = "When using the Acrobatics skill to jump, a rogue with this talent is always considered to have a running start and adds her rogue level to the check result. Whenever she deliberately falls, a successful DC 15 Acrobatics check allows her to ignore the first 20 feet fallen. For every 5 by which she exceeds the DC of this check, she can ignore an additional 10 feet of distance fallen."

[[entry]]
id = "ref/talent/greater-multitalented"
anchor = "greater-multitalented"
print = "A rogue with this talent can use the [multitalented](ref/talent/multitalented) rogue talent to gain additional uses of advanced talents. A rogue must have the multitalented talent to select this talent."

[[entry]]
id = "ref/talent/greater-terrain-mastery"
anchor = "greater-terrain-mastery"
print = "A rogue with this talent can select a single [favored terrain](ref/ability/favored-terrain). Her bonuses in that terrain increase to +4. At 13th level and 18th level, they increase by an additional +2 (to a maximum of +8). A rogue must have the [terrain mastery](ref/talent/terrain-mastery) talent to select this advanced talent."

[[entry]]
id = "ref/talent/lasting-poison-unchained-rogue"
anchor = "lasting-poison"
print = "A rogue with this talent can apply poison to a weapon in such a way that it is effective for a number of successful attacks equal to her Dexterity modifier (minimum two) instead of one. This poison has a reduced effect, however, and saves made against the poison gain a +2 circumstance bonus. Applying poison in this way is a full-round action, or a standard action if the rogue has the [swift poison](ref/talent/swift-poison) rogue talent."

[[entry]]
id = "ref/talent/ledge-walker-unchained-rogue"
anchor = "ledge-walker"
print = "This ability allows a rogue to move along narrow, uneven, or slippery surfaces (such as ice) at full speed using the Acrobatics skill without penalty. In addition, a rogue with this talent is not [flat-footed](ref/rule/flat-footed) when using Acrobatics to move along such surfaces, and retains her Dexterity bonus to AC."

[[entry]]
id = "ref/talent/light-walker"
anchor = "light-walker"
print = "The rogue can move at full speed through [difficult terrain](ref/rule/terrain-and-obstacles) and can take 5-foot steps into difficult terrain. A rogue must have the [ledge walker](ref/talent/ledge-walker) rogue talent before choosing light walker."

[[entry]]
id = "ref/talent/multitalented"
anchor = "multitalented"
print = "The rogue can use her rogue talents more often. Once per day, she can use a rogue talent that is normally only usable once per day one additional time. At 10th level and 18th level, she can use this talent one additional time per day (for a maximum total of 3 additional uses of a rogue talent that can normally only be used once per day). The uses of this talent do not have to be spent on the same rogue talent. This ability cannot be used with an advanced talent."

[[entry]]
id = "ref/talent/nimble-climber"
anchor = "nimble-climber"
print = "Whenever the rogue fails a Climb check by 5 or more, she can attempt a Reflex save (using the same DC as the Climb check) to catch herself and avoid falling."

[[entry]]
id = "ref/talent/powerful-sneak-unchained-rogue"
anchor = "powerful-sneak"
print = '''
Talents marked with an asterisk add effects to a rogue's sneak attack. Only one of these talents can be applied to an individual attack, and the decision must be made before the attack roll is made.

Whenever a rogue with this talent takes a full-attack action, she can take a –2 penalty on all attack rolls until the start of her next turn. If she does, she can reroll any sneak attack damage dice that result in 1s. She can reroll multiple dice, but she can't reroll any individual die more than once per attack.'''

[[entry]]
id = "ref/talent/quick-disable-unchained-rogue"
anchor = "quick-disable"
print = "It takes a rogue with this ability half the normal amount of time to disable a trap using the [Disable Device](ref/skill/disable-device) skill (minimum 1 round). When she uses Disable Device to open a lock that would normally take a full-round action to open, she reduces the duration to a standard action."

[[entry]]
id = "ref/talent/quick-shot"
anchor = "quick-shot"
print = "Whenever the rogue rolls initiative, she can also make a single attack with a ranged weapon as a swift action. She can use this ability only if she has a weapon in hand and it is loaded (if applicable). If more than one rogue has this talent, their initiative check results determine the order in which they make their attacks. After these attacks are resolved, the round proceeds as normal."

[[entry]]
id = "ref/talent/rogue-crawl-unchained-rogue"
anchor = "rogue-crawl"
print = "While [prone](ref/rule/prone), a rogue with this ability can move at half speed. This movement provokes attacks of opportunity as normal. A rogue with this talent can take a 5-foot step while crawling, and she reduces her attack roll and AC penalties for being prone by 2."

[[entry]]
id = "ref/talent/skill-mastery-unchained-rogue"
anchor = "skill-mastery"
print = "The rogue becomes so confident in the use of certain skills that she can use them reliably even under adverse conditions. The rogue selects a number of skills equal to her Intelligence modifier. When making a skill check with one of the selected skills (or any of the skills selected through the rogue's edge class feature), she can take 10 even if stress and distractions would normally prevent her from doing so. A rogue can gain this special ability multiple times, selecting additional skills for skill mastery to apply to each time."

[[entry]]
id = "ref/talent/stand-up-unchained-rogue"
anchor = "stand-up"
print = "A rogue with this ability can stand up from a [prone](ref/rule/prone) position as a swift action without provoking attacks of opportunity, or as a free action that provokes attacks of opportunity."

[[entry]]
id = "ref/talent/surprise-attack-unchained-rogue"
anchor = "surprise-attack"
print = "During the surprise round, a rogue with this ability always considers opponents [flat-footed](ref/rule/flat-footed), even if they have already acted. A rogue with this ability adds 1/2 her rogue level to her [sneak attack](ref/ability/sneak-attack) damage rolls made during the surprise round."

[[entry]]
id = "ref/unchevolution/ability-increase"
anchor = "ability-increase"
print = "The eidolon grows larger muscles, gains faster reflexes, achieves greater intelligence, or acquires another increase to one of its abilities. Increase one of the eidolon's ability scores by 2. This evolution can be selected more than once. It can be applied only once to an individual ability score, plus one additional time for every 6 levels the summoner possesses."

[[entry]]
id = "ref/unchevolution/bite"
anchor = "bite"
print = "The eidolon's maw is full of razor-sharp teeth, giving it a [bite attack](ref/umr/natural-attacks). This attack is a primary attack. The bite deals 1d6 points of damage (1d8 if Large, 2d6 if Huge). If the eidolon already has a bite attack, this evolution allows it to deal 1-1/2 times its Strength modifier on damage rolls made with its bite. _Requirements_: [Agathion](ref/eidolon/agathion), [daemon](ref/eidolon/daemon), [demon](ref/eidolon/demon), [devil](ref/eidolon/devil), [div](ref/eidolon/div), [elemental](ref/eidolon/elemental), [protean](ref/eidolon/protean), or [psychopomp](ref/eidolon/psychopomp) subtype."

[[entry]]
id = "ref/unchevolution/blindsense"
anchor = "blindsense"
print = "The eidolon's senses become incredibly acute, giving it [blindsense](ref/umr/blindsense) with a range of 30 feet. This ability allows the eidolon to pinpoint the location of creatures that it can't see without having to attempt a Perception check, but such creatures still have total [concealment](ref/rule/concealment) from the eidolon. Visibility still affects the eidolon's movement, and it is still denied its Dexterity bonus to Armor Class against attacks from creatures it cannot see. _Requirements_: Summoner level 9th."

[[entry]]
id = "ref/unchevolution/blindsight"
anchor = "blindsight"
print = "The eidolon's senses sharpen even further, granting it [blindsight](ref/umr/blindsight) with a range of 30 feet. The eidolon can maneuver and attack as normal, ignoring darkness, invisibility, and most forms of [concealment](ref/rule/concealment) as long as it has line of effect to the target. _Requirements_: Summoner level 11th, [blindsense](ref/unchevolution/blindsense) evolution."

[[entry]]
id = "ref/unchevolution/breath-weapon"
anchor = "breath-weapon"
print = "The eidolon learns to exhale a cone or line of magical energy, gaining a breath weapon. Select acid, cold, electricity, or fire. The eidolon can breathe a 30-foot cone (or 60-foot line) that deals 1d6 points of damage of the selected type per Hit Dice it possesses. Those caught in the breath weapon can attempt a Reflex save for half damage. The DC is equal to 10 + 1/2 the eidolon's Hit Dice + the eidolon's Constitution modifier. The eidolon can use this ability once per day. The eidolon can gain additional uses of this ability per day by spending 1 evolution point per additional use (to a maximum of three total uses per day). _Requirements_: Summoner level 9th."

[[entry]]
id = "ref/unchevolution/burrow"
anchor = "burrow"
print = "The eidolon grows thick and gnarled claws, allowing it to move through the earth. The eidolon gains a burrow speed equal to 1/2 its base speed. It can use this speed to move through clay, dirt, earth, and sand. It does not leave a hole behind, nor is its passage marked on the surface. _Requirements_: Summoner level 9th."

[[entry]]
id = "ref/unchevolution/claws"
anchor = "claws"
print = '''
1-Point Evolutions: The following evolutions cost 1 point from the eidolon's evolution pool.

The eidolon has a pair of vicious claws at the ends of its [limbs](ref/unchevolution/limbs), giving it two [claw attacks](ref/umr/natural-attacks). These attacks are primary attacks. The claws deal 1d4 points of damage (1d6 if Large, 1d8 if Huge). The eidolon must have the limbs evolution to take this evolution. This evolution can be selected more than once, up to the number of limbs evolutions the eidolon possesses. This evolution can be applied to any number of limbs (arms) evolutions, but no more than one limbs (legs) evolution. _Requirements_: [Agathion](ref/eidolon/agathion), [daemon](ref/eidolon/daemon), [demon](ref/eidolon/demon), [devil](ref/eidolon/devil), [div](ref/eidolon/div), [elemental](ref/eidolon/elemental), [protean](ref/eidolon/protean), or [psychopomp](ref/eidolon/psychopomp) subtype.'''

[[entry]]
id = "ref/unchevolution/climb"
anchor = "climb"
print = "The eidolon becomes a skilled climber, gaining a climb speed equal to its base speed. This evolution can be selected more than once. Each additional time it is selected, increase the eidolon's climb speed by 20 feet."

[[entry]]
id = "ref/unchevolution/constrict"
anchor = "constrict"
print = "The eidolon gains powerful muscles that allow it to crush those it grapples. Whenever the eidolon successfully grapples a foe using the [grab](ref/unchevolution/grab) evolution, it deals additional damage equal to the amount of damage dealt by the attack the [grab](ref/unchevolution/grab) evolution is tied to. _Requirements_: Serpentine base form, [grab](ref/unchevolution/grab) evolution."

[[entry]]
id = "ref/unchevolution/damage-reduction"
anchor = "damage-reduction"
print = "The eidolon's body becomes more resistant to harm. Increase the damage reduction granted by the eidolon's subtype by 5. _Requirements_: Summoner level 15th, damage reduction granted by the eidolon's subtype."

[[entry]]
id = "ref/unchevolution/energy-attacks"
anchor = "energy-attacks"
print = "The eidolon's attacks become charged with energy. Select one energy type: acid, cold, electricity, or fire. All of the eidolon's natural attacks deal 1d6 points of energy damage of the chosen type on a successful hit. _Requirements_: Summoner level 5th."

[[entry]]
id = "ref/unchevolution/fast-healing"
anchor = "fast-healing"
print = "The eidolon's body gains the ability to heal wounds very quickly, giving it [fast healing](ref/umr/fast-healing) 1. The eidolon heals 1 point of damage per round, just like via natural healing. Fast healing does not restore hit points lost due to starvation, thirst, or suffocation, nor does it allow the eidolon to regrow lost body parts (or to reattach severed parts). Fast healing functions as long as the eidolon is alive. This fast healing does not function when the eidolon is not on the same plane as its summoner. This healing can be increased by 1 point per round for every 2 additional evolution points spent (to a maximum of 5 points per round). _Requirements_: Summoner level 11th."

[[entry]]
id = "ref/unchevolution/flight"
anchor = "flight"
print = "The eidolon grows large wings, like those of a bat, bird, insect, or dragon, gaining the ability to fly. The eidolon gains a fly speed equal to its base speed. The eidolon's maneuverability depends on its size. Medium or smaller eidolons have good maneuverability. Large eidolons have average maneuverability, while Huge eidolons have poor maneuverability. For 2 additional evolution points, the eidolon flies by means of magic. It loses its wings, but its maneuverability increases to perfect. If the eidolon flies by magic, this is a supernatural ability. The eidolon can increase its fly speed by spending additional evolution points, gaining a 20-foot increase to its fly speed for each additional point spent. _Requirements_: Summoner level 5th."

[[entry]]
id = "ref/unchevolution/frightful-presence"
anchor = "frightful-presence"
print = "The eidolon becomes unsettling to its foes, gaining the [frightful presence](ref/umr/frightful-presence) ability. The eidolon can activate this ability as part of an offensive action, such as a [charge](ref/rule/charge) or attack. Opponents within 30 feet of the eidolon must succeed at a Will save or become [shaken](ref/misc/shaken) for 3d6 rounds. The DC of this save is equal to 10 + 1/2 the eidolon's Hit Dice + the eidolon's Charisma modifier. If the eidolon has at least 4 more Hit Dice than an opponent that fails this save, that opponent becomes [frightened](ref/misc/frightened) instead. Foes with more Hit Dice than the eidolon are immune to this effect. _Requirements_: Summoner level 11th."

[[entry]]
id = "ref/unchevolution/gills"
anchor = "gills"
print = "The eidolon has gills and can breathe underwater indefinitely."

[[entry]]
id = "ref/unchevolution/gore"
anchor = "gore"
print = "The eidolon grows a number of horns on its head, giving it a [gore attack](ref/umr/natural-attacks). This attack is a primary attack. The gore deals 1d6 points of damage (1d8 if Large, 2d6 if Huge). _Requirements_: [Agathion](ref/eidolon/agathion), [daemon](ref/eidolon/daemon), [demon](ref/eidolon/demon), [devil](ref/eidolon/devil), [div](ref/eidolon/div), [elemental](ref/eidolon/elemental), [protean](ref/eidolon/protean), or [psychopomp](ref/eidolon/psychopomp) subtype."

[[entry]]
id = "ref/unchevolution/grab"
anchor = "grab"
print = "The eidolon becomes adept at grappling foes, gaining the [grab](ref/umr/grab) ability. Select one of the following attacks: [bite](ref/unchevolution/bite), claw, [pincers](ref/unchevolution/pincers), [slam](ref/unchevolution/slam), [tail slap](ref/unchevolution/tail-slap), or [tentacle](ref/unchevolution/tentacle). Whenever the eidolon makes a successful attack of the selected type, it can attempt a free combat maneuver check. If successful, the eidolon [grapples](ref/rule/grapple) the target. This ability works only on creatures at least one size category smaller than the eidolon. Eidolons with this evolution gain a +4 bonus on combat maneuver checks to grapple."

[[entry]]
id = "ref/unchevolution/immunity"
anchor = "immunity"
print = "The eidolon's body becomes extremely resilient to one energy type. Select one energy type: acid, cold, electricity, fire, or sonic. The eidolon gains immunity to that energy type. This evolution can be selected more than once. Its effects do not stack. Each time it applies to a different energy type. _Requirements_: Summoner level 7th."

[[entry]]
id = "ref/unchevolution/improved-damage"
anchor = "improved-damage"
print = "One of the eidolon's natural attacks is particularly deadly. Select one natural attack form and [increase the damage die](ref/misc/damage-die-adjustments) by one step. This evolution can be selected more than once. Its effects do not stack. Each time the eidolon selects this evolution, it applies to a different natural attack."

[[entry]]
id = "ref/unchevolution/improved-natural-armor"
anchor = "improved-natural-armor"
print = "The eidolon's hide grows thick fur, rigid scales, or bony plates, giving it a +2 bonus to its natural armor. This evolution can be taken once, plus one additional time for every 5 levels the summoner possesses. Each additional time it's taken, the bonus increases by 2."

[[entry]]
id = "ref/unchevolution/large"
anchor = "large"
print = '''
The eidolon grows in size, becoming Large. The eidolon gains a +4 bonus to Strength, a +2 bonus to Constitution, and a +2 bonus to its natural armor. It takes a –2 penalty to Dexterity. This size change also gives the creature a –1 size penalty to AC and on attack rolls, a +1 bonus on combat maneuver checks and to CMD, a –2 penalty on Fly checks, and a –4 penalty on Stealth checks. If the eidolon has the biped base form, it also gains a [reach](ref/unchevolution/reach) of 10 feet. Any reach evolutions the eidolon possesses are added to this total.

If 6 additional evolution points are spent, the eidolon instead becomes Huge. The eidolon gains a +8 bonus to Strength, a +4 bonus to Constitution, and a +5 bonus to its natural armor. It takes a –4 penalty to Dexterity. This size change also gives the creature a –2 size penalty to AC and on attack rolls, a +2 bonus on combat maneuver checks and to CMD, a 10-foot reach, a –4 penalty on Fly checks, and a –8 penalty on Stealth checks. If the eidolon has the biped base form, its reach increases to 15 feet instead of 10 feet. Any reach evolutions the eidolon possesses are added to this total. These bonuses and penalties replace, and do not stack with, those gained from becoming Large.

The [ability increase](ref/unchevolution/ability-increase) evolution costs twice as much (4 evolution points) when adding to the Strength or Constitution scores of a Large or Huge eidolon. _Requirements_: Summoner level 8th (13th for Huge), Medium size.'''

[[entry]]
id = "ref/unchevolution/limbs"
anchor = "limbs"
print = "The eidolon grows an additional pair of limbs. These limbs can take one of two forms. They can be made into legs, complete with feet. Each pair of legs increases the eidolon's base speed by 10 feet. Alternatively, they can be made into arms, complete with hands. The eidolon does not gain any additional natural attacks for an additional pair of arms, but it can take other evolutions that add additional attacks (such as [claws](ref/unchevolution/claws) or [slam](ref/unchevolution/slam)). Arms that have hands can be used to wield weapons, if the eidolon is proficient. This evolution can be selected more than once."

[[entry]]
id = "ref/unchevolution/magic-attacks"
anchor = "magic-attacks"
print = '''
1-Point Evolutions: The following evolutions cost 1 point from the eidolon's evolution pool.

The eidolon is infused with magic, allowing it to treat all of its natural attacks as if they were magic for the purpose of overcoming [damage reduction](ref/rule/damage-reduction).'''

[[entry]]
id = "ref/unchevolution/mount"
anchor = "mount"
print = "The eidolon is properly skilled and formed to serve as a [combat-trained](ref/rule/mounted-combat) mount. The eidolon must be at least one size category larger than its rider. _Requirements_: [Daemon](ref/eidolon/daemon), [demon](ref/eidolon/demon), [devil](ref/eidolon/devil), [elemental](ref/eidolon/elemental), or [protean](ref/eidolon/protean) subtype; quadruped or serpentine base form."

[[entry]]
id = "ref/unchevolution/pincers"
anchor = "pincers"
print = "An eidolon grows large pincers at the ends of one pair of its [limbs](ref/unchevolution/limbs), giving it two [pincer attacks](ref/umr/natural-attacks). These attacks are secondary attacks. The pincers deal 1d6 points of damage (1d8 if Large, 2d6 if Huge). Eidolons with the [grab](ref/unchevolution/grab) evolution linked to their pincers gain a +2 bonus on combat maneuver checks to grapple. The eidolon must have the limbs (arms) evolution to take this evolution. Alternatively, the eidolon can replace the [claws](ref/unchevolution/claws) from its base form with pincers (this still costs 1 evolution point). This evolution can be selected more than once, up to the number of limbs (arms) evolutions the eidolon possesses. _Requirements_: [Agathion](ref/eidolon/agathion), [daemon](ref/eidolon/daemon), [demon](ref/eidolon/demon), [devil](ref/eidolon/devil), [div](ref/eidolon/div), [elemental](ref/eidolon/elemental), [protean](ref/eidolon/protean), or [psychopomp](ref/eidolon/psychopomp) subtype."

[[entry]]
id = "ref/unchevolution/poison"
anchor = "poison"
print = '''
2-Point Evolutions: The following evolutions cost 2 points from the eidolon's evolution pool.

The eidolon secretes toxic venom, gaining a poison attack. Select one [bite](ref/unchevolution/bite) or [sting](ref/unchevolution/sting) attack. Whenever the selected attack hits, the target is poisoned.'''

[[entry]]
id = "ref/unchevolution/pounce"
anchor = "pounce"
print = "The eidolon gains quick reflexes, allowing it to make a full attack after a [charge](ref/rule/charge). _Requirements_: Summoner level 7th, quadruped base form."

[[entry]]
id = "ref/unchevolution/pull"
anchor = "pull"
print = "The eidolon gains the ability to pull creatures closer with a successful attack. Select one type of natural attack. Whenever the eidolon makes a successful attack of the selected type, it can attempt a free combat maneuver check. If the eidolon succeeds at this check, it pulls the target of the attack 5 feet closer to it. This ability works only on creatures of a size category equal to or smaller than the eidolon. Creatures pulled in this way do not provoke attacks of opportunity. This evolution can be selected more than once. Its effects do not stack. Each time an eidolon selects this evolution, it applies to a different natural attack. _Requirements_: Reach of 10 feet or more."

[[entry]]
id = "ref/unchevolution/push"
anchor = "push"
print = "The eidolon gains the ability to push creatures away with a successful attack. Select one type of natural attack. Whenever the eidolon makes a successful attack of the selected type, it can attempt a free combat maneuver check. If the eidolon succeeds at this check, it pushes the target of the attack 5 feet directly away from it. This ability works only on creatures of a size category equal to or smaller than the eidolon. Creatures pushed in this way do not provoke attacks of opportunity. This evolution can be selected more than once. Its effects do not stack. Each time an eidolon selects this evolution, it applies to a different natural attack."

[[entry]]
id = "ref/unchevolution/rake"
anchor = "rake"
print = "The eidolon grows dangerous claws on its feet, allowing it to make two [rake](ref/umr/rake) attacks against foes it is grappling. These attacks are [primary attacks](ref/umr/natural-attacks). The eidolon can make these additional attacks each time it succeeds at a [grapple](ref/rule/grapple) check against the target. These rake attacks deal 1d4 points of damage (1d6 if Large, 1d8 if Huge). This evolution counts as one natural attack toward the eidolon's maximum. _Requirements_: Summoner level 4th, quadruped base form."

[[entry]]
id = "ref/unchevolution/reach"
anchor = "reach"
print = "One of the eidolon's attacks is capable of striking foes at a distance. Select one attack. The eidolon's reach with that attack increases by 5 feet."

[[entry]]
id = "ref/unchevolution/rend"
anchor = "rend"
print = "The eidolon learns to rip and tear the flesh of those it attacks with its [claws](ref/unchevolution/claws), gaining the [rend](ref/umr/rend) ability. Whenever the eidolon makes two successful claw attacks against the same target in 1 round, its [claws](ref/unchevolution/claws) latch on to the flesh and deal extra damage. This damage is equal to the damage dealt by one claw attack plus 1-1/2 times the eidolon's Strength modifier. _Requirements_: Summoner level 6th, [claws](ref/unchevolution/claws) evolution."

[[entry]]
id = "ref/unchevolution/resistance"
anchor = "resistance"
print = "The eidolon's form takes on a resiliency to one particular energy type, which is usually reflected in its physical body (ashen hide for fire, icy breath for cold, and so on). Select one energy type (acid, cold, electricity, fire, or sonic). The eidolon gains [resistance](ref/umr/resistance) 5 against that energy type. This resistance increases by 5 for every 5 levels the summoner possesses, to a maximum of 15 at 10th level. This evolution can be selected more than once. Its effects do not stack. Each time the eidolon selects this evolution, it applies to a different energy type."

[[entry]]
id = "ref/unchevolution/scent"
anchor = "scent"
print = "The eidolon's sense of smell becomes quite acute. The eidolon gains the [scent](ref/umr/scent) special quality, allowing it to detect opponents within 30 feet by sense of smell. If the opponent is upwind, the range increases to 60 feet; if the opponent is downwind, the range drops to 15 feet. Strong scents can be detected at twice the normal range. Scent does not allow the eidolon to precisely locate the creature, only to detect its presence. It can detect the direction as a move action. The eidolon can pinpoint the creature's location if it is within 5 feet. The eidolon can use scent to track creatures."

[[entry]]
id = "ref/unchevolution/skilled"
anchor = "skilled"
print = "The eidolon becomes especially adept at a specific skill, gaining a +8 racial bonus on that skill. This evolution can be selected more than once. Its effects do not stack. Each time the eidolon selects this evolution, it applies to a different skill."

[[entry]]
id = "ref/unchevolution/slam"
anchor = "slam"
print = "The eidolon can deliver a devastating [slam attack](ref/umr/natural-attacks). This attack is a primary attack. The slam deals 1d8 points of damage (2d6 if Large, 2d8 if Huge). The eidolon must have the [limbs](ref/unchevolution/limbs) (arms) evolution to take this evolution. Alternatively, the eidolon can replace the [claws](ref/unchevolution/claws) from its base form with this slam attack (this still costs 1 evolution point). This evolution can be selected more than once, up to the number of the eidolon's limbs (arms) evolutions."

[[entry]]
id = "ref/unchevolution/spell-resistance"
anchor = "spell-resistance"
print = "The eidolon is protected against magic, gaining spell resistance. The eidolon's spell resistance is equal to 11 + the summoner's level. This spell resistance does not apply to spells cast by the summoner. _Requirements_: Summoner level 9th."

[[entry]]
id = "ref/unchevolution/sting"
anchor = "sting"
print = "The eidolon possesses a long, barbed stinger at the end of its [tail](ref/unchevolution/tail), granting it a [sting attack](ref/umr/natural-attacks). This attack is a primary attack. The sting deals 1d4 points of damage (1d6 if Large, 1d8 if Huge). This evolution can be selected more than once, up to the number of tail evolutions the eidolon possesses. _Requirements_: [Agathion](ref/eidolon/agathion), [daemon](ref/eidolon/daemon), [demon](ref/eidolon/demon), [devil](ref/eidolon/devil), [div](ref/eidolon/div), [elemental](ref/eidolon/elemental), [protean](ref/eidolon/protean), or [psychopomp](ref/eidolon/psychopomp) subtype; tail evolution."

[[entry]]
id = "ref/unchevolution/swallow-whole"
anchor = "swallow-whole"
print = "The eidolon gains the [swallow whole](ref/umr/swallow-whole) ability, giving it the ability to consume its foes. If the eidolon begins its turn with a creature [grappled](ref/rule/grapple-conditions) using its bite attack (see the [grab](ref/unchevolution/grab) evolution), it can attempt a combat maneuver check to swallow the creature. The creature must be at least one size category smaller than the eidolon. Swallowed creatures take an amount of bludgeoning damage equal to the eidolon's bite damage each round + 1d6 points of damage. A swallowed creature keeps the grappled condition, but can attempt to cut its way free with a light piercing or slashing weapon. The amount of damage needed to cut free is equal to 1/10 the eidolon's total hit points. The eidolon's AC against these attacks is equal to 10 + 1/2 its natural armor bonus. If a swallowed creature cuts its way out, the eidolon loses this ability until it heals this damage. Alternatively, the swallowed creature can attempt to escape the grapple as normal. Success indicates that it has returned to the eidolon's mouth, where it can attempt to escape or can be swallowed again. _Requirements_: Summoner level 9th; [agathion](ref/eidolon/agathion), [daemon](ref/eidolon/daemon), [demon](ref/eidolon/demon), [devil](ref/eidolon/devil), [div](ref/eidolon/div), [elemental](ref/eidolon/elemental), [protean](ref/eidolon/protean), or [psychopomp](ref/eidolon/psychopomp) subtype; [grab](ref/unchevolution/grab) (bite) evolution."

[[entry]]
id = "ref/unchevolution/swim"
anchor = "swim"
print = "The eidolon gains webbed hands, webbed feet, or powerful flippers, giving it a swim speed equal to its base speed. This evolution does not give the eidolon the ability to breathe underwater. This evolution can be selected more than once. Each additional time it is selected, increase the eidolon's swim speed by 20 feet."

[[entry]]
id = "ref/unchevolution/tail"
anchor = "tail"
print = "The eidolon grows a long, powerful tail. This grants it a +2 racial bonus on Acrobatics checks to balance on a surface. This evolution can be selected more than once. _Requirements_: [Agathion](ref/eidolon/agathion), [daemon](ref/eidolon/daemon), [demon](ref/eidolon/demon), [devil](ref/eidolon/devil), [div](ref/eidolon/div), [elemental](ref/eidolon/elemental), [protean](ref/eidolon/protean), or [psychopomp](ref/eidolon/psychopomp) subtype."

[[entry]]
id = "ref/unchevolution/tail-slap"
anchor = "tail-slap"
print = "The eidolon can use its tail to bash nearby foes, granting it a [tail slap attack](ref/umr/natural-attacks). This attack is a secondary attack. The tail slap deals 1d6 points of damage (1d8 if Large, 2d6 if Huge). This evolution can be selected more than once, up to the number of tail evolutions the eidolon possesses. _Requirements_: [Agathion](ref/eidolon/agathion), [daemon](ref/eidolon/daemon), [demon](ref/eidolon/demon), [devil](ref/eidolon/devil), [div](ref/eidolon/div), [elemental](ref/eidolon/elemental), [protean](ref/eidolon/protean), or [psychopomp](ref/eidolon/psychopomp) subtype; tail evolution."

[[entry]]
id = "ref/unchevolution/tentacle"
anchor = "tentacle"
print = "The eidolon possesses a long, sinuous tentacle, granting it a [tentacle attack](ref/umr/natural-attacks). This attack is a secondary attack. The tentacle attack deals 1d4 points of damage (1d6 if Large, 1d8 if Huge). This evolution can be selected more than once. _Requirements_: [Daemon](ref/eidolon/daemon), [demon](ref/eidolon/demon), or [protean](ref/eidolon/protean) subtype."

[[entry]]
id = "ref/unchevolution/trample"
anchor = "trample"
print = "The eidolon gains the ability to crush its foes underfoot, gaining the [trample](ref/umr/trample) ability. As a full-round action, the eidolon can [overrun](ref/rule/overrun) any creature that is at least one size category smaller than itself. This works like the overrun combat maneuver, but the eidolon does not need to attempt a check; it merely has to move over opponents in its path. The creatures take 1d6 points of damage (1d8 if Large, 2d6 if Huge), plus 1-1/2 times the eidolon's Strength modifier. Targets of the trample can make attacks of opportunity at a –4 penalty. If a target forgoes this attack of opportunity, it can attempt a Reflex save for half damage. The DC of this save is 10 + 1/2 the eidolon's Hit Dice + the eidolon's Strength modifier. A trampling eidolon can deal trampling damage to a specific creature only once per round. _Requirements_: Biped or quadruped base form."

[[entry]]
id = "ref/unchevolution/tremorsense"
anchor = "tremorsense"
print = "The eidolon becomes attuned to vibrations in the ground, gaining [tremorsense](ref/umr/tremorsense) with a range of 30 feet. This works like the [blindsense](ref/unchevolution/blindsense) evolution, but only if both the eidolon and the creature to be pinpointed are in contact with the ground. _Requirements_: Summoner level 7th."

[[entry]]
id = "ref/unchevolution/trip"
anchor = "trip"
print = "The eidolon becomes adept at knocking foes to the ground with its [bite](ref/unchevolution/bite), granting it a [trip](ref/umr/trip) attack. Whenever the eidolon makes a successful bite attack, it can attempt a free combat maneuver check. If the eidolon succeeds at this check, the target is knocked [prone](ref/rule/prone). If the eidolon fails, it is not tripped in return. This ability works only on creatures of a size category equal to or smaller than the eidolon. _Requirements_: [Daemon](ref/eidolon/daemon), [demon](ref/eidolon/demon), [devil](ref/eidolon/devil), [elemental](ref/eidolon/elemental), or [protean](ref/eidolon/protean) subtype; bite evolution."

[[entry]]
id = "ref/unchevolution/weapon-training"
anchor = "weapon-training"
print = "The eidolon learns to use a weapon, gaining [Simple Weapon Proficiency](ref/feat/simple-weapon-proficiency) as a bonus feat. If 2 additional evolution points are spent, it gains proficiency with all martial weapons as well."

[[entry]]
id = "ref/unchevolution/web"
anchor = "web"
print = "The eidolon gains a pair of spinnerets, giving it the ability to spin webs. The eidolon can use these webs to support itself plus one creature of up to the same size. It can throw webbing as a ranged touch attack up to eight times per day, entangling a creature up to one size larger than the eidolon. The webbing has a range of 50 feet and a 10-foot range increment. Creatures [entangled](ref/rule/entangled) by the web can escape with a successful Escape Artist check, or with a Strength check at a –4 penalty. The DC of these checks is equal to 10 + 1/2 the eidolon's Hit Dice + the eidolon's Constitution modifier. The webs have a [hardness](ref/umr/hardness) of 0 and a number of hits points equal to the eidolon's total Hit Dice. The eidolon can [climb](ref/unchevolution/climb) its own webs at its climb speed and can pinpoint the location of any creature touching its webs. _Requirements_: Summoner level 7th; [daemon](ref/eidolon/daemon), [demon](ref/eidolon/demon), or [protean](ref/eidolon/protean) subtype; climb evolution."

[[entry]]
id = "ref/unchevolution/wing-buffet"
anchor = "wing-buffet"
print = "The eidolon learns to use its wings to batter foes, granting it two [wing buffet attacks](ref/umr/natural-attacks). These attacks are secondary attacks. The wing buffets deal 1d4 points of damage (1d6 if Large, 1d8 if Huge). _Requirements_: [Flight](ref/unchevolution/flight) (wings) evolution."
