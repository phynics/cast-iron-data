anchor = "base-evolutions"
print = '''
Starting at 1st level, psychopomp eidolons gain immunity to death effects, disease, and poison.

At 4th level, psychopomp eidolons gain cold resistance 10 and electricity resistance 10.

At 8th level, psychopomp eidolons gain the spirit touch ability (see the psychopomp subtype on page 308 of _Pathfinder RPG Bestiary 4_) and add 1 point to their evolution pools.

At 12th level, psychopomp eidolons gain DR 5/adamantine. They also gain the spiritsense ability (see the psychopomp subtype on page 308 of _Bestiary 4_).

At 16th level, psychopomp eidolons gain the ability increase evolution, applied to an ability score of the summoner's choice. They also gain the ability to cast _invisibility_ (self only) as a spell-like ability at will.

At 20th level, psychopomp eidolons increase their damage reduction to 10/adamantine and gain the immunity (cold) and immunity (electricity) evolutions.'''

[[entry]]
id = "ref/eidolon/daemon"
anchor = "base-forms"
print = '''
Each eidolon has one of three base forms that determines its starting size, speed, AC, attacks, and ability scores. All natural attacks are made using the eidolon's full base attack bonus unless otherwise noted (such as in the case of secondary attacks). An eidolon's attacks add the eidolon's Strength modifier to the damage rolls, unless the eidolon has only one attack, in which case the attack adds 1-1/2 times the eidolon's Strength modifier.

Alternatively, any one of these base forms can be used to make a Small eidolon. If the eidolon is Small, it gains a +2 bonus to Dexterity. It takes a -4 penalty to Strength and a -2 penalty to Constitution. It also has a +1 size bonus to AC and on attack rolls, a -1 penalty on combat maneuver checks and to CMD, a +2 bonus on Fly checks, and a +4 bonus on Stealth checks. Reduce the damage of all of its attacks by one step (for example, 1d6 becomes 1d4, and 1d4 becomes 1d3). If this choice is made, the eidolon can be made Medium whenever the summoner can change the eidolon's evolution pool (which causes it to lose these modifiers for being Small). Likewise, a Medium eidolon can be made Small whenever the summoner can change the eidolon's evolution pool. Biped Starting Statistics: Size Medium; Speed 30 ft.; AC +2 natural armor; Saves Fort (good), Ref (poor), Will (good); Attack 2 claws (1d4); Ability Scores Str 16, Dex 12, Con 13, Int 7, Wis 10, Cha 11. Quadruped Starting Statistics: Size Medium; Speed 40 ft.; AC +2 natural armor; Saves Fort (good), Ref (good), Will (poor); Attack bite (1d6); Ability Scores Str 14, Dex 14, Con 13, Int 7, Wis 10, Cha 11. Serpentine Starting Statistics: Size Medium; Speed 20 ft., climb 20 ft.; AC +2 natural armor; Saves Fort (poor), Ref (good), Will (good); Attack bite (1d6), tail slap (1d6); Ability Scores Str 12, Dex 16, Con 13, Int 7, Wis 10, Cha 11.'''

[[entry]]
id = "ref/eidolon/daemon"
anchor = "evolutions"
print = "Each eidolon gains a number of evolution points that can be spent to give the eidolon new abilities, powers, and other upgrades. These abilities, called evolutions, can be changed whenever the summoner gains a new level, but they are otherwise set. Some evolutions require that the eidolon have a specific base form or the summoner be of a specific level before they can be chosen. A number of evolutions grant the eidolon additional natural attacks. Natural attacks listed as primary are made using the eidolon's full base attack bonus and add the eidolon's Strength modifier on"

[[entry]]
id = "ref/eidolon/demon"
anchor = "opening"
print = '''
At 8th level, agathion eidolons gain lay on hands as paladins with levels equal to their Hit Dice.

At 12th level, agathion eidolons gain DR 5/evil. They also gain immunity to petrification and the truespeech ability (see the agathion subtype on page 306 of _Pathfinder RPG Bestiary 2_).

At 16th level, agathion eidolons lose the resistance (electricity) evolution, and instead gain the immunity (electricity) evolution. They also gain the agathion's speak with animals ability (see the agathion subtype on page 306 of _Bestiary 2_).

At 20th level, agathion eidolons gain _detect thoughts_ as a spell-like ability at will and also increase their damage reduction to DR 10/evil. Angel Hailing from the higher planes, angel eidolons are creatures of exquisite beauty. They usually appear in idealized humanoid forms, with smooth skin, shining hair, and bright eyes. Angel eidolons are impeccably honorable, trustworthy, and diplomatic, but they do not shy away from confrontation when facing off against evil and its minions.'''

