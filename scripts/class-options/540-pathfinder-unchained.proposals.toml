anchor = "alignment"
print = "Neutral evil."

[[entry]]
id = "ref/eidolon/devil"
anchor = "base-form"
print = "Biped ([claws](ref/unchevolution/claws), [limbs](ref/unchevolution/limbs) \\[arms\\], limbs \\[legs\\]), quadruped (limbs \\[legs, 2\\], bite), or serpentine (bite, reach \\[bite\\], reach \\[sting\\], sting, tail)."

[[entry]]
id = "ref/eidolon/devil"
anchor = "base-evolutions"
print = '''
Starting at 1st level, daemon eidolons gain the [resistance](ref/unchevolution/resistance) (acid) evolution as well as a +4 bonus on saving throws against death effects, disease, and poison.

At 4th level, daemon eidolons gain cold resistance 10, electricity resistance 10, and fire resistance 10.

At 8th level, daemon eidolons add 1 point to their evolution pools.

At 12th level, daemon eidolons gain DR 5/good. They also gain [immunity](ref/unchevolution/immunity) to death effects, disease, and poison.

At 16th level, daemon eidolons lose the resistance (acid) evolution, and instead gain the immunity (acid) evolution. They also gain [telepathy](ref/umr/telepathy).'''

[[entry]]
id = "ref/eidolon/devil"
anchor = "evolution-max"
print = "Pool Attacks Special +0 1 3 Darkvision, link, share spells +1 2 3 Evasion +1 3 3 — +1 3 4 — +2 4 4 Ability score increase +2 5 4 Devotion +3 6 4 — +3 6 4 — +3 7 5 Multiattack +4 8 5 Ability score increase +4 9 5 — +5 9 5 — +5 10 5 — +5 11 6 Improved evasion +6 12 6 Ability score increase +6 12 6 — +7 13 6 — +7 14 6 — +7 15 7 — +8 15 7 — At 20th level, as a standard action, a daemon eidolon can devour a portion of the soul of a dying creature or a creature that died no earlier than 1 round ago. This kills the creature and provides the daemon eidolon a profane bonus on attack rolls, saving throws, and skill checks for 24 hours. The bonus is equal to +1 per 5 Hit Dice the slain creature possessed. A creature whose soul was devoured in this way requires _resurrection_ or more powerful magic to return from the dead. Demon Raw destruction given material substance, demon eidolons form out of the Abyss's stew of soul energy, leading some scholars to speculate that the summoner's arts are related to the magical tampering that gave rise to the first demons. Demon eidolons revel in causing destruction and inf licting suffering, and they will do so for their summoners without question, taking pleasure in whatever havoc they can create. For a demon eidolon, the means justify the ends."

[[entry]]
id = "ref/eidolon/devil"
anchor = "alignment"
print = "Chaotic evil."

[[entry]]
id = "ref/eidolon/devil"
anchor = "base-form"
print = "Biped (claws, limbs \\[arms\\], limbs \\[legs\\]), quadruped (limbs \\[legs, 2\\], bite), or serpentine (bite, improved damage \\[bite\\], reach \\[bite\\], tail, tail slap)."

[[entry]]
id = "ref/eidolon/devil"
anchor = "base-evolutions"
print = '''
Starting at 1st level, demon eidolons gain the resistance (electricity) and resistance (fire) evolutions as well as a +4 bonus on saving throws against poison.

At 4th level, demon eidolons gain acid resistance 10 and cold resistance 10.

At 8th level, demon eidolons lose the +4 bonus on saving throws against poison and gain immunity to poison. They also add 1 point to their evolution pools.

At 12th level, demon eidolons gain DR 5/good. They also gain the ability increase evolution in an ability score of the summoner's choice.

At 16th level, demon eidolons lose the resistance (electricity) evolution, and instead gain the immunity (electricity) evolution. They also gain telepathy (_Bestiary_ 305).

At 20th level, demon eidolons gain _true seeing_ as a constant spell-like ability. Devil Corruptors, tempters, and despoilers, devil eidolons often serve their summoners obediently and efficiently, all in a long-term attempt to damn the summoner's soul to the deepest depths of Hell. While some types of devils have truly unusual forms, devil eidolons have found that the more traditional bipedal form allows them to build up a strong rapport with their summoners—and consequently to corrupt them—more easily than if they possessed a more monstrous appearance.'''

[[entry]]
id = "ref/eidolon/devil"
anchor = "alignment"
print = "Lawful evil."

[[entry]]
id = "ref/eidolon/devil"
anchor = "base-form"
print = "Biped (claws, limbs \\[arms\\], limbs \\[legs\\])."

[[entry]]
id = "ref/eidolon/devil"
anchor = "base-evolutions"
print = '''
Starting at 1st level, devil eidolons gain the resistance (fire) evolution and the skilled (Bluff) evolution. They also gain a +4 bonus on saving throws against poison.

At 4th level, devil eidolons gain acid resistance 10 and cold resistance 10.

At 8th level, devil eidolons gain the skilled (Diplomacy) evolution and gain immunity to poison.

At 12th level, devil eidolons gain DR 5/good. They also gain see in darkness (see the devil subtype on page 311 of the _Bestiary_).

At 16th level, devil eidolons lose the resistance (fire) evolution, and instead gain the immunity (fire) evolution. They also gain telepathy (_Bestiary_ 305).

At 20th level, devil eidolons gain regeneration 5 (good weapons, good spells). They are still banished to Hell as normal for eidolons if they take enough damage.

Div Formed of hatred and spite, div eidolons seek to despoil and ruin all things beautiful and joyous. Div eidolons particularly resent having mortal masters, and seek to doom their summoners to existences full of suffering and loss. Each div eidolon has a unique compulsion it must follow—usually something similar to the doru's obsession with secrets—that leads it to bargain its loyalty for something the summoner provides. The div's summoner uses his eidolon's compulsion to entrap and control the eidolon. Still, div eidolons never fully give in, and continue to plot ways they might corrupt that which their masters hold dearest.'''

