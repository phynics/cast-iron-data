# The printed text of the powers of the class options of the book, written ones included (the check reads an entry against it). Generated: never edit by hand.

[[entry]]
id = "ref/evolution/ability-increase"
anchor = "ability-increase"
print = '''
2-Point Evolutions: The following evolutions cost 2 points from the eidolon's evolution pool.

An eidolon grows larger muscles, gains faster reflexes, achieves greater intelligence, or acquires
another increase to one of its abilities. Increase one of the eidolon's ability scores by +2. This
evolution can be selected more than once. It can only be applied once to an individual ability
score, plus 1 additional time for every 6 levels the summoner possesses.'''

[[entry]]
id = "ref/evolution/bite"
anchor = "bite"
print = '''
1-Point Evolutions: The following evolutions cost 1 point from the eidolon's evolution pool.

An eidolon's maw is full of razor-sharp teeth, giving it a [bite attack](ref/umr/natural-attacks).
This attack is a primary attack. The bite deals 1d6 points of damage (1d8 if Large, 2d6 if Huge). If
the eidolon already has a bite attack, this evolution allows it to deal 1-1/2 times its Strength
modifier on damage rolls made with its bite.'''

[[entry]]
id = "ref/evolution/blindsense"
anchor = "blindsense"
print = '''
3-Point Evolutions: The following evolutions cost 3 points from the eidolon's evolution pool.

An eidolon's senses become incredibly acute, giving it [blindsense](ref/umr/blindsense) out to a
range of 30 feet. This ability allows the eidolon to pinpoint the location of creatures that it
cannot see without having to make a Perception check, but such creatures still have total
[concealment](ref/rule/concealment) from the eidolon. Visibility still affects the eidolon's
movement and it is still denied its Dexterity bonus to Armor Class against attacks from creatures it
cannot see. The summoner must be at least 9th level before selecting this evolution.'''

[[entry]]
id = "ref/evolution/blindsight"
anchor = "blindsight"
print = '''
4-Point Evolutions: The following evolutions cost 4 points from the eidolon's evolution pool.

An eidolon's senses sharpen even further, granting it [blindsight](ref/umr/blindsight) out to a
range of 30 feet. The eidolon can maneuver and attack as normal, ignoring darkness, invisibility,
and most forms of [concealment](ref/rule/concealment) as long as it has line of effect to the
target. The eidolon must possess the [blindsense](ref/evolution/blindsense) evolution to take this
evolution. The summoner must be at least 11th level before selecting this evolution.'''

[[entry]]
id = "ref/evolution/breath-weapon"
anchor = "breath-weapon"
print = '''
4-Point Evolutions: The following evolutions cost 4 points from the eidolon's evolution pool.

An eidolon learns to exhale a cone or line of magical energy, gaining a breath weapon. Select either
acid, cold, electricity, or fire. The eidolon can breathe a 30-foot cone (or 60-foot line) that
deals 1d6 points of damage of the selected type per HD it possesses. Those caught in the breath
weapon can attempt a Reflex save for half damage. The DC is equal to 10 + 1/2 the eidolon's HD + the
eidolon's Constitution modifier. The eidolon can use this ability once per day. The eidolon can use
this ability 1 additional time per day by spending an additional 1 evolution point (maximum 3/day).
The summoner must be at least 9th level before selecting this evolution.'''

[[entry]]
id = "ref/evolution/burrow"
anchor = "burrow"
print = '''
3-Point Evolutions: The following evolutions cost 3 points from the eidolon's evolution pool.

An eidolon grows thick and gnarled claws, allowing it to move through the earth. The eidolon gains a
burrow speed equal to 1/2 its base speed. It can use this speed to move through dirt, clay, sand,
and earth. It does not leave a hole behind, nor is its passage marked on the surface. The summoner
must be at least 9th level before selecting this evolution.'''

[[entry]]
id = "ref/evolution/claws"
anchor = "claws"
print = '''
1-Point Evolutions: The following evolutions cost 1 point from the eidolon's evolution pool.

An eidolon has a pair of vicious claws at the end of its [limbs](ref/evolution/limbs), giving it two [claw attacks](ref/umr/natural-attacks). These attacks are primary attacks. The claws deal 1d4 points of damage (1d6 if Large, 1d8 if Huge). The eidolon must have the limbs evolution to take this evolution. This evolution can only be applied to the limbs (legs) evolution once This evolution can be selected more than once, but the eidolon must possess an equal number of the limbs evolution.'''

[[entry]]
id = "ref/evolution/climb"
anchor = "climb"
print = '''
1-Point Evolutions: The following evolutions cost 1 point from the eidolon's evolution pool.

An eidolon becomes a skilled climber, gaining a climb speed equal to its base speed. This evolution
can be selected more than once. Each additional time it is selected, increase the eidolon's climb
speed by 20 feet.'''

[[entry]]
id = "ref/evolution/constrict"
anchor = "constrict"
print = '''
2-Point Evolutions: The following evolutions cost 2 points from the eidolon's evolution pool.

An eidolon gains powerful muscles that allow it to crush those it grapples. Whenever the eidolon
successfully grapples a foe using the
[grab](ref/carried/bestiary/rules/universal-monster-rules/grab) evolution, it deals additional
damage equal to the amount of damage dealt by the attack used by the
[grab](ref/carried/bestiary/rules/universal-monster-rules/grab) evolution. This evolution is only
available to eidolons of the serpentine base form.'''

[[entry]]
id = "ref/evolution/damage-reduction"
anchor = "damage-reduction"
print = '''
3-Point Evolutions: The following evolutions cost 3 points from the eidolon's evolution pool.

An eidolon's body becomes resistant to harm, granting it damage reduction. Choose one alignment:
chaotic, evil, good, or lawful. The eidolon gains DR 5 that can be bypassed by weapons that possess
the chosen alignment. The alignment must be opposite to one of the alignments possessed by the
eidolon. At 12th level, this protection can be increased to DR 10 by spending 2 additional evolution
points. The summoner must be at least 9th level before selecting this evolution.'''

[[entry]]
id = "ref/evolution/energy-attacks"
anchor = "energy-attacks"
print = '''
2-Point Evolutions: The following evolutions cost 2 points from the eidolon's evolution pool.

An eidolon's attacks become charged with energy. Pick one energy type: acid, cold, electricity, or
fire. All of the eidolon's natural attacks deal 1d6 points of energy damage of the chosen type on a
successful hit. The summoner must be at least 5th level before selecting this evolution.'''

[[entry]]
id = "ref/evolution/fast-healing"
anchor = "fast-healing"
print = '''
4-Point Evolutions: The following evolutions cost 4 points from the eidolon's evolution pool.

An eidolon's body gains the ability to heal wounds very quickly, giving it
[fast healing](ref/umr/fast-healing) 1. The eidolon heals 1 point of damage each round, just like
natural healing. Fast healing does not restore hit points lost due to starvation, thirst, or
suffocation, nor does it allow the eidolon to regrow lost body parts (or to reattach severed parts).
Fast healing functions as long as the eidolon is alive. This fast healing does not function when the
eidolon is not on the same plane as its summoner. This healing can be increased by 1 per round for
every 2 additional evolution points spent (maximum 5). The summoner must be at least 11th level
before selecting this evolution.'''

[[entry]]
id = "ref/evolution/flight"
anchor = "flight"
print = '''
2-Point Evolutions: The following evolutions cost 2 points from the eidolon's evolution pool.

An eidolon grows large wings, like those of a bat, bird, insect, or dragon, gaining the ability to
fly. The eidolon gains a fly speed equal to its base speed. The eidolon's maneuverability depends on
it size. Medium or smaller eidolons have good maneuverability. Large eidolons have average
maneuverability, while Huge eidolons have poor maneuverability. For 2 additional evolution points,
the eidolon flies by means of magic. It loses its wings, but its maneuverability increases to
perfect. Flying via magic means makes this a supernatural ability. The eidolon's fly speed can be
increased by spending additional evolution points, gaining a 20-foot increase to fly speed for each
additional point spent. The summoner must be at least 5th level before selecting this evolution.'''

[[entry]]
id = "ref/evolution/frightful-presence"
anchor = "frightful-presence"
print = '''
3-Point Evolutions: The following evolutions cost 3 points from the eidolon's evolution pool.

An eidolon becomes unsettling to its foes, gaining the
[frightful presence](ref/umr/frightful-presence) ability. The eidolon can activate this ability as
part of an offensive action, such as a [charge](ref/rule/charge) or attack. Opponents within 30 feet
of the eidolon must make a Will save or become [shaken](ref/misc/shaken) for 3d6 rounds. The DC of
this save is equal to 10 + 1/2 the eidolon's HD + the eidolon's Charisma modifier. If the eidolon
has at least 4 more Hit Dice than an opponent, that opponent becomes
[frightened](ref/misc/frightened) instead. Foes with more HD than the eidolon are immune to this
effect. The summoner must be at least 11th level before selecting this evolution.'''

[[entry]]
id = "ref/evolution/gills"
anchor = "gills"
print = '''
1-Point Evolutions: The following evolutions cost 1 point from the eidolon's evolution pool.

An eidolon has gills and can breathe underwater indefinitely.'''

[[entry]]
id = "ref/evolution/gore"
anchor = "gore"
print = '''
2-Point Evolutions: The following evolutions cost 2 points from the eidolon's evolution pool.

An eidolon grows a number of horns on its head, giving it a [gore attack](ref/umr/natural-attacks).
This attack is a primary attack. The gore deals 1d6 points of damage (1d8 if Large, 2d6 if Huge).'''

[[entry]]
id = "ref/evolution/grab"
anchor = "grab"
print = '''
2-Point Evolutions: The following evolutions cost 2 points from the eidolon's evolution pool.

An eidolon becomes adept at grappling foes, gaining the [grab](ref/umr/grab) ability. Pick bite, claw, pincers, slam, tail slap, or tentacle attacks. Whenever the eidolon makes a successful attack of the selected type, it can attempt a free combat maneuver check. If successful, the eidolon [grapples](ref/rule/grapple) the target. This ability only works on creatures of a size one category smaller than the eidolon or smaller. Eidolons with this evolution receive a +4 bonus on CMB checks made to grapple.'''

[[entry]]
id = "ref/evolution/immunity"
anchor = "immunity"
print = '''
2-Point Evolutions: The following evolutions cost 2 points from the eidolon's evolution pool.

An eidolon's body becomes extremely resilient to one energy type, gaining [immunity](ref/umr/immunity) to that type. Pick one energy type: acid, cold, electricity, fire, or sonic. The eidolon gains immunity to that energy type. This evolution can be selected more than once. Its effects do not stack. Each time it applies to a different energy type. The summoner must be at least 7th level before selecting this evolution.'''

[[entry]]
id = "ref/evolution/improved-damage"
anchor = "improved-damage"
print = '''
1-Point Evolutions: The following evolutions cost 1 point from the eidolon's evolution pool.

One of the eidolon's natural attacks is particularly deadly. Select one natural attack form and
[increase the damage die](ref/misc/damage-die-adjustments) type by one step. This evolution can be
selected more than once. Its effects do not stack. Each time an eidolon selects this evolution, it
applies to a different natural attack.'''

[[entry]]
id = "ref/evolution/improved-natural-armor"
anchor = "improved-natural-armor"
print = '''
1-Point Evolutions: The following evolutions cost 1 point from the eidolon's evolution pool.

An eidolon's hide grows thick fur, rigid scales, or bony plates, giving it a +2 bonus to its natural armor. This evolution can be taken once for every five levels the summoner possesses.'''

[[entry]]
id = "ref/evolution/large"
anchor = "large"
print = '''
4-Point Evolutions: The following evolutions cost 4 points from the eidolon's evolution pool.

An eidolon grows in size, becoming Large. The eidolon gains a +8 bonus to Strength, a +4 bonus to Constitution, and a +2 bonus to its natural armor. It takes a -2 penalty to its Dexterity. This size change also gives the creature a -1 size penalty to its AC and on attack rolls, a +1 bonus to its CMB and CMD, a -2 penalty on Fly skill checks, and a -4 penalty on Stealth skill checks. If the eidolon has the biped base form, it also gains 10- foot [reach](ref/evolution/reach). Any reach evolutions the eidolon possesses are added to this total. The eidolon must be Medium to take this evolution. The summoner must be at least 8th level before selecting this evolution.

If 6 additional evolution points are spent, the eidolon instead becomes Huge. The eidolon gains a +16 bonus to Strength, a +8 bonus to Constitution, and a +5 bonus to its natural armor. It takes a -4 penalty to its Dexterity. This size change also give the creature a -2 size penalty to its AC and attack rolls, a +2 bonus to its CMB and CMD, 10-foot reach, a -4 penalty on Fly skill checks, and a -8 penalty on Stealth skill checks. If the eidolon has the biped base form, its reach increases to 15 feet (10 feet for all other base forms). Any reach evolutions the eidolon possesses are added to this total. These bonuses and penalties replace, and do not stack with, those gained from becoming Large. The summoner must be at least 13th level before selecting this option.

The [ability increase](ref/evolution/ability-increase) evolution costs twice as much (4 evolution points) when adding to the Strength or Constitution scores of a Large or Huge eidolon.'''

[[entry]]
id = "ref/evolution/limbs"
anchor = "limbs"
print = '''
2-Point Evolutions: The following evolutions cost 2 points from the eidolon's evolution pool.

An eidolon grows an additional pair of limbs. These limbs can take one of two forms. They can be
made into legs, complete with feet. Each pair of legs increases the eidolon's base speed by 10 feet.
Alternatively, they can be made into arms, complete with hands. The eidolon does not gain any
additional natural attacks for an additional pair of arms, but it can take other evolutions that add
additional attacks (such as [claws](ref/evolution/claws) or a [slam](ref/evolution/slam)). Arms that
have hands can be used to wield weapons, if the eidolon is proficient. This evolution can be
selected more than once.'''

[[entry]]
id = "ref/evolution/magic-attacks"
anchor = "magic-attacks"
print = '''
1-Point Evolutions: The following evolutions cost 1 point from the eidolon's evolution pool.

An eidolon is infused with magic, allowing it to treat all of its natural attacks as if they were
magic for the purpose of overcoming [damage reduction](ref/rule/damage-reduction). If the summoner
is 10th level or higher, all of the eidolon's weapons are treated as the alignment of the eidolon
for the purpose of overcoming [damage reduction](ref/rule/damage-reduction).'''

[[entry]]
id = "ref/evolution/mount"
anchor = "mount"
print = '''
1-Point Evolutions: The following evolutions cost 1 point from the eidolon's evolution pool.

An eidolon is properly skilled and formed to serve as a [combat-trained](ref/rule/mounted-combat) mount. The eidolon must be at least one size category larger than its rider. This evolution is only available to eidolons of the quadruped and serpentine base forms.'''

[[entry]]
id = "ref/evolution/pincers"
anchor = "pincers"
print = '''
1-Point Evolutions: The following evolutions cost 1 point from the eidolon's evolution pool.

An eidolon grows a large pincers at the end of one pair of its [limbs](ref/evolution/limbs), giving it two pincer attacks. These attacks are secondary attacks. The pincers deal 1d6 points of damage (1d8 if Large, 2d6 if Huge). Eidolons with the [grab](ref/evolution/grab) evolution linked to pincers gain a +2 bonus on CMB checks made to grapple. The eidolon must have the limbs (arms) evolution to take this evolution. Alternatively, the eidolon can replace the [claws](ref/evolution/claws) from its base form with pincers (this still costs 1 evolution point). This evolution can be selected more than once, but the eidolon must possess an equal number of the limbs evolution.'''

[[entry]]
id = "ref/evolution/poison"
anchor = "poison"
print = '''
2-Point Evolutions: The following evolutions cost 2 points from the eidolon's evolution pool.

An eidolon secretes toxic venom, gaining a poison attack. Pick one bite or sting attack. Whenever the selected attack hits, the target is poisoned. Eidolon poison—_type_ poison (injury); _save_ Fort negates; _frequency_ 1/round for 4 rounds; _effect_ 1d4 Str damage; _cure_ 1 save. The save DC is equal to 10 + 1/2 the eidolon's HD + the eidolon's Constitution modifier. For 2 additional evolution points, this poison deals Constitution damage instead. This poison can be used no more than once per round. The summoner must be at least 7th level before selecting this evolution.'''

[[entry]]
id = "ref/evolution/pounce"
anchor = "pounce"
print = '''
1-Point Evolutions: The following evolutions cost 1 point from the eidolon's evolution pool.

An eidolon gains quick reflexes, allowing it to make a full attack after a charge. This evolution is
only available to eidolons of the quadruped base form.'''

[[entry]]
id = "ref/evolution/pull"
anchor = "pull"
print = '''
1-Point Evolutions: The following evolutions cost 1 point from the eidolon's evolution pool.

An eidolon gains the ability to pull creatures closer with a successful attack. Select one type of
natural attack. Whenever the eidolon makes a successful attack of the selected type, it can attempt
a free combat maneuver check. If successful, the target of the attack is pulled 5 feet closer to the
eidolon. This ability only works on creatures of a size equal to or smaller than the eidolon.
Creatures pulled in this way do not provoke attacks of opportunity. The eidolon must have a
[reach](ref/evolution/reach) of 10 feet or more to select this evolution. This evolution can be
selected more than once. Its effects do not stack. Each time an eidolon selects this evolution, it
applies to a different natural attack.'''

[[entry]]
id = "ref/evolution/push"
anchor = "push"
print = '''
1-Point Evolutions: The following evolutions cost 1 point from the eidolon's evolution pool.

An eidolon gains the ability to push creatures away with a successful attack. Select one type of
natural attack. Whenever the eidolon makes a successful attack of the selected type, it can attempt
a free combat maneuver check. If successful, the target of the attack is pushed 5 feet directly away
from the eidolon. This ability only works on creatures of a size equal to or smaller than the
eidolon. Creatures pushed in this way do not provoke attacks of opportunity. This evolution can be
selected more than once. Its effects do not stack. Each time an eidolon selects this evolution, it
applies to a different natural attack.'''

[[entry]]
id = "ref/evolution/rake"
anchor = "rake"
print = '''
2-Point Evolutions: The following evolutions cost 2 points from the eidolon's evolution pool.

An eidolon grows dangerous claws on its feet, allowing it to make 2 [rake](ref/umr/rake) attacks on
foes it is grappling. These attacks are [primary attacks](ref/umr/natural-attacks). The eidolon
receives these additional attacks each time it succeeds on a [grapple](ref/rule/grapple) check
against the target. These rake attacks deal 1d4 points of damage (1d6 if Large, 1d8 if Huge). This
evolution is only available to eidolons of the quadruped base form. This evolution counts as one
natural attack toward the eidolon's maximum. The summoner must be at least 4th level before
selecting this evolution.'''

[[entry]]
id = "ref/evolution/reach"
anchor = "reach"
print = '''
1-Point Evolutions: The following evolutions cost 1 point from the eidolon's evolution pool.

One of an eidolon's attacks is capable of striking at foes at a distance. Pick one attack. The
eidolon's reach with that attack increases by 5 feet.'''

[[entry]]
id = "ref/evolution/rend"
anchor = "rend"
print = '''
2-Point Evolutions: The following evolutions cost 2 points from the eidolon's evolution pool.

An eidolon learns to rip and tear the flesh of those it attacks with its
[claws](ref/evolution/claws), gaining the [rend](ref/umr/rend) ability. Whenever the eidolon makes
two successful claw attacks against the same target in 1 round, its claws latch onto the flesh and
deal extra damage. This damage is equal to the damage dealt by one claw attack plus 1-1/2 times the
eidolon's Strength modifier. The eidolon must possess the claws evolution to select this evolution.
The summoner must be at least 6th level before selecting this evolution.'''

[[entry]]
id = "ref/evolution/resistance"
anchor = "resistance"
print = '''
1-Point Evolutions: The following evolutions cost 1 point from the eidolon's evolution pool.

An eidolon's form takes on a resiliency to one particular energy type, which is usually reflected in its physical body (ashen hide for fire, icy breath for cold, and so on). Pick one energy type (acid, cold, electricity, fire, or sonic). The eidolon gains [resist](ref/umr/resistance) 5 against that energy type. This resistance increases by 5 for every 5 levels the summoner possesses, to a maximum of 15 at 10th level. This evolution can be selected more than once. Its effects do not stack. Each time an eidolon selects this evolution, it applies to a different energy type.'''

[[entry]]
id = "ref/evolution/scent"
anchor = "scent"
print = '''
1-Point Evolutions: The following evolutions cost 1 point from the eidolon's evolution pool.

An eidolon's sense of smell becomes quite acute. The eidolon gains the [scent](ref/umr/scent)
special quality, allowing it to detect opponents within 30 feet by sense of smell. If the opponent
is upwind, the range increases to 60 feet; if downwind, it drops to 15 feet. Strong scents can be
detected at twice the normal range. Scent does not allow the eidolon to precisely locate the
creature, only to detect its presence. It can detect the direction with a move action. The eidolon
can pinpoint the creature's location if it is within 5 feet. The eidolon can use scent to track
creatures (see page 304 of the _Bestiary_ for details).'''

[[entry]]
id = "ref/evolution/skilled"
anchor = "skilled"
print = '''
1-Point Evolutions: The following evolutions cost 1 point from the eidolon's evolution pool.

An eidolon becomes especially adept at a specific skill, gaining a +8 racial bonus on that skill.
This evolution can be selected more than once. Its effects do not stack. Each time an eidolon
selects this evolution, it applies to a different skill.'''

[[entry]]
id = "ref/evolution/slam"
anchor = "slam"
print = '''
1-Point Evolutions: The following evolutions cost 1 point from the eidolon's evolution pool.

An eidolon can deliver a devastating [slam attack](ref/umr/natural-attacks). This attack is a primary attack. The slam deals 1d8 points of damage (2d6 if Large, 2d8 if Huge). The eidolon must have the [limbs](ref/evolution/limbs) (arms) evolution to take this evolution. Alternatively, the eidolon can replace the [claws](ref/evolution/claws) from its base form with this slam attack (this still costs 1 evolution point). This evolution can be selected more than once, but the eidolon must possess an equal number of the limbs evolution.'''

[[entry]]
id = "ref/evolution/spell-resistance"
anchor = "spell-resistance"
print = '''
4-Point Evolutions: The following evolutions cost 4 points from the eidolon's evolution pool.

An eidolon is protected against magic, gaining spell resistance. The eidolon's spell resistance is equal to 11 + the summoner's level. This spell resistance does not apply to spells cast by the summoner. The summoner must be at least 9th level before selecting this evolution.'''

[[entry]]
id = "ref/evolution/sting"
anchor = "sting"
print = '''
1-Point Evolutions: The following evolutions cost 1 point from the eidolon's evolution pool.

An eidolon possesses a long, barbed stinger at the end of its [tail](ref/evolution/tail), granting
it a [sting attack](ref/umr/natural-attacks). This attack is a primary attack. The sting deals 1d4
points of damage (1d6 if Large, 1d8 if Huge). The eidolon must possess the tail evolution to take
this evolution. This evolution can be selected more than once, but the eidolon must possess an equal
number of the tail evolution.'''

[[entry]]
id = "ref/evolution/swallow-whole"
anchor = "swallow-whole"
print = '''
3-Point Evolutions: The following evolutions cost 3 points from the eidolon's evolution pool.

An eidolon gains the [swallow whole](ref/umr/swallow-whole) ability, giving it the ability to
consume its foes. If the eidolon begins its turn with a creature
[grappled](ref/rule/grapple-conditions) using its bite attack (see the
[grab](ref/carried/bestiary/rules/universal-monster-rules/grab) evolution), it can attempt a combat
maneuver check to swallow the creature. The creature can be up to one size category smaller than the
eidolon. Swallowed creatures take damage equal to the eidolon's bite damage each round plus 1d6
points of bludgeoning damage. A swallowed creature keeps the grappled condition, but can attempt to
cut its way free with a light slashing or piercing weapon. The amount of damage needed to cut free
is equal to 1/10 the eidolon's total hit points. The eidolon's AC against these attacks is equal to
10 + 1/2 its natural armor bonus. If a swallowed creature cuts its way out, the eidolon loses this
ability until it heals this damage. Alternatively, the swallowed creature can attempt to escape the
grapple as normal. Success indicates that it has returned to the eidolon's mouth, where it can
attempt to escape or be swallowed again. The eidolon must possess the [grab](ref/evolution/grab)
evolution, tied to a bite attack, to take this evolution. The summoner must be at least 9th level
before selecting this evolution.'''

[[entry]]
id = "ref/evolution/swim"
anchor = "swim"
print = '''
1-Point Evolutions: The following evolutions cost 1 point from the eidolon's evolution pool.

An eidolon gains webbed hands, feet, or powerful flippers, giving it a swim speed equal to its base
speed. This evolution does not give the eidolon the ability to breathe underwater. This evolution
can be selected more than once. Each additional time it is selected, increase the eidolon's swim
speed by 20 feet.'''

[[entry]]
id = "ref/evolution/tail"
anchor = "tail"
print = '''
1-Point Evolutions: The following evolutions cost 1 point from the eidolon's evolution pool.

An eidolon grows a long, powerful tail. This grants it a +2 racial bonus on Acrobatics checks made
to balance on a surface. This evolution can be selected more than once.'''

[[entry]]
id = "ref/evolution/tail-slap"
anchor = "tail-slap"
print = '''
1-Point Evolutions: The following evolutions cost 1 point from the eidolon's evolution pool.

An eidolon can use its [tail](ref/evolution/tail) to bash nearby foes, granting it a
[tail slap attack](ref/umr/natural-attacks). This attack is a secondary attack. The tail slap deals
1d6 points of damage (1d8 if Large, 2d6 if Huge). The eidolon must possess the tail evolution to
take this evolution. This evolution can be selected more than once, but the eidolon must possess an
equal number of the tail evolution.'''

[[entry]]
id = "ref/evolution/tentacle"
anchor = "tentacle"
print = '''
1-Point Evolutions: The following evolutions cost 1 point from the eidolon's evolution pool.

An eidolon possesses a long, sinuous tentacle, granting it a
[tentacle attack](ref/umr/natural-attacks). This attack is a secondary attack. The tentacle attack
deals 1d4 points of damage (1d6 if Large, 1d8 if Huge). This evolution can be selected more than
once.'''

[[entry]]
id = "ref/evolution/trample"
anchor = "trample"
print = '''
2-Point Evolutions: The following evolutions cost 2 points from the eidolon's evolution pool.

An eidolon gains the ability to crush its foes underfoot, gaining the [trample](ref/umr/trample)
ability. As a full-round action, the eidolon can [overrun](ref/rule/overrun) any creature that is at
least one size smaller than itself. This works like the overrun combat maneuver, but the eidolon
does not need to make a check, it merely has to move over opponents in its path. The creatures take
1d6 points of damage (1d8 if Large, 2d6 if Huge), plus 1-1/2 times the eidolon's Strength modifier.
Targets of the trample can make attacks of opportunity at a -4 penalty. If a target forgoes the
attack of opportunity, it can make a Reflex save for half damage. The DC of this save is 10 + 1/2
the eidolon's HD + the eidolon's Strength modifier. A trampling eidolon can only deal trampling
damage to a creature once per round. This evolution is only available to eidolons of the biped or
quadruped base forms.'''

[[entry]]
id = "ref/evolution/tremorsense"
anchor = "tremorsense"
print = '''
2-Point Evolutions: The following evolutions cost 2 points from the eidolon's evolution pool.

An eidolon becomes attuned to vibrations in the ground, gaining [tremorsense](ref/umr/tremorsense)
out to a range of 30 feet. This works like the [blindsense](ref/evolution/blindsense) evolution, but
only if both the eidolon and the creature to be pinpointed are in contact with the ground. The
summoner must be at least 7th level before selecting this evolution.'''

[[entry]]
id = "ref/evolution/trip"
anchor = "trip"
print = '''
2-Point Evolutions: The following evolutions cost 2 points from the eidolon's evolution pool.

An eidolon becomes adept at knocking foes to the ground with its [bite](ref/evolution/bite),
granting it a [trip](ref/rule/trip) attack. Whenever the eidolon makes a successful bite attack of
the selected type, it can attempt a free combat maneuver check. If successful, the target is knocked
[prone](ref/rule/prone). If the check fails, the eidolon is not tripped in return. This ability only
works on creatures of a size equal to or smaller than the eidolon. The eidolon must possess the bite
evolution to select this evolution.'''

[[entry]]
id = "ref/evolution/weapon-training"
anchor = "weapon-training"
print = '''
2-Point Evolutions: The following evolutions cost 2 points from the eidolon's evolution pool.

An eidolon learns to use a weapon, gaining
[Simple Weapon Proficiency](ref/feat/simple-weapon-proficiency) as a bonus feat. If 2 additional
evolution points are spent, it gains proficiency with all martial weapons as well.'''

[[entry]]
id = "ref/evolution/web"
anchor = "web"
print = '''
3-Point Evolutions: The following evolutions cost 3 points from the eidolon's evolution pool.

An eidolon gains a pair of spinnerets, giving it the ability to spin webs. The eidolon can use these
webs to support itself plus up to one creature of the same size. It can throw webbing as a ranged
touch attack up to 8 times per day, [entangling](ref/rule/entangled) a creature up to one size
larger than the eidolon. The webbing has a range of 50 feet and a 10-foot range increment. Creatures
entangled by the web can escape with an [Escape Artist](ref/skill/escape-artist) check or a Strength
check (at a -4 penalty). The DC of these checks is equal to 10 + 1/2 the eidolon's HD + the
eidolon's Con modifier. The webs have a [Hardness](ref/umr/hardness) of 0 and a number of hits
points equal to the eidolon's total Hit Dice. The eidolon can [climb](ref/evolution/climb) its own
webs at its climb speed and can pinpoint any creature touching its webs. The eidolon must possess
the climb evolution to take this evolution. The summoner must be at least 7th level before selecting
this evolution.'''

[[entry]]
id = "ref/evolution/wing-buffet"
anchor = "wing-buffet"
print = '''
1-Point Evolutions: The following evolutions cost 1 point from the eidolon's evolution pool.

An eidolon learns to use its wings to batter foes, granting it two wing buffet attacks. These
attacks are secondary attacks. The wing buffets deal 1d4 points of damage (1d6 if Large, 1d8 if
Huge). The eidolon must possess the [flight](ref/evolution/flight) evolution, with wings, to select
this evolution.'''

[[entry]]
id = "ref/hex/agony"
anchor = "agony"
print = '''
With a quick incantation, a witch can place this hex on one creature within 60 feet, causing them to
suffer intense pain. The target is [nauseated](ref/misc/nauseated) for a number of rounds equal to
the witch's level. A Fortitude save negates this effect. If the saving throw is failed, the target
can attempt a new save each round to end the effect. Whether or not the save is successful, a
creature cannot be the target of this hex again for 1 day.'''

[[entry]]
id = "ref/hex/blight"
anchor = "blight"
print = "The witch can [curse](ref/rule/curses) an animal, plant creature, or plot of land, causing it to wither and die. Blighting an area takes 1 round, during which time the witch and her familiar must be in contact with the target. If it's used on a plot of land, the land begins to wither the following day, and over the next week all plants in the area die. Nothing will grow in that area so long as the curse persists. A witch can affect an area with a radius equal to her class level × 10 feet. Blighting a creature is a standard action that requires a melee touch attack. If used on a creature of the animal or plant type, the creature gains the following curse: Blight Hex—_type_ curse; _save_ Will negates; _frequency_ 1/day; _effect_ 1 Con damage. Both types of curse can be removed with a _[remove curse](ref/spell/remove-curse)_ or similar magic, using the save DC as the DC to remove the curse. A witch can only have one blight in effect at a time. If another blight hex is made, the first immediately ends."

[[entry]]
id = "ref/hex/cackle"
anchor = "cackle"
print = "A witch can cackle madly as a move action. Any creature that is within 30 feet that is under the effects of an [agony](ref/hex/agony) hex, [charm](ref/hex/charm) hex, [evil eye](ref/hex/evil-eye) hex, [fortune](ref/hex/fortune) hex, or [misfortune](ref/hex/misfortune) hex caused by the witch has the duration of that hex extended by 1 round."

[[entry]]
id = "ref/hex/cauldron"
anchor = "cauldron"
print = '''
The witch receives [Brew Potion](ref/feat/brew-potion) as a bonus feat and a +4 insight bonus on
Craft (alchemy) skill checks.'''

[[entry]]
id = "ref/hex/charm"
anchor = "charm"
print = '''
A witch can charm an animal or humanoid creature within 30 feet by beckoning and speaking soothing
words. This improves the attitude of an animal or humanoid creature by 1 step, as if the witch had
successfully used the [Diplomacy](ref/skill/diplomacy) skill. The effect lasts for a number of
rounds equal to the Witch's Intelligence modifier. A Will save negates this effect. Whether or not
the save is successful, a creature cannot be the target of this hex again for 1 day. At 8th level,
this effect improves the attitude of the target creature by 2 steps. This is a mind-affecting charm
effect.'''

[[entry]]
id = "ref/hex/coven"
anchor = "coven"
print = '''
The witch counts as a [hag](ref/family/hag) for the purpose of joining a hag's coven. The coven must
contain at least one hag. In addition, whenever the witch with this hex is within 30 feet of another
witch with this hex, she can use the [aid another](ref/rule/aid-another) action to grant a +1 bonus
to the other witch's caster level for 1 round. This bonus applies to the witch's spells and all of
her hexes.'''

[[entry]]
id = "ref/hex/death-curse"
anchor = "death-curse"
print = '''
This powerful hex seizes a creature's heart, causing death within just a few moments. This hex has a
range of 30 feet. The hexed creature receives a Will save to negate the effect. If this save is
failed, the creature becomes [fatigued](ref/misc/fatigued) the first round of the hex. On the second
round of the hex, the creature becomes [exhausted](ref/misc/exhausted). On the third round, the
creature dies unless it succeeds at a Fort save. Creatures that fail the first save but succeed at
the second remain exhausted and take 4d6 points of damage + 1 point of damage per level of the
witch. Slaying the witch that hexed the creature ends the effect, but any fatigue or exhaustion
remains. Whether or not the saves are successful, a creature cannot be the target of this hex again
for 1 day.'''

[[entry]]
id = "ref/hex/disguise"
anchor = "disguise"
print = "A witch can change her appearance for a number of hours equal to her class level, as if using _[disguise self](ref/spell/disguise-self)_. These hours do not need to be consecutive, but they must be spent in 1-hour increments."

[[entry]]
id = "ref/hex/eternal-slumber"
anchor = "eternal-slumber"
print = '''
The witch can touch a creature, causing it to drift off into a permanent slumber. The creature
receives a Will save to negate this effect. If the save fails, the creature falls asleep and cannot
be woken. The effect can only be removed with a _[wish](ref/spell/wish)_ or similar magic, although
slaying the witch ends the effect. The witch can use this ability to poison food or drink, causing
those who ingest it to make a save or fall into an eternal slumber. She can only have one such dose
of poison at any one time, and it loses its potency after 1 minute if not consumed. Whether or not
the save is successful, a creature cannot be the target of this hex again for 1 day.'''

[[entry]]
id = "ref/hex/evil-eye"
anchor = "evil-eye"
print = '''
The witch can cause doubt to creep into the mind of a foe within 30 feet that she can see. The
target takes a -2 penalty on one of the following (witch's choice): AC, ability checks, attack
rolls, saving throws, or skill checks. This hex lasts for a number of rounds equal to 3 + the
witch's Intelligence modifier. A Will save reduces this to just 1 round. This is a mind-affecting
effect. At 8th level the penalty increases to -4.'''

[[entry]]
id = "ref/hex/flight"
anchor = "flight"
print = '''
The witch grows lighter as she gains power, eventually gaining the ability to [fly](ref/spell/fly).
At 1st level, the witch can use _[feather fall](ref/spell/feather-fall)_ at will and gains a +4
racial bonus on Swim checks. At 3rd level, she can cast _[levitate](ref/spell/levitate)_ once per
day. At 5th level, she can fly, as per the spell, for a number of minutes per day equal to her
level. These minutes do not need to be consecutive, but they must be spent in 1-minute increments.
This hex only affects the witch.'''

[[entry]]
id = "ref/hex/forced-reincarnation"
anchor = "forced-reincarnation"
print = '''
The witch causes a creature within 30 feet to die and be immediately _reincarnated_ into a new body.
A Will save negates this effect. Those that fail are slain and immediately brought back to life with
the spell _[reincarnate](ref/spell/reincarnate)_. Whether or not the save is successful, a creature
cannot be the target of this hex again for 1 day.'''

[[entry]]
id = "ref/hex/fortune"
anchor = "fortune"
print = "The witch can grant a creature within 30 feet a bit of good luck for 1 round. The target can call upon this good luck once per round, allowing him to reroll any ability check, attack roll, saving throw, or skill check, taking the better result. He must decide to use this ability before the first roll is made. At 8th level and 16th level, the duration of this hex is extended by 1 round. Once a creature has benefited from the fortune hex, it cannot benefit from it again for 24 hours."

[[entry]]
id = "ref/hex/hags-eye"
anchor = "hag-s-eye"
print = "A witch with this hex can create a magic sensor that she can see through. This functions as per the spell _[arcane eye](ref/spell/arcane-eye)_. If the witch has the [coven](ref/hex/coven) hex, all other"

[[entry]]
id = "ref/hex/healing"
anchor = "healing"
print = '''
A witch can soothe the wounds of those she touches. This acts as a
_[cure light wounds](ref/spell/cure-light-wounds)_ spell, using the witch's caster level. Once a
creature has benefited from the healing hex, it cannot benefit from it again for 24 hours. At 5th
level, this hex acts like _[cure moderate wounds](ref/spell/cure-moderate-wounds)_.'''

[[entry]]
id = "ref/hex/life-giver"
anchor = "life-giver"
print = "Once per day the witch can, as a full round action, touch a dead creature and bring it back to life. This functions as _[resurrection](ref/spell/resurrection)_, but it does not require a material component."

[[entry]]
id = "ref/hex/major-healing"
anchor = "major-healing"
print = '''
By calling upon eerie powers, the witch's touch can mend even the most terrible wounds of those she
touches. This acts as _[cure serious wounds](ref/spell/cure-serious-wounds)_, using the witch's
caster level. Once a creature has benefited from the major healing hex, it cannot benefit from it
again for 24 hours. At 15th level, this hex acts like
_[cure critical wounds](ref/spell/cure-critical-wounds)_.'''

[[entry]]
id = "ref/hex/misfortune"
anchor = "misfortune"
print = "The witch can cause a creature within 30 feet to suffer grave misfortune for 1 round. Anytime the creature makes an ability check, attack roll, saving throw, or skill check, it must roll twice and take the worse result. A Will save negates this hex. At 8th level and 16th level, the duration of this hex is extended by 1 round. This hex affects all rolls the target must make while it lasts. Whether or not the save is successful, a creature cannot be the target of this hex again for 1 day."

[[entry]]
id = "ref/hex/natural-disaster"
anchor = "natural-disaster"
print = '''
A witch using this hex calls down the forces of nature to wreak havoc on an area. This functions as
a _[storm of vengeance](ref/spell/storm-of-vengeance)_ combined with an
_[earthquake](ref/spell/earthquake)_ that occurs on the second round of the effect (while acid is
raining from the sky). A witch must concentrate for the duration of this effect. If disrupted, the
effect immediately ends. A witch can only use this ability once per day.'''

[[entry]]
id = "ref/hex/nightmares"
anchor = "nightmares"
print = '''
Calling upon fell powers, a witch can place a hex on a creature within 60 feet that causes its sleep
to be tormented by terrible nightmares. This functions as the spell
_[nightmare](ref/spell/nightmare)_ each time the affected creature attempts to rest. A Will save
negates this effect. If the save is failed, the target must make a new save each night or be unable
to rest.'''

[[entry]]
id = "ref/hex/retribution"
anchor = "retribution"
print = '''
A witch can place a retribution hex on a creature within 60 feet, causing terrible wounds to open
across the target's flesh whenever it deals damage to another creature in melee. Immediately after
the hexed creature deals damage in melee, it takes half that damage (round down). This damage
bypasses any resistances, immunities, or [damage reduction](ref/rule/damage-reduction) the creature
possesses. This effect lasts for a number of rounds equal to the witch's Intelligence modifier. A
Will save negates this effect.'''

[[entry]]
id = "ref/hex/slumber"
anchor = "slumber"
print = "A witch can cause a creature within 30 feet to fall into a deep, magical [sleep](ref/spell/sleep), as per the spell _sleep_. The creature receives a Will save to negate the effect. If the save fails, the creature falls asleep for a number of rounds equal to the witch's level. This hex can affect a creature of any HD. The creature will not wake due to noise or light, but others can rouse it with a standard action."

[[entry]]
id = "ref/hex/tongues"
anchor = "tongues"
print = '''
A witch with this hex can understand any spoken language for a number of minutes per day equal to
her level, as _[comprehend languages](ref/spell/comprehend-languages)._ This duration does not need
to be consecutive, but it must be spent in 1-minute increments. At 5th level, a witch can use this
ability to speak any language, as per _[tongues](ref/spell/tongues)_.'''

[[entry]]
id = "ref/hex/vision"
anchor = "vision"
print = '''
A witch with the vision hex can grant a glimpse of the future to a creature touched. Granting a
vision takes 1 minute, during which time the witch and the target must remain in contact with one
another. At the end of this time, the subject receives a brief image of the future, usually no more
than 1 year from the time of the vision, subject to GM discretion. This is only one possible version
of the future, making such visions unreliable at best. Most visions are slanted toward the alignment
of the witch that granted them. For example, the visions granted by a chaotic evil witch often show
scenes of death and destruction, while those of a neutral good witch tend to be of joyous events or
occasions. A creature cannot be subject to another vision until the current vision has either come
to pass or been prevented. A witch cannot use this ability on herself. Unwilling creatures receive a
Will save to negate the vision.'''

[[entry]]
id = "ref/hex/ward"
anchor = "ward"
print = "A witch can use this hex to place a protective ward over one creature. The warded creature receives a +2 deflection bonus to AC and a +2 resistance bonus on saving throws. This ward lasts until the warded creature is hit or fails a saving throw. A witch knows when a warded creature is no longer protected. A witch can have only one ward active at a time. If the witch uses this ability again, the previous ward immediately ends. A witch cannot use this ability on herself. At 8th level and 16th level, the bonuses provided by this ward increase by +1."

[[entry]]
id = "ref/hex/waxen-image"
anchor = "waxen-image"
print = "The witch can spend a full-round action to create a crude and unnerving wax duplicate of a creature she can see within 30 feet. Once the image is complete, the subject must make a Will save. If the subject fails, the witch gains a small measure of control over the creature. Whenever she exercises this control, the creature receives a new Will save to end the effect. This effect occurs on the witch's turn and does not impede the creature's actions on its turn. The witch can use the waxen image a number of times equal to her Intelligence modifier before it melts. As a standard action, the witch can cause the subject to do any one of the following things: move up to the creature's speed in any direction, attack itself once with any weapon in hand (this attack automatically hits), lay down on the ground, or drop anything held. Alternatively, she can spend one of her uses to simply torture the image, causing the creature to be both [sickened](ref/misc/sickened) and [staggered](ref/misc/staggered) on its turn. As soon as the creature has succeeded on a saving throw against this effect, it is immune to it for 24 hours. The is an enchantment (compulsion) effect."

[[entry]]
id = "ref/hex/weather-control"
anchor = "weather-control"
print = '''
A witch with this hex can use _[control weather](ref/spell/control-weather)_ once per day, but
creating the weather takes 1 full hour of chanting, dancing, and communing with her familiar.'''

[[entry]]
id = "ref/ragepower/beast-totem"
anchor = "beast-totem"
print = "While raging, the barbarian gains a +1 natural armor bonus. This bonus increases by +1 for every four levels the barbarian has attained. A barbarian must have the [lesser beast totem](ref/ragepower/lesser-beast-totem) rage power to select this rage power. A barbarian must be at least 6th level to select this rage power."

[[entry]]
id = "ref/ragepower/boasting-taunt"
anchor = "boasting-taunt"
print = '''
While raging, the barbarian can incite a creature to attack her by making an
[Intimidate](ref/skill/intimidate) check to demoralize. If the check succeeds, the target is also
[shaken](ref/misc/shaken) as long as the barbarian is visible and raging or until it makes a melee
attack against the barbarian. The barbarian receives a +2 circumstance bonus on this check for every
alcoholic drink she has consumed during this rage. This is a language-dependent mind-affecting
effect, and it relies on audible components. The barbarian must be at least 6th level to select this
power.'''

[[entry]]
id = "ref/ragepower/brawler"
anchor = "brawler"
print = '''
While raging, the barbarian is treated as if she has
[Improved Unarmed Strike](ref/feat/improved-unarmed-strike). If she already has the feat, her
unarmed strikes deal 1d6 points of damage (1d4 if she is Small).'''

[[entry]]
id = "ref/ragepower/chaos-totem"
anchor = "chaos-totem"
print = '''
While raging, the barbarian's form becomes infused with chaos. She gains a +4 bonus on Escape Artist
checks and has a 25% chance to ignore extra damage from critical hits and sneak attacks. A barbarian
must have the [lesser chaos totem](ref/ragepower/lesser-chaos-totem) rage power to select this rage
power. A barbarian must be at least 6th level to select this rage power.'''

[[entry]]
id = "ref/ragepower/come-and-get-me"
anchor = "come-and-get-me"
print = '''
While raging, as a free action the barbarian may leave herself open to attack while preparing
devastating counterattacks. Enemies gain a +4 bonus on attack and damage rolls against the barbarian
until the beginning of her next turn, but every attack against the barbarian provokes an attack of
opportunity from her, which is resolved prior to resolving each enemy attack. A barbarian must be at
least 12th level to select this rage power.'''

[[entry]]
id = "ref/ragepower/disruptive"
anchor = "disruptive"
print = "When raging, the barbarian gains [Disruptive](ref/feat/disruptive) as a bonus feat. The barbarian\nmust have the [superstition](ref/ragepower/superstition)\\* rage power to select this rage power. A\nbarbarian must be at least 8th level to select this rage power."

[[entry]]
id = "ref/ragepower/elemental-rage"
anchor = "elemental-rage"
print = "While raging, all of the barbarian's melee attacks deal an additional 1d6 points of energy damage (acid, cold, electricity, or fire). The type is chosen when the barbarian begins her rage. A barbarian must have the [lesser elemental rage](ref/ragepower/lesser-elemental-rage) power to select this rage power. A barbarian must be at least 8th level to select this rage power. Note that the barbarian can still use her lesser elemental rage power while using this rage power, but she must select a different energy type."

[[entry]]
id = "ref/ragepower/energy-absorption"
anchor = "energy-absorption"
print = '''
While raging, the barbarian can absorb energy from a single attack of her chosen energy type once
per rage. She does not make a saving throw against the effect but takes no damage from it, instead
gaining 1 temporary hit point per 3 points of damage the attack would have inflicted. These
[temporary hit points](ref/rule/temporary-hit-points) last until the end of the barbarian's rage. A
barbarian must have the [greater energy resistance](ref/ragepower/greater-energy-resistance) rage
power to select this rage power. A barbarian must be at least 12th level to select this rage power.'''

[[entry]]
id = "ref/ragepower/energy-eruption"
anchor = "energy-eruption"
print = '''
While raging, the barbarian can absorb energy from a single attack and unleash it upon her enemies
once per rage. She does not make a saving throw against the effect but takes no damage from it. At
any point during the remainder of her rage she can unleash the stored energy as a breath weapon in
either a 60-foot line or 30-foot cone. The breath weapon inflicts damage equal to the damage from
the attack absorbed by the barbarian, but creatures within the area may make a Reflex save (DC 10 +
1/2 the barbarian's level + the barbarian's Constitution modifier) for half damage even if the
original effect did not allow a save. A barbarian must have the
[energy absorption](ref/ragepower/energy-absorption) rage power to select this rage power. A
barbarian must be at least 16th level to select this rage power.'''

[[entry]]
id = "ref/ragepower/energy-resistance"
anchor = "energy-resistance"
print = '''
While raging, the barbarian gains [resistance](ref/umr/resistance) to one energy type (acid, cold,
electricity, fire, or sonic) equal to 1/2 her barbarian level (minimum 1). The energy type is chosen
when this rage power is selected and it cannot be changed. This rage power can be selected more than
once. Its effects do not stack. Each time is applies to a different energy type.'''

[[entry]]
id = "ref/ragepower/ferocious-mount"
anchor = "ferocious-mount"
print = '''
While raging and mounted, the barbarian's mount also gains the benefits of rage (including greater
rage and mighty rage) as long as the barbarian is mounted or adjacent to it. While her mount is
raging in this way, she must spend one additional round of rage per round. She can elect not to pay
this cost, in which case her mount does not rage.'''

[[entry]]
id = "ref/ragepower/ferocious-trample"
anchor = "ferocious-trample"
print = '''
While raging and mounted, the barbarian's mount gains the [trample](ref/umr/trample) special attack.
This attack inflicts 1d8 points of damage for a Medium mount, 2d6 for a Large mount, or 2d8 for a
Huge mount, plus 1–1/2 times the mount's Strength modifier. A successful Reflex save (DC 10 + 1/2
the barbarian's level + the mount's Strength modifier) halves this damage. Creatures in the mount's
path or that threaten squares it passes through may make attacks of opportunity against either the
barbarian or the mount, but not both. A barbarian must have the
[ferocious mount](ref/ragepower/ferocious-mount) rage power to select this rage power. A barbarian
must be at least 8th level to select this rage power.'''

[[entry]]
id = "ref/ragepower/fiend-totem"
anchor = "fiend-totem"
print = '''
While raging, the barbarian sprouts dozens of wicked barbs from her body. Anyone striking the
barbarian with a melee weapon, an unarmed strike, or a natural weapon takes 1d6 points of piercing
damage. A barbarian must have the [lesser fiend totem](ref/ragepower/lesser-fiend-totem) rage power
to select this rage power. A barbarian must be at least 6th level to select this rage power.'''

[[entry]]
id = "ref/ragepower/flesh-wound"
anchor = "flesh-wound"
print = '''
Once per rage, the barbarian can try to avoid serious harm from an attack. The barbarian must make a
Fortitude save with a DC equal to the damage that would be dealt by the attack. The barbarian's
armor check penalty applies on this saving throw. If the save succeeds, the barbarian takes half
damage from the attack and the damage is nonlethal. The barbarian must elect to use this ability
after the attack roll is made, but before the damage is rolled. A barbarian must be at least 10th
level to select this rage power.'''

[[entry]]
id = "ref/ragepower/good-for-what-ails-you"
anchor = "good-for-what-ails-you"
print = '''
While raging, the barbarian who takes a drink of alcohol may attempt a new saving throw against one
of the following conditions that may be affecting her: blinded, confused, dazzled, deafened,
exhausted, fatigued, frightened, nauseated, panicked, shaken, or sickened. If she succeeds at the
save, the effect is suppressed for the duration of the rage. She also may attempt a new saving throw
if poisoned; a successful save counts against those required for a cure, but a failed save has no
ill effect.'''

[[entry]]
id = "ref/ragepower/greater-beast-totem"
anchor = "greater-beast-totem"
print = '''
While raging, the barbarian gains the [pounce](ref/umr/pounce) special ability, allowing her to make
a full attack at the end of a charge. In addition, the damage from her claws increases to 1d8 (1d6
if Small) and the claws deal ×3 damage on a critical hit. A barbarian must have the
[beast totem](ref/ragepower/beast-totem) rage power to select this rage power. A barbarian must be
at least 10th level to select this rage power.'''

[[entry]]
id = "ref/ragepower/greater-brawler"
anchor = "greater-brawler"
print = '''
While raging, the barbarian is treated as if she has
[Two-Weapon Fighting](ref/feat/two-weapon-fighting) when making unarmed strike attacks. A barbarian
must have the [brawler](ref/ragepower/brawler) rage power to select this rage power.'''

[[entry]]
id = "ref/ragepower/greater-chaos-totem"
anchor = "greater-chaos-totem"
print = '''
While raging, the barbarian gains DR/lawful equal to 1/2 her barbarian level. Her weapons and
natural weapons are considered chaotic for the purpose of overcoming
[damage reduction](ref/rule/damage-reduction). A barbarian must have the
[chaos totem](ref/ragepower/chaos-totem) rage power to select this rage power. A barbarian must be
at least 10th level to select this rage power.'''

[[entry]]
id = "ref/ragepower/greater-elemental-rage"
anchor = "greater-elemental-rage"
print = '''
While raging, all of the barbarian's critical hits made with melee weapons deal an additional 1d10
points of energy damage (2d10 if the weapon deals ×3 damage on a critical hit, 3d10 if the weapon
deals ×4 on a critical hit). The type of this damage is the same as the type chosen for the
[elemental rage](ref/ragepower/elemental-rage) power. A barbarian must have the elemental rage power
to select this rage power. A barbarian must be at least 12th level to select this rage power.'''

[[entry]]
id = "ref/ragepower/greater-energy-resistance"
anchor = "greater-energy-resistance"
print = '''
Once per rage, a barbarian can reduce damage by half from a single attack against which she has
[energy resistance](ref/ragepower/energy-resistance) (halve the damage, then apply resistance). A
barbarian must have the energy resistance rage power to select this rage power. A barbarian must be
at least 8th level to select this rage power.'''

[[entry]]
id = "ref/ragepower/greater-ferocious-mount"
anchor = "greater-ferocious-mount"
print = '''
While raging and mounted, the barbarian's mount gains the benefits of any rage powers that are
constant in effect when the barbarian is raging. It does not gain the benefit of any rage powers
that require actions to activate, even if they are free actions. A barbarian must have the
[ferocious mount](ref/ragepower/ferocious-mount) rage power to select this rage power. A barbarian
must be at least 8th level to select this rage power.'''

[[entry]]
id = "ref/ragepower/greater-ferocious-trample"
anchor = "greater-ferocious-trample"
print = '''
A barbarian's mount can affect creatures up to its own size with its
[ferocious trample](ref/ragepower/ferocious-trample). In addition, it can make an
[overrun](ref/rule/overrun) combat maneuver check as a free action against a creature that fails its
Reflex save (or chooses not to save in order to take an attack of opportunity) against its trample.
A barbarian must have the ferocious trample rage power to select this rage power. A barbarian must
be at least 12th level to select this rage power.'''

[[entry]]
id = "ref/ragepower/greater-fiend-totem"
anchor = "greater-fiend-totem"
print = '''
While raging, the barbarian is surrounded by an aura of menace. Good creatures adjacent to the
barbarian are [shaken](ref/misc/shaken) and take 2d6 points of slashing damage at the beginning of
the barbarian's turn as dozens of small cuts open across their flesh. Neutral creatures that are
adjacent to the barbarian are shaken, but do not take any damage. Evil creatures are unaffected. A
barbarian must have the [fiend totem](ref/ragepower/fiend-totem) rage power to select this rage
power. A barbarian must be at least 10th level to select this rage power.'''

[[entry]]
id = "ref/ragepower/greater-hurling"
anchor = "greater-hurling"
print = '''
As [hurling](ref/ragepower/hurling), but the barbarian can increase the range increment to 30 feet
or increase the size of a hurled object by two size categories. A barbarian must have the hurling
rage power to select this rage power. A barbarian must be at least 12th level to select this rage
power.'''

[[entry]]
id = "ref/ragepower/greater-spirit-totem"
anchor = "greater-spirit-totem"
print = "While raging, the spirits that surround the barbarian become dangerous to any enemy adjacent to the barbarian. Living enemies adjacent to the barbarian at the start of her turn take 1d8 points of negative energy damage. In addition, the spirit wisps can now attack foes that are up to 15 feet away from the barbarian and the slam attack deals 1d6 points of negative energy damage. A barbarian must have the [spirit totem](ref/ragepower/spirit-totem) rage power and be at least 10th level to select this rage power."

[[entry]]
id = "ref/ragepower/ground-breaker"
anchor = "ground-breaker"
print = '''
Once per rage, the barbarian can attack the floor around her as a standard action. This attack
automatically hits and deals damage normally. If the barbarian manages to deal more damage than the
floor's [hardness](ref/umr/hardness), the space she occupies and all of the squares adjacent to her
become [difficult terrain](ref/rule/terrain-and-obstacles). Creatures in these squares, except the
barbarian, must make a DC 15 Reflex save or be knocked [prone](ref/rule/prone). A barbarian must be
at least 6th level to select this rage power.'''

[[entry]]
id = "ref/ragepower/guarded-life"
anchor = "guarded-life"
print = '''
While raging, if the barbarian is reduced below 0 hit points, 1 hit point of lethal damage per
barbarian level is converted to nonlethal damage. If the barbarian is at negative hit points due to
lethal damage, she immediately [stabilizes](ref/misc/stable).'''

[[entry]]
id = "ref/ragepower/hurling"
anchor = "hurling"
print = '''
As [lesser hurling](ref/ragepower/lesser-hurling), but the barbarian can increase the range
increment to 20 feet or increase the size of a hurled object by one size category. A barbarian must
have the lesser hurling rage power to select this rage power. A barbarian must be at least 8th level
to select this rage power.'''

[[entry]]
id = "ref/ragepower/hurling-charge"
anchor = "hurling-charge"
print = '''
While raging and making a [charge](ref/rule/charge) attack, the barbarian may draw and throw a
hurled weapon during her charge, gaining the normal +2 attack roll bonus on the thrown weapon attack
as well as on the melee attack at the end of the charge. The barbarian must move at least 10 feet
before using a thrown weapon and at least 10 additional feet before making a melee attack at the end
of her charge. The barbarian must have a thrown weapon in hand or have one hand free at the
beginning of her charge. A barbarian must have the [lesser hurling](ref/ragepower/lesser-hurling)
rage power to select this rage power. A barbarian must be at least 6th level to select this rage
power.'''

[[entry]]
id = "ref/ragepower/inspire-ferocity"
anchor = "inspire-ferocity"
print = "While raging, the barbarian can use a move action to impart her [reckless abandon](ref/ragepower/reckless-abandon) modifier to all willing allies within 30 feet for a number of rounds equal to her Charisma modifier (minimum 1). A barbarian must have the reckless abandon rage power to select this rage power."

[[entry]]
id = "ref/ragepower/knockdown"
anchor = "knockdown"
print = "Once per rage, the barbarian can make a [trip](ref/rule/trip) attack against one target in place of a melee attack. If successful, the target takes damage equal to the barbarian's Strength modifier and is knocked [prone](ref/rule/prone). This does not provoke an attack of opportunity."

[[entry]]
id = "ref/ragepower/lesser-beast-totem"
anchor = "lesser-beast-totem"
print = '''
While raging, the barbarian gains two [claw attacks](ref/umr/natural-attacks). These attacks are
considered primary attacks and are made at the barbarian's full base attack bonus. The claws deal
1d6 points of slashing damage (1d4 if Small) plus the barbarian's Strength modifier.'''

[[entry]]
id = "ref/ragepower/lesser-chaos-totem"
anchor = "lesser-chaos-totem"
print = '''
While raging, the barbarian gains a +1 deflection bonus to AC against the attacks of lawful
creatures and a +1 resistance bonus on saving throws against confusion, insanity, polymorph, and
effects with the lawful descriptor. This bonus increases by +1 for each chaos totem rage power she
possesses.'''

[[entry]]
id = "ref/ragepower/lesser-elemental-rage"
anchor = "lesser-elemental-rage"
print = "As a swift action, the barbarian can cause her melee attacks to deal an additional 1d6 points of energy damage (acid, cold, electricity, or fire) for 1 round. A barbarian must be at least 4th level to select this rage power. This power can only be used once per rage."

[[entry]]
id = "ref/ragepower/lesser-fiend-totem"
anchor = "lesser-fiend-totem"
print = '''
While raging, the barbarian grows a pair of large horns, gaining a
[gore attack](ref/umr/natural-attacks). This attack is a primary attack (unless she is also
attacking with weapons, in which case it is a secondary attack) and is made at the barbarian's full
base attack bonus (-5 if it is a secondary attack). The gore attack deals 1d8 points of piercing
damage (1d6 if Small) plus the barbarian's Strength modifier (1/2 if it is a secondary attack).'''

[[entry]]
id = "ref/ragepower/lesser-hurling"
anchor = "lesser-hurling"
print = '''
As a full-round action while raging, the barbarian can lift and hurl an object up to one size
category smaller than herself with both hands or two size categories smaller with one hand as an
[improvised weapon](ref/misc/improvised-weapons) with a range increment of 10 feet. This inflicts
damage as a [falling object](ref/rule/falling-objects) plus the barbarian's Strength bonus. This
damage is halved if the object is not made of stone, metal, or similar material. This is a ranged
touch attack, and the target may attempt a Reflex save (DC 10 + 1/2 the barbarian's level + the
barbarian's Strength modifier) for half damage. The barbarian may apply
[Power Attack](ref/feat/power-attack) to this attack as a one- or two-handed weapon, as appropriate.'''

[[entry]]
id = "ref/ragepower/lesser-spirit-totem"
anchor = "lesser-spirit-totem"
print = '''
While raging, the barbarian is surrounded by spirit wisps that harass her foes. These spirits make
one slam attack each round against a living foe that is adjacent to the barbarian. This slam attack
is made using the barbarian's full base attack bonus, plus the barbarian's Charisma modifier. The
slam deals 1d4 points of negative energy damage, plus the barbarian's Charisma modifier.'''

[[entry]]
id = "ref/ragepower/liquid-courage"
anchor = "liquid-courage"
print = '''
While raging, the barbarian increases her morale bonus on saving throws against mind-affecting
effects by +1 for each alcoholic drink she consumes during her rage, to a maximum of +1 increase per
four barbarian levels.'''

[[entry]]
id = "ref/ragepower/overbearing-advance"
anchor = "overbearing-advance"
print = '''
While raging, the barbarian inflicts damage equal to her Strength bonus whenever she succeeds at an
[overrun](ref/rule/overrun) combat maneuver.'''

[[entry]]
id = "ref/ragepower/overbearing-onslaught"
anchor = "overbearing-onslaught"
print = '''
While raging, the barbarian may [overrun](ref/rule/overrun) more than one target per round, with a
-2 penalty on her CMB for each overrun check after the first. A barbarian must have the
[overbearing advance](ref/ragepower/overbearing-advance) rage power to select this rage power. A
barbarian must be at least 6th level to select this rage power.'''

[[entry]]
id = "ref/ragepower/reckless-abandon"
anchor = "reckless-abandon"
print = "While raging, the barbarian can take a -1 penalty to AC to gain a +1 bonus on attack rolls. The AC penalty increases by -1 and the attack roll bonus increases by +1 at 4th level and every four levels thereafter."

[[entry]]
id = "ref/ragepower/roaring-drunk"
anchor = "roaring-drunk"
print = '''
While raging, the barbarian gains a +1 morale bonus on Intimidate checks and to the save DC of any
fear effects she creates for each alcoholic drink she has consumed during her rage, to a maximum of
+1 per four barbarian levels.'''

[[entry]]
id = "ref/ragepower/smasher"
anchor = "smasher"
print = '''
Once per rage, whenever the barbarian makes an attack against an unattended object or a
[sunder](ref/rule/sunder) combat maneuver, she can ignore the object's [hardness](ref/umr/hardness).
This ability must be used before the attack roll or sunder check is made.'''

[[entry]]
id = "ref/ragepower/spellbreaker"
anchor = "spellbreaker"
print = "When raging, the barbarian gains [Spellbreaker](ref/feat/spellbreaker) as a bonus feat. A barbarian must have the [disruptive](ref/ragepower/disruptive) rage power and be at least 12th level to select this rage power."

[[entry]]
id = "ref/ragepower/spirit-steed"
anchor = "spirit-steed"
print = '''
While raging and mounted, the barbarian's mount gains DR/magic equal to 1/2 the barbarian's level.
The mount's natural weapons count as magical for the purpose of overcoming
[damage reduction](ref/rule/damage-reduction). A barbarian must have the
[ferocious mount](ref/ragepower/ferocious-mount) rage power to select this rage power. A barbarian
must be at least 6th level to select this rage power.'''

[[entry]]
id = "ref/ragepower/spirit-totem"
anchor = "spirit-totem"
print = '''
While raging, the spirits that surround the barbarian make it difficult for her enemies to see her.
The spirits grant the barbarian a 20% miss chance against ranged attacks and melee attacks made by
creatures that are not adjacent to the barbarian (typically due to reach). A barbarian must have the
[lesser spirit totem](ref/ragepower/lesser-spirit-totem) rage power to select this rage power. A
barbarian must be at least 6th level to select this rage power.'''

[[entry]]
id = "ref/ragepower/staggering-drunk"
anchor = "staggering-drunk"
print = '''
While raging, a barbarian gains a +1 dodge bonus to AC against attacks of opportunity for each
alcoholic drink she has consumed during her rage, to a maximum of +1 per four barbarian levels.'''

[[entry]]
id = "ref/ragepower/witch-hunter"
anchor = "witch-hunter"
print = "While raging, the barbarian gains a +1 bonus on damage rolls against creatures possessing spells or [spell-like abilities](ref/umr/spell-like-abilities). This damage bonus increases by +1 for every four levels the barbarian has obtained. A barbarian must have the [superstition](ref/ragepower/superstition) rage power to select this rage power."
