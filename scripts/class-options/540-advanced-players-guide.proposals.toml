[[entry]]
id = "ref/discovery/awakened-intellect"
anchor = "awakened-intellect"
print = "The alchemist's constant exposure to strange chemicals has expanded his mind. His Intelligence score permanently increases by 2 points."

[[entry]]
id = "ref/discovery/combine-extracts"
anchor = "combine-extracts"
print = "When the alchemist creates an extract, he can place two formulae into one extract. When the extract is consumed, both formulae take effect. This extract has a level two levels higher than the highest-level formulae placed in the extract. An alchemist must be at least 8th level before selecting this discovery."

[[entry]]
id = "ref/discovery/concentrate-poison"
anchor = "concentrate-poison"
print = "The alchemist can combine two doses of the same poison to increase their effects. This requires two doses of the poison and 1 minute of concentration. When completed, the alchemist has one dose of poison. The poison's frequency is extended by 50% and the save DC increases by +2. This poison must be used within 1 hour of its creation or it is ruined."

[[entry]]
id = "ref/discovery/concussive-bomb"
anchor = "concussive-bomb"
print = "When the alchemist creates a bomb, he can choose to have it inflict sonic damage. Concussive bombs deal 1d4 points of sonic damage, plus 1d4 points of sonic damage for every odd-numbered level, instead of 1d6. Creatures that take a direct hit from a concussive bomb are [deafened](ref/misc/deafened) for 1 minute unless they succeed at a Fortitude save. An alchemist must be at least 6th level before selecting this discovery."

[[entry]]
id = "ref/discovery/delayed-bomb"
anchor = "delayed-bomb"
print = "The alchemist can place a bomb so that it explodes a number of rounds after the alchemist ceases contact with the bomb. This delay can be any number of rounds as chosen by the alchemist, up to a number of rounds equal to his level. If at any point the alchemist reclaims possession of the delayed bomb, he can end the timer and prevent the bomb's detonation. A delayed bomb detonates immediately if any other creature attempts to touch or move it, or if the bomb's contents are removed from the vial (such as if the vial breaks). The bomb deals damage as if it scored a direct hit to any creature in the square with the bomb when it detonates, and splash damage to all adjacent creatures as normal. An alchemist cannot have more than one delayed bomb at one time. If he creates another delayed bomb, the previous bomb becomes inert. _[Dispel magic](ref/spell/dispel-magic)_ can neutralize a delayed bomb, as can a successful [Disable Device](ref/skill/disable-device) check (DC equals 10 + the alchemist's level + the alchemist's Intelligence modifier). An alchemist must be at least 8th level before selecting this discovery."

[[entry]]
id = "ref/discovery/dilution"
anchor = "dilution"
print = "Once per day, the alchemist can dilute any one potion or elixir, creating two doses of the same potion from one. Diluting a potion costs a number of gp equal to one-quarter of the potion's market value. A potion that has been diluted cannot be diluted again. This discovery cannot be used to dilute extracts or mutagens. An alchemist must be at least 12th level before selecting this discovery."

[[entry]]
id = "ref/discovery/dispelling-bomb"
anchor = "dispelling-bomb"
print = "When the alchemist creates a bomb, he can choose to have it [dispel magic](ref/spell/dispel-magic) effects instead of deal damage. Creatures that take a direct hit from a dispelling bomb are subject to a targeted _dispel magic_ spell, using the alchemist's level as the caster level. This cannot be used to target a specific spell effect. The alchemist must be at least 6th level before selecting this discovery."

[[entry]]
id = "ref/discovery/elixir-of-life"
anchor = "elixir-of-life"
print = "Once per day, the alchemist can brew an elixir of life. This special concoction costs 25,000 gp to create and takes 1 hour of work. An elixir of life, when administered by the alchemist who brewed it, restores life to a dead creature as per the spell _[true resurrection](ref/spell/true-resurrection)_. Alternatively, the alchemist himself may drink the elixir of life, after which point he is immediately targeted with a _[resurrection](ref/spell/resurrection)_ spell the next time he is killed. Used in this manner, the effects of an elixir of life persist only for a number of days equal to the alchemist's Intelligence modifier; if he does not die before that time expires, the effects of the elixir of life end. An alchemist must be at least 16th level before selecting this discovery."

[[entry]]
id = "ref/discovery/enhance-potion"
anchor = "enhance-potion"
print = "A number of times per day equal to his Intelligence modifier, the alchemist can cause any potion he drinks to function at a caster level equal to his class level."

[[entry]]
id = "ref/discovery/eternal-potion"
anchor = "eternal-potion"
print = "If an alchemist drinks a potion that he extends, the effects of that potion become permanent until he chooses to make another potion effect permanent. An alchemist must be at least 16th level and must possess the [extend potion](ref/discovery/extend-potion) discovery before selecting this discovery."

[[entry]]
id = "ref/discovery/eternal-youth"
anchor = "eternal-youth"
print = "The alchemist has discovered a cure for aging, and from this point forward he takes no penalty to his physical ability scores from [advanced age](ref/rule/age). If the alchemist is already taking such penalties, they are removed at this time."

[[entry]]
id = "ref/discovery/explosive-bomb"
anchor = "explosive-bomb"
print = "The alchemist's bombs now have a splash radius of 10 feet rather than 5 feet. Creatures that take a direct hit from an explosive bomb catch fire, taking 1d6 points of fire damage each round until the fire is extinguished. Extinguishing the flames is a full-round action that requires a Reflex save. Rolling on the ground provides the target with a +2 to the save. Dousing the target with at least 2 gallons of water automatically extinguishes the flames."

[[entry]]
id = "ref/discovery/extend-potion"
anchor = "extend-potion"
print = "A number of times per day equal to his Intelligence modifier, the alchemist can cause any potion he drinks that does not have an instantaneous duration to function at twice its normal duration. This does not apply to extracts."

[[entry]]
id = "ref/discovery/fast-bombs"
anchor = "fast-bombs"
print = "An alchemist with this discovery can quickly create enough bombs to throw more than one in a single round. The alchemist can prepare and throw additional bombs as a full-round action if his base attack bonus is high enough to grant him additional attacks. This functions just like a full-attack with a ranged weapon. An alchemist must be at least 8th level before selecting this discovery."

[[entry]]
id = "ref/discovery/fast-healing"
anchor = "fast-healing"
print = "The alchemist's flesh responds to damage with shocking speed—he gains [fast healing](ref/umr/fast-healing) 5."

[[entry]]
id = "ref/discovery/feral-mutagen"
anchor = "feral-mutagen"
print = "Whenever the alchemist imbibes a mutagen, he gains two claw attacks and a bite attack. These are [primary attacks](ref/rule/natural-attacks) and are made using the alchemist's full base attack bonus. The claw attacks deal 1d6 points of damage (1d4 if the alchemist is Small) and the bite attack deals 1d8 points of damage (1d6 if the alchemist is Small). While the mutagen is in effect, the alchemist gains a +2 competence bonus on Intimidate skill checks."

[[entry]]
id = "ref/discovery/force-bomb"
anchor = "force-bomb"
print = "When the alchemist creates a bomb, he can choose to have it inflict force damage. Force bombs deal 1d4 points of force damage, plus 1d4 points of force damage for every odd-numbered level, instead of 1d6. Creatures that take a direct hit from a force bomb are knocked [prone](ref/rule/prone) unless they succeed on a Reflex save. An alchemist must be at least 8th level before selecting this discovery."

[[entry]]
id = "ref/discovery/frost-bomb"
anchor = "frost-bomb"
print = "When the alchemist creates a bomb, he can choose to have it inflict cold damage. Creatures that take a direct hit from a frost bomb are [staggered](ref/misc/staggered) on their next turn unless they succeed on a Fortitude save."

[[entry]]
id = "ref/discovery/grand-mutagen"
anchor = "grand-mutagen"
print = "The alchemist's mutagen now grants a +6 natural armor bonus, a +8 alchemical bonus to one ability score (Strength, Dexterity, or Constitution), a +6 alchemical bonus to a second physical ability score, and a +4 alchemical bonus to a third physical ability score. The alchemist takes a -2 penalty to his Intelligence, Wisdom, and Charisma as long as the mutagen persists (see Mutagen). An alchemist must be at least 16th level and must possess the [greater mutagen](ref/discovery/greater-mutagen) discovery before selecting this discovery."

[[entry]]
id = "ref/discovery/greater-mutagen"
anchor = "greater-mutagen"
print = "The alchemist's mutagen now grants a +4 natural armor bonus, a +6 alchemical bonus to one physical ability score (Strength, Dexterity, or Constitution), and a +4 alchemical bonus to a second physical ability score. The alchemist takes a -2 penalty on both associated mental ability scores as long as the mutagen persists. An alchemist must be at least 12th level before selecting this discovery."

[[entry]]
id = "ref/discovery/inferno-bomb"
anchor = "inferno-bomb"
print = "The effects of the smoke created by an alchemist's bomb duplicate the effects of _[incendiary cloud](ref/spell/incendiary-cloud)_ instead of _[fog cloud](ref/spell/fog-cloud),_ filling an area equal to twice the bomb's splash radius for 1 round per level. An alchemist must be at least 16th level and must possess the [smoke bomb](ref/discovery/smoke-bomb) discovery before selecting this discovery."

[[entry]]
id = "ref/discovery/infuse-mutagen"
anchor = "infuse-mutagen"
print = "When the alchemist creates a mutagen, he can infuse it with an extra bit of his own magical power. This inflicts 2 points of [Intelligence damage](ref/rule/ability-damage-drain) to the alchemist and costs 1,000 gp in rare reagents, but the mutagen created persists on its own and is not rendered inert if the alchemist creates another mutagen. This allows an alchemist to create different types of mutagens and keep them handy for emergencies. This does not allow an alchemist to gain the effects of multiple mutagens—only the most recently imbibed mutagen has any effect."

[[entry]]
id = "ref/discovery/infusion"
anchor = "infusion"
print = "When the alchemist creates an extract, he can infuse it with an extra bit of his own magical power. The extract created now persists even after the alchemist sets it down. As long as the extract exists, it continues to occupy one of the alchemist's daily extract slots. An infused extract can be imbibed by a non-alchemist to gain its effects."

[[entry]]
id = "ref/discovery/madness-bomb"
anchor = "madness-bomb"
print = "The alchemist's bombs do more than sear flesh—they sear the mind. A creature that takes a direct hit from a madness bomb takes damage from the bomb plus 1d4 points of [Wisdom damage](ref/rule/ability-damage-drain). Reduce the amount of normal damage dealt by the bomb by 2d6 (so a bomb that would normally deal 6d6+4 points of damage deals 4d6+4 points of damage instead). The amount of Wisdom damage dealt by a madness bomb is reduced by 1 for each madness bomb that hit the target in the past 24 hours, to a minimum of 1 point of Wisdom damage. An alchemist must be at least 12th level before selecting this discovery."

[[entry]]
id = "ref/discovery/philosophers-stone"
anchor = "philosopher-s-stone"
print = "The alchemist learns how to create a _[philosopher's stone](ref/magic-artifact/philosophers-stone)_, and can do so once per month at no cost. Creating a _philosopher's stone_ takes 1 day of work."

[[entry]]
id = "ref/discovery/poison-bomb"
anchor = "poison-bomb"
print = "The effects of the smoke created by an alchemist's bomb duplicates the effects of _[cloudkill](ref/spell/cloudkill)_ instead of _[fog cloud](ref/spell/fog-cloud)_, filling an area equal to twice the bomb's splash radius for 1 round per level. An alchemist must be at least 12th level and must possess the [smoke bomb](ref/discovery/smoke-bomb) discovery before selecting this discovery."

[[entry]]
id = "ref/discovery/poison-touch"
anchor = "poison-touch"
print = "The alchemist gains a poisonous touch, as if under the effects of a _[poison](ref/spell/poison)_ spell. He can suppress or activate this ability as a free action. The physical appearance of how the alchemist generates and delivers his poisonous touch varies from alchemist to alchemist."

[[entry]]
id = "ref/discovery/precise-bombs"
anchor = "precise-bombs"
print = "Whenever the alchemist throws a bomb, he can select a number of squares equal to his Intelligence modifier that are not affected by the splash damage from his bombs. If the bomb misses, this discovery has no effect."

[[entry]]
id = "ref/discovery/shock-bomb"
anchor = "shock-bomb"
print = "When the alchemist creates a bomb, he can choose to have it inflict electricity damage. Creatures that take a direct hit from a shock bomb are [dazzled](ref/misc/dazzled) for 1d4 rounds."

[[entry]]
id = "ref/discovery/smoke-bomb"
anchor = "smoke-bomb"
print = "When the alchemist creates a bomb, he can choose to have it create a cloud of thick smoke when it detonates. The cloud functions as _[fog cloud](ref/spell/fog-cloud)_, filling an area equal to twice the bomb's splash radius for 1 round per level."

[[entry]]
id = "ref/discovery/sticky-bomb"
anchor = "sticky-bomb"
print = "The effects of the alchemist's bombs are persistent and continue to damage creatures for 1 round after the initial damage. Creatures that take a direct hit from a sticky bomb take the splash damage 1 round later. Bombs that have effects that would normally occur 1 round later instead have those effects occur 2 rounds later. An alchemist must be at least 10th level before selecting this discovery."

[[entry]]
id = "ref/discovery/sticky-poison"
anchor = "sticky-poison"
print = "Any poison the alchemist creates is sticky—when the alchemist applies it to a weapon, the weapon remains poisoned for a number of strikes equal to the alchemist's Intelligence modifier. An alchemist must be at least 6th level before selecting this discovery."

[[entry]]
id = "ref/discovery/stink-bomb"
anchor = "stink-bomb"
print = "The effects of the smoke created by an alchemist's bomb can duplicate the effects of _[stinking cloud](ref/spell/stinking-cloud)_ instead of _[fog cloud](ref/spell/fog-cloud)_, filling an area equal to twice the bomb's splash radius for 1 round. An alchemist must possess the [smoke bomb](ref/discovery/smoke-bomb) discovery before selecting this discovery."

[[entry]]
id = "ref/discovery/true-mutagen"
anchor = "true-mutagen"
print = "The alchemist's mutagen now grants a +8 natural armor bonus and a +8 alchemical bonus to Strength, Dexterity, and Constitution. The alchemist takes a -2 penalty to his Intelligence, Wisdom, and Charisma as long as the mutagen persists (see Mutagen). An alchemist must possess the [grand mutagen](ref/discovery/grand-mutagen) discovery before selecting this discovery."

[[entry]]
id = "ref/evolution/ability-increase"
anchor = "ability-increase"
print = '''
2-Point Evolutions: The following evolutions cost 2 points from the eidolon's evolution pool.

An eidolon grows larger muscles, gains faster reflexes, achieves greater intelligence, or acquires
another increase to one of its abilities. Increase one of the eidolon's ability scores by +2. This
evolution can be selected more than once. It can only be applied once to an individual ability
score, plus 1 additional time for every 6 levels the summoner possesses.'''

[[entry]]
id = "ref/evolution/bite"
anchor = "bite"
print = '''
1-Point Evolutions: The following evolutions cost 1 point from the eidolon's evolution pool.

An eidolon's maw is full of razor-sharp teeth, giving it a [bite attack](ref/umr/natural-attacks).
This attack is a primary attack. The bite deals 1d6 points of damage (1d8 if Large, 2d6 if Huge). If
the eidolon already has a bite attack, this evolution allows it to deal 1-1/2 times its Strength
modifier on damage rolls made with its bite.'''

[[entry]]
id = "ref/evolution/blindsense"
anchor = "blindsense"
print = '''
3-Point Evolutions: The following evolutions cost 3 points from the eidolon's evolution pool.

An eidolon's senses become incredibly acute, giving it [blindsense](ref/umr/blindsense) out to a
range of 30 feet. This ability allows the eidolon to pinpoint the location of creatures that it
cannot see without having to make a Perception check, but such creatures still have total
[concealment](ref/rule/concealment) from the eidolon. Visibility still affects the eidolon's
movement and it is still denied its Dexterity bonus to Armor Class against attacks from creatures it
cannot see. The summoner must be at least 9th level before selecting this evolution.'''

[[entry]]
id = "ref/evolution/blindsight"
anchor = "blindsight"
print = '''
4-Point Evolutions: The following evolutions cost 4 points from the eidolon's evolution pool.

An eidolon's senses sharpen even further, granting it [blindsight](ref/umr/blindsight) out to a
range of 30 feet. The eidolon can maneuver and attack as normal, ignoring darkness, invisibility,
and most forms of [concealment](ref/rule/concealment) as long as it has line of effect to the
target. The eidolon must possess the [blindsense](ref/evolution/blindsense) evolution to take this
evolution. The summoner must be at least 11th level before selecting this evolution.'''

[[entry]]
id = "ref/evolution/breath-weapon"
anchor = "breath-weapon"
print = '''
4-Point Evolutions: The following evolutions cost 4 points from the eidolon's evolution pool.

An eidolon learns to exhale a cone or line of magical energy, gaining a breath weapon. Select either
acid, cold, electricity, or fire. The eidolon can breathe a 30-foot cone (or 60-foot line) that
deals 1d6 points of damage of the selected type per HD it possesses. Those caught in the breath
weapon can attempt a Reflex save for half damage. The DC is equal to 10 + 1/2 the eidolon's HD + the
eidolon's Constitution modifier. The eidolon can use this ability once per day. The eidolon can use
this ability 1 additional time per day by spending an additional 1 evolution point (maximum 3/day).
The summoner must be at least 9th level before selecting this evolution.'''

[[entry]]
id = "ref/evolution/burrow"
anchor = "burrow"
print = '''
3-Point Evolutions: The following evolutions cost 3 points from the eidolon's evolution pool.

An eidolon grows thick and gnarled claws, allowing it to move through the earth. The eidolon gains a
burrow speed equal to 1/2 its base speed. It can use this speed to move through dirt, clay, sand,
and earth. It does not leave a hole behind, nor is its passage marked on the surface. The summoner
must be at least 9th level before selecting this evolution.'''

[[entry]]
id = "ref/evolution/claws"
anchor = "claws"
print = '''
1-Point Evolutions: The following evolutions cost 1 point from the eidolon's evolution pool.

An eidolon has a pair of vicious claws at the end of its [limbs](ref/evolution/limbs), giving it two [claw attacks](ref/umr/natural-attacks). These attacks are primary attacks. The claws deal 1d4 points of damage (1d6 if Large, 1d8 if Huge). The eidolon must have the [limbs](ref/evolution/limbs) evolution to take this evolution. This evolution can only be applied to the limbs (legs) evolution once This evolution can be selected more than once, but the eidolon must possess an equal number of the [limbs](ref/evolution/limbs) evolution.'''

[[entry]]
id = "ref/evolution/climb"
anchor = "climb"
print = '''
1-Point Evolutions: The following evolutions cost 1 point from the eidolon's evolution pool.

An eidolon becomes a skilled climber, gaining a climb speed equal to its base speed. This evolution
can be selected more than once. Each additional time it is selected, increase the eidolon's climb
speed by 20 feet.'''

[[entry]]
id = "ref/evolution/constrict"
anchor = "constrict"
print = '''
2-Point Evolutions: The following evolutions cost 2 points from the eidolon's evolution pool.

An eidolon gains powerful muscles that allow it to crush those it grapples. Whenever the eidolon
successfully grapples a foe using the
[grab](ref/carried/bestiary/rules/universal-monster-rules/grab) evolution, it deals additional
damage equal to the amount of damage dealt by the attack used by the
[grab](ref/carried/bestiary/rules/universal-monster-rules/grab) evolution. This evolution is only
available to eidolons of the serpentine base form.'''

[[entry]]
id = "ref/evolution/damage-reduction"
anchor = "damage-reduction"
print = '''
3-Point Evolutions: The following evolutions cost 3 points from the eidolon's evolution pool.

An eidolon's body becomes resistant to harm, granting it damage reduction. Choose one alignment:
chaotic, evil, good, or lawful. The eidolon gains DR 5 that can be bypassed by weapons that possess
the chosen alignment. The alignment must be opposite to one of the alignments possessed by the
eidolon. At 12th level, this protection can be increased to DR 10 by spending 2 additional evolution
points. The summoner must be at least 9th level before selecting this evolution.'''

[[entry]]
id = "ref/evolution/energy-attacks"
anchor = "energy-attacks"
print = '''
2-Point Evolutions: The following evolutions cost 2 points from the eidolon's evolution pool.

An eidolon's attacks become charged with energy. Pick one energy type: acid, cold, electricity, or
fire. All of the eidolon's natural attacks deal 1d6 points of energy damage of the chosen type on a
successful hit. The summoner must be at least 5th level before selecting this evolution.'''

[[entry]]
id = "ref/evolution/fast-healing"
anchor = "fast-healing"
print = '''
4-Point Evolutions: The following evolutions cost 4 points from the eidolon's evolution pool.

An eidolon's body gains the ability to heal wounds very quickly, giving it
[fast healing](ref/umr/fast-healing) 1. The eidolon heals 1 point of damage each round, just like
natural healing. Fast healing does not restore hit points lost due to starvation, thirst, or
suffocation, nor does it allow the eidolon to regrow lost body parts (or to reattach severed parts).
Fast healing functions as long as the eidolon is alive. This fast healing does not function when the
eidolon is not on the same plane as its summoner. This healing can be increased by 1 per round for
every 2 additional evolution points spent (maximum 5). The summoner must be at least 11th level
before selecting this evolution.'''

[[entry]]
id = "ref/evolution/flight"
anchor = "flight"
print = '''
2-Point Evolutions: The following evolutions cost 2 points from the eidolon's evolution pool.

An eidolon grows large wings, like those of a bat, bird, insect, or dragon, gaining the ability to
fly. The eidolon gains a fly speed equal to its base speed. The eidolon's maneuverability depends on
it size. Medium or smaller eidolons have good maneuverability. Large eidolons have average
maneuverability, while Huge eidolons have poor maneuverability. For 2 additional evolution points,
the eidolon flies by means of magic. It loses its wings, but its maneuverability increases to
perfect. Flying via magic means makes this a supernatural ability. The eidolon's fly speed can be
increased by spending additional evolution points, gaining a 20-foot increase to fly speed for each
additional point spent. The summoner must be at least 5th level before selecting this evolution.'''

[[entry]]
id = "ref/evolution/frightful-presence"
anchor = "frightful-presence"
print = '''
3-Point Evolutions: The following evolutions cost 3 points from the eidolon's evolution pool.

An eidolon becomes unsettling to its foes, gaining the
[frightful presence](ref/umr/frightful-presence) ability. The eidolon can activate this ability as
part of an offensive action, such as a [charge](ref/rule/charge) or attack. Opponents within 30 feet
of the eidolon must make a Will save or become [shaken](ref/misc/shaken) for 3d6 rounds. The DC of
this save is equal to 10 + 1/2 the eidolon's HD + the eidolon's Charisma modifier. If the eidolon
has at least 4 more Hit Dice than an opponent, that opponent becomes
[frightened](ref/misc/frightened) instead. Foes with more HD than the eidolon are immune to this
effect. The summoner must be at least 11th level before selecting this evolution.'''

[[entry]]
id = "ref/evolution/gills"
anchor = "gills"
print = '''
1-Point Evolutions: The following evolutions cost 1 point from the eidolon's evolution pool.

An eidolon has gills and can breathe underwater indefinitely.'''

[[entry]]
id = "ref/evolution/gore"
anchor = "gore"
print = '''
2-Point Evolutions: The following evolutions cost 2 points from the eidolon's evolution pool.

An eidolon grows a number of horns on its head, giving it a [gore attack](ref/umr/natural-attacks).
This attack is a primary attack. The gore deals 1d6 points of damage (1d8 if Large, 2d6 if Huge).'''

[[entry]]
id = "ref/evolution/grab"
anchor = "grab"
print = '''
2-Point Evolutions: The following evolutions cost 2 points from the eidolon's evolution pool.

An eidolon becomes adept at grappling foes, gaining the [grab](ref/umr/grab) ability. Pick bite, claw, pincers, slam, tail slap, or tentacle attacks. Whenever the eidolon makes a successful attack of the selected type, it can attempt a free combat maneuver check. If successful, the eidolon [grapples](ref/rule/grapple) the target. This ability only works on creatures of a size one category smaller than the eidolon or smaller. Eidolons with this evolution receive a +4 bonus on CMB checks made to grapple.'''

[[entry]]
id = "ref/evolution/immunity"
anchor = "immunity"
print = '''
2-Point Evolutions: The following evolutions cost 2 points from the eidolon's evolution pool.

An eidolon's body becomes extremely resilient to one energy type, gaining [immunity](ref/umr/immunity) to that type. Pick one energy type: acid, cold, electricity, fire, or sonic. The eidolon gains immunity to that energy type. This evolution can be selected more than once. Its effects do not stack. Each time it applies to a different energy type. The summoner must be at least 7th level before selecting this evolution.'''

[[entry]]
id = "ref/evolution/improved-damage"
anchor = "improved-damage"
print = '''
1-Point Evolutions: The following evolutions cost 1 point from the eidolon's evolution pool.

One of the eidolon's natural attacks is particularly deadly. Select one natural attack form and
[increase the damage die](ref/misc/damage-die-adjustments) type by one step. This evolution can be
selected more than once. Its effects do not stack. Each time an eidolon selects this evolution, it
applies to a different natural attack.'''

[[entry]]
id = "ref/evolution/improved-natural-armor"
anchor = "improved-natural-armor"
print = '''
1-Point Evolutions: The following evolutions cost 1 point from the eidolon's evolution pool.

An eidolon's hide grows thick fur, rigid scales, or bony plates, giving it a +2 bonus to its natural armor. This evolution can be taken once for every five levels the summoner possesses.'''

[[entry]]
id = "ref/evolution/large"
anchor = "large"
print = '''
4-Point Evolutions: The following evolutions cost 4 points from the eidolon's evolution pool.

An eidolon grows in size, becoming Large. The eidolon gains a +8 bonus to Strength, a +4 bonus to Constitution, and a +2 bonus to its natural armor. It takes a -2 penalty to its Dexterity. This size change also gives the creature a -1 size penalty to its AC and on attack rolls, a +1 bonus to its CMB and CMD, a -2 penalty on Fly skill checks, and a -4 penalty on Stealth skill checks. If the eidolon has the biped base form, it also gains 10- foot [reach](ref/evolution/reach). Any reach evolutions the eidolon possesses are added to this total. The eidolon must be Medium to take this evolution. The summoner must be at least 8th level before selecting this evolution.

If 6 additional evolution points are spent, the eidolon instead becomes Huge. The eidolon gains a +16 bonus to Strength, a +8 bonus to Constitution, and a +5 bonus to its natural armor. It takes a -4 penalty to its Dexterity. This size change also give the creature a -2 size penalty to its AC and attack rolls, a +2 bonus to its CMB and CMD, 10-foot reach, a -4 penalty on Fly skill checks, and a -8 penalty on Stealth skill checks. If the eidolon has the biped base form, its reach increases to 15 feet (10 feet for all other base forms). Any reach evolutions the eidolon possesses are added to this total. These bonuses and penalties replace, and do not stack with, those gained from becoming Large. The summoner must be at least 13th level before selecting this option.

The [ability increase](ref/evolution/ability-increase) evolution costs twice as much (4 evolution points) when adding to the Strength or Constitution scores of a Large or Huge eidolon.'''

[[entry]]
id = "ref/evolution/limbs"
anchor = "limbs"
print = '''
2-Point Evolutions: The following evolutions cost 2 points from the eidolon's evolution pool.

An eidolon grows an additional pair of limbs. These limbs can take one of two forms. They can be
made into legs, complete with feet. Each pair of legs increases the eidolon's base speed by 10 feet.
Alternatively, they can be made into arms, complete with hands. The eidolon does not gain any
additional natural attacks for an additional pair of arms, but it can take other evolutions that add
additional attacks (such as [claws](ref/evolution/claws) or a [slam](ref/evolution/slam)). Arms that
have hands can be used to wield weapons, if the eidolon is proficient. This evolution can be
selected more than once.'''

[[entry]]
id = "ref/evolution/magic-attacks"
anchor = "magic-attacks"
print = '''
1-Point Evolutions: The following evolutions cost 1 point from the eidolon's evolution pool.

An eidolon is infused with magic, allowing it to treat all of its natural attacks as if they were
magic for the purpose of overcoming [damage reduction](ref/rule/damage-reduction). If the summoner
is 10th level or higher, all of the eidolon's weapons are treated as the alignment of the eidolon
for the purpose of overcoming [damage reduction](ref/rule/damage-reduction).'''

[[entry]]
id = "ref/evolution/mount"
anchor = "mount"
print = '''
1-Point Evolutions: The following evolutions cost 1 point from the eidolon's evolution pool.

An eidolon is properly skilled and formed to serve as a [combat-trained](ref/rule/mounted-combat) mount. The eidolon must be at least one size category larger than its rider. This evolution is only available to eidolons of the quadruped and serpentine base forms.'''

[[entry]]
id = "ref/evolution/pincers"
anchor = "pincers"
print = '''
1-Point Evolutions: The following evolutions cost 1 point from the eidolon's evolution pool.

An eidolon grows a large pincers at the end of one pair of its [limbs](ref/evolution/limbs), giving it two pincer attacks. These attacks are secondary attacks. The pincers deal 1d6 points of damage (1d8 if Large, 2d6 if Huge). Eidolons with the [grab](ref/evolution/grab) evolution linked to pincers gain a +2 bonus on CMB checks made to grapple. The eidolon must have the [limbs](ref/evolution/limbs) (arms) evolution to take this evolution. Alternatively, the eidolon can replace the [claws](ref/evolution/claws) from its base form with pincers (this still costs 1 evolution point). This evolution can be selected more than once, but the eidolon must possess an equal number of the [limbs](ref/evolution/limbs) evolution.'''

[[entry]]
id = "ref/evolution/poison"
anchor = "poison"
print = '''
2-Point Evolutions: The following evolutions cost 2 points from the eidolon's evolution pool.

An eidolon secretes toxic venom, gaining a poison attack. Pick one bite or sting attack. Whenever the selected attack hits, the target is poisoned. Eidolon poison—_type_ poison (injury); _save_ Fort negates; _frequency_ 1/round for 4 rounds; _effect_ 1d4 Str damage; _cure_ 1 save. The save DC is equal to 10 + 1/2 the eidolon's HD + the eidolon's Constitution modifier. For 2 additional evolution points, this poison deals Constitution damage instead. This poison can be used no more than once per round. The summoner must be at least 7th level before selecting this evolution.'''

[[entry]]
id = "ref/evolution/pounce"
anchor = "pounce"
print = '''
1-Point Evolutions: The following evolutions cost 1 point from the eidolon's evolution pool.

An eidolon gains quick reflexes, allowing it to make a full attack after a charge. This evolution is
only available to eidolons of the quadruped base form.'''

[[entry]]
id = "ref/evolution/pull"
anchor = "pull"
print = '''
1-Point Evolutions: The following evolutions cost 1 point from the eidolon's evolution pool.

An eidolon gains the ability to pull creatures closer with a successful attack. Select one type of
natural attack. Whenever the eidolon makes a successful attack of the selected type, it can attempt
a free combat maneuver check. If successful, the target of the attack is pulled 5 feet closer to the
eidolon. This ability only works on creatures of a size equal to or smaller than the eidolon.
Creatures pulled in this way do not provoke attacks of opportunity. The eidolon must have a
[reach](ref/evolution/reach) of 10 feet or more to select this evolution. This evolution can be
selected more than once. Its effects do not stack. Each time an eidolon selects this evolution, it
applies to a different natural attack.'''

[[entry]]
id = "ref/evolution/push"
anchor = "push"
print = '''
1-Point Evolutions: The following evolutions cost 1 point from the eidolon's evolution pool.

An eidolon gains the ability to push creatures away with a successful attack. Select one type of
natural attack. Whenever the eidolon makes a successful attack of the selected type, it can attempt
a free combat maneuver check. If successful, the target of the attack is pushed 5 feet directly away
from the eidolon. This ability only works on creatures of a size equal to or smaller than the
eidolon. Creatures pushed in this way do not provoke attacks of opportunity. This evolution can be
selected more than once. Its effects do not stack. Each time an eidolon selects this evolution, it
applies to a different natural attack.'''

[[entry]]
id = "ref/evolution/rake"
anchor = "rake"
print = '''
2-Point Evolutions: The following evolutions cost 2 points from the eidolon's evolution pool.

An eidolon grows dangerous claws on its feet, allowing it to make 2 [rake](ref/umr/rake) attacks on
foes it is grappling. These attacks are [primary attacks](ref/umr/natural-attacks). The eidolon
receives these additional attacks each time it succeeds on a [grapple](ref/rule/grapple) check
against the target. These rake attacks deal 1d4 points of damage (1d6 if Large, 1d8 if Huge). This
evolution is only available to eidolons of the quadruped base form. This evolution counts as one
natural attack toward the eidolon's maximum. The summoner must be at least 4th level before
selecting this evolution.'''

[[entry]]
id = "ref/evolution/reach"
anchor = "reach"
print = '''
1-Point Evolutions: The following evolutions cost 1 point from the eidolon's evolution pool.

One of an eidolon's attacks is capable of striking at foes at a distance. Pick one attack. The
eidolon's reach with that attack increases by 5 feet.'''

[[entry]]
id = "ref/evolution/rend"
anchor = "rend"
print = '''
2-Point Evolutions: The following evolutions cost 2 points from the eidolon's evolution pool.

An eidolon learns to rip and tear the flesh of those it attacks with its
[claws](ref/evolution/claws), gaining the [rend](ref/umr/rend) ability. Whenever the eidolon makes
two successful claw attacks against the same target in 1 round, its claws latch onto the flesh and
deal extra damage. This damage is equal to the damage dealt by one claw attack plus 1-1/2 times the
eidolon's Strength modifier. The eidolon must possess the claws evolution to select this evolution.
The summoner must be at least 6th level before selecting this evolution.'''

[[entry]]
id = "ref/evolution/resistance"
anchor = "resistance"
print = '''
1-Point Evolutions: The following evolutions cost 1 point from the eidolon's evolution pool.

An eidolon's form takes on a resiliency to one particular energy type, which is usually reflected in its physical body (ashen hide for fire, icy breath for cold, and so on). Pick one energy type (acid, cold, electricity, fire, or sonic). The eidolon gains [resist](ref/umr/resistance) 5 against that energy type. This resistance increases by 5 for every 5 levels the summoner possesses, to a maximum of 15 at 10th level. This evolution can be selected more than once. Its effects do not stack. Each time an eidolon selects this evolution, it applies to a different energy type.'''

[[entry]]
id = "ref/evolution/scent"
anchor = "scent"
print = '''
1-Point Evolutions: The following evolutions cost 1 point from the eidolon's evolution pool.

An eidolon's sense of smell becomes quite acute. The eidolon gains the [scent](ref/umr/scent)
special quality, allowing it to detect opponents within 30 feet by sense of smell. If the opponent
is upwind, the range increases to 60 feet; if downwind, it drops to 15 feet. Strong scents can be
detected at twice the normal range. Scent does not allow the eidolon to precisely locate the
creature, only to detect its presence. It can detect the direction with a move action. The eidolon
can pinpoint the creature's location if it is within 5 feet. The eidolon can use scent to track
creatures (see page 304 of the _Bestiary_ for details).'''

[[entry]]
id = "ref/evolution/skilled"
anchor = "skilled"
print = '''
1-Point Evolutions: The following evolutions cost 1 point from the eidolon's evolution pool.

An eidolon becomes especially adept at a specific skill, gaining a +8 racial bonus on that skill.
This evolution can be selected more than once. Its effects do not stack. Each time an eidolon
selects this evolution, it applies to a different skill.'''

[[entry]]
id = "ref/evolution/slam"
anchor = "slam"
print = '''
1-Point Evolutions: The following evolutions cost 1 point from the eidolon's evolution pool.

An eidolon can deliver a devastating [slam attack](ref/umr/natural-attacks). This attack is a primary attack. The slam deals 1d8 points of damage (2d6 if Large, 2d8 if Huge). The eidolon must have the [limbs](ref/evolution/limbs) (arms) evolution to take this evolution. Alternatively, the eidolon can replace the [claws](ref/evolution/claws) from its base form with this slam attack (this still costs 1 evolution point). This evolution can be selected more than once, but the eidolon must possess an equal number of the [limbs](ref/evolution/limbs) evolution.'''

[[entry]]
id = "ref/evolution/spell-resistance"
anchor = "spell-resistance"
print = '''
4-Point Evolutions: The following evolutions cost 4 points from the eidolon's evolution pool.

An eidolon is protected against magic, gaining spell resistance. The eidolon's spell resistance is equal to 11 + the summoner's level. This spell resistance does not apply to spells cast by the summoner. The summoner must be at least 9th level before selecting this evolution.'''

[[entry]]
id = "ref/evolution/sting"
anchor = "sting"
print = '''
1-Point Evolutions: The following evolutions cost 1 point from the eidolon's evolution pool.

An eidolon possesses a long, barbed stinger at the end of its [tail](ref/evolution/tail), granting
it a [sting attack](ref/umr/natural-attacks). This attack is a primary attack. The sting deals 1d4
points of damage (1d6 if Large, 1d8 if Huge). The eidolon must possess the tail evolution to take
this evolution. This evolution can be selected more than once, but the eidolon must possess an equal
number of the tail evolution.'''

[[entry]]
id = "ref/evolution/swallow-whole"
anchor = "swallow-whole"
print = '''
3-Point Evolutions: The following evolutions cost 3 points from the eidolon's evolution pool.

An eidolon gains the [swallow whole](ref/umr/swallow-whole) ability, giving it the ability to
consume its foes. If the eidolon begins its turn with a creature
[grappled](ref/rule/grapple-conditions) using its bite attack (see the
[grab](ref/carried/bestiary/rules/universal-monster-rules/grab) evolution), it can attempt a combat
maneuver check to swallow the creature. The creature can be up to one size category smaller than the
eidolon. Swallowed creatures take damage equal to the eidolon's bite damage each round plus 1d6
points of bludgeoning damage. A swallowed creature keeps the grappled condition, but can attempt to
cut its way free with a light slashing or piercing weapon. The amount of damage needed to cut free
is equal to 1/10 the eidolon's total hit points. The eidolon's AC against these attacks is equal to
10 + 1/2 its natural armor bonus. If a swallowed creature cuts its way out, the eidolon loses this
ability until it heals this damage. Alternatively, the swallowed creature can attempt to escape the
grapple as normal. Success indicates that it has returned to the eidolon's mouth, where it can
attempt to escape or be swallowed again. The eidolon must possess the [grab](ref/evolution/grab)
evolution, tied to a bite attack, to take this evolution. The summoner must be at least 9th level
before selecting this evolution.'''

[[entry]]
id = "ref/evolution/swim"
anchor = "swim"
print = '''
1-Point Evolutions: The following evolutions cost 1 point from the eidolon's evolution pool.

An eidolon gains webbed hands, feet, or powerful flippers, giving it a swim speed equal to its base
speed. This evolution does not give the eidolon the ability to breathe underwater. This evolution
can be selected more than once. Each additional time it is selected, increase the eidolon's swim
speed by 20 feet.'''

[[entry]]
id = "ref/evolution/tail"
anchor = "tail"
print = '''
1-Point Evolutions: The following evolutions cost 1 point from the eidolon's evolution pool.

An eidolon grows a long, powerful tail. This grants it a +2 racial bonus on Acrobatics checks made
to balance on a surface. This evolution can be selected more than once.'''

[[entry]]
id = "ref/evolution/tail-slap"
anchor = "tail-slap"
print = '''
1-Point Evolutions: The following evolutions cost 1 point from the eidolon's evolution pool.

An eidolon can use its [tail](ref/evolution/tail) to bash nearby foes, granting it a
[tail slap attack](ref/umr/natural-attacks). This attack is a secondary attack. The tail slap deals
1d6 points of damage (1d8 if Large, 2d6 if Huge). The eidolon must possess the tail evolution to
take this evolution. This evolution can be selected more than once, but the eidolon must possess an
equal number of the tail evolution.'''

[[entry]]
id = "ref/evolution/tentacle"
anchor = "tentacle"
print = '''
1-Point Evolutions: The following evolutions cost 1 point from the eidolon's evolution pool.

An eidolon possesses a long, sinuous tentacle, granting it a
[tentacle attack](ref/umr/natural-attacks). This attack is a secondary attack. The tentacle attack
deals 1d4 points of damage (1d6 if Large, 1d8 if Huge). This evolution can be selected more than
once.'''

[[entry]]
id = "ref/evolution/trample"
anchor = "trample"
print = '''
2-Point Evolutions: The following evolutions cost 2 points from the eidolon's evolution pool.

An eidolon gains the ability to crush its foes underfoot, gaining the [trample](ref/umr/trample)
ability. As a full-round action, the eidolon can [overrun](ref/rule/overrun) any creature that is at
least one size smaller than itself. This works like the overrun combat maneuver, but the eidolon
does not need to make a check, it merely has to move over opponents in its path. The creatures take
1d6 points of damage (1d8 if Large, 2d6 if Huge), plus 1-1/2 times the eidolon's Strength modifier.
Targets of the trample can make attacks of opportunity at a -4 penalty. If a target forgoes the
attack of opportunity, it can make a Reflex save for half damage. The DC of this save is 10 + 1/2
the eidolon's HD + the eidolon's Strength modifier. A trampling eidolon can only deal trampling
damage to a creature once per round. This evolution is only available to eidolons of the biped or
quadruped base forms.'''

[[entry]]
id = "ref/evolution/tremorsense"
anchor = "tremorsense"
print = '''
2-Point Evolutions: The following evolutions cost 2 points from the eidolon's evolution pool.

An eidolon becomes attuned to vibrations in the ground, gaining [tremorsense](ref/umr/tremorsense)
out to a range of 30 feet. This works like the [blindsense](ref/evolution/blindsense) evolution, but
only if both the eidolon and the creature to be pinpointed are in contact with the ground. The
summoner must be at least 7th level before selecting this evolution.'''

[[entry]]
id = "ref/evolution/trip"
anchor = "trip"
print = '''
2-Point Evolutions: The following evolutions cost 2 points from the eidolon's evolution pool.

An eidolon becomes adept at knocking foes to the ground with its [bite](ref/evolution/bite),
granting it a [trip](ref/rule/trip) attack. Whenever the eidolon makes a successful bite attack of
the selected type, it can attempt a free combat maneuver check. If successful, the target is knocked
[prone](ref/rule/prone). If the check fails, the eidolon is not tripped in return. This ability only
works on creatures of a size equal to or smaller than the eidolon. The eidolon must possess the bite
evolution to select this evolution.'''

[[entry]]
id = "ref/evolution/weapon-training"
anchor = "weapon-training"
print = '''
2-Point Evolutions: The following evolutions cost 2 points from the eidolon's evolution pool.

An eidolon learns to use a weapon, gaining
[Simple Weapon Proficiency](ref/feat/simple-weapon-proficiency) as a bonus feat. If 2 additional
evolution points are spent, it gains proficiency with all martial weapons as well.'''

[[entry]]
id = "ref/evolution/web"
anchor = "web"
print = '''
3-Point Evolutions: The following evolutions cost 3 points from the eidolon's evolution pool.

An eidolon gains a pair of spinnerets, giving it the ability to spin webs. The eidolon can use these
webs to support itself plus up to one creature of the same size. It can throw webbing as a ranged
touch attack up to 8 times per day, [entangling](ref/rule/entangled) a creature up to one size
larger than the eidolon. The webbing has a range of 50 feet and a 10-foot range increment. Creatures
entangled by the web can escape with an [Escape Artist](ref/skill/escape-artist) check or a Strength
check (at a -4 penalty). The DC of these checks is equal to 10 + 1/2 the eidolon's HD + the
eidolon's Con modifier. The webs have a [Hardness](ref/umr/hardness) of 0 and a number of hit points equal to the eidolon's total Hit Dice. The eidolon can [climb](ref/evolution/climb) its own
webs at its climb speed and can pinpoint any creature touching its webs. The eidolon must possess
the climb evolution to take this evolution. The summoner must be at least 7th level before selecting
this evolution.'''

[[entry]]
id = "ref/evolution/wing-buffet"
anchor = "wing-buffet"
print = '''
1-Point Evolutions: The following evolutions cost 1 point from the eidolon's evolution pool.

An eidolon learns to use its wings to batter foes, granting it two wing buffet attacks. These
attacks are secondary attacks. The wing buffets deal 1d4 points of damage (1d6 if Large, 1d8 if
Huge). The eidolon must possess the [flight](ref/evolution/flight) evolution, with wings, to select
this evolution.'''

[[entry]]
id = "ref/hex/agony"
anchor = "agony"
print = '''
With a quick incantation, a witch can place this hex on one creature within 60 feet, causing them to
suffer intense pain. The target is [nauseated](ref/misc/nauseated) for a number of rounds equal to
the witch's level. A Fortitude save negates this effect. If the saving throw is failed, the target
can attempt a new save each round to end the effect. Whether or not the save is successful, a
creature cannot be the target of this hex again for 1 day.'''

[[entry]]
id = "ref/hex/blight"
anchor = "blight"
print = "The witch can [curse](ref/rule/curses) an animal, plant creature, or plot of land, causing it to wither and die. Blighting an area takes 1 round, during which time the witch and her familiar must be in contact with the target. If it's used on a plot of land, the land begins to wither the following day, and over the next week all plants in the area die. Nothing will grow in that area so long as the curse persists. A witch can affect an area with a radius equal to her class level × 10 feet. Blighting a creature is a standard action that requires a melee touch attack. If used on a creature of the animal or plant type, the creature gains the following curse: Blight Hex—_type_ curse; _save_ Will negates; _frequency_ 1/day; _effect_ 1 Con damage. Both types of curse can be removed with a _[remove curse](ref/spell/remove-curse)_ or similar magic, using the save DC as the DC to remove the curse. A witch can only have one blight in effect at a time. If another blight hex is made, the first immediately ends."

[[entry]]
id = "ref/hex/cackle"
anchor = "cackle"
print = "A witch can cackle madly as a move action. Any creature that is within 30 feet that is under the effects of an [agony](ref/hex/agony) hex, [charm](ref/hex/charm) hex, [evil eye](ref/hex/evil-eye) hex, [fortune](ref/hex/fortune) hex, or [misfortune](ref/hex/misfortune) hex caused by the witch has the duration of that hex extended by 1 round."

[[entry]]
id = "ref/hex/cauldron"
anchor = "cauldron"
print = '''
The witch receives [Brew Potion](ref/feat/brew-potion) as a bonus feat and a +4 insight bonus on
Craft (alchemy) skill checks.'''

[[entry]]
id = "ref/hex/charm"
anchor = "charm"
print = '''
A witch can charm an animal or humanoid creature within 30 feet by beckoning and speaking soothing
words. This improves the attitude of an animal or humanoid creature by 1 step, as if the witch had
successfully used the [Diplomacy](ref/skill/diplomacy) skill. The effect lasts for a number of
rounds equal to the Witch's Intelligence modifier. A Will save negates this effect. Whether or not
the save is successful, a creature cannot be the target of this hex again for 1 day. At 8th level,
this effect improves the attitude of the target creature by 2 steps. This is a mind-affecting charm
effect.'''

[[entry]]
id = "ref/hex/coven"
anchor = "coven"
print = '''
The witch counts as a [hag](ref/family/hag) for the purpose of joining a hag's coven. The coven must
contain at least one hag. In addition, whenever the witch with this hex is within 30 feet of another
witch with this hex, she can use the [aid another](ref/rule/aid-another) action to grant a +1 bonus
to the other witch's caster level for 1 round. This bonus applies to the witch's spells and all of
her hexes.'''

[[entry]]
id = "ref/hex/death-curse"
anchor = "death-curse"
print = '''
This powerful hex seizes a creature's heart, causing death within just a few moments. This hex has a
range of 30 feet. The hexed creature receives a Will save to negate the effect. If this save is
failed, the creature becomes [fatigued](ref/misc/fatigued) the first round of the hex. On the second
round of the hex, the creature becomes [exhausted](ref/misc/exhausted). On the third round, the
creature dies unless it succeeds at a Fort save. Creatures that fail the first save but succeed at
the second remain exhausted and take 4d6 points of damage + 1 point of damage per level of the
witch. Slaying the witch that hexed the creature ends the effect, but any fatigue or exhaustion
remains. Whether or not the saves are successful, a creature cannot be the target of this hex again
for 1 day.'''

[[entry]]
id = "ref/hex/disguise"
anchor = "disguise"
print = "A witch can change her appearance for a number of hours equal to her class level, as if using _[disguise self](ref/spell/disguise-self)_. These hours do not need to be consecutive, but they must be spent in 1-hour increments."

[[entry]]
id = "ref/hex/eternal-slumber"
anchor = "eternal-slumber"
print = '''
The witch can touch a creature, causing it to drift off into a permanent slumber. The creature
receives a Will save to negate this effect. If the save fails, the creature falls asleep and cannot
be woken. The effect can only be removed with a _[wish](ref/spell/wish)_ or similar magic, although
slaying the witch ends the effect. The witch can use this ability to poison food or drink, causing
those who ingest it to make a save or fall into an eternal slumber. She can only have one such dose
of poison at any one time, and it loses its potency after 1 minute if not consumed. Whether or not
the save is successful, a creature cannot be the target of this hex again for 1 day.'''

[[entry]]
id = "ref/hex/evil-eye"
anchor = "evil-eye"
print = '''
The witch can cause doubt to creep into the mind of a foe within 30 feet that she can see. The
target takes a -2 penalty on one of the following (witch's choice): AC, ability checks, attack
rolls, saving throws, or skill checks. This hex lasts for a number of rounds equal to 3 + the
witch's Intelligence modifier. A Will save reduces this to just 1 round. This is a mind-affecting
effect. At 8th level the penalty increases to -4.'''

[[entry]]
id = "ref/hex/flight"
anchor = "flight"
print = '''
The witch grows lighter as she gains power, eventually gaining the ability to [fly](ref/spell/fly).
At 1st level, the witch can use _[feather fall](ref/spell/feather-fall)_ at will and gains a +4
racial bonus on Swim checks. At 3rd level, she can cast _[levitate](ref/spell/levitate)_ once per
day. At 5th level, she can fly, as per the spell, for a number of minutes per day equal to her
level. These minutes do not need to be consecutive, but they must be spent in 1-minute increments.
This hex only affects the witch.'''

[[entry]]
id = "ref/hex/forced-reincarnation"
anchor = "forced-reincarnation"
print = '''
The witch causes a creature within 30 feet to die and be immediately _reincarnated_ into a new body.
A Will save negates this effect. Those that fail are slain and immediately brought back to life with
the spell _[reincarnate](ref/spell/reincarnate)_. Whether or not the save is successful, a creature
cannot be the target of this hex again for 1 day.'''

[[entry]]
id = "ref/hex/fortune"
anchor = "fortune"
print = "The witch can grant a creature within 30 feet a bit of good luck for 1 round. The target can call upon this good luck once per round, allowing him to reroll any ability check, attack roll, saving throw, or skill check, taking the better result. He must decide to use this ability before the first roll is made. At 8th level and 16th level, the duration of this hex is extended by 1 round. Once a creature has benefited from the fortune hex, it cannot benefit from it again for 24 hours."

[[entry]]
id = "ref/hex/hags-eye"
anchor = "hag-s-eye"
print = "A witch with this hex can create a magic sensor that she can see through. This functions as per the spell _[arcane eye](ref/spell/arcane-eye)_. If the witch has the [coven](ref/hex/coven) hex, all other"

[[entry]]
id = "ref/hex/healing"
anchor = "healing"
print = '''
A witch can soothe the wounds of those she touches. This acts as a
_[cure light wounds](ref/spell/cure-light-wounds)_ spell, using the witch's caster level. Once a
creature has benefited from the healing hex, it cannot benefit from it again for 24 hours. At 5th
level, this hex acts like _[cure moderate wounds](ref/spell/cure-moderate-wounds)_.'''

[[entry]]
id = "ref/hex/life-giver"
anchor = "life-giver"
print = "Once per day the witch can, as a full round action, touch a dead creature and bring it back to life. This functions as _[resurrection](ref/spell/resurrection)_, but it does not require a material component."

[[entry]]
id = "ref/hex/major-healing"
anchor = "major-healing"
print = '''
By calling upon eerie powers, the witch's touch can mend even the most terrible wounds of those she
touches. This acts as _[cure serious wounds](ref/spell/cure-serious-wounds)_, using the witch's
caster level. Once a creature has benefited from the major healing hex, it cannot benefit from it
again for 24 hours. At 15th level, this hex acts like
_[cure critical wounds](ref/spell/cure-critical-wounds)_.'''

[[entry]]
id = "ref/hex/misfortune"
anchor = "misfortune"
print = "The witch can cause a creature within 30 feet to suffer grave misfortune for 1 round. Anytime the creature makes an ability check, attack roll, saving throw, or skill check, it must roll twice and take the worse result. A Will save negates this hex. At 8th level and 16th level, the duration of this hex is extended by 1 round. This hex affects all rolls the target must make while it lasts. Whether or not the save is successful, a creature cannot be the target of this hex again for 1 day."

[[entry]]
id = "ref/hex/natural-disaster"
anchor = "natural-disaster"
print = '''
A witch using this hex calls down the forces of nature to wreak havoc on an area. This functions as
a _[storm of vengeance](ref/spell/storm-of-vengeance)_ combined with an
_[earthquake](ref/spell/earthquake)_ that occurs on the second round of the effect (while acid is
raining from the sky). A witch must concentrate for the duration of this effect. If disrupted, the
effect immediately ends. A witch can only use this ability once per day.'''

[[entry]]
id = "ref/hex/nightmares"
anchor = "nightmares"
print = '''
Calling upon fell powers, a witch can place a hex on a creature within 60 feet that causes its sleep
to be tormented by terrible nightmares. This functions as the spell
_[nightmare](ref/spell/nightmare)_ each time the affected creature attempts to rest. A Will save
negates this effect. If the save is failed, the target must make a new save each night or be unable
to rest.'''

[[entry]]
id = "ref/hex/retribution"
anchor = "retribution"
print = '''
A witch can place a retribution hex on a creature within 60 feet, causing terrible wounds to open
across the target's flesh whenever it deals damage to another creature in melee. Immediately after
the hexed creature deals damage in melee, it takes half that damage (round down). This damage
bypasses any resistances, immunities, or [damage reduction](ref/rule/damage-reduction) the creature
possesses. This effect lasts for a number of rounds equal to the witch's Intelligence modifier. A
Will save negates this effect.'''

[[entry]]
id = "ref/hex/slumber"
anchor = "slumber"
print = '''
A witch can cause a creature within 30 feet to fall into a deep, magical [sleep](ref/spell/sleep), as per the spell _sleep_. The creature receives a Will save to negate the effect. If the save fails, the creature falls asleep for a number of rounds equal to the witch's level. This hex can affect a creature of any HD. The creature will not wake due to noise or light, but others can rouse it with a standard action.

Table 2–10: Witch Base Attack Fort Ref Will Level Bonus Save Save Save Special 1st +0 +0 +0 +2 Cantrips, hex, witch's familiar 2nd +1 +0 +0 +3 Hex 3rd +1 +1 +1 +3 4th +2 +1 +1 +4 Hex 5th +2 +1 +1 +4 6th +3 +2 +2 +5 Hex 7th +3 +2 +2 +5 8th +4 +2 +2 +6 Hex 9th +4 +3 +3 +6 10th +5 +3 +3 +7 Hex, major hex 11th +5 +3 +3 +7 12th +6/+1 +4 +4 +8 Hex 13th +6/+1 +4 +4 +8 14th +7/+2 +4 +4 +9 Hex 15th +7/+2 +5 +5 +9 16th +8/+3 +5 +5 +10 Hex 17th +8/+3 +5 +5 +10 18th +9/+4 +6 +6 +11 Hex, grand hex 19th +9/+4 +6 +6 +11 20th +10/+5 +6 +6 +12 Hex This hex ends immediately if the creature takes damage. Whether or not the save is successful, a creature cannot be the target of this hex again for 1 day.'''

[[entry]]
id = "ref/hex/tongues"
anchor = "tongues"
print = '''
A witch with this hex can understand any spoken language for a number of minutes per day equal to
her level, as _[comprehend languages](ref/spell/comprehend-languages)._ This duration does not need
to be consecutive, but it must be spent in 1-minute increments. At 5th level, a witch can use this
ability to speak any language, as per _[tongues](ref/spell/tongues)_.'''

[[entry]]
id = "ref/hex/vision"
anchor = "vision"
print = '''
A witch with the vision hex can grant a glimpse of the future to a creature touched. Granting a
vision takes 1 minute, during which time the witch and the target must remain in contact with one
another. At the end of this time, the subject receives a brief image of the future, usually no more
than 1 year from the time of the vision, subject to GM discretion. This is only one possible version
of the future, making such visions unreliable at best. Most visions are slanted toward the alignment
of the witch that granted them. For example, the visions granted by a chaotic evil witch often show
scenes of death and destruction, while those of a neutral good witch tend to be of joyous events or
occasions. A creature cannot be subject to another vision until the current vision has either come
to pass or been prevented. A witch cannot use this ability on herself. Unwilling creatures receive a
Will save to negate the vision.'''

[[entry]]
id = "ref/hex/ward"
anchor = "ward"
print = "A witch can use this hex to place a protective ward over one creature. The warded creature receives a +2 deflection bonus to AC and a +2 resistance bonus on saving throws. This ward lasts until the warded creature is hit or fails a saving throw. A witch knows when a warded creature is no longer protected. A witch can have only one ward active at a time. If the witch uses this ability again, the previous ward immediately ends. A witch cannot use this ability on herself. At 8th level and 16th level, the bonuses provided by this ward increase by +1."

[[entry]]
id = "ref/hex/waxen-image"
anchor = "waxen-image"
print = "The witch can spend a full-round action to create a crude and unnerving wax duplicate of a creature she can see within 30 feet. Once the image is complete, the subject must make a Will save. If the subject fails, the witch gains a small measure of control over the creature. Whenever she exercises this control, the creature receives a new Will save to end the effect. This effect occurs on the witch's turn and does not impede the creature's actions on its turn. The witch can use the waxen image a number of times equal to her Intelligence modifier before it melts. As a standard action, the witch can cause the subject to do any one of the following things: move up to the creature's speed in any direction, attack itself once with any weapon in hand (this attack automatically hits), lay down on the ground, or drop anything held. Alternatively, she can spend one of her uses to simply torture the image, causing the creature to be both [sickened](ref/misc/sickened) and [staggered](ref/misc/staggered) on its turn. As soon as the creature has succeeded on a saving throw against this effect, it is immune to it for 24 hours. The is an enchantment (compulsion) effect."

[[entry]]
id = "ref/hex/weather-control"
anchor = "weather-control"
print = '''
A witch with this hex can use _[control weather](ref/spell/control-weather)_ once per day, but
creating the weather takes 1 full hour of chanting, dancing, and communing with her familiar.'''

[[entry]]
id = "ref/mystery/battle"
anchor = "deities"
print = "[Cayden Cailean](ref/faith/cayden-cailean), [Gorum](ref/faith/gorum), [Iomedae](ref/faith/iomedae), [Rovagug](ref/faith/rovagug)."

[[entry]]
id = "ref/mystery/battle"
anchor = "class-skills"
print = "An oracle with the battle mystery adds Intimidate, Knowledge (engineering), Perception, and Ride to her list of class skills."

[[entry]]
id = "ref/mystery/battle"
anchor = "bonus-spells"
print = "_enlarge person_ (2nd), _fog cloud_ (4th), _magic vestment_ (6th), _wall of fire_ (8th), _righteous might_ (10th), _mass bull's strength_ (12th), _control weather_ (14th), _earthquake_ (16th), _storm of vengeance_ (18th)."

[[entry]]
id = "ref/mystery/battle"
anchor = "revelations"
print = "An oracle with the battle mystery can choose from any of the following revelations."

[[entry]]
id = "ref/mystery/battle"
anchor = "battlecry"
print = "As a standard action, you can unleash an inspiring battlecry. All allies within 100 feet who hear your cry gain a +1 morale bonus on attack rolls, skill checks, and saving throws for a number of rounds equal to your Charisma modifier. At 10th level, this bonus increases to +2. You can use this ability once per day, plus one additional time per day at 5th level and for every five levels thereafter."

[[entry]]
id = "ref/mystery/battle"
anchor = "battlefield-clarity"
print = "Once per day, as an immediate action, whenever you fail a saving throw that causes you to become blind, deaf, frightened, panicked, paralyzed, shaken, or stunned, you may attempt that saving throw again, with a +4 insight bonus on the roll. You must take the second result, even if it is worse. At 7th and 15th level, you can use this ability one additional time per day."

[[entry]]
id = "ref/mystery/battle"
anchor = "combat-healer"
print = "Whenever you cast a cure spell (a spell with \"cure\" in its name), you can cast it as a swift action, as if using the [Quicken Spell](ref/feat/quicken-spell) feat, by expending two spell slots. This does not increase the level of the spell. You can"

[[entry]]
id = "ref/mystery/bones"
anchor = "deities"
print = "[Norgorber](ref/faith/norgorber), [Pharasma](ref/faith/pharasma), [Urgathoa](ref/faith/urgathoa)."

[[entry]]
id = "ref/mystery/bones"
anchor = "class-skills"
print = "An oracle with a bones mystery adds Bluff, Disguise, Intimidate, and Stealth to her list of class skills."

[[entry]]
id = "ref/mystery/bones"
anchor = "bonus-spells"
print = "_cause fear_ (2nd), _false life_ (4th), _animate dead_ (6th), _fear_ (8th), _slay living_ (10th), _circle of death_ (12th), _control undead_ (14th), _horrid wilting_ (16th), _wail of the banshee_ (18th)."

[[entry]]
id = "ref/mystery/bones"
anchor = "revelations"
print = "An oracle with the bones mystery can choose from any of the following revelations."

[[entry]]
id = "ref/mystery/bones"
anchor = "armor-of-bones"
print = "You can conjure armor made of bones that grants you a +4 armor bonus. At 7th level, and every four levels thereafter, this bonus increases by +2. At 13th level, this armor grants you DR 5/bludgeoning. You can use this armor for 1 hour per day per oracle level. This duration does not need to be consecutive, but it must be spent in 1-hour increments."

[[entry]]
id = "ref/mystery/bones"
anchor = "bleeding-wounds"
print = "Whenever a creature takes damage from one of your spells or effects that causes negative energy damage (such as _[inflict light wounds](ref/spell/inflict-light-wounds)_ or the death's touch revelation), it begins to [bleed](ref/rule/bleed), taking 1 point of damage each round. At 5th level, and every five levels thereafter, this damage increases by 1. The bleeding can be stopped by a DC 15 Heal check or any effect that heals damage."

[[entry]]
id = "ref/mystery/bones"
anchor = "death-s-touch"
print = "You can cause terrible wounds to appear on a creature with a melee touch attack. This attack deals 1d6 points of negative energy damage +1 point for every two oracle levels you possess. If used against an undead creature, it heals damage and grants a +2 [channel resistance](ref/rule/channel-resistance) for 1 minute. You can use this ability a number of times per day equal to 3 + your Charisma modifier."

[[entry]]
id = "ref/mystery/bones"
anchor = "near-death"
print = "You gain a +2 insight bonus on saves against diseases, mind-affecting effects, and poisons. At 7th level, this bonus also applies on saves against death effects, sleep effects, and stunning. At 11th level, the bonus increases to +4."

[[entry]]
id = "ref/mystery/bones"
anchor = "raise-the-dead"
print = "As a standard action, you can summon a single [skeleton](ref/template/skeleton) or [zombie](ref/template/zombie) to serve you. The undead creature has a number of Hit Dice equal to your oracle level. It remains for a number of rounds equal to your Charisma modifier. At 7th level, you can summon a bloody skeleton or fast zombie. At 15th level, you can summon an [advanced](ref/template/advanced) skeleton or zombie. You can use this ability once per day plus one additional time per day at 10th level."

[[entry]]
id = "ref/mystery/bones"
anchor = "resist-life"
print = "You are treated as an undead creature when you are targeted by positive or negative energy. You are not subject to [Turn Undead](ref/feat/turn-undead) or [Command Undead](ref/feat/command-undead) (or any other effect that specifically targets undead), unless you are actually an undead creature. At 7th level, you receive [channel resistance](ref/rule/channel-resistance) +2. This bonus increases by +2 at 11th and 15th level."

[[entry]]
id = "ref/mystery/bones"
anchor = "soul-siphon"
print = "As a ranged touch attack, you can unleash a ray that causes a target to gain one [negative level](ref/rule/energy-drain-and-negative-levels). The ray has a range of 30 feet. This negative level lasts for a number of minutes equal to your Charisma modifier. Whenever this ability gives a target a negative level, you heal a number of hit points equal to your oracle level. You can use this ability once per day, plus one additional time at 11th level and every four levels thereafter. You must be at least 7th level to select this revelation."

[[entry]]
id = "ref/mystery/bones"
anchor = "spirit-walk"
print = "As a standard action, you can become incorporeal and invisible. While in this form, you can move in any direction and through any object (except for those made of force). You can take no action other than to move while in this form. You remain in this form for a number of rounds equal to your oracle level, but you can end this effect prematurely with a standard action. You can use this ability once per day at 11th level, and twice per day at 15th level. You must be at least 11th level to select this revelation."

[[entry]]
id = "ref/mystery/bones"
anchor = "undead-servitude"
print = "You gain Command Undead as a bonus feat. You can [channel negative energy](ref/ability/channel-energy) a number of times per day equal to 3 + your Charisma modifier, but only to use Command Undead. You can take other feats to add to this ability, such as Improved Channeling, but not feats that alter this ability, such as [Alignment Channel](ref/feat/alignment-channel)."

[[entry]]
id = "ref/mystery/bones"
anchor = "voice-of-the-grave"
print = "You can _[speak with dead](ref/spell/speak-with-dead)_, as per the spell, for a number of rounds per day equal to your oracle level. These rounds do not need to be consecutive. At 5th level, and every five levels thereafter, the dead creature takes a cumulative -2 penalty on its Will save to resist this effect."

[[entry]]
id = "ref/mystery/bones"
anchor = "sec-final-revelation"
print = "Upon reaching 20th level, you become a master of death. Once per round, you can cast _bleed_ or _stabilize_ as a free action. If you are brought to below 0 hit points, you automatically stabilize. You can cast _animate dead_ at will without paying a material component cost (although you are still subject to the usual Hit Die control limit). Once per day, you can cast _power word kill_, but the spell can target a creature with 150 hit points or less."

[[entry]]
id = "ref/mystery/flame"
anchor = "deities"
print = "[Asmodeus](ref/faith/asmodeus), [Sarenrae](ref/faith/sarenrae)."

[[entry]]
id = "ref/mystery/flame"
anchor = "class-skills"
print = "An oracle with the flame mystery adds Acrobatics, Climb, Intimidate, and Perform to her list of class skills."

[[entry]]
id = "ref/mystery/flame"
anchor = "bonus-spells"
print = "_burning hands_ (2nd), _resist energy_ (4th), _fireball_ (6th), _wall of fire_ (8th), _summon monster V_ (fire elementals only, 10th), _fire seeds_ (12th), _fire storm_ (14th), _incendiary cloud_ (16th), _fiery body_ (18th)."

[[entry]]
id = "ref/mystery/flame"
anchor = "revelations"
print = "An oracle with a flame mystery can choose from any of the following revelations."

[[entry]]
id = "ref/mystery/flame"
anchor = "burning-magic"
print = "Whenever a creature fails a saving throw and takes fire damage from one of your spells, it [catches on fire](ref/rule/catching-on-fire). This fire deals 1 point of fire damage per spell level at the beginning of the burning creature's turn. The fire lasts for 1d4 rounds, but it can be extinguished as a move action if the creature succeeds at a Reflex save (using the spell's DC). Dousing the creature with water as a standard action grants a +2 bonus on this save, while immersing the creature in water automatically extinguishes the fire. Spells that do not grant a save do not cause a creature to catch on fire."

[[entry]]
id = "ref/mystery/flame"
anchor = "cinder-dance"
print = "Your base speed increases by 10 feet. At 5th level, you receive [Nimble Moves](ref/feat/nimble-moves) as a bonus feat. At 10th level, you receive [Acrobatic Steps](ref/feat/acrobatic-steps) as a bonus feat. You do not need to meet the prerequisites to receive these feats. Oracles with the [lame](ref/oraclecurse/lame) oracle curse cannot select this revelation."

[[entry]]
id = "ref/mystery/flame"
anchor = "fire-breath"
print = "As a standard action, you can unleash a 15-foot cone of flame from your mouth. This flame deals 1d4 points of fire damage per level. A Reflex save halves this damage. You can use this ability once per day, plus one additional time per day at 5th level and every five levels thereafter. The save DC is Charisma-based."

[[entry]]
id = "ref/mystery/flame"
anchor = "firestorm"
print = "As a standard action, you can cause fire to erupt around you. You can create one 10-foot cube of fire per oracle level. These cubes can be arranged in any pattern you desire, but each cube must be adjacent to another and one must be adjacent to you. Any creature caught in these flames takes 1d6 points of fire damage per oracle level, with a Reflex save resulting in half damage. This fire lasts for a number of rounds equal to your Charisma modifier. You can use this ability once per day. You must be at least 11th level to select this revelation."

[[entry]]
id = "ref/mystery/flame"
anchor = "form-of-flame"
print = "As a standard action, you can assume the form of a Small fire elemental, as _[elemental body I](ref/spell/elemental-body-1)_. At 9th level, you can assume the form of a Medium fire elemental, as _[elemental body II](ref/spell/elemental-body-2)_. At 11th level, you can assume the form of a Large fire elemental, as _[elemental body III](ref/spell/elemental-body-3)_. At 13th level, you can assume the form of a Huge fire elemental, as _[elemental body IV](ref/spell/elemental-body-4)_. You can use this ability once per day, but the duration is 1 hour/level. You must be at least 7th level to select this revelation."

[[entry]]
id = "ref/mystery/flame"
anchor = "gaze-of-flames"
print = "You can see through fire, fog, and smoke without penalty as long as the light is sufficient to allow you to see normally. At 7th level, you can gaze through any source of flame within 10 feet per oracle level, as if using _[clairvoyance](ref/spell/clairaudience-clairvoyance)_. You can use this ability for a number of rounds per day equal to your oracle level, but these rounds do not need to be consecutive."

[[entry]]
id = "ref/mystery/flame"
anchor = "heat-aura"
print = "As a swift action, you can cause waves of heat to radiate from your body. This heat deals 1d4 points of fire damage per two oracle levels (minimum 1d4) to all creatures within 10 feet. A Reflex save halves the damage. In addition, your form wavers and blurs, granting you 20% [concealment](ref/rule/concealment) until your next turn. You can use this ability once per day, plus one additional time per day at 5th level and every five levels thereafter."

[[entry]]
id = "ref/mystery/flame"
anchor = "molten-skin"
print = "You gain [resist](ref/umr/resistance) fire 5. This resistance increases to 10 at 5th level and 20 at 11th level. At 17th level, you gain immunity to fire."

[[entry]]
id = "ref/mystery/flame"
anchor = "touch-of-flame"
print = "As a standard action, you can perform a melee touch attack that deals 1d6 points of fire damage +1 point for every two oracle levels you possess. You can use this ability a number of times per day equal to 3 + your Charisma modifier. At 11th level, any weapon that you wield is treated as a _[flaming](ref/magic-enh/flaming)_ weapon."

[[entry]]
id = "ref/mystery/flame"
anchor = "wings-of-fire"
print = "As a swift action, you can manifest a pair of fiery wings that grant you a fly speed of 60 feet with average maneuverability. You can use these wings for 1 minute per day per oracle level. This duration does not need to be consecutive, but it must be spent in 1 minute increments. You must be at least 7th level before selecting this revelation."

[[entry]]
id = "ref/mystery/flame"
anchor = "sec-final-revelation"
print = "Upon reaching 20th level, you become a master of fire. You can apply any one of the following feats to any fire spell you cast without increasing the level or casting time: Enlarge Spell, Extend Spell, Silent Spell, or Still Spell. You do not need to possess these feats to use this ability."

[[entry]]
id = "ref/mystery/heavens"
anchor = "deities"
print = "[Desna](ref/faith/desna), [Gozreh](ref/faith/gozreh), [Pharasma](ref/faith/pharasma), [Sarenrae](ref/faith/sarenrae)."

[[entry]]
id = "ref/mystery/heavens"
anchor = "class-skills"
print = "An oracle with the heavens mystery adds Fly, Knowledge (arcana), Perception, and Survival to her list of class skills."

[[entry]]
id = "ref/mystery/heavens"
anchor = "bonus-spells"
print = "_color spray_ (2nd), _hypnotic pattern_ (4th), _daylight_ (6th), _rainbow pattern_ (8th), _overland flight_ (10th), _chain lightning_ (12th), _prismatic spray_ (14th), _sunburst_ (16th), _meteor swarm_ (18th)."

[[entry]]
id = "ref/mystery/heavens"
anchor = "revelations"
print = "An oracle with the heavens mystery can choose from any of the following revelations."

[[entry]]
id = "ref/mystery/heavens"
anchor = "awesome-display"
print = "Your phantasmagoric displays accurately model the mysteries of the night sky, dumbfounding all who behold them. Each creature affected by your illusion (pattern) spells is treated as if its total number of Hit Dice were equal to its number of Hit Dice minus your Charisma modifier (if positive)."

[[entry]]
id = "ref/mystery/heavens"
anchor = "coat-of-many-stars"
print = "You conjure a coat of starry radiance that grants you a +4 armor bonus. At 7th level, and every four levels thereafter, this bonus increases by +2. At 13th level, this armor grants you DR 5/slashing. You can use this coat for 1 hour per day per oracle level. The duration does not need to be consecutive; it can instead be spent in 1-hour increments."

[[entry]]
id = "ref/mystery/heavens"
anchor = "dweller-in-darkness"
print = "Once per day, you cast your psyche into the void of space to attract the attention of a terrible otherworldly being. The dweller in darkness behaves in all ways as if you had cast _[phantasmal killer](ref/spell/phantasmal-killer)_. At 17th level, the dweller in darkness can be perceived by more than one creature, as if you had cast _[weird](ref/spell/weird)_. You must be at least 11th level to choose this revelation."

[[entry]]
id = "ref/mystery/heavens"
anchor = "guiding-star"
print = "Whenever you can see the open sky at night, you can determine your precise location. When the night sky is visible to you, you may also add your Charisma modifier to your Wisdom modifier on all Wisdom-based checks. In addition, once per night while outdoors, you can cast one spell as if it were modified by the [Empower Spell](ref/feat/empower-spell), [Extend Spell](ref/feat/extend-spell), [Silent Spell](ref/feat/silent-spell), or [Still spell](ref/feat/still-spell) feat without increasing the spell's casting time or level."

[[entry]]
id = "ref/mystery/heavens"
anchor = "interstellar-void"
print = "You call upon the frigid depths of outer space to bring a terrible chill to your enemies. As a standard action, one target within 30 feet is cloaked in the void and takes 1d6 points of cold damage per level. A successful Fortitude save halves this damage. At 10th level, the interstellar void is so extreme that enemies who fail their saving throw are fatigued. At 15th level, creatures who fail their save are [exhausted](ref/misc/exhausted) and [stunned](ref/misc/stunned) for 1 round. You can use this ability once per day plus one additional time per day at 10th level."

[[entry]]
id = "ref/mystery/heavens"
anchor = "lure-of-the-heavens"
print = "Your connection to the skies above is so strong that your feet barely touch the ground. At 1st level, you no longer leave tracks. At 5th level, you can hover up to 6 inches above the ground or even above liquid surfaces, as if [levitating](ref/spell/levitate). At 10th level, you gain the ability to _[fly](ref/spell/fly)_, as per the spell, for a number of minutes per day equal to your oracle level. This duration does not need to be consecutive, but it must be spent in 1-minute increments."

[[entry]]
id = "ref/mystery/heavens"
anchor = "mantle-of-moonlight"
print = "Your innate understanding of the moon renders you immune to [lycanthropy](ref/rule/lycanthropy). Additionally, you may disrupt a [lycanthrope's](ref/template/lycanthrope) connection to the moon with a successful touch attack. This action automatically forces the lycanthrope into its humanoid form, which it must remain in for a number of rounds equal to your oracle level. Upon reaching 5th level, you can use this ability to force others into a _[rage](ref/spell/rage)_, as per the spell. Using this ability is a melee touch attack. You can use this ability once per day at 5th level plus one additional time per day for every 5 levels above 5th."

[[entry]]
id = "ref/mystery/heavens"
anchor = "moonlight-bridge"
print = "You summon a bridge of shimmering moonlight. The 10-foot-wide span touches the ground at a point adjacent to your position. From this point it can extend in any direction for 10 feet per oracle level. The path persists until you have crossed over the bridge or for 24 hours, whichever is shorter. You may summon a moonlight bridge a number of times per day equal to your Charisma bonus. Should the bridge be attacked, treat it as a _[wall of force](ref/spell/wall-of-force)_."

[[entry]]
id = "ref/mystery/heavens"
anchor = "spray-of-shooting-stars"
print = "As a standard action, you can unleash a ball of energy that explodes in a 5-foot-radius [burst](ref/misc/burst) dealing 1d4 points of fire damage per level. A successful Reflex save halves this damage. This attack has a range of 60 feet. You can fire one explosive ball per day, plus one additional ball per day at 5th level and for every 5 levels thereafter. You can fire more than one ball at a time, but creatures caught inside more than one simultaneous explosions only take damage once."

[[entry]]
id = "ref/mystery/heavens"
anchor = "star-chart"
print = "Your copious notes contain a working model of the night sky expressed in artistic scribbles and arcane mathematical formulae. Once per day, you may spend 10 minutes contemplating your star chart to gain the benefit of the spell _[commune](ref/spell/commune)_. You must be at least 7th level to select this revelation."

[[entry]]
id = "ref/mystery/heavens"
anchor = "sec-final-revelation"
print = "Upon achieving 20th level, your rapport with the heavens grants you perfect harmony with the universe. You receive a bonus on all saving throws equal to your Charisma modifier. You automatically stabilize if you are below 0 hit points, are immune to fear effects, and automatically confirm all critical hits. Should you die, you are reborn 3 days later in the form of a star child, who matures over the course of 7 days (treat as the _reincarnate_ spell)."

[[entry]]
id = "ref/mystery/life"
anchor = "deities"
print = "[Gozreh](ref/faith/gozreh), Irori, [Pharasma](ref/faith/pharasma), [Sarenrae](ref/faith/sarenrae)."

[[entry]]
id = "ref/mystery/life"
anchor = "class-skills"
print = "An oracle with the life mystery adds Handle Animal, Knowledge (nature), and Survival to her list of class skills."

[[entry]]
id = "ref/mystery/life"
anchor = "bonus-spells"
print = "_detect undead_ (2nd), _lesser restoration_ (4th), _neutralize poison_ (6th), _restoration_ (8th), _breath of life_ (10th), _heal_ (12th), _greater restoration_ (14th), _mass heal_ (16th), _true resurrection_ (18th)."

[[entry]]
id = "ref/mystery/life"
anchor = "revelations"
print = "An oracle with the life mystery can choose from any of the following revelations."

[[entry]]
id = "ref/mystery/life"
anchor = "channel"
print = "You can [channel positive energy](ref/ability/channel-energy) like a cleric, using your oracle level as your effective cleric level when determining the amount of damage healed (or caused to undead) and the DC. You can use this ability a number of times per day equal to 1 + your Charisma modifier."

[[entry]]
id = "ref/mystery/life"
anchor = "combat-healer"
print = "As the [battle](ref/mystery/battle) mystery revelation."

[[entry]]
id = "ref/mystery/life"
anchor = "delay-affliction"
print = "Once per day as an immediate action, whenever you fail a saving throw against a disease or poison, you may ignore its effects for 1 hour per level. At 7th and 15th level, you can use this ability one additional time per day."

[[entry]]
id = "ref/mystery/life"
anchor = "energy-body"
print = "As a standard action, you can transform your body into pure life energy, resembling a golden-white [fire elemental](ref/monster/fire-elemental). In this form, you gain the elemental subtype and give off a warm, welcoming light that increases the [light level](ref/rule/vision-and-light) within 10 feet by one step, up to normal light. Any undead creature striking you with its body or a handheld weapon deals normal damage, but at the same time the attacker takes 1d6 points of positive energy damage + 1 point per oracle level. Creatures wielding melee weapons with reach are not subject to this damage if they attack you. If you grapple or attack an undead creature using unarmed strikes or natural weapons, you may deal this damage in place of the normal damage for the attack. Once per round, if you pass through a living allied creature's square or the ally passes through your square, it heals 1d6 hit points + 1 per oracle level. You may use this ability to heal yourself as a move action. You choose whether or not to heal a creature when it passes through your space. You may return to your normal form as a free action. You may remain in energy body form for a number of rounds per day equal to your oracle level."

[[entry]]
id = "ref/mystery/life"
anchor = "enhanced-cures"
print = "Whenever you cast a cure spell, the maximum number of hit points healed is based on your oracle level, not the limit based on the spell. For example, an 11th-level oracle of life with this revelation may cast _[cure light wounds](ref/spell/cure-light-wounds)_ to heal 1d8+11 hit points instead of the normal 1d8+5 maximum."

[[entry]]
id = "ref/mystery/life"
anchor = "healing-hands"
print = "You gain a +4 bonus on [Heal](ref/skill/heal) checks. You may provide first aid to two people or treat two people for poison as a standard action (make a separate Heal check for each creature). When using the Heal skill to treat wounds from [caltrops](ref/eq-misc/caltrops) (and so on), treat deadly wounds, treat poison, treat disease, or treat long-term care, you may treat double the normal number of people you may treat at the same time. You may provide long-term care for yourself."

[[entry]]
id = "ref/mystery/life"
anchor = "life-link"
print = "As a standard action, you may create a bond between yourself and another creature. Each round at the start of your turn, if the bonded creature is wounded for 5 or more hit points below its maximum hit points, it heals 5 hit points and you take 5 hit points of damage. You may have one bond active per oracle level. This bond continues until the bonded creature dies, you die, the distance between you and the other creature exceeds [medium range](ref/rule/range), or you end it as an immediate action (if you have multiple bonds active, you may end as many as you want as part of the same immediate action)."

[[entry]]
id = "ref/mystery/life"
anchor = "lifesense"
print = "You notice and locate living creatures within 30 feet, just as if you possessed the [blindsight](ref/umr/blindsight) ability. You must be at least 11th level to select this revelation."

[[entry]]
id = "ref/mystery/life"
anchor = "safe-curing"
print = "Whenever you cast a spell that cures the target of hit point damage, you do not provoke attacks of opportunity for spellcasting."

[[entry]]
id = "ref/mystery/life"
anchor = "spirit-boost"
print = "Whenever your healing spells heal a target up to its maximum hit points, any excess points persist for 1 round per level as [temporary hit points](ref/rule/temporary-hit-points) (up to a maximum number of temporary hit points equal to your oracle level)."

[[entry]]
id = "ref/mystery/life"
anchor = "sec-final-revelation"
print = "Upon reaching 20th level, you become a perfect channel for life energy. You become immune to bleed, death attacks, exhaustion, fatigue, nausea effects, negative levels, and sickened effects. Ability damage and drain cannot reduce you below 1 in any ability score. You automatically make saving throws against massive damage. When you are below 0 hit points, you do not die until your negative total is in excess of twice your Constitution score."

[[entry]]
id = "ref/mystery/lore"
anchor = "deities"
print = "[Abadar](ref/faith/abadar), [Irori](ref/faith/irori), [Nethys](ref/faith/nethys)."

[[entry]]
id = "ref/mystery/lore"
anchor = "class-skills"
print = "An oracle with the lore mystery adds Appraise and all Knowledge skills to her list of class skills."

[[entry]]
id = "ref/mystery/lore"
anchor = "bonus-spells"
print = "_identify_ (2nd), _tongues_ (4th), _locate object_ (6th), _legend lore_ (8th), _contact other plane_ (10th), _mass owl's wisdom_ (12th), _vision_ (14th), _moment of prescience_ (16th), _time stop_ (18th)."

[[entry]]
id = "ref/mystery/lore"
anchor = "revelations"
print = "An oracle with the lore mystery can choose from any of the following revelations."

[[entry]]
id = "ref/mystery/lore"
anchor = "arcane-archivist"
print = "Your experience with lore-filled tomes has granted you the ability to cast arcane spells as if they were on your spell list. Once per day, you can cast a spell from the sorcerer/wizard spell list as if it were on your list of spells known. The spell consumes a spell slot one level higher than the level of the spell. You must have a spellbook containing the spell to cast it in this way, and the spell is erased when you complete the casting. You must be at least 11th level to select this revelation."

[[entry]]
id = "ref/mystery/lore"
anchor = "automatic-writing"
print = "Once per day, you can spend a full hour in uninterrupted meditation. During this period, your hands produce mysterious writing that pertains to the future. At 1st level, the prophetic writing manifests as an _[augury](ref/spell/augury)_ spell with 90% effectiveness. At 5th level, the writing takes the form of a _[divination](ref/spell/divination)_ with 90% effectiveness. At 8th level, the writing manifests as a casting of _[commune](ref/spell/commune)_ with no material component required."

[[entry]]
id = "ref/mystery/lore"
anchor = "brain-drain"
print = "You can take a standard action to violently probe the mind of a single intelligent enemy within 100 feet. The target receives a Will save to negate the effect and immediately knows the source of this harmful mental prying. Those who fail this save are wracked with pain, taking 1d4 points of damage per oracle level. After successfully attacking with this ability, you may use a full-round action to sort through the jumble of stolen thoughts and memories to make a single [Knowledge](ref/skill/knowledge-all) check using the victim's skill bonus. The randomly stolen thoughts remain in your mind for a number of rounds equal to your Charisma modifier. Treat the knowledge gained as if you used _[detect thoughts](ref/spell/detect-thoughts)_. This is a mind-affecting effect. You can use this ability once per day at 1st level, plus one additional time per day at 5th level and for every 5 levels beyond 5th."

[[entry]]
id = "ref/mystery/lore"
anchor = "focused-trance"
print = "You can enter a deep meditation, blocking out visual and auditory stimuli and allowing you to concentrate on a single problem, philosophical issue, or memory. This trance lasts 1d6 rounds, during which time you can only take move actions. During this period, you gain a bonus equal to your level on all saves against sonic effects and gaze attacks. When you come out of your trance, you may make a single Intelligence-based skill check with a +20 circumstance bonus. You may enter your focused trance a number of times per day equal to your Charisma modifier."

[[entry]]
id = "ref/mystery/lore"
anchor = "lore-keeper"
print = "Instead of encyclopedic knowledge, you learn most of your information through tales, songs, and poems. You may use your Charisma modifier instead of your Intelligence modifier on all [Knowledge](ref/skill/knowledge-all) checks."

[[entry]]
id = "ref/mystery/lore"
anchor = "mental-acuity"
print = "Your explorations into the secret mysteries of the world have granted you a preternatural understanding of all things—and you just keep getting smarter. You gain a +1 inherent bonus to Intelligence upon taking this revelation and another at every third oracle level gained thereafter. You must be at least 7th level to select this revelation."

[[entry]]
id = "ref/mystery/lore"
anchor = "sidestep-secret"
print = "Your innate understanding of the universe has granted you preternatural reflexes and the uncanny ability to step out of danger at the very last second. Add your Charisma modifier (instead of your Dexterity modifier) to your Armor Class and all Reflex saving throws. Your armor's maximum Dexterity bonus applies to your Charisma instead of your Dexterity."

[[entry]]
id = "ref/mystery/lore"
anchor = "spontaneous-symbology"
print = "Your knowledge of the secret history of the world has unveiled the mysterious symbols that govern reality. You can cast any \"symbol\" spell using a spell slot of the appropriate level, even if the spell is not on your list of spells known. A symbol spell is any spell with the word \"symbol\" in its name. You must be at least 11th level to select this revelation."

[[entry]]
id = "ref/mystery/lore"
anchor = "think-on-it"
print = "Once per day, the oracle of lore can re-attempt any previously failed Knowledge check. On this attempt, add a +10 competence bonus on the check."

[[entry]]
id = "ref/mystery/lore"
anchor = "whirlwind-lesson"
print = "You can quickly browse through a magical tome or manual, gaining its benefits with only a single 8-hour study session (rather than the usual 48 hours over a period of 6 days). At 7th level, you may allow another character to join in your study; both of you gain the full benefit of having read the book. At 15th level, you may share your whirlwind lesson with a number of characters equal to your oracle level. The benefits to you are permanent, whereas your students gain the tome or manual's benefits for a number of days equal to your Charisma modifier but then forget what they have learned."

[[entry]]
id = "ref/mystery/lore"
anchor = "sec-final-revelation"
print = "You gain the ability to take 20 on all Knowledge skill checks. Your understanding of the fundamental underpinnings of reality has also become so advanced that once per day, you can cast _wish_. This ability does not require a material component, but the _wish_ cannot be used to grant ability score bonuses, nor can it be used to replicate spells with expensive material components."

[[entry]]
id = "ref/mystery/nature"
anchor = "deities"
print = "[Erastil](ref/faith/erastil), [Gozreh](ref/faith/gozreh)."

[[entry]]
id = "ref/mystery/nature"
anchor = "class-skills"
print = "An oracle with the nature mystery adds Climb, Fly, Knowledge (nature), Ride, Survival, and Swim to her list of class skills."

[[entry]]
id = "ref/mystery/nature"
anchor = "bonus-spells"
print = "_charm animal_ (2nd), _barkskin_ (4th), _speak with plants_ (6th), _grove of respite_ (8th), _awaken_ (10th), _stone tell_ (12th), _creeping doom_ (14th), _animal shapes_ (16th), _world wave_ (18th)."

[[entry]]
id = "ref/mystery/nature"
anchor = "revelations"
print = "An oracle with the nature mystery can choose from any of the following revelations."

[[entry]]
id = "ref/mystery/nature"
anchor = "bonded-mount"
print = "You gain the service of an unusually intelligent, strong, and loyal mount. The creature must be one that you are capable of riding and is suitable as a mount. A Medium oracle can select a [camel](ref/companion/camel) or a [horse](ref/companion/horse). A Small oracle can select a [pony](ref/companion/pony) or [wolf](ref/companion/wolf), but can also select a [boar](ref/companion/boar) or a [dog](ref/companion/dog) if she is at least 4th level. This mount functions as a druid's [animal companion](ref/sidekick/animal-companion), using your oracle level as your effective druid level. Bonded mounts have an Intelligence score of at least 6."

[[entry]]
id = "ref/mystery/nature"
anchor = "erosion-touch"
print = "As a melee touch attack, you can deal 1d6 points of damage per level to objects or constructs. If used against an object in another creature's possession, treat this attack as a sunder combat maneuver. You can use this ability once per day, plus one time per day for every three levels you possess."

[[entry]]
id = "ref/mystery/nature"
anchor = "friend-to-the-animals"
print = "Add all _[summon nature's ally](ref/spell/summon-natures-ally)_ spells to your spell list. You must still select these spells using your allotment of spells known. Animals within 30 feet of you receive a bonus on all saving throws equal to your Charisma modifier."

[[entry]]
id = "ref/mystery/nature"
anchor = "life-leach"
print = "You can draw life force from the bodies of enemies and channel it into yourself. As a standard action, you can drain the life essence from one living target within 30 feet. The target takes 1d6 points of damage per two levels you possess (maximum 10d6). You gain [temporary hit points](ref/rule/temporary-hit-points) equal to the damage you deal. You can't gain more than the target's current hit points + the target's Constitution score (which is enough to kill the subject). The temporary hit points last a number of hours equal to your Charisma modifier. The target receives a Fortitude save to halve the damage (and the temporary hit points you gain). You may use this ability once per day at 7th level, plus one additional time per day for every 4 levels you possess beyond 7th. You must be at least 7th level before selecting this revelation."

[[entry]]
id = "ref/mystery/nature"
anchor = "natural-divination"
print = "You can read the entrails of a freshly killed animal or humanoid to gain an insight bonus equal to your Charisma modifier on one saving throw. Alternatively, by observing and interpreting the flights of birds, you may apply a +10 competence bonus on any one skill check. Finally, by charting marks in dirt or stone, or observing the behavior of sand when thrown into the wind, you gain a +4 insight bonus on one initiative check. These bonuses must be used during the next 24 hours and you must declare you are using the bonus before the check or save is made. Making a natural divination takes 10 minutes. You may use natural divination (in any combination) once per day plus one additional time per day for every four oracle levels you have attained."

[[entry]]
id = "ref/mystery/nature"
anchor = "nature-s-whispers"
print = "You have become so attuned to the whispers of the natural world, from the croaking of frogs to the groaning of great boulders, that your surroundings constantly keep you preternaturally aware of danger. You may add your Charisma modifier, instead of your Dexterity modifier, to your Armor Class and CMD. Any condition that would cause you to lose your Dexterity modifier to your Armor Class instead causes you to lose your Charisma modifier to your Armor Class."

[[entry]]
id = "ref/mystery/nature"
anchor = "speak-with-animals"
print = "Choose a specific kind of animal (eagle, fox, dog, and so on). You gain the ability to converse with that type of animal as if you were under the effects of _speak with animal_. You gain the ability to communicate with an additional kind of animal for every 3 oracle levels you have attained."

[[entry]]
id = "ref/mystery/nature"
anchor = "spirit-of-nature"
print = "When in a natural setting, whenever you are reduced to negative hit points, you automatically stabilize. At 5th level, you gain [fast healing](ref/umr/fast-healing) 1 for 1d4 rounds whenever you are reduced to negative hit points. At 10th level, the ability works everywhere, even in civilized or wholly artificial realms. At 15th level, you gain [fast healing](ref/umr/fast-healing) 3 for 1d4 rounds when reduced to negative hit points."

[[entry]]
id = "ref/mystery/nature"
anchor = "transcendental-bond"
print = "You become so attuned to the common spirit shared by all living things that you can use it to communicate with allies. You may communicate with your allies for a number of rounds per day equal to your oracle level as if using _[telepathic bond](ref/spell/telepathic-bond)_. You may designate a number of creatures as your ally equal to your Charisma modifier. Designating a creature is a standard action that requires a touch. At 10th level, you may use this bond to cast a touch spell on a designated ally once per day."

[[entry]]
id = "ref/mystery/nature"
anchor = "undo-artifice"
print = "At 11th-level, you gain the ability to reduce a nonliving item to its component parts, essentially erasing the hand of artifice and rendering the item into a pile of raw natural materials. This effect acts as the spell _[polymorph any object](ref/spell/polymorph-any-object)_, working on both magical and nonmagical nonliving objects. The duration is always permanent. Unlike _[polymorph any object](ref/spell/polymorph-any-object)_, it cannot be used to mimic the effects of other spells. Items subject to this effect receive a Fortitude saving throw to negate the effect. Magic items receive a circumstance bonus on this save equal to +1 for every 5,000 gp in the item's value. You may use undo artifice a number of times per day equal to your Charisma modifier."

[[entry]]
id = "ref/mystery/nature"
anchor = "sec-final-revelation"
print = "At 20th level, you have discovered the intrinsic secrets of life itself, granting you incredible control over your own body. Once per day, you can surround yourself with an organic cocoon as a full-round action. While enclosed in the cocoon, you are considered helpless. Eight hours later, you emerge having changed your type to plant, animal, or humanoid, gaining superficial physical characteristics as appropriate (see the _Pathfinder RPG Bestiary_). This change does not alter your Hit Dice, hit points, saving throws, skill points, class skills, or proficiencies. Each time the transformation is made, you are cleansed of all poisons or diseases, are restored to full hit points, and heal all ability damage. You must select a new type every time the transformation is made."

[[entry]]
id = "ref/mystery/stone"
anchor = "deities"
print = "[Abadar](ref/faith/abadar), [Gorum](ref/faith/gorum), [Torag](ref/faith/torag)."

[[entry]]
id = "ref/mystery/stone"
anchor = "class-skills"
print = "An oracle with the stone mystery adds Appraise, Climb, Intimidate, and Survival to her list of class skills."

[[entry]]
id = "ref/mystery/stone"
anchor = "bonus-spells"
print = "_magic stone_ (2nd), _stone call_ (4th), _meld into stone_ (6th), _wall of stone_ (8th), _stoneskin_ (10th), _stone tell_ (12th), _statue_ (14th), _repel metal or stone_ (16th), _clashing rocks_ (18th)."

[[entry]]
id = "ref/mystery/stone"
anchor = "revelations"
print = "An oracle with the stone mystery can choose from any of the following revelations."

[[entry]]
id = "ref/mystery/stone"
anchor = "acid-skin"
print = "You gain [resist](ref/umr/resistance) acid 5. This resistance increases to 10 at 5th level and 20 at 11th level. At 17th level, you gain immunity to acid."

[[entry]]
id = "ref/mystery/stone"
anchor = "clobbering-strike"
print = "Whenever you score a critical hit against an opponent with a spell that requires an attack roll, you may immediately attempt to [trip](ref/rule/trip) your opponent as a swift action. You do not provoke an attack of opportunity as normal for this trip attempt. You cannot be tripped in return when using this ability."

[[entry]]
id = "ref/mystery/stone"
anchor = "crystal-sight"
print = "You can see through stone, earth, or sand as easily as if it were transparent crystal. Your gaze can penetrate a number of feet equal to your oracle level, or 1/12th this thickness of metal. You can use this ability a number of rounds per day equal to your oracle level, but these rounds do not need to be consecutive."

[[entry]]
id = "ref/mystery/stone"
anchor = "earth-glide"
print = "You can pass through stone, dirt, or almost any other sort of earth except worked stone and metal as easily as a fish swims through water. If protected against fire damage, you can even [glide](ref/spell/glide) through lava. You [glide](ref/spell/glide) at your base land speed. While gliding, you breathe stone as if it were air (you do not need to hold your breath). Your burrowing leaves behind no tunnel or hole, nor does it create any ripple or sign of your presence. A _[move earth](ref/spell/move-earth)_ spell cast on an area where you are flings you back 30 feet, [stunning](ref/misc/stunned) you for 1 round unless you succeed on a DC 15 Fortitude save. Activating this ability is a free action. You can glide for 1 minute per day per oracle level. This duration does not need to be consecutive, but it must be spent in 1-minute increments. You must be at least 7th level to select this revelation. You can bring other creatures with you when you glide, but each passenger costs an additional minute per minute of travel."

[[entry]]
id = "ref/mystery/stone"
anchor = "mighty-pebble"
print = "As a standard action, you can charge and throw a pebble (or other stone of similar size) that detonates when it strikes a target as a ranged attack. The pebble has a range increment of 20 feet and has a +1 enhancement bonus to attack and damage for every four oracle levels you possess. Any creature struck by the pebble takes 1d6 points of bludgeoning damage per two oracle levels you possess (minimum 1d6). Creatures in squares adjacent to the target take half damage, or no damage if they make a Reflex saving throw. If the attack roll misses, treat the pebble as a [thrown splash weapon](ref/rule/throw-splash-weapon) to determine where it lands. You can use this ability once per day, plus one additional time per day at 5th level and every five levels thereafter."

[[entry]]
id = "ref/mystery/stone"
anchor = "rock-throwing"
print = "You are an accomplished rock thrower and have a +1 racial bonus on attack rolls with thrown rocks. You can hurl rocks up to two categories smaller than your own size. The range increment for a rock is 20 feet, and you can hurl it up to 5 range increments. Damage for a hurled rock is 2d4 for a Medium creature or 2d3 for a Small creature, plus 1-1/2 your Strength bonus."

[[entry]]
id = "ref/mystery/stone"
anchor = "shard-explosion"
print = "As a swift action, you can cause jagged pieces of stone to explode outward from your body. These shards deal 1d6 points of piercing damage per two oracle levels (minimum 1d6) to all creatures within a 10-foot [burst](ref/misc/burst). A Reflex save halves this damage. In addition, the broken shards make the area [difficult terrain](ref/rule/terrain-and-obstacles) until your next turn. You can use this ability once per day, plus one additional time per day at 5th level and every five levels thereafter."

[[entry]]
id = "ref/mystery/stone"
anchor = "steelbreaker-skin"
print = "As a standard action, you can harden your flesh so that weapons that strike you are damaged or destroyed. Anytime a melee or ranged weapon strikes you, the weapon takes an amount of damage equal to your oracle level. This ability does not prevent the weapon from harming you unless the damage destroys the weapon attacking you. You can use this ability once per day, but the duration is 1 minute/level. You must be at least 7th level to select this revelation. At 15th level, the damage from this ability ignores up to 10 points of [hardness](ref/umr/hardness)."

[[entry]]
id = "ref/mystery/stone"
anchor = "stone-stability"
print = "You receive a +4 bonus to your Combat Maneuver Defense when resisting a [bull rush](ref/rule/bull-rush) or trip attempt while standing on the ground. At 5th level, you gain [Improved Trip](ref/feat/improved-trip) as a bonus feat. At 10th level, you gain [Greater Trip](ref/feat/greater-trip) as a bonus feat. You do not need to meet the prerequisites to gain these feats."

[[entry]]
id = "ref/mystery/stone"
anchor = "touch-of-acid"
print = "As a standard action, you can perform a melee touch attack that deals 1d6 points of acid damage +1 point for every two oracle levels you possess. You can use this ability a number of times per day equal to 3 + your Charisma modifier. At 11th level, any weapon that you wield deals +1d6 points of acid damage, similar to how a _[flaming](ref/magic-enh/flaming)_ weapon operates."

[[entry]]
id = "ref/mystery/stone"
anchor = "sec-final-revelation"
print = "Upon reaching 20th level, you become a master of acid and earth. You can apply any one of the following feats to any acid or earth spell without increasing the level or casting time: Enlarge Spell, Extend Spell, Silent Spell, or Still Spell."

[[entry]]
id = "ref/mystery/waves"
anchor = "deities"
print = "[Gozreh](ref/faith/gozreh), [Pharasma](ref/faith/pharasma)."

[[entry]]
id = "ref/mystery/waves"
anchor = "class-skills"
print = "An oracle with the waves mystery adds Acrobatics, Escape Artist, Knowledge (nature), and Swim to her list of class skills."

[[entry]]
id = "ref/mystery/waves"
anchor = "bonus-spells"
print = "_touch of the sea_ (2nd), _slipstream_ (4th), _water breathing_ (6th), _wall of ice_ (8th), _geyser_ (10th), _fluid form_ (12th), _vortex_ (14th), _seamantle_ (16th), _tsunami_ (18th)."

[[entry]]
id = "ref/mystery/waves"
anchor = "revelations"
print = "An oracle with the waves mystery can choose from any of the following revelations."

[[entry]]
id = "ref/mystery/waves"
anchor = "blizzard"
print = "As a standard action, you can create a blizzard of snow and ice. You can create one 10-foot-cube of storm per oracle level. These cubes can be arranged in any pattern you desire, but each cube must be adjacent to another and one must be adjacent to you. Any creature caught in the blizzard takes 1d4 points of cold damage per oracle level, with a Reflex save resulting in half damage. The storm lasts for a number of rounds equal to your Charisma modifier; the ground remains icy (+5 to [Acrobatics](ref/skill/acrobatics) DCs) as long as local conditions permit. The blizzard obscures sight beyond 5 feet, providing total [concealment](ref/rule/concealment). A creature within 5 feet has concealment. You can use this ability once per day. You must be 11th level to select this revelation."

[[entry]]
id = "ref/mystery/waves"
anchor = "fluid-nature"
print = "You receive a +4 bonus to your Combat Maneuver Defense against [bull rush](ref/rule/bull-rush), [drag](ref/rule/drag), [grapple](ref/rule/grapple), [reposition](ref/rule/reposition), and [trip](ref/rule/trip) attempts. A creature trying to confirm a critical hit against you has a -4 penalty on its confirmation roll. At 5th level, you gain [Dodge](ref/feat/dodge) as a bonus feat. You do not need to meet the prerequisite to gain this feat."

[[entry]]
id = "ref/mystery/waves"
anchor = "fluid-travel"
print = "You can walk on liquid as if it were a solid surface. Walking on the liquid does not harm you; you can walk on acid or even lava (as if walking on a solid temporary crust), though you would still take fire damage from being near the lava. You can move across this surface at your normal land speed. At 7th level, while this ability is in effect, you can instead go underwater, gaining a swim speed of 60 feet and the ability to breathe water. You can use this ability for 1 hour per day per oracle level. This duration does not need to be consecutive, but it must be spent in 1-hour increments."

[[entry]]
id = "ref/mystery/waves"
anchor = "freezing-spells"
print = "Whenever a creature fails a saving throw and takes cold damage from one of your spells, it is slowed (as the _[slow](ref/spell/slow)_ spell) for 1 round. Spells that do not allow a save do not slow creatures. At 11th level, the duration increases to 1d4 rounds."

[[entry]]
id = "ref/mystery/waves"
anchor = "ice-armor"
print = "You can conjure armor of ice that grants you a +4 armor bonus. At 7th level, and every four levels thereafter, this bonus increases by +2. At 13th level, this armor grants you DR 5/piercing. In cold conditions, the armor bonus (and DR bonus) increases by 2; in very hot conditions it decreases by 2. You can use this armor for 1 hour per day per oracle level. This duration does not need to be consecutive, but it must be spent in 1-hour increments."

[[entry]]
id = "ref/mystery/waves"
anchor = "icy-skin"
print = "You gain [resist](ref/umr/resistance) cold 5. This resistance increases to 10 at 5th level and 20 at 11th level. At 17th level, you gain immunity to cold."

[[entry]]
id = "ref/mystery/waves"
anchor = "punitive-transformation"
print = "You can transform an opponent into a harmless animal as if using _[baleful polymorph](ref/spell/baleful-polymorph)_. This transformation lasts 1 round per oracle level. Transforming another creature causes the first to immediately revert to normal. You may use this ability a number of times per day equal to your Charisma modifier. You must be at least 7th level before selecting this revelation."

[[entry]]
id = "ref/mystery/waves"
anchor = "water-form"
print = "As a standard action, you can assume the form of a [Small water elemental](ref/monster/water-elemental), as _[elemental body I](ref/spell/elemental-body-1)_. At 9th level, you can assume the form of a Medium water elemental, as _[elemental body II](ref/spell/elemental-body-2)_. At 11th level, you can assume the form of a Large water elemental, as _[elemental body III](ref/spell/elemental-body-3)_. At 13th level, you can assume the form of a Huge water elemental, as _[elemental body IV](ref/spell/elemental-body-4)_. You can use this ability once per day, but the duration is 1 hour/level. You must be at least 7th level to select this revelation."

[[entry]]
id = "ref/mystery/waves"
anchor = "water-sight"
print = "You can see through fog and mist without penalty as long as there is enough light to allow you to see normal. At 7th level, you can use any calm pool of water at least 1 foot in diameter as a [scrying](ref/spell/scrying) device, as if using the _scry_ spell. At 15th level, this functions like _[greater scrying](ref/spell/scrying-greater)_. You can use the scrying abilities for a number of rounds per day equal to your oracle level, but these rounds do not need to be consecutive."

[[entry]]
id = "ref/mystery/waves"
anchor = "wintry-touch"
print = "As a standard action, you can perform a melee touch attack that deals 1d6 points of cold damage + 1 point for every two oracle levels you possess. You can use the wintry touch ability a number of times per day equal to 3 + your Charisma modifier. At 11th level, any weapon that you wield is treated as a _[frost](ref/magic-enh/frost)_ weapon."

[[entry]]
id = "ref/mystery/waves"
anchor = "sec-final-revelation"
print = "Upon reaching 20th level, you become a master of cold and water. You can apply any one of the following feats to any cold or water spell without increasing the level or casting time: Enlarge Spell, Extend Spell, Silent Spell, or Still Spell."

[[entry]]
id = "ref/mystery/wind"
anchor = "deities"
print = "[Gozreh](ref/faith/gozreh), [Shelyn](ref/faith/shelyn)."

[[entry]]
id = "ref/mystery/wind"
anchor = "class-skills"
print = "An oracle with the wind mystery adds Acrobatics, Escape Artist, Fly, and Stealth to her list of class skills."

[[entry]]
id = "ref/mystery/wind"
anchor = "bonus-spells"
print = "_alter winds_ (2nd), _gust of wind_ (4th), _cloak of winds_ (6th), _river of wind_ (8th), _control winds_ (10th), _sirocco_ (12th), _control weather_ (14th), _whirlwind_ (16th), _winds of vengeance_ (18th)."

[[entry]]
id = "ref/mystery/wind"
anchor = "revelations"
print = "An oracle with the wind mystery can choose from any of the following revelations."

[[entry]]
id = "ref/mystery/wind"
anchor = "air-barrier"
print = "You can create an invisible shell of air that grants you a +4 armor bonus. At 7th level, and every four levels thereafter, this bonus increases by +2. At 13th level, this barrier causes incoming arrows, rays, and other ranged attacks requiring an attack roll against you to have a 50% miss chance. You can use this barrier for 1 hour per day per oracle level. This duration does not need to be consecutive, but it must be spent in 1-hour increments."

[[entry]]
id = "ref/mystery/wind"
anchor = "gaseous-form"
print = "As a standard action, you can assume _[gaseous form](ref/spell/gaseous-form)_ (as the spell). You can remain gaseous for 1 minute per day per oracle level. This duration does not need to be consecutive, but it must be spent in 1-minute increments. You must be at least 7th level to select this revelation. You can bring other creatures with you in gaseous form, but each passenger costs an additional minute per minute of travel."

[[entry]]
id = "ref/mystery/wind"
anchor = "invisibility"
print = "As a standard action, you can become invisible (as per the _[invisibility](ref/spell/invisibility)_ spell). You can remain invisible for 1 minute per day per oracle level. This duration does not need to be consecutive, but it must be spent in 1-minute increments. Starting at 9th level, each time you activate this ability you can treat it as _[greater invisibility](ref/spell/invisibility-greater)_, though each round spent this way counts as 1 minute of your normal _invisibility_ duration. You must be at least 3rd level to select this revelation."

[[entry]]
id = "ref/mystery/wind"
anchor = "lightning-breath"
print = "As a standard action, you can breathe a 30-foot line of electricity. This line deals 1d4 points of electricity damage per oracle level. A Reflex save halves this damage. You can use this ability once per day, plus one additional time per day at 5th level and every five levels thereafter."

[[entry]]
id = "ref/mystery/wind"
anchor = "spark-skin"
print = "You gain [resist](ref/umr/resistance) electricity 5. This resistance increases to 10 at 5th level and 20 at 11th level. At 17th level, you gain immunity to electricity."

[[entry]]
id = "ref/mystery/wind"
anchor = "thunderburst"
print = "As a standard action, you can create a blast of air accompanied by a loud peal of thunder. The blast has a range of 100 feet and has a 20-foot radius, increasing by 5 feet for every 4 oracle levels after 7th. Creatures in the area take 1d6 points of bludgeoning damage per oracle level and are [deafened](ref/misc/deafened) for 1 hour, with a Fortitude save resulting in half damage and no deafness. You must be at least 7th level to select this revelation. You can use this ability once per day, plus one additional time per day at 11th level and every four levels thereafter."

[[entry]]
id = "ref/mystery/wind"
anchor = "touch-of-electricity"
print = "As a standard action, you can perform a melee touch attack that deals 1d6 points of electricity damage +1 point for every two oracle levels you possess. You can use this ability a number of times per day equal to 3 + your Charisma modifier. At 11th level, any weapon that you wield is treated as a _[shock](ref/magic-enh/shock)_ weapon."

[[entry]]
id = "ref/mystery/wind"
anchor = "vortex-spells"
print = "Whenever you score a critical hit against an opponent with an attack spell, the target is [staggered](ref/misc/staggered) for 1 round. At 11th level, the duration increases to 1d4 rounds."

[[entry]]
id = "ref/mystery/wind"
anchor = "wind-sight"
print = "You ignore penalties on [Perception](ref/skill/perception) checks based on wind and the first 100 feet of distance. At 7th level, as a standard action, you can see and hear into any area (as if using _clairaudience_ and _clairvoyance_) within range as long as there is an unobstructed path for air to travel between you and the target area (this does not require line of effect, meaning the path can turn corners and go through spaces no smaller than 1 inch in diameter). You can use this ability a number of rounds per day equal to your oracle level, but these rounds do not need to be consecutive."

[[entry]]
id = "ref/mystery/wind"
anchor = "wings-of-air"
print = "As a swift action, you can manifest a pair of translucent, cloud-like wings that grant you a fly speed of 60 feet with good maneuverability. At 10th level, your speed increases to 90 feet and your maneuverability increases to perfect. You can use these wings for 1 minute per day per oracle level. This duration does not need to be consecutive, but it must be spent in 1-minute increments. You must be at least 7th level to select this revelation."

[[entry]]
id = "ref/mystery/wind"
anchor = "sec-final-revelation"
print = "Upon reaching 20th level, you become a master of air and electricity. You can apply any one of the following feats to any air or electricity spell without increasing the level or casting time: Enlarge Spell, Extend Spell, Silent Spell, or Still Spell."

[[entry]]
id = "ref/oraclecurse/clouded-vision"
anchor = "clouded-vision"
print = '''
Your eyes are obscured, making it difficult for you to see. You cannot see anything beyond 30 feet, but you can see as if you had [darkvision](ref/rule/darkvision). At 5th level, this distance increases to 60 feet. At 10th level, you gain [blindsense](ref/umr/blindsense) out to a range of 30 feet. At 15th level, you gain [blindsight](ref/umr/blindsight) out to a range of 15 feet.

Table 2–5: Oracle Base Attack Fort Ref Will Level Bonus Save Save Save Special 1st +0 +0 +0 +2 Mystery, oracle's curse, orisons, revelation 2nd +1 +0 +0 +3 Mystery spell 3rd +2 +1 +1 +3 Revelation 4th +3 +1 +1 +4 Mystery spell 5th +3 +1 +1 +4 — 6th +4 +2 +2 +5 Mystery spell 7th +5 +2 +2 +5 Revelation 8th +6/+1 +2 +2 +6 Mystery spell 9th +6/+1 +3 +3 +6 — 10th +7/+2 +3 +3 +7 Mystery spell 11th +8/+3 +3 +3 +7 Revelation 12th +9/+4 +4 +4 +8 Mystery spell 13th +9/+4 +4 +4 +8 — 14th +10/+5 +4 +4 +9 Mystery spell 15th +11/+6/+1 +5 +5 +9 Revelation 16th +12/+7/+2 +5 +5 +10 Mystery spell 17th +12/+7/+2 +5 +5 +10 — 18th +13/+8/+3 +6 +6 +11 Mystery spell 19th +14/+9/+4 +6 +6 +11 Revelation 20th +15/+10/+5 +6 +6 +12 Final revelation _Deaf_: You cannot hear and suffer all of the usual penalties for being deafened. You cast all of your spells as if they were modified by the Silent Spell feat. This does not increase their level or casting time. At 5th level, you receive a +3 competence bonus on Perception checks that do not rely upon hearing, and the initiative penalty for being deaf is reduced to -2. At 10th level, you gain scent and you do not suffer any penalty on initiative checks due to being deaf. At 15th level, you gain tremorsense out to a range of 30 feet.'''

[[entry]]
id = "ref/oraclecurse/haunted"
anchor = "haunted"
print = "Malevolent spirits follow you wherever you go, causing minor mishaps and strange occurrences (such as unexpected breezes, small objects moving on their own, and faint noises). Retrieving any stored item from your gear requires a standard action, unless it would normally take longer. Any item you drop lands 10 feet away from you in a random direction. Add _[mage hand](ref/spell/mage-hand)_ and _[ghost sound](ref/spell/ghost-sound)_ to your list of spells known. At 5th level, add _[levitate](ref/spell/levitate)_ and _[minor image](ref/spell/minor-image)_ to your list of spells known. At 10th level, add _[telekinesis](ref/spell/telekinesis)_ to your list of spells known. At 15th level, add _[reverse gravity](ref/spell/reverse-gravity)_ to your list of spells known."

[[entry]]
id = "ref/oraclecurse/lame"
anchor = "lame"
print = "One of your legs is permanently wounded, reducing your base land speed by 10 feet if your base speed is 30 feet or more. If your base speed is less than 30 feet, your speed is reduced by 5 feet. Your speed is never reduced Spells per Day 1st 2nd 3rd 4th 5th 6th 7th 8th 9th 3 — — — — — — — — 4 — — — — — — — — 5 — — — — — — — — 6 3 — — — — — — — 6 4 — — — — — — — 6 5 3 — — — — — — 6 6 4 — — — — — — 6 6 5 3 — — — — — 6 6 6 4 — — — — — 6 6 6 5 3 — — — — 6 6 6 6 4 — — — — 6 6 6 6 5 3 — — — 6 6 6 6 6 4 — — — 6 6 6 6 6 5 3 — — 6 6 6 6 6 6 4 — — 6 6 6 6 6 6 5 3 — 6 6 6 6 6 6 6 4 — 6 6 6 6 6 6 6 5 3 6 6 6 6 6 6 6 6 4 6 6 6 6 6 6 6 6 6 due to encumbrance. At 5th level, you are immune to the [fatigued](ref/misc/fatigued) condition (but not exhaustion). At 10th level, your speed is never reduced by armor. At 15th level, you are immune to the [exhausted](ref/misc/exhausted) condition."

[[entry]]
id = "ref/oraclecurse/tongues"
anchor = "tongues"
print = "In times of stress or unease, you speak in [tongues](ref/spell/tongues). Pick one of the following languages: Abyssal, Aklo, Aquan, Auran, Celestial, Ignan, Infernal, or Terran. Whenever you are in combat, you can only speak and understand the selected language. This does not interfere with spellcasting, but it does apply to spells that are [language dependent](ref/spelldef/language-dependent). You gain the selected language as a bonus language. At 5th level, pick an additional language to speak in combat and add it to your list of known languages. At 10th level, you can understand any spoken language, as if under the effects of _tongues,_ even during combat. At 15th level, you can speak and understand any language, but your speech is still restricted during combat."

[[entry]]
id = "ref/oraclecurse/wasting"
anchor = "wasting"
print = "Your body is slowly rotting away. You take a -4 penalty on Charisma-based skill checks, except for [Intimidate](ref/skill/intimidate). You gain a +4 competence bonus on saves made against disease. At 5th level, you are immune to the [sickened](ref/misc/sickened) condition (but not [nauseated](ref/misc/nauseated)). At 10th level, you gain immunity to disease. At 15th level, you are immune to the nauseated condition."

[[entry]]
id = "ref/order/order-of-the-cockatrice"
anchor = "opening"
print = "A cavalier who belongs to this order serves only himself, working to further his own aims and increase his own prestige. Cavaliers of this order tend to be selfish and concerned only with personal goals and objectives."

[[entry]]
id = "ref/order/order-of-the-cockatrice"
anchor = "edicts"
print = "The cavalier must keep his own interests and aims above those of all others. He must always accept payment when it is due, rewards when earned, and an even (or greater) share of loot. The cavalier must take every opportunity to increase his own stature, prestige, and power."

[[entry]]
id = "ref/order/order-of-the-cockatrice"
anchor = "challenge"
print = "Whenever an order of the cockatrice cavalier issues a challenge, he receives a +1 morale bonus on all melee damage rolls made against the target of his challenge as long as he is the only creature threatening the target (not counting his mount). This bonus increases by +1 for every four levels the cavalier possesses."

[[entry]]
id = "ref/order/order-of-the-cockatrice"
anchor = "skills"
print = "An order of the cockatrice cavalier adds [Appraise](ref/skill/appraise) (Int) and [Perform](ref/skill/perform-any) (Cha) to his list of class skills. In addition, an order of the cockatrice cavalier adds his Charisma modifier to the DC on another creature's attempt to demoralize him through [Intimidate](ref/skill/intimidate) (in addition to his Wisdom modifier, as normal)."

[[entry]]
id = "ref/order/order-of-the-cockatrice"
anchor = "order-abilities"
print = "A cavalier that belongs to the order of the cockatrice gains the following abilities as he increases in level."

[[entry]]
id = "ref/order/order-of-the-cockatrice"
anchor = "braggart"
print = "At 2nd level, the cavalier can spend a standard action to extol his own accomplishments and battle prowess. He receives [Dazzling Display](ref/feat/dazzling-display) as a bonus feat. He does not need a weapon in hand to use this ability. The cavalier receives a +2 morale bonus on melee attack rolls made against demoralized targets."

[[entry]]
id = "ref/order/order-of-the-cockatrice"
anchor = "steal-glory"
print = "At 8th level, the cavalier can steal the glory from another creature's successful strike. Whenever a creature other than the cavalier scores a critical hit against a target that the cavalier is threatening, he can make an attack of opportunity against the same target."

[[entry]]
id = "ref/order/order-of-the-cockatrice"
anchor = "moment-of-triumph"
print = "At 15th level, the cavalier can, as a free action, declare a moment of triumph. For 1 round, the cavalier receives a competence bonus equal to his Charisma modifier on all ability checks, attack rolls, damage rolls, saving throws, and skill checks. This bonus is also added to his AC. In addition, any critical threats he makes are automatically confirmed. The cavalier can use this ability once per day."

[[entry]]
id = "ref/order/order-of-the-dragon"
anchor = "opening"
print = "Cavaliers belonging to the order of the dragon dedicate themselves to a group of like-minded individuals, be it a mercenary company or a small band of adventurers. These cavaliers believe in loyalty and friendship, and are willing to lay down their lives to protect their allies."

[[entry]]
id = "ref/order/order-of-the-dragon"
anchor = "edicts"
print = "The cavalier must remain loyal to his allies and must always work to further the aims of the group. He must protect his allies from harm and defend their honor when called into doubt."

[[entry]]
id = "ref/order/order-of-the-dragon"
anchor = "challenge"
print = "Whenever an order of the dragon cavalier issues a challenge, his allies receive a +1 circumstance bonus on melee attack rolls against the target of his challenge whenever he is threatening the target. This bonus increases by +1 for every four levels the cavalier possesses."

[[entry]]
id = "ref/order/order-of-the-dragon"
anchor = "skills"
print = "An order of the dragon cavalier adds [Perception](ref/skill/perception) (Wis) and [Survival](ref/skill/survival) (Wis) to his list of class skills. In addition, whenever an order of the dragon cavalier uses Survival to"

[[entry]]
id = "ref/order/order-of-the-dragon"
anchor = "save-special"
print = "+0 Challenge 1/day, mount, order, tactician +0 Order ability +1 Cavalier's charge +1 Challenge 2/day, expert trainer +1 Banner +2 Bonus feat +2 Challenge 3/day +2 Order ability +3 Greater tactician +3 Challenge 4/day +3 Mighty charge +4 Bonus feat, demanding challenge +4 Challenge 5/day +4 Greater banner +5 Order ability +5 Challenge 6/day +5 Master tactician +6 Bonus feat +6 Challenge 7/day +6 Supreme charge provide food and water for his allies or to protect his allies from harsh weather, he receives a bonus on the check equal to 1/2 his cavalier level (minimum +1)."

[[entry]]
id = "ref/order/order-of-the-dragon"
anchor = "order-abilities"
print = "A cavalier that belongs to the order of the dragon gains the following abilities as he increases in level."

[[entry]]
id = "ref/order/order-of-the-dragon"
anchor = "aid-allies"
print = "At 2nd level, whenever an order of the dragon cavalier uses the [aid another](ref/rule/aid-another-2) action to assist one of his allies, the ally receives a +3 bonus to his Armor Class, attack roll, saving throw, or skill check. At 8th level, and every six levels thereafter, this bonus increases by an additional +1."

[[entry]]
id = "ref/order/order-of-the-dragon"
anchor = "strategy"
print = "At 8th level, the cavalier can spend a standard action to grant one of a number of bonuses to all allies within 30 feet (including himself). The allies must be able to see or hear the cavalier to receive this bonus. The cavalier can grant a +2 dodge bonus to AC for 1 round, a +2 morale bonus on all attack rolls for 1 round, or the ability to move up to their speed as an immediate action once. The cavalier can grant a different bonus to each ally within range, but allies can only benefit from this ability once per combat."

[[entry]]
id = "ref/order/order-of-the-dragon"
anchor = "act-as-one"
print = "At 15th level, the cavalier can spend a standard action to move up to his speed and make a melee attack. All allies within 30 feet can also move up to their speed and make a melee attack as an immediate action. This movement and attack can be made as a [charge](ref/rule/charge) if the movement qualifies. All attacks are made at a +2 bonus (this stacks with the bonus from a charge) and all participants receive a +2 dodge bonus to their AC for 1 round. A cavalier can use this ability once per combat."

[[entry]]
id = "ref/order/order-of-the-lion"
anchor = "opening"
print = "A cavalier who belongs to this order has pledged himself to a sovereign; be it a king, queen, or even the local warlord. Cavaliers of this order are stalwart and dedicated to their cause, willing to go any length to ensure the safety of their lord and his domain."

[[entry]]
id = "ref/order/order-of-the-lion"
anchor = "edicts"
print = "The cavalier must protect the life and lands of his sovereign at all costs. He must obey the commands of his sovereign without question. He must strive to expand the power and prestige of his realm."

[[entry]]
id = "ref/order/order-of-the-lion"
anchor = "challenge"
print = "Whenever an order of the lion cavalier issues a challenge, he receives a +1 dodge bonus to his AC against attacks made by the target of his challenge. This bonus increases by +1 for every four levels the cavalier possesses."

[[entry]]
id = "ref/order/order-of-the-lion"
anchor = "skills"
print = "An order of the lion cavalier adds [Knowledge (local)](ref/skill/knowledge-local) (Int) and [Knowledge (nobility)](ref/skill/knowledge-nobility) (Int) to his list of class skills. An order of the lion cavalier can make Knowledge (nobility) skill checks untrained. If he has ranks in the skill, he receives a bonus on the check equal to 1/2 his cavalier level (minimum +1) as long as the check involves his sovereign."

[[entry]]
id = "ref/order/order-of-the-lion"
anchor = "order-abilities"
print = "A cavalier belonging to the order of the lion gains the following abilities as he increases in level."

[[entry]]
id = "ref/order/order-of-the-lion"
anchor = "lion-s-call"
print = "At 2nd level, an order of the lion cavalier gains the ability to rally his allies. As a standard action, he can give an encouraging speech which grants all allies within 60 feet a competence bonus on their saving throws against fear equal to his Charisma modifier and a +1 competence bonus on attack rolls for a number of rounds equal to his cavalier level. If an ally within range is under the effect of a spell or ability that causes him to be frightened or panicked, he can immediately make another saving throw to resist the effect (if allowed)."

[[entry]]
id = "ref/order/order-of-the-lion"
anchor = "for-the-king"
print = "At 8th level, an order of the lion cavalier can call out to his allies, inspiring them to greatness. As a swift action, the cavalier can grant a competence bonus equal to his Charisma modifier on all attack and damage rolls to all allies within 30 feet. This bonus lasts for 1 round. This ability can be used once per combat."

[[entry]]
id = "ref/order/order-of-the-lion"
anchor = "shield-of-the-liege"
print = "At 15th level, an order of the lion cavalier can protect those around him. Allies that are adjacent to the cavalier receive a +2 shield bonus to their AC. In addition, as an immediate action, the cavalier can redirect an attack made at a creature adjacent to himself, as long as the creature making the attack is within the cavalier's reach. This ability must be declared before the attack roll is made. The attack is made against the cavalier's AC and defenses, even if the creature could not normally reach or attack the cavalier. The cavalier loses any cover or concealment bonuses when subject to the redirected attack."

[[entry]]
id = "ref/order/order-of-the-shield"
anchor = "opening"
print = "Cavaliers who join the order of the shield devote their lives to protecting the common folk, from the simple farmer to the honest craftsman. These cavaliers stand before the tide, protecting the innocent from roving marauders and hungry monsters."

[[entry]]
id = "ref/order/order-of-the-shield"
anchor = "edicts"
print = "The cavalier must protect the lives and prosperity of the common folk, shielding them from the deprivations of those who would seek to cause them harm or exploit them. He must give charity when it is warranted and aid when needed. He must take no action that would cause harm or hardship to those who cannot defend themselves."

[[entry]]
id = "ref/order/order-of-the-shield"
anchor = "challenge"
print = "Whenever an order of the shield cavalier issues a challenge, he receives a +1 morale bonus on attack rolls made against the target of his challenge if the target makes an attack against a target other than the cavalier. This bonus lasts for 1 minute. The bonus increases by +1 for every four levels the cavalier possesses."

[[entry]]
id = "ref/order/order-of-the-shield"
anchor = "skills"
print = "An order of the shield cavalier adds [Heal](ref/skill/heal) (Wis) and [Knowledge (local)](ref/skill/knowledge-local) (Int) to his list of class skills. Whenever an order of the shield cavalier uses the Heal skill on a creature other than himself, he receives a bonus on the check equal to 1/2 his cavalier level (minimum +1)."

[[entry]]
id = "ref/order/order-of-the-shield"
anchor = "order-abilities"
print = "A cavalier belonging to the order of the shield gains the following abilities as he increases in level."

[[entry]]
id = "ref/order/order-of-the-shield"
anchor = "resolute"
print = "At 2nd level, whenever the cavalier takes damage from a melee or ranged attack while wearing heavy armor, the cavalier can convert 1 point of lethal damage to 1 point of nonlethal damage. He can use this ability once each time he takes damage. This ability cannot be used to convert [ability damage, ability drain](ref/rule/ability-damage-drain), or energy damage to nonlethal damage. At 6th level, and every four levels thereafter, the amount of damage the cavalier can convert increases by 1."

[[entry]]
id = "ref/order/order-of-the-shield"
anchor = "stem-the-tide"
print = "At 8th level, the cavalier receives [Stand Still](ref/feat/stand-still) as a bonus feat, even if he does not meet the prerequisites. Instead of making a combat maneuver check to stop the creature from moving, a cavalier with this ability can elect to make a normal attack instead. If the attack hits and deals damage, the target must stop moving, just as if the cavalier had made a successful combat maneuver check."

[[entry]]
id = "ref/order/order-of-the-shield"
anchor = "protect-the-meek"
print = "At 15th level, the cavalier can move to intercept foes. As an immediate action, he can move up to his speed (or his mount's speed, if mounted) and make a single melee attack. This movement provokes attacks of opportunity as normal. The cavalier must end his movement adjacent to an enemy. On his next turn, the cavalier is [staggered](ref/misc/staggered) and cannot use this ability again for 1 round."

[[entry]]
id = "ref/order/order-of-the-star"
anchor = "opening"
print = "Cavaliers who join the order of the star dedicate themselves to the protection and service of a faith and its members. Cavaliers belonging to this order tend to follow many of the tenets and guides of the religion that they serve. When a cavalier joins this order, he should select a single religion to serve."

[[entry]]
id = "ref/order/order-of-the-star"
anchor = "edicts"
print = "The cavalier must strive to protect the faith and all those who follow its teachings, from priest to common man. He must adhere to the strictures of the faith, promote its cause whenever possible, and serve the agents of the divine."

[[entry]]
id = "ref/order/order-of-the-star"
anchor = "challenge"
print = "Whenever an order of the star cavalier issues a challenge, he receives a +1 morale bonus on all his saving throws as long as he is threatening the target of his challenge. This bonus increases by +1 for every four levels the cavalier possesses."

[[entry]]
id = "ref/order/order-of-the-star"
anchor = "skills"
print = "An order of the star cavalier adds [Heal](ref/skill/heal) (Wis) and [Knowledge (religion)](ref/skill/knowledge-religion) (Int) to his list of class skills. An order of the star cavalier can make Knowledge (religion) skill checks untrained. If he has ranks in the skill, he receives a bonus on the check equal to 1/2 his cavalier level (minimum +1) as long as the check involves his chosen faith."

[[entry]]
id = "ref/order/order-of-the-star"
anchor = "order-abilities"
print = "An order of the star cavalier gains the following abilities as he increases in level."

[[entry]]
id = "ref/order/order-of-the-star"
anchor = "calling"
print = "At 2nd level, the cavalier can make a short prayer as a standard action, filling him with confidence in his abilities. At any point in the next minute, he can receive a competence bonus on an ability check, attack roll, saving throw, or skill check equal to his Charisma modifier. He must declare that he is using this bonus before the roll is made. He can use this ability up to four times per day, once for each type of check or roll. In addition, the cavalier adds 1/2 his cavalier level to any levels of paladin or cleric he might possess for the purposes of determining the effects of [channel energy](ref/ability/channel-energy) or [lay on hands](ref/ability/lay-on-hands)."

[[entry]]
id = "ref/order/order-of-the-star"
anchor = "for-the-faith"
print = "At 8th level, the cavalier can call upon his faith to bolster himself in combat. As a free action, the cavalier can call out the name of his deity, granting him a morale bonus on attack rolls equal to his Charisma modifier for 1 round. In addition, any allies within 30 feet that share his faith also receive half this bonus (minimum +1). The cavalier can use this ability once per day, plus one additional time per day at 12th level and every four levels thereafter."

[[entry]]
id = "ref/order/order-of-the-star"
anchor = "retribution"
print = "At 15th level, the cavalier can take retribution on those who dare to strike an agent of his faith. Whenever an enemy makes a successful melee attack against the cavalier or an adjacent ally devoted to the same faith as the cavalier, the enemy provokes an attack of opportunity from the cavalier. The cavalier receives a +2 morale bonus on the attack of opportunity. If the attack made by the enemy was a critical hit, the cavalier may treat the enemy as the target of his challenge for the attack of opportunity. The cavalier can use this ability once per round."

[[entry]]
id = "ref/order/order-of-the-sword"
anchor = "opening"
print = "Cavaliers who join the order of the sword dedicate their lives to the code of chivalry, living a life of honor, valor, and fairness. Cavaliers of this order tend to swear service to a lord or a lady. Of all the orders, the order of the sword is perhaps the broadest in terms of its focus and ideals."

[[entry]]
id = "ref/order/order-of-the-sword"
anchor = "edicts"
print = "The cavalier must show courage in the face of danger, mercy to those who have wronged him, and charity to the poor and the meek. He must be just and honorable at all times and in all things. He must defend his honor and, above all else, the honor of those he serves."

[[entry]]
id = "ref/order/order-of-the-sword"
anchor = "challenge"
print = "Whenever an order of the sword cavalier issues a challenge, he receives a +1 morale bonus on attack rolls against the target of his challenge so long as he is astride his mount. The bonus increases by +1 for every four levels the cavalier possesses."

[[entry]]
id = "ref/order/order-of-the-sword"
anchor = "skills"
print = "An order of the sword cavalier adds [Knowledge (nobility)](ref/skill/knowledge-nobility) (Int) and [Knowledge (religion)](ref/skill/knowledge-religion) (Int) to his list of class skills. Whenever the cavalier uses [Sense Motive](ref/skill/sense-motive) to oppose a [Bluff](ref/skill/bluff) check, he receives a competence bonus on the check equal to 1/2 his cavalier level (minimum +1)."

[[entry]]
id = "ref/order/order-of-the-sword"
anchor = "order-abilities"
print = "An order of the sword cavalier receives the following abilities as he increases in level."

[[entry]]
id = "ref/order/order-of-the-sword"
anchor = "by-my-honor"
print = "At 2nd level, the cavalier must select one alignment. As long as he maintains the selected alignment, he receives a +2 morale bonus to one saving throw of his choice."

[[entry]]
id = "ref/order/order-of-the-sword"
anchor = "mounted-mastery"
print = "At 8th level, the cavalier ignores the armor check penalty when using the [Ride](ref/skill/ride) skill, regardless of whether or not the creature he is riding is his mount. Whenever he makes a [charge](ref/rule/charge) attack while mounted, he receives a +4 dodge bonus to his AC to avoid attacks set against his charge. When making such an attack, he can add his mount's Strength modifier to the damage roll, in addition to his own. He also receives a bonus feat, chosen from the following list: [Mounted Combat](ref/feat/mounted-combat), [Ride-By Attack](ref/feat/ride-by-attack), [Skill Focus](ref/feat/skill-focus) (Ride), [Spirited Charge](ref/feat/spirited-charge), [Trample](ref/feat/trample), or [Unseat](ref/feat/unseat). He must qualify for the feat selected."

[[entry]]
id = "ref/order/order-of-the-sword"
anchor = "knight-s-challenge"
print = "At 15th level, the cavalier can make a knight's challenge once per day. This functions like a normal challenge, but the cavalier adds his Charisma bonus on all attack rolls and damage rolls made against the target of his challenge. In addition, he receives a +4 circumstance bonus on attack rolls made to confirm critical hits against the target of his knight's challenge."

[[entry]]
id = "ref/ragepower/beast-totem"
anchor = "beast-totem"
print = "While raging, the barbarian gains a +1 natural armor bonus. This bonus increases by +1 for every four levels the barbarian has attained. A barbarian must have the [lesser beast totem](ref/ragepower/lesser-beast-totem) rage power to select this rage power. A barbarian must be at least 6th level to select this rage power."

[[entry]]
id = "ref/ragepower/boasting-taunt"
anchor = "boasting-taunt"
print = '''
While raging, the barbarian can incite a creature to attack her by making an
[Intimidate](ref/skill/intimidate) check to demoralize. If the check succeeds, the target is also
[shaken](ref/misc/shaken) as long as the barbarian is visible and raging or until it makes a melee
attack against the barbarian. The barbarian receives a +2 circumstance bonus on this check for every
alcoholic drink she has consumed during this rage. This is a language-dependent mind-affecting
effect, and it relies on audible components. The barbarian must be at least 6th level to select this
power.'''

[[entry]]
id = "ref/ragepower/brawler"
anchor = "brawler"
print = '''
While raging, the barbarian is treated as if she has
[Improved Unarmed Strike](ref/feat/improved-unarmed-strike). If she already has the feat, her
unarmed strikes deal 1d6 points of damage (1d4 if she is Small).'''

[[entry]]
id = "ref/ragepower/chaos-totem"
anchor = "chaos-totem"
print = '''
While raging, the barbarian's form becomes infused with chaos. She gains a +4 bonus on Escape Artist
checks and has a 25% chance to ignore extra damage from critical hits and sneak attacks. A barbarian
must have the [lesser chaos totem](ref/ragepower/lesser-chaos-totem) rage power to select this rage
power. A barbarian must be at least 6th level to select this rage power.'''

[[entry]]
id = "ref/ragepower/come-and-get-me"
anchor = "come-and-get-me"
print = '''
While raging, as a free action the barbarian may leave herself open to attack while preparing
devastating counterattacks. Enemies gain a +4 bonus on attack and damage rolls against the barbarian
until the beginning of her next turn, but every attack against the barbarian provokes an attack of
opportunity from her, which is resolved prior to resolving each enemy attack. A barbarian must be at
least 12th level to select this rage power.'''

[[entry]]
id = "ref/ragepower/disruptive"
anchor = "disruptive"
print = '''
When raging, the barbarian gains [Disruptive](ref/feat/disruptive) as a bonus feat. The barbarian
must have the [superstition](ref/ragepower/superstition) rage power to select this rage power. A
barbarian must be at least 8th level to select this rage power.'''

[[entry]]
id = "ref/ragepower/elemental-rage"
anchor = "elemental-rage"
print = "While raging, all of the barbarian's melee attacks deal an additional 1d6 points of energy damage (acid, cold, electricity, or fire). The type is chosen when the barbarian begins her rage. A barbarian must have the [lesser elemental rage](ref/ragepower/lesser-elemental-rage) power to select this rage power. A barbarian must be at least 8th level to select this rage power. Note that the barbarian can still use her lesser elemental rage power while using this rage power, but she must select a different energy type."

[[entry]]
id = "ref/ragepower/energy-absorption"
anchor = "energy-absorption"
print = '''
While raging, the barbarian can absorb energy from a single attack of her chosen energy type once
per rage. She does not make a saving throw against the effect but takes no damage from it, instead
gaining 1 temporary hit point per 3 points of damage the attack would have inflicted. These
[temporary hit points](ref/rule/temporary-hit-points) last until the end of the barbarian's rage. A
barbarian must have the [greater energy resistance](ref/ragepower/greater-energy-resistance) rage
power to select this rage power. A barbarian must be at least 12th level to select this rage power.'''

[[entry]]
id = "ref/ragepower/energy-eruption"
anchor = "energy-eruption"
print = '''
While raging, the barbarian can absorb energy from a single attack and unleash it upon her enemies
once per rage. She does not make a saving throw against the effect but takes no damage from it. At
any point during the remainder of her rage she can unleash the stored energy as a breath weapon in
either a 60-foot line or 30-foot cone. The breath weapon inflicts damage equal to the damage from
the attack absorbed by the barbarian, but creatures within the area may make a Reflex save (DC 10 +
1/2 the barbarian's level + the barbarian's Constitution modifier) for half damage even if the
original effect did not allow a save. A barbarian must have the
[energy absorption](ref/ragepower/energy-absorption) rage power to select this rage power. A
barbarian must be at least 16th level to select this rage power.'''

[[entry]]
id = "ref/ragepower/energy-resistance"
anchor = "energy-resistance"
print = '''
While raging, the barbarian gains [resistance](ref/umr/resistance) to one energy type (acid, cold,
electricity, fire, or sonic) equal to 1/2 her barbarian level (minimum 1). The energy type is chosen
when this rage power is selected and it cannot be changed. This rage power can be selected more than
once. Its effects do not stack. Each time is applies to a different energy type.'''

[[entry]]
id = "ref/ragepower/ferocious-mount"
anchor = "ferocious-mount"
print = '''
While raging and mounted, the barbarian's mount also gains the benefits of rage (including greater
rage and mighty rage) as long as the barbarian is mounted or adjacent to it. While her mount is
raging in this way, she must spend one additional round of rage per round. She can elect not to pay
this cost, in which case her mount does not rage.'''

[[entry]]
id = "ref/ragepower/ferocious-trample"
anchor = "ferocious-trample"
print = '''
While raging and mounted, the barbarian's mount gains the [trample](ref/umr/trample) special attack.
This attack inflicts 1d8 points of damage for a Medium mount, 2d6 for a Large mount, or 2d8 for a
Huge mount, plus 1–1/2 times the mount's Strength modifier. A successful Reflex save (DC 10 + 1/2
the barbarian's level + the mount's Strength modifier) halves this damage. Creatures in the mount's
path or that threaten squares it passes through may make attacks of opportunity against either the
barbarian or the mount, but not both. A barbarian must have the
[ferocious mount](ref/ragepower/ferocious-mount) rage power to select this rage power. A barbarian
must be at least 8th level to select this rage power.'''

[[entry]]
id = "ref/ragepower/fiend-totem"
anchor = "fiend-totem"
print = '''
While raging, the barbarian sprouts dozens of wicked barbs from her body. Anyone striking the
barbarian with a melee weapon, an unarmed strike, or a natural weapon takes 1d6 points of piercing
damage. A barbarian must have the [lesser fiend totem](ref/ragepower/lesser-fiend-totem) rage power
to select this rage power. A barbarian must be at least 6th level to select this rage power.'''

[[entry]]
id = "ref/ragepower/flesh-wound"
anchor = "flesh-wound"
print = '''
Once per rage, the barbarian can try to avoid serious harm from an attack. The barbarian must make a
Fortitude save with a DC equal to the damage that would be dealt by the attack. The barbarian's
armor check penalty applies on this saving throw. If the save succeeds, the barbarian takes half
damage from the attack and the damage is nonlethal. The barbarian must elect to use this ability
after the attack roll is made, but before the damage is rolled. A barbarian must be at least 10th
level to select this rage power.'''

[[entry]]
id = "ref/ragepower/good-for-what-ails-you"
anchor = "good-for-what-ails-you"
print = '''
While raging, the barbarian who takes a drink of alcohol may attempt a new saving throw against one
of the following conditions that may be affecting her: blinded, confused, dazzled, deafened,
exhausted, fatigued, frightened, nauseated, panicked, shaken, or sickened. If she succeeds at the
save, the effect is suppressed for the duration of the rage. She also may attempt a new saving throw
if poisoned; a successful save counts against those required for a cure, but a failed save has no
ill effect.'''

[[entry]]
id = "ref/ragepower/greater-beast-totem"
anchor = "greater-beast-totem"
print = '''
While raging, the barbarian gains the [pounce](ref/umr/pounce) special ability, allowing her to make
a full attack at the end of a charge. In addition, the damage from her claws increases to 1d8 (1d6
if Small) and the claws deal ×3 damage on a critical hit. A barbarian must have the
[beast totem](ref/ragepower/beast-totem) rage power to select this rage power. A barbarian must be
at least 10th level to select this rage power.'''

[[entry]]
id = "ref/ragepower/greater-brawler"
anchor = "greater-brawler"
print = '''
While raging, the barbarian is treated as if she has
[Two-Weapon Fighting](ref/feat/two-weapon-fighting) when making unarmed strike attacks. A barbarian
must have the [brawler](ref/ragepower/brawler) rage power to select this rage power.'''

[[entry]]
id = "ref/ragepower/greater-chaos-totem"
anchor = "greater-chaos-totem"
print = '''
While raging, the barbarian gains DR/lawful equal to 1/2 her barbarian level. Her weapons and
natural weapons are considered chaotic for the purpose of overcoming
[damage reduction](ref/rule/damage-reduction). A barbarian must have the
[chaos totem](ref/ragepower/chaos-totem) rage power to select this rage power. A barbarian must be
at least 10th level to select this rage power.'''

[[entry]]
id = "ref/ragepower/greater-elemental-rage"
anchor = "greater-elemental-rage"
print = '''
While raging, all of the barbarian's critical hits made with melee weapons deal an additional 1d10
points of energy damage (2d10 if the weapon deals ×3 damage on a critical hit, 3d10 if the weapon
deals ×4 on a critical hit). The type of this damage is the same as the type chosen for the
[elemental rage](ref/ragepower/elemental-rage) power. A barbarian must have the elemental rage power
to select this rage power. A barbarian must be at least 12th level to select this rage power.'''

[[entry]]
id = "ref/ragepower/greater-energy-resistance"
anchor = "greater-energy-resistance"
print = '''
Once per rage, a barbarian can reduce damage by half from a single attack against which she has
[energy resistance](ref/ragepower/energy-resistance) (halve the damage, then apply resistance). A
barbarian must have the energy resistance rage power to select this rage power. A barbarian must be
at least 8th level to select this rage power.'''

[[entry]]
id = "ref/ragepower/greater-ferocious-mount"
anchor = "greater-ferocious-mount"
print = '''
While raging and mounted, the barbarian's mount gains the benefits of any rage powers that are
constant in effect when the barbarian is raging. It does not gain the benefit of any rage powers
that require actions to activate, even if they are free actions. A barbarian must have the
[ferocious mount](ref/ragepower/ferocious-mount) rage power to select this rage power. A barbarian
must be at least 8th level to select this rage power.'''

[[entry]]
id = "ref/ragepower/greater-ferocious-trample"
anchor = "greater-ferocious-trample"
print = '''
A barbarian's mount can affect creatures up to its own size with its
[ferocious trample](ref/ragepower/ferocious-trample). In addition, it can make an
[overrun](ref/rule/overrun) combat maneuver check as a free action against a creature that fails its
Reflex save (or chooses not to save in order to take an attack of opportunity) against its trample.
A barbarian must have the ferocious trample rage power to select this rage power. A barbarian must
be at least 12th level to select this rage power.'''

[[entry]]
id = "ref/ragepower/greater-fiend-totem"
anchor = "greater-fiend-totem"
print = '''
While raging, the barbarian is surrounded by an aura of menace. Good creatures adjacent to the
barbarian are [shaken](ref/misc/shaken) and take 2d6 points of slashing damage at the beginning of
the barbarian's turn as dozens of small cuts open across their flesh. Neutral creatures that are
adjacent to the barbarian are shaken, but do not take any damage. Evil creatures are unaffected. A
barbarian must have the [fiend totem](ref/ragepower/fiend-totem) rage power to select this rage
power. A barbarian must be at least 10th level to select this rage power.'''

[[entry]]
id = "ref/ragepower/greater-hurling"
anchor = "greater-hurling"
print = '''
As [hurling](ref/ragepower/hurling), but the barbarian can increase the range increment to 30 feet
or increase the size of a hurled object by two size categories. A barbarian must have the hurling
rage power to select this rage power. A barbarian must be at least 12th level to select this rage
power.'''

[[entry]]
id = "ref/ragepower/greater-spirit-totem"
anchor = "greater-spirit-totem"
print = "While raging, the spirits that surround the barbarian become dangerous to any enemy adjacent to the barbarian. Living enemies adjacent to the barbarian at the start of her turn take 1d8 points of negative energy damage. In addition, the spirit wisps can now attack foes that are up to 15 feet away from the barbarian and the slam attack deals 1d6 points of negative energy damage. A barbarian must have the [spirit totem](ref/ragepower/spirit-totem) rage power and be at least 10th level to select this rage power."

[[entry]]
id = "ref/ragepower/ground-breaker"
anchor = "ground-breaker"
print = '''
Once per rage, the barbarian can attack the floor around her as a standard action. This attack
automatically hits and deals damage normally. If the barbarian manages to deal more damage than the
floor's [hardness](ref/umr/hardness), the space she occupies and all of the squares adjacent to her
become [difficult terrain](ref/rule/terrain-and-obstacles). Creatures in these squares, except the
barbarian, must make a DC 15 Reflex save or be knocked [prone](ref/rule/prone). A barbarian must be
at least 6th level to select this rage power.'''

[[entry]]
id = "ref/ragepower/guarded-life"
anchor = "guarded-life"
print = '''
While raging, if the barbarian is reduced below 0 hit points, 1 hit point of lethal damage per
barbarian level is converted to nonlethal damage. If the barbarian is at negative hit points due to
lethal damage, she immediately [stabilizes](ref/misc/stable).'''

[[entry]]
id = "ref/ragepower/hurling"
anchor = "hurling"
print = '''
As [lesser hurling](ref/ragepower/lesser-hurling), but the barbarian can increase the range
increment to 20 feet or increase the size of a hurled object by one size category. A barbarian must
have the lesser hurling rage power to select this rage power. A barbarian must be at least 8th level
to select this rage power.'''

[[entry]]
id = "ref/ragepower/hurling-charge"
anchor = "hurling-charge"
print = '''
While raging and making a [charge](ref/rule/charge) attack, the barbarian may draw and throw a
hurled weapon during her charge, gaining the normal +2 attack roll bonus on the thrown weapon attack
as well as on the melee attack at the end of the charge. The barbarian must move at least 10 feet
before using a thrown weapon and at least 10 additional feet before making a melee attack at the end
of her charge. The barbarian must have a thrown weapon in hand or have one hand free at the
beginning of her charge. A barbarian must have the [lesser hurling](ref/ragepower/lesser-hurling)
rage power to select this rage power. A barbarian must be at least 6th level to select this rage
power.'''

[[entry]]
id = "ref/ragepower/inspire-ferocity"
anchor = "inspire-ferocity"
print = "While raging, the barbarian can use a move action to impart her [reckless abandon](ref/ragepower/reckless-abandon) modifier to all willing allies within 30 feet for a number of rounds equal to her Charisma modifier (minimum 1). A barbarian must have the [reckless abandon](ref/ragepower/reckless-abandon) rage power to select this rage power."

[[entry]]
id = "ref/ragepower/knockdown"
anchor = "knockdown"
print = "Once per rage, the barbarian can make a [trip](ref/rule/trip) attack against one target in place of a melee attack. If successful, the target takes damage equal to the barbarian's Strength modifier and is knocked [prone](ref/rule/prone). This does not provoke an attack of opportunity."

[[entry]]
id = "ref/ragepower/lesser-beast-totem"
anchor = "lesser-beast-totem"
print = '''
While raging, the barbarian gains two [claw attacks](ref/umr/natural-attacks). These attacks are
considered primary attacks and are made at the barbarian's full base attack bonus. The claws deal
1d6 points of slashing damage (1d4 if Small) plus the barbarian's Strength modifier.'''

[[entry]]
id = "ref/ragepower/lesser-chaos-totem"
anchor = "lesser-chaos-totem"
print = '''
While raging, the barbarian gains a +1 deflection bonus to AC against the attacks of lawful
creatures and a +1 resistance bonus on saving throws against confusion, insanity, polymorph, and
effects with the lawful descriptor. This bonus increases by +1 for each chaos totem rage power she
possesses.'''

[[entry]]
id = "ref/ragepower/lesser-elemental-rage"
anchor = "lesser-elemental-rage"
print = "As a swift action, the barbarian can cause her melee attacks to deal an additional 1d6 points of energy damage (acid, cold, electricity, or fire) for 1 round. A barbarian must be at least 4th level to select this rage power. This power can only be used once per rage."

[[entry]]
id = "ref/ragepower/lesser-fiend-totem"
anchor = "lesser-fiend-totem"
print = '''
While raging, the barbarian grows a pair of large horns, gaining a
[gore attack](ref/umr/natural-attacks). This attack is a primary attack (unless she is also
attacking with weapons, in which case it is a secondary attack) and is made at the barbarian's full
base attack bonus (-5 if it is a secondary attack). The gore attack deals 1d8 points of piercing
damage (1d6 if Small) plus the barbarian's Strength modifier (1/2 if it is a secondary attack).'''

[[entry]]
id = "ref/ragepower/lesser-hurling"
anchor = "lesser-hurling"
print = '''
As a full-round action while raging, the barbarian can lift and hurl an object up to one size
category smaller than herself with both hands or two size categories smaller with one hand as an
[improvised weapon](ref/misc/improvised-weapons) with a range increment of 10 feet. This inflicts
damage as a [falling object](ref/rule/falling-objects) plus the barbarian's Strength bonus. This
damage is halved if the object is not made of stone, metal, or similar material. This is a ranged
touch attack, and the target may attempt a Reflex save (DC 10 + 1/2 the barbarian's level + the
barbarian's Strength modifier) for half damage. The barbarian may apply
[Power Attack](ref/feat/power-attack) to this attack as a one- or two-handed weapon, as appropriate.'''

[[entry]]
id = "ref/ragepower/lesser-spirit-totem"
anchor = "lesser-spirit-totem"
print = '''
While raging, the barbarian is surrounded by spirit wisps that harass her foes. These spirits make
one slam attack each round against a living foe that is adjacent to the barbarian. This slam attack
is made using the barbarian's full base attack bonus, plus the barbarian's Charisma modifier. The
slam deals 1d4 points of negative energy damage, plus the barbarian's Charisma modifier.'''

[[entry]]
id = "ref/ragepower/liquid-courage"
anchor = "liquid-courage"
print = '''
While raging, the barbarian increases her morale bonus on saving throws against mind-affecting
effects by +1 for each alcoholic drink she consumes during her rage, to a maximum of +1 increase per
four barbarian levels.'''

[[entry]]
id = "ref/ragepower/overbearing-advance"
anchor = "overbearing-advance"
print = '''
While raging, the barbarian inflicts damage equal to her Strength bonus whenever she succeeds at an
[overrun](ref/rule/overrun) combat maneuver.'''

[[entry]]
id = "ref/ragepower/overbearing-onslaught"
anchor = "overbearing-onslaught"
print = '''
While raging, the barbarian may [overrun](ref/rule/overrun) more than one target per round, with a
-2 penalty on her CMB for each overrun check after the first. A barbarian must have the
[overbearing advance](ref/ragepower/overbearing-advance) rage power to select this rage power. A
barbarian must be at least 6th level to select this rage power.'''

[[entry]]
id = "ref/ragepower/reckless-abandon"
anchor = "reckless-abandon"
print = "While raging, the barbarian can take a -1 penalty to AC to gain a +1 bonus on attack rolls. The AC penalty increases by -1 and the attack roll bonus increases by +1 at 4th level and every four levels thereafter."

[[entry]]
id = "ref/ragepower/roaring-drunk"
anchor = "roaring-drunk"
print = '''
While raging, the barbarian gains a +1 morale bonus on Intimidate checks and to the save DC of any
fear effects she creates for each alcoholic drink she has consumed during her rage, to a maximum of
+1 per four barbarian levels.'''

[[entry]]
id = "ref/ragepower/smasher"
anchor = "smasher"
print = '''
Once per rage, whenever the barbarian makes an attack against an unattended object or a
[sunder](ref/rule/sunder) combat maneuver, she can ignore the object's [hardness](ref/umr/hardness).
This ability must be used before the attack roll or sunder check is made.'''

[[entry]]
id = "ref/ragepower/spellbreaker"
anchor = "spellbreaker"
print = "When raging, the barbarian gains [Spellbreaker](ref/feat/spellbreaker) as a bonus feat. A barbarian must have the [disruptive](ref/ragepower/disruptive) rage power and be at least 12th level to select this rage power."

[[entry]]
id = "ref/ragepower/spirit-steed"
anchor = "spirit-steed"
print = '''
While raging and mounted, the barbarian's mount gains DR/magic equal to 1/2 the barbarian's level.
The mount's natural weapons count as magical for the purpose of overcoming
[damage reduction](ref/rule/damage-reduction). A barbarian must have the
[ferocious mount](ref/ragepower/ferocious-mount) rage power to select this rage power. A barbarian
must be at least 6th level to select this rage power.'''

[[entry]]
id = "ref/ragepower/spirit-totem"
anchor = "spirit-totem"
print = '''
While raging, the spirits that surround the barbarian make it difficult for her enemies to see her.
The spirits grant the barbarian a 20% miss chance against ranged attacks and melee attacks made by
creatures that are not adjacent to the barbarian (typically due to reach). A barbarian must have the
[lesser spirit totem](ref/ragepower/lesser-spirit-totem) rage power to select this rage power. A
barbarian must be at least 6th level to select this rage power.'''

[[entry]]
id = "ref/ragepower/staggering-drunk"
anchor = "staggering-drunk"
print = '''
While raging, a barbarian gains a +1 dodge bonus to AC against attacks of opportunity for each
alcoholic drink she has consumed during her rage, to a maximum of +1 per four barbarian levels.'''

[[entry]]
id = "ref/ragepower/witch-hunter"
anchor = "witch-hunter"
print = "While raging, the barbarian gains a +1 bonus on damage rolls against creatures possessing spells or [spell-like abilities](ref/umr/spell-like-abilities). This damage bonus increases by +1 for every four levels the barbarian has obtained. A barbarian must have the [superstition](ref/ragepower/superstition) rage power to select this rage power."

[[entry]]
id = "ref/sorcbloodline/aquatic"
anchor = "opening"
print = "Your family traces its heritage back to the ocean depths, whether scions of undersea empires left in the wake of nomadic sea-tribes, or the spawn of creeping ichthyic infiltrators into remote seaside villages. The song of the sea hums in your blood, calling the waves and all those within to your command."

[[entry]]
id = "ref/sorcbloodline/aquatic"
anchor = "class-skill"
print = "Swim."

[[entry]]
id = "ref/sorcbloodline/aquatic"
anchor = "bonus-spells"
print = "_hydraulic push_ (3rd), _slipstream_ (5th), _aqueous orb_ (7th), _geyser_ (9th), _control water_ (11th), _beast shape IV_ (13th), _summon monster VII_ (15th), _seamantle_ (17th), _world wave_ (19th)."

[[entry]]
id = "ref/sorcbloodline/aquatic"
anchor = "bonus-feats"
print = "[Athletic](ref/feat/athletic), [Brew Potion](ref/feat/brew-potion), [Defensive Combat Training](ref/feat/defensive-combat-training), [Dodge](ref/feat/dodge), [Mobility](ref/feat/mobility), [Silent Spell](ref/feat/silent-spell), [Skill Focus](ref/feat/skill-focus) (Swim), [Toughness](ref/feat/toughness)."

[[entry]]
id = "ref/sorcbloodline/aquatic"
anchor = "bloodline-arcana"
print = "Whenever you cast a spell of the water type, your effective caster level is increased by one, and summoned creatures with a swim speed or the aquatic or water type gain a +1 morale bonus on attack and damage rolls."

[[entry]]
id = "ref/sorcbloodline/aquatic"
anchor = "bloodline-powers"
print = "Your seaborn magical talents awaken changes in you, both mystical and physical, as you develop your powers."

[[entry]]
id = "ref/sorcbloodline/aquatic"
anchor = "dehydrating-touch"
print = "Starting at 1st level, you can make a melee touch attack as a standard action that inflicts 1d6 points of nonlethal damage + 1 for every two sorcerer levels you possess and sickens the target for 1 round. Oozes, plants, and creatures with the aquatic or water subtypes suffer lethal damage instead. You can use this ability a number of times per day equal to 3 + your Charisma modifier."

[[entry]]
id = "ref/sorcbloodline/aquatic"
anchor = "aquatic-adaptation"
print = "At 3rd level, you gain a swim speed of 30 feet. At 9th level, you gain the [amphibious](ref/umr/amphibious) special quality and develop a fat layer that grants a +1 natural armor bonus and [resist](ref/umr/resistance) cold 5. When immersed in water, you gain [blindsense](ref/umr/blindsense) 30 feet. At 15th level, you gain a swim speed of 60 feet and [blindsense](ref/rule/blindsight-and-blindsense) of 60 feet in water."

[[entry]]
id = "ref/sorcbloodline/aquatic"
anchor = "aquatic-telepathy"
print = "At 9th level, you gain [telepathy](ref/umr/telepathy) (100 feet) and can communicate with creatures with a swim speed or the aquatic or water types regardless of intelligence. You may cast _[suggestion](ref/spell/suggestion)_ on such creatures a number of times per day equal to your Charisma modifier. This ability is telepathic and does not require audible or visual components. At 15th level, once per day you can telepathically call and request a service from an aquatic, water, or swimming creature as if using _[demand](ref/spell/demand)_ or _[greater planar ally](ref/spell/planar-ally-greater)_."

[[entry]]
id = "ref/sorcbloodline/aquatic"
anchor = "raise-the-deep"
print = "At 15th level, you raise water as per _[control water](ref/spell/control-water)_, but no water need be present. This created water is stationary and does not flow out of the area where you create it; it lasts 1 round per sorcerer level and then disappears. At 20th level, the dimensions of the effect are doubled. You may use this ability once per day."

[[entry]]
id = "ref/sorcbloodline/aquatic"
anchor = "deep-one"
print = "At 20th level, you gain [blindsense](ref/rule/blindsight-and-blindsense) 60 feet and your body is covered with fine, slippery scales granting DR 10/piercing, resist cold 20, and continuous _[freedom of movement](ref/spell/freedom-of-movement)_. Underwater, you gain evasion and [blindsight](ref/umr/blindsight) 120 feet, and you are immune to [pressure damage](ref/rule/water-dangers) from deep water."

[[entry]]
id = "ref/sorcbloodline/aquatic"
anchor = "replacement-bloodline-arcana"
print = "When you are in a body of water large enough to float in, your effective caster level is increased by 1."

[[entry]]
id = "ref/sorcbloodline/aquatic"
anchor = "seaborn-wildblooded-mutation"
print = '''
Your powers rise like the tides.

**Associated Bloodline:** Aquatic.

**Bloodline Arcana:** When you are in a body of water large enough to float in, your effective caster level is increased by 1.

**Bloodline Powers:** You prefer to attack with water rather than to leech it away.

**Water Blast (Sp):** As a standard action, you can fire a bolt of water at a foe within 30 feet as a ranged touch attack. The foe is knocked prone, and at your option may be pushed 5 feet directly away from you. A reflex save (DC 10 +1/2 your sorcerer level + your Charisma modifier) negates this effect. You can use this ability a number of times per day equal to 3 + your Charisma modifier. This bloodline power replaces dehydrating touch.'''

[[entry]]
id = "ref/sorcbloodline/boreal"
anchor = "opening"
print = "Descended from inhabitants of the lands of ice and snow, you count among your ancestors giant-kin, troll-born, and frost-rimed spirits. Their savage and raw energies flow down through generations to infuse you to the marrow with the chill of the polar wind, crackling auroras, and the long winter's night."

[[entry]]
id = "ref/sorcbloodline/boreal"
anchor = "class-skill"
print = "Survival."

[[entry]]
id = "ref/sorcbloodline/boreal"
anchor = "bonus-spells"
print = "_enlarge person_ (3rd), _rage_ (5th), _elemental aura_ (cold only) (7th), _wall of ice_ (9th), _cone of cold_ (11th), _transformation_ (13th), _giant form I_ (15th), _polar ray_ (17th), _meteor swarm_ (dealing cold damage) (19th)."

[[entry]]
id = "ref/sorcbloodline/boreal"
anchor = "bonus-feats"
print = "[Arcane Strike](ref/feat/arcane-strike), [Diehard](ref/feat/diehard), [Empower Spell](ref/feat/empower-spell), [Endurance](ref/feat/endurance), [Exotic Weapon Proficiency](ref/feat/exotic-weapon-proficiency), [Power Attack](ref/feat/power-attack), [Skill Focus](ref/feat/skill-focus) (Intimidate), [Toughness](ref/feat/toughness)."

[[entry]]
id = "ref/sorcbloodline/boreal"
anchor = "bloodline-arcana"
print = "Whenever you cast a spell with the cold descriptor, increase the spell's save DC by 1."

[[entry]]
id = "ref/sorcbloodline/boreal"
anchor = "bloodline-powers"
print = "Your connection to primeval winters grants you a mastery of cold magic that few can match, and a savagery that fewer still can withstand."

[[entry]]
id = "ref/sorcbloodline/boreal"
anchor = "cold-steel"
print = "At 1st level, you can touch a weapon or up to 50 pieces of ammunition as a standard action, giving it the _[frost](ref/magic-enh/frost)_ property for a number of rounds equal to 1/2 your sorcerer level (minimum 1). At 9th level, you can confer the _[icy burst](ref/magic-enh/icy-burst)_ property instead, but the duration of the power is halved. You can use this ability a number of times per day equal to 3 + your Charisma modifier."

[[entry]]
id = "ref/sorcbloodline/boreal"
anchor = "icewalker"
print = "At 3rd level, you gain [resist](ref/umr/resistance) cold 5 and can move across snow and icy surfaces without penalty and without leaving tracks. At 9th level, you gain resist cold 10 and can climb icy surfaces as if using _[spider climb](ref/spell/spider-climb)._"

[[entry]]
id = "ref/sorcbloodline/boreal"
anchor = "snow-shroud"
print = "At 9th level, you ignore [concealment](ref/rule/concealment) and [Perception](ref/skill/perception) penalties in natural or magical snow, ice, fog, and similar weather conditions. In addition, you can surround yourself with a cloak of swirling snow for a number of rounds per day equal to your sorcerer level. This power acts and deals damage as a _fire shield (chill shield)_ that sheds no light. It provides a 20% miss chance on attacks made against you and grants a bonus on [Stealth](ref/skill/stealth) checks equal to 1/2 your sorcerer level in snowy or icy areas. You can use this ability once per day at 9th level, twice per day at 17th, and three times per day at 20th."

[[entry]]
id = "ref/sorcbloodline/boreal"
anchor = "blizzard"
print = "At 15th level, you can create a savage winter storm centered on you. This power acts as _[control winds](ref/spell/control-winds)_, but in addition the entire area (not including the \"eye\" at the center of the storm) is affected as a _[sleet storm](ref/spell/sleet-storm)_ and all in the area are exposed to extreme cold (_Pathfinder RPG Core Rulebook_ 442). You may use this ability once per day."

[[entry]]
id = "ref/sorcbloodline/boreal"
anchor = "child-of-ancient-winters"
print = "At 20th level, you gain the [cold](ref/subtype/cold) subtype and you become immune to fatigue and exhaustion. In addition, you gain immunity to sneak attacks and critical hits. This power causes you to gain vulnerability to fire."

[[entry]]
id = "ref/sorcbloodline/boreal"
anchor = "replacement-bloodline-arcana"
print = "Whenever you cast a spell with the cold descriptor, you may select one target of the spell to be slowed (as the spell) for 1 round. A Fortitude save (DC 10 + the level of cold spell + your Charisma modifier) negates the effect."

[[entry]]
id = "ref/sorcbloodline/boreal"
anchor = "freezing-bolt"
print = "At 9th level, you can cause the air to erupt in freezing sleet. This 10-foot-radius [burst](ref/misc/burst) does 1d6 points of cold damage per sorcerer level (Reflex half). The DC of this save is equal to 10 + 1/2 your sorcerer level + your Charisma modifier. At 9th level, you can use this ability once per day. At 17th level, you can use this ability twice per day. At 20th level, you can use this ability three times per day. This power has a range of 60 feet. This bloodline power replaces snow shroud."

[[entry]]
id = "ref/sorcbloodline/boreal"
anchor = "rime-blooded-wildblooded-mutation"
print = '''
The wintry origin of your magic f lows like ice water in your veins.

**Associated Bloodline:** Boreal.

**Bloodline Arcana:** Whenever you cast a spell with the cold descriptor, you may select one target of the spell to be slowed (as the spell) for 1 round. A Fortitude save (DC 10 + the level of cold spell + your Charisma modifier) negates the effect.

**Bloodline Powers:** Sometimes you must bring the cold to your enemies.

**Freezing Bolt (Sp):** At 9th level, you can cause the air to erupt in freezing sleet. This 10-foot-radius burst does 1d6 points of cold damage per sorcerer level (Reflex half). The DC of this save is equal to 10 + 1/2 your sorcerer level + your Charisma modifier. At 9th level, you can use this ability once per day. At 17th level, you can use this ability twice per day. At 20th level, you can use this ability three times per day. This power has a range of 60 feet. This bloodline power replaces snow shroud.'''

[[entry]]
id = "ref/sorcbloodline/deep-earth"
anchor = "opening"
print = "The echoing cave-songs and the rumble and creak of primal spirits deep below the ground thrum in your soul and in all your family line. You are likely slow, steady, and stable in your thinking, little prone to wandering and preferring to instead find depth in contemplation."

[[entry]]
id = "ref/sorcbloodline/deep-earth"
anchor = "class-skill"
print = "Knowledge (dungeoneering)."

[[entry]]
id = "ref/sorcbloodline/deep-earth"
anchor = "bonus-spells"
print = "_expeditious excavation_ (3rd), _darkvision_ (5th), _shifting sand_ (7th), _stoneskin_ (9th), _spike stones_ (11th), _stone tell_ (13th), _repel metal or stone_ (15th), _earthquake_ (17th), _clashing rocks_ (19th)."

[[entry]]
id = "ref/sorcbloodline/deep-earth"
anchor = "bonus-feats"
print = "[Acrobatic Steps](ref/feat/acrobatic-steps), [Alertness](ref/feat/alertness), [Blind-Fight](ref/feat/blind-fight), [Forge Ring](ref/feat/forge-ring), [Nimble Moves](ref/feat/nimble-moves), [Skill Focus](ref/feat/skill-focus) (Perception), [Stealthy](ref/feat/stealthy), [Still Spell](ref/feat/still-spell)."

[[entry]]
id = "ref/sorcbloodline/deep-earth"
anchor = "bloodline-arcana"
print = "Whenever you and the target of your spell are both underground, increase the spell's save DC by +1."

[[entry]]
id = "ref/sorcbloodline/deep-earth"
anchor = "bloodline-powers"
print = "The powers of the living rock are within you, and your communion with the strength of stone is refined and enhanced as your power grows."

[[entry]]
id = "ref/sorcbloodline/deep-earth"
anchor = "tremor"
print = "At 1st level, as a standard action, you can cause the ground to shake beneath a single creature within 30 feet, functioning as a [trip](ref/rule/trip) maneuver using your sorcerer level plus your Charisma modifier in place of your CMB. You can use this ability a number of times per day equal to 3 + your Charisma modifier."

[[entry]]
id = "ref/sorcbloodline/deep-earth"
anchor = "rockseer"
print = "At 3rd level, you gain the stonecunning trait as a [dwarf](ref/race/dwarf); if already a dwarf, your bonus improves to +4. At 9th level, you gain [tremorsense](ref/umr/tremorsense) 30 feet. At 15th level, you can see through solid objects as if using a _[ring of x-ray vision](ref/magic-ring/ring-of-x-ray-vision)_ for a number of rounds per day equal to your sorcerer level. These rounds do not need to be consecutive."

[[entry]]
id = "ref/sorcbloodline/deep-earth"
anchor = "crystal-shard"
print = "At 9th level, you can touch a metal or stone weapon (or up to 50 pieces of ammunition) as a standard action, giving it the _[bane](ref/magic-enh/bane)_ property against any creature with the earth subtype, oozes, or constructs made of stone or metal, for 1 minute. You can use this ability once per day at 9th level, twice per day at 17th, and three times per day at 20th."

[[entry]]
id = "ref/sorcbloodline/deep-earth"
anchor = "earth-glide"
print = "At 15th level, you can glide through any sort of natural earth or stone as easily as a fish swims through water, with a burrow speed equal to half your normal speed. You do not leave a tunnel or trace of your passage. You can use this ability for 1 minute per sorcerer level each day. The duration need not be continuous, but it must be used in 1-minute increments."

[[entry]]
id = "ref/sorcbloodline/deep-earth"
anchor = "strength-of-stone"
print = "At 20th level, your flesh becomes as hard as stone, giving you DR 10/adamantine, and you become immune to petrification. You suffer no penalties while squeezing through tight spaces and are immune to bull rush, drag, grapple, reposition, and trip maneuvers, and to [push](ref/umr/push) and [pull](ref/umr/pull) effects as long as you are standing on the ground."

[[entry]]
id = "ref/sorcbloodline/deep-earth"
anchor = "replacement-bloodline-arcana"
print = "Whenever you cast a spell of the summoning subschool, the creatures summoned gain DR/adamantine equal to 1/2 your sorcerer level (minimum 1). This does not stack with any DR the creature might have."

[[entry]]
id = "ref/sorcbloodline/deep-earth"
anchor = "iron-hide"
print = "At 9th level, as a swift action, you can grant yourself DR 10/adamantine for a number of rounds per day equal to your sorcerer level. The rounds do not need to be used consecutively. This bloodline power replaces crystal shard."

[[entry]]
id = "ref/sorcbloodline/deep-earth"
anchor = "bedrock-wildblooded-mutation"
print = '''
Your earth magic is more defensive than offensive.

**Associated Bloodline:** Deep Earth.

**Bloodline Arcana:** Whenever you cast a spell of the summoning subschool, the creatures summoned gain DR/adamantine equal to 1/2 your sorcerer level (minimum 1). This does not stack with any DR the creature might have.

**Bloodline Powers:** Rock is timeless; it endures.

**Iron Hide (Sp):** At 9th level, as a swift action, you can grant yourself DR 10/adamantine for a number of rounds per day equal to your sorcerer level. The rounds do not need to be used consecutively. This bloodline power replaces crystal shard.'''

[[entry]]
id = "ref/sorcbloodline/dreamspun"
anchor = "opening"
print = "Your family is a long line of dreamers, who dream not as ordinary mortals do but rather as those who reach through and touch the supernal realm of dreams and the farthest shores of night. Whether it is a gift or curse is not always clear, but your visions of the past and future call you ineluctably to a life of adventure."

[[entry]]
id = "ref/sorcbloodline/dreamspun"
anchor = "class-skill"
print = "Sense Motive."

[[entry]]
id = "ref/sorcbloodline/dreamspun"
anchor = "bonus-spells"
print = "_sleep_ (3rd), _augury_ (5th), _deep slumber_ (7th), _divination_ (9th), _dream_ (11th), _shadow walk_ (13th), _vision_ (15th), _moment of prescience_ (17th), _astral projection_ (19th)."

[[entry]]
id = "ref/sorcbloodline/dreamspun"
anchor = "bonus-feats"
print = "[Alertness](ref/feat/alertness), [Blind-Fight](ref/feat/blind-fight), [Combat Expertise](ref/feat/combat-expertise), [Deceitful](ref/feat/deceitful), [Heighten Spell](ref/feat/heighten-spell), [Improved Feint](ref/feat/improved-feint), [Persuasive](ref/feat/persuasive), [Skill Focus](ref/feat/skill-focus) (Sense Motive)."

[[entry]]
id = "ref/sorcbloodline/dreamspun"
anchor = "bloodline-arcana"
print = "Whenever you target a single creature with a spell, you gain an insight bonus equal to half the spell's level (minimum +1) for 1 round to your AC and saving throws against any spell or attack made by that creature."

[[entry]]
id = "ref/sorcbloodline/dreamspun"
anchor = "bloodline-powers"
print = "You reach out into and through the world of dreams to touch the minds and destinies of those around you."

[[entry]]
id = "ref/sorcbloodline/dreamspun"
anchor = "lullaby"
print = "At 1st level, you can use _[lullaby](ref/spell/lullaby)_ as a [spell-like ability](ref/umr/spell-like-abilities) a number of times per day equal to 3 + your Charisma modifier. This effect lasts for 1 minute and does not require concentration. The penalty on saves versus sleep effects increases to -4."

[[entry]]
id = "ref/sorcbloodline/dreamspun"
anchor = "combat-precognition"
print = "Your insight into the future grants you an advantage in combat. At 3rd level and every 4 levels thereafter, you gain a +1 insight bonus on initiative checks."

[[entry]]
id = "ref/sorcbloodline/dreamspun"
anchor = "dreamshaper"
print = "At 9th level, you can manipulate the dreamscape of others, drawing forth or tampering with their subconscious minds. This power allows you to tamper with the target's memories as if using _[modify memory](ref/spell/modify-memory),_ or you may ask questions as if using _[speak with dead](ref/spell/speak-with-dead)_ upon a corpse. A successful Will save negates the effect. The DC of this save is equal to 10 + 1/2 your sorcerer level + your Charisma modifier, with further modifiers as the _[nightmare](ref/spell/nightmare)_ spell. You can use this ability once per day at 9th level. At 17th level you can use this ability twice per day, and at 20th, three times per day."

[[entry]]
id = "ref/sorcbloodline/dreamspun"
anchor = "eye-of-somnus"
print = "At 15th level, you can project your consciousness as if using _[arcane eye](ref/spell/arcane-eye)_. In addition, at any point you can cause the _[arcane eye](ref/spell/arcane-eye)_ to become visible. The eye can no longer be moved, but it acts as a _[symbol of sleep](ref/spell/symbol-of-sleep)_ to all who see it. You may use this power once per day."

[[entry]]
id = "ref/sorcbloodline/dreamspun"
anchor = "solipsism"
print = "At 20th level, you can drift into the dream world, fading from the world around you. You can become [incorporeal](ref/subtype/incorporeal) for 1 minute per sorcerer level. You gain the incorporeal subtype and take only half damage from corporeal magical attacks (you take no damage from nonmagical weapons and objects). Your spells deal only half damage to corporeal creatures, but spells and abilities that do not deal damage function normally. The duration need not be continuous, but it must be used in 1-minute increments."

[[entry]]
id = "ref/sorcbloodline/dreamspun"
anchor = "replacement-bloodline-arcana"
print = "Though you can still only regain spells once per day, you need only a single hour of sleep prior to doing so. (You still risk fatigue as normal if you don't receive enough rest.)"

[[entry]]
id = "ref/sorcbloodline/dreamspun"
anchor = "visions"
print = "At 9th level, when you sleep, you can gain information through prophetic visions. Once per day when sleeping, you may gain information about actions taken in the next week as if you had cast a _[divination](ref/spell/divination)_ spell. You can gain information about a single question at 9th level. At 17th level, you can have two questions answered while you sleep, and at 20th level, three questions. This bloodline power replaces dreamshaper."

[[entry]]
id = "ref/sorcbloodline/dreamspun"
anchor = "visionary-wildblooded-mutation"
print = '''
Your dream-magic strongly inf luences the waking world.

**Associated Bloodline:** Dreamspun.

**Bloodline Arcana:** Though you can still only regain spells once per day, you need only a single hour of sleep prior to doing so. (You still risk fatigue as normal if you don't receive enough rest.)

**Bloodline Powers:** Your dreams hint at the future.

**Visions (Sp):** At 9th level, when you sleep, you can gain information through prophetic visions. Once per day when sleeping, you may gain information about actions taken in the next week as if you had cast a _divination_ spell. You can gain information about a single question at 9th level. At 17th level, you can have two questions answered while you sleep, and at 20th level, three questions. This bloodline power replaces dreamshaper.'''

[[entry]]
id = "ref/sorcbloodline/protean"
anchor = "opening"
print = "You have in your veins the ever-changing wildness of primal chaos, the raw essence of unbound creation. Your mind and spirit burst with the constant inspiration of consummate freedom, though you have difficulty following through on a task when another, new and exciting, catches your interest."

[[entry]]
id = "ref/sorcbloodline/protean"
anchor = "class-skill"
print = "Knowledge (planes)."

[[entry]]
id = "ref/sorcbloodline/protean"
anchor = "bonus-spells"
print = "_entropic shield_ (3rd), _blur_ (5th), _gaseous form_ (7th), _confusion_ (9th), _major creation_ (11th), _disintegrate_ (13th), _greater polymorph_ (15th), _polymorph any object_ (17th), _shapechange_ (19th)."

[[entry]]
id = "ref/sorcbloodline/protean"
anchor = "bonus-feats"
print = "[Agile Maneuvers](ref/feat/agile-maneuvers), [Defensive Combat Training](ref/feat/defensive-combat-training), [Enlarge Spell](ref/feat/enlarge-spell), [Great Fortitude](ref/feat/great-fortitude), [Improved Great Fortitude](ref/feat/improved-great-fortitude), [Skill Focus](ref/feat/skill-focus) (Craft \\[any\\]), [Spell Focus](ref/feat/spell-focus), [Toughness](ref/feat/toughness)."

[[entry]]
id = "ref/sorcbloodline/protean"
anchor = "bloodline-arcana"
print = "Your magic of creation and changing is hard to unravel. The DC to dispel transmutation or conjuration (creation) spells that you cast is increased by +4."

[[entry]]
id = "ref/sorcbloodline/protean"
anchor = "bloodline-powers"
print = "Your ancestral immersion in primordial chaos begets your curiously warped magical talents."

[[entry]]
id = "ref/sorcbloodline/protean"
anchor = "protoplasm"
print = "At 1st level, you can create a ball of entropic protoplasm and hurl it at targets within 30 feet. This protoplasm acts as a [tanglefoot bag](ref/eq-weapon/tanglefoot-bag) that also inflicts 1 point of acid damage per round to a creature entangled by it. The protoplasm dissolves within 1d3 rounds. You may use this ability a number of times per day equal to 3 + your Charisma modifier."

[[entry]]
id = "ref/sorcbloodline/protean"
anchor = "protean-resistances"
print = "At 3rd level, you gain [resist](ref/umr/resistance) acid 5 and a +2 bonus on saving throws against polymorph, petrification, and transmutation spells or effects. At 9th level, you gain resist acid 10 and your save bonus increases to +4."

[[entry]]
id = "ref/sorcbloodline/protean"
anchor = "reality-wrinkle"
print = "At 9th level, you can surround yourself with a mobile, 10-foot-radius [emanation](ref/misc/emanation) of mutable reality. This rippling distortion is similar to _[solid fog](ref/spell/solid-fog)_ but does not provide [concealment](ref/rule/concealment) or block line of sight. Your movement is not slowed by this aura. Attacks from outside the aura suffer a 20% miss chance against targets inside the aura. You may use this ability a number of rounds per day equal to your sorcerer level, though this duration need not be continuous."

[[entry]]
id = "ref/sorcbloodline/protean"
anchor = "spatial-tear"
print = "At 15th level, once per day, you can unravel the fibers of reality and ride along them as they snap back into place. This power functions as _[dimension door](ref/spell/dimension-door),_ while also creating a mass of _[black tentacles](ref/spell/black-tentacles)_ centered on your former location. Both of these effects use your sorcerer level as the caster level. At 20th level, you can use this ability twice per day."

[[entry]]
id = "ref/sorcbloodline/protean"
anchor = "avatar-of-chaos"
print = "At 20th level, you are infused with the essence of raw chaos. You gain immunity to acid, petrification, and polymorph effects (except when cast on self), as well as a +2 bonus to save DCs and on checks to overcome spell penetration against creatures with the lawful subtype."

[[entry]]
id = "ref/sorcbloodline/protean"
anchor = "replacement-bloodline-arcana"
print = "Whenever you fail a concentration check to cast a spell, a cantrip effect is created. Randomly determine one of your cantrips known (for example, if you know 6 cantrips, roll 1d6). There is a 50% chance this cantrip affects a target of your choice within 60 feet; otherwise it affects you."

[[entry]]
id = "ref/sorcbloodline/protean"
anchor = "wild-feedback"
print = "At 3rd level, when you successfully [dispel](ref/spell/dispel-magic) or [counterspell](ref/rule/counterspells) an opponent's spell, the caster (if it is within 100 feet) takes 1d6 points of damage +1 per level of the spell affected. This bloodline power replaces protean resistances."

[[entry]]
id = "ref/sorcbloodline/protean"
anchor = "anarchic-wildblooded-mutation"
print = '''
Your magical power taps into pure anarchy.

**Associated Bloodline:** Protean.

**Bloodline Arcana:** Whenever you fail a concentration check to cast a spell, a cantrip effect is created. Randomly determine one of your cantrips known (for example, if you know 6 cantrips, roll 1d6). There is a 50% chance this cantrip affects a target of your choice within 60 feet; otherwise it affects you.

**Bloodline Powers:** Raw magical energy lashes out when you destroy or negate hostile spells.

**Wild Feedback (Su):** At 3rd level, when you successfully dispel or counterspell an opponent's spell, the caster (if it is within 100 feet) takes 1d6 points of damage +1 per level of the spell affected. This bloodline power replaces protean resistances.'''

[[entry]]
id = "ref/sorcbloodline/serpentine"
anchor = "opening"
print = "Your bloodline carries the lingering stain of ancient serpent races that ruled when the world was young; your forebears were likely favored slaves anointed by their reptilian masters and gifted with their cold cunning and subtle manipulation. While deception and a mesmeric charm are your birthright, you may struggle for truth in spite of your heritage."

[[entry]]
id = "ref/sorcbloodline/serpentine"
anchor = "class-skill"
print = "Diplomacy."

[[entry]]
id = "ref/sorcbloodline/serpentine"
anchor = "bonus-spells"
print = "_hypnotism_ (3rd), _delay poison_ (5th), _summon monster III_ (reptiles only) (7th), _poison_ (9th), _hold monster_ (11th), _mass suggestion_ (13th), _summon monster VII_ (reptiles only) (15th), _irresistible dance_ (17th), _dominate monster_ (19th)."

[[entry]]
id = "ref/sorcbloodline/serpentine"
anchor = "bonus-feats"
print = "[Combat Casting](ref/feat/combat-casting), [Combat Reflexes](ref/feat/combat-reflexes), [Deceitful](ref/feat/deceitful), [Deft Hands](ref/feat/deft-hands), [Persuasive](ref/feat/persuasive), [Silent Spell](ref/feat/silent-spell), [Skill Focus](ref/feat/skill-focus) (Bluff), [Stealthy](ref/feat/stealthy)."

[[entry]]
id = "ref/sorcbloodline/serpentine"
anchor = "bloodline-arcana"
print = "Your powers of compulsion can affect even bestial creatures. Whenever you cast a mind-affecting or language-dependent spell, it affects animals, magical beasts, and monstrous humanoids as if they were humanoids who understood your language."

[[entry]]
id = "ref/sorcbloodline/serpentine"
anchor = "bloodline-powers"
print = "The treacherous and yet hypnotic serpent's blood that flows through you taints your magic with a sinuous and seductive grace."

[[entry]]
id = "ref/sorcbloodline/serpentine"
anchor = "serpent-s-fang"
print = "At 1st level, you can grow fangs as a free action. These fangs are treated as a [natural weapon](ref/umr/natural-attacks) inflicting 1d4 points of damage plus your Strength modifier (1d3 if you are Small) plus poison (Bite—injury; _save_ Fort DC 10 + 1/2 your sorcerer level + your Constitution modifier; _frequency_ 1/round for 6 rounds; _effect_ 1 Con damage; _cure_ 1 save). At 5th level, these fangs are considered magical for the purpose of overcoming DR and the poison damage increases to 1d2 Con. At 7th level, your poison requires 2 successful saves to cure. At 11th level, your poison damage increases to 1d4 Con. You can use your fangs for a number of rounds per day equal to 3 + your Charisma modifier."

[[entry]]
id = "ref/sorcbloodline/serpentine"
anchor = "serpentfriend"
print = "At 3rd level, you can use _[speak with animals](ref/spell/speak-with-animals)_ at will with reptilian animals (including various forms of dinosaurs, lizards, and other cold-blooded creatures), and you gain a [viper](ref/monster/familiar-viper) [familiar](ref/ability/familiars) using your sorcerer level -2 as your effective wizard level."

[[entry]]
id = "ref/sorcbloodline/serpentine"
anchor = "snakeskin"
print = "At 9th level, you gain a +1 bonus to natural armor, a +2 racial bonus on saves against poison, and a +2 bonus on Escape Artist checks. At 13th level and 17th level, these bonuses increase by +1."

[[entry]]
id = "ref/sorcbloodline/serpentine"
anchor = "den-of-vipers"
print = "At 15th level, you may summon a host of writhing serpents. This power acts as _[creeping doom](ref/spell/creeping-doom),_ but the swarms' poison inflicts Con damage and any creature other than you sharing a space with a swarm is [entangled](ref/rule/entangled). You may use this ability once per day."

[[entry]]
id = "ref/sorcbloodline/serpentine"
anchor = "scaled-soul"
print = "At 20th level, you gain the [shapechanger](ref/subtype/shapechanger) subtype, and you can assume the form of a reptilian humanoid (as _[alter self](ref/spell/alter-self)_) or snake of Diminutive to Huge size (as _[beast shape III](ref/spell/beast-shape-3)_) at will. You retain the power of speech and the ability to use somatic spell components when transformed. You also become immune to poison and paralysis. You may use serpent's fang as often as desired, and you may choose to inflict damage to any ability score."

[[entry]]
id = "ref/sorcbloodline/serpentine"
anchor = "replacement-bloodline-arcana"
print = "You gain a +2 bonus on Acrobatics, Climb, and Stealth checks."

[[entry]]
id = "ref/sorcbloodline/serpentine"
anchor = "envenom"
print = "At 3rd level, as a swift action, you can lick or bite a melee weapon to imbue it with 1 dose of [black adder venom](ref/eq-poison/black-adder-venom) (see page 558 of the _Core Rulebook_). The poison's DC is equal to 10 + 1/2 your sorcerer level + your Charisma modifier. You may use this ability once per day at 3rd level, and one additional time per day for every three additional levels. The poison cannot be removed or stored, and the weapon loses the benefit of the poison after the first successful attack or 1 hour has passed. The bloodline power replaces serpentfriend."

[[entry]]
id = "ref/sorcbloodline/serpentine"
anchor = "envenomed-wildblooded-mutation"
print = '''
The ophidian source of your bloodline has more to do with stealth and assassination than it does with leadership and alliances.

**Associated Bloodline:** Serpentine.

**Bloodline Arcana:** You gain a +2 bonus on Acrobatics, Climb, and Stealth checks.

**Bloodline Powers:** The stink of poison taints your magic.

**Envenom (Su):** At 3rd level, as a swift action, you can lick or bite a melee weapon to imbue it with 1 dose of black adder venom (see page 558 of the _Core Rulebook_). The poison's DC is equal to 10 + 1/2 your sorcerer level + your Charisma modifier. You may use this ability once per day at 3rd level, and one additional time per day for every three additional levels. The poison cannot be removed or stored, and the weapon loses the benefit of the poison after the first successful attack or 1 hour has passed. The bloodline power replaces serpentfriend.'''

[[entry]]
id = "ref/sorcbloodline/shadow"
anchor = "opening"
print = "Spirits from the shadow plane dally at times in the world of light, and such as these lay with your ancestors once upon a time, imparting the mystery of shadow-stuff into your lineage. You are often sullen and withdrawn, preferring to skulk at the fringes of social circles and keep to yourself, cultivating an air of mystery and majesty that is all your own."

[[entry]]
id = "ref/sorcbloodline/shadow"
anchor = "class-skill"
print = "Stealth."

[[entry]]
id = "ref/sorcbloodline/shadow"
anchor = "bonus-spells"
print = "_ray of enfeeblement_ (3rd), _darkvision_ (5th), _deeper darkness_ (7th), _shadow conjuration_ (9th), _shadow evocation_ (11th), _shadow walk_ (13th), _power word blind_ (15th), _greater shadow evocation_ (17th), _shades_ (19th)."

[[entry]]
id = "ref/sorcbloodline/shadow"
anchor = "bonus-feats"
print = "[Acrobatic](ref/feat/acrobatic), [Blind-Fight](ref/feat/blind-fight), [Dodge](ref/feat/dodge), [Quick Draw](ref/feat/quick-draw), [Silent Spell](ref/feat/silent-spell), [Skill Focus](ref/feat/skill-focus) (Stealth), [Stealthy](ref/feat/stealthy), [Weapon Finesse](ref/feat/weapon-finesse)."

[[entry]]
id = "ref/sorcbloodline/shadow"
anchor = "bloodline-arcana"
print = "Whenever you cast a spell with the darkness descriptor or the shadow subschool, you gain a circumstance bonus on Stealth checks equal to the spell's level for 1d4 rounds."

[[entry]]
id = "ref/sorcbloodline/shadow"
anchor = "bloodline-powers"
print = "Your benighted heritage infuses your mastery of magic with the essence of shadowstuff."

[[entry]]
id = "ref/sorcbloodline/shadow"
anchor = "shadowstrike"
print = "At 1st level, you can make a melee touch attack as a standard action that inflicts 1d4 points of nonlethal damage + 1 for every two sorcerer levels you possess. In addition, the target is [dazzled](ref/misc/dazzled) for 1 minute. Creatures with [low-light vision](ref/rule/low-light-vision) or [darkvision](ref/rule/darkvision) are not dazzled by this ability. You can use this ability a number of times per day equal to 3 + your Charisma modifier."

[[entry]]
id = "ref/sorcbloodline/shadow"
anchor = "nighteye"
print = "At 3rd level, you gain [darkvision](ref/rule/darkvision) 30 feet. At 9th level, you gain [darkvision](ref/rule/darkvision) 60 feet. If you already possess [darkvision](ref/rule/darkvision), its range is increased by these amounts."

[[entry]]
id = "ref/sorcbloodline/shadow"
anchor = "shadow-well"
print = "At 9th level, you can use the Stealth skill even while being observed and without cover or concealment, as long as you are within 10 feet of a shadow other than your own. In addition, when within an area of darkness or [dim light](ref/rule/vision-and-light), as a standard action you may choose to switch places with a willing ally within 60 feet, who must also be in darkness or dim light. At 13th level, you can instead switch the positions of two willing allies, each of whom must be within 60 feet of you. Unless otherwise noted, this travel is identical to _[dimension door](ref/spell/dimension-door)_. You may use the ability to switch places once per day at 9th level, plus one additional time per day at 17th level and 20th level."

[[entry]]
id = "ref/sorcbloodline/shadow"
anchor = "enveloping-darkness"
print = "At 15th level, you may create an area of _[deeper darkness](ref/spell/deeper-darkness)_ that you can see through without penalty. All creatures except you are [entangled](ref/rule/entangled) within this darkness unless using _[freedom of movement](ref/spell/freedom-of-movement)_ or a similar effect. You may use this ability once per day."

[[entry]]
id = "ref/sorcbloodline/shadow"
anchor = "shadow-master"
print = "At 20th level, you can see perfectly in natural or magical darkness. When you use _[shadow conjuration](ref/spell/shadow-conjuration)_ or _[shadow evocation](ref/spell/shadow-evocation)_ spells, your creations are 20% more real, and any creatures you create gain the benefits of the [Augment Summoning](ref/feat/augment-summoning) feat."

[[entry]]
id = "ref/sorcbloodline/shadow"
anchor = "replacement-bloodline-arcana"
print = "Whenever you cast a spell in an area of dim light or darkness, your effective caster level is increased by 1."

[[entry]]
id = "ref/sorcbloodline/shadow"
anchor = "cloak-of-shadows"
print = "At 1st level, as a standard action, you can grant one target a [cloak of shadows](ref/spell/cloak-of-shadows). This cloak gives the target a bonus on Stealth checks made in areas of dim or no light equal to 1/2 your sorcerer level for 1 round per 2 sorcerer levels you possess (minimum +1 bonus for 1 round). You may use this ability a number of times per day equal to 3 + your Charisma modifier. This bloodline power replaces shadowstrike."

[[entry]]
id = "ref/sorcbloodline/shadow"
anchor = "umbral-wildblooded-mutation"
print = '''
Your nature is to gather the darkness into yourself.

**Associated Bloodline:** Shadow.

**Bloodline Arcana:** Whenever you cast a spell in an area of dim light or darkness, your effective caster level is increased by 1.

**Bloodline Powers:** Your shadow magic is more defensive than offensive.

**Cloak of Shadows (Sp):** At 1st level, as a standard action, you can grant one target a cloak of shadows. This cloak gives the target a bonus on Stealth checks made in areas of dim or no light equal to 1/2 your sorcerer level for 1 round per 2 sorcerer levels you possess (minimum +1 bonus for 1 round). You may use this ability a number of times per day equal to 3 + your Charisma modifier. This bloodline power replaces shadowstrike.'''

[[entry]]
id = "ref/sorcbloodline/starsoul"
anchor = "opening"
print = "You come from a line of stargazers and explorers who delved deeply into the darkness beyond the stars. In touching the void, the void touched them, and your mind, spirit, and body yearn to span the gulf between worlds."

[[entry]]
id = "ref/sorcbloodline/starsoul"
anchor = "class-skill"
print = "Knowledge (nature)."

[[entry]]
id = "ref/sorcbloodline/starsoul"
anchor = "bonus-spells"
print = "_unseen servant_ (3rd), _glitterdust_ (5th), _blink_ (7th), _call lightning storm_ (9th; dealing fire damage, damage increased outdoors at night), _overland flight_ (11th), _repulsion_ (13th), _reverse gravity_ (15th), _greater prying eyes_ (17th), _meteor swarm_ (19th)."

[[entry]]
id = "ref/sorcbloodline/starsoul"
anchor = "bonus-feats"
print = "[Blind-Fight](ref/feat/blind-fight), [Craft Rod](ref/feat/craft-rod), [Dodge](ref/feat/dodge), [Endurance](ref/feat/endurance), [Improved Counterspell](ref/feat/improved-counterspell), [Improved Iron Will](ref/feat/improved-iron-will), [Iron Will](ref/feat/iron-will), [Quicken Spell](ref/feat/quicken-spell), [Skill Focus](ref/feat/skill-focus) (Perception), [Toughness](ref/feat/toughness)."

[[entry]]
id = "ref/sorcbloodline/starsoul"
anchor = "bloodline-arcana"
print = "Whenever you cast an evocation spell, targets that fail their saves are [dazzled](ref/misc/dazzled) by tiny sparkling starlights for 1 round per level of the spell."

[[entry]]
id = "ref/sorcbloodline/starsoul"
anchor = "bloodline-powers"
print = "Your skyward gaze and communion with the heavens focus and enhance your magical talents."

[[entry]]
id = "ref/sorcbloodline/starsoul"
anchor = "minute-meteors"
print = "At 1st level, you can summon a rain of tiny meteorites as a standard action to fall in a 5-foot column, 30 feet high, with a range of 30 feet. The meteors inflict 1d4 points of fire damage + 1 per 2 sorcerer levels. A Reflex save negates this damage. The save DC is equal to 10 + 1/2 your sorcerer level + your Charisma modifier. You may use this ability a number of times per day equal to 3 + your Charisma modifier."

[[entry]]
id = "ref/sorcbloodline/starsoul"
anchor = "voidwalker"
print = "At 3rd level, you gain [low-light vision](ref/rule/low-light-vision) and [resist](ref/umr/resistance) cold and fire 5. At 9th level, you no longer need to breathe, as if wearing a _[necklace of adaptation](ref/magic-wondrous/necklace-of-adaptation)_."

[[entry]]
id = "ref/sorcbloodline/starsoul"
anchor = "aurora-borealis"
print = "At 9th level, you can create a sheet of cascading colors. This power acts as a _[wall of fire](ref/spell/wall-of-fire)_, but it inflicts cold damage and does not radiate heat. However, one side of the aurora designated by you [fascinates](ref/misc/fascinated) creatures within 10 feet, up to a maximum of 2 HD of creatures per sorcerer level. A Will save negates this fascinate effect. The save DC is equal to 10 + 1/2 your sorcerer level + your Charisma modifier. You may use this ability for a number of rounds per day equal to your sorcerer level. These rounds do not need to be consecutive."

[[entry]]
id = "ref/sorcbloodline/starsoul"
anchor = "breaching-the-gulf"
print = "At 15th level, your caster level is increased by 3 when casting spells of the teleportation subschool. In addition, once per day you can teleport a single creature within 30 feet into the void of space if it fails a Will save. The save DC is equal to 10 + 1/2 your sorcerer level + your Charisma modifier. The target can attempt a new saving throw as a full-round action each round to return. While trapped in the airless void, the target takes 6d6 points of cold damage per round and must [hold its breath](ref/misc/hold-your-breath) or begin to suffocate."

[[entry]]
id = "ref/sorcbloodline/starsoul"
anchor = "starborn"
print = "At 20th level, you gain immunity to cold and [blindness](ref/misc/blinded), and you can see perfectly in natural or magical darkness. In addition, you gain [fast healing](ref/umr/fast-healing) 1 when you are outdoors at night."

[[entry]]
id = "ref/sorcbloodline/starsoul"
anchor = "replacement-bloodline-arcana"
print = "Whenever you cast an evocation spell, you may select one affected target that fails its save to suffer the choking airlessness of the void, silencing it (as _silence_, but affecting only the target) for 1 round. This is a supernatural ability."

[[entry]]
id = "ref/sorcbloodline/starsoul"
anchor = "black-motes"
print = "This ability works exactly like (and replaces) minute meteors, except it deals cold damage."

[[entry]]
id = "ref/sorcbloodline/starsoul"
anchor = "voidfield"
print = "At 9th level, you can create an area influenced by the black void. This ability acts as an _[ice storm](ref/spell/ice-storm)_, except the area is also subject to _[deeper darkness](ref/spell/deeper-darkness)_ for 1 round per four sorcerer levels. You may use this ability once per day at 3rd level, and one additional time per day for every three additional levels. The bloodline power replaces aurora borealis."

[[entry]]
id = "ref/sorcbloodline/starsoul"
anchor = "void-touched-wildblooded-mutation"
print = '''
The darkness between the stars calls to you.

**Associated Bloodline:** Starsoul.

**Bloodline Arcana:** Whenever you cast an evocation spell, you may select one affected target that fails its save to suffer the choking airlessness of the void, silencing it (as _silence_, but affecting only the target) for 1 round. This is a supernatural ability.

**Bloodline Powers:** Your magic is blacker than any night.

**Black Motes (Sp):** This ability works exactly like (and replaces) minute meteors, except it deals cold damage.

**Voidfield (Sp):** At 9th level, you can create an area influenced by the black void. This ability acts as an _ice storm_, except the area is also subject to _deeper darkness_ for 1 round per four sorcerer levels. You may use this ability once per day at 3rd level, and one additional time per day for every three additional levels. The bloodline power replaces aurora borealis.'''

[[entry]]
id = "ref/sorcbloodline/stormborn"
anchor = "opening"
print = "You trace your heritage to fierce and proud spirits of storm and sky, and living lightning sings in your veins."

[[entry]]
id = "ref/sorcbloodline/stormborn"
anchor = "class-skill"
print = "Knowledge (nature)."

[[entry]]
id = "ref/sorcbloodline/stormborn"
anchor = "bonus-spells"
print = "_shocking grasp_ (3rd), _gust of wind_ (5th), _lightning bolt_ (7th), _shout_ (9th), _overland flight_ (11th), _chain lightning_ (13th), _control weather_ (15th), _whirlwind_ (17th), _storm of vengeance_ (19th)."

[[entry]]
id = "ref/sorcbloodline/stormborn"
anchor = "bonus-feats"
print = "[Deadly Aim](ref/feat/deadly-aim), [Dodge](ref/feat/dodge), [Enlarge Spell](ref/feat/enlarge-spell), [Far Shot](ref/feat/far-shot), [Great Fortitude](ref/feat/great-fortitude), [Point Blank Shot](ref/feat/point-blank-shot), [Skill Focus](ref/feat/skill-focus) (Fly), [Wind Stance](ref/feat/wind-stance)."

[[entry]]
id = "ref/sorcbloodline/stormborn"
anchor = "bloodline-arcana"
print = "Whenever you cast a spell with the electricity or sonic descriptor, increase the save DC by 1."

[[entry]]
id = "ref/sorcbloodline/stormborn"
anchor = "bloodline-powers"
print = "Your mastery of the storm is reflected in the unique panoply of powers you manifest."

[[entry]]
id = "ref/sorcbloodline/stormborn"
anchor = "thunderstaff"
print = "At 1st level, you can touch a weapon as a standard action, giving it the _[shock](ref/magic-enh/shock)_ property for a number of rounds equal to 1/2 your sorcerer level (minimum 1). At 9th level, you can confer the _[shocking burst](ref/magic-enh/shocking-burst)_ property instead, but the duration of the power is halved. You can use this ability a number of times per day equal to 3 + your Charisma modifier."

[[entry]]
id = "ref/sorcbloodline/stormborn"
anchor = "stormchild"
print = "At 3rd level, you gain [resist](ref/umr/resistance) electricity 5 and resist sonic 5, and treat [wind](ref/rule/winds) effects as being one step less severe. At 9th level, you treat wind effects as being two steps less severe and gain [blindsense](ref/umr/blindsense) 60 feet against [concealment](ref/rule/concealment) from natural or magical fog, mist, or weather effects."

[[entry]]
id = "ref/sorcbloodline/stormborn"
anchor = "thunderbolt"
print = "At 9th level, you can command a stroke of lightning to strike from above in a 5-foot-radius cylinder 60 feet high. The thunderbolt inflicts 1d6 points of damage per sorcerer level; half of this damage is electricity and half is sonic. A Reflex save (DC 10 + 1/2 your sorcerer level + your Charisma modifier) halves this damage. Creatures failing their saves are [deafened](ref/misc/deafened) for 1 round. At 9th level, you can use this ability once per day, at 17th twice per day, and at 20th three times per day. This power has a range of 120 feet."

[[entry]]
id = "ref/sorcbloodline/stormborn"
anchor = "ride-the-lightning"
print = "At 15th level, as a full-round action you can become a living lightning bolt and move in a straight line up to 10 times your speed. You do not provoke attacks of opportunity while moving in this way. Creatures or objects in your path are affected as by your thunderbolt power. Creatures do not block your movement but solid barriers do unless they are reduced to 0 hit points. You can use this power once per day for a number of rounds equal to your sorcerer level."

[[entry]]
id = "ref/sorcbloodline/stormborn"
anchor = "storm-lord"
print = "At 20th level, you are one with the storm. You gain immunity to deafness, stunning, and wind effects and gain [blindsight](ref/umr/blindsight) 120 feet against concealment from natural or magical fog, mist, or weather. Once per day, when attacked with an electricity or sonic effect, you may forgo your saving throw and absorb the energies of the attack, healing 1 point of damage for every 3 points of damage the attack would otherwise have dealt."

[[entry]]
id = "ref/sorcbloodline/stormborn"
anchor = "replacement-bloodline-arcana"
print = "Whenever outdoors during any form of precipitation, your effective caster level is increased by 2."

[[entry]]
id = "ref/sorcbloodline/stormborn"
anchor = "windcaller"
print = "At 9th level, you can call the winds to obey your commands for 1 minute per level. This functions like _[control winds](ref/spell/control-winds)_, except that you may choose to be immune to any increased wind effects you create. The ability's duration does not need to be consecutive, but it must be used in 1-minute increments. This bloodline power replaces thunderbolt."

[[entry]]
id = "ref/sorcbloodline/stormborn"
anchor = "aerial"
print = '''
Your magic is more focused on the power of air and rain than on lightning and thunder.

**Associated Bloodline:** Stormborn.

**Bloodline Arcana:** Whenever outdoors during any form of precipitation, your effective caster level is increased by 2.

**Bloodline Powers:** The greatest storms bring ruin through wind, not electricity.

**Windcaller (Sp):** At 9th level, you can call the winds to obey your commands for 1 minute per level. This functions like _control winds_, except that you may choose to be immune to any increased wind effects you create. The ability's duration does not need to be consecutive, but it must be used in 1-minute increments. This bloodline power replaces thunderbolt.'''

[[entry]]
id = "ref/sorcbloodline/verdant"
anchor = "opening"
print = "Your progenitors infused themselves with raw plant life, binding it into their own tissue and passing it down to their literal seed, giving you innate communion with nature."

[[entry]]
id = "ref/sorcbloodline/verdant"
anchor = "class-skill"
print = "Knowledge (nature)."

[[entry]]
id = "ref/sorcbloodline/verdant"
anchor = "bonus-spells"
print = "_entangle_ (3rd), _barkskin_ (5th), _speak with plants_ (7th), _command plants_ (9th), _wall of thorns_ (11th), _transport via plants_ (13th), _plant shape III_ (15th), _animate plants_ (17th), _shambler_ (19th)."

[[entry]]
id = "ref/sorcbloodline/verdant"
anchor = "bonus-feats"
print = "[Acrobatic Steps](ref/feat/acrobatic-steps), [Craft Staff](ref/feat/craft-staff), [Endurance](ref/feat/endurance), [Extend Spell](ref/feat/extend-spell), [Fleet](ref/feat/fleet), [Nimble Moves](ref/feat/nimble-moves), [Skill Focus](ref/feat/skill-focus) (Knowledge \\[nature\\]), [Toughness](ref/feat/toughness)."

[[entry]]
id = "ref/sorcbloodline/verdant"
anchor = "bloodline-arcana"
print = "Whenever you cast a spell with a range of personal, your skin toughens, granting you a natural armor bonus equal to the spell's level for 1d4 rounds. This bonus does not stack with any other natural armor bonuses you might have."

[[entry]]
id = "ref/sorcbloodline/verdant"
anchor = "bloodline-powers"
print = "The power of living things infuses every aspect of your magic, as you draw power from nature and its life energies flow through you."

[[entry]]
id = "ref/sorcbloodline/verdant"
anchor = "tanglevine"
print = "At 1st level, as a standard action, you can create a 15-foot-long, animated vine that springs from your hand. This vine lasts for 1 round and can be used to make a single [disarm](ref/rule/disarm), [steal](ref/rule/steal), or [trip](ref/rule/trip) combat maneuver, using your sorcerer level plus your Charisma modifier in place of your normal CMB. You can use this power a number of times per day equal to 3 + your Charisma modifier."

[[entry]]
id = "ref/sorcbloodline/verdant"
anchor = "photosynthesis"
print = "At 3rd level, you feed upon nature's raw essence. Your need to eat and sleep is reduced as if wearing a _[ring of sustenance](ref/magic-ring/ring-of-sustenance)_, and you gain a +2 racial bonus on saving throws made against poison and sleep effects. At 9th level, these bonuses increase to +4."

[[entry]]
id = "ref/sorcbloodline/verdant"
anchor = "massmorph"
print = "At 9th level, as a full-round action, you can alter the size and health of plant life, as if using _[plant growth](ref/spell/plant-growth)_ or _[diminish plants](ref/spell/diminish-plants)_. Alternatively, you can transform one willing non-plant creature per sorcerer level (no two of which can be more than 30 feet apart) as _[tree shape](ref/spell/tree-shape)_. You may transform creatures as _[plant shape I](ref/spell/plant-shape-1)_ at 15th level, or _[plant shape II](ref/spell/plant-shape-2)_ at 20th level. You can transform non-plant creatures using this power once per day."

[[entry]]
id = "ref/sorcbloodline/verdant"
anchor = "rooting"
print = "At 15th level, as a move action, you can extend roots into the ground. Your speed is reduced to 5 feet, but you gain a +4 bonus to natural armor and a +10 bonus to CMD against [bull rush](ref/rule/bull-rush), [overrun](ref/rule/overrun), [reposition](ref/rule/reposition), and trip maneuvers. You also gain [tremorsense](ref/umr/tremorsense) 30 feet and [fast healing](ref/umr/fast-healing) 1. You can use this power for a number of minutes per day equal to your sorcerer level. This duration need not be consecutive, but it must be used in 1-minute increments."

[[entry]]
id = "ref/sorcbloodline/verdant"
anchor = "shepherd-of-the-trees"
print = "At 20th level, your verdant heritage fully manifests. You gain a +4 natural armor bonus. You gain immunity to paralysis, poison, polymorph, sleep, and stunning, and you gain [tremorsense](ref/umr/tremorsense) 30 feet even when not rooted."

[[entry]]
id = "ref/sorcbloodline/verdant"
anchor = "replacement-bloodline-arcana"
print = "Your powers of compulsion can affect even plant creatures. Whenever you cast a mind-affecting or language-dependent spell, it affects creatures of the plant type as if they were humanoids that understood your language."

[[entry]]
id = "ref/sorcbloodline/verdant"
anchor = "lush-summoning"
print = "At 3rd level, whenever you summon creatures with a conjuration (summoning) spell, you can decide that they appear green and leafy. The natural armor bonus of such creatures is increased by +2, and they gain a +4 bonus on saves against paralysis, poison, polymorph, sleep, and stunning. This bloodline power replaces photosynthesis."

[[entry]]
id = "ref/sorcbloodline/verdant"
anchor = "groveborn-wildblooded-mutation"
print = '''
Some plant magic is more green, while some is more brown, like hardwood.

**Associated Bloodline:** Verdant.

**Bloodline Arcana:** Your powers of compulsion can affect even plant creatures. Whenever you cast a mind-affecting or language-dependent spell, it affects creatures of the plant type as if they were humanoids that understood your language.

**Bloodline Powers:** Your nature powers create tough, resilient minions.

**Lush Summoning (Su):** At 3rd level, whenever you summon creatures with a conjuration (summoning) spell, you can decide that they appear green and leafy. The natural armor bonus of such creatures is increased by +2, and they gain a +4 bonus on saves against paralysis, poison, polymorph, sleep, and stunning. This bloodline power replaces photosynthesis.'''

[[entry]]
id = "ref/talent/another-day"
anchor = "another-day"
print = "Once per day, when the rogue would be reduced to 0 or fewer hit points by a melee attack, she can take a 5-foot step as an immediate action. If the movement takes her out of the reach of the attack, she takes no damage from the attack. The rogue is [staggered](ref/misc/staggered) for 1 round on her next turn."

[[entry]]
id = "ref/talent/assault-leader"
anchor = "assault-leader"
print = "Once per day, when the rogue misses with an attack on a flanked opponent, she can designate a single ally who is also [flanking](ref/rule/flanking) the target that her attack missed. That ally can make a single melee attack against the opponent as an immediate action."

[[entry]]
id = "ref/talent/befuddling-strike"
anchor = "befuddling-strike"
print = "When the rogue deals sneak attack damage against an opponent, that opponent takes a -2 penalty on attack rolls against the rogue for 1d4 rounds."

[[entry]]
id = "ref/talent/camouflage"
anchor = "camouflage"
print = "Once per day, a rogue with this talent can craft simple but effective camouflage from the surrounding foliage. The rogue needs 1 minute to prepare the camouflage, but once she does, it is good for the rest of the day or until the rogue fails a saving throw against an area effect spell that deals fire, cold, or acid damage, whichever comes first. The rogue gains a +4 bonus on Stealth checks while within terrain that matches the foliage used to make the camouflage. This ability cannot be used in areas without natural foliage."

[[entry]]
id = "ref/talent/canny-observer"
anchor = "canny-observer"
print = "When a rogue with this talent makes a Perception check to hear the details of a conversation or to find concealed or secret objects (including doors and traps), she gains a +4 bonus."

[[entry]]
id = "ref/talent/charmer"
anchor = "charmer"
print = "Once per day, the rogue can roll two dice while making a Diplomacy check, and take the better result. She must choose to use this talent before making the Diplomacy check. A rogue can use this ability one additional time per day for every 5 rogue levels she possesses."

[[entry]]
id = "ref/talent/coax-information"
anchor = "coax-information"
print = "A rogue with this talent can use [Bluff](ref/skill/bluff) or [Diplomacy](ref/skill/diplomacy) in place of [Intimidate](ref/skill/intimidate) to force an opponent to act friendly toward her."

[[entry]]
id = "ref/talent/combat-swipe"
anchor = "combat-swipe"
print = "A rogue who selects this talent gains [Improved Steal](ref/feat/improved-steal) as a bonus feat."

[[entry]]
id = "ref/talent/cunning-trigger"
anchor = "cunning-trigger"
print = "A rogue with this talent can use a swift action to set off any trap within 30 feet that she constructed."

[[entry]]
id = "ref/talent/deadly-cocktail"
anchor = "deadly-cocktail"
print = "A rogue with this talent can apply two doses of poison to a weapon at once. These can be separate poisons, in which case they both affect the target individually, or two doses of the same toxin, in which case the poisons' frequency is extended by 50% and the save DC increases by +2. This talent is an exception to the rule that injury poisons can only be delivered one dose at a time."

[[entry]]
id = "ref/talent/deadly-sneak"
anchor = "deadly-sneak"
print = "Whenever a rogue with this talent uses the [powerful sneak](ref/talent/powerful-sneak) rogue talent, she treats all 1s and 2s on the sneak attack damage dice as 3s. A rogue must have the [powerful sneak](ref/talent/powerful-sneak) rogue talent before choosing this talent."

[[entry]]
id = "ref/talent/distracting-attack"
anchor = "distracting-attack"
print = '''
The ranger can use this trick as a free action before he makes an attack. If the attack hits, the target takes a -2 penalty on all attack rolls for 1 round.

_Hateful Attack (Ex)_: The ranger can use this trick as a free action when he makes an attack against one of his favored enemies. The ranger doubles the threat range of his weapon for this attack. This does not stack with other abilities that increase a weapon's threat range.

_Heel (Ex)_: The ranger can use this trick as an immediate action when his animal companion moves. When the companion moves, the square it starts out in is not considered threatened by any opponent it can see, and therefore visible enemies do not get attacks of opportunity against it when it moves from that square. The companion must end this movement in a square adjacent to the ranger. The animal companion must be able to see and hear the ranger to take this movement.

_Hobbling Attack (Ex)_: The ranger can use this trick as a free action when he hits with an attack. The target of the attack's land speed is reduced by 1/2 for 1d4 rounds.

_Quick Climb (Ex)_: The ranger can climb at his full speed as a move action without penalty.'''

