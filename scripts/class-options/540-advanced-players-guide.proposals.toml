[[entry]]
id = "ref/talent/powerful-sneak"
anchor = "powerful-sneak"
print = "Whenever a rogue with this talent takes a full attack action, she can elect to take a -2 penalty on all attack rolls until the start of her next turn. If an attack during this time is a sneak attack, she treats all 1s on the sneak attack damage dice as 2s."

[[entry]]
id = "ref/talent/quick-disguise"
anchor = "quick-disguise"
print = '''
A rogue with this talent can use the items at hand and seemingly innocuous material hidden on her person to create startlingly effective disguises, reducing the amount of time it takes to create a disguise using the [Disguise](ref/skill/disguise) skill.

The time needed for the rogue to alter her appearance in this manner is based on the complexity of the disguise, as noted on the following table. The times are cumulative, so if a female rogue wants to disguise herself as a male of a different race, that takes 2 minutes.

|Disguise|Time|
| --- | --- |
|Minor details only|1 full-round action|
|Disguise as a different gender|1 minute|
|Disguise as a different race|1 minute|
|Disguise as a different age category|1 minute|
|Disguise as a different size category|1 minute|'''

[[entry]]
