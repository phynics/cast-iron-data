# The printed text of the powers of the class options of the book, written ones included (the check reads an entry against it). Generated: never edit by hand.

[[entry]]
id = "ref/arcaneschool/air"
anchor = "opening"
print = "The air elementalist uses the forces of the wind, sky, clouds, and lightning to confuse and destroy his foes, all while flying through the air with ease."

[[entry]]
id = "ref/arcaneschool/air"
anchor = "air-supremacy"
print = "You gain a +2 enhancement bonus on Fly skill checks. This bonus increases by +1 for every five wizard levels you possess. In addition, you can cast _[feather fall](ref/spell/feather-fall)_ on yourself at will. At 5th level, you can cast _[levitate](ref/spell/levitate)_ on yourself at will. At 10th level, you can cast _[fly](ref/spell/fly)_ on yourself at will. At 20th level, whenever you make a Fly skill check, assume the roll resulted in a natural 20."

[[entry]]
id = "ref/arcaneschool/air"
anchor = "lightning-flash"
print = "As a standard action, you can unleash a flash of electricity. This flash deals 1d6 points of electricity damage + 1 point for every two wizard levels you possess to all creatures within 5 feet of you and [dazzles](ref/misc/dazzled) them for 1d4 rounds. A successful Reflex save negates the dazzled effect and halves the damage. The DC of this save is equal to 10 + 1/2 your wizard level + your Intelligence modifier. You can use this ability a number of times per day equal to 3 + your Intelligence modifier."

[[entry]]
id = "ref/arcaneschool/air"
anchor = "cyclone"
print = "At 8th level, you can create a vortex of turbulent wind around yourself as a standard action. This vortex has a radius of up to 10 feet and a maximum height of 10 feet per wizard level you possess. Any ranged attack passing through this vortex automatically misses. Any flying creature moving through the vortex must make a Fly skill check or immediately fall from the sky, taking falling damage (the creature cannot make a Fly check to reduce or negate this damage). Creatures on the ground cannot pass through the vortex without first making a Strength check. The DC of this check is equal to 10 + your caster level. The vortex is faintly visible and can be spotted with a DC 15 Perception skill check. You can use this ability for a number of rounds per day equal to your wizard level. These rounds do not need to be consecutive."

[[entry]]
id = "ref/arcaneschool/air"
anchor = "freezing-shards"
print = "As a standard action, you can cause shards of ice to burst forth from the ground around you. The shards deal 1d4 points of piercing damage and 1d6 points of cold damage + 1 point for every 2 wizard levels you have to all creatures within 5 feet of you. A successful Reflex save (DC = 10 + [half](ref/misc/fractions-and-rounding) your wizard level + your Intelligence modifier) negates the piercing damage and halves the cold damage. The shards remain until the beginning of your next turn; during this time, the area is [difficult terrain](ref/rule/terrain-and-obstacles). You are not affected by your own freezing shards and can move through the area normally. You can use this ability a number of times per day equal to 3 + your Intelligence modifier."

[[entry]]
id = "ref/arcaneschool/air"
anchor = "icy-shackles"
print = "At 8th level, as a standard action, you can make a melee touch attack against a foe to conjure icy restraints around its ankles, reducing its base speed to 5 feet and dealing it an amount of cold damage at the beginning of its turn equal to your Intelligence modifier. The manacles have AC 10, [hardness](ref/umr/hardness) 0, and 30 hit points, and a creature can destroy them with a successful Strength check (DC = 10 + half your wizard level + your Intelligence modifier) as a standard action. The icy shackles melt away after 1 minute. You can use this ability a number of times per day equal to your Intelligence modifier."

[[entry]]
id = "ref/arcaneschool/air"
anchor = "smokesight"
print = "You can see normally through natural fog and smoke, as well as any fog and smoke that you (but not others) magically create. A number of times per day equal to 3 + your Intelligence bonus, you can touch another creature as a standard action to grant it this vision for 1 hour."

[[entry]]
id = "ref/arcaneschool/air"
anchor = "body-of-smoke"
print = "At 8th level, you can assume a [gaseous form](ref/spell/gaseous-form) (as per the spell of that name) as a swift action for a number of minutes per day equal to your wizard level. This duration does not need to be consecutive, but it must be used in 1-minute increments."

[[entry]]
id = "ref/arcaneschool/air"
anchor = "ice-school"
print = '''
**Associated Schools:** Air, water.

**Replacement Powers:** The following school powers replace the lightning flash and cyclone powers of the air school and the cold blast and wave powers of the water school.

**Freezing Shards (Su):** As a standard action, you can cause shards of ice to burst forth from the ground around you. The shards deal 1d4 points of piercing damage and 1d6 points of cold damage + 1 point for every 2 wizard levels you have to all creatures within 5 feet of you. A successful Reflex save (DC = 10 + half your wizard level + your Intelligence modifier) negates the piercing damage and halves the cold damage. The shards remain until the beginning of your next turn; during this time, the area is difficult terrain. You are not affected by your own freezing shards and can move through the area normally. You can use this ability a number of times per day equal to 3 + your Intelligence modifier.

**Icy Shackles (Su):** At 8th level, as a standard action, you can make a melee touch attack against a foe to conjure icy restraints around its ankles, reducing its base speed to 5 feet and dealing it an amount of cold damage at the beginning of its turn equal to your Intelligence modifier. The manacles have AC 10, hardness 0, and 30 hit points, and a creature can destroy them with a successful Strength check (DC = 10 + half your wizard level + your Intelligence modifier) as a standard action. The icy shackles melt away after 1 minute. You can use this ability a number of times per day equal to your Intelligence modifier.'''

[[entry]]
id = "ref/arcaneschool/earth"
anchor = "opening"
print = "The earth elementalist draws power from the stone around him, shaping it, shattering it, and bending it to his will. He can use it to defend himself or cause it to rise up and crush his foes."

[[entry]]
id = "ref/arcaneschool/earth"
anchor = "earth-supremacy"
print = "You gain a +2 enhancement bonus to your CMD to resist [bull rush](ref/rule/bull-rush), drag, [reposition](ref/rule/reposition), [trip](ref/rule/trip), and [overrun](ref/rule/overrun) attempts as long as you are touching the ground. This bonus increases by +1 for every five wizard levels you possess. In addition, you gain a +1 insight bonus on melee attack and damage rolls whenever both you and your foe are touching the ground. At 20th level, earth and stone do not block the line of effect of your spells, although they do still block your line of sight."

[[entry]]
id = "ref/arcaneschool/earth"
anchor = "acid-cloud"
print = "As a standard action, you can create a 5-foot-radius cloud of acid vapor within 30 feet that lasts for 1 round. This cloud deals 1d6 points of acid damage + 1 point for every two wizard levels you possess to all creatures in the cloud and [sickens](ref/misc/sickened) them for 1 round. A successful Fortitude save negates the sickened effect and halves the damage. The DC of this save is equal to 10 + 1/2 your wizard level + your Intelligence modifier. Creatures that begin their turn inside the cloud can move out that turn without penalty, but those that enter the cloud are affected. You can use this ability a number of times per day equal to 3 + your Intelligence modifier."

[[entry]]
id = "ref/arcaneschool/earth"
anchor = "earth-glide"
print = "At 8th level, you gain the ability to move through earth, dirt, and stone for a number of rounds per day equal to your wizard level. You cannot move through worked earth or stone; only natural substances can be traversed. If your total duration expires before you exit the earth, you are flung back to the point where you entered the stone, take 4d6 points of damage, and are [stunned](ref/misc/stunned) for 1 round. Your burrowing does not leave a hole, nor does it give any sign of your presence (although you can be detected by creatures with [tremorsense](ref/umr/tremorsense)). These rounds do not need to be consecutive."

[[entry]]
id = "ref/arcaneschool/earth"
anchor = "magma-furrow"
print = "As a standard action, you can send forth a 20-foot line of magma. Any creature in this line takes 1d6 points of fire damage + 1 point for every 2 wizard levels you have. A successful Reflex save (DC = 10 + [half](ref/misc/fractions-and-rounding) your wizard level + your Intelligence modifier) halves this damage. In addition, the ground in this area remains molten for another 1d4 rounds. Creatures that begin their turns in the area can move out that turn without penalty, but those that enter the area each take 1d6 points of fire damage. You can use this ability a number of times per day equal to 3 + your Intelligence modifier."

[[entry]]
id = "ref/arcaneschool/earth"
anchor = "lava-shield"
print = "At 8th level, you can create a barrier of lava to protect you for 1 round as a standard action. Choose one edge of your space. That edge is treated as a solid wall for attacks targeting you only. You gain total [cover](ref/rule/cover) from attacks that pass through this edge, and you gain the benefits of _[fire shield](ref/spell/fire-shield)_ (warm shield) while adjacent to the lava shield. You can dismiss the lava shield as a free action, and it disappears immediately if you leave your space. You can use this ability a number of rounds per day equal to half your wizard level."

[[entry]]
id = "ref/arcaneschool/earth"
anchor = "hindering-muck"
print = "As a standard action, you can create a 15-foot cone of sticky mud. Any creature in the cone must succeed at a Reflex save (DC = 10 + half your wizard level + your Intelligence modifier) or become [entangled](ref/rule/entangled) for 1 round for every wizard level you have. An affected creature can take a standard action that provokes attacks of opportunity to wipe off enough of the mud to remove the entangled condition. Jumping into a large body of water or being subject to an effect that creates a substantial amount of water (such as a casting of _[create water](ref/spell/create-water)_) removes all the mud on a creature. You can use this ability a number of times per day equal to 3 + your Intelligence modifier."

[[entry]]
id = "ref/arcaneschool/earth"
anchor = "mud-missile"
print = "At 8th level, you can fling a ball of hardened mud at a foe within 30 feet as a standard action. If you succeed at a ranged touch attack, the mud slams into the target's face, dealing 1d6 points of bludgeoning damage for every 2 wizard levels you have and [blinding](ref/misc/blinded) the target for 1d4 rounds. A creature can remove the blinding mud from itself or another creature with a successful Strength check (DC = 10 + half your wizard level) as a standard action. You can use this ability a number of times per day equal to half your wizard level."

[[entry]]
id = "ref/arcaneschool/earth"
anchor = "magma-school"
print = '''
**Associated Schools:** Earth, fire.

**Replacement Powers:** The following school powers replace the acid cloud and earth glide powers of the earth school and the fire jet and dancing flame powers of the fire school.

**Magma Furrow (Su):** As a standard action, you can send forth a 20-foot line of magma. Any creature in this line takes 1d6 points of fire damage + 1 point for every 2 wizard levels you have. A successful Reflex save (DC = 10 + half your wizard level + your Intelligence modifier) halves this damage. In addition, the ground in this area remains molten for another 1d4 rounds. Creatures that begin their turns in the area can move out that turn without penalty, but those that enter the area each take 1d6 points of fire damage. You can use this ability a number of times per day equal to 3 + your Intelligence modifier.

**Lava Shield (Su):** At 8th level, you can create a barrier of lava to protect you for 1 round as a standard action. Choose one edge of your space. That edge is treated as a solid wall for attacks targeting you only. You gain total cover from attacks that pass through this edge, and you gain the benefits of _fire shield_ (warm shield) while adjacent to the lava shield. You can dismiss the lava shield as a free action, and it disappears immediately if you leave your space. You can use this ability a number of rounds per day equal to half your wizard level.'''

[[entry]]
id = "ref/arcaneschool/fire"
anchor = "opening"
print = "The fire elementalist sees a world around him that is made to burn, and he can bring that fire to consume his foes. He has also learned that fire can purify and protect, if properly controlled."

[[entry]]
id = "ref/arcaneschool/fire"
anchor = "fire-supremacy"
print = "You gain [resistance](ref/umr/resistance) 5 to fire. At 10th level, this resistance increases to 10. At 20th level, you gain [immunity](ref/umr/immunity) to fire damage. In addition, whenever you are within 5 feet of a source of flame at least as large as a campfire, you can draw the fire around you for 1 round as a swift action. Anyone striking you with a melee weapon or unarmed strike takes an amount of fire damage equal to 1/2 your wizard level (minimum 1). Weapons with reach avoid this damage."

[[entry]]
id = "ref/arcaneschool/fire"
anchor = "fire-jet"
print = "As a standard action, you can send forth a 20-foot line of fire. Anyone in this line takes 1d6 points of fire damage + 1 point for every two wizard levels you possess. A successful Reflex save halves this damage. The DC of this save is equal to 10 + 1/2 your wizard level + your Intelligence modifier. Creatures that fail their saving throw [catch fire](ref/rule/catching-on-fire) and take 1d6 points of fire damage on the following round. Creatures that catch fire can avoid this damage by taking a full-round action to extinguish the flames by making a DC 15 Reflex save. Rolling on the ground gives a +2 circumstance bonus on the save. Dousing the creature with water automatically extinguishes the flame. You can use this ability a number of times per day equal to 3 + your Intelligence modifier."

[[entry]]
id = "ref/arcaneschool/fire"
anchor = "dancing-flame"
print = "At 8th level, as a standard action, you can sculpt fire to suit your desires. With one use of this ability you can move any nonmagical fire up to 30 feet. Alternatively you can use this ability to alter any fire spell that you cast with a duration of instantaneous by removing any number of squares from its area of affect. If the fire spell has a duration, you can use this ability to reposition the spell, within its original range (treat this as if you had just cast the spell, even though the duration is unchanged). You cannot use this ability on a fire spell that you did not cast. If you move a nonmagical flame, it must have a new source of fuel. If it does not, it is extinguished in one round. You can use this ability a number of times per day equal to 1/2 your wizard level."

[[entry]]
id = "ref/arcaneschool/fire"
anchor = "magma-furrow"
print = "As a standard action, you can send forth a 20-foot line of magma. Any creature in this line takes 1d6 points of fire damage + 1 point for every 2 wizard levels you have. A successful Reflex save (DC = 10 + [half](ref/misc/fractions-and-rounding) your wizard level + your Intelligence modifier) halves this damage. In addition, the ground in this area remains molten for another 1d4 rounds. Creatures that begin their turns in the area can move out that turn without penalty, but those that enter the area each take 1d6 points of fire damage. You can use this ability a number of times per day equal to 3 + your Intelligence modifier."

