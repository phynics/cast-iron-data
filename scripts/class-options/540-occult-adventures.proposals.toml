anchor = "spiritualist"
print = "Add 1/6 to the shield bonus granted to the spiritualist while under the effects of either spiritual interference or greater spiritual interference."

[[entry]]
id = "ref/emotionalfocus/jealousy"
anchor = "half-elves"
print = "Many half-elves have a talent for forming and reinforcing social ties, and psychic half-elves find that mentally connecting to other creatures makes this even easier. They're especially skilled at the spiritual communication required for the medium class. Half-elves who hew more closely to their elven lineage often become psychics, and those with stronger human blood might become kineticists or mesmerists. The following options are open to all half-elves who have the listed favored class."

[[entry]]
id = "ref/emotionalfocus/jealousy"
anchor = "kineticist"
print = "Gain a +1/4 bonus on damage rolls that apply the kineticist's elemental overflow bonus."

[[entry]]
id = "ref/emotionalfocus/jealousy"
anchor = "medium"
print = "Gain a +1/3 bonus on all skill checks using occult skill unlocks."

[[entry]]
id = "ref/emotionalfocus/jealousy"
anchor = "mesmerist"
print = "When casting mesmerist enchantment spells, add 1/2 to the effective caster level of the spell, but only to determine the spell's duration."

[[entry]]
id = "ref/emotionalfocus/jealousy"
anchor = "occultist"
print = "Gain a +1/2 bonus on Spellcraft checks to identify the properties of magic items and a +1/2 bonus on Use Magic Device checks to emulate a race."

[[entry]]
