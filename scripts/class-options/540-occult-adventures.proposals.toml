[[entry]]
id = "ref/emotionalfocus/jealousy"
anchor = "halflings"
print = "It's a common belief that halflings get out of scrapes because of their good fortune, but for some, \"halfling luck\" is really a reflection of psychic talent. Many develop this ability into something greater to compensate for their small stature, and become particularly adept at inf luencing or manipulating people. The following options are open to all halflings who have the listed favored class."

[[entry]]
id = "ref/emotionalfocus/jealousy"
anchor = "kineticist"
print = "Increase the capacity of the kineticist's internal buffer by 1/6 point."

[[entry]]
