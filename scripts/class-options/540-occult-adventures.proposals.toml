[[entry]]
id = "ref/order/order-of-the-shroud"
anchor = "sensate-fighter-archetype"
print = "A sensate perceives battle through senses beyond mortal ken, anticipating his opponents' movements before they even begin to act. As long as he keeps his focus about him, he fights with a skill rivaling that of the finest masters-at-arms."

[[entry]]
id = "ref/order/order-of-the-shroud"
anchor = "skills"
print = "The sensate's class skills are Acrobatics (Dex), Climb (Str), Craft (Int), Perception (Wis), Profession (Wis), Ride (Dex), Sense Motive (Wis), Survival (Wis), and Swim (Str). This replaces the fighter's class skills."

[[entry]]
id = "ref/order/order-of-the-shroud"
anchor = "weapon-and-armor-proficiency"
print = "Sensates are proficient with all simple and martial weapons, light armor, medium armor, and shields (except tower shields). This replaces the fighter's weapon and armor proficiency."

[[entry]]
id = "ref/order/order-of-the-shroud"
anchor = "guarded-senses"
print = "At 2nd level, a sensate gains a +1 bonus on saves against sonic effects, figments, glamers, patterns, gaze attacks, and scent-based attacks. This bonus increases by 1 for every 4 levels the sensate possesses beyond 2nd. This ability replaces bravery."

[[entry]]
id = "ref/order/order-of-the-shroud"
anchor = "uncanny-dodge"
print = "At 3rd level, a sensate gains uncanny dodge as the barbarian ability of the same name, except supernatural in nature. This ability replaces armor training 1."

[[entry]]
id = "ref/order/order-of-the-shroud"
anchor = "centered-senses"
print = "At 5th level, a sensate can center his senses as a move action. While centered, a sensate gains a +1 insight bonus on attack rolls, weapon damage rolls, and Will saves. This bonus increases by 1 at 9th level and every 4 levels thereafter. A sensate loses his centered state if he gains the confused, dazed, fascinated, staggered, or stunned condition; falls unconscious; or fails a Will save. This ability replaces weapon training 2, 3, and 4."

[[entry]]
id = "ref/order/order-of-the-shroud"
anchor = "improved-uncanny-dodge"
print = "At 7th level, a sensate gains improved uncanny dodge as the barbarian ability of the same name, except supernatural in nature. This ability replaces armor training 2."

[[entry]]
id = "ref/order/order-of-the-shroud"
anchor = "evasion"
print = "At 11th level, a sensate gains evasion while using centered senses. This functions as the rogue ability of the same name, except that it is supernatural in nature and works regardless of the sensate's armor and encumbrance. This ability replaces armor training 3."

[[entry]]
id = "ref/order/order-of-the-shroud"
anchor = "steady"
print = "At 15th level, a sensate can center himself as a swift action. This ability replaces armor training 4."

[[entry]]
id = "ref/order/order-of-the-shroud"
anchor = "perfect-senses"
print = '''
At 19th level, a sensate's senses reach perfection, and he can easily notice illusions and unseen foes by combining his senses. While centered, he gains the effects of _true seeing_ as well as blindsense 60 feet. An unseen creature that makes no sound and leaves no scent (such as a creature under the effects of _invisibility_, _silence_, and _negate aroma_) can still avoid both the _true seeing_ and the blindsense.

This ability replaces armor mastery.'''

[[entry]]
id = "ref/order/order-of-the-shroud"
anchor = "precision"
print = "At 20th level, a sensate rolls twice to confirm critical hits while centered, taking the more favorable result. Opponents must roll twice to confirm critical hits against him, taking the less favorable result. The latter ability does not function when the sensate is denied his Dexterity bonus. This ability replaces weapon mastery."

[[entry]]
id = "ref/order/order-of-the-shroud"
anchor = "relic-hunter-inquisitor-archetype"
print = "Some inquisitors specialize in the use and recovery of long-lost relics of their faiths, drawing forth divine might from the recovered items in order to restore their sanctity and wield these artifacts against the enemies of their gods."

[[entry]]
id = "ref/order/order-of-the-shroud"
anchor = "spells"
print = "A relic hunter casts divine spells drawn from the inquisitor spell list, but her chosen relic schools (see Relics below) limit her to schools she knows, similar in function to an occultist's implements. Any spell or orison gained by the relic hunter has a relic component (see Relics below), and is not considered to be on the relic hunter's spell list until she selects its school though the relics alternate class feature. Once she chooses a school, all spells and orisons of that school are considered to be on the relic hunter's class spell list, allowing her to use spell trigger and spell completion magic items of those spells. A relic hunter's spells per day, daily spell allotment, Difficulty Class, and minimum Wisdom score requirements remain unchanged from the inquisitor's normal spellcasting class feature. This ability alters the inquisitor's spellcasting."

[[entry]]
id = "ref/order/order-of-the-shroud"
anchor = "relics"
print = '''
At 1st level, a relic hunter gains the occultist's implements class feature (see page 47) and learns to use two occultist implement schools as relic schools. At 4th level and every 3 levels thereafter, the relic hunter learns to use one additional relic school drawn from the same source, gaining access to that school's resonant power and base focus power and opening up that school's focus powers for her to select. Like an occultist, a relic hunter can select the same school twice, but it is far less useful for her to do so.

Relics do not need to be magic items, and nonmagical relics do not take up a magic item slot. Relics that are not magic items are often of some religious significance to the relic hunter or her church, such as the battered shield of a saint, a bishop's robe, or the finger bone of a church martyr.

This ability replaces judgment.'''

[[entry]]
id = "ref/order/order-of-the-shroud"
anchor = "deific-focus"
print = '''
At 1st level, a relic hunter learns to invest divine power into her chosen relics. This acts like the occultist's focus powers and mental focus class features (see pages 47 and 48, respectively), with the following adjustments.

Each day, a relic hunter has a number of points of deific focus equal to her inquisitor level + her Wisdom modifier, and she must spend 1 hour in prayer with her relics to invest them with divine power. These points refresh at the start of each day.

At 1st level, the relic hunter learns the two base focus powers from her chosen relic schools and can select one more focus power from the list of those made available by her chosen schools. Whenever she gains a new relic school, she gains the base focus power of that school. In addition, at 4th level and every 4 levels thereafter, she learns a new focus power selected from all of the powers granted by all of the relic schools she knows. She can use these focus powers only by expending points of deific focus. Unless otherwise noted, the DC for any saving throws against a focus power is equal to 10 + 1/2 the inquisitor's class level + the inquisitor's Wisdom modifier. She cannot select a focus power more than once. She uses her inquisitor level in place of an occultist level to qualify for focus powers.

This ability replaces domain, bane, greater bane, second judgment, and third judgment.'''

[[entry]]
id = "ref/order/order-of-the-shroud"
anchor = "psychic-detective-investigator-archetype"
print = "A psychic detective supplements her keen insight with occult skill to unravel mysteries both ordinary and supernatural."

[[entry]]
id = "ref/order/order-of-the-shroud"
anchor = "class-skills"
print = "The psychic detective does not receive Acrobatics, Climb, or Perform as class skills. This alters the investigator's class skills."

[[entry]]
id = "ref/order/order-of-the-shroud"
anchor = "spells"
print = '''
A psychic detective casts psychic spells drawn from the psychic class spell list (see page 69) and augmented by a select set of additional spells (see Psychic Detective Spells on page 120). Only spells from the psychic class spell list of 6th level or lower and psychic detective spells are considered to be part of the psychic detective's spell list. If a spell appears on both the psychic detective and psychic class spell lists, the psychic detective uses the spell level from the psychic detective spell list. She can cast any spell she knows without preparing it ahead of time. To learn or cast a spell, a psychic detective must have an Intelligence score equal to at least 10 + the spell's level. The saving throw DC against a psychic detective's spell is 10 + the spell's level + the psychic detective's Intelligence modifier.

Like other spellcasters, a psychic detective can cast only a certain number of spells of each spell level per day. She knows the same number of spells and receives the same number of spells slots per day as a bard of her investigator level, and knows and uses 0-level knacks as a bard uses cantrips. In addition, she receives bonus spells per day if she has a high Intelligence score (see Table 1–3 on page 17 of the _Core Rulebook_).

At 5th level and every 3 levels thereafter, a psychic detective can choose to learn a new spell in place of one she already knows, using the same rules as a bard. In effect, the psychic detective loses the old spell in exchange for the new one. The new spell's level must be the same as that of the spell being exchanged, and it must be at least 1 level lower than the highest-level spell the psychic detective can cast.

A psychic detective need not prepare her spells in advance. She can cast any psychic detective spell she knows at any time, assuming she has not yet used up her allotment of spells per day for the spell's level.

_Psychic Detective Spells_: A psychic detective has the following spells on her spell list, in addition to psychic spells of 6th level or lower.

1st—_Detect chaos_, _detect evil_, _detect good_, _detect law_, _find traps_.

3rd—_Calm spirit_, _daylight_.

4th—_Modify memory_.

6th—_Banishment_, _moment of prescience_, _scrying (greater)_.

This ability replaces alchemy.'''

[[entry]]
id = "ref/order/order-of-the-shroud"
anchor = "psychic-meddler"
print = "At 2nd level, a psychic detective receives a +1 bonus on saves against psychic spells and spell-like abilities. This bonus increases by 1 at 5th level and every 3 levels thereafter, to a maximum of +6 at 17th level. Starting at 5th level, the psychic investigator adds half this bonus on caster level checks to dispel psychic effects. This ability replaces poison lore, poison resistance, swift alchemy, and poison immunity."

[[entry]]
id = "ref/order/order-of-the-shroud"
anchor = "phrenic-dabbler"
print = "At 3rd level, a psychic detective gains a small pool of phrenic points equal to 1/2 her psychic detective level, as well as one phrenic amplification, as the psychic class feature. This does not allow the psychic detective to qualify for the Extra Amplification feat. This ability replaces the investigator talent gained at 3rd level."

[[entry]]
id = "ref/order/order-of-the-shroud"
anchor = "investigator-talents"
print = "A psychic detective selects investigator talents as normal, except she cannot select the alchemist discovery investigator talent. She can select the Expanded Phrenic Pool feat as a discovery even though she doesn't meet that feat's prerequisites, and she can select an extra phrenic amplification once as a discovery. The following investigator talents, which can be found on pages 32–34 of the _Pathfinder RPG Advanced Class Guide_, complement the psychic detective archetype: confusing strike, device talent, effortless aid, hidden agendas, inspired intelligence, item lore, and unconventional inspiration. This ability alters investigator talents."

[[entry]]
id = "ref/order/order-of-the-shroud"
anchor = "esoteric-magus-archetype"
print = "Esoterics are drawn to the mysticism of the occult and spend their lives delving into forgotten texts and forbidden tomes. Each esoteric learns to inscribe his spells on his flesh in a complex series of occult symbols and arcane equations."

[[entry]]
id = "ref/order/order-of-the-shroud"
anchor = "weapon-and-armor-proficiency"
print = "An esoteric is proficient with simple weapons only. This alters the magus's weapon and armor proficiency."

[[entry]]
id = "ref/order/order-of-the-shroud"
anchor = "diminished-spellcasting"
print = "An esoteric has one fewer spell slot of each level than a regular magus. If this reduces his number of spell slots of a particular level to zero, he can cast spells of that level only if his Intelligence allows bonus spells of that level. This ability alters the magus's spellcasting."

[[entry]]
id = "ref/order/order-of-the-shroud"
anchor = "arcane-pool"
print = '''
At 1st level, an esoteric can use his arcane pool to enhance his unarmed strikes as if they were manufactured weapons. At 5th level, he can use these bonuses to add any of the following weapon special abilities to his weapons or unarmed strikes: _defending_, _flaming_, _flaming burst_, _frost_, _icy burst_, _impact_, _shock_, _shocking burst_, _speed_, or _thundering_.

This ability alters arcane pool.'''

[[entry]]
id = "ref/order/order-of-the-shroud"
anchor = "unarmed-strike"
print = "At 1st level, an esoteric gains Improved Unarmed Strike as a bonus feat. He also treats his magus levels as monk levels when determining the amount of damage he deals with his unarmed strikes."

[[entry]]
id = "ref/order/order-of-the-shroud"
anchor = "unarmed-spellstrike"
print = "At 1st level, an esoteric gains the magus spellstrike class feature. However, an esoteric can deliver spells with spellstrike only with his unarmed strikes. This ability alters spellstrike."

[[entry]]
id = "ref/order/order-of-the-shroud"
anchor = "ki-arcana"
print = "At 4th level, an esoteric's arcane pool is also considered a ki pool for the purposes of meeting feat and ability requirements. Points from an esoteric's arcane pool can be used for abilities that normally require ki. If an esoteric gains a ki pool, he can use points from"

[[entry]]
id = "ref/phrenicamp/complex-countermeasures"
anchor = "complex-countermeasure"
print = "The psychic can spend 1 point from her phrenic pool to increase by 2 the DCs of [concentration](ref/rule/concentration) checks or caster level checks the linked spell requires enemies to attempt. For example, if the linked spell were _[nondetection](ref/spell/nondetection)_, the DC of the caster level check for using a divination on the warded creature or item would increase. This increase also applies to checks to dispel, counterspell, or identify the linked spell. The bonus applies while the spell is cast and lasts for the spell's duration (if appropriate), to a maximum of 24 hours. The psychic can choose to spend 2 points from her phrenic pool to instead increase the linked spell's DCs by 4."

[[entry]]
id = "ref/phrenicamp/conjured-armor"
anchor = "conjured-armor"
print = "By spending 1 point from her phrenic pool, the psychic grants any creature she conjures or summons with the linked spell a +2 deflection bonus to AC. This bonus lasts for 1 round per caster level or until the creature disappears, whichever comes first. This amplification can be linked only to conjuration (calling) or conjuration (summoning) spells. The bonus increases to +3 at 8th level and to +4 at 15th level."

[[entry]]
id = "ref/phrenicamp/defensive-prognostication"
anchor = "defensive-prognostication"
print = "When casting a divination spell, the psychic sees a glimmer of her future. By spending 1 point from her phrenic pool as she casts a divination spell, she gains a +2 insight bonus to AC for a number of rounds equal to the linked spell's level. She can instead spend 2 points to increase the bonus to +4. This amplification can be linked only to divination spells."

[[entry]]
id = "ref/phrenicamp/dispelling-pulse"
anchor = "dispelling-pulse"
print = "The psychic can spend 3 points from her phrenic pool to entwine dispelling magic with a targeted spell. If the target is hit by the linked spell or fails its saving throw, it's affected as though the psychic had cast a targeted _[dispel magic](ref/spell/dispel-magic)_ spell on it. This effect can dispel only spells of the linked spell's level or lower. If the linked spell doesn't already require an attack roll or allow a saving throw, the target can attempt a Will saving throw to avoid the dispelling effect only; the DC is calculated using the linked spell's level (and all other bonuses that would apply if the linked spell allowed a Will save). This amplification can be linked only to a spell that targets one creature or object."

[[entry]]
id = "ref/phrenicamp/dual-amplification"
anchor = "dual-amplification"
print = "When the psychic uses this major amplification, she chooses two other amplifications or major amplifications she knows to apply to the same linked spell. She must spend 1 point from her phrenic pool to do so, plus the full cost of the two other amplifications. She can't apply the same amplification to the linked spell more than once, even if she can use that amplification for multiple different effects."

[[entry]]
id = "ref/phrenicamp/focused-force"
anchor = "focused-force"
print = "When casting a [force](ref/spelldef/force) spell, the psychic can increase the spell's damage by spending 1 point from her phrenic pool. Increase the die size for the spell's damage by one step (from 1d4 to 1d6, 1d6 to 1d8, 1d8 to 1d10, or 1d10 to 1d12). This increases the size of each die rolled, so a spell that dealt 4d6+3 points of force damage would deal 4d8+3 points of force damage instead. This amplification can be linked only to spells that deal force damage, and only if that damage includes a die value. A spell that already uses d12s for damage can't be amplified in this way."

[[entry]]
id = "ref/phrenicamp/intense-focus"
anchor = "intense-focus"
print = "The psychic can spend 1 point from her phrenic pool to gain a +2 bonus on any concentration check she attempts as part of casting the linked spell. She can choose to spend 2 points from her phrenic pool to instead gain a +4 bonus."

[[entry]]
id = "ref/phrenicamp/mimic-metamagic"
anchor = "mimic-metamagic"
print = "When the psychic gains this amplification, she chooses two metamagic feats; she need not have these feats to select them. When she casts a spell, she can spend points from her phrenic pool to apply one of the chosen feats to the linked spell without increasing the spell's level or casting time. She must spend a number of points equal to double the number of levels by which the feat normally increases a spell's level (minimum 2 points). If the metamagic feat alters the spell's casting time in a different way than the standard rules for a spontaneous caster using a metamagic feat (as in the case of [Quicken Spell](ref/feat/quicken-spell)), it changes the casting time accordingly. The psychic can still apply metamagic feats she knows to the spell while using this amplification, increasing the casting time and spell level as normal. This amplification can be applied only to a spell that the chosen metamagic feat could normally affect, and only if the spellcaster can cast spells of a high enough level that she would be able to apply the metamagic feat in question to the linked spell. For example, an 11th-level psychic could spend 8 points to _quicken_ a 1st-level spell, but couldn't _quicken_ a 2nd-level spell because she's unable to cast 6th-level spells. This ability doesn't require her to have any free spell slots in the relevant level, however, so the psychic in the example could _quicken_ a 1st-level spell even if she had cast all her 5th-level spells for the day. A psychic can select this amplification multiple times, adding two additional options to the list of metamagic feats she can apply using this amplification each time."

[[entry]]
id = "ref/phrenicamp/mindshield"
anchor = "mindshield"
print = "The psychic can spend 1 point from her phrenic pool to give one target of the linked spell a +2 morale bonus on Will saves for 1 round per psychic level (maximum 10 rounds). The psychic can instead spend 2 points to increase the bonus to +4. If the linked spell affects more than one creature, the psychic can spend the same number of points for each additional creature she wants to affect with this amplification. She must choose to spend either 1 point for each creature or 2 points for each creature; she can't grant different bonuses to different targets."

[[entry]]
id = "ref/phrenicamp/mindtouch"
anchor = "mindtouch"
print = "The psychic can spend 1 point from her phrenic pool to probe one target's mind if that creature is affected by the linked spell. If the target of the linked spell fails its saving throw or is hit by the spell, the psychic detects its surface thoughts (as the 3rd-round effect of _[detect thoughts](ref/spell/detect-thoughts)_). If the linked spell doesn't already require an attack roll or allow a saving throw, the target can attempt a Will saving throw to avoid the thought-detection effect only; the DC is calculated using the linked spell's level (and all other bonuses that would apply if the linked spell allowed a Will save). This amplification can be linked only to spells that affect a target or an area. If the linked spell can affect more than one creature, the psychic can attempt to detect more than one target's thoughts by spending 1 additional point per creature beyond the first. She must select these targets when she casts the spell and spends the points. This is a mind-affecting effect."

[[entry]]
id = "ref/phrenicamp/ongoing-defense"
anchor = "ongoing-defense"
print = "The psychic can increase the duration of spells that improve her psychic defenses. She can spend 1 point from her phrenic pool when she casts any _[intellect fortress](ref/spell/intellect-fortress-1)_, _[mental barrier](ref/spell/mental-barrier-1)_, _[thought shield](ref/spell/thought-shield-1)_, or _[tower of iron will](ref/spell/tower-of-iron-will-1)_ spell to extend the spell's duration by 1 round."

[[entry]]
id = "ref/phrenicamp/overpowering-mind"
anchor = "overpowering-mind"
print = "The psychic can spend 2 points from her phrenic pool to increase the Will save DC of the linked spell by 1. At 8th level, she can choose to instead spend 4 points to increase the DC by 2. At 15th level, she can choose to instead spend 6 points to increase the DC by 3. This amplification can be linked only to spells that have the mind-affecting descriptor and require a Will saving throw."

[[entry]]
id = "ref/phrenicamp/relentless-casting"
anchor = "relentless-casting"
print = "The psychic can spend 1 point from her phrenic pool to roll twice on any caster level checks to overcome [spell resistance](ref/rule/spell-resistance) required for the linked spell and take the better result. Because she must decide to spend points from her phrenic pool when she starts casting a spell, the psychic must decide to use this ability before the GM calls for the caster level check."

[[entry]]
id = "ref/phrenicamp/space-rending-spell"
anchor = "space-rending-spell"
print = "The psychic can warp space with her mind, teleporting herself as she casts her linked spell. She teleports herself 10 feet per point she spends from her phrenic pool (as _[dimension door](ref/spell/dimension-door)_). The maximum number of points she can spend in this way is equal to the linked spell's level."

[[entry]]
id = "ref/phrenicamp/subordinate-spell"
anchor = "subordinate-spell"
print = "The psychic can divide her mind to cast a less powerful spell upon herself alongside her linked spell. The linked spell can't be lower than 5th level and can't take less than a standard action to cast. This applies to the actual casting time, so the psychic can't add a subordinate spell to a [quickened](ref/feat/quicken-spell) spell. The subordinate spell's casting time must be 1 standard action or less, and its level can be no higher than the linked spell's level - 5. The subordinate spell must target only the psychic (even if it could normally affect other or multiple targets). The psychic must spend a number of points from her phrenic pool equal to 3 + double the subordinate spell's level. The subordinate spell acts as though it had been cast, and uses up one of the psychic's spells per day of its level. The effects of the two spells are separate, so each might require its own [concentration](ref/rule/concentration) check."

[[entry]]
id = "ref/phrenicamp/synaptic-shock"
anchor = "synaptic-shock"
print = "The psychic manipulates an enemy's mind with brute force, causing mental harm beyond that done by her linked spell. She can spend 1 point from her phrenic pool when casting a mind-affecting linked spell to select one of the spell's targets. If the target is affected by the linked spell, that target is [confused](ref/misc/confused) for 1 round after the duration of the spell expires (or immediately, if the spell has an instantaneous duration). If the target succeeds at its save against the linked spell, it is instead confused for 1 round immediately. For each additional point the psychic spends from her phrenic pool, she can confuse one additional target of the linked spell. This amplification can be applied only to a mind-affecting spell that can affect a number of targets or that has an area. It has no effect on creatures that are immune to mind-affecting effects, unless the linked spell is able to affect such creatures (such as a spell that has both [will of the dead](ref/phrenicamp/will-of-the-dead) and synaptic shock applied to it via [dual amplification](ref/phrenicamp/dual-amplification))."

[[entry]]
id = "ref/phrenicamp/turning-shield"
anchor = "turning-shield"
print = "The psychic can turn her excess spell energy into a barrier that deflects weaker spells. She can spend a number of points from her phrenic pool equal to the linked spell's level to gain the benefit of _[spell turning](ref/spell/spell-turning)_ for 1 round per psychic level. The number of spell levels she can turn is equal to the level of the linked spell."

[[entry]]
id = "ref/phrenicamp/undercast-surge"
anchor = "undercast-surge"
print = "When the psychic [undercasts](ref/rule/undercasting-spells) a spell (see page 144), she can spend points from her phrenic pool to increase the spell's effective level, essentially using up a lower-level spell slot to cast a higher-level version of the spell. This costs 2 points per spell level increased. She can't use this ability to cast a version higher than the version she knows. For instance, a psychic who knows _[mind thrust III](ref/spell/mind-thrust-3)_ but not _[mind thrust IV](ref/spell/mind-thrust-4)_ could cast _[mind thrust II](ref/spell/mind-thrust-2)_ and spend 2 points to treat it as _[mind thrust III](ref/spell/mind-thrust-3)_, but couldn't spend 4 points to treat it as _[mind thrust IV](ref/spell/mind-thrust-4)_. This amplification can be linked only to spells that can be undercast."

[[entry]]
id = "ref/phrenicamp/will-of-the-dead"
anchor = "will-of-the-dead"
print = "Even undead creatures can be affected by the psychic's mind-affecting spells. The psychic can spend 2 points from her phrenic pool to overcome an undead creature's immunity to mind-affecting effects for the purposes of the linked spell. This ability functions even on mindless undead, but has no effect on creatures that aren't undead. This amplification can be linked only to spells that have the mind-affecting descriptor."

[[entry]]
id = "ref/sorcbloodline/ectoplasm"
anchor = "opening"
print = "Your family has a connection with the ethereal substance known as ectoplasm, whether from communing with the spirits or battling the spiritual undead. The power of the Ethereal Plane thrums in your mind and pulls at your flesh."

[[entry]]
id = "ref/sorcbloodline/ectoplasm"
anchor = "class-skill"
print = "Stealth."

[[entry]]
id = "ref/sorcbloodline/ectoplasm"
anchor = "bonus-spells"
print = "_Obscuring mist_ (3rd), _ghost whip_ (5th), _ectoplasmic snare_ (7th), _spirit-bound blade_ (9th), _wall of ectoplasm_ (11th), _ethereal jaunt_ (13th), _ectoplasmic eruption_ (15th), _create demiplane_ (17th), _etherealness_ (19th)."

[[entry]]
id = "ref/sorcbloodline/ectoplasm"
anchor = "bonus-feats"
print = "[Blind-Fight](ref/feat/blind-fight), [Dodge](ref/feat/dodge), [Ectoplasmic Spell](ref/feat/ectoplasmic-spell), [Lingering Spell](ref/feat/lingering-spell), [Silent Spell](ref/feat/silent-spell), [Skill Focus](ref/feat/skill-focus) (Fly), [Skill Focus](ref/feat/skill-focus) (Stealth), [Spell Focus](ref/feat/spell-focus)."

[[entry]]
id = "ref/sorcbloodline/ectoplasm"
anchor = "bloodline-arcana"
print = "Incorporeal creatures take 75% of the normal amount of damage from your damaging spells, and when incorporeal creatures attempt saving throws against your non-damaging spells, they roll twice and must take the lower result."

[[entry]]
id = "ref/sorcbloodline/ectoplasm"
anchor = "bloodline-powers"
print = "You can control and emit ectoplasm, leaving you less grounded in the physical world."

[[entry]]
id = "ref/sorcbloodline/ectoplasm"
anchor = "entangling-ectoplasm"
print = '''
At 1st level, you can create a ball of ectoplasm and hurl it at targets within 30 feet. This ectoplasm acts as a [tanglefoot bag](ref/eq-weapon/tanglefoot-bag) that can also entangle incorporeal creatures.

The ectoplasm dissipates within 1d3 rounds. You can use this ability a number of times per day equal to 3 + your Charisma modifier.'''

[[entry]]
id = "ref/sorcbloodline/ectoplasm"
anchor = "ectoplasmic-reach"
print = '''
At 3rd level, you can exude small tendrils of ectoplasm that can be used to make melee touch attacks as part of a spell with a range of touch. You can make melee touch attacks as if you had an additional 5 feet of reach. You must have a free hand with which to direct the ectoplasm.

This ability does not otherwise increase your threatened area. At 11th level, this additional reach increases to 10 feet. At 17th level, this additional reach increases to 15 feet.'''

[[entry]]
id = "ref/sorcbloodline/ectoplasm"
anchor = "ectoplasmic-form"
print = "At 9th level, you can transform into a cloud of ectoplasm. Treat this as _[gaseous form](ref/spell/gaseous-form)_, except that you can fly at a speed of 30 feet, and you can solidify your form sufficiently to carry small objects, though fine manipulation is impossible. You can use this ability for a number of minutes per day equal to your sorcerer level. These minutes need not be consecutive, but must be used in 1-minute increments."

[[entry]]
id = "ref/sorcbloodline/ectoplasm"
anchor = "malevolent-ectoplasm"
print = "At 15th level, your ectoplasmic tendrils can lash out at creatures around you. Treat this as a _[black tentacles](ref/spell/black-tentacles)_ effect centered on your position, but the tentacles can also grapple ethereal and incorporeal creatures, and they do not affect you (though they still affect your allies). You can use this ability a number of rounds per day equal to your sorcerer level. These rounds need not be consecutive."

[[entry]]
id = "ref/sorcbloodline/ectoplasm"
anchor = "ectoplasmic-body"
print = "At 20th level, you are more ectoplasm than flesh. You become immune to sneak attacks and critical hits and gain DR 5/slashing."

[[entry]]
id = "ref/sorcbloodline/ectoplasm"
anchor = "psychic-sorcerer-bloodline"
print = "Psychic power runs thorough your blood, whether it be from a familial predisposition to psychic power or exposure to a powerful psychic phenomenon. Whatever the source of this power, your mind is a dangerous weapon."

[[entry]]
id = "ref/sorcbloodline/ectoplasm"
anchor = "class-skill"
print = "Sense Motive."

[[entry]]
id = "ref/sorcbloodline/ectoplasm"
anchor = "bonus-spells"
print = "_Mind thrust I_ (3rd), _id insinuation I_ (5th), _ego whip I_ (7th), _intellect fortress I_ (9th), _psychic crush I_ (11th), _mental barrier V_ (13th), _tower of iron will III_ (15th), _bilocation_ (17th), _microcosm_ (19th)."

[[entry]]
id = "ref/sorcbloodline/ectoplasm"
anchor = "bonus-feats"
print = "Focused Spell, Heighten Spell, Intuitive Spell, Iron Will, Logical Spell, Persuasive, Quicken Spell, Skill Focus (Sense Motive), Spell Focus."

[[entry]]
id = "ref/sorcbloodline/ectoplasm"
anchor = "bloodline-arcana"
print = "Your sorcerer spells and spell-like abilities count as psychic instead of arcane. You use thought and emotion components instead of verbal and somatic components when casting your spells."

[[entry]]
id = "ref/sorcbloodline/ectoplasm"
anchor = "bloodline-powers"
print = "Your psychic powers make you a master mentalist, but your soul struggles with the urge to transcend into a pure thought-form."

[[entry]]
id = "ref/sorcbloodline/ectoplasm"
anchor = "psychic-strike"
print = "At 1st level, you can overwhelm the minds of those nearby. You can target one creature within 30 feet that you can see; that creature must succeed at a Will saving throw (DC = 10 + 1/2 your sorcerer level + your Charisma modifier) or it takes 1d6 points of damage + 1 point for every 2 sorcerer levels you possess and becomes shaken for 1 round. You can use this ability a number of times per day equal to 3 + your Charisma modifier."

[[entry]]
id = "ref/sorcbloodline/ectoplasm"
anchor = "mental-resistance"
print = "At 3rd level, your mind blocks attempts to assail it. You gain a +2 bonus on saving throws against mind-affecting effects. At 9th level, this bonus increases to +4."

[[entry]]
id = "ref/sorcbloodline/ectoplasm"
anchor = "undercasting-prodigy"
print = "Starting at 9th level, whenever you gain a new level of spells, you automatically replace any psychic bloodline spells that can be undercast with the highest-level version you can cast in your list of spells known. For example, at 9th level, you would replace _mind thrust I_, _id insinuation I_, and _ego whip I_ with _mind thrust IV_, _id insinuation III_, and _ego whip II_, respectively, as spells known."

[[entry]]
id = "ref/sorcbloodline/ectoplasm"
anchor = "thoughtsense"
print = "At 15th level, you can detect the thoughts of others around you, as a constant _thoughtsense_ effect with a range of 30 feet instead of 60 feet."

[[entry]]
id = "ref/sorcbloodline/ectoplasm"
anchor = "true-thought-form"
print = "At 20th level, you can shed the restrictions of the flesh and become a thought-form—a being that exists independently of its substance. Whenever a creature would kill you, you can attempt to use _mind swap_ against that creature as an immediate action just before dying."

[[entry]]
id = "ref/sorcbloodline/ectoplasm"
anchor = "witch-patrons"
print = "Some witches draw their spells from mysterious patrons connected to the mind or the Ethereal Plane. Such esoteric patrons grant unusual powers for their own strange and inscrutable reasons."

[[entry]]
id = "ref/sorcbloodline/psychic"
anchor = "opening"
print = "Psychic power runs thorough your blood, whether it be from a familial predisposition to psychic power or exposure to a powerful psychic phenomenon. Whatever the source of this power, your mind is a dangerous weapon."

[[entry]]
id = "ref/sorcbloodline/psychic"
anchor = "class-skill"
print = "Sense Motive."

[[entry]]
id = "ref/sorcbloodline/psychic"
anchor = "bonus-spells"
print = "_Mind thrust I_ (3rd), _id insinuation I_ (5th), _ego whip I_ (7th), _intellect fortress I_ (9th), _psychic crush I_ (11th), _mental barrier V_ (13th), _tower of iron will III_ (15th), _bilocation_ (17th), _microcosm_ (19th)."

[[entry]]
id = "ref/sorcbloodline/psychic"
anchor = "bonus-feats"
print = "[Focused Spell](ref/feat/focused-spell), [Heighten Spell](ref/feat/heighten-spell), [Intuitive Spell](ref/feat/intuitive-spell), [Iron Will](ref/feat/iron-will), [Logical Spell](ref/feat/logical-spell), [Persuasive](ref/feat/persuasive), [Quicken Spell](ref/feat/quicken-spell), [Skill Focus](ref/feat/skill-focus) (Sense Motive), [Spell Focus](ref/feat/spell-focus)."

[[entry]]
id = "ref/sorcbloodline/psychic"
anchor = "bloodline-arcana"
print = "Your sorcerer spells and [spell-like abilities](ref/umr/spell-like-abilities) count as [psychic](ref/rule/psychic-magic) instead of arcane. You use thought and emotion components instead of verbal and somatic components when casting your spells."

[[entry]]
id = "ref/sorcbloodline/psychic"
anchor = "bloodline-powers"
print = "Your psychic powers make you a master mentalist, but your soul struggles with the urge to transcend into a pure thought-form."

[[entry]]
id = "ref/sorcbloodline/psychic"
anchor = "psychic-strike"
print = "At 1st level, you can overwhelm the minds of those nearby. You can target one creature within 30 feet that you can see; that creature must succeed at a Will saving throw (DC = 10 + 1/2 your sorcerer level + your Charisma modifier) or it takes 1d6 points of damage + 1 point for every 2 sorcerer levels you possess and becomes [shaken](ref/misc/shaken) for 1 round. You can use this ability a number of times per day equal to 3 + your Charisma modifier."

[[entry]]
id = "ref/sorcbloodline/psychic"
anchor = "mental-resistance"
print = "At 3rd level, your mind blocks attempts to assail it. You gain a +2 bonus on saving throws against mind-affecting effects. At 9th level, this bonus increases to +4."

[[entry]]
id = "ref/sorcbloodline/psychic"
anchor = "undercasting-prodigy"
print = "Starting at 9th level, whenever you gain a new level of spells, you automatically replace any psychic bloodline spells that can be undercast with the highest-level version you can cast in your list of spells known. For example, at 9th level, you would replace _mind thrust I_, _id insinuation I_, and _[ego whip I](ref/spell/ego-whip-1)_ with _[mind thrust IV](ref/spell/mind-thrust-4)_, _[id insinuation III](ref/spell/id-insinuation-3)_, and _[ego whip II](ref/spell/ego-whip-2)_, respectively, as spells known."

[[entry]]
id = "ref/sorcbloodline/psychic"
anchor = "thoughtsense"
print = "At 15th level, you can detect the thoughts of others around you, as a constant _[thoughtsense](ref/umr/thoughtsense)_ effect with a range of 30 feet instead of 60 feet."

[[entry]]
id = "ref/sorcbloodline/psychic"
anchor = "true-thought-form"
print = "At 20th level, you can shed the restrictions of the flesh and become a thought-form—a being that exists independently of its substance. Whenever a creature would kill you, you can attempt to use _[mind swap](ref/spell/mind-swap)_ against that creature as an immediate action just before dying."

[[entry]]
id = "ref/sorcbloodline/psychic"
anchor = "witch-patrons"
print = "Some witches draw their spells from mysterious patrons connected to the mind or the Ethereal Plane. Such esoteric patrons grant unusual powers for their own strange and inscrutable reasons."

[[entry]]
id = "ref/spirit/archmage"
anchor = "opening"
print = "An archmage spirit is a font of knowledge and arcane power."

[[entry]]
id = "ref/spirit/archmage"
anchor = "spirit-bonus"
print = "When you channel an archmage, your spirit bonus applies on [concentration](ref/rule/concentration) checks, Intelligence checks, and Intelligence-based skill checks."

[[entry]]
id = "ref/spirit/archmage"
anchor = "seance-boon"
print = "Your damaging spells deal an additional 2 points of damage of the same type that they would normally deal to each target."

[[entry]]
id = "ref/spirit/archmage"
anchor = "favored-locations"
print = "Arcane redoubts, areas of unusual magic, libraries, schools."

[[entry]]
id = "ref/spirit/archmage"
anchor = "influence-penalty"
print = "Your body begins to respond as if you were a frail, aged scholar. You take a penalty equal to your spirit bonus on Strength checks, Strength-based skill checks, Constitution checks, attack rolls, and non-spell damage rolls."

[[entry]]
id = "ref/spirit/archmage"
anchor = "taboos"
print = "Choose one: You eschew all faith in the divine, so you must not be the willing target of divine spells or abilities and you must attempt a Will saving throw against even harmless divine spells and abilities; you must not pass up the opportunity to learn something new and significant (a nontrivial piece of information with a Knowledge check of DC 20 or higher) when that opportunity is directly present; you must use your own magical solution to a challenge if you can, even if a mundane solution that would require fewer resources is available."

[[entry]]
id = "ref/spirit/archmage"
anchor = "archmage-arcana-lesser-su"
print = "Instead of your normal spells per day for your medium level, you use the spells per day from Table 1–4: Mesmerist. For each level of spell you can now cast (including level 0), each time you channel an archmage spirit, select a single spell of that level from the sorcerer/wizard spell list to add to your medium spell list and spells known until you lose contact with the archmage. When you cast these spells, they count as arcane (though not for the purpose of fulfilling prerequisites), and thus you must provide verbal and somatic components instead of thought and emotion components (see page 144)."

[[entry]]
id = "ref/spirit/archmage"
anchor = "arcane-surge-intermediate-su"
print = "You can allow the archmage spirit to gain 1 point of influence over you in order to cast one of your medium spells known without expending a spell slot. When you do so, the caster level and DC of the spell increase by 1, and you can't apply metamagic to the spell."

[[entry]]
id = "ref/spirit/archmage"
anchor = "wild-arcana-greater-su"
print = "You can allow the archmage spirit to gain 1 point of influence over you in order to cast any sorcerer/wizard spell of a level you can cast. You must expend a spell slot of the appropriate level, and you can't apply metamagic to the spell."

[[entry]]
id = "ref/spirit/archmage"
anchor = "legendary-archmage-supreme-su"
print = "Once per day, you can cast any spell on the sorcerer/wizard spell list as if using the wild arcana ability, except the archmage doesn't gain 1 point of influence over you, the spell doesn't require a spell slot, and you can select a spell of any level."

[[entry]]
id = "ref/spirit/champion"
anchor = "opening"
print = "A champion spirit is a paragon of skill at arms."

[[entry]]
id = "ref/spirit/champion"
anchor = "spirit-bonus"
print = "When you channel a champion, your spirit bonus applies on attack rolls, non-spell damage rolls, Strength checks, Strength-based skill checks, and Fortitude saves."

[[entry]]
id = "ref/spirit/champion"
anchor = "seance-boon"
print = "You gain a +2 bonus on all non-spell damage rolls."

[[entry]]
id = "ref/spirit/champion"
anchor = "favored-locations"
print = "Arenas, battlefields, places of violence, practice yards."

[[entry]]
id = "ref/spirit/champion"
anchor = "influence-penalty"
print = "You are quick to violence and prefer a weapon to spells or contemplation. You take a penalty equal to your spirit bonus on Intelligence checks and Intelligence-based skill checks, and to your caster level (to a minimum of caster level 0); as usual, a reduced caster level may render you unable to cast spells. You can't benefit from effects that increase your caster level."

[[entry]]
id = "ref/spirit/champion"
anchor = "taboos"
print = "Choose one: you are superstitious about arcane spellcasting, so you must not be the willing target of arcane spells or abilities and you must attempt a Will saving throw against even harmless arcane spells and abilities; you may not make an attack with any weapon except a specific manufactured weapon (such as \"my father's _+2 falchion_\") that you choose when you take the taboo, and you may not choose unarmed strike for this taboo; you must accept any challenge to prove your prowess in battle, including challenges to single combat—if you or an ally breaks the rules of the challenge, you break this taboo."

[[entry]]
id = "ref/spirit/champion"
anchor = "champion-s-prowess-lesser-su"
print = "You gain proficiency in all martial weapons and in one exotic weapon of your choice, which you choose each time you channel a champion spirit."

[[entry]]
id = "ref/spirit/champion"
anchor = "sudden-attack-intermediate-su"
print = "Whenever you take a full-attack action, you gain one additional attack at your highest base attack bonus. This ability stacks with the extra attack from _haste_, but it doesn't stack with special actions that grant extra attacks, such as flurry of blows or spell combat. Sudden attack works as normal with full-attack options such as two-weapon fighting."

[[entry]]
id = "ref/spirit/champion"
anchor = "fleet-charge-greater-su"
print = "You can take a swift action and a full-round action to move up to your speed and then make a full attack. This special action doesn't combine with sudden attack, but works as normal with effects such as _haste_ and two-weapon fighting. As soon as you begin moving, you are considered to have begun the full-round action, even if circumstances prevent you from attacking at the end of your movement."

[[entry]]
id = "ref/spirit/champion"
anchor = "legendary-champion-supreme-su"
print = "You gain two combat feats of your choice, and you can choose different feats each time you channel a champion spirit. You can treat your base attack bonus from your medium levels as equal to your medium level for the purposes of qualifying for combat feats and determining their effects, and you can count your medium levels as levels of one other class whose base attack bonus equals its class level (such as fighter, barbarian, or slayer) for the purpose of qualifying for the two new combat feats."

[[entry]]
id = "ref/spirit/guardian"
anchor = "opening"
print = "A guardian spirit is an exemplar of protection and defense."

[[entry]]
id = "ref/spirit/guardian"
anchor = "spirit-bonus"
print = "When you channel a guardian, your spirit bonus applies to AC and on Constitution checks, Fortitude saves, and Reflex saves."

[[entry]]
id = "ref/spirit/guardian"
anchor = "seance-boon"
print = "You gain a +1 bonus to CMD."

[[entry]]
id = "ref/spirit/guardian"
anchor = "favored-locations"
print = "City walls, forts, gates, keeps."

[[entry]]
id = "ref/spirit/guardian"
anchor = "influence-penalty"
print = "You are incredibly cautious and guarded in all things, and your caution sometimes gets in the way. When [attacking](ref/rule/attack), you always [fight defensively](ref/misc/fighting-defensively), and when [casting a spell](ref/rule/cast-a-spell), you always cast defensively. Because of your focus on defense, you take a penalty on damage rolls equal to your spirit bonus."

[[entry]]
id = "ref/spirit/guardian"
anchor = "taboos"
print = "Choose one: you must always protect others from danger when you can (including defeated enemies, but not enemies that are an active threat to you and others); you must keep your body in fit physical condition, and you break this taboo every time you drop below half your maximum hit points; you must speak no words and use no abilities with the sonic descriptor, and you break this taboo if you become [enraged](ref/spell/rage), [frightened](ref/misc/frightened), or [panicked](ref/misc/panicked)."

[[entry]]
id = "ref/spirit/guardian"
anchor = "guardian-s-shield-lesser-su"
print = "You gain proficiency in heavy armors and shields (including tower shields)."

[[entry]]
id = "ref/spirit/guardian"
anchor = "absorb-blow-intermediate-su"
print = "You gain DR/— and resistance to acid, cold, electricity, fire, and sonic equal to 1/2 your medium level. Add _paladin's sacrifice_ to your medium spells known as a 2nd-level spell."

[[entry]]
id = "ref/spirit/guardian"
anchor = "sudden-block-greater-su"
print = "After an enemy's attack would hit you or an adjacent creature, you can use spirit surge to increase the victim's AC, possibly causing the attack to fail, by rolling your spirit surge die and adding it to the chosen character's AC. You must not be flat-footed, and you must be aware of the attack. If use of this ability causes the enemy's attack to miss, you can make an attack at your highest base attack bonus against that enemy as an immediate action."

[[entry]]
id = "ref/spirit/guardian"
anchor = "legendary-guardian-supreme-su"
print = "Once per day as an immediate action, you can ignore the effects of a single attack against you, including enemy spells targeting you or whose area or effect includes you. The attack affects other creatures as normal."

[[entry]]
id = "ref/spirit/hierophant"
anchor = "opening"
print = "A hierophant spirit is a being of true and pure faith."

[[entry]]
id = "ref/spirit/hierophant"
anchor = "spirit-bonus"
print = "When you channel a hierophant, your spirit bonus applies on Wisdom checks, Wisdom-based skill checks, and Will saves."

[[entry]]
id = "ref/spirit/hierophant"
anchor = "seance-boon"
print = "Your healing spells and abilities heal an additional 2 points of damage to each target. This does not affect healing conferred by magic items, nor does it add to [fast healing](ref/umr/fast-healing) or similar effects."

[[entry]]
id = "ref/spirit/hierophant"
anchor = "favored-locations"
print = "Altars, churches, sacred groves, shrines."

[[entry]]
id = "ref/spirit/hierophant"
anchor = "influence-penalty"
print = "Whether the spirit hopes to offer a chance for redemption or to sacrifice foes later on a dark altar, you must strike for nonlethal damage in combat whenever possible. You take a penalty equal to your spirit bonus on all Charisma checks and Charisma-based skill checks involving worshipers of faiths other than the spirit's, except checks to convince others to convert to the spirit's faith."

[[entry]]
id = "ref/spirit/hierophant"
anchor = "taboos"
print = "Choose one: you must strongly revere nature and may not wear metal armor or shields; you must follow a paladin or antipaladin code as appropriate for the spirit's deity; you may not deliberately speak any lies, including bluffing, exaggerating, stating half-truths with intent to deceive, lies by omission, and so on, and if you know the answer to a question that someone asks you, you must give the answer."

[[entry]]
id = "ref/spirit/hierophant"
anchor = "divine-surge-lesser-su"
print = "This power functions as the archmage arcana spirit power, except that you add spells from the cleric/oracle list instead of the sorcerer/wizard list (these spells count as divine), and you need a divine focus if the spell requires one."

[[entry]]
id = "ref/spirit/hierophant"
anchor = "energy-font-intermediate-su"
print = "You can channel energy a number of times per day equal to 1 + your Charisma modifier. Choose whether you channel positive or negative energy each time you contact a hierophant spirit; this choice must match the spirit's faith. If you choose positive energy, add _cure_ spells of each level you can cast from the cleric list to your medium spell list and spells known. Otherwise, add _inflict_ spells in the same way. These spells count as divine, as in the divine surge spirit power."

[[entry]]
id = "ref/spirit/hierophant"
anchor = "overflowing-grace-greater-su"
print = "When you heal a creature to full hit points or a creature already at full hit points with your positive or negative energy, that creature gains a +1 sacred bonus on attack rolls, skill checks, ability checks, and saving throws for 1 round. The bonus is sacred if you use positive energy and profane if you use negative energy. If you destroy or kill one or more creatures with positive or negative energy, you gain a +1 bonus of the same type on attack rolls, skill checks, ability checks, and saving throws for 1 round."

[[entry]]
id = "ref/spirit/hierophant"
anchor = "legendary-hierophant-supreme-su"
print = "Once per day, you can request a minor miracle. This request must be in line with the options for _miracle_ that don't cost powdered diamond. As usual for a _miracle_, the deity or other being the spirit worships can choose whether or not to grant the request at its whim."

[[entry]]
id = "ref/spirit/marshal"
anchor = "opening"
print = "A marshal spirit is a towering presence and an inspiration to others."

[[entry]]
id = "ref/spirit/marshal"
anchor = "spirit-bonus"
print = "When you channel a marshal, your spirit bonus applies on Charisma checks and Charisma-based skill checks, as well as on spirit surge rolls. This allows the bonus to apply twice to the total result if you use a spirit surge on a Charisma check or on a Charisma-based skill check."

[[entry]]
id = "ref/spirit/marshal"
anchor = "seance-boon"
print = "Choose a seance boon from any of the other legends to benefit from. When using the shared seance class feature, each participant can choose a different boon."

[[entry]]
id = "ref/spirit/marshal"
anchor = "favored-locations"
print = "Council rooms, stages, theaters, throne rooms."

[[entry]]
id = "ref/spirit/marshal"
anchor = "influence-penalty"
print = "The time you spend concentrating on your allies prevents you from attending to other important matters. You take a penalty equal to your spirit bonus on Wisdom checks and Wisdom-based skill checks. Additionally, if you are not at least nominally in charge of your present allies, you lose the marshal's spirit bonus and seance boon."

[[entry]]
id = "ref/spirit/marshal"
anchor = "taboos"
print = "Choose one: you may not allow yourself or your allies to prevent a fleeing enemy from escaping, since an at-large villain makes a better tale (this applies only to enemies seeking to escape, not to those retreating to alert others or fight again from a better position); you may never leave an ally behind or allow yourself or your allies to sacrifice another ally, even a summoned creature; you must embrace any opportunity to spread the legend of yourself and your allies, even when a low profile would be helpful."

[[entry]]
id = "ref/spirit/marshal"
anchor = "marshal-s-order-lesser-su"
print = "You can use your spirit surge on attack rolls, saving throws, ability checks, concentration checks, and skill checks rolled by you or any allies who participated in your seance as long as you have line of sight and line of effect, and are within 30 feet of the chosen ally. You can still use spirit surge only once per round."

[[entry]]
id = "ref/spirit/marshal"
anchor = "inspiring-call-intermediate-su"
print = "As a standard action, you can grant all allies who can see and hear you a competence bonus equal to your spirit bonus on either saving throws or attack and damage rolls. You choose which bonus to grant each time you use inspiring call. This ability lasts for 1 round. If you have the decisive strike greater spirit power, you can use inspiring call as a move action. If you have the legendary marshal supreme spirit power, you can use inspiring call as a swift action."

[[entry]]
id = "ref/spirit/marshal"
anchor = "decisive-strike-greater-su"
print = "You can allow the marshal to gain 1 point of influence over you as a swift action to allow an ally within 30 feet who can see and hear you to make a single melee or ranged attack during your turn. You can use this ability as a standard action to instead allow the ally to perform any standard action."

[[entry]]
id = "ref/spirit/marshal"
anchor = "legendary-marshal-supreme-su"
print = "You can use a lesser spirit surge without incurring influence. This lesser surge adds a maximum of 1d6 to the roll and does not apply your spirit bonus, regardless of other effects or abilities you have that alter your spirit surge. A lesser surge still counts as a spirit surge for the purpose of the limit of one spirit surge per round, but it does not consume any free uses of spirit surge you may have from effects such as taboo."

[[entry]]
id = "ref/spirit/trickster"
anchor = "opening"
print = "A trickster spirit is a savvy and manipulative master of skills."

[[entry]]
id = "ref/spirit/trickster"
anchor = "spirit-bonus"
print = "When you channel a trickster, your spirit bonus applies on Dexterity checks, skill checks, and Reflex saves."

[[entry]]
id = "ref/spirit/trickster"
anchor = "seance-boon"
print = "Choose one skill when you gain this seance boon. You gain a +1 bonus on skill checks using that skill, and that skill counts as a class skill for you."

[[entry]]
id = "ref/spirit/trickster"
anchor = "favored-locations"
print = "Alleys, mazes, taverns, trap-filled locations."

[[entry]]
id = "ref/spirit/trickster"
anchor = "influence-penalty"
print = "The trickster within you is a protean manipulator, and you begin to see the possibility that everyone around you might have ulterior motives as well. You never count as an ally for the purpose of gaining benefits from another creature's abilities, nor do you count as a willing target for spells. Anyone attempting to target you with a touch range spell, even a beneficial spell, must succeed at a melee touch attack, though you need not attempt saving throws against harmless spells. You gain no benefit from another creature's [aid another](ref/rule/aid-another) attempts, as you are too busy making sure they aren't secretly tricking or sabotaging you."

[[entry]]
id = "ref/spirit/trickster"
anchor = "taboos"
print = "Choose one: you can't abide revealing your true identity, and you break this taboo when anyone pierces your disguise, even your own allies; you can never tell the truth; you can never pass up a more lucrative offer, even if it causes you to switch sides."

[[entry]]
id = "ref/spirit/trickster"
anchor = "trickster-s-edge-lesser-su"
print = "Choose any two skills. These skills count as class skills for you, and you are treated as if you had an additional number of ranks in those skills equal to your medium level (to a maximum of your character level)."

[[entry]]
id = "ref/spirit/trickster"
anchor = "surprise-strike-intermediate-su"
print = "When you attack an opponent that's denied its Dexterity bonus to AC, you deal 1d6 points of extra precision damage for every 3 medium levels. Your target counts as flat-footed against the first attack you make against that target in a day, regardless of abilities like uncanny dodge. After your first attack, that target is immune to being made flat-footed by your surprise strike for 24 hours."

[[entry]]
id = "ref/spirit/trickster"
anchor = "transfer-magic-greater-su"
print = "You can allow the trickster to gain 1 point of influence over you to make a melee touch attack against another creature as a standard action. If the attack succeeds, you randomly steal one of the harmless spells of the highest spell level active on that creature, ending the effect for the original creature and gaining all remaining duration for yourself. This ability does not work on personal-range or instantaneous- or permanent-duration spells."

[[entry]]
id = "ref/spirit/trickster"
anchor = "legendary-trickster-supreme-su"
print = "Once per day, instead of rolling for a skill check, you can choose your d20 result. Additionally, you gain the ability to change form at will as if using _greater polymorph_, except that you can mimic the form of a specific individual."

[[entry]]
id = "ref/spirit/trickster"
anchor = "medium-spells"
print = "Mediums gain access to the following spells. Many of these spells are found in the _Core Rulebook_; the spells marked with an asterisk (\\*) appear in Chapter 4 of this book, and those found elsewhere are marked with superscript abbreviations denoting their source. The medium casts all spells as psychic spells."

[[entry]]
id = "ref/spirit/trickster"
anchor = "0-level-medium-spells"
print = "_Bleed_, _dancing lights_, _daze_, _detect magic_, _detect psychic significance_\\*, _flare_, _ghost sound_, _grave words_\\*, _guidance, haunted fey aspect, light_, _mage hand_, _message_, _open/close_, _prestidigitation_, _read magic_, _resistance_, _sift_, _stabilize_, _virtue_."

[[entry]]
id = "ref/spirit/trickster"
anchor = "1st-level-medium-spells"
