id = "ref/implement/illusion"
anchor = "resonant-powers"
print = "Each time the occultist invests mental focus into a necromancy implement, the implement grants the following resonant power. The implement's bearer gains the benefits of this power until the occultist refreshes his focus."

[[entry]]
id = "ref/implement/illusion"
anchor = "necromantic-focus"
print = "The implement grants its possessor greater power over the undead. Whoever possesses the implement can control an additional 2 Hit Dice of undead for every point of mental focus invested in the item (to a maximum number of Hit Dice equal to 4 × your occultist level). Any spellcaster who bears the implement can add it as an additional focus component for a necromancy spell he casts to create undead. If he does so, he can create an additional number of HD of undead equal to the additional HD the implement allows him to control (apply this effect after doubling the HD of undead for _desecrate_, if applicable). Undead creatures take a -1 penalty on saving throws against spells cast by the bearer of this implement for every 4 points of mental focus invested in this implement."

[[entry]]
id = "ref/implement/illusion"
anchor = "base-focus-power"
print = "All occultists who learn to use necromancy implements gain the following focus power."

[[entry]]
id = "ref/implement/illusion"
anchor = "mind-fear"
print = "As a standard action, you can expend 1 point of mental focus to cause a living creature to succumb to fear. The target must be within 30 feet of you, and it can attempt a Will saving throw to negate the effect. If the target fails the save and has a number of Hit Dice less than or equal to yours, it is frightened for 1d4 rounds. If the target fails the saving throw and has a number of Hit Dice greater than yours, it is instead shaken for 1d4 rounds. This is a mind-affecting fear effect."

[[entry]]
id = "ref/implement/illusion"
anchor = "focus-powers"
print = "In addition to gaining the base focus power, occultists who learn to use necromancy implements can select from the following focus powers when choosing the powers gained from their focus powers class feature."

[[entry]]
id = "ref/implement/illusion"
anchor = "flesh-rot"
print = "As a standard action, you can make a melee touch attack and expend 1 point of mental focus to cause the flesh of a living creature to rot and wither. If the attack hits, the target takes 1d8 points of damage + 1 point per occultist level you possess. For every 4 occultist levels you possess beyond 3rd, the target takes an additional 1d8 points of damage (to a maximum of 5d8 at 19th level). If you miss with the melee touch attack, this power is wasted with no effect. You must be at least 3rd level to select this focus power."

[[entry]]
id = "ref/implement/illusion"
anchor = "necromantic-servant"
print = "As a standard action, you can expend 1 point of mental focus to raise a single human skeleton (_Pathfinder RPG Bestiary_ 250) or human zombie (_Bestiary_ 288) from the ground to serve you for 10 minutes per occultist level you possess or until it is destroyed, whichever comes first. This servant has a number of hit points equal to 1/2 your maximum hit point total (not adjusted for temporary hit points or other temporary increases). It also uses your base attack bonus and gains a bonus on damage rolls equal to 1/2 your occultist level. At 5th level, whenever the necromantic servant would be destroyed, if you are within medium range (100 feet + 10 feet per level) of the servant, you can expend 1 point of mental focus as an immediate action to cause the servant to return to full hit points. At 9th level, you can choose to give the servant the bloody or burning simple template (if it's a skeleton) or the fast simple template (if it's a zombie). At 13th level, when you take an immediate action to restore your servant, it splits into two servants. You can have a maximum number of servants in existence equal to 1/2 your occultist level. At 17th level, the servant gains a teamwork feat of your choice."

[[entry]]
id = "ref/implement/illusion"
anchor = "pain-wave"
print = "As a standard action, you can expend 1 point of mental focus to unleash a wave of pain. This wave hits all creatures other than you in a 20-foot-radius burst centered on a point that you designate within 100 feet. All living creatures in this area are wracked with pain, gaining the sickened condition for 1 round per occultist level you possess. Affected creatures can attempt a Will save to reduce the duration to just 1 round. This is a mind-affecting pain effect. You must be at least 7th level to select this focus power."

[[entry]]
id = "ref/implement/illusion"
anchor = "psychic-curse"
print = "As a standard action, you can expend 1 point of mental focus to curse a living creature within 30 feet with your psychic magic. You can choose one of the following effects: memory lapse, mental block, or pain confusion. If you choose memory lapse, the target loses its memory of the past 1 hour per occultist level you possess. If you choose mental block, you can proscribe one specific action, such as attacking with a type of weapon, casting a specific spell, or something else suitably specific (subject to the GM's discretion). The target can't take that action without first succeeding at a Will save. If it fails, it can take other actions instead. If it attempts the prohibited action again on subsequent rounds, it gains a cumulative +2 bonus on the save until it succeeds. If you select pain confusion, the creature is confused for 1d4 rounds whenever it is damaged by a critical hit. The target can attempt a Will save to negate this effect. This effect lasts for 1 day per occultist level you possess. A creature can't be under the effects of more than one psychic curse at a time. This is a mind-affecting curse effect. You must be at least 5th level to select this focus power."

[[entry]]
id = "ref/implement/illusion"
anchor = "soulbound-puppet"
print = "As a full-round action, you can expend 1 point of mental focus to create a soulbound puppet from a bone, doll, or skull. If you use a bone or a skull, your power builds a Tiny or Small flesh puppet around it that vaguely resembles the original creature from which the bones were taken. If the implement is a doll, the doll comes to life. Treat this as a familiar, using your occultist level as your wizard level to determine its powers and abilities. By using a bone or skull from the appropriate creature or a doll shaped like that creature, you can select any of the familiar choices available to a wizard. You can instead use a humanoid bone, doll, or skull, to give the puppet the base statistics of a homunculus (_Bestiary_ 176), but without a fly speed or the poison bite or telepathic link abilities. No matter the form, this creature is a construct with an alignment matching your own. You can have no more than one soulbound puppet active at any given time. The soulbound puppet remains animated for 10 minutes per occultist level you possess."

[[entry]]
id = "ref/implement/illusion"
anchor = "spirit-shroud"
print = "As a standard action, you can expend 1 point of mental focus to surround yourself with a shroud of spirit energy. You gain a number of temporary hit points equal to 1d6 + your occultist level. This shroud lasts for 1 minute per occultist level or until the temporary hit points are expended, whichever comes first. These temporary hit points stack with those from other sources, but not with those gained through multiple uses of this ability. At 4th level, as long as the shroud remains, you also gain a resistance bonus on all saving throws against death effects, fear effects, and any spells or effects that bestow negative levels or deal negative energy damage (if the spells or effects allow a save). This bonus is equal to 1 + 1 for every 4 occultist levels you possess beyond 4th. You must be at least 3rd level to select this focus power."

[[entry]]
id = "ref/implement/illusion"
anchor = "transmutation-implements"
print = "Transmutation implements can alter the properties of both objects and creatures."

[[entry]]
id = "ref/implement/illusion"
anchor = "implements"
print = "Belt, boots, sandals, vest, weapon."

[[entry]]
id = "ref/implement/illusion"
anchor = "resonant-powers"
print = "Each time the occultist invests mental focus into a transmutation implement, the implement grants the following resonant power. The implement's bearer gains the benefits of this power until the occultist refreshes his focus."

[[entry]]
id = "ref/implement/illusion"
anchor = "physical-enhancement"
print = "The implement enhances its bearer's body. When you invest mental focus in the implement, select a physical ability score. The implement grants a +2 temporary enhancement bonus to that physical ability score for every 3 points of mental focus invested in the implement (to a maximum of +2 at 1st level, plus an additional 2 for every 6 occultist levels you possess)."

[[entry]]
id = "ref/implement/illusion"
anchor = "base-focus-power"
print = "All occultists who learn to use transmutation implements gain the following focus power."

[[entry]]
id = "ref/implement/illusion"
anchor = "legacy-weapon"
print = '''
As a standard action, you can expend 1 point of mental focus and touch a weapon to grant it an enhancement bonus. The bonus is equal to 1 + 1 for every 6 occultist levels you possess (to a maximum of +4 at 18th level). Enhancement bonuses gained by this ability stack with those of the weapon, to a maximum of +5.

You can also imbue the weapon with any one weapon special ability with an equivalent enhancement bonus less than or equal to your maximum bonus by reducing the granted enhancement bonus by the appropriate amount. The item must have an enhancement bonus of at least +1 (from the item itself or from legacy weapon) to gain a weapon special ability. In either case, these bonuses last for 1 minute.'''

[[entry]]
id = "ref/implement/illusion"
anchor = "focus-powers"
print = "In addition to gaining the base focus power, occultists who learn to use transmutation implements can select from the following focus powers when choosing the powers gained from their focus powers class feature."

[[entry]]
id = "ref/implement/illusion"
anchor = "mind-over-gravity"
print = "As a standard action, you can expend 1 point of mental focus to give yourself a fly speed of 60 feet with perfect maneuverability. This effect lasts for 1 minute per occultist level you possess. You must be at least 7th level to select this focus power."

[[entry]]
id = "ref/implement/illusion"
anchor = "philosopher-s-touch"
print = "As a standard action, you can expend 1 point of mental focus and touch a weapon, causing it to gain the properties of a special material. You can cause the weapon to be treated as cold iron or silver for the purposes of overcoming damage reduction for 1 minute per occultist level you possess. At 4th level and every 4 levels thereafter, you can touch an additional weapon as part of using this ability to grant that weapon the same benefit (still expending only 1 point of mental focus). At 11th level, you can cause any weapon affected by this ability to act as if it were adamantine instead (but only for the purposes of overcoming damage reduction, not for overcoming hardness)."

[[entry]]
id = "ref/implement/illusion"
anchor = "quickness"
print = "As a standard action, you can expend 1 point of mental focus to grant supernatural quickness and reflexes to yourself or a willing living creature you touch. This functions as _haste_, but the bonus to AC and on Reflex saving throws increases to +2. This effect lasts for 1 round per occultist level you possess. You must be at least 5th level to select this focus power."

[[entry]]
id = "ref/implement/illusion"
anchor = "size-alteration"
print = "As a standard action, you can expend 1 point of mental focus and touch a creature to alter its size. You can increase or decrease the creature's size by one step, as _enlarge person_ or _reduce person_ but not limited by the creature's type. If the creature is hostile toward you, using this ability requires a successful melee touch attack, and the creature can attempt a Fortitude save to negate the effect. This effect lasts for 1 round per occultist level you possess. You can't use this ability on a creature that is already subject to an effect that alters its size."

[[entry]]
id = "ref/implement/illusion"
anchor = "sudden-speed"
print = "As a swift action, you can expend 1 point of mental focus to grant yourself a burst of speed. This increases your land speed by 30 feet for 1 minute. This ability does not stack with itself."

[[entry]]
id = "ref/implement/illusion"
anchor = "telekinetic-mastery"
print = "As a standard action, you can expend 1 point of mental focus to grant yourself telekinetic power. This functions as _telekinesis_, except you don't need to concentrate on the effect to maintain it, and using any one of its effects is a standard action. This effect lasts for 1 round per occultist level you possess. You must be at least 9th level to select this focus power."

[[entry]]
id = "ref/implement/illusion"
anchor = "occultist-spells"
print = "Occultists gain access to the following spells, as determined by their chosen implement schools. A spell is not considered to be on the occultist's spell list until the occultist selects its implement school though the implements class feature. Once an implement school has been chosen, all spells on the lists from that school below are considered to be on the occultist's spell list for the purpose of spell trigger and spell completion magic items. Many of these spells are found in the _Core Rulebook_; the spells marked with an asterisk (\\*) appear in Chapter 4 of this book, and those that are found elsewhere are marked with superscript abbreviations denoting their source. The occultist casts all spells as psychic spells."

