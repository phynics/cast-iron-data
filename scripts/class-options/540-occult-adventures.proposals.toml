[[entry]]
id = "ref/implement/abjuration"
anchor = "opening"
print = "from one implement and adds the same number - 1 to another implement; this takes 1 minute of quiet contemplation while touching both implements. The occultist can shift his mental focus only from one implement to another implement; he can't shift generic focus into an implement. Unlike expending focus normally, this shift can reduce the effect of a resonant power in the implement from which the mental focus was taken. It does not, however, add to the resonant power of the implement to which the focus is added."

[[entry]]
id = "ref/implement/abjuration"
anchor = "aura-sight"
print = "At 5th level, the occultist can read the auras of creatures around him as a standard action. This functions as the _aura sight_ spell with a duration of 1 round."

[[entry]]
id = "ref/implement/abjuration"
anchor = "magic-circles"
print = "At 8th level, an occultist learns how to draw magic circles. To draw a circle, he must have chalk, salt, blood, powdered silver, or some other appropriate substance at hand (although he can press a magic circle into a softer surface such as dirt or clay). Drawing a circle takes 1 minute and requires the occultist to expend 1 point of mental focus (either generic focus or focus from any one of his implements). Once completed, this circle functions as a permanent _magic circle_ against any alignment of the occultist's choosing. The circle can't be against a component of the occultist's alignment (if he is lawful good, for example, it can't be a _magic circle against good_ or _law_). The circle remains until its form is physically broken (for example, if the lines are smeared or the salt is scattered). Only a living creature can break the circle; environmental effects can't break it. An occultist can have only one circle created in this way at a time. If he creates a second circle, the first one loses all its magic powers. This type of magic circle can't normally be focused inward to bind an outsider."

[[entry]]
id = "ref/implement/abjuration"
anchor = "outside-contact"
print = '''
At 8th level, the occultist learns the true name of one particular outsider. This outsider can have no more than 3 Hit Dice. Whenever the occultist creates a magic circle, he can expend 1 additional point of mental focus to focus the circle inward and lure that outsider to the circle (similar to using _lesser planar binding_). The outsider is bound for up to 10 minutes. During this time, the occultist can bargain with the outsider for one piece of information. This requires a payment of at least 20 gp (or items of at least that value that are of interest to the outsider). The bargaining requires the occultist to attempt a Diplomacy or Intimidate check opposed by the outsider's Sense Motive check. Succeeding at the check by 5 or more reduces this cost to 10 gp. Failure increases the price to 30 gp, whereas failure by 5 or more allows the outsider to escape without giving any information (or receiving payment). The information gained can be anything that might be learned through a _divination_ spell. The information is always correct but is frequently cryptic. It typically takes the outsider 1d3 hours to gather the information, at which point it returns of its own accord to deliver the information as promised. The outsider always resents being used in this way, even if the occultist and the outsider share an alignment component. After the occultist bargains with the outsider, the magic circle loses all power and the outsider is sent back to its home plane.

At 12th level and every 4 levels thereafter, the occultist learns to contact one additional outsider of the same type or a different type. Although he can call only one outsider in this way at a time, the occultist can ask such an outsider one additional question per calling for every 4 occultist levels he possesses beyond 8th (to a maximum of four questions at 20th level), all for the same bargaining price. The questions must be in some way related to one another.

At 16th level, in lieu of asking questions, the occultist can demand that the outsider deliver a message to any one friendly creature that the occultist knows personally. The occultist can also task the outsider to deliver one object weighing no more than 1 pound. Either of these demands requires an opposed check as described above. Delivery typically takes 1d4 hours, but this period is reduced to 1d6 minutes if the recipient is within 1 mile of the occultist (or even less if the recipient is within sight). The occultist must be able to accurately describe the recipient in both name and appearance. This ability can't be used to deliver anything to a location, or to enemies or creatures that are unfriendly to the occultist.'''

[[entry]]
id = "ref/implement/abjuration"
anchor = "binding-circles"
print = "At 12th level, whenever the occultist creates a magic circle he can expend 1 additional point of mental focus to make it a binding circle. A binding circle is invisible and counts as a trap. If a living creature of the corresponding alignment steps inside it, the trap triggers and binds the creature inside the circle. While it can move freely within the circle, it can't leave the circle, make attacks against targets outside the circle, cast spells that cross the circle's boundary (the circle blocks line of effect from the inside), or use any ability that would allow it to leave the circle or disturb the circle in any way. When the circle traps a creature in this way, the creature can attempt a Reflex save to dive out of the circle before the magic takes hold (DC = 10 + 1/2 the occultist's level + the occultist's Intelligence modifier). A creature that can see the circle gains a +4 bonus on this save. If it fails its save, the creature must remain in the circle, although it can attempt a Will save at the same DC at the end of each hour of imprisonment to escape. A binding circle can be spotted with a successful Perception check (DC = 25 + 1/2 the occultist's level). It can also be disarmed using Disable Device, with the same DC. Anything crossing the boundary of the circle from the outside, such as a weapon, spell effect, or special ability, immediately breaks the circle and frees the creature trapped inside."

[[entry]]
id = "ref/implement/abjuration"
anchor = "fast-circles"
print = "At 16th level, the occultist learns to draw magic circles very quickly. He can draw a magic circle as a full-round action, but any circle drawn in this way has a duration of 1 minute per occultist level (unless it's drawn in conjunction with the outside contact class feature, in which case it lasts for 10 minutes as normal). If he draws a binding circle in this way, its duration is 1 round per occultist level."

[[entry]]
id = "ref/implement/abjuration"
anchor = "implement-mastery"
print = "At 20th level, an occultist learns to master one of his implements. He selects one implement school. Whenever he uses a focus power from an implement of that school, the DC to resist any of the effects increases by 4 and he treats his occultist level as 4 higher when determining the effects and duration of that power. In addition, the occultist gains 4 extra points of mental focus, but these points must always be invested in implements of the mastered school. He can't save these points or expend them for any ability other than the focus powers of those implements. The hardness of each of the occultist's implements of the mastered school increases by an additional 20 as long as the item has at least 1 point of mental focus stored within."

[[entry]]
id = "ref/implement/abjuration"
anchor = "implement-schools"
print = "Occultists can chose from the following implement schools, each representing a school of magic. An occultist can select an implement school more than once, as noted in the implements class feature."

[[entry]]
id = "ref/implement/abjuration"
anchor = "abjuration-implements"
print = "Abjuration implements are objects associated with protection and wards."

[[entry]]
id = "ref/implement/abjuration"
anchor = "implements"
print = "Amulet, armor, bell, bracers, brooch, cloak, holy symbol, shield."

[[entry]]
id = "ref/implement/abjuration"
anchor = "resonant-power"
print = "Each time the occultist invests mental focus into an abjuration implement, the implement grants the following resonant power. The implement's bearer gains the benefits of this power until the occultist refreshes his focus."

[[entry]]
id = "ref/implement/abjuration"
anchor = "warding-talisman"
print = "The implement wards against adverse effects. Whoever wears (or holds, for bells) the implement gains a +1 resistance bonus on saving throws for every 2 points of mental focus invested in the implement, to a maximum bonus of 1 + 1 for every 4 occultist levels you possess."

[[entry]]
id = "ref/implement/abjuration"
anchor = "base-focus-power"
print = "All occultists who learn to use abjuration implements gain the following focus power."

[[entry]]
id = "ref/implement/abjuration"
anchor = "mind-barrier"
print = "As a swift action, you can expend 1 point of mental focus to create a shield of mental energy around you that protects you from harm. The shield prevents a total of 2 points of damage per occultist level you possess. It lasts until the start of your next turn or until exhausted. For example, if you are 5th level, the mind barrier protects you from 10 points of damage; if you are hit by an attack that would deal 12 points of damage, the mind barrier is exhausted and you take 2 points of damage. You can activate this ability as an immediate action, but doing so costs 2 points of mental focus instead of 1."

[[entry]]
id = "ref/implement/abjuration"
anchor = "focus-powers"
print = "In addition to gaining the base focus power, occultists who learn to use abjuration implements can select from the following focus powers when choosing the powers gained from their focus powers class feature."

[[entry]]
id = "ref/implement/abjuration"
anchor = "aegis"
print = "As a standard action, you can expend 1 point of mental focus and touch a suit of armor or a shield to grant it an enhancement bonus. The bonus is equal to 1 + 1 for every 6 occultist levels you possess (to a maximum bonus of +4 at 18th level). Enhancement bonuses gained via this ability stack with those of the armor or shield, to a maximum total enhancement bonus of +5. You can also imbue the armor or shield with any one armor or shield special ability that has an equivalent enhancement bonus less than or equal to your maximum bonus granted by this ability by reducing the granted enhancement bonus by the appropriate amount. The item must have an enhancement bonus of at least +1 (from the item itself or from aegis) to gain an armor or shield special ability. In either case, these bonuses last for 1 minute."

[[entry]]
id = "ref/implement/abjuration"
anchor = "energy-shield"
print = '''
As a swift action, you can expend 1 point of mental focus to surround yourself with a shield that protects you from energy damage. Whenever you take acid, cold, electricity, or fire damage, the shield absorbs the damage (as _[protection from energy](ref/spell/protection-from-energy)_). The energy shield can absorb up to 5 points of energy damage per occultist level you possess. This shield lasts for 1 minute or until its power is exhausted. Its effect doesn't stack with itself, with _[protection from energy](ref/spell/protection-from-energy)_, or with _[resist energy](ref/spell/resist-energy)_.

You can activate the energy shield as an immediate action by expending 2 points of mental focus instead of 1. You must be at least 3rd level to select this focus power.'''

[[entry]]
id = "ref/implement/abjuration"
anchor = "globe-of-negation"
print = "As a standard action, you can expend 3 points of mental focus to create a stationary globe of negation. This globe is 10 feet in diameter and cancels any spell effect that is cast into or through its area. This functions as _[globe of invulnerability](ref/spell/globe-of-invulnerability)_, but it affects spells of any level. The globe can negate a total number of spell levels equal to your occultist level, after which the globe collapses. Spells that exceed the number of remaining levels remove all remaining levels, but are weakened; any creatures targeted by such spells receive a +4 circumstance bonus on any saving throws against the spells' effects. The globe lasts for a number of rounds equal to your occultist level. It has no effect on spells originating within the globe—only on those that enter its area as or after they are cast. You must be at least 11th level to select this focus power."

[[entry]]
id = "ref/implement/abjuration"
anchor = "loci-sentry"
print = "As a standard action, you can expend 1 point of mental focus to set a ward about an area. This area has a maximum radius of 10 feet + 5 feet per occultist level you possess. Whenever a creature enters the area, a sentry manifested by your psyche appears and strikes out at the intruder. The affected creature must succeed at a Will save or be [dazed](ref/misc/dazed) for 1 round. You are immediately aware of the sentry's activation. The sentry lasts for up to 1 hour per occultist level you possess, or until triggered. When you set the sentry, you can set any number of specific creatures to be immune to the sentry and thus avoid triggering it."

[[entry]]
id = "ref/implement/abjuration"
anchor = "planar-ward"
print = "As a standard action, you can expend 2 points of mental focus to surround yourself with a planar ward. Creatures not native to the plane that you are currently on take a -4 penalty on attacks against you, and you receive a +4 circumstance bonus on saving throws against the spells, [spell-like abilities](ref/umr/spell-like-abilities), and supernatural abilities of such creatures. This ward lasts for 1 minute."

[[entry]]
id = "ref/implement/abjuration"
anchor = "unraveling"
print = "As a standard action, you can expend 1 point of mental focus to unravel a magical effect. This functions as a targeted _[dispel magic](ref/spell/dispel-magic)_ spell, but you must be adjacent to the effect to unravel it. If the effect is created by psychic magic, you receive a +5 bonus on your caster level check to unravel it. If the effect targets an object in your possession, you automatically succeed at the check. You must be at least 5th level to select this focus power."

[[entry]]
id = "ref/implement/abjuration"
anchor = "conjuration-implements"
print = "Implements used in conjuration allow the occultist to perform magic that transports or calls creatures."

[[entry]]
id = "ref/implement/abjuration"
anchor = "implements"
print = "Bowl, brazier, compass, figurine, lantern, mirror."

[[entry]]
id = "ref/implement/abjuration"
anchor = "resonant-powers"
print = "Each time the occultist invests mental focus into a conjuration implement, the implement grants the following resonant power. The implement's bearer gains the benefits of this power until the occultist refreshes his focus."

[[entry]]
id = "ref/implement/abjuration"
anchor = "casting-focus"
print = "The implement empowers the bearer's ties to the worlds beyond, allowing his spells to maintain their power for a longer period of time. The bearer can add the implement as an additional focus component to any conjuration spell he casts that has a duration measured in rounds per level. If he does so, he adds 1 to his caster level for every 2 points of mental focus stored in the implement (to a maximum bonus equal to your occultist level). This increase applies only when determining the duration of the spell. Apply this increase after other effects that adjust a spell's duration, such as Extend Spell."

[[entry]]
id = "ref/implement/abjuration"
anchor = "base-focus-power"
print = "All occultists who learn to use conjuration implements gain the following focus power."

[[entry]]
id = "ref/implement/abjuration"
anchor = "servitor"
print = "As a standard action, you can expend 1 point of mental focus to summon a servitor. This ability functions as _summon monster I_, but you can use it only to summon a single creature, and the effect lasts for 1 minute. At 4th level and every 3 levels thereafter, the level of the _summon monster_ spell increases by 1, to a maximum of _summon monster VII_ at 19th level. You can't have more than one servitor in effect at a time. At any time, you can expend 1 point of mental focus as a free action to extend the duration of an active servitor by 1 minute."

[[entry]]
id = "ref/implement/abjuration"
anchor = "focus-powers"
print = "In addition to gaining the base focus power, occultists who learn to use conjuration implements can select from the following focus powers when choosing the powers gained from their focus powers class feature."

[[entry]]
id = "ref/implement/abjuration"
anchor = "conjure-implement"
print = "You can expend 1 point of mental focus to conjure any item that qualifies as an implement that you know how to use. This implement can be used as the item in question, functioning as a masterwork version of that item, and can also be used to cast your psychic spells, even though you did not select it at the beginning of the day. If you have more than one implement for the same school, decide which set of spells the conjured implement will grant when you first conjure it. The implement can't be used to store mental focus or create any effects that require mental focus. The implement lasts for 10 minutes per occultist level you possess."

[[entry]]
id = "ref/implement/abjuration"
anchor = "flesh-mend"
print = "As a standard action, you can expend 1 point of mental focus to heal a living creature with a touch. The creature is healed an amount of damage equal to 1d8 + your occultist level. For every 4 occultist levels you possess beyond 3rd, the creature is healed an additional 1d8 points of damage, to a maximum of 5d8+19 at 19th level. This has no effect on undead creatures. You must be at least 3rd level to select this focus power."

[[entry]]
id = "ref/implement/abjuration"
anchor = "mind-steed"
print = "As a standard action, you can expend 1 point of mental focus to conjure a spectral horse. This horse can be either Medium or Large, but it otherwise functions as _mount_. The horse lasts for 10 minutes per occultist level you possess. If you are at least 5th level, the mount's base land speed increases by 20 feet. If you are at least 9th level and you expend 1 additional point of mental focus, the mount can fly at a speed of 60 feet with good maneuverability, but doing so reduces the mount's duration to 1 minute per occultist level you possess."

[[entry]]
id = "ref/implement/abjuration"
anchor = "psychic-fog"
print = "As a standard action, you can expend 1 point of mental focus to create a cloud of fog. This fog lasts for 1 minute per occultist level you possess. It functions as _fog cloud_, except it can't be dispersed by wind. At 7th level, you can expend 1 additional point of mental focus when creating this fog, causing it to become more tangible and function as _solid fog_, except it doesn't slow down any creature that has psychic powers or that can cast psychic spells. When you create a solid fog in this way, its duration is reduced to 1 round per occultist level you possess. You must be at least 3rd level to select this focus power."

[[entry]]
id = "ref/implement/abjuration"
anchor = "purge-corruption"
print = "As a standard action, you can expend 1 point of mental focus to draw out the corruption from a creature. You must touch the target with your implement to use this power. This ability functions as either _neutralize poison_ or _remove disease_, using your occultist level as the caster level. Each use of this ability can cure only one poison or one disease. You must be at least 5th level to select this focus power."

[[entry]]
id = "ref/implement/abjuration"
anchor = "side-step"
print = "You can create a temporary fissure in space by expending 1 point of mental focus. You can use this ability as part of a move action taken to move. The fissure begins in any square you designate and allows you to teleport to any other square you can see within 10 feet per occultist level. Stepping between these locations requires you to expend 5 feet of movement, and the movement through the rift does not provoke attacks of opportunity. This otherwise functions as _teleport_. You must be at least 7th level to select this focus power."

[[entry]]
id = "ref/implement/abjuration"
anchor = "divination-implements"
print = "Implements of the divination school grant powers related to foresight and remote viewing."

[[entry]]
id = "ref/implement/abjuration"
anchor = "implements"
print = "Book, crystal ball, goggles, harrow deck, headband, lenses, planchette."

[[entry]]
id = "ref/implement/abjuration"
anchor = "resonant-powers"
print = "Each time the occultist invests mental focus into a divination implement, the implement grants the following resonant power. The implement's bearer gains the benefits of this power until the occultist refreshes his focus."

[[entry]]
id = "ref/implement/abjuration"
anchor = "third-eye"
print = "The implement allows its bearer to notice that which can't easily be seen. The implement grants a +1 insight bonus on Perception checks per 2 points of mental focus stored in it, to a maximum bonus equal to the occultist's level. If the occultist is 3rd level or higher and stores at least 3 points of mental focus in it, the implement also grants low-light vision. If the occultist is 5th level or higher and stores at least 6 points of mental focus in it, the implement also grants darkvision 60 feet. (If the bearer already has darkvision, the implement increases the range of the darkvision by 30 feet.) If the occultist is 7th level or higher and stores at least 9 points of mental focus in it, the implement also grants the effects of _see invisibility_. If the occultist is 13th level or higher and stores at least 12 points of mental focus in it, the implement also grants blindsense 60 feet. If the occultist is 19th level or higher and stores at least 15 points of mental focus in it, the implement also grants blindsight 30 feet."

[[entry]]
id = "ref/implement/abjuration"
anchor = "base-focus-power"
print = "All occultists who learn to use divination implements gain the following focus power."

[[entry]]
id = "ref/implement/abjuration"
anchor = "sudden-insight"
print = "As a swift action, you can expend 1 point of mental focus to gain an insight into your immediate future. You can use this foreknowledge as a free action before you roll any ability check, attack roll, or skill check to gain an insight bonus on that roll equal to 1/2 your occultist level (minimum +1). You can use your foreknowledge only once per turn, and if it's not used by the end of your turn, the insight fades and you gain no benefit."

[[entry]]
id = "ref/implement/abjuration"
anchor = "focus-powers"
print = "In addition to gaining the base focus power, occultists who learn to use divination implements can select from the following focus powers when choosing the powers gained from their focus powers class feature."

[[entry]]
id = "ref/implement/abjuration"
anchor = "danger-sight"
print = "As an immediate action, you can protect yourself from harm by expending 1 point of mental focus. You can use this ability whenever you are the target of an attack or are required to attempt a saving throw against a special ability, spell, or trap. Doing so grants you an insight bonus to your AC or on your saving throw equal to 1/2 your occultist level. This bonus applies only to the next attack against you or saving throw you attempt, and if not applied by the end of the round, the protection fades and you gain no benefit. You must be at least 3rd level to select this focus power."

[[entry]]
id = "ref/implement/abjuration"
anchor = "future-gaze"
print = "As a standard action, you can gain an insight into the future by expending 1 point of mental focus. This functions as _augury_, using your occultist level as the caster level."

[[entry]]
id = "ref/implement/abjuration"
anchor = "mind-eye"
print = "As a standard action, you can expend 1 point of mental focus to create a mind eye—a magical sensor through which you can see and hear. The mind eye is invisible and its size is Fine, giving it an AC of 18. Any amount of damage to the eye destroys it, but it can be harmed by only spells or magic weapons. The eye moves with a fly speed of 60 feet with perfect maneuverability and can travel up to 1 mile away from you. You must concentrate as a standard action to direct the eye and receive sensory images through it. The mind eye sees as your eyes see, including any additional senses you possess (such as darkvision or _see invisibility_). The mind eye lasts for 1 minute per occultist level you possess. You must be at least 5th level to select this focus power."

[[entry]]
id = "ref/implement/abjuration"
anchor = "object-seer"
print = "As a full-round action, you can expend 1 point of mental focus to gain insight into an object in your possession. You can ask one question, but that question must be tied in some way to the object, such as the nature of its power, the identity of the creature that last possessed it, or even where the object was when a certain event took place. You always receive an answer from the psychic impressions imprinted upon the item, but they are sometimes cryptic or misleading. This ability otherwise functions as _commune_. You must be at least 7th level to select this focus power."

[[entry]]
id = "ref/implement/abjuration"
anchor = "powerful-connection"
print = "When casting a divination spell (such as _scrying_) that imposes a penalty on saving throws based on the physical connection you have to the target, you can expend 1 point of mental focus to double the penalty from a possession, garment, or body part. In addition, when casting any other divination spell that allows a saving throw, you can increase the DC of that save by 2 by adding an object, garment, or body part that belonged to the target as a focus component for the spell and expending 1 point of mental focus."

[[entry]]
id = "ref/implement/abjuration"
anchor = "watchful-eye"
print = "You can expend 1 point of mental focus as a standard action to create an invisible sensor within 30 feet that watches a 5-foot-square area. Whenever any creature enters that square, you receive a mental image of the creature as long as you are on the same plane as the sensor. The sensor remains active for 10 minutes per occultist level you possess. The image will not wake you from slumber, although you do receive all of the images the sensor collected once you wake up. The sensor can be deceived by _invisibility_ and similar magic. You can expend additional points of mental focus when creating the eye to increase the size of the square by 5 feet per additional point spent (to 10 feet square, 15 feet square, and so on)."

[[entry]]
id = "ref/implement/abjuration"
anchor = "enchantment-implements"
print = "Enchantment implements allow the occultist to befuddle the mind and charm his foes."

[[entry]]
id = "ref/implement/abjuration"
anchor = "implements"
print = "Censer, crown, helm, musical instrument, necklace."

[[entry]]
id = "ref/implement/abjuration"
anchor = "resonant-powers"
print = "Each time the occultist invests mental focus into an enchantment implement, the implement grants the following resonant power. The implement's bearer gains the benefits of this power until the occultist refreshes his focus."

[[entry]]
id = "ref/implement/abjuration"
anchor = "glorious-presence"
print = "The implement invokes the presence of those who have worn it in the past. The implement's wearer gains a +1 competence bonus on all Charisma-based skill checks and ability checks for every 2 points of mental focus invested in the implement, to a maximum bonus of 1 + 1 for every 4 occultist levels you possess."

[[entry]]
id = "ref/implement/abjuration"
anchor = "base-focus-power"
print = "All occultists who learn to use enchantment implements gain the following focus power."

[[entry]]
id = "ref/implement/abjuration"
anchor = "cloud-mind"
print = "As a standard action, you can expend 1 point of mental focus to cloud the mind of one foe within 30 feet. That foe is dazed for 1 round if the number of Hit Dice it possesses is less than or equal to or your occultist level. If it has more Hit Dice than your occultist level, it is staggered for 1 round instead. The foe can attempt a Will saving throw to negate the effect. Whether or not it succeeds at the save, the target is then immune to this effect for 1 day. This is a mind-affecting effect."

[[entry]]
id = "ref/implement/abjuration"
anchor = "focus-powers"
print = "In addition to gaining the base focus power, occultists who learn to use enchantment implements can select from the following focus powers when choosing the powers gained from their focus powers class feature."

[[entry]]
id = "ref/implement/abjuration"
anchor = "binding-pattern"
print = "As a standard action, you can expend 1 point of mental focus to create a binding pattern of psychic energy that causes a living creature to become paralyzed. The target must be within 30 feet of you, and it can attempt a Will saving throw to negate the effect. If it fails the save, it is paralyzed for 1 round for every 2 occultist levels you possess. At the end of each of its turns, it can attempt another Will save to end the paralyzed effect and instead be staggered for the remaining duration. This is a mind-affecting compulsion effect. You must be at least 7th level to select this focus power."

[[entry]]
id = "ref/implement/abjuration"
anchor = "forced-alliance"
print = '''
As a standard action, you can alter a living creature's mind, causing it to see you as a friend and ally. If the creature is the same creature type as you, this power requires you to expend 1 point of mental focus; if it's is not, you must expend 2 points instead. The creature can attempt a Will save to negate this effect. If it fails the saving throw, the creature treats you as an ally and doesn't attempt to harm you (although your allies are not protected). You can call on the creature to aid you directly, but while doing so the creature can attempt a new Will save at the end of each round to end the effect. This effect otherwise lasts 1 round per occultist level you possess.

This is a mind-affecting charm effect.

You must be at least 5th level to select this focus power.'''

[[entry]]
id = "ref/implement/abjuration"
anchor = "inspired-assault"
print = "As a standard action, you can inspire a living creature with a touch by expending 1 point of mental focus. The creature receives a morale bonus on attack rolls equal to 1 + 1 for every 6 occultist levels you possess (to a maximum bonus of +4 at 18th level). This bonus also applies on saving throws against fear effects. This bonus lasts for 1 minute."

[[entry]]
id = "ref/implement/abjuration"
anchor = "mental-discord"
print = "As a standard action, you can expend 1 point of mental focus to disrupt the mind of one living creature within 30 feet. The creature can attempt a Will saving throw to negate the effect. If it fails the save, the creature can't concentrate on any spell effects and must succeed at a concentration check to cast any spell (DC = 15 + double the spell level). The affected creature takes a -4 penalty on this check if the spell includes a thought component. The creature takes a -2 penalty on all Will saving throws while under this effect. This effect lasts for 1 round per occultist level you possess."

[[entry]]
id = "ref/implement/abjuration"
anchor = "mind-slumber"
print = "By expending 1 point of mental focus as a standard action, you can lull a living creature into a deep mental slumber, forcing it to view the world as a dream. The target must be within 30 feet of you, and it can attempt a Will saving throw to negate the effect. If it fails the save, the creature falls asleep, although it still perceives the world around it as a dream. This doesn't cause the creature to fall prone, but it does drop whatever it is holding. The creature can't take any actions while in this state, but it isn't helpless—it perceives danger as part of its dream. The creature remains asleep for a number of rounds equal to your occultist level or until it takes any amount of damage, which immediately wakes it. At the end of each of its turns, it receives another"

[[entry]]
id = "ref/implement/conjuration"
anchor = "implement-mastery"
print = "At 20th level, an occultist learns to master one of his implements. He selects one implement school. Whenever he uses a focus power from an implement of that school, the DC to resist any of the effects increases by 4 and he treats his occultist level as 4 higher when determining the effects and duration of that power. In addition, the occultist gains 4 extra points of mental focus, but these points must always be invested in implements of the mastered school. He can't save these points or expend them for any ability other than the focus powers of those implements. The hardness of each of the occultist's implements of the mastered school increases by an additional 20 as long as the item has at least 1 point of mental focus stored within."

[[entry]]
id = "ref/implement/conjuration"
anchor = "implement-schools"
print = "Occultists can chose from the following implement schools, each representing a school of magic. An occultist can select an implement school more than once, as noted in the implements class feature."

[[entry]]
id = "ref/implement/conjuration"
anchor = "abjuration-implements"
print = "Abjuration implements are objects associated with protection and wards."

[[entry]]
id = "ref/implement/conjuration"
anchor = "implements"
print = "Amulet, armor, bell, bracers, brooch, cloak, holy symbol, shield."

[[entry]]
id = "ref/implement/conjuration"
anchor = "resonant-power"
print = "Each time the occultist invests mental focus into an abjuration implement, the implement grants the following resonant power. The implement's bearer gains the benefits of this power until the occultist refreshes his focus."

[[entry]]
id = "ref/implement/conjuration"
anchor = "warding-talisman"
print = "The implement wards against adverse effects. Whoever wears (or holds, for bells) the implement gains a +1 resistance bonus on saving throws for every 2 points of mental focus invested in the implement, to a maximum bonus of 1 + 1 for every 4 occultist levels you possess."

[[entry]]
id = "ref/implement/conjuration"
anchor = "base-focus-power"
print = "All occultists who learn to use abjuration implements gain the following focus power."

[[entry]]
id = "ref/implement/conjuration"
anchor = "mind-barrier"
print = "As a swift action, you can expend 1 point of mental focus to create a shield of mental energy around you that protects you from harm. The shield prevents a total of 2 points of damage per occultist level you possess. It lasts until the start of your next turn or until exhausted. For example, if you are 5th level, the mind barrier protects you from 10 points of damage; if you are hit by an attack that would deal 12 points of damage, the mind barrier is exhausted and you take 2 points of damage. You can activate this ability as an immediate action, but doing so costs 2 points of mental focus instead of 1."

[[entry]]
id = "ref/implement/conjuration"
anchor = "focus-powers"
print = "In addition to gaining the base focus power, occultists who learn to use abjuration implements can select from the following focus powers when choosing the powers gained from their focus powers class feature."

[[entry]]
id = "ref/implement/conjuration"
anchor = "aegis"
print = "As a standard action, you can expend 1 point of mental focus and touch a suit of armor or a shield to grant it an enhancement bonus. The bonus is equal to 1 + 1 for every 6 occultist levels you possess (to a maximum bonus of +4 at 18th level). Enhancement bonuses gained via this ability stack with those of the armor or shield, to a maximum total enhancement bonus of +5. You can also imbue the armor or shield with any one armor or shield special ability that has an equivalent enhancement bonus less than or equal to your maximum bonus granted by this ability by reducing the granted enhancement bonus by the appropriate amount. The item must have an enhancement bonus of at least +1 (from the item itself or from aegis) to gain an armor or shield special ability. In either case, these bonuses last for 1 minute."

[[entry]]
id = "ref/implement/conjuration"
anchor = "energy-shield"
print = '''
As a swift action, you can expend 1 point of mental focus to surround yourself with a shield that protects you from energy damage. Whenever you take acid, cold, electricity, or fire damage, the shield absorbs the damage (as _protection from energy_). The energy shield can absorb up to 5 points of energy damage per occultist level you possess. This shield lasts for 1 minute or until its power is exhausted. Its effect doesn't stack with itself, with _protection from energy_, or with _resist energy_.

You can activate the energy shield as an immediate action by expending 2 points of mental focus instead of 1. You must be at least 3rd level to select this focus power.'''

[[entry]]
id = "ref/implement/conjuration"
anchor = "globe-of-negation"
print = "As a standard action, you can expend 3 points of mental focus to create a stationary globe of negation. This globe is 10 feet in diameter and cancels any spell effect that is cast into or through its area. This functions as _globe of invulnerability_, but it affects spells of any level. The globe can negate a total number of spell levels equal to your occultist level, after which the globe collapses. Spells that exceed the number of remaining levels remove all remaining levels, but are weakened; any creatures targeted by such spells receive a +4 circumstance bonus on any saving throws against the spells' effects. The globe lasts for a number of rounds equal to your occultist level. It has no effect on spells originating within the globe—only on those that enter its area as or after they are cast. You must be at least 11th level to select this focus power."

[[entry]]
id = "ref/implement/conjuration"
anchor = "loci-sentry"
print = "As a standard action, you can expend 1 point of mental focus to set a ward about an area. This area has a maximum radius of 10 feet + 5 feet per occultist level you possess. Whenever a creature enters the area, a sentry manifested by your psyche appears and strikes out at the intruder. The affected creature must succeed at a Will save or be dazed for 1 round. You are immediately aware of the sentry's activation. The sentry lasts for up to 1 hour per occultist level you possess, or until triggered. When you set the sentry, you can set any number of specific creatures to be immune to the sentry and thus avoid triggering it."

[[entry]]
id = "ref/implement/conjuration"
anchor = "planar-ward"
print = "As a standard action, you can expend 2 points of mental focus to surround yourself with a planar ward. Creatures not native to the plane that you are currently on take a -4 penalty on attacks against you, and you receive a +4 circumstance bonus on saving throws against the spells, spell-like abilities, and supernatural abilities of such creatures. This ward lasts for 1 minute."

[[entry]]
id = "ref/implement/conjuration"
anchor = "unraveling"
print = "As a standard action, you can expend 1 point of mental focus to unravel a magical effect. This functions as a targeted _dispel magic_ spell, but you must be adjacent to the effect to unravel it. If the effect is created by psychic magic, you receive a +5 bonus on your caster level check to unravel it. If the effect targets an object in your possession, you automatically succeed at the check. You must be at least 5th level to select this focus power."

[[entry]]
id = "ref/implement/conjuration"
anchor = "conjuration-implements"
print = "Implements used in conjuration allow the occultist to perform magic that transports or calls creatures."

[[entry]]
id = "ref/implement/conjuration"
anchor = "implements"
print = "Bowl, brazier, compass, figurine, lantern, mirror."

[[entry]]
id = "ref/implement/conjuration"
anchor = "resonant-powers"
print = "Each time the occultist invests mental focus into a conjuration implement, the implement grants the following resonant power. The implement's bearer gains the benefits of this power until the occultist refreshes his focus."

[[entry]]
id = "ref/implement/conjuration"
anchor = "casting-focus"
print = "The implement empowers the bearer's ties to the worlds beyond, allowing his spells to maintain their power for a longer period of time. The bearer can add the implement as an additional focus component to any conjuration spell he casts that has a duration measured in rounds per level. If he does so, he adds 1 to his caster level for every 2 points of mental focus stored in the implement (to a maximum bonus equal to your occultist level). This increase applies only when determining the duration of the spell. Apply this increase after other effects that adjust a spell's duration, such as [Extend Spell](ref/feat/extend-spell)."

[[entry]]
id = "ref/implement/conjuration"
anchor = "base-focus-power"
print = "All occultists who learn to use conjuration implements gain the following focus power."

[[entry]]
id = "ref/implement/conjuration"
anchor = "servitor"
print = "As a standard action, you can expend 1 point of mental focus to summon a servitor. This ability functions as _[summon monster I](ref/spell/summon-monster-1)_, but you can use it only to summon a single creature, and the effect lasts for 1 minute. At 4th level and every 3 levels thereafter, the level of the _summon monster_ spell increases by 1, to a maximum of _[summon monster VII](ref/spell/summon-monster-7)_ at 19th level. You can't have more than one servitor in effect at a time. At any time, you can expend 1 point of mental focus as a free action to extend the duration of an active servitor by 1 minute."

[[entry]]
id = "ref/implement/conjuration"
anchor = "focus-powers"
print = "In addition to gaining the base focus power, occultists who learn to use conjuration implements can select from the following focus powers when choosing the powers gained from their focus powers class feature."

[[entry]]
id = "ref/implement/conjuration"
anchor = "conjure-implement"
print = "You can expend 1 point of mental focus to conjure any item that qualifies as an implement that you know how to use. This implement can be used as the item in question, functioning as a masterwork version of that item, and can also be used to cast your psychic spells, even though you did not select it at the beginning of the day. If you have more than one implement for the same school, decide which set of spells the conjured implement will grant when you first conjure it. The implement can't be used to store mental focus or create any effects that require mental focus. The implement lasts for 10 minutes per occultist level you possess."

[[entry]]
id = "ref/implement/conjuration"
anchor = "flesh-mend"
print = "As a standard action, you can expend 1 point of mental focus to heal a living creature with a touch. The creature is healed an amount of damage equal to 1d8 + your occultist level. For every 4 occultist levels you possess beyond 3rd, the creature is healed an additional 1d8 points of damage, to a maximum of 5d8+19 at 19th level. This has no effect on undead creatures. You must be at least 3rd level to select this focus power."

[[entry]]
id = "ref/implement/conjuration"
anchor = "mind-steed"
print = "As a standard action, you can expend 1 point of mental focus to conjure a spectral horse. This horse can be either Medium or Large, but it otherwise functions as _[mount](ref/spell/mount)_. The horse lasts for 10 minutes per occultist level you possess. If you are at least 5th level, the mount's base land speed increases by 20 feet. If you are at least 9th level and you expend 1 additional point of mental focus, the mount can fly at a speed of 60 feet with good maneuverability, but doing so reduces the mount's duration to 1 minute per occultist level you possess."

