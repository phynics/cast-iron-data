[[entry]]
id = "ref/discovery/promethean-disciple"
anchor = "promethean-disciple"
print = "An alchemist with this discovery learns how to craft constructs by way of alchemical research rather than arcane magic. The alchemist gains [Craft Construct](ref/feat/craft-construct) as a bonus feat without needing to meet its requirements. The alchemist substitutes his number of ranks in [Craft](ref/skill/craft-any) (alchemy) for his total caster level and must use Craft (alchemy) to create the construct. The DC to create the construct still increases for any necessary spells that the alchemist does not have access to (_Pathfinder RPG Core Rulebook_ 549). However, the alchemist can use extracts in place of spells as spell prerequisites. An alchemist must be at least 6th level before selecting this discovery."

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "opening"
print = "of the phantom's emotional focus. Table 1–11 gives the damage by spiritualist level of the slam attacks made by a Medium phantom. See Table 1–12 for the damage of such attacks for Small and Large phantoms. Often, an individual phantom manifests in a form that makes it appear as if it had weapons or other natural attacks. Regardless of their apparent forms, the phantom's attacks still deal the slam attack damage listed on Table 1–11 or Table 1–12."

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "special"
print = "This column includes a number of abilities gained by all phantoms as they increase in power. Each of these bonuses is described below."

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "darkvision"
print = '''
The phantom has darkvision out to a range of 60 feet.

_Link (Su)_: A spiritualist and her phantom share a mental link that allows for communication across distances (as long as they are on the same plane). This communication is a free action that can be performed even when it isn't the spiritualist's turn, but the spiritualist and the phantom must both be conscious to communicate in this way. This allows the spiritualist to give orders to her phantom at any time. Magic items interfere with a spiritualist's connection to her phantom; as a result, the spiritualist and her phantom share magic item slots. For example, if the spiritualist is wearing a magic ring, her phantom can wear only one magic ring. In the case of a conf lict, the items worn by the spiritualist remain active, and those worn by the phantom become dormant. The phantom must possess the appropriate appendages to utilize a magic item.

_Share Spells (Su)_: The spiritualist can cast a spell with a target of "you" on her phantom (as a spell with a range of touch) instead of on herself. A spiritualist can cast spells from the spiritualist spell list on her phantom even if the spells normally do not affect creatures of the phantom's type (outsider). This ability does not allow the phantom to share abilities that aren't spells, even if they function like spells.

_Deliver Touch Spells (Su)_: The phantom can deliver touch spells for the spiritualist when fully manifested in incorporeal or ectoplasmic form. The spiritualist and the phantom need not be in contact to accomplish this, but the phantom must be within 30 feet and the spiritualist must be able to see the phantom. If the spiritualist is 12th level or higher, the phantom can deliver touch spells within 50 feet of the spiritualist. The spiritualist can cast the spell, and then the phantom can deliver the touch as an immediate action. If the touch spell deals damage, the phantom must make the attack roll. The phantom can't hold the charge of a touch spell cast by the spiritualist using this ability. If the spell is delivered to the phantom, it must touch a target or the spell is lost. If the spell allows you to touch up to six willing targets, the phantom can accomplish this with an immediate action, but all of the willing targets must be within the phantom's melee reach at the time.'''

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "magic-attacks"
print = '''
When the phantom manifests in ectoplasmic form, it treats its slam attacks as if they were magic for the purposes of overcoming damage reduction. If the spiritualist is 10th level or higher, all of the phantom's weapons are treated as the alignment of the phantom for the purpose of overcoming damage reduction.

_Ability Score Increase (Ex)_: The phantom adds 1 to one of its ability scores.'''

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "devotion"
print = '''
The phantom gains a +4 morale bonus on Will saves against enchantment spells and effects.

_Incorporeal Flight (Su)_: When the phantom manifests in incorporeal form, it has a fly speed of 40 feet (good).'''

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "phantom-statistics"
print = '''
A spiritualist's phantom is typically the same size as the spiritualist. A spiritualist can have a phantom that is one size category smaller than her, and if she is Small or smaller, she can have a phantom one size category larger than her. A phantom is always a humanoid-shaped creature, and looks somewhat like it did in its past life while manifested, though the emotional turmoil of its existence usually warps its appearance in some way.

Every phantom has the following base statistics, which are then modified by its size and emotional focus. Phantom Starting Statistics: Type Outsider (phantom); Size As spiritualist or one size category smaller (or one size category larger, if the spiritualist is Small or smaller); Speed 30 ft.; AC +2 dodge (in incorporeal form) or +2 natural armor (in ectoplasmic form); Attack 2 slams (1d6 or 1d4 if size Small); Ability Scores Str 12, Dex 14, Con 13, Int 7, Wis 10, Cha 13.'''

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "phantom-skills"
print = "The following skills are class skills for the phantom: Bluff (Cha), Craft (Int), Fly (Dex), Intimidate (Cha), Knowledge (planes) (Int), Perception (Wis), Sense Motive (Wis), and Stealth (Dex). In addition, at 1st level, the spiritualist can choose one additional skill as a class skill for her phantom. The phantom also gains two class skills based on its emotional focus. The phantom automatically gains bonus ranks in these two skills as the spiritualist increases in level—its number of ranks in these skills is always equal to its number of Hit Dice."

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "full-manifestation-forms"
print = "Each time she fully manifests her phantom, the spiritualist must choose whether to manifest the phantom in either ectoplasmic or incorporeal form. The phantom gains the statistics presented on Table 1–11: Manifested Phantom's Base Statistics, modified by the phantom's emotional focus and by the type of manifestation the spiritualist chooses."

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "ectoplasmic"
print = "When the spiritualist manifests her phantom in ectoplasmic form, the phantom gains the following abilities."

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "damage-reduction"
print = '''
A phantom manifested in ectoplasmic form has DR 5/slashing. When the spiritualist reaches 5th level, the phantom gains DR 5/magic. At 10th level, the damage resistance increases to 10/magic. At 15th level, it increases to 15/magic, and at 20th level, the damage reduction becomes DR 15/—.

_Phase Lurch (Su):_ A phantom in ectoplasmic form has the ability to pass through walls or material obstacles. In order to use this ability, it must begin and end its turn outside whatever wall or obstacle it's moving through. An ectoplasmic phantom can't move through corporeal creatures with this ability, and its movement speed is halved while moving through a wall or obstacle. Any surface it moves through is coated with a thin, silvery mucus that lingers for 1 minute.'''

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "incorporeal"
print = "When the spiritualist chooses to manifest the phantom in incorporeal form, the phantom appears within 30 feet of the spiritualist as a ghostly apparition. It gains the incorporeal subtype (_Pathfinder RPG Bestiary_ 301), including a deflection bonus to AC equal to its Charisma modifier. Since it isn't an undead creature, it takes no damage from holy water or positive energy. Unlike other incorporeal creatures, an incorporeal phantom can't attack corporeal creatures, except to deliver touch-attack spells using the deliver touch spell ability. An incorporeal manifested phantom can make slam attacks against other incorporeal creatures as if it were in ectoplasmic form."

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "emotional-focus"
print = '''
Each phantom has an emotional focus—a powerful emotion based on some experience in life that keeps it tethered to the Material and Ethereal planes. This emotional focus also grants the phantom abilities that it can use while manifested. The type of each ability and its power are determined by the spiritualist's level.

The emotional focus determines which bonus skill ranks the phantom gains, as well as the skills in which its spiritualist master gains Skill Focus. It also determines the good saving throws of the manifested phantom and the special abilities the phantom gains as it increases in level.

While phantoms tend to appear much as they did in life—at least as they did at the time of death —each emotional focus twists a phantom's visage, mannerisms, and even personality in its own way. Unlike with most creatures, a phantom's emotion aura often manifests for all to see, even those without the benefit of spells or abilities. Often phantoms manifest these emotion auras in unique ways, some of which are described in individual emotional focus descriptions. Anger Phantoms with this emotional focus are filled with seething anger from events in their past lives. Phantoms with this focus often take the form of hulking brutes with furrowed brows or of frenzied creatures that always seem ready to strike down those who come too near. Many times, these phantoms exude a bright red aura, especially when they are engaged in combat, or they seem to breathe a red mist in shallow pants from behind clenched, phantasmal teeth.'''

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "skills"
print = "The phantom gains a number of ranks in [Intimidate](ref/skill/intimidate) and [Survival](ref/skill/survival) equal to its number of Hit Dice. While confined in the spiritualist's consciousness, the phantom grants the spiritualist [Skill Focus](ref/feat/skill-focus) in each of these skills."

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "good-saves"
print = "Fortitude and Will."

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "strength-focus"
print = "The phantom gains a +2 bonus to Strength and a -2 penalty to Dexterity. Instead of the phantom gaining a bonus to Dexterity as the spiritualist gains levels, an anger-focused phantom gains a bonus to Strength instead."

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "powerful-strike"
print = "A phantom with this focus deals more damage with its slam attacks. It deals slam damage as a creature [one size category](ref/misc/damage-die-adjustments) larger than its current size. The phantom also gains [Power Attack](ref/feat/power-attack) as a bonus feat."

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "aura-of-fury"
print = "When the spiritualist reaches 7th level, as a swift action, the phantom can emit a 20-foot-radius aura of fury. Creatures within the aura gain a +2 bonus on melee attack rolls but take a -2 penalty to AC. Ending the aura is a free action. The phantom can use this ability in either ectoplasmic or incorporeal form."

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "ferocious-mien"
print = "When the spiritualist reaches 12th level, once per day as a swift action, a phantom in ectoplasmic form can grow more ferocious and frightening. It becomes one size category larger than its current size, as affected by an _[enlarge person](ref/spell/enlarge-person)_ spell, and grows fiercer in combat, as if affected by a _[rage](ref/spell/rage)_ spell. This effect lasts for 1 round per class level of the spiritualist. When the spiritualist reaches 18th level, a phantom using ferocious mien also gains the [frightful presence](ref/umr/frightful-presence) extraordinary ability (_Bestiary_ 300; range 30 feet, duration 5d6 rounds)."

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "furious-wail"
print = "When the spiritualist reaches 17th level, once per day as a standard action, the phantom can emit a single angry wail that acts as _[wail of the banshee](ref/spell/wail-of-the-banshee)_. The phantom uses its Hit Dice as its caster level for the effect, and the DC of the effect is 10 + 1/2 the phantom's Hit Dice + the phantom's Charisma modifier. The phantom can use this ability in either ectoplasmic or incorporeal form. Dedication Either through a sense of love or the desire to finish some unfinished task, a phantom with this emotional focus has an undying devotion to something or someone in the world. It's often the case that a phantom with this emotional focus has a strong familial tie with its spiritualist master. A dedication phantom most often appears as a strong and stern protector with a watchful gaze, and its service to its spiritualist is unwavering. These spirits exude auras of blue, or sometimes rose if their love for their spiritualist masters in life was great. Many times these auras manifest as a halo, giving these phantoms a divine appearance, no matter their actual alignment or opinions on matters of religion."

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "skill"
print = "The phantom gains a number of ranks in Diplomacy and Sense Motive equal to its number of Hit Dice. While confined in the spiritualist's consciousness, the phantom grants the spiritualist Skill Focus in each of these skills."

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "good-saves"
print = "Reflex and Will."

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "iron-will"
print = "The phantom gains Iron Will as a bonus feat. Furthermore, when the phantom is within its master's consciousness, it grants the benefits of Iron Will to its master if its master doesn't have that feat."

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "dutiful-strike"
print = "When a creature makes an attack against the phantom's master, the phantom gains a +2 bonus on attack rolls against that target, and deals damage against that target as if the phantom were one size category larger. For the purposes of this ability, an attack includes any harmful spell targeting the spiritualist master of whose area or effect includes the spiritualist master. Dutiful strike lasts for 1 minute, until another creature attacks the phantom's spiritualist master (at which point this effect transfers to the new attacker), or until the attacking creature is reduced to fewer than 0 hit points, whichever occurs first."

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "defending-aura"
print = "When the spiritualist reaches 7th level, the phantom can emit a 10-foot-radius aura that grants protection to nearby allies. It can activate this aura at will as a swift action. Allies within the aura gain a +2 deflection bonus to AC and a +2 bonus to CMD and on all saving throws. Deactivating the aura is a free action."

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "devoted-servant"
print = "When the spiritualist reaches 12th level and is caught unawares by an attack (such as an attack made in a surprise round or while the spiritualist is asleep or an attack by a creature using Stealth), if the phantom is not fully manifested, it automatically fully manifests from the spiritualist's consciousness to protect its master. The phantom stays manifested as long as the spiritualist is unaware and in danger. This ability requires no action from the spiritualist."

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "steadfast-devotion"
print = '''
When the spiritualist reaches 17th level, the phantom becomes immune to detrimental mind-affecting effects and all forms of possession, such as _magic jar_ and _possession_ (see page 181). Furthermore, the phantom is immune to _banishment_, _dismissal_, and similar effects.

Despair Some creatures die in such horrific ways, or live such pointless and senseless lives, that despair grips their very beings. Phantoms with this focus use misery as a weapon, inflicting the living with the gloom of the phantoms' continued existence. Despair phantoms often appear twisted or wounded, showing the grisly circumstances of their demise.

Their coloration tends to have a grayish or sickly green cast. When they speak, they do so in terrifying whispers or high-pitched screeches.'''

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "skills"
print = "The phantom gains a number of ranks in Intimidate and Stealth equal to its number of Hit Dice. While confined in the spiritualist's consciousness, the phantom grants the spiritualist Skill Focus in each of these skills."

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "good-saves"
print = "Fortitude and Will."

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "power-from-despair"
print = "The phantom gains a +2 bonus on attack and damage rolls against creatures that are shaken, frightened, panicked, cowering, or subject to effects such as aura of despair or _crushing despair_."

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "miserable-strike"
print = "If the phantom hits a creature with a slam attack, that creature must succeed at a Will saving throw (DC = 10 + 1/2 the phantom's Hit Dice + the phantom's Charisma modifier) or take a -2 penalty on attack and damage rolls for 1 round. This is a mind-affecting fear and emotion effect. Penalties from multiple hits don't stack with themselves."

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "aura-of-despair"
print = "When the spiritualist reaches 7th level, as a swift action, the phantom can emit a 10-foot aura of despair. Enemies within the aura take a -2 penalty on all saving throws. This is a fear effect. Deactivating the aura is a free action."

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "despairing-shout"
print = "When the spiritualist reaches 12th level, three times per day as a standard action, the phantom can emit a shout that acts as _crushing despair_. The phantom uses its Hit Dice as its caster level for the effect, and the DC of the effect equals 10 + 1/2 the phantom's Hit Dice + the phantom's Charisma modifier. The phantom can use this ability in either ectoplasmic or incorporeal form."

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "inescapable-despair"
print = "When the spiritualist reaches 17th level, if the phantom hits with its slam attack, the creature hit doesn't get a save to resist the effects of miserable strike. Fear A phantom with this emotional focus suffered from overwhelming fear in life. As a phantom, it is able to channel that fear into a terrifying weapon. Fear phantoms are often horrifying to behold. Sometimes they appear as ghostly figures in tattered funeral garb or wrapped in chains or other bindings. Their features may be distorted into gaunt and haunting forms, making them seem more like ghosts or spectres. A miasma of livid gray swirling motes often surrounds their forms as they stalk their surroundings, seeking to bestow their terror on others."

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "skills"
print = "The phantom gains a number of ranks in Intimidate and Stealth equal to its number of Hit Dice. While confined in the spiritualist's consciousness, such a phantom grants the spiritualist Skill Focus in each of these skills."

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "good-saves"
print = "Reflex and Will."

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "stealthy"
print = "The phantom gains Stealthy as a bonus feat."

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "horrifying-strike"
print = "If the phantom hits a creature with a slam attack, that creature must succeed at a Will saving throw (DC = 10 + 1/2 the phantom's Hit Dice + the phantom's Charisma modifier) or be shaken for 1d4 rounds. Multiple attacks against the same creature do not cause the creature to become frightened. This is a mind-affecting fear effect."

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "increase-fear"
print = "When the spiritualist reaches 7th level, as a swift action, the phantom can emit a 20-foot-radius aura that amplifies the fear conditions of enemies within it if they fail their Will saving throws (DC = 10 + 1/2 the phantom's Hit Dice + the phantom's Charisma modifier). A shaken enemy in the aura becomes frightened, a frightened creature becomes panicked, and a panicked creature cowers. This effect lasts either as long as the enemy stays within the aura and is under the condition of the initial fear effect, or for a number of rounds after it leaves the aura equal to 1/2 the phantom's Hit Dice, or until the end of the original fear effect's duration, whichever comes first. A creature that succeeds at the saving throw is immune to this effect from the same phantom for 24 hours. This is a mind-affecting fear effect. The phantom can use this ability in either ectoplasmic or incorporeal form."

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "frightful-attack"
print = "When the spiritualist reaches 12th level, if the phantom hits with a slam attack, it can frighten those it hits instead of causing them to be shaken (the phantom chooses when it makes the attack). This is a mind-affecting fear effect."

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "shelter-allies"
print = '''
When the spiritualist reaches 17th level, the phantom protects its allies from terror. Allies within the phantom's increase fear aura are immune to fear as long as they are within the aura. This ability also grants the phantom's spiritualist master immunity to fear as long as the phantom is not banished to the Ethereal Plane. Hatred Few things draw a spirit toward the Negative Material Plane like the emotion of hatred. Phantoms with this focus often are blinded by—and blind others with—this powerful emotion. These phantoms are frequently darker and more foreboding than all but those phantoms with the fear emotional focus. Many of them manifest as dark and dreadful knights, their armor bristling with spikes and their hands seeming to grasp barbed and terrible weapons. Other times they appear as tall, gaunt figures staring down arrogantly at those who approach.

These phantoms typically spew a string of curses at their foes, often profane, sometimes poetic. Their auras are pulsating and pitch black, and thrum violently when these horrible phantoms attack.'''

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "skills"
print = "The phantom gains a number of ranks in Acrobatics and Perception equal to its number of Hit Dice. While confined in the spiritualist's consciousness, the phantom grants the spiritualist Skill Focus in each of these skills."

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "good-saves"
print = "Fortitude and Reflex."

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "weapon-finesse"
print = "The phantom gains Weapon Finesse as a bonus feat."

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "hated-target"
print = "The phantom can take a move action to designate one creature within its line of sight as a hated target. The phantom gains a +2 bonus on attack rolls against its hated target, and a bonus on damage rolls equal to 1/2 the phantom's Hit Dice (minimum 1). The phantom is so focused on this hated target that it takes a -2 penalty on attack rolls against all other creatures. The phantom can maintain these bonuses against only one target at a time, and these bonuses remain in effect until either the hated opponent is dead or it has been out of the phantom's line of sight for at least 1 minute. When the spiritualist reaches 7th level, the phantom can use this ability as a swift action, and takes no penalty when attacking creatures that are not designated as its hated enemy. The phantom must be manifested in ectoplasmic form to use this ability (unless the spiritualist is 17th level or higher; see Shared Hatred below)."

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "hateful-aura"
print = "When the spiritualist reaches 7th level, as a swift action, the phantom can emit a 10-foot-radius aura that inf licts pain upon the minds of those who dare damage it or its master. Enemies within the aura that deal damage to the spiritualist or the phantom take an amount of damage equal to the phantom's Charisma bonus. This is a mind-affecting pain effect. The phantom can use this ability in either ectoplasmic or incorporeal form."

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "sneak-attack"
print = "When the spiritualist reaches 12th level, the phantom gains sneak attack +3d6, but only against its hated enemy. At 18th level, the sneak attack damage increases to +5d6."

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "shared-hatred"
print = "When the spiritualist reaches 17th level, the phantom can grant its hatred to others. When the phantom designates a hated enemy, its allies also gain a +2 bonus on attack rolls and a +4 bonus on damage rolls against that enemy. Furthermore, the phantom can use its hated target ability even when in incorporeal form; when it does, it can make slam attacks against a corporeal creature, but only if that corporeal creature is its hated target. Jealousy A phantom with this emotional focus is covetous of everything—its master, those who wish to do it harm, and any who do not pay attention to it. It demands to be the center of attention at all times. The forms these phantoms take are as diverse as the forms of jealousy in life. Often they take pleasing forms, wishing to draw others in. Other times they take the form of crawling and lurching things, grasping at all they covet when they come within reach. The auras of these needy phantoms quickly change in color, going from an oily green to orange, to brownish red as they swirl through emotions in their efforts to gain the objects of their dark desires."

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "skills"
print = "The phantom gains a number of ranks in Appraise and Bluff equal to its number of Hit Dice. While confined in the spiritualist's consciousness, the phantom grants the spiritualist Skill Focus in each of these skills."

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "good-saves"
print = "Reflex and Will."

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "deceitful"
print = "The phantom gains Deceitful as a bonus feat."

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "jealous-combatant"
print = "Each time the phantom hits a creature with a melee attack, for 1 round that creature takes a -2 penalty on all attack rolls made against anyone other than the phantom. This effect does not stack with itself."

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "resentful-aura"
print = "When the spiritualist reaches 7th level, as a swift action, the phantom can emit a 20-foot-radius aura that forces enemies within the aura who make an attack or cast a spell that does not include the phantom in its effect to succeed at a Will saving throw (DC = 10 + 1/2 the phantom's Hit Dice + the phantom's Charisma modifier) or become staggered until the end of the enemy's next turn. Ending the aura is a free action. The phantom can use this ability in either ectoplasmic or incorporeal form."

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "retribution"
print = "When the spiritualist reaches 12th level, each time a creature attacks the phantom's master, whether that attack hits or misses, it enrages the phantom. Until the end of the phantom's next turn, any attack the phantom makes that hits the creature that has attacked her deals 2d8 extra points of damage. This extra damage is precision damage."

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "mine-to-take"
print = "When the spiritualist reaches 17th level, once per day as an immediate action, just before the phantom's master is about to attempt a saving throw or be targeted by an attack roll, the phantom and the spiritualist can swap places as long as both are on the same plane and the phantom is aware of the attack or effect. After the swap occurs, the phantom is targeted by the attack or effect that triggered this ability, though the phantom may be immune or resistant to the effect. This is a teleportation effect. The phantom can use this ability in either ectoplasmic or incorporeal form. Zeal A phantom with this emotional focus fixates on every task given as if it were the phantom's last. The most basic commands are treated as life-and-death situations, and the truly dangerous ones are faced with a resolve and tenacity that sometimes defies common sense. Zeal phantoms take the form of steadfast protectors or daring and manic creatures looking for the next challenge or opportunity to prove itself to either its master or itself. Often very prideful creatures, these phantoms display an orange aura upon completing their tasks. They are prone to boast about their accomplishments and chastise those around them for not accomplishing more."

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "skills"
print = "The phantom gains a number of ranks in Acrobatics and Survival equal to its number of Hit Dice. While confined in the spiritualist's consciousness, the phantom grants the spiritualist Skill Focus in each of these skills."

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "good-saves"
print = "Fortitude and Reflex."

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "tracking"
print = "The phantom adds half its number of Hit Dice (minimum 1) to Survival skill checks to follow tracks."

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "ruthless-combatant"
print = "The phantom threatens a critical hit with its slam attacks on a roll of 19–20. When the spiritualist reaches 11th level, the phantom's critical modifier with slam attacks increases to ×3. This doesn't stack with Improved Critical or similar effects."

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "determination-aura"
print = "When the spiritualist reaches 7th level, as a swift action, the phantom can emit a 20-foot-radius aura that grants its zeal to nearby allies. Allies within the aura gain a +2 competence bonus on attack rolls and saving throws. The phantom can use this ability in either ectoplasmic or incorporeal form."

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "steadfast-servant"
print = "When the spiritualist reaches 12th level, the phantom can stay manifested even when its spiritualist master is unconscious or asleep."

[[entry]]
id = "ref/emotionalfocus/anger"
anchor = "zeal-s-resolve"
print = "When the spiritualist reaches 17th level, three times per day as a free action, when the phantom misses with an attack roll or fails a saving throw, it can reroll the failed attack or saving throw. It must take the new result, even if that result is worse."

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "opening"
print = "of the phantom's emotional focus. Table 1–11 gives the damage by spiritualist level of the slam attacks made by a Medium phantom. See Table 1–12 for the damage of such attacks for Small and Large phantoms. Often, an individual phantom manifests in a form that makes it appear as if it had weapons or other natural attacks. Regardless of their apparent forms, the phantom's attacks still deal the slam attack damage listed on Table 1–11 or Table 1–12."

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "special"
print = "This column includes a number of abilities gained by all phantoms as they increase in power. Each of these bonuses is described below."

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "darkvision"
print = '''
The phantom has darkvision out to a range of 60 feet.

_Link (Su)_: A spiritualist and her phantom share a mental link that allows for communication across distances (as long as they are on the same plane). This communication is a free action that can be performed even when it isn't the spiritualist's turn, but the spiritualist and the phantom must both be conscious to communicate in this way. This allows the spiritualist to give orders to her phantom at any time. Magic items interfere with a spiritualist's connection to her phantom; as a result, the spiritualist and her phantom share magic item slots. For example, if the spiritualist is wearing a magic ring, her phantom can wear only one magic ring. In the case of a conf lict, the items worn by the spiritualist remain active, and those worn by the phantom become dormant. The phantom must possess the appropriate appendages to utilize a magic item.

_Share Spells (Su)_: The spiritualist can cast a spell with a target of "you" on her phantom (as a spell with a range of touch) instead of on herself. A spiritualist can cast spells from the spiritualist spell list on her phantom even if the spells normally do not affect creatures of the phantom's type (outsider). This ability does not allow the phantom to share abilities that aren't spells, even if they function like spells.

_Deliver Touch Spells (Su)_: The phantom can deliver touch spells for the spiritualist when fully manifested in incorporeal or ectoplasmic form. The spiritualist and the phantom need not be in contact to accomplish this, but the phantom must be within 30 feet and the spiritualist must be able to see the phantom. If the spiritualist is 12th level or higher, the phantom can deliver touch spells within 50 feet of the spiritualist. The spiritualist can cast the spell, and then the phantom can deliver the touch as an immediate action. If the touch spell deals damage, the phantom must make the attack roll. The phantom can't hold the charge of a touch spell cast by the spiritualist using this ability. If the spell is delivered to the phantom, it must touch a target or the spell is lost. If the spell allows you to touch up to six willing targets, the phantom can accomplish this with an immediate action, but all of the willing targets must be within the phantom's melee reach at the time.'''

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "magic-attacks"
print = '''
When the phantom manifests in ectoplasmic form, it treats its slam attacks as if they were magic for the purposes of overcoming damage reduction. If the spiritualist is 10th level or higher, all of the phantom's weapons are treated as the alignment of the phantom for the purpose of overcoming damage reduction.

_Ability Score Increase (Ex)_: The phantom adds 1 to one of its ability scores.'''

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "devotion"
print = '''
The phantom gains a +4 morale bonus on Will saves against enchantment spells and effects.

_Incorporeal Flight (Su)_: When the phantom manifests in incorporeal form, it has a fly speed of 40 feet (good).'''

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "phantom-statistics"
print = '''
A spiritualist's phantom is typically the same size as the spiritualist. A spiritualist can have a phantom that is one size category smaller than her, and if she is Small or smaller, she can have a phantom one size category larger than her. A phantom is always a humanoid-shaped creature, and looks somewhat like it did in its past life while manifested, though the emotional turmoil of its existence usually warps its appearance in some way.

Every phantom has the following base statistics, which are then modified by its size and emotional focus. Phantom Starting Statistics: Type Outsider (phantom); Size As spiritualist or one size category smaller (or one size category larger, if the spiritualist is Small or smaller); Speed 30 ft.; AC +2 dodge (in incorporeal form) or +2 natural armor (in ectoplasmic form); Attack 2 slams (1d6 or 1d4 if size Small); Ability Scores Str 12, Dex 14, Con 13, Int 7, Wis 10, Cha 13.'''

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "phantom-skills"
print = "The following skills are class skills for the phantom: Bluff (Cha), Craft (Int), Fly (Dex), Intimidate (Cha), Knowledge (planes) (Int), Perception (Wis), Sense Motive (Wis), and Stealth (Dex). In addition, at 1st level, the spiritualist can choose one additional skill as a class skill for her phantom. The phantom also gains two class skills based on its emotional focus. The phantom automatically gains bonus ranks in these two skills as the spiritualist increases in level—its number of ranks in these skills is always equal to its number of Hit Dice."

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "full-manifestation-forms"
print = "Each time she fully manifests her phantom, the spiritualist must choose whether to manifest the phantom in either ectoplasmic or incorporeal form. The phantom gains the statistics presented on Table 1–11: Manifested Phantom's Base Statistics, modified by the phantom's emotional focus and by the type of manifestation the spiritualist chooses."

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "ectoplasmic"
print = "When the spiritualist manifests her phantom in ectoplasmic form, the phantom gains the following abilities."

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "damage-reduction"
print = '''
A phantom manifested in ectoplasmic form has DR 5/slashing. When the spiritualist reaches 5th level, the phantom gains DR 5/magic. At 10th level, the damage resistance increases to 10/magic. At 15th level, it increases to 15/magic, and at 20th level, the damage reduction becomes DR 15/—.

_Phase Lurch (Su):_ A phantom in ectoplasmic form has the ability to pass through walls or material obstacles. In order to use this ability, it must begin and end its turn outside whatever wall or obstacle it's moving through. An ectoplasmic phantom can't move through corporeal creatures with this ability, and its movement speed is halved while moving through a wall or obstacle. Any surface it moves through is coated with a thin, silvery mucus that lingers for 1 minute.'''

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "incorporeal"
print = "When the spiritualist chooses to manifest the phantom in incorporeal form, the phantom appears within 30 feet of the spiritualist as a ghostly apparition. It gains the incorporeal subtype (_Pathfinder RPG Bestiary_ 301), including a deflection bonus to AC equal to its Charisma modifier. Since it isn't an undead creature, it takes no damage from holy water or positive energy. Unlike other incorporeal creatures, an incorporeal phantom can't attack corporeal creatures, except to deliver touch-attack spells using the deliver touch spell ability. An incorporeal manifested phantom can make slam attacks against other incorporeal creatures as if it were in ectoplasmic form."

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "emotional-focus"
print = '''
Each phantom has an emotional focus—a powerful emotion based on some experience in life that keeps it tethered to the Material and Ethereal planes. This emotional focus also grants the phantom abilities that it can use while manifested. The type of each ability and its power are determined by the spiritualist's level.

The emotional focus determines which bonus skill ranks the phantom gains, as well as the skills in which its spiritualist master gains Skill Focus. It also determines the good saving throws of the manifested phantom and the special abilities the phantom gains as it increases in level.

While phantoms tend to appear much as they did in life—at least as they did at the time of death —each emotional focus twists a phantom's visage, mannerisms, and even personality in its own way. Unlike with most creatures, a phantom's emotion aura often manifests for all to see, even those without the benefit of spells or abilities. Often phantoms manifest these emotion auras in unique ways, some of which are described in individual emotional focus descriptions. Anger Phantoms with this emotional focus are filled with seething anger from events in their past lives. Phantoms with this focus often take the form of hulking brutes with furrowed brows or of frenzied creatures that always seem ready to strike down those who come too near. Many times, these phantoms exude a bright red aura, especially when they are engaged in combat, or they seem to breathe a red mist in shallow pants from behind clenched, phantasmal teeth.'''

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "skills"
print = "The phantom gains a number of ranks in Intimidate and Survival equal to its number of Hit Dice. While confined in the spiritualist's consciousness, the phantom grants the spiritualist [Skill Focus](ref/feat/skill-focus) in each of these skills."

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "good-saves"
print = "Fortitude and Will."

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "strength-focus"
print = "The phantom gains a +2 bonus to Strength and a -2 penalty to Dexterity. Instead of the phantom gaining a bonus to Dexterity as the spiritualist gains levels, an anger-focused phantom gains a bonus to Strength instead."

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "powerful-strike"
print = "A phantom with this focus deals more damage with its slam attacks. It deals slam damage as a creature one size category larger than its current size. The phantom also gains Power Attack as a bonus feat."

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "aura-of-fury"
print = "When the spiritualist reaches 7th level, as a swift action, the phantom can emit a 20-foot-radius aura of fury. Creatures within the aura gain a +2 bonus on melee attack rolls but take a -2 penalty to AC. Ending the aura is a free action. The phantom can use this ability in either ectoplasmic or incorporeal form."

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "ferocious-mien"
print = "When the spiritualist reaches 12th level, once per day as a swift action, a phantom in ectoplasmic form can grow more ferocious and frightening. It becomes one size category larger than its current size, as affected by an _enlarge person_ spell, and grows fiercer in combat, as if affected by a _rage_ spell. This effect lasts for 1 round per class level of the spiritualist. When the spiritualist reaches 18th level, a phantom using ferocious mien also gains the frightful presence extraordinary ability (_Bestiary_ 300; range 30 feet, duration 5d6 rounds)."

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "furious-wail"
print = "When the spiritualist reaches 17th level, once per day as a standard action, the phantom can emit a single angry wail that acts as _wail of the banshee_. The phantom uses its Hit Dice as its caster level for the effect, and the DC of the effect is 10 + 1/2 the phantom's Hit Dice + the phantom's Charisma modifier. The phantom can use this ability in either ectoplasmic or incorporeal form. Dedication Either through a sense of love or the desire to finish some unfinished task, a phantom with this emotional focus has an undying devotion to something or someone in the world. It's often the case that a phantom with this emotional focus has a strong familial tie with its spiritualist master. A dedication phantom most often appears as a strong and stern protector with a watchful gaze, and its service to its spiritualist is unwavering. These spirits exude auras of blue, or sometimes rose if their love for their spiritualist masters in life was great. Many times these auras manifest as a halo, giving these phantoms a divine appearance, no matter their actual alignment or opinions on matters of religion."

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "skill"
print = "The phantom gains a number of ranks in Diplomacy and Sense Motive equal to its number of Hit Dice. While confined in the spiritualist's consciousness, the phantom grants the spiritualist Skill Focus in each of these skills."

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "good-saves"
print = "Reflex and Will."

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "iron-will"
print = "The phantom gains [Iron Will](ref/feat/iron-will) as a bonus feat. Furthermore, when the phantom is within its master's consciousness, it grants the benefits of Iron Will to its master if its master doesn't have that feat."

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "dutiful-strike"
print = "When a creature makes an attack against the phantom's master, the phantom gains a +2 bonus on attack rolls against that target, and deals damage against that target as if the phantom were [one size category](ref/misc/damage-die-adjustments) larger. For the purposes of this ability, an attack includes any harmful spell targeting the spiritualist master of whose area or effect includes the spiritualist master. Dutiful strike lasts for 1 minute, until another creature attacks the phantom's spiritualist master (at which point this effect transfers to the new attacker), or until the attacking creature is reduced to fewer than 0 hit points, whichever occurs first."

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "defending-aura"
print = "When the spiritualist reaches 7th level, the phantom can emit a 10-foot-radius aura that grants protection to nearby allies. It can activate this aura at will as a swift action. Allies within the aura gain a +2 deflection bonus to AC and a +2 bonus to CMD and on all saving throws. Deactivating the aura is a free action."

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "devoted-servant"
print = "When the spiritualist reaches 12th level and is caught unawares by an attack (such as an attack made in a surprise round or while the spiritualist is asleep or an attack by a creature using Stealth), if the phantom is not fully manifested, it automatically fully manifests from the spiritualist's consciousness to protect its master. The phantom stays manifested as long as the spiritualist is unaware and in danger. This ability requires no action from the spiritualist."

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "steadfast-devotion"
print = '''
When the spiritualist reaches 17th level, the phantom becomes immune to detrimental mind-affecting effects and all forms of [possession](ref/spell/possession), such as _[magic jar](ref/spell/magic-jar)_ and _possession_ (see page 181). Furthermore, the phantom is immune to _[banishment](ref/spell/banishment)_, _[dismissal](ref/spell/dismissal)_, and similar effects.

Despair Some creatures die in such horrific ways, or live such pointless and senseless lives, that despair grips their very beings. Phantoms with this focus use misery as a weapon, inflicting the living with the gloom of the phantoms' continued existence. Despair phantoms often appear twisted or wounded, showing the grisly circumstances of their demise.

Their coloration tends to have a grayish or sickly green cast. When they speak, they do so in terrifying whispers or high-pitched screeches.'''

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "skills"
print = "The phantom gains a number of ranks in Intimidate and Stealth equal to its number of Hit Dice. While confined in the spiritualist's consciousness, the phantom grants the spiritualist Skill Focus in each of these skills."

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "good-saves"
print = "Fortitude and Will."

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "power-from-despair"
print = "The phantom gains a +2 bonus on attack and damage rolls against creatures that are shaken, frightened, panicked, cowering, or subject to effects such as aura of despair or _crushing despair_."

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "miserable-strike"
print = "If the phantom hits a creature with a slam attack, that creature must succeed at a Will saving throw (DC = 10 + 1/2 the phantom's Hit Dice + the phantom's Charisma modifier) or take a -2 penalty on attack and damage rolls for 1 round. This is a mind-affecting fear and emotion effect. Penalties from multiple hits don't stack with themselves."

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "aura-of-despair"
print = "When the spiritualist reaches 7th level, as a swift action, the phantom can emit a 10-foot aura of despair. Enemies within the aura take a -2 penalty on all saving throws. This is a fear effect. Deactivating the aura is a free action."

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "despairing-shout"
print = "When the spiritualist reaches 12th level, three times per day as a standard action, the phantom can emit a shout that acts as _crushing despair_. The phantom uses its Hit Dice as its caster level for the effect, and the DC of the effect equals 10 + 1/2 the phantom's Hit Dice + the phantom's Charisma modifier. The phantom can use this ability in either ectoplasmic or incorporeal form."

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "inescapable-despair"
print = "When the spiritualist reaches 17th level, if the phantom hits with its slam attack, the creature hit doesn't get a save to resist the effects of miserable strike. Fear A phantom with this emotional focus suffered from overwhelming fear in life. As a phantom, it is able to channel that fear into a terrifying weapon. Fear phantoms are often horrifying to behold. Sometimes they appear as ghostly figures in tattered funeral garb or wrapped in chains or other bindings. Their features may be distorted into gaunt and haunting forms, making them seem more like ghosts or spectres. A miasma of livid gray swirling motes often surrounds their forms as they stalk their surroundings, seeking to bestow their terror on others."

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "skills"
print = "The phantom gains a number of ranks in Intimidate and Stealth equal to its number of Hit Dice. While confined in the spiritualist's consciousness, such a phantom grants the spiritualist Skill Focus in each of these skills."

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "good-saves"
print = "Reflex and Will."

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "stealthy"
print = "The phantom gains Stealthy as a bonus feat."

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "horrifying-strike"
print = "If the phantom hits a creature with a slam attack, that creature must succeed at a Will saving throw (DC = 10 + 1/2 the phantom's Hit Dice + the phantom's Charisma modifier) or be shaken for 1d4 rounds. Multiple attacks against the same creature do not cause the creature to become frightened. This is a mind-affecting fear effect."

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "increase-fear"
print = "When the spiritualist reaches 7th level, as a swift action, the phantom can emit a 20-foot-radius aura that amplifies the fear conditions of enemies within it if they fail their Will saving throws (DC = 10 + 1/2 the phantom's Hit Dice + the phantom's Charisma modifier). A shaken enemy in the aura becomes frightened, a frightened creature becomes panicked, and a panicked creature cowers. This effect lasts either as long as the enemy stays within the aura and is under the condition of the initial fear effect, or for a number of rounds after it leaves the aura equal to 1/2 the phantom's Hit Dice, or until the end of the original fear effect's duration, whichever comes first. A creature that succeeds at the saving throw is immune to this effect from the same phantom for 24 hours. This is a mind-affecting fear effect. The phantom can use this ability in either ectoplasmic or incorporeal form."

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "frightful-attack"
print = "When the spiritualist reaches 12th level, if the phantom hits with a slam attack, it can frighten those it hits instead of causing them to be shaken (the phantom chooses when it makes the attack). This is a mind-affecting fear effect."

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "shelter-allies"
print = '''
When the spiritualist reaches 17th level, the phantom protects its allies from terror. Allies within the phantom's increase fear aura are immune to fear as long as they are within the aura. This ability also grants the phantom's spiritualist master immunity to fear as long as the phantom is not banished to the Ethereal Plane. Hatred Few things draw a spirit toward the Negative Material Plane like the emotion of hatred. Phantoms with this focus often are blinded by—and blind others with—this powerful emotion. These phantoms are frequently darker and more foreboding than all but those phantoms with the fear emotional focus. Many of them manifest as dark and dreadful knights, their armor bristling with spikes and their hands seeming to grasp barbed and terrible weapons. Other times they appear as tall, gaunt figures staring down arrogantly at those who approach.

These phantoms typically spew a string of curses at their foes, often profane, sometimes poetic. Their auras are pulsating and pitch black, and thrum violently when these horrible phantoms attack.'''

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "skills"
print = "The phantom gains a number of ranks in Acrobatics and Perception equal to its number of Hit Dice. While confined in the spiritualist's consciousness, the phantom grants the spiritualist Skill Focus in each of these skills."

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "good-saves"
print = "Fortitude and Reflex."

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "weapon-finesse"
print = "The phantom gains Weapon Finesse as a bonus feat."

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "hated-target"
print = "The phantom can take a move action to designate one creature within its line of sight as a hated target. The phantom gains a +2 bonus on attack rolls against its hated target, and a bonus on damage rolls equal to 1/2 the phantom's Hit Dice (minimum 1). The phantom is so focused on this hated target that it takes a -2 penalty on attack rolls against all other creatures. The phantom can maintain these bonuses against only one target at a time, and these bonuses remain in effect until either the hated opponent is dead or it has been out of the phantom's line of sight for at least 1 minute. When the spiritualist reaches 7th level, the phantom can use this ability as a swift action, and takes no penalty when attacking creatures that are not designated as its hated enemy. The phantom must be manifested in ectoplasmic form to use this ability (unless the spiritualist is 17th level or higher; see Shared Hatred below)."

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "hateful-aura"
print = "When the spiritualist reaches 7th level, as a swift action, the phantom can emit a 10-foot-radius aura that inf licts pain upon the minds of those who dare damage it or its master. Enemies within the aura that deal damage to the spiritualist or the phantom take an amount of damage equal to the phantom's Charisma bonus. This is a mind-affecting pain effect. The phantom can use this ability in either ectoplasmic or incorporeal form."

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "sneak-attack"
print = "When the spiritualist reaches 12th level, the phantom gains sneak attack +3d6, but only against its hated enemy. At 18th level, the sneak attack damage increases to +5d6."

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "shared-hatred"
print = "When the spiritualist reaches 17th level, the phantom can grant its hatred to others. When the phantom designates a hated enemy, its allies also gain a +2 bonus on attack rolls and a +4 bonus on damage rolls against that enemy. Furthermore, the phantom can use its hated target ability even when in incorporeal form; when it does, it can make slam attacks against a corporeal creature, but only if that corporeal creature is its hated target. Jealousy A phantom with this emotional focus is covetous of everything—its master, those who wish to do it harm, and any who do not pay attention to it. It demands to be the center of attention at all times. The forms these phantoms take are as diverse as the forms of jealousy in life. Often they take pleasing forms, wishing to draw others in. Other times they take the form of crawling and lurching things, grasping at all they covet when they come within reach. The auras of these needy phantoms quickly change in color, going from an oily green to orange, to brownish red as they swirl through emotions in their efforts to gain the objects of their dark desires."

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "skills"
print = "The phantom gains a number of ranks in Appraise and Bluff equal to its number of Hit Dice. While confined in the spiritualist's consciousness, the phantom grants the spiritualist Skill Focus in each of these skills."

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "good-saves"
print = "Reflex and Will."

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "deceitful"
print = "The phantom gains Deceitful as a bonus feat."

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "jealous-combatant"
print = "Each time the phantom hits a creature with a melee attack, for 1 round that creature takes a -2 penalty on all attack rolls made against anyone other than the phantom. This effect does not stack with itself."

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "resentful-aura"
print = "When the spiritualist reaches 7th level, as a swift action, the phantom can emit a 20-foot-radius aura that forces enemies within the aura who make an attack or cast a spell that does not include the phantom in its effect to succeed at a Will saving throw (DC = 10 + 1/2 the phantom's Hit Dice + the phantom's Charisma modifier) or become staggered until the end of the enemy's next turn. Ending the aura is a free action. The phantom can use this ability in either ectoplasmic or incorporeal form."

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "retribution"
print = "When the spiritualist reaches 12th level, each time a creature attacks the phantom's master, whether that attack hits or misses, it enrages the phantom. Until the end of the phantom's next turn, any attack the phantom makes that hits the creature that has attacked her deals 2d8 extra points of damage. This extra damage is precision damage."

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "mine-to-take"
print = "When the spiritualist reaches 17th level, once per day as an immediate action, just before the phantom's master is about to attempt a saving throw or be targeted by an attack roll, the phantom and the spiritualist can swap places as long as both are on the same plane and the phantom is aware of the attack or effect. After the swap occurs, the phantom is targeted by the attack or effect that triggered this ability, though the phantom may be immune or resistant to the effect. This is a teleportation effect. The phantom can use this ability in either ectoplasmic or incorporeal form. Zeal A phantom with this emotional focus fixates on every task given as if it were the phantom's last. The most basic commands are treated as life-and-death situations, and the truly dangerous ones are faced with a resolve and tenacity that sometimes defies common sense. Zeal phantoms take the form of steadfast protectors or daring and manic creatures looking for the next challenge or opportunity to prove itself to either its master or itself. Often very prideful creatures, these phantoms display an orange aura upon completing their tasks. They are prone to boast about their accomplishments and chastise those around them for not accomplishing more."

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "skills"
print = "The phantom gains a number of ranks in Acrobatics and Survival equal to its number of Hit Dice. While confined in the spiritualist's consciousness, the phantom grants the spiritualist Skill Focus in each of these skills."

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "good-saves"
print = "Fortitude and Reflex."

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "tracking"
print = "The phantom adds half its number of Hit Dice (minimum 1) to Survival skill checks to follow tracks."

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "ruthless-combatant"
print = "The phantom threatens a critical hit with its slam attacks on a roll of 19–20. When the spiritualist reaches 11th level, the phantom's critical modifier with slam attacks increases to ×3. This doesn't stack with Improved Critical or similar effects."

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "determination-aura"
print = "When the spiritualist reaches 7th level, as a swift action, the phantom can emit a 20-foot-radius aura that grants its zeal to nearby allies. Allies within the aura gain a +2 competence bonus on attack rolls and saving throws. The phantom can use this ability in either ectoplasmic or incorporeal form."

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "steadfast-servant"
print = "When the spiritualist reaches 12th level, the phantom can stay manifested even when its spiritualist master is unconscious or asleep."

[[entry]]
id = "ref/emotionalfocus/dedication"
anchor = "zeal-s-resolve"
print = "When the spiritualist reaches 17th level, three times per day as a free action, when the phantom misses with an attack roll or fails a saving throw, it can reroll the failed attack or saving throw. It must take the new result, even if that result is worse."

[[entry]]
id = "ref/emotionalfocus/despair"
anchor = "opening"
print = "Base Statistics, modified by the phantom's emotional focus and by the type of manifestation the spiritualist chooses."

[[entry]]
id = "ref/emotionalfocus/despair"
anchor = "ectoplasmic"
print = "When the spiritualist manifests her phantom in ectoplasmic form, the phantom gains the following abilities."

[[entry]]
id = "ref/emotionalfocus/despair"
anchor = "damage-reduction"
print = '''
A phantom manifested in ectoplasmic form has DR 5/slashing. When the spiritualist reaches 5th level, the phantom gains DR 5/magic. At 10th level, the damage resistance increases to 10/magic. At 15th level, it increases to 15/magic, and at 20th level, the damage reduction becomes DR 15/—.

_Phase Lurch (Su):_ A phantom in ectoplasmic form has the ability to pass through walls or material obstacles. In order to use this ability, it must begin and end its turn outside whatever wall or obstacle it's moving through. An ectoplasmic phantom can't move through corporeal creatures with this ability, and its movement speed is halved while moving through a wall or obstacle. Any surface it moves through is coated with a thin, silvery mucus that lingers for 1 minute.'''

[[entry]]
id = "ref/emotionalfocus/despair"
anchor = "incorporeal"
print = "When the spiritualist chooses to manifest the phantom in incorporeal form, the phantom appears within 30 feet of the spiritualist as a ghostly apparition. It gains the incorporeal subtype (_Pathfinder RPG Bestiary_ 301), including a deflection bonus to AC equal to its Charisma modifier. Since it isn't an undead creature, it takes no damage from holy water or positive energy. Unlike other incorporeal creatures, an incorporeal phantom can't attack corporeal creatures, except to deliver touch-attack spells using the deliver touch spell ability. An incorporeal manifested phantom can make slam attacks against other incorporeal creatures as if it were in ectoplasmic form."

[[entry]]
id = "ref/emotionalfocus/despair"
anchor = "emotional-focus"
print = '''
Each phantom has an emotional focus—a powerful emotion based on some experience in life that keeps it tethered to the Material and Ethereal planes. This emotional focus also grants the phantom abilities that it can use while manifested. The type of each ability and its power are determined by the spiritualist's level.

The emotional focus determines which bonus skill ranks the phantom gains, as well as the skills in which its spiritualist master gains Skill Focus. It also determines the good saving throws of the manifested phantom and the special abilities the phantom gains as it increases in level.

While phantoms tend to appear much as they did in life—at least as they did at the time of death —each emotional focus twists a phantom's visage, mannerisms, and even personality in its own way. Unlike with most creatures, a phantom's emotion aura often manifests for all to see, even those without the benefit of spells or abilities. Often phantoms manifest these emotion auras in unique ways, some of which are described in individual emotional focus descriptions. Anger Phantoms with this emotional focus are filled with seething anger from events in their past lives. Phantoms with this focus often take the form of hulking brutes with furrowed brows or of frenzied creatures that always seem ready to strike down those who come too near. Many times, these phantoms exude a bright red aura, especially when they are engaged in combat, or they seem to breathe a red mist in shallow pants from behind clenched, phantasmal teeth.'''

[[entry]]
id = "ref/emotionalfocus/despair"
anchor = "skills"
print = "The phantom gains a number of ranks in [Intimidate](ref/skill/intimidate) and Survival equal to its number of Hit Dice. While confined in the spiritualist's consciousness, the phantom grants the spiritualist [Skill Focus](ref/feat/skill-focus) in each of these skills."

[[entry]]
id = "ref/emotionalfocus/despair"
anchor = "good-saves"
print = "Fortitude and Will."

[[entry]]
id = "ref/emotionalfocus/despair"
anchor = "strength-focus"
print = "The phantom gains a +2 bonus to Strength and a -2 penalty to Dexterity. Instead of the phantom gaining a bonus to Dexterity as the spiritualist gains levels, an anger-focused phantom gains a bonus to Strength instead."

[[entry]]
id = "ref/emotionalfocus/despair"
anchor = "powerful-strike"
print = "A phantom with this focus deals more damage with its slam attacks. It deals slam damage as a creature one size category larger than its current size. The phantom also gains Power Attack as a bonus feat."

