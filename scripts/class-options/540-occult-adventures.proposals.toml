[[entry]]
id = "ref/implement/transmutation"
anchor = "psychic"
print = "Within the mind of any sentient being lies power to rival that of the greatest magical artifact or holy site. By accessing these staggering vaults of mental energy, the psychic can shape the world around her, the minds of others, and pathways across the planes. No place or idea is too secret or remote for a psychic to access, and she can pull from every type of psychic magic. Many methods allow psychics to tap into their mental abilities, and the disciplines they follow affect their abilities."

[[entry]]
id = "ref/implement/transmutation"
anchor = "role"
print = "With a large suite of spells, psychics can handle many situations, but they excel at moving and manipulating objects, as well as reading and inf luencing thoughts."

[[entry]]
id = "ref/implement/transmutation"
anchor = "alignment"
print = "Any."

[[entry]]
id = "ref/implement/transmutation"
anchor = "hit-die"
print = "d6."

[[entry]]
id = "ref/implement/transmutation"
anchor = "starting-wealth"
print = "2d6 × 10 gp (average 70 gp)."

[[entry]]
id = "ref/implement/transmutation"
anchor = "class-skills"
print = "The psychic's class skills are Bluff (Cha), Craft (Int), Diplomacy (Cha), Fly (Dex), Intimidate (Cha), Knowledge (all) (Int), Linguistics (Int), Perception (Wis), Profession (Wis), Sense Motive (Wis), and Spellcraft (Int)."

[[entry]]
id = "ref/implement/transmutation"
anchor = "skill-ranks-per-level"
print = "2 + Int modifier."

[[entry]]
id = "ref/implement/transmutation"
anchor = "class-features"
print = "The following are the class features of the psychic."

[[entry]]
id = "ref/implement/transmutation"
anchor = "weapon-and-armor-proficiency"
print = "A psychic is proficient with all simple weapons, but not with any type of armor or shield."

[[entry]]
id = "ref/implement/transmutation"
anchor = "spells"
print = '''
A psychic casts psychic spells drawn from the psychic class's spell list (see page 69). She can cast any spell she knows without preparing it ahead of time. To learn or cast a spell, a psychic must have an Intelligence score equal to at least 10 + the spell level. The Difficulty Class for a saving throw against a psychic's spell is equal to 10 + the spell's level + the psychic's Intelligence modifier.

A psychic can cast only a certain number of spells of each spell level per day. Her base daily spell allotment is given on Table 1–7: Psychic. In addition, she receives bonus spells per day if she has a high Intelligence score (see Table 1–3 on page 17 of the _Pathfinder RPG Core Rulebook_).

The psychic's selection of spells is limited. A psychic begins play knowing four 0-level spells and two 1st-level spells of the psychic's choice. At each new psychic level, she learns one or more new spells, as indicated on Table 1–8: Psychic Spells Known. Unlike a psychic's spells per day, the number of spells a psychic knows isn't affected by her Intelligence score; the numbers on Table 1–8 are fixed.

At 4th level and every even-numbered level thereafter (6th, 8th, and so on), a psychic can choose to learn a single new spell in place of one she already knows. In effect, the psychic loses the old spell in exchange for the new one. The new spell's level must be the same as that of the spell being exchanged, and it must be at least 1 level lower than the highest-level spell from the psychic's class list that the psychic can cast. A psychic can swap only a single spell at any given level, and must choose whether or not to swap the spell at the same time that she gains new spells known for the level.

A psychic need not prepare her spells in advance. She can cast any psychic spell she knows at any time, assuming she has not yet used up her allotment of spells per day for the spell's level.'''

[[entry]]
id = "ref/implement/transmutation"
anchor = "knacks"
print = "Psychics learn a number of knacks, or 0-level spells, as noted on Table 1–8. These spells are cast like any other spell, but they don't consume any slots and can be used again. Knacks cast using other spell slots (due to metamagic feats, for example) consume spell slots as normal."

[[entry]]
id = "ref/implement/transmutation"
anchor = "phrenic-pool"
print = "A psychic has a pool of supernatural mental energy that she can draw upon to manipulate psychic spells as she casts them. The maximum number of points in a psychic's phrenic pool is equal to 1/2 her psychic level + her Wisdom or Charisma modifier, as determined by her psychic discipline. The phrenic pool is replenished each morning after 8 hours of rest or meditation; these hours don't need to be consecutive. The psychic might be able to recharge points in her phrenic pool in additional circumstances dictated by her psychic discipline. Points gained in excess of the pool's maximum are lost."

[[entry]]
id = "ref/implement/transmutation"
anchor = "phrenic-amplifications"
print = "A psychic develops particular techniques to empower her spellcasting, called phrenic amplifications. The psychic can activate a phrenic amplification only while casting a spell using psychic magic, and the amplification modifies either the spell's effects or the process of casting it. The spell being cast is called the linked spell. The psychic can activate only one amplification each time she casts a spell, and doing so is part of the action used to cast the spell. She can use any amplification she knows with any psychic spell, unless the amplification's description states that it can be linked only to certain types of spells. A psychic learns one phrenic amplification at 1st level, selected from the list below. At 3rd level and every 4 levels thereafter, the psychic learns a new phrenic amplification. A phrenic amplification can't be selected more than once. Once a phrenic amplification has been selected, it can't be changed. Phrenic amplifications require the psychic to expend 1 or more points from her phrenic pool to function."

[[entry]]
id = "ref/implement/transmutation"
anchor = "complex-countermeasure"
print = "The psychic can spend 1 point from her phrenic pool to increase by 2 the DCs of concentration checks or caster level checks the linked spell requires enemies to attempt. For example, if the linked spell were _nondetection_, the DC of the caster level check for using a divination on the warded creature or item would increase. This increase also applies to checks to dispel, counterspell, or identify the linked spell. The bonus applies while the spell"

[[entry]]
id = "ref/order/order-of-the-eastern-star"
anchor = "opening"
print = "This cavalier order exists to keep dangerous secrets hidden from the world and secretly protect the world against unimaginable threats from beyond the mortal realms. These cavaliers scout and observe, concerning themselves not with the trivial pursuit of morality, but rather with ensuring the survival of society itself."

[[entry]]
id = "ref/order/order-of-the-eastern-star"
anchor = "edicts"
print = "The cavalier must preserve the secrets of his order while acting to protect civilization against occult threats. He must thwart the schemes of otherworldly horrors and must give his order a full accounting of any potential threats."

[[entry]]
id = "ref/order/order-of-the-eastern-star"
anchor = "challenge"
print = "Whenever a cavalier of the order of the eastern star issues a challenge, he receives a +1 dodge bonus to AC and a +1 insight bonus on saves against the attacks and abilities of the target of his challenge. He must be wearing light armor and carrying no more than a light load to receive these bonuses. These bonuses increase by 1 for every 4 class levels the cavalier possesses."

[[entry]]
id = "ref/order/order-of-the-eastern-star"
anchor = "skills"
print = "A cavalier belonging to the order of the eastern star adds [Knowledge (arcana)](ref/skill/knowledge-arcana) and [Knowledge (planes)](ref/skill/knowledge-planes) to his class skills. He can attempt Knowledge (arcana) and Knowledge (planes) checks untrained. If he has ranks in these skills, as long as a check involves knowledge of the occult or supernatural, he receives a bonus on the check equal to 1/2 his cavalier level (minimum +1)."

[[entry]]
id = "ref/order/order-of-the-eastern-star"
anchor = "feats"
print = "A cavalier of this order gains [Psychic Sensitivity](ref/feat/psychic-sensitivity) as a bonus feat."

[[entry]]
id = "ref/order/order-of-the-eastern-star"
anchor = "order-abilities"
print = "A cavalier belonging to this order gains the following abilities as he increases in level."

[[entry]]
id = "ref/order/order-of-the-eastern-star"
anchor = "guarded"
print = "At 2nd level, the cavalier gains DR 1/— and a +2 morale bonus on saving throws when wearing light armor or no armor and [fighting defensively](ref/misc/fighting-defensively) or using [Combat Expertise](ref/feat/combat-expertise). At 6th level and every 4 levels thereafter, this DR increases by 1. He loses the benefits of this ability if carrying a medium or heavier load."

[[entry]]
id = "ref/order/order-of-the-eastern-star"
anchor = "pierce-the-guard"
print = '''
At 8th level, when attacking with a light or one-handed weapon, the cavalier ignores the penalty for fighting defensively or using Combat Expertise on his first melee attack roll each round. If [fighting with two weapons](ref/rule/two-weapon-fighting), he ignores the penalty for the first attack with each weapon, as long as the off-hand weapon is a light weapon.

The cavalier can't use this ability with double weapons.'''

[[entry]]
id = "ref/order/order-of-the-eastern-star"
anchor = "one-purpose"
print = '''
At 15th level, the cavalier's mount shares the benefits of the cavalier's guarded ability as long as both are wearing light or no armor and carrying no more than a light load.

The cavalier must fight defensively or use Combat Expertise to grant these benefits, but the mount need not. In addition, the mount gains all the benefits of the cavalier's challenge, regardless of what barding it wears.'''

[[entry]]
id = "ref/order/order-of-the-eastern-star"
anchor = "order-of-the-shroud-cavalier-order"
print = "Cavaliers of this order seek out and destroy undead and those who harbor or create them. They scour old crypts, graveyards, and battlefields to bring eternal rest."

[[entry]]
id = "ref/order/order-of-the-eastern-star"
anchor = "edicts"
print = "The cavalier must protect the common folk from the scourge of the undead. He must seek out and destroy the restless dead and give aid to those haunted by them. He must protect those who cannot defend themselves, and root out sources that birth the corruption of life and death."

[[entry]]
id = "ref/order/order-of-the-eastern-star"
anchor = "challenge"
print = "Whenever an order of the shroud cavalier issues a challenge to an undead creature, he receives a +1 morale bonus on attack rolls against the target of his challenge for 1 minute. The bonus increases by 1 for every 4 class levels the cavalier possesses."

[[entry]]
id = "ref/order/order-of-the-eastern-star"
anchor = "skills"
print = "An order of the shroud cavalier adds Knowledge (local) (Int) and Knowledge (religion) (Int) to his list of class skills. An order of the shroud cavalier can attempt Knowledge (religion) checks untrained. If he has ranks in that skill, as long as a Knowledge (religion) check involves undead or haunts, he receives a bonus on the check equal to 1/2 his cavalier level (minimum +1)."

[[entry]]
id = "ref/order/order-of-the-eastern-star"
anchor = "order-abilities"
print = "A cavalier belonging to the order of the shroud gains the following abilities as he increases in level."

[[entry]]
id = "ref/order/order-of-the-eastern-star"
anchor = "spiritual-shield"
print = "At 2nd level, the cavalier can call upon the spirits of the fallen for protection. Once per day as an immediate action when attacked by an undead target of his challenge, the cavalier can gain a deflection bonus equal to his Charisma modifier to his AC against that attack. The cavalier must decide to use this ability before the attack roll."

[[entry]]
id = "ref/order/order-of-the-eastern-star"
anchor = "destroyer-of-the-undead"
print = "At 8th level, the cavalier's weapons are treated as having the cavalier's alignment for the purpose of overcoming the damage reduction of undead creatures. Against an undead target of his challenge, the cavalier automatically overcomes all damage reduction that undead possesses."

[[entry]]
id = "ref/order/order-of-the-eastern-star"
anchor = "stand-against-darkness"
print = "At 15th level, the cavalier can take revenge on undead that dare strike him or those he seeks to protect. Whenever an undead creature that is the subject of his challenge hits the cavalier or an adjacent ally with a melee attack, the creature provokes an attack of opportunity from the cavalier. The cavalier gains a +2 morale bonus on attacks of opportunity provoked as a result of this ability. If an undead subject of the cavalier's challenge threatens a critical hit against the cavalier, the cavalier gains a deflection bonus equal to his Charisma modifier against the confirmation roll. This bonus functions as a supernatural ability."

[[entry]]
id = "ref/order/order-of-the-eastern-star"
anchor = "ghost-rider-cavalier-archetype"
print = "Ghost riders are conf licted warriors who use the powers of the phantasmal dead even while seeking out and banishing the corruption of undeath from plagued communities. Their strange abilities mark them as outsiders and stoic loners, and they stay in one place only long enough to help the afflicted before riding off to unknown destinations."

[[entry]]
id = "ref/order/order-of-the-eastern-star"
anchor = "ghost-mount"
print = '''
At 1st level, a ghost rider gains the ability to manifest a special mount of conjured ectoplasm rather than one of flesh and bone. This spectral companion functions like a spiritualist's phantom companion, using the ghost rider's cavalier level as her effective spiritualist level. The phantom takes the form of a ghostly creature analogous to one of a cavalier's normal mount options for her size and class level, such as a Large horse for a Medium ghost rider or a wolf for a Small ghost rider. A ghost rider must choose a mount that is capable of bearing her weight, that has four or more legs, and that lacks a fly speed (although the GM may allow mounts with a swim speed in certain environments). The GM might approve other animals as suitable mounts.

The ghost rider can manifest her ghost mount only in ectoplasmic form, and she gains the spiritualist's etheric tether class feature, applied to her ghost mount. The mount shares the cavalier's alignment. Though the mount cannot speak, it understands its master's verbal commands and gains the phantom's link ability. The ghost mount has good Fortitude and Reflex saves, and can have ranks in any of the following skills: Acrobatics (Dex), Climb (Str), Escape Artist (Dex), Fly (Dex), Intimidate (Cha), Perception (Wis), Stealth (Dex), Survival (Wis), and Swim (Str). The ghost rider's ghost mount does not gain the share spells, deliver touch spells, or incorporeal flight abilities. Ghost mounts do not gain emotional focus abilities.

The ghost rider does not take an armor check penalty on Ride checks while riding her mount. The mount is always considered combat trained, and begins play with Endurance as a bonus feat.

_Ghost Mount Starting Statistics_: Type animal (phantom); Size one size category larger than the ghost rider; Speed 50 ft.; AC +4 natural armor; Attack bite (1d4), 2 hooves (1d6; this is a secondary natural attack); Ability Scores Str 16, Dex 13, Con 15, Int 2, Wis 12, Cha 6.

This ability replaces mount.'''

[[entry]]
id = "ref/order/order-of-the-eastern-star"
anchor = "frightful-gaze"
print = '''
At 1st level, a ghost rider can use this ability on opponents within 30 feet as a standard action, which acts as a gaze attack until the ghost rider's next turn. Creatures within range that meet the ghost rider's gaze must succeed at a Will saving throw (DC = 10 + 1/2 the ghost rider's class level + the ghost rider's Charisma modifier) or stand paralyzed in fear for 1 round. This is a mind-affecting fear effect. Creatures that successfully save against that ghost rider's frightful gaze are immune to it for 24 hours. At 9th level, this ability can affect creatures that are mindless or immune to mind-affecting effects, though it still counts as a fear effect. The ghost rider can use this ability a number of times each day equal to her Charisma modifier.

This ability replaces tactician, greater tactician, and master tactician.'''

[[entry]]
id = "ref/order/order-of-the-eastern-star"
anchor = "fearless"
print = "At 3rd level, a ghost rider becomes immune to fear. Each ally within 10 feet of the ghost rider gains a +4 morale bonus on saving throws against fear effects. This ability functions only while the ghost rider is conscious, not if she is unconscious or dead. This ability replaces cavalier's charge."

[[entry]]
id = "ref/order/order-of-the-eastern-star"
anchor = "spirited-mount"
print = "At 5th level, the ghost rider's mount ignores difficult terrain. At 8th level, it gains the ability to use _water walk_ at will. This ability replaces expert trainer and banner."

[[entry]]
id = "ref/order/order-of-the-eastern-star"
anchor = "ghost-wind"
print = "At 11th level, the ghost rider's ghost mount can use _air walk_ (as the spell, no action required) at will for up to 1 round at a time, after which it falls to the ground. At 14th level, the mount can fly at its speed with a bonus on Fly skill checks equal to the ghost rider's class level. This ability replaces mighty charge and greater banner."

[[entry]]
id = "ref/order/order-of-the-eastern-star"
anchor = "sensate-fighter-archetype"
print = "A sensate perceives battle through senses beyond mortal ken, anticipating his opponents' movements before they even begin to act. As long as he keeps his focus about him, he fights with a skill rivaling that of the finest masters-at-arms."

[[entry]]
id = "ref/order/order-of-the-eastern-star"
anchor = "skills"
print = "The sensate's class skills are Acrobatics (Dex), Climb (Str), Craft (Int), Perception (Wis), Profession (Wis), Ride (Dex), Sense Motive (Wis), Survival (Wis), and Swim (Str). This replaces the fighter's class skills."

[[entry]]
id = "ref/order/order-of-the-eastern-star"
anchor = "weapon-and-armor-proficiency"
print = "Sensates are proficient with all simple and martial weapons, light armor, medium armor, and shields (except tower shields). This replaces the fighter's weapon and armor proficiency."

[[entry]]
id = "ref/order/order-of-the-eastern-star"
anchor = "guarded-senses"
print = "At 2nd level, a sensate gains a +1 bonus on saves against sonic effects, figments, glamers, patterns, gaze attacks, and scent-based attacks. This bonus increases by 1 for every 4 levels the sensate possesses beyond 2nd. This ability replaces bravery."

[[entry]]
id = "ref/order/order-of-the-eastern-star"
anchor = "uncanny-dodge"
print = "At 3rd level, a sensate gains uncanny dodge as the barbarian ability of the same name, except supernatural in nature. This ability replaces armor training 1."

[[entry]]
id = "ref/order/order-of-the-eastern-star"
anchor = "centered-senses"
print = "At 5th level, a sensate can center his senses as a move action. While centered, a sensate gains a +1 insight bonus on attack rolls, weapon damage rolls, and Will saves. This bonus increases by 1 at 9th level and every 4 levels thereafter. A sensate loses his centered state if he gains the confused, dazed, fascinated, staggered, or stunned condition; falls unconscious; or fails a Will save. This ability replaces weapon training 2, 3, and 4."

[[entry]]
id = "ref/order/order-of-the-eastern-star"
anchor = "improved-uncanny-dodge"
print = "At 7th level, a sensate gains improved uncanny dodge as the barbarian ability of the same name, except supernatural in nature. This ability replaces armor training 2."

[[entry]]
id = "ref/order/order-of-the-eastern-star"
anchor = "evasion"
print = "At 11th level, a sensate gains evasion while using centered senses. This functions as the rogue ability of the same name, except that it is supernatural in nature and works regardless of the sensate's armor and encumbrance. This ability replaces armor training 3."

[[entry]]
id = "ref/order/order-of-the-eastern-star"
anchor = "steady"
print = "At 15th level, a sensate can center himself as a swift action. This ability replaces armor training 4."

[[entry]]
id = "ref/order/order-of-the-eastern-star"
anchor = "perfect-senses"
print = '''
At 19th level, a sensate's senses reach perfection, and he can easily notice illusions and unseen foes by combining his senses. While centered, he gains the effects of _true seeing_ as well as blindsense 60 feet. An unseen creature that makes no sound and leaves no scent (such as a creature under the effects of _invisibility_, _silence_, and _negate aroma_) can still avoid both the _true seeing_ and the blindsense.

This ability replaces armor mastery.'''

[[entry]]
id = "ref/order/order-of-the-eastern-star"
anchor = "precision"
print = "At 20th level, a sensate rolls twice to confirm critical hits while centered, taking the more favorable result. Opponents must roll twice to confirm critical hits against him, taking the less favorable result. The latter ability does not function when the sensate is denied his Dexterity bonus. This ability replaces weapon mastery."

[[entry]]
id = "ref/order/order-of-the-eastern-star"
anchor = "relic-hunter-inquisitor-archetype"
print = "Some inquisitors specialize in the use and recovery of long-lost relics of their faiths, drawing forth divine might from the recovered items in order to restore their sanctity and wield these artifacts against the enemies of their gods."

[[entry]]
id = "ref/order/order-of-the-eastern-star"
anchor = "spells"
print = "A relic hunter casts divine spells drawn from the inquisitor spell list, but her chosen relic schools (see Relics below) limit her to schools she knows, similar in function to an occultist's implements. Any spell or orison gained by the relic hunter has a relic component (see Relics below), and is not considered to be on the relic hunter's spell list until she selects its school though the relics alternate class feature. Once she chooses a school, all spells and orisons of that school are considered to be on the relic hunter's class spell list, allowing her to use spell trigger and spell completion magic items of those spells. A relic hunter's spells per day, daily spell allotment, Difficulty Class, and minimum Wisdom score requirements remain unchanged from the inquisitor's normal spellcasting class feature. This ability alters the inquisitor's spellcasting."

[[entry]]
id = "ref/order/order-of-the-eastern-star"
anchor = "relics"
print = '''
At 1st level, a relic hunter gains the occultist's implements class feature (see page 47) and learns to use two occultist implement schools as relic schools. At 4th level and every 3 levels thereafter, the relic hunter learns to use one additional relic school drawn from the same source, gaining access to that school's resonant power and base focus power and opening up that school's focus powers for her to select. Like an occultist, a relic hunter can select the same school twice, but it is far less useful for her to do so.

Relics do not need to be magic items, and nonmagical relics do not take up a magic item slot. Relics that are not magic items are often of some religious significance to the relic hunter or her church, such as the battered shield of a saint, a bishop's robe, or the finger bone of a church martyr.

This ability replaces judgment.'''

[[entry]]
id = "ref/order/order-of-the-eastern-star"
anchor = "deific-focus"
print = '''
At 1st level, a relic hunter learns to invest divine power into her chosen relics. This acts like the occultist's focus powers and mental focus class features (see pages 47 and 48, respectively), with the following adjustments.

Each day, a relic hunter has a number of points of deific focus equal to her inquisitor level + her Wisdom modifier, and she must spend 1 hour in prayer with her relics to invest them with divine power. These points refresh at the start of each day.

At 1st level, the relic hunter learns the two base focus powers from her chosen relic schools and can select one more focus power from the list of those made available by her chosen schools. Whenever she gains a new relic school, she gains the base focus power of that school. In addition, at 4th level and every 4 levels thereafter, she learns a new focus power selected from all of the powers granted by all of the relic schools she knows. She can use these focus powers only by expending points of deific focus. Unless otherwise noted, the DC for any saving throws against a focus power is equal to 10 + 1/2 the inquisitor's class level + the inquisitor's Wisdom modifier. She cannot select a focus power more than once. She uses her inquisitor level in place of an occultist level to qualify for focus powers.

This ability replaces domain, bane, greater bane, second judgment, and third judgment.'''

[[entry]]
id = "ref/order/order-of-the-eastern-star"
anchor = "psychic-detective-investigator-archetype"
print = "A psychic detective supplements her keen insight with occult skill to unravel mysteries both ordinary and supernatural."

[[entry]]
id = "ref/order/order-of-the-eastern-star"
anchor = "class-skills"
print = "The psychic detective does not receive Acrobatics, Climb, or Perform as class skills. This alters the investigator's class skills."

[[entry]]
id = "ref/order/order-of-the-eastern-star"
anchor = "spells"
print = '''
A psychic detective casts psychic spells drawn from the psychic class spell list (see page 69) and augmented by a select set of additional spells (see Psychic Detective Spells on page 120). Only spells from the psychic class spell list of 6th level or lower and psychic detective spells are considered to be part of the psychic detective's spell list. If a spell appears on both the psychic detective and psychic class spell lists, the psychic detective uses the spell level from the psychic detective spell list. She can cast any spell she knows without preparing it ahead of time. To learn or cast a spell, a psychic detective must have an Intelligence score equal to at least 10 + the spell's level. The saving throw DC against a psychic detective's spell is 10 + the spell's level + the psychic detective's Intelligence modifier.

Like other spellcasters, a psychic detective can cast only a certain number of spells of each spell level per day. She knows the same number of spells and receives the same number of spells slots per day as a bard of her investigator level, and knows and uses 0-level knacks as a bard uses cantrips. In addition, she receives bonus spells per day if she has a high Intelligence score (see Table 1–3 on page 17 of the _Core Rulebook_).

At 5th level and every 3 levels thereafter, a psychic detective can choose to learn a new spell in place of one she already knows, using the same rules as a bard. In effect, the psychic detective loses the old spell in exchange for the new one. The new spell's level must be the same as that of the spell being exchanged, and it must be at least 1 level lower than the highest-level spell the psychic detective can cast.'''

[[entry]]
