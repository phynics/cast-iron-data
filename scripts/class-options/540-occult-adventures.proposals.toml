# The printed text of the powers of the class options of the book, written ones included (the check reads an entry against it). Generated: never edit by hand.

[[entry]]
id = "ref/discipline/abomination"
anchor = "opening"
print = "Your mind is impure, tainted by outside forces. These might be monstrous ancestors whose blood still flows within you, or powerful and unknowable psychic forces that intrude upon your mind. Like a psychic disease, this influence consumes part of your brain, creating a dark counterpart to your normal self. Every time you call forth a psychic spell, you're drawing on this dangerous force—and potentially giving it a greater hold on you. This malign influence might stem from creatures like rakshasas and aboleths, or perhaps malign entities that dwell in the voids between the stars."

[[entry]]
id = "ref/discipline/abomination"
anchor = "phrenic-pool-ability"
print = "Charisma."

[[entry]]
id = "ref/discipline/abomination"
anchor = "bonus-spells"
print = "_Ray of enfeeblement_ (1st), _alter self_ (4th), _excruciating deformation_ (6th), _black tentacles_ (8th), _explode head_ (10th), _repulsion_ (12th), _insanity_ (14th), _orb of the void_ (16th), _telekinetic storm_ (18th)."

[[entry]]
id = "ref/discipline/abomination"
anchor = "discipline-powers"
print = "Your powers allow the dark influences to take over, and it can be difficult to come back from the brink."

[[entry]]
id = "ref/discipline/abomination"
anchor = "dark-half"
print = "By allowing the dark forces to overcome you, you can enter a state of instinctual cruelty as a swift action. While you're manifesting your dark half, you increase the DCs of your psychic spells by 1, gain a +2 morale bonus on Will saves, and become immune to fear effects. Whenever you cast a spell that deals damage while manifesting your dark half, you can cause one creature that took damage from the spell to also take 1 point of [bleed](ref/rule/bleed) damage. The amount of bleed damage increases to 2 points at 5th level and to 1d6 points at 13th level. While manifesting your dark half, you can't use any Charisma-, Dexterity-, or Intelligence-based skills (except Acrobatics, Fly, Intimidate, and Ride) or any ability that requires patience or [concentration](ref/rule/concentration) other than casting spells using psychic magic, using phrenic amplifications, or attempting to return to normal. You can attempt to return to your normal self as a free action, but must succeed at a concentration check with a DC equal to 10 + your caster level. If you fail, you continue to manifest your dark half and can't attempt to change back for 1 round. You can manifest your dark half for a number of rounds per day equal to 3 + 1/2 your psychic level + your Charisma modifier; when these rounds are expended, you return to your normal self without requiring a concentration check."

[[entry]]
id = "ref/discipline/abomination"
anchor = "morphic-form"
print = "At 5th level, while manifesting your dark half, you gain DR 5. This [damage reduction](ref/rule/damage-reduction) can be overcome by a random type of damage each time you manifest your dark half, determined by rolling on the table below. d% Damage Reduction 1–35 DR 5/bludgeoning 36–60 DR 5/cold iron 61–100 DR 5/magic"

[[entry]]
id = "ref/discipline/abomination"
anchor = "psychic-safeguard"
print = "At 13th level, you project constant mental defenses, gaining [spell resistance](ref/rule/spell-resistance) equal to 8 + your caster level. While manifesting your dark half, this spell resistance increases to 16 + your caster level."

[[entry]]
id = "ref/discipline/dream"
anchor = "opening"
print = "You discover deeper and more powerful corners of your mind through journeys you make in your dreams. Your consciousness expands outward into other dreaming minds, allowing you to explore the psychic landscapes of unconsciousness or regions of nightmare and horror."

[[entry]]
id = "ref/discipline/dream"
anchor = "phrenic-pool-ability"
print = "Charisma."

[[entry]]
id = "ref/discipline/dream"
anchor = "bonus-spells"
print = "_Sleep_(1st),_oneiric horror_ (4th), _deep slumber_(6th), _sleepwalk_ (8th),_nightmare_ (10th),_cloak of dreams_ (12th),_ethereal jaunt_ (14th), _dream voyage_ (16th),_microcosm_ (18th)."

[[entry]]
id = "ref/discipline/dream"
anchor = "discipline-powers"
print = "Your mind can powerfully influence dreaming consciousnesses."

[[entry]]
id = "ref/discipline/dream"
anchor = "dream-leech"
print = "While adjacent to a sleeping or unconscious creature, you can take a swift action to siphon that creature's dreams, thereby learning new things about your own mind. The creature can attempt a Will save to negate this effect; such creatures are never considered willing. Creatures that don't dream are immune to this effect. If the subject fails the save, you gain a +4 bonus on your next Bluff, Diplomacy, or Intimidate check against the subject within the next 24 hours, and you regain 1 point in your phrenic pool. You can use this ability a number of times per day equal to your Charisma modifier, but no more than once per hour and no more than once per creature per day."

[[entry]]
id = "ref/discipline/dream"
anchor = "oneiromancy"
print = "As a standard action, you can tamper with the minds of sleeping creatures. You plant a subconscious thought in a sleeping creature's mind by attempting a [Diplomacy](ref/skill/diplomacy) or [Intimidate](ref/skill/intimidate) check to modify the sleeping creature's attitude or request a service from it. If you succeed, when the creature wakes it behaves in the way you dictated with the normal restrictions for the Diplomacy or Intimidate skill. The target of oneiromancy remains unaware of this manipulation, though if you fail your Diplomacy check the subject might have its starting attitude toward you negatively impacted, as normal. You must be adjacent to the sleeping creature to use this ability. Alternatively, you can use this ability as part of the casting of_dream, minor dream,_or _[nightmare](ref/spell/nightmare)._In this case, the oneiromancy effect takes place when the spell is cast. You can use this ability a number of times per day equal to 3 + your Charisma modifier. Creatures that don't [dream](ref/spell/dream) are immune to this effect."

[[entry]]
id = "ref/discipline/dream"
anchor = "mind-heist"
print = '''
At 5th level, you can delve into the subconscious mind of a sleeping target. You can cast_[detect thoughts](ref/spell/detect-thoughts)_as a [spell-like ability](ref/umr/spell-like-abilities) on any adjacent sleeping creature. Additionally, you can gain the benefit of_[detect thoughts](ref/spell/detect-thoughts)_on a target of your_dream, minor dream,_or _[nightmare](ref/spell/nightmare)_spells as if you had studied the target for 3 rounds. If you cast _[dream scan](ref/spell/dream-scan)_ (see page 166), you know whether you received false information from the dream.

A successful Will save negates mind heist.

You can use this ability a number of times per day equal to your Charisma modifier.'''

[[entry]]
id = "ref/discipline/dream"
anchor = "waking-dream"
print = '''
At 13th level, as a standard action, you can take control of the body of a sleeping creature within 30 feet for 1 hour per level. This ability functions like _[magic jar](ref/spell/magic-jar)_,except that your soul travels directly into the sleeping target with no receptacle necessary and the target creature's consciousness remains dreaming and unaware of its body's actions.

When waking dream ends or the host body is destroyed, you immediately wake up in your body regardless of the distance from the host body, provided your body hasn't been destroyed. You can use this ability a number of times per day equal to your Charisma bonus. Creatures that don't dream are immune to this effect.'''

[[entry]]
id = "ref/discipline/faith"
anchor = "opening"
print = "Your belief in a higher power fuels your psychic abilities. Whether your mental abilities truly come to you as a divine gift or are simply enhanced by the power of your belief, none can say. In many ways, you resemble a divine caster, and prayers often factor into your casting of psychic spells."

[[entry]]
id = "ref/discipline/faith"
anchor = "phrenic-pool-ability"
print = "Wisdom."

[[entry]]
id = "ref/discipline/faith"
anchor = "bonus-spells"
print = "_Bless_ (1st), _spiritual weapon_ (4th), _magic vestment_ (6th), _guardian of faith_ (8th), _commune_ (10th), _psychic surgery_ (12th), _greater scrying_ (14th), _greater planar ally_ (16th), _miracle_ (18th)."

[[entry]]
id = "ref/discipline/faith"
anchor = "discipline-powers"
print = "Your powers serve to protect or cure you and your allies."

[[entry]]
id = "ref/discipline/faith"
anchor = "deity"
print = "At 1st level, choose a deity to worship. Your alignment must remain within one step of your deity's or you lose access to all this discipline's bonus spells and discipline powers."

[[entry]]
id = "ref/discipline/faith"
anchor = "divine-energy"
print = "You can channel spell energy into cure or inflict spells. This ability functions similarly to the [cleric's](ref/class/cleric) ability to spontaneously cast cure or inflict spells, and the type of spells you can convert depends on your alignment in the same way. The cure or inflict spells don't count as being on your psychic spell list for the purposes of any other effects. Each day, you can convert up to one spell from each spell level you can cast. Each time you use this ability to convert a spell, you regain 1 point in your phrenic pool. The maximum number of points you can regain in this way per day is equal to your Wisdom modifier."

[[entry]]
id = "ref/discipline/faith"
anchor = "resilience-of-the-faithful"
print = "At 5th level, you gain a +2 resistance bonus on all saving throws. This bonus increases by 1 for every 5 levels you possess beyond 5th."

[[entry]]
id = "ref/discipline/faith"
anchor = "prayer-aura"
print = "At 13th level, as a free action, you can extend an aura around you to bolster your allies and make your enemies less effective. You can use this aura for a number of rounds per day equal to your psychic level. These rounds don't need to be consecutive. This functions as the _[prayer](ref/spell/prayer)_ spell, granting your allies a +1 luck bonus on attack rolls, weapon damage rolls, saves, and skill checks and imposing a -1 penalty on your enemies' rolls of those types. If you are chaotic, lawful, good, or evil, the penalty from your aura changes to -2 against creatures of an opposing alignment. The penalty doesn't change further for a creature that opposes you on two alignment axes (such as a chaotic evil creature fighting a lawful good psychic)."

[[entry]]
id = "ref/discipline/lore"
anchor = "opening"
print = "By collecting expert information and reading all sorts of treatises and chapbooks on occult subjects, you learn proper techniques and rituals to empower your mental abilities. Your abilities become stronger through study and science, not instinct."

[[entry]]
id = "ref/discipline/lore"
anchor = "phrenic-pool-ability"
print = "Wisdom."

[[entry]]
id = "ref/discipline/lore"
anchor = "bonus-spells"
print = "_Comprehend languages_ (1st), _hypercognition_ (4th), _dispel magic_ (6th), _mind probe_ (8th), _retrocognition_ (10th), _legend lore_ (12th), _greater arcane sight_ (14th), _moment of prescience_ (16th), _divide mind_ (18th)."

[[entry]]
id = "ref/discipline/lore"
anchor = "discipline-powers"
print = "Your powers relate to your extensive knowledge and your ability to alter and adapt your memory."

[[entry]]
id = "ref/discipline/lore"
anchor = "illuminating-answers"
print = "You can glean deeper truths from advice you magically obtain, even if the information itself is specious. When you use a spell or [spell-like ability](ref/umr/spell-like-abilities) that allows you to get answers to questions (such as _[augury](ref/spell/augury)_, _[blood biography](ref/spell/blood-biography)_, or _[contact other plane](ref/spell/contact-other-plane)_) and get at least one answer, you regain 1 point in your phrenic pool. You regain this point even if the answer is false or vague. The maximum number of points you can regain in this way per day is equal to your Wisdom modifier."

[[entry]]
id = "ref/discipline/lore"
anchor = "mnemonic-cache"
print = '''
You can memorize a piece of information and later recall it perfectly. Your mnemonic cache can hold roughly 10 pages of written information, including images and maps, or 30 minutes' worth of speech or music. (Memorizing music doesn't confer the ability to perform it properly.) The amount you can store increases by 5 pages and 5 minutes at 2nd level, and at every psychic level thereafter.

You can hold only one piece of information in your mnemonic cache at a time.

The information doesn't go away when you recall it, but when you put a new piece of information in the cache, the old piece becomes as imperfect any other memory.

Memorizing magical writing (such as a scroll or a page from a spellbook) doesn't confer the ability to borrow, duplicate, or retain any of the magic in the writing. You could reproduce the spell in writing to allow someone who prepares spells from a spellbook to prepare it, though this functions as using a borrowed spellbook for anyone other than you. If you're in telepathic contact with another creature (through _[telepathic bond](ref/spell/telepathic-bond)_, for example), you can transfer the information directly into its mind as a free action. For this creature, the information functions like a normal memory, not one with perfect clarity.

You can attempt to sequester a written magical trap (such as _[explosive runes](ref/spell/explosive-runes)_ or _[sepia snake sigil](ref/spell/sepia-snake-sigil)_) in your mnemonic cache and destroy it. Treat this as a [Disable Device](ref/skill/disable-device) check to disarm a magical trap (as though you had the [trapfinding](ref/ability/trapfinding) class feature). Your bonus on this roll is equal to either your Disable Device modifier or the sum of 5 + your psychic level + your Wisdom modifier, whichever is higher. If you succeed, instead of being disabled, the trap is erased and destroyed. This ability can't destroy symbol traps; it functions only if written text is involved.'''

[[entry]]
id = "ref/discipline/lore"
anchor = "superior-automatic-writing"
print = "At 5th level, when attempting checks for the [automatic writing](ref/skill/linguistics) occult skill unlock (see page 194), you can treat your psychic level + your Wisdom bonus as your number of Linguistics skill ranks. At 8th level, you gain an additional option when using automatic writing, and can attempt a DC 35 check to gain information as though you'd used _[commune](ref/spell/commune)_ instead of _[augury](ref/spell/augury)_ or _[divination](ref/spell/divination)_. This type of _[commune](ref/spell/commune)_ requires no material component, and the duration equals 1 round per psychic class level you possess. You connect to a distant being of great intellect, a fragment of the [Akashic Record](ref/rule/akashic-record) (see page 244), or a similar bastion of knowledge instead of to a deity."

[[entry]]
id = "ref/discipline/lore"
anchor = "memory-palace"
print = '''
At 13th level, you mentally construct an extradimensional [library](ref/rule/using-a-library) to house mental constructs representing the volumes of lore you've studied. This ability functions as _[mage's magnificent mansion](ref/spell/mages-magnificent-mansion)_, with the following adjustments: the memory palace is limited in size to a number of 10-foot cubes equal to your psychic level; your memory palace doesn't contain any furniture other than bookcases and a few desks and sofas where you and your visitors can study; and there is no food within, though the memory palace does contain a number of _[unseen servants](ref/spell/unseen-servant)_ equal to 1/2 your psychic level, which function solely as librarians. The library keeps the same layout each time you summon it, though you can alter its appearance each time you gain a level or by spending 15 minutes concentrating. You can reshape the memory palace in your mind, so it doesn't need to currently be in effect for you to alter it. You can create your memory palace once per day.

Choose one type of [Knowledge](ref/skill/knowledge-all) skill when you gain this ability. Consulting your memory palace gives anyone who studies within—including you—a +4 circumstance bonus on Knowledge checks of that type, and the memory palace counts as an extensive library for people attempting Knowledge checks of that type untrained. You gain a +2 circumstance bonus on checks with the chosen skill when you're not consulting the palace (including when the palace isn't in effect). At 14th level and at each additional level thereafter, choose another Knowledge skill to which your memory palace's library bonuses apply.'''

[[entry]]
id = "ref/discipline/pain"
anchor = "opening"
print = "Mental blocks prevent your immense inborn psychic energies from flowing freely. They are unleashed only when you suffer pain."

[[entry]]
id = "ref/discipline/pain"
anchor = "phrenic-pool-ability"
print = "Charisma."

[[entry]]
id = "ref/discipline/pain"
anchor = "bonus-spells"
print = "_Persuasive goad_ (1st), _pain strike_ (4th), _vampiric touch_ (6th), _mass pain strike_ (8th), _synapse overload_ (10th), _mass inflict pain_ (12th), _waves of exhaustion_ (14th), _horrid wilting_ (16th), _mass suffocation_ (18th)."

[[entry]]
id = "ref/discipline/pain"
anchor = "discipline-powers"
print = "Your powers allow you to cause and endure pain."

[[entry]]
id = "ref/discipline/pain"
anchor = "painful-reminder"
print = "As a swift action, you can cause an enemy to take 1d6 points of nonlethal damage if you dealt damage to that enemy with a spell since the start of your previous turn. You can use this ability a number of times per day equal to 3 + your Charisma modifier. This damage increases to 2d6 at 8th level and to 3d6 at 15th level."

[[entry]]
id = "ref/discipline/pain"
anchor = "power-from-pain"
print = "If your painful reminder deals at least 5 points of damage, you regain 1 point in your phrenic pool. The maximum number of points you can regain in this way per day is equal to your Wisdom modifier."

[[entry]]
id = "ref/discipline/pain"
anchor = "live-on"
print = "At 5th level, you can use [lay on hands](ref/ability/lay-on-hands) as though you were a [paladin](ref/class/paladin) of 3 levels lower than your psychic level. You also gain access to mercies as though you were a paladin of 3 levels lower than your psychic level. You can target only yourself with lay on hands or mercies gained from this discipline. This stacks with lay on hands abilities gained from other sources."

[[entry]]
id = "ref/discipline/pain"
anchor = "agonizing-wound"
print = "At 13th level, whenever you cast a spell that deals damage to a creature, you can also make that creature [frightened](ref/misc/frightened) or [sickened](ref/misc/sickened) (your choice) for a number of rounds equal to your Charisma modifier. If you expend two uses of this ability, you can instead have the creature become [dazed](ref/misc/dazed), [nauseated](ref/misc/nauseated), or [panicked](ref/misc/panicked) for 1 round. The creature can attempt a Will saving throw to negate this effect. You can use this ability a number of times per day equal to 3 + your Charisma modifier. This is a mind-affecting pain effect."

[[entry]]
id = "ref/discipline/psychedelia"
anchor = "opening"
print = "You ingest hallucinogens to expand your mind. Experimentation and study show you which ones will have the greatest effect. Your psychedelic forays put you into a different mental space from others, and normal people don't really understand you."

[[entry]]
id = "ref/discipline/psychedelia"
anchor = "phrenic-pool-ability"
print = "Wisdom."

[[entry]]
id = "ref/discipline/psychedelia"
anchor = "bonus-spells"
print = "_Polypurpose panacea_ (1st), _mad hallucination_ (4th), _synesthesia_ (6th), _confusion_ (8th), _mirage arcana_ (10th), _joyful rapture_ (12th), _waves of ecstasy_ (14th), _euphoric tranquility_ (16th), _astral projection_ (18th)."

[[entry]]
id = "ref/discipline/psychedelia"
anchor = "discipline-powers"
print = "You distort your own mind and perceptions, and can impress your altered states onto others."

[[entry]]
id = "ref/discipline/psychedelia"
anchor = "drug-resistance"
print = "When you ingest [drugs](ref/rule/drugs), you take half as much [ability damage](ref/rule/ability-damage-drain) (minimum 1). You also gain a +4 bonus on saving throws to avoid becoming addicted to a drug or to overcome being addicted (_Pathfinder RPG GameMastery Guide_ 236)."

[[entry]]
id = "ref/discipline/psychedelia"
anchor = "cognatogen"
print = "Once per day, you can create a [cognatogen](ref/discovery/cognatogen), a mutagen-like mixture that heightens one mental ability score at the expense of a physical ability score. When you imbibe a cognatogen, you gain a +2 natural armor bonus and a +4 alchemical bonus to the selected ability score for 1 minute per psychic level. In addition, while the cognatogen is in effect, you take a -2 penalty to one of your physical ability scores. If the cognatogen enhances your Intelligence, it applies a penalty to your Strength. If it enhances your Wisdom, it applies a penalty to your Dexterity. If it enhances your Charisma, it applies a penalty to your Constitution. Otherwise, this ability works just like the [alchemist's](ref/class/alchemist) mutagen ability (_Pathfinder RPG Advanced Player's Guide_ 28). When the effect of the cognatogen ends, you take 2 points of ability damage to the ability score penalized by the cognatogen. If you have both alchemist and psychic levels, these levels stack to determine the duration of your cognatogen and the DC of the save a non-alchemist must attempt if he drinks your cognatogen. If you gain discoveries, you can take the [grand cognatogen](ref/discovery/grand-cognatogen) and [greater cognatogen](ref/discovery/greater-cognatogen) discoveries to improve your cognatogen. The [infuse mutagen](ref/discovery/infuse-mutagen) discovery and the persistent mutagen class ability apply to cognatogens. However, even if you have alchemist levels, the duration of your cognatogen remains 1 minute per level (instead of 10 minutes per level) and you can still create only one per day (instead of an unlimited number) unless you also possess the cognatogen discovery."

[[entry]]
id = "ref/discipline/psychedelia"
anchor = "warped-brain"
print = "At 5th level, your mind becomes difficult to comprehend. When another creature uses a mind-affecting spell or ability against you, that creature must attempt a Will save. If it fails, it becomes [nauseated](ref/misc/nauseated) for 1 round. This ability triggers even if you succeed at your save (or are otherwise unaffected by the spell or ability), but doesn't apply if you're a willing subject of the spell. This is a mind-affecting effect."

[[entry]]
id = "ref/discipline/psychedelia"
anchor = "hallucinogenic-aura"
print = "At 13th level, a mental field emanates from you, touching the minds of those nearby. Any creature within 30 feet of you must succeed at a Will save or be [confused](ref/misc/confused) for 1d4 rounds. A creature that succeeds at its saving throw is immune to your hallucinogenic aura for 24 hours. A creature that fails its save doesn't need to continue making saves while it's confused by this aura, and becomes immune for 24 hours once its confusion ends. This is a mind-affecting effect. You're immune to your own hallucinogenic aura, as well as that of any other psychic. You can brew an antidote that protects the imbiber from your aura. Brewing 1 dose requires 1 hour and a successful DC 15 [Craft](ref/skill/craft-any) (alchemy) check. One dose's effects last for 1 month."

[[entry]]
id = "ref/discipline/rapport"
anchor = "opening"
print = "Forging a close bond with other people brings out the best in you, making it easier for you to link your mind with theirs. Through bonding your psyche with another person, you're able to fill in your own mental gaps and develop new psychic powers."

[[entry]]
id = "ref/discipline/rapport"
anchor = "phrenic-pool-ability"
print = "Charisma."

[[entry]]
id = "ref/discipline/rapport"
anchor = "bonus-spells"
print = "_Charm person_ (1st), _enthrall_ (4th), _coordinated effort_ (6th), _lesser geas_ (8th), _telepathy_ (10th), _battlemind link_ (12th), _mass hold person_ (14th), _mass charm monster_ (16th), _overwhelming presence_ (18th)."

[[entry]]
id = "ref/discipline/rapport"
anchor = "discipline-powers"
print = "Your powers meld several minds together, or allow you to more easily influence others."

[[entry]]
id = "ref/discipline/rapport"
anchor = "emotional-bond"
print = "You can create an empathic link between yourself and your allies, allowing you to monitor their emotional states. Setting up the link requires 10 minutes of uninterrupted concentration from you and all subjects, who must remain within 10 feet of you. You can link with a number of allies equal to your Charisma modifier. This bond lasts until the next time you regain your spells, or until you go [unconscious](ref/misc/unconscious) or voluntarily end the bond as a free action. If the bond ends, you can establish a new bond at will with another 10 minutes of mutual concentration. This link allows you to monitor emotions, detecting when allies become angry, surprised, confused, fearful, or the like, but doesn't allow them to communicate specific details. You can also easily tell whether a subject is unconscious. If a subject dies or moves to a different plane than you, your bond with that creature is severed. The distance between you and the subjects doesn't affect the bond as long as you're on the same plane of existence. At 4th level, the bond also gives you the benefits of the _[status](ref/spell/status)_ spell with all subjects of the emotional bond."

[[entry]]
id = "ref/discipline/rapport"
anchor = "emotional-push"
print = "You can draw upon the intense power of your own emotions in desperate situations, and your allies can call upon you through your emotional link to protect themselves. When you or a subject of your emotional bond must attempt a saving throw, the person attempting the save can gain a bonus equal to your Charisma bonus on the save as an immediate action. This ability can be used once per day, plus one additional time per day for every 4 psychic levels you possess. Allies using this ability don't need your permission, since the emotional connection is so direct, though you know when one of the uses has been expended. If the ally's saving throw is successful, you regain 1 point in your phrenic pool."

[[entry]]
id = "ref/discipline/rapport"
anchor = "share-memory"
print = "At 5th level, you can use _[share memory](ref/spell/share-memory)_ at will, but only with a willing target."

[[entry]]
id = "ref/discipline/rapport"
anchor = "team-player"
print = "At 5th level and 13th level, you gain a bonus teamwork feat."

[[entry]]
id = "ref/discipline/rapport"
anchor = "shared-skill"
print = "At 13th level, each time you set up an emotional bond, you can choose one Intelligence- or Charisma-based skill from the list of psychic's class skills. Any subject of your bond can use your bonus instead of his own when attempting checks with that skill as long as the bond lasts."

[[entry]]
id = "ref/discipline/self-perfection"
anchor = "opening"
print = "You take a holistic view of psychic power, believing that you must hone both your mental and physical attributes to remain in balance. The focus you find while exercising, fasting, and otherwise tending to your body broadens your psychic powers."

[[entry]]
id = "ref/discipline/self-perfection"
anchor = "phrenic-pool-ability"
print = "Wisdom."

[[entry]]
id = "ref/discipline/self-perfection"
anchor = "bonus-spells"
print = "_Expeditious retreat_ (1st), _bear's endurance_ (4th), _haste_ (6th), _freedom of movement_ (8th), _echolocation_ (10th), _transformation_ (12th), _ethereal jaunt_ (14th), _iron body_ (16th), _akashic form_ (18th)."

[[entry]]
id = "ref/discipline/self-perfection"
anchor = "discipline-powers"
print = "Your powers alter your body through your force of will."

[[entry]]
id = "ref/discipline/self-perfection"
anchor = "ac-bonus"
print = "When unarmored and unencumbered, you add your Wisdom bonus (if any) to your AC and CMD. The bonus to AC applies even against touch attacks or when you're [flat-footed](ref/rule/flat-footed). You lose these bonuses when you're immobilized or [helpless](ref/misc/helpless), when you wear any armor, when you carry a shield, or when you carry a medium or heavy load."

[[entry]]
id = "ref/discipline/self-perfection"
anchor = "physical-push"
print = "By channeling your psychic energy, you can make your body capable of greater physical feats. When you attempt a Strength-, Dexterity-, or Constitution-based ability check or skill check, you can gain a bonus on the check equal to your Wisdom bonus. You can use this ability a number of times per day equal to your Wisdom modifier. Using this ability is part of the action used to attempt the skill check (if any). If you succeed at the check, you regain 1 point in your phrenic pool."

[[entry]]
id = "ref/discipline/self-perfection"
anchor = "bodily-purge"
print = "You can heal your own wounds and maladies with the power of thought alone. At 5th level, you gain access to a daily pool of healing energy. This pool starts with 3 d8 dice per day, and gains 1 additional d8 for every 2 psychic levels you possess beyond 5th. As a standard action, you can use up any number of these dice to regain a number of hit points equal to the result of rolling that many d8s. For example, at 5th level you could regain 3d8 hit points all at once, 1d8 hit points three separate times, or 1d8 hit points once and 2d8 hit points at a different time. In addition, you can expend 2 dice from this pool to instead gain the benefit of _[lesser restoration](ref/spell/restoration-lesser)_ (affecting yourself only). At 7th level, you can expend 3 dice from this pool to instead gain the benefit of _[neutralize poison](ref/spell/neutralize-poison)_, _[remove disease](ref/spell/remove-disease)_, or _[restoration](ref/spell/restoration)_ (affecting yourself only). To use _[restoration](ref/spell/restoration)_ to dispel a permanent [negative level](ref/rule/energy-drain-and-negative-levels), you must expend 4 dice from this pool instead of 3. Use your psychic level as your caster level for these effects."

[[entry]]
id = "ref/discipline/self-perfection"
anchor = "pure-body"
print = "At 13th level, you gain immunity to diseases and poisons."

