[[entry]]
id = "ref/trick/astounding-avoidance"
anchor = "astounding-avoidance"
print = "The subject can avoid damage from magical and unusual attacks. The mesmerist can trigger this trick when the subject attempts a saving throw against an attack or spell that normally deals half damage on a successful save, before the subject rolls the save. If the subject succeeds at her save, she takes no damage. If the mesmerist is 12th level or higher, the subject takes only half damage if she fails her save. The benefits of this trick don't stack with those of the evasion or stalwart class features."

[[entry]]
id = "ref/trick/avian-escape"
anchor = "avian-escape"
print = "The subject changes shape to elude an attacking enemy. The mesmerist can trigger this trick when the subject takes damage from an enemy's attack. The subject transforms into a bird (as _[beast shape III](ref/spell/beast-shape-3)_). Though the subject can appear as any Tiny bird, it uses the statistics for a [raven](ref/monster/familiar-raven). This is a polymorph effect."

[[entry]]
id = "ref/trick/compel-alacrity"
anchor = "compel-alacrity"
print = "A dash of mental speed lets the subject push past her physical limits to avoid an enemy. The mesmerist can trigger this trick when the subject begins her turn within an enemy's reach. The subject can move 10 feet as a free action without provoking attacks of opportunity. The distance the subject can move increases by 5 feet for every 5 levels the mesmerist possesses, to a maximum of 30 feet at 20th level. The subject can't move farther than her speed in this way. The movement from this trick doesn't count against the subject's movement speed for that round."

[[entry]]
id = "ref/trick/cursed-sanction"
anchor = "cursed-sanction"
print = "A ward curses an enemy who attacks the subject. While this trick is implanted, a visible, circular symbol appears on the subject's forehead. The mesmerist can trigger this trick when the subject is attacked or becomes the target of a spell that requires an attack roll. The attacker takes a -4 penalty on attack rolls, saves, ability checks, and skill checks for 1 minute per mesmerist level (Will negates). This penalty applies to the triggering attack roll. This is a curse effect."

[[entry]]
id = "ref/trick/faked-death"
anchor = "faked-death"
print = "The subject appears to die, but actually can stealthily move about. The mesmerist can trigger this trick when the subject is damaged by an attack. The subject seems to fall down dead (as _[programmed image](ref/spell/programmed-image)_), but actually turns invisible (as _[invisibility](ref/spell/invisibility)_) for a number of rounds equal to the mesmerist's level or until she attacks. Once the subject becomes visible again, the illusory dead body disappears. These are illusion effects, and a creature that interacts with the false body can attempt a saving throw to disbelieve the effect. The false body is a figment; the invisibility is a glamer."

[[entry]]
id = "ref/trick/false-flanker"
anchor = "false-flanker"
print = "A duplicate of the mesmerist appears momentarily, as though he were fighting in tandem with the subject. The mesmerist can trigger this trick when the subject moves into or begins her turn in a square where she threatens an enemy. An illusory duplicate of the mesmerist appears in any unoccupied space adjacent to that enemy. This duplicate counts as threatening the enemy for the purposes of determining [flanking](ref/rule/flanking), but can't actually make attacks. The duplicate disappears at the end of the turn during which the trick is triggered. This is an illusion (figment) effect, and a creature that interacts with the false flanker can attempt a saving throw to disbelieve the effect."

[[entry]]
id = "ref/trick/fearsome-guise"
anchor = "fearsome-guise"
print = "A veil of illusion makes the subject appear to be someone else and then transform into a hideous monster at an opportune time. While this trick is implanted, the subject's appearance is altered, as _[disguise self](ref/spell/disguise-self)_. The mesmerist can trigger this trick when the subject attacks a creature. The illusory appearance briefly makes the subject appear monstrous, then ends. The mesmerist attempts an [Intimidate](ref/skill/intimidate) check to demoralize the target of the triggering attack. The restrictions on attempts to demoralize a target (the target being within 30 feet and able to see and hear the creature attempting the Intimidate check) apply to the subject of the trick. This is an illusion (glamer) effect."

[[entry]]
id = "ref/trick/free-in-body"
anchor = "free-in-body"
print = "When constrained, the subject can easily slip loose. The mesmerist can trigger this trick when the subject begins its turn grappled or under an effect that impedes its movement (including paralysis, _[solid fog](ref/spell/solid-fog)_, _[slow](ref/spell/slow)_, and _[web](ref/spell/web)_). The subject gains the benefits of _[freedom of movement](ref/spell/freedom-of-movement)_ for 1 minute."

[[entry]]
id = "ref/trick/gift-of-will"
anchor = "gift-of-will"
print = "A small portion of the mesmerist's vast mental power buttresses his ally's mind. The mesmerist can trigger this trick when the subject attempts a Will saving throw or a Sense Motive check, or is targeted by an Intimidate check to demoralize her. For a saving throw, the subject uses the mesmerist's Will saving throw bonus instead of her own. For a Sense Motive check or Intimidate check, she adds the mesmerist's Charisma bonus as a morale bonus on the check or to the DC. The mesmerist can't implant this trick on himself."

[[entry]]
id = "ref/trick/levitation-buffer"
anchor = "levitation-buffer"
print = "A mesmerist's telekinetic assault renders foes around the subject less of a threat. The mesmerist can trigger this trick when either an enemy moves adjacent to the subject or the subject begins her turn with one or more enemies adjacent to her. The mesmerist can either lift all enemies adjacent to the subject slightly into the air or push them all away from the subject. Lifting enemies causes them to move at half speed and take a -4 penalty to their CMDs against [bull rush](ref/rule/bull-rush), [drag](ref/rule/drag), and [reposition](ref/rule/reposition) attempts for 1 round (Will negates). The speed reduction and CMD penalty don't stack with those from _hostile levitation_ (_Pathfinder RPG Ultimate Combat_ 231). Pushing enemies away requires the mesmerist to attempt a bull rush combat maneuver check using his mesmerist level + his Charisma modifier as his CMB. Any enemy that's successfully pushed moves away from the subject of the trick using the normal rules for a bull rush."

[[entry]]
id = "ref/trick/linked-reaction"
anchor = "linked-reaction"
print = "A hive mind allows the mesmerist and an ally to share one another's reaction times. The mesmerist can trigger this trick when either the subject or the mesmerist is surprised and the other isn't (even if the mesmerist would normally be unable to take actions because of being surprised). Both the mesmerist and the subject can act in this surprise round. The mesmerist can't implant this trick on himself."

[[entry]]
id = "ref/trick/mask-misery"
anchor = "mask-misery"
print = "The subject can shrug off a condition for a short time before succumbing to it. The mesmerist can trigger this trick when the subject becomes affected by a minor condition listed under the touch treatment ability. The subject can ignore the effect of that condition for 1d4 rounds, after which the subject takes the full effect. This has no effect on any conditions affecting the subject other than the triggering condition, even if those other effects are also listed under touch treatment. The rounds during which the subject ignores the triggering effect still count against that effect's duration; if the duration of mask misery is longer than the effect lasts, the subject isn't affected by the condition at all. If an effect that imposes more than one condition triggers this trick, the subject ignores all eligible conditions. If the mesmerist is 6th level or higher, he adds the moderate conditions to the conditions he can ignore with this trick, and this trick ends minor conditions entirely instead of suppressing them temporarily. The mesmerist doesn't need to have touch treatment to choose or use this trick."

[[entry]]
id = "ref/trick/meek-facade"
anchor = "meek-facade"
print = "The subject magically seems like a weak target, goading an enemy into attacking her. The mesmerist can trigger this trick when the subject misses a creature with an attack (even if it's part of a full attack in which she hits that creature with another attack). The enemy must attack no one other than the subject, and the subject gains a +2 dodge bonus to AC against the triggering enemy's attacks. Both of these effects last for 1 round. The bonus to AC increases by 1 for every 5 levels the mesmerist possesses. This is a mind-affecting compulsion effect."

[[entry]]
id = "ref/trick/mental-fallback"
anchor = "mental-fallback"
print = "Mental commands placed deep in the subject's mind trigger when she would fall under mind control, allowing the mesmerist to control her instead. The mesmerist can trigger this trick when the subject is affected by a charm or compulsion effect created by an enemy. The subject acts as though the mesmerist had cast the spell instead of the enemy. For instance, if the subject were affected by _[charm monster](ref/spell/charm-monster)_ cast by an enemy, that enemy can't try to give her orders, but the mesmerist could. If the charm or compulsion causes penalties or conditions (such as those imposed by _[confusion](ref/spell/confusion)_, _[crushing despair](ref/spell/crushing-despair)_, or _[hold person](ref/spell/hold-person)_), the subject can ignore any of those penalties or conditions the mesmerist chooses. This trick overrides the charm or compulsion for a number of rounds equal to the mesmerist's level or until the duration of the triggering effect elapses, whichever comes first. The mesmerist can't implant this trick on himself."

[[entry]]
id = "ref/trick/mesmeric-mirror"
anchor = "mesmeric-mirror"
print = "An illusory image appears near the subject to throw off attackers. The mesmerist can trigger this trick when the subject is attacked or becomes the target of a spell that requires an attack roll. One duplicate of the subject appears, and the attacker must determine randomly which it hits (as _[mirror image](ref/spell/mirror-image)_). For every 5 class levels the mesmerist possesses, one additional image appears, to a maximum of five images at 20th level. Each image lasts for 1 minute per mesmerist level or until destroyed. This is an illusion (figment) effect."

[[entry]]
id = "ref/trick/mesmeric-pantomime"
anchor = "mesmeric-pantomime"
print = "By orchestrating the movement of his ally's body, the mesmerist imparts to that ally his own skill at a physical task. The mesmerist can trigger this trick when the subject attempts a Strength- or Dexterity-based skill check. The subject either uses the mesmerist's bonus on the skill check in place of her own or gains a morale bonus on the check equal to the mesmerist's Charisma bonus, whichever results in a higher modifier. The mesmerist can't implant this trick on himself."

[[entry]]
id = "ref/trick/misdirection"
anchor = "misdirection"
print = "An enemy's perception of an attack by the subject shifts, making the foe unprepared to defend against the attack. The mesmerist can trigger this trick when the subject makes an attack or uses a spell that requires an attack roll. The mesmerist attempts a [Bluff](ref/skill/bluff) check to feint against a single target of the subject's attack. Unlike a normal feint, this ability can be used on non-melee attacks. If the feint succeeds, the target of the attack is denied its Dexterity bonus to AC against the triggering attack. The target doesn't suffer any additional effects that the mesmerist or the subject would cause on a normal feint or Bluff check. This is an illusion (glamer) effect."

[[entry]]
id = "ref/trick/psychosomatic-surge"
anchor = "psychosomatic-surge"
print = "Psychic magic soothes the subject, alleviating her wounds temporarily. The mesmerist can trigger this trick when the subject takes damage. The subject gains a number of [temporary hit points](ref/rule/temporary-hit-points) equal to 1d8 + 1/2 the mesmerist's level. If the damage from the triggering attack would have reduced the subject to 0 hit points or fewer, this trick grants an additional 1d8 temporary hit points. These temporary hit points last for 1 hour or until discharged."

[[entry]]
id = "ref/trick/reflection-of-weakness"
anchor = "reflection-of-weakness"
print = "Psychic feedback causes an enemy to suffer from the same weakening effect it imposes on the subject. The mesmerist can trigger this trick when an attack or spell used by an enemy causes the subject to take [ability damage, ability drain](ref/rule/ability-damage-drain), [bleed](ref/rule/bleed) damage, or a minor or moderate condition listed under the touch treatment class feature. If the trick is triggered by ability damage, ability drain, or bleed damage, the amount of damage or drain the subject takes is reduced by 2 points (to a minimum of 0 points), and the creature that made the attack or cast the spell takes 2 points of ability damage to an ability score of the mesmerist's choice. The monster can attempt a Will save to negate the ability damage. This ability can be used if the attacker inflicts a curse, disease, or poison that deals ability damage or drain, but only if it deals that damage immediately, with no onset time. If the trick is triggered by the subject gaining a condition, the subject is still affected by the condition, but the attacker takes a condition of the mesmerist's choice for 1 round. This condition must come from the minor condition or moderate condition lists of the touch treatment class feature. The enemy can attempt a Will save to avoid gaining the condition. The mesmerist doesn't need to have touch treatment to select or use this trick."

[[entry]]
id = "ref/trick/shadow-splinter"
anchor = "shadow-splinter"
print = "The mesmerist protects the subject against an attack and redirects the harm to someone else. The mesmerist can trigger this trick when the subject takes damage from an attack. The damage the subject takes is reduced by an amount equal to 3 + the mesmerist's Charisma modifier (to a maximum of the total amount of damage the attack deals). Another creature within range of the original attack, other than the attacker, is affected by a shadow illusion that makes it appear as if the attacker is attacking that creature instead of the attacker's actual target. This second creature takes an amount of damage equal to the amount by which the attack's damage was reduced. This shadow doesn't require a roll to hit and ignores cover and concealment, but the target can attempt a Will save to disbelieve the effect. If it succeeds at this save, it neither takes the damage nor believes the attacker targeted it. This trick can't be triggered if there's no eligible second creature within range to take the redirected damage. This is an illusion (shadow) effect."

[[entry]]
id = "ref/trick/spatial-switch"
anchor = "spatial-switch"
print = "The mesmerist allows himself and an ally to physically swap places. The mesmerist can trigger this trick when an enemy moves adjacent to or attacks either the subject or the mesmerist, provided the subject and the mesmerist are within 100 feet of one another. The subject and the mesmerist then swap positions. If this trick was triggered by an attack, the swap happens before checking to see whether the attack hits. The mesmerist can't implant this trick on himself. This is a conjuration (teleportation) effect."

[[entry]]
id = "ref/trick/spectral-smoke"
anchor = "spectral-smoke"
print = "A cloud of smoke pops up around the subject, foiling attacks. The mesmerist can trigger this trick when the subject is targeted by an attack or by a spell that requires an attack roll. A smoke cloud appears in the subject's square and in a 10-foot radius around it. This cloud lasts for 1 round per mesmerist level. The cloud functions as _[fog cloud](ref/spell/fog-cloud)_, but is an illusion (figment) effect that can't be dispersed by wind and can be used underwater. A creature that interacts with the cloud can attempt a saving throw to disbelieve the effect. The radius of the cloud increases by 5 feet for every 5 caster levels the mesmerist possesses, to a maximum of 30 feet at 20th level."

[[entry]]
id = "ref/trick/spell-anticipation"
anchor = "spell-anticipation"
print = "The mesmerist can choose a spell to strike back at enemy spellcasters. When the mesmerist implants this trick, he must expend one spell slot to couple a spell he knows of that level with the trick. That spell must have a casting time of 1 standard action or less and be able to target one creature (spells like _[dominate person](ref/spell/dominate-person)_ that have more restrictive targeting can be used, but have no effect if triggered against creatures that don't match). He can trigger this trick when the subject is targeted by an enemy's spell. The mesmerist's spell then triggers, affecting only the enemy spellcaster. This takes effect only if the enemy spellcaster is within range of the spell (as measured from the subject of the trick), and functions as though the mesmerist were in the subject's square. The enemy's spell still has its full effect, even if the mesmerist's spell would normally protect against it or make the caster unable to cast it."

[[entry]]
id = "ref/trick/vanish-arrow"
anchor = "vanish-arrow"
print = '''
With a flourish, the mesmerist snatches a projectile from an enemy before it can be shot. The mesmerist can trigger this trick when the subject is targeted by a ranged weapon attack, before the attack roll is made. The mesmerist attempts a [Sleight of Hand](ref/skill/sleight-of-hand) check opposed by the attacker's [Perception](ref/skill/perception) check. If the mesmerist succeeds, that ranged attack automatically misses, and the projectile appears stowed on the mesmerist's person. If the attacker is making a full attack, this affects only one of the attacks (of the mesmerist's choice). If the attack is made with a [javelin](ref/eq-weapon/javelin) or other thrown weapon, the attacker gains a +4 bonus on its Perception check.

Unusually massive ranged weapons (such as boulders or ballista bolts) and ranged attacks generated by natural attacks or spell effects are not affected by this ability.'''

[[entry]]
id = "ref/trick/vision-of-blood"
anchor = "vision-of-blood"
print = "When an enemy is struck by the subject, it believes its wound is far more severe, and the shock overwhelms it. The mesmerist can trigger this trick when the subject hits with an attack using a weapon, a natural weapon, or an unarmed strike. The attack's target must succeed at a Will saving throw or be [stunned](ref/misc/stunned) for 1 round. If the triggering attack was a critical hit, the target doesn't get a saving throw."
