[[entry]]
id = "ref/implement/enchantment"
anchor = "energy-blast"
print = "As a standard action that provokes attacks of opportunity, you can expend 2 points of mental focus to unleash a blast of energy. This blast has a range of 100 feet, and deals 5d6 points of energy damage, plus an additional 1d6 points for every 2 occultist levels you possess beyond 5th (6d6 at 7th, 7d6 at 9th, and so on, to a maximum of 12d6 at 19th level). The blast deals damage to each creature in a 20-foot-radius burst, but each affected creature can attempt a Reflex save to halve the damage. When you unleash an energy blast, you must decide what type of damage it deals (acid, cold, electricity, or fire). You must be at least 5th level to select this focus power."

[[entry]]
id = "ref/implement/enchantment"
anchor = "energy-ward"
print = "As a standard action, you can expend 1 point of mental focus to surround yourself in a swirling ward of energy. When you activate this power, you must select acid, cold, electricity, or fire. You gain resistance 10 against that energy type, and whenever a creature hits you with a melee weapon or natural weapon, that creature takes 1d6 points of energy damage of the chosen type. Attacks made with melee weapons with reach don't cause the attacker to take this damage. At 13th and 19th levels, the resistance granted by this ward increases by 5, to a maximum of resistance 20 at 19th level. The energy ward lasts for 1 round per occultist level. You must be at least 7th level to select this focus power."

[[entry]]
id = "ref/implement/enchantment"
anchor = "light-matrix"
print = "As a standard action, you can expend 1 point of mental focus to create a glowing orb of swirling lights that obeys your commands. This orb illuminates the area like the _light_ spell. The orb can be commanded to hover over your shoulder, moving with you. As a move action, you can direct it to move up to 30 feet away from you. If the light matrix is ever more than 30 feet away from you, it returns to hover over your shoulder. If you are at least 5th level, you can direct the light matrix to make a melee touch attack against one foe within 30 feet. If the attack hits, the target must succeed at a Fortitude save or be blinded for 1d4 rounds by a flash of light. If the attack hits, regardless of whether the target succeeds at the save, the light matrix immediately ends. The light matrix otherwise has a duration of 1 hour per occultist level you possess. You can't have more than one light matrix in existence at one time. If you use this power again, any previous light matrices immediately end."

[[entry]]
id = "ref/implement/enchantment"
anchor = "radiance"
print = "As a standard action, you can touch a weapon to cause it to glow with light by expending 1 point of mental focus. The weapon produces light like a torch. For the purpose of darkness spells and abilities, this effect counts as a light spell of level 0, plus 1 additional spell level for every 2 occultist levels you possess. This light lasts for 1 minute per occultist level you possess. In addition, whenever the weapon scores a critical hit against a foe, the wielder can choose to end the effect, causing the foe to be surrounded by the radiance for 1d4 rounds. While illuminated in this way, the target can't benefit from concealment or invisibility, nor can it attempt Stealth checks to avoid being seen. All attack rolls made against an illuminated foe receive a +2 circumstance bonus."

[[entry]]
id = "ref/implement/enchantment"
anchor = "shape-mastery"
print = "As part of casting an evocation spell with an area of effect, you can expend a number of points of mental focus up to your Intelligence modifier to exclude an equal number of squares from the area."

[[entry]]
id = "ref/implement/enchantment"
anchor = "wall-of-power"
print = "By expending 1 point of mental focus as a standard action, you can create a wall of pure energy with a length of up to 5 feet per occultist level you possess. This wall is 10 feet high and 1 foot thick. It doesn't block passage, line of sight, or line of effect, but does deal damage to anyone passing through it. The wall deals 2d6 points of energy damage + 1 point of energy damage per occultist level you possess. You must select acid, cold, electricity, or fire when you create the wall to determine the type of damage it deals. The wall must be straight, and can't pass through a creature's space when created. The wall lasts for 1 round per occultist level you possess. You must be at least 9th level to select this focus power."

[[entry]]
id = "ref/implement/enchantment"
anchor = "illusion-implements"
print = "Illusion implements allow the occultist to distort the senses and cloak creatures from sight."

[[entry]]
id = "ref/implement/enchantment"
anchor = "implements"
print = "Crystal, hat, mask, prism, ring."

[[entry]]
id = "ref/implement/enchantment"
anchor = "resonant-powers"
print = "Each time the occultist invests mental focus into an illusion implement, the implement grants the following resonant power. The implement's bearer gains the benefits of this power until the occultist refreshes his focus."

[[entry]]
id = "ref/implement/enchantment"
anchor = "distortion"
print = "The implement allows its bearer to distort his form and location, protecting him from harm. As a standard action, the bearer can gain a concealment miss chance equal to 5% for every point of mental focus invested in the implement (to a maximum of 5% + 5% for every 2 occultist levels you possess) until the next time the bearer makes an attack. If this miss chance reaches 50%, it doesn't increase further, but the bearer gains all the benefits of _invisibility_. Creatures with _see invisibility_, _true seeing_, or similar abilities ignore the miss chance from this ability."

[[entry]]
id = "ref/implement/enchantment"
anchor = "base-focus-power"
print = "All occultists who learn to use illusion implements gain the following focus power."

[[entry]]
id = "ref/implement/enchantment"
anchor = "minor-figment"
print = "As a standard action, you can expend 1 point of mental focus to create a minor figment. This can function as either _ghost sound_ or _minor image_. In either case, the effect lasts for a number of rounds equal to your occultist level. If you are 7th level or higher, the figment lasts for a number of minutes equal to your occultist level, and you can cause the figment to change once during its duration when a specified condition occurs."

[[entry]]
id = "ref/implement/enchantment"
anchor = "focus-powers"
print = "In addition to gaining the base focus power, occultists who learn to use illusion implements can select from the following focus powers when choosing the powers gained from their focus powers class feature."

[[entry]]
id = "ref/implement/enchantment"
anchor = "cloak-image"
print = "As a standard action, you can expend 1 point of mental focus to hide your appearance behind an illusion, as _disguise self_. The effect lasts for 1 minute per occultist level you possess. At 5th level, you can instead expend 2 points of mental focus to appear as a creature of a different type, but you must remain the same size. At 7th level, you can expend 1 additional point of mental focus to target a willing creature other than yourself with this ability."

[[entry]]
id = "ref/implement/enchantment"
anchor = "color-beam"
print = "As a standard action, you can expend 1 point of mental focus to unleash a beam of cascading colors at any one target within 30 feet. Doing so requires a ranged touch attack. If the beam hits, the target is blinded for 1 round if it has a number of Hit Dice equal to or lower than your occultist level. A foe with a number of Hit Dice greater than your occultist level is instead dazzled for 1 round. The foe can attempt a Will save to negate the effect. Regardless of whether it succeeds at its save, the target is then immune to this effect for 1 day. This is a mind-affecting illusion effect."

[[entry]]
id = "ref/implement/enchantment"
anchor = "masquerade"
print = "As a standard action, you can expend 1 point of mental focus to take on the appearance of another creature that you touch. If the creature is not friendly to you, this requires a melee touch attack, but the target doesn't receive a saving throw to negate the effect. You gain a circumstance bonus on Disguise checks equal to your occultist level + 10, but only to look like the creature touched. This bonus doesn't stack with the bonuses from polymorph spells or spells like _disguise self_. While using this ability, you can change your disguise as a standard action by touching a different creature and assuming its appearance. You can end this effect at any time. This effect lasts for 10 minutes per occultist level you possess, but you can renew the duration at any time by expending 1 additional point of mental focus. You must be at least 7th level to select this focus power."

[[entry]]
id = "ref/implement/enchantment"
anchor = "mirage"
print = "As a standard action, you can expend 1 point of mental focus to cloak an area in illusion, allowing you to change the area's appearance. You can affect up to one 5-foot-cube area for every occultist level you posses, changing the appearance in a way that seems natural to the surroundings, subject to GM discretion. You could, for example, hide a door or passageway, make a table appear to be covered in food, or even create the illusion of a pit. You can't make creatures or objects invisible with this power, but you can change the appearance of an object or create an illusion for creatures to hide behind. This functions as _major image_, and creatures that physically interact with the illusion in any way can attempt a Will save to see through the mirage. You must be at least 5th level to select this focus power."

[[entry]]
id = "ref/implement/enchantment"
anchor = "shadow-beast"
print = "As a standard action, you can call forth one or more beasts made of shadow by expending 1 point of mental focus. This functions as _shadow conjuration_, but it can be used to duplicate only the effects of _summon monster_ spells. Creatures created with this spell deal 50% of the normal damage to those that disbelieve the illusion, and their nondamaging effects have only a 50% chance of affecting disbelieving targets. This can be used to duplicate any _summon monster_ spell up to _summon monster V_. For every 2 additional levels you possess beyond 9th, the maximum spell level you can duplicate with this ability increases by 1 (to a maximum of _summon monster IX_ at 17th level). Regardless of the spell duplicated, the creatures remain for 1 round per occultist level you possess. You must be at least 9th level to select this focus power."

[[entry]]
id = "ref/implement/enchantment"
anchor = "unseen"
print = "As a standard action, you can expend 1 point of mental focus to become invisible, as _invisibility_. This effect lasts for 1 minute per occultist level you possess. You can expend 2 points of mental focus instead of 1 to use this power on a willing adjacent creature instead of yourself. You can still see creatures you make invisible with this power. If the invisible creature makes an attack or otherwise takes an action that would cause the invisibility to end, you can immediately expend 1 additional point of mental focus to allow the creature to remain invisible if the creature is within 30 feet of you. You must be at least 3rd level to select this focus power."

[[entry]]
id = "ref/implement/enchantment"
anchor = "necromancy-implements"
print = "Implements that draw power from necromancy can control undead and harm the living."

[[entry]]
id = "ref/implement/enchantment"
anchor = "implements"
print = "Bone, coin, doll, drum, robe, skull."

[[entry]]
id = "ref/implement/enchantment"
anchor = "resonant-powers"
print = "Each time the occultist invests mental focus into a necromancy implement, the implement grants the following resonant power. The implement's bearer gains the benefits of this power until the occultist refreshes his focus."

[[entry]]
id = "ref/implement/enchantment"
anchor = "necromantic-focus"
print = "The implement grants its possessor greater power over the undead. Whoever possesses the implement can control an additional 2 Hit Dice of undead for every point of mental focus invested in the item (to a maximum number of Hit Dice equal to 4 × your occultist level). Any spellcaster who bears the implement can add it as an additional focus component for a necromancy spell he casts to create undead. If he does so, he can create an additional number of HD of undead equal to the additional HD the implement allows him to control (apply this effect after doubling the HD of undead for _desecrate_, if applicable). Undead creatures take a -1 penalty on saving throws against spells cast by the bearer of this implement for every 4 points of mental focus invested in this implement."

[[entry]]
id = "ref/implement/enchantment"
anchor = "base-focus-power"
print = "All occultists who learn to use necromancy implements gain the following focus power."

[[entry]]
id = "ref/implement/enchantment"
anchor = "mind-fear"
print = "As a standard action, you can expend 1 point of mental focus to cause a living creature to succumb to fear. The target must be within 30 feet of you, and it can attempt a Will saving throw to negate the effect. If the target fails the save and has a number of Hit Dice less than or equal to yours, it is frightened for 1d4 rounds. If the target fails the saving throw and has a number of Hit Dice greater than yours, it is instead shaken for 1d4 rounds. This is a mind-affecting fear effect."

[[entry]]
id = "ref/implement/enchantment"
anchor = "focus-powers"
print = "In addition to gaining the base focus power, occultists who learn to use necromancy implements can select from the following focus powers when choosing the powers gained from their focus powers class feature."

[[entry]]
id = "ref/implement/enchantment"
anchor = "flesh-rot"
print = "As a standard action, you can make a melee touch attack and expend 1 point of mental focus to cause the flesh of a living creature to rot and wither. If the attack hits, the target takes 1d8 points of damage + 1 point per occultist level you possess. For every 4 occultist levels you possess beyond 3rd, the target takes an additional 1d8 points of damage (to a maximum of 5d8 at 19th level). If you miss with the melee touch attack, this power is wasted with no effect. You must be at least 3rd level to select this focus power."

[[entry]]
id = "ref/implement/enchantment"
anchor = "necromantic-servant"
print = "As a standard action, you can expend 1 point of mental focus to raise a single human skeleton (_Pathfinder RPG Bestiary_ 250) or human zombie (_Bestiary_ 288) from the ground to serve you for 10 minutes per occultist level you possess or until it is destroyed, whichever comes first. This servant has a number of hit points equal to 1/2 your maximum hit point total (not adjusted for temporary hit points or other temporary increases). It also uses your base attack bonus and gains a bonus on damage rolls equal to 1/2 your occultist level. At 5th level, whenever the necromantic servant would be destroyed, if you are within medium range (100 feet + 10 feet per level) of the servant, you can expend 1 point of mental focus as an immediate action to cause the servant to return to full hit points. At 9th level, you can choose to give the servant the bloody or burning simple template (if it's a skeleton) or the fast simple template (if it's a zombie). At 13th level, when you take an immediate action to restore your servant, it splits into two servants. You can have a maximum number of servants in existence equal to 1/2 your occultist level. At 17th level, the servant gains a teamwork feat of your choice."

[[entry]]
id = "ref/implement/enchantment"
anchor = "pain-wave"
print = "As a standard action, you can expend 1 point of mental focus to unleash a wave of pain. This wave hits all creatures other than you in a 20-foot-radius burst centered on a point that you designate within 100 feet. All living creatures in this area are wracked with pain, gaining the sickened condition for 1 round per occultist level you possess. Affected creatures can attempt a Will save to reduce the duration to just 1 round. This is a mind-affecting pain effect. You must be at least 7th level to select this focus power."

[[entry]]
id = "ref/implement/enchantment"
anchor = "psychic-curse"
print = "As a standard action, you can expend 1 point of mental focus to curse a living creature within 30 feet with your psychic magic. You can choose one of the following effects: memory lapse, mental block, or pain confusion. If you choose memory lapse, the target loses its memory of the past 1 hour per occultist level you possess. If you choose mental block, you can proscribe one specific action, such as attacking with a type of weapon, casting a specific spell, or something else suitably specific (subject to the GM's discretion). The target can't take that action without first succeeding at a Will save. If it fails, it can take other actions instead. If it attempts the prohibited action again on subsequent rounds, it gains a cumulative +2 bonus on the save until it succeeds."

[[entry]]
id = "ref/implement/evocation"
anchor = "opening"
print = "30 feet that watches a 5-foot-square area. Whenever any creature enters that square, you receive a mental image of the creature as long as you are on the same plane as the sensor. The sensor remains active for 10 minutes per occultist level you possess. The image will not wake you from slumber, although you do receive all of the images the sensor collected once you wake up. The sensor can be deceived by _invisibility_ and similar magic. You can expend additional points of mental focus when creating the eye to increase the size of the square by 5 feet per additional point spent (to 10 feet square, 15 feet square, and so on)."

[[entry]]
id = "ref/implement/evocation"
anchor = "enchantment-implements"
print = "Enchantment implements allow the occultist to befuddle the mind and charm his foes."

[[entry]]
id = "ref/implement/evocation"
anchor = "implements"
print = "Censer, crown, helm, musical instrument, necklace."

[[entry]]
id = "ref/implement/evocation"
anchor = "resonant-powers"
print = "Each time the occultist invests mental focus into an enchantment implement, the implement grants the following resonant power. The implement's bearer gains the benefits of this power until the occultist refreshes his focus."

[[entry]]
id = "ref/implement/evocation"
anchor = "glorious-presence"
print = "The implement invokes the presence of those who have worn it in the past. The implement's wearer gains a +1 competence bonus on all Charisma-based skill checks and ability checks for every 2 points of mental focus invested in the implement, to a maximum bonus of 1 + 1 for every 4 occultist levels you possess."

[[entry]]
id = "ref/implement/evocation"
anchor = "base-focus-power"
print = "All occultists who learn to use enchantment implements gain the following focus power."

[[entry]]
id = "ref/implement/evocation"
anchor = "cloud-mind"
print = "As a standard action, you can expend 1 point of mental focus to cloud the mind of one foe within 30 feet. That foe is dazed for 1 round if the number of Hit Dice it possesses is less than or equal to or your occultist level. If it has more Hit Dice than your occultist level, it is staggered for 1 round instead. The foe can attempt a Will saving throw to negate the effect. Whether or not it succeeds at the save, the target is then immune to this effect for 1 day. This is a mind-affecting effect."

[[entry]]
id = "ref/implement/evocation"
anchor = "focus-powers"
print = "In addition to gaining the base focus power, occultists who learn to use enchantment implements can select from the following focus powers when choosing the powers gained from their focus powers class feature."

[[entry]]
id = "ref/implement/evocation"
anchor = "binding-pattern"
print = "As a standard action, you can expend 1 point of mental focus to create a binding pattern of psychic energy that causes a living creature to become paralyzed. The target must be within 30 feet of you, and it can attempt a Will saving throw to negate the effect. If it fails the save, it is paralyzed for 1 round for every 2 occultist levels you possess. At the end of each of its turns, it can attempt another Will save to end the paralyzed effect and instead be staggered for the remaining duration. This is a mind-affecting compulsion effect. You must be at least 7th level to select this focus power."

[[entry]]
id = "ref/implement/evocation"
anchor = "forced-alliance"
print = '''
As a standard action, you can alter a living creature's mind, causing it to see you as a friend and ally. If the creature is the same creature type as you, this power requires you to expend 1 point of mental focus; if it's is not, you must expend 2 points instead. The creature can attempt a Will save to negate this effect. If it fails the saving throw, the creature treats you as an ally and doesn't attempt to harm you (although your allies are not protected). You can call on the creature to aid you directly, but while doing so the creature can attempt a new Will save at the end of each round to end the effect. This effect otherwise lasts 1 round per occultist level you possess.

This is a mind-affecting charm effect.

You must be at least 5th level to select this focus power.'''

[[entry]]
id = "ref/implement/evocation"
anchor = "inspired-assault"
print = "As a standard action, you can inspire a living creature with a touch by expending 1 point of mental focus. The creature receives a morale bonus on attack rolls equal to 1 + 1 for every 6 occultist levels you possess (to a maximum bonus of +4 at 18th level). This bonus also applies on saving throws against fear effects. This bonus lasts for 1 minute."

[[entry]]
id = "ref/implement/evocation"
anchor = "mental-discord"
print = "As a standard action, you can expend 1 point of mental focus to disrupt the mind of one living creature within 30 feet. The creature can attempt a Will saving throw to negate the effect. If it fails the save, the creature can't concentrate on any spell effects and must succeed at a concentration check to cast any spell (DC = 15 + double the spell level). The affected creature takes a -4 penalty on this check if the spell includes a thought component. The creature takes a -2 penalty on all Will saving throws while under this effect. This effect lasts for 1 round per occultist level you possess."

[[entry]]
id = "ref/implement/evocation"
anchor = "mind-slumber"
print = "By expending 1 point of mental focus as a standard action, you can lull a living creature into a deep mental slumber, forcing it to view the world as a dream. The target must be within 30 feet of you, and it can attempt a Will saving throw to negate the effect. If it fails the save, the creature falls asleep, although it still perceives the world around it as a dream. This doesn't cause the creature to fall prone, but it does drop whatever it is holding. The creature can't take any actions while in this state, but it isn't helpless—it perceives danger as part of its dream. The creature remains asleep for a number of rounds equal to your occultist level or until it takes any amount of damage, which immediately wakes it. At the end of each of its turns, it receives another Will saving throw to end the effect. The creature can be manipulated or examined without waking it, but it can't be moved from its square without waking it. This is a mind-affecting compulsion effect. Regardless of whether it succeeds at the save, the target is then immune to this effect for 24 hours. You must be at least 3rd level to select this focus power."

[[entry]]
id = "ref/implement/evocation"
anchor = "obey"
print = "As a standard action, you can issue a command to one living creature by expending 1 point of mental focus. This functions as _command_. The target must be within 30 feet and capable of understanding your order. The target can attempt a Will save to negate this effect. If the creature is the same creature type as you, it takes a -2 penalty on this saving throw."

[[entry]]
id = "ref/implement/evocation"
anchor = "evocation-implements"
print = "Implements focused on evocation grant the ability to create and direct energy to protect and to destroy."

[[entry]]
id = "ref/implement/evocation"
anchor = "implements"
print = "Gloves, rod, staff, wand."

[[entry]]
id = "ref/implement/evocation"
anchor = "resonant-powers"
print = "Each time the occultist invests mental focus into an evocation implement, the implement grants the following resonant power. The implement's bearer gains the benefits of this power until the occultist refreshes his focus."

[[entry]]
id = "ref/implement/evocation"
anchor = "intense-focus"
print = "The implement channels and enhances the effects of damaging evocations. A spellcaster who bears the implement can add the implement as an additional focus component for any of his damaging evocation spells that have an instantaneous duration or focus powers with an instantaneous duration. If he does so, the spell or focus power deals 1 additional point of damage of the same type to each creature for every 2 points of mental focus invested in the implement, to a maximum of 1 + 1 for every 2 occultist levels you possess."

[[entry]]
id = "ref/implement/evocation"
anchor = "base-focus-power"
print = "All occultists who learn to use evocation implements gain the following focus power."

[[entry]]
id = "ref/implement/evocation"
anchor = "energy-ray"
print = "As a standard action that provokes attacks of opportunity, you can expend 1 point of mental focus to unleash a ray of pure energy as a ranged touch attack. This ray has a range of 30 feet. The ray deals an amount of energy damage equal to 1d6 points + 1d6 points for every 2 occultist levels you possess beyond 1st (2d6 at 3rd level, 3d6 at 5th, and so on, to a maximum of 10d6 at 19th level). When you unleash an energy ray, you must decide what type of damage it deals (acid, cold, electricity, or fire)."

