[[entry]]
id = "ref/emotionalfocus/zeal"
anchor = "half-orcs"
print = "Abilities firmly rooted in the mind might not seem like a fit for half-orcs—at least, according to the common perception of half-orcs. However, psychic abilities sometimes get handed down, typically from a human parent. When orc blood contributes psychic talent, it usually manifests as kineticist abilities. The following options are open to all half-orcs who have the listed favored class."

[[entry]]
id = "ref/emotionalfocus/zeal"
anchor = "kineticist"
print = "Add 1/3 point of fire damage to fire-element blasts that deal fire damage."

[[entry]]
id = "ref/emotionalfocus/zeal"
anchor = "medium"
