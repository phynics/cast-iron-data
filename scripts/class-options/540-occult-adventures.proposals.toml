id = "ref/emotionalfocus/fear"
anchor = "shared-hatred"
print = "When the spiritualist reaches 17th level, the phantom can grant its hatred to others. When the phantom designates a hated enemy, its allies also gain a +2 bonus on attack rolls and a +4 bonus on damage rolls against that enemy. Furthermore, the phantom can use its hated target ability even when in incorporeal form; when it does, it can make slam attacks against a corporeal creature, but only if that corporeal creature is its hated target. Jealousy A phantom with this emotional focus is covetous of everything—its master, those who wish to do it harm, and any who do not pay attention to it. It demands to be the center of attention at all times. The forms these phantoms take are as diverse as the forms of jealousy in life. Often they take pleasing forms, wishing to draw others in. Other times they take the form of crawling and lurching things, grasping at all they covet when they come within reach. The auras of these needy phantoms quickly change in color, going from an oily green to orange, to brownish red as they swirl through emotions in their efforts to gain the objects of their dark desires."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "skills"
print = "The phantom gains a number of ranks in Appraise and Bluff equal to its number of Hit Dice. While confined in the spiritualist's consciousness, the phantom grants the spiritualist Skill Focus in each of these skills."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "good-saves"
print = "Reflex and Will."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "deceitful"
print = "The phantom gains Deceitful as a bonus feat."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "jealous-combatant"
print = "Each time the phantom hits a creature with a melee attack, for 1 round that creature takes a -2 penalty on all attack rolls made against anyone other than the phantom. This effect does not stack with itself."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "resentful-aura"
print = "When the spiritualist reaches 7th level, as a swift action, the phantom can emit a 20-foot-radius aura that forces enemies within the aura who make an attack or cast a spell that does not include the phantom in its effect to succeed at a Will saving throw (DC = 10 + 1/2 the phantom's Hit Dice + the phantom's Charisma modifier) or become staggered until the end of the enemy's next turn. Ending the aura is a free action. The phantom can use this ability in either ectoplasmic or incorporeal form."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "retribution"
print = "When the spiritualist reaches 12th level, each time a creature attacks the phantom's master, whether that attack hits or misses, it enrages the phantom. Until the end of the phantom's next turn, any attack the phantom makes that hits the creature that has attacked her deals 2d8 extra points of damage. This extra damage is precision damage."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "mine-to-take"
print = "When the spiritualist reaches 17th level, once per day as an immediate action, just before the phantom's master is about to attempt a saving throw or be targeted by an attack roll, the phantom and the spiritualist can swap places as long as both are on the same plane and the phantom is aware of the attack or effect. After the swap occurs, the phantom is targeted by the attack or effect that triggered this ability, though the phantom may be immune or resistant to the effect. This is a teleportation effect. The phantom can use this ability in either ectoplasmic or incorporeal form. Zeal A phantom with this emotional focus fixates on every task given as if it were the phantom's last. The most basic commands are treated as life-and-death situations, and the truly dangerous ones are faced with a resolve and tenacity that sometimes defies common sense. Zeal phantoms take the form of steadfast protectors or daring and manic creatures looking for the next challenge or opportunity to prove itself to either its master or itself. Often very prideful creatures, these phantoms display an orange aura upon completing their tasks. They are prone to boast about their accomplishments and chastise those around them for not accomplishing more."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "skills"
print = "The phantom gains a number of ranks in Acrobatics and Survival equal to its number of Hit Dice. While confined in the spiritualist's consciousness, the phantom grants the spiritualist Skill Focus in each of these skills."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "good-saves"
print = "Fortitude and Reflex."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "tracking"
print = "The phantom adds half its number of Hit Dice (minimum 1) to Survival skill checks to follow tracks."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "ruthless-combatant"
print = "The phantom threatens a critical hit with its slam attacks on a roll of 19–20. When the spiritualist reaches 11th level, the phantom's critical modifier with slam attacks increases to ×3. This doesn't stack with Improved Critical or similar effects."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "determination-aura"
print = "When the spiritualist reaches 7th level, as a swift action, the phantom can emit a 20-foot-radius aura that grants its zeal to nearby allies. Allies within the aura gain a +2 competence bonus on attack rolls and saving throws. The phantom can use this ability in either ectoplasmic or incorporeal form."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "steadfast-servant"
print = "When the spiritualist reaches 12th level, the phantom can stay manifested even when its spiritualist master is unconscious or asleep."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "zeal-s-resolve"
print = "When the spiritualist reaches 17th level, three times per day as a free action, when the phantom misses with an attack roll or fails a saving throw, it can reroll the failed attack or saving throw. It must take the new result, even if that result is worse."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "racial-favored-class-options"
print = '''
The rules below allow members of races from the _Pathfinder RPG Core Rulebook_ to take alternate rewards when they gain a level in a favored class chosen from among the classes in this book. The racial favored class options listed in _Pathfinder RPG Advanced Race Guide_ cover the classes from the _Core Rulebook_, _Pathfinder RPG Advanced Player's Guide_, _Pathfinder RPG Ultimate Combat_, and _Pathfinder RPG Ultimate Magic_. Such options for the classes presented in the _Pathfinder RPG Advanced Class Guide_ are covered in that volume.

Each of these rewards replaces the normal reward for having a level in a favored class (gaining 1 extra hit point or 1 extra skill rank). Unlike those general rewards, the alternate favored class options speak directly to the features of specific classes and the general tendencies of various races.

Whenever you gain a level in a favored class, you can choose which favored class option you take. Unless otherwise noted, these benefits always stack with themselves.

Many of these alternate class rewards add only 1/2, 1/3, 1/4, or 1/6 to a roll (rather than 1) each time the reward is selected, or add 1/2, 1/3, 1/4, or 1/6 to a class ability (such as adding to a mesmerist's number of mesmerist tricks per day or the total number of points in a psychic's phrenic pool). When applying such a benefit to a die roll or class ability, always round down (to a minimum of 0). You may thus need to select such an option several times before the benefit takes effect. If an alternate favored class option modifies a class feature or ability, it can't be taken before the character has that class feature or ability. For example, if a class gains a class feature at 6th level, a character couldn't take a racial favored class option that applies to that class feature until 6th level, even if the benefit from that option wouldn't be high enough to add a bonus until a later level.

Some options may have a fixed numerical limit, after which selecting that favored class reward again has no effect. In these cases, you can always select from among the standard rewards when taking a level in a favored class (gaining 1 extra hit point or 1 extra skill rank).

Abilities from favored class options that increase a character's caster level for the purpose of determining the duration of certain spells apply this increase after other effects that adjust a spell's duration, such as Extend Spell.'''

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "dwarves"
print = "Some dwarven communities place a social stigma on psychic abilities due to the association of such powers with their slaver cousins, the duergar. Occultists avoid this stigma by establishing a connection to the storied relics of dwarven history. Dwarven spiritualists might connect with spirits of dwarves who fell in battle, and dwarven mediums might hone their talents so they can contact the great heroes of dwarven lore. Still, the most common path for a psychic dwarf is a kineticist focusing on earth and metal wild talents. The following options are open to all dwarves who have the listed favored class."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "kineticist"
print = "Add 1/3 point of damage to earth element blasts that deal damage."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "medium"
print = "Gain a +1/2 bonus on saving throws against possession and a +1/2 bonus on saving throws to end haunt channeler, location channel, and spacious soul."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "mesmerist"
print = "Increase painful stare's damage by 1/4 point."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "occultist"
print = "Gain a +1/3 bonus on Appraise and Use Magic Device checks involving stone and metal objects."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "psychic"
print = "When casting psychic abjuration spells, add 1/2 level to the effective caster level of the spell, but only to determine the spell's duration."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "spiritualist"
print = "Add 1/6 to the shield bonus granted by the 3rd-level ectoplasmic bonded manifestation ability."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "elves"
print = "The same keen intellects and careful study elves use to explore the arcane arts also apply to their study of the occult and psychic magic. Elves who explore their own psyches typically embark on mental expeditions after thorough study of psychic phenomena. They approach their own minds deliberately, keeping detailed chronicles of what they experience both without and within. The following options are open to all elves who have the listed favored class."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "kineticist"
print = "Gain a +1/4 bonus on damage rolls that apply the kineticist's elemental overflow bonus."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "medium"
print = "Gain a +1/3 bonus on all skill checks using occult skill unlocks."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "mesmerist"
print = "Gain a +1/2 bonus on Acrobatics checks to move through a threatened area and a +1/2 bonus on Bluff checks to feint."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "occultist"
print = "Increase the occultist's total number of points of mental focus by 1/2 point."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "psychic"
print = "Increase the total number of points in the psychic's phrenic pool by 1/3 point."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "spiritualist"
print = "Add 1/6 to the shield bonus granted by the 3rd-level ectoplasmic bonded manifestation ability."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "gnomes"
print = "Mental trickery comes naturally to gnomes. They're predisposed to like psychic magic, with its off beat and obscure practices. Each type of occult class holds its own appeal for gnomes, from the kineticist's innate feel for magic to the occultist's fascination with trinkets. The following options are open to all gnomes who have the listed favored class."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "kineticist"
print = "Gain a +1/2 bonus on Bluff, Diplomacy, Intimidate, and Sense Motive skill checks against creatures with the elemental subtype matching the kineticist's primary element."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "medium"
print = "Gain a +1/2 bonus on Bluff, Diplomacy, Intimidate, and Sense Motive skill checks against spirits, undead, phantoms, and creatures native to the Astral Plane."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "mesmerist"
print = "Increase the number of mesmerist tricks the mesmerist can use per day by 1/3."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "occultist"
print = "Increase the duration of the occultist's minor figment by 1 minute, and increase the total concealment miss chance from the occultist's distortion resonant power by 2%. This doesn't increase the maximum miss chance."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "psychic"
print = "Increase the total number of points in the psychic's phrenic pool by 1/3 point."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "spiritualist"
print = "Add 1/6 to the shield bonus granted to the spiritualist while under the effects of either spiritual interference or greater spiritual interference."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "half-elves"
print = "Many half-elves have a talent for forming and reinforcing social ties, and psychic half-elves find that mentally connecting to other creatures makes this even easier. They're especially skilled at the spiritual communication required for the medium class. Half-elves who hew more closely to their elven lineage often become psychics, and those with stronger human blood might become kineticists or mesmerists. The following options are open to all half-elves who have the listed favored class."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "kineticist"
print = "Gain a +1/4 bonus on damage rolls that apply the kineticist's elemental overflow bonus."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "medium"
print = "Gain a +1/3 bonus on all skill checks using occult skill unlocks."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "mesmerist"
print = "When casting mesmerist enchantment spells, add 1/2 to the effective caster level of the spell, but only to determine the spell's duration."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "occultist"
print = "Gain a +1/2 bonus on Spellcraft checks to identify the properties of magic items and a +1/2 bonus on Use Magic Device checks to emulate a race."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "psychic"
print = "Gain 1/6 of a new phrenic amplification."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "spiritualist"
print = "Add 1 skill rank to the spiritualist's phantom."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "half-orcs"
print = "Abilities firmly rooted in the mind might not seem like a fit for half-orcs—at least, according to the common perception of half-orcs. However, psychic abilities sometimes get handed down, typically from a human parent. When orc blood contributes psychic talent, it usually manifests as kineticist abilities. The following options are open to all half-orcs who have the listed favored class."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "kineticist"
print = "Add 1/3 point of fire damage to fire-element blasts that deal fire damage."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "medium"
print = "When gaining a taboo, the medium can use spirit surge without incurring influence an additional 1/4 time per day."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "mesmerist"
print = "Increase the mesmerist's bonus damage from painful stare by 1/2 point."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "occultist"
print = "Deal an additional 1/2 point of damage with focus powers."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "psychic"
print = "Gain a +1 bonus on concentration checks required because of taking damage while casting spells from the psychic class."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "spiritualist"
print = "Add 1 hit point to the spiritualist's phantom."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "halflings"
print = "It's a common belief that halflings get out of scrapes because of their good fortune, but for some, \"halfling luck\" is really a reflection of psychic talent. Many develop this ability into something greater to compensate for their small stature, and become particularly adept at inf luencing or manipulating people. The following options are open to all halflings who have the listed favored class."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "kineticist"
print = "Increase the capacity of the kineticist's internal buffer by 1/6 point."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "medium"
print = "Increase the bonus the medium gains from its seance boon by 1/3 point. This doesn't increase the bonus allies gain from shared seance."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "mesmerist"
print = "Increase the number of mesmerist tricks the mesmerist can use per day by 1/3."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "occultist"
print = "Add 1/2 point of mental focus per day."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "psychic"
print = "The psychic treats her Charisma bonus as 1/3 point higher for the purpose of determining the number of uses or rounds per day of her discipline powers."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "spiritualist"
print = "Add 1/4 to the number of rounds that the spiritualist's incorporeal phantom can be out of sight and line of effect before being sent back to the Ethereal Plane."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "humans"
print = "Lacking traditions on which to base their understanding of the occult, psychic humans often join strange cults to develop their mental talents. Others engage in private study, collecting writings of questionable veracity that cover occult topics. A large number of humans are fascinated with occult topics even if they aren't sensitive to psychic phenomena, and they can be quick to follow anyone who demonstrates even minor abilities with psychic magic. The following options are open to all humans who have the listed favored class."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "kineticist"
print = "Gain 1/6 of an Extra Wild Talent feat."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "medium"
print = "When gaining a taboo, the medium can use spirit surge without incurring influence an additional 1/4 time per day."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "mesmerist"
print = "Increase the mesmerist's towering ego bonus by 1/3 point (to a maximum increase of +2)."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "occultist"
print = "Gain 1/6 of a new focus power."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "psychic"
print = "Add one spell known from the psychic spell list. This spell must be at least 1 level lower than the highest spell level the psychic can cast."

[[entry]]
id = "ref/emotionalfocus/fear"
anchor = "spiritualist"
print = "Add 1 skill rank or 1 hit point to the spiritualist's phantom."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "opening"
print = "this emotional focus has a strong familial tie with its spiritualist master. A dedication phantom most often appears as a strong and stern protector with a watchful gaze, and its service to its spiritualist is unwavering. These spirits exude auras of blue, or sometimes rose if their love for their spiritualist masters in life was great. Many times these auras manifest as a halo, giving these phantoms a divine appearance, no matter their actual alignment or opinions on matters of religion."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "skill"
print = "The phantom gains a number of ranks in Diplomacy and Sense Motive equal to its number of Hit Dice. While confined in the spiritualist's consciousness, the phantom grants the spiritualist Skill Focus in each of these skills."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "good-saves"
print = "Reflex and Will."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "iron-will"
print = "The phantom gains Iron Will as a bonus feat. Furthermore, when the phantom is within its master's consciousness, it grants the benefits of Iron Will to its master if its master doesn't have that feat."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "dutiful-strike"
print = "When a creature makes an attack against the phantom's master, the phantom gains a +2 bonus on attack rolls against that target, and deals damage against that target as if the phantom were one size category larger. For the purposes of this ability, an attack includes any harmful spell targeting the spiritualist master of whose area or effect includes the spiritualist master. Dutiful strike lasts for 1 minute, until another creature attacks the phantom's spiritualist master (at which point this effect transfers to the new attacker), or until the attacking creature is reduced to fewer than 0 hit points, whichever occurs first."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "defending-aura"
print = "When the spiritualist reaches 7th level, the phantom can emit a 10-foot-radius aura that grants protection to nearby allies. It can activate this aura at will as a swift action. Allies within the aura gain a +2 deflection bonus to AC and a +2 bonus to CMD and on all saving throws. Deactivating the aura is a free action."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "devoted-servant"
print = "When the spiritualist reaches 12th level and is caught unawares by an attack (such as an attack made in a surprise round or while the spiritualist is asleep or an attack by a creature using Stealth), if the phantom is not fully manifested, it automatically fully manifests from the spiritualist's consciousness to protect its master. The phantom stays manifested as long as the spiritualist is unaware and in danger. This ability requires no action from the spiritualist."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "steadfast-devotion"
print = '''
When the spiritualist reaches 17th level, the phantom becomes immune to detrimental mind-affecting effects and all forms of possession, such as _magic jar_ and _possession_ (see page 181). Furthermore, the phantom is immune to _banishment_, _dismissal_, and similar effects.

Despair Some creatures die in such horrific ways, or live such pointless and senseless lives, that despair grips their very beings. Phantoms with this focus use misery as a weapon, inflicting the living with the gloom of the phantoms' continued existence. Despair phantoms often appear twisted or wounded, showing the grisly circumstances of their demise.

Their coloration tends to have a grayish or sickly green cast. When they speak, they do so in terrifying whispers or high-pitched screeches.'''

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "skills"
print = "The phantom gains a number of ranks in Intimidate and Stealth equal to its number of Hit Dice. While confined in the spiritualist's consciousness, the phantom grants the spiritualist [Skill Focus](ref/feat/skill-focus) in each of these skills."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "good-saves"
print = "Fortitude and Will."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "power-from-despair"
print = "The phantom gains a +2 bonus on attack and damage rolls against creatures that are shaken, frightened, panicked, cowering, or subject to effects such as aura of despair or _crushing despair_."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "miserable-strike"
print = "If the phantom hits a creature with a slam attack, that creature must succeed at a Will saving throw (DC = 10 + 1/2 the phantom's Hit Dice + the phantom's Charisma modifier) or take a -2 penalty on attack and damage rolls for 1 round. This is a mind-affecting fear and emotion effect. Penalties from multiple hits don't stack with themselves."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "aura-of-despair"
print = "When the spiritualist reaches 7th level, as a swift action, the phantom can emit a 10-foot aura of despair. Enemies within the aura take a -2 penalty on all saving throws. This is a fear effect. Deactivating the aura is a free action."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "despairing-shout"
print = "When the spiritualist reaches 12th level, three times per day as a standard action, the phantom can emit a shout that acts as _crushing despair_. The phantom uses its Hit Dice as its caster level for the effect, and the DC of the effect equals 10 + 1/2 the phantom's Hit Dice + the phantom's Charisma modifier. The phantom can use this ability in either ectoplasmic or incorporeal form."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "inescapable-despair"
print = "When the spiritualist reaches 17th level, if the phantom hits with its slam attack, the creature hit doesn't get a save to resist the effects of miserable strike. Fear A phantom with this emotional focus suffered from overwhelming fear in life. As a phantom, it is able to channel that fear into a terrifying weapon. Fear phantoms are often horrifying to behold. Sometimes they appear as ghostly figures in tattered funeral garb or wrapped in chains or other bindings. Their features may be distorted into gaunt and haunting forms, making them seem more like ghosts or spectres. A miasma of livid gray swirling motes often surrounds their forms as they stalk their surroundings, seeking to bestow their terror on others."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "skills"
print = "The phantom gains a number of ranks in Intimidate and Stealth equal to its number of Hit Dice. While confined in the spiritualist's consciousness, such a phantom grants the spiritualist Skill Focus in each of these skills."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "good-saves"
print = "Reflex and Will."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "stealthy"
print = "The phantom gains Stealthy as a bonus feat."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "horrifying-strike"
print = "If the phantom hits a creature with a slam attack, that creature must succeed at a Will saving throw (DC = 10 + 1/2 the phantom's Hit Dice + the phantom's Charisma modifier) or be shaken for 1d4 rounds. Multiple attacks against the same creature do not cause the creature to become frightened. This is a mind-affecting fear effect."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "increase-fear"
print = "When the spiritualist reaches 7th level, as a swift action, the phantom can emit a 20-foot-radius aura that amplifies the fear conditions of enemies within it if they fail their Will saving throws (DC = 10 + 1/2 the phantom's Hit Dice + the phantom's Charisma modifier). A shaken enemy in the aura becomes frightened, a frightened creature becomes panicked, and a panicked creature cowers. This effect lasts either as long as the enemy stays within the aura and is under the condition of the initial fear effect, or for a number of rounds after it leaves the aura equal to 1/2 the phantom's Hit Dice, or until the end of the original fear effect's duration, whichever comes first. A creature that succeeds at the saving throw is immune to this effect from the same phantom for 24 hours. This is a mind-affecting fear effect. The phantom can use this ability in either ectoplasmic or incorporeal form."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "frightful-attack"
print = "When the spiritualist reaches 12th level, if the phantom hits with a slam attack, it can frighten those it hits instead of causing them to be shaken (the phantom chooses when it makes the attack). This is a mind-affecting fear effect."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "shelter-allies"
print = '''
When the spiritualist reaches 17th level, the phantom protects its allies from terror. Allies within the phantom's increase fear aura are immune to fear as long as they are within the aura. This ability also grants the phantom's spiritualist master immunity to fear as long as the phantom is not banished to the Ethereal Plane. Hatred Few things draw a spirit toward the Negative Material Plane like the emotion of hatred. Phantoms with this focus often are blinded by—and blind others with—this powerful emotion. These phantoms are frequently darker and more foreboding than all but those phantoms with the fear emotional focus. Many of them manifest as dark and dreadful knights, their armor bristling with spikes and their hands seeming to grasp barbed and terrible weapons. Other times they appear as tall, gaunt figures staring down arrogantly at those who approach.

These phantoms typically spew a string of curses at their foes, often profane, sometimes poetic. Their auras are pulsating and pitch black, and thrum violently when these horrible phantoms attack.'''

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "skills"
print = "The phantom gains a number of ranks in Acrobatics and Perception equal to its number of Hit Dice. While confined in the spiritualist's consciousness, the phantom grants the spiritualist Skill Focus in each of these skills."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "good-saves"
print = "Fortitude and Reflex."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "weapon-finesse"
print = "The phantom gains [Weapon Finesse](ref/feat/weapon-finesse) as a bonus feat."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "hated-target"
print = "The phantom can take a move action to designate one creature within its line of sight as a hated target. The phantom gains a +2 bonus on attack rolls against its hated target, and a bonus on damage rolls equal to 1/2 the phantom's Hit Dice (minimum 1). The phantom is so focused on this hated target that it takes a -2 penalty on attack rolls against all other creatures. The phantom can maintain these bonuses against only one target at a time, and these bonuses remain in effect until either the hated opponent is dead or it has been out of the phantom's line of sight for at least 1 minute. When the spiritualist reaches 7th level, the phantom can use this ability as a swift action, and takes no penalty when attacking creatures that are not designated as its hated enemy. The phantom must be manifested in ectoplasmic form to use this ability (unless the spiritualist is 17th level or higher; see Shared Hatred below)."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "hateful-aura"
print = "When the spiritualist reaches 7th level, as a swift action, the phantom can emit a 10-foot-radius aura that inflicts pain upon the minds of those who dare damage it or its master. Enemies within the aura that deal damage to the spiritualist or the phantom take an amount of damage equal to the phantom's Charisma bonus. This is a mind-affecting pain effect. The phantom can use this ability in either ectoplasmic or incorporeal form."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "sneak-attack"
print = "When the spiritualist reaches 12th level, the phantom gains [sneak attack](ref/ability/sneak-attack) +3d6, but only against its hated enemy. At 18th level, the sneak attack damage increases to +5d6."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "shared-hatred"
print = "When the spiritualist reaches 17th level, the phantom can grant its hatred to others. When the phantom designates a hated enemy, its allies also gain a +2 bonus on attack rolls and a +4 bonus on damage rolls against that enemy. Furthermore, the phantom can use its hated target ability even when in incorporeal form; when it does, it can make slam attacks against a corporeal creature, but only if that corporeal creature is its hated target. Jealousy A phantom with this emotional focus is covetous of everything—its master, those who wish to do it harm, and any who do not pay attention to it. It demands to be the center of attention at all times. The forms these phantoms take are as diverse as the forms of jealousy in life. Often they take pleasing forms, wishing to draw others in. Other times they take the form of crawling and lurching things, grasping at all they covet when they come within reach. The auras of these needy phantoms quickly change in color, going from an oily green to orange, to brownish red as they swirl through emotions in their efforts to gain the objects of their dark desires."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "skills"
print = "The phantom gains a number of ranks in Appraise and Bluff equal to its number of Hit Dice. While confined in the spiritualist's consciousness, the phantom grants the spiritualist Skill Focus in each of these skills."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "good-saves"
print = "Reflex and Will."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "deceitful"
print = "The phantom gains Deceitful as a bonus feat."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "jealous-combatant"
print = "Each time the phantom hits a creature with a melee attack, for 1 round that creature takes a -2 penalty on all attack rolls made against anyone other than the phantom. This effect does not stack with itself."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "resentful-aura"
print = "When the spiritualist reaches 7th level, as a swift action, the phantom can emit a 20-foot-radius aura that forces enemies within the aura who make an attack or cast a spell that does not include the phantom in its effect to succeed at a Will saving throw (DC = 10 + 1/2 the phantom's Hit Dice + the phantom's Charisma modifier) or become staggered until the end of the enemy's next turn. Ending the aura is a free action. The phantom can use this ability in either ectoplasmic or incorporeal form."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "retribution"
print = "When the spiritualist reaches 12th level, each time a creature attacks the phantom's master, whether that attack hits or misses, it enrages the phantom. Until the end of the phantom's next turn, any attack the phantom makes that hits the creature that has attacked her deals 2d8 extra points of damage. This extra damage is precision damage."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "mine-to-take"
print = "When the spiritualist reaches 17th level, once per day as an immediate action, just before the phantom's master is about to attempt a saving throw or be targeted by an attack roll, the phantom and the spiritualist can swap places as long as both are on the same plane and the phantom is aware of the attack or effect. After the swap occurs, the phantom is targeted by the attack or effect that triggered this ability, though the phantom may be immune or resistant to the effect. This is a teleportation effect. The phantom can use this ability in either ectoplasmic or incorporeal form. Zeal A phantom with this emotional focus fixates on every task given as if it were the phantom's last. The most basic commands are treated as life-and-death situations, and the truly dangerous ones are faced with a resolve and tenacity that sometimes defies common sense. Zeal phantoms take the form of steadfast protectors or daring and manic creatures looking for the next challenge or opportunity to prove itself to either its master or itself. Often very prideful creatures, these phantoms display an orange aura upon completing their tasks. They are prone to boast about their accomplishments and chastise those around them for not accomplishing more."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "skills"
print = "The phantom gains a number of ranks in Acrobatics and Survival equal to its number of Hit Dice. While confined in the spiritualist's consciousness, the phantom grants the spiritualist Skill Focus in each of these skills."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "good-saves"
print = "Fortitude and Reflex."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "tracking"
print = "The phantom adds half its number of Hit Dice (minimum 1) to Survival skill checks to follow tracks."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "ruthless-combatant"
print = "The phantom threatens a critical hit with its slam attacks on a roll of 19–20. When the spiritualist reaches 11th level, the phantom's critical modifier with slam attacks increases to ×3. This doesn't stack with Improved Critical or similar effects."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "determination-aura"
print = "When the spiritualist reaches 7th level, as a swift action, the phantom can emit a 20-foot-radius aura that grants its zeal to nearby allies. Allies within the aura gain a +2 competence bonus on attack rolls and saving throws. The phantom can use this ability in either ectoplasmic or incorporeal form."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "steadfast-servant"
print = "When the spiritualist reaches 12th level, the phantom can stay manifested even when its spiritualist master is unconscious or asleep."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "zeal-s-resolve"
print = "When the spiritualist reaches 17th level, three times per day as a free action, when the phantom misses with an attack roll or fails a saving throw, it can reroll the failed attack or saving throw. It must take the new result, even if that result is worse."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "racial-favored-class-options"
print = '''
The rules below allow members of races from the _Pathfinder RPG Core Rulebook_ to take alternate rewards when they gain a level in a favored class chosen from among the classes in this book. The racial favored class options listed in _Pathfinder RPG Advanced Race Guide_ cover the classes from the _Core Rulebook_, _Pathfinder RPG Advanced Player's Guide_, _Pathfinder RPG Ultimate Combat_, and _Pathfinder RPG Ultimate Magic_. Such options for the classes presented in the _Pathfinder RPG Advanced Class Guide_ are covered in that volume.

Each of these rewards replaces the normal reward for having a level in a favored class (gaining 1 extra hit point or 1 extra skill rank). Unlike those general rewards, the alternate favored class options speak directly to the features of specific classes and the general tendencies of various races.

Whenever you gain a level in a favored class, you can choose which favored class option you take. Unless otherwise noted, these benefits always stack with themselves.

Many of these alternate class rewards add only 1/2, 1/3, 1/4, or 1/6 to a roll (rather than 1) each time the reward is selected, or add 1/2, 1/3, 1/4, or 1/6 to a class ability (such as adding to a mesmerist's number of mesmerist tricks per day or the total number of points in a psychic's phrenic pool). When applying such a benefit to a die roll or class ability, always round down (to a minimum of 0). You may thus need to select such an option several times before the benefit takes effect. If an alternate favored class option modifies a class feature or ability, it can't be taken before the character has that class feature or ability. For example, if a class gains a class feature at 6th level, a character couldn't take a racial favored class option that applies to that class feature until 6th level, even if the benefit from that option wouldn't be high enough to add a bonus until a later level.

Some options may have a fixed numerical limit, after which selecting that favored class reward again has no effect. In these cases, you can always select from among the standard rewards when taking a level in a favored class (gaining 1 extra hit point or 1 extra skill rank).

Abilities from favored class options that increase a character's caster level for the purpose of determining the duration of certain spells apply this increase after other effects that adjust a spell's duration, such as Extend Spell.'''

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "dwarves"
print = "Some dwarven communities place a social stigma on psychic abilities due to the association of such powers with their slaver cousins, the duergar. Occultists avoid this stigma by establishing a connection to the storied relics of dwarven history. Dwarven spiritualists might connect with spirits of dwarves who fell in battle, and dwarven mediums might hone their talents so they can contact the great heroes of dwarven lore. Still, the most common path for a psychic dwarf is a kineticist focusing on earth and metal wild talents. The following options are open to all dwarves who have the listed favored class."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "kineticist"
print = "Add 1/3 point of damage to earth element blasts that deal damage."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "medium"
print = "Gain a +1/2 bonus on saving throws against possession and a +1/2 bonus on saving throws to end haunt channeler, location channel, and spacious soul."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "mesmerist"
print = "Increase painful stare's damage by 1/4 point."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "occultist"
print = "Gain a +1/3 bonus on Appraise and Use Magic Device checks involving stone and metal objects."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "psychic"
print = "When casting psychic abjuration spells, add 1/2 level to the effective caster level of the spell, but only to determine the spell's duration."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "spiritualist"
print = "Add 1/6 to the shield bonus granted by the 3rd-level ectoplasmic bonded manifestation ability."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "elves"
print = "The same keen intellects and careful study elves use to explore the arcane arts also apply to their study of the occult and psychic magic. Elves who explore their own psyches typically embark on mental expeditions after thorough study of psychic phenomena. They approach their own minds deliberately, keeping detailed chronicles of what they experience both without and within. The following options are open to all elves who have the listed favored class."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "kineticist"
print = "Gain a +1/4 bonus on damage rolls that apply the kineticist's elemental overflow bonus."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "medium"
print = "Gain a +1/3 bonus on all skill checks using occult skill unlocks."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "mesmerist"
print = "Gain a +1/2 bonus on Acrobatics checks to move through a threatened area and a +1/2 bonus on Bluff checks to feint."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "occultist"
print = "Increase the occultist's total number of points of mental focus by 1/2 point."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "psychic"
print = "Increase the total number of points in the psychic's phrenic pool by 1/3 point."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "spiritualist"
print = "Add 1/6 to the shield bonus granted by the 3rd-level ectoplasmic bonded manifestation ability."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "gnomes"
print = "Mental trickery comes naturally to gnomes. They're predisposed to like psychic magic, with its off beat and obscure practices. Each type of occult class holds its own appeal for gnomes, from the kineticist's innate feel for magic to the occultist's fascination with trinkets. The following options are open to all gnomes who have the listed favored class."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "kineticist"
print = "Gain a +1/2 bonus on Bluff, Diplomacy, Intimidate, and Sense Motive skill checks against creatures with the elemental subtype matching the kineticist's primary element."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "medium"
print = "Gain a +1/2 bonus on Bluff, Diplomacy, Intimidate, and Sense Motive skill checks against spirits, undead, phantoms, and creatures native to the Astral Plane."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "mesmerist"
print = "Increase the number of mesmerist tricks the mesmerist can use per day by 1/3."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "occultist"
print = "Increase the duration of the occultist's minor figment by 1 minute, and increase the total concealment miss chance from the occultist's distortion resonant power by 2%. This doesn't increase the maximum miss chance."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "psychic"
print = "Increase the total number of points in the psychic's phrenic pool by 1/3 point."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "spiritualist"
print = "Add 1/6 to the shield bonus granted to the spiritualist while under the effects of either spiritual interference or greater spiritual interference."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "half-elves"
print = "Many half-elves have a talent for forming and reinforcing social ties, and psychic half-elves find that mentally connecting to other creatures makes this even easier. They're especially skilled at the spiritual communication required for the medium class. Half-elves who hew more closely to their elven lineage often become psychics, and those with stronger human blood might become kineticists or mesmerists. The following options are open to all half-elves who have the listed favored class."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "kineticist"
print = "Gain a +1/4 bonus on damage rolls that apply the kineticist's elemental overflow bonus."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "medium"
print = "Gain a +1/3 bonus on all skill checks using occult skill unlocks."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "mesmerist"
print = "When casting mesmerist enchantment spells, add 1/2 to the effective caster level of the spell, but only to determine the spell's duration."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "occultist"
print = "Gain a +1/2 bonus on Spellcraft checks to identify the properties of magic items and a +1/2 bonus on Use Magic Device checks to emulate a race."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "psychic"
print = "Gain 1/6 of a new phrenic amplification."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "spiritualist"
print = "Add 1 skill rank to the spiritualist's phantom."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "half-orcs"
print = "Abilities firmly rooted in the mind might not seem like a fit for half-orcs—at least, according to the common perception of half-orcs. However, psychic abilities sometimes get handed down, typically from a human parent. When orc blood contributes psychic talent, it usually manifests as kineticist abilities. The following options are open to all half-orcs who have the listed favored class."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "kineticist"
print = "Add 1/3 point of fire damage to fire-element blasts that deal fire damage."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "medium"
print = "When gaining a taboo, the medium can use spirit surge without incurring influence an additional 1/4 time per day."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "mesmerist"
print = "Increase the mesmerist's bonus damage from painful stare by 1/2 point."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "occultist"
print = "Deal an additional 1/2 point of damage with focus powers."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "psychic"
print = "Gain a +1 bonus on concentration checks required because of taking damage while casting spells from the psychic class."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "spiritualist"
print = "Add 1 hit point to the spiritualist's phantom."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "halflings"
print = "It's a common belief that halflings get out of scrapes because of their good fortune, but for some, \"halfling luck\" is really a reflection of psychic talent. Many develop this ability into something greater to compensate for their small stature, and become particularly adept at inf luencing or manipulating people. The following options are open to all halflings who have the listed favored class."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "kineticist"
print = "Increase the capacity of the kineticist's internal buffer by 1/6 point."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "medium"
print = "Increase the bonus the medium gains from its seance boon by 1/3 point. This doesn't increase the bonus allies gain from shared seance."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "mesmerist"
print = "Increase the number of mesmerist tricks the mesmerist can use per day by 1/3."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "occultist"
print = "Add 1/2 point of mental focus per day."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "psychic"
print = "The psychic treats her Charisma bonus as 1/3 point higher for the purpose of determining the number of uses or rounds per day of her discipline powers."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "spiritualist"
print = "Add 1/4 to the number of rounds that the spiritualist's incorporeal phantom can be out of sight and line of effect before being sent back to the Ethereal Plane."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "humans"
print = "Lacking traditions on which to base their understanding of the occult, psychic humans often join strange cults to develop their mental talents. Others engage in private study, collecting writings of questionable veracity that cover occult topics. A large number of humans are fascinated with occult topics even if they aren't sensitive to psychic phenomena, and they can be quick to follow anyone who demonstrates even minor abilities with psychic magic. The following options are open to all humans who have the listed favored class."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "kineticist"
print = "Gain 1/6 of an Extra Wild Talent feat."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "medium"
print = "When gaining a taboo, the medium can use spirit surge without incurring influence an additional 1/4 time per day."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "mesmerist"
print = "Increase the mesmerist's towering ego bonus by 1/3 point (to a maximum increase of +2)."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "occultist"
print = "Gain 1/6 of a new focus power."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "psychic"
print = "Add one spell known from the psychic spell list. This spell must be at least 1 level lower than the highest spell level the psychic can cast."

[[entry]]
id = "ref/emotionalfocus/hatred"
anchor = "spiritualist"
print = "Add 1 skill rank or 1 hit point to the spiritualist's phantom."

[[entry]]
id = "ref/emotionalfocus/jealousy"
anchor = "opening"
print = "Fear A phantom with this emotional focus suffered from overwhelming fear in life. As a phantom, it is able to channel that fear into a terrifying weapon. Fear phantoms are often horrifying to behold. Sometimes they appear as ghostly figures in tattered funeral garb or wrapped in chains or other bindings. Their features may be distorted into gaunt and haunting forms, making them seem more like ghosts or spectres. A miasma of livid gray swirling motes often surrounds their forms as they stalk their surroundings, seeking to bestow their terror on others."

[[entry]]
id = "ref/emotionalfocus/jealousy"
anchor = "skills"
print = "The phantom gains a number of ranks in Intimidate and Stealth equal to its number of Hit Dice. While confined in the spiritualist's consciousness, such a phantom grants the spiritualist [Skill Focus](ref/feat/skill-focus) in each of these skills."

[[entry]]
id = "ref/emotionalfocus/jealousy"
anchor = "good-saves"
print = "Reflex and Will."

[[entry]]
id = "ref/emotionalfocus/jealousy"
anchor = "stealthy"
print = "The phantom gains Stealthy as a bonus feat."

[[entry]]
id = "ref/emotionalfocus/jealousy"
anchor = "horrifying-strike"
print = "If the phantom hits a creature with a slam attack, that creature must succeed at a Will saving throw (DC = 10 + 1/2 the phantom's Hit Dice + the phantom's Charisma modifier) or be shaken for 1d4 rounds. Multiple attacks against the same creature do not cause the creature to become frightened. This is a mind-affecting fear effect."

[[entry]]
id = "ref/emotionalfocus/jealousy"
anchor = "increase-fear"
print = "When the spiritualist reaches 7th level, as a swift action, the phantom can emit a 20-foot-radius aura that amplifies the fear conditions of enemies within it if they fail their Will saving throws (DC = 10 + 1/2 the phantom's Hit Dice + the phantom's Charisma modifier). A shaken enemy in the aura becomes frightened, a frightened creature becomes panicked, and a panicked creature cowers. This effect lasts either as long as the enemy stays within the aura and is under the condition of the initial fear effect, or for a number of rounds after it leaves the aura equal to 1/2 the phantom's Hit Dice, or until the end of the original fear effect's duration, whichever comes first. A creature that succeeds at the saving throw is immune to this effect from the same phantom for 24 hours. This is a mind-affecting fear effect. The phantom can use this ability in either ectoplasmic or incorporeal form."

[[entry]]
id = "ref/emotionalfocus/jealousy"
anchor = "frightful-attack"
print = "When the spiritualist reaches 12th level, if the phantom hits with a slam attack, it can frighten those it hits instead of causing them to be shaken (the phantom chooses when it makes the attack). This is a mind-affecting fear effect."

[[entry]]
id = "ref/emotionalfocus/jealousy"
anchor = "shelter-allies"
print = '''
When the spiritualist reaches 17th level, the phantom protects its allies from terror. Allies within the phantom's increase fear aura are immune to fear as long as they are within the aura. This ability also grants the phantom's spiritualist master immunity to fear as long as the phantom is not banished to the Ethereal Plane. Hatred Few things draw a spirit toward the Negative Material Plane like the emotion of hatred. Phantoms with this focus often are blinded by—and blind others with—this powerful emotion. These phantoms are frequently darker and more foreboding than all but those phantoms with the fear emotional focus. Many of them manifest as dark and dreadful knights, their armor bristling with spikes and their hands seeming to grasp barbed and terrible weapons. Other times they appear as tall, gaunt figures staring down arrogantly at those who approach.

These phantoms typically spew a string of curses at their foes, often profane, sometimes poetic. Their auras are pulsating and pitch black, and thrum violently when these horrible phantoms attack.'''

