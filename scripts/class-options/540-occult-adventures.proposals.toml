anchor = "skills"
print = "The phantom gains a number of ranks in [Intimidate](ref/skill/intimidate) and [Stealth](ref/skill/stealth) equal to its number of Hit Dice. While confined in the spiritualist's consciousness, the phantom grants the spiritualist [Skill Focus](ref/feat/skill-focus) in each of these skills."

