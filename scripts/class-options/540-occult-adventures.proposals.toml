print = "When the spiritualist reaches 12th level, each time a creature attacks the phantom's master, whether that attack hits or misses, it enrages the phantom. Until the end of the phantom's next turn, any attack the phantom makes that hits the creature that has attacked her deals 2d8 extra points of damage. This extra damage is precision damage."

[[entry]]
id = "ref/emotionalfocus/jealousy"
anchor = "mine-to-take"
print = "When the spiritualist reaches 17th level, once per day as an immediate action, just before the phantom's master is about to attempt a saving throw or be targeted by an attack roll, the phantom and the spiritualist can swap places as long as both are on the same plane and the phantom is aware of the attack or effect. After the swap occurs, the phantom is targeted by the attack or effect that triggered this ability, though the phantom may be immune or resistant to the effect. This is a teleportation effect. The phantom can use this ability in either ectoplasmic or incorporeal form. Zeal A phantom with this emotional focus fixates on every task given as if it were the phantom's last. The most basic commands are treated as life-and-death situations, and the truly dangerous ones are faced with a resolve and tenacity that sometimes defies common sense. Zeal phantoms take the form of steadfast protectors or daring and manic creatures looking for the next challenge or opportunity to prove itself to either its master or itself. Often very prideful creatures, these phantoms display an orange aura upon completing their tasks. They are prone to boast about their accomplishments and chastise those around them for not accomplishing more."

[[entry]]
id = "ref/emotionalfocus/jealousy"
anchor = "skills"
print = "The phantom gains a number of ranks in Acrobatics and Survival equal to its number of Hit Dice. While confined in the spiritualist's consciousness, the phantom grants the spiritualist Skill Focus in each of these skills."

[[entry]]
id = "ref/emotionalfocus/jealousy"
anchor = "good-saves"
print = "Fortitude and Reflex."

[[entry]]
id = "ref/emotionalfocus/jealousy"
anchor = "tracking"
print = "The phantom adds half its number of Hit Dice (minimum 1) to Survival skill checks to follow tracks."

[[entry]]
id = "ref/emotionalfocus/jealousy"
anchor = "ruthless-combatant"
print = "The phantom threatens a critical hit with its slam attacks on a roll of 19–20. When the spiritualist reaches 11th level, the phantom's critical modifier with slam attacks increases to ×3. This doesn't stack with Improved Critical or similar effects."

[[entry]]
id = "ref/emotionalfocus/jealousy"
anchor = "determination-aura"
print = "When the spiritualist reaches 7th level, as a swift action, the phantom can emit a 20-foot-radius aura that grants its zeal to nearby allies. Allies within the aura gain a +2 competence bonus on attack rolls and saving throws. The phantom can use this ability in either ectoplasmic or incorporeal form."

[[entry]]
id = "ref/emotionalfocus/jealousy"
anchor = "steadfast-servant"
print = "When the spiritualist reaches 12th level, the phantom can stay manifested even when its spiritualist master is unconscious or asleep."

[[entry]]
id = "ref/emotionalfocus/jealousy"
anchor = "zeal-s-resolve"
print = "When the spiritualist reaches 17th level, three times per day as a free action, when the phantom misses with an attack roll or fails a saving throw, it can reroll the failed attack or saving throw. It must take the new result, even if that result is worse."

[[entry]]
id = "ref/emotionalfocus/jealousy"
anchor = "racial-favored-class-options"
print = '''
The rules below allow members of races from the _Pathfinder RPG Core Rulebook_ to take alternate rewards when they gain a level in a favored class chosen from among the classes in this book. The racial favored class options listed in _Pathfinder RPG Advanced Race Guide_ cover the classes from the _Core Rulebook_, _Pathfinder RPG Advanced Player's Guide_, _Pathfinder RPG Ultimate Combat_, and _Pathfinder RPG Ultimate Magic_. Such options for the classes presented in the _Pathfinder RPG Advanced Class Guide_ are covered in that volume.

Each of these rewards replaces the normal reward for having a level in a favored class (gaining 1 extra hit point or 1 extra skill rank). Unlike those general rewards, the alternate favored class options speak directly to the features of specific classes and the general tendencies of various races.

Whenever you gain a level in a favored class, you can choose which favored class option you take. Unless otherwise noted, these benefits always stack with themselves.

Many of these alternate class rewards add only 1/2, 1/3, 1/4, or 1/6 to a roll (rather than 1) each time the reward is selected, or add 1/2, 1/3, 1/4, or 1/6 to a class ability (such as adding to a mesmerist's number of mesmerist tricks per day or the total number of points in a psychic's phrenic pool). When applying such a benefit to a die roll or class ability, always round down (to a minimum of 0). You may thus need to select such an option several times before the benefit takes effect. If an alternate favored class option modifies a class feature or ability, it can't be taken before the character has that class feature or ability. For example, if a class gains a class feature at 6th level, a character couldn't take a racial favored class option that applies to that class feature until 6th level, even if the benefit from that option wouldn't be high enough to add a bonus until a later level.

Some options may have a fixed numerical limit, after which selecting that favored class reward again has no effect. In these cases, you can always select from among the standard rewards when taking a level in a favored class (gaining 1 extra hit point or 1 extra skill rank).

Abilities from favored class options that increase a character's caster level for the purpose of determining the duration of certain spells apply this increase after other effects that adjust a spell's duration, such as Extend Spell.'''

[[entry]]
id = "ref/emotionalfocus/jealousy"
anchor = "dwarves"
print = "Some dwarven communities place a social stigma on psychic abilities due to the association of such powers with their slaver cousins, the duergar. Occultists avoid this stigma by establishing a connection to the storied relics of dwarven history. Dwarven spiritualists might connect with spirits of dwarves who fell in battle, and dwarven mediums might hone their talents so they can contact the great heroes of dwarven lore. Still, the most common path for a psychic dwarf is a kineticist focusing on earth and metal wild talents. The following options are open to all dwarves who have the listed favored class."

[[entry]]
id = "ref/emotionalfocus/jealousy"
anchor = "kineticist"
print = "Add 1/3 point of damage to earth element blasts that deal damage."

[[entry]]
id = "ref/emotionalfocus/jealousy"
anchor = "medium"
print = "Gain a +1/2 bonus on saving throws against possession and a +1/2 bonus on saving throws to end haunt channeler, location channel, and spacious soul."

[[entry]]
id = "ref/emotionalfocus/jealousy"
anchor = "mesmerist"
print = "Increase painful stare's damage by 1/4 point."

[[entry]]
id = "ref/emotionalfocus/jealousy"
anchor = "occultist"
print = "Gain a +1/3 bonus on Appraise and Use Magic Device checks involving stone and metal objects."

[[entry]]
id = "ref/emotionalfocus/jealousy"
anchor = "psychic"
print = "When casting psychic abjuration spells, add 1/2 level to the effective caster level of the spell, but only to determine the spell's duration."

[[entry]]
id = "ref/emotionalfocus/jealousy"
anchor = "spiritualist"
print = "Add 1/6 to the shield bonus granted by the 3rd-level ectoplasmic bonded manifestation ability."

[[entry]]
id = "ref/emotionalfocus/jealousy"
anchor = "elves"
print = "The same keen intellects and careful study elves use to explore the arcane arts also apply to their study of the occult and psychic magic. Elves who explore their own psyches typically embark on mental expeditions after thorough study of psychic phenomena. They approach their own minds deliberately, keeping detailed chronicles of what they experience both without and within. The following options are open to all elves who have the listed favored class."

[[entry]]
id = "ref/emotionalfocus/jealousy"
anchor = "kineticist"
print = "Gain a +1/4 bonus on damage rolls that apply the kineticist's elemental overflow bonus."

[[entry]]
id = "ref/emotionalfocus/jealousy"
anchor = "medium"
print = "Gain a +1/3 bonus on all skill checks using occult skill unlocks."

[[entry]]
id = "ref/emotionalfocus/jealousy"
anchor = "mesmerist"
print = "Gain a +1/2 bonus on Acrobatics checks to move through a threatened area and a +1/2 bonus on Bluff checks to feint."

[[entry]]
id = "ref/emotionalfocus/jealousy"
anchor = "occultist"
print = "Increase the occultist's total number of points of mental focus by 1/2 point."

[[entry]]
id = "ref/emotionalfocus/jealousy"
anchor = "psychic"
print = "Increase the total number of points in the psychic's phrenic pool by 1/3 point."

[[entry]]
id = "ref/emotionalfocus/jealousy"
anchor = "spiritualist"
print = "Add 1/6 to the shield bonus granted by the 3rd-level ectoplasmic bonded manifestation ability."

[[entry]]
id = "ref/emotionalfocus/jealousy"
anchor = "gnomes"
print = "Mental trickery comes naturally to gnomes. They're predisposed to like psychic magic, with its off beat and obscure practices. Each type of occult class holds its own appeal for gnomes, from the kineticist's innate feel for magic to the occultist's fascination with trinkets. The following options are open to all gnomes who have the listed favored class."

[[entry]]
id = "ref/emotionalfocus/jealousy"
anchor = "kineticist"
print = "Gain a +1/2 bonus on Bluff, Diplomacy, Intimidate, and Sense Motive skill checks against creatures with the elemental subtype matching the kineticist's primary element."

[[entry]]
id = "ref/emotionalfocus/jealousy"
anchor = "medium"
print = "Gain a +1/2 bonus on Bluff, Diplomacy, Intimidate, and Sense Motive skill checks against spirits, undead, phantoms, and creatures native to the Astral Plane."

[[entry]]
