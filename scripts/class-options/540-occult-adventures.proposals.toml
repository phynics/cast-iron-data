[[entry]]
id = "ref/emotionalfocus/zeal"
anchor = "halflings"
print = "It's a common belief that halflings get out of scrapes because of their good fortune, but for some, \"halfling luck\" is really a reflection of psychic talent. Many develop this ability into something greater to compensate for their small stature, and become particularly adept at inf luencing or manipulating people. The following options are open to all halflings who have the listed favored class."

[[entry]]
id = "ref/emotionalfocus/zeal"
anchor = "kineticist"
print = "Increase the capacity of the kineticist's internal buffer by 1/6 point."

[[entry]]
id = "ref/emotionalfocus/zeal"
anchor = "medium"
print = "Increase the bonus the medium gains from its seance boon by 1/3 point. This doesn't increase the bonus allies gain from shared seance."

[[entry]]
id = "ref/emotionalfocus/zeal"
anchor = "mesmerist"
print = "Increase the number of mesmerist tricks the mesmerist can use per day by 1/3."

[[entry]]
id = "ref/emotionalfocus/zeal"
anchor = "occultist"
print = "Add 1/2 point of mental focus per day."

[[entry]]
id = "ref/emotionalfocus/zeal"
anchor = "psychic"
print = "The psychic treats her Charisma bonus as 1/3 point higher for the purpose of determining the number of uses or rounds per day of her discipline powers."

[[entry]]
id = "ref/emotionalfocus/zeal"
anchor = "spiritualist"
print = "Add 1/4 to the number of rounds that the spiritualist's incorporeal phantom can be out of sight and line of effect before being sent back to the Ethereal Plane."

[[entry]]
id = "ref/emotionalfocus/zeal"
anchor = "humans"
print = "Lacking traditions on which to base their understanding of the occult, psychic humans often join strange cults to develop their mental talents. Others engage in private study, collecting writings of questionable veracity that cover occult topics. A large number of humans are fascinated with occult topics even if they aren't sensitive to psychic phenomena, and they can be quick to follow anyone who demonstrates even minor abilities with psychic magic. The following options are open to all humans who have the listed favored class."

[[entry]]
id = "ref/emotionalfocus/zeal"
anchor = "kineticist"
print = "Gain 1/6 of an Extra Wild Talent feat."

[[entry]]
id = "ref/emotionalfocus/zeal"
anchor = "medium"
print = "When gaining a taboo, the medium can use spirit surge without incurring influence an additional 1/4 time per day."

[[entry]]
id = "ref/emotionalfocus/zeal"
