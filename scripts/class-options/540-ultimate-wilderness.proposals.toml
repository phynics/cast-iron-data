# The printed text of the powers of the class options of the book, written ones included (the check reads an entry against it). Generated: never edit by hand.

[[entry]]
id = "ref/aspect/bat"
anchor = "opening"
print = "The aspect of the bat imparts mastery over darkness and the night. Though not as powerful in battle as some other aspects, those who take this aspect become adept at skirmishing and spying."

[[entry]]
id = "ref/aspect/bat"
anchor = "minor-form"
print = "You gain [darkvision](ref/rule/darkvision) with a range of 60 feet. If you already have [darkvision](ref/rule/darkvision) with this range or greater, the range of your darkvision increases by 30 feet. At 8th level, you gain darkvision with a range of 90 feet instead. If you already have darkvision with this range or greater, your darkvision increases by 30 feet. At 15th level, you gain the 8th-level benefit and gain [blindsense](ref/umr/blindsense) with a range of 15 feet or, if you already have [blindsense](ref/rule/blindsight-and-blindsense) with a range of 15 feet or more, you increase its range by 10 feet."

[[entry]]
id = "ref/aspect/bat"
anchor = "major-form"
print = "Your shape changes to that of a [dire bat](ref/monster/bat-dire-bat). While in this form, you gain a fly speed of 40 feet (clumsy) and [blindsense](ref/rule/blindsight-and-blindsense) with a range of 10 feet. At 8th level, the fly speed increases to 60 feet (good), the range of your [blindsense](ref/rule/blindsight-and-blindsense) increases to 20 feet, and you gain the [Flyby Attack](ref/feat/flyby-attack) feat. At 15th level, your fly speed increases to 80 feet (good) and you gain the [Hover](ref/feat/hover) feat."

[[entry]]
id = "ref/aspect/bear"
anchor = "opening"
print = "The aspect of the bear invokes a juggernaut of tireless endurance and furious power. Those who take this aspect are known for surviving severe wounds and delivering punishing blows in return."

[[entry]]
id = "ref/aspect/bear"
anchor = "minor-form"
print = "You gain a +2 enhancement bonus to your Constitution score. At 8th level, the bonus increases to +4, and at 15th level it increases to +6."

[[entry]]
id = "ref/aspect/bear"
anchor = "major-form"
print = "Your shape changes to that of a [dire bear](ref/monster/bear-dire-bear-cave-bear). While in this form, you gain [low-light vision](ref/rule/low-light-vision) and [scent](ref/umr/scent) (30 feet). At 8th level, you gain [Improved Natural Attack](ref/feat/improved-natural-attack) with your claws. At 15th level, the critical multiplier of your claw attack increases by 1 (×2 becomes ×3) to a maximum of ×4, and you gain the [Awesome Blow](ref/feat/awesome-blow) feat."

[[entry]]
id = "ref/aspect/bull"
anchor = "opening"
print = "The bull is a fierce charger and is adept at trampling its foes, pounding them to a bloody pulp."

[[entry]]
id = "ref/aspect/bull"
anchor = "minor-form"
print = "You gain a +2 enhancement bonus to your Strength score. At 8th level, the bonus increases to +4, and at 15th level it increases to +6."

[[entry]]
id = "ref/aspect/bull"
anchor = "major-form"
print = "Your shape changes to that of a Large bull (see Cattle on page 179). While in this form, you gain [low-light vision](ref/rule/low-light-vision), [scent](ref/umr/scent), and a [gore attack](ref/umr/natural-attacks) (1d8 damage) with [powerful charge](ref/umr/powerful-charge) (+1d8 on your gore attack). At 8th level, you gain the [trample](ref/umr/trample) as per the universal monster rule (dealing gore damage plus 1-1/2 times your Strength modifier). At 15th level, your gore damage increases to 2d8 and you gain the [Awesome Blow](ref/feat/awesome-blow) feat."

[[entry]]
id = "ref/aspect/deinonychus"
anchor = "opening"
print = "The deinonychus is adept at racing from ambush to deliver grievous wounds with its talons. This aspect infuses the shifter with an enhanced ability to surprise foes and strike first in battle."

[[entry]]
id = "ref/aspect/deinonychus"
anchor = "minor-form"
print = "You gain a +2 bonus on Initiative checks. This bonus increases to +4 at 8th level and +6 at 15th level."

[[entry]]
id = "ref/aspect/deinonychus"
anchor = "major-form"
print = "Your shape changes to that of a [deinonychus](ref/monster/dinosaur-deinonychus). While in this form, you gain a base speed of 60 feet, [low-light vision](ref/rule/low-light-vision), [scent](ref/umr/scent) (30 feet), a [bite attack](ref/umr/natural-attacks), and two talon attacks (your talon attacks can use your shifter claws damage), and [pounce](ref/umr/pounce). At 8th level, you gain two foreclaw attacks (these attacks cannot use your shifter claws damage) and a +4 racial bonus on Acrobatics checks. At 15th level, you gain a +1 dodge bonus to AC and [Spring Attack](ref/feat/spring-attack) as a bonus feat."

[[entry]]
id = "ref/aspect/falcon"
anchor = "opening"
print = "The falcon senses all and has the speed to hunt down even the most elusive prey. Those who take this aspect gain enhanced abilities to perceive and reconnoiter the wilderness—little escapes this shifter's attention."

[[entry]]
id = "ref/aspect/falcon"
anchor = "minor-form"
print = "You gain a +4 competence bonus on Perception checks. This bonus increases to +6 at 8th level and +8 at 15th level."

[[entry]]
id = "ref/aspect/falcon"
anchor = "major-form"
print = "Your shape changes to that of a Small [falcon](ref/monster/familiar-hawk) (see page 179). While in this form, you gain a [bite attack](ref/umr/natural-attacks) (1d4 damage), two claw attacks (1d3 damage), a fly speed of 60 feet (good), [low-light vision](ref/rule/low-light-vision), and a +4 racial bonus on vision-based Perception checks. At 8th level, you gain [darkvision](ref/rule/darkvision) with a range of 120 feet, and your racial bonus on Perception checks increases to +6. At 15th level, you gain [blindsense](ref/umr/blindsense) with a range of 60 feet and your fly speed increases to 90 feet (perfect)."

[[entry]]
id = "ref/aspect/frog"
anchor = "opening"
print = "The aspect of the frog grants great mobility in leaping through the air and swimming in water, as well surprising tactics in combat."

[[entry]]
id = "ref/aspect/frog"
anchor = "minor-form"
print = "You gain a +4 competence bonus on Acrobatics checks when jumping and on Swim checks. These bonuses increase to +6 at 8th level and +8 at 15th level."

[[entry]]
id = "ref/aspect/frog"
anchor = "major-form"
print = '''
Your shape changes to that of a Large frog (as per the [giant frog](ref/monster/frog-giant-frog) but with a space of 10 feet). While in this form, you gain a swim speed of 30 feet, [low-light vision](ref/rule/low-light-vision), [scent](ref/umr/scent) (30 feet), a [bite attack](ref/umr/natural-attacks) with the [grab](ref/umr/grab) ability, and the ability to treat all [jumps](ref/skill/acrobatics) as if you had a running start. At 8th level, you gain a tongue attack (see below). At 15th level, your swim speed increases to 60 feet. In addition, the reach of your tongue attack increases to 30 feet, and your tongue attack deals bludgeoning damage equal to the damage dealt by your shifter claws.

_Tongue (Ex):_ Your tongue is a primary natural attack with a reach of 15 feet. Your tongue deals no damage on a hit, but can be used to grab. You do not gain the [grappled](ref/rule/grapple-conditions) condition while using your tongue in this manner.'''

[[entry]]
id = "ref/aspect/lizard"
anchor = "opening"
print = "The aspect of the lizard is one of swift, graceful movement, granting the ability to dart and scurry with an astounding agility and balance."

[[entry]]
id = "ref/aspect/lizard"
anchor = "minor-form"
print = "You gain a +4 competence bonus on Acrobatics checks. This bonus increases to +6 at 8th level and +8 at 15th level."

[[entry]]
id = "ref/aspect/lizard"
anchor = "major-form"
print = "Your shape changes to that of an agile and brightly colored giant lizard (as per the [giant frilled lizard](ref/monster/lizard-giant-frilled-lizard) from _Bestiary_ 194, but with the following changes). While in this form, you gain a base speed of 40 feet, [low-light vision](ref/rule/low-light-vision), [scent](ref/umr/scent) (30 feet), a primary [bite attack](ref/umr/natural-attacks) (1d8 damage) with the [grab](ref/umr/grab) ability and a secondary tail attack (1d6 damage) with the [trip](ref/umr/trip) ability. At 8th level, your base speed increases to 60 feet and you gain a climb speed of 30 feet. At 15th level, you gain [Improved Natural Attack](ref/feat/improved-natural-attack) with your bite and your tail attacks, and the reach of your tail attack becomes 10 feet."

[[entry]]
id = "ref/aspect/monkey"
anchor = "opening"
print = "The monkey is a climbing trickster who specializes in mobility and manual agility."

[[entry]]
id = "ref/aspect/monkey"
anchor = "minor-form"
print = "You gain a +4 competence bonus on Climb checks. This bonus increases to +6 at 8th level and +8 at 15th level."

[[entry]]
id = "ref/aspect/monkey"
anchor = "major-form"
print = "Your shape changes to that of a Large monkey (as per the [dire ape](ref/monster/ape-dire-ape-gigantopithecus)). While in this form, you gain a climb speed of 30 feet, [low-light vision](ref/rule/low-light-vision), and [scent](ref/umr/scent) (30 feet), and you can still use your hands to wield weapons, hold objects, and manipulate objects normally. At 8th level, your climb speed increases to 50 feet, and you can use your tail to hold and manipulate objects as if you had a third hand, but you cannot use it to wield weapons or shields. At 15th level, you gain a [rend](ref/umr/rend) attack that deals extra damage equal to that of your shifter claws attack plus 1-1/2 times your Strength bonus when you hit with two of your normal shifter claws attacks."

[[entry]]
id = "ref/aspect/mouse"
anchor = "opening"
print = "The aspect of the mouse offers the ability to gain access to hard-to-reach places while avoiding many attacks and effects."

[[entry]]
id = "ref/aspect/mouse"
anchor = "minor-form"
print = "You gain [evasion](ref/ability/evasion), as per the rogue class feature. At 12th level, this benefit becomes [improved evasion](ref/talent/improved-evasion), as per the rogue advanced talent."

[[entry]]
id = "ref/aspect/mouse"
anchor = "major-form"
print = "Your shape changes to that of a Tiny mouse (as per the [dire rat](ref/monster/rat-dire-rat), but with a space of 2-1/2 feet and a reach of 0 feet). While in this form, you gain a climb speed of 20 feet, a swim speed of 20 feet, [low-light vision](ref/rule/low-light-vision), and [scent](ref/umr/scent) (30 feet), and you use your Dexterity modifier instead of your Strength modifier on Climb and Swim checks. At 8th level, your climb and swim speeds both increase to 40 feet. At 15th level, you do not provoke attacks of opportunity while moving through or out of a creature's threatened area or moving into its space, but you do when you leave its space."

[[entry]]
id = "ref/aspect/owl"
anchor = "opening"
print = "The aspect of the owl is one of silence. This predator glides through the night unheard, a master of stealthy attacks."

[[entry]]
id = "ref/aspect/owl"
anchor = "minor-form"
print = "You gain a +4 competence bonus on Stealth checks. This bonus increases to +6 at 8th level and +8 at 15th level."

[[entry]]
id = "ref/aspect/owl"
anchor = "major-form"
print = "Your shape changes to that of a Medium [owl](ref/monster/familiar-owl) (see page 181). While in this form, you gain two claw attacks (1d6 damage), [darkvision](ref/rule/darkvision) with a range of 60 feet, and a +2 racial bonus on Stealth checks. At 8th level, you gain [Flyby Attack](ref/feat/flyby-attack) as a bonus feat, and the range of your [darkvision](ref/rule/darkvision) increases to 120 feet. At 15th level, you can take the form of a Large owl and gain the benefits of the [Snatch](ref/feat/snatch) feat, but you can use it only to grab a creature at least one size category smaller than yourself, and you can squeeze a creature grappled with this ability no matter what size it is."

[[entry]]
id = "ref/aspect/snake"
anchor = "opening"
print = "The snake is a sneaky and lethal foe who strikes unexpectedly with deadly effect, while avoiding opportune strikes made in return."

[[entry]]
id = "ref/aspect/snake"
anchor = "minor-form"
print = "You gain a +2 bonus on attack rolls when making attacks of opportunity and a +2 dodge bonus to your AC against attacks of opportunity. These bonuses increase to +4 at 8th level and +6 at 15th level."

[[entry]]
id = "ref/aspect/snake"
anchor = "major-form"
print = "Your shape changes to that of an [emperor cobra](ref/monster/snake-emperor-cobra). While in this form, you gain a climb speed of 30 feet, a swim speed of 30 feet, [low-light vision](ref/rule/low-light-vision), [scent](ref/umr/scent) (30 feet), and the [Combat Reflexes](ref/feat/combat-reflexes) feat. If you already have Combat Reflexes or your Dexterity score is not high enough to gain more attacks of opportunity from Combat Reflexes, you can instead make one additional attack of opportunity each round. At 8th level, you gain a +4 racial bonus on Acrobatics and Stealth checks. At 15th level, when you make an attack of opportunity with your [bite attack](ref/umr/natural-attacks), that attack also applies the following poison."

[[entry]]
id = "ref/aspect/snake"
anchor = "poison"
print = "Bite—injury; _save_ Fort DC = 10 + half your shifter level + your Constitution modifier; _frequency_ 1/round for 6 rounds; _effect_ 1d3 Con damage; _cure_ 2 consecutive saves."

[[entry]]
id = "ref/aspect/stag"
anchor = "opening"
print = "The stag can outrun or stand its ground against almost any foe. This aspect offers majestic grace and swift speed."

[[entry]]
id = "ref/aspect/stag"
anchor = "minor-form"
print = "You gain an enhancement bonus of +5 feet to your base speed. This bonus increases to +10 feet at 8th level and +20 feet at 15th level."

[[entry]]
id = "ref/aspect/stag"
anchor = "major-form"
print = "Your shape changes to that of a Large [stag](ref/monster/herd-animal-stag), but its space changes to 10 feet. While in this form, you gain a base speed of 50 feet, [low-light vision](ref/rule/low-light-vision), and [scent](ref/umr/scent) (30 feet). At 8th level, you gain a +4 racial bonus on Acrobatic checks when jumping. At 15th level, you gain the [Awesome Blow](ref/feat/awesome-blow) and [Improved Natural Attack](ref/feat/improved-natural-attack) feats (_Bestiary_ 314, 315) for gore attacks, and you can use Awesome Blow against a creature of your size or smaller."

[[entry]]
id = "ref/aspect/tiger"
anchor = "opening"
print = "The tiger is a powerful but graceful hunter of the wild, quietly stalking its prey and then taking it down with ruthless efficiency."

[[entry]]
id = "ref/aspect/tiger"
anchor = "minor-form"
print = "You gain a +2 enhancement bonus to your Dexterity score. This bonus increases to +4 at 8th level and +6 at 15th level."

[[entry]]
id = "ref/aspect/tiger"
anchor = "major-form"
print = "Your shape changes to that of a [dire tiger](ref/monster/tiger-dire-tiger-smilodon). While in this form, you gain a base speed of 40 feet, [low-light vision](ref/rule/low-light-vision), [scent](ref/umr/scent) (30 feet), the [grab](ref/umr/grab) ability with both your bite and claw attacks, and [pounce](ref/umr/pounce). At 8th level, you gain a +4 racial bonus on Stealth checks. At 15th level, you gain the [rake](ref/umr/rake) attack with your back claw attacks (dealing additional damage equal to that of your claw attack)."

[[entry]]
id = "ref/aspect/wolf"
anchor = "opening"
print = "The aspect of the wolf provides the senses and the attacks of the mighty wolf, whose instincts are honed to track and take down its prey."

[[entry]]
id = "ref/aspect/wolf"
anchor = "minor-form"
print = "You gain the [scent](ref/umr/scent) ability with a range of 10 feet, or, if you have the scent ability, the range increases by 10 feet. The range of this scent or the increase to your scent increases to 20 feet at 8th level and 30 feet at 15th level. The range doubles if the opponent is upwind and is halved if the opponent is downwind."

[[entry]]
id = "ref/aspect/wolf"
anchor = "major-form"
print = "Your shape changes to that of a [dire wolf](ref/monster/wolf-dire-wolf). While in this form, you gain a base speed of 50 feet, [low-light vision](ref/rule/low-light-vision), and scent (30 feet), and you can make a [trip](ref/rule/trip) attempt with your [bite attack](ref/umr/natural-attacks). At 8th level, the range of your scent ability increases to 40 feet and you gain a +4 racial bonus on Survival checks when tracking with scent. At 15th level, you gain [Improved Natural Attack](ref/feat/improved-natural-attack) (bite) (_Bestiary_ 315)."

[[entry]]
id = "ref/aspect/wolverine"
anchor = "opening"
print = "This aspect unlocks the brutal ferocity and tenacious fury of the wolverine. The wolverine's lust for battle invigorates its will to live, and it can press on in battle longer than its enemies expect."

[[entry]]
id = "ref/aspect/wolverine"
anchor = "minor-form"
print = "You gain 1 additional hit point per Hit Die you have, and treat your Constitution score as 4 points higher than it is for the purpose of determining when you die at negative hit points. At 8th level, you gain [Diehard](ref/feat/diehard) as a bonus feat. At 15th level, you treat your Constitution as being 8 points higher for the purpose of determining when you die at negative hit points."

[[entry]]
id = "ref/aspect/wolverine"
anchor = "major-form"
print = "Your shape changes to that of a [dire wolverine](ref/monster/wolverine-dire-wolverine). While in this form, you gain a climb speed of 10 feet, [low-light vision](ref/rule/low-light-vision), and [scent](ref/umr/scent) (30 feet). While in dire wolverine form, you gain the [barbarian's](ref/class/barbarian) rage power, but can activate this rage only in a round after you've taken damage. You can rage for a number of rounds each day equal to your shifter level. This ability otherwise functions the same as the barbarian rage ability (unlike a dire wolverine, you can choose to end this rage voluntarily). At 8th level, you can choose two barbarian rage powers, treating your shifter level"

[[entry]]
id = "ref/blessing/earthquake"
anchor = "opening"
print = '''
arrow champion spends 1 panache point, she can perform either action as an immediate action. In addition, if she has the Quick Draw feat and one of her hands is free, she can sheathe a weapon and draw an unhidden weapon as part of the same swift action, provided that one of the weapons is a bow and the other is a light or one-handed piercing melee weapon. If she spends 1 panache point, she can perform the switch as an immediate action.

This deed replaces swashbuckler's initiative.

_Archer's Feint (Ex):_ At 7th level, when the arrow champion hits a foe within 30 feet with a bow attack, she can forgo the damage and instead attempt a Bluff check to feint against that foe as a swift action. If successful, in addition to the normal benefits of feinting, she doubles the extra damage from precise aim on her next melee attack before the end of her next turn.

This deed replaces superior feint.'''

[[entry]]
id = "ref/blessing/earthquake"
anchor = "weapon-versatility"
print = '''
At 5th level, an arrow champion learns to use precision-based tricks just as accurately with her bow as with her melee weapons. Provided that her swashbuckler level is high enough, she can use the bleeding wound, deadly stab, menacing swordplay, perfect thrust, stunning stab, and targeted strike deeds when attacking with a bow, so long as her target is within 30 feet. If she spends a panache point to increase the range of her precise aim ability, the increased range applies to this ability as well.

This replaces swashbuckler weapon training.'''

[[entry]]
id = "ref/blessing/earthquake"
anchor = "versatile-weapon-mastery"
print = '''
At 20th level, an arrow champion gains the benefits of swashbuckler weapon mastery when using a light or one-handed piercing melee weapon or a bow.

This alters swashbuckler weapon mastery.'''

[[entry]]
id = "ref/blessing/earthquake"
anchor = "wildstrider-swashbuckler-archetype"
print = "Most swashbucklers call cities their home, but some prefer deserts, marshlands, mountains, or woods, where the rough terrain grants them an advantage, and have little interest in the comforts of an urban lifestyle."

[[entry]]
id = "ref/blessing/earthquake"
anchor = "class-skills"
print = '''
A wildstrider gains Knowledge (nature), Stealth, and Survival as class skills, but does not gain Knowledge (nobility), Sense Motive, and Sleight of Hand as class skills.

This alters the swashbuckler's class skills.'''

[[entry]]
id = "ref/blessing/earthquake"
anchor = "deeds"
print = '''
A wildstrider gains the following deeds, each of which replaces an existing deed.

_Subterfuge (Ex):_ A wildstrider adds Stealth to the list of skills to which the derring-do deed applies. At 15th level, she adds Stealth to the list of skills on which she can take 10 using the swashbuckler's edge deed.

This deed replaces dodging panache and alters derring-do and swashbuckler's edge.

_Adroit Step (Ex):_ At 3rd level, a wildstrider can use a swift action to treat a 5-foot square of difficult terrain as if it were normal terrain. If she also spends a panache point, she can treat all difficult terrain as though it were normal terrain until the end of her turn.

This deed replaces kip-up.

_Keen Gaze (Ex):_ At 11th level, while a wildstrider has at least 1 panache point, she can ignore the miss chance from concealment (but not total concealment) caused by normal and magical fog, smoke, and undergrowth, but not other sources of concealment or a miss chance, such as _blur_.

This deed replaces subtle blade.'''

[[entry]]
id = "ref/blessing/earthquake"
anchor = "avenging-beast-vigilante-archetype"
print = "Some vigilantes turn to natural traditions and supernatural forces to transform into beasts, unleashing a primal fury on their foes before returning to an ordinary guise."

[[entry]]
id = "ref/blessing/earthquake"
anchor = "class-skills"
print = '''
An avenging beast gains Knowledge (nature) and Spellcraft as class skills, but does not gain Disable Device, Knowledge (engineering), Perform, and Sleight of Hand as class skills.

This alters the vigilante's class skills.'''

[[entry]]
id = "ref/blessing/earthquake"
anchor = "skill-ranks-per-level"
print = '''
An avenging beast gains a number of skill ranks equal to 4 + his Intelligence modifier at each level, instead of 6 + his Intelligence modifier.

This alters the vigilante's skill ranks per level.'''

[[entry]]
id = "ref/blessing/earthquake"
anchor = "animal-mask"
print = '''
An avenging beast gains an ornate animal-headed mask that is a focus for his power and must be worn when assuming his vigilante identity. This mask symbolizes one specific animal, and the animal cannot be changed once chosen. Without this mask, an avenging beast cannot assume his vigilante identity. An avenging beast who loses his mask can replace it after 1 week through a specialized ritual that takes 8 hours to complete and costs 200 gp per avenging beast level.

This alters dual identity.'''

[[entry]]
id = "ref/blessing/earthquake"
anchor = "spellcasting"
print = '''
An avenging beast casts divine spells as a hunter and uses the hunter's spell list.

This replaces the vigilante talents gained at 4th, 8th, 10th, 14th, and 16th level.'''

[[entry]]
id = "ref/blessing/earthquake"
anchor = "patron-spells"
print = '''
An avenging beast selects a patron from the witch patron list and adds the patron bonus spells to his spell list (up to 6th-level spells). Patron spells of 7th level or higher are not counted as being on the avenging beast's spell list.

This replaces vigilante specialization.'''

[[entry]]
id = "ref/blessing/earthquake"
anchor = "wild-shape"
print = '''
At 5th level, when in his vigilante identity, the avenging beast gains the ability to take on the shape of the animal represented by his animal mask. This ability functions identically to the druid's wild shape ability, except the ability does not improve beyond functioning as _beast shape I_. The avenging beast treats his vigilante level as his druid level for the purposes of this ability. An avenging beast can use wild shape once per day at 5th level and one additional time per day at 7th level and every 2 levels thereafter, for a total of eight times per day at 19th level.

This replaces startling appearance, frightening appearance, and stunning appearance.'''

[[entry]]
id = "ref/blessing/earthquake"
anchor = "feral-champion-warpriest-archetype"
print = "When a warpriest devotes himself to a god of the natural world, he is sometimes blessed with supernatural powers that allow him to evoke animalistic power and fury."

[[entry]]
id = "ref/blessing/earthquake"
anchor = "feral-blessing"
print = '''
A feral champion must take the Animal blessing and does not gain a second blessing.

This alters blessings.'''

[[entry]]
id = "ref/blessing/earthquake"
anchor = "sacred-claws"
print = '''
Rather than empowering a physical weapon, a feral champion grows claws as primary natural weapons on each hand. These claws deal damage as a warpriest's sacred weapon and can be enhanced as such.

This alters sacred weapon.'''

[[entry]]
id = "ref/blessing/earthquake"
anchor = "wild-shape"
print = '''
At 7th level, a feral champion gains wild shape, as the druid ability of the same name, and treats his warpriest level - 3 as his effective druid level for the purposes of this ability. However, a feral champion does not gain the ability to take on elemental or plant forms with wild shape. A feral champion can use wild shape once per day at 7th level and one additional time per day every 4 levels thereafter, for a total of four times per day at 19th level.

This replaces sacred armor.'''

[[entry]]
id = "ref/blessing/earthquake"
anchor = "disaster-blessings-warpriest-blessings"
print = "Evil deities that offer the Air, Earth, Fire, and Water blessings or nonevil deities with disasters in their portfolios might also offer these disaster blessings as options for their warpriests."

[[entry]]
id = "ref/blessing/earthquake"
anchor = "earthquake-blessing"
print = "The fury of the quaking earth infuses your faith."

[[entry]]
id = "ref/blessing/earthquake"
anchor = "stone-s-base-minor"
print = "You can touch an ally to bless it with the stalwart resilience of stone. For 1 minute, the creature gains a +4 bonus to its CMD against maneuvers that would move the ally or knock it prone."

[[entry]]
id = "ref/blessing/earthquake"
anchor = "earth-hammer-major"
print = "At 10th level, you can touch a weapon to bless it with the force of a mighty earthquake for 1 minute. When the weapon hits a creature, the target must succeed at a Reflex save or fall [prone](ref/rule/prone); either way, the creature is immune to this ability for 24 hours."

[[entry]]
id = "ref/blessing/earthquake"
anchor = "flood-blessing"
print = "You see proof of your convictions in the churning waters of a flood."

[[entry]]
id = "ref/blessing/earthquake"
anchor = "lasting-breath-minor"
print = "You can touch an ally to bless it with an extra reserve of breath. For 1 minute, while the ally holds its breath, standard and full-round actions don't decrease the number of rounds the ally can hold its breath (see page 445 of _Pathfinder RPG Core Rulebook_)."

[[entry]]
id = "ref/blessing/earthquake"
anchor = "tsunami-burst-major"
print = "At 10th level, when you are hit by a melee attack, you can invoke this blessing as an immediate action. A wave of water blasts out from you at your attacker, attempting a bull rush combat maneuver check using your CMB but adding your Wisdom modifier instead of your Strength modifier."

[[entry]]
id = "ref/blessing/earthquake"
anchor = "tornado-blessing"
print = "The howling wrath of a tornado inspires your religion."

[[entry]]
id = "ref/blessing/earthquake"
anchor = "dust-devil-minor"
print = "When you hit with a weapon attack, you can use a swift action to cause a sudden burst of wind and debris to swirl around your target. The target is dazzled for 1 minute."

[[entry]]
id = "ref/blessing/earthquake"
anchor = "howling-gale-major"
print = "At 10th level, you can invoke a howling windstorm around yourself as a standard action. For 1 minute, any Large or smaller creature takes twice as much movement to enter a space adjacent to you due to the winds, and thus can't take a 5-foot step to move adjacent to you."

[[entry]]
id = "ref/blessing/earthquake"
anchor = "wildfire-blessing"
print = "In the flames of a wildfire you take inspiration."

[[entry]]
id = "ref/blessing/earthquake"
anchor = "leaping-flames-minor"
print = "You touch an ally to bless it with the speed of a wildfire for 1 minute. The ally gains a +10-foot enhancement bonus to its base speed, and the ally gains a +1 dodge bonus to its AC against attacks of opportunity."

[[entry]]
id = "ref/blessing/earthquake"
anchor = "fiery-wake-major"
print = "At 10th level, when you move, you can use a swift action to invoke a blazing blessing on yourself. For the rest of your turn, your movement leaves behind a 10-foot-tall wall of opaque fire in your path. The wall burns for 1 minute. A creature that touches the wall takes 2d6 points of fire damage."

[[entry]]
id = "ref/blessing/earthquake"
anchor = "feats"
print = "Feats represent special abilities that characters acquire through training, luck, or a quirk of birth. They grant abilities and benefits in certain situations, and some feats are more useful to certain types of characters than others; many of them have prerequisites."

[[entry]]
id = "ref/blessing/earthquake"
anchor = "types-of-feats"
print = "Though most of the feats presented in this chapter are general and have no special rules governing them, some feats belong to a type or types of feats that share special rules. A feat's types appear in parentheses after the feat name. This chapter features the following types of feats."

[[entry]]
id = "ref/blessing/earthquake"
anchor = "combat-feats"
print = "Brawlers, fighters, gunslingers, swashbucklers, and warpriests can select combat feats as bonus feats. Members of other classes can take combat feats provided they meet the prerequisites."

[[entry]]
id = "ref/blessing/earthquake"
anchor = "style-feats"
print = '''
Style feats were first introduced in _Pathfinder RPG Ultimate Combat_. The style feats presented in this chapter are suited for those who have learned to fight or grew up fighting in the wilderness.

As a swift action, you can enter the stance employed by the fighting style that a style feat embodies. Although you can't use a style feat before combat begins, once you've entered a stance, the style you are in persists until either you use a swift action to switch styles or until the end of the combat encounter, whichever occurs first. You can use a feat that has a style feat as a prerequisite only while you are in the stance of the associated style.

The styles presented in this book follow, along with specific feat paths—the progression of feats that complement each style.'''

[[entry]]
id = "ref/blessing/earthquake"
anchor = "beastmaster-style"
print = '''
While in this style, you have greater control over your non-mount animal companion.

_Feat Path:_ Beastmaster Style, Beastmaster Salvation, Beastmaster Ire.'''

[[entry]]
id = "ref/blessing/earthquake"
anchor = "crashing-wave-style"
print = '''
Someone skilled in this style jostles and pulls her opponents about, inspired by the power of ocean waves churning upon the shore.

_Feat Path:_ Crashing Wave Style, Crashing Wave Buffet, Crashing Wave Fist.'''

[[entry]]
id = "ref/blessing/earthquake"
anchor = "indomitable-mountain-style"
print = '''
A practitioner of this style stands like a mighty mountain, difficult to move and punishing those who try.

_Feat Path:_ Indomitable Mountain Style, Indomitable Mountain Peak, Indomitable Mountain Avalanche.'''

[[entry]]
id = "ref/blessing/earthquake"
anchor = "wolf-style"
print = '''
This style mimics the harrying tactics that wolves use when they hunt: slowing, tripping, and then savaging a foe.

_Feat Path:_ Wolf Style, Wolf Trip, Wolf Savage.'''

[[entry]]
id = "ref/blessing/earthquake"
anchor = "item-creation-feats"
print = "An item creation feat lets a character create a magic item of a certain type. Regardless of the type of item, the various item creation feats have several features in common, primarily the cost in money, raw materials, and time required to create the item. Other costs may apply, and each item requires a specific skill check. Full information on these common features can be found on page 112 of the _Pathfinder RPG Core Rulebook_."

[[entry]]
id = "ref/blessing/earthquake"
anchor = "metamagic-feats"
print = "Metamagic feats allow spellcasters to modify and enhance their spells, granting the spells new powers and effects. Such spells generally take up a higher-level spell slot than the normal spell. For complete rules on how to apply metamagic feats to spells, see page 112 of the _Pathfinder RPG Core Rulebook_."

[[entry]]
id = "ref/blessing/earthquake"
anchor = "teamwork-feats"
print = "Teamwork feats grant significant bonuses, but they function only under specific circumstances. In most cases, these feats require an ally with the same feat to have a specific position on the battlefield. Teamwork feats provide their benefit only if the given conditions are met. Allies who are paralyzed, stunned, unconscious, or otherwise unable to act don't count for the purpose of these feats. Cavaliers, hunters, and inquisitors have special class abilities that allow them to use teamwork feats even if their allies don't have those feats."

[[entry]]
id = "ref/blessing/earthquake"
anchor = "feat-descriptions"
print = '''
The feats in this chapter and those found in the race sections of Chapter 1 are summarized on Table 3–1: Feats on pages 101–105. The prerequisites and benefits of the feats listed in this table are abbreviated for ease of reference. See the feats' description for full details. Additionally, numerous feats for specific races appear in Chapter 1.

All feat descriptions use the following format.'''

[[entry]]
id = "ref/blessing/earthquake"
anchor = "feat-name"
print = "The feat's name also indicates what type or types, if any, the feat belongs to, and is followed by a basic description of what the feat does."

[[entry]]
id = "ref/blessing/earthquake"
anchor = "prerequisite"
print = "This entry lists the minimum ability score, feats, minimum base attack bonus, minimum number of ranks in one or more skills, or anything else required in order to take the feat. This entry is absent if a feat has no prerequisites. A feat can have more than one prerequisite. Prerequisites from this book, such as classes, class abilities, and feats, are marked with an asterisk (\\*)."

[[entry]]
id = "ref/blessing/earthquake"
anchor = "benefit"
print = "This entry describes what a feat enables the character (\"you\" in the feat description) to do. If a character has the same feat more than once, its benefits do not stack unless indicated otherwise in the description."

[[entry]]
id = "ref/blessing/earthquake"
anchor = "normal"
print = "This entry states what a character who doesn't have this feat is limited to or restricted from doing. If not having the feat causes no particular drawback, this entry is absent."

[[entry]]
id = "ref/blessing/earthquake"
anchor = "special"
print = "Additional unusual facts about the feat."

[[entry]]
id = "ref/blessing/flood"
anchor = "opening"
print = '''
arrow champion spends 1 panache point, she can perform either action as an immediate action. In addition, if she has the Quick Draw feat and one of her hands is free, she can sheathe a weapon and draw an unhidden weapon as part of the same swift action, provided that one of the weapons is a bow and the other is a light or one-handed piercing melee weapon. If she spends 1 panache point, she can perform the switch as an immediate action.

This deed replaces swashbuckler's initiative.

_Archer's Feint (Ex):_ At 7th level, when the arrow champion hits a foe within 30 feet with a bow attack, she can forgo the damage and instead attempt a Bluff check to feint against that foe as a swift action. If successful, in addition to the normal benefits of feinting, she doubles the extra damage from precise aim on her next melee attack before the end of her next turn.

This deed replaces superior feint.'''

[[entry]]
id = "ref/blessing/flood"
anchor = "weapon-versatility"
print = '''
At 5th level, an arrow champion learns to use precision-based tricks just as accurately with her bow as with her melee weapons. Provided that her swashbuckler level is high enough, she can use the bleeding wound, deadly stab, menacing swordplay, perfect thrust, stunning stab, and targeted strike deeds when attacking with a bow, so long as her target is within 30 feet. If she spends a panache point to increase the range of her precise aim ability, the increased range applies to this ability as well.

This replaces swashbuckler weapon training.'''

[[entry]]
id = "ref/blessing/flood"
anchor = "versatile-weapon-mastery"
print = '''
At 20th level, an arrow champion gains the benefits of swashbuckler weapon mastery when using a light or one-handed piercing melee weapon or a bow.

This alters swashbuckler weapon mastery.'''

[[entry]]
id = "ref/blessing/flood"
anchor = "wildstrider-swashbuckler-archetype"
print = "Most swashbucklers call cities their home, but some prefer deserts, marshlands, mountains, or woods, where the rough terrain grants them an advantage, and have little interest in the comforts of an urban lifestyle."

[[entry]]
id = "ref/blessing/flood"
anchor = "class-skills"
print = '''
A wildstrider gains Knowledge (nature), Stealth, and Survival as class skills, but does not gain Knowledge (nobility), Sense Motive, and Sleight of Hand as class skills.

This alters the swashbuckler's class skills.'''

[[entry]]
id = "ref/blessing/flood"
anchor = "deeds"
print = '''
A wildstrider gains the following deeds, each of which replaces an existing deed.

_Subterfuge (Ex):_ A wildstrider adds Stealth to the list of skills to which the derring-do deed applies. At 15th level, she adds Stealth to the list of skills on which she can take 10 using the swashbuckler's edge deed.

This deed replaces dodging panache and alters derring-do and swashbuckler's edge.

_Adroit Step (Ex):_ At 3rd level, a wildstrider can use a swift action to treat a 5-foot square of difficult terrain as if it were normal terrain. If she also spends a panache point, she can treat all difficult terrain as though it were normal terrain until the end of her turn.

This deed replaces kip-up.

_Keen Gaze (Ex):_ At 11th level, while a wildstrider has at least 1 panache point, she can ignore the miss chance from concealment (but not total concealment) caused by normal and magical fog, smoke, and undergrowth, but not other sources of concealment or a miss chance, such as _blur_.

This deed replaces subtle blade.'''

[[entry]]
id = "ref/blessing/flood"
anchor = "avenging-beast-vigilante-archetype"
print = "Some vigilantes turn to natural traditions and supernatural forces to transform into beasts, unleashing a primal fury on their foes before returning to an ordinary guise."

[[entry]]
id = "ref/blessing/flood"
anchor = "class-skills"
print = '''
An avenging beast gains Knowledge (nature) and Spellcraft as class skills, but does not gain Disable Device, Knowledge (engineering), Perform, and Sleight of Hand as class skills.

This alters the vigilante's class skills.'''

[[entry]]
id = "ref/blessing/flood"
anchor = "skill-ranks-per-level"
print = '''
An avenging beast gains a number of skill ranks equal to 4 + his Intelligence modifier at each level, instead of 6 + his Intelligence modifier.

This alters the vigilante's skill ranks per level.'''

[[entry]]
id = "ref/blessing/flood"
anchor = "animal-mask"
print = '''
An avenging beast gains an ornate animal-headed mask that is a focus for his power and must be worn when assuming his vigilante identity. This mask symbolizes one specific animal, and the animal cannot be changed once chosen. Without this mask, an avenging beast cannot assume his vigilante identity. An avenging beast who loses his mask can replace it after 1 week through a specialized ritual that takes 8 hours to complete and costs 200 gp per avenging beast level.

This alters dual identity.'''

[[entry]]
id = "ref/blessing/flood"
anchor = "spellcasting"
print = '''
An avenging beast casts divine spells as a hunter and uses the hunter's spell list.

This replaces the vigilante talents gained at 4th, 8th, 10th, 14th, and 16th level.'''

[[entry]]
id = "ref/blessing/flood"
anchor = "patron-spells"
print = '''
An avenging beast selects a patron from the witch patron list and adds the patron bonus spells to his spell list (up to 6th-level spells). Patron spells of 7th level or higher are not counted as being on the avenging beast's spell list.

This replaces vigilante specialization.'''

[[entry]]
id = "ref/blessing/flood"
anchor = "wild-shape"
print = '''
At 5th level, when in his vigilante identity, the avenging beast gains the ability to take on the shape of the animal represented by his animal mask. This ability functions identically to the druid's wild shape ability, except the ability does not improve beyond functioning as _beast shape I_. The avenging beast treats his vigilante level as his druid level for the purposes of this ability. An avenging beast can use wild shape once per day at 5th level and one additional time per day at 7th level and every 2 levels thereafter, for a total of eight times per day at 19th level.

This replaces startling appearance, frightening appearance, and stunning appearance.'''

[[entry]]
id = "ref/blessing/flood"
anchor = "feral-champion-warpriest-archetype"
print = "When a warpriest devotes himself to a god of the natural world, he is sometimes blessed with supernatural powers that allow him to evoke animalistic power and fury."

[[entry]]
id = "ref/blessing/flood"
anchor = "feral-blessing"
print = '''
A feral champion must take the Animal blessing and does not gain a second blessing.

This alters blessings.'''

[[entry]]
id = "ref/blessing/flood"
anchor = "sacred-claws"
print = '''
Rather than empowering a physical weapon, a feral champion grows claws as primary natural weapons on each hand. These claws deal damage as a warpriest's sacred weapon and can be enhanced as such.

This alters sacred weapon.'''

[[entry]]
id = "ref/blessing/flood"
anchor = "wild-shape"
print = '''
At 7th level, a feral champion gains wild shape, as the druid ability of the same name, and treats his warpriest level - 3 as his effective druid level for the purposes of this ability. However, a feral champion does not gain the ability to take on elemental or plant forms with wild shape. A feral champion can use wild shape once per day at 7th level and one additional time per day every 4 levels thereafter, for a total of four times per day at 19th level.

This replaces sacred armor.'''

[[entry]]
id = "ref/blessing/flood"
anchor = "disaster-blessings-warpriest-blessings"
print = "Evil deities that offer the Air, Earth, Fire, and Water blessings or nonevil deities with disasters in their portfolios might also offer these disaster blessings as options for their warpriests."

[[entry]]
id = "ref/blessing/flood"
anchor = "earthquake-blessing"
print = "The fury of the quaking earth infuses your faith."

[[entry]]
id = "ref/blessing/flood"
anchor = "stone-s-base-minor"
print = "You can touch an ally to bless it with the stalwart resilience of stone. For 1 minute, the creature gains a +4 bonus to its CMD against maneuvers that would move the ally or knock it prone."

[[entry]]
id = "ref/blessing/flood"
anchor = "earth-hammer-major"
print = "At 10th level, you can touch a weapon to bless it with the force of a mighty earthquake for 1 minute. When the weapon hits a creature, the target must succeed at a Reflex save or fall prone; either way, the creature is immune to this ability for 24 hours."

[[entry]]
id = "ref/blessing/flood"
anchor = "flood-blessing"
print = "You see proof of your convictions in the churning waters of a flood."

[[entry]]
id = "ref/blessing/flood"
anchor = "lasting-breath-minor"
print = "You can touch an ally to bless it with an extra reserve of breath. For 1 minute, while the ally [holds its breath](ref/misc/hold-your-breath), standard and full-round actions don't decrease the number of rounds the ally can hold its breath (see page 445 of _Pathfinder RPG Core Rulebook_)."

