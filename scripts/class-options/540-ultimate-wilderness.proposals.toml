anchor = "sure-footing"
print = "The slayer gains a +5 bonus on Acrobatics checks to move on narrow surfaces and loose or uneven ground."

[[entry]]
id = "ref/slayertalent/toxin-training"
anchor = "toxin-training"
print = "The slayer builds resistance to certain poisons over time. Each time he chooses this talent, he chooses one ability score. He gains a +4 bonus on saving throws against poisons that deal damage to the chosen ability score. The slayer can choose this talent multiple times. Each time he does, he chooses a new ability score and gains the bonus on saves against poisons that target that ability. The slayer must be at least 4th level and have the [poison use](ref/slayertalent/poison-use) talent to select this talent."
