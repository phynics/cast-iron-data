print = "_Shillelagh_ (1st), _barkskin_ (2nd), _minor creation_ (wood items only) (3rd), _thorn body_ (4th), _tree stride_ (5th), _ironwood_ (6th), _transmute metal to wood_ (7th), _changestaff_ (8th), _wooden phalanx_ (9th)."

[[entry]]
id = "ref/discipline/symbiosis"
anchor = "hexes"
print = "A shaman who chooses the wood spirit can select from the following hexes."

[[entry]]
id = "ref/discipline/symbiosis"
anchor = "hex-of-lignification"
print = "The shaman causes a creature within 30 feet to turn into a twisted, treelike shape for 2 rounds. The target gains hardness 5 but is staggered, and can negate the effect with a successful Fortitude saving throw. Whether or not the target succeeds at its save, it can't be the target of this hex again for 24 hours."

[[entry]]
id = "ref/discipline/symbiosis"
anchor = "nature-s-gifts"
print = "Once per day, the shaman can command trees and other plants to yield magical berries and fruit. This ability functions as _goodberry_, except the maximum number of hit points it can restore to a subject in a 24-hour period from this hex is equal to the shaman's Charisma modifier (minimum 1 hit point per day)."

[[entry]]
id = "ref/discipline/symbiosis"
anchor = "spines-and-brambles"
print = "With a beckoning gesture, the shaman conjures spiny shrubs in a number of squares equal to her Charisma modifier (minimum 1) within 30 feet. The squares become filled with light undergrowth (_Pathfinder RPG Core Rulebook_ 426). The shaman can pass through the affected squares without impediment. When the shaman uses this hex again, any previously conjured undergrowth withers away."

[[entry]]
id = "ref/discipline/symbiosis"
anchor = "verdant-path"
print = "Even the most tangled briars make way for the shaman, and suitable roots and branches appear to support her feet. The shaman gains woodland stride, as per the druid ability of the same name. At 8th level, she can use _air walk_ at will whenever she is within 10 feet of a tree, though the effect ends instantly when she moves farther than 10 feet from a tree."

[[entry]]
id = "ref/discipline/symbiosis"
anchor = "whispering-leaves"
print = "Whenever the shaman is within 10 feet of a tree or undergrowth, she can cast _whispering wind_ as a spell-like ability with a caster level equal to her shaman level. The targeted area must also contain trees or undergrowth, which relay the message in a gentle, rustling voice. At 8th level, the shaman can also listen to the targeted area as though she were using _clairaudience/clairvoyance_ for the 1 round during which the hex is delivering the message."

[[entry]]
id = "ref/discipline/symbiosis"
anchor = "spirit-animal"
print = "The shaman's spirit animal looks like a wooden figurine or a vaguely animal-shaped tree branch when it is motionless. The animal gains freeze as per the universal monster rule (_Pathfinder RPG Bestiary 2_ 297)."

[[entry]]
id = "ref/discipline/symbiosis"
anchor = "spirit-ability"
print = "A shaman who chooses the wood spirit as her spirit or wandering spirit gains the following ability."

[[entry]]
id = "ref/discipline/symbiosis"
anchor = "tree-limb"
print = '''
As a swift action, the shaman can turn one of her arms into a heavy, branch-like limb. She must drop anything held in that hand, and she can't use this ability if she is wearing a shield on that arm. Until the beginning of her next turn, she gains a slam attack that deals 1d8 points of damage (for a Medium shaman; 1d6 if Small, 2d6 if Large). A shaman can use this ability a number of times per day equal to 3 + her Charisma modifier.

At 8th level, the reach of this slam attack increases by 5 feet. At 16th level, the shaman can transform both of her arms, gaining two slam attacks.'''

[[entry]]
id = "ref/discipline/symbiosis"
anchor = "greater-spirit-ability"
print = "A shaman who chooses the wood spirit as her spirit or wandering spirit gains the following ability upon having access to the greater version of that spirit."

[[entry]]
id = "ref/discipline/symbiosis"
anchor = "bloody-roots"
print = '''
As a standard action, the shaman can cause a field of thick roots to burrow up from the ground. This ability functions as _black tentacles_ with a caster level equal to the shaman's level. The area is centered on the shaman when she activates the ability but remains stationary if she then moves. The shaman is unaffected by the roots. Her allies treat the area as difficult terrain, but the roots don't attack them.

The shaman can end the effect as a free action. She can use this ability a number of rounds per day equal to 3 + her Charisma modifier, but these rounds do not need to be consecutive.'''

[[entry]]
id = "ref/discipline/symbiosis"
anchor = "true-spirit-ability"
print = "A shaman who chooses the wood spirit as her spirit or wandering spirit gains the following ability upon having access to the true version of that spirit."

[[entry]]
id = "ref/discipline/symbiosis"
anchor = "tree-form"
print = "As a standard action, the shaman can assume the form of a plant creature as per _plant shape III_ with a duration of 1 hour per level. She can use this ability once per day."

[[entry]]
id = "ref/discipline/symbiosis"
anchor = "manifestation"
print = "Upon reaching 20th level, the shaman becomes a living creature of wood. She is forevermore treated as a plant creature rather than her original creature type for the purposes of spells and magical effects. Her skin takes on the appearance of polished wood grain, and she gains a +4 natural armor bonus to her Armor Class and damage reduction 10/— against wooden weapons and the natural attacks of wooden and wood-like creatures. She gains immunity to paralysis, poison, polymorph, sleep, and stun. At will, the shaman can meld with any tree or single block of wood (as per _meld into stone_, except she can meld only with wood and has no limit on how long she can remain in the wood)."

[[entry]]
id = "ref/discipline/symbiosis"
anchor = "leshy-caller-summoner-archetype"
print = "A leshy caller summons creatures from the First World and forges a bond with a leshy eidolon."

[[entry]]
id = "ref/discipline/symbiosis"
anchor = "leshy-eidolon"
print = "When a leshy caller summons her eidolon, the eidolon's body is created from extraplanar plant material and imbued with the intelligence of a leshy spirit. Its statistics are changed from those of a standard eidolon as follows. An unchained summoner uses the plant eidolon subtype (see page 95) instead of one of the subtypes listed in _Pathfinder RPG Pathfinder Unchained_."

[[entry]]
id = "ref/discipline/symbiosis"
anchor = "type"
print = "The eidolon is still an outsider, and its statistics don't change, but it also counts as a plant. As it isn't truly a plant, it doesn't gain the plant immunities."

[[entry]]
id = "ref/discipline/symbiosis"
anchor = "base-form"
print = '''
The leshy caller chooses one of the base forms listed below for her eidolon. When the eidolon is summoned in an environment matching one of these base forms, the leshy caller can change the eidolon's base form to the matching form by sacrificing one daily use of her _summon nature's ally_ ability as a free action.

Plant eidolon base forms are as follows.

_Cactus (Desert):_ Size Medium; Speed 30 ft.; AC +2 natural armor; Saves Fort (good), Ref (good), Will (bad); Attack sting (1d4); Ability Scores Str 14, Dex 14, Con 13, Int 7, Wis 10, Cha 11; Free Evolutions limbs (arms), limbs (legs), sting.

_Conifer (Forest, Mountain):_ Size Medium; Speed 30 ft.; AC +2 natural armor; Saves Fort (good), Ref (bad), Will (good); Attack 2 claws (1d4); Ability Scores Str 14, Dex 12, Con 15, Int 7, Wis 10, Cha 11; Free Evolutions claws, limbs (arms), limbs (legs).

_Fungus (Swamp, Underground):_ Size Medium; Speed 30 ft.; AC +2 natural armor; Saves Fort (good), Ref (good), Will (bad); Attack bite (1d6); Ability Scores Str 14, Dex 14, Con 13, Int 7, Wis 10, Cha 11; Free Evolutions bite, limbs (arms), limbs (legs).

_Leaf (Forest, Jungle, Swamp):_ Size Medium; Speed 30 ft.; AC +2 natural armor; Saves Fort (good), Ref (good), Will (bad); Attack slam (1d8); Ability Scores Str 16, Dex 12, Con 13, Int 7, Wis 10, Cha 11; Free Evolutions limbs (arms), limbs (legs), slam.

_Seaweed (Aquatic):_ Size Medium; Speed 20 ft., swim 40 ft.; AC +2 natural armor; Saves Fort (good), Ref (good), Will (bad); Attack slam (1d8); Ability Scores Str 12, Dex 14, Con 15, Int 7, Wis 10, Cha 11; Free Evolutions limbs (arms), slam, swim (2).

This alters the summoner's eidolon.'''

[[entry]]
id = "ref/discipline/symbiosis"
anchor = "summon-nature-s-ally"
print = '''
A leshy caller can cast _summon nature's ally_ as a spell-like ability a number of times per day equal to 3 + her Charisma modifier. At levels where a regular summoner would gain access to a new level of _summon monster_ as a spell-like ability, the leshy caller instead gains the equivalent _summon nature's ally_ spell; at 19th level, she can cast _summon nature's ally IX_ or _gate_. When a leshy caller gains a _summon nature's ally_ spell as a spell-like ability, she adds it to her class spell list (though she must still select it as a spell known if she wants to gain the ability to cast it as a normal spell). She adds leaf leshys, gourd leshys, fungus leshys, seaweed leshys, and lotus leshys to her list of creatures for _summon nature's ally I_, _II_, _III_, _IV_, and _V_, respectively.

This alters summon monster.'''

[[entry]]
id = "ref/discipline/symbiosis"
anchor = "plant-eidolon-subtype"
print = "Plant eidolons consist of vegetable matter infused with raw natural spiritual power."

[[entry]]
id = "ref/discipline/symbiosis"
anchor = "alignment"
print = "Any. Plant eidolons don't have alignment subtypes."

[[entry]]
id = "ref/discipline/symbiosis"
anchor = "base-form"
print = "Cactus (limbs \\[arms\\], limbs \\[legs\\], sting), conifer (claws, limbs \\[arms\\], limbs \\[legs\\]), fungus (bite, limbs \\[arms\\], limbs \\[legs\\]), leaf (limbs \\[arms\\], limbs \\[legs\\], slam), seaweed (limbs \\[arms\\], slam, swim \\[2\\])."

[[entry]]
id = "ref/discipline/symbiosis"
anchor = "base-evolutions"
print = '''
At 1st level, plant eidolons gain low-light vision as well as the resistance (electricity) and resistance (sonic) evolutions.

At 4th level, plant eidolons gain constant _pass without trace_ and they can change shape into plants of the size category corresponding to their base form with results similar to _tree shape_.

At 8th level, plant eidolons gain the ability to use _speak with plants_ for 1 minute per Hit Die per day with any plants related to the eidolon's base form. These minutes need not be consecutive.

At 12th level, plant eidolons gain immunity to paralysis, poison, sleep, and stun.

At 16th level, plant eidolons gain the ability to use _commune with nature_ once per day and can use their _speak with plants_ ability at will. At 20th level, plant eidolons gain a +8 resistance bonus on saving throws against mind-affecting effects. They lose their resistance (electricity) and resistance (sonic) evolutions and instead gain the immunity (electricity) and immunity (sonic) evolutions.'''

[[entry]]
id = "ref/discipline/symbiosis"
anchor = "arrow-champion-swashbuckler-archetype"
print = "While the swashbuckler's agile style of combat is equally suited to urban settings and wilderness, the bow and arrow is an indispensable asset in open areas and harsh terrain where fancy footwork isn't enough to close the distance or dodge the enemy's arrows."

[[entry]]
id = "ref/discipline/symbiosis"
anchor = "arrow-champion-s-panache"
print = '''
An arrow champion regains panache when she makes a killing blow with a light or one-handed piercing melee weapon or a bow (a longbow, shortbow, composite longbow, or composite shortbow).

This alters panache.'''

[[entry]]
id = "ref/discipline/symbiosis"
anchor = "deeds"
print = '''
An arrow champion gains the following deeds, each of which replaces an existing deed.

_Retaliation (Ex):_ When a foe hits the arrow champion with an attack, she can spend 1 panache point to make a retaliatory attack of opportunity against that foe. If the triggering attack is a melee attack, she can retaliate with a melee attack using a light or one-handed piercing melee weapon, provided the creature is within her reach. If the triggering attack is a ranged attack, she can retaliate with a ranged attack using a bow, provided that the creature is within 30 feet of her. This deed's cost cannot be reduced by any ability or effect that reduces the number of panache points a deed costs.

This deed replaces opportune parry and riposte.

_Precise Aim (Ex):_ At 3rd level, when attacking with a light or one-handed piercing melee weapon, an arrow champion can add her swashbuckler level to the damage she deals, as the swashbuckler's precise strike deed. She can also add one-quarter of her swashbuckler level to the damage dealt when attacking with a bow, but the target must be within 30 feet of her. As a swift action, an arrow champion can spend 1 panache point to increase the range of the effect to her bow's first range increment. Unlike a normal swashbuckler, an arrow champion cannot spend panache to double the extra damage.

This deed alters precise strike.

_Swift Switch (Ex):_ At 3rd level, while the arrow champion has at least 1 panache point, she can sheathe or draw an unhidden light or one-handed piercing melee weapon or a bow as a swift action without provoking attacks of opportunity. If the arrow champion spends 1 panache point, she can perform either action as an immediate action. In addition, if she has the Quick Draw feat and one of her hands is free, she can sheathe a weapon and draw an unhidden weapon as part of the same swift action, provided that one of the weapons is a bow and the other is a light or one-handed piercing melee weapon. If she spends 1 panache point, she can perform the switch as an immediate action.

This deed replaces swashbuckler's initiative.

_Archer's Feint (Ex):_ At 7th level, when the arrow champion hits a foe within 30 feet with a bow attack, she can forgo the damage and instead attempt a Bluff check to feint against that foe as a swift action. If successful, in addition to the normal benefits of feinting, she doubles the extra damage from precise aim on her next melee attack before the end of her next turn.

This deed replaces superior feint.'''

[[entry]]
id = "ref/discipline/symbiosis"
anchor = "weapon-versatility"
print = '''
At 5th level, an arrow champion learns to use precision-based tricks just as accurately with her bow as with her melee weapons. Provided that her swashbuckler level is high enough, she can use the bleeding wound, deadly stab, menacing swordplay, perfect thrust, stunning stab, and targeted strike deeds when attacking with a bow, so long as her target is within 30 feet. If she spends a panache point to increase the range of her precise aim ability, the increased range applies to this ability as well.

This replaces swashbuckler weapon training.'''

[[entry]]
id = "ref/discipline/symbiosis"
anchor = "versatile-weapon-mastery"
print = '''
At 20th level, an arrow champion gains the benefits of swashbuckler weapon mastery when using a light or one-handed piercing melee weapon or a bow.

This alters swashbuckler weapon mastery.'''

[[entry]]
id = "ref/discipline/symbiosis"
anchor = "wildstrider-swashbuckler-archetype"
print = "Most swashbucklers call cities their home, but some prefer deserts, marshlands, mountains, or woods, where the rough terrain grants them an advantage, and have little interest in the comforts of an urban lifestyle."

[[entry]]
id = "ref/discipline/symbiosis"
anchor = "class-skills"
print = '''
A wildstrider gains Knowledge (nature), Stealth, and Survival as class skills, but does not gain Knowledge (nobility), Sense Motive, and Sleight of Hand as class skills.

This alters the swashbuckler's class skills.'''

[[entry]]
id = "ref/discipline/symbiosis"
anchor = "deeds"
print = '''
A wildstrider gains the following deeds, each of which replaces an existing deed.

_Subterfuge (Ex):_ A wildstrider adds Stealth to the list of skills to which the derring-do deed applies. At 15th level, she adds Stealth to the list of skills on which she can take 10 using the swashbuckler's edge deed.

This deed replaces dodging panache and alters derring-do and swashbuckler's edge.

_Adroit Step (Ex):_ At 3rd level, a wildstrider can use a swift action to treat a 5-foot square of difficult terrain as if it were normal terrain. If she also spends a panache point, she can treat all difficult terrain as though it were normal terrain until the end of her turn.

This deed replaces kip-up.

_Keen Gaze (Ex):_ At 11th level, while a wildstrider has at least 1 panache point, she can ignore the miss chance from concealment (but not total concealment) caused by normal and magical fog, smoke, and undergrowth, but not other sources of concealment or a miss chance, such as _blur_.

This deed replaces subtle blade.'''

[[entry]]
id = "ref/discipline/symbiosis"
anchor = "avenging-beast-vigilante-archetype"
print = "Some vigilantes turn to natural traditions and supernatural forces to transform into beasts, unleashing a primal fury on their foes before returning to an ordinary guise."

[[entry]]
id = "ref/discipline/symbiosis"
anchor = "class-skills"
print = '''
An avenging beast gains Knowledge (nature) and Spellcraft as class skills, but does not gain Disable Device, Knowledge (engineering), Perform, and Sleight of Hand as class skills.

This alters the vigilante's class skills.'''

[[entry]]
id = "ref/discipline/symbiosis"
anchor = "skill-ranks-per-level"
print = '''
An avenging beast gains a number of skill ranks equal to 4 + his Intelligence modifier at each level, instead of 6 + his Intelligence modifier.

This alters the vigilante's skill ranks per level.'''

[[entry]]
id = "ref/discipline/symbiosis"
anchor = "animal-mask"
print = '''
An avenging beast gains an ornate animal-headed mask that is a focus for his power and must be worn when assuming his vigilante identity. This mask symbolizes one specific animal, and the animal cannot be changed once chosen. Without this mask, an avenging beast cannot assume his vigilante identity. An avenging beast who loses his mask can replace it after 1 week through a specialized ritual that takes 8 hours to complete and costs 200 gp per avenging beast level.

This alters dual identity.'''

[[entry]]
id = "ref/discipline/symbiosis"
anchor = "spellcasting"
print = '''
An avenging beast casts divine spells as a hunter and uses the hunter's spell list.

This replaces the vigilante talents gained at 4th, 8th, 10th, 14th, and 16th level.'''

[[entry]]
id = "ref/discipline/symbiosis"
anchor = "patron-spells"
print = '''
An avenging beast selects a patron from the witch patron list and adds the patron bonus spells to his spell list (up to 6th-level spells). Patron spells of 7th level or higher are not counted as being on the avenging beast's spell list.

This replaces vigilante specialization.'''

[[entry]]
id = "ref/discipline/symbiosis"
anchor = "wild-shape"
print = '''
At 5th level, when in his vigilante identity, the avenging beast gains the ability to take on the shape of the animal represented by his animal mask. This ability functions identically to the druid's wild shape ability, except the ability does not improve beyond functioning as _beast shape I_. The avenging beast treats his vigilante level as his druid level for the purposes of this ability. An avenging beast can use wild shape once per day at 5th level and one additional time per day at 7th level and every 2 levels thereafter, for a total of eight times per day at 19th level.

This replaces startling appearance, frightening appearance, and stunning appearance.'''

[[entry]]
id = "ref/discovery/bitter-pill"
anchor = "bitter-pill"
print = "The alchemist becomes bitter in flavor. Any creature that hits the bitter alchemist with a bite attack gains the [sickened](ref/misc/sickened) condition for 1 round unless it succeeds at a Fortitude save (DC = 10 + half the alchemist's level + the alchemist's Constitution modifier). Any creature that swallows the alchemist whole gains the [nauseated](ref/misc/nauseated) condition for 1 round unless it succeeds at a Fortitude save (same DC as above). If the alchemist is trapped in the creature's gullet and it becomes nauseated, the creature vomits him back out immediately as a free action at the start of the creature's turn; the alchemist lands [prone](ref/rule/prone) adjacent to the creature."

[[entry]]
id = "ref/discovery/grounding-goo"
anchor = "grounding-goo"
print = '''
Discoveries marked with a dagger (†) modify bombs and do not stack.

The alchemist's bomb applies a sticky residue after any damage from the bomb is resolved. If a creature damaged by the bomb has a nonmagical fly speed, its flight is severely impaired, and it takes a penalty equal to the alchemist's level on Fly checks for 1 minute.'''

[[entry]]
id = "ref/discovery/pheromones"
anchor = "pheromones"
print = "The alchemist exudes an imperceptible musk that grants him a permanent +3 competence bonus on Bluff, Diplomacy, and Intimidate checks."

[[entry]]
id = "ref/discovery/solid-ground"
anchor = "solid-ground"
print = '''
Discoveries marked with a dagger (†) modify bombs and do not stack.

The alchemist launches an explosive paste bomb that bonds with any earthen surface. Each application of this paste deals no damage and affects a 5-foot-cube of dirt, loose soil, or stone, transmuting the earth for a number of minutes equal to the alchemist's level. Creatures cannot use burrow, [earthmeld](ref/kinetic/earthmeld), or similar abilities (such as the _[meld into stone](ref/spell/meld-into-stone)_ spell) while the ground remains transmuted in this way.'''

[[entry]]
id = "ref/discovery/thorny-bomb"
anchor = "thorny-bomb"
print = '''
Discoveries marked with a dagger (†) modify bombs and do not stack.

When the alchemist creates a bomb, he can choose to have it deal piercing damage. Thorny bombs count as magic weapons for the purpose of overcoming [damage reduction](ref/rule/damage-reduction).'''

[[entry]]
id = "ref/discovery/volumizer"
anchor = "volumizer"
print = "The alchemist can use an extract slot of any level to create a reactive tablet that purifies water and doubles its volume. This works like _[purify food and drink](ref/spell/purify-food-and-drink)_ for a maximum volume of water equal to 1 gallon for each level the alchemist has × the level of the extract slot the alchemist used to create the tablet. Additionally, if the alchemist has a receptacle of sufficient volume to gather the water, the tablet doubles the volume of pure water. The water volume increases over the course of 1 minute, but the effect stops before it can create significant water pressure on a container that's not large enough to hold the entire volume. An unused tablet remains usable until the next time the alchemist recovers extract slots."

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "opening"
print = "This replaces tactician."

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "implacable-knight"
print = '''
A green knight gains Endurance and Diehard as bonus feats.

This replaces mount.'''

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "nature-s-servant"
print = '''
A green knight must select the order of the Green.

This alters order.'''

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "ferocious"
print = '''
At 3rd level, a green knight is not staggered when below 0 hit points. At 9th level, taking actions when below 0 hit points does not cause her to lose hit points.

This replaces cavalier's charge.'''

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "woodland-stride"
print = '''
At 4th level, a green knight gains the druid's woodland stride ability.

This replaces expert trainer and banner.'''

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "stalwart"
print = '''
At 9th level, whenever a green knight succeeds at a Fortitude or Will save against an effect that has a reduced effect on a successful save, she instead negates the effect.

This replaces greater tactician.'''

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "oaken-vitality"
print = '''
At 11th level, nature protects a green knight from many afflictions. The green knight becomes immune to disease, infestations (_Pathfinder RPG GameMastery Guide_ 245), and poison.

This replaces mighty charge and greater banner.'''

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "take-their-heads"
print = '''
A green knight's blade is blessed by mighty fey powers and unerringly seeks out foes' necks. At 17th level, any slashing weapon a green knight wields gains the _vorpal_ weapon special ability.

This replaces master tactician.'''

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "indestructible"
print = '''
At 20th level, a green knight is virtually impervious to death. She gains a +6 bonus to her Constitution score. In addition, the green knight becomes immune to death effects and to effects that would kill her without reducing her to 0 hit points, unless the effect involves decapitation. If she is decapitated, the green knight can continue to act normally. Reattachment requires the head and body to be joined and the application of any effect that restores hit points.

This replaces supreme charge.'''

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "saurian-champion-archetype"
print = "These primeval cavaliers idolize dinosaurs as apex predators and value them as powerful, oversized mounts."

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "class-skills"
print = '''
A saurian champion gains Acrobatics, Knowledge (nature), Perception, and Survival as class skills.

This alters the cavalier's class skills.'''

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "weapon-and-armor-proficiency"
print = '''
A saurian champion does not gain proficiency with medium or heavy armor.

This alters the cavalier's weapon and armor proficiencies.'''

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "savage-combatant"
print = "A saurian champion does not rely on lethal charges or firing from afar as more \"civilized\" cavaliers do, preferring to rampage among his foes instead. Saurian champions do not deal double damage when charging with a lance (or similar weapon) while mounted. While mounted, a saurian champion cannot attack with ranged weapons other than thrown weapons."

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "titanic-challenge"
print = '''
A saurian champion considers only the largest creatures a true challenge. His titanic challenge adds only half his level on damage rolls against Medium or smaller creatures, but he adds a +1 bonus on attack rolls against a target of his challenge that is at least two size categories larger than himself (Huge for Medium saurian champions) and a +2 bonus on attack rolls against a Colossal target of his challenge.

This alters challenge.'''

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "wild-warrior"
print = '''
A saurian champion hails from primeval lands where the civilized orders hold little sway. He does not select an order or gain any order-related benefits.

This replaces order.'''

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "dinosaur-mount"
print = '''
A saurian champion bonds with a dinosaur companion that willingly serves as his mount. This mount functions as a cavalier's normal mount with the following adjustments: The saurian champion's mount must be a dinosaur (see the various _Pathfinder RPG Bestiary_ volumes). The saurian champion can ride mounts of his size category and larger, rather than only those of a larger size. Increase the mount's Strength score by 8 for the purpose of determining its carrying capacity. Whenever an ability or feat allows the saurian champion's mount to make a hoof attack, the mount can make a claw or bite attack instead.

This alters the cavalier's mount and replaces tactician, greater tactician, and master tactician.'''

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "nimble-rider"
print = "At 2nd level, a saurian champion gains a +1 dodge bonus to AC when mounted. Anything that causes the saurian champion to lose his Dexterity bonus to AC also causes him to lose this dodge bonus. This bonus increases by 1 for every 6 levels beyond 2nd (to a maximum of +4 at 20th level)."

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "fierce-devotion"
print = '''
At 5th level, a saurian champion's mount gains the devotion ability, and its effects also apply against emotion and fear effects. The mount is immune to the effects of unnatural aura (_Pathfinder RPG Bestiary 2_ 303).

This replaces banner.'''

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "quick-rider"
print = "At 8th level, a saurian champion can attempt Ride checks to fast mount or fast dismount his mount even if it's more than one size category larger than himself."

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "titanic-mount"
print = "At 10th level, a saurian champion's mount increases in size by one category (even if the base creature normally does not reach that size). The creature receives the appropriate size penalty on attack rolls and to AC (-1 if growing to Large or -2 if growing to Huge) and a -2 penalty to Dexterity (to a minimum Dexterity score of 1), its base damage increases by one size category, and its reach increases to 10 feet (if it wasn't already). It also gains a +2 size bonus to its Strength and Constitution score. At 12th, 14th, 16th, and 18th levels, the bonus to Strength increases by 2 and the mount's natural armor increases by 1. At 14th and 18th levels, the bonus to Constitution increases by 2. At 15th level, the mount's reach increases to 15 feet."

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "primeval-devotion"
print = '''
At 14th level, the bonus on saving throws provided by the mount's devotion ability increases by 2. In addition, the mount adds half this bonus to other saving throws.

This replaces greater banner.'''

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "druid"
print = "While druids often serve as protectors of the natural world, there are a number of druids who specialize in a type of terrain or manifestation of that natural world. Characters of any race can select the season sage archetype found on page 12."

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "druid-domains"
print = "The following domains are available to druids with suitable archetypes or divine patrons."

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "granted-powers"
print = "You command the crumbling of stone and revel in rust; the decay and destruction of metal and stone over time appeals to and delights you."

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "rusting-touch"
print = "You can cause an opponent's metal armor or weapon to become dry and brittle as it magically corrodes and rusts. You make a melee touch attack against a creature wearing metal armor or wielding a metal weapon. If you hit, choose a metal weapon, suit of metal armor, or metal shield carried or worn by that creature. The object takes an amount of hit point damage equal to 1d6 + [half](ref/misc/fractions-and-rounding) your druid level. If the item is not magical, or if your caster level is greater than the item's caster level, this damage bypasses the item's [hardness](ref/umr/hardness). You can use this ability a number of times per day equal to 3 + your Wisdom modifier."

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "erosion-aura"
print = '''
At 8th level, you can project an aura of magically enhanced erosion as a standard action. Objects made primarily of metal or stone within this aura lose 10 points of [hardness](ref/umr/hardness). Magic items retain a minimum hardness equal to twice their enhancement bonus and can attempt a Fortitude saving throw (DC = 10 + half your druid level + your Wisdom modifier) to negate this effect.

A construct made primarily of metal or stone must succeed at a Fortitude save or lose all [damage reduction](ref/rule/damage-reduction) and hardness for 1 round. You can use this ability a number of times per day equal to 3 + your Wisdom modifier.'''

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "domain-spells"
print = "1st—_expeditious excavation_, 2nd—_soften earth and stone_, 3rd—_disable construct_, 4th—_rusting grasp_, 5th—_transmute rock to mud_, 6th—_sympathetic vibration_, 7th—_disintegrate_, 8th—_earthquake_, 9th—_implosion_."

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "granted-powers"
print = "You see the perfection of nature in the spindly limbs and strange forms of all vermin, great and small alike."

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "vermin-whisperer"
print = "You can use your wild empathy ability on vermin. When you do so, you impart a modicum of implanted intelligence on the vermin, allowing you to interact with vermin as if they were animals. Vermin whisperer functions only on vermin that are mindless or have an Intelligence score of 2 or lower."

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "sudden-sting"
print = "At 8th level, you can inflict a lingering, painful sting as a swift action that requires a successful melee touch attack. This sting deals 1d4 points of piercing damage plus 1 point for every 2 druid levels you have, and the target must succeed at a Fortitude save (DC = 10 + half your druid level + your Constitution modifier) or become staggered for 1 round. This is a pain effect. You can use this ability a number of times per day equal to 3 + your Wisdom modifier."

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "domain-spells"
print = "1st—_ant haul_, 2nd—_summon swarm_, 3rd—_vermin shape I_, 4th—_vermin shape II_, 5th—_insect plague_, 6th—_swarm skin_, 7th—_creeping doom_, 8th—_verminous transformation_, 9th—_summon nature's ally IX_ (1d3 purple worms only)."

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "aerie-protector-archetype"
print = "The aerie protector guards nature's nests and lairs in the highest mountains, and she is only ever truly at ease when under vast expanses of open sky."

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "weapon-and-armor-proficiency"
print = '''
Aerie protectors are proficient with javelins and shortbows but not with scimitars or scythes. Aerie protectors are not proficient with medium armor.

This alters the druid's weapon and armor proficiency.'''

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "nature-bond"
print = '''
If the aerie protector chooses an animal companion as her nature bond, she must choose an animal with a fly speed. She can use spells or other effects to alter her companion's fly speed, but it must be able to fly on its own before it becomes her companion.

If the aerie protector chooses a domain as her nature bond, she must choose the Air, Eagle, Earth, Mountain, or Weather domain.

This alters nature bond.'''

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "wild-empathy"
print = '''
An aerie protector gains a +4 bonus on wild empathy checks on flying animals, but she takes a -4 penalty on checks on other animals.

This alters wild empathy.'''

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "sky-and-stone"
print = '''
At 2nd level, an aerie protector gains a bonus equal to half her level on Knowledge (geography) and Survival checks involving mountainous terrain or high altitudes, and she cannot be tracked in such an environment.

This replaces woodland stride.'''

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "wind-at-her-back"
print = '''
At 4th level, an aerie protector gains a +4 bonus to CMD and on saving throws against the effects of high altitude and effects that rely on air pressure or strong wind to move her or impede her flight. This bonus also applies on Reflex saves against effects that deal electricity damage.

This replaces resist nature's lure.'''

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "wild-shape"
print = "An aerie protector gains this ability at 6th level, except her effective druid level is her druid level - 2. If she takes on the form of a flying animal, she instead uses her druid level + 2."

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "in-the-wind"
print = '''
At 9th level, the climb and fly speeds of forms the aerie protector assumes with her wild shape ability (if any) increase by 10 feet. The maneuverability of her flying forms improves by one category.

This replaces venom immunity.'''

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "dinosaur-druid-archetype"
print = "A dinosaur druid speaks for the spirit of prehistoric nature, even taking the form of great beasts of legend."

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "summon-dinosaur"
print = '''
A dinosaur druid can summon a wide range of dinosaurs and related prehistoric beasts using _summon nature's ally_ spells. She adds the following options to these spells when using spontaneous casting to cast such a spell.

_Summon Nature's Ally I:_ Compsognathus.

_Summon Nature's Ally II:_ Dimorphodon, troodon.

_Summon Nature's Ally III:_ Plesiosaurus, velociraptor.

_Summon Nature's Ally IV:_ Dimetrodon, pachycephalosaurus, parasaurolophus.

_Summon Nature's Ally V:_ Amargasaurus, ceratosaurus, iguanodon, kentrosaurus, styracosaurus.

_Summon Nature's Ally VI:_ Allosaurus, quetzalcoatlus, tylosaurus.

_Summon Nature's Ally VII:_ Therizinosaurus.

_Summon Nature's Ally VIII:_ Diplodocus, spinosaurus.

_Summon Nature's Ally IX:_ Giganotosaurus.

This alters spontaneous casting.'''

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "dinosaur-bond"
print = '''
A dinosaur druid must choose an animal companion as her nature's bond, and the animal companion must be a dinosaur (including those detailed in _Pathfinder RPG Bestiary_ volumes).

This alters nature's bond.'''

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "dinosaur-shape"
print = '''
A dinosaur druid specializes in assuming the form of dinosaurs when using wild shape. When she assumes the form of a dinosaur via wild shape, she gains a +2 size bonus to her Constitution in addition to the other modifiers granted by _beast shape_. When she uses wild shape to assume the form of a creature other than a dinosaur, the wild shape effect lasts for only 1 minute per level, rather than 1 hour per level.

This alters wild shape.'''

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "primeval-voice"
print = '''
At 4th level, a dinosaur druid gains the ability to speak with dinosaurs (as per _speak with animals_) at all times.

This replaces resist nature's lure.'''

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "leshy-warden-archetype"
print = "The natural world is full of bodiless nature spirits connected to the forces of glades, springs, and individual plants. Some druids hear their call keenly and are able to effortlessly incarnate them as the miniature creatures known as leshys (_Pathfinder RPG Bestiary 3_ 176). The leshy warden serves as these spirits' ally, defender, and voice."

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "leshy-familiar"
print = '''
A leshy warden forms an intimate bond with a nature spirit, incarnating the spirit as a leaf leshy (_Bestiary 3_ 179). She gains a leaf leshy as a familiar and treats her druid level as her effective wizard level for the purpose of this ability. If the leshy dies, the leshy warden can incarnate the same spirit again by paying the normal cost to replace a familiar. So long as the leshy lives, the leshy warden gains access to the Plant domain as if through a druid's nature bond class feature, but she can't choose the Decay subdomain.

This replaces nature bond.'''

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "green-empathy"
print = '''
A leshy warden can improve the attitude of a plant creature as if using wild empathy. The typical wild plant creature has a starting attitude of indifferent. If the plant creature is mindless, the leshy warden imparts a modicum of intellect to the plant so that it can be interacted with as if it were an animal. A leshy warden can also use this ability to influence an animal, but she takes a -4 penalty on the check to do so.

This replaces wild empathy.'''

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "leshy-summoner"
print = '''
A leshy warden is an expert at summoning and growing leshys. She counts as a plant creature for the purpose of growing leshys. She adds leaf leshys, gourd leshys, fungus leshys, seaweed leshys, and lotus leshys to her list of creatures she can summon with _summon nature's ally I_, _II_, _III_, _IV_, and _V_, respectively.

This alters spontaneous casting.'''

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "leshy-tender"
print = '''
At 4th level, a leshy warden can either grant her leaf leshy a +2 increase to Strength and Dexterity or transform it into a gourd leshy. At 8th level, the leshy warden can either grant her current leshy a +2 increase to Strength and Dexterity or transform it into a fungus leshy. At 12th level, she can either grant her current leshy a final +2 increase to Strength and Dexterity or transform it into a seaweed leshy. If the leshy is transformed, it gains the normal ability scores of its new form; ability score increases granted by this ability don't carry over to its new form.

This replaces resist nature's lure.'''

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "wild-shape"
print = '''
A leshy warden gains this ability at 6th level, except her effective druid level for the ability is equal to her druid level - 2 for the purpose of determining the number of times per day she can use it. At 6th level, the leshy warden can assume the form of only Small or Medium plant creatures, as per _plant shape I_. At 8th level, she can take the form of a Large plant creature, as per _plant shape II_. At 10th level, she can take the form of a Huge plant creature, as per _plant shape III_.

This alters wild shape.'''

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "plant-whisperer"
print = '''
At 13th level, a leshy warden's connection to the spirits of nature becomes strong enough that she can always hear them whispering. She is treated as if constantly under the effects of _speak with plants_. Once per day, she can spend 10 minutes in communion with the spirits to learn the answers to her questions, as _commune with nature_.

This replaces a thousand faces.'''

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "river-druid-archetype"
print = "These druids are the guardians of rivers and the creatures that depend on them. Just as rivers pour from mountains to seas, river druids adapt to many environments and cultures. They can be found wherever water flows, even among underground rivers or sewer systems."

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "ferrier"
print = '''
A river druid adds Diplomacy to her list of class skills and gains a +2 bonus on Diplomacy and Knowledge (nature) skill checks.

This alters the druid's class skills and replaces nature sense.'''

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "read-the-currents"
print = '''
At 2nd level, a river druid gains a bonus equal to half her druid level on initiative checks and Acrobatics, Knowledge (geography), Perception, Stealth, Survival, and Swim checks when she is in, on, or adjacent to flowing water.

This replaces woodland stride.'''

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "countercurrent"
print = '''
At 3rd level, a river druid takes no penalty to speed or on Acrobatics or Stealth checks in shallow water up to 2 feet deep (1 foot deep for Small characters) such as shallow bogs, shorelines, streams, and partially flooded areas. A river druid (and any vehicle she pilots) isn't moved by flowing water unless she allows it. Water that has been magically manipulated to impede or boost motion still affects her.

This replaces trackless step.'''

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "deep-breath"
print = '''
At 4th level, a river druid can hold her breath for a number of minutes equal to her Constitution score (after this, she must begin attempting Constitution checks to avoid suffocation as normal).

This replaces resist nature's lure.'''

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "wild-shape"
print = '''
A river druid gains this ability at 6th level, except her effective druid level for the ability is equal to her druid level - 2.

This alters wild shape.'''

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "tongue-of-the-sun-and-moon"
print = '''
At 15th level, a river druid can speak with any living creature.

This replaces timeless body.'''

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "road-keeper-archetype"
print = "Guardians of the lonely paths between cities, road keepers protect the wild from travelers, and travelers from the wild."

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "one-with-the-road"
print = '''
A road keeper casts the following spells as though her caster level were 1 higher: 1st—_longstrider_, 2nd—_scent trail_, 3rd—_nature's exile_, 4th—_freedom of movement_, 5th—_tree stride_, 6th—_find the path_, 7th—_wind walk_, 8th—_word of recall_, 9th—_world wave_. At 9th level, the bonus to her caster level for these spells increases to +2.

This replaces spontaneous casting.'''

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "road-bond"
print = '''
If the road keeper chooses a cleric domain as her nature bond, she must choose from the Community, Liberation, Protection, Travel, or Weather domains. The road keeper can also choose any subdomain associated with these domains.

This alters nature bond and replaces wild empathy.'''

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "take-the-high-road"
print = '''
At 2nd level, a road keeper travels over roads and paths at an accelerated rate. She and her allies can hustle for 2 hours without taking nonlethal damage, instead of 1, provided they travel along a road or path. Additionally, as long as they travel on a road or path, the road keeper and her allies count as traveling along a highway regardless of the quality of the road or path on which they travel. Allies must remain within 30 feet of the road keeper to benefit from this ability.

This replaces woodland stride.'''

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "trodden-path"
print = '''
At 4th level, a road keeper gains a +4 bonus on Survival checks to follow or identify tracks. She also gains this bonus on saving throws against severe weather effects.

This replaces resist nature's lure.'''

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "road-less-traveled"
print = '''
At 4th level, a road keeper can discourage creatures from entering or exiting the wild. Once per day as a standard action, she can target a creature within 30 feet and curse it with clumsiness and disorientation. The road keeper chooses whether to punish her target for entering the wild from a road or building, or vice versa. If her target is entering the wild, it treats every square of wilderness not on a road or in a building as difficult terrain. If her target is exiting the wild, it treats every square on a road or inside a building as difficult terrain. In either case, the ground feels uneven and the target suffers extreme vertigo during movement. The victim of this curse can attempt a Will saving throw (DC = 10 + half the road keeper's level + her Wisdom modifier) at the beginning of its turn each round to end the effect. The effect lasts until the target successfully saves or for a number of minutes equal to the road keeper's level. A creature's movement isn't affected if it is burrowing, climbing, earth gliding, flying, or swimming. This is a mind-affecting curse effect.

At 6th level and every 2 levels thereafter, the road keeper can target an additional creature per day with this ability (to a maximum number of nine targets per day at 20th level). She can target more than one creature with a single use of this ability or the same target more than once in the same day (though its effects do not stack), but her total number of targets per day cannot exceed this daily maximum. If she targets more than one creature at one time, each target must be within 30 feet of the road keeper.

This replaces wild shape.'''

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "rot-warden-archetype"
print = "Harbingers of decay, rot wardens live in damp lands where insects and rot break down the dead to feed the living. They see in the process of rot the beauty of nature's capacity to recycle and repurpose material into something wondrous and new."

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "invoke-decay"
print = '''
A rot warden can channel stored spell energy into specific spells he hasn't prepared ahead of time. He can "lose" a prepared spell in order to cast the following spells at the indicated levels: 1st—_decompose corpse_, 2nd—_warp wood_, 3rd—_fungal infestation_, 4th—_explosion of rot_, 5th—_insect plague_, 6th—_swarm skin_, 7th—_creeping doom_, 8th—_horrid wilting_, 9th—_massacre_.

This alters spontaneous casting.'''

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "nature-bond"
print = '''
A rot warden who chooses a cleric domain as his nature bond must choose from the Destruction, Erosion, Repose, or Vermin domains.

This alters nature bond.'''

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "vermin-empathy"
print = '''
A rot warden can improve the attitude of vermin as a normal druid can with animals. Vermin have a starting attitude of unfriendly. The rot warden can also improve the attitude of vermin swarms, but he takes a -4 penalty on the check unless the swarm consists of the same kind of vermin as his vermin companion or his current wild shape.

This replaces wild empathy.'''

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "swarmcaller"
print = '''
At 3rd level, a rot warden can summon a swarm of vermin once per day as a standard action. This functions like _summon swarm_, except the swarm the rot warden summons must be a cockroach, locust, or spider swarm. If he uses this ability during the surprise round of combat, nearby animals and vermin become hushed until the first round of combat ends; during this surprise round and first round of combat, flat-footed creatures also gain the shaken condition (this doesn't stack with other fear effects). At 9th level, he adds army ant, centipede, and wasp swarms to the list of swarms he can call with this ability.

This replaces trackless step and venom immunity.'''

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "enduring-druid"
print = '''
At 4th level, a rot warden gains a +4 bonus on saving throws against attacks and special abilities of vermin and swarms with the vermin type. This bonus also applies on saving throws against effects that would age or decay the rot warden or his equipment.

This replaces resist nature's lure.'''

[[entry]]
id = "ref/druiddomain/erosion"
anchor = "wild-shape"
print = '''
A rot warden gains this ability at 6th level, except his effective druid level is his druid level - 2. He cannot take the form of an elemental.

At 8th level, a rot warden can assume the form of a Small or Medium vermin as if using _vermin shape I_. At 10th level, the rot warden can assume the shape of a Tiny or Large vermin as if using _vermin shape II_. At 12th level, he can take the form of a Huge vermin as if using _vermin shape III_.

This alters wild shape.'''

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "opening"
print = "This replaces tactician."

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "implacable-knight"
print = '''
A green knight gains Endurance and Diehard as bonus feats.

This replaces mount.'''

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "nature-s-servant"
print = '''
A green knight must select the order of the Green.

This alters order.'''

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "ferocious"
print = '''
At 3rd level, a green knight is not staggered when below 0 hit points. At 9th level, taking actions when below 0 hit points does not cause her to lose hit points.

This replaces cavalier's charge.'''

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "woodland-stride"
print = '''
At 4th level, a green knight gains the druid's woodland stride ability.

This replaces expert trainer and banner.'''

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "stalwart"
print = '''
At 9th level, whenever a green knight succeeds at a Fortitude or Will save against an effect that has a reduced effect on a successful save, she instead negates the effect.

This replaces greater tactician.'''

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "oaken-vitality"
print = '''
At 11th level, nature protects a green knight from many afflictions. The green knight becomes immune to disease, infestations (_Pathfinder RPG GameMastery Guide_ 245), and poison.

This replaces mighty charge and greater banner.'''

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "take-their-heads"
print = '''
A green knight's blade is blessed by mighty fey powers and unerringly seeks out foes' necks. At 17th level, any slashing weapon a green knight wields gains the _vorpal_ weapon special ability.

This replaces master tactician.'''

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "indestructible"
print = '''
At 20th level, a green knight is virtually impervious to death. She gains a +6 bonus to her Constitution score. In addition, the green knight becomes immune to death effects and to effects that would kill her without reducing her to 0 hit points, unless the effect involves decapitation. If she is decapitated, the green knight can continue to act normally. Reattachment requires the head and body to be joined and the application of any effect that restores hit points.

This replaces supreme charge.'''

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "saurian-champion-archetype"
print = "These primeval cavaliers idolize dinosaurs as apex predators and value them as powerful, oversized mounts."

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "class-skills"
print = '''
A saurian champion gains Acrobatics, Knowledge (nature), Perception, and Survival as class skills.

This alters the cavalier's class skills.'''

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "weapon-and-armor-proficiency"
print = '''
A saurian champion does not gain proficiency with medium or heavy armor.

This alters the cavalier's weapon and armor proficiencies.'''

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "savage-combatant"
print = "A saurian champion does not rely on lethal charges or firing from afar as more \"civilized\" cavaliers do, preferring to rampage among his foes instead. Saurian champions do not deal double damage when charging with a lance (or similar weapon) while mounted. While mounted, a saurian champion cannot attack with ranged weapons other than thrown weapons."

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "titanic-challenge"
print = '''
A saurian champion considers only the largest creatures a true challenge. His titanic challenge adds only half his level on damage rolls against Medium or smaller creatures, but he adds a +1 bonus on attack rolls against a target of his challenge that is at least two size categories larger than himself (Huge for Medium saurian champions) and a +2 bonus on attack rolls against a Colossal target of his challenge.

This alters challenge.'''

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "wild-warrior"
print = '''
A saurian champion hails from primeval lands where the civilized orders hold little sway. He does not select an order or gain any order-related benefits.

This replaces order.'''

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "dinosaur-mount"
print = '''
A saurian champion bonds with a dinosaur companion that willingly serves as his mount. This mount functions as a cavalier's normal mount with the following adjustments: The saurian champion's mount must be a dinosaur (see the various _Pathfinder RPG Bestiary_ volumes). The saurian champion can ride mounts of his size category and larger, rather than only those of a larger size. Increase the mount's Strength score by 8 for the purpose of determining its carrying capacity. Whenever an ability or feat allows the saurian champion's mount to make a hoof attack, the mount can make a claw or bite attack instead.

This alters the cavalier's mount and replaces tactician, greater tactician, and master tactician.'''

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "nimble-rider"
print = "At 2nd level, a saurian champion gains a +1 dodge bonus to AC when mounted. Anything that causes the saurian champion to lose his Dexterity bonus to AC also causes him to lose this dodge bonus. This bonus increases by 1 for every 6 levels beyond 2nd (to a maximum of +4 at 20th level)."

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "fierce-devotion"
print = '''
At 5th level, a saurian champion's mount gains the devotion ability, and its effects also apply against emotion and fear effects. The mount is immune to the effects of unnatural aura (_Pathfinder RPG Bestiary 2_ 303).

This replaces banner.'''

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "quick-rider"
print = "At 8th level, a saurian champion can attempt Ride checks to fast mount or fast dismount his mount even if it's more than one size category larger than himself."

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "titanic-mount"
print = "At 10th level, a saurian champion's mount increases in size by one category (even if the base creature normally does not reach that size). The creature receives the appropriate size penalty on attack rolls and to AC (-1 if growing to Large or -2 if growing to Huge) and a -2 penalty to Dexterity (to a minimum Dexterity score of 1), its base damage increases by one size category, and its reach increases to 10 feet (if it wasn't already). It also gains a +2 size bonus to its Strength and Constitution score. At 12th, 14th, 16th, and 18th levels, the bonus to Strength increases by 2 and the mount's natural armor increases by 1. At 14th and 18th levels, the bonus to Constitution increases by 2. At 15th level, the mount's reach increases to 15 feet."

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "primeval-devotion"
print = '''
At 14th level, the bonus on saving throws provided by the mount's devotion ability increases by 2. In addition, the mount adds half this bonus to other saving throws.

This replaces greater banner.'''

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "druid"
print = "While druids often serve as protectors of the natural world, there are a number of druids who specialize in a type of terrain or manifestation of that natural world. Characters of any race can select the season sage archetype found on page 12."

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "druid-domains"
print = "The following domains are available to druids with suitable archetypes or divine patrons."

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "granted-powers"
print = "You command the crumbling of stone and revel in rust; the decay and destruction of metal and stone over time appeals to and delights you."

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "rusting-touch"
print = "You can cause an opponent's metal armor or weapon to become dry and brittle as it magically corrodes and rusts. You make a melee touch attack against a creature wearing metal armor or wielding a metal weapon. If you hit, choose a metal weapon, suit of metal armor, or metal shield carried or worn by that creature. The object takes an amount of hit point damage equal to 1d6 + half your druid level. If the item is not magical, or if your caster level is greater than the item's caster level, this damage bypasses the item's hardness. You can use this ability a number of times per day equal to 3 + your Wisdom modifier."

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "erosion-aura"
print = '''
At 8th level, you can project an aura of magically enhanced erosion as a standard action. Objects made primarily of metal or stone within this aura lose 10 points of hardness. Magic items retain a minimum hardness equal to twice their enhancement bonus and can attempt a Fortitude saving throw (DC = 10 + half your druid level + your Wisdom modifier) to negate this effect.

A construct made primarily of metal or stone must succeed at a Fortitude save or lose all damage reduction and hardness for 1 round. You can use this ability a number of times per day equal to 3 + your Wisdom modifier.'''

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "domain-spells"
print = "1st—_expeditious excavation_, 2nd—_soften earth and stone_, 3rd—_disable construct_, 4th—_rusting grasp_, 5th—_transmute rock to mud_, 6th—_sympathetic vibration_, 7th—_disintegrate_, 8th—_earthquake_, 9th—_implosion_."

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "granted-powers"
print = "You see the perfection of nature in the spindly limbs and strange forms of all vermin, great and small alike."

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "vermin-whisperer"
print = "You can use your [wild empathy](ref/ability/wild-empathy) ability on vermin. When you do so, you impart a modicum of implanted intelligence on the vermin, allowing you to interact with vermin as if they were animals. Vermin whisperer functions only on vermin that are mindless or have an Intelligence score of 2 or lower."

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "sudden-sting"
print = "At 8th level, you can inflict a lingering, painful sting as a swift action that requires a successful melee touch attack. This sting deals 1d4 points of piercing damage plus 1 point for every 2 druid levels you have, and the target must succeed at a Fortitude save (DC = 10 + [half](ref/misc/fractions-and-rounding) your druid level + your Constitution modifier) or become [staggered](ref/misc/staggered) for 1 round. This is a pain effect. You can use this ability a number of times per day equal to 3 + your Wisdom modifier."

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "domain-spells"
print = "1st—_ant haul_, 2nd—_summon swarm_, 3rd—_vermin shape I_, 4th—_vermin shape II_, 5th—_insect plague_, 6th—_swarm skin_, 7th—_creeping doom_, 8th—_verminous transformation_, 9th—_summon nature's ally IX_ (1d3 purple worms only)."

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "aerie-protector-archetype"
print = "The aerie protector guards nature's nests and lairs in the highest mountains, and she is only ever truly at ease when under vast expanses of open sky."

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "weapon-and-armor-proficiency"
print = '''
Aerie protectors are proficient with javelins and shortbows but not with scimitars or scythes. Aerie protectors are not proficient with medium armor.

This alters the druid's weapon and armor proficiency.'''

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "nature-bond"
print = '''
If the aerie protector chooses an animal companion as her nature bond, she must choose an animal with a fly speed. She can use spells or other effects to alter her companion's fly speed, but it must be able to fly on its own before it becomes her companion.

If the aerie protector chooses a domain as her nature bond, she must choose the Air, Eagle, Earth, Mountain, or Weather domain.

This alters nature bond.'''

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "wild-empathy"
print = '''
An aerie protector gains a +4 bonus on wild empathy checks on flying animals, but she takes a -4 penalty on checks on other animals.

This alters wild empathy.'''

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "sky-and-stone"
print = '''
At 2nd level, an aerie protector gains a bonus equal to half her level on Knowledge (geography) and Survival checks involving mountainous terrain or high altitudes, and she cannot be tracked in such an environment.

This replaces woodland stride.'''

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "wind-at-her-back"
print = '''
At 4th level, an aerie protector gains a +4 bonus to CMD and on saving throws against the effects of high altitude and effects that rely on air pressure or strong wind to move her or impede her flight. This bonus also applies on Reflex saves against effects that deal electricity damage.

This replaces resist nature's lure.'''

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "wild-shape"
print = "An aerie protector gains this ability at 6th level, except her effective druid level is her druid level - 2. If she takes on the form of a flying animal, she instead uses her druid level + 2."

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "in-the-wind"
print = '''
At 9th level, the climb and fly speeds of forms the aerie protector assumes with her wild shape ability (if any) increase by 10 feet. The maneuverability of her flying forms improves by one category.

This replaces venom immunity.'''

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "dinosaur-druid-archetype"
print = "A dinosaur druid speaks for the spirit of prehistoric nature, even taking the form of great beasts of legend."

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "summon-dinosaur"
print = '''
A dinosaur druid can summon a wide range of dinosaurs and related prehistoric beasts using _summon nature's ally_ spells. She adds the following options to these spells when using spontaneous casting to cast such a spell.

_Summon Nature's Ally I:_ Compsognathus.

_Summon Nature's Ally II:_ Dimorphodon, troodon.

_Summon Nature's Ally III:_ Plesiosaurus, velociraptor.

_Summon Nature's Ally IV:_ Dimetrodon, pachycephalosaurus, parasaurolophus.

_Summon Nature's Ally V:_ Amargasaurus, ceratosaurus, iguanodon, kentrosaurus, styracosaurus.

_Summon Nature's Ally VI:_ Allosaurus, quetzalcoatlus, tylosaurus.

_Summon Nature's Ally VII:_ Therizinosaurus.

_Summon Nature's Ally VIII:_ Diplodocus, spinosaurus.

_Summon Nature's Ally IX:_ Giganotosaurus.

This alters spontaneous casting.'''

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "dinosaur-bond"
print = '''
A dinosaur druid must choose an animal companion as her nature's bond, and the animal companion must be a dinosaur (including those detailed in _Pathfinder RPG Bestiary_ volumes).

This alters nature's bond.'''

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "dinosaur-shape"
print = '''
A dinosaur druid specializes in assuming the form of dinosaurs when using wild shape. When she assumes the form of a dinosaur via wild shape, she gains a +2 size bonus to her Constitution in addition to the other modifiers granted by _beast shape_. When she uses wild shape to assume the form of a creature other than a dinosaur, the wild shape effect lasts for only 1 minute per level, rather than 1 hour per level.

This alters wild shape.'''

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "primeval-voice"
print = '''
At 4th level, a dinosaur druid gains the ability to speak with dinosaurs (as per _speak with animals_) at all times.

This replaces resist nature's lure.'''

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "leshy-warden-archetype"
print = "The natural world is full of bodiless nature spirits connected to the forces of glades, springs, and individual plants. Some druids hear their call keenly and are able to effortlessly incarnate them as the miniature creatures known as leshys (_Pathfinder RPG Bestiary 3_ 176). The leshy warden serves as these spirits' ally, defender, and voice."

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "leshy-familiar"
print = '''
A leshy warden forms an intimate bond with a nature spirit, incarnating the spirit as a leaf leshy (_Bestiary 3_ 179). She gains a leaf leshy as a familiar and treats her druid level as her effective wizard level for the purpose of this ability. If the leshy dies, the leshy warden can incarnate the same spirit again by paying the normal cost to replace a familiar. So long as the leshy lives, the leshy warden gains access to the Plant domain as if through a druid's nature bond class feature, but she can't choose the Decay subdomain.

This replaces nature bond.'''

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "green-empathy"
print = '''
A leshy warden can improve the attitude of a plant creature as if using wild empathy. The typical wild plant creature has a starting attitude of indifferent. If the plant creature is mindless, the leshy warden imparts a modicum of intellect to the plant so that it can be interacted with as if it were an animal. A leshy warden can also use this ability to influence an animal, but she takes a -4 penalty on the check to do so.

This replaces wild empathy.'''

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "leshy-summoner"
print = '''
A leshy warden is an expert at summoning and growing leshys. She counts as a plant creature for the purpose of growing leshys. She adds leaf leshys, gourd leshys, fungus leshys, seaweed leshys, and lotus leshys to her list of creatures she can summon with _summon nature's ally I_, _II_, _III_, _IV_, and _V_, respectively.

This alters spontaneous casting.'''

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "leshy-tender"
print = '''
At 4th level, a leshy warden can either grant her leaf leshy a +2 increase to Strength and Dexterity or transform it into a gourd leshy. At 8th level, the leshy warden can either grant her current leshy a +2 increase to Strength and Dexterity or transform it into a fungus leshy. At 12th level, she can either grant her current leshy a final +2 increase to Strength and Dexterity or transform it into a seaweed leshy. If the leshy is transformed, it gains the normal ability scores of its new form; ability score increases granted by this ability don't carry over to its new form.

This replaces resist nature's lure.'''

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "wild-shape"
print = '''
A leshy warden gains this ability at 6th level, except her effective druid level for the ability is equal to her druid level - 2 for the purpose of determining the number of times per day she can use it. At 6th level, the leshy warden can assume the form of only Small or Medium plant creatures, as per _plant shape I_. At 8th level, she can take the form of a Large plant creature, as per _plant shape II_. At 10th level, she can take the form of a Huge plant creature, as per _plant shape III_.

This alters wild shape.'''

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "plant-whisperer"
print = '''
At 13th level, a leshy warden's connection to the spirits of nature becomes strong enough that she can always hear them whispering. She is treated as if constantly under the effects of _speak with plants_. Once per day, she can spend 10 minutes in communion with the spirits to learn the answers to her questions, as _commune with nature_.

This replaces a thousand faces.'''

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "river-druid-archetype"
print = "These druids are the guardians of rivers and the creatures that depend on them. Just as rivers pour from mountains to seas, river druids adapt to many environments and cultures. They can be found wherever water flows, even among underground rivers or sewer systems."

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "ferrier"
print = '''
A river druid adds Diplomacy to her list of class skills and gains a +2 bonus on Diplomacy and Knowledge (nature) skill checks.

This alters the druid's class skills and replaces nature sense.'''

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "read-the-currents"
print = '''
At 2nd level, a river druid gains a bonus equal to half her druid level on initiative checks and Acrobatics, Knowledge (geography), Perception, Stealth, Survival, and Swim checks when she is in, on, or adjacent to flowing water.

This replaces woodland stride.'''

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "countercurrent"
print = '''
At 3rd level, a river druid takes no penalty to speed or on Acrobatics or Stealth checks in shallow water up to 2 feet deep (1 foot deep for Small characters) such as shallow bogs, shorelines, streams, and partially flooded areas. A river druid (and any vehicle she pilots) isn't moved by flowing water unless she allows it. Water that has been magically manipulated to impede or boost motion still affects her.

This replaces trackless step.'''

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "deep-breath"
print = '''
At 4th level, a river druid can hold her breath for a number of minutes equal to her Constitution score (after this, she must begin attempting Constitution checks to avoid suffocation as normal).

This replaces resist nature's lure.'''

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "wild-shape"
print = '''
A river druid gains this ability at 6th level, except her effective druid level for the ability is equal to her druid level - 2.

This alters wild shape.'''

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "tongue-of-the-sun-and-moon"
print = '''
At 15th level, a river druid can speak with any living creature.

This replaces timeless body.'''

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "road-keeper-archetype"
print = "Guardians of the lonely paths between cities, road keepers protect the wild from travelers, and travelers from the wild."

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "one-with-the-road"
print = '''
A road keeper casts the following spells as though her caster level were 1 higher: 1st—_longstrider_, 2nd—_scent trail_, 3rd—_nature's exile_, 4th—_freedom of movement_, 5th—_tree stride_, 6th—_find the path_, 7th—_wind walk_, 8th—_word of recall_, 9th—_world wave_. At 9th level, the bonus to her caster level for these spells increases to +2.

This replaces spontaneous casting.'''

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "road-bond"
print = '''
If the road keeper chooses a cleric domain as her nature bond, she must choose from the Community, Liberation, Protection, Travel, or Weather domains. The road keeper can also choose any subdomain associated with these domains.

This alters nature bond and replaces wild empathy.'''

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "take-the-high-road"
print = '''
At 2nd level, a road keeper travels over roads and paths at an accelerated rate. She and her allies can hustle for 2 hours without taking nonlethal damage, instead of 1, provided they travel along a road or path. Additionally, as long as they travel on a road or path, the road keeper and her allies count as traveling along a highway regardless of the quality of the road or path on which they travel. Allies must remain within 30 feet of the road keeper to benefit from this ability.

This replaces woodland stride.'''

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "trodden-path"
print = '''
At 4th level, a road keeper gains a +4 bonus on Survival checks to follow or identify tracks. She also gains this bonus on saving throws against severe weather effects.

This replaces resist nature's lure.'''

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "road-less-traveled"
print = '''
At 4th level, a road keeper can discourage creatures from entering or exiting the wild. Once per day as a standard action, she can target a creature within 30 feet and curse it with clumsiness and disorientation. The road keeper chooses whether to punish her target for entering the wild from a road or building, or vice versa. If her target is entering the wild, it treats every square of wilderness not on a road or in a building as difficult terrain. If her target is exiting the wild, it treats every square on a road or inside a building as difficult terrain. In either case, the ground feels uneven and the target suffers extreme vertigo during movement. The victim of this curse can attempt a Will saving throw (DC = 10 + half the road keeper's level + her Wisdom modifier) at the beginning of its turn each round to end the effect. The effect lasts until the target successfully saves or for a number of minutes equal to the road keeper's level. A creature's movement isn't affected if it is burrowing, climbing, earth gliding, flying, or swimming. This is a mind-affecting curse effect.

At 6th level and every 2 levels thereafter, the road keeper can target an additional creature per day with this ability (to a maximum number of nine targets per day at 20th level). She can target more than one creature with a single use of this ability or the same target more than once in the same day (though its effects do not stack), but her total number of targets per day cannot exceed this daily maximum. If she targets more than one creature at one time, each target must be within 30 feet of the road keeper.

This replaces wild shape.'''

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "rot-warden-archetype"
print = "Harbingers of decay, rot wardens live in damp lands where insects and rot break down the dead to feed the living. They see in the process of rot the beauty of nature's capacity to recycle and repurpose material into something wondrous and new."

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "invoke-decay"
print = '''
A rot warden can channel stored spell energy into specific spells he hasn't prepared ahead of time. He can "lose" a prepared spell in order to cast the following spells at the indicated levels: 1st—_decompose corpse_, 2nd—_warp wood_, 3rd—_fungal infestation_, 4th—_explosion of rot_, 5th—_insect plague_, 6th—_swarm skin_, 7th—_creeping doom_, 8th—_horrid wilting_, 9th—_massacre_.

This alters spontaneous casting.'''

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "nature-bond"
print = '''
A rot warden who chooses a cleric domain as his nature bond must choose from the Destruction, Erosion, Repose, or Vermin domains.

This alters nature bond.'''

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "vermin-empathy"
print = '''
A rot warden can improve the attitude of vermin as a normal druid can with animals. Vermin have a starting attitude of unfriendly. The rot warden can also improve the attitude of vermin swarms, but he takes a -4 penalty on the check unless the swarm consists of the same kind of vermin as his vermin companion or his current wild shape.

This replaces wild empathy.'''

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "swarmcaller"
print = '''
At 3rd level, a rot warden can summon a swarm of vermin once per day as a standard action. This functions like _summon swarm_, except the swarm the rot warden summons must be a cockroach, locust, or spider swarm. If he uses this ability during the surprise round of combat, nearby animals and vermin become hushed until the first round of combat ends; during this surprise round and first round of combat, flat-footed creatures also gain the shaken condition (this doesn't stack with other fear effects). At 9th level, he adds army ant, centipede, and wasp swarms to the list of swarms he can call with this ability.

This replaces trackless step and venom immunity.'''

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "enduring-druid"
print = '''
At 4th level, a rot warden gains a +4 bonus on saving throws against attacks and special abilities of vermin and swarms with the vermin type. This bonus also applies on saving throws against effects that would age or decay the rot warden or his equipment.

This replaces resist nature's lure.'''

[[entry]]
id = "ref/druiddomain/vermin"
anchor = "wild-shape"
print = '''
A rot warden gains this ability at 6th level, except his effective druid level is his druid level - 2. He cannot take the form of an elemental.

At 8th level, a rot warden can assume the form of a Small or Medium vermin as if using _vermin shape I_. At 10th level, the rot warden can assume the shape of a Tiny or Large vermin as if using _vermin shape II_. At 12th level, he can take the form of a Huge vermin as if using _vermin shape III_.

This alters wild shape.'''

[[entry]]
id = "ref/eidolon/plant"
anchor = "opening"
print = "_air walk_ at will whenever she is within 10 feet of a tree, though the effect ends instantly when she moves farther than 10 feet from a tree."

[[entry]]
id = "ref/eidolon/plant"
anchor = "whispering-leaves"
print = "Whenever the shaman is within 10 feet of a tree or undergrowth, she can cast _whispering wind_ as a spell-like ability with a caster level equal to her shaman level. The targeted area must also contain trees or undergrowth, which relay the message in a gentle, rustling voice. At 8th level, the shaman can also listen to the targeted area as though she were using _clairaudience/clairvoyance_ for the 1 round during which the hex is delivering the message."

[[entry]]
id = "ref/eidolon/plant"
anchor = "spirit-animal"
print = "The shaman's spirit animal looks like a wooden figurine or a vaguely animal-shaped tree branch when it is motionless. The animal gains freeze as per the universal monster rule (_Pathfinder RPG Bestiary 2_ 297)."

[[entry]]
id = "ref/eidolon/plant"
anchor = "spirit-ability"
print = "A shaman who chooses the wood spirit as her spirit or wandering spirit gains the following ability."

[[entry]]
id = "ref/eidolon/plant"
anchor = "tree-limb"
print = '''
As a swift action, the shaman can turn one of her arms into a heavy, branch-like limb. She must drop anything held in that hand, and she can't use this ability if she is wearing a shield on that arm. Until the beginning of her next turn, she gains a slam attack that deals 1d8 points of damage (for a Medium shaman; 1d6 if Small, 2d6 if Large). A shaman can use this ability a number of times per day equal to 3 + her Charisma modifier.

At 8th level, the reach of this slam attack increases by 5 feet. At 16th level, the shaman can transform both of her arms, gaining two slam attacks.'''

[[entry]]
id = "ref/eidolon/plant"
anchor = "greater-spirit-ability"
print = "A shaman who chooses the wood spirit as her spirit or wandering spirit gains the following ability upon having access to the greater version of that spirit."

[[entry]]
id = "ref/eidolon/plant"
anchor = "bloody-roots"
print = '''
As a standard action, the shaman can cause a field of thick roots to burrow up from the ground. This ability functions as _black tentacles_ with a caster level equal to the shaman's level. The area is centered on the shaman when she activates the ability but remains stationary if she then moves. The shaman is unaffected by the roots. Her allies treat the area as difficult terrain, but the roots don't attack them.

The shaman can end the effect as a free action. She can use this ability a number of rounds per day equal to 3 + her Charisma modifier, but these rounds do not need to be consecutive.'''

[[entry]]
id = "ref/eidolon/plant"
anchor = "true-spirit-ability"
print = "A shaman who chooses the wood spirit as her spirit or wandering spirit gains the following ability upon having access to the true version of that spirit."

[[entry]]
id = "ref/eidolon/plant"
anchor = "tree-form"
print = "As a standard action, the shaman can assume the form of a plant creature as per _plant shape III_ with a duration of 1 hour per level. She can use this ability once per day."

[[entry]]
id = "ref/eidolon/plant"
anchor = "manifestation"
print = "Upon reaching 20th level, the shaman becomes a living creature of wood. She is forevermore treated as a plant creature rather than her original creature type for the purposes of spells and magical effects. Her skin takes on the appearance of polished wood grain, and she gains a +4 natural armor bonus to her Armor Class and damage reduction 10/— against wooden weapons and the natural attacks of wooden and wood-like creatures. She gains immunity to paralysis, poison, polymorph, sleep, and stun. At will, the shaman can meld with any tree or single block of wood (as per _meld into stone_, except she can meld only with wood and has no limit on how long she can remain in the wood)."

[[entry]]
id = "ref/eidolon/plant"
anchor = "leshy-caller-summoner-archetype"
print = "A leshy caller summons creatures from the First World and forges a bond with a leshy eidolon."

[[entry]]
id = "ref/eidolon/plant"
anchor = "leshy-eidolon"
print = "When a leshy caller summons her eidolon, the eidolon's body is created from extraplanar plant material and imbued with the intelligence of a leshy spirit. Its statistics are changed from those of a standard eidolon as follows. An unchained summoner uses the plant eidolon subtype (see page 95) instead of one of the subtypes listed in _Pathfinder RPG Pathfinder Unchained_."

[[entry]]
id = "ref/eidolon/plant"
anchor = "type"
print = "The eidolon is still an outsider, and its statistics don't change, but it also counts as a plant. As it isn't truly a plant, it doesn't gain the plant immunities."

[[entry]]
id = "ref/eidolon/plant"
anchor = "base-form"
print = '''
The leshy caller chooses one of the base forms listed below for her eidolon. When the eidolon is summoned in an environment matching one of these base forms, the leshy caller can change the eidolon's base form to the matching form by sacrificing one daily use of her _summon nature's ally_ ability as a free action.

Plant eidolon base forms are as follows.

_Cactus (Desert):_ Size Medium; Speed 30 ft.; AC +2 natural armor; Saves Fort (good), Ref (good), Will (bad); Attack [sting](ref/unchevolution/sting) (1d4); Ability Scores Str 14, Dex 14, Con 13, Int 7, Wis 10, Cha 11; Free Evolutions [limbs](ref/unchevolution/limbs) (arms), limbs (legs), sting.

_Conifer (Forest, Mountain):_ Size Medium; Speed 30 ft.; AC +2 natural armor; Saves Fort (good), Ref (bad), Will (good); Attack 2 [claws](ref/unchevolution/claws) (1d4); Ability Scores Str 14, Dex 12, Con 15, Int 7, Wis 10, Cha 11; Free Evolutions claws, limbs (arms), limbs (legs).

_Fungus (Swamp, Underground):_ Size Medium; Speed 30 ft.; AC +2 natural armor; Saves Fort (good), Ref (good), Will (bad); Attack [bite](ref/unchevolution/bite) (1d6); Ability Scores Str 14, Dex 14, Con 13, Int 7, Wis 10, Cha 11; Free Evolutions bite, limbs (arms), limbs (legs).

_Leaf (Forest, Jungle, Swamp):_ Size Medium; Speed 30 ft.; AC +2 natural armor; Saves Fort (good), Ref (good), Will (bad); Attack [slam](ref/unchevolution/slam) (1d8); Ability Scores Str 16, Dex 12, Con 13, Int 7, Wis 10, Cha 11; Free Evolutions limbs (arms), limbs (legs), slam.

_Seaweed (Aquatic):_ Size Medium; Speed 20 ft., [swim](ref/unchevolution/swim) 40 ft.; AC +2 natural armor; Saves Fort (good), Ref (good), Will (bad); Attack slam (1d8); Ability Scores Str 12, Dex 14, Con 15, Int 7, Wis 10, Cha 11; Free Evolutions limbs (arms), slam, swim (2).

This alters the summoner's eidolon.'''

[[entry]]
id = "ref/eidolon/plant"
anchor = "summon-nature-s-ally"
print = '''
A leshy caller can cast _summon nature's ally_ as a spell-like ability a number of times per day equal to 3 + her Charisma modifier. At levels where a regular summoner would gain access to a new level of _summon monster_ as a spell-like ability, the leshy caller instead gains the equivalent _summon nature's ally_ spell; at 19th level, she can cast _summon nature's ally IX_ or _gate_. When a leshy caller gains a _summon nature's ally_ spell as a spell-like ability, she adds it to her class spell list (though she must still select it as a spell known if she wants to gain the ability to cast it as a normal spell). She adds leaf leshys, gourd leshys, fungus leshys, seaweed leshys, and lotus leshys to her list of creatures for _summon nature's ally I_, _II_, _III_, _IV_, and _V_, respectively.

This alters summon monster.'''

[[entry]]
id = "ref/eidolon/plant"
anchor = "plant-eidolon-subtype"
print = "Plant eidolons consist of vegetable matter infused with raw natural spiritual power."

[[entry]]
id = "ref/eidolon/plant"
anchor = "alignment"
print = "Any. Plant eidolons don't have alignment subtypes."

[[entry]]
id = "ref/eidolon/plant"
anchor = "base-form"
print = "Cactus (limbs \\[arms\\], limbs \\[legs\\], sting), conifer (claws, limbs \\[arms\\], limbs \\[legs\\]), fungus (bite, limbs \\[arms\\], limbs \\[legs\\]), leaf (limbs \\[arms\\], limbs \\[legs\\], slam), seaweed (limbs \\[arms\\], slam, swim \\[2\\])."

[[entry]]
id = "ref/eidolon/plant"
anchor = "base-evolutions"
print = '''
At 1st level, plant eidolons gain [low-light vision](ref/rule/low-light-vision) as well as the [resistance](ref/unchevolution/resistance) (electricity) and resistance (sonic) evolutions.

At 4th level, plant eidolons gain constant _[pass without trace](ref/spell/pass-without-trace)_ and they can change shape into plants of the size category corresponding to their base form with results similar to _[tree shape](ref/spell/tree-shape)_.

At 8th level, plant eidolons gain the ability to use _[speak with plants](ref/spell/speak-with-plants)_ for 1 minute per Hit Die per day with any plants related to the eidolon's base form. These minutes need not be consecutive.

At 12th level, plant eidolons gain [immunity](ref/unchevolution/immunity) to paralysis, poison, sleep, and stun.

At 16th level, plant eidolons gain the ability to use _[commune with nature](ref/spell/commune-with-nature)_ once per day and can use their _[speak with plants](ref/spell/speak-with-plants)_ ability at will. At 20th level, plant eidolons gain a +8 resistance bonus on saving throws against mind-affecting effects. They lose their resistance (electricity) and resistance (sonic) evolutions and instead gain the [immunity](ref/carried/bestiary/rules/universal-monster-rules/immunity) (electricity) and immunity (sonic) evolutions.'''

[[entry]]
id = "ref/eidolon/plant"
anchor = "arrow-champion-swashbuckler-archetype"
print = "While the swashbuckler's agile style of combat is equally suited to urban settings and wilderness, the bow and arrow is an indispensable asset in open areas and harsh terrain where fancy footwork isn't enough to close the distance or dodge the enemy's arrows."

[[entry]]
id = "ref/eidolon/plant"
anchor = "arrow-champion-s-panache"
print = '''
An arrow champion regains panache when she makes a killing blow with a light or one-handed piercing melee weapon or a bow (a longbow, shortbow, composite longbow, or composite shortbow).

This alters panache.'''

[[entry]]
id = "ref/eidolon/plant"
anchor = "deeds"
print = '''
An arrow champion gains the following deeds, each of which replaces an existing deed.

_Retaliation (Ex):_ When a foe hits the arrow champion with an attack, she can spend 1 panache point to make a retaliatory attack of opportunity against that foe. If the triggering attack is a melee attack, she can retaliate with a melee attack using a light or one-handed piercing melee weapon, provided the creature is within her reach. If the triggering attack is a ranged attack, she can retaliate with a ranged attack using a bow, provided that the creature is within 30 feet of her. This deed's cost cannot be reduced by any ability or effect that reduces the number of panache points a deed costs.

This deed replaces opportune parry and riposte.

_Precise Aim (Ex):_ At 3rd level, when attacking with a light or one-handed piercing melee weapon, an arrow champion can add her swashbuckler level to the damage she deals, as the swashbuckler's precise strike deed. She can also add one-quarter of her swashbuckler level to the damage dealt when attacking with a bow, but the target must be within 30 feet of her. As a swift action, an arrow champion can spend 1 panache point to increase the range of the effect to her bow's first range increment. Unlike a normal swashbuckler, an arrow champion cannot spend panache to double the extra damage.

This deed alters precise strike.

_Swift Switch (Ex):_ At 3rd level, while the arrow champion has at least 1 panache point, she can sheathe or draw an unhidden light or one-handed piercing melee weapon or a bow as a swift action without provoking attacks of opportunity. If the arrow champion spends 1 panache point, she can perform either action as an immediate action. In addition, if she has the Quick Draw feat and one of her hands is free, she can sheathe a weapon and draw an unhidden weapon as part of the same swift action, provided that one of the weapons is a bow and the other is a light or one-handed piercing melee weapon. If she spends 1 panache point, she can perform the switch as an immediate action.

This deed replaces swashbuckler's initiative.

_Archer's Feint (Ex):_ At 7th level, when the arrow champion hits a foe within 30 feet with a bow attack, she can forgo the damage and instead attempt a Bluff check to feint against that foe as a swift action. If successful, in addition to the normal benefits of feinting, she doubles the extra damage from precise aim on her next melee attack before the end of her next turn.

This deed replaces superior feint.'''

[[entry]]
id = "ref/eidolon/plant"
anchor = "weapon-versatility"
print = '''
At 5th level, an arrow champion learns to use precision-based tricks just as accurately with her bow as with her melee weapons. Provided that her swashbuckler level is high enough, she can use the bleeding wound, deadly stab, menacing swordplay, perfect thrust, stunning stab, and targeted strike deeds when attacking with a bow, so long as her target is within 30 feet. If she spends a panache point to increase the range of her precise aim ability, the increased range applies to this ability as well.

This replaces swashbuckler weapon training.'''

[[entry]]
id = "ref/eidolon/plant"
anchor = "versatile-weapon-mastery"
print = '''
At 20th level, an arrow champion gains the benefits of swashbuckler weapon mastery when using a light or one-handed piercing melee weapon or a bow.

This alters swashbuckler weapon mastery.'''

[[entry]]
id = "ref/eidolon/plant"
anchor = "wildstrider-swashbuckler-archetype"
print = "Most swashbucklers call cities their home, but some prefer deserts, marshlands, mountains, or woods, where the rough terrain grants them an advantage, and have little interest in the comforts of an urban lifestyle."

[[entry]]
id = "ref/eidolon/plant"
anchor = "class-skills"
print = '''
A wildstrider gains Knowledge (nature), Stealth, and Survival as class skills, but does not gain Knowledge (nobility), Sense Motive, and Sleight of Hand as class skills.

This alters the swashbuckler's class skills.'''

[[entry]]
id = "ref/eidolon/plant"
anchor = "deeds"
print = '''
A wildstrider gains the following deeds, each of which replaces an existing deed.

_Subterfuge (Ex):_ A wildstrider adds Stealth to the list of skills to which the derring-do deed applies. At 15th level, she adds Stealth to the list of skills on which she can take 10 using the swashbuckler's edge deed.

This deed replaces dodging panache and alters derring-do and swashbuckler's edge.

_Adroit Step (Ex):_ At 3rd level, a wildstrider can use a swift action to treat a 5-foot square of difficult terrain as if it were normal terrain. If she also spends a panache point, she can treat all difficult terrain as though it were normal terrain until the end of her turn.

This deed replaces kip-up.

_Keen Gaze (Ex):_ At 11th level, while a wildstrider has at least 1 panache point, she can ignore the miss chance from concealment (but not total concealment) caused by normal and magical fog, smoke, and undergrowth, but not other sources of concealment or a miss chance, such as _blur_.

This deed replaces subtle blade.'''

[[entry]]
id = "ref/eidolon/plant"
anchor = "avenging-beast-vigilante-archetype"
print = "Some vigilantes turn to natural traditions and supernatural forces to transform into beasts, unleashing a primal fury on their foes before returning to an ordinary guise."

[[entry]]
id = "ref/eidolon/plant"
anchor = "class-skills"
print = '''
An avenging beast gains Knowledge (nature) and Spellcraft as class skills, but does not gain Disable Device, Knowledge (engineering), Perform, and Sleight of Hand as class skills.

This alters the vigilante's class skills.'''

[[entry]]
id = "ref/eidolon/plant"
anchor = "skill-ranks-per-level"
print = '''
An avenging beast gains a number of skill ranks equal to 4 + his Intelligence modifier at each level, instead of 6 + his Intelligence modifier.

This alters the vigilante's skill ranks per level.'''

[[entry]]
id = "ref/eidolon/plant"
anchor = "animal-mask"
print = '''
An avenging beast gains an ornate animal-headed mask that is a focus for his power and must be worn when assuming his vigilante identity. This mask symbolizes one specific animal, and the animal cannot be changed once chosen. Without this mask, an avenging beast cannot assume his vigilante identity. An avenging beast who loses his mask can replace it after 1 week through a specialized ritual that takes 8 hours to complete and costs 200 gp per avenging beast level.

This alters dual identity.'''

[[entry]]
id = "ref/eidolon/plant"
anchor = "spellcasting"
print = '''
An avenging beast casts divine spells as a hunter and uses the hunter's spell list.

This replaces the vigilante talents gained at 4th, 8th, 10th, 14th, and 16th level.'''

[[entry]]
id = "ref/eidolon/plant"
anchor = "patron-spells"
print = '''
An avenging beast selects a patron from the witch patron list and adds the patron bonus spells to his spell list (up to 6th-level spells). Patron spells of 7th level or higher are not counted as being on the avenging beast's spell list.

This replaces vigilante specialization.'''

[[entry]]
id = "ref/eidolon/plant"
anchor = "wild-shape"
print = '''
At 5th level, when in his vigilante identity, the avenging beast gains the ability to take on the shape of the animal represented by his animal mask. This ability functions identically to the druid's wild shape ability, except the ability does not improve beyond functioning as _beast shape I_. The avenging beast treats his vigilante level as his druid level for the purposes of this ability. An avenging beast can use wild shape once per day at 5th level and one additional time per day at 7th level and every 2 levels thereafter, for a total of eight times per day at 19th level.

This replaces startling appearance, frightening appearance, and stunning appearance.'''

[[entry]]
id = "ref/eidolon/plant"
anchor = "feral-champion-warpriest-archetype"
print = "When a warpriest devotes himself to a god of the natural world, he is sometimes blessed with supernatural powers that allow him to evoke animalistic power and fury."

[[entry]]
id = "ref/eidolon/plant"
anchor = "feral-blessing"
print = '''
A feral champion must take the Animal blessing and does not gain a second blessing.

This alters blessings.'''

[[entry]]
id = "ref/eidolon/plant"
anchor = "sacred-claws"
print = '''
Rather than empowering a physical weapon, a feral champion grows claws as primary natural weapons on each hand. These claws deal damage as a warpriest's sacred weapon and can be enhanced as such.

This alters sacred weapon.'''

[[entry]]
id = "ref/eidolon/plant"
anchor = "wild-shape"
print = '''
At 7th level, a feral champion gains wild shape, as the druid ability of the same name, and treats his warpriest level - 3 as his effective druid level for the purposes of this ability. However, a feral champion does not gain the ability to take on elemental or plant forms with wild shape. A feral champion can use wild shape once per day at 7th level and one additional time per day every 4 levels thereafter, for a total of four times per day at 19th level.

This replaces sacred armor.'''

[[entry]]
id = "ref/eidolon/plant"
anchor = "disaster-blessings-warpriest-blessings"
print = "Evil deities that offer the Air, Earth, Fire, and Water blessings or nonevil deities with disasters in their portfolios might also offer these disaster blessings as options for their warpriests."

[[entry]]
id = "ref/eidolon/plant"
anchor = "earthquake-blessing"
print = "The fury of the quaking earth infuses your faith."

[[entry]]
id = "ref/eidolon/plant"
anchor = "stone-s-base-minor"
print = "You can touch an ally to bless it with the stalwart resilience of stone. For 1 minute, the creature gains a +4 bonus to its CMD against maneuvers that would move the ally or knock it prone."

[[entry]]
id = "ref/eidolon/plant"
anchor = "earth-hammer-major"
print = "At 10th level, you can touch a weapon to bless it with the force of a mighty earthquake for 1 minute. When the weapon hits a creature, the target must succeed at a Reflex save or fall prone; either way, the creature is immune to this ability for 24 hours."

[[entry]]
id = "ref/eidolon/plant"
anchor = "flood-blessing"
print = "You see proof of your convictions in the churning waters of a flood."

[[entry]]
id = "ref/eidolon/plant"
anchor = "lasting-breath-minor"
print = "You can touch an ally to bless it with an extra reserve of breath. For 1 minute, while the ally holds its breath, standard and full-round actions don't decrease the number of rounds the ally can hold its breath (see page 445 of _Pathfinder RPG Core Rulebook_)."

[[entry]]
id = "ref/eidolon/plant"
anchor = "tsunami-burst-major"
print = "At 10th level, when you are hit by a melee attack, you can invoke this blessing as an immediate action. A wave of water blasts out from you at your attacker, attempting a bull rush combat maneuver check using your CMB but adding your Wisdom modifier instead of your Strength modifier."

[[entry]]
id = "ref/eidolon/plant"
anchor = "tornado-blessing"
print = "The howling wrath of a tornado inspires your religion."

[[entry]]
id = "ref/eidolon/plant"
anchor = "dust-devil-minor"
print = "When you hit with a weapon attack, you can use a swift action to cause a sudden burst of wind and debris to swirl around your target. The target is dazzled for 1 minute."

[[entry]]
id = "ref/eidolon/plant"
anchor = "howling-gale-major"
print = "At 10th level, you can invoke a howling windstorm around yourself as a standard action. For 1 minute, any Large or smaller creature takes twice as much movement to enter a space adjacent to you due to the winds, and thus can't take a 5-foot step to move adjacent to you."

[[entry]]
id = "ref/eidolon/plant"
anchor = "wildfire-blessing"
print = "In the flames of a wildfire you take inspiration."

[[entry]]
id = "ref/eidolon/plant"
anchor = "leaping-flames-minor"
print = "You touch an ally to bless it with the speed of a wildfire for 1 minute. The ally gains a +10-foot enhancement bonus to its base speed, and the ally gains a +1 dodge bonus to its AC against attacks of opportunity."

[[entry]]
id = "ref/eidolon/plant"
anchor = "fiery-wake-major"
print = "At 10th level, when you move, you can use a swift action to invoke a blazing blessing on yourself. For the rest of your turn, your movement leaves behind a 10-foot-tall wall of opaque fire in your path. The wall burns for 1 minute. A creature that touches the wall takes 2d6 points of fire damage."

[[entry]]
id = "ref/hex/city-sight"
anchor = "city-sight"
print = "The witch curses a target with the simple vision of urban mortals. On a failed Fortitude save, the subject loses the use of [darkvision](ref/rule/darkvision), [greensight](ref/umr/greensight), [low-light vision](ref/rule/low-light-vision), [see in darkness](ref/umr/see-in-darkness), and other visual abilities beyond simple sight, but not nonvisual means of perception like [blindsight](ref/umr/blindsight), [scent](ref/umr/scent), or [tremorsense](ref/umr/tremorsense). This effect lasts 1 minute. At 8th level, this effect lasts for 10 minutes instead. Whether or not the creature succeeds at the saving throw, it can't be the target of this hex again for 1 day."

[[entry]]
id = "ref/hex/enemy-ground"
anchor = "enemy-ground"
print = "The witch curses a target with clumsiness when in dangerous terrain. The target takes a -4 penalty on Acrobatics checks to move over slippery or uneven surfaces and to avoid attacks of opportunity while moving through threatened squares. This effect lasts for 1 minute. On a successful Will save, the penalty is reduced by half and the duration is only 1 round. At 8th level, this penalty increases to -8."

[[entry]]
id = "ref/hex/no-place-like-home"
anchor = "no-place-like-home"
print = '''
The witch fills an ally with the safety he feels at home or inflicts pangs of homesickness to hamper an enemy's defenses. She chooses a target for the hex within 30 feet. If she chooses an ally, that ally gains a +2 dodge bonus to AC against traps and on Reflex saves against traps. If she chooses an opponent, that opponent takes a -2 penalty to AC against traps and on Reflex saves against traps. Either way, the effects last for 1 minute.

The target can attempt a Will save to negate the effects of the hex. At 8th level, the bonus or penalty increases to 4. At 16th level, the bonus or penalty increases to 6. A creature targeted by this hex cannot be targeted again by this hex for 1 day.'''

[[entry]]
id = "ref/hex/summers-heat"
anchor = "summer-s-heat"
print = "The witch surrounds her target with oppressive heat, dealing a number of points of nonlethal damage equal to her witch level and causing the target to become [fatigued](ref/misc/fatigued). The target can attempt a Fortitude save to reduce this nonlethal damage by half and negate the fatigued condition. Whether or not the target succeeds at this save, it can't be the target of this hex again for 1 day."

[[entry]]
id = "ref/order/order-of-the-green"
anchor = "opening"
print = "Cavaliers of the order of the Green are dedicated to protecting wild places and creatures, embracing the Green Faith in all its glory and natural wonder."

[[entry]]
id = "ref/order/order-of-the-green"
anchor = "edicts"
print = "The cavalier knows his place in the natural order and strives to defend the balance of nature. He must be willing to allow nature to take its course, and he must stop all those who would do harm to its delicate balance. He will not tolerate aberrant creatures, undead, or the irresponsible and greedy consumption of natural resources. He may be farsighted and seek to establish agreements that lead to lasting protection of the natural world, but resorts to violence if it is the most effective way to enforce such protection."

[[entry]]
id = "ref/order/order-of-the-green"
anchor = "challenge"
print = "An order of the Green cavalier can't issue a challenge against any creature of the animal or plant type. Whenever he issues a challenge, he receives a +1 morale bonus on attack rolls against the target of his challenge. This bonus increases by 1 for every 4 levels the cavalier has. If the target of his challenge is of the aberration or undead type, each round he can roll his first attack roll against the target creature twice and take the higher result."

[[entry]]
id = "ref/order/order-of-the-green"
anchor = "skills"
print = "An order of the Green cavalier gains [Knowledge (nature)](ref/skill/knowledge-nature) and [Survival](ref/skill/survival) as class skills. In addition, whenever an order of the Green cavalier attempts a Survival check to track foes of the aberration or undead type, he receives a bonus on the check equal to half his cavalier level (minimum +1)."

[[entry]]
id = "ref/order/order-of-the-green"
anchor = "order-abilities"
print = "A cavalier belonging to the order of the Green gains the following abilities."

[[entry]]
id = "ref/order/order-of-the-green"
anchor = "favored-terrain"
print = "At 2nd level, an order of the Green cavalier chooses a [favored terrain](ref/ability/favored-terrain) from the list of ranger favored terrains (_Pathfinder RPG Core Rulebook_ 65). He gains this as a favored terrain, as the ranger class feature of the same name. At 8th level and every 6 levels thereafter, he selects another favored terrain. In addition, at each such interval, the skill bonus in any one favored terrain (including the one just selected, if so desired) increases by 2."

[[entry]]
id = "ref/order/order-of-the-green"
anchor = "cut-the-corruption"
print = "At 8th level, an order of the Green cavalier can touch a weapon and enhance it as a free action once per day. For 1 minute, the weapon glows with a deep-green light and deals an additional 1d6 points of damage against aberrations and undead. This damage does not stack with the additional damage granted by the _[bane](ref/magic-enh/bane)_ weapon special ability. At 16th level, the cavalier can use this ability a second time each day."

[[entry]]
id = "ref/order/order-of-the-green"
anchor = "end-of-the-cycle"
print = "At 15th level, things killed by an order of the Green cavalier tends to stay dead. When the cavalier kills a creature, it is treated as if it were killed by a death effect for the purposes of magic that can restore it to life. In addition, it's placed under the effects of a permanent _[sanctify corpse](ref/spell/sanctify-corpse)_ effect (using the cavalier's level as the spell's caster level)."

[[entry]]
id = "ref/order/order-of-the-green"
anchor = "green-knight-archetype"
print = "Some knights serve nature itself and can be found protecting unspoiled natural places or serving fey beings."

[[entry]]
id = "ref/order/order-of-the-green"
anchor = "beast-tongue"
print = '''
A green knight can use Diplomacy to improve an animal's attitude. Beast tongue otherwise functions like the druid's wild empathy ability, using the green knight's Diplomacy modifier and using her cavalier level as her effective druid level, and it counts as that ability for the purpose of other effects (such as feat prerequisites or effects that alter or improve wild empathy).

This replaces tactician.'''

[[entry]]
id = "ref/order/order-of-the-green"
anchor = "implacable-knight"
print = '''
A green knight gains Endurance and Diehard as bonus feats.

This replaces mount.'''

[[entry]]
id = "ref/order/order-of-the-green"
anchor = "nature-s-servant"
print = '''
A green knight must select the order of the Green.

This alters order.'''

[[entry]]
id = "ref/order/order-of-the-green"
anchor = "ferocious"
print = '''
At 3rd level, a green knight is not staggered when below 0 hit points. At 9th level, taking actions when below 0 hit points does not cause her to lose hit points.

This replaces cavalier's charge.'''

[[entry]]
id = "ref/order/order-of-the-green"
anchor = "woodland-stride"
print = '''
At 4th level, a green knight gains the druid's woodland stride ability.

This replaces expert trainer and banner.'''

[[entry]]
id = "ref/order/order-of-the-green"
anchor = "stalwart"
print = '''
At 9th level, whenever a green knight succeeds at a Fortitude or Will save against an effect that has a reduced effect on a successful save, she instead negates the effect.

This replaces greater tactician.'''

[[entry]]
id = "ref/order/order-of-the-green"
anchor = "oaken-vitality"
print = '''
At 11th level, nature protects a green knight from many afflictions. The green knight becomes immune to disease, infestations (_Pathfinder RPG GameMastery Guide_ 245), and poison.

This replaces mighty charge and greater banner.'''

[[entry]]
id = "ref/order/order-of-the-green"
anchor = "take-their-heads"
print = '''
A green knight's blade is blessed by mighty fey powers and unerringly seeks out foes' necks. At 17th level, any slashing weapon a green knight wields gains the _vorpal_ weapon special ability.

This replaces master tactician.'''

[[entry]]
id = "ref/order/order-of-the-green"
anchor = "indestructible"
print = '''
At 20th level, a green knight is virtually impervious to death. She gains a +6 bonus to her Constitution score. In addition, the green knight becomes immune to death effects and to effects that would kill her without reducing her to 0 hit points, unless the effect involves decapitation. If she is decapitated, the green knight can continue to act normally. Reattachment requires the head and body to be joined and the application of any effect that restores hit points.

This replaces supreme charge.'''

[[entry]]
id = "ref/order/order-of-the-green"
anchor = "saurian-champion-archetype"
print = "These primeval cavaliers idolize dinosaurs as apex predators and value them as powerful, oversized mounts."

[[entry]]
id = "ref/order/order-of-the-green"
anchor = "class-skills"
print = '''
A saurian champion gains Acrobatics, Knowledge (nature), Perception, and Survival as class skills.

This alters the cavalier's class skills.'''

[[entry]]
id = "ref/order/order-of-the-green"
anchor = "weapon-and-armor-proficiency"
print = '''
A saurian champion does not gain proficiency with medium or heavy armor.

This alters the cavalier's weapon and armor proficiencies.'''

[[entry]]
id = "ref/order/order-of-the-green"
anchor = "savage-combatant"
print = "A saurian champion does not rely on lethal charges or firing from afar as more \"civilized\" cavaliers do, preferring to rampage among his foes instead. Saurian champions do not deal double damage when charging with a lance (or similar weapon) while mounted. While mounted, a saurian champion cannot attack with ranged weapons other than thrown weapons."

[[entry]]
id = "ref/order/order-of-the-green"
anchor = "titanic-challenge"
print = '''
A saurian champion considers only the largest creatures a true challenge. His titanic challenge adds only half his level on damage rolls against Medium or smaller creatures, but he adds a +1 bonus on attack rolls against a target of his challenge that is at least two size categories larger than himself (Huge for Medium saurian champions) and a +2 bonus on attack rolls against a Colossal target of his challenge.

This alters challenge.'''

[[entry]]
id = "ref/order/order-of-the-green"
anchor = "wild-warrior"
print = '''
A saurian champion hails from primeval lands where the civilized orders hold little sway. He does not select an order or gain any order-related benefits.

This replaces order.'''

[[entry]]
id = "ref/order/order-of-the-green"
anchor = "dinosaur-mount"
print = '''
A saurian champion bonds with a dinosaur companion that willingly serves as his mount. This mount functions as a cavalier's normal mount with the following adjustments: The saurian champion's mount must be a dinosaur (see the various _Pathfinder RPG Bestiary_ volumes). The saurian champion can ride mounts of his size category and larger, rather than only those of a larger size. Increase the mount's Strength score by 8 for the purpose of determining its carrying capacity. Whenever an ability or feat allows the saurian champion's mount to make a hoof attack, the mount can make a claw or bite attack instead.

This alters the cavalier's mount and replaces tactician, greater tactician, and master tactician.'''

[[entry]]
id = "ref/order/order-of-the-green"
anchor = "nimble-rider"
print = "At 2nd level, a saurian champion gains a +1 dodge bonus to AC when mounted. Anything that causes the saurian champion to lose his Dexterity bonus to AC also causes him to lose this dodge bonus. This bonus increases by 1 for every 6 levels beyond 2nd (to a maximum of +4 at 20th level)."

[[entry]]
id = "ref/order/order-of-the-green"
anchor = "fierce-devotion"
print = '''
At 5th level, a saurian champion's mount gains the devotion ability, and its effects also apply against emotion and fear effects. The mount is immune to the effects of unnatural aura (_Pathfinder RPG Bestiary 2_ 303).

This replaces banner.'''

[[entry]]
id = "ref/order/order-of-the-green"
anchor = "quick-rider"
print = "At 8th level, a saurian champion can attempt Ride checks to fast mount or fast dismount his mount even if it's more than one size category larger than himself."

[[entry]]
id = "ref/order/order-of-the-green"
anchor = "titanic-mount"
print = "At 10th level, a saurian champion's mount increases in size by one category (even if the base creature normally does not reach that size). The creature receives the appropriate size penalty on attack rolls and to AC (-1 if growing to Large or -2 if growing to Huge) and a -2 penalty to Dexterity (to a minimum Dexterity score of 1), its base damage increases by one size category, and its reach increases to 10 feet (if it wasn't already). It also gains a +2 size bonus to its Strength and Constitution score. At 12th, 14th, 16th, and 18th levels, the bonus to Strength increases by 2 and the mount's natural armor increases by 1. At 14th and 18th levels, the bonus to Constitution increases by 2. At 15th level, the mount's reach increases to 15 feet."

[[entry]]
id = "ref/order/order-of-the-green"
anchor = "primeval-devotion"
print = '''
At 14th level, the bonus on saving throws provided by the mount's devotion ability increases by 2. In addition, the mount adds half this bonus to other saving throws.

This replaces greater banner.'''

[[entry]]
id = "ref/ragepower/autumn-rage"
anchor = "autumn-rage"
print = "The barbarian becomes a servant of the harvest. While raging, she gains a +2 bonus on combat maneuver checks to [reposition](ref/rule/reposition) or [trip](ref/rule/trip). She also gains this bonus on attack rolls to confirm critical hits. A barbarian can have only one season-themed rage power, choosing between [spring](ref/ragepower/spring-rage), [summer](ref/ragepower/summer-rage), autumn, or [winter](ref/ragepower/winter-rage) rage."

[[entry]]
id = "ref/ragepower/bestial-flyer"
anchor = "bestial-flyer"
print = "While raging, the barbarian's fly speed increases by 10 feet and her maneuverability improves by one category. A barbarian must have a fly speed before raging, have the [raging flyer](ref/ragepower/raging-flyer) power, and be at least 6th level to choose this rage power."

[[entry]]
id = "ref/ragepower/contagious-rage"
anchor = "contagious-rage"
print = "The barbarian howls during combat, agitating nearby fauna. Willing animals and magical beasts within 30 feet of the barbarian gain the benefits of the _[rage](ref/spell/rage)_ spell for as long as she maintains her rage. After the barbarian's rage ends, creatures affected by her rage are [fatigued](ref/misc/fatigued) for the same number of rounds as the barbarian. A barbarian must be at least 6th level to choose this rage power."

[[entry]]
id = "ref/ragepower/dissipating-rage"
anchor = "dissipating-rage"
print = "When the barbarian rages, her feverish frenzy and hot breath burn or blow fog, smoke and similar effects away from her. The barbarian and creatures adjacent to her do not gain [concealment](ref/rule/concealment) from obfuscating effects like fog or precipitation. Magical effects that require more than a strong wind to dissipate are not affected by this rage power."

[[entry]]
id = "ref/ragepower/eclipsing-rage"
anchor = "eclipsing-rage"
print = "While the barbarian is raging, the [light level](ref/rule/vision-and-light) within 10 feet of her lowers by one step. She can't decrease the light level below normal darkness with this ability. Multiple barbarians with this rage power don't further reduce the light level. A barbarian must be at least 6th level to choose this rage power."

[[entry]]
id = "ref/ragepower/greater-eclipsing-rage"
anchor = "greater-eclipsing-rage"
print = "Whenever the barbarian rages, the [light level](ref/rule/vision-and-light) within 20 feet of her lowers by two steps instead of one. She still can't decrease the light level below normal darkness with this ability. A barbarian must be at least 10th level and have the [eclipsing rage](ref/ragepower/eclipsing-rage) power to choose this rage power."

[[entry]]
id = "ref/ragepower/greater-tyrant-totem"
anchor = "greater-tyrant-totem"
print = "While raging, the barbarian gains [swallow whole](ref/umr/swallow-whole) as per the universal monster rule. A barbarian must be at least 12th level to choose this rage power."

[[entry]]
id = "ref/ragepower/hissing-rage"
anchor = "hissing-rage"
print = '''
Once per hour, the barbarian can spit venom at an adjacent enemy as a standard action. She must make a touch attack to successfully spit on a foe in this way, but she can also apply this poison as a swift action when she hits with a bite attack. The DC of the save against this poison is equal to 10 + half the barbarian's level + the barbarian's Constitution modifier.

_Hissing Rage Poison (Su)_ Bite—contact or injury; _save_ Fort; _frequency_ 1/round for 6 rounds; _effect_ 1d2 Str damage; _cure_ 2 consecutive saves.'''

[[entry]]
id = "ref/ragepower/lesser-tyrant-totem"
anchor = "lesser-tyrant-totem"
print = "While raging, the barbarian's bite attack deals damage as if the barbarian were [one size larger](ref/misc/damage-die-adjustments) than her actual size. The barbarian must have the [animal fury](ref/ragepower/animal-fury) rage power or a natural bite attack to choose this rage power."

[[entry]]
id = "ref/ragepower/lizard-stride"
anchor = "lizard-stride"
print = "When the barbarian makes a [charge](ref/rule/charge) or [run](ref/rule/run) action while raging, she can move across the surface of water without sinking. She sinks immediately if she ends her turn standing on water."

[[entry]]
id = "ref/ragepower/pack-rage"
anchor = "pack-rage"
print = "When a barbarian with this rage power enters a rage, any barbarian within 30 feet who also has this rage power can enter a rage. A barbarian that enters a rage outside of her turn spends 1 round of rage immediately and then spends another round of rage to maintain her rage at the beginning of her next turn. A barbarian must be at least 6th level to choose this rage power."

[[entry]]
id = "ref/ragepower/raging-flyer"
anchor = "raging-flyer"
print = "When raging, the barbarian adds her level as an enhancement bonus to [Fly](ref/skill/fly) checks."

[[entry]]
id = "ref/ragepower/raging-whirlwind"
anchor = "raging-whirlwind"
print = "The barbarian can create a whirlwind with a powerful spinning move as an immediate action after she confirms a critical hit with a melee attack. The whirlwind circles the target of her melee attack, lifting it in the air slightly until the end of the barbarian's turn. The creature can attempt a Fortitude save (DC = 10 + half the barbarian's level + the barbarian's Constitution modifier) to negate this effect. If it fails the save, the target loses its Dexterity modifier to AC for the rest of the barbarian's turn and lands [prone](ref/rule/prone) on the ground at the end of her turn. Raging whirlwind has no effect on flying creatures. A barbarian must be at least 12th level to choose this rage power."

[[entry]]
id = "ref/ragepower/spring-rage"
anchor = "spring-rage"
print = "The barbarian's rage rejuvenates her physically and spiritually. While raging, she ignores penalties to her ability scores due to [aging](ref/rule/age). She also ignores penalties from [negative levels](ref/rule/energy-drain-and-negative-levels), though she retains any negative levels she has until they are removed normally. A barbarian can have only one season-themed rage power, choosing between spring, [summer](ref/ragepower/summer-rage), [autumn](ref/ragepower/autumn-rage), or [winter](ref/ragepower/winter-rage) rage."

[[entry]]
id = "ref/ragepower/summer-rage"
anchor = "summer-rage"
print = "The barbarian channels the heat of late summer, making the air around her hot and oppressive. A creature within the barbarian's reach becomes [fatigued](ref/misc/fatigued) as long as it remains within the barbarian's reach unless it succeeds at a Fortitude save (DC = 10 + half the barbarian's level + her Constitution modifier) to become immune for 24 hours. A barbarian can have only one season-themed rage power, choosing between [spring](ref/ragepower/spring-rage), summer, [autumn](ref/ragepower/autumn-rage), or [winter](ref/ragepower/winter-rage) rage."

[[entry]]
id = "ref/ragepower/tyrant-totem"
anchor = "tyrant-totem"
print = "While raging, the barbarian can begin a [grapple](ref/rule/grapple) as a free action against any creature she hits with her bite attack. A barbarian must be at least 8th level to choose this rage power."

[[entry]]
id = "ref/ragepower/winter-rage"
anchor = "winter-rage"
print = "As a standard action, the barbarian can bellow a 20-foot cone of frigid, snowy air. Until the beginning of the barbarian's next turn, creatures moving through the cone move at half speed. A barbarian can have only one season-themed rage power, choosing between [spring](ref/ragepower/spring-rage), [summer](ref/ragepower/summer-rage), [autumn](ref/ragepower/autumn-rage), or winter rage."

[[entry]]
id = "ref/shamanspirit/wood"
anchor = "opening"
print = "A shaman who selects the wood spirit has a skin tone similar to the coloration of trees in her home region. Her vibrant hair is fragrant and resembles leaves and blossoms."

[[entry]]
id = "ref/shamanspirit/wood"
anchor = "spirit-magic-spells"
print = "_Shillelagh_ (1st), _barkskin_ (2nd), _minor creation_ (wood items only) (3rd), _thorn body_ (4th), _tree stride_ (5th), _ironwood_ (6th), _transmute metal to wood_ (7th), _changestaff_ (8th), _wooden phalanx_ (9th)."

[[entry]]
id = "ref/shamanspirit/wood"
anchor = "hexes"
print = "A shaman who chooses the wood spirit can select from the following hexes."

[[entry]]
id = "ref/shamanspirit/wood"
anchor = "hex-of-lignification"
print = "The shaman causes a creature within 30 feet to turn into a twisted, treelike shape for 2 rounds. The target gains [hardness](ref/rule/breaking-things) 5 but is [staggered](ref/misc/staggered), and can negate the effect with a successful Fortitude saving throw. Whether or not the target succeeds at its save, it can't be the target of this hex again for 24 hours."

[[entry]]
id = "ref/shamanspirit/wood"
anchor = "nature-s-gifts"
print = "Once per day, the shaman can command trees and other plants to yield magical berries and fruit. This ability functions as _[goodberry](ref/spell/goodberry)_, except the maximum number of hit points it can restore to a subject in a 24-hour period from this hex is equal to the shaman's Charisma modifier (minimum 1 hit point per day)."

[[entry]]
id = "ref/shamanspirit/wood"
anchor = "spines-and-brambles"
print = "With a beckoning gesture, the shaman conjures spiny shrubs in a number of squares equal to her Charisma modifier (minimum 1) within 30 feet. The squares become filled with [light undergrowth](ref/rule/forest-terrain). The shaman can pass through the affected squares without impediment. When the shaman uses this hex again, any previously conjured undergrowth withers away."

[[entry]]
id = "ref/shamanspirit/wood"
anchor = "verdant-path"
print = "Even the most tangled briars make way for the shaman, and suitable roots and branches appear to support her feet. The shaman gains [woodland stride](ref/ability/woodland-stride), as per the druid ability of the same name. At 8th level, she can use _[air walk](ref/spell/air-walk)_ at will whenever she is within 10 feet of a tree, though the effect ends instantly when she moves farther than 10 feet from a tree."

[[entry]]
id = "ref/shamanspirit/wood"
anchor = "whispering-leaves"
print = "Whenever the shaman is within 10 feet of a tree or undergrowth, she can cast _whispering wind_ as a [spell-like ability](ref/umr/spell-like-abilities) with a caster level equal to her shaman level. The targeted area must also contain trees or undergrowth, which relay the message in a gentle, rustling voice. At 8th level, the shaman can also listen to the targeted area as though she were using _[clairaudience/clairvoyance](ref/spell/clairaudience-clairvoyance)_ for the 1 round during which the hex is delivering the message."

[[entry]]
id = "ref/shamanspirit/wood"
anchor = "sec-spirit-animal"
print = "The shaman's spirit animal looks like a wooden figurine or a vaguely animal-shaped tree branch when it is motionless. The animal gains freeze as per the universal monster rule (_Pathfinder RPG Bestiary 2_ 297)."

[[entry]]
id = "ref/shamanspirit/wood"
anchor = "spirit-ability"
print = "A shaman who chooses the wood spirit as her spirit or wandering spirit gains the following ability."

[[entry]]
id = "ref/shamanspirit/wood"
anchor = "tree-limb"
print = '''
As a swift action, the shaman can turn one of her arms into a heavy, branch-like limb. She must drop anything held in that hand, and she can't use this ability if she is wearing a shield on that arm. Until the beginning of her next turn, she gains a [slam attack](ref/umr/natural-attacks) that deals 1d8 points of damage (for a Medium shaman; 1d6 if Small, 2d6 if Large). A shaman can use this ability a number of times per day equal to 3 + her Charisma modifier.

At 8th level, the reach of this slam attack increases by 5 feet. At 16th level, the shaman can transform both of her arms, gaining two slam attacks.'''

[[entry]]
id = "ref/shamanspirit/wood"
anchor = "greater-spirit-ability"
print = "A shaman who chooses the wood spirit as her spirit or wandering spirit gains the following ability upon having access to the greater version of that spirit."

[[entry]]
id = "ref/shamanspirit/wood"
anchor = "bloody-roots"
print = '''
As a standard action, the shaman can cause a field of thick roots to burrow up from the ground. This ability functions as _[black tentacles](ref/spell/black-tentacles)_ with a caster level equal to the shaman's level. The area is centered on the shaman when she activates the ability but remains stationary if she then moves. The shaman is unaffected by the roots. Her allies treat the area as [difficult terrain](ref/rule/terrain-and-obstacles), but the roots don't attack them.

The shaman can end the effect as a free action. She can use this ability a number of rounds per day equal to 3 + her Charisma modifier, but these rounds do not need to be consecutive.'''

[[entry]]
id = "ref/shamanspirit/wood"
anchor = "true-spirit-ability"
print = "A shaman who chooses the wood spirit as her spirit or wandering spirit gains the following ability upon having access to the true version of that spirit."

[[entry]]
id = "ref/shamanspirit/wood"
anchor = "tree-form"
print = "As a standard action, the shaman can assume the form of a plant creature as per _[plant shape III](ref/spell/plant-shape-3)_ with a duration of 1 hour per level. She can use this ability once per day."

[[entry]]
id = "ref/shamanspirit/wood"
anchor = "sec-manifestation"
print = "Upon reaching 20th level, the shaman becomes a living creature of wood. She is forevermore treated as a plant creature rather than her original creature type for the purposes of spells and magical effects. Her skin takes on the appearance of polished wood grain, and she gains a +4 natural armor bonus to her Armor Class and damage reduction 10/— against wooden weapons and the natural attacks of wooden and wood-like creatures. She gains immunity to paralysis, poison, polymorph, sleep, and stun. At will, the shaman can meld with any tree or single block of wood (as per _meld into stone_, except she can meld only with wood and has no limit on how long she can remain in the wood)."

[[entry]]
id = "ref/shamanspirit/wood"
anchor = "leshy-caller-summoner-archetype"
print = "A leshy caller summons creatures from the First World and forges a bond with a leshy eidolon."

[[entry]]
id = "ref/shamanspirit/wood"
anchor = "leshy-eidolon"
print = "When a leshy caller summons her eidolon, the eidolon's body is created from extraplanar plant material and imbued with the intelligence of a leshy spirit. Its statistics are changed from those of a standard eidolon as follows. An unchained summoner uses the plant eidolon subtype (see page 95) instead of one of the subtypes listed in _Pathfinder RPG Pathfinder Unchained_."

[[entry]]
id = "ref/shamanspirit/wood"
anchor = "type"
print = "The eidolon is still an outsider, and its statistics don't change, but it also counts as a plant. As it isn't truly a plant, it doesn't gain the plant immunities."

[[entry]]
id = "ref/shamanspirit/wood"
anchor = "base-form"
print = '''
The leshy caller chooses one of the base forms listed below for her eidolon. When the eidolon is summoned in an environment matching one of these base forms, the leshy caller can change the eidolon's base form to the matching form by sacrificing one daily use of her _summon nature's ally_ ability as a free action.

Plant eidolon base forms are as follows.

_Cactus (Desert):_ Size Medium; Speed 30 ft.; AC +2 natural armor; Saves Fort (good), Ref (good), Will (bad); Attack sting (1d4); Ability Scores Str 14, Dex 14, Con 13, Int 7, Wis 10, Cha 11; Free Evolutions limbs (arms), limbs (legs), sting.

_Conifer (Forest, Mountain):_ Size Medium; Speed 30 ft.; AC +2 natural armor; Saves Fort (good), Ref (bad), Will (good); Attack 2 claws (1d4); Ability Scores Str 14, Dex 12, Con 15, Int 7, Wis 10, Cha 11; Free Evolutions claws, limbs (arms), limbs (legs).

_Fungus (Swamp, Underground):_ Size Medium; Speed 30 ft.; AC +2 natural armor; Saves Fort (good), Ref (good), Will (bad); Attack bite (1d6); Ability Scores Str 14, Dex 14, Con 13, Int 7, Wis 10, Cha 11; Free Evolutions bite, limbs (arms), limbs (legs).

_Leaf (Forest, Jungle, Swamp):_ Size Medium; Speed 30 ft.; AC +2 natural armor; Saves Fort (good), Ref (good), Will (bad); Attack slam (1d8); Ability Scores Str 16, Dex 12, Con 13, Int 7, Wis 10, Cha 11; Free Evolutions limbs (arms), limbs (legs), slam.

_Seaweed (Aquatic):_ Size Medium; Speed 20 ft., swim 40 ft.; AC +2 natural armor; Saves Fort (good), Ref (good), Will (bad); Attack slam (1d8); Ability Scores Str 12, Dex 14, Con 15, Int 7, Wis 10, Cha 11; Free Evolutions limbs (arms), slam, swim (2).

This alters the summoner's eidolon.'''

[[entry]]
id = "ref/shamanspirit/wood"
anchor = "summon-nature-s-ally"
print = '''
A leshy caller can cast _summon nature's ally_ as a spell-like ability a number of times per day equal to 3 + her Charisma modifier. At levels where a regular summoner would gain access to a new level of _summon monster_ as a spell-like ability, the leshy caller instead gains the equivalent _summon nature's ally_ spell; at 19th level, she can cast _summon nature's ally IX_ or _gate_. When a leshy caller gains a _summon nature's ally_ spell as a spell-like ability, she adds it to her class spell list (though she must still select it as a spell known if she wants to gain the ability to cast it as a normal spell). She adds leaf leshys, gourd leshys, fungus leshys, seaweed leshys, and lotus leshys to her list of creatures for _summon nature's ally I_, _II_, _III_, _IV_, and _V_, respectively.

This alters summon monster.'''

[[entry]]
id = "ref/shamanspirit/wood"
anchor = "plant-eidolon-subtype"
print = "Plant eidolons consist of vegetable matter infused with raw natural spiritual power."

[[entry]]
id = "ref/shamanspirit/wood"
anchor = "alignment"
print = "Any. Plant eidolons don't have alignment subtypes."

[[entry]]
id = "ref/shamanspirit/wood"
anchor = "base-form"
print = "Cactus (limbs \\[arms\\], limbs \\[legs\\], sting), conifer (claws, limbs \\[arms\\], limbs \\[legs\\]), fungus (bite, limbs \\[arms\\], limbs \\[legs\\]), leaf (limbs \\[arms\\], limbs \\[legs\\], slam), seaweed (limbs \\[arms\\], slam, swim \\[2\\])."

[[entry]]
id = "ref/shamanspirit/wood"
anchor = "base-evolutions"
print = '''
At 1st level, plant eidolons gain low-light vision as well as the resistance (electricity) and resistance (sonic) evolutions.

At 4th level, plant eidolons gain constant _pass without trace_ and they can change shape into plants of the size category corresponding to their base form with results similar to _tree shape_.

At 8th level, plant eidolons gain the ability to use _speak with plants_ for 1 minute per Hit Die per day with any plants related to the eidolon's base form. These minutes need not be consecutive.

At 12th level, plant eidolons gain immunity to paralysis, poison, sleep, and stun.

At 16th level, plant eidolons gain the ability to use _commune with nature_ once per day and can use their _speak with plants_ ability at will. At 20th level, plant eidolons gain a +8 resistance bonus on saving throws against mind-affecting effects. They lose their resistance (electricity) and resistance (sonic) evolutions and instead gain the immunity (electricity) and immunity (sonic) evolutions.'''

[[entry]]
id = "ref/shamanspirit/wood"
anchor = "arrow-champion-swashbuckler-archetype"
print = "While the swashbuckler's agile style of combat is equally suited to urban settings and wilderness, the bow and arrow is an indispensable asset in open areas and harsh terrain where fancy footwork isn't enough to close the distance or dodge the enemy's arrows."

[[entry]]
id = "ref/shamanspirit/wood"
anchor = "arrow-champion-s-panache"
print = '''
An arrow champion regains panache when she makes a killing blow with a light or one-handed piercing melee weapon or a bow (a longbow, shortbow, composite longbow, or composite shortbow).

This alters panache.'''

[[entry]]
id = "ref/shamanspirit/wood"
anchor = "deeds"
print = '''
An arrow champion gains the following deeds, each of which replaces an existing deed.

_Retaliation (Ex):_ When a foe hits the arrow champion with an attack, she can spend 1 panache point to make a retaliatory attack of opportunity against that foe. If the triggering attack is a melee attack, she can retaliate with a melee attack using a light or one-handed piercing melee weapon, provided the creature is within her reach. If the triggering attack is a ranged attack, she can retaliate with a ranged attack using a bow, provided that the creature is within 30 feet of her. This deed's cost cannot be reduced by any ability or effect that reduces the number of panache points a deed costs.

This deed replaces opportune parry and riposte.

_Precise Aim (Ex):_ At 3rd level, when attacking with a light or one-handed piercing melee weapon, an arrow champion can add her swashbuckler level to the damage she deals, as the swashbuckler's precise strike deed. She can also add one-quarter of her swashbuckler level to the damage dealt when attacking with a bow, but the target must be within 30 feet of her. As a swift action, an arrow champion can spend 1 panache point to increase the range of the effect to her bow's first range increment. Unlike a normal swashbuckler, an arrow champion cannot spend panache to double the extra damage.

This deed alters precise strike.

_Swift Switch (Ex):_ At 3rd level, while the arrow champion has at least 1 panache point, she can sheathe or draw an unhidden light or one-handed piercing melee weapon or a bow as a swift action without provoking attacks of opportunity. If the arrow champion spends 1 panache point, she can perform either action as an immediate action. In addition, if she has the Quick Draw feat and one of her hands is free, she can sheathe a weapon and draw an unhidden weapon as part of the same swift action, provided that one of the weapons is a bow and the other is a light or one-handed piercing melee weapon. If she spends 1 panache point, she can perform the switch as an immediate action.

This deed replaces swashbuckler's initiative.

_Archer's Feint (Ex):_ At 7th level, when the arrow champion hits a foe within 30 feet with a bow attack, she can forgo the damage and instead attempt a Bluff check to feint against that foe as a swift action. If successful, in addition to the normal benefits of feinting, she doubles the extra damage from precise aim on her next melee attack before the end of her next turn.

This deed replaces superior feint.'''

[[entry]]
id = "ref/shamanspirit/wood"
anchor = "weapon-versatility"
print = '''
At 5th level, an arrow champion learns to use precision-based tricks just as accurately with her bow as with her melee weapons. Provided that her swashbuckler level is high enough, she can use the bleeding wound, deadly stab, menacing swordplay, perfect thrust, stunning stab, and targeted strike deeds when attacking with a bow, so long as her target is within 30 feet. If she spends a panache point to increase the range of her precise aim ability, the increased range applies to this ability as well.

This replaces swashbuckler weapon training.'''

[[entry]]
id = "ref/shamanspirit/wood"
anchor = "versatile-weapon-mastery"
print = '''
At 20th level, an arrow champion gains the benefits of swashbuckler weapon mastery when using a light or one-handed piercing melee weapon or a bow.

This alters swashbuckler weapon mastery.'''

[[entry]]
id = "ref/shamanspirit/wood"
anchor = "wildstrider-swashbuckler-archetype"
print = "Most swashbucklers call cities their home, but some prefer deserts, marshlands, mountains, or woods, where the rough terrain grants them an advantage, and have little interest in the comforts of an urban lifestyle."

[[entry]]
id = "ref/shamanspirit/wood"
anchor = "class-skills"
print = '''
A wildstrider gains Knowledge (nature), Stealth, and Survival as class skills, but does not gain Knowledge (nobility), Sense Motive, and Sleight of Hand as class skills.

This alters the swashbuckler's class skills.'''

[[entry]]
id = "ref/shamanspirit/wood"
anchor = "deeds"
print = '''
A wildstrider gains the following deeds, each of which replaces an existing deed.

_Subterfuge (Ex):_ A wildstrider adds Stealth to the list of skills to which the derring-do deed applies. At 15th level, she adds Stealth to the list of skills on which she can take 10 using the swashbuckler's edge deed.

This deed replaces dodging panache and alters derring-do and swashbuckler's edge.

_Adroit Step (Ex):_ At 3rd level, a wildstrider can use a swift action to treat a 5-foot square of difficult terrain as if it were normal terrain. If she also spends a panache point, she can treat all difficult terrain as though it were normal terrain until the end of her turn.

This deed replaces kip-up.

_Keen Gaze (Ex):_ At 11th level, while a wildstrider has at least 1 panache point, she can ignore the miss chance from concealment (but not total concealment) caused by normal and magical fog, smoke, and undergrowth, but not other sources of concealment or a miss chance, such as _blur_.

This deed replaces subtle blade.'''

[[entry]]
id = "ref/shamanspirit/wood"
anchor = "avenging-beast-vigilante-archetype"
print = "Some vigilantes turn to natural traditions and supernatural forces to transform into beasts, unleashing a primal fury on their foes before returning to an ordinary guise."

[[entry]]
id = "ref/shamanspirit/wood"
anchor = "class-skills"
print = '''
An avenging beast gains Knowledge (nature) and Spellcraft as class skills, but does not gain Disable Device, Knowledge (engineering), Perform, and Sleight of Hand as class skills.

This alters the vigilante's class skills.'''

[[entry]]
id = "ref/shamanspirit/wood"
anchor = "skill-ranks-per-level"
print = '''
An avenging beast gains a number of skill ranks equal to 4 + his Intelligence modifier at each level, instead of 6 + his Intelligence modifier.

This alters the vigilante's skill ranks per level.'''

[[entry]]
id = "ref/shamanspirit/wood"
anchor = "animal-mask"
print = '''
An avenging beast gains an ornate animal-headed mask that is a focus for his power and must be worn when assuming his vigilante identity. This mask symbolizes one specific animal, and the animal cannot be changed once chosen. Without this mask, an avenging beast cannot assume his vigilante identity. An avenging beast who loses his mask can replace it after 1 week through a specialized ritual that takes 8 hours to complete and costs 200 gp per avenging beast level.

This alters dual identity.'''

[[entry]]
id = "ref/shamanspirit/wood"
anchor = "spellcasting"
print = '''
An avenging beast casts divine spells as a hunter and uses the hunter's spell list.

This replaces the vigilante talents gained at 4th, 8th, 10th, 14th, and 16th level.'''

[[entry]]
id = "ref/shamanspirit/wood"
anchor = "patron-spells"
print = '''
An avenging beast selects a patron from the witch patron list and adds the patron bonus spells to his spell list (up to 6th-level spells). Patron spells of 7th level or higher are not counted as being on the avenging beast's spell list.

This replaces vigilante specialization.'''

[[entry]]
id = "ref/shamanspirit/wood"
anchor = "wild-shape"
print = '''
At 5th level, when in his vigilante identity, the avenging beast gains the ability to take on the shape of the animal represented by his animal mask. This ability functions identically to the druid's wild shape ability, except the ability does not improve beyond functioning as _beast shape I_. The avenging beast treats his vigilante level as his druid level for the purposes of this ability. An avenging beast can use wild shape once per day at 5th level and one additional time per day at 7th level and every 2 levels thereafter, for a total of eight times per day at 19th level.

This replaces startling appearance, frightening appearance, and stunning appearance.'''

[[entry]]
id = "ref/shamanspirit/wood"
anchor = "wood-shaman-spirit"
print = '''
A shaman who selects the wood spirit has a skin tone similar to the coloration of trees in her home region. Her vibrant hair is fragrant, and resembles leaves and blossoms.

**Spirit Magic Spells:** _Shillelagh_ (1st), _barkskin_ (2nd), _minor creation_ (wood items only) (3rd), _thorn body_ (4th), _tree stride_ (5th), _ironwood_ (6th), _transmute metal to wood_ (7th), _changestaff_ (8th), _wooden phalanx_ (9th).

**Hexes:** A shaman who chooses the wood spirit can select from the following hexes.

**Hex of Lignification (Su):** The shaman causes a creature within 30 feet to turn into a twisted, treelike shape for 2 rounds. The target gains hardness 5 but is staggered. A successful Fortitude saving throw negates this effect. Whether or not the save is successful, the creature can't be the target of this hex again for 24 hours.

**Nature's Gifts (Su):** Once per day, the shaman can command trees and other plants to yield magical berries and fruit. This ability functions as _goodberry_, except the maximum number of hit points a subject can be healed in a 24-hour period from this hex is equal to the shaman's Wisdom bonus (minimum 1 hit point/day).

**Spines and Brambles (Su):** With a beckoning gesture, the shaman conjures spiny shrubs in a number of squares equal to her Wisdom modifier (minimum 1) within 30 feet. The squares become filled with light undergrowth (_Pathfinder RPG Core Rulebook_ 426). The shaman can pass through the affected squares without impediment. When the shaman uses this hex again, any previously conjured undergrowth withers away.

**Verdant Path (Su):** Even the most tangled briars make way for the shaman, and suitable roots and branches appear to support her feet. The shaman gains woodland stride, as the druid ability of the same name. At 8th level, she can use _air walk_ at will whenever she is within 10 feet of a tree.

**Whispering Leaves (Su):** Whenever the shaman is within 10 feet of a tree or undergrowth, she can use _whispering wind_ (as the spell) with a caster level equal to her shaman level. The targeted area must also contain trees or undergrowth, which relay the message in a gentle, rustling voice. At 8th level, the shaman can also listen to the targeted area as though she were using _clairaudience/clairvoyance_.

**Spirit Animal:** The shaman's spirit animal looks like a wooden figurine or a vaguely animal-shaped tree branch when it is motionless. The animal gains the freeze universal monster ability.

**Spirit Ability:** A shaman who chooses the wood spirit as her spirit or wandering spirit gains the following ability.

**Tree Limb (Su):** As a swift action, the shaman can turn one of her arms into a heavy, branchlike limb. She must drop anything held in that hand, and she can't use this ability if she is wearing a shield on that arm. Until the beginning of her next round, she gains a slam attack that deals 1d8 points of damage (if a Medium shaman; 1d6 if Small, 2d6 if Large). A shaman can use this ability a number of times per day equal to 3 + her Charisma modifier.

At 8th level, the reach of the slam attack increases by 5 feet. At 16th level, the shaman can choose to transform both of her arms, gaining two slam attacks.

**Greater Spirit Ability:** A shaman who chooses the wood spirit as her spirit or wandering spirit gains the following ability upon gaining access to the greater version of that spirit.

**Bloody Roots (Su):** As a standard action, the shaman can cause a field of thick roots to burrow up from the ground. This ability functions as _black tentacles_ with a caster level equal to the shaman's level. The area is centered on the shaman but remains stationary if she moves. The shaman is unaffected by the roots. Her allies treat the area as difficult terrain but are not attacked by the roots.

The shaman can end the effect as a free action. She can use this ability a number of rounds per day equal to 3 + her Charisma modifier, but these rounds do not need to be consecutive.

**True Spirit Ability:** A shaman who chooses the wood spirit as her spirit or wandering spirit gains the following ability upon gaining access to the true version of that spirit.

**Tree Form (Su):** As a standard action, the shaman can assume the form of a plant creature as _plant shape III_ with a duration of 1 hour per level. She can use this ability once per day.

**Manifestation:** Upon reaching 20th level, the shaman becomes a living creature of wood. She is forevermore treated as the plant type rather than her original type for purposes of spells and magical effects. Her skin takes on the appearance of polished wood grain, and she gains a +4 natural armor bonus to her Armor Class and damage reduction 10/— against wooden weapons or any natural attacks made by a wooden or woodlike creature. She gains immunity to paralysis, poison, polymorph, sleep, and stun. At will, the shaman can meld with any tree or single block of wood (as _meld into stone_, except she can meld with wood only, and has no limit on how long she can remain in the wood).'''

