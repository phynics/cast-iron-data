anchor = "leadership"
print = "At 8th level, you receive [Leadership](ref/feat/leadership) as a bonus feat. In addition, you gain a +2 bonus on your leadership score as long as you uphold the tenets of your deity (or divine concept if you do not venerate a deity)."

[[entry]]
id = "ref/domain/nobility"
anchor = "domain-spells"
print = "1st—_divine favor_, 2nd—_enthrall_, 3rd—_magic vestment_, 4th—_discern lies_, 5th—_greater command_, 6th—_geas/quest_, 7th—_repulsion_, 8th—_demand_, 9th—_storm of vengeance_."

[[entry]]
id = "ref/domain/nobility"
anchor = "divine-demand"
print = "At 6th level, you can petition your divine patron for far greater power than you deserve. Activating this ability is a swift action that you must use as you cast a spell that has a reduced (but not negated) effect on a successful save. The saving throw DC of the spell increases by 2, and you gain a +2 bonus on caster level checks to overcome spell resistance with the spell. Any creature that succeeds at the saving throw instead avoids the effect entirely. If half or more of the targets are unaffected, you become [shaken](ref/misc/shaken) for a number of rounds equal to the spell's level. If all of the targets are unaffected, you instead lose the ability to cast divine spells, channel energy, and use domain powers for 1d4+1 rounds; you can end this loss as a full-round action by loudly apologizing to your patron deity as a full-round action that provokes attacks of opportunity. You can use this ability once per day at 6th level, and one additional time per day for every 4 levels beyond 6th."

[[entry]]
id = "ref/domain/nobility"
anchor = "inspiring-command"
print = "As a standard action, you can issue an inspiring command to your allies. The inspiring command affects one ally plus one additional ally for every three cleric levels you possess, who must all be within 30 feet of you. Affected allies gain a +2 insight bonus on attack rolls, AC, combat maneuver defense, and skill checks for 1 round. This is a language-dependant mind-affecting effect."

[[entry]]
id = "ref/domain/nobility"
anchor = "sacrificial-bond"
print = "At 8th level, when an ally within 30 feet takes damage from an attack, you can, as an immediate action, transfer this damage to yourself. This power also transfers any effects that accompany the damage. The damage done to you cannot be reduced in any way. You can use this ability once per day at 8th level, plus on additional time per day at 14th level and 20th level."

[[entry]]
id = "ref/domain/nobility"
anchor = "romance-beyond-death"
print = '''
You receive [Command Undead](ref/feat/command-undead) or [Turn Undead](ref/feat/turn-undead) as a bonus feat, depending on the type of energy you channel. Increase the DC of the saving throw against these feats' effects by 2 as long as the spirits involved were slain by drowning or killed themselves. If the circumstances of the affected undead's creation was linked to romance, increase the save DC by 4 instead.

This replaces the leadership domain power of the Nobility domain.'''

[[entry]]
id = "ref/domain/nobility"
anchor = "hubris-subdomain"
print = '''
**Example Apocrypha (Iomedae):** As the Second Mendevian Crusade drew to a close, the crusaders found they had exhausted many of their strongest warriors, forcing them to recruit mercenaries of less noble intentions. At the same time, demons began infiltrating Mendev's ranks, spreading lies, and seeding betrayal. The Third Crusade collapsed nearly as soon as it began, crippled by witch-hunts and bloodthirsty inquisitions. The Church of Iomedae has since reprimanded the overzealous interrogators who led those pogroms, yet a small cult of apostates refuses to accept forgiveness for the faith's lapse. Calling themselves the Children of the Third Crusade, these curious acolytes self-flagellate to seek humility, yet they then lord their righteousness over their peers in shows of disquieting vanity. The crusaders suffer these fanatics' presence, acknowledging them as a living lesson of the crusade's past failures.

**Associated Domains:** Glory, Nobility.

**Associated Deities:** Dispater, General Susumu, Iomedae, Jaidz, Lissala, Olheon, Ydersius.

**Replacement Power:** You gain Intimidate as a class skill; this replaces the Glory domain's increased save DC to resist channel positive energy. The following granted power replaces the divine presence power of the Glory domain or the leadership power of the Nobility domain.

**Divine Demand (Su):** At 6th level, you can petition your divine patron for far greater power than you deserve. Activating this ability is a swift action that you must use as you cast a spell that has a reduced (but not negated) effect on a successful save. The saving throw DC of the spell increases by 2, and you gain a +2 bonus on caster level checks to overcome spell resistance with the spell. Any creature that succeeds at the saving throw instead avoids the effect entirely. If half or more of the targets are unaffected, you become [shaken](ref/misc/shaken) for a number of rounds equal to the spell's level. If all of the targets are unaffected, you instead lose the ability to cast divine spells, channel energy, and use domain powers for 1d4+1 rounds; you can end this loss as a full-round action by loudly apologizing to your patron deity as a full-round action that provokes attacks of opportunity. You can use this ability once per day at 6th level, and one additional time per day for every 4 levels beyond 6th.

**Replacement Domain Spells:** 4th—_hollow heroism_, 7th—_greater hollow heroism_, 9th—_overwhelming presence_. If you are evil, replace the domain spells _bless weapon_ and _holy aura_ with _aid_ and _unholy aura_ respectively.'''

