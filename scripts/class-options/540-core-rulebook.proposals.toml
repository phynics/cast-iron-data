anchor = "deities"
print = "Erastil, Gozreh."

[[entry]]
id = "ref/domain/plant"
anchor = "granted-powers"
print = "You find solace in the green, can grow defensive thorns, and can communicate with plants."

[[entry]]
id = "ref/domain/plant"
anchor = "wooden-fist"
print = "As a free action, your hands can become as hard as wood, covered in tiny thorns. While you have wooden fists, your unarmed strikes do not provoke attacks of opportunity, deal lethal damage, and gain a bonus on damage rolls equal to 1/2 your cleric level (minimum +1). You can use this ability for a number of rounds per day equal to 3 + your Wisdom modifier. These rounds do not need to be consecutive."

[[entry]]
id = "ref/domain/plant"
anchor = "bramble-armor"
print = "At 6th level, you can cause a host of wooden thorns to burst from your skin as a free action. While bramble armor is in effect, any foe striking you with an unarmed strike or a melee weapon without reach takes 1d6 points of piercing damage + 1 point per two cleric levels you possess. You can use this ability for a number of rounds per day equal to your cleric level. These rounds do not need to be consecutive."

[[entry]]
id = "ref/domain/plant"
anchor = "domain-spells"
print = "1st—_entangle_, 2nd—_barkskin_, 3rd—_plant growth_, 4th—_command plants_, 5th—_wall of thorns_, 6th—_repel wood_, 7th—_animate plants_, 8th—_control plants_, 9th—_shambler_."

[[entry]]
id = "ref/domain/plant"
anchor = "aura-of-decay"
print = "At 8th level, you can emit a 30-foot aura of decay as a standard action. Living creatures in this aura (except you) take 1d6 points of damage per round as their flesh rots. They also take a cumulative -1 penalty to Strength each round they remain in the aura. Once outside the aura, the penalty fades at the rate of -1 per round, but it begins building again if they reenter the aura. Plant creatures take 2d6 points of damage per round. You can use this ability for a number of rounds per day equal to your cleric level. These rounds do not need to be consecutive."

[[entry]]
id = "ref/domain/plant"
anchor = "enlarge"
print = "As a swift action you can enlarge yourself for 1 round, as if you were the target of the _[enlarge person](ref/spell/enlarge-person)_ spell. You can use this ability a number of times per day equal to 3 + your Wisdom modifier."

[[entry]]
id = "ref/domain/plant"
anchor = "leshy-caller"
print = '''
You can spontaneously swap out any of your domain spells for a _[summon nature's ally](ref/spell/summon-natures-ally)_ spell of the same level or lower, to a maximum of _[summon nature's ally VII](ref/spell/summon-natures-ally-7)_. If you do, you must use the spell to summon one or more [leshys](ref/family/leshy). Add [leaf leshy](ref/monster/leshy-leaf-leshy), [gourd leshy](ref/monster/leshy-gourd-leshy), [fungus leshy](ref/monster/leshy-fungus-leshy), [seaweed leshy](ref/monster/leshy-seaweed-leshy), and [lotus leshy](ref/monster/leshy-lotus-leshy) to your _summon nature's ally I_, _II_, _III_, _IV_, and _V_ lists, respectively. You count as a plant creature for the purpose of creating leshys.

As a standard action, you can grant a single leshy within 30 feet a +4 sacred bonus on its next attack roll before the start of your next turn. You can use this ability a number of times per day equal to 3 + your Wisdom modifier.'''

[[entry]]
id = "ref/domain/plant"
anchor = "cruel-thicket"
print = "As a standard action, you can cause the ground in a 5-foot-radius [burst](ref/misc/burst) centered on you to sprout twisting, thorny vines. Any creature moving through it must travel at half speed or take [bleed](ref/rule/bleed) damage equal to half your cleric level; if you activate this ability in an area with numerous plants (grass, weeds, trees, etc.), the area also becomes [difficult terrain](ref/rule/terrain-and-obstacles). These effects last for 1 minute, after which the vines crumble to dust. Creatures able to move through natural undergrowth unhindered ignore the effects of this ability. You can use this ability a number of times per day equal to 3 + your Wisdom modifier."

[[entry]]
id = "ref/domain/plant"
anchor = "decay-subdomain"
print = '''
**Associated Domain:** Plant.

**Replacement Power:** The following granted power replaces the bramble armor power of the Plant domain.

**Aura of Decay (Su):** At 8th level, you can emit a 30-foot aura of decay as a standard action. Living creatures in this aura (except you) take 1d6 points of damage per round as their flesh rots. They also take a cumulative -1 penalty to Strength each round they remain in the aura. Once outside the aura, the penalty fades at the rate of -1 per round, but it begins building again if they reenter the aura. Plant creatures take 2d6 points of damage per round. You can use this ability for a number of rounds per day equal to your cleric level. These rounds do not need to be consecutive.

**Replacement Domain Spells:** 3rd—_contagion_, 4th—_poison_, 6th—_harm_.'''

[[entry]]
id = "ref/domain/plant"
anchor = "growth-subdomain"
print = '''
**Associated Domain:** Plant.

**Replacement Power:** The following granted power replaces the wooden fist power of the Plant domain.

**Enlarge (Su):** As a swift action you can enlarge yourself for 1 round, as if you were the target of the _[enlarge person](ref/spell/enlarge-person)_ spell. You can use this ability a number of times per day equal to 3 + your Wisdom modifier.

**Replacement Domain Spells:** 1st—_enlarge person_, 5th—_righteous might_.'''

[[entry]]
id = "ref/domain/plant"
anchor = "thorns-subdomain"
print = '''
**Example Apocrypha (Zyphus):** Whereas many Zyphens tailor their dreadful accidents to each victim, a sect of the Grim Harvestman's faithful teach that they must encourage nature itself to indiscriminately inf lict accidental pain and death upon the unwary. The bloodstained journal of a now-forgotten Zyphen, entitled _Sowing Despair_, relates the writer's decades of breeding and planting vicious nettles all around the Lake Encarthan region. The work has since been recopied and distributed widely—especially in the River Kingdoms, where Zyphens delight in watching pioneers die horribly in the unforgiving frontier.

**Associated Domain:** Plant.

**Associated Deities:** The Green Mother, Shub-Niggurath, Zyphus.

**Replacement Power:** The following granted power replaces the wooden fist power of the Plant domain.

**Cruel Thicket (Su):** As a standard action, you can cause the ground in a 5-foot-radius [burst](ref/misc/burst) centered on you to sprout twisting, thorny vines. Any creature moving through it must travel at half speed or take [bleed](ref/rule/bleed) damage equal to half your cleric level; if you activate this ability in an area with numerous plants (grass, weeds, trees, etc.), the area also becomes [difficult terrain](ref/rule/terrain-and-obstacles). These effects last for 1 minute, after which the vines crumble to dust. Creatures able to move through natural undergrowth unhindered ignore the effects of this ability. You can use this ability a number of times per day equal to 3 + your Wisdom modifier.

**Replacement Domain Spells:** 1st—_thorn javelin_, 3rd—_thorny entanglement_, 4th—_thorn body_.'''

[[entry]]
id = "ref/domain/plant"
anchor = "leshy-subdomain"
print = '''
You have a strong connection to these little manifestations of nature spirits.

**Associated Domain:** Plant.

**Associated Religions:** Gozreh, Green Faith.

**Replacement Power:** The following granted power replaces the wooden fist power of the Plant domain.

**Leshy Caller (Sp):** You can spontaneously swap out any of your domain spells for a _[summon nature's ally](ref/spell/summon-natures-ally)_ spell of the same level or lower, to a maximum of _[summon nature's ally VII](ref/spell/summon-natures-ally-7)_. If you do, you must use the spell to summon one or more [leshys](ref/family/leshy). Add [leaf leshy](ref/monster/leshy-leaf-leshy), [gourd leshy](ref/monster/leshy-gourd-leshy), [fungus leshy](ref/monster/leshy-fungus-leshy), [seaweed leshy](ref/monster/leshy-seaweed-leshy), and [lotus leshy](ref/monster/leshy-lotus-leshy) to your _summon nature's ally I_, _II_, _III_, _IV_, and _V_ lists, respectively. You count as a plant creature for the purpose of creating leshys.

As a standard action, you can grant a single leshy within 30 feet a +4 sacred bonus on its next attack roll before the start of your next turn. You can use this ability a number of times per day equal to 3 + your Wisdom modifier.

**Replacement Domain Spells:** 1st—_tree shape_, 5th—_commune with nature_.'''

[[entry]]
id = "ref/domain/protection"
anchor = "deities"
print = "Abadar, Nethys, Shelyn, Torag."

[[entry]]
id = "ref/domain/protection"
anchor = "granted-powers"
print = "Your faith is your greatest source of protection, and you can use that faith to defend others. In addition, you receive a +1 resistance bonus on saving throws. This bonus increases by 1 for every 5 levels you possess."

[[entry]]
id = "ref/domain/protection"
anchor = "resistant-touch"
print = "As a standard action, you can touch an ally to grant him your resistance bonus for 1 minute. When you use this ability, you lose your resistance bonus granted by the Protection domain for 1 minute. You can use this ability a number of times per day equal to 3 + your Wisdom modifier."

[[entry]]
id = "ref/domain/protection"
anchor = "aura-of-protection"
print = "At 8th level, you can emit a 30-foot aura of protection for a number of rounds per day equal to your cleric level. You and your allies within this aura gain a +1 deflection bonus to AC and [resistance](ref/umr/resistance) 5 against all elements (acid, cold, electricity, fire, and sonic). The deflection bonus increases by +1 for every four cleric levels you possess beyond 8th. At 14th level, the resistance against all elements increases to 10. These rounds do not need to be consecutive."

[[entry]]
id = "ref/domain/protection"
anchor = "domain-spells"
print = "1st—_sanctuary_, 2nd—_shield other_, 3rd—_protection from energy_, 4th—_spell immunity_, 5th—_[spell resistance](ref/rule/spell-resistance)_, 6th—_antimagic field_, 7th—_repulsion_, 8th—_mind blank_, 9th—_prismatic sphere_."

[[entry]]
id = "ref/domain/protection"
anchor = "deflection-aura"
print = "Once each day, you can emit a 20-foot aura for a number of rounds equal to your cleric level. Allies within the aura gain a +2 deflection bonus to AC and combat maneuver defense."

[[entry]]
id = "ref/domain/protection"
anchor = "sheltering-walls"
print = "As a standard action, you can touch an ally to summon a floating blockade of stone, granting the ally the benefits of partial [cover](ref/rule/cover) for 1 round plus 1 round for every 6 cleric levels you possess. This ability does not grant the ally enough cover to attempt a Stealth check or avoid provoking attacks of opportunity. If the ally benefits from any other form of cover against an attack, the bonuses to AC and on Reflex saving throws increase by 1. You can use this power a number of times per day equal to 3 + your Wisdom modifier."

[[entry]]
id = "ref/domain/protection"
anchor = "purifying-touch"
print = "At 8th level, you can touch a willing creature with divine power, giving it a saving throw against each effect currently affecting it, using the original saving throw DC of the effect. Each successful saving throw ends the related effect. The creature can choose not to make a save against an effect. You can use this ability once per day at 8th level, plus one additional time per day at 14th and 20th level."

[[entry]]
id = "ref/domain/protection"
anchor = "taboo"
print = "When a creature touches you or strikes you with a melee attack, you can activate this power as an immediate action. That creature takes a -1 penalty on saving throws for 1 minute. This penalty increases by 1 for every 5 levels you possess. When you use this ability, you lose your resistance bonus granted by the Protection domain for 1 minute. You can use this ability a number of times per day equal to 3 + your Wisdom modifier."

