anchor = "manipulator-school"
print = '''
**Associated School:** Enchantment.

**Replacement Powers:** The following school powers replace the dazing touch and aura of despair powers of the enchantment school.

**Beguiling Touch (Sp):** You can charm a living creature by touching it. Creatures with more Hit Dice than your wizard level are unaffected, as are creatures in combat and those with an attitude of hostile toward you. Creatures receive a Will saving throw to negate the effect. The DC of this save is equal to 10 + 1/2 your wizard level + your Intelligence modifier. Creatures that fail their save are affected by _[charm monster](ref/spell/charm-monster)_ for a number of rounds equal to 1/2 your wizard level (minimum 1). This is a mind-affecting effect. You can use this ability a number of times per day equal to 3 + your Intelligence modifier.

**Shape Emotions (Su):** At 8th level, you can emit a 30-foot aura to either ward off or welcome emotional influence for a number of rounds per day equal to your wizard level. If you choose to ward, you and your allies within this aura receive a +4 morale bonus on saves against mind-affecting spells and effects, and any fear effects targeting you or your allies are reduced by one step ([shaken](ref/misc/shaken) has no effect, [frightened](ref/misc/frightened) becomes shaken, and [panicked](ref/misc/panicked) becomes frightened). If you chose to enhance emotional influence, enemies within the aura receive a -2 penalty on saves against mind-affecting spells and effects. These rounds do not need to be consecutive.'''

[[entry]]
id = "ref/arcaneschool/evocation"
anchor = "opening"
print = "Evokers revel in the raw power of magic, and can use it to create and destroy with shocking ease."

[[entry]]
id = "ref/arcaneschool/evocation"
anchor = "intense-spells"
print = "Whenever you cast an evocation spell that deals hit point damage, add 1/2 your wizard level to the damage (minimum +1). This bonus damage is not increased by [Empower Spell](ref/feat/empower-spell) or similar effects. This bonus only applies once to a spell, not once per missile or ray, and cannot be split between multiple missiles or rays. This damage is of the same type as the spell. At 20th level, whenever you cast an evocation spell you can roll twice to penetrate a creature's [spell resistance](ref/rule/spell-resistance) and take the better result."

[[entry]]
id = "ref/arcaneschool/evocation"
anchor = "force-missile"
print = "As a standard action you can unleash a force missile that automatically strikes a foe, as _[magic missile](ref/spell/magic-missile)_. The force missile deals 1d4 points of damage plus the damage from your intense spells evocation power. This is a force effect. You can use this ability a number of times per day equal to 3 + your Intelligence modifier."

[[entry]]
id = "ref/arcaneschool/evocation"
anchor = "elemental-wall"
print = "At 8th level, you can create a wall of energy that lasts for a number of rounds per day equal to your wizard level. These rounds do not need to be consecutive. This wall deals acid, cold, electricity, or fire damage, determined when you create it. The elemental wall otherwise functions like _[wall of fire](ref/spell/wall-of-fire)_."

[[entry]]
id = "ref/arcaneschool/evocation"
anchor = "versatile-evocation"
print = "When you cast an evocation spell that does acid, cold, electricity, or fire damage, you may change the damage dealt to one of the other four energy types. This changes the descriptor of the spell to match the new energy type. Any non-damaging effects remain unchanged unless the new energy type invalidates them (an _[ice storm](ref/spell/ice-storm)_ that deals fire damage might still provide a penalty on Perception checks due to smoke, but it would not create difficult terrain). Such effects are subject to GM discretion. You can use this ability a number of times per day equal to 3 + your Intelligence modifier."

[[entry]]
id = "ref/arcaneschool/evocation"
anchor = "elemental-manipulation"
print = "At 8th level, you can emit a 30-foot aura that transforms magical energy. Choose an energy type from acid, cold, electricity, and fire, and a second type to transform it into. Any magical source of energy of this type with a caster level equal to or less than your wizard level is altered to the chosen energy type. This includes supernatural effects from creatures with Hit Dice no greater than your caster level. For example, you could transform a [white dragon's](ref/family/dragon-white) frigid breath weapon (a supernatural ability), but not a [fire elemental's](ref/monster/fire-elemental) fiery touch (an extraordinary ability). If an effect lies only partially within your aura, only the portions within the aura are transformed. You can use this ability for a number of rounds per day equal to your wizard level. The rounds do not need to be consecutive."

[[entry]]
id = "ref/arcaneschool/evocation"
anchor = "lingering-evocations"
print = "Any evocation spell you cast with a duration greater than instantaneous lasts an additional number of rounds equal to 1/2 your wizard level (minimum +1). At 20th level, any dispel checks made against your evocation spells must be rolled twice, and your opponent must use the less favorable result."

[[entry]]
id = "ref/arcaneschool/evocation"
anchor = "wind-servant"
print = "As a standard action, you can generate a blast of air that hurls an unattended object (or objects) or an object in your possession up to 30 feet in a straight line. If you have a free hand, you can catch an object hurled toward yourself. You can move objects weighing up to 1 pound per wizard level. Objects are not thrown with enough force to cause damage, although fragile objects like alchemical weapons shatter on contact with a creature or hard surface. To hit a creature with an object, you must succeed at a ranged touch attack. You can use this ability a number of times per day equal to 3 + your Intelligence modifier."

[[entry]]
id = "ref/arcaneschool/evocation"
anchor = "admixture-school"
print = '''
**Associated School:** Evocation.

**Replacement Powers:** The following school powers replace the force missile and elemental wall powers of the evocation school.

**Versatile Evocation (Su):** When you cast an evocation spell that does acid, cold, electricity, or fire damage, you may change the damage dealt to one of the other four energy types. This changes the descriptor of the spell to match the new energy type. Any non-damaging effects remain unchanged unless the new energy type invalidates them (an _[ice storm](ref/spell/ice-storm)_ that deals fire damage might still provide a penalty on Perception checks due to smoke, but it would not create difficult terrain). Such effects are subject to GM discretion. You can use this ability a number of times per day equal to 3 + your Intelligence modifier.

**Elemental Manipulation (Su):** At 8th level, you can emit a 30-foot aura that transforms magical energy. Choose an energy type from acid, cold, electricity, and fire, and a second type to transform it into. Any magical source of energy of this type with a caster level equal to or less than your wizard level is altered to the chosen energy type. This includes supernatural effects from creatures with Hit Dice no greater than your caster level. For example, you could transform a [white dragon's](ref/family/dragon-white) frigid breath weapon (a supernatural ability), but not a [fire elemental's](ref/monster/fire-elemental) fiery touch (an extraordinary ability). If an effect lies only partially within your aura, only the portions within the aura are transformed. You can use this ability for a number of rounds per day equal to your wizard level. The rounds do not need to be consecutive.'''

[[entry]]
id = "ref/arcaneschool/evocation"
anchor = "generation-school"
print = '''
**Associated School:** Evocation.

**Replacement Powers:** The following school powers replace the intense spells and force missile powers of the evocation school.

**Lingering Evocations (Su):** Any evocation spell you cast with a duration greater than instantaneous lasts an additional number of rounds equal to 1/2 your wizard level (minimum +1). At 20th level, any dispel checks made against your evocation spells must be rolled twice, and your opponent must use the less favorable result.

**Wind Servant (Sp):** As a standard action, you can generate a blast of air that hurls an unattended object (or objects) or an object in your possession up to 30 feet in a straight line. If you have a free hand, you can catch an object hurled toward yourself. You can move objects weighing up to 1 pound per wizard level. Objects are not thrown with enough force to cause damage, although fragile objects like alchemical weapons shatter on contact with a creature or hard surface. To hit a creature with an object, you must succeed at a ranged touch attack. You can use this ability a number of times per day equal to 3 + your Intelligence modifier.'''

[[entry]]
id = "ref/arcaneschool/illusion"
anchor = "opening"
print = "Illusionists use magic to weave confounding images, figments, and phantoms to baffle and vex their foes."

[[entry]]
id = "ref/arcaneschool/illusion"
anchor = "extended-illusions"
print = "Any illusion spell you cast with a duration of \"concentration\" lasts a number of additional rounds equal to 1/2 your wizard level after you stop maintaining concentration (minimum +1 round). At 20th level, you can make one illusion spell with a duration of \"concentration\" become permanent. You can have no more than one illusion made permanent in this way at one time. If you designate another illusion as permanent, the previous permanent illusion ends."

[[entry]]
id = "ref/arcaneschool/illusion"
anchor = "blinding-ray"
print = "As a standard action you can fire a shimmering ray at any foe within 30 feet as a ranged touch attack. The ray causes creatures to be [blinded](ref/misc/blinded) for 1 round. Creatures with more Hit Dice than your wizard level are [dazzled](ref/misc/dazzled) for 1 round instead. You can use this ability a number of times per day equal to 3 + your Intelligence modifier."

[[entry]]
id = "ref/arcaneschool/illusion"
anchor = "invisibility-field"
print = "At 8th level, you can make yourself invisible as a swift action for a number of rounds per day equal to your wizard level. These rounds do not need to be consecutive. This otherwise functions as _[greater invisibility](ref/spell/invisibility-greater)_."

[[entry]]
id = "ref/arcaneschool/illusion"
anchor = "subtle-misdirection"
print = "As a standard action, you can touch a creature or an object that weighs no more than 25 pounds per caster level to impart an illusory ward that lasts for 1 minute. Attacks against a warded creature suffer a 20% miss chance, and the ward ends once it negates an attack. The DC of any caster level check, skill check, or saving throw to detect or determine the properties of a warded item increases by 1, plus 1 for every 5 wizard levels you have. You can use this ability a number of times per day equal to 3 + your Intelligence modifier."

[[entry]]
id = "ref/arcaneschool/illusion"
anchor = "terror"
print = "As a standard action, you can make a melee touch attack that causes a creature to be assailed by nightmares only it can see. The creature provokes an attack of opportunity from you or an ally of your choice. Creatures with more Hit Dice than your wizard level are unaffected. This is a mind-affecting fear effect. You can use this ability a number of times per day equal to 3 + your Intelligence modifier."

[[entry]]
id = "ref/arcaneschool/illusion"
anchor = "bedeviling-aura"
print = "At 8th level, you can emit a 30-foot aura that bedevils your enemies with phantasmal assailants. Enemies within this aura move at half speed, are unable to take attacks of opportunity, and are considered to be [flanked](ref/rule/flanking). This is a mind-affecting effect. You can use this ability for a number of rounds per day equal to your wizard level. These rounds do not need to be consecutive."

[[entry]]
id = "ref/arcaneschool/illusion"
anchor = "face-in-the-crowd"
print = '''
At 1st level as a standard action, you can cause yourself to appear so normal, mundane, and unexceptional that you blend in to your surroundings. All creatures within 30 feet treat you as if you belonged there, effectively ignoring you. Creatures outside of this area may notice that you appear out of place, but as soon as they approach within 30 feet they are affected by the magic and no longer think something is amiss. If you interact with an affected creature in any way, it gains a Will save (DC 10 + 1/2 your wizard level + your Intelligence modifier) to disbelieve the illusion and notice you. The effect lasts for a number of minutes equal to your wizard level, or until the illusion is dispelled. The minutes do not need to be consecutive, but must be used in 1-minute increments. This is a mind-affecting phantasm effect.

This ability does not turn you invisible and opponents are not considered [flat-footed](ref/rule/flat-footed). It does not allow you to disguise yourself as a specific individual, type of person, or member of another race, so you cannot blend into a group of uniformed guards or appear as a member of an individual's family, and a human cannot blend into a group of [gnolls](ref/monster/gnoll). You can blend in with any group made up of different types of people, such as a crowd of courtiers in a king's throne room, and you can disguise yourself (either through magic or more mundane means) to appear as a specific type of person or another race (such as a uniformed guard or a gnoll) before using this ability.'''

[[entry]]
id = "ref/arcaneschool/illusion"
anchor = "master-of-the-veil"
print = "At 8th level, you can create an illusion that hides the appearance of yourself and any number of allies within 30 feet for 1 round per wizard level. This ability otherwise functions like the spell _[veil](ref/spell/veil)_. The rounds do not need to be consecutive."

[[entry]]
id = "ref/arcaneschool/illusion"
anchor = "binding-darkness"
print = "As a standard action, you cast a weave of shadows at any foe within 30 feet as a ranged touch attack. The shadows [entangle](ref/rule/entangled) your foe for 1 round plus 1 additional round for every five wizard levels you possess. In conditions of bright light, this duration is halved (minimum 1 round). A creature entangled by your shadows has [concealment](ref/rule/concealment) from those without [darkvision](ref/rule/darkvision) or the ability to see in darkness, and other creatures likewise have concealment relative to it. You can use this ability a number of times per day equal to 3 + your Intelligence modifier."

[[entry]]
id = "ref/arcaneschool/illusion"
anchor = "shadow-step"
print = "At 8th level, you can use this ability to walk through the [Shadow Plane](ref/rule/shadow-plane) and reappear as a standard action. You can travel up to 30 feet per wizard level per day in this fashion, either in a single round or broken up across multiple shadow steps. This movement must be used in 5-foot increments and does not provoke an attack of opportunity. Travel through the Shadow Plane is imprecise; when you arrive, you re-enter 1 square off target, as per the rules for [thrown splash weapons](ref/rule/throw-splash-weapon) (see page 202 of the _Pathfinder RPG Core Rulebook_). If this would place you in an occupied square, you instead arrive in the nearest safe location. When you arrive, you are cloaked in shadow and gain concealment as the _[blur](ref/spell/blur)_ spell for 1 round. You may bring other willing creatures with you, but you must expend an equal amount of distance for each additional creature brought with you. They likewise re-enter off target (roll location for each creature) and are cloaked in shadow for 1 round."

[[entry]]
id = "ref/arcaneschool/illusion"
anchor = "deception-school"
print = '''
Some illusionists rely more on their natural talents and less on flashy figments. Focused arcane schools (_Pathfinder RPG Advanced Player's Guide_ 143) replace one or more powers granted by a wizard's arcane school.

**Associated School:** Illusion.

**Replacement Powers:** The following school powers replace the [blinding ray](ref/spell/blinding-ray) and extended illusions powers of the illusion school.

**Deceptive Flourish (Su):** You gain a +2 enhancement bonus on Bluff and Disguise skill checks. This bonus increases by 1 for every 5 wizard levels you have, up to a maximum of +6 at 20th level. At 20th level, you gain the benefits of _misdirection_ (Will DC = 20 + your Intelligence modifier) or _nondetection_ permanently. At will as a standard action, you can change which of the two spells is active, and each time you activate _misdirection_, you can choose a new creature or object as the secondary object.

**Subtle Misdirection (Sp):** As a standard action, you can touch a creature or an object that weighs no more than 25 pounds per caster level to impart an illusory ward that lasts for 1 minute. Attacks against a warded creature suffer a 20% miss chance, and the ward ends once it negates an attack. The DC of any caster level check, skill check, or saving throw to detect or determine the properties of a warded item increases by 1, plus 1 for every 5 wizard levels you have. You can use this ability a number of times per day equal to 3 + your Intelligence modifier.'''

[[entry]]
id = "ref/arcaneschool/illusion"
anchor = "phantasm-school"
print = '''
**Associated School:** Illusion.

**Replacement Powers:** The following school powers replace the blinding ray and invisibility field powers of the illusion school.

**Terror (Su):** As a standard action, you can make a melee touch attack that causes a creature to be assailed by nightmares only it can see. The creature provokes an attack of opportunity from you or an ally of your choice. Creatures with more Hit Dice than your wizard level are unaffected. This is a mind-affecting fear effect. You can use this ability a number of times per day equal to 3 + your Intelligence modifier.

**Bedeviling Aura (Su):** At 8th level, you can emit a 30-foot aura that bedevils your enemies with phantasmal assailants. Enemies within this aura move at half speed, are unable to take attacks of opportunity, and are considered to be [flanked](ref/rule/flanking). This is a mind-affecting effect. You can use this ability for a number of rounds per day equal to your wizard level. These rounds do not need to be consecutive.'''

[[entry]]
