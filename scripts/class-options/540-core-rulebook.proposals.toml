[[entry]]
id = "ref/domain/magic"
anchor = "hand-of-the-acolyte"
print = "You can cause your melee weapon to fly from your grasp and strike a foe before instantly returning. As a standard action, you can make a single attack using a melee weapon at a range of 30 feet. This attack is treated as a ranged attack with a thrown weapon, except that you add your Wisdom modifier to the attack roll instead of your Dexterity modifier (damage still relies on Strength). This ability cannot be used to perform a combat maneuver. You can use this ability a number of times per day equal to 3 + your Wisdom modifier."

[[entry]]
id = "ref/domain/magic"
anchor = "dispelling-touch"
print = "At 8th level, you can use a targeted _[dispel magic](ref/spell/dispel-magic)_ effect as a melee touch attack. You can use this ability once per day at 8th level and one additional time per day for every four cleric levels beyond 8th."

[[entry]]
