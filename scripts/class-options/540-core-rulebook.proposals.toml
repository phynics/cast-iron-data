[[entry]]
id = "ref/domain/healing"
anchor = "medicine-subdomain"
print = '''
**Example Apocrypha:** 

**(Immonhiel):** Following an internecine bout of sectarian violence thousands of years ago, Rahadoum banned all religious expression in its borders, including divine spellcasting. Most who defy this law do so in secret, including a small cult of Immonhiel's priests who recently infiltrated Azir's poorest districts. Referring to themselves as the Silent Surgeons, these faithful willingly eschew holy symbols, spellcasting, and proselytization, yet dedicate themselves to nonmagically healing any who ask. These disciples believe that through selfless dedication to others and personal hardship they can heal Rahadoum's emotional scars and convince the country to acknowledge the gods once more.

**Associated Domain:** Healing.

**Associated Deities:** Dalenydra, Immonhiel, Irori, Korada, Qi Zhong, Sarenrae.

**Replacement Power:** The following granted power replaces the rebuke death power of the Healing domain.

**Blessed Surgery (Su):** Your divine patron guides your healing hands, allowing you to perform minor miracles with mundane cures. You can use this ability as a free action when using the Heal skill in order to roll the check twice and take the higher result. When you're using this ability, any use of the Heal skill requiring 1 hour instead takes at most 1 minute. You can use this ability a number of times per day equal to 3 + your Wisdom modifier.

**Replacement Domain Spells:** 1st—_diagnose disease_, 2nd—_placebo effect_.'''

