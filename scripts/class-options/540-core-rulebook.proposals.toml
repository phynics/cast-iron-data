**Disruption (Su):** At 1st level, you gain the ability to disrupt spellcasting with a touch. As a melee touch attack, you can place a disruptive field around the target. While the field is in place, the target must make a [concentration](ref/rule/concentration) check to cast any spell or to use a [spell-like ability](ref/umr/spell-like-abilities) in addition to any other required concentration checks. The DC of this check is equal to 15 + twice the spell's level. If the check is failed, the target's spell is wasted. This field lasts for a number of rounds equal to 1/2 your wizard level (minimum 1). You can use this ability a number of times per day equal to 3 + your Intelligence modifier.

**Counterspell Mastery (Su):** At 6th level, you gain [Improved Counterspell](ref/feat/improved-counterspell) as a bonus feat. You may attempt to counterspell an opponent's spell once per day as an immediate action (instead of a readied action). You must use a spell at least one level higher than the spell being countered to use this ability. You can use this ability once per day at 6th level, plus one additional time per day for every 4 levels beyond 6th.'''

[[entry]]
id = "ref/arcaneschool/conjuration"
anchor = "opening"
print = "The conjurer focuses on the study of summoning monsters and magic alike to bend to his will."

[[entry]]
id = "ref/arcaneschool/conjuration"
anchor = "summoner-s-charm"
print = "Whenever you cast a conjuration (summoning) spell, increase the duration by a number of rounds equal to 1/2 your wizard level (minimum 1). This increase is not doubled by [Extend Spell](ref/feat/extend-spell). At 20th level, you can change the duration of all _[summon monster](ref/spell/summon-monster)_ spells to permanent. You can have no more than one _[summon monster](ref/spell/summon-monster)_ spell made permanent in this way at one time. If you designate another _[summon monster](ref/spell/summon-monster)_ spell as permanent, the previous spell immediately ends."

[[entry]]
id = "ref/arcaneschool/conjuration"
anchor = "acid-dart"
print = "As a standard action you can unleash an acid dart targeting any foe within 30 feet as a ranged touch attack. The acid dart deals 1d6 points of acid damage + 1 for every two wizard levels you possess. You can use this ability a number of times per day equal to 3 + your Intelligence modifier. This attack ignores spell resistance."

[[entry]]
id = "ref/arcaneschool/conjuration"
anchor = "dimensional-steps"
print = "At 8th level, you can use this ability to teleport up to 30 feet per wizard level per day as a standard action. This teleportation must be used in 5-foot increments and such movement does not provoke an attack of opportunity. You can bring other willing creatures with you, but you must expend an equal amount of distance for each additional creature brought with you."

[[entry]]
id = "ref/arcaneschool/conjuration"
anchor = "planar-knowledge"
print = "As an infernal binder, you gain a +3 bonus on Knowledge (planes) checks."

[[entry]]
id = "ref/arcaneschool/conjuration"
anchor = "assume-control"
print = "At 1st level, you can attempt to gain control over a summoned creature by disrupting the bond between it and the caster who summoned it. You must make a caster level check (1d20 + caster level) equal to 10 + the summoning caster's level. If you know the summoned creature's name, you receive a +2 circumstance bonus on the check. If the check is successful, you can control the summoned creature as if you had summoned it for a number of rounds equal to 1/2 your wizard level (minimum 1 round). This does not increase the duration of the original summoning. The original summoning caster can attempt to regain control of the summoned creature as a standard action by making a caster level check against your caster level + 10. When your control ends, the creature reverts to the control of its summoner. At 9th level, you can use this ability to bargain with called creatures as if you were the caster who conjured them. You can use this ability a number of times per day equal to 3 + your Intelligence modifier."

[[entry]]
id = "ref/arcaneschool/conjuration"
anchor = "imp-familiar"
print = "At 7th level, you gain [Improved Familiar](ref/feat/improved-familiar) as a bonus feat, and must take an [imp](ref/monster/devil-imp) as a familiar. The imp replaces your current familiar."

[[entry]]
id = "ref/arcaneschool/conjuration"
anchor = "create-gear"
print = "At 1st level, you can create any object that weighs no more than 1 pound per wizard level you possess. Creating an object in this way is a standard action. The item remains for 1 minute before fading away, although it disappears after one round if it leaves your possession. Creating an item to an exact specification might require a [Craft](ref/skill/craft-any) skill check, subject to GM discretion. The object must be made of simple materials, such as wood, stone, glass, or metal, and cannot contain any moving parts. You could use this ability to create a [dagger](ref/eq-weapon/dagger), but not a vial of [alchemist's fire.](ref/eq-weapon/alchemists-fire) You can use this ability a number of times per day equal to 3 + your Intelligence modifier."

[[entry]]
id = "ref/arcaneschool/conjuration"
anchor = "creator-s-will"
print = "At 8th level, you can cast _minor creation_ as a [spell-like ability](ref/umr/spell-like-abilities). You can have no more than one _[minor creation](ref/spell/minor-creation)_ active at a time. If you cast the spell again, the previous casting immediately ends. At 12th level, this ability improves to _[major creation](ref/spell/major-creation)_. You can use this ability a number of times per day equal to 1/2 your wizard level."

[[entry]]
id = "ref/arcaneschool/conjuration"
anchor = "reshape-space"
print = "Whenever you cast a spell that creates an extradimensional space or demiplane, increase the duration by a number of units (rounds, minutes, hours, etc.) equal to 1/2 your wizard level (minimum 1). At 20th level, you can make one spell that creates an extradimensional space or demiplane permanent. You can have no more than one such spell made permanent in this way at a time. If you designate another spell as permanent, the previous permanent spell ends."

[[entry]]
id = "ref/arcaneschool/conjuration"
anchor = "shift"
print = "At 1st level, you can teleport to a nearby space as a swift action as if using _[dimension door](ref/spell/dimension-door)_. This movement does not provoke an attack of opportunity. You must be able to see the space that you are moving into. You cannot take other creatures with you when you use this ability (except for familiars). You can move 5 feet for every two wizard levels you possess (minimum 5 feet). You can use this ability a number of times per day equal to 3 + your Intelligence modifier."

[[entry]]
