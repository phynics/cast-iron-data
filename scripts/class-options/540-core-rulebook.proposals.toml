[[entry]]
id = "ref/arcaneschool/conjuration"
anchor = "extradimension-school"
print = '''
Able to carry far more than they appear to, conjurers who focus on the creation of extradimensional spaces make especially good smugglers. Focused arcane schools (_Pathfinder RPG Advanced Player's Guide_ 143) replace one or more powers granted by a wizard's arcane school.

**Associated School:** Conjuration.

**Replacement Powers:** The following school power replaces the summoner's charm power of the conjuration school.

**Reshape Space (Su):** Whenever you cast a spell that creates an extradimensional space or demiplane, increase the duration by a number of units (rounds, minutes, hours, etc.) equal to 1/2 your wizard level (minimum 1). At 20th level, you can make one spell that creates an extradimensional space or demiplane permanent. You can have no more than one such spell made permanent in this way at a time. If you designate another spell as permanent, the previous permanent spell ends.'''

[[entry]]
id = "ref/arcaneschool/conjuration"
anchor = "cheliax-egorian-academy-infernal-binder-school"
print = '''
The prestigious Egorian Academy of the Magical Arts in Cheliax's capital city teaches a full spectrum of magic, both specialized and universalist, but the college is best known for its Infernal Binding program in the school of conjuration. An infernal binder learns the Names of Hell, and can use those powers to summon and bind devils to do her bidding. If she makes a single mistake in the binding, she opens herself to an eternity of torment. Egorian Academy wizards are recognized across Avistan as premier practitioners of the arcane arts. Many hold high positions in magical colleges across Golarion, but most seek to return one day to teach at their alma mater in Egorian.

**Associated School:** Conjuration.

**Suggested Opposition Schools:** Divination, illusion, or transmutation.

**Alignment:** Lawful Evil, Lawful Neutral, Neutral Evil, or Neutral.

**Requirements:** An infernal binder must choose a familiar as her arcane bond at 1st level.

**Replacement Powers:** The following school powers replace the acid dart and dimensional steps powers of the conjuration school.

**Planar Knowledge (Ex):** As an infernal binder, you gain a +3 bonus on Knowledge (planes) checks.

**Assume Control (Su):** At 1st level, you can attempt to gain control over a summoned creature by disrupting the bond between it and the caster who summoned it. You must make a caster level check (1d20 + caster level) equal to 10 + the summoning caster's level. If you know the summoned creature's name, you receive a +2 circumstance bonus on the check. If the check is successful, you can control the summoned creature as if you had summoned it for a number of rounds equal to 1/2 your wizard level (minimum 1 round). This does not increase the duration of the original summoning. The original summoning caster can attempt to regain control of the summoned creature as a standard action by making a caster level check against your caster level + 10. When your control ends, the creature reverts to the control of its summoner. At 9th level, you can use this ability to bargain with called creatures as if you were the caster who conjured them. You can use this ability a number of times per day equal to 3 + your Intelligence modifier.

**Imp Familiar (Ex):** At 7th level, you gain [Improved Familiar](ref/feat/improved-familiar) as a bonus feat, and must take an [imp](ref/monster/devil-imp) as a familiar. The imp replaces your current familiar.'''

[[entry]]
id = "ref/arcaneschool/divination"
anchor = "opening"
print = "Diviners are masters of remote viewing, prophecies, and using magic to explore the world."

[[entry]]
id = "ref/arcaneschool/divination"
anchor = "forewarned"
print = "You can always act in the surprise round even if you fail to make a Perception roll to notice a foe, but you are still considered [flat-footed](ref/rule/flat-footed) until you take an action. In addition, you receive a bonus on initiative checks equal to 1/2 your wizard level (minimum +1). At 20th level, anytime you roll initiative, assume the roll resulted in a natural 20."

[[entry]]
id = "ref/arcaneschool/divination"
anchor = "diviner-s-fortune"
print = "When you activate this school power, you can touch any creature as a standard action to give it an insight bonus on all of its attack rolls, skill checks, ability checks, and saving throws equal to 1/2 your wizard level (minimum +1) for 1 round. You can use this ability a number of times per day equal to 3 + your Intelligence modifier."

[[entry]]
id = "ref/arcaneschool/divination"
anchor = "scrying-adept"
print = "At 8th level, you are always aware when you are being observed via magic, as if you had a permanent _[detect scrying](ref/spell/detect-scrying)_. In addition, whenever you [scry](ref/spell/scrying) on a subject, treat the subject as one step more familiar to you. Very familiar subjects get a -10 penalty on their save to avoid your scrying attempts."

[[entry]]
id = "ref/arcaneschool/divination"
anchor = "prescience"
print = "At the beginning of your turn, you may, as a free action, roll a single d20. At any point before your next turn, you may use the result of this roll as the result of any d20 roll you are required to make. If you do not use the d20 result before your next turn, it is lost. You can use this ability a number of times per day equal to 3 + your Intelligence modifier."

[[entry]]
id = "ref/arcaneschool/divination"
anchor = "foretell"
print = "At 8th level, you can utter a prediction of the immediate future. While your foretelling is in effect, you emit a 30-foot aura of fortune that aids your allies or hinders your enemies, as chosen by you at the time of prediction. If you choose to aid, you and your allies gain a +2 luck bonus on ability checks, attack rolls, caster level checks, saving throws, and skill checks. If you choose to hinder, your enemies take a -2 penalty on those rolls instead. You can use this ability for a number of rounds per day equal to your wizard level. These rounds do not need to be consecutive."

[[entry]]
id = "ref/arcaneschool/divination"
anchor = "inspiring-prediction"
print = "A number of times per day equal to 3 + your Intelligence modifier, you can predict an ally's success, bolstering others' resolve. As a swift action, you can shout an inspiring prediction, granting each ally within 50 feet who can hear you a +4 luck bonus on her next attack roll, saving throw, or skill check."

[[entry]]
id = "ref/arcaneschool/divination"
anchor = "in-accordance-with-the-prophecy"
print = "A number of times per day equal to your Intelligence modifier, you can publicly declare that your next spell is guided by prophecy. When you do, the next spell you cast has a 20% chance of fizzling (1–20 on a d%). If the spell does not fail, treat the spell as if it had been modified by the [Empower Spell](ref/feat/empower-spell) feat, even if you do not have that feat. At 12th level, the chance that the spell fizzles is reduced to 15% (1–15 on a d%). At 16th level, the chance is reduced to 10% (1–10 on a d%)."

[[entry]]
