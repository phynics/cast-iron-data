print = "At 8th level, you can emit a 30-foot nimbus of light for a number of rounds per day equal to your cleric level. This acts as a _[daylight](ref/spell/daylight)_ spell. In addition, undead within this radius take an amount of damage equal to your cleric level each round that they remain inside the nimbus. Spells and [spell-like abilities](ref/umr/spell-like-abilities) with the darkness descriptor are automatically dispelled if brought inside this nimbus. These rounds do not need to be consecutive."

[[entry]]
id = "ref/domain/sun"
