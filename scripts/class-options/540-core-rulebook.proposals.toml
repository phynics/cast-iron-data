[[entry]]
id = "ref/domain/trickery"
anchor = "asmodeus"
print = '''
While the church of Asmodeus periodically endorses the use of possession for certain reasons, it is usually vehemently against unsanctioned possession and the creation of uncontrolled undead forces. Asmodeans have a particular hatred for celestials who partake in acts of possession. Such outsiders are hunted down, and the Church of Asmodeus may offer its exorcising agents' services pro bono for the chance to strike at a particularly hated celestial. The eventual consequence of such arrangements—often left unsaid—is that Asmodeans track those they have helped in this way, and often return to force those individuals to host a devil for a period of predetermined length as recompense for their prior service.

**Deceptive Reprieve (Sp):** When you touch a creature under direct mental control (such as that granted via _[dominate person](ref/spell/dominate-person)_, but not via _[charm person](ref/spell/charm-person)_) or the victim of [possession](ref/rule/possession), that creature can attempt a new Will save against the control or possession effect with a +2 bonus. If the creature succeeds, the effect or possession is temporarily halted, as per _[protection from evil](ref/spell/protection-from-evil)_, for a number of rounds equal to 1/2 your character level. While this ability is active, the target takes a -2 penalty on saves against new mind-affecting effects and new attempts at possession. You can use this ability a number of times per day equal to 3 + your Wisdom modifier.

This replaces the copycat domain power of the Trickery domain.'''

[[entry]]
id = "ref/domain/trickery"
anchor = "constable-cavalier-archetype"
print = '''
Constables keep order in the narrow streets and dark alleys of settlements.

**Class Skills:** Perception is a class skill for constables. This alters the cavalier's class skills.

**Apprehend (Ex):** A constable gains Improved Unarmed Strike as a bonus feat and can attempt a grapple combat maneuver check in place of the attack at the end of a charge. At 2nd level, the constable receives a +1 bonus on Perception checks and combat maneuver checks to disarm, grapple, or trip opponents. At 7th level and every 5 levels thereafter, this bonus improves by 1. At 4th level, the constable does not treat crowds as difficult terrain. This ability replaces mount.

**Squad Commander (Ex):** At 3rd level, a constable can spend 1 minute laying out a plan to activate the tactician ability without having it count against his number of uses per day. The ability must be triggered within 1 hour of the plan being made, and the benefits last for 1 minute per cavalier level he has. The constable can have only one plan at a time, and if a new plan is made, any old plan is lost. This ability replaces cavalier's charge.

**Quick Interrogator (Ex):** At 4th level, a constable can attempt a Diplomacy check to gather information in 1d6 × 5 minutes and attempt a Diplomacy or Intimidate check to change someone's attitude in 5 rounds. This ability replaces expert trainer.

**Badge (Ex):** At 5th level, a constable's badge becomes a powerful symbol of rules and authority. As long as he wears his badge, allies within 30 feet who can see him gain a +2 morale bonus on saving throws against charm, compulsion, and fear effects and a +1 morale bonus on attack rolls against targets the constable has challenged. At 10th level and every 5 levels thereafter, the bonuses increase by 1. This ability replaces banner.

**Instant Order (Ex):** At 11th level, a constable can bark an order to an ally within 30 feet as a standard action. That ally can instantly take a single move or standard action to comply with the order. Taking the action dazes the ally for 1 round afterward. At 20th level, the constable can use this ability as a move action, but no more than once per round. This ability replaces mighty charge and supreme charge.

**Greater Badge (Ex):** At 14th level, a constable can hold his badge aloft as a standard action to inspire his allies to be steadfast. All allies within 30 feet gain a number of temporary hit points equal to twice the constable's cavalier level for 10 minutes. A given ally can benefit from this ability only once per day. This ability replaces greater banner.'''

[[entry]]
id = "ref/domain/trickery"
anchor = "espionage-subdomain"
print = '''
**Associated Domains:** Knowledge, Trickery.

**Associated Deities:** Droskar, Erecura, Kelinahat, Norgorber.

**Replacement Power:** The following granted power replaces the lore keeper power of the Knowledge domain or the copycat power of the Trickery domain.

**Deep Cover (Su):** When you prepare your spells, you can also choose one cover identity—whether that of a real person or a fictitious one. You can assume the disguise of your cover identity in half the normal amount of time. When targeted by a spell or effect that would compromise your chosen disguise (such as _[detect evil](ref/spell/detect-evil)_, _[detect thoughts](ref/spell/detect-thoughts)_, or _[zone of truth](ref/spell/zone-of-truth)_), as an immediate action you can force the creature using the ability to attempt a Will save (DC = 10 + 1/2 your cleric level + your Wisdom modifier). If the creature fails, it gains false information in keeping with your cover identity. You can use this false information ability a number of times per day equal to 3 + your Wisdom modifier.

**Replacement Domain Spells:** 2nd—_anonymous interaction_, 4th—_zone of silence_, 8th—_mind blank_.'''

