anchor = "self-realization-subdomain"
print = '''
**Example Apocrypha (Falayna):** "Loss begets growth," say Lastwall's Steel Widows, an order of warriors dedicated to the empyreal lord Falayna. The Steel Widows believe that experiencing loss is key to becoming a true warrior. They operate a small orphanage in Vigil, teaching children that tragedy may have shaped their pasts, but it need never dictate their futures. The organization welcomes faithful of any gender, though its ranks are predominantly female.

**Associated Domains:** Liberation, Strength.

**Associated Deities:** Arshea, Falayna, Haagenti, Irori, Kurgess, Shei, Urgathoa.

**Replacement Power:** The following granted power replaces the liberation power of the Liberation domain or the strength surge ability of the Strength domain.

**Perfected Form (Su):** You maintain an unshakable sense of who you are, and no force can compel you to be anything else. You gain a +1 sacred (if your patron is good or neutral) or profane (if your patron is evil) bonus on saving throws against polymorph, petrification, and transmutation effects. This bonus increases by 1 for every 5 cleric levels you have (maximum +5). Once per day when you succeed at a saving throw against such an effect, you can gain a surge of self-confidence as an immediate action that grants you a number of [temporary hit points](ref/rule/temporary-hit-points) equal to your cleric level and a +2 morale bonus on attack rolls, skill checks, and saving throws; both effects last for 1 minute.

**Replacement Domain Spells:** 4th—_paragon surge_ (_Pathfinder RPG Advanced Race Guide_ 48; always matches your actual race), 6th—_primal scream_, 7th—_transformation_.'''

[[entry]]
