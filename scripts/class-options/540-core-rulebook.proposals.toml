**Replacement Power:** The following granted power replaces the copycat power of the Trickery domain.

**Chameleon Aspect (Su):** As a swift action, you can subtly alter the color of your scales, blending them with the surrounding environment. While under the effect of this power, you gain [concealment](ref/rule/concealment) from creatures more than 10 feet away (attacks have a 20% miss chance), and total concealment from creatures more than 40 feet away (attacks have a 50% miss chance). You can use this ability a number of rounds per day equal to 3 + your Wisdom modifier.

**Replacement Domain Spells:** 1st-alarm, 5th-illusory wall, 6th-veil. Associated Subdomain: Earth.

**Replacement Power:** The following granted power replaces the acid dart power of the Earth domain.

**Radiatin9 Touch (Su):** As a standard action that provokes attacks of opportunity, you can irradiate any unattended object for a number of rounds equal to your cleric level. While an object is irradiated, it emits a faint aura of transmutation. Any creature that passes within 5 feet of the aura must succeed at a Will save (DC equal to 10 + 1/2 your cleric level + your Wisdom modifier) or become sickened. You're immune to this object's effect. You can use this ability a number of times per day equal to 3 + your Wisdom modifier.

**Replacement Domain Spells:** 2nd-defoliate, 4th-bli9ht, 8th-horrid wiltin9. Associated Subdomain: Artifice.

**Replacement Power:** The following granted power replaces the dancing weapons power of the Artifice domain.

**Supernatural Trap (Su):** At 8th level, select a supernatural ranger trap (Patlifinder RPG Ultimate Ma9ic 64). You can use this trap a number of times per day equal to your Wisdom bonus. The DCs for Perception checks, Disable Device checks, and saving throws against the trap are equal to 10 + 1/2 your character level + your Wisdom bonus. The trap lasts for 1 hour or until triggered.

**Replacement Domain Spells:** 2nd-snare, 3rd-improve trap, 7th-teleport trap. The role s that follow illustrate s ome of the desires and personalities most common to kobolds, but kobold characters may range from ruthle s s and outward-lo oking rogues who realize the p otential of working with lesser races, to canny witches supported by draconic patrons bent on prying secrets from the hidden corners of Golarion, to noble paladins who shrug off the violent and mercile s s ways of their kin to become shining beacons of Apsu, proving that metallic dragons de s erve as much reverence and respect as their chromatic counterparts do fear.'''

