anchor = "thirst-subdomain"
print = '''
**Example Apocrypha (Lalaci):** Lalaci provides rest and shade to the weary, yet the same oases and refuges his faithful favor often attract profiteering mortals and predatory fiends that prey upon the tired. As the Water Lords of Thuvia have become increasingly cutthroat, Lalaci has attracted dozens of inquisitors who patrol these restful sanctuaries and inf lict the same parched deaths upon those who would deny hospitality to others. This retributive policy, recorded in the work _For All to Drink_, appeals to some members of Sarenrae's Cult of the Dawnf lower, but thus far this interpretation of their goddess's wrath has not spread far.

