print = '''
**Example Apocrypha (Rull):** The Hold of Belkzen echoes with battle for much of the year, but when the seasonal rains return, the orc tribes all honor the Flood Truce, hunting and trading in peace until the land dries. While most priests of Rull revel in his destructive lightning, a growing contingent of "flood prophets" envision him as an orc god of renewal. After all, his clouds shelter sensitive eyes from the sun, and his storms bring life-giving water that lures in prey and washes away filth from encampments. For the few months the rains last, most orcs respect the flood prophets' bizarre ceremonies. When war returns once more, these apostates shelter in the mountains and wait for signs that the healing storms will return.

**Associated Domain:** Weather

