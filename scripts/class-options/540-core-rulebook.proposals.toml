**Bolster (Sp):** As a standard action, you can touch an undead creature and infuse it with negative energy. It gains a +1 profane bonus on all attack rolls and saving throws, as well as 1 temporary hit point per Hit Die and a +2 bonus to its turn resistance. The bonus on attack rolls and saving throws increases by +1 for every 5 wizard levels you possess. These bonuses last for a number of rounds equal to 1/2 your wizard level (minimum 1 round). The bonuses and temporary hit points are immediately dispelled if the creature is within the area of a _[consecrate](ref/spell/consecrate)_ spell. You can use this ability a number of times per day equal to 3 + your Intelligence modifier.'''

[[entry]]
id = "ref/arcaneschool/transmutation"
anchor = "opening"
print = "Transmuters use magic to change the world around them."

[[entry]]
id = "ref/arcaneschool/transmutation"
anchor = "physical-enhancement"
print = "You gain a +1 enhancement bonus to one physical ability score (Strength, Dexterity, or Constitution). This bonus increases by +1 for every five wizard levels you possess to a maximum of +5 at 20th level. You can change this bonus to a new ability score when you prepare spells. At 20th level, this bonus applies to two physical ability scores of your choice."

[[entry]]
id = "ref/arcaneschool/transmutation"
anchor = "telekinetic-fist"
print = "As a standard action you can strike with a telekinetic fist, targeting any foe within 30 feet as a ranged touch attack. The telekinetic fist deals 1d4 points of bludgeoning damage + 1 for every two wizard levels you possess. You can use this ability a number of times per day equal to 3 + your Intelligence modifier."

[[entry]]
id = "ref/arcaneschool/transmutation"
anchor = "change-shape"
print = "At 8th level, you can change your shape for a number of rounds per day equal to your wizard level. These rounds do not need to be consecutive. This ability otherwise functions like _[beast shape II](ref/spell/beast-shape-2)_ or _[elemental body I](ref/spell/elemental-body-1)_. At 12th level, this ability functions like _[beast shape III](ref/spell/beast-shape-3)_ or _[elemental body II](ref/spell/elemental-body-2)_."

[[entry]]
id = "ref/arcaneschool/transmutation"
anchor = "augment"
print = "As a standard action, you can touch a creature and grant it either a +2 enhancement bonus to a single ability score of your choice or a +1 bonus to natural armor that stacks with any natural armor the creature might possess. At 10th level, the enhancement bonus to one ability score increases to +4. The natural armor bonus increases by +1 for every five wizard levels you possess, to a maximum of +5 at 20th level. This augmentation lasts a number of rounds equal to 1/2 your wizard level (minimum 1 round). You can use this ability a number of times per day equal to 3 + your Intelligence modifier."

[[entry]]
id = "ref/arcaneschool/transmutation"
anchor = "perfection-of-self"
print = "At 8th level, as a swift action you can grant yourself an enhancement bonus to a single ability score equal to 1/2 your wizard level (maximum +10) for one round. You may use this ability for a number of times per day equal to your wizard level."

[[entry]]
id = "ref/arcaneschool/transmutation"
anchor = "battleshaping"
print = "As a swift action, you grow a single [natural weapon](ref/umr/natural-attacks). The natural weapon lasts for 1 round and has a +1 enhancement bonus on attack and damage rolls for every four wizard levels you possess. You can grow a claw, a bite, or a gore attack. These attacks deal the normal damage for a creature of your size (see page 302 of the _Pathfinder RPG Bestiary_). At 11th level, you can shape two natural weapons. You may not grow additional limbs or a tail with this ability. You can use this ability a number of times per day equal to 3 + your Intelligence modifier."

[[entry]]
