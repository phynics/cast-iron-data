[[entry]]
id = "ref/domain/air"
anchor = "thundercloud"
print = "At 8th level, you can, as a standard action, summon a storm cloud. This power functions as _[fog cloud](ref/spell/fog-cloud)_ except that creatures inside the cloud are [deafened](ref/misc/deafened) and take 2d6 points of electricity damage each round from the flashes of thunder and lightning. Once created, you can concentrate on the cloud to move it up to 30 feet each round. You can use this ability for a number of rounds per day equal to your cleric level. These rounds do not need to be consecutive."

[[entry]]
id = "ref/domain/air"
anchor = "lightning-rod"
print = '''
As a swift action when you cast a spell with the electricity descriptor, you can designate one creature within line of sight. The spell's damage against that creature increases by 50%, as if affected by the [Empower Spell](ref/feat/empower-spell) feat. This additional damage results from divine power that is not subject to being reduced by electricity resistance, and you take an equal amount of electricity damage immediately after you cast the spell.

The spell can deal this additional damage only once, even if it could affect the target multiple times.

You can use this ability once per day at 8th level and one additional time per day for every 4 cleric levels you have beyond 8th.'''

