[[entry]]
id = "ref/domain/air"
anchor = "lightning-subdomain"
print = '''
**Example Apocrypha (Hei Feng):** The tengu of Kwanlai suffered for centuries under the yoke of Lung Wa's rule, and it was only the Feather and Starlight Rebellion that finally freed the region. Among the Hei Fengan priests who joined the uprising were numerous members of the Sunderstorm Covenant, who believed lightning was the purest of their god's weapons that must be wielded in defense of the homeland—even if doing so would destroy the wielder as well. The popularity of this group has sharply declined over the past decade, for its members zealously encourage violent responses to even the mildest perceived slights, at the cost of Kwanlai's tenuous stability.

**Associated Domain:** Air.

**Associated Deities:** Gozreh, Hei Feng, Rovagug, Rull.

**Replacement Power:** The following granted power replaces the electricity resistance power of the Air domain.

**Lightning Rod (Su):** As a swift action when you cast a spell with the electricity descriptor, you can designate one creature within line of sight. The spell's damage against that creature increases by 50%, as if affected by the [Empower Spell](ref/feat/empower-spell) feat. This additional damage results from divine power that is not subject to being reduced by electricity resistance, and you take an equal amount of electricity damage immediately after you cast the spell.

The spell can deal this additional damage only once, even if it could affect the target multiple times.

You can use this ability once per day at 8th level and one additional time per day for every 4 cleric levels you have beyond 8th.

**Replacement Domain Spells:** 1st—_shocking grasp_, 2nd—_flame blade_ (deals electricity damage and gains the electricity descriptor instead of fire), 3rd—_lightning bolt_.'''

