[[entry]]
id = "ref/domain/repose"
anchor = "deity"
print = "Pharasma."

[[entry]]
id = "ref/domain/repose"
anchor = "granted-powers"
print = "You see death not as something to be feared, but as a final rest and reward for a life well spent. The taint of undeath is a mockery of what you hold dear."

[[entry]]
id = "ref/domain/repose"
anchor = "gentle-rest"
print = "Your touch can fill a creature with lethargy, causing a living creature to become [staggered](ref/misc/staggered) for 1 round as a melee touch attack. If you touch a staggered living creature, that creature falls asleep for 1 round instead. Undead creatures touched are staggered for a number of rounds equal to your Wisdom modifier. You can use this ability a number of times per day equal to 3 + your Wisdom modifier."

[[entry]]
id = "ref/domain/repose"
anchor = "ward-against-death"
print = "At 8th level, you can emit a 30-foot aura that wards against death for a number of rounds per day equal to your cleric level. Living creatures in this area are immune to all death effects, energy drain, and effects that cause [negative levels](ref/rule/energy-drain-and-negative-levels). This ward does not remove negative levels that a creature has already gained, but the negative levels have no effect while the creature is inside the warded area. These rounds do not need to be consecutive."

[[entry]]
id = "ref/domain/repose"
anchor = "domain-spells"
print = "1st—_deathwatch_, 2nd—_gentle repose_, 3rd—_speak with dead_, 4th—_death ward_, 5th—_slay living_, 6th—_undeath to death_, 7th—_destruction_, 8th—_waves of exhaustion_, 9th—_wail of the banshee_."

[[entry]]
id = "ref/domain/repose"
anchor = "speak-with-dead"
print = "At 8th level, as a standard action, you can ask one question of a dead creature as if using _[speak with dead](ref/spell/speak-with-dead)_. The dead creature you are questioning does not gain a Will saving throw if your alignments are different. You can use this ability a number of times per day equal to your cleric level."

[[entry]]
id = "ref/domain/repose"
anchor = "spirit-touch"
print = "At 6th level, as a swift action, you can give your natural weapons or any weapons you wield the 9host touch weapon special ability. You can use this power a number of rounds per day equal to your cleric level. These rounds need not be consecutive."

[[entry]]
id = "ref/domain/repose"
anchor = "touch-the-spirit-world"
print = "With a touch, you can empower a weapon to affect incorporeal creatures. The weapon touched deals half damage to incorporeal creatures, or full damage if it is a magic weapon. This benefit lasts for a number of rounds equal to your cleric level. You can use this ability a number of times per day equal to 3 + your Wisdom modifier."

[[entry]]
id = "ref/domain/repose"
anchor = "exorcism-of-undeath"
print = '''
Once per day as a full-round action, you can try to end any possession spells or effects, or effects that directly exercise mental control over a creature, as long as the effect was caused by an undead creature. You must touch the affected creature (this requires a melee touch attack if the target is neither willing nor helpless) and use a vial of [holy water](ref/eq-weapon/holy-water) as a material component that is consumed as part of using this ability. The target must immediately attempt a new Will save against the original save DC of the controlling effect. If the save is successful, the possession effect immediately ends, as if the target had succeeded at its original saving throw. If the possessing force is a [ghost](ref/template/ghost) or similar undead, it manifests adjacent to the target and is [staggered](ref/misc/staggered) for 1 round.

This replaces the ward against death domain power of the Repose domain.'''

[[entry]]
id = "ref/domain/repose"
anchor = "ancestors-subdomain"
print = '''
**Associated Domain:** Repose.

**Replacement Power:** The following granted power replaces the ward against death power of the Repose domain.

**Speak With Dead (Su):** At 8th level, as a standard action, you can ask one question of a dead creature as if using _[speak with dead](ref/spell/speak-with-dead)_. The dead creature you are questioning does not gain a Will saving throw if your alignments are different. You can use this ability a number of times per day equal to your cleric level.

**Replacement Domain Spells:** 4th—_rest eternal_, 6th—_geas/quest_.'''

[[entry]]
id = "ref/domain/repose"
anchor = "souls-subdomain"
