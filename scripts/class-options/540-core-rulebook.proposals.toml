anchor = "agile-feet"
print = "As a free action, you can gain increased mobility for 1 round. For the next round, you ignore all [difficult terrain](ref/rule/terrain-and-obstacles) and do not take any penalties for moving through it. You can use this ability a number of times per day equal to 3 + your Wisdom modifier."

[[entry]]
id = "ref/domain/travel"
anchor = "dimensional-hop"
print = "At 8th level, you can teleport up to 10 feet per cleric level per day as a move action. This teleportation must be used in 5-foot increments and such movement does not provoke attacks of opportunity. You must have line of sight to your destination to use this ability. You can bring other willing creatures with you, but you must expend an equal amount of distance for each creature brought."

[[entry]]
id = "ref/domain/travel"
anchor = "domain-spells"
print = "1st—_longstrider_, 2nd—_locate object_, 3rd—_fly_, 4th—_dimension door_, 5th—_teleport_, 6th—_find the path_, 7th—_greater teleport_, 8th—_phase door_, 9th—_astral projection_."

[[entry]]
id = "ref/domain/travel"
anchor = "door-sight"
print = "You can lay your hand upon any surface and see what is on the other side, as if using _[clairvoyance](ref/spell/clairaudience-clairvoyance)_. Using this power takes 1 minute, during which time you must be touching the surface you want to see through. You can keep looking for as long as 10 minutes with each use of this power, but must touch the surface and take no other action the entire time. The surface cannot be thicker than 6 inches plus 1 inch per cleric level you possess. You can use this power a number of times per day equal to 3 + your Wisdom modifier."

[[entry]]
id = "ref/domain/travel"
anchor = "sacred-threshold"
print = "As a standard action, you can bless a door, a window, or another portal with a touch. For 1 minute, you can increase or decrease the DC of any check to unlock or force open the portal by an amount equal to half your cleric level. In addition, your first ally to pass through the portal during this time gains an amount of [temporary hit points](ref/rule/temporary-hit-points) equal to 1d4 + 1 for every 2 cleric levels you have. These temporary hit points last for 1 minute. You can use this ability a number of times per day equal to 3 + your Wisdom modifier."

[[entry]]
id = "ref/domain/travel"
anchor = "travel-as-one"
print = "When you cast a spell with the teleportation descriptor, treat your caster level as 3 higher for the purpose of determining how many additional creatures you can bring with you. In addition, you and any creatures you teleport gain a number of temporary hit points equal to your level that disappear after you reach your destination; these offset any damage you might take from teleportation mishaps or attempting to teleport into a solid body."

[[entry]]
