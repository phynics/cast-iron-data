[[entry]]
id = "ref/domain/strength"
anchor = "wooden-fist"
print = "This ability acts as the Plant domain power of the same name."

[[entry]]
id = "ref/domain/strength"
anchor = "bestow-resolve"
print = "At 8th level, you can bless creatures with the boldness of your deity. You can bestow a number of [temporary hit points](ref/rule/temporary-hit-points) equal to your level + your Wisdom modifier to all allies within 20 feet. The temporary hit points remain for 1 minute. You can use this ability once per day at 8th level, plus one additional time per day for every 4 levels you possess beyond 8th."

[[entry]]
id = "ref/domain/strength"
anchor = "perfected-form"
print = "You maintain an unshakable sense of who you are, and no force can compel you to be anything else. You gain a +1 sacred (if your patron is good or neutral) or profane (if your patron is evil) bonus on saving throws against polymorph, petrification, and transmutation effects. This bonus increases by 1 for every 5 cleric levels you have (maximum +5). Once per day when you succeed at a saving throw against such an effect, you can gain a surge of self-confidence as an immediate action that grants you a number of [temporary hit points](ref/rule/temporary-hit-points) equal to your cleric level and a +2 morale bonus on attack rolls, skill checks, and saving throws; both effects last for 1 minute."

[[entry]]
id = "ref/domain/strength"
anchor = "ferocity-subdomain"
print = '''
