id = "ref/domain/glory"
anchor = "witness-the-legend"
print = "At 8th level, as a move action, you can extol the virtues of yourself or an ally within 60 feet that you can see. This causes the target to shed light like a [torch](ref/eq-misc/torch) for 1 minute, and while the effect lasts, you can expend a daily use of your touch of glory domain ability as an immediate action to add 1d6 to an attack, saving throw, skill check, or ability check attempted by the target; for a roll to confirm a critical hit or save against a fear effect, you instead add 1d12. You can use this ability once per day at 8th level and one additional time per day for every 4 levels beyond 8th."

[[entry]]
id = "ref/domain/glory"
anchor = "heroism-subdomain"
print = '''
**Associated Domain:** Glory.

**Replacement Power:** The following granted power replaces the divine presence power of the Glory domain.

**Aura of Heroism (Su):** At 8th level, you can emit a 30-foot aura of [heroism](ref/spell/heroism) for a number of rounds per day equal to your cleric level. Using this ability is a swift action. Allies in the area are treated as if they were under the effects of _heroism_. These rounds do not need to be consecutive.

**Replacement Domain Spells:** 3rd—_heroism_, 6th—_heroism (greater)_.'''

[[entry]]
id = "ref/domain/glory"
anchor = "honor-subdomain"
print = '''
**Associated Domain:** Glory.

**Replacement Power:** The following granted power replaces the touch of glory power of the Glory domain.

**Honor Bound (Su):** With a touch, you can remind a creature of its duties and responsibilities, granting it a new saving throw against each enchantment (charm) or enchantment (compulsion) effect that currently affects it. If the saving throw is successful, the enchantment effect is ended. This power only affects effects that allow a save. If you fail a save against such an effect, you can use this ability as an immediate action to grant yourself an additional save. Once the target (either you or a touched creature) has made one additional save per effect, this ability has no further effect on that particular enchantment effect. You can use this ability a number of times per day equal to 3 + your Wisdom modifier.

**Replacement Domain Spells:** 2nd—_zone of truth_, 6th—_geas/quest_.'''

[[entry]]
id = "ref/domain/glory"
anchor = "hubris-subdomain"
print = '''
**Example Apocrypha (Iomedae):** As the Second Mendevian Crusade drew to a close, the crusaders found they had exhausted many of their strongest warriors, forcing them to recruit mercenaries of less noble intentions. At the same time, demons began infiltrating Mendev's ranks, spreading lies, and seeding betrayal. The Third Crusade collapsed nearly as soon as it began, crippled by witch-hunts and bloodthirsty inquisitions. The Church of Iomedae has since reprimanded the overzealous interrogators who led those pogroms, yet a small cult of apostates refuses to accept forgiveness for the faith's lapse. Calling themselves the Children of the Third Crusade, these curious acolytes self-flagellate to seek humility, yet they then lord their righteousness over their peers in shows of disquieting vanity. The crusaders suffer these fanatics' presence, acknowledging them as a living lesson of the crusade's past failures.

**Associated Domains:** Glory, Nobility.

**Associated Deities:** Dispater, General Susumu, Iomedae, Jaidz, Lissala, Olheon, Ydersius.

**Replacement Power:** You gain Intimidate as a class skill; this replaces the Glory domain's increased save DC to resist channel positive energy. The following granted power replaces the divine presence power of the Glory domain or the leadership power of the Nobility domain.

**Divine Demand (Su):** At 6th level, you can petition your divine patron for far greater power than you deserve. Activating this ability is a swift action that you must use as you cast a spell that has a reduced (but not negated) effect on a successful save. The saving throw DC of the spell increases by 2, and you gain a +2 bonus on caster level checks to overcome spell resistance with the spell. Any creature that succeeds at the saving throw instead avoids the effect entirely. If half or more of the targets are unaffected, you become [shaken](ref/misc/shaken) for a number of rounds equal to the spell's level. If all of the targets are unaffected, you instead lose the ability to cast divine spells, channel energy, and use domain powers for 1d4+1 rounds; you can end this loss as a full-round action by loudly apologizing to your patron deity as a full-round action that provokes attacks of opportunity. You can use this ability once per day at 6th level, and one additional time per day for every 4 levels beyond 6th.

**Replacement Domain Spells:** 4th—_hollow heroism_, 7th—_greater hollow heroism_, 9th—_overwhelming presence_. If you are evil, replace the domain spells _bless weapon_ and _holy aura_ with _aid_ and _unholy aura_ respectively.'''

[[entry]]
id = "ref/domain/glory"
anchor = "legend-subdomain"
print = '''
**Example Apocrypha (Gorum):** To Gorumites, even the greatest glory is fleeting; one must continually prove oneself in battle, and a warrior's fame quickly fades after her death. In the Lands of the Linnorm Kings, a controversial sect of priests have sequestered themselves from the raiding culture to chronicle the deeds of great warriors and transform these tales into a living holy text known as _The Myth in Iron_. Contrary to their blood-spattered colleagues' claims that such chronicles would breed complacency, these priests believe that such legends will inspire young raiders to match and exceed the deeds of their predecessors while honoring the fallen.

**Associated Domain:** Glory.

**Associated Deities:** General Susumu, Gorum, Shizuru.

**Replacement Power:** In campaigns that use the optional hero point system (_Pathfinder RPG Advanced Player's Guide_ 322), you gain Hero's Fortune (_Advanced Player's Guide_ 324) as a bonus feat. Otherwise, you gain Marked for Glory (_Pathfinder RPG Mythic Adventures_ 69) as a bonus feat, even if you do not meet its prerequisites. These replace the Glory domain's increased save DC when channeling positive energy. In addition, the following granted power replaces the divine presence power of the Glory domain.

**Witness the Legend (Su):** At 8th level, as a move action, you can extol the virtues of yourself or an ally within 60 feet that you can see. This causes the target to shed light like a [torch](ref/eq-misc/torch) for 1 minute, and while the effect lasts, you can expend a daily use of your touch of glory domain ability as an immediate action to add 1d6 to an attack, saving throw, skill check, or ability check attempted by the target; for a roll to confirm a critical hit or save against a fear effect, you instead add 1d12. You can use this ability once per day at 8th level and one additional time per day for every 4 levels beyond 8th.

**Replacement Domain Spells:** 2nd—_aid_, 3rd—_contagious zeal_, 4th—_righteous vigor_, 6th—_unshakable zeal_. If you are evil, replace the domain spells _holy smite_, _holy sword_, and _holy aura_ with _unholy blight_, _unholy sword_, and _unholy aura_ respectively.'''

[[entry]]
id = "ref/domain/glory"
anchor = "chivalry-subdomain"
print = '''
**Associated Domain:** Glory.

**Associated Deities:** Iomedae, Shizuru.

**Replacement Power:** The following granted power replaces the touch of glory power of the Glory domain.

**Bolstering Touch (Sp):** You can touch a willing creature as a standard action, bracing it against frightening situations and allowing it to remain calm. The first fear effect that would affect the subject within the next hour is suppressed for the first 1d4 rounds of its effect. If you touch a creature currently suffering from an ongoing fear effect, this ability instead suppresses the ongoing fear effect for 1 round. The rounds during which the subject ignores the triggering fear effect still count against the effect's duration. If the fear effect is suppressed for longer than it lasts, the subject isn't affected by the fear effect at all. You can use this ability a number of times per day equal to 3 + your Wisdom modifier.

**Replacement Domain Spells:** 1st—_remove fear_, 3rd—_heroism_, 6th—_greater heroism_.'''

