id = "ref/performance/distraction"
anchor = "distraction"
print = "At 1st level, a bard can use his performance to counter magic effects that depend on sight. Each round of the distraction, he makes a [Perform](ref/skill/perform-any) (act, comedy, dance, or oratory) skill check. Any creature within 30 feet of the bard (including the bard himself) that is affected by an illusion (pattern) or illusion (figment) magical attack may use the bard's Perform check result in place of its saving throw if, after the saving throw is rolled, the Perform skill check proves to be higher. If a creature within range of the distraction is already under the effect of a noninstantaneous illusion (pattern) or illusion (figment) magical attack, it gains another saving throw against the effect each round it sees the distraction, but it must use the bard's Perform skill check result for the save. Distraction does not work on effects that don't allow saves. Distraction relies on visual components."

[[entry]]
id = "ref/performance/fascinate"
anchor = "fascinate"
print = "At 1st level, a bard can use his performance to cause one or more creatures to become [fascinated](ref/misc/fascinated) with him. Each creature to be fascinated must be within 90 feet, able to see and hear the bard, and capable of paying attention to him. The bard must also be able to see the creatures affected. The distraction of a nearby combat or other dangers prevents this ability from working. For every three levels the bard has attained beyond 1st, he can target one additional creature with this ability. Each creature within range receives a Will save (DC 10 + 1/2 the bard's level + the bard's Cha modifier) to negate the effect. If a creature's saving throw succeeds, the bard cannot attempt to fascinate that creature again for 24 hours. If its saving throw fails, the creature sits quietly and observes the performance for as long as the bard continues to maintain it. While fascinated, a target takes a –4 penalty on all skill checks made as reactions, such as Perception checks. Any potential threat to the target allows the target to make a new saving throw against the effect. Any obvious threat, such as someone drawing a weapon, casting a spell, or aiming a weapon at the target, automatically breaks the effect. Fascinate is an enchantment (compulsion), mind-affecting ability. Fascinate relies on audible and visual components in order to function."

[[entry]]
id = "ref/performance/frightening-tune"
anchor = "frightening-tune"
print = "A bard of 14th level or higher can use his performance to cause fear in his enemies. To be affected, an enemy must be able to hear the bard perform and be within 30 feet. Each enemy within range receives a Will save (DC 10 + 1/2 the bard's level + the bard's Cha modifier) to negate the effect. If the save succeeds, the creature is immune to this ability for 24 hours. If the save fails, the target becomes [frightened](ref/misc/frightened) and flees for as long as the target can hear the bard's performance. Frightening tune relies on audible components."

[[entry]]
id = "ref/performance/inspire-competence"
anchor = "inspire-competence"
print = "A bard of 3rd level or higher can use his performance to help an ally succeed at a task. That ally must be within 30 feet and be able to hear the bard. The ally gets a +2 competence bonus on skill checks with a particular skill as long as she continues to hear the bard's performance. This bonus increases by +1 for every four levels the bard has attained beyond 3rd (+3 at 7th, +4 at 11th, +5 at 15th, and +6 at 19th). Certain uses of this ability are infeasible, such as Stealth, and may be disallowed at the GM's discretion. A bard can't inspire competence in himself. Inspire competence relies on audible components."

[[entry]]
id = "ref/performance/inspire-courage"
anchor = "inspire-courage"
print = "A 1st-level bard can use his performance to inspire courage in his allies (including himself), bolstering them against fear and improving their combat abilities. To be affected, an ally must be able to perceive the bard's performance. An affected ally receives a +1 morale bonus on saving throws against charm and fear effects and a +1 competence bonus on attack and weapon damage rolls. At 5th level, and every six bard levels thereafter, this bonus increases by +1, to a maximum of +4 at 17th level. Inspire courage is a mind-affecting ability. Inspire courage can use audible or visual components. The bard must choose which component to use when starting his performance."

[[entry]]
id = "ref/performance/inspire-greatness"
anchor = "inspire-greatness"
print = "A bard of 9th level or higher can use his performance to inspire greatness in himself or a single willing ally within 30 feet, granting extra fighting capability. For every three levels the bard attains beyond 9th, he can target an additional ally while using this performance (up to a maximum of four targets at 18th level). To inspire greatness, all of the targets must be able to see and hear the bard. A creature inspired with greatness gains 2 bonus Hit Dice (d10s), the commensurate number of [temporary hit points](ref/rule/temporary-hit-points) (apply the target's Constitution modifier, if any, to these bonus Hit Dice), a +2 competence bonus on attack rolls, and a +1 competence bonus on Fortitude saves. The bonus Hit Dice count as regular Hit Dice for determining the effect of spells that are Hit Dice dependent. Inspire greatness is a mind-affecting ability and it relies on audible and visual components."

[[entry]]
id = "ref/performance/inspire-heroics"
anchor = "inspire-heroics"
print = "A bard of 15th level or higher can inspire tremendous heroism in himself or a single ally within 30 feet. For every three bard levels the character attains beyond 15th, he can inspire heroics in an additional creature. To inspire heroics, all of the targets must be able to see and hear the bard. Inspired creatures gain a +4 morale bonus on saving throws and a +4 dodge bonus to AC. This effect lasts for as long as the targets are able to witness the performance. Inspire heroics is a mind-affecting ability that relies on audible and visual components."

[[entry]]
id = "ref/performance/mass-suggestion"
anchor = "mass-suggestion"
print = "This ability functions just like _[suggestion](ref/performance/suggestion),_ but allows a bard of 18th level or higher to make a _[suggestion](ref/spell/suggestion)_ simultaneously to any number of creatures that he has already fascinated. _Mass suggestion_ is an enchantment (compulsion), mind-affecting, language-dependent ability that relies on audible components."

[[entry]]
id = "ref/performance/soothing-performance"
anchor = "soothing-performance"
print = "A bard of 12th level or higher can use his performance to create an effect equivalent to a _[mass cure serious wounds](ref/spell/cure-serious-wounds-mass),_ using the bard's level as the caster level. In addition, this performance removes the [fatigued](ref/misc/fatigued), [sickened](ref/misc/sickened), and [shaken](ref/misc/shaken) conditions from all those affected. Using this ability requires 4 rounds of continuous performance, and the targets must be able to see and hear the bard throughout the performance. Soothing performance affects all targets that remain within 30 feet throughout the performance. Soothing performance relies on audible and visual components."

[[entry]]
id = "ref/performance/suggestion"
anchor = "suggestion"
print = "A bard of 6th level or higher can use his performance to make a _[suggestion](ref/spell/suggestion)_ (as per the spell) to a creature he has already [fascinated](ref/performance/fascinate) (see above). Using this ability does not disrupt the fascinate effect, but it does require a standard action to activate (in addition to the free action to continue the fascinate effect). A bard can use this ability more than once against an individual creature during an individual performance. Making a _suggestion_ does not count against a bard's total rounds per day of bardic performance. A Will saving throw (DC 10 + 1/2 the bard's level + the bard's Cha modifier) negates the effect. This ability affects only a single creature. _Suggestion_ is an enchantment (compulsion), mind affecting, language-dependent ability and relies on audible components."

[[entry]]
id = "ref/ragepower/animal-fury"
anchor = "animal-fury"
print = "While raging, the barbarian gains a [bite attack](ref/umr/natural-attacks). If used as part of a full attack action, the bite attack is made at the barbarian's full base attack bonus –5. If the bite hits, it deals 1d4 points of damage (assuming the barbarian is Medium; 1d3 points of damage if Small) plus half the barbarian's Strength modifier. A barbarian can make a bite attack as part of the action to maintain or break free from a grapple. This attack is resolved before the grapple check is made. If the bite attack hits, any grapple checks made by the barbarian against the target this round are at a +2 bonus."

[[entry]]
id = "ref/ragepower/clear-mind"
anchor = "clear-mind"
print = "A barbarian may reroll a Will save. This power is used as an immediate action after the first save is attempted, but before the results are revealed by the GM. The barbarian must take the second result, even if it is worse. A barbarian must be at least 8th level before selecting this power. This power can only be used once per rage."

[[entry]]
id = "ref/ragepower/fearless-rage"
anchor = "fearless-rage"
print = "While raging, the barbarian is immune to the [shaken](ref/misc/shaken) and [frightened](ref/misc/frightened) conditions. A barbarian must be at least 12th level before selecting this rage power."

[[entry]]
id = "ref/ragepower/guarded-stance"
anchor = "guarded-stance"
print = "The barbarian gains a +1 dodge bonus to her Armor Class against melee attacks for a number of rounds equal to the barbarian's current Constitution modifier (minimum 1). This bonus increases by +1 for every 6 levels the barbarian has attained. Activating this ability is a move action that does not provoke an attack of opportunity."

[[entry]]
id = "ref/ragepower/increased-damage-reduction"
anchor = "increased-damage-reduction"
print = "The barbarian's [damage reduction](ref/rule/damage-reduction) increases by 1/—. This increase is always active while the barbarian is raging. A barbarian can select this rage power up to three times. Its effects stack. A barbarian must be at least 8th level before selecting this rage power."

[[entry]]
id = "ref/ragepower/internal-fortitude"
anchor = "internal-fortitude"
print = "While raging, the barbarian is immune to the [sickened](ref/misc/sickened) and [nauseated](ref/misc/nauseated) conditions. A barbarian must be at least 8th level before selecting this rage power."

[[entry]]
id = "ref/ragepower/intimidating-glare"
anchor = "intimidating-glare"
print = "The barbarian can make an [Intimidate](ref/skill/intimidate) check against one adjacent foe as a move action. If the barbarian successfully demoralizes her opponent, the foe is [shaken](ref/misc/shaken) for 1d4 rounds + 1 round for every 5 points by which the barbarian's check exceeds the DC."

[[entry]]
id = "ref/ragepower/knockback"
anchor = "knockback"
print = "Once per round, the barbarian can make a [bull rush](ref/rule/bull-rush) attempt against one target in place of a melee attack. If successful, the target takes damage equal to the barbarian's Strength modifier and is moved back as normal. The barbarian does not need to move with the target if successful. This does not provoke an attack of opportunity."

[[entry]]
id = "ref/ragepower/low-light-vision"
anchor = "low-light-vision"
print = "The barbarian's senses sharpen and she gains low-light vision while raging."

[[entry]]
id = "ref/ragepower/mighty-swing"
anchor = "mighty-swing"
print = "The barbarian automatically confirms a critical hit. This power is used as an immediate action once a critical threat has been determined. A barbarian must be at least 12th level before selecting this power. This power can only be used once per rage."

[[entry]]
id = "ref/ragepower/moment-of-clarity"
anchor = "moment-of-clarity"
print = "The barbarian does not gain any benefits or take any of the penalties from rage for 1 round. Activating this power is a swift action. This includes the penalty to Armor Class and the restriction on what actions can be performed. This round still counts against her total number of rounds of rage per day. This power can only be used once per rage."

[[entry]]
id = "ref/ragepower/night-vision"
anchor = "night-vision"
print = "The barbarian's senses grow incredibly sharp while raging and she gains [darkvision](ref/rule/darkvision) 60 feet. A barbarian must have [low-light vision](ref/ragepower/low-light-vision) as a rage power or a [racial trait](ref/rule/low-light-vision) to select this rage power."

[[entry]]
id = "ref/ragepower/no-escape"
anchor = "no-escape"
print = "The barbarian can move up to double her base speed as an immediate action but she can only use this ability when an adjacent foe uses a [withdraw](ref/rule/withdraw) action to move away from her. She must end her movement adjacent to the enemy that used the withdraw action. The barbarian provokes attacks of opportunity as normal during this movement. This power can only be used once per rage."

[[entry]]
id = "ref/ragepower/powerful-blow"
anchor = "powerful-blow"
print = "The barbarian gains a +1 bonus on a single damage roll. This bonus increases by +1 for every 4 levels the barbarian has attained. This power is used as a swift action before the roll to hit is made. This power can only be used once per rage."

[[entry]]
id = "ref/ragepower/quick-reflexes"
anchor = "quick-reflexes"
print = "While raging, the barbarian can make one additional attack of opportunity per round."

[[entry]]
id = "ref/ragepower/raging-climber"
anchor = "raging-climber"
print = "When raging, the barbarian adds her level as an enhancement bonus on all [Climb](ref/skill/climb) skill checks."

[[entry]]
id = "ref/ragepower/raging-leaper"
anchor = "raging-leaper"
print = "When raging, the barbarian adds her level as an enhancement bonus on all [Acrobatics](ref/skill/acrobatics) skill checks made to jump. When making a jump in this way, the barbarian is always considered to have a running start."

[[entry]]
id = "ref/ragepower/raging-swimmer"
anchor = "raging-swimmer"
print = "When raging, the barbarian adds her level as an enhancement bonus on all [Swim](ref/skill/swim) skill checks."

[[entry]]
id = "ref/ragepower/renewed-vigor"
anchor = "renewed-vigor"
print = "As a standard action, the barbarian heals 1d8 points of damage + her Constitution modifier. For every four levels the barbarian has attained above 4th, this amount of damage healed increases by 1d8, to a maximum of 5d8 at 20th level. A barbarian must be at least 4th level before selecting this power. This power can be used only once per day and only while raging."

[[entry]]
id = "ref/ragepower/rolling-dodge"
anchor = "rolling-dodge"
print = "The barbarian gains a +1 dodge bonus to her Armor Class against ranged attacks for a number of rounds equal to the barbarian's current Constitution modifier (minimum 1). This bonus increases by +1 for every 6 levels the barbarian has attained. Activating this ability is a move action that does not provoke an attack of opportunity."

[[entry]]
id = "ref/ragepower/roused-anger"
anchor = "roused-anger"
print = "The barbarian may enter a rage even if [fatigued](ref/misc/fatigued). While raging after using this ability, the barbarian is immune to the fatigued condition. Once this rage ends, the barbarian is [exhausted](ref/misc/exhausted) for 10 minutes per round spent raging."

[[entry]]
id = "ref/ragepower/scent"
anchor = "scent"
print = "The barbarian gains the [scent](ref/umr/scent) ability while raging and can use this ability to locate unseen foes (see Appendix 1 for rules on the scent ability)."

[[entry]]
id = "ref/ragepower/strength-surge"
anchor = "strength-surge"
print = "The barbarian adds her barbarian level on one Strength check or combat maneuver check, or to her Combat Maneuver Defense when an opponent attempts a maneuver against her. This power is used as an immediate action. This power can only be used once per rage."

[[entry]]
id = "ref/ragepower/superstition"
anchor = "superstition"
print = "The barbarian gains a +2 morale bonus on saving throws made to resist spells, supernatural abilities, and [spell-like abilities](ref/umr/spell-like-abilities). This bonus increases by +1 for every 4 levels the barbarian has attained. While raging, the barbarian cannot be a willing target of any spell and must make saving throws to resist all spells, even those cast by allies."

[[entry]]
id = "ref/ragepower/surprise-accuracy"
anchor = "surprise-accuracy"
print = "The barbarian gains a +1 morale bonus on one attack roll. This bonus increases by +1 for every 4 levels the barbarian has attained. This power is used as a swift action before the roll to hit is made. This power can only be used once per rage."

[[entry]]
id = "ref/ragepower/swift-foot"
anchor = "swift-foot"
print = "The barbarian gains a 5-foot enhancement bonus to her base speed. This increase is always active while the barbarian is raging. A barbarian can select this rage power up to three times. Its effects stack."

[[entry]]
id = "ref/ragepower/terrifying-howl"
anchor = "terrifying-howl"
print = "The barbarian unleashes a terrifying howl as a standard action. All [shaken](ref/misc/shaken) enemies within 30 feet must make a Will save (DC equal to 10 + 1/2 the barbarian's level + the barbarian's Strength modifier) or be [panicked](ref/misc/panicked) for 1d4+1 rounds. Once an enemy has made a save versus terrifying howl (successful or not), it is immune to this power for 24 hours. A barbarian must have the [intimidating glare](ref/ragepower/intimidating-glare) rage power to select this rage power. A barbarian must be at least 8th level before selecting this power."

[[entry]]
id = "ref/ragepower/unexpected-strike"
anchor = "unexpected-strike"
print = "The barbarian can make an attack of opportunity against a foe that moves into any square threatened by the barbarian, regardless of whether or not that movement would normally provoke an attack of opportunity. This power can only be used once per rage. A barbarian must be at least 8th level before selecting this power."

[[entry]]
id = "ref/sorcbloodline/aberrant"
anchor = "opening"
print = "There is a taint in your blood, one that is alien and bizarre. You tend to think in odd ways, approaching problems from an angle that most would not expect. Over time, this taint manifests itself in your physical form."

[[entry]]
id = "ref/sorcbloodline/aberrant"
anchor = "class-skill"
print = "Knowledge (dungeoneering)."

[[entry]]
id = "ref/sorcbloodline/aberrant"
anchor = "bonus-spells"
print = "_enlarge person_ (3rd), _see invisibility_ (5th), _tongues_ (7th), _black tentacles_ (9th), _feeblemind_ (11th), _veil_ (13th), _plane shift_ (15th), _mind blank_ (17th), _shapechange_ (19th)."

[[entry]]
id = "ref/sorcbloodline/aberrant"
anchor = "bonus-feats"
print = "[Combat Casting](ref/feat/combat-casting), [Improved Disarm](ref/feat/improved-disarm), [Improved Grapple](ref/feat/improved-grapple), [Improved Initiative](ref/feat/improved-initiative), [Improved Unarmed Strike](ref/feat/improved-unarmed-strike), [Iron Will](ref/feat/iron-will), [Silent Spell](ref/feat/silent-spell), [Skill Focus](ref/feat/skill-focus) (Knowledge \\[dungeoneering\\])."

[[entry]]
id = "ref/sorcbloodline/aberrant"
anchor = "bloodline-arcana"
print = "Whenever you cast a spell of the [polymorph](ref/spelldef/polymorph) subschool, increase the duration of the spell by 50% (minimum 1 round). This bonus does not stack with the increase granted by the [Extend Spell](ref/feat/extend-spell) feat."

[[entry]]
id = "ref/sorcbloodline/aberrant"
anchor = "bloodline-powers"
print = "Aberrant sorcerers show increasing signs of their tainted heritage as they increase in level, although they are only visible when used."

[[entry]]
id = "ref/sorcbloodline/aberrant"
anchor = "acidic-ray"
print = "Starting at 1st level, you can fire an acidic ray as a standard action, targeting any foe within 30 feet as a ranged touch attack. The acidic ray deals 1d6 points of acid damage + 1 for every two sorcerer levels you possess. You can use this ability a number of times per day equal to 3 + your Charisma modifier."

[[entry]]
id = "ref/sorcbloodline/aberrant"
anchor = "long-limbs"
print = "At 3rd level, your reach increases by 5 feet whenever you are making a melee touch attack. This ability does not otherwise increase your threatened area. At 11th level, this bonus to your reach increases to 10 feet. At 17th level, this bonus to your reach increases to 15 feet."

[[entry]]
id = "ref/sorcbloodline/aberrant"
anchor = "unusual-anatomy"
print = "At 9th level, your anatomy changes, giving you a 25% chance to ignore any critical hit or sneak attack scored against you, treating it as a normal hit instead. This chance increases to 50% at 13th level."

[[entry]]
id = "ref/sorcbloodline/aberrant"
anchor = "alien-resistance"
print = "At 15th level, you gain [spell resistance](ref/rule/spell-resistance) equal to your sorcerer level + 10."

[[entry]]
id = "ref/sorcbloodline/aberrant"
anchor = "aberrant-form"
print = "At 20th level, your body becomes truly unnatural. You are immune to critical hits and sneak attacks. In addition, you gain [blindsight](ref/umr/blindsight) with a range of 60 feet and [damage reduction](ref/rule/damage-reduction) 5/—."

[[entry]]
id = "ref/sorcbloodline/aberrant"
anchor = "replacement-bloodline-arcana"
print = "Whenever you cast a spell of the polymorph subschool, one target of your choice may receive one random effect from the Warped Polymorph Benefits table (see below). This bonus lasts as long as the polymorph effect on the target."

[[entry]]
id = "ref/sorcbloodline/aberrant"
anchor = "warp-touch"
print = '''
Starting at 1st level, you create brief, disorienting changes in a creature's physical form. This ability affects one creature within 30 feet, which is [dazed](ref/misc/dazed) for 1 round (Fortitude negates; DC 10 + 1/2 your sorcerer level + your Charisma modifier). You can use this ability a number of times per day equal to 3 + your Charisma modifier. This bloodline power replaces acidic ray.

Table 1–4: Warped Polymorph Benefits d12 Effect 1 Double-Jointed: +2 on Escape Artist checks.

2 Webbed Digits: +2 on Swim checks.

3 Iron Grip: +2 on Climb checks and to CMD against [disarm](ref/rule/disarm) maneuvers.

4 Bug Eyes: +2 on Perception checks.

5 Camouflage: +2 on Stealth checks.

6 Tough Hide: +1 natural armor bonus.

7 Hardy: +1 on Fortitude saving throws.

8 Lively: +1 on Reflex saving throws.

9 Astute: +1 on Will saves.

10 Quick: +5 ft. movement rate.

11 Vicious: +1 on melee attack rolls.

12 Eagle Eyes: +1 on ranged attack rolls.'''

[[entry]]
id = "ref/sorcbloodline/aberrant"
anchor = "warped-wildblooded-mutation"
print = '''
The alien taint in your blood causes malformations and mutations in others.

**Associated Bloodline:** Aberrant.

**Bloodline Arcana:** Whenever you cast a spell of the polymorph subschool, one target of your choice may receive one random effect from the Warped Polymorph Benefits table (see below). This bonus lasts as long as the polymorph effect on the target.

**Bloodline Powers:** Your strange blood brings out the worst in people.

**Warp Touch (Sp):** Starting at 1st level, you create brief, disorienting changes in a creature's physical form. This ability affects one creature within 30 feet, which is dazed for 1 round (Fortitude negates; DC 10 + 1/2 your sorcerer level + your Charisma modifier). You can use this ability a number of times per day equal to 3 + your Charisma modifier. This bloodline power replaces acidic ray.'''

[[entry]]
id = "ref/sorcbloodline/abyssal"
anchor = "opening"
print = "Generations ago, a demon spread its filth into your heritage. While it does not manifest in all of your kin, for you it is particularly strong. You might sometimes have urges to chaos or evil, but your destiny (and alignment) is up to you."

[[entry]]
id = "ref/sorcbloodline/abyssal"
anchor = "class-skill"
print = "Knowledge (planes)."

[[entry]]
id = "ref/sorcbloodline/abyssal"
anchor = "bonus-spells"
print = "_cause fear_ (3rd), _bull's strength_ (5th), _rage_ (7th), _stoneskin_ (9th), _dismissal_ (11th), _transformation_ (13th), _greater teleport_ (15th), _unholy aura_ (17th), _summon monster IX_ (19th)."

[[entry]]
id = "ref/sorcbloodline/abyssal"
anchor = "bonus-feats"
print = "[Augment Summoning](ref/feat/augment-summoning), [Cleave](ref/feat/cleave), [Empower Spell](ref/feat/empower-spell), [Great Fortitude](ref/feat/great-fortitude), [Improved Bull Rush](ref/feat/improved-bull-rush), [Improved Sunder](ref/feat/improved-sunder), [Power Attack](ref/feat/power-attack), [Skill Focus](ref/feat/skill-focus) (Knowledge \\[planes\\])."

[[entry]]
id = "ref/sorcbloodline/abyssal"
anchor = "bloodline-arcana"
print = "Whenever you cast a spell of the [summoning](ref/spelldef/summoning) subschool, the creatures summoned gain DR/good equal to 1/2 your sorcerer level (minimum 1). This does not stack with any DR the creature might have."

[[entry]]
id = "ref/sorcbloodline/abyssal"
anchor = "bloodline-powers"
print = "While some would say that you are possessed, you know better. The demonic influence in your blood grows as you gain power."

[[entry]]
id = "ref/sorcbloodline/abyssal"
anchor = "claws"
print = "At 1st level, you can grow claws as a free action. These claws are treated as [natural weapons](ref/umr/natural-attacks), allowing you to make two claw attacks as a full attack action using your full base attack bonus. These attacks deal 1d4 points of damage each (1d3 if you are Small) plus your Strength modifier. At 5th level, these claws are considered magic weapons for the purpose of overcoming DR. At 7th level, the damage increases by one step to 1d6 points of damage (1d4 if you are Small). At 11th level, these claws become _flaming weapons_, each dealing an additional 1d6 points of fire damage on a successful hit. You can use your claws for a number of rounds per day equal to 3 + your Charisma modifier. These rounds do not need to be consecutive."

[[entry]]
id = "ref/sorcbloodline/abyssal"
anchor = "demon-resistances"
print = "At 3rd level, you gain [resist](ref/umr/resistance) electricity 5 and a +2 bonus on saving throws made against poison. At 9th level, your resistance to electricity increases to 10 and your bonus on poison saving throws increases to +4."

[[entry]]
id = "ref/sorcbloodline/abyssal"
anchor = "strength-of-the-abyss"
print = "At 9th level, you gain a +2 inherent bonus to your Strength. This bonus increases to +4 at 13th level, and to +6 at 17th level."

[[entry]]
id = "ref/sorcbloodline/abyssal"
anchor = "added-summonings"
print = "At 15th level, whenever you summon a creature with the [demon subtype](ref/subtype/demon) or the [fiendish template](ref/template/fiendish) using a _[summon monster](ref/spell/summon-monster)_ spell, you summon one additional creature of the same kind."

[[entry]]
id = "ref/sorcbloodline/abyssal"
anchor = "demonic-might"
print = "At 20th level, the power of the Abyss flows through you. You gain immunity to electricity and poison. You also gain resistance to acid 10, cold 10, and fire 10, and gain [telepathy](ref/umr/telepathy) with a range of 60 feet (allowing you to communicate with any creature that can speak a language)."

[[entry]]
id = "ref/sorcbloodline/abyssal"
anchor = "replacement-bloodline-arcana"
print = "Whenever you cast a spell that deals hit point damage, one target of your choice affected by the spell takes 2 additional hit points of damage. This ability has no effect on spells that do not deal hit point damage (such as ability score damage)."

[[entry]]
id = "ref/sorcbloodline/abyssal"
anchor = "wings-of-the-abyss"
print = '''
At 9th level, you can sprout leathery wings and fly for a number of minutes per day equal to your sorcerer level, with a speed of 60 feet and good maneuverability.

This duration does not need to be consecutive, but it must be used in 1-minute increments. This bloodline power replaces strength of the abyss.'''

[[entry]]
id = "ref/sorcbloodline/abyssal"
anchor = "brutal-wildblooded-mutation"
print = '''
The powers of the Abyss can vary radically, even for similar fiends.

**Associated Bloodline:** Abyssal.

**Bloodline Arcana:** Whenever you cast a spell that deals hit point damage, one target of your choice affected by the spell takes 2 additional hit points of damage. This ability has no effect on spells that do not deal hit point damage (such as ability score damage).

**Bloodline Powers:** Flight is often the key to survival.

**Wings of the Abyss (Su):** At 9th level, you can sprout leathery wings and fly for a number of minutes per day equal to your sorcerer level, with a speed of 60 feet and good maneuverability.

This duration does not need to be consecutive, but it must be used in 1-minute increments. This bloodline power replaces strength of the abyss.'''

[[entry]]
id = "ref/sorcbloodline/arcane"
anchor = "opening"
print = "Your family has always been skilled in the eldritch art of magic. While many of your relatives were accomplished wizards, your powers developed without the need for study and practice."

[[entry]]
id = "ref/sorcbloodline/arcane"
anchor = "class-skill"
print = "Knowledge (any one)."

[[entry]]
id = "ref/sorcbloodline/arcane"
anchor = "bonus-spells"
print = "_identify_ (3rd), _invisibility_ (5th), _dispel magic_ (7th), _dimension door_ (9th), _overland flight_ (11th), _true seeing_ (13th), _greater teleport_ (15th), _power word stun_ (17th), _wish_ (19th)."

[[entry]]
id = "ref/sorcbloodline/arcane"
anchor = "bonus-feats"
print = "[Combat Casting](ref/feat/combat-casting), [Improved Counterspell](ref/feat/improved-counterspell), [Improved Initiative](ref/feat/improved-initiative), [Iron Will](ref/feat/iron-will), [Scribe Scroll](ref/feat/scribe-scroll), [Skill Focus](ref/feat/skill-focus) (Knowledge \\[arcana\\]), [Spell Focus](ref/feat/spell-focus), [Still Spell](ref/feat/still-spell)."

[[entry]]
id = "ref/sorcbloodline/arcane"
anchor = "bloodline-arcana"
print = "Whenever you apply a metamagic feat to a spell that increases the slot used by at least one level, increase the spell's DC by +1. This bonus does not stack with itself and does not apply to spells modified by the [Heighten Spell](ref/feat/heighten-spell) feat."

[[entry]]
id = "ref/sorcbloodline/arcane"
anchor = "bloodline-powers"
print = "Magic comes naturally to you, but as you gain levels you must take care to prevent the power from overwhelming you."

[[entry]]
id = "ref/sorcbloodline/arcane"
anchor = "arcane-bond"
print = "At 1st level, you gain an arcane bond, as a [wizard](ref/class/wizard) equal to your sorcerer level. Your sorcerer levels stack with any wizard levels you possess when determining the powers of your familiar or bonded object. This ability does not allow you to have both a familiar and a bonded item. Rules for arcane bonds appear on page 78. Once per day, your bonded item allows you to cast any one of your spells known (unlike a wizard's bonded item, which allows him to cast any one spell in his spellbook)."

[[entry]]
id = "ref/sorcbloodline/arcane"
anchor = "metamagic-adept"
print = "At 3rd level, you can apply any one metamagic feat you know to a spell you are about to cast without increasing the casting time. You must still expend a higher-level spell slot to cast this spell. You can use this ability once per day at 3rd level and one additional time per day for every four sorcerer levels you possess beyond 3rd, up to five times per day at 19th level. At 20th level, this ability is replaced by arcane apotheosis."

[[entry]]
id = "ref/sorcbloodline/arcane"
anchor = "new-arcana"
print = "At 9th level, you can add any one spell from the sorcerer/wizard spell list to your list of spells known. This spell must be of a level that you are capable of casting. You can also add one additional spell at 13th level and 17th level."

[[entry]]
id = "ref/sorcbloodline/arcane"
anchor = "school-power"
print = "At 15th level, pick one school of magic. The DC for any spells you cast from that school increases by +2. This bonus stacks with the bonus granted by [Spell Focus](ref/feat/spell-focus)."

[[entry]]
id = "ref/sorcbloodline/arcane"
anchor = "arcane-apotheosis"
print = "At 20th level, your body surges with arcane power. You can add any metamagic feats that you know to your spells without increasing their casting time, although you must still expend higher-level spell slots. Whenever you use magic items that require charges, you can instead expend spell slots to power the item. For every three levels of spell slots that you expend, you consume one less charge when using a magic item that expends charges."

[[entry]]
id = "ref/sorcbloodline/arcane"
anchor = "replacement-bloodline-arcana"
print = "Unlike most sorcerers, whose innate magic is powered by force of personality, you use your intellect to understand and master your mystic powers. You use your Intelligence, rather than your Charisma, to determine all class features and effects relating to your sorcerer class, such as bonus spells per day, the maximum spell level you can cast, the save DCs of your spells, and the number of daily uses of your bloodline powers. You gain a +2 bonus on all Knowledge (arcana) and Spellcraft checks."

[[entry]]
id = "ref/sorcbloodline/arcane"
anchor = "arcane-bolt"
print = "Starting at 1st level, you can unleash a ray of magic force as a standard action, targeting any foe within 30 feet as a ranged touch attack. This ray deals 1d4 points of damage + 1 for every two sorcerer levels you possess. This damage is treated as a spell of a level equal to [half](ref/misc/fractions-and-rounding) your sorcerer level, and is a force effect. You can use this ability a number of times per day equal to 3 + your Charisma modifier. This bloodline power replaces arcane bond."

[[entry]]
id = "ref/sorcbloodline/arcane"
anchor = "sage-wildblooded-mutation"
print = '''
Scholars of the arcane are always creating new means to use magic.

**Associated Bloodline:** Arcane.

**Bloodline Arcana:** Unlike most sorcerers, whose innate magic is powered by force of personality, you use your intellect to understand and master your mystic powers. You use your Intelligence, rather than your Charisma, to determine all class features and effects relating to your sorcerer class, such as bonus spells per day, the maximum spell level you can cast, the save DCs of your spells, and the number of daily uses of your bloodline powers. You gain a +2 bonus on all Knowledge (arcana) and Spellcraft checks.

**Bloodline Powers:** Your preferred focus is a bolt of mind-spun magic.

**Arcane Bolt (Sp):** Starting at 1st level, you can unleash a ray of magic force as a standard action, targeting any foe within 30 feet as a ranged touch attack. This ray deals 1d4 points of damage + 1 for every two sorcerer levels you possess. This damage is treated as a spell of a level equal to [half](ref/misc/fractions-and-rounding) your sorcerer level, and is a force effect. You can use this ability a number of times per day equal to 3 + your Charisma modifier. This bloodline power replaces arcane bond.'''

[[entry]]
id = "ref/sorcbloodline/celestial"
anchor = "opening"
print = "Your bloodline is blessed by a celestial power, either from a celestial ancestor or through divine intervention. Although this power drives you along the path of good, your fate (and alignment) is your own to determine."

[[entry]]
id = "ref/sorcbloodline/celestial"
anchor = "class-skill"
print = "Heal."

[[entry]]
id = "ref/sorcbloodline/celestial"
anchor = "bonus-spells"
print = "_bless_ (3rd), _resist energy_ (5th), _magic circle against evil_ (7th), _remove curse_ (9th), _flame strike_ (11th), _g reater dispel magic_ (13th), _banishment_ (15th), _sunburst_ (17th), _gate_ (19th)."

[[entry]]
id = "ref/sorcbloodline/celestial"
anchor = "bonus-feats"
print = "[Dodge](ref/feat/dodge), [Extend Spell](ref/feat/extend-spell), [Iron Will](ref/feat/iron-will), [Mobility](ref/feat/mobility), [Mounted Combat](ref/feat/mounted-combat), [Ride-By Attack](ref/feat/ride-by-attack), [Skill Focus](ref/feat/skill-focus) (Knowledge \\[religion\\]), [Weapon Finesse](ref/feat/weapon-finesse)."

[[entry]]
id = "ref/sorcbloodline/celestial"
anchor = "bloodline-arcana"
print = "Whenever you cast a spell of the [summoning](ref/spelldef/summoning) subschool, the creatures summoned gain DR/evil equal to 1/2 your sorcerer level (minimum 1). This does not stack with any DR the creature might have."

[[entry]]
id = "ref/sorcbloodline/celestial"
anchor = "bloodline-powers"
print = "Your celestial heritage grants you a great many powers, but they come at a price. The lords of the higher planes are watching you and your actions closely."

[[entry]]
id = "ref/sorcbloodline/celestial"
anchor = "heavenly-fire"
print = "Starting at 1st level, you can unleash a ray of heavenly fire as a standard action, targeting any foe within 30 feet as a ranged touch attack. Against evil creatures, this ray deals 1d4 points of damage + 1 for every two sorcerer levels you possess. This damage is divine and not subject to energy resistance or immunity. This ray heals good creatures of 1d4 points of damage + 1 for every two sorcerer levels you possess. A good creature cannot benefit from your heavenly fire more than once per day. Neutral creatures are neither harmed nor healed by this effect. You can use this ability a number of times per day equal to 3 + your Charisma modifier."

[[entry]]
id = "ref/sorcbloodline/celestial"
anchor = "celestial-resistances"
print = "At 3rd level, you gain [resist](ref/umr/resistance) acid 5 and resist cold 5. At 9th level, your resistances increase to 10."

[[entry]]
id = "ref/sorcbloodline/celestial"
anchor = "wings-of-heaven"
print = "At 9th level, you can sprout feathery wings and fly for a number of minutes per day equal to your sorcerer level, with a speed of 60 feet and good maneuverability. This duration does not need to be consecutive, but it must be used in 1 minute increments."

[[entry]]
id = "ref/sorcbloodline/celestial"
anchor = "conviction"
print = "At 15th level, you can reroll any one ability check, attack roll, skill check, or saving throw you just made. You must decide to use this ability after the die is rolled, but before the results are revealed by the GM. You must take the second result, even if it is worse. You can use this ability once per day."

[[entry]]
id = "ref/sorcbloodline/celestial"
anchor = "ascension"
print = "At 20th level, you become infused with the power of the heavens. You gain immunity to acid, cold, and petrification. You also gain resist electricity 10, resist fire 10, and a +4 racial bonus on saves against poison. You also gain unlimited use of the wings of heaven ability. Finally, you gain the ability to speak with any creature that has a language (as per the _[tongues](ref/spell/tongues)_ spell)."

[[entry]]
id = "ref/sorcbloodline/celestial"
anchor = "replacement-bloodline-arcana"
print = "Unlike most sorcerers whose innate magic is powered by force of personality, you use pure willpower to master and fuel your magic. You use your Wisdom, rather than your Charisma, to determine all class features and effects relating to your sorcerer class, such as bonus spells per day, maximum spell level you can cast, and the save DCs of your spells. You gain a +2 bonus on all Heal and Knowledge (religion) checks."

[[entry]]
id = "ref/sorcbloodline/celestial"
anchor = "sacred-cistern"
print = "At 9th level, your bloodline makes you a natural receptacle of divine energy. You can [channel energy](ref/ability/channel-energy) once per day as a cleric of your sorcerer level - 4. This bloodline power replaces wings of heaven."

[[entry]]
id = "ref/sorcbloodline/celestial"
anchor = "empyreal-wildblooded-mutation"
print = '''
Your heavenly power derives from insight rather than force of personality.

**Associated Bloodline:** Celestial.

**Bloodline Arcana:** Unlike most sorcerers whose innate magic is powered by force of personality, you use pure willpower to master and fuel your magic. You use your Wisdom, rather than your Charisma, to determine all class features and effects relating to your sorcerer class, such as bonus spells per day, maximum spell level you can cast, and the save DCs of your spells. You gain a +2 bonus on all Heal and Knowledge (religion) checks.

**Bloodline Powers:** Your quasi-divine nature gives you strange powers.

**Sacred Cistern (Su):** At 9th level, your bloodline makes you a natural receptacle of divine energy. You can [channel energy](ref/ability/channel-energy) once per day as a cleric of your sorcerer level - 4. This bloodline power replaces wings of heaven.'''

[[entry]]
id = "ref/sorcbloodline/destined"
anchor = "opening"
print = "Your family is destined for greatness in some way. Your birth could have been foretold in prophecy, or perhaps it occurred during an especially auspicious event, such as a solar eclipse. Regardless of your bloodline's origin, you have a great future ahead."

[[entry]]
id = "ref/sorcbloodline/destined"
anchor = "class-skill"
print = "Knowledge (history)."

[[entry]]
id = "ref/sorcbloodline/destined"
anchor = "bonus-spells"
print = "_alarm_ (3rd), _blur_ (5th), _protection from energy_ (7th), _freedom of movement_ (9th), _break enchantment_ (11th), _mislead_ (13th), _spell turning_ (15th), _moment of prescience_ (17th), _foresight_ (19th)."

[[entry]]
id = "ref/sorcbloodline/destined"
anchor = "bonus-feats"
print = "[Arcane Strike](ref/feat/arcane-strike), [Diehard](ref/feat/diehard), [Endurance](ref/feat/endurance), [Leadership](ref/feat/leadership), [Lightning Reflexes](ref/feat/lightning-reflexes), [Maximize Spell](ref/feat/maximize-spell), [Skill Focus](ref/feat/skill-focus) (Knowledge \\[history\\]), [Weapon Focus](ref/feat/weapon-focus)."

[[entry]]
id = "ref/sorcbloodline/destined"
anchor = "bloodline-arcana"
print = "Whenever you cast a spell with a range of \"personal,\" you gain a luck bonus equal to the spell's level on all your saving throws for 1 round."

[[entry]]
id = "ref/sorcbloodline/destined"
anchor = "bloodline-powers"
print = "You are destined for great things, and the powers that you gain serve to protect you."

[[entry]]
id = "ref/sorcbloodline/destined"
anchor = "touch-of-destiny"
print = "At 1st level, you can touch a creature as a standard action, giving it an insight bonus on attack rolls, skill checks, ability checks, and saving throws equal to 1/2 your sorcerer level (minimum 1) for 1 round. You can use this ability a number of times per day equal to 3 + your Charisma modifier."

[[entry]]
id = "ref/sorcbloodline/destined"
anchor = "fated"
print = "Starting at 3rd level, you gain a +1 luck bonus on all of your saving throws and to your AC during surprise rounds (see Chapter 8) and when you are otherwise unaware of an attack. At 7th level and every four levels thereafter, this bonus increases by +1, to a maximum of +5 at 19th level."

[[entry]]
id = "ref/sorcbloodline/destined"
anchor = "it-was-meant-to-be"
print = "At 9th level, you may reroll any one attack roll, critical hit confirmation roll, or level check made to overcome [spell resistance](ref/rule/spell-resistance). You must decide to use this ability after the first roll is made but before the results are revealed by the GM. You must take the second result, even if it is worse. At 9th level, you can use this ability once per day. At 17th level, you can use this ability twice per day."

[[entry]]
id = "ref/sorcbloodline/destined"
anchor = "within-reach"
print = "At 15th level, your ultimate destiny is drawing near. Once per day, when an attack or spell that causes damage would result in your death, you may attempt a DC 20 Will save. If successful, you are instead reduced to -1 hit points and are automatically [stabilized](ref/misc/stable). The bonus from your fated ability applies to this save."

[[entry]]
id = "ref/sorcbloodline/destined"
anchor = "destiny-realized"
print = "At 20th level, your moment of destiny is at hand. Any critical threats made against you only confirm if the second roll results in a natural 20 on the die. Any critical threats you score with a spell are automatically confirmed. Once per day, you can automatically succeed at one caster level check made to overcome [spell resistance](ref/rule/spell-resistance). You must use this ability before making the roll."

[[entry]]
id = "ref/sorcbloodline/destined"
anchor = "replacement-bloodline-arcana"
print = "If you are casting defensively because a creature is threatening you and you fail your concentration check, one of the creatures that is threatening you provokes an attack of opportunity from you or from one ally who is adjacent to the enemy. You decide which creature provokes this attack and which of its adjacent opponents may make the attack."

[[entry]]
id = "ref/sorcbloodline/destined"
anchor = "fate-s-retribution"
print = "Starting at 1st level, when you are hit by a melee attack, as an immediate action, you can curse the creature that struck you. The target takes a -2 penalty on all attack and damage rolls for 1d4 rounds. A Will save (DC 10 + 1/2 your sorcerer level + your Charisma modifier) negates this effect. You can use this ability a number of times per day equal to 3 + your Charisma modifier. This bloodline power replaces touch of destiny."

[[entry]]
id = "ref/sorcbloodline/destined"
anchor = "karmic-wildblooded-mutation"
print = '''
The universe punishes those who interfere with destiny.

**Associated Bloodline:** Destined.

**Bloodline Arcana:** If you are casting defensively because a creature is threatening you and you fail your concentration check, one of the creatures that is threatening you provokes an attack of opportunity from you or from one ally who is adjacent to the enemy. You decide which creature provokes this attack and which of its adjacent opponents may make the attack.

**Bloodline Powers:** Your blood responds angrily when you are attacked.

**Fate's Retribution (Su):** Starting at 1st level, when you are hit by a melee attack, as an immediate action, you can curse the creature that struck you. The target takes a -2 penalty on all attack and damage rolls for 1d4 rounds. A Will save (DC 10 + 1/2 your sorcerer level + your Charisma modifier) negates this effect. You can use this ability a number of times per day equal to 3 + your Charisma modifier. This bloodline power replaces touch of destiny.'''

[[entry]]
id = "ref/sorcbloodline/draconic"
anchor = "opening"
print = "At some point in your family's history, a dragon interbred with your bloodline, and now its ancient power flows through your veins."

[[entry]]
id = "ref/sorcbloodline/draconic"
anchor = "class-skill"
print = "Perception."

[[entry]]
id = "ref/sorcbloodline/draconic"
anchor = "bonus-spells"
print = "_mage armor_ (3rd), _resist energy_ (5th), _fly_ (7th), _fear_ (9th), _spell resistance_ (11th), _form of the dragon I_ (13th), _form of the dragon II_ (15th), _form of the dragon III_ (17th), _wish_ (19th)."

[[entry]]
id = "ref/sorcbloodline/draconic"
anchor = "bonus-feats"
print = "[Blind-Fight](ref/feat/blind-fight), [Great Fortitude](ref/feat/great-fortitude), [Improved Initiative](ref/feat/improved-initiative), [Power Attack](ref/feat/power-attack), [Quicken Spell](ref/feat/quicken-spell), [Skill Focus](ref/feat/skill-focus) (Fly), [Skill Focus](ref/feat/skill-focus) (Knowledge \\[arcana\\]), [Toughness](ref/feat/toughness)."

[[entry]]
id = "ref/sorcbloodline/draconic"
anchor = "bloodline-arcana"
print = "Whenever you cast a spell with an energy descriptor that matches your draconic bloodline's energy type, that spell deals +1 point of damage per die rolled."

[[entry]]
id = "ref/sorcbloodline/draconic"
anchor = "bloodline-powers"
print = '''
The power of dragons flows through you and manifests in a number of ways. At 1st level, you must select one of the chromatic or metallic dragon types (see the _Pathfinder RPG Bestiary_). This choice cannot be changed. A number of your abilities grant resistances and deal damage based on your dragon type, as noted on the following table.

Dragon Type Energy Type Breath Shape [Black](ref/family/dragon-black) Acid 60-foot line [Blue](ref/family/dragon-blue) Electricity 60-foot line [Green](ref/family/dragon-green) Acid 30-foot cone [Red](ref/family/dragon-red) Fire 30-foot cone [White](ref/family/dragon-white) Cold 30-foot cone [Brass](ref/family/dragon-brass) Fire 60-foot line [Bronze](ref/family/dragon-bronze) Electricity 60-foot line [Copper](ref/family/dragon-copper) Acid 60-foot line [Gold](ref/family/dragon-gold) Fire 30-foot cone [Silver](ref/family/dragon-silver) Cold 30-foot cone'''

[[entry]]
id = "ref/sorcbloodline/draconic"
anchor = "claws"
print = "Starting at 1st level, you can grow claws as a free action. These claws are treated as [natural weapons](ref/umr/natural-attacks), allowing you to make two claw attacks as a full attack action using your full base attack bonus. Each of these attacks deals 1d4 points of damage plus your Strength modifier (1d3 if you are Small). At 5th level, these claws are considered magic weapons for the purpose of overcoming DR. At 7th level, the damage [increases by one step](ref/misc/damage-die-adjustments) to 1d6 points of damage (1d4 if you are Small). At 11th level, these claws deal an additional 1d6 points of damage of your energy type on a successful hit. You can use your claws for a number of rounds per day equal to 3 + your Charisma modifier. These rounds do not need to be consecutive."

[[entry]]
id = "ref/sorcbloodline/draconic"
anchor = "dragon-resistances"
print = "At 3rd level, you gain [resist](ref/umr/resistance) 5 against your energy type and a +1 natural armor bonus. At 9th level, your energy resistance increases to 10 and natural armor bonus increases to +2. At 15th level, your natural armor bonus increases to +4."

[[entry]]
id = "ref/sorcbloodline/draconic"
anchor = "breath-weapon"
print = "At 9th level, you gain a breath weapon. This breath weapon deals 1d6 points of damage of your energy type per sorcerer level. Those caught in the area of the breath receive a Reflex save for half damage. The DC of this save is equal to 10 + 1/2 your sorcerer level + your Charisma modifier. The shape of the breath weapon depends on your dragon type (as indicated on the above chart). At 9th level, you can use this ability once per day. At 17th level, you can use this ability twice per day. At 20th level, you can use this ability three times per day."

[[entry]]
id = "ref/sorcbloodline/draconic"
anchor = "wings"
print = "At 15th level, leathery dragon wings grow from your back as a standard action, giving you a fly speed of 60 feet with average maneuverability. You can dismiss the wings as a free action."

[[entry]]
id = "ref/sorcbloodline/draconic"
anchor = "power-of-wyrms"
print = "At 20th level, your draconic heritage becomes manifest. You gain immunity to paralysis, sleep, and damage of your energy type. You also gain [blindsense](ref/rule/blindsight-and-blindsense) 60 feet."

[[entry]]
id = "ref/sorcbloodline/draconic"
anchor = "variant-bloodline-arcana"
print = "When selecting spells known, you can choose spells from the psychic class spell list (_Pathfinder RPG Occult Adventures_ 69). The psychic spells you select must normally be unavailable to your class. You can know only a number of psychic spells equal to the highest level spell you can cast from your class spell list, based on your current class level. When you're casting these spells, they function as [psychic magic](ref/rule/psychic-magic) instead of arcane. You use thought and emotion components (_Occult Adventures_ 144) instead of verbal and somatic components when casting these spells. Dragon Type Energy Type Breath Shape [Astral](ref/monster/dragon-esoteric-astral-adult-astral-dragon) Bludgeoning 60-foot line [Dream](ref/monster/dragon-esoteric-dream-adult-dream-dragon) Electricity 30-foot cone [Etheric](ref/monster/dragon-esoteric-etheric-adult-etheric-dragon) Bludgeoning 60-foot line [Nightmare](ref/monster/dragon-esoteric-nightmare-adult-nightmare-dragon) Acid 30-foot cone [Occult](ref/monster/dragon-esoteric-occult-adult-occult-dragon) Cold or fire 30-foot cone \\* Choose one when the bloodline is first selected."

[[entry]]
id = "ref/sorcbloodline/draconic"
anchor = "variant-bloodline-arcana"
print = "Whenever you cast a spell that affects a creature with the shaken, frightened, or panicked condition, increase the spell's save DC by 1. Dragon Type Energy Type Breath Shape [Forest](ref/family/dragon-imperial-forest) Piercing 30-foot cone [Sea](ref/family/dragon-imperial-sea) Fire 30-foot cone [Sky](ref/family/dragon-imperial-sky) Electricity 30-foot cone [Sovereign](ref/family/dragon-imperial-sovereign) Bludgeoning 30-foot cone [Underworld](ref/family/dragon-imperial-underworld) Fire 60-foot line"

[[entry]]
id = "ref/sorcbloodline/draconic"
anchor = "variant-bloodline-arcana"
print = "Whenever you cast a spell with an energy descriptor that matches your draconic bloodline's energy type, if a creature is damaged by the spell, that creature cannot take a 5-foot step for 1 round. This effect occurs only when you're using spells that require an attack roll (such as _[chill touch](ref/spell/chill-touch)_ or _[scorching ray](ref/spell/scorching-ray)_) or spells that allow a save (such as _[fireball](ref/spell/fireball)_ or _[lightning bolt](ref/spell/lightning-bolt)_). A successful save against the damage or effects of the spell also negates this additional effect. Dragon Type Energy Type Breath Shape [Lunar](ref/family/dragon-outer-lunar) Cold 60-foot line [Solar](ref/family/dragon-outer-solar) Fire 60-foot line [Time](ref/family/dragon-outer-time) Electricity 30-foot cone [Void](ref/family/dragon-outer-void) Cold 30-foot cone [Vortex](ref/family/dragon-outer-vortex) Fire 30-foot cone"

[[entry]]
id = "ref/sorcbloodline/draconic"
anchor = "variant-bloodline-arcana"
print = "Whenever you cast a spell with an energy descriptor that matches your draconic bloodline's energy type, you can reroll a number of damage dice equal to half the spell's level. Dragon Type Energy Type Breath Shape [Brine](ref/family/dragon-primal-brine) Acid 60-foot line [Cloud](ref/family/dragon-primal-cloud) Electricity 30-foot cone [Crystal](ref/family/dragon-primal-crystal) Piercing 30-foot cone [Magma](ref/family/dragon-primal-magma) Fire 30-foot cone [Umbral](ref/family/dragon-primal-umbral) Cold 30-foot cone"

[[entry]]
id = "ref/sorcbloodline/draconic"
anchor = "replacement-bloodline-arcana"
print = "Whenever you cast a spell with an energy descriptor that matches your linnorm bloodline's energy type, you gain a natural armor bonus equal to the spell's level for 1d4 rounds."

[[entry]]
id = "ref/sorcbloodline/draconic"
anchor = "elemental-spit"
print = "Starting at 1st level, you can fire an elemental ray that matches your linnorm bloodline's energy type as a standard action, targeting any foe within 30 feet as a ranged touch attack. The ray deals 1d6 points of damage + 1 for every two sorcerer levels you possess. You can use this ability a number of times per day equal to 3 + your Charisma modifier. This bloodline power replaces claws."

[[entry]]
id = "ref/sorcbloodline/draconic"
anchor = "esoteric-dragons"
print = "Though many of the enigmatic esoteric dragons remain aloof or intentionally distant from mortal affairs, occult dragons are the most likely to imprint their bloodline onto humanoids. Often such draconic blood is the result of ongoing experimentation. Scions of other esoteric dragons are far more unusual; such bloodlines usually result from explorers traveling the realms where these distant dragons dwell and being exposed to some spectacular and ill-understood power.\n\n**Variant Bloodline Arcana:** When selecting spells known, you can choose spells from the psychic class spell list (_Pathfinder RPG Occult Adventures_ 69). The psychic spells you select must normally be unavailable to your class. You can know only a number of psychic spells equal to the highest level spell you can cast from your class spell list, based on your current class level. When you're casting these spells, they function as psychic magic instead of arcane. You use thought and emotion components (_Occult Adventures_ 144) instead of verbal and somatic components when casting these spells. Dragon Type Energy Type Breath Shape Astral Bludgeoning 60-foot line Dream Electricity 30-foot cone Etheric Bludgeoning 60-foot line Nightmare Acid 30-foot cone Occult Cold or fire 30-foot cone \\* Choose one when the bloodline is first selected."

[[entry]]
id = "ref/sorcbloodline/draconic"
anchor = "imperial-dragons"
print = '''
The blood of imperial dragons is well known throughout the lands of Tian Xia, where such dragons form a strong part of much of the continent's mythology. This is particularly true in Xa Hoi, where imperial dragons rule. Imperial dragons in other lands may vary in their interactions with humanoids, but universally accept the praise (and fear) of those around them. Their connection to the land makes the blood of these dragons a powerful arcane catalyst in the making of heroes.

**Variant Bloodline Arcana:** Whenever you cast a spell that affects a creature with the shaken, frightened, or panicked condition, increase the spell's save DC by 1. Dragon Type Energy Type Breath Shape Forest Piercing 30-foot cone Sea Fire 30-foot cone Sky Electricity 30-foot cone Sovereign Bludgeoning 30-foot cone Underworld Fire 60-foot line'''

[[entry]]
id = "ref/sorcbloodline/draconic"
anchor = "outer-dragons"
print = '''
The interests of outer dragons take them across the cosmos. Strange devices or experimentation are most likely to lead to the addition of outer dragon blood into a world's ecosystem. The hidden blood of an outer dragon in a family's lineage is difficult to detect or stamp out. On Golarion, these dragons most commonly find themselves drawn to the fabled land of Numeria and its alien technology, though they usually refuse to share any of their insights with that nation's residents.

**Variant Bloodline Arcana:** Whenever you cast a spell with an energy descriptor that matches your draconic bloodline's energy type, if a creature is damaged by the spell, that creature cannot take a 5-foot step for 1 round. This effect occurs only when you're using spells that require an attack roll (such as _chill touch_ or _scorching ray_) or spells that allow a save (such as _fireball_ or _lightning bolt_). A successful save against the damage or effects of the spell also negates this additional effect. Dragon Type Energy Type Breath Shape Lunar Cold 60-foot line Solar Fire 60-foot line Time Electricity 30-foot cone Void Cold 30-foot cone Vortex Fire 30-foot cone'''

[[entry]]
id = "ref/sorcbloodline/draconic"
anchor = "primal-dragons"
print = '''
Born from the elemental planes or the Shadow Plane, primal dragons are infused with primeval power. These dragons traveled to the Material Plane in ages past, and many of their kind continue to spread their blood and magical influence among the humanoid races of the world. Even the malign umbral dragons prosper in the caverns of the Darklands and the mountains of Nidal. Any exposure to or experimentation with primal magics may introduce primal dragon blood into a lineage.

**Variant Bloodline Arcana:** Whenever you cast a spell with an energy descriptor that matches your draconic bloodline's energy type, you can reroll a number of damage dice equal to half the spell's level. Dragon Type Energy Type Breath Shape [Brine](ref/family/dragon-primal-brine) Acid 60-foot line [Cloud](ref/family/dragon-primal-cloud) Electricity 30-foot cone [Crystal](ref/family/dragon-primal-crystal) Piercing 30-foot cone [Magma](ref/family/dragon-primal-magma) Fire 30-foot cone [Umbral](ref/family/dragon-primal-umbral) Cold 30-foot cone'''

[[entry]]
id = "ref/sorcbloodline/draconic"
anchor = "linnorm-wildblooded-mutation"
print = '''
Your draconic heritage stems from a mighty, primordial linnorm rather than from the more common, somewhat civilized dragons.

**Associated Bloodline:** Draconic.

**Bloodline Arcana:** Whenever you cast a spell with an energy descriptor that matches your linnorm bloodline's energy type, you gain a natural armor bonus equal to the spell's level for 1d4 rounds.

**Bloodline Powers:** True dragons blast their foes with rays of energy.

**Elemental Spit (Su):** Starting at 1st level, you can fire an elemental ray that matches your linnorm bloodline's energy type as a standard action, targeting any foe within 30 feet as a ranged touch attack. The ray deals 1d6 points of damage + 1 for every two sorcerer levels you possess. You can use this ability a number of times per day equal to 3 + your Charisma modifier. This bloodline power replaces claws.'''

[[entry]]
id = "ref/sorcbloodline/elemental"
anchor = "opening"
print = "The power of the elements resides in you, and at times you can hardly control its fury. This influence comes from an elemental outsider in your family history or a time when you or your relatives were exposed to a powerful elemental force."

[[entry]]
id = "ref/sorcbloodline/elemental"
anchor = "class-skill"
print = "Knowledge (planes)."

[[entry]]
id = "ref/sorcbloodline/elemental"
anchor = "bonus-spells"
print = "_burning hands_ (3rd), _scorching ray_ (5th), _protection from energy_ (7th), _elemental body I_ (9th), _elemental body II_ (11th), _elemental body III_ (13th), _elemental body IV_ (15th), _summon monster VIII_ (elementals only) (17th), _elemental swarm_ (19th).\n\n\\*These spells always deal a type of damage determined by your element. In addition, the subtype of these spells changes to match the energy type of your element."

[[entry]]
id = "ref/sorcbloodline/elemental"
anchor = "bonus-feats"
print = "[Dodge](ref/feat/dodge), [Empower Spell](ref/feat/empower-spell), [Great Fortitude](ref/feat/great-fortitude), [Improved Initiative](ref/feat/improved-initiative), [Lightning Reflexes](ref/feat/lightning-reflexes), [Power Attack](ref/feat/power-attack), [Skill Focus](ref/feat/skill-focus) (Knowledge \\[planes\\]), [Weapon Finesse](ref/feat/weapon-finesse)."

[[entry]]
id = "ref/sorcbloodline/elemental"
anchor = "bloodline-arcana"
print = "Whenever you cast a spell that deals energy damage, you can change the type of damage to match the type of your bloodline. This also changes the spell's type to match the type of your bloodline."

[[entry]]
id = "ref/sorcbloodline/elemental"
anchor = "bloodline-powers"
print = '''
One of the four elements infuses your being, and you can draw upon its power in times of need. At first level, you must select one of the four elements: air, earth, fire, or water. This choice cannot be changed. A number of your abilities grant resistances and deal damage based on your element, as noted below.

Element Energy Type Elemental Movement Air Electricity Fly 60 feet (average) Earth Acid Burrow 30 feet Fire Fire +30 feet base speed Water Cold Swim 60 feet'''

[[entry]]
id = "ref/sorcbloodline/elemental"
anchor = "elemental-ray"
print = "Starting at 1st level, you can unleash an elemental ray as a standard action, targeting any foe within 30 feet as a ranged touch attack. This ray deals 1d6 points of damage of your energy type + 1 for every two sorcerer levels you possess. You can use this ability a number of times per day equal to 3 + your Charisma modifier."

[[entry]]
id = "ref/sorcbloodline/elemental"
anchor = "elemental-resistance"
print = "At 3rd level, you gain energy [resistance](ref/umr/resistance) 10 against your energy type. At 9th level, your energy resistance increases to 20."

[[entry]]
id = "ref/sorcbloodline/elemental"
anchor = "elemental-blast"
print = "At 9th level, you can unleash a blast of elemental power once per day. This 20-foot-radius [burst](ref/misc/burst) does 1d6 points of damage of your energy type per sorcerer level. Those caught in the area of your blast receive a Reflex save for half damage. Creatures that fail their saves gain vulnerability to your energy type until the end of your next turn. The DC of this save is equal to 10 + 1/2 your sorcerer level + your Charisma modifier. At 9th level, you can use this ability once per day. At 17th level, you can use this ability twice per day. At 20th level, you can use this ability three times per day. This power has a range of 60 feet."

[[entry]]
id = "ref/sorcbloodline/elemental"
anchor = "elemental-movement"
print = "At 15th level, you gain a special movement type or bonus. This ability is based on your chosen element, as indicated on the above chart."

[[entry]]
id = "ref/sorcbloodline/elemental"
anchor = "elemental-body"
print = "At 20th level, elemental power surges through your body. You gain immunity to sneak attacks, critical hits, and damage from your energy type."

[[entry]]
id = "ref/sorcbloodline/elemental"
anchor = "replacement-bloodline-arcana"
print = "Whenever you cast a spell with an energy descriptor that matches your elemental bloodline's energy type, that spell deals +1 point of damage per die rolled."

[[entry]]
id = "ref/sorcbloodline/elemental"
anchor = "elementalist-summoning"
print = "At 9th level, whenever you summon a creature, it gains energy [resistance](ref/umr/resistance) 10 against the energy type that matches your elemental bloodline (if it already has such resistance, its resistance increases by +5), and its natural attacks deal an additional 1d6 points of damage of the same energy type. This bloodline power replaces elemental blast."

[[entry]]
id = "ref/sorcbloodline/elemental"
anchor = "replacement-bloodline-arcana"
print = "Whenever you cast a spell with an energy descriptor that matches your elemental bloodline's energy type, that spell deals +1 point of damage per die rolled."

[[entry]]
id = "ref/sorcbloodline/elemental"
anchor = "lifewater-stream"
print = "At 9th level, once per day, you can unleash a surge of restorative elemental water that aids your allies. This ability affects creatures in a 30-foot line extending from your palm, and you can select one of the following conditions to remove from the affected creatures: fatigued, shaken, or sickened. Creatures affected by a more extreme version of the chosen condition (such as exhausted for fatigued, frightened for shaken, and nauseated for sickened) have their condition reduced to the less extreme version. At 17th level, you can use this ability twice per day, and you can choose from the following additional conditions: blinded, deafened, dazed, and staggered. At 20th level, you can use this ability three times per day. This bloodline power replaces elemental blast."

[[entry]]
id = "ref/sorcbloodline/elemental"
anchor = "primal-wildblooded-mutation"
print = '''
Your powers are attuned to the concentrated core of the elemental plane.

**Associated Bloodline:** Elemental.

**Bloodline Arcana:** Whenever you cast a spell with an energy descriptor that matches your elemental bloodline's energy type, that spell deals +1 point of damage per die rolled.

**Bloodline Powers:** You can infuse raw energy into your summoned minions.

**Elementalist Summoning (Su):** At 9th level, whenever you summon a creature, it gains energy [resistance](ref/umr/resistance) 10 against the energy type that matches your elemental bloodline (if it already has such resistance, its resistance increases by +5), and its natural attacks deal an additional 1d6 points of damage of the same energy type. This bloodline power replaces elemental blast.'''

[[entry]]
id = "ref/sorcbloodline/elemental"
anchor = "mutated-bloodlines"
print = '''
The following sorcerer bloodlines are designed for the wildblooded sorcerer archetype detailed in _Pathfinder RPG Ultimate Magic_. These replace the bloodline arcana and bloodline powers of their associated bloodlines at the indicated levels. Your soul is infused with the restorative and life-giving powers of elemental water.

**Associated Bloodline:** Elemental (water).

**Bloodline Arcana:** Anytime you cast a spell with the cold or water descriptor, you gain a number of temporary hit points equal to the level of the spell cast. You can grant up to half of these temporary hit points to an adjacent ally, in which case you gain the remaining temporary hit points. These temporary hit points last 1 minute.

**Bloodline Powers:** Your powers are revitalizing rather than destructive.

**Lifewater Stream (Su):** At 9th level, once per day, you can unleash a surge of restorative elemental water that aids your allies. This ability affects creatures in a 30-foot line extending from your palm, and you can select one of the following conditions to remove from the affected creatures: fatigued, shaken, or sickened. Creatures affected by a more extreme version of the chosen condition (such as exhausted for fatigued, frightened for shaken, and nauseated for sickened) have their condition reduced to the less extreme version. At 17th level, you can use this ability twice per day, and you can choose from the following additional conditions: blinded, deafened, dazed, and staggered. At 20th level, you can use this ability three times per day. This bloodline power replaces elemental blast.'''

[[entry]]
id = "ref/sorcbloodline/fey"
anchor = "opening"
print = "The capricious nature of the fey runs in your family due to some intermingling of fey blood or magic. You are more emotional than most, prone to bouts of joy and rage."

[[entry]]
id = "ref/sorcbloodline/fey"
anchor = "class-skill"
print = "Knowledge (nature)."

[[entry]]
id = "ref/sorcbloodline/fey"
anchor = "bonus-spells"
print = "_entangle_ (3rd), _hideous laughter_ (5th), _deep slumber_ (7th), _poison_ (9th), _tree stride_ (11th), _mislead_ (13th), _phase door_ (15th), _irresistible dance_ (17th), _shapechange_ (19th)."

[[entry]]
id = "ref/sorcbloodline/fey"
anchor = "bonus-feats"
print = "[Dodge](ref/feat/dodge), [Improved Initiative](ref/feat/improved-initiative), [Lightning Reflexes](ref/feat/lightning-reflexes), [Mobility](ref/feat/mobility), [Point Blank Shot](ref/feat/point-blank-shot), [Precise Shot](ref/feat/precise-shot), [Quicken Spell](ref/feat/quicken-spell), [Skill Focus](ref/feat/skill-focus) (Knowledge \\[nature\\])."

[[entry]]
id = "ref/sorcbloodline/fey"
anchor = "bloodline-arcana"
print = "Whenever you cast a spell of the [compulsion](ref/spelldef/compulsion) subschool, increase the spell's DC by +2."

[[entry]]
id = "ref/sorcbloodline/fey"
anchor = "bloodline-powers"
print = "You have always had a tie to the natural world, and as your power increases, so does the influence of the fey over your magic."

[[entry]]
id = "ref/sorcbloodline/fey"
anchor = "laughing-touch"
print = "At 1st level, you can cause a creature to burst out laughing for 1 round as a melee touch attack. A laughing creature can only take a move action but can defend itself normally. Once a creature has been affected by laughing touch, it is immune to its effects for 24 hours. You can use this ability a number of times per day equal to 3 + your Charisma modifier. This is a mind-affecting effect."

[[entry]]
id = "ref/sorcbloodline/fey"
anchor = "woodland-stride"
print = "At 3rd level, you can move through any sort of undergrowth (such as natural thorns, briars, overgrown areas, and similar terrain) at your normal speed and without taking damage or suffering any other impairment. Thorns, briars, and overgrown areas that have been magically manipulated to impede motion, however, still affect you."

[[entry]]
id = "ref/sorcbloodline/fey"
anchor = "fleeting-glance"
print = "At 9th level, you can turn invisible for a number of rounds per day equal to your sorcerer level. This ability functions as _[greater invisibility](ref/spell/invisibility-greater)_. These rounds need not be consecutive."

[[entry]]
id = "ref/sorcbloodline/fey"
anchor = "fey-magic"
print = "At 15th level, you may reroll any caster level check made to overcome [spell resistance](ref/rule/spell-resistance). You must decide to use this ability before the results are revealed by the GM. You must take the second result, even if it is worse. You can use this ability at will."

[[entry]]
id = "ref/sorcbloodline/fey"
anchor = "soul-of-the-fey"
print = "At 20th level, your soul becomes one with the world of the fey. You gain immunity to poison and DR 10/cold iron. Creatures of the animal type do not attack you unless compelled to do so through magic. Once per day, you can cast _[shadow walk](ref/spell/shadow-walk)_ as a [spell-like ability](ref/umr/spell-like-abilities) using your sorcerer level as your caster level."

[[entry]]
id = "ref/sorcbloodline/fey"
anchor = "replacement-bloodline-arcana"
print = "Whenever you cast a spell with the curse subtype, increase the spell's DC by 2."

[[entry]]
id = "ref/sorcbloodline/fey"
anchor = "fey-fascination"
print = "At 1st level, as a standard action, you can force one target within 30 feet to make a Will save (DC = 10 + 1/2 your sorcerer level + your Charisma modifier) or be [fascinated](ref/misc/fascinated) for 1 round for every 2 sorcerer levels you possess (minimum 1). This is a mind-affecting, illusion (pattern) effect. You can use this ability a number of times per day equal to 3 + your Charisma modifier. This bloodline power replaces laughing touch."

[[entry]]
id = "ref/sorcbloodline/fey"
anchor = "dark-fe-y"
print = '''
Your powers were born of malevolent trickery and shadowy First World magic.

**Associated Bloodline:** Fey.

**Bloodline Arcana:** Whenever you cast a spell with the curse subtype, increase the spell's DC by 2.

**Bloodline Powers:** In your presence, senses are deceived.

**Fey Fascination (Su):** At 1st level, as a standard action, you can force one target within 30 feet to make a Will save (DC = 10 + 1/2 your sorcerer level + your Charisma modifier) or be [fascinated](ref/misc/fascinated) for 1 round for every 2 sorcerer levels you possess (minimum 1). This is a mind-affecting, illusion (pattern) effect. You can use this ability a number of times per day equal to 3 + your Charisma modifier. This bloodline power replaces laughing touch.'''

[[entry]]
id = "ref/sorcbloodline/fey"
anchor = "sylvan-wildblooded-mutation"
print = '''
Your ties to nature have more to do with creatures than with capriciousness.

**Associated Bloodline:** Fey.

**Bloodline Arcana:** See bloodline powers.

**Bloodline Powers:** Your magic shows a kinship to that of the beast-talkers and shapechanger fey.

**Animal Companion (Ex):** You gain an animal companion. Your effective druid level for this ability is equal to your sorcerer level - 3 (minimum 1st). This bloodline power counts as your bloodline arcana and also replaces laughing touch.

**Fey Wings (Su):** At 15th level, you can grow insectlike wings from your back and become one size category smaller (as if you had used _reduce person_), gaining a fly speed of 60 feet with average maneuverability. You can maintain this form for 1 minute per level. This duration does not need to be consecutive, but it must be used in 1-minute increments. This bloodline power replaces fey magic.'''

[[entry]]
id = "ref/sorcbloodline/infernal"
anchor = "opening"
print = "Somewhere in your family's history, a relative made a deal with a devil, and that pact has influenced your family line ever since. In you, it manifests in direct and obvious ways, granting you powers and abilities. While your fate is still your own, you can't help but wonder if your ultimate reward is bound to the Pit."

[[entry]]
id = "ref/sorcbloodline/infernal"
anchor = "class-skill"
print = "Diplomacy."

[[entry]]
id = "ref/sorcbloodline/infernal"
anchor = "bonus-spells"
print = "_protection from good_ (3rd), _scorching ray_ (5th), _suggestion_ (7th), _charm monster_ (9th), _dominate person_ (11th), _planar binding_ (devils and creatures with the fiendish template only) (13th), _greater teleport_ (15th), _power word stun_ (17th), _meteor swarm_ (19th)."

[[entry]]
id = "ref/sorcbloodline/infernal"
anchor = "bonus-feats"
print = "[Blind-Fight](ref/feat/blind-fight), [Combat Expertise](ref/feat/combat-expertise), [Deceitful](ref/feat/deceitful), [Extend Spell](ref/feat/extend-spell), [Improved Disarm](ref/feat/improved-disarm), [Iron Will](ref/feat/iron-will), [Skill Focus](ref/feat/skill-focus) (Knowledge \\[planes\\]), [Spell Penetration](ref/feat/spell-penetration)."

[[entry]]
id = "ref/sorcbloodline/infernal"
anchor = "bloodline-arcana"
print = "Whenever you cast a spell of the [charm](ref/spelldef/charm) subschool, increase the spell's DC by +2."

[[entry]]
id = "ref/sorcbloodline/infernal"
anchor = "bloodline-powers"
print = "You can draw upon the power of Hell, although you must be wary of its corrupting influence. Such power does not come without a price."

[[entry]]
id = "ref/sorcbloodline/infernal"
anchor = "corrupting-touch"
print = "At 1st level, you can cause a creature to become [shaken](ref/misc/shaken) (see page 568) as a melee touch attack. This effect persists for a number of rounds equal to 1/2 your sorcerer level (minimum 1). Creatures shaken by this ability radiate an aura of evil, as if they were an evil outsider (see _[detect evil](ref/spell/detect-evil)_). Multiple touches do not stack, but they do add to the duration. You can use this ability a number of times per day equal to 3 + your Charisma modifier."

[[entry]]
id = "ref/sorcbloodline/infernal"
anchor = "infernal-resistances"
print = "At 3rd level, you gain [resist](ref/umr/resistance) fire 5 and a +2 bonus on saving throws made against poison. At 9th level, your resistance to fire increases to 10 and your bonus on poison saving throws increases to +4."

[[entry]]
id = "ref/sorcbloodline/infernal"
anchor = "hellfire"
print = "At 9th level, you can call down a column of hellfire. This 10-foot-radius [burst](ref/misc/burst) does 1d6 points of fire damage per sorcerer level. Those caught in the area of your blast receive a Reflex save for half damage. Good creatures that fail their saves are shaken for a number of rounds equal to your sorcerer level. The DC of this save is equal to 10 + 1/2 your sorcerer level + your Charisma modifier. At 9th level, you can use this ability once per day. At 17th level, you can use this ability twice per day. At 20th level, you can use this ability three times per day. This power has a range of 60 feet."

[[entry]]
id = "ref/sorcbloodline/infernal"
anchor = "on-dark-wings"
print = "At 15th level, you can grow fearsome bat wings as a standard action, giving you a fly speed of 60 feet with average maneuverability. The wings can be dismissed as a free action."

[[entry]]
id = "ref/sorcbloodline/infernal"
anchor = "power-of-the-pit"
print = "At 20th level, your form becomes infused with vile power. You gain immunity to fire and poison. You also gain resistance to acid 10 and cold 10, and the ability to see perfectly in darkness of any kind to a range of 60 feet."

[[entry]]
id = "ref/sorcbloodline/infernal"
anchor = "replacement-bloodline-arcana"
print = "Whenever you cast a spell, you gain a bonus on Intimidate checks equal to the spell's level for 1 round."

[[entry]]
id = "ref/sorcbloodline/infernal"
anchor = "tough-as-hell"
print = "At 9th level, you gain a +2 inherent bonus to your Constitution. This bonus increases to +4 at 13th level, and to +6 at 17th level. This bloodline power replaces hellfire."

[[entry]]
id = "ref/sorcbloodline/infernal"
anchor = "pit-touched-wildblooded-mutation"
print = '''
Your diabolic corruption is from a source in the deepest parts of Hell.

**Associated Bloodline:** Infernal.

**Bloodline Arcana:** Whenever you cast a spell, you gain a bonus on Intimidate checks equal to the spell's level for 1 round.

**Bloodline Powers:** The crushing weight of evil has given you the strength to endure.

**Tough as Hell (Ex):** At 9th level, you gain a +2 inherent bonus to your Constitution. This bonus increases to +4 at 13th level, and to +6 at 17th level. This bloodline power replaces hellfire.'''

[[entry]]
id = "ref/sorcbloodline/undead"
anchor = "opening"
print = "The taint of the grave runs through your family. Perhaps one of your ancestors became a powerful lich or vampire, or maybe you were born dead before suddenly returning to life. Either way, the forces of death move through you and touch your every action."

[[entry]]
id = "ref/sorcbloodline/undead"
anchor = "class-skill"
print = "Knowledge (religion)."

[[entry]]
id = "ref/sorcbloodline/undead"
anchor = "bonus-spells"
print = "_chill touch_ (3rd), _false life_ (5th), _vampiric touch_ (7th), _animate dead_ (9th), _waves of fatigue_ (11th), _undeath to death_ (13th), _finger of death_ (15th), _horrid wilting_ (17th), _energy drain_ (19th)."

[[entry]]
id = "ref/sorcbloodline/undead"
anchor = "bonus-feats"
print = "[Combat Casting](ref/feat/combat-casting), [Diehard](ref/feat/diehard), [Endurance](ref/feat/endurance), [Iron Will](ref/feat/iron-will), [Skill Focus](ref/feat/skill-focus) (Knowledge \\[religion\\]), [Spell Focus](ref/feat/spell-focus), [Still Spell](ref/feat/still-spell), [Toughness](ref/feat/toughness)."

[[entry]]
id = "ref/sorcbloodline/undead"
anchor = "bloodline-arcana"
print = "Some undead are susceptible to your mind-affecting spells. Corporeal undead that were once humanoids are treated as humanoids for the purposes of determining which spells affect them."

[[entry]]
id = "ref/sorcbloodline/undead"
anchor = "bloodline-powers"
print = "You can call upon the foul powers of the afterlife. Unfortunately, the more you draw upon them, the closer you come to joining them."

[[entry]]
id = "ref/sorcbloodline/undead"
anchor = "grave-touch"
print = "Starting at 1st level, you can make a melee touch attack as a standard action that causes a living creature to become [shaken](ref/misc/shaken) for a number of rounds equal to 1/2 your sorcerer level (minimum 1). If you touch a shaken creature with this ability, it becomes [frightened](ref/misc/frightened) (see page 567) for 1 round if it has fewer Hit Dice than your sorcerer level. You can use this ability a number of times per day equal to 3 + your Charisma modifier."

[[entry]]
id = "ref/sorcbloodline/undead"
anchor = "death-s-gift"
print = "At 3rd level, you gain [resist](ref/umr/resistance) cold 5 and DR 5/— against nonlethal damage. At 9th level, your resistance to cold increases to 10 and your DR increases to 10/— against nonlethal damage."

[[entry]]
id = "ref/sorcbloodline/undead"
anchor = "grasp-of-the-dead"
print = "At 9th level, you can cause a swarm of skeletal arms to [burst](ref/misc/burst) from the ground to rip and tear at your foes. The skeletal arms erupt from the ground in a 20-foot-radius burst. Anyone in this area takes 1d6 points of slashing damage per sorcerer level. Those caught in the area receive a Reflex save for half damage. Those who fail the save are unable to move for 1 round. The DC of this save is equal to 10 + 1/2 your sorcerer level + your Charisma modifier. The skeletal arms disappear after 1 round. The arms must burst up from a solid surface. At 9th level, you can use this ability once per day. At 17th level, you can use this ability twice per day. At 20th level, you can use this ability three times per day. This power has a range of 60 feet."

[[entry]]
id = "ref/sorcbloodline/undead"
anchor = "incorporeal-form"
print = "At 15th level, you can become [incorporeal](ref/subtype/incorporeal) for 1 round per sorcerer level. While in this form, you gain the incorporeal subtype. You only take half damage from corporeal sources as long as they are magic (you take no damage from non-magic weapons and objects). Likewise, your spells deal only half damage to corporeal creatures. Spells and other effects that do not deal damage function normally. You can use this ability once per day."

[[entry]]
id = "ref/sorcbloodline/undead"
anchor = "one-of-us"
print = "At 20th level, your form begins to rot (the appearance of this decay is up to you) and undead see you as one of them. You gain immunity to cold, nonlethal damage, paralysis, and sleep. You also gain DR 5/—. Unintelligent undead do not notice you unless you attack them. You receive a +4 morale bonus on saving throws made against spells and [spell-like abilities](ref/umr/spell-like-abilities) cast by undead."

[[entry]]
id = "ref/sorcbloodline/undead"
anchor = "replacement-bloodline-arcana"
print = "Whenever you cast a spell of the necromancy school, your effective caster level is increased by 1."

[[entry]]
id = "ref/sorcbloodline/undead"
anchor = "the-blood-is-the-life"
print = "At 1st level, you can gain sustenance from the blood of the recently dead. As a standard action, you can drink the blood of a creature that died within the past minute. The creature must be corporeal, must be at least the same size as you, and must have blood. This ability heals you 1d6 hit points and nourishes you as if you'd had a full meal. You may use this ability a number of times per day equal to 3 + your Charisma modifier. This bloodline power replaces grave touch."

[[entry]]
id = "ref/sorcbloodline/undead"
anchor = "sanguine-wildblooded-mutation"
print = '''
The power of undeath can derive from cold blood as well as hard bone.

**Associated Bloodline:** Undead.

**Bloodline Arcana:** Whenever you cast a spell of the necromancy school, your effective caster level is increased by 1.

**Bloodline Powers:** Your magic emulates that of the hungry dead.

**The Blood Is the Life (Su):** At 1st level, you can gain sustenance from the blood of the recently dead. As a standard action, you can drink the blood of a creature that died within the past minute. The creature must be corporeal, must be at least the same size as you, and must have blood. This ability heals you 1d6 hit points and nourishes you as if you'd had a full meal. You may use this ability a number of times per day equal to 3 + your Charisma modifier. This bloodline power replaces grave touch.'''

[[entry]]
id = "ref/talent/bleeding-attack"
anchor = "bleeding-attack"
print = '''
Talents marked with an asterisk add effects to a rogue’s sneak attack. Only one of these talents can be applied to an individual attack and the decision must be made before the attack roll is made.

A rogue with this ability can cause living opponents to [bleed](ref/rule/bleed) by hitting them with a sneak attack. This attack causes the target to take 1 additional point of damage each round for each die of the rogue's sneak attack (e.g., 4d6 equals 4 points of bleed). Bleeding creatures take that amount of damage every round at the start of each of their turns. The bleeding can be stopped by a DC 15 Heal check or the application of any effect that heals hit point damage. Bleeding damage from this ability does not stack with itself. Bleeding damage bypasses any [damage reduction](ref/rule/damage-reduction) the creature might possess.'''

[[entry]]
id = "ref/talent/combat-trick"
anchor = "combat-trick"
print = "A rogue that selects this talent gains a bonus combat feat (see Chapter 5)."

[[entry]]
id = "ref/talent/crippling-strike"
anchor = "crippling-strike"
print = '''
Talents marked with an asterisk add effects to a rogue’s sneak attack. Only one of these talents can be applied to an individual attack and the decision must be made before the attack roll is made.

A rogue with this ability can sneak attack opponents with such precision that her blows weaken and hamper them. An opponent damaged by one of her sneak attacks also takes 2 points of [Strength damage](ref/rule/ability-damage-drain).'''

[[entry]]
id = "ref/talent/defensive-roll"
anchor = "defensive-roll"
print = "With this advanced talent, the rogue can roll with a potentially lethal blow to take less damage from it than she otherwise would. Once per day, when she would be reduced to 0 or fewer hit points by damage in combat (from a weapon or other blow, not a spell or special ability), the rogue can attempt to roll with the damage. To use this ability, the rogue must attempt a Reflex saving throw (DC = damage dealt). If the save succeeds, she takes only half damage from the blow; if it fails, she takes full damage. She must be aware of the attack and able to react to it in order to execute her defensive roll—if she is denied her Dexterity bonus to AC, she can't use this ability. Since this effect would not normally allow a character to make a Reflex save for half damage, the rogue's [evasion](ref/ability/evasion) ability does not apply to the defensive roll."

[[entry]]
id = "ref/talent/dispelling-attack"
anchor = "dispelling-attack"
print = '''
Talents marked with an asterisk add effects to a rogue’s sneak attack. Only one of these talents can be applied to an individual attack and the decision must be made before the attack roll is made.

Opponents that are dealt sneak attack damage by a rogue with this ability are affected by a targeted _[dispel magic](ref/spell/dispel-magic)_, targeting the lowest-level spell effect active on the target. The caster level for this ability is equal to the rogue's level. A rogue must have the [major magic](ref/talent/major-magic) rogue talent before choosing dispelling attack.'''

[[entry]]
id = "ref/talent/fast-stealth"
anchor = "fast-stealth"
print = "This ability allows a rogue to move at full speed using the [Stealth](ref/skill/stealth) skill without penalty."

[[entry]]
id = "ref/talent/feat"
anchor = "feat"
print = "A rogue may gain any feat that she qualifies for in place of a rogue talent."

[[entry]]
id = "ref/talent/finesse-rogue"
anchor = "finesse-rogue"
print = "A rogue that selects this talent gains [Weapon Finesse](ref/feat/weapon-finesse) as a bonus feat."

[[entry]]
id = "ref/talent/improved-evasion"
anchor = "improved-evasion"
print = "This works like [evasion](ref/ability/evasion), except that while the rogue still takes no damage on a successful Reflex saving throw against attacks, she henceforth takes only half damage on a failed save. A [helpless](ref/misc/helpless) rogue does not gain the benefit of improved evasion."

[[entry]]
id = "ref/talent/ledge-walker"
anchor = "ledge-walker"
print = "This ability allows a rogue to move along narrow surfaces at full speed using the Acrobatics skill without penalty. In addition, a rogue with this talent is not [flat-footed](ref/rule/flat-footed) when using Acrobatics to move along narrow surfaces."

[[entry]]
id = "ref/talent/major-magic"
anchor = "major-magic"
print = "A rogue with this talent gains the ability to cast a 1st-level spell from the sorcerer/wizard spell list two times a day as a [spell-like ability](ref/umr/spell-like-abilities). The caster level for this ability is equal to the rogue's level. The save DC for this spell is 11 + the rogue's Intelligence modifier. The rogue must have an Intelligence of at least 11 to select this talent. A rogue must have the [minor magic](ref/talent/minor-magic) rogue talent before choosing this talent."

[[entry]]
id = "ref/talent/minor-magic"
anchor = "minor-magic"
print = "A rogue with this talent gains the ability to cast a 0-level spell from the sorcerer/wizard spell list. This spell can be cast three times a day as a [spell-like ability](ref/umr/spell-like-abilities). The caster level for this ability is equal to the rogue's level. The save DC for this spell is 10 + the rogue's Intelligence modifier. The rogue must have an Intelligence of at least 10 to select this talent."

[[entry]]
id = "ref/talent/opportunist"
anchor = "opportunist"
print = "Once per round, the rogue can make an attack of opportunity against an opponent who has just been struck for damage in melee by another character. This attack counts as an attack of opportunity for that round. Even a rogue with the [Combat Reflexes](ref/feat/combat-reflexes) feat can't use the opportunist ability more than once per round."

[[entry]]
id = "ref/talent/quick-disable"
anchor = "quick-disable"
print = "It takes a rogue with this ability half the normal amount of time to disable a trap using the [Disable Device](ref/skill/disable-device) skill (minimum 1 round)."

[[entry]]
id = "ref/talent/resiliency"
anchor = "resiliency"
print = "Once per day, a rogue with this ability can gain a number of [temporary hit points](ref/rule/temporary-hit-points) equal to the rogue's level. Activating this ability is an immediate action that can only be performed when she is brought to below 0 hit points. This ability can be used to prevent her from [dying](ref/misc/dying). These temporary hit points last for 1 minute. If the rogue's hit points drop below 0 due to the loss of these temporary hit points, she falls [unconscious](ref/misc/unconscious) and is dying as normal."

[[entry]]
id = "ref/talent/rogue-crawl"
anchor = "rogue-crawl"
print = "While [prone](ref/rule/prone), a rogue with this ability can move at half speed. This movement provokes attacks of opportunity as normal. A rogue with this talent can take a 5-foot step while crawling."

[[entry]]
id = "ref/talent/skill-mastery"
anchor = "skill-mastery"
print = "The rogue becomes so confident in the use of certain skills that she can use them reliably even under adverse conditions. Upon gaining this ability, she selects a number of skills equal to 3 + her Intelligence modifier. When making a skill check with one of these skills, she may take 10 even if stress and distractions would normally prevent her from doing so. A rogue may gain this special ability multiple times, selecting additional skills for skill mastery to apply to each time."

[[entry]]
id = "ref/talent/slippery-mind"
anchor = "slippery-mind"
print = "This ability represents the rogue's ability to wriggle free from magical effects that would otherwise control or compel her. If a rogue with slippery mind is affected by an enchantment spell or effect and fails her saving throw, she can attempt it again 1 round later at the same DC. She gets only this one extra chance to succeed on her saving throw."

[[entry]]
id = "ref/talent/slow-reactions"
anchor = "slow-reactions"
print = '''
Talents marked with an asterisk add effects to a rogue’s sneak attack. Only one of these talents can be applied to an individual attack and the decision must be made before the attack roll is made.

Opponents damaged by the rogue's sneak attack can't make attacks of opportunity for 1 round.'''

[[entry]]
id = "ref/talent/stand-up"
anchor = "stand-up"
print = "A rogue with this ability can stand up from a [prone](ref/rule/prone) position as a free action. This still provokes attacks of opportunity for standing up while threatened by a foe."

[[entry]]
id = "ref/talent/surprise-attack"
anchor = "surprise-attack"
print = "During the surprise round, opponents are always considered [flat-footed](ref/rule/flat-footed) to a rogue with this ability, even if they have already acted."

[[entry]]
id = "ref/talent/trap-spotter"
anchor = "trap-spotter"
print = "Whenever a rogue with this talent comes within 10 feet of a trap, she receives an immediate Perception skill check to notice the trap. This check should be made in secret by the GM."

[[entry]]
id = "ref/talent/weapon-training"
anchor = "weapon-training"
print = "A rogue that selects this talent gains [Weapon Focus](ref/feat/weapon-focus) as a bonus feat."
