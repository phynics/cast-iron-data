[[entry]]
id = "ref/domain/madness"
anchor = "truth-subdomain"
print = '''
**Example Apocrypha (Sivanah):** Many of Sivanah's faithful teach that there is no ultimate truth, only further illusions to be unveiled. Those fanatics known as the Seekers of the Seventh Veil insist that this conventional wisdom is only another deception and that Sivanah herself hides absolute knowledge behind her innermost veil. The largest concentration of apostates has congregated in Kaer Maga over the last three years, where their intermittently lucid ramblings have unsettled even the unshakable locals. Their displays have begun interfering with the troll augurs' business, and it is only a matter of time before these violent prophets retaliate.

**Associated Subdomain:** Madness.

**Associated Deities:** Groetus, Lamashtu, Sif kesh, Sivanah.

**Replacement Power:** The following granted power replaces the aura of madness power of the Madness domain.

**Dawning Realization (Su):** At 8th level, you can impart a shared vision of unfathomable ineffability to a living creature you touch as a standard action, after which your turn immediately ends. You are [dazed](ref/misc/dazed) and the target [confused](ref/misc/confused) for 1 round by what you both learn. On the following round, you are both [staggered](ref/misc/staggered) for 1 round by the ramifications of your discovery. On the third round, you are confused and the target dazed for 1 round as you attempt to regain your bearings. Each round, the target can attempt a Will save with a DC equal to 10 + 1/2 your cleric level + your Wisdom modifier to negate that round's effects for both of you, though the effect does not end until the end of the third round. This is a mind-affecting effect that you can use a number of times per day equal to 1/2 your class level.

**Replacement Domain Spells:** 3rd—_wall of nausea_, 5th—_contact other plane_, 6th—_litany of madness_.'''

