[[entry]]
id = "ref/domain/chaos"
anchor = "granted-powers"
print = "Your touch infuses life and weapons with chaos, and you revel in all things anarchic."

[[entry]]
id = "ref/domain/chaos"
anchor = "touch-of-chaos"
print = "You can imbue a target with chaos as a melee touch attack. For the next round, anytime the target rolls a d20, he must roll twice and take the less favorable result. You can use this ability a number of times per day equal to 3 + your Wisdom modifier."

[[entry]]
id = "ref/domain/chaos"
anchor = "chaos-blade"
print = "At 8th level, you can give a weapon touched the _[anarchic](ref/magic-enh/anarchic)_ special weapon quality for a number of rounds equal to 1/2 your cleric level. You can use this ability once per day at 8th level, and an additional time per day for every four levels beyond 8th."

[[entry]]
id = "ref/domain/chaos"
anchor = "domain-spells"
print = "1st—_protection from law_, 2nd—_align weapon_ (chaos only), 3rd—_magic circle against law_, 4th—_chaos hammer_, 5th—_dispel law_, 6th—_animate objects_, 7th—_word of chaos_, 8th—_cloak of chaos_, 9th—_summon monster IX_ (chaos spell only)."

[[entry]]
id = "ref/domain/chaos"
anchor = "elysium-s-call"
print = "With a touch, you can imbue creatures with the spirit of Elysium, lifting their spirits and freeing them from bonds. The creatures touched can immediately reroll any failed saving throws against spells and spell-like abilities of the enchantment (charm) and enchantment (compulsion) subschools. In addition, targets receive a +2 sacred bonus on such saving throws and a +2 sacred bonus on CMB checks to escape a grapple. Finally, targets can ignore up to 5 feet of difficult terrain each round, as if they had the [Nimble Moves](ref/feat/nimble-moves) feat. These bonuses last for a number of rounds equal to 1/2 your cleric level (minimum 1), although the saving throw reroll only applies when the creature is touched. You can use this ability for a number of rounds per day equal to 3 + your Wisdom modifier."

[[entry]]
id = "ref/domain/chaos"
anchor = "faith-stealing-strike"
print = "You can make a single melee attack using your highest base attack bonus against a creature capable of casting divine spells. If you damage the creature, it must succeed at a Will save (DC = 10 + 1/2 your cleric level + your Wisdom modifier) or be unable to cast any divine spells for 1 round. If you do not damage your target with the attack, this ability is expended with no effect. You can use this ability a number of times per day equal to 3 + your Wisdom modifier."

[[entry]]
id = "ref/domain/chaos"
anchor = "fury-of-the-abyss"
print = "As a swift action, you can give yourself an enhancement bonus equal to 1/2 your cleric level (minimum +1) on melee attacks, melee damage rolls, and combat maneuver checks. This bonus lasts for 1 round. During this round, you take a -2 penalty to AC. You can use this ability for a number of times per day equal to 3 + your Wisdom modifier."

[[entry]]
id = "ref/domain/chaos"
anchor = "hasten-the-end"
print = "At 8th level, as an immediate action upon successfully striking an opponent with a melee attack, you can choose to reduce the remaining duration of all beneficial magical effects currently affecting the target by 1 round, minute, hour, or day—whichever measurement is used to determine the duration of each particular magical effect. You can use this ability once per day at 8th level, and an additional time per day for every four levels beyond 8th."

[[entry]]
id = "ref/domain/chaos"
anchor = "aura-of-chaos"
print = "At 8th level, you can surround yourself with a field wild energies. Thee energies manifest as a 30-foot aura of chaos for a number of rounds per day equal to your cleric level. All enemies within this aura must declare one type of action at the start of their turn (attack, cast a spell, move, use an item, or activate a special ability) and make a Will save. Creatures that fail the Will save must take an action other than their declared action. If they succeed, they must take the declared action. Creatures cannot select actions that they cannot perform."

[[entry]]
id = "ref/domain/chaos"
anchor = "intense-celebration"
print = "At 8th level, spells you cast that confer a morale effect upon you or your allies are automatically affected as if by the [Extend Spell](ref/feat/extend-spell) metamagic feat, but with no increase in spell level."

[[entry]]
id = "ref/domain/chaos"
anchor = "aura-of-bedlam"
print = '''
At 8th level, you can emit a 30-foot-radius aura of chaos and strife for 1 round per cleric level. Enemies in the aura take a -4 penalty on [concentration](ref/rule/concentration) checks and are treated as experiencing vigorous motion (concentration DC = 10 + spell level) when attempting to cast spells. This penalty increases by 1 for every 2 cleric levels you have beyond 8th.

This is a mind-affecting effect. These rounds need not be consecutive.'''

[[entry]]
id = "ref/domain/chaos"
anchor = "unexpected-whimsy"
print = "As a standard action, you dance, act like a buffoon, or commit some other act of whimsy. When you do, enemies within 30 feet of you that can see and hear you must succeed a Will saving throw (DC = 10 + 1/2 your cleric level + half your Wisdom modifier) or they collapse into gales of manic laughter, falling prone. Those who fail their saving throws can take no actions other than laughing for 1 round, but are not considered [helpless](ref/misc/helpless). You can use this ability once per day at 8th level and one additional time for every 4 levels you possess beyond 8th."

[[entry]]
id = "ref/domain/chaos"
anchor = "drunken-autonomy"
print = '''
As a swift action, whenever under the effects of mind-affecting magic, possession, or similar external control, you can channel the unrestricted nature of your god. Instead of acting under the compulsion, you instead act as though you had the [confused](ref/misc/confused) condition for 1 round. Producing the "act normally" result allows you to act free of mental compulsion for that round. You can use this ability a number of times per day equal to 3 + your Wisdom modifier.

This replaces the touch of chaos domain power of the Chaos domain.'''

