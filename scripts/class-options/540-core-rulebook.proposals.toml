# The printed text of the powers of the class options of the book, written ones included (the check reads an entry against it). Generated: never edit by hand.

[[entry]]
id = "ref/arcaneschool/abjuration"
anchor = "opening"
print = "The abjurer uses magic against itself, and masters the art of defensive and warding magics."

[[entry]]
id = "ref/arcaneschool/abjuration"
anchor = "resistance"
print = "You gain [resistance](ref/umr/resistance) 5 to an energy type of your choice, chosen when you prepare spells. This resistance can be changed each day. At 11th level, this resistance increases to 10. At 20th level, this resistance changes to [immunity](ref/umr/immunity) to the chosen energy type."

[[entry]]
id = "ref/arcaneschool/abjuration"
anchor = "protective-ward"
print = "As a standard action, you can create a 10-foot-radius field of protective magic centered on you that lasts for a number of rounds equal to your Intelligence modifier. All allies in this area (including you) receive a +1 deflection bonus to their AC. This bonus increases by +1 for every five wizard levels you possess. You can use this ability a number of times per day equal to 3 + your Intelligence modifier."

[[entry]]
id = "ref/arcaneschool/abjuration"
anchor = "energy-absorption"
print = "At 6th level, you gain an amount of energy absorption equal to 3 times your wizard level per day. Whenever you take energy damage, apply immunity, vulnerability (if any), and resistance first and apply the rest to this absorption, reducing your daily total by that amount. Any damage in excess of your absorption is applied to you normally."

[[entry]]
id = "ref/arcaneschool/abjuration"
anchor = "unstable-bonds"
print = "At 1st level, your touch can disrupt the bonds that hold a summoned or called creature on this plane. As a melee touch attack, you can cause a summoned or called creature to become [shaken](ref/misc/shaken) and [staggered](ref/misc/staggered) for a number of rounds equal to 1/2 your wizard level (minimum 1). You can use this ability a number of times per day equal to 3 + your Intelligence modifier."

[[entry]]
id = "ref/arcaneschool/abjuration"
anchor = "aura-of-banishment"
print = "At 8th level, you can emit a 30-foot aura of banishment for a number of rounds per day equal to your wizard level. Any summoned or called creature in the area must make a Will save each round. Once the creature fails a Will saving throw, it is staggered as long as it remains inside the aura. If it fails a second Will saving throw, it is immediately sent back to its home plane and the spell that summoned it immediately ends. If that spell summoned more than one creature, only the creature that failed its saving throws is affected. These rounds do not need to be consecutive."

[[entry]]
id = "ref/arcaneschool/abjuration"
anchor = "disruption"
print = "At 1st level, you gain the ability to disrupt spellcasting with a touch. As a melee touch attack, you can place a disruptive field around the target. While the field is in place, the target must make a [concentration](ref/rule/concentration) check to cast any spell or to use a [spell-like ability](ref/umr/spell-like-abilities) in addition to any other required concentration checks. The DC of this check is equal to 15 + twice the spell's level. If the check is failed, the target's spell is wasted. This field lasts for a number of rounds equal to 1/2 your wizard level (minimum 1). You can use this ability a number of times per day equal to 3 + your Intelligence modifier."

[[entry]]
id = "ref/arcaneschool/abjuration"
anchor = "counterspell-mastery"
print = "At 6th level, you gain [Improved Counterspell](ref/feat/improved-counterspell) as a bonus feat. You may attempt to counterspell an opponent's spell once per day as an immediate action (instead of a readied action). You must use a spell at least one level higher than the spell being countered to use this ability. You can use this ability once per day at 6th level, plus one additional time per day for every 4 levels beyond 6th."

[[entry]]
id = "ref/arcaneschool/abjuration"
anchor = "banishment-school"
print = '''
**Associated School:** Abjuration.

**Replacement Powers:** The following school powers replace the energy absorption power and the protective ward power of the abjuration school.

**Unstable Bonds (Su):** At 1st level, your touch can disrupt the bonds that hold a summoned or called creature on this plane. As a melee touch attack, you can cause a summoned or called creature to become [shaken](ref/misc/shaken) and [staggered](ref/misc/staggered) for a number of rounds equal to 1/2 your wizard level (minimum 1). You can use this ability a number of times per day equal to 3 + your Intelligence modifier.

**Aura of Banishment (Su):** At 8th level, you can emit a 30-foot aura of banishment for a number of rounds per day equal to your wizard level. Any summoned or called creature in the area must make a Will save each round. Once the creature fails a Will saving throw, it is staggered as long as it remains inside the aura. If it fails a second Will saving throw, it is immediately sent back to its home plane and the spell that summoned it immediately ends. If that spell summoned more than one creature, only the creature that failed its saving throws is affected. These rounds do not need to be consecutive.'''

