**Replacement Domain Spells:** 3rd—_animate dead_, 6th—_antilife shield_, 9th—_trap the soul_.'''

[[entry]]
id = "ref/domain/repose"
anchor = "psychopomp-susoomaln"
print = '''
**Associated Domains:** Death, Repose.

**Associated Deity:** Pharasma.

**Replacement Power:** The following granted power replaces the death's embrace ability of the Death domain or the ward against death ability of the Repose domain. Psychopomps are a race of neutral outsiders (Pathfinder RPG Bestiary 4 217).

**Spirit Touch (Su):** At 6th level, as a swift action, you can give your natural weapons or any weapons you wield the 9host touch weapon special ability. You can use this power a number of rounds per day equal to your cleric level. These rounds need not be consecutive.

**Replacement Domain Spells:** 3rd-chains of perdition, 6th-planar ally (psychopomps only), 8th-trap the soul.'''

[[entry]]
id = "ref/domain/repose"
anchor = "pharasma-friendly-souls-subdomain"
print = '''
The Lady of Graves seeks the destruction of undead, be they corporeal or manifested spirits. Inquisitors of Pharasma scour the world for signs of the undead, destroying such abominations on sight by means both traditional and esoteric in nature. As a result, most people come first to the church of Pharasma when seeking assistance against foul spirits. One unusual facet of Pharasma's faithful is their reluctance to excise non-undead spirits, such as demons or devils. Only the most altruistic of Pharasmin priests offer their services against possessing outsiders, as most faithful see battling such foes as being beyond their true calling.

**Exorcism of Undeath (Sp):** Once per day as a full-round action, you can try to end any possession spells or effects, or effects that directly exercise mental control over a creature, as long as the effect was caused by an undead creature. You must touch the affected creature (this requires a melee touch attack if the target is neither willing nor helpless) and use a vial of [holy water](ref/eq-weapon/holy-water) as a material component that is consumed as part of using this ability. The target must immediately attempt a new Will save against the original save DC of the controlling effect. If the save is successful, the possession effect immediately ends, as if the target had succeeded at its original saving throw. If the possessing force is a [ghost](ref/template/ghost) or similar undead, it manifests adjacent to the target and is [staggered](ref/misc/staggered) for 1 round.

This replaces the ward against death domain power of the Repose domain.'''

[[entry]]
id = "ref/domain/rune"
anchor = "deities"
print = "Irori, Nethys."

[[entry]]
id = "ref/domain/rune"
anchor = "granted-powers"
print = "In strange and eldritch runes you find potent magic. You gain Scribe Scroll as a bonus feat."

[[entry]]
id = "ref/domain/rune"
anchor = "blast-rune"
print = "As a standard action, you can create a blast rune in any adjacent square. Any creature entering this square takes 1d6 points of damage + 1 point for every two cleric levels you possess. This rune deals either acid, cold, electricity, or fire damage, decided when you create the rune. The rune is invisible and lasts a number of rounds equal to your cleric level or until discharged. You cannot create a blast rune in a square occupied by another creature. This rune counts as a 1st-level spell for the purposes of dispelling. It can be discovered with a DC 26 Perception skill check and disarmed with a DC 26 Disable Device skill check. You can use this ability a number of times per day equal to 3 + your Wisdom modifier."

[[entry]]
id = "ref/domain/rune"
anchor = "spell-rune"
print = "At 8th level, you can attach another spell that you cast to one of your blast runes, causing that spell to affect the creature that triggers the rune, in addition to the damage. This spell must be of at least one level lower than the highest-level cleric spell you can cast and it must target one or more creatures. Regardless of the number of targets the spell can normally affect, it only affects the creature that triggers the rune."

[[entry]]
id = "ref/domain/rune"
anchor = "domain-spells"
print = "1st—_erase_, 2nd—_secret page_, 3rd—_glyph of warding_, 4th—_explosive runes_, 5th—_lesser planar binding_, 6th—_greater glyph of warding_, 7th—_instant summons_, 8th—_symbol of death_, 9th—_teleportation circle_."

[[entry]]
id = "ref/domain/rune"
anchor = "rune-shift"
print = "At 6th level, as a swift action, you can change the location of one of your blast runes. The rune must be within 30 feet. You can place the blast rune in any square adjacent to you, including one occupied by another creature."

[[entry]]
id = "ref/domain/rune"
anchor = "prohibition"
print = '''
As a standard action, you can command a creature within 30 feet to refrain from committing a particular action (including any referenced in the spell _[forbid action](ref/spell/forbid-action)_). If the creature performs the named action before the beginning of your next turn, it takes 1d6 points of damage + 1 point for every 2 cleric levels you possess and the effect ends. This is a language-dependent effect. You can use this ability a number of times per day equal to 3 + your Wisdom modifier.

If you have the spell rune domain power, you can attach a spell effect to the prohibition as if it were the spell rune domain ability; the spell takes effect if the creature performs the named action. This spell must be of at least 1 level lower than the highest-level cleric spell you can cast, and it must target one or more creatures. Regardless of the number of targets the spell can normally affect, it affects only the creature that triggers the rune. Attaching a spell in this way extends the duration of the prohibition by a number of rounds equal to the spell's level, or until it is discharged.'''

[[entry]]
id = "ref/domain/rune"
anchor = "warding-rune"
print = "At 6th level, when a creature is damaged by your blast rune, it cannot attack you for a number of rounds equal to 1/2 your cleric level unless it succeeds at a Will save, as per the spell _[sanctuary](ref/spell/sanctuary)_. Using this ability is an immediate action when a creature triggers one of your blast runes. The ability does not prevent you from being attacked or affected by area of effect spells or abilities. You can use this ability once per day at 8th level, plus one additional time per day at 14th level and 20th level."

[[entry]]
id = "ref/domain/rune"
anchor = "language-subdomain"
print = '''
**Associated Domain:** Rune.

**Replacement Power:** The following granted power replaces the spell rune power of the Rune domain.

**Rune Shift (Su):** At 6th level, as a swift action, you can change the location of one of your blast runes. The rune must be within 30 feet. You can place the blast rune in any square adjacent to you, including one occupied by another creature.

**Replacement Domain Spells:** 1st—_comprehend languages_, 2nd—_share language_, 3rd—_tongues_, 5th_—telepathic bond_.'''

