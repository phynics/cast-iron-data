[[entry]]
id = "ref/domain/trickery"
anchor = "chameleon-aspect"
print = "As a swift action, you can subtly alter the color of your scales, blending them with the surrounding environment. While under the effect of this power, you gain [concealment](ref/rule/concealment) from creatures more than 10 feet away (attacks have a 20% miss chance), and total concealment from creatures more than 40 feet away (attacks have a 50% miss chance). You can use this ability a number of rounds per day equal to 3 + your Wisdom modifier."

[[entry]]
id = "ref/domain/trickery"
anchor = "sudden-shift"
print = "In the blink of an eye, you can appear somewhere else. As an immediate action, after you are missed by a melee attack, you can teleport up to 10 feet to a space that you can see. This space must be inside the reach of the creature that attacked you. You can use this power a number of times each day equal to 3 + your Wisdom modifier."

[[entry]]
id = "ref/domain/trickery"
anchor = "deep-cover"
print = "When you prepare your spells, you can also choose one cover identity—whether that of a real person or a fictitious one. You can assume the disguise of your cover identity in half the normal amount of time. When targeted by a spell or effect that would compromise your chosen disguise (such as _[detect evil](ref/spell/detect-evil)_, _[detect thoughts](ref/spell/detect-thoughts)_, or _[zone of truth](ref/spell/zone-of-truth)_), as an immediate action you can force the creature using the ability to attempt a Will save (DC = 10 + 1/2 your cleric level + your Wisdom modifier). If the creature fails, it gains false information in keeping with your cover identity. You can use this false information ability a number of times per day equal to 3 + your Wisdom modifier."

[[entry]]
id = "ref/domain/trickery"
anchor = "more-for-me"
print = "When another character within 30 feet casts a spell with a range greater than touch, you can attempt a caster level check as an immediate action (DC = 15 + the spell's level). If you succeed at the check, you receive the spell's benefit instead of one of the spell's intended targets (chosen by you). If you are already a target of the spell, you are affected as though you were targeted by the same spell twice (which may or may not benefit you; remember that bonuses from the same source do not stack). This ability does not grant you knowledge of the spell being cast. You can use this ability a number of times per day equal to 3 + your Wisdom modifier."

[[entry]]
id = "ref/domain/trickery"
anchor = "thief-of-the-gods"
print = "At 8th level, when you make a Disable Device or Sleight of Hand check, you can roll twice and take the higher result. Using this ability is a free action. You can use this ability once per day at 8th level, plus one additional time per day for every 2 levels beyond 8th."

[[entry]]
id = "ref/domain/trickery"
anchor = "deceptive-reprieve"
print = '''
When you touch a creature under direct mental control (such as that granted via _[dominate person](ref/spell/dominate-person)_, but not via _[charm person](ref/spell/charm-person)_) or the victim of [possession](ref/rule/possession), that creature can attempt a new Will save against the control or possession effect with a +2 bonus. If the creature succeeds, the effect or possession is temporarily halted, as per _[protection from evil](ref/spell/protection-from-evil)_, for a number of rounds equal to 1/2 your character level. While this ability is active, the target takes a -2 penalty on saves against new mind-affecting effects and new attempts at possession. You can use this ability a number of times per day equal to 3 + your Wisdom modifier.

This replaces the copycat domain power of the Trickery domain.'''

