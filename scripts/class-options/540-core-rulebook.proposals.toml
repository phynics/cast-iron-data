[[entry]]
id = "ref/domain/travel"
anchor = "portal-subdomain"
print = '''
**Example Apocrypha (Abadar):** Separated by war, boundaries, and untamed frontier, Golarion's greatest cities enjoy only a fraction of the prosperity they might if united. The Apostles of Axis have spent several decades lobbying and constructing permanent gateways between the planet's metropolises. Very few of their urban benefactors appreciate this "service," seeing the backdoors both as security threats and as innovations that threaten to undermine the local transportation industries. Absalom, Oppara, Sothis, and others have tried to destroy these borderline-heretical Abadarans' gateways, even going so far as to hire adventurers to sniff out the latest portal.

**Associated Domain:** Travel.

**Associated Deities:** Abadar, Alseta, Barbatos, Yog-Sothoth.

**Replacement Power:** The following granted powers replace the base speed increase and agile feet power of the Travel domain.

**Sacred Threshold (Su):** As a standard action, you can bless a door, a window, or another portal with a touch. For 1 minute, you can increase or decrease the DC of any check to unlock or force open the portal by an amount equal to half your cleric level. In addition, your first ally to pass through the portal during this time gains an amount of [temporary hit points](ref/rule/temporary-hit-points) equal to 1d4 + 1 for every 2 cleric levels you have. These temporary hit points last for 1 minute. You can use this ability a number of times per day equal to 3 + your Wisdom modifier.

**Travel as One (Su):** When you cast a spell with the teleportation descriptor, treat your caster level as 3 higher for the purpose of determining how many additional creatures you can bring with you. In addition, you and any creatures you teleport gain a number of temporary hit points equal to your level that disappear after you reach your destination; these offset any damage you might take from teleportation mishaps or attempting to teleport into a solid body.

**Replacement Domain Spells:** 1st—_open and shut_, 2nd—_knock_, 3rd—_urban step_, 9th—_teleportation circle_.'''

