anchor = "shadow-school"
print = '''
**Associated School:** Illusion.

**Replacement Powers:** The following school powers replace the blinding ray and invisibility field powers of the illusion school.

**Binding Darkness (Sp):** As a standard action, you cast a weave of shadows at any foe within 30 feet as a ranged touch attack. The shadows [entangle](ref/rule/entangled) your foe for 1 round plus 1 additional round for every five wizard levels you possess. In conditions of bright light, this duration is halved (minimum 1 round). A creature entangled by your shadows has [concealment](ref/rule/concealment) from those without [darkvision](ref/rule/darkvision) or the ability to see in darkness, and other creatures likewise have concealment relative to it. You can use this ability a number of times per day equal to 3 + your Intelligence modifier.

**Shadow Step (Sp):** At 8th level, you can use this ability to walk through the [Shadow Plane](ref/rule/shadow-plane) and reappear as a standard action. You can travel up to 30 feet per wizard level per day in this fashion, either in a single round or broken up across multiple shadow steps. This movement must be used in 5-foot increments and does not provoke an attack of opportunity. Travel through the Shadow Plane is imprecise; when you arrive, you re-enter 1 square off target, as per the rules for [thrown splash weapons](ref/rule/throw-splash-weapon) (see page 202 of the _Pathfinder RPG Core Rulebook_). If this would place you in an occupied square, you instead arrive in the nearest safe location. When you arrive, you are cloaked in shadow and gain concealment as the _[blur](ref/spell/blur)_ spell for 1 round. You may bring other willing creatures with you, but you must expend an equal amount of distance for each additional creature brought with you. They likewise re-enter off target (roll location for each creature) and are cloaked in shadow for 1 round.'''

[[entry]]
id = "ref/arcaneschool/illusion"
anchor = "qadira-mage-of-the-veil-school"
print = '''
The city of Katheer is home to a great number of arcane colleges in the Qadiran tradition. Magic has a proud history in this land; its many schools compete with one another to find the best route to understanding the secrets of power.

Among these is the focused school of veil magic. Rather than controlling the elements or transforming the environment, mages of the veil focus on much more subtle magic—blending into their surroundings to watch, observe, and gather secrets, or fading from view completely for the sake of solitude. Most graduates of this college enter the service of the satrap as spies, scouts, or infiltrators.

**Associated School:** Illusion.

**Requirements:** A mage of the veil must select _disguise self_ as one of his spells known at 1st level.

**Class Skills:** A mage of the veil gains Bluff, Disguise, and Stealth as class skills.

**Replacement Powers:** The following school powers replace the [blinding ray](ref/spell/blinding-ray) and invisibility field powers of the illusion school.

**Face in the Crowd (Sp):** At 1st level as a standard action, you can cause yourself to appear so normal, mundane, and unexceptional that you blend in to your surroundings. All creatures within 30 feet treat you as if you belonged there, effectively ignoring you. Creatures outside of this area may notice that you appear out of place, but as soon as they approach within 30 feet they are affected by the magic and no longer think something is amiss. If you interact with an affected creature in any way, it gains a Will save (DC 10 + 1/2 your wizard level + your Intelligence modifier) to disbelieve the illusion and notice you. The effect lasts for a number of minutes equal to your wizard level, or until the illusion is dispelled. The minutes do not need to be consecutive, but must be used in 1-minute increments. This is a mind-affecting phantasm effect.

This ability does not turn you invisible and opponents are not considered [flat-footed](ref/rule/flat-footed). It does not allow you to disguise yourself as a specific individual, type of person, or member of another race, so you cannot blend into a group of uniformed guards or appear as a member of an individual's family, and a human cannot blend into a group of [gnolls](ref/monster/gnoll). You can blend in with any group made up of different types of people, such as a crowd of courtiers in a king's throne room, and you can disguise yourself (either through magic or more mundane means) to appear as a specific type of person or another race (such as a uniformed guard or a gnoll) before using this ability.

**Master of the Veil (Sp):** At 8th level, you can create an illusion that hides the appearance of yourself and any number of allies within 30 feet for 1 round per wizard level. This ability otherwise functions like the spell _[veil](ref/spell/veil)_. The rounds do not need to be consecutive.'''

[[entry]]
id = "ref/arcaneschool/necromancy"
anchor = "opening"
print = "The dread and feared necromancer commands undead and uses the foul power of unlife against his enemies."

[[entry]]
id = "ref/arcaneschool/necromancy"
anchor = "power-over-undead"
print = "You receive [Command Undead](ref/feat/command-undead) or [Turn Undead](ref/feat/turn-undead) as a bonus feat. You can [channel energy](ref/ability/channel-energy) a number of times per day equal to 3 + your Intelligence modifier, but only to use the selected feat. You can take other feats to add to this ability, such as [Extra Channel](ref/feat/extra-channel) and [Improved Channel](ref/feat/improved-channel), but not feats that alter this ability, such as [Elemental Channel](ref/feat/elemental-channel) and [Alignment Channel](ref/feat/alignment-channel). The DC to save against these feats is equal to 10 + 1/2 your wizard level + your Charisma modifier. At 20th level, undead cannot add their [channel resistance](ref/rule/channel-resistance) to the save against this ability."

[[entry]]
id = "ref/arcaneschool/necromancy"
anchor = "grave-touch"
print = "As a standard action, you can make a melee touch attack that causes a living creature to become [shaken](ref/misc/shaken) for a number of rounds equal to 1/2 your wizard level (minimum 1). If you touch a shaken creature with this ability, it becomes [frightened](ref/misc/frightened) for 1 round if it has fewer Hit Dice than your wizard level. You can use this ability a number of times per day equal to 3 + your Intelligence modifier."

[[entry]]
id = "ref/arcaneschool/necromancy"
anchor = "life-sight"
print = "At 8th level, you gain [blindsight](ref/umr/blindsight) to a range of 10 feet for a number of rounds per day equal to your wizard level. This ability only allows you to detect living creatures and undead creatures. This sight also tells you whether a creature is living or undead. Constructs and other creatures that are neither living nor undead cannot be seen with this ability. The range of this ability increases by 10 feet at 12th level, and by an additional 10 feet for every four levels beyond 12th. These rounds do not need to be consecutive."

[[entry]]
id = "ref/arcaneschool/necromancy"
anchor = "healing-grace"
print = "Whenever you cast a spell that has targets, affects creatures in an area, or requires an attack roll, you may heal creatures affected by the spell a total of 1 point of damage per level of the spell. This healing may be spread out between the targets of the spell in any way you choose. If you assign any of the healing to an undead creature, it instead takes 1 point of damage for each point assigned. At 11th level, the amount of damage cured increases to 2 points of damage per level of the spell. This healing occurs when the spell is cast and has no effect on creatures that enter its area after the spell is in place. At 20th level, the amount of damage cured increases to 3 points of damage per level of the spell."

[[entry]]
id = "ref/arcaneschool/necromancy"
anchor = "share-essence"
print = "As a standard action, you can share your vital energy with a living creature that you touch. You take 1d6 points of nonlethal damage + 1 for every two wizard levels you possess. You cannot take an amount of nonlethal damage equal to or greater than your current hit point total; any excess is prevented. The recipient gains a number of [temporary hit points](ref/rule/temporary-hit-points) equal to the amount of damage you received (prevented damage is not counted). These temporary hit points disappear 1 hour later. You may not use this ability to grant yourself temporary hit points. You can use this ability a number of times per day equal to 3 + your Intelligence modifier. This ability has no effect if you are immune to nonlethal damage."

[[entry]]
id = "ref/arcaneschool/necromancy"
anchor = "bolster"
print = "As a standard action, you can touch an undead creature and infuse it with negative energy. It gains a +1 profane bonus on all attack rolls and saving throws, as well as 1 temporary hit point per Hit Die and a +2 bonus to its turn resistance. The bonus on attack rolls and saving throws increases by +1 for every 5 wizard levels you possess. These bonuses last for a number of rounds equal to 1/2 your wizard level (minimum 1 round). The bonuses and temporary hit points are immediately dispelled if the creature is within the area of a _[consecrate](ref/spell/consecrate)_ spell. You can use this ability a number of times per day equal to 3 + your Intelligence modifier."

[[entry]]
id = "ref/arcaneschool/necromancy"
anchor = "life-school"
print = '''
**Associated School:** Necromancy.

**Replacement Powers:** The following school powers replace the power over undead and grave touch powers of the necromancy school.

**Healing Grace (Su):** Whenever you cast a spell that has targets, affects creatures in an area, or requires an attack roll, you may heal creatures affected by the spell a total of 1 point of damage per level of the spell. This healing may be spread out between the targets of the spell in any way you choose. If you assign any of the healing to an undead creature, it instead takes 1 point of damage for each point assigned. At 11th level, the amount of damage cured increases to 2 points of damage per level of the spell. This healing occurs when the spell is cast and has no effect on creatures that enter its area after the spell is in place. At 20th level, the amount of damage cured increases to 3 points of damage per level of the spell.

**Share Essence (Sp):** As a standard action, you can share your vital energy with a living creature that you touch. You take 1d6 points of nonlethal damage + 1 for every two wizard levels you possess. You cannot take an amount of nonlethal damage equal to or greater than your current hit point total; any excess is prevented. The recipient gains a number of [temporary hit points](ref/rule/temporary-hit-points) equal to the amount of damage you received (prevented damage is not counted). These temporary hit points disappear 1 hour later. You may not use this ability to grant yourself temporary hit points. You can use this ability a number of times per day equal to 3 + your Intelligence modifier. This ability has no effect if you are immune to nonlethal damage.'''

[[entry]]
id = "ref/arcaneschool/necromancy"
anchor = "undead-school"
print = '''
**Associated School:** Necromancy.

