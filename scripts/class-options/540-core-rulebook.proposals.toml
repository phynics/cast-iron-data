[[entry]]
id = "ref/domain/magic"
anchor = "divine-alchemy"
print = "You can perform a 1-minute ritual that infuses a flask of water with one of your prepared spells, creating an improvised potion that lasts until consumed or the next time you prepare spells. You can use this ability only with spells that target one or more creatures, and the maximum spell level you can infuse in this way is equal to 1 + 1 for every 4 cleric levels you have. These potions are treated as [alchemist](ref/class/alchemist) extracts for the purpose of your domain spells. You can use this ability a number of times per day equal to 3 + your Wisdom modifier."

[[entry]]
id = "ref/domain/magic"
anchor = "arcane-beacon"
print = "As a standard action you can become a beacon of arcane energy until the end of your next turn. The aura emanates 15 feet from you. All arcane spells cast within the aura either gain a +1 bonus to their caster level or increase their saving throw DC by +1. The caster chooses the benefit when she casts the spell. You can use this ability a number of times per day equal to 3 + your Wisdom modifier."

[[entry]]
id = "ref/domain/magic"
anchor = "divine-vessel"
print = "Whenever you are the target of a divine spell, you can, as a swift action, grant each ally within 15 feet of you a divine boon. This boon grants a +2 bonus on the next attack roll, skill check, or ability check made before the end of their next turn. You can use this ability a number of times per day equal to 3 + your Wisdom modifier."

[[entry]]
id = "ref/domain/magic"
anchor = "alchemy-subdomain"
print = '''
**Example Apocrypha (Qi Zhong):** Just as the samsarans of Zi Ha know that they will be reborn to perform more good deeds, so too can their alchemists store divine power through the transmutation and rebirth of mundane elements in simple tonics. More than a millennium ago, a sect of Qi Zhong's faithful began combining their god's healing magic with the enduring science of alchemy. In the intervening years, they have codified their composite art in the five scrolls known as The Five-Spoked Cycle, now in its 22nd official revision.

**Associated Domains:** Artifice, Magic.

**Associated Deities:** Brigh, Haagenti, Norgorber (Artifice only), Orgesh (Magic only), Qi Zhong.

**Replacement Power:** The following granted power replaces the artificer's touch power of the Artifice domain or the hand of the acolyte power of the Magic domain.

**Divine Alchemy (Su):** You can perform a 1-minute ritual that infuses a flask of water with one of your prepared spells, creating an improvised potion that lasts until consumed or the next time you prepare spells. You can use this ability only with spells that target one or more creatures, and the maximum spell level you can infuse in this way is equal to 1 + 1 for every 4 cleric levels you have. These potions are treated as [alchemist](ref/class/alchemist) extracts for the purpose of your domain spells. You can use this ability a number of times per day equal to 3 + your Wisdom modifier.

**Replacement Domain Spells:** 2nd—_touch injection_, 4th—_amplify elixir_, 6th—_delayed consumption_.'''

