anchor = "prophecy-school"
print = '''
Prophets who specialize in arcane magic often claim specialty in manipulating the powers of luck to their advantage. This follows the rules for focused arcane schools found on page 143 of the _Pathfinder RPG Advanced Player's Guide_.

**Associated School:** Divination.

