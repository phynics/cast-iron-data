[[entry]]
id = "ref/domain/madness"
anchor = "deity"
print = "Lamashtu."

[[entry]]
id = "ref/domain/madness"
anchor = "granted-powers"
print = "You embrace the madness that lurks deep in your heart, and can unleash it to drive your foes insane or to sacrifice certain abilities to hone others."

[[entry]]
id = "ref/domain/madness"
anchor = "vision-of-madness"
print = "You can give a creature a _vision of madness_ as a melee touch attack. Choose one of the following: attack rolls, saving throws, or skill checks. The target receives a bonus to the chosen rolls equal to 1/2 your cleric level (minimum +1) and a penalty to the other two types of rolls equal to 1/2 your cleric level (minimum -1). This effect fades after 3 rounds. You can use this ability a number of times per day equal to 3 + your Wisdom modifier."

[[entry]]
id = "ref/domain/madness"
anchor = "aura-of-madness"
print = "At 8th level, you can emit a 30-foot aura of madness for a number of rounds per day equal to your cleric level. Enemies within this aura are affected by _[confusion](ref/spell/confusion)_ unless they make a Will save with a DC equal to 10 + 1/2 your cleric level + your Wisdom modifier. The _confusion_ effect ends immediately when the creature leaves the area or the aura expires. Creatures that succeed on their saving throw are immune to this aura for 24 hours. These rounds do not need to be consecutive."

[[entry]]
id = "ref/domain/madness"
anchor = "domain-spells"
print = "1st—_lesser confusion_, 2nd—_touch of idiocy_, 3rd—_rage_, 4th—_confusion_, 5th—_nightmare_, 6th—_phantasmal killer_, 7th—_insanity_, 8th—_scintillating pattern_, 9th—_weird_."

[[entry]]
id = "ref/domain/madness"
anchor = "insane-focus"
print = "You can touch a willing creature as a standard action, granting it a +4 bonus on all saving throws made against mind-affecting effects and immunity to confusion. This bonus lasts for 1 minute. If the creature fails a saving throw against a mind-affecting effect during this period, it loses its immunity to confusion and is immediately [confused](ref/misc/confused) for one round. You can use this ability a number of times per day equal to 3 + your Wisdom modifier."

[[entry]]
id = "ref/domain/madness"
anchor = "fearful-touch"
print = "As a standard action, you can make a melee touch attack against a creature, causing it to experience terrible hallucinations for 1 round. During this time, the creature loses any immunity to fear effects it might possess and takes a -2 penalty on attack rolls made against you. In addition, the creature takes a penalty on Will saves made against fear effects equal to 1/2 your cleric level (minimum -1). This power is a mind-affecting effect. You can use this ability for a number of times per day equal to 3 + your Wisdom modifier."

[[entry]]
id = "ref/domain/madness"
anchor = "dawning-realization"
print = "At 8th level, you can impart a shared vision of unfathomable ineffability to a living creature you touch as a standard action, after which your turn immediately ends. You are [dazed](ref/misc/dazed) and the target [confused](ref/misc/confused) for 1 round by what you both learn. On the following round, you are both [staggered](ref/misc/staggered) for 1 round by the ramifications of your discovery. On the third round, you are confused and the target dazed for 1 round as you attempt to regain your bearings. Each round, the target can attempt a Will save with a DC equal to 10 + 1/2 your cleric level + your Wisdom modifier to negate that round's effects for both of you, though the effect does not end until the end of the third round. This is a mind-affecting effect that you can use a number of times per day equal to 1/2 your class level."

[[entry]]
