[[entry]]
id = "ref/domain/evil"
anchor = "consume-the-enemy"
print = "As a full-round action that is considered an [evil](ref/spelldef/evil) act and provokes attacks of opportunity, you can bite a helpless living or freshly killed creature, dealing 1d3 points of damage. By consuming the creature's flesh, you gain a +1 profane bonus on saving throw DCs for all spells, spell-like abilities, and supernatural abilities you use against creatures of the same type (and subtype, if humanoid or outsider) as the cannibalized creature. This effect lasts for a number of minutes equal to 1/2 your cleric level or until you use this ability against a different creature. At 5th, 10th, 15th, and 20th level, this bonus increases by 1 (+5 maximum). You can use this ability a number of times per day equal to 3 + your Wisdom modifier."

[[entry]]
id = "ref/domain/evil"
anchor = "spark-malfeasance"
print = "At 8th level, you can awaken the sinful desires of a target within 30 feet with a ranged touch attack. The target suffers extreme guilt and is [sickened](ref/misc/sickened) for a number of rounds equal to 1/2 your cleric level. To end the effect earlier, the target can willingly commit an evil act (if it is of good alignment) or attempt a Will save (DC = 10 + 1/2 your cleric level + your Wisdom modifier) at the beginning of its turn each round. Creatures that succeed at their saving throws are immune to this ability for 24 hours. You can use this ability once per day at 8th level, and an additional time per day for every 4 levels beyond 8th."

[[entry]]
id = "ref/domain/evil"
anchor = "whispering-evil"
print = "At 8th level, as a standard action, you can whisper a hypnotizing litany of empty promises. Each enemy within a 30-foot [emanation](ref/misc/emanation) that can hear you must succeed on a Will saving throw or become [fascinated](ref/misc/fascinated) for as long as you continue the litany. You can use this power a number of rounds per day equal to your cleric level, but these rounds do not need to be consecutive. This is a mind-affecting effect."

[[entry]]
