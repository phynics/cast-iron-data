[[entry]]
id = "ref/domain/earth"
anchor = "petrification-subdomain"
print = '''
**Example Apocrypha (Soralyon):** Magnimar is famous for its monuments, many of which impart blessings upon the city's citizens. A faction of Soralyon's worshipers engage in (or have already undergone esoteric rituals to transform themselves and any who request the honor into new monuments. Several copies of their recently recorded philosophies entitled _We Stand Unblinking_ have begun circulating the city. The modest folio suggests that some catastrophe in the distant future will threaten all of Golarion, at which point Soralyon's true faithful will awaken from stone to protect Golarion with their lives.

**Associated Domain:** Earth.

**Associated Deities:** Ayrzul, Minderhal, Soralyon, Xoveron.

**Replacement Power:** The following granted power replaces the acid dart power of the Earth domain.

**Fossil Form (Su):** At the beginning of your turn as a swift action, you can infuse your flesh with minerals, granting you cumbersome security. Until the beginning of your next turn, you are [staggered](ref/misc/staggered), gain [hardness](ref/umr/hardness) 2, and gain a +2 bonus on saving throws against petrification. This hardness increases by 2 and your saving throw bonus increases by 1 for every 4 cleric levels you have. You can use this ability a number of times per day equal to 3 + your Wisdom modifier.

**Replacement Domain Spells:** 4th—_calcific touch_, 5th—_stoneskin_, 6th—_flesh to stone_, 8th—_statue_.'''

