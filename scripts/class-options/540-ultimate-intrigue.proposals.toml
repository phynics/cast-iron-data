[[entry]]
id = "ref/vigtalent/inspired-vigilante"
anchor = "heavy-training"
print = "The vigilante gains Heavy Armor Proficiency as a bonus feat, if he does not have that feat already. The armor skin vigilante talent also applies to heavy armor. At 16th level, if the vigilante has the armor skin vigilante talent, he can move at full speed in heavy armor. Only an avenger vigilante can select this talent."

[[entry]]
id = "ref/vigtalent/inspired-vigilante"
anchor = "hide-in-plain-sight"
print = "The vigilante can use Stealth to hide even when being observed. As long as he is within 10 feet of dim light (his own shadow doesn't count), he can hide without anything to actually hide behind. Only a stalker vigilante of at least 8th level can select this talent."

[[entry]]
id = "ref/vigtalent/inspired-vigilante"
anchor = "inspired-vigilante"
print = "The vigilante's powers of deduction are far beyond the norm. This ability functions similarly to the [investigator's](ref/class/investigator) inspiration ability, but the vigilante's inspiration pool is equal to his class level (do not add his Intelligence modifier), the vigilante can never use this ability without expending a use of inspiration, and it doesn't count as inspiration for any effects that interact with or require the inspiration class feature."

[[entry]]
id = "ref/vigtalent/inspired-vigilante"
anchor = "leave-an-opening"
print = "The vigilante's hidden strike leaves an unbalancing opening in a foe's defenses, setting up the foe to be attacked again. At the beginning of the foe's next turn, if the vigilante threatens the foe, the foe provokes an attack of opportunity from the vigilante. Multiple attacks against the same foe don't create multiple attacks of opportunity in the same round (but attacks against several foes can cause each to provoke one attack of opportunity). Only a stalker vigilante can select this talent."

[[entry]]
id = "ref/vigtalent/inspired-vigilante"
anchor = "lethal-grace"
print = "The vigilante combines strength and speed into incredibly deadly attacks. He gains Weapon Finesse as a bonus feat, and if he already has the Weapon Finesse feat, he can immediately swap it for another feat for which he qualified at the level he chose Weapon Finesse. When using Weapon Finesse to make a melee attack using his Dexterity bonus on attack rolls and his Strength bonus on damage rolls, he also adds half his vigilante level on damage rolls. This bonus damage is not reduced or increased if the vigilante is wielding a weapon two-handed or in an off-hand."

[[entry]]
id = "ref/vigtalent/inspired-vigilante"
anchor = "living-shield"
print = "As an immediate action whenever the vigilante is grappling a creature and is targeted by an attack, he can attempt a combat maneuver check against the target of his grapple (this combat maneuver check doesn't count as a grapple combat maneuver check). If he succeeds, the creature he is grappling becomes the new target of the attack. If the check fails, the creature escapes the grapple and the vigilante is the target of the attack as normal. This ability must be used after the attack is declared against the vigilante, but before the attack is made and the results revealed."

[[entry]]
id = "ref/vigtalent/inspired-vigilante"
anchor = "mad-rush"
print = "Whenever the vigilante charges, he can make a full attack. Whenever he uses this ability, he takes a -4 penalty to his AC until the start of his next turn (in addition to the AC penalty for charging). Only an avenger vigilante of at least 12th level can select this talent."

[[entry]]
id = "ref/vigtalent/inspired-vigilante"
anchor = "mighty-ambush"
print = "Once per round, when the vigilante succeeds at a hidden strike, he can instantly drop the damaged enemy unconscious for 1d4 rounds. A successful Fortitude saving throw negates this effect (DC = 10 + 1/2 the vigilante's class level + the higher of the vigilante's Strength and Dexterity modifiers). Whether or not a creature's saving throw is successful, it can't be affected by that vigilante's mighty ambush again for 24 hours. Only a stalker vigilante of at least 10th level can select this talent."

[[entry]]
id = "ref/vigtalent/inspired-vigilante"
anchor = "nothing-can-stop-me"
print = "Once per round, while the vigilante is moving, he can make one attack as a free action against an unattended object in the way of his path, such as a door or table. If his attack deals enough damage to destroy the object, he can continue to move. If he doesn't destroy the object, his move ends. This attack is made as part of his move action and doesn't count against his attacks this round. If his attack inadvertently targets a creature (such as a mimic), it automatically misses and his move ends (although he can still attack the creature as normal at the end of his movement). Only an avenger vigilante can select this talent."

[[entry]]
id = "ref/vigtalent/inspired-vigilante"
anchor = "perfect-fall"
print = "As long as there is a wall or another surface within arm's reach, the vigilante never takes falling damage. Even if no surface is available, he takes only half damage from falling and lands on his feet."

[[entry]]
id = "ref/vigtalent/inspired-vigilante"
anchor = "perfect-vulnerability"
print = '''
As a standard action, the vigilante can cleverly strike his foe where that foe is weakest. This attack targets the foe's touch AC, and the foe is denied her Dexterity bonus against the attack. Once a foe has been the target of perfect vulnerability, she can't be the target of the same vigilante's perfect vulnerability for 24 hours.

A vigilante must be at least 8th level to select this talent.'''

[[entry]]
id = "ref/vigtalent/inspired-vigilante"
anchor = "pull-into-the-shadows"
print = '''
As a full-round action, the vigilante can move up to his speed toward an opponent who is unaware of his presence (or who considers him an ally) and make a single attack against that opponent.

If the attack hits, he can attempt a drag combat maneuver (_Advanced Player's Guide_ 321) against that enemy with a +4 bonus and without provoking an attack of opportunity. If the drag succeeds, the vigilante doesn't need to have enough movement remaining to move with the enemy. The vigilante can't use this ability on a true ally or a willing target.'''

[[entry]]
id = "ref/vigtalent/inspired-vigilante"
anchor = "returning-weapon"
print = "The vigilante has a signature type of thrown weapon that returns to him. Choose a type of thrown weapon, such as throwing axes. Whenever the vigilante uses that type of weapon, it automatically returns as if it had the _returning_ property. At 14th level, if the vigilante chose a type of thrown weapon that is treated as ammunition, such as shuriken, and buys a set of 50 magic ammunition of that type, he automatically replenishes them at no cost and never runs out. If he chose a non-ammunition thrown weapon instead, he can apply the magical properties of the first weapon he throws in a round to any nonmagical thrown weapons of that type he throws that round. This allows him to make a full attack with the benefits of his magical thrown weapon, even though it only returns next round."

[[entry]]
id = "ref/vigtalent/inspired-vigilante"
anchor = "rogue-talent"
print = "The vigilante gains a single rogue talent (not an advanced talent) of his choice. If he selects a rogue talent marked with an asterisk (\\*), that talent applies to his hidden strikes instead of to sneak attacks, and the talent counts as a stalker vigilante talent with an asterisk (\\*) for the limitation of only one applying to a given hidden strike. Only a stalker vigilante can select this talent."

[[entry]]
id = "ref/vigtalent/inspired-vigilante"
anchor = "rooftop-infiltrator"
print = "The vigilante gains a climb speed equal to half his base speed, which increases to his full base speed when climbing a rope."

[[entry]]
id = "ref/vigtalent/inspired-vigilante"
anchor = "shadow-s-sight"
print = "The vigilante gains low-light vision and darkvision 60 feet. If he already had darkvision, its range increases by 30 feet."

[[entry]]
id = "ref/vigtalent/inspired-vigilante"
anchor = "shadow-s-speed"
print = "The vigilante's base speed increases by 10 feet. At 10th level, it increases by an additional 10 feet."

[[entry]]
id = "ref/vigtalent/inspired-vigilante"
anchor = "shield-of-blades"
print = "The vigilante's wild attacks allow him to block his foes' counterattacks. He gains Power Attack as a bonus feat. If he already has the Power Attack feat, he can immediately swap it for another feat for which he qualified at the level he chose Power Attack. When he takes an attack or full attack action, if he uses Power Attack on every attack to make melee attacks that use his Strength bonus on attack rolls, he gains a shield bonus to his AC until his next turn equal to his penalty on attack rolls from Power Attack. This bonus applies only if he actually takes that penalty on at least one of the attack rolls."

[[entry]]
id = "ref/vigtalent/inspired-vigilante"
anchor = "shield-of-fury"
print = "The vigilante gains Improved Shield Bash as a bonus feat. If he already has the Improved Shield Bash feat, he can immediately swap it for another feat for which he qualified at the level he chose Improved Shield Bash. In addition, if he is at least 6th level, he is treated as if he has the Two-Weapon Fighting feat as long as one of the weapons used is a shield. This allows him to take feats that require Two-Weapon Fighting as a prerequisite without meeting the Two-Weapon Fighting or Dexterity prerequisites, but these feats only apply while he is wielding a shield as one of his weapons (unless he takes Two-Weapon Fighting as normal, in which case this restriction is lifted)."

[[entry]]
id = "ref/vigtalent/inspired-vigilante"
anchor = "signature-weapon"
print = "The vigilante must select one type of weapon (such as longsword or crossbow) when he gains this talent. He gains Weapon Focus as a bonus feat for his selected weapon type. If he already has the Weapon Focus feat with the selected weapon, he can immediately swap it for another feat for which he qualified at the level he chose Weapon Focus in the selected weapon. At 8th level, he also gains Weapon Specialization as a bonus feat for his selected weapon. He doesn't have to meet any of the prerequisites for these feats. Only an avenger vigilante can select this talent."

[[entry]]
id = "ref/vigtalent/inspired-vigilante"
anchor = "silent-dispatch"
print = "When the vigilante ambushes an enemy or enemies unaware of his presence, he can attempt a Stealth check at a -5 penalty. The result indicates the DC of Perception checks to hear the vigilante's attacks until an opponent's first action, when the DC returns to the normal -10 for hearing battle. Other enemies present can still see the attack; this talent only prevents the sounds of battle from alerting others."

[[entry]]
id = "ref/vigtalent/inspired-vigilante"
anchor = "sniper"
print = "The vigilante can deal hidden strike damage with ranged attacks at any distance, rather than within 30 feet. Only a stalker vigilante of at least 6th level can select this talent."

[[entry]]
id = "ref/vigtalent/inspired-vigilante"
anchor = "stalker-sense"
print = "The vigilante has a sense for danger. He always acts on the surprise round. At 6th level, he gains uncanny dodge, and at 12th level, he gains improved uncanny dodge. Only a stalker can select this talent."

[[entry]]
id = "ref/vigtalent/inspired-vigilante"
anchor = "strike-the-unseen"
print = "The vigilante gains Blind-Fight as a bonus feat. He can also deal hidden strike damage against targets with total concealment. At 10th level, he gains Improved Blind-Fight as a bonus feat and can deal all types of precision damage against targets with concealment or total concealment. At 16th level, he gains Greater Blind-Fight as a bonus feat. The vigilante does not have to meet the prerequisites for either Improved Blind-Fight or Greater Blind-Fight to gain these feats with this talent."

[[entry]]
id = "ref/vigtalent/inspired-vigilante"
anchor = "sucker-punch"
print = "Whenever the vigilante attacks a foe that is unaware of his presence (or who views him as an ally), and the attack deals nonlethal damage, the attack deals an additional 1d6 points of nonlethal damage. This additional damage increases by 1d6 at each of 6th, 12th, and 18th levels. Only an avenger vigilante can select this talent."

[[entry]]
id = "ref/vigtalent/inspired-vigilante"
anchor = "sure-footed"
print = "The vigilante can move at full speed while using the Stealth and Acrobatics skills without penalty. At 8th level, he can move at full speed across difficult terrain."

[[entry]]
id = "ref/vigtalent/inspired-vigilante"
anchor = "surprise-strike"
print = "The vigilante gains a greater advantage when his foe is unable to defend herself. Whenever he makes an attack against a foe that is denied her Dexterity bonus to AC, he gains a +1 bonus on his attack roll. This bonus increases to +2 at 8th level and to +3 at 16th level."

[[entry]]
id = "ref/vigtalent/inspired-vigilante"
anchor = "throat-jab"
print = "The vigilante's hidden strike jabs his opponent in the throat, preventing that opponent from speaking until the vigilante's next turn. (If the vigilante uses this ability on the surprise round, it lasts until the end of his first full turn after the surprise round.) This prevents the target from calling out for help, using spells with verbal components, or doing anything else that requires speaking. The target cannot be affected by that vigilante's throat jab again for 24 hours. Only a stalker vigilante of at least 4th level can select this talent."

[[entry]]
id = "ref/vigtalent/inspired-vigilante"
anchor = "twisting-fear"
print = "Whenever the vigilante causes an opponent to gain the shaken, frightened, or panicked condition, that opponent takes an amount of nonlethal damage equal to the vigilante's reduced hidden strike damage, as the stress wears upon its body. A creature can't take damage from twisting fear more than once per round. Panicked creatures that take damage from twisting fear are too winded even to scream as they flee in terror. Only a stalker vigilante can select this talent."

[[entry]]
id = "ref/vigtalent/inspired-vigilante"
anchor = "unexpected-strike"
print = "The vigilante gains Quick Draw as a bonus feat. At 8th level, he can draw hidden weapons as a swift action (instead of a move action)."

[[entry]]
id = "ref/vigtalent/inspired-vigilante"
anchor = "unkillable"
print = "The vigilante gains Diehard as a bonus feat, though he does not have to meet the prerequisites for this feat. At 6th level, he doesn't lose hit points when he takes a standard action while disabled. At 12th level, when he would die from hit point damage, he remains alive for 1 round before dying (and if his hit points rise above a negative amount equal to his Constitution score before that round is over, he doesn't die). At 18th level, he is no longer disabled at negative hit points and can take a full round's worth of actions. Only an avenger vigilante can select this talent."

[[entry]]
id = "ref/vigtalent/inspired-vigilante"
anchor = "up-close-and-personal"
print = '''
When the vigilante attempts an Acrobatics check to move through an opponent's space during a move action, he can attempt a single melee attack against that opponent as a swift action. If the Acrobatics check succeeds, this attack applies the vigilante's hidden strike damage as if the foe were unaware of the vigilante. Otherwise, the vigilante applies the hidden strike damage he would deal if the target were denied its Dexterity bonus to AC. Only a stalker vigilante of at least 4th level can select this talent.

_Vital Punishment (Ex)_: The vigilante gains Vital Strike as a bonus feat, though he does not have to meet the prerequisites for this feat. Once per round, before he makes an attack of opportunity, he can declare it to be a vital punishment. If the attack hits, the vigilante can apply the Vital Strike feat. The vigilante can apply the Improved Vital Strike or Greater Vital Strike feat as his vital punishment instead if he later gains those feats. A vigilante must be at least 6th level to select this talent.'''

[[entry]]
id = "ref/vigtalent/inspired-vigilante"
anchor = "unshakable"
print = "Starting at 3rd level, a vigilante adds his class level to the DC of any attempts to Intimidate him."

[[entry]]
id = "ref/vigtalent/inspired-vigilante"
anchor = "startling-appearance"
print = "At 5th level, a vigilante learns to use the element of surprise to his advantage, startling foes that are unaware of his presence. Whenever a vigilante with this ability attempts an attack against a foe that is completely unaware of the vigilante's presence (usually due to Stealth or invisibility), the foe is treated as flat-footed for the rest of the vigilante's turn (uncanny dodge or a similar ability prevents this effect unless the vigilante is at least 4 levels higher than the foe with uncanny dodge). The foe also takes a -4 penalty on attacks made against the vigilante until the start of the vigilante's next turn."

[[entry]]
id = "ref/vigtalent/inspired-vigilante"
anchor = "frightening-appearance"
print = '''
At 11th level, whenever a vigilante with this ability makes an attack against a foe that is unaware of the vigilante's presence (see startling appearance above), the vigilante can, as a free action, attempt an Intimidate check to demoralize the target of his attack and any enemies within 10 feet who can see the attack. This check is attempted before the attack roll against the foe is made and resolved. The vigilante rolls only one Intimidate check and applies the result to all the targets. If the check succeeds against the target of the vigilante's attack, that foe is also frightened for 1 round, in addition to being shaken as normal, unless the foe succeeds at a Will save (DC = 10 + 1/2 the vigilante's class level + his Charisma modifier).

Once a creature has been the target of this ability (either as the target of the attack or as a nearby creature, regardless of whether or not it was successful), it is immune to that vigilante's frightening appearance for 24 hours. This effect is in addition to the bonuses gained from the startling appearance ability. This is a mind-affecting fear effect.'''

[[entry]]
id = "ref/vigtalent/inspired-vigilante"
anchor = "stunning-appearance"
print = '''
At 17th level, a vigilante can leave his foes unable to respond when he appears. Whenever a vigilante with this ability makes a successful attack against a foe that is unaware of the vigilante's presence (see startling appearance), the foe must make a successful Will save (DC = 10 + 1/2 the vigilante's class level + his Charisma modifier) or be stunned until the end of the vigilante's next turn. If the creature has more HD than the vigilante's class level, it receives a +4 circumstance bonus on this save.

This ability is in addition to the effects of startling appearance and frightening appearance. Once a creature has been the target of this ability (regardless of whether or not the saving throw is successful), it is immune to that vigilante's stunning appearance for 24 hours. This is a mind-affecting fear effect.'''

[[entry]]
id = "ref/vigtalent/inspired-vigilante"
anchor = "vengeance-strike"
print = "At 20th level, a vigilante can study a target to strike more viciously. He can spend up to 5 standard actions, which all must be in consecutive rounds. On the following round, he can make a vengeance strike against the studied creature. The target must remain unaware of the vigilante's presence (or not see him as a threat) until the attack. For each round spent studying the target, the vigilante grants himself one of the following benefits on his vengeance strike: gain a +4 circumstance bonus on the attack roll, deal an additional 3d6 points of precision damage if he hits, or treat the attack roll as if it were 2 higher for the purposes of determining whether the attack hit or threatens a critical hit (to maximum effective roll of 20). Each round of study can be spent in a different way or the same way (they stack with each other), but each round of study must be allocated before the attack roll is made. If the vigilante is an avenger, he automatically confirms any critical hits threatened by his vengeance strike. If the vigilante is a stalker and would normally be able to add a special effect from a vigilante talent with an asterisk (\\*) to this attack, he can instead add two special effects to his vengeance strike."

[[entry]]
id = "ref/vigtalent/inspired-vigilante"
anchor = "vigilante-favored-class-options"
print = "The following favored class bonuses are available to vigilantes who come from the various core races. Each of these rewards replaces the normal reward for having a level in a favored class."

[[entry]]
id = "ref/vigtalent/inspired-vigilante"
anchor = "dwarves"
print = "Increase the bonus from social grace on Craft skills by +1/2."

[[entry]]
id = "ref/vigtalent/inspired-vigilante"
anchor = "elves"
print = "Gain +1/3 on all Acrobatics, Climb, and Stealth checks in forested areas."

[[entry]]
id = "ref/vigtalent/inspired-vigilante"
anchor = "gnomes"
print = "Gain +1/2 on Bluff checks when attempting to tell a lie that would be true from the point of view of the vigilante's current identity."

[[entry]]
id = "ref/vigtalent/inspired-vigilante"
anchor = "half-elves"
print = "Gain +1/2 on the Disguise bonus from seamless guise."

[[entry]]
id = "ref/vigtalent/inspired-vigilante"
anchor = "half-orcs"
print = "Add 1/2 to the DC increase from unshakable."

[[entry]]
id = "ref/vigtalent/inspired-vigilante"
anchor = "half-lings"
print = "Gain 1/6 of a new social talent."

[[entry]]
id = "ref/vigtalent/inspired-vigilante"
anchor = "humans"
print = "Gain +1/2 on the Disguise bonus provided by seamless guise."

[[entry]]
id = "ref/vigtalent/leave-an-opening"
anchor = "leave-an-opening"
print = "A stalker vigilante can apply only one talent marked with an asterisk (\\*) to a given hidden strike, and only when that hidden strike is dealt against a foe that is unaware of the stalker vigilante’s presence (or who considers him an ally), unless otherwise noted.\n\nThe vigilante's hidden strike leaves an unbalancing opening in a foe's defenses, setting up the foe to be attacked again. At the beginning of the foe's next turn, if the vigilante threatens the foe, the foe provokes an attack of opportunity from the vigilante. Multiple attacks against the same foe don't create multiple attacks of opportunity in the same round (but attacks against several foes can cause each to provoke one attack of opportunity). Only a [stalker vigilante](ref/class/vigilante#stalker) can select this talent."

[[entry]]
id = "ref/vigtalent/lethal-grace"
anchor = "lethal-grace"
print = "The vigilante combines strength and speed into incredibly deadly attacks. He gains [Weapon Finesse](ref/feat/weapon-finesse) as a bonus feat, and if he already has the Weapon Finesse feat, he can immediately swap it for another feat for which he qualified at the level he chose Weapon Finesse. When using Weapon Finesse to make a melee attack using his Dexterity bonus on attack rolls and his Strength bonus on damage rolls, he also adds half his vigilante level on damage rolls. This bonus damage is not reduced or increased if the vigilante is wielding a weapon two-handed or in an off-hand."

[[entry]]
id = "ref/vigtalent/living-shield"
anchor = "living-shield"
print = "As an immediate action whenever the vigilante is grappling a creature and is targeted by an attack, he can attempt a combat maneuver check against the target of his [grapple](ref/rule/grapple) (this combat maneuver check doesn't count as a grapple combat maneuver check). If he succeeds, the creature he is grappling becomes the new target of the attack. If the check fails, the creature escapes the grapple and the vigilante is the target of the attack as normal. This ability must be used after the attack is declared against the vigilante, but before the attack is made and the results revealed."

[[entry]]
id = "ref/vigtalent/mad-rush"
anchor = "mad-rush"
print = "Whenever the vigilante [charges](ref/rule/charge), he can make a full attack. Whenever he uses this ability, he takes a -4 penalty to his AC until the start of his next turn (in addition to the AC penalty for charging). Only an [avenger vigilante](ref/class/vigilante#avenger) of at least 12th level can select this talent."

[[entry]]
id = "ref/vigtalent/mighty-ambush"
anchor = "mighty-ambush"
print = "A stalker vigilante can apply only one talent marked with an asterisk (\\*) to a given hidden strike, and only when that hidden strike is dealt against a foe that is unaware of the stalker vigilante’s presence (or who considers him an ally), unless otherwise noted.\n\nOnce per round, when the vigilante succeeds at a hidden strike, he can instantly drop the damaged enemy [unconscious](ref/misc/unconscious) for 1d4 rounds. A successful Fortitude saving throw negates this effect (DC = 10 + 1/2 the vigilante's class level + the higher of the vigilante's Strength and Dexterity modifiers). Whether or not a creature's saving throw is successful, it can't be affected by that vigilante's mighty ambush again for 24 hours. Only a [stalker vigilante](ref/class/vigilante#stalker) of at least 10th level can select this talent."

[[entry]]
id = "ref/vigtalent/nothing-can-stop-me"
anchor = "nothing-can-stop-me"
print = "Once per round, while the vigilante is moving, he can make one attack as a free action against an unattended object in the way of his path, such as a door or table. If his attack deals enough damage to destroy the object, he can continue to move. If he doesn't destroy the object, his move ends. This attack is made as part of his move action and doesn't count against his attacks this round. If his attack inadvertently targets a creature (such as a [mimic](ref/monster/mimic)), it automatically misses and his move ends (although he can still attack the creature as normal at the end of his movement). Only an [avenger vigilante](ref/class/vigilante#avenger) can select this talent."

[[entry]]
id = "ref/vigtalent/perfect-fall"
anchor = "perfect-fall"
print = "As long as there is a wall or another surface within arm's reach, the vigilante never takes falling damage. Even if no surface is available, he takes only half damage from falling and lands on his feet."

[[entry]]
id = "ref/vigtalent/perfect-vulnerability"
anchor = "perfect-vulnerability"
print = '''
As a standard action, the vigilante can cleverly strike his foe where that foe is weakest. This attack targets the foe's touch AC, and the foe is denied her Dexterity bonus against the attack. Once a foe has been the target of perfect vulnerability, she can't be the target of the same vigilante's perfect vulnerability for 24 hours.

A [vigilante](ref/class/vigilante) must be at least 8th level to select this talent.'''

[[entry]]
id = "ref/vigtalent/pull-into-the-shadows"
anchor = "pull-into-the-shadows"
print = '''
As a full-round action, the vigilante can move up to his speed toward an opponent who is unaware of his presence (or who considers him an ally) and make a single attack against that opponent.

If the attack hits, he can attempt a [drag](ref/rule/drag) combat maneuver against that enemy with a +4 bonus and without provoking an attack of opportunity. If the drag succeeds, the vigilante doesn't need to have enough movement remaining to move with the enemy. The vigilante can't use this ability on a true ally or a willing target.'''

[[entry]]
id = "ref/vigtalent/returning-weapon"
anchor = "returning-weapon"
print = "The vigilante has a signature type of thrown weapon that returns to him. Choose a type of thrown weapon, such as throwing axes. Whenever the vigilante uses that type of weapon, it automatically returns as if it had the _[returning](ref/magic-enh/returning)_ property. At 14th level, if the vigilante chose a type of thrown weapon that is treated as ammunition, such as [shuriken](ref/eq-weapon/shuriken), and buys a set of 50 magic ammunition of that type, he automatically replenishes them at no cost and never runs out. If he chose a non-ammunition thrown weapon instead, he can apply the magical properties of the first weapon he throws in a round to any nonmagical thrown weapons of that type he throws that round. This allows him to make a full attack with the benefits of his magical thrown weapon, even though it only returns next round."

[[entry]]
id = "ref/vigtalent/rogue-talent"
anchor = "rogue-talent"
print = "The vigilante gains a single rogue talent (not an advanced talent) of his choice. If he selects a rogue talent marked with an asterisk (\\*), that talent applies to his hidden strikes instead of to sneak attacks, and the talent counts as a stalker vigilante talent with an asterisk (\\*) for the limitation of only one applying to a given hidden strike. Only a [stalker vigilante](ref/class/vigilante#stalker) can select this talent."

[[entry]]
id = "ref/vigtalent/rooftop-infiltrator"
anchor = "rooftop-infiltrator"
print = "The vigilante gains a climb speed equal to half his base speed, which increases to his full base speed when climbing a rope."

[[entry]]
id = "ref/vigtalent/shadows-sight"
anchor = "shadow-s-sight"
print = "The vigilante gains [low-light vision](ref/rule/low-light-vision) and [darkvision](ref/rule/darkvision) 60 feet. If he already had darkvision, its range increases by 30 feet."

[[entry]]
id = "ref/vigtalent/shadows-speed"
anchor = "shadow-s-speed"
print = "The vigilante's base speed increases by 10 feet. At 10th level, it increases by an additional 10 feet."

[[entry]]
id = "ref/vigtalent/shield-of-blades"
anchor = "shield-of-blades"
print = "The vigilante's wild attacks allow him to block his foes' counterattacks. He gains [Power Attack](ref/feat/power-attack) as a bonus feat. If he already has the Power Attack feat, he can immediately swap it for another feat for which he qualified at the level he chose Power Attack. When he takes an attack or full attack action, if he uses Power Attack on every attack to make melee attacks that use his Strength bonus on attack rolls, he gains a shield bonus to his AC until his next turn equal to his penalty on attack rolls from Power Attack. This bonus applies only if he actually takes that penalty on at least one of the attack rolls."

[[entry]]
id = "ref/vigtalent/shield-of-fury"
anchor = "shield-of-fury"
print = "The vigilante gains [Improved Shield Bash](ref/feat/improved-shield-bash) as a bonus feat. If he already has the Improved Shield Bash feat, he can immediately swap it for another feat for which he qualified at the level he chose Improved Shield Bash. In addition, if he is at least 6th level, he is treated as if he has the [Two-Weapon Fighting](ref/feat/two-weapon-fighting) feat as long as one of the weapons used is a shield. This allows him to take feats that require Two-Weapon Fighting as a prerequisite without meeting the Two-Weapon Fighting or Dexterity prerequisites, but these feats only apply while he is wielding a shield as one of his weapons (unless he takes Two-Weapon Fighting as normal, in which case this restriction is lifted)."

[[entry]]
id = "ref/vigtalent/signature-weapon"
anchor = "signature-weapon"
print = "The vigilante must select one type of weapon (such as longsword or crossbow) when he gains this talent. He gains [Weapon Focus](ref/feat/weapon-focus) as a bonus feat for his selected weapon type. If he already has the Weapon Focus feat with the selected weapon, he can immediately swap it for another feat for which he qualified at the level he chose Weapon Focus in the selected weapon. At 8th level, he also gains [Weapon Specialization](ref/feat/weapon-specialization) as a bonus feat for his selected weapon. He doesn't have to meet any of the prerequisites for these feats. Only an [avenger vigilante](ref/class/vigilante#avenger) can select this talent."

[[entry]]
id = "ref/vigtalent/silent-dispatch"
anchor = "silent-dispatch"
print = "When the vigilante ambushes an enemy or enemies unaware of his presence, he can attempt a Stealth check at a -5 penalty. The result indicates the DC of Perception checks to hear the vigilante's attacks until an opponent's first action, when the DC returns to the normal -10 for hearing battle. Other enemies present can still see the attack; this talent only prevents the sounds of battle from alerting others."

[[entry]]
id = "ref/vigtalent/sniper"
anchor = "sniper"
print = "The vigilante can deal hidden strike damage with ranged attacks at any distance, rather than within 30 feet. Only a [stalker vigilante](ref/class/vigilante#stalker) of at least 6th level can select this talent."

[[entry]]
id = "ref/vigtalent/stalker-sense"
anchor = "stalker-sense"
print = "The vigilante has a sense for danger. He always acts on the surprise round. At 6th level, he gains [uncanny dodge](ref/ability/uncanny-dodge), and at 12th level, he gains [improved uncanny dodge](ref/ability/improved-uncanny-dodge). Only a stalker can select this talent."

[[entry]]
id = "ref/vigtalent/strike-the-unseen"
anchor = "strike-the-unseen"
print = "The vigilante gains [Blind-Fight](ref/feat/blind-fight) as a bonus feat. He can also deal hidden strike damage against targets with total [concealment](ref/rule/concealment). At 10th level, he gains [Improved Blind-Fight](ref/feat/improved-blind-fight) as a bonus feat and can deal all types of precision damage against targets with concealment or total concealment. At 16th level, he gains [Greater Blind-Fight](ref/feat/greater-blind-fight) as a bonus feat. The vigilante does not have to meet the prerequisites for either Improved Blind-Fight or Greater Blind-Fight to gain these feats with this talent."

[[entry]]
id = "ref/vigtalent/sucker-punch"
anchor = "sucker-punch"
print = "Whenever the vigilante attacks a foe that is unaware of his presence (or who views him as an ally), and the attack deals nonlethal damage, the attack deals an additional 1d6 points of nonlethal damage. This additional damage increases by 1d6 at each of 6th, 12th, and 18th levels. Only an [avenger vigilante](ref/class/vigilante#avenger) can select this talent."

[[entry]]
id = "ref/vigtalent/sure-footed"
anchor = "sure-footed"
print = "The vigilante can move at full speed while using the Stealth and Acrobatics skills without penalty. At 8th level, he can move at full speed across [difficult terrain](ref/rule/terrain-and-obstacles)."

[[entry]]
id = "ref/vigtalent/surprise-strike"
anchor = "surprise-strike"
print = "The vigilante gains a greater advantage when his foe is unable to defend herself. Whenever he makes an attack against a foe that is denied her Dexterity bonus to AC, he gains a +1 bonus on his attack roll. This bonus increases to +2 at 8th level and to +3 at 16th level."

