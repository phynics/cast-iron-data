# The printed text of the powers of the class options of the book, written ones included (the check reads an entry against it). Generated: never edit by hand.

[[entry]]
id = "ref/inquisition/crime"
anchor = "opening"
print = '''
as she wishes in increments of +2, but the enhancement bonus on any single ability score cannot exceed +4.

At 8th level, a skinshaper can imitate humanoid creatures even more accurately. She gains any of the following abilities that the form she assumes has: darkvision 90 feet, low-light vision, scent, climb 60 feet, fly 60 feet (good maneuverability), swim 60 feet, ferocity, orc ferocity, and hold breath. If the form she assumes has the aquatic subtype, she gains the aquatic subtype and the amphibious special quality.

At 12th level, a skinshaper can access the racial memory of the humanoid she is imitating. If the form she assumes has any of the following racial abilities, she gains those abilities: defensive training, hatred, poison use, sneak attack +2d6, stability, and weapon familiarity. Additionally, she can speak any racial languages of the chosen form.

At 16th level, a skinshaper gains the racial skill bonuses of the imitated humanoid, to a maximum of a +4 bonus on a given skill. The skinshaper cannot benefit from any variable racial skill bonuses associated with the chosen form (such as gnomes' racial bonus on any one Craft or Profession skill).

This ability replaces wild shape.'''

[[entry]]
id = "ref/inquisition/crime"
anchor = "flashmorph"
print = '''
At 13th level, a skinshaper learns to change her shape extremely quickly. She can use skinshaping as a swift action.

This ability replaces a thousand faces.'''

[[entry]]
id = "ref/inquisition/crime"
anchor = "urushiol-archetype"
print = "When an urushiol druid forms a bond with nature, it takes a vastly different form than for most druids. His body becomes increasingly toxic, allowing him to secrete a deadly poison through his pores."

[[entry]]
id = "ref/inquisition/crime"
anchor = "toxic-secretions"
print = '''
At 1st level, an urushiol's body becomes capable of producing a single dose of poison per day. At 3rd level and every 2 druid levels thereafter, the number of daily doses increases by 1, to a maximum of 10 doses at 19th level. The urushiol's daily doses are replenished when he regains his spells, but any of his weapons that are still poisoned with urushiol venom count against his daily limit. The urushiol is immune to his own poison and cannot accidentally poison himself when applying his own poison or attacking with a weapon coated with it. Regardless of the delivery method he chooses, his poison has the following base statistics.

_Urushiol Venom_: _type_ poison (varies); _save_ Fortitude negates; _frequency_ 1/round for 2 rounds; _effect_ 1d3 Strength damage; _cure_ 1 save. The save DC is equal to 10 + 1/2 the urushiol's level + his Wisdom modifier.

At 1st level, an urushiol can secrete this poison as a numbing injury poison on a natural weapon, unarmed strike, or manufactured weapon by spending 1 of his daily doses as a standard action. He must choose a natural weapon, unarmed strike, or manufactured weapon in his hand that deals piercing or slashing damage and that is not already poisoned or poisonous. The weapon remains poisoned until the urushiol scores a hit with it, the weapon leaves his possession for more than 1 round, or the poison is wiped away.

At 4th level, an urushiol's body becomes so saturated with poison that even his flesh is poisonous.

Whenever a creature damages the urushiol with a bite or swallow whole attack, the urushiol can release ingested poison into the creature by spending 1 of his daily doses as an immediate action.

At 7th level, an urushiol can spend 2 daily doses of his poison as a standard action to secrete a contact poison and coat one of his limbs with the secreted poison. The urushiol can deliver the poison by making a successful touch attack as a standard action, which can be part of the same standard action he used to secrete the poison. If the attack misses, the poison persists upon his limb throughout the subsequent rounds until he hits a target or touches something else with his poisoned limb.

At 11th level, an urushiol can spend 3 daily doses of his poison as a standard action to release a 20-foot-radius cloud of inhaled poison centered around him that lasts for 1 round.

At 14th level, an urushiol's venom changes in frequency to 1/round for 4 rounds. In addition, when using his urushiol venom, an urushiol can spend an extra dose of his poison to change the damage type of the poison to Dexterity damage or Constitution damage. He can use this alteration in combination with any of the other abilities. For example, he could spend a total of 3 doses to create a cloud of inhaled poison that deals Constitution damage.

This ability replaces nature bond and resist nature's lure.'''

[[entry]]
id = "ref/inquisition/crime"
anchor = "venom-immunity"
print = '''
An urushiol gains venom immunity at 4th level instead of 9th level.

This ability alters venom immunity.'''

[[entry]]
id = "ref/inquisition/crime"
anchor = "inquisitor"
print = "Steeped in the arts of subterfuge, deception, and misdirection, inquisitors are deadly warriors and spellcasters, capable of advancing their causes by any means possible. Whether they use disguises, exercise stealth, manipulate crime scenes, or root out secrets, these divine agents find ways to make themselves indispensable when their deities require intrigue and treacherous dealings."

[[entry]]
id = "ref/inquisition/crime"
anchor = "inquisitions"
print = "Inquisitions were first introduced on page 41 of _Pathfinder RPG Ultimate Magic_. An inquisition can be selected in place of a domain. The following inquisitions are available to any domain-using class, but inquisitions are typically weaker than domains for other classes because they don't grant domain spell slots or domain spells. If an inquisition's granted power calls for a saving throw, the DC of the save is equal to 10 + 1/2 a character's class level in the class that granted the inquisition + her Wisdom modifier. The character's caster level for these granted powers is equal to her character level in the class that granted the inquisition."

[[entry]]
id = "ref/inquisition/crime"
anchor = "deities"
print = "Calistria, Norgorber."

[[entry]]
id = "ref/inquisition/crime"
anchor = "granted-powers"
print = "Your connections to the criminal underworld run deeper than the physical, and your spiritual criminality grants you underhanded powers."

[[entry]]
id = "ref/inquisition/crime"
anchor = "criminal-minds"
print = "You can touch a creature and fill its mind with criminal impulses. This otherwise functions as per _[crime of opportunity](ref/spell/crime-of-opportunity)_ (see page 208), though a target that fails its saving throw and acts on an impulse gets those desires out of its system and becomes immune to the effects of your criminal minds ability for 24 hours. You can use this ability a number of times per day equal to 3 + your Wisdom modifier (minimum 1)."

[[entry]]
id = "ref/inquisition/crime"
anchor = "thief-s-soul"
print = "At 8th level, you gain [Improved Steal](ref/feat/improved-steal), [Greater Steal](ref/feat/greater-steal), and [Quick Steal](ref/feat/quick-steal) as bonus feats, even if you don't meet the prerequisites."

[[entry]]
id = "ref/inquisition/crime"
anchor = "deities"
print = "Calistria, Norgorber."

[[entry]]
id = "ref/inquisition/crime"
anchor = "granted-powers"
print = "You have learned to keep your own secrets close, and your enemies' secrets closer."

[[entry]]
id = "ref/inquisition/crime"
anchor = "detect-secrets"
print = "You have learned how to detect any of a creature's secrets, not just its thoughts. Whenever you cast _detect anxieties_ (see page 211), _detect desires_ (see page 211), or _detect thoughts_ or use any of those spells as a spell-like ability, you can choose to gain the effects of one of the other two spells instead. You are never overwhelmed by a target of these spells that has a high ability score."

[[entry]]
id = "ref/inquisition/crime"
anchor = "closed-book"
print = "At 8th level, it becomes difficult for your foes to unveil your secrets. You are constantly under the effect of _nondetection_, as if you cast the spell on yourself."

[[entry]]
id = "ref/inquisition/crime"
anchor = "cloaked-wolf-archetype"
print = "Some inquisitors are adept at appearing harmless until they throw off their unassuming facades and take their enemies by surprise."

[[entry]]
id = "ref/inquisition/crime"
anchor = "class-skills"
print = '''
A cloaked wolf adds Sleight of Hand to her list of class skills, instead of Intimidate.

This alters the inquisitor's class skills.'''

[[entry]]
id = "ref/inquisition/crime"
anchor = "lure-prey"
print = '''
Cloaked wolves are skilled at maintaining a harmless guise even while they silently prepare to strike against their enemies. Starting at 1st level, a cloaked wolf receives a morale bonus on all Disguise and Sleight of Hand checks equal to half her inquisitor level (minimum +1). When a cloaked wolf uses Sleight of Hand to draw a hidden weapon, this bonus doubles.

This ability replaces stern gaze.'''

[[entry]]
id = "ref/inquisition/crime"
anchor = "always-wary"
print = '''
A cloaked wolf is always ready for betrayal and subterfuge. Whenever she attempts a Sense Motive check to avoid being surprised by a foe using Bluff to conceal the attack, the cloaked wolf can always act during the surprise round, regardless of the result of the check. At 2nd level, she adds her Wisdom modifier (in addition to her Dexterity modifier) to her initiative checks during any such encounter.

This ability alters cunning initiative and replaces monster lore.'''

[[entry]]
id = "ref/inquisition/crime"
anchor = "unleashed-fury"
print = '''
At 3rd level, a cloaked wolf can transition between parley and combat in the blink of an eye. She gains Quick Draw as a bonus feat.

Additionally, at 6th level and every 3 inquisitor levels thereafter, she gains a bonus feat from the following list: Alertness, Catch Off-Guard, Deceitful, Deft Hands, Dodge, Improved Initiative, Improved Unarmed Strike, Improvised Weapon Mastery, Lookout, Mobility, Spring Attack, Stunning Fist, and Throw Anything. She must meet the prerequisites of the selected bonus feat.

As a standard action, a cloaked wolf can choose to learn a new bonus feat from the above list in place of the most recent bonus feat she has already learned. In effect, the cloaked wolf loses the bonus feat in exchange for the new one. She can only change the most recent bonus feat gained. Whenever she gains a new bonus feat, the previous bonus feat becomes set and cannot be changed again. A cloaked wolf can change her most recent bonus feat a number of times per day equal to her Wisdom modifier (minimum 1).

This ability replaces solo tactics and teamwork feats.'''

[[entry]]
id = "ref/inquisition/crime"
anchor = "faith-hunter-archetype"
print = "Certain relentless inquisitors burn with special hatred for an enemy of specific convictions, and they stop at nothing when obsessively hunting these foes down."

[[entry]]
id = "ref/inquisition/crime"
anchor = "sworn-enemy"
print = '''
A faith hunter chooses a single alignment (such as chaotic evil, rather than simply chaotic or evil) that directly opposes her own along either the law/chaos axis or the good/evil axis (so a lawful good faith hunter can choose chaotic good, chaotic neutral, chaotic evil, neutral evil, or lawful evil, whereas a neutral good faith hunter can only choose chaotic evil, neutral evil, or lawful evil). Creatures of this alignment are her sworn enemies. She can detect creatures of that specific alignment at will, functioning as _detect evil,_ except this ability works only on creatures and detects the specific alignment.

At 6th level, once per day as a swift action, a faith hunter can smite one foe she can see. If the foe is of the faith hunter's sworn enemy alignment, the faith hunter gains a +4 sacred bonus on attack rolls against that foe and a sacred bonus equal to half her inquisitor level on damage rolls made against the foe. Smites against targets of the faith hunter's sworn enemy alignment automatically bypass any DR the creature might possess. If the faith hunter targets a creature that is not of her sworn enemy alignment, the smite is wasted with no effect.

The smite effect remains until the foe is dead or the next time the faith hunter rests and regains her uses of this ability. At 10th level and every 4 inquisitor levels thereafter, a faith hunter can smite her enemies one additional time per day, to a maximum of four times per day at 18th level.

A faith hunter does not gain the justice or destruction judgments.

This ability replaces domain and alters judgment.'''

[[entry]]
id = "ref/inquisition/crime"
anchor = "enemy-revealed"
print = '''
At 2nd level, when a faith hunter uses her sworn enemy ability to identify a creature's alignment (typically on the third round of concentrating on an area including the creature), she can reveal that creature's alignment aura, causing it to glow for 1 round per inquisitor level so that even creatures with regular vision can see the aura. This not only allows others to recognize the creature's alignment, potentially exposing its true nature, it also allows them to track its location easily by the glow. Even if such a creature is invisible, the telltale glow pinpoints the creature's square or squares. The faith hunter can use this ability a number of times per day equal to her Wisdom modifier (minimum 1), and it doesn't take any extra action on her part to do so; it is part of the same action as concentrating on her sworn enemy detect ability.

This ability replaces detect alignment.'''

[[entry]]
id = "ref/inquisition/crime"
anchor = "hateful-bane"
print = '''
At 5th level, a faith hunter's bane ability functions only against creatures that are both the selected creature type and her sworn enemy alignment.

This ability alters bane.'''

[[entry]]
id = "ref/inquisition/crime"
anchor = "secret-seeker-archetype"
print = "Secret seekers are trained in the art of extracting answers from intransigent foes. Recognizing that torture is a poor method of securing truthful intelligence, secret seekers instead prefer magical means of inquiry."

[[entry]]
id = "ref/inquisition/crime"
anchor = "occult-lore"
print = '''
A secret seeker gains access to the prognostication and read aura occult skill unlocks (_Pathfinder RPG Occult Adventures_ 196–197), but not the other occult skill unlocks. If she ever chooses to gain the Psychic Sensitivity feat or otherwise gains access to all occult skill unlocks, she receives Psychic Maestro as a bonus feat, with prognostication and read aura as the two occult skill unlocks selected.

This ability replaces monster lore.'''

[[entry]]
id = "ref/inquisition/crime"
anchor = "detect-mind"
print = '''
At 5th level, a secret seeker can _detect anxieties_ (see page 211), _detect desires_ (see page 211), or _detect thoughts_, as per the spells, for a number of rounds per day equal to twice her inquisitor level. These rounds need not be consecutive. A creature that succeeds at a saving throw against this ability is immune to that secret seeker's detect mind ability for 24 hours. If the secret seeker has the secrets inquisition (see page 28), she doubles the number of rounds per day that she can use this ability.

At 12th level, a secret seeker can use her detect mind ability for a number of minutes per day equal to twice her inquisitor level, rather than rounds. These minutes need not be consecutive but must be spent in 1-minute increments. If the secret seeker has the secrets inquisition, she doubles the number of minutes per day she can use this ability.

This ability replaces bane and greater bane.'''

[[entry]]
id = "ref/inquisition/crime"
anchor = "seek-mind"
print = '''
At 14th level, a secret seeker can use her detect mind ability to seek out people with particular anxieties, desires, or thoughts. This functions as per _seek thoughts_ except that it works with any of the three types of mental output the secret seeker can detect with detect mind.

This ability replaces exploit weakness.'''

[[entry]]
id = "ref/inquisition/crime"
anchor = "tactical-leader-archetype"
print = "Rather than pursuing their holy missions alone, some inquisitors see the inherent value of working with like-minded allies to accomplish mutual goals."

[[entry]]
id = "ref/inquisition/crime"
anchor = "leader-s-words"
print = '''
Tactical leaders are skilled at speaking soothing words that keep the peace and bolster allies' resolve. A tactical leader receives a morale bonus on all Diplomacy checks equal to half his inquisitor level (minimum +1).

This ability replaces stern gaze.'''

[[entry]]
id = "ref/inquisition/crime"
anchor = "tactician"
print = '''
At 3rd level, 9th level, and 18th level, a tactical leader gains a teamwork feat as a bonus feat. He must meet the prerequisites for this feat. As a standard action, the tactical leader can grant one of these feats to all allies within 30 feet who can see and hear him. Allies retain the use of this bonus feat for 3 rounds plus 1 round for every 2 inquisitor levels the tactical leader has. Allies do not need to meet the prerequisites of these bonus feats. The tactical leader can use this ability once per day at 3rd level, plus one additional time per day at 6th, 9th, 15th, and 18th level.

At 12th level, a tactical leader can use the tactician ability as a swift action. At 18th level, whenever the tactical leader uses this ability, he grants any two teamwork feats that he knows. He can select from any of his teamwork feats, not just his bonus feats.

If the tactical leader also has cavalier levels, these levels stack for determining the number of uses of this ability per day.

This ability replaces solo tactics and teamwork feats.'''

[[entry]]
id = "ref/inquisition/crime"
anchor = "battle-acumen"
print = '''
At 14th level, a tactical leader can grant his judgment benefits to a single other ally within 30 feet who can see and hear the tactical leader as an immediate action. These benefits last until the beginning of the tactical leader's next turn. A tactical leader must have a judgment active to use this ability and the benefits granted are the same as those selected by his judgment. A tactical leader can use this ability a number of times per day equal to his Wisdom modifier (minimum 1).

This ability replaces exploit weakness.'''

[[entry]]
id = "ref/inquisition/crime"
anchor = "traceless-operative-archetype"
print = "Traceless operatives practice subterfuge and careful preparation in order to accomplish their divine mandates."

[[entry]]
id = "ref/inquisition/crime"
anchor = "conceal-evidence"
print = '''
A traceless operative knows how to clean up and obscure the evidence of foul play. It takes her 1d3 × 10 minutes to conceal or alter evidence in a 10-foot-by-10-foot area. She uses Disguise to alter evidence or Stealth to conceal it, though bonuses and penalties based on her abilities or effects that disguise or hide her own body (such as from _disguise self_, a _cloak of elvenkind_, or the size modifier on Stealth checks) do not apply. A creature attempting to investigate the scene using Perception must succeed at the original Perception DC or a DC equal to the traceless operative's check, whichever is higher, in order to discover the true evidence. A creature who fails against a traceless operative's Disguise check potentially also derives the false evidence planted by the traceless operative.

This ability replaces monster lore and stern gaze.'''

[[entry]]
id = "ref/inquisition/crime"
anchor = "trackless"
print = '''
At 2nd level, a traceless operative's deity helps obscure her path from others. The DC to track the traceless operative (or a group including her) increases by half her inquisitor level. This does not stack with similar abilities, such as a transporter's trailbreaker ability (see page 43).

This ability replaces track.'''

[[entry]]
id = "ref/inquisition/crime"
anchor = "uncanny-dodge"
print = '''
At 5th level, a traceless operative can react to danger before her senses would normally allow her to do so. She cannot be caught flat-footed, nor does she lose her Dexterity bonus to AC if the attacker is invisible. She still loses her Dexterity bonus to AC if immobilized. A traceless operative with this ability can still lose her Dexterity bonus to AC if an opponent successfully uses the feint action against her. If the traceless operative already possesses uncanny dodge from a different class, she automatically gains improved uncanny dodge instead.

This ability replaces bane.'''

[[entry]]
id = "ref/inquisition/crime"
anchor = "improved-uncanny-dodge"
print = '''
At 12th level, a traceless operative can no longer be flanked. This defense denies rogues (or other classes with the sneak attack ability) the ability to sneak attack the traceless operative by flanking her, unless the attacker has at least 4 more rogue levels (or levels in a class that grants the sneak attack class ability) than the traceless operative has inquisitor levels. If the traceless operative already has improved uncanny dodge from another class, the levels from the classes that grant improved uncanny dodge stack when determining the minimum rogue level (or level in another class with the sneak attack ability) required to flank the character.

This ability replaces greater bane.'''

[[entry]]
id = "ref/inquisition/crime"
anchor = "umbral-stalker-archetype"
print = "As a consummate lurker in the shadows, an umbral stalker observes the enemies of her faith and strikes before the unfortunate victims even know she is skulking nearby."

[[entry]]
id = "ref/inquisition/crime"
anchor = "class-skills"
print = '''
An umbral stalker adds Acrobatics to her list of class skills, instead of Diplomacy.

This alters the inquisitor's class skills.'''

[[entry]]
id = "ref/inquisition/crime"
anchor = "dark-descent"
print = '''
An umbral stalker gains the Darkness domain with the Night subdomain, even if her deity normally doesn't offer it.

This ability alters domain.'''

[[entry]]
id = "ref/inquisition/crime"
anchor = "judgment"
print = '''
Umbral stalkers are most effective when they get the drop on an opponent. An umbral stalker gains access to the following judgment.

_Stalking_: The umbral stalker gains a +2 sacred bonus on attack rolls against creatures that are unaware of her presence (typically because she is invisible or using Stealth). This bonus increases by 2 for every 5 inquisitor levels she has.

This ability replaces the justice judgment.'''

[[entry]]
id = "ref/inquisition/crime"
anchor = "swift-and-silent"
print = '''
Umbral stalkers often descend upon their prey with deadly grace and efficiency. An umbral stalker gains a morale bonus on all Acrobatics and Stealth checks equal to half her inquisitor level (minimum +1).

This ability replaces stern gaze.'''

[[entry]]
id = "ref/inquisition/crime"
anchor = "deadly-efficiency"
print = '''
At 14th level, an umbral stalker becomes even deadlier against enemies who haven't yet noticed her in the shadows. Whenever she confirms a critical hit against a foe that is unaware of her presence, she ignores any damage reduction the target might have and adds her Wisdom bonus to her damage roll (this multiplies on the critical hit as normal); in addition, if the target has regeneration, the creature loses regeneration on the round following the critical hit and can die normally during that round. Creatures whose regeneration always functions are immune to this ability.

Finally, if the umbral stalker deals energy damage to a creature unaware of her presence with vulnerability to that energy type, she deals 2 extra points of damage per die rolled.

This ability alters exploit weakness.'''

[[entry]]
id = "ref/inquisition/crime"
anchor = "vigilant-defender-archetype"
print = "Some inquisitors focus more on protecting those who share their faiths and their ideals than on actively hunting their enemies. These vigilant defenders often work alongside traveling clerics and paladins."

[[entry]]
id = "ref/inquisition/crime"
anchor = "shared-judgments"
print = '''
As a swift action whenever a vigilant defender has pronounced judgment on her foes, she can grant all of her allies the bonus or special ability that the judgment bestows. If she has multiple active judgments, they all affect her allies. When she does this, the judgments no longer affect her, and their effects only last for 1 round, after which that daily use of judgment ends immediately, even if the combat is not over. The vigilant defender cannot change any of these judgments to another type during this round.

This ability modifies judgment.'''

[[entry]]
id = "ref/inquisition/crime"
anchor = "protect-the-faithful"
print = '''
A vigilant defender can spend 1 minute coaching and teaching a group of allies how best to avoid scrutiny from those who wish them harm. The vigilant defender and her allies cannot be in combat or threatened during this coaching, and allies must be able to see and hear the vigilant defender to benefit from this ability. This ability provides no benefits against enemies that have heard or seen the coaching.

Affected allies receive a morale bonus equal to 1/4 the vigilant defender's inquisitor level (minimum +1) on all Bluff, Disguise, Perception, and Stealth checks outside of combat made to avoid, deceive, or notice other creatures. This bonus lasts for 10 minutes, and the vigilant defender can affect herself and a number of allies equal to her Wisdom modifier (minimum 1). She can coach allies in this way once per day at 1st level, plus one additional time per day for every 4 inquisitor levels she has, to a maximum of six times per day at 20th level.

This ability replaces stern gaze.'''

[[entry]]
id = "ref/inquisition/crime"
anchor = "bolster-the-wounded"
print = '''
At 14th level, a vigilant defender can preternaturally sense when her allies are in grave peril and can form a mystical conduit to protect them from the full effects of grievous wounds. As an immediate action whenever an enemy confirms a critical hit against an ally within 30 feet, the vigilant defender can choose to accept half the damage. If she does so, similar to the _shield other_ spell, any of her damage reduction, resistances, or immunities do not apply to the damage she takes.

This ability replaces exploit weakness.'''

[[entry]]
id = "ref/inquisition/crime"
anchor = "true-vengeance"
print = '''
At 20th level, when a vigilant defender calls true judgment down upon a foe, if the foe has killed one of the vigilant defender's allies (permanent sentient allies, such as fellow party members or cohorts, not summoned monsters, animal companions, pets, or the like), the DC of the target's Fortitude save to avoid death is 2 higher. If the foe has not damaged any of the vigilant defender's allies, the DC to avoid death is instead 2 lower.

This ability alters true judgment.'''

