[[add]]
entry = "ref/arc-bloodrager/id-rager"
anchor = "kindness"
head = "Kindness (Psychic Anthology page 5)"
parent = "atavistic-avatar"
after = "atavistic-avatar"
note = "text of another owner book (owner ruling 32): the emotional focus Kindness of Psychic Anthology page 5, which the id rager can select; checked against that print; the import held it as a skills row of the list of foci"
text = '''
A bloodrager with the id rager archetype (Pathfinder Player Companion: Occult Origins 23) can select [kindness](ref/emotionalfocus/kindness) as his emotional focus. The phantom gains a number of ranks in Diplomacy and Heal equal to its number of Hit Dice. While confined in the spiritualist's consciousness, the phantom grants the spiritualist Skill Focus in each of these skills.
'''

[[add]]
entry = "ref/arc-bloodrager/id-rager"
