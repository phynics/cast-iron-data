hold = "the print span ends at the title \"HORROR\", which names no other section of the book (a table, a box?): decide `sidebar` (a lore box, ruling 41) or `drop`, or write it with an edit, for `horror`; head not printed: Song of the Conjunction (Su), Insights from Beyond (Ex), Dulled Horror (Ex), Eldritch Caesura (Su), Ex-Mute Musicians; the replaces trade `Mass suggestion` is not printed in a sentence, and no listed feature of that name prints it; the replaces trade `Versatile performance` is not printed in a sentence, and no listed feature of that name prints it; the replaces trade `Well-versed` is not printed in a sentence, and no listed feature of that name prints it; the replaces trade `Jack-of-all-trades` is not printed in a sentence, and no listed feature of that name prints it"
opening = ["A mute musician forswears speech for the unnatural songs and thunderous silences of the depths of space. She learns to blend light and sound in seemingly impossible ways. Some mute musicians look to the darker aspects of Desna as their inspiration for these performances, but most mute musicians find their muse in the alien sounds of the Elder Mythos and the entities that orbit the blind idiot god Azathoth, who floats in the heart of the Dark Tapestry."]

[[entry.feature]]
anchor = "mute"
head = "Mute (Ex)"
listed = true
print = "A mute musician has a disability or injury (possibly self-inflicted or even psychological) that prevents her from speaking or vocalizing. Language-dependent effects (including Perform \\[oratory\\]) require the bard to be able to use telepathy, nonverbal languages, or writing to communicate. She cannot use Perform (sing) or speak languages, though she can still create audible bardic performances by means of a musical instrument. A mute musician can provide verbal and somatic components for spells she casts via any musical instrument in which she has ranks in the appropriate Perform skill."

[[entry.feature]]
anchor = "eschew-materials"
head = "Eschew Materials (Ex)"
listed = true
level = 1
print = '''
A mute musician gains [Eschew Materials](ref/feat/eschew-materials) as a bonus feat at 1st level.

This ability replaces bardic knowledge.'''
import_trades = ["Bardic knowledge"]

[[entry.feature]]
anchor = "bardic-performance"
head = "Bardic Performance"
listed = true
print = "A mute musician gains the following bardic performances."

[[entry.feature]]
anchor = "symphony-of-silence"
head = "Symphony of Silence (Su)"
listed = true
level = 3
print = '''
At 3rd level, the mute musician's music muffles all other sounds within a 30-foot radius. All creatures in the area of effect gain a +2 bonus on all saving throws made against sonic attacks or language-dependent effects. This bonus increases to +3 at 7th level, +4 at 11th level, +5 at 15th level, and +6 at 19th level. Symphony of silence relies on audible components.

This bardic performance replaces inspire competence.'''
import_trades = ["Inspire competence"]

[[entry.feature]]
anchor = "maddening-harmonics"
head = "Maddening Harmonics (Su)"
listed = true
level = 14
print = '''
At 14th level, the mute musician can create a performance so baffling and discordant that it usurps all thought within a 30-foot radius with chaos and entropy. The mute musician can select which creatures in this area are affected by the maddening harmonics and which are not. All targeted creatures within this area must succeed at a Will saving throw (DC = 10 + 1/2 the bard's level + the bard's Charisma modifier) or be confused for as long as they can hear the performance. If the creature succeeds at its saving throw, it is immune to this ability for 24 hours. This performance relies on audible components.

This bardic performance replaces frightening tune.'''
import_trades = ["Frightening tune"]

