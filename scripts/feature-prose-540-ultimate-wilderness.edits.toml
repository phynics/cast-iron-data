[[edit]]
entry = "ref/arc-bard/fey-courtier"
anchor = "fey-contacts"
note = "hand-written from print (Ultimate Wilderness p. 41, ruling 18): the table of the settlement base values and purchase limits, which the extraction ran into the end of the paragraph, as a Markdown table; each cell as printed"
text = '''
At 2nd level, thanks to his fey contacts and knowledge of the byzantine trade customs of the fey courts, a fey courtier can treat any wilderness area with fey residents as a settlement with a certain base value and purchase limit based on his bard level for the purpose of buying and selling magic items. See page 205 of the _Pathfinder RPG GameMastery Guide_ for rules on settlement base values and purchase limits. The fey courtier can also use these contacts to gather information about the residents, geography, and nearby areas with Diplomacy.

This replaces versatile performance.

| Bard Level | Base Value | Purchase Limit |
|---|---|---|
| 2nd | 50 gp | 500 gp |
| 6th | 500 gp | 2,500 gp |
| 10th | 2,000 gp | 10,000 gp |
| 14th | 8,000 gp | 50,000 gp |
| 18th | 32,000 gp | 200,000 gp |
'''

[[edit]]
entry = "ref/arc-fighter/viking"
anchor = "berserker"
note = "hand-written from print (Ultimate Wilderness p. 51): the sidebar Tribal Weapon Group, which print sets at the foot of the page, was read in the middle of the paragraph; the paragraph is whole here and the sidebar is with the Tribal Fighter, whose weapon group it is"
text = '''
At 5th level, a viking gains the rage ability as per the [barbarian](ref/class/barbarian) class feature, and she uses her fighter level as her barbarian level for the purposes of determining her rounds of rage, qualifying for rage powers, and determining the effects of rage powers.

This replaces weapon training.
'''

[[add]]
entry = "ref/arc-fighter/tribal-fighter"
anchor = "tribal-weapon-group"
head = "Tribal Weapon Group"
parent = "tribal-weapon-training"
after = "tribal-weapon-training"
note = "text of the rules box Tribal Weapon Group (Ultimate Wilderness p. 51, ruling 41), word for word from print: print sets it at the foot of the Viking's page, and the tribal weapon group is the one that the Tribal Fighter's Tribal Weapon Training names; the import of the Viking and the Tribal Fighter lacked it"
text = '''
The following new fighter weapon group consists of traditional melee weapons used by many indigenous peoples.

_Tribal:_ Club, dagger, greatclub, handaxe, heavy shield, light shield, shortspear, spear, throwing axe, and unarmed strike.
'''

[[add]]
entry = "ref/arc-bard/plant-speaker"
anchor = "leshy-subdomain"
head = "Leshy Subdomain"
parent = ""
after = "mystical-allegory"
note = "text of the box Leshy Subdomain (Ultimate Wilderness p. 23, ruling 41), word for word from print: a box of rules beside the Plant Speaker, which the import lacked; an unlisted section of this entry (the asterisk after \"Green Faith\" is dropped, ruling 10: the box prints no key)"
text = '''
You have a strong connection to these little manifestations of nature spirits.

**Associated Domain:** Plant.

**Associated Religions:** Gozreh, Green Faith.

**Replacement Power:** The following granted power replaces the wooden fist power of the Plant domain.

**Leshy Caller (Sp):** You can spontaneously swap out any of your domain spells for a summon nature's ally spell of the same level or lower, to a maximum of _summon nature's ally VII_. If you do, you must use the spell to summon one or more leshys. Add leaf leshy, gourd leshy, fungus leshy, seaweed leshy, and lotus leshy to your _summon nature's ally I_, _II_, _III_, _IV_, and _V_ lists, respectively. You count as a plant creature for the purpose of creating leshys (_Pathfinder RPG Bestiary 3_ 176).

As a standard action, you can grant a single leshy within 30 feet a +4 sacred bonus on its next attack roll before the start of your next turn. You can use this ability a number of times per day equal to 3 + your Wisdom modifier.

**Replacement Domain Spells:** 1st—_tree shape_, 5th—_commune with nature_.
'''

[[edit]]
entry = "ref/arc-shifter/elementalist-shifter"
anchor = "elemental-aspects-elementalist-shifter-aspects"
note = "hand-written from print (Ultimate Wilderness p. 79, ruling 41): the introduction of the box of rules Elemental Aspects (Elementalist Shifter Aspects); the extraction read its four aspects as heads and rows, and the first version of this entry left the box out"
text = '''
Elementalist shifters do not infuse their bodies with bestial qualities taken from animal aspects. Rather, they take into themselves raw elemental power from the planes of Air, Earth, Fire, and Water. The following aspects are used by the elementalist shifter archetype; they cannot be selected as aspects by other shifters.
'''

[[add]]
entry = "ref/arc-shifter/elementalist-shifter"
anchor = "air"
head = "Air"
parent = "elemental-aspects-elementalist-shifter-aspects"
after = "elemental-aspects-elementalist-shifter-aspects"
note = "text of the aspect Air of the box Elemental Aspects (Ultimate Wilderness pp. 79-80, ruling 41), word for word from print: the box of rules that the Elementalist Shifter uses; an unlisted subheading of the box"
text = '''
You take on the power of an air elemental, gaining the ability to fly and to control powerful gusts of wind. You take inspiration from the patterns of clouds in the sky, the tumultuous fury of the storm, and the gentle caress of a cooling breeze. Flying creatures, such as bats and birds, are your favorites. Spring is your favored season—a time when storms bring freshness to the world but that lacks the brutality of winter's devastation.

**Minor Form:** You gain a +2 enhancement bonus to your Dexterity score. This bonus increases to +4 at 8th level and to +6 at 15th level.

**Major Form:** Your shape changes to that of a Medium air elemental (_Pathfinder RPG Bestiary_ 120). While you are in this form, you gain a fly speed of 60 feet (average maneuverability) and airborne creatures take a -1 penalty on attack and damage rolls against you. At 8th level, your fly speed increases to 100 feet (perfect) and you gain the whirlwind special ability (see below). At 15th level, you gain Improved Natural Attack with your slam.

**Whirlwind (Su):** You can transform yourself into a whirlwind as a standard action for 1 round per 2 shifter levels you have. This otherwise functions as per the whirlwind universal monster rule.
'''

[[add]]
entry = "ref/arc-shifter/elementalist-shifter"
anchor = "earth"
head = "Earth"
parent = "elemental-aspects-elementalist-shifter-aspects"
after = "air"
note = "text of the aspect Earth of the box Elemental Aspects (Ultimate Wilderness pp. 79-80, ruling 41), word for word from print: the box of rules that the Elementalist Shifter uses; an unlisted subheading of the box"
text = '''
You take on the power of an earth elemental, gaining the ability to burrow through the earth and deliver powerful blows. You take comfort in caverns, mountainous regions, and areas rent by canyons and chasms, and you feel a deep kinship to burrowing animals of all types. Be it the soothing feel of fresh topsoil or the devastating fury of an earthquake, you understand the raw power of earth. Your favored season is fall—the traditional time of the harvest, when bounty from the earth is offered.

**Minor Form:** You gain a +2 enhancement bonus to your Constitution score. This bonus increases to +4 at 8th level and to +6 at 15th level.

**Major Form:** Your shape changes to that of a Medium earth elemental (_Pathfinder RPG Bestiary_ 122). While you are in this form, your base speed is reduced to 20 feet, but you gain a burrow speed of 10 feet, and you gain a +1 bonus on attack and damage rolls if both you and your target are touching the ground. If the target is airborne or waterborne, you take a -4 penalty on attack and damage rolls against it. These modifiers also apply to bull rush and overrun combat maneuvers, whether you are initiating or resisting these kinds of attacks. At 8th level, your burrow speed increases to 20 feet and you gain earth glide as per the universal monster rule. At 15th level, you gain Improved Natural Attack with your slam.
'''

[[add]]
entry = "ref/arc-shifter/elementalist-shifter"
anchor = "fire"
head = "Fire"
parent = "elemental-aspects-elementalist-shifter-aspects"
after = "earth"
note = "text of the aspect Fire of the box Elemental Aspects (Ultimate Wilderness pp. 79-80, ruling 41), word for word from print: the box of rules that the Elementalist Shifter uses; an unlisted subheading of the box"
text = '''
You take on the power of a fire elemental, becoming a being of living flame that can burn enemies and move with great speed. You enjoy regions where precipitation rarely intrudes, such as desert landscapes and dry savannas, but the slopes of volcanoes hold the greatest majesty to you. You enjoy the companionship of swiftly moving creatures and those who enjoy basking in the sun, for you empathize with their appreciation of the daytime's warmth. Forest fires are things of beauty to you, yet you respect fire and would never think to wantonly inflict it upon the natural world. Summer is your favorite season, for this is a time of heat waves and blistering sunny days.

**Minor Form:** You gain a +2 enhancement bonus to your Dexterity score. This bonus increases to +4 at 8th level and to +6 at 15th level.

**Major Form:** Your shape changes to that of a Medium fire elemental (_Pathfinder RPG Bestiary_ 124). While you are in this form, your base speed changes to 50 feet and you gain immunity to fire, vulnerability to cold, and the burn special attack as per the universal monster rule, dealing damage equal to your slam attack whenever a creature fails its Reflex save against that ability. At 8th level, you gain Improved Natural Attack with your slam. At 15th level, you deal fire damage equal to double your slam damage against opponents that fail their saves against your burn ability.
'''

[[add]]
entry = "ref/arc-shifter/elementalist-shifter"
anchor = "water"
head = "Water"
parent = "elemental-aspects-elementalist-shifter-aspects"
after = "fire"
note = "text of the aspect Water of the box Elemental Aspects (Ultimate Wilderness pp. 79-80, ruling 41), word for word from print: the box of rules that the Elementalist Shifter uses; an unlisted subheading of the box"
text = '''
You take on the power of a water elemental, gaining the ability to move swiftly in water, rain down crashing blows on your enemies, and transform into a swirling vortex. You identify with aquatic animals of all types, be they water-breathing creatures such as fish, amphibians such as newts or frogs, or air-breathing mammals such as whales or walruses. The unrelenting churn of waves on the shoreline, the soothing babble of a gentle stream, and the pounding kiss of a deluge of rain all bring joy to your heart. Your favored season is winter, for it is at this time that the most powerful of storms bring water to all the world.

**Minor Form:** You gain a +2 enhancement bonus to your Strength score. This bonus increases to +4 at 8th level and to +6 at 15th level.

**Major Form:** Your shape changes to that of a Medium water elemental (_Pathfinder RPG Bestiary_ 126). While you are in this form, your base speed is reduced to 20 feet but you gain a swim speed of 60 feet, and if both you and your target are touching water, you also gain a +1 bonus on attack and damage rolls. If the target is touching the ground, you take a -4 penalty on attack and damage rolls against it. These modifiers apply to bull rush and overrun combat maneuvers, whether you are initiating or resisting these kinds of attacks. At 8th level, your swim speed increases to 90 feet, your touch automatically extinguishes nonmagical flames of size Large or smaller, and you can dispel magical fires as per dispel magic using your shifter level as your effective caster level. At 15th level, you gain Improved Natural Attack with your slam and the vortex special ability, which functions identically to the air aspect's whirlwind ability (see page 79) but can form only underwater and cannot leave the water.
'''
