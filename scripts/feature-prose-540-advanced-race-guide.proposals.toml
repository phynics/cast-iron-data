[[entry.feature]]
anchor = "see-sin"
head = "See Sin (Sp)"
listed = true
level = 3
print = "At 3rd level, a purifier gains a bonus equal to 1/2 her oracle level on Sense Motive checks to sense enchantments, which she can make as a full-round action. She also gains a bonus equal to 1/2 her oracle level on Spellcraft checks to identify enchantment school spells and spells with the curse or emotion descriptor (see page 251 of _Ultimate Magic_ for spells in the _Pathfinder RPG Core Rulebook_ and _Advanced Player's Guide_ that have the curse or emotion descriptor)."

[[entry.feature]]
anchor = "celestial-armor"
head = "Celestial Armor (Su)"
listed = true
level = 7
print = "At 7th level, a purifier's armor takes on a golden or silvery sheen and becomes light as a feather. Her armor weighs half as much as long as she wears it, and she also gains armor training as a [fighter](ref/class/fighter) 4 levels lower than her oracle level. At 11th level, a purifier gains [heavy armor proficiency](ref/feat/armor-proficiency-heavy)."

[[entry.feature]]
anchor = "sin-eater"
head = "Sin Eater (Su)"
listed = true
level = 11
print = '''
At 11th level, a purifier can consume a curse, enchantment, or emotion effect by touch as a full-round action. She can do this a number of times per day equal to her Charisma modifier, and must make a Charisma check with a bonus equal to her oracle level against a DC of 11 + the caster level of the effect (or the Hit Dice of the creator for a supernatural effect). If the check succeeds, the effect is negated; however, the purifier is [sickened](ref/misc/sickened) for 1d4 rounds.

If the target is possessed (such as by a _[magic jar](ref/spell/magic-jar)_ effect or a [ghost's](ref/template/ghost) malevolence ability), the possessor is forced out on a successful check. Whether the check succeeds or fails, the possessor is sickened for 2d4 rounds.'''

[[entry.feature]]
anchor = "sacred-scourge"
head = "Sacred Scourge (Su)"
listed = true
level = 5
print = "At 5th level, a purifier may channel holy power to harm evil outsiders as a cleric of her level using the [Alignment Channel](ref/feat/alignment-channel) feat. She may use this ability a number of times per day equal to 1 + her Charisma modifier."

[[entry.feature]]
anchor = "holy-terror"
head = "Holy Terror (Su)"
listed = true
level = 9
print = "At 9th level, a purifier may use her sacred scourge to panic evil outsiders as if using the [Turn Undead](ref/feat/turn-undead) feat against undead."

[[entry.feature]]
anchor = "celestial-master"
head = "Celestial Master (Su)"
listed = true
level = 13
print = "At 13th level, a purifier may use her sacred scourge to compel good outsiders to serve her, as if using the [Command Undead](ref/feat/command-undead) feat against undead."

