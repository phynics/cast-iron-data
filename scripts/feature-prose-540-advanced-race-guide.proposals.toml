[[entry.feature]]
anchor = "stonestrike"
head = "Stonestrike (Su)"
listed = true
level = 1
print = "Once per day per paladin level, a stonelord can draw upon the power of the living rock. As a swift action, she treats her melee attacks until the beginning of her next turn (whether armed or unarmed) as magical and [adamantine](ref/eq-material/adamantine), including ignoring [hardness](ref/umr/hardness) up to twice her paladin level, with a +1 bonus on attack and damage rolls, as well as on combat maneuver checks. This bonus also applies to her CMD if she or her target is touching the ground or a stone structure. This bonus increases by +1 at 5th level and every 5 levels thereafter. This ability replaces smite evil."
