[[entry.feature]]
anchor = "location-memories"
head = "Location Memories (Su)"
listed = true
print = "As a swift action, you may search your past lives for memories of or insight about your current location. This grants you the [scent](ref/umr/scent) ability, [low-light vision](ref/rule/low-light-vision), and a +2 insight bonus on Perception and Survival checks for 1 minute. You can use this ability a number of times per day equal to 3 + your Charisma modifier. You must take this revelation at 1st level or 3rd level."

[[entry.feature]]
anchor = "spirit-memories"
head = "Spirit Memories (Su)"
listed = true
print = "Once per day, you call upon the unfulfilled desires and goals of your past lives and project their frustration and despair through your eyes at a target. This is a [gaze](ref/umr/gaze) attack affecting one creature. The target must make a Will save (DC 10 + 1/2 your oracle level + your Charisma modifier) or be [sickened](ref/misc/sickened) and [staggered](ref/misc/staggered) for 1 round. This is a mind-affecting compulsion effect. You can use this ability a number of times per day equal to 3 + your Charisma modifier. You must take this revelation at 1st, 3rd, or 7th level."

[[entry]]
