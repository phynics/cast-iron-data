[[entry]]
id = "ref/arc-barbarian/hateful-rager"
hold = "the replaces trade `2nd, 8th, 14th, and 20th level rage powers` is not printed in a sentence, and no listed feature of that name prints it; Favored Enemy (Ex): the sentence \"This ability replaces the barbarian's rage power gained at 2nd level\" names no trade"
opening = ["From a young age, many half-orcs are treated cruelly, bullied, ridiculed, and made outcasts. While some hide their shame, others foster a deep, burning hatred that they channel into a raw fury and unleash against their enemies. These half-orcs are called hateful ragers. A hateful rager has the following class features."]

[[entry.feature]]
anchor = "reduced-rage"
head = "Reduced Rage (Ex)"
listed = true
level = 2
print = "At 2nd level and every level thereafter, a hateful rager only gains 1 additional round of rage per day instead of the normal 2 additional rounds of rage per day."

[[entry.feature]]
anchor = "favored-enemy"
head = "Favored Enemy (Ex)"
listed = true
level = 2
print = '''
At 2nd level, a hateful rager selects a [favored enemy](ref/ability/favored-enemy). This ability works identically to the [ranger](ref/class/ranger) ability of the same name. At 8th, 14th, and 20th level, the hateful rager selects another favored enemy and increases her bonus against one favored enemy type, as described in the ranger class.

While raging, the hateful rager makes every effort to fight a favored enemy rather than other opponents. If aware of the presence of a favored enemy, the hateful rager must make a DC 20 Will save each round to attack another creature; failure means the barbarian must attack the favored enemy or move closer to that enemy. She may freely attack creatures preventing her from reaching that favored enemy (regardless of whether they are actively trying to prevent her attacks or merely in the way). She can avoid harmful obstacles normally in her attempts to reach the target and is not forced to take the shortest route.

This ability replaces the barbarian's rage power gained at 2nd level. At 8th, 14th, and 20th levels, in place of a rage power she gains another favored enemy and increases her bonus against one favored enemy type.'''
import_trades = ["2nd, 8th, 14th, and 20th level rage powers", "2nd", "8th", "14th", "20th level rage powers"]

[[entry.feature]]
anchor = "feed-the-rage"
head = "Feed the Rage (Ex)"
listed = true
level = 5
print = "At 5th level, a hateful rager gains 1 additional round of rage for each favored enemy she knocks unconscious or kills in combat. These current rounds of rage can only be used to add to the duration of her rage, and disappear when the rage ends. This ability replaces improved uncanny dodge."
import_trades = ["Improved uncanny dodge", "Improved uncanny dodge"]

