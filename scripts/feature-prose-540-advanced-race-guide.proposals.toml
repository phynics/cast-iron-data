head = "Bonus Spells"
listed = false
print = "_true strike_ (2nd), _alter self_ (4th), _divine power_ (8th), _magic jar_ (12th), _ki shout_ (14th, _Ultimate Magic_), _moment of prescience_ (16th). These bonus spells replace the shigenjo's mystery bonus spells at these levels."
import_trades = ["The bonus spells gained at 2nd", "4th", "8th", "12th", "14th", "16th levels from the oracle's mystery"]

[[entry.feature]]
anchor = "ki-pool"
head = "Ki Pool (Su)"
listed = true
level = 7
print = '''
At 7th level, a shigenjo gains a pool of ki points, supernatural energy she can use to accomplish amazing feats. The number of points in the shigenjo's ki pool is equal to 1/3 her oracle level + her Charisma modifier. The ki pool is replenished each morning after 8 hours of rest or meditation; these hours do not need to be consecutive. If the shigenjo possesses levels in another class that grants points to a ki pool, ki points gained from the shigenjo class stack with those gained from the other class to determine the total number of ki points in the combined pool, but only one ability score modifier is added to the total. The choice of which score to use is made when the second class ability is gained, and once made, the choice is permanent. The shigenjo can use ki points from this pool to power the abilities of every class she possesses that grants a ki pool.

As long as she has at least 1 point in her ki pool, a shigenjo can make a ki strike as a monk whose level is equal to her oracle level - 3. As a swift action, she may spend 1 point from her ki pool to gain one of the following three benefits.'''
import_trades = ["7th-level revelation"]

[[entry.feature]]
anchor = "ki-magic"
head = "Ki Magic"
listed = false
parent = "ki-pool"
print = "Add +1 to the DC of the next spell she casts on her turn."

[[entry.feature]]
anchor = "ki-curse"
head = "Ki Curse"
listed = false
parent = "ki-pool"
print = "Treat her oracle level as 5 higher for the purpose of determining the effects of her [curse](ref/carried/bestiary/rules/universal-monster-rules/curse) for the next round."

[[entry.feature]]
anchor = "ki-insight"
head = "Ki Insight"
listed = false
parent = "ki-pool"
print = '''
Gain a +4 insight bonus on Spellcraft checks for 1 round.

This ability replaces the shigenjo's 7th-level revelation.'''

[[entry.feature]]
anchor = "quivering-palm"
head = "Quivering Palm (Su)"
listed = true
level = 15
print = "At 15th level, a shigenjo may learn quivering palm as the [monk](ref/class/monk) ability of the same name in place of a revelation. She treats her oracle level as her monk level for this ability, and the DC is based on her Charisma bonus instead of her Wisdom bonus."

[[entry.feature]]
anchor = "final-revelation"
head = "Final Revelation"
listed = true
print = "Upon reaching 20th level, you achieve true enlightenment and become one with the celestial spirits. You gain the ability to speak with any creature that uses a language. For a number of days equal to your Wisdom score, you can ignore the negative effects of extreme weather, starvation, thirst, and exhaustion. If you die, your powerful connection to the celestial realm allows you to be reborn 3 days later (as _[reincarnate](ref/spell/reincarnate)_). This replaces the final revelation of the shigenjo's mystery."
import_trades = ["Final revelation"]

[[entry]]
id = "ref/arc-paladin/stonelord"
hold = "the replaces trade `3rd-, 9th-, and 15th-level mercies` is not printed in a sentence, and no listed feature of that name prints it"
opening = ["A stonelord is a devoted sentinel of dwarven enclaves, drawing the power of the earth and ancient stone to protect her people."]

[[entry.feature]]
anchor = "stonestrike"
head = "Stonestrike (Su)"
listed = true
print = "Once per day per paladin level, a stonelord can draw upon the power of the living rock. As a swift action, she treats her melee attacks until the beginning of her next turn (whether armed or unarmed) as magical and [adamantine](ref/eq-material/adamantine), including ignoring [hardness](ref/umr/hardness) up to twice her paladin level, with a +1 bonus on attack and damage rolls, as well as on combat maneuver checks. This bonus also applies to her CMD if she or her target is touching the ground or a stone structure. This bonus increases by +1 at 5th level and every 5 levels thereafter. This ability replaces smite evil."
import_trades = ["Smite evil"]

[[entry.feature]]
anchor = "heartstone"
head = "Heartstone (Ex)"
listed = true
level = 2
print = "At 2nd level, a stonelord's flesh becomes progressively rockier. She gains a +1 natural armor bonus to AC and DR/adamantine equal to 1/2 her paladin level. The natural armor bonus increases by +1 at 6th level, and every four levels thereafter, to a maximum of +5 at 18th level. These benefits are halved when not touching the ground or a stone structure. This ability replaces divine grace."
import_trades = ["Divine grace"]

[[entry.feature]]
anchor = "stoneblood"
head = "Stoneblood (Ex)"
listed = true
level = 3
print = "At 3rd level, a stonelord's vitals begin to calcify and her blood transforms into liquid stone. She adds her paladin level on checks to stabilize at negative hit points and gains a 25% chance to ignore a critical hit or precision damage. This does not stack with _[fortification](ref/magic-enh/fortification)_ armor or similar effects. At 9th level, this chance increases to 50% and she becomes immune to petrification. At 15th level, this chance increases to 75% and she becomes immune to [bleed](ref/rule/bleed) and [blood drain](ref/umr/blood-drain) effects. This ability replaces divine health and her mercies gained at 3rd, 9th, and 15th level."
import_trades = ["Divine health", "3rd-", "9th-", "15th-level mercies"]

[[entry.feature]]
anchor = "defensive-stance"
head = "Defensive Stance (Ex)"
listed = true
level = 4
print = "At 4th level, a stonelord gains the defensive stance ability, as a [stalwart defender](ref/pclass/stalwart-defender) (_Advanced Player's Guide_ 277), and may select one defensive power at 8th level and every four levels thereafter. Levels of stalwart defender stack with her paladin levels when determining the total number of rounds that she can maintain her defensive stance per day. A stonelord does not gain any spells or spellcasting abilities, does not have a caster level, and cannot use spell trigger or spell completion magic items."
import_trades = ["Spells"]

[[entry.feature]]
anchor = "earth-channel"
head = "Earth Channel (Su)"
listed = true
level = 4
print = "At 4th level, a stonelord gains [Elemental Channel](ref/feat/elemental-channel) (earth) as a bonus feat, which she may activate by spending two uses of her lay on hands ability, using her paladin level as her effective cleric level. This ability replaces channel positive energy."
import_trades = ["Channel positive energy"]

[[entry.feature]]
anchor = "stone-servant"
head = "Stone Servant (Su)"
listed = true
level = 5
print = "At 5th level, a stonelord may call a [Small earth elemental](ref/monster/earth-elemental) to her side, as a paladin calls her mount. This earth elemental is Lawful Good in alignment and possesses the [celestial](ref/template/celestial) template, and it increases in size as the stonelord gains levels, becoming Medium at 8th level, Large at 11th level, Huge at 14th level, Greater at 17th level, and Elder at 20th level. This ability replaces divine bond."
import_trades = ["Divine bond"]

[[entry.feature]]
anchor = "stonebane"
head = "Stonebane (Su)"
listed = true
level = 11
print = "At 11th level, when using stonestrike, a stonelord's attack gains the _[bane](ref/magic-enh/bane)_ weapon special ability against creatures with the earth subtype and constructs or objects made of earth or stone. This ability replaces aura of justice."
import_trades = ["Aura of justice"]

[[entry.feature]]
anchor = "phase-strike"
head = "Phase Strike (Su)"
listed = true
level = 12
print = "At 12th level, a stonelord's stonestrike may pass through stone and metal as if they weren't there. By spending 2 uses of her stonestrike ability, she may ignore any cover less than total cover provided by stone or metal, and she ignores any AC bonus from stone or metal armor or shields as if wielding a _[brilliant energy](ref/magic-enh/brilliant-energy)_ weapon. A phase strike cannot damage constructs, objects, or creatures with the earth subtype, but unlike a _brilliant energy_ weapon, it can harm undead. This ability replaces her 12th-level mercy."
import_trades = ["12th-level mercy"]

[[entry.feature]]
anchor = "mobile-defense"
head = "Mobile Defense (Ex)"
listed = true
level = 18
print = "At 18th level, a stonelord can make one 5-foot step per round while maintaining her defensive stance. This ability replaces her 18th-level mercy."
import_trades = ["18th-level mercy"]

[[entry.feature]]
anchor = "stone-body"
head = "Stone Body (Ex)"
listed = true
level = 20
print = "At 20th level, a stonelord's body transforms into living stone. She no longer needs to eat, drink, breathe, or sleep, and she becomes immune to paralysis, poison, and stunning. She is also no longer subject to critical hits or precision-based damage. This ability replaces holy champion."
import_trades = ["Holy champion"]

[[entry]]
id = "ref/arc-ranger/wave-warden"
hold = "the replaces trade `All combat style bonus feats` is not printed in a sentence, and no listed feature of that name prints it; Aquatic Prowess Feat (Ex): the sentence \"This ability replaces the standard ranger's combat style bonus feats, including the limitations on armor worn\" names no trade"
opening = ["The wave warden patrols beneath the sea, preserving the safety and secrets of merfolk communities. Though he fares best beneath the water, dry land is no haven to his quarry."]

[[entry.feature]]
anchor = "deep-sentinel"
head = "Deep Sentinel (Ex)"
listed = true
print = "A wave warden adds half his level (minimum +1) on Perception checks made to notice creatures underwater. This ability replaces track."
import_trades = ["Track"]

[[entry.feature]]
anchor = "aquatic-prowess-feat"
head = "Aquatic Prowess Feat (Ex)"
listed = true
level = 2
print = "At 2nd level and every four levels thereafter, a wave warden selects a bonus feat that improves his prowess in aquatic environments. He can choose these feats even if he does not meet the prerequisites. Initially, he may choose from the following feats: [Dodge](ref/feat/dodge), [Mobility](ref/feat/mobility), [Net Adept](ref/feat/net-adept) (_Ultimate Combat_), [Net and Trident](ref/feat/net-and-trident) (_Ultimate Combat_), [Net Maneuvering](ref/feat/net-maneuvering) (_Ultimate Combat_), [Precise Shot](ref/feat/precise-shot), [Rapid Reload](ref/feat/rapid-reload), [Sea Hunter](ref/feat/sea-hunter), and [Two-Weapon Fighting](ref/feat/two-weapon-fighting). At 6th level, he adds [Improved Two-Weapon Fighting](ref/feat/improved-two-weapon-fighting), [Net Trickery](ref/feat/net-trickery) (_Ultimate Combat_), and [Spring Attack](ref/feat/spring-attack) to the list. At 10th level, he adds [Greater Two-Weapon Fighting](ref/feat/greater-two-weapon-fighting) and [Improved Precise Shot](ref/feat/improved-precise-shot) to the list. This ability otherwise functions like and replaces the standard ranger's combat style bonus feats, including the limitations on armor worn."
import_trades = ["All combat style bonus feats"]

[[entry.feature]]
anchor = "favored-terrain"
head = "Favored Terrain (Ex)"
listed = true
level = 3
print = "At 3rd level, a wave warden gains water as a favored terrain. At 8th level and every five levels thereafter, his bonus in aquatic terrain increases by +2. He does not gain additional favored terrains. This otherwise functions like the standard ranger's favored terrain ability and replaces that ability."
import_trades = ["Favored terrain"]

[[entry.feature]]
anchor = "seaborn"
head = "Seaborn (Ex)"
listed = true
level = 7
print = "At 7th level, a wave warden may move through any sort of aquatic growth (such as coral or seaweed) or across a wet surface at his normal speed and without taking damage or suffering any other impairment. Obstacles that are enchanted or magically manipulated to impede motion still affect him. This ability replaces woodland stride."
import_trades = ["Woodland stride"]

[[entry.feature]]
anchor = "watery-summons"
head = "Watery Summons (Sp)"
listed = true
level = 8
print = "At 8th level, a wave warden can summon allies once per day as a full-round action. This functions as _[summon nature's ally III](ref/spell/summon-natures-ally-3)_, except it can only be used to summon creatures with the aquatic or water subtypes. At 11th level, this ability improves to _summon nature's ally IV_, with this progression continuing every three levels thereafter. The warden's caster level is equal to his ranger level. This ability replaces swift tracker."
import_trades = ["Swift tracker"]

[[entry]]
id = "ref/arc-ranger/wild-shadow"
hold = "checker: [fields] trades = \"replaces: Woodland stride\" disagrees with the trade sentences of the feature `unfettered-step` = \"replaces: the ranger's woodland stride class feature gained at 7th level\" (line 69)"
opening = ["The isolation that some half-elves feel leads them to live a life of isolation amid the wild places of the world. Such rangers stalk the wild like shadows, creating close bonds with the wild itself instead of seeking the solace and aid of companions. While ill at ease within cities and other urban areas, they are adept at using the terrain to tactical advantage; they dart through brambles and rough terrain with uncommon grace and use the land itself to lock down enemies. A wild shadow has the following class features."]

[[entry.feature]]
anchor = "wild-at-heart"
head = "Wild at Heart (Ex)"
listed = true
level = 1
print = "At 1st level, a wild shadow adds only 1/2 his class level when making wild empathy checks while in urban areas, and adds only 1/4 his class level to follow or identify tracks in such areas. In non-urban settings, he is considered two levels higher when determining the bonuses for such checks. This ability alters the track and wild empathy class features."
import_trades = ["Track", "wild empathy"]

[[entry.feature]]
anchor = "favored-terrain"
head = "Favored Terrain (Ex)"
listed = true
level = 3
print = "At 3rd level, when a wild shadow chooses a favored terrain, he cannot choose urban as the terrain type. Furthermore, at 8th level and every five levels thereafter, when he chooses a new favorite terrain type, he cannot choose the urban terrain type. This ability alters the favored terrain class feature."
import_trades = ["Favored terrain"]

[[entry.feature]]
anchor = "woodland-stride"
head = "Woodland Stride (Ex)"
listed = true
print = "This ability functions as the 7th-level ranger class feature [of the same name](ref/ability/woodland-stride), but the wild shadow gains it at 4th level instead. This ability replaces the hunter's bond class feature."
import_trades = ["Hunter's bond"]

[[entry.feature]]
anchor = "unfettered-step"
head = "Unfettered Step (Ex)"
listed = true
level = 7
print = "At 7th level, a wild shadow's woodland stride class feature functions in any [difficult terrain](ref/rule/terrain-and-obstacles) within any of his favored terrains, even in areas that are enchanted or magically manipulated to impede motion. This ability replaces the ranger's woodland stride class feature gained at 7th level."
import_trades = ["Woodland stride"]

[[entry.feature]]
anchor = "harrying-attack"
head = "Harrying Attack (Ex)"
listed = true
level = 11
print = "At 11th level, a wild shadow can use his knowledge of terrain to make shrewd attacks in combat. Such attacks can make foes fumble or cause them to become [entangled](ref/rule/entangled) within areas of the wild shadow's favored terrain. As a standard action, the wild shadow denotes one target within line of sight and within one of his favored terrains as his harried prey. Once the foe is so designated, every time the wild shadow hits this harried prey with a melee or ranged weapon attack (either manufactured or natural), that creature is entangled for 1 round. A wild shadow can have no more than one harried prey at a time and that creature must correspond to one of his favored enemy types. He can dismiss this effect at any time as a free action, be he cannot select a new harried prey for 24 hours. If the wild shadow sees proof that his harried prey is dead, he can select a new harried prey after waiting 1 hour. This ability replaces the quarry class feature."
import_trades = ["Quarry"]

[[entry.feature]]
anchor = "wild-stalker"
head = "Wild Stalker (Ex)"
listed = true
level = 14
print = "At 14th level, a wild shadow learns to better use natural surroundings to obscure his position in combat. Whenever a wild shadow is within one of his favored terrains and a feature of that terrain grants him [cover](ref/rule/cover), the bonuses to AC and Reflex saves for that cover improve by 1. Additionally, while he is within one of his favored terrains, if he gains [concealment](ref/rule/concealment) or total concealment, the miss chance of either type of concealment improves by 10%. Furthermore, at 16th level and 19th level, the bonuses granted by cover increase by 1 and the miss chance increases by another 10% (maximum +3 and +30% respectively at 20th level). This ability replaces the camouflage class feature."
import_trades = ["Camouflage"]

[[entry.feature]]
anchor = "master-of-terrain"
head = "Master of Terrain (Ex)"
listed = true
level = 19
print = "At 19th level, a wild shadow can use his harrying attack against creatures other than his favored enemy or he can spend a standard action to designate up to two of his favored enemies as his harried prey instead. This ability replaces the improved quarry class feature."
import_trades = ["Improved quarry"]

[[entry]]
id = "ref/arc-rogue/deadly-courtesan"
hold = "the replaces trade `Rogue talent gained at 2nd level` is not printed in a sentence, and no listed feature of that name prints it; Bardic Performance (Su): the sentence \"This ability replaces the rogue trick gained at 2nd level\" names no trade"
opening = ["Skilled at manipulation and diversion, the deadly courtesan builds up those around her and periodically takes them down. She can be a spy, entertainer, assassin, bodyguard, or just an intimate to someone who needs it most. A deadly courtesan has the following class features."]

[[entry.feature]]
anchor = "class-skills"
head = "Class Skills"
listed = true
level = 1
print = "At 1st level, a deadly courtesan adds Knowledge (history) and Knowledge (nobility) to her list of class skills and removes Knowledge (dungeoneering) from her list of class skills."

[[entry.feature]]
anchor = "bardic-performance"
head = "Bardic Performance (Su)"
listed = true
level = 2
print = "At 2nd level, a deadly courtesan gains the bardic performance ability and the [fascinate](ref/performance/fascinate) bardic performance. Her fascinate DC is 10 + 1/2 her rogue level + her Charisma modifier. She can use this bardic performance for a number of rounds per day equal to 1 + her Charisma modifier. At each level after 2nd, she can use bardic performance for 1 additional round per day. If the courtesan also has bard levels, she may use these rounds for either class's fascinate bardic performance, and her bard and rogue levels stack for determining her fascinate DC. This ability replaces the rogue trick gained at 2nd level."
import_trades = ["Rogue talent gained at 2nd level"]

[[entry.feature]]
anchor = "inspire-competence"
head = "Inspire Competence (Su)"
listed = true
level = 3
print = "At 3rd level, a deadly courtesan can use her bardic performance to [inspire competence](ref/performance/inspire-competence). The bonus begins at +2 and increases by +1 for every six levels the courtesan has attained beyond 3rd (+3 at 9th and +4 at 15th). This ability replaces all levels of trap sense."
import_trades = ["Trap sense"]

[[entry.feature]]
anchor = "performance-strike"
head = "Performance Strike (Sp)"
listed = true
level = 8
print = "At 8th level, as a swift action, a deadly courtesan may expend rounds of bardic performance to gain a morale bonus on one attack roll. The amount of the bonus is equal to the number of bardic performance rounds expended (maximum bonus equal to 1/2 her deadly courtesan level). This ability replaces improved uncanny dodge."
import_trades = ["Improved uncanny dodge"]

[[entry.feature]]
anchor = "rogue-talents"
head = "Rogue Talents"
listed = false
print = "The following rogue talents complement the deadly courtesan archetype: finesse rogue, stand up (_Core Rulebook_); charmer, coax information, fast fingers, honeyed words (_Advanced Player's Guide_); convincing lie, deft palm (_Ultimate Combat_)."

[[entry.feature]]
anchor = "advanced-talents"
head = "Advanced Talents"
listed = false
print = "The following advanced rogue talents complement the deadly courtesan archetype: slippery mind (_Core Rulebook_); master of disguise (_Advanced Player's Guide_); rumormonger, unwitting ally (_Ultimate Combat_)."

[[entry]]
id = "ref/arc-rogue/swordmaster"
hold = "checker: [fields] trades = \"replaces: Trap sense\" disagrees with the trade sentences of the feature `tiger-trance` = \"replaces: all increments of trap sense\" (line 92)"
opening = ["A swordmaster meditates to strengthen her spiritual connection to her blade. She strives to perfect her skills by mastering six deadly trances. A swordmaster has the following class features."]

[[entry.feature]]
anchor = "class-skills"
head = "Class Skills"
listed = true
print = "The swordmaster adds Knowledge (nature) and Survival to her list of class skills and removes Disguise and Knowledge (dungeoneering) from her list of class skills."

[[entry.feature]]
anchor = "trance"
head = "Trance (Ex)"
listed = true
level = 3
print = '''
At 3rd level, a swordmaster learns to focus her martial prowess using an intense meditative trance. Under the influence of a trance, the swordmaster can perform fantastic martial feats. Entering a trance is a full-round action that provokes attacks of opportunity. The swordmaster can maintain the trance for a number of rounds per day equal to 4 + her Wisdom modifier. At each level beyond 3rd, she can remain in the trance for 1 additional round. She can end her trance as a free action. Following a trance, the swordmaster is [fatigued](ref/misc/fatigued) for a number of rounds equal to 2 × the number of rounds she spent in the trance. A swordmaster cannot enter a new trance while fatigued but can otherwise enter a trance multiple times during a single encounter or combat. If a swordmaster falls unconscious, her trance immediately ends.

At 3rd level, the swordmaster chooses one trance from the list below. She chooses another trance at 6th, 9th, 12th, 15th, and 18th level. She can only use one type of trance at a time.'''
import_trades = ["Trap sense"]

[[entry.feature]]
anchor = "crane-trance"
head = "Crane Trance (Ex)"
listed = true
print = "The swordmaster's blade rises and falls with the graceful sweeping arcs of the mountain crane. When in this trance, a swordmaster gains the benefits of the [Crane Style](ref/feat/crane-style) feat (_Ultimate Combat_ 93)."

[[entry.feature]]
anchor = "dragon-trance"
head = "Dragon Trance (Ex)"
listed = true
print = "Like the dragon, the swordmaster has honed the steadiness of her mind and body. When in this trance, a swordmaster gains the benefits of the [Dragon Style](ref/feat/dragon-style) feat (_Ultimate Combat_ 98)."

[[entry.feature]]
anchor = "leopard-trance"
head = "Leopard Trance (Ex)"
listed = true
print = "Using the swiftness of the leopard, a swordmaster's evasive footwork confuses her opponents. When in this trance, a swordmaster gains the benefits of the [Mobility](ref/feat/mobility) feat."

[[entry.feature]]
anchor = "monkey-trance"
head = "Monkey Trance (Ex)"
listed = true
print = "As the monkey springs, the swordmaster leaps from the reach of her enemies. While in this trance, a swordmaster can make an Acrobatics check opposed by an opponent's CMD. If she succeeds, she may move 5 feet as a swift action within the opponent's threatened area; this movement does not provoke attacks of opportunity and does not count as a 5-foot step."

[[entry.feature]]
anchor = "serpent-trance"
head = "Serpent Trance (Ex)"
listed = true
print = "Like the serpent, the swordmaster's quick movements allow her to catch her opponent unawares. While in this trance, a swordmaster receives a +4 bonus on Bluff checks made to feint during combat."

[[entry.feature]]
anchor = "tiger-trance"
head = "Tiger Trance (Ex)"
listed = true
print = '''
The swordmaster pounces upon her opponents, striking with the ferocity and brute force of a wild tiger. While in this trance, a swordmaster can make a combat maneuver check against an opponent within [charge](ref/rule/charge) range. If she succeeds, she may charge that opponent and make a full attack against that opponent.

This ability replaces all increments of trap sense.'''

[[entry.feature]]
anchor = "rogue-talents"
head = "Rogue Talents"
listed = false
print = "The following rogue talents complement the swordmaster archetype: combat trick, stand up, surprise attack, weapon training (_Core Rulebook_); befuddling strike, positioning strike (_Advanced Player's Guide_)."

[[entry.feature]]
anchor = "advanced-talents"
head = "Advanced Talents"
listed = false
print = "The following advanced rogue talents complement the swordmaster archetype: crippling strike, defensive roll (_Core Rulebook_); hunter's surprise, redirect attack (_Advanced Player's Guide_); confounding blade (_Ultimate Combat_)."

[[entry]]
id = "ref/arc-sorcerer/wishcrafter"
hold = "the replaces trade `7th-level bloodline feat` is not printed in a sentence, and no listed feature of that name prints it; the replaces trade `13th-level bloodline feat` is not printed in a sentence, and no listed feature of that name prints it; the replaces trade `19th-level bloodline feat` is not printed in a sentence, and no listed feature of that name prints it; Heart's Desire (Su): the sentence \"This ability replaces the bloodline bonus feat gained at 7th level\" names no trade; Twisted Wish (Su): the sentence \"This ability replaces the bloodline bonus feat gained at 13th level\" names no trade; Perfect Wishcraft (Su): the sentence \"This ability replaces the bloodline bonus feat gained at 19th level\" names no trade"
opening = ["Wishcrafters are born with a talent for manipulating reality inherited from their efreeti ancestors. However, like the genies they are descended from, wishcrafters can only draw upon this power to fulfill the desires of others. A wishcrafter has the following class features."]

[[entry.feature]]
anchor = "wishbound-arcana"
head = "Wishbound Arcana (Su)"
listed = true
level = 1
print = "At 1st level, the wishcrafter can use the wishes of non-genie creatures other than herself in place of the normal verbal components of her spells. A creature can make a wish as a free action at any time, even during the wishcrafter's turn. The wishcrafter must be able to hear and understand a wish in order to use it as a spell component. A spell that doesn't normally have a verbal component gains one when cast using this ability. A wish doesn't need to mention the name of a specific spell, but must describe an outcome that can be accomplished by casting a spell the wishcrafter knows (for example, wishing to be bigger could supply the verbal component for _[enlarge person](ref/spell/enlarge-person)_). A wishcrafter gains a +1 bonus to her caster level when using a creature's wish as a verbal component in this manner, but cannot include herself as a target of such spells. She can be affected by such a spell if it affects an area rather than a target or targets. A wishcrafter is under no compulsion to grant a creature's wish. Once the wishcrafter grants a creature's wish using this ability, she cannot use this ability to grant that creature any further wishes for 24 hours. This ability replaces bloodline arcana."
import_trades = ["Bloodline arcana"]

[[entry.feature]]
anchor = "expanded-wishcraft"
head = "Expanded Wishcraft"
listed = true
level = 3
print = "At 3rd level and every 2 levels thereafter, the wishcrafter grows more adept at altering reality to fit the whims of others. She may add an additional spell selected from the sorcerer/wizard spell list to her list of spells known. This spell must be one level lower than the highest-level spell she can cast. A wishcrafter can only use these spells in conjunction with her wishbound arcana ability. For example, if she used this ability to learn _[cat's grace](ref/spell/cats-grace)_, she can only cast it when another creature wishes for it, and can't cast it on herself because it is a targeted spell. She cannot use these spells to craft or recharge magic items. These bonus spells replace the bloodline spells gained by the sorcerer's bloodline."
import_trades = ["All bloodline spells"]

[[entry.feature]]
anchor = "heart-s-desire"
head = "Heart's Desire (Su)"
listed = true
level = 7
print = "At 7th level, as a swift action, a wishcrafter can force a single creature within 30 feet to confess its deepest desire. The target receives a Will save to negate this effect (DC 10 + 1/2 the wishcrafter's level + the wishcrafter's Charisma modifier). On a failed save, the creature must immediately wish aloud in a clear voice for something it truly desires, allowing the wishcrafter to activate her wishbound arcana ability if she knows a spell that can fulfill that wish. This is a mind-affecting effect. Regardless of whether the save is successful, a creature cannot be the target of the same wishcrafter's heart's desire ability again for 24 hours. The wishcrafter can use this ability a number of times per day equal to her Charisma bonus. This ability replaces the bloodline bonus feat gained at 7th level."
import_trades = ["7th-level bloodline feat"]

[[entry.feature]]
anchor = "twisted-wish"
head = "Twisted Wish (Su)"
listed = true
level = 13
print = "At 13th level, a wishcrafter becomes adept at corrupting wishes to negatively affect the creature that wished them. When a wishcrafter affects a creature with a spell using its wish as a spell component, she may twist the wish, applying a -4 penalty to the creature's saving throws against the spell. The effects of wishes twisted this way are difficult to remove; the DC of caster level checks to dispel them increases by 5. This ability replaces the bloodline bonus feat gained at 13th level."
import_trades = ["13th-level bloodline feat"]

[[entry.feature]]
anchor = "perfect-wishcraft"
head = "Perfect Wishcraft (Su)"
listed = true
level = 19
print = "At 19th level, the wishcrafter perfects her ability to manipulate reality. Once per day, she may cast any spell on the sorcerer/wizard spell list as if it were on her list of spells known. Using this ability otherwise has all of the benefits and limitations of the wishbound arcana ability. This ability replaces the bloodline bonus feat gained at 19th level."
import_trades = ["19th-level bloodline feat"]

[[entry]]
id = "ref/arc-summoner/blood-god-disciple"
hold = "checker: [fields] trades = \"replaces: Summon monster I; replaces: III; replaces: V; replaces: VII; replaces: and IX\" disagrees with the trade sentences of the feature `blood-feast` = \"replaces: the summon monster I, III, V, VII, and IX spell-like abilities\" (line 44)"
opening = ["A half-orc summoner who devotes himself to one of the bloody orc gods may believe his eidolon is an avatar of that god rather than a mere supernatural creature. A blood god disciple generally fights by the avatar's side and offers it blood sacrifices in exchange for martial prowess. A blood god disciple has the following class features."]

[[entry.feature]]
anchor = "blood-feast"
head = "Blood Feast (Su)"
listed = true
level = 1
print = '''
At 1st level, a blood god disciple can feed a recently fallen foe to his eidolon, allowing the outsider to channel some of its power into the summoner. The eidolon must spend a standard action to eat some of the opponent, which must be a living, corporeal creature killed or knocked unconscious by the eidolon or summoner in the past minute. This eating deals damage to the target as if the eidolon had attacked it with one natural attack (typically a bite). The fallen creature must have at least half as many Hit Dice as the summoner. Once the feeding is complete, the summoner may manifest one 1-point evolution. This lasts for 1 minute. The evolution's effects use the summoner's Hit Dice and ability scores rather than the eidolon's. The blood god disciple can use this ability a number of times per day equal to 3 + his Charisma modifier. He may only apply one use of this ability at a time (using it a second time replaces any evolution manifested with this ability), and can only manifest evolutions his eidolon has.

At 5th level, when the blood god disciple uses blood feast, he may manifest one 2-point evolution instead of a 1-point evolution. At 9th level, he may manifest up to two evolutions worth a total of 3 evolution points or fewer. At 13th level, he may manifest up to two evolutions worth a total of 4 evolution points or fewer. At 17th level, he may manifest up to three evolutions worth a total of 5 evolution points or fewer.

This ability replaces the _summon monster I_, _III_, _V_, _VII_, and _IX_ spell-like abilities.'''
import_trades = ["Summon monster I", "III", "V", "VII", "IX"]

[[entry.feature]]
anchor = "bloody-gift"
head = "Bloody Gift (Su)"
listed = true
level = 3
print = "At 3rd level, when a blood god disciple uses blood feast to manifest an evolution, he may touch one ally and grant it that evolution as well. Each affected ally counts as one use per day of the blood feast ability. At 7th, 11th, 15th, and 19th level, the blood god disciple can affect an additional creature with this ability (each one counting as a use per day of blood feast). If the blood god disciple can manifest multiple evolutions per use of blood feast, his selected allies manifest these multiple evolutions as well. This ability replaces the _summon monster II_ spell-like ability."
import_trades = ["Summon monster II"]

[[entry.feature]]
anchor = "avatar-gambit"
head = "Avatar Gambit (Ex)"
listed = true
level = 7
print = "At 7th level, when a blood god disciple dismisses his eidolon, he rages like a [barbarian](ref/class/barbarian) for a number of rounds equal to half his summoner level (he may end this rage early just like a barbarian, but if he does so, any remaining rounds of rage from this ability are lost). This replaces the _summon monster IV_ spell-like ability."
import_trades = ["Summon monster IV"]

[[entry.feature]]
anchor = "rage-power"
head = "Rage Power (Ex)"
listed = true
level = 11
print = "At 11th level and 15th level, a blood god disciple selects a barbarian rage power, which he may use when raging (whether from the avatar gambit ability or actual barbarian rage). This replaces the _summon monster VI_ and _VIII_ spell-like abilities."
import_trades = ["Summon monster VI", "VIII spell-like abilities"]

[[entry]]
id = "ref/arc-summoner/shadow-caller"
hold = "the replaces trade `Magical symbol that identifies the summoner and his eidolon` is not printed in a sentence, and no listed feature of that name prints it; Shadow Summoning (Sp): the sentence \"This ability replaces the summoner's normal summon monster spell-like abilities\" names no trade"
opening = ["While most summoners can call any manner of creature from across the planes to serve them in combat, supplementing the skills of their eidolon with a diverse range of creatures, others eschew this broad utility and instead concentrate upon calling forth entities from the Shadow Plane. A shadow caller has the following class features."]

[[entry.feature]]
anchor = "class-skills"
head = "Class Skills"
listed = true
print = "The shadow caller adds Stealth to his list of class skills and removes Use Magic Device from his list of class skills."

[[entry.feature]]
anchor = "shadow-summoning"
head = "Shadow Summoning (Sp)"
listed = true
print = '''
When a shadow caller uses his _summon monster_ ability or casts the _summon monster_ spell, he typically summons creatures from the Shadow Plane or creatures closely associated with shadow. When a creature on the _summon monster_ spell list indicates that it is summoned with either the celestial or the fiendish template based on the alignment of the caster, the creature summoned by the shadow caller has the shadow creature template instead (see sidebar). Furthermore, the _summon monster_ lists are modified in the following ways (these changes also apply to using a higher-level summon spell to summon multiple creatures from a lower-level list).

_Summon Monster I_: No changes.

_Summon Monster II_: A shadow caller cannot summon Small elementals or lemures, but instead can summon zoogs (_Bestiary 3_ 288).

_Summon Monster III_: A shadow caller cannot summon dretches or lantern archons, but can summon augur kytons (_Bestiary 3_ 171).

_Summon Monster IV_: A shadow caller cannot summon Medium elementals, hell hounds, hound archons, or mephits, but can summon allips (_Bestiary 3_ 12), gloomwings (_Bestiary 2_ 133), and shadows (_Bestiary_ 245).

_Summon Monster V_: A shadow caller cannot summon babau, bearded devils, bralani azatas, Large elementals, salamanders, or xills, but can summon shadow mastiffs (_Bestiary 3_ 241) and shae (_Bestiary 3_ 242).

_Summon Monster VI_: A shadow caller cannot summon Huge elementals, erinyes, lillend azatas, or succubi, but can summon cloakers (_Bestiary_ 47).

_Summon Monster VII_: A shadow caller cannot summon bebiliths, bone devils, greater elementals, or vrocks, but can summon greater shadows (_Bestiary_ 245).

_Summon Monster VIII_: A shadow caller can only summon derghodaemons (_Bestiary 3_ 66) and young umbral dragons (_Bestiary 2_ 102).

_Summon Monster IX_: A shadow caller can only summon interlocutor kytons (_Bestiary 3_ 174) and nightwings (_Bestiary 3_ 203).

This ability otherwise functions as and replaces the summoner's normal _summon monster_ spell-like abilities.'''

[[entry.feature]]
anchor = "shadow-eidolon"
head = "Shadow Eidolon"
listed = true
print = '''
A shadow caller's eidolon is at once a thing of shadow called from the deep of the Shadow Plane and his own shadow; the two are inseparable. When his eidolon manifests, his shadow lengthens and finally detaches from him as a creature unto itself. For as long as the shadow caller's eidolon is manifested, he and the eidolon do not have distinct shadows, regardless of the presence or absence of light. This lack of a shadow replaces the magical symbol that identifies the summoner and his eidolon.

This ability alters the summoner's eidolon ability. The following evolutions are available to all summoners. 2-Point Evolutions Shadow Blend (Su): In any condition of illumination other than bright light, the eidolon disappears into the shadows, giving it concealment (20% miss chance). If it has the shadow form evolution, it instead gains total concealment (50% miss chance). The eidolon can suspend or resume this ability as a free action.'''
import_trades = ["Eidolon", "Magical symbol that identifies the summoner", "his eidolon"]

[[entry.feature]]
anchor = "shadow-form"
head = "Shadow Form (Su)"
listed = true
print = "The eidolon's body becomes shadowy and more indistinct. This shadow form grants the eidolon constant concealment (20% miss chance), and its melee attacks affect incorporeal creatures as if it had the _ghost touch_ weapon property. The eidolon's melee attacks deal only half damage to corporeal creatures."

[[entry]]
id = "ref/arc-summoner/wild-caller-arg"
hold = "Eidolon: the sentence \"This ability alters the normal summoner's eidolon class feature, but is otherwise identical to that class feature\" names no trade"
opening = ["Often a half-elf 's ties to nature and elven heritage are so strong that they can dramatically affect the nature of his summonings. The wild caller calls eidolons that take more natural and savage forms and summons from nature rather than the Great Beyond. A wild caller has the following class features."]

[[entry.feature]]
anchor = "spells"
head = "Spells"
listed = true
print = "A wild caller does not have access to _[summon monster](ref/spell/summon-monster)_ spells. Instead, he swaps out those spells on his spell list with _[summon nature's ally](ref/spell/summon-natures-ally)_ spells of the same level. This ability alters the normal spell list of the summoner."
import_trades = ["Spell list of the summoner"]

[[entry.feature]]
anchor = "eidolon"
head = "Eidolon"
listed = true
print = '''
The eidolon of a wild caller tends to take more natural and more savage forms than other summoners' eidolons. A wild caller gains 1/4 his class level as bonus evolution points in his eidolon's evolution pool, but his eidolon cannot take the following evolutions:

_Advanced Player's Guide_—_1-point evolutions_: magic attacks, skilled (while the eidolon can select this evolution, it can only do so with the following skills: Acrobatics, Climb, Escape Artist, Fly, Intimidate, Perception, Survival, and Swim); _2-point evolutions_: energy attacks, immunity, weapon training; _3-point evolutions_: damage reduction, frightful presence; _4-point evolutions_: breath weapon, spell resistance.

_Ultimate Magic_—_1-point evolutions_: basic magic, unnatural aura; _2-point evolutions_: channel resistance, head, minor magic, undead appearance; _3-point evolutions_: major magic; _4-point evolutions_: dimension door, incorporeal form, lifesense, no breath, ultimate magic.

This ability alters the normal summoner's eidolon class feature, but is otherwise identical to that class feature.'''

[[entry.feature]]
anchor = "summon-nature-s-ally-i"
head = "Summon Nature's Ally I (Sp)"
listed = true
level = 1
print = "Starting at 1st level, a wild caller can cast _summon nature's ally_ a number of times per day equal to 3 + his Charisma modifier. At 3rd level and every 2 levels thereafter, the power of this ability increases by one spell level, allowing him to summon more powerful creatures (to a maximum of _summon nature's ally IX_ at 17th level). Furthermore, at 19th level, the wild caller cannot use _[gate](ref/spell/gate)_ as a [spell-like ability](ref/umr/spell-like-abilities), but can use either _[summon elder worm](ref/spell/summon-elder-worm)_ or _[summon froghemoth](ref/spell/summon-froghemoth)_ (_Ultimate Magic_ 240) instead. This ability otherwise functions like the standard summoner's _[summon monster I](ref/spell/summon-monster-1)_ ability and replaces that ability."
import_trades = ["Summon monster I"]

[[entry]]
id = "ref/arc-witch/dreamweaver"
hold = "checker: [fields] trades = \"replaces: 2nd-level hex\" disagrees with the trade sentences of the feature `dream-spinner` = \"replaces: the witch's hex gained at 2nd level\" (line 59)"
opening = ["A changeling dreamweaver draws upon her hag heritage to ply the dream realms in order to touch mortal minds and souls, for good or ill. A dreamweaver witch has the following class features."]

[[entry.feature]]
anchor = "class-skills"
head = "Class Skills"
listed = true
print = "The dreamweaver adds Sense Motive to her list of class skills and removes Healing from her list of class skills."

[[entry.feature]]
anchor = "patron"
head = "Patron"
listed = true
print = "A dreamweaver's patron is normally [portents](ref/patron/portents) or [stars](ref/patron/stars)."

[[entry.feature]]
anchor = "spells"
head = "Spells"
listed = true
print = "A dreamweaver replaces some of her patron's spells with the following: 2nd—_sow thoughts_ (see below), 4th—_dust of twilight_ (_Pathfinder RPG Advanced Player's Guide_), 6th—_deep slumber_, 8th—_modify memory_, 10th—_dream_, 12th— _cloak of dreams_ (_Advanced Player's Guide_), 14th—_ethereal jaunt_, 16th—_moment of prescience_, 18th—_astral projection_."

[[entry.feature]]
anchor = "dream-spinner"
head = "Dream Spinner (Su)"
listed = true
level = 2
print = "At 2nd level, when a dreamweaver casts a mind-affecting spell on a target that is sleeping because of her [slumber](ref/hex/slumber) hex or a spell she cast, she adds +1 to the mind-affecting spell's DC. If the target succeeds at the saving throw against the spell, it does not wake up, nor does it have any recollection of having resisted a spell. If appropriate, the dreamweaver may incorporate elements of a mind-affecting spell (i.e., _[sow thought](ref/spell/sow-thought)_, _[suggestion](ref/spell/suggestion)_, and so on) into the target's subconscious so it believes the spell's effects originated in its dreams (the details of how these elements fit into the dream is up to the GM). This ability replaces the witch's hex gained at 2nd level."
import_trades = ["2nd-level hex"]

[[entry.feature]]
anchor = "dream-thief"
head = "Dream Thief (Su)"
listed = true
level = 6
print = "At 6th level, a dreamweaver can alter the sleeping mind of any creature that is sleeping because of her slumber hex or a spell she cast. She can reshape one of the target's memories as if using _[modify memory](ref/spell/modify-memory)_. Alternatively, she may insert herself into the dreaming memories of the target, prompting the target's mind to show her some specific information; the dreamer's subconscious may resist, or try to deceive her with out-of-context memories, similar to the way a corpse can resist when questioned with _[speak with dead](ref/spell/speak-with-dead)_. A Will save negates either effect (DC equal to that of the witch's hex). Whether or not the save is successful, a creature cannot be the target of this hex again for 1 day. This ability replaces the witch's hex gained at 6th level."
import_trades = ["6th-level hex"]

[[entry.feature]]
anchor = "dream-possession"
head = "Dream Possession (Su)"
listed = true
level = 10
print = "At 10th level, a dreamweaver can take control of any creature that is sleeping because of her slumber hex or a spell she cast. This effect functions as _[magic jar](ref/spell/magic-jar)_, using the witch's familiar acting as the soul receptacle. A Will save negates either effect (DC equal to that of the witch's hex). Whether or not the save is successful, a creature cannot be the target of this hex again for 1 day. This ability replaces the witch's hex gained at 10th level."
import_trades = ["10th-level hex"]

[[entry.feature]]
anchor = "hexes"
head = "Hexes"
listed = false
print = "The following hexes complement the dreamweaver archetype: charm, slumber (_Advanced Player's Guide_); beast of ill-omen (_Ultimate Magic_)."

[[entry.feature]]
anchor = "major-hexes"
head = "Major Hexes"
listed = false
print = "The following major hexes complement the dreamweaver archetype: nightmare, vision (_Advanced Player's Guide_)."

[[entry.feature]]
anchor = "grand-hexes"
head = "Grand Hexes"
listed = false
print = "The following grand hexes complement the dreamweaver archetype: eternal slumber (_Advanced Player's Guide_); dire prophecy (_Ultimate Magic_)."

[[entry]]
id = "ref/arc-wizard/cruoromancer"
hold = "checker: [fields] trades = \"replaces: 5th-level bonus feat\" disagrees with the trade sentences of the feature `blood-command` = \"replaces: the 5th-level wizard bonus feat\" (line 64)"
opening = ["To those who know how to manipulate it, the blood of a dhampir can be a powerful component to magic. A cruoromancer infuses his necromantic magic with the power of his unique mixture of living blood and undead ichor. As his power increases in this strange arcane art, a cruoromancer finds potent ways to infuse his unique blood with necromancy spells. A cruoromancer has the following class features."]

[[entry.feature]]
anchor = "blood-infusion"
head = "Blood Infusion (Su)"
listed = true
print = "When a cruoromancer casts a spell of the necromancy school, he can opt to infuse that spell with his undead-tainted blood as a swift action. As he increases in level, the power and effects of such infusions become more potent. Each time a cruoromancer uses blood infusion, he drains a portion of his own blood either by cutting himself with a blade or by opening a scab from a previous wound. When he does this, he takes an amount of damage equal to 1d4 + the level of the spell being infused. A cruoromancer can only affect a spell with a single type of blood infusion. At 1st level, he can infuse his necromancy spells in either of the following ways."

[[entry.feature]]
anchor = "focused-infusion"
head = "Focused Infusion"
listed = false
parent = "blood-infusion"
print = "When the cruoromancer uses this infusion, he adds +1 to the DC of the infused necromancy spell."

[[entry.feature]]
anchor = "sickening-infusion"
head = "Sickening Infusion"
listed = false
parent = "blood-infusion"
print = '''
When the cruoromancer uses this infusion, any creature damaged by the infused necromancy spell becomes [sickened](ref/misc/sickened) for 1 round.

This ability replaces arcane bond.'''
import_trades = ["Arcane bond"]

[[entry.feature]]
anchor = "blood-command"
head = "Blood Command (Su)"
listed = true
level = 5
print = "At 5th level, a cruoromancer can control up to 5 Hit Dice worth of undead creatures per caster level instead of the normal 4 Hit Dice of undead when casting the _[animate dead](ref/spell/animate-dead)_ spell. He also gains the following blood infusion ability."

[[entry.feature]]
anchor = "commanding-infusion"
head = "Commanding Infusion"
listed = false
parent = "blood-command"
print = '''
When using this infusion with _[animate dead](ref/spell/animate-dead)_, the cruoromancer can create a number of Hit Dice of undead equal to three times his caster level instead of twice his caster level.

This ability replaces the 5th-level wizard bonus feat.'''
import_trades = ["5th-level bonus feat"]

[[entry.feature]]
anchor = "blood-desecration"
head = "Blood Desecration (Su)"
listed = true
level = 10
print = "At 10th level, a cruoromancer gains the following blood infusion."

[[entry.feature]]
anchor = "desecrating-infusion"
head = "Desecrating Infusion"
listed = false
parent = "blood-desecration"
print = "When the cruoromancer uses this infusion, he can choose to center a _[desecrate](ref/spell/desecrate)_ effect on himself or a single target of the spell modified by this infusion (he chooses upon casting). This effect is like the _[desecrate](ref/spell/desecrate)_ spell, but lasts for 1 minute per caster level of the cruoromancer, and does not interact with altars, shrines, or permanent fixtures that boost the _[desecrate](ref/spell/desecrate)_ effect. This ability replaces the 10th-level wizard bonus feat."
import_trades = ["10th-level bonus feat"]

[[entry.feature]]
anchor = "blood-ability"
head = "Blood Ability (Su)"
listed = true
level = 15
print = "At 15th level, a cruoromancer can choose to scry through a single undead creature he created with a spell modified by a commanding infusion. The undead creature is treated as if imbued with an _[arcane eye](ref/spell/arcane-eye)_ spell (caster level equal to the cruoromancer's wizard level). This ability replaces the 15th-level wizard bonus feat."
import_trades = ["15th-level bonus feat"]

[[entry.feature]]
anchor = "perfect-infusion"
head = "Perfect Infusion (Su)"
listed = true
level = 20
print = "At 20th level, a cruoromancer can use his blood infusions without taking damage. This ability replaces the 20th-level wizard bonus spell."
import_trades = ["The 20th-level wizard bonus spell"]

[[entry]]
id = "ref/arc-wizard/wind-listener"
hold = "the replaces trade `5th-level bonus feat` is not printed in a sentence, and no listed feature of that name prints it; the replaces trade `10th-level bonus feat` is not printed in a sentence, and no listed feature of that name prints it; the replaces trade `15th-level bonus feat` is not printed in a sentence, and no listed feature of that name prints it; Abjuration Sense (Ex): the sentence \"This ability replaces the bonus feat gained at 5th level\" names no trade; Wispy Form (Ex): the sentence \"This ability replaces the bonus feat gained at 10th level\" names no trade; Listening to the Wind (Sp): the sentence \"This ability replaces the bonus feat gained at 15th level\" names no trade"
opening = ["The wind listener takes a sylph's natural curiosity to the extreme, enhancing his natural skill at subterfuge and eavesdropping with potent arcane magic. A wind listener has the following class features."]

[[entry.feature]]
anchor = "class-skills"
head = "Class Skills"
listed = true
print = "A wind listener adds Perception to his list of class skills."

[[entry.feature]]
anchor = "arcane-school"
head = "Arcane School"
listed = true
print = "A wind listener cannot select divination or illusion as an opposition school."

[[entry.feature]]
anchor = "spontaneous-divination"
head = "Spontaneous Divination (Su)"
listed = true
level = 1
print = "At 1st level, a wind listener can reshape stored spell energy into divination spells he did not prepare ahead of time. The wind listener can \"lose\" any prepared spell that is not a cantrip in order to cast a divination spell of the same spell level or lower. The new spell must be one the wind listener knows and is capable of casting. Spells cast with this ability increase their casting time to a full-round action (if the spell's normal casting time is longer than a full-round action, it remains unchanged). This ability replaces arcane bond."
import_trades = ["Arcane bond"]

[[entry.feature]]
anchor = "abjuration-sense"
head = "Abjuration Sense (Ex)"
listed = true
level = 5
print = "At 5th level, a wind listener develops a sixth sense for spotting spells designed to guard against his investigations. He gains a bonus on Perception checks equal to 1/2 his level to notice spells of the abjuration school and on [Spellcraft](ref/skill/spellcraft) checks to identify abjuration effects, spells, and magic items. This ability replaces the bonus feat gained at 5th level."
import_trades = ["5th-level bonus feat"]

[[entry.feature]]
anchor = "wispy-form"
head = "Wispy Form (Ex)"
listed = true
level = 10
print = "At 10th level, the wind listener gains the ability to become airy and translucent as a standard action, gaining DR 10/magic and the effects of _[greater invisibility](ref/spell/invisibility-greater)_ for a number of rounds per day equal to his level. These rounds need not be consecutive. Like the [natural invisibility](ref/umr/natural-invisibility) universal monster ability (_Bestiary 2_ 299), this ability is not subject to _[invisibility purge](ref/spell/invisibility-purge)_. This ability replaces the bonus feat gained at 10th level."
import_trades = ["10th-level bonus feat"]

[[entry.feature]]
anchor = "listening-to-the-wind"
head = "Listening to the Wind (Sp)"
listed = true
level = 15
print = "At 15th level, the wind listener can call upon spirits of the air to uncover lost lore about a legendary person, place, or thing. Invoking the spirits takes 10 minutes, during which time the wind listener must be free of distractions and able to concentrate. Once called, the spirits seek out information on the subject of the wind listener's inquiries. This functions as the spell _[legend lore](ref/spell/legend-lore)_ (caster level equal to the wind listener's level), except that the wind listener is free to engage in other activities while spirits investigate on his behalf. The time required for the air spirits to return with this information is equal to what the casting time of the spell _[legend lore](ref/spell/legend-lore)_ would have been if the wind listener had cast it. The wind listener can use this ability once per week, and only if he does not currently have air spirits searching for information. If the air spirits are currently searching for information, the wind listener can end their task early as a standard action, dismissing the magical effect and not returning any information. This ability replaces the bonus feat gained at 15th level."
import_trades = ["15th-level bonus feat"]
