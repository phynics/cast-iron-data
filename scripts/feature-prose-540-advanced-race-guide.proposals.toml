[[entry]]
id = "ref/arc-oracle/ancient-lorekeeper"
hold = "the replaces trade `Bonus skills from the oracle's mystery` is not printed in a sentence, and no listed feature of that name prints it; the replaces trade `Bonus spells gained from the oracle's mystery` is not printed in a sentence, and no listed feature of that name prints it; Elven Arcana (Ex): the sentence \"This ability replaces the bonus spells she would normally gain at these levels from her chosen mystery\" names no trade"
opening = ["The ancient lorekeeper is a repository for all the beliefs and vast knowledge of an elven people. She shows a strong interest in and understanding of histories and creation legends at a young age, and as she matures her calling to serve as the memory of her long-lived people becomes clear to all who know her. An ancient lorekeeper has the following class features."]

[[entry.feature]]
anchor = "class-skills"
head = "Class Skills"
listed = true
print = "An ancient lorekeeper adds Knowledge (arcane) and Knowledge (local) to her list of class skills. Whenever she makes a Knowledge check of any kind about a question regarding elves (creatures of the elf subtype), the ancient lorekeeper adds half her class level on her check. This replaces the bonus skills the ancient lorekeeper gains from her mystery."

[[entry.feature]]
anchor = "elven-arcana"
head = "Elven Arcana (Ex)"
listed = true
level = 2
print = "At 2nd level, an ancient lorekeeper's mastery of elven legends and philosophy has allowed her to master one spell used by elven wizards. She selects one spell from the sorcerer/wizard spell list that is at least one level lower than the highest-level oracle spell she can cast. The ancient lorekeeper gains this as a bonus spell known. The spell is treated as one level higher than its true level for all purposes. The ancient lorekeeper may choose an additional spell at 4th, 6th, 8th, 10th, 12th, 14th, 16th, and 18th levels. This ability replaces the bonus spells she would normally gain at these levels from her chosen mystery."
import_trades = ["Bonus spells gained from the oracle's mystery"]

[[entry.feature]]
anchor = "mysteries"
head = "Mysteries"
listed = false
print = "The following oracle mysteries complement the ancient lorekeeper archetype: [Lore](ref/mystery/lore), [Nature](ref/mystery/nature), [Waves](ref/mystery/waves), [Wind](ref/mystery/wind) (_Advanced Player's Guide_); [Ancestor](ref/mystery/ancestor), [Time](ref/mystery/time), [Wood](ref/mystery/wood) (_Ultimate Magic_)."

