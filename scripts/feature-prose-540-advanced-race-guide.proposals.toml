[[entry]]
id = "ref/arc-alchemist/deep-bomber"
hold = "the alters trade `Swift alchemy` is not printed in a sentence, and no listed feature of that name prints it"
opening = ["Consumed with keeping hidden from the horrors below the surface, svirfneblin use their proclivity for alchemy and talent for obfuscation to strike from the darkness and retreat unseen. A deep bomber has the following class features."]

[[entry.feature]]
anchor = "silent-bomb"
head = "Silent Bomb"
listed = true
level = 2
print = "At 2nd level, when the deep bomber creates a bomb, he can choose to have it explode without making any noise, although those damaged by it may cry out. This ability replaces poison use."
import_trades = ["Poison use"]

[[entry.feature]]
anchor = "targeting-bomb"
head = "Targeting Bomb*"
listed = true
level = 3
print = "At 3rd level, when the deep bomber creates a bomb, he can choose to have its detonation include a _[faerie fire](ref/spell/faerie-fire)_ effect that applies to all creatures within the splash radius (including the target, if any). This ability replaces swift alchemy (the deep bomber gains swift alchemy at 18th level and never gains instant alchemy)."
import_trades = ["Instant alchemy"]

[[entry.feature]]
anchor = "stonekin"
head = "Stonekin"
listed = true
level = 6
print = "At 6th level, the deep bomber automatically learns _[tree shape](ref/spell/tree-shape)_ as a 2nd-level extract, except instead of a tree, he takes the form of a stalagmite that is the same size as his current size. At 7th level, he automatically learns _[meld into stone](ref/spell/meld-into-stone)_ as a 3rd-level extract. This ability replaces swift poisoning."
import_trades = ["Swift poisoning"]

[[entry.feature]]
anchor = "discoveries"
head = "Discoveries"
listed = false
print = "The following discoveries complement the deep bomber archetype: [delayed bomb](ref/discovery/delayed-bomb), [dispelling bomb](ref/discovery/dispelling-bomb), [fast bombs](ref/discovery/fast-bombs), [infusion](ref/discovery/infusion), [madness bomb](ref/discovery/madness-bomb), [poison bomb](ref/discovery/poison-bomb)."

[[entry]]
id = "ref/arc-alchemist/plague-bringer"
hold = "checker: [fields] trades = \"replaces: Poison resistance; replaces: poison immunity\" disagrees with the trade sentences of the feature `disease-resistance` = \"replaces: all increments of poison resistance and poison immunity\" (line 70)"
opening = ["The plague bringer sees disease as the ultimate weapon, and has worked tirelessly to master new diseases and disease-delivery systems. A plague bringer feels no more remorse at unleashing his armaments on his enemies than an archer does when firing an arrow in the heat of battle. Disease is a tool, and the plague bringer is its master. A plague bringer has the following class features."]

[[entry.feature]]
anchor = "plague-vial"
head = "Plague Vial (Su)"
listed = true
level = 1
print = '''
At 1st level, a plague bringer can create a plague vial, an alchemically grown and concentrated disease sample. It takes 1 hour to prepare a plague vial, and once prepared, the vial remains potent until used. A plague bringer can only maintain 1 plague vial at a time—if he prepares a second vial, any existing plague vial becomes inert. A plague vial that is not in a plague bringer's possession becomes inert until a plague bringer picks it up again.

It's a standard action to drink a plague vial. Upon being imbibed, the plague vial infects the plague bringer's blood, sweat, tears, and other bodily fluids for 10 minutes per class level. Any creature that harms him with melee attacks (except with reach weapons) must make a Fortitude save (DC 10 + 1/2 the plague bringer's level + the plague bringer's Intelligence modifier) or become [sickened](ref/misc/sickened) for 1 round per plague bringer level. The plague bringer is immune to the effect of his own plague vial, but not that of another's plague vial. The effects of multiple plague vials do not stack.

As a standard action, the plague bringer can infect a weapon with this sickness (typically by licking it or wiping his blood or pus on it). The disease on the weapon works like a poisoned weapon, except the source is a disease instead of a poison (so a dwarf's resistance to poison does not apply).

Anyone other than a plague bringer (including another alchemist) who drinks a plague vial must make a saving throw against the vial's DC or become [nauseated](ref/misc/nauseated) for 1 hour. Unless he learns how to brew a [mutagen](ref/discovery/mutagen) by taking the mutagen discovery (see _Ultimate Magic_), he can never benefit from a mutagen and reacts to it as if he were a non-alchemist. At any particular time, a plague bringer can only be under the effect of either a plague vial or a mutagen (not both); drinking another immediately ends the effects of any ongoing plague vial or mutagen.

All limitations to mutagens apply to plague vials as if they were the same substance. The [infuse mutagen](ref/discovery/infuse-mutagen) discovery and persistent mutagen class ability apply to plague vials. The [sticky poison](ref/discovery/sticky-poison) discovery applies to a weapon infected with a plague vial. The plague vial is a disease effect. This ability replaces mutagen.'''
import_trades = ["Mutagen"]

[[entry.feature]]
anchor = "disease-resistance"
head = "Disease Resistance (Ex)"
listed = true
level = 2
print = "At 2nd level, a plague bringer gains a +2 bonus on all saving throws against disease. This bonus increases to +4 at 5th level, and to +6 at 8th level. At 10th level, a plague bringer becomes completely immune to disease (including magical diseases). This ability replaces all increments of poison resistance and poison immunity."
import_trades = ["Poison resistance", "poison immunity"]

[[entry.feature]]
anchor = "discoveries"
head = "Discoveries"
listed = false
print = "The following discoveries complement the plague bringer archetype: [explosive bomb](ref/discovery/explosive-bomb), [precise bombs](ref/discovery/precise-bombs), [smoke bomb](ref/discovery/smoke-bomb) (_Advanced Player's Guide_); [breath weapon bomb](ref/discovery/breath-weapon-bomb), fast bomb, nauseating bomb (_Ultimate Combat_); [plague bomb](ref/discovery/plague-bomb) (_Ultimate Magic_)."

[[entry]]
id = "ref/arc-barbarian/feral-gnasher"
hold = "the replaces trade `2nd-level rage power` is not printed in a sentence, and no listed feature of that name prints it"
opening = ["Feral gnashers grow up in the wild, either raised by animals or scraping by on their own, and soon learn to fend for themselves. These barbarians often utilize pieced-together armor and fight with their sharp teeth and whatever improvised weapons are within reach. A feral gnasher has the following class features."]

[[entry.feature]]
anchor = "weapon-and-armor-proficiency"
head = "Weapon and Armor Proficiency"
listed = false
print = "A feral gnasher loses all martial weapon proficiencies except for [greatclub](ref/eq-weapon/greatclub) and loses proficiency with medium armor."

[[entry.feature]]
anchor = "savage-bite"
head = "Savage Bite (Ex)"
listed = true
level = 1
print = "At 1st level, a feral gnasher gains a savage bite attack. This is a primary [natural attack](ref/umr/natural-attacks) that deals 1d4 points of damage. If the goblin already has the hard head, big teeth racial trait, the damage increases to 1d6. At 10th level, the damage from a feral gnasher's bite increases to 1d6 (or 1d8 if the goblin has the hard head, big teeth racial trait) and deals ×3 damage on a critical hit. This ability replaces fast movement."
import_trades = ["Fast movement"]

[[entry.feature]]
anchor = "impromptu-armament"
head = "Impromptu Armament (Ex)"
listed = true
level = 2
print = "At 2nd level, a feral gnasher gains [Throw Anything](ref/feat/throw-anything) as a bonus feat and can pick up an unattended object that can be wielded in one hand as a free action. Additionally, the feral gnasher can take [Catch Off-Guard](ref/feat/catch-off-guard) in place of a rage power. This replaces the rage power gained at second level."
import_trades = ["2nd-level rage power"]

[[entry.feature]]
anchor = "lockjaw"
head = "Lockjaw (Ex)"
listed = true
level = 3
print = "At 3rd level, a feral gnasher gains the [grab](ref/umr/grab) ability with her bite attack. A feral gnasher can use this ability on a creature up to one size category larger than she is. This replaces trap sense +1."
import_trades = ["Trap sense +1"]

[[entry.feature]]
anchor = "improvised-weapon-mastery"
head = "Improvised Weapon Mastery (Ex)"
listed = true
level = 5
print = "At 5th level, a feral gnasher gains [Improvised Weapon Mastery](ref/feat/improvised-weapon-mastery) as a bonus feat. This replaces improved uncanny dodge."
import_trades = ["Improved uncanny dodge"]

[[entry.feature]]
anchor = "improved-lockjaw"
head = "Improved Lockjaw (Ex)"
listed = true
level = 6
print = "At 6th level, as long as a feral gnasher is controlling the grapple with her [lockjaw](ref/spell/lockjaw) attack, she does not gain the grappled condition, but is unable to move or use her mouth for anything other than grappling. This ability replaces trap sense +2."
import_trades = ["Trap sense +2"]

[[entry.feature]]
anchor = "greater-lockjaw"
head = "Greater Lockjaw (Ex)"
listed = true
level = 9
print = "At 9th level and again at 15th level, the size of a creature a feral gnasher is able to use her lockjaw's grab ability on increases by one size increment. This ability replaces trap sense +3 and trap sense +5."
import_trades = ["Trap sense +3", "trap sense +5"]

[[entry.feature]]
anchor = "wicked-improvisation"
head = "Wicked Improvisation (Ex)"
listed = true
level = 12
print = "At 12th level, a feral gnasher becomes more capable with improvised weapons and natural attacks. The feral gnasher gains a +1 competence bonus on damage rolls when using natural attacks or improvised weapons while raging. At 14th level and every two levels thereafter, the damage bonus increases by +1. This increase is not precision damage and is thus multiplied on a critical hit. This ability replaces trap sense +4."
import_trades = ["Trap sense +4"]

[[entry.feature]]
anchor = "rage-powers"
head = "Rage Powers"
listed = false
print = "The following rage powers complement the feral gnasher archetype: [increased damage reduction](ref/ragepower/increased-damage-reduction), [scent](ref/ragepower/scent), [superstition](ref/ragepower/superstition) (_Core Rulebook_); [beast totem](ref/ragepower/beast-totem), beast totem (greater), beast totem (lesser) (_Advanced Player's Guide_); [eater of magic](ref/ragepower/eater-of-magic), [ghost rager](ref/ragepower/ghost-rager) (_Ultimate Combat_)."

[[entry]]
id = "ref/arc-barbarian/hateful-rager"
hold = "the replaces trade `2nd, 8th, 14th, and 20th level rage powers` is not printed in a sentence, and no listed feature of that name prints it; Favored Enemy (Ex): the sentence \"This ability replaces the barbarian's rage power gained at 2nd level\" names no trade"
opening = ["From a young age, many half-orcs are treated cruelly, bullied, ridiculed, and made outcasts. While some hide their shame, others foster a deep, burning hatred that they channel into a raw fury and unleash against their enemies. These half-orcs are called hateful ragers. A hateful rager has the following class features."]

[[entry.feature]]
anchor = "reduced-rage"
head = "Reduced Rage (Ex)"
listed = true
level = 2
print = "At 2nd level and every level thereafter, a hateful rager only gains 1 additional round of rage per day instead of the normal 2 additional rounds of rage per day."

[[entry.feature]]
anchor = "favored-enemy"
head = "Favored Enemy (Ex)"
listed = true
level = 2
print = '''
At 2nd level, a hateful rager selects a [favored enemy](ref/ability/favored-enemy). This ability works identically to the [ranger](ref/class/ranger) ability of the same name. At 8th, 14th, and 20th level, the hateful rager selects another favored enemy and increases her bonus against one favored enemy type, as described in the ranger class.

While raging, the hateful rager makes every effort to fight a favored enemy rather than other opponents. If aware of the presence of a favored enemy, the hateful rager must make a DC 20 Will save each round to attack another creature; failure means the barbarian must attack the favored enemy or move closer to that enemy. She may freely attack creatures preventing her from reaching that favored enemy (regardless of whether they are actively trying to prevent her attacks or merely in the way). She can avoid harmful obstacles normally in her attempts to reach the target and is not forced to take the shortest route.

This ability replaces the barbarian's rage power gained at 2nd level. At 8th, 14th, and 20th levels, in place of a rage power she gains another favored enemy and increases her bonus against one favored enemy type.'''
import_trades = ["2nd", "8th", "14th", "20th level rage powers"]

[[entry.feature]]
anchor = "feed-the-rage"
head = "Feed the Rage (Ex)"
listed = true
level = 5
print = "At 5th level, a hateful rager gains 1 additional round of rage for each favored enemy she knocks unconscious or kills in combat. These current rounds of rage can only be used to add to the duration of her rage, and disappear when the rage ends. This ability replaces improved uncanny dodge."
import_trades = ["Improved uncanny dodge"]

[[entry.feature]]
anchor = "amplified-by-hate"
head = "Amplified by Hate (Ex)"
listed = true
level = 9
print = "At 9th level, a hateful rager adds [half](ref/misc/fractions-and-rounding) her favored enemy bonus to the DC of any rage power she uses against a favored enemy. This ability replaces trap sense +3."
import_trades = ["Trap sense +3"]

[[entry.feature]]
anchor = "rage-powers"
head = "Rage Powers"
listed = false
print = "The following rage powers complement the hateful rager archetype: [intimidating glare](ref/ragepower/intimidating-glare), [roused anger](ref/ragepower/roused-anger), [terrifying howl](ref/ragepower/terrifying-howl) (_Core Rulebook_); [come and get me](ref/ragepower/come-and-get-me), [inspire ferocity](ref/ragepower/inspire-ferocity), [overbearing advance](ref/ragepower/overbearing-advance), [reckless abandon](ref/ragepower/reckless-abandon) (_Advanced Player's Guide_)."

[[entry]]
id = "ref/arc-bard/shadow-puppeteer"
hold = "checker: [fields] trades = \"replaces: Inspire courage; replaces: inspire competence\" disagrees with the trade sentences of the feature `bardic-performance` = \"replaces: all levels of inspire courage and inspire competence\" (line 35)"
opening = ["A shadow puppeteer invokes amazing and terrifying shadow puppet shows, producing supernatural effects by creating and manipulating shadow. A shadow puppeteer has the following class feature."]

[[entry.feature]]
anchor = "bardic-performance"
head = "Bardic Performance"
listed = true
print = "A shadow puppeteer gains the following types of bardic performance. The character must be able to perform shadow puppetry in order to activate any of these abilities. Shadow puppetry uses Perform (act), and requires a light source. These abilities replace all levels of inspire courage and inspire competence."
import_trades = ["Inspire courage", "inspire competence"]

[[entry.feature]]
anchor = "shadow-servant"
head = "Shadow Servant (Sp)"
listed = true
level = 1
print = "At 1st level, the puppeteer can create a _shadow servant_ to perform simple tasks. The shadow servant is identical to an _[unseen servant](ref/spell/unseen-servant)_ (caster level equal to the shadow puppeteer's bard level), except it appears as a formless shadow. Shadow servant relies on visual components."

[[entry.feature]]
anchor = "shadow-puppets"
head = "Shadow Puppets (Sp)"
listed = true
level = 1
print = "At 1st level, a shadow puppeteer can use bardic performance to create one quasi-real shadowy creature resembling a monster from the _[summon monster I](ref/spell/summon-monster-1)_ list. These shadowy creatures otherwise work like _[shadow conjuration](ref/spell/shadow-conjuration)_, and targets interacting with them get a Will saving throw (DC 10 + 1/2 your bard level + your Charisma bonus) to treat them as only 20% real. At 4th level and every three levels thereafter, this ability acts like the next higher version of _summon monster_ (_summon monster II_ at 4th level and so on)."

[[entry]]
id = "ref/arc-bard/watersinger"
hold = "checker: [fields] trades = \"replaces: The use of lore master gained at 5th level\" disagrees with the trade sentences of the feature `lifewater` = \"replaces: the use of lore master gained at 5th level (though a watersinger still gains the use of lore master once per day at 11th level and twice per day at 17th"
opening = ["The watersinger's song reaches from the depths of his soul into the elemental waters from which life first sprang. His voice commands water, bending and shaping it to his desire."]

[[entry.feature]]
anchor = "bardic-performance"
head = "Bardic Performance"
listed = true
print = "A watersinger has some unique bardic performances, which replace some of the standard bardic performances as listed in each entry. These bardic performances follow all the general rules and restrictions of a bard's bardic performances."

[[entry.feature]]
anchor = "watersong"
head = "Watersong (Su)"
listed = true
level = 1
print = "At 1st level, a watersinger can use bardic performance to manipulate and control the shape of water within 30 feet. A successful Perform check allows the bard to animate and control a 5-foot-cube of water. The watersinger can command the water to take various forms, bend, rise, fall, or sustain a shape, and can make it support weight as if it were solid ice. For example, the watersinger could create a pillar of water (to provide cover), ladder, channel, bridge, stairs, slide, and so on. The manipulated water is as slippery as normal ice. This ability cannot create forms more fragile or complex than what could be carved in normal ice. While under the bard's control, the water has [hardness](ref/umr/hardness) 0 and 3 hit points per inch of thickness. At level 3, the manipulated water gains [hardness](ref/umr/hardness) 1, and this increases by +1 for every 3 bard levels beyond that. At 5th, 10th, 15th, and 20th level, the volume affected increases by an additional 5-foot cube (these cubes must be adjacent to each other). The manipulated water retains its shape for 1 round after the bard stops spending bardic performance rounds to maintain it. This ability replaces fascinate, suggestion, and mass suggestion."
import_trades = ["Fascinate", "suggestion", "mass suggestion"]

[[entry.feature]]
anchor = "waterstrike"
head = "Waterstrike (Su)"
listed = true
level = 3
print = "At 3rd level, the watersinger can spend 1 round of bardic performance to command any water he is currently manipulating with his watersong performance to lash out and strike an opponent with a slam attack. The watersinger uses his base attack bonus and Charisma bonus to make this attack, and deals 1d6 points of bludgeoning damage plus his Charisma bonus. The attack can originate from any square of water the bard is manipulating, and the water can get a flanking bonus or help a combatant get one, but cannot make attacks of opportunity. The water can make multiple attacks per round if your base attack bonus allows you to do so. At 10th level, the water's slam damage increases to 1d8 points and the water gains a reach of 10 feet. At 15th level, the water's slam damage increases to 2d6 points. At 20th level, the water's slam damage increases to 2d8 points. This performance replaces inspire competence."
import_trades = ["Inspire competence"]

[[entry.feature]]
anchor = "lifewater"
head = "Lifewater (Su)"
listed = true
level = 5
print = "At 5th level, the watersinger can spend 1 round of bardic performance as a standard action to manipulate the water, blood, and other fluids within a creature's body, causing the target to become [sickened](ref/misc/sickened) for 1d4 rounds. Alternatively, he may use this ability to attempt a [reposition](ref/rule/reposition) combat maneuver (_Advanced Player's Guide_), using his base attack bonus and his Charisma modifier as his CMB. This ability has a range of 30 feet, only works on creatures whose bodies contain fluid, and does not affect creatures that are immune to critical hits. This performance replaces the use of lore master gained at 5th level (though a watersinger still gains the use of lore master once per day at 11th level and twice per day at 17th)."
import_trades = ["The use of _lore master_ gained at 5th level"]

[[entry.feature]]
anchor = "watersinger-spells"
head = "Watersinger Spells"
listed = true
print = "A watersinger adds certain water-themed spells to his spell list. He adds these abilities to his spell list as soon as his bard level allows him to cast spells of that spell level. 0—_create water_; 1st—_hydraulic push_ (_Advanced Player's Guide_), _slipstream_ (_Advanced Player's Guide_); 2nd— _aqueous orb_ (_Advanced Player's Guide_), _hydraulic torrent_ (_Advanced Player's Guide_), _water walk_; 3rd—_fluid form_ (_Advanced Player's Guide_), _ride the waves_ (_Ultimate Magic_); 4th—_control water_, _communal water walk_ (_Ultimate Combat_); 5th—_vortex_ (_Advanced Player's Guide_); 6th—_seamantle_ (_Advanced Player's Guide_)."

[[entry]]
id = "ref/arc-gunslinger/gulch-gunner"
hold = "the alters trade `Grit` is not printed in a sentence, and no listed feature of that name prints it"
opening = ["Ratfolk warfare often occurs in cramped, claustrophobic spaces such as the ratfolk's own underground warrens and heavily trapped gulch fortresses, or the subterranean tunnels of goblins and similar foes. Since these battlegrounds often have tight corners and few areas with long lines of sight, those ratfolk who seek to master the use of firearms almost inevitably become experts in close-quarters combat. These gulch gunners often specialize in proficiency with a single pistol (easily handled in tight spaces) and wander from warren to warren selling their tunnel-shooting skills to the highest bidder. A gulch gunner has the following class features."]

[[entry.feature]]
anchor = "class-skills"
head = "Class Skills"
listed = true
print = "A gulch gunner adds Disable Device, Escape Artist, and Knowledge (dungeoneering) to her list of class skills and removes Knowledge (local), Ride, and Swim from her list of class skills."

[[entry.feature]]
anchor = "grit"
head = "Grit (Ex)"
listed = true
level = 1
print = "At 1st level, a gulch gunner gains grit as a standard gunslinger. However, the close-combat focus of the gulch gunner results in a slightly different set of circumstances for regaining grit."
import_trades = ["Grit"]

[[entry.feature]]
anchor = "daring-adjacent-shot"
head = "Daring Adjacent Shot"
listed = false
parent = "grit"
print = "The first time each round the gulch gunner makes a ranged firearm attack against an adjacent foe and provokes an attack of opportunity, she regains 1 grit point. Making an adjacent firearm attack against a [helpless](ref/misc/helpless) or unaware creature or on a creature that has fewer Hit Dice than half the gulch gunner's character level does not restore grit, nor do ranged attacks using some ability that prevents the gulch gunner from provoking an attack of opportunity. This ability replaces the ability to regain grit from a critical hit with a firearm."
import_trades = ["The ability to regain grit from a critical hit with a firearm"]

[[entry.feature]]
anchor = "deeds"
head = "Deeds"
listed = true
print = "A gulch gunner has some unique deeds, which replace some of the standard gunslinger deeds as listed in each entry. These deeds follow all the general rules and restrictions of gunslinger deeds."

[[entry.feature]]
anchor = "flash-and-shock"
head = "Flash and Shock (Ex)"
listed = true
level = 1
print = "At 1st level, the gulch gunner can take advantage of the flash and sound of a firearm to throw off an attacker's aim at close range. When she makes an attack against a foe within her firearm's first range increment, she may spend 1 grit point to gain a +4 circumstance bonus to AC against that opponent until the beginning of her next turn. She can only perform this deed while wearing medium, light, or no armor, and while carrying no more than a light load. This deed replaces the deadeye deed."
import_trades = ["Deadeye deed"]

[[entry.feature]]
anchor = "powder-burns"
head = "Powder Burns (Ex)"
listed = true
level = 3
print = '''
At 3rd level, the gulch gunner learns to maximize the damage dealt by a firearm at extremely close range.

When the gulch gunner successfully hits an adjacent foe with a ranged firearm attack, she may spend 1 grit point to deal an additional 1d6 points of fire damage from the muzzle flash of her weapon.

The target must also make a Reflex save (DC 10 + 1/2 the gulch gunner's level + the gulch gunner's Wisdom modifier) or [catch on fire](ref/rule/catching-on-fire). This deed replaces the pistol whip deed.'''
import_trades = ["Pistol whip deed"]

[[entry.feature]]
anchor = "staggering-shot"
head = "Staggering Shot (Ex)"
listed = true
level = 15
print = "At 15th level, when the gulch gunner hits an adjacent target with a ranged firearm attack, the target must also make a Fortitude save (DC 10 + 1/2 the gulch gunner's level + the gulch gunner's Wisdom modifier) or be [staggered](ref/misc/staggered) for 1d4 rounds. This deed replaces the menacing shot deed."
import_trades = ["Menacing shot deed"]

[[entry.feature]]
anchor = "belly-shot"
head = "Belly Shot (Ex)"
listed = true
level = 9
print = "At 9th level, a gulch gunner can press her firearm directly against a vulnerable location of an adjacent target, dealing additional damage. When the gulch gunner successfully hits an adjacent target with a ranged firearm attack, she deals +1d6 points of damage. This damage increases to +2d6 at 13th level and to +3d6 at 17th level. Creatures immune to precision damage, critical hits, or sneak attacks do not take this additional damage. This ability replaces the gun training ability gained at 9th, 13th, and 17th level."
import_trades = ["Gun training ability gained at 9th", "13th", "17th level"]

[[entry]]
id = "ref/arc-magus/spell-dancer"
hold = "the replaces trade `5th-level bonus feat` is not printed in a sentence, and no listed feature of that name prints it; Arcane Movement (Su): the sentence \"This ability replaces the bonus feat a magus receives at 5th level\" names no trade"
opening = ["The strong emphasis on wizards within elven culture influences how even non-wizard elves see themselves. Many elven magi do not consider themselves masters of a blend of martial and magical talents, but rather a sub-category of wizards who study the effect of physical movement and techniques upon spellcasting ability. They believe their ability to cast spells while fighting is an outgrowth of the concept of the \"spell dance,\"", "which itself is just another kind of wizardry.", "A spell dancer has the following class features."]

[[entry.feature]]
anchor = "class-skills"
head = "Class Skills"
listed = true
print = "A spell dancer adds Acrobatics and Perform (dance) to his list of class skills and removes Intimidate and Ride from his list of class skills."

[[entry.feature]]
anchor = "spell-dance"
head = "Spell Dance (Su)"
listed = true
level = 1
print = '''
At 1st level, a spell dancer gains the ability to expend 1 point from his arcane pool as a swift action to gain a +10 enhancement bonus to his movement rate and a +2 dodge bonus to Armor Class against attacks of opportunity provoked by moving through threatened spaces for 1 minute. For every four levels beyond 1st, the spell dancer gains another +10 enhancement bonus to movement and +2 to AC against attacks of opportunity provoked from movement.

At 5th level, once per spell dance as a swift action, the spell dancer may use one of the following on himself as a swift action: _[blur](ref/spell/blur), [fly](ref/spell/fly),_ or _[haste](ref/spell/haste)_. These abilities last for 1 round. At 9th level, the spell dancer may instead take a swift action to use _[dimension door](ref/spell/dimension-door)_ as a [spell-like ability](ref/umr/spell-like-abilities) once during a spelldance. At 13th level, the spell dancer may instead choose to take a swift action to gain _[freedom of movement](ref/spell/freedom-of-movement)_ for 1d4 rounds.

This ability replaces the magus's ability to expend points from his arcane pool as a swift action to grant any weapon he is holding magic bonuses for 1 minute.'''
import_trades = ["The magus's ability to expend points from his _arcane pool_ as a swift action to grant any weapon he is holding magic bonuses for 1 minute"]

[[entry.feature]]
anchor = "arcane-movement"
head = "Arcane Movement (Su)"
listed = true
level = 5
print = "At 5th level, whenever a spell dancer casts a magus spell, he gains a competence bonus on Acrobatics, Climb, Escape Artist, and Stealth checks equal to the spell's level until the beginning of his next turn. This ability replaces the bonus feat a magus receives at 5th level."
import_trades = ["5th-level bonus feat"]

[[entry.feature]]
anchor = "dance-of-avoidance"
head = "Dance of Avoidance (Su)"
listed = true
level = 7
print = "At 7th level, while wearing light armor or no armor, a spell dancer gains a +2 insight bonus to Armor Class. This ability replaces the medium armor class feature."
import_trades = ["Medium armor"]

