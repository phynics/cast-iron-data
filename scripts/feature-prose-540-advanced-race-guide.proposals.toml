[[entry]]
id = "ref/arc-alchemist/deep-bomber"
hold = "the replaces trade `Instant alchemy` is not printed in a sentence, and no listed feature of that name prints it"
opening_from_print = true
opening = ["Consumed with keeping hidden from the horrors below the surface, svirfneblin use their proclivity for alchemy and talent for obfuscation to strike from the darkness and retreat unseen. A deep bomber has the following class features."]

[[entry.feature]]
anchor = "silent-bomb"
head = "Silent Bomb"
listed = true
level = 2
print = "At 2nd level, when the deep bomber creates a bomb, he can choose to have it explode without making any noise, although those damaged by it may cry out. This ability replaces poison use."
import_trades = ["Poison use", "Poison use"]

[[entry.feature]]
anchor = "targeting-bomb"
head = "Targeting Bomb*"
listed = true
level = 3
print = "At 3rd level, when the deep bomber creates a bomb, he can choose to have its detonation include a _[faerie fire](ref/spell/faerie-fire)_ effect that applies to all creatures within the splash radius (including the target, if any). This ability replaces swift alchemy (the deep bomber gains swift alchemy at 18th level and never gains instant alchemy)."
import_trades = ["Instant alchemy", "Instant alchemy"]

[[entry.feature]]
anchor = "stonekin"
head = "Stonekin"
listed = true
level = 6
print = "At 6th level, the deep bomber automatically learns _[tree shape](ref/spell/tree-shape)_ as a 2nd-level extract, except instead of a tree, he takes the form of a stalagmite that is the same size as his current size. At 7th level, he automatically learns _[meld into stone](ref/spell/meld-into-stone)_ as a 3rd-level extract. This ability replaces swift poisoning."
import_trades = ["Swift poisoning", "Swift poisoning"]

[[entry.feature]]
anchor = "discoveries"
head = "Discoveries"
listed = false
print = "The following discoveries complement the deep bomber archetype: [delayed bomb](ref/discovery/delayed-bomb), [dispelling bomb](ref/discovery/dispelling-bomb), [fast bombs](ref/discovery/fast-bombs), [infusion](ref/discovery/infusion), [madness bomb](ref/discovery/madness-bomb), [poison bomb](ref/discovery/poison-bomb)."

[[entry]]
id = "ref/arc-monk/ironskin-monk"
hold = "the replaces trade `Spring Attack on his bonus feat list` is not printed in a sentence, and no listed feature of that name prints it"
opening_from_print = true
opening = ["Through discipline and training, an ironskin monk hardens his body to withstand punishing blows.", "Though slow on his feet, his calloused hands and feet can shatter stone and stagger foes."]

[[entry.feature]]
anchor = "iron-skin"
head = "Iron Skin (Ex)"
listed = true
level = 1
print = "At 1st level, an ironskin monk gains a +1 bonus to his natural armor. This bonus stacks with any existing natural armor the ironskin monk already has. At 4th level, and every 4 levels thereafter, this bonus increases by +1. This ability replaces the monk's AC bonus ability and the ability to add his Wisdom bonus to his AC."
import_trades = ["AC bonus, the ability to add his Wisdom bonus to his AC", "AC bonus", "the ability to add his Wisdom bonus to his AC"]

[[entry.feature]]
anchor = "bonus-feat"
head = "Bonus Feat"
listed = true
level = 1
print = "At 1st level, an ironskin monk adds [Power Attack](ref/feat/power-attack) to his list of bonus feats. At 6th level, he adds [Improved Sunder](ref/feat/improved-sunder) to the list. At 10th level, he adds [Greater Sunder](ref/feat/greater-sunder) to the list. These bonus feat choices replace Dodge, Mobility, and Spring Attack on his bonus feat list."
import_trades = ["Dodge, Mobility, and Spring Attack on the monk's bonus feat list", "Dodge", "Mobility", "Spring Attack on the monk's bonus feat list"]

[[entry.feature]]
anchor = "resilience"
head = "Resilience (Ex)"
listed = true
level = 2
print = "At 2nd level, an ironskin monk can shake off the physical effects of certain attacks. If he makes a Fortitude saving throw against an attack that has a reduced effect on a successful save, he instead avoids the effect entirely. This ability can be used only if the monk is wearing light armor or no armor. A helpless monk does not gain the benefits of resilience. This ability replaces evasion."
import_trades = ["Evasion", "Evasion"]

[[entry.feature]]
anchor = "ki-pool"
head = "Ki Pool (Su)"
listed = true
level = 4
print = "At 4th level, an ironskin monk can spend 1 point from his ki pool to gain a damage bonus equal to 1/2 his level against objects and constructs for 1 round. This replaces the ability to increase speed with ki."
import_trades = ["The ability to increase speed with ki", "The ability to increase speed with ki"]

[[entry.feature]]
anchor = "staggering-blow"
head = "Staggering Blow (Ex)"
listed = true
level = 5
print = "At 5th level, an ironskin monk attacking with an unarmed strike can spend 1 point from his ki pool as a free action after a successful critical hit to [stagger](ref/misc/staggered) the creature struck for 1 round (Fort DC 10 + 1/2 the ironskin monk's level + the ironskin monk's Wisdom modifier negates). This ability replaces high jump."
import_trades = ["High jump", "High jump"]

[[entry.feature]]
anchor = "tough-as-nails"
head = "Tough as Nails (Ex)"
listed = true
level = 6
print = "At 6th level, an ironskin monk gains [DR](ref/rule/damage-reduction) 1/—. Subtract 1 point from the damage the ironskin monk takes each time he is dealt damage from a weapon or a natural attack. This damage reduction increases by 1 point at 9th level and every 3 levels thereafter. Damage reduction can reduce damage to 0 but not below 0. This ability replaces fast movement and slow fall."
import_trades = ["Fast movement, slow fall", "Fast movement", "slow fall"]

[[entry.feature]]
anchor = "evasion"
head = "Evasion (Ex)"
listed = true
level = 9
print = "At 9th level, an ironskin monk gains [evasion](ref/ability/evasion). This ability replaces improved evasion."
import_trades = ["Improved evasion", "Improved evasion"]

[[entry.feature]]
anchor = "surefooted"
head = "Surefooted (Ex)"
listed = true
level = 17
print = "At 17th level, an ironskin monk's speed is not reduced by [difficult terrain](ref/rule/terrain-and-obstacles). This ability replaces tongue of the sun and moon."
import_trades = ["Tongue of the sun and moon", "Tongue of the sun", "moon"]

[[entry.feature]]
anchor = "unbreakable"
head = "Unbreakable (Ex)"
listed = true
level = 20
print = "At 20th level, an ironskin monk sets aside many of the frailties of mortal flesh. He becomes immune to death effects and stunning. He is not subject to [ability damage or ability drain](ref/rule/ability-damage-drain), and has a 75% chance of ignoring the extra damage dealt by critical hits and sneak attacks. This ability replaces perfect self."
import_trades = ["Perfect self", "Perfect self"]

