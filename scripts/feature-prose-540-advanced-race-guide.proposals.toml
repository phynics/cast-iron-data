hold = "the replaces trade `5th-level bonus feat` is not printed in a sentence, and no listed feature of that name prints it; Arcane Movement (Su): the sentence \"This ability replaces the bonus feat a magus receives at 5th level\" names no trade"
opening_from_print = true
opening = ["The strong emphasis on wizards within elven culture influences how even non-wizard elves see themselves. Many elven magi do not consider themselves masters of a blend of martial and magical talents, but rather a sub-category of wizards who study the effect of physical movement and techniques upon spellcasting ability. They believe their ability to cast spells while fighting is an outgrowth of the concept of the \"spell dance,\"", "which itself is just another kind of wizardry.", "A spell dancer has the following class features."]

[[entry.feature]]
anchor = "class-skills"
head = "Class Skills"
listed = true
print = "A spell dancer adds Acrobatics and Perform (dance) to his list of class skills and removes Intimidate and Ride from his list of class skills."

[[entry.feature]]
anchor = "spell-dance"
head = "Spell Dance (Su)"
listed = true
level = 1
print = '''
At 1st level, a spell dancer gains the ability to expend 1 point from his arcane pool as a swift action to gain a +10 enhancement bonus to his movement rate and a +2 dodge bonus to Armor Class against attacks of opportunity provoked by moving through threatened spaces for 1 minute. For every four levels beyond 1st, the spell dancer gains another +10 enhancement bonus to movement and +2 to AC against attacks of opportunity provoked from movement.

At 5th level, once per spell dance as a swift action, the spell dancer may use one of the following on himself as a swift action: _[blur](ref/spell/blur), [fly](ref/spell/fly),_ or _[haste](ref/spell/haste)_. These abilities last for 1 round. At 9th level, the spell dancer may instead take a swift action to use _[dimension door](ref/spell/dimension-door)_ as a [spell-like ability](ref/umr/spell-like-abilities) once during a spelldance. At 13th level, the spell dancer may instead choose to take a swift action to gain _[freedom of movement](ref/spell/freedom-of-movement)_ for 1d4 rounds.

This ability replaces the magus's ability to expend points from his arcane pool as a swift action to grant any weapon he is holding magic bonuses for 1 minute.'''
import_trades = ["The magus's ability to expend points from his _arcane pool_ as a swift action to grant any weapon he is holding magic bonuses for 1 minute", "The magus's ability to expend points from his _arcane pool_ as a swift action to grant any weapon he is holding magic bonuses for 1 minute"]

