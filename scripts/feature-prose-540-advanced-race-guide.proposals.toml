import_trades = ["Summon monster VI and VIII spell-like abilities", "Summon monster VI", "VIII spell-like abilities"]

[[entry]]
id = "ref/arc-summoner/shadow-caller"
hold = "Shadow Summoning (Sp): the sentence \"This ability replaces the summoner's normal summon monster spell-like abilities\" names no trade"
opening_from_print = true
opening = ["While most summoners can call any manner of creature from across the planes to serve them in combat, supplementing the skills of their eidolon with a diverse range of creatures, others eschew this broad utility and instead concentrate upon calling forth entities from the [Shadow Plane](ref/rule/shadow-plane). A [shadow](ref/template/shadow) caller has the following class features."]

[[entry.feature]]
anchor = "class-skills"
head = "Class Skills"
listed = true
print = "The shadow caller adds Stealth to his list of class skills and removes Use Magic Device from his list of class skills."

[[entry.feature]]
anchor = "shadow-summoning"
head = "Shadow Summoning (Sp)"
listed = true
print = '''
When a shadow caller uses his _summon monster_ ability or casts the _summon monster_ spell, he typically summons creatures from the Shadow Plane or creatures closely associated with shadow. When a creature on the _summon monster_ spell list indicates that it is summoned with either the celestial or the fiendish template based on the alignment of the caster, the creature summoned by the shadow caller has the shadow creature template instead (see sidebar). Furthermore, the _summon monster_ lists are modified in the following ways (these changes also apply to using a higher-level summon spell to summon multiple creatures from a lower-level list).

_Summon Monster I_: No changes.

_Summon Monster II_: A shadow caller cannot summon Small elementals or lemures, but instead can summon zoogs.

_Summon Monster III_: A shadow caller cannot summon dretches or lantern archons, but can summon augur kytons.

_Summon Monster IV_: A shadow caller cannot summon Medium elementals, hell hounds, hound archons, or mephits, but can summon allips, gloomwings, and shadows.

_Summon Monster V_: A shadow caller cannot summon babau, bearded devils, bralani azatas, Large elementals, salamanders, or xills, but can summon shadow mastiffs and shae.

_Summon Monster VI_: A shadow caller cannot summon Huge elementals, erinyes, lillend azatas, or succubi, but can summon cloakers.

_Summon Monster VII_: A shadow caller cannot summon bebiliths, bone devils, greater elementals, or vrocks, but can summon greater shadows.

_Summon Monster VIII_: A shadow caller can only summon derghodaemons and young umbral dragons.

_Summon Monster IX_: A shadow caller can only summon interlocutor kytons and nightwings.

This ability otherwise functions as and replaces the summoner's normal _summon monster_ spell-like abilities.'''

[[entry.feature]]
anchor = "shadow-eidolon"
head = "Shadow Eidolon"
listed = true
print = '''
A shadow caller's eidolon is at once a thing of shadow called from the deep of the Shadow Plane and his own shadow; the two are inseparable. When his eidolon manifests, his shadow lengthens and finally detaches from him as a creature unto itself. For as long as the shadow caller's eidolon is manifested, he and the eidolon do not have distinct shadows, regardless of the presence or absence of light. This lack of a shadow replaces the magical symbol that identifies the summoner and his eidolon.

This ability alters the summoner's eidolon ability. The following evolutions are available to all summoners. 2-Point Evolutions Shadow Blend (Su): In any condition of illumination other than bright light, the eidolon disappears into the shadows, giving it concealment (20% miss chance). If it has the shadow form evolution, it instead gains total concealment (50% miss chance). The eidolon can suspend or resume this ability as a free action.'''
import_trades = ["Eidolon", "Eidolon", "Magical symbol that identifies the summoner and his eidolon", "Magical symbol that identifies the summoner", "his eidolon"]

[[entry.feature]]
anchor = "shadow-form"
head = "Shadow Form (Su)"
listed = true
print = "The eidolon's body becomes shadowy and more indistinct. This shadow form grants the eidolon constant concealment (20% miss chance), and its melee attacks affect incorporeal creatures as if it had the _ghost touch_ weapon property. The eidolon's melee attacks deal only half damage to corporeal creatures."

[[entry]]
id = "ref/arc-summoner/wild-caller-arg"
hold = "Eidolon: the sentence \"This ability alters the normal summoner's eidolon class feature\" names no trade"
opening_from_print = true
opening = ["Often a half-elf 's ties to nature and elven heritage are so strong that they can dramatically affect the nature of his summonings. The wild caller calls eidolons that take more natural and savage forms and summons from nature rather than the Great Beyond. A wild caller has the following class features."]

[[entry.feature]]
anchor = "spells"
head = "Spells"
listed = true
print = "A wild caller does not have access to _[summon monster](ref/spell/summon-monster)_ spells. Instead, he swaps out those spells on his spell list with _[summon nature's ally](ref/spell/summon-natures-ally)_ spells of the same level. This ability alters the normal spell list of the summoner."
import_trades = ["Spell list of the summoner", "Spell list of the summoner"]

[[entry.feature]]
anchor = "eidolon"
head = "Eidolon"
listed = true
print = '''
The eidolon of a wild caller tends to take more natural and more savage forms than other summoners' eidolons. A wild caller gains 1/4 his class level as bonus evolution points in his eidolon's evolution pool, but his eidolon cannot take the following evolutions:

_Advanced Player's Guide_—_1-point evolutions_: magic attacks, skilled (while the eidolon can select this evolution, it can only do so with the following skills: Acrobatics, Climb, Escape Artist, Fly, Intimidate, Perception, Survival, and Swim); _2-point evolutions_: energy attacks, immunity, weapon training; _3-point evolutions_: damage reduction, frightful presence; _4-point evolutions_: breath weapon, spell resistance.

_Ultimate Magic_—_1-point evolutions_: basic magic, unnatural aura; _2-point evolutions_: channel resistance, head, minor magic, undead appearance; _3-point evolutions_: major magic; _4-point evolutions_: dimension door, incorporeal form, lifesense, no breath, ultimate magic.

This ability alters the normal summoner's eidolon class feature, but is otherwise identical to that class feature.'''

[[entry.feature]]
anchor = "summon-nature-s-ally-i"
head = "Summon Nature's Ally I (Sp)"
listed = true
level = 1
print = "Starting at 1st level, a wild caller can cast _summon nature's ally_ a number of times per day equal to 3 + his Charisma modifier. At 3rd level and every 2 levels thereafter, the power of this ability increases by one spell level, allowing him to summon more powerful creatures (to a maximum of _summon nature's ally IX_ at 17th level). Furthermore, at 19th level, the wild caller cannot use _[gate](ref/spell/gate)_ as a [spell-like ability](ref/umr/spell-like-abilities), but can use either _[summon elder worm](ref/spell/summon-elder-worm)_ or _[summon froghemoth](ref/spell/summon-froghemoth)_ instead. This ability otherwise functions like the standard summoner's _[summon monster I](ref/spell/summon-monster-1)_ ability and replaces that ability."
import_trades = ["Summon monster I", "Summon monster I"]

