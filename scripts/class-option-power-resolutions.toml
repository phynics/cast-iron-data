[[resolution]]
id = "ref/trick/spell-anticipation"
name = "Spell Anticipation"
occurrence = 1
span_sha256 = "6d33bfb7a3578022255bc14324ddf0df0b61a0b86e0ddd482d1c258391f5ec86"
print = "Occult Adventures p. 44"
replacement = '''
**Spell Anticipation**

**Flavor:** The mesmerist can choose a spell to strike back at enemy spellcasters.

**Ability:** When the mesmerist implants this trick, he must expend one spell slot to couple a spell he knows of that level with the trick. That spell must have a casting time of 1 standard action or less and be able to target one creature (spells like [dominate person](ref/spell/dominate-person) that have more restrictive targeting can be used, but have no effect if triggered against creatures that don't match).

He can trigger this trick when the subject is targeted by an enemy's spell. The mesmerist's spell then triggers, affecting only the enemy spellcaster. This takes effect only if the enemy spellcaster is within range of the spell (as measured from the subject of the trick), and functions as though the mesmerist were in the subject's square.

**Special:** The enemy's spell still has its full effect, even if the mesmerist's spell would
normally protect against it or make the caster unable to cast it.
'''

[[resolution]]
id = "ref/unchevolution/flight"
name = "Flight (Ex or Su)"
occurrence = 1
span_sha256 = "290aa93d7246968086fb7978d790cefa7d9d94b54553b36eb248f8f99c5ba941"
print = "Pathfinder Unchained p. 37"
replacement = '''
**Flight (Ex or Su)**

**Ability:** The eidolon grows large wings, like those of a bat, bird, insect, or dragon, gaining the ability to fly. The eidolon gains a fly speed equal to its base speed. The eidolon's maneuverability depends on its size. Medium or smaller eidolons have good maneuverability. Large eidolons have average maneuverability, while Huge eidolons have poor maneuverability.

For 2 additional evolution points, the eidolon flies by means of magic. It loses its wings, but its maneuverability increases to perfect. If the eidolon flies by magic, this is a supernatural ability.

**Prereq:** 5th-level unchained summoner

**Special:** The eidolon can increase its fly speed by spending additional evolution points, gaining
a 20-foot increase to its fly speed for each additional point spent.
'''

[[resolution]]
