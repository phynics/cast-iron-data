[[resolution]]
id = "ref/deed/dead-shot"
name = "Dead Shot (Ex)"
occurrence = 1
span_sha256 = "c180715798f560936bde2165576a211cb5cdfa070d74dbeb4a395f88116b7a6e"
print = "Ultimate Combat p. 11"
replacement = '''
**Dead Shot (Ex)**

**Full-round:** The gunslinger can take careful aim and pool all of her attack potential into a single, deadly shot. When she does this, she shoots the firearm at a single target, but makes as many attack rolls as she can, based on her base attack bonus. She makes the attack rolls in order from highest bonus to lowest, as if she were making a full attack.

If any of the attack rolls hit the target, the gunslinger's single attack is considered to have hit.
For each additional successful attack roll beyond the first, the gunslinger increases the damage of
the shot by the base damage dice of the firearm. For instance, if a 7th-level gunslinger firing a
musket hits with both attacks, she does 2d12 points of damage with the shot, instead of 1d12 points
of damage, before adding any damage modifiers.

Precision damage and extra damage from weapon special abilities (such as
[flaming](ref/magic-enh/flaming)) are added with damage modifiers and are not increased by this
deed. If one or more rolls are critical threats, she confirms the critical once using her highest
base attack bonus -5. For each critical threat beyond the first, she reduces this penalty by 1 (to a
maximum of 0).

**Prereq:** 7th-level gunslinger

**Special:** The gunslinger only misfires on a dead shot if **all** the attack rolls are misfires.
She cannot perform this deed with a [blunderbuss](ref/eq-weapon/blunderbuss) or other
[scatter](ref/misc/scatter) weapon when attacking creatures in a cone. The gunslinger must spend 1
grit point to perform this deed.
'''

[[resolution]]
id = "ref/deed/utility-shot"
name = "Utility Shot (Ex)"
occurrence = 1
span_sha256 = "400f98874be59af4db0bfab6461b1835380917eada645794248027faee1cb5c7"
print = "Ultimate Combat p. 11"
replacement = '''
**Utility Shot (Ex)**

**Ability:** If the gunslinger has at least 1 grit point, she can perform all of the following
utility shots. Each utility shot can be applied to any single attack with a firearm, but the
gunslinger must declare the utility shot she is using before firing the shot.

**Prereq:** 3rd-level gunslinger

- **Blast Lock:** The gunslinger makes an attack roll against a lock within the first range increment of her firearm. A Diminutive lock usually has AC 7, and larger locks have a lower AC. The lock gains a bonus to its AC against this attack based on its quality. A simple lock has a +10 bonus to AC, an average lock has a +15 bonus to AC, a good lock has a +20 bonus to AC, and a superior lock has a +30 bonus to AC. [Arcane lock](ref/spell/arcane-lock) grants a +10 bonus to the AC of a lock against this attack. On a hit, the lock is destroyed, and the object can be opened as if it were unlocked. On a miss, the lock is destroyed, but the object is jammed and still considered locked. It can still be unlocked by successfully performing this deed, by using the Disable Device skill, or with the break DC, though the DC for either break or Disable Device or the AC increases by 10. A key, combination, or similar mechanical method of unlocking the lock no longer works, though [knock](ref/spell/knock) can still be employed to bypass the lock, and the creator of an _[arcane lock](ref/spell/arcane-lock)_ can still bypass the wards of that spell.
- **Scoot Unattended Object:** The gunslinger makes an attack roll against a Tiny or smaller unattended object within the first range increment of her firearm. A Tiny unattended object has an AC of 5, a Diminutive unattended object has an AC of 7, and a Fine unattended object has an AC of 11. On a hit, the gunslinger does not damage the object with the shot, but can move it up to 15 feet farther away from the shot's origin. On a miss, she damages the object normally.
- **Stop Bleeding:** The gunslinger makes a firearm attack and then presses the hot barrel against herself or an adjacent creature to staunch a bleeding wound. Instead of dealing damage, the shot ends a single [bleed](ref/rule/bleed) condition affecting the creature. The gunslinger does not have to make an attack roll when performing the deed in this way; she can instead shoot the firearm into the air, but that shot still uses up ammunition normally.
'''

