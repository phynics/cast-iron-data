[[resolution]]
id = "ref/arcana/pool-ray"
name = "Pool Ray:"
occurrence = 1
span_sha256 = "9ad7ccf37c4475283ab5da74932c63ef5f9a17b0d767d34351b2ba02fedfc79a"
print = "Ranged Tactics Toolbox p. 14"
replacement = '''
**Pool Ray**

**Standard:** The magus can expend 1 point from his arcane pool to infuse a ranged weapon with elemental power.

As a free action while making an attack roll with the infused ranged weapon, after the attack roll has been made but before the results are revealed by the GM, the magus can release the charge and cause his attack to deal 1d6 points of energy damage (acid, cold, electricity, or fire, chosen when he spends the arcane pool point to activate this ability). If he misses with this attack, the charge is lost and the effect is wasted.

**At 6th level,** the damage increases to 2d6.

**At 9th level,** the damage increases to 3d6.

**At 12th level,** the damage increases to 4d6.

**At 15th level,** the damage increases to 5d6.

**At 18th level,** the damage increases to 6d6.

**Special:** If the magus has the _ranged spellstrike_ class feature (such as through the [Myrmidarch](ref/arc-magus/myrmidarch) archetype), he can use this ability with _ranged spellstrike_ to treat it as its own ranged touch attack.
'''

[[resolution]]
id = "ref/arcanedisc/true-name"
name = "True Name (Sp)"
occurrence = 1
span_sha256 = "c37cf1561f45285543169f56c72fa5f1c30746b95df7b99ac78e2c0297520fbd"
print = "Ultimate Magic p. 87"
replacement = '''
**True Name (Sp)**

**Ability:** Your researches into ancient tomes and your inquisitions of bound spirits have led you to one of the best-hidden secrets of the multiverse: the true name of an outsider - the name that defines the very essence of the creature and that gives the speaker control over the being. This outsider can have no more than 12 Hit Dice. Once per day, you can speak the common name by which the outsider is known, and the outsider travels to you as if you had cast [planar binding](ref/spell/planar-binding) upon it. It must obey you to the best of its ability, without pay or bargaining for its services, for its fear that you might release its true name to the wider world is enough to bring even the most recalcitrant of outsiders to bear.

If the creature is within 100 feet, as a **move action**, you may punish it by deliberately
mispronouncing its name, wracking its very essence and giving it the [sickened](ref/misc/sickened)
and [staggered](ref/misc/staggered) conditions for 1 round (even if the creature is normally immune
to these conditions). You cannot use _true name_ in an area of [silence](ref/spell/silence), but the
creature does not have to be able to hear you for it to be harmed by the ability.

It is in your best interest to call this creature only sparingly, and occasionally reward it in some
fashion to mollify its wrath. If you repeatedly fail to offer it a reward appropriate to its type
and ethos, the creature may begin plotting ways to destroy the bond between you, whether by creating
an accident that will destroy your memory of the name, by plaguing you with nuisances or dangers
until you vow never to call on it again, or by actively seeking to destroy you through its own
devices or those of an underling. If this creature is of a lawful type and you are violating its
ethos, its superiors may even destroy it or you rather than allow you to contaminate their servant
further. Worse, they may establish situations where it is necessary for you to summon this outsider,
opening gateways to infernal or angelic interference, in order to gain a foothold on the Material
Plane.

**Prereq:** 11th-level wizard

**Special:** You may select this discovery multiple times. Each time you select this discovery, it
applies to a different, specific outsider. If you select this discovery at 15th level or higher, the
creature may have up to 18 Hit Dice and the call acts as
[greater planar binding](ref/spell/planar-binding-greater) instead of
_[planar binding](ref/spell/planar-binding)._
'''

[[resolution]]
id = "ref/arcaneschool/divination"
name = "Foretell (Su)"
occurrence = 1
span_sha256 = "c80491dd677d16b1f863673c74169fea03f3ac0d54ddacd2deec654f8089f3c3"
print = "Advanced Player's Guide p. 146"
replacement = '''
**Foretell (Su)**

**Gained:** At 8th Level

**Standard:** You can utter a prediction of the immediate future. While your foretelling is in effect, you emit a 30-foot aura of fortune that aids your allies or hinders your enemies, as chosen by you at the time of prediction.

If you choose to aid, you and your allies gain a +2 luck bonus on ability checks, attack rolls,
caster level checks, saving throws, and skill checks.

If you choose to hinder, your enemies take a -2 penalty on those rolls instead.

**Usage:** A number of rounds per day equal to your wizard level. These rounds do not need to be consecutive.
'''

