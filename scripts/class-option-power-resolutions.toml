print = "Ultimate Combat p. 69"
replacement = '''
**Ki Pool (Ex)**

**Ability:** A rogue with this talent gains a small ki pool. This ki pool is similar to a [ninja's](ref/class/ninja) ki pool, but the rogue's ki pool does not grant any extra attacks. The rogue gains a number of ki points equal to her Wisdom modifier (minimum 1). These ki points replenish at the start of each day.

