**Info:** Every living spellcaster hides a secret in their flesh - a unique, personalized set of conditions that, when all are fulfilled in the correct order, can trigger the transformation into a [lich](ref/template/lich). Normally, one must expend years and tens of thousands of gold pieces to research this deeply personalized method of attaining immortality. Yet, in a rare few cases, chance and ill fortune can conspire against an unsuspecting spellcaster.

**Ability:** You take damage from positive energy and heal from negative energy as if you were undead.

**At 5th level,** add [control undead](ref/spell/control-undead) to your list of 2nd-level oracle spells known.

**At 10th level,** add [undead anatomy I](ref/spell/undead-anatomy-1) to your list of 3rd-level oracle spells known and [undead anatomy II](ref/spell/undead-anatomy-2) to your list of 5th-level oracle spells known.

**At 15th level,** you are immune to death effects.
'''

