[[resolution]]
id = "ref/talent/occult-dungeoneer"
name = "Occult Dungeoneer (Su)"
occurrence = 1
span_sha256 = "e2761d23b309b1286862ea56c3f68538c4a01f4f45c42fb2635c5d7476968244"
print = "Magic Tactics Toolbox p. 7"
replacement = '''
**Occult Dungeoneer (Su)**

**Flavor:** Street thieves in Absalom expect wares to be securely locked, and sometimes it takes
high-quality tools and magic training to ensure there's a meal at the end of the day.

**Ability:** A rogue with this ability can use [spell trigger](ref/misc/spell-trigger) and [spell completion](ref/misc/spell-completion) items as if the following spells were on a spell list to which he has access: [detect secret doors](ref/spell/detect-secret-doors), [detect snares and pits](ref/spell/detect-snares-and-pits), [knock](ref/spell/knock), [locate object](ref/spell/locate-object), and [obscure object](ref/spell/obscure-object).

If the spell-trigger device allows a wielder to apply his own caster level (such as with a staff),
the rogue may use his class level as his caster level.

The rogue may also use _[knock](ref/spell/knock)_ as a supernatural ability once per day, using his rogue level as his caster level.
'''

[[resolution]]
