print = "Adventurer's Guide p. 53"
replacement = '''
**Shrinewalk (Sp)**

**Ability:** Council agents can walk the mystic paths between Westcrown's shrines. A rogue with _shrinewalk_ can create her own shrine simply by designating an area in any urban region by placing a unique marking or rune on a wall or the ground. This marking is not magical, and if it is defaced or erased, it can no longer be used by the rogue (the marking can be hidden from view without removing its usability, including painting over the marking in question).

