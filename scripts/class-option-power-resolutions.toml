name = "Shift Blame (Ex)"
occurrence = 1
span_sha256 = "accff7ec6f832203ea308aaa69fb43e3ae5946c0a343b1a54f598fc526e456c0"
print = "Horror Adventures p. 58"
replacement = '''
**Shift Blame (Ex)**

**Ability:** When you provoke an attack of opportunity from a given enemy, you can divert that attack of opportunity to another target of your choice within the attacker's reach. Afterward, the foe whose attack you diverted becomes immune to this ability for 24 hours.

When you target a creature with a spell, [spell-like ability](ref/umr/spell-like-abilities), or supernatural ability, or when you fail a Bluff, Diplomacy, or Intimidate check, you can allow the Deceiver to gain 1 point of influence over you to make the target believe another creature adjacent to you created the effect or attempted to lie to, convince, or bully the target.
'''

