[[edit]]
entry = "ref/arc-witch/pact-witch"
anchor = "alignment"
note = "hand-written from print (Planar Adventures p. 16): print sets Table 1\u20131 inside the paragraph, between \"until he atones for\" and \"his transgressions\"; the paragraph is whole here and the table follows it"
text = '''
A pact witch's alignment must match that of his chosen plane. A pact witch whose alignment no longer matches his bonded plane becomes an ex–pact witch and loses all the benefits of this archetype until he atones for his transgressions. In time, likely after benefitting from an _[atonement](ref/spell/atonement)_ spell, an ex–pact witch can forge a bond with another plane that matches his new alignment.
'''

