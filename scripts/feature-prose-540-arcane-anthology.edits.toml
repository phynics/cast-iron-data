[[edit]]
entry = "ref/arc-rogue/eldritch-scoundrel"
anchor = "spells"
note = "the printed sentence without the citation after the link to the magus (ruling 26)"
text = '''
An eldritch scoundrel casts arcane spells drawn from the [wizard](ref/class/wizard) spell list. An eldritch scoundrel must choose and prepare her spells ahead of time. She learns, prepares, and casts spells exactly as a wizard does, including adding new spells to her spellbook and gaining two additional spells known (of any level she can cast) each time she gains a rogue level with this archetype.

An eldritch scoundrel can cast only a certain number of spells of each spell level per day. Her base daily spell allotment is the same as the [magus](ref/class/magus) class (_Pathfinder RPG Ultimate Magic_ 10).
'''
