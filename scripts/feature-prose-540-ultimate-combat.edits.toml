text = '''
This book and the _Advanced Player's Guide_ present a number of weapons not on the weapon group lists in the _Core Rulebook_. Below is an update of that list, with all the weapons from those two books as well as new weapons introduced in this book. It also presents two new groups: firearms and siege weapons. Weapons with one asterisk (\*) can be found in the _Advanced Player's Guide_. Weapons with two asterisks (\*\*) can be found in this book.

Weapon groups are defined as follows (GMs may add other weapons to these groups, or add entirely new groups):

_Axes_: bardiche\*, battleaxe, dwarven waraxe, greataxe, handaxe, heavy pick, hooked axe\*\*, knuckle axe\*\*, light pick, mattock\*\*, orc double axe, pata\*\*, and throwing axe

_Blades, Heavy_: bastard sword, chakram\*, double chicken saber\*\*, double walking stick katana\*\*, elven curve blade, falcata\*, falchion, greatsword, great terbutje\*\*, katana\*\*, khopesh\*, longsword, nine-ring broadsword\*\*, nodachi\*\*, scimitar, scythe, seven-branched sword\*\*, shotel\*\*, temple sword\*, terbutje\*\*, and two-bladed sword

_Blades, Light_: bayonet\*, butterfly sword\*\*, dagger, gladius\*\*, kama, kerambit\*\*, kukri, pata\*\*, quadrens\*\*, rapier, short sword, sica\*\*, sickle, starknife, swordbreaker dagger\*, sword cane\*, and wakizashi\*\*

_Bows_: composite longbow, composite shortbow, longbow, and shortbow

_Close_: bayonet\*, brass knuckles\*, cestus\*\*, dan bong\*\*, emei piercer\*\*, fighting fan\*\*, gauntlet, heavy shield, iron brush\*\*, light shield, madu\*\*, mere club\*\*, punching dagger, sap, scizore\*\*, spiked armor, spiked gauntlet, spiked shield, tekko-kagi\*\*, tonfa\*\*, unarmed strike, wooden stake\*, and wushu dart\*\*

_Crossbows_: double crossbow\*, hand crossbow, heavy crossbow, heavy repeating crossbow, light crossbow, light repeating crossbow, and tube arrow shooter\*\*

_Double_: dire flail, dwarven urgrosh, gnome hooked hammer, orc double axe, quarterstaff, and two-bladed sword

_Firearms_: all one-handed\*\*, two-handed\*\*, and siege firearms\*\*

_Flails_: chain spear\*, dire flail, double chained kama\*\*, flail, flying blade\*\*, heavy flail, kusarigama\*\*, kyoketsu shoge\*\*, meteor hammer\*\*, morningstar, nine-section whip\*\*, nunchaku, sansetsukon\*\*, scorpion whip\*\*, spiked chain, urumi\*\*, and whip

_Hammers_: aklys\*\*, battle aspergillum\*, club, greatclub, heavy mace, light hammer, light mace, mere club\*\*, taiaha\*\*, tetsubo\*\*, wahaika\*\*, and warhammer

_Monk_: bo staff\*\*, brass knuckles\*\*, butterfly sword\*\*, cestus\*, dan bong\*\*, double chained kama\*\*, double chicken saber\*\*, emei piercer\*\*, fighting fan\*\*, jutte\*\*, kama, kusarigama\*\*, kyoketsu shoge\*\*, lungshuan tamo\*\*, monk's spade\*\*, nine-ring broadsword\*\*, nine-section whip\*\*, nunchaku, quarterstaff, rope dart\*\*, sai, sansetsukon\*\*, seven-branched sword\*\*, shang gou\*\*, shuriken, siangham, tiger fork\*\*, tonfa\*\*, tri-point double-edged sword\*\*, unarmed strike, urumi\*\*, wushu dart\*\*

_Natural_: unarmed strike and all natural weapons, such as bite, claw, gore, tail, and wing

_Polearms_: bardiche\*, bec de corbin\*, bill\*, glaive, glaive-guisarme\*, guisarme, halberd, hooked lance\*\*, lucerne hammer\*, mancatcher\*, monk's spade\*\*, naginata\*\*, nodachi\*\*, ranseur, rohomphaia\*\*,tepoztopili\*\*, and tiger fork\*\*

_Spears_: amentum\*\*, boar spear\*, javelin, harpoon\*\*, lance, longspear, pilum\*, shortspear, sibat\*\*, spear, tiger fork\*\*, and trident

_Thrown_: aklys\*\*, amentum\*\*, atlatl\*\*, blowgun, bolas, boomerang\*, chakram\*, club, dagger, dart, halfling sling staff, harpoon\*\*, javelin, lasso\*, kestros\*\*, light hammer, net, poisoned sand tube\*\*, rope dart\*\*, shortspear, shuriken, sibat\*\*, sling, spear, starknife, throwing axe, throwing shield\*\*, trident, and wushu dart\*\*

_Siege Engines_: all siege engines\*\*
'''
