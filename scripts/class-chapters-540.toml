# A misprint of print that the corpus corrects (owner ruling 43, with a `misprint-fix` row in `scripts/errata.tsv`): the Hunter's animal focus names the ranger (p. 27). The hub `ref/ability/animal-foci` sets the same sentence.
[[errata]]
class = "ref/class/hunter"
key = "animal-focus"
page = 27
kind = "misprint"
find = "the same aspect the ranger has taken on"
replace = "the same aspect the hunter has taken on"

# The Investigator's talents that add effects to studied combat or studied strike are marked with an asterisk, and the intro of the list explains the mark (p. 31): the star stays.
[[class]]
