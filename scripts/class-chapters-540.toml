# Ultimate Combat, the Gunslinger (phynics/cast-iron#540). The deed Targeting has no entry (data #381): print's text stays under the feature, as a sub-head, as the Swashbuckler's Targeted Strike
# does (Ultimate Combat p. 11). The box "Optional Rule: Daring Act" (p. 12) stands in the middle of the list of deeds, inside the paragraph of Targeting: it is no class feature; the
# bullets Torso and Wings that the text layer runs into the box's last paragraph are the end of Targeting.
[[class]]
id = "ref/class/gunslinger"
extra_heads = ["Targeting"]

[[place_under]]
class = "ref/class/gunslinger"
key = "targeting"
under = "deeds"

[[box_head]]
class = "ref/class/gunslinger"
key = "optional-rule-daring-act"
host = "targeting"
tail_marker = "• _Torso_"

# The coverage check reads the box's last paragraph and the end of Targeting that the text layer runs into it as one sentence ("... whether the act qualifies. • Torso: ...").
[[layout_fix]]
class = "ref/class/gunslinger"
key = "daring-act"
find = "qualifies. • Torso"
replace = "qualifies. Torso"


