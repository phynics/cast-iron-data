# The printed text of the powers of the class options that are not converted yet. Generated: never edit by hand.

[[entry]]
id = "ref/evolution/claws"
anchor = "claws"
print = '''
An eidolon has a pair of vicious claws at the end of its [limbs](ref/evolution/limbs), giving it two [claw attacks](ref/umr/natural-attacks). These attacks are primary attacks. The claws deal 1d4 points of damage (1d6 if Large, 1d8 if Huge). The eidolon must have the limbs evolution to take this evolution. This evolution can only be applied to the limbs (legs) evolution once This evolution can be selected more than once, but the eidolon must possess an equal number of the limbs evolution.

_Climb (Ex)_: An eidolon becomes a skilled climber, gaining a climb speed equal to its base speed. This evolution can be selected more than once. Each additional time it is selected, increase the eidolon's climb speed by 20 feet.

_Gills (Ex)_: An eidolon has gills and can breathe underwater indefinitely.

_Improved Damage (Ex)_: One of the eidolon's natural attacks is particularly deadly. Select one natural attack form and increase the damage die type by one step. This evolution can be selected more than once. Its effects do not stack. Each time an eidolon selects this evolution, it applies to a different natural attack.'''

[[entry]]
id = "ref/evolution/constrict"
anchor = "constrict"
print = '''
An eidolon gains powerful muscles that allow it to crush those it grapples. Whenever the eidolon successfully grapples a foe using the [grab](ref/carried/bestiary/rules/universal-monster-rules/grab) evolution, it deals additional damage equal to the amount of damage dealt by the attack used by the [grab](ref/carried/bestiary/rules/universal-monster-rules/grab) evolution. This evolution is only available to eidolons of the serpentine base form.

_Energy Attacks (Su)_: An eidolon's attacks become charged with energy. Pick one energy type: acid, cold, electricity, or fire. All of the eidolon's natural attacks deal 1d6 points of energy damage of the chosen type on a successful hit. The summoner must be at least 5th level before selecting this evolution.

_Flight (Ex or Su)_: An eidolon grows large wings, like those of a bat, bird, insect, or dragon, gaining the ability to fly. The eidolon gains a fly speed equal to its base speed. The eidolon's maneuverability depends on it size. Medium or smaller eidolons have good maneuverability. Large eidolons have average maneuverability, while Huge eidolons have poor maneuverability. For 2 additional evolution points, the eidolon flies by means of magic. It loses its wings, but its maneuverability increases to perfect. Flying via magic means makes this a supernatural ability. The eidolon's fly speed can be increased by spending additional evolution points, gaining a 20-foot increase to fly speed for each additional point spent. The summoner must be at least 5th level before selecting this evolution.

_Gore (Ex)_: An eidolon grows a number of horns on its head, giving it a gore attack. This attack is a primary attack. The gore deals 1d6 points of damage (1d8 if Large, 2d6 if Huge).'''

[[entry]]
id = "ref/evolution/grab"
anchor = "grab"
print = "An eidolon becomes adept at grappling foes, gaining the [grab](ref/umr/grab) ability. Pick bite, claw, pincers, slam, tail slap, or tentacle attacks. Whenever the eidolon makes a successful attack of the selected type, it can attempt a free combat maneuver check. If successful, the eidolon [grapples](ref/rule/grapple) the target. This ability only works on creatures of a size one category smaller than the eidolon or smaller. Eidolons with this evolution receive a +4 bonus on CMB checks made to grapple."

[[entry]]
id = "ref/evolution/immunity"
anchor = "immunity"
print = '''
An eidolon's body becomes extremely resilient to one energy type, gaining [immunity](ref/umr/immunity) to that type. Pick one energy type: acid, cold, electricity, fire, or sonic. The eidolon gains immunity to that energy type. This evolution can be selected more than once. Its effects do not stack. Each time it applies to a different energy type. The summoner must be at least 7th level before selecting this evolution.

_Limbs (Ex)_: An eidolon grows an additional pair of limbs. These limbs can take one of two forms. They can be made into legs, complete with feet. Each pair of legs increases the eidolon's base speed by 10 feet. Alternatively, they can be made into arms, complete with hands. The eidolon does not gain any additional natural attacks for an additional pair of arms, but it can take other evolutions that add additional attacks (such as claws or a slam). Arms that have hands can be used to wield weapons, if the eidolon is proficient. This evolution can be selected more than once.'''

[[entry]]
id = "ref/evolution/improved-natural-armor"
anchor = "improved-natural-armor"
print = '''
An eidolon's hide grows thick fur, rigid scales, or bony plates, giving it a +2 bonus to its natural armor. This evolution can be taken once for every five levels the summoner possesses.

_Magic Attacks (Su)_: An eidolon is infused with magic, allowing it to treat all of its natural attacks as if they were magic for the purpose of overcoming damage reduction. If the summoner is 10th level or higher, all of the eidolon's weapons are treated as the alignment of the eidolon for the purpose of overcoming damage reduction.'''

[[entry]]
id = "ref/evolution/large"
anchor = "large"
print = '''
An eidolon grows in size, becoming Large. The eidolon gains a +8 bonus to Strength, a +4 bonus to Constitution, and a +2 bonus to its natural armor. It takes a -2 penalty to its Dexterity. This size change also gives the creature a -1 size penalty to its AC and on attack rolls, a +1 bonus to its CMB and CMD, a -2 penalty on Fly skill checks, and a -4 penalty on Stealth skill checks. If the eidolon has the biped base form, it also gains 10- foot [reach](ref/evolution/reach). Any reach evolutions the eidolon possesses are added to this total. The eidolon must be Medium to take this evolution. The summoner must be at least 8th level before selecting this evolution.

If 6 additional evolution points are spent, the eidolon instead becomes Huge. The eidolon gains a +16 bonus to Strength, a +8 bonus to Constitution, and a +5 bonus to its natural armor. It takes a -4 penalty to its Dexterity. This size change also give the creature a -2 size penalty to its AC and attack rolls, a +2 bonus to its CMB and CMD, 10-foot reach, a -4 penalty on Fly skill checks, and a -8 penalty on Stealth skill checks. If the eidolon has the biped base form, its reach increases to 15 feet (10 feet for all other base forms). Any reach evolutions the eidolon possesses are added to this total. These bonuses and penalties replace, and do not stack with, those gained from becoming Large. The summoner must be at least 13th level before selecting this option.

The [ability increase](ref/evolution/ability-increase) evolution costs twice as much (4 evolution points) when adding to the Strength or Constitution scores of a Large or Huge eidolon.'''

[[entry]]
id = "ref/evolution/mount"
anchor = "mount"
print = "An eidolon is properly skilled and formed to serve as a [combat-trained](ref/rule/mounted-combat) mount. The eidolon must be at least one size category larger than its rider. This evolution is only available to eidolons of the quadruped and serpentine base forms."

[[entry]]
id = "ref/evolution/pincers"
anchor = "pincers"
print = "An eidolon grows a large pincers at the end of one pair of its [limbs](ref/evolution/limbs), giving it two pincer attacks. These attacks are secondary attacks. The pincers deal 1d6 points of damage (1d8 if Large, 2d6 if Huge). Eidolons with the [grab](ref/evolution/grab) evolution linked to pincers gain a +2 bonus on CMB checks made to grapple. The eidolon must have the limbs (arms) evolution to take this evolution. Alternatively, the eidolon can replace the [claws](ref/evolution/claws) from its base form with pincers (this still costs 1 evolution point). This evolution can be selected more than once, but the eidolon must possess an equal number of the limbs evolution."

[[entry]]
id = "ref/evolution/poison"
anchor = "poison"
print = "An eidolon secretes toxic venom, gaining a poison attack. Pick one bite or sting attack. Whenever the selected attack hits, the target is poisoned. Eidolon poison—_type_ poison (injury); _save_ Fort negates; _frequency_ 1/round for 4 rounds; _effect_ 1d4 Str damage; _cure_ 1 save. The save DC is equal to 10 + 1/2 the eidolon's HD + the eidolon's Constitution modifier. For 2 additional evolution points, this poison deals Constitution damage instead. This poison can be used no more than once per round. The summoner must be at least 7th level before selecting this evolution."

[[entry]]
id = "ref/evolution/pounce"
anchor = "pounce"
print = "An eidolon gains quick reflexes, allowing it to make a full attack after a charge. This evolution is only available to eidolons of the quadruped base form."

[[entry]]
id = "ref/evolution/pull"
anchor = "pull"
print = '''
An eidolon gains the ability to pull creatures closer with a successful attack. Select one type of natural attack. Whenever the eidolon makes a successful attack of the selected type, it can attempt a free combat maneuver check. If successful, the target of the attack is pulled 5 feet closer to the eidolon. This ability only works on creatures of a size equal to or smaller than the eidolon. Creatures pulled in this way do not provoke attacks of opportunity. The eidolon must have a [reach](ref/evolution/reach) of 10 feet or more to select this evolution. This evolution can be selected more than once. Its effects do not stack. Each time an eidolon selects this evolution, it applies to a different natural attack.

_Push (Ex)_: An eidolon gains the ability to push creatures away with a successful attack. Select one type of natural attack. Whenever the eidolon makes a successful attack of the selected type, it can attempt a free combat maneuver check. If successful, the target of the attack is pushed 5 feet directly away from the eidolon. This ability only works on creatures of a size equal to or smaller than the eidolon. Creatures pushed in this way do not provoke attacks of opportunity. This evolution can be selected more than once. Its effects do not stack. Each time an eidolon selects this evolution, it applies to a different natural attack.

_Reach (Ex)_: One of an eidolon's attacks is capable of striking at foes at a distance. Pick one attack. The eidolon's reach with that attack increases by 5 feet.'''

[[entry]]
id = "ref/evolution/rake"
anchor = "rake"
print = '''
An eidolon grows dangerous claws on its feet, allowing it to make 2 [rake](ref/umr/rake) attacks on foes it is grappling. These attacks are [primary attacks](ref/umr/natural-attacks). The eidolon receives these additional attacks each time it succeeds on a [grapple](ref/rule/grapple) check against the target. These rake attacks deal 1d4 points of damage (1d6 if Large, 1d8 if Huge). This evolution is only available to eidolons of the quadruped base form. This evolution counts as one natural attack toward the eidolon's maximum. The summoner must be at least 4th level before selecting this evolution.

_Rend (Ex)_: An eidolon learns to rip and tear the flesh of those it attacks with its claws, gaining the rend ability. Whenever the eidolon makes two successful claw attacks against the same target in 1 round, its claws latch onto the flesh and deal extra damage. This damage is equal to the damage dealt by one claw attack plus 1-1/2 times the eidolon's Strength modifier. The eidolon must possess the claws evolution to select this evolution. The summoner must be at least 6th level before selecting this evolution.'''

[[entry]]
id = "ref/evolution/resistance"
anchor = "resistance"
print = '''
An eidolon's form takes on a resiliency to one particular energy type, which is usually reflected in its physical body (ashen hide for fire, icy breath for cold, and so on). Pick one energy type (acid, cold, electricity, fire, or sonic). The eidolon gains [resist](ref/umr/resistance) 5 against that energy type. This resistance increases by 5 for every 5 levels the summoner possesses, to a maximum of 15 at 10th level. This evolution can be selected more than once. Its effects do not stack. Each time an eidolon selects this evolution, it applies to a different energy type.

_Scent (Ex)_: An eidolon's sense of smell becomes quite acute. The eidolon gains the scent special quality, allowing it to detect opponents within 30 feet by sense of smell. If the opponent is upwind, the range increases to 60 feet; if downwind, it drops to 15 feet. Strong scents can be detected at twice the normal range. Scent does not allow the eidolon to precisely locate the creature, only to detect its presence. It can detect the direction with a move action. The eidolon can pinpoint the creature's location if it is within 5 feet. The eidolon can use scent to track creatures (see page 304 of the _Bestiary_ for details).

_Skilled (Ex)_: An eidolon becomes especially adept at a specific skill, gaining a +8 racial bonus on that skill. This evolution can be selected more than once. Its effects do not stack. Each time an eidolon selects this evolution, it applies to a different skill.'''

[[entry]]
id = "ref/evolution/slam"
anchor = "slam"
print = "An eidolon can deliver a devastating [slam attack](ref/umr/natural-attacks). This attack is a primary attack. The slam deals 1d8 points of damage (2d6 if Large, 2d8 if Huge). The eidolon must have the [limbs](ref/evolution/limbs) (arms) evolution to take this evolution. Alternatively, the eidolon can replace the [claws](ref/evolution/claws) from its base form with this slam attack (this still costs 1 evolution point). This evolution can be selected more than once, but the eidolon must possess an equal number of the limbs evolution."

[[entry]]
id = "ref/evolution/spell-resistance"
anchor = "spell-resistance"
print = "An eidolon is protected against magic, gaining spell resistance. The eidolon's spell resistance is equal to 11 + the summoner's level. This spell resistance does not apply to spells cast by the summoner. The summoner must be at least 9th level before selecting this evolution."

[[entry]]
id = "ref/evolution/sting"
anchor = "sting"
print = '''
An eidolon possesses a long, barbed stinger at the end of its [tail](ref/evolution/tail), granting it a [sting attack](ref/umr/natural-attacks). This attack is a primary attack. The sting deals 1d4 points of damage (1d6 if Large, 1d8 if Huge). The eidolon must possess the tail evolution to take this evolution. This evolution can be selected more than once, but the eidolon must possess an equal number of the tail evolution.

_Swim (Ex)_: An eidolon gains webbed hands, feet, or powerful flippers, giving it a swim speed equal to its base speed. This evolution does not give the eidolon the ability to breathe underwater. This evolution can be selected more than once. Each additional time it is selected, increase the eidolon's swim speed by 20 feet.

_Tail (Ex)_: An eidolon grows a long, powerful tail. This grants it a +2 racial bonus on Acrobatics checks made to balance on a surface. This evolution can be selected more than once.'''

[[entry]]
id = "ref/evolution/tail-slap"
anchor = "tail-slap"
print = '''
An eidolon can use its [tail](ref/evolution/tail) to bash nearby foes, granting it a [tail slap attack](ref/umr/natural-attacks). This attack is a secondary attack. The tail slap deals 1d6 points of damage (1d8 if Large, 2d6 if Huge). The eidolon must possess the tail evolution to take this evolution. This evolution can be selected more than once, but the eidolon must possess an equal number of the tail evolution.

_Tentacle (Ex)_: An eidolon possesses a long, sinuous tentacle, granting it a tentacle attack. This attack is a secondary attack. The tentacle attack deals 1d4 points of damage (1d6 if Large, 1d8 if Huge). This evolution can be selected more than once.'''

[[entry]]
id = "ref/evolution/trample"
anchor = "trample"
print = '''
An eidolon gains the ability to crush its foes underfoot, gaining the [trample](ref/umr/trample) ability. As a full-round action, the eidolon can [overrun](ref/rule/overrun) any creature that is at least one size smaller than itself. This works like the overrun combat maneuver, but the eidolon does not need to make a check, it merely has to move over opponents in its path. The creatures take 1d6 points of damage (1d8 if Large, 2d6 if Huge), plus 1-1/2 times the eidolon's Strength modifier. Targets of the trample can make attacks of opportunity at a -4 penalty. If a target forgoes the attack of opportunity, it can make a Reflex save for half damage. The DC of this save is 10 + 1/2 the eidolon's HD + the eidolon's Strength modifier. A trampling eidolon can only deal trampling damage to a creature once per round. This evolution is only available to eidolons of the biped or quadruped base forms.

_Tremorsense (Ex)_: An eidolon becomes attuned to vibrations in the ground, gaining tremorsense out to a range of 30 feet. This works like the blindsense evolution, but only if both the eidolon and the creature to be pinpointed are in contact with the ground. The summoner must be at least 7th level before selecting this evolution.'''

[[entry]]
id = "ref/evolution/trip"
anchor = "trip"
print = "An eidolon becomes adept at knocking foes to the ground with its [bite](ref/evolution/bite), granting it a [trip](ref/rule/trip) attack. Whenever the eidolon makes a successful bite attack of the selected type, it can attempt a free combat maneuver check. If successful, the target is knocked [prone](ref/rule/prone). If the check fails, the eidolon is not tripped in return. This ability only works on creatures of a size equal to or smaller than the eidolon. The eidolon must possess the bite evolution to select this evolution."

[[entry]]
id = "ref/evolution/weapon-training"
anchor = "weapon-training"
print = '''
An eidolon learns to use a weapon, gaining [Simple Weapon Proficiency](ref/feat/simple-weapon-proficiency) as a bonus feat. If 2 additional evolution points are spent, it gains proficiency with all martial weapons as well.

3-Point Evolutions The following evolutions cost 3 points from the eidolon's evolution pool.

_Blindsense (Ex)_: An eidolon's senses become incredibly acute, giving it blindsense out to a range of 30 feet. This ability allows the eidolon to pinpoint the location of creatures that it cannot see without having to make a Perception check, but such creatures still have total concealment from the eidolon. Visibility still affects the eidolon's movement and it is still denied its Dexterity bonus to Armor Class against attacks from creatures it cannot see. The summoner must be at least 9th level before selecting this evolution.

_Burrow (Ex)_: An eidolon grows thick and gnarled claws, allowing it to move through the earth. The eidolon gains a burrow speed equal to 1/2 its base speed. It can use this speed to move through dirt, clay, sand, and earth. It does not leave a hole behind, nor is its passage marked on the surface. The summoner must be at least 9th level before selecting this evolution.

_Damage Reduction (Su)_: An eidolon's body becomes resistant to harm, granting it damage reduction. Choose one alignment: chaotic, evil, good, or lawful. The eidolon gains DR 5 that can be bypassed by weapons that possess the chosen alignment. The alignment must be opposite to one of the alignments possessed by the eidolon. At 12th level, this protection can be increased to DR 10 by spending 2 additional evolution points. The summoner must be at least 9th level before selecting this evolution.

_Frightful Presence (Ex)_: An eidolon becomes unsettling to its foes, gaining the frightful presence ability. The eidolon can activate this ability as part of an offensive action, such as a charge or attack. Opponents within 30 feet of the eidolon must make a Will save or become shaken for 3d6 rounds. The DC of this save is equal to 10 + 1/2 the eidolon's HD + the eidolon's Charisma modifier. If the eidolon has at least 4 more Hit Dice than an opponent, that opponent becomes frightened instead. Foes with more HD than the eidolon are immune to this effect. The summoner must be at least 11th level before selecting this evolution.

_Swallow Whole (Ex)_: An eidolon gains the swallow whole ability, giving it the ability to consume its foes. If the eidolon begins its turn with a creature grappled using its bite attack (see the grab evolution), it can attempt a combat maneuver check to swallow the creature. The creature can be up to one size category smaller than the eidolon. Swallowed creatures take damage equal to the eidolon's bite damage each round plus 1d6 points of bludgeoning damage. A swallowed creature keeps the grappled condition, but can attempt to cut its way free with a light slashing or piercing weapon. The amount of damage needed to cut free is equal to 1/10 the eidolon's total hit points. The eidolon's AC against these attacks is equal to 10 + 1/2 its natural armor bonus. If a swallowed creature cuts its way out, the eidolon loses this ability until it heals this damage. Alternatively, the swallowed creature can attempt to escape the grapple as normal. Success indicates that it has returned to the eidolon's mouth, where it can attempt to escape or be swallowed again. The eidolon must possess the grab evolution, tied to a bite attack, to take this evolution. The summoner must be at least 9th level before selecting this evolution.'''

[[entry]]
id = "ref/evolution/web"
anchor = "web"
print = '''
An eidolon gains a pair of spinnerets, giving it the ability to spin webs. The eidolon can use these webs to support itself plus up to one creature of the same size. It can throw webbing as a ranged touch attack up to 8 times per day, [entangling](ref/rule/entangled) a creature up to one size larger than the eidolon. The webbing has a range of 50 feet and a 10-foot range increment. Creatures entangled by the web can escape with an [Escape Artist](ref/skill/escape-artist) check or a Strength check (at a -4 penalty). The DC of these checks is equal to 10 + 1/2 the eidolon's HD + the eidolon's Con modifier. The webs have a [Hardness](ref/umr/hardness) of 0 and a number of hits points equal to the eidolon's total Hit Dice. The eidolon can [climb](ref/evolution/climb) its own webs at its climb speed and can pinpoint any creature touching its webs. The eidolon must possess the climb evolution to take this evolution. The summoner must be at least 7th level before selecting this evolution.

4-Point Evolutions The following evolutions cost 4 points from the eidolon's evolution pool.

_Blindsight (Ex)_: An eidolon's senses sharpen even further, granting it blindsight out to a range of 30 feet. The eidolon can maneuver and attack as normal, ignoring darkness, invisibility, and most forms of concealment as long as it has line of effect to the target. The eidolon must possess the blindsense evolution to take this evolution. The summoner must be at least 11th level before selecting this evolution.

_Breath Weapon (Su)_: An eidolon learns to exhale a cone or line of magical energy, gaining a breath weapon. Select either acid, cold, electricity, or fire. The eidolon can breathe a 30-foot cone (or 60-foot line) that deals 1d6 points of damage of the selected type per HD it possesses. Those caught in the breath weapon can attempt a Reflex save for half damage. The DC is equal to 10 + 1/2 the eidolon's HD + the eidolon's Constitution modifier. The eidolon can use this ability once per day. The eidolon can use this ability 1 additional time per day by spending an additional 1 evolution point (maximum 3/day). The summoner must be at least 9th level before selecting this evolution.'''

[[entry]]
id = "ref/evolution/wing-buffet"
anchor = "wing-buffet"
print = '''
An eidolon learns to use its wings to batter foes, granting it two wing buffet attacks. These attacks are secondary attacks. The wing buffets deal 1d4 points of damage (1d6 if Large, 1d8 if Huge). The eidolon must possess the [flight](ref/evolution/flight) evolution, with wings, to select this evolution.

2-Point Evolutions The following evolutions cost 2 points from the eidolon's evolution pool.

_Ability Increase (Ex)_: An eidolon grows larger muscles, gains faster reflexes, achieves greater intelligence, or acquires another increase to one of its abilities. Increase one of the eidolon's ability scores by +2. This evolution can be selected more than once. It can only be applied once to an individual ability score, plus 1 additional time for every 6 levels the summoner possesses.'''

[[entry]]
id = "ref/hex/blight"
anchor = "blight"
print = "The witch can [curse](ref/rule/curses) an animal, plant creature, or plot of land, causing it to wither and die. Blighting an area takes 1 round, during which time the witch and her familiar must be in contact with the target. If it's used on a plot of land, the land begins to wither the following day, and over the next week all plants in the area die. Nothing will grow in that area so long as the curse persists. A witch can affect an area with a radius equal to her class level × 10 feet. Blighting a creature is a standard action that requires a melee touch attack. If used on a creature of the animal or plant type, the creature gains the following curse: Blight Hex—_type_ curse; _save_ Will negates; _frequency_ 1/day; _effect_ 1 Con damage. Both types of curse can be removed with a _[remove curse](ref/spell/remove-curse)_ or similar magic, using the save DC as the DC to remove the curse. A witch can only have one blight in effect at a time. If another blight hex is made, the first immediately ends."

[[entry]]
id = "ref/hex/cackle"
anchor = "cackle"
print = '''
A witch can cackle madly as a move action. Any creature that is within 30 feet that is under the effects of an [agony](ref/hex/agony) hex, [charm](ref/hex/charm) hex, [evil eye](ref/hex/evil-eye) hex, [fortune](ref/hex/fortune) hex, or [misfortune](ref/hex/misfortune) hex caused by the witch has the duration of that hex extended by 1 round.

_Cauldron (Ex)_: The witch receives Brew Potion as a bonus feat and a +4 insight bonus on Craft (alchemy) skill checks.

_Charm (Su)_: A witch can charm an animal or humanoid creature within 30 feet by beckoning and speaking soothing words. This improves the attitude of an animal or humanoid creature by 1 step, as if the witch had successfully used the Diplomacy skill. The effect lasts for a number of rounds equal to the Witch's Intelligence modifier. A Will save negates this effect. Whether or not the save is successful, a creature cannot be the target of this hex again for 1 day. At 8th level, this effect improves the attitude of the target creature by 2 steps. This is a mind-affecting charm effect.

_Coven (Ex)_: The witch counts as a hag for the purpose of joining a hag's coven. The coven must contain at least one hag. In addition, whenever the witch with this hex is within 30 feet of another witch with this hex, she can use the aid another action to grant a +1 bonus to the other witch's caster level for 1 round. This bonus applies to the witch's spells and all of her hexes.'''

[[entry]]
id = "ref/hex/disguise"
anchor = "disguise"
print = '''
A witch can change her appearance for a number of hours equal to her class level, as if using _[disguise self](ref/spell/disguise-self)_. These hours do not need to be consecutive, but they must be spent in 1-hour increments.

_Evil Eye (Su)_: The witch can cause doubt to creep into the mind of a foe within 30 feet that she can see. The target takes a -2 penalty on one of the following (witch's choice): AC, ability checks, attack rolls, saving throws, or skill checks. This hex lasts for a number of rounds equal to 3 + the witch's Intelligence modifier. A Will save reduces this to just 1 round. This is a mind-affecting effect. At 8th level the penalty increases to -4.

_Flight (Su)_: The witch grows lighter as she gains power, eventually gaining the ability to fly. At 1st level, the witch can use _feather fall_ at will and gains a +4 racial bonus on Swim checks. At 3rd level, she can cast _levitate_ once per day. At 5th level, she can fly, as per the spell, for a number of minutes per day equal to her level. These minutes do not need to be consecutive, but they must be spent in 1-minute increments. This hex only affects the witch.'''

[[entry]]
id = "ref/hex/fortune"
anchor = "fortune"
print = '''
The witch can grant a creature within 30 feet a bit of good luck for 1 round. The target can call upon this good luck once per round, allowing him to reroll any ability check, attack roll, saving throw, or skill check, taking the better result. He must decide to use this ability before the first roll is made. At 8th level and 16th level, the duration of this hex is extended by 1 round. Once a creature has benefited from the fortune hex, it cannot benefit from it again for 24 hours.

_Healing (Su)_: A witch can soothe the wounds of those she touches. This acts as a _cure light wounds_ spell, using the witch's caster level. Once a creature has benefited from the healing hex, it cannot benefit from it again for 24 hours. At 5th level, this hex acts like _cure moderate wounds_.'''

[[entry]]
id = "ref/hex/hags-eye"
anchor = "hag-s-eye"
print = "A witch with this hex can create a magic sensor that she can see through. This functions as per the spell _[arcane eye](ref/spell/arcane-eye)_. If the witch has the [coven](ref/hex/coven) hex, all other Adding Spells to a Witch's Familiar Witches can add new spells to their familiars through several methods. A witch can only add spells to her familiar if those spells belong to the witch's spell list."

[[entry]]
id = "ref/hex/life-giver"
anchor = "life-giver"
print = '''
Once per day the witch can, as a full round action, touch a dead creature and bring it back to life. This functions as _[resurrection](ref/spell/resurrection)_, but it does not require a material component.

_Natural Disaster (Su)_: A witch using this hex calls down the forces of nature to wreak havoc on an area. This functions as a _storm of vengeance_ combined with an _earthquake_ that occurs on the second round of the effect (while acid is raining from the sky). A witch must concentrate for the duration of this effect. If disrupted, the effect immediately ends. A witch can only use this ability once per day.'''

[[entry]]
id = "ref/hex/misfortune"
anchor = "misfortune"
print = "The witch can cause a creature within 30 feet to suffer grave misfortune for 1 round. Anytime the creature makes an ability check, attack roll, saving throw, or skill check, it must roll twice and take the worse result. A Will save negates this hex. At 8th level and 16th level, the duration of this hex is extended by 1 round. This hex affects all rolls the target must make while it lasts. Whether or not the save is successful, a creature cannot be the target of this hex again for 1 day."

[[entry]]
id = "ref/hex/slumber"
anchor = "slumber"
print = '''
A witch can cause a creature within 30 feet to fall into a deep, magical [sleep](ref/spell/sleep), as per the spell _sleep_. The creature receives a Will save to negate the effect. If the save fails, the creature falls asleep for a number of rounds equal to the witch's level. This hex can affect a creature of any HD. The creature will not wake due to noise or light, but others can rouse it with a standard action.

Table 2–10: Witch Base Attack Fort Ref Will Level Bonus Save Save Save Special 1st +0 +0 +0 +2 Cantrips, hex, witch's familiar 2nd +1 +0 +0 +3 Hex 3rd +1 +1 +1 +3 4th +2 +1 +1 +4 Hex 5th +2 +1 +1 +4 6th +3 +2 +2 +5 Hex 7th +3 +2 +2 +5 8th +4 +2 +2 +6 Hex 9th +4 +3 +3 +6 10th +5 +3 +3 +7 Hex, major hex 11th +5 +3 +3 +7 12th +6/+1 +4 +4 +8 Hex 13th +6/+1 +4 +4 +8 14th +7/+2 +4 +4 +9 Hex 15th +7/+2 +5 +5 +9 16th +8/+3 +5 +5 +10 Hex 17th +8/+3 +5 +5 +10 18th +9/+4 +6 +6 +11 Hex, grand hex 19th +9/+4 +6 +6 +11 20th +10/+5 +6 +6 +12 Hex This hex ends immediately if the creature takes damage. Whether or not the save is successful, a creature cannot be the target of this hex again for 1 day.'''

[[entry]]
id = "ref/hex/ward"
anchor = "ward"
print = "A witch can use this hex to place a protective ward over one creature. The warded creature receives a +2 deflection bonus to AC and a +2 resistance bonus on saving throws. This ward lasts until the warded creature is hit or fails a saving throw. A witch knows when a warded creature is no longer protected. A witch can have only one ward active at a time. If the witch uses this ability again, the previous ward immediately ends. A witch cannot use this ability on herself. At 8th level and 16th level, the bonuses provided by this ward increase by +1."

[[entry]]
id = "ref/hex/waxen-image"
anchor = "waxen-image"
print = '''
The witch can spend a full-round action to create a crude and unnerving wax duplicate of a creature she can see within 30 feet. Once the image is complete, the subject must make a Will save. If the subject fails, the witch gains a small measure of control over the creature. Whenever she exercises this control, the creature receives a new Will save to end the effect. This effect occurs on the witch's turn and does not impede the creature's actions on its turn. The witch can use the waxen image a number of times equal to her Intelligence modifier before it melts. As a standard action, the witch can cause the subject to do any one of the following things: move up to the creature's speed in any direction, attack itself once with any weapon in hand (this attack automatically hits), lay down on the ground, or drop anything held. Alternatively, she can spend one of her uses to simply torture the image, causing the creature to be both [sickened](ref/misc/sickened) and [staggered](ref/misc/staggered) on its turn. As soon as the creature has succeeded on a saving throw against this effect, it is immune to it for 24 hours. The is an enchantment (compulsion) effect.

_Weather Control (Su)_: A witch with this hex can use _control weather_ once per day, but creating the weather takes 1 full hour of chanting, dancing, and communing with her familiar.'''

[[entry]]
id = "ref/ragepower/beast-totem"
anchor = "beast-totem"
print = '''
While raging, the barbarian gains a +1 natural armor bonus. This bonus increases by +1 for every four levels the barbarian has attained. A barbarian must have the [lesser beast totem](ref/ragepower/lesser-beast-totem) rage power to select this rage power. A barbarian must be at least 6th level to select this rage power.

_Beast Totem, Greater (Su)_: While raging, the barbarian gains the pounce special ability, allowing her to make a full attack at the end of a charge. In addition, the damage from her claws increases to 1d8 (1d6 if Small) and the claws deal ×3 damage on a critical hit. A barbarian must have the beast totem rage power to select this rage power. A barbarian must be at least 10th level to select this rage power.'''

[[entry]]
id = "ref/ragepower/elemental-rage"
anchor = "elemental-rage"
print = '''
While raging, all of the barbarian's melee attacks deal an additional 1d6 points of energy damage (acid, cold, electricity, or fire). The type is chosen when the barbarian begins her rage. A barbarian must have the [lesser elemental rage](ref/ragepower/lesser-elemental-rage) power to select this rage power. A barbarian must be at least 8th level to select this rage power. Note that the barbarian can still use her lesser elemental rage power while using this rage power, but she must select a different energy type.

_Elemental Rage, Greater (Su)_: While raging, all of the barbarian's critical hits made with melee weapons deal an additional 1d10 points of energy damage (2d10 if the weapon deals ×3 damage on a critical hit, 3d10 if the weapon deals ×4 on a critical hit). The type of this damage is the same as the type chosen for the elemental rage power. A barbarian must have the elemental rage power to select this rage power. A barbarian must be at least 12th level to select this rage power.'''

[[entry]]
id = "ref/ragepower/greater-brawler"
anchor = "greater-brawler"
print = '''
While raging, the barbarian is treated as if she has [Two-Weapon Fighting](ref/feat/two-weapon-fighting) when making unarmed strike attacks. A barbarian must have the [brawler](ref/ragepower/brawler) rage power to select this rage power.

_Chaos Totem (Su)_: While raging, the barbarian's form becomes infused with chaos. She gains a +4 bonus on Escape Artist checks and has a 25% chance to ignore extra damage from critical hits and sneak attacks. A barbarian must have the lesser chaos totem rage power to select this rage power. A barbarian must be at least 6th level to select this rage power.

_Chaos Totem, Greater (Su)_: While raging, the barbarian gains DR/lawful equal to 1/2 her barbarian level. Her weapons and natural weapons are considered chaotic for the purpose of overcoming damage reduction. A barbarian must have the chaos totem rage power to select this rage power. A barbarian must be at least 10th level to select this rage power.'''

[[entry]]
id = "ref/ragepower/greater-spirit-totem"
anchor = "greater-spirit-totem"
print = "While raging, the spirits that surround the barbarian become dangerous to any enemy adjacent to the barbarian. Living enemies adjacent to the barbarian at the start of her turn take 1d8 points of negative energy damage. In addition, the spirit wisps can now attack foes that are up to 15 feet away from the barbarian and the slam attack deals 1d6 points of negative energy damage. A barbarian must have the [spirit totem](ref/ragepower/spirit-totem) rage power and be at least 10th level to select this rage power."

[[entry]]
id = "ref/ragepower/inspire-ferocity"
anchor = "inspire-ferocity"
print = "While raging, the barbarian can use a move action to impart her [reckless abandon](ref/ragepower/reckless-abandon) modifier to all willing allies within 30 feet for a number of rounds equal to her Charisma modifier (minimum 1). A barbarian must have the reckless abandon rage power to select this rage power."

[[entry]]
id = "ref/ragepower/knockdown"
anchor = "knockdown"
print = '''
Once per rage, the barbarian can make a [trip](ref/rule/trip) attack against one target in place of a melee attack. If successful, the target takes damage equal to the barbarian's Strength modifier and is knocked [prone](ref/rule/prone). This does not provoke an attack of opportunity.

_Liquid Courage (Ex)_: While raging, the barbarian increases her morale bonus on saving throws against mind-affecting effects by +1 for each alcoholic drink she consumes during her rage, to a maximum of +1 increase per four barbarian levels.

_Overbearing Advance (Ex)_: While raging, the barbarian inflicts damage equal to her Strength bonus whenever she succeeds at an overrun combat maneuver.

_Overbearing Onslaught (Ex)_: While raging, the barbarian may overrun more than one target per round, with a -2 penalty on her CMB for each overrun check after the first. A barbarian must have the overbearing advance rage power to select this rage power. A barbarian must be at least 6th level to select this rage power.'''

[[entry]]
id = "ref/ragepower/lesser-beast-totem"
anchor = "lesser-beast-totem"
print = '''
While raging, the barbarian gains two [claw attacks](ref/umr/natural-attacks). These attacks are considered primary attacks and are made at the barbarian's full base attack bonus. The claws deal 1d6 points of slashing damage (1d4 if Small) plus the barbarian's Strength modifier.

_Boasting Taunt (Ex)_: While raging, the barbarian can incite a creature to attack her by making an Intimidate check to demoralize. If the check succeeds, the target is also shaken as long as the barbarian is visible and raging or until it makes a melee attack against the barbarian. The barbarian receives a +2 circumstance bonus on this check for every alcoholic drink she has consumed during this rage. This is a language-dependent mind-affecting effect, and it relies on audible components. The barbarian must be at least 6th level to select this power.

_Brawler_: While raging, the barbarian is treated as if she has Improved Unarmed Strike. If she already has the feat, her unarmed strikes deal 1d6 points of damage (1d4 if she is Small).'''

[[entry]]
id = "ref/ragepower/lesser-chaos-totem"
anchor = "lesser-chaos-totem"
print = "While raging, the barbarian gains a +1 deflection bonus to AC against the attacks of lawful creatures and a +1 resistance bonus on saving throws against confusion, insanity, polymorph, and effects with the lawful descriptor. This bonus increases by +1 for each chaos totem rage power she possesses.\n\n_Come and Get Me (Ex)_: While raging, as a free action the barbarian may leave herself open to attack while preparing devastating counterattacks. Enemies gain a +4 bonus on attack and damage rolls against the barbarian until the beginning of her next turn, but every attack against the barbarian provokes an attack of opportunity from her, which is resolved prior to resolving each enemy attack. A barbarian must be at least 12th level to select this rage power.\n\n_Disruptive_: When raging, the barbarian gains Disruptive as a bonus feat. The barbarian must have the superstition\\* rage power to select this rage power. A barbarian must be at least 8th level to select this rage power."

[[entry]]
id = "ref/ragepower/lesser-elemental-rage"
anchor = "lesser-elemental-rage"
print = '''
As a swift action, the barbarian can cause her melee attacks to deal an additional 1d6 points of energy damage (acid, cold, electricity, or fire) for 1 round. A barbarian must be at least 4th level to select this rage power. This power can only be used once per rage.

_Energy Absorption (Su)_: While raging, the barbarian can absorb energy from a single attack of her chosen energy type once per rage. She does not make a saving throw against the effect but takes no damage from it, instead gaining 1 temporary hit point per 3 points of damage the attack would have inflicted. These temporary hit points last until the end of the barbarian's rage. A barbarian must have the greater energy resistance rage power to select this rage power. A barbarian must be at least 12th level to select this rage power.

_Energy Eruption (Su)_: While raging, the barbarian can absorb energy from a single attack and unleash it upon her enemies once per rage. She does not make a saving throw against the effect but takes no damage from it. At any point during the remainder of her rage she can unleash the stored energy as a breath weapon in either a 60-foot line or 30-foot cone. The breath weapon inflicts damage equal to the damage from the attack absorbed by the barbarian, but creatures within the area may make a Reflex save (DC 10 + 1/2 the barbarian's level + the barbarian's Constitution modifier) for half damage even if the original effect did not allow a save. A barbarian must have the energy absorption rage power to select this rage power. A barbarian must be at least 16th level to select this rage power.

_Energy Resistance (Ex)_: While raging, the barbarian gains resistance to one energy type (acid, cold, electricity, fire, or sonic) equal to 1/2 her barbarian level (minimum 1). The energy type is chosen when this rage power is selected and it cannot be changed. This rage power can be selected more than once. Its effects do not stack. Each time is applies to a different energy type.

_Energy Resistance, Greater (Ex)_: Once per rage, a barbarian can reduce damage by half from a single attack against which she has energy resistance (halve the damage, then apply resistance). A barbarian must have the energy resistance rage power to select this rage power. A barbarian must be at least 8th level to select this rage power.

_Ferocious Mount (Ex)_: While raging and mounted, the barbarian's mount also gains the benefits of rage (including greater rage and mighty rage) as long as the barbarian is mounted or adjacent to it. While her mount is raging in this way, she must spend one additional round of rage per round. She can elect not to pay this cost, in which case her mount does not rage.

_Ferocious Mount, Greater (Ex)_: While raging and mounted, the barbarian's mount gains the benefits of any rage powers that are constant in effect when the barbarian is raging. It does not gain the benefit of any rage powers that require actions to activate, even if they are free actions. A barbarian must have the ferocious mount rage power to select this rage power. A barbarian must be at least 8th level to select this rage power.

_Ferocious Trample (Ex)_: While raging and mounted, the barbarian's mount gains the trample special attack (_Pathfinder RPG Bestiary_ 305). This attack inflicts 1d8 points of damage for a Medium mount, 2d6 for a Large mount, or 2d8 for a Huge mount, plus 1–1/2 times the mount's Strength modifier. A successful Reflex save (DC 10 + 1/2 the barbarian's level + the mount's Strength modifier) halves this damage. Creatures in the mount's path or that threaten squares it passes through may make attacks of opportunity against either the barbarian or the mount, but not both. A barbarian must have the ferocious mount rage power to select this rage power. A barbarian must be at least 8th level to select this rage power.

_Ferocious Trample, Greater (Ex)_: A barbarian's mount can affect creatures up to its own size with its ferocious trample. In addition, it can make an overrun combat maneuver check as a free action against a creature that fails its Reflex save (or chooses not to save in order to take an attack of opportunity) against its trample. A barbarian must have the ferocious trample rage power to select this rage power. A barbarian must be at least 12th level to select this rage power.

_Fiend Totem (Su)_: While raging, the barbarian sprouts dozens of wicked barbs from her body. Anyone striking the barbarian with a melee weapon, an unarmed strike, or a natural weapon takes 1d6 points of piercing damage. A barbarian must have the lesser fiend totem rage power to select this rage power. A barbarian must be at least 6th level to select this rage power.

_Fiend Totem, Greater (Su)_: While raging, the barbarian is surrounded by an aura of menace. Good creatures adjacent to the barbarian are shaken and take 2d6 points of slashing damage at the beginning of the barbarian's turn as dozens of small cuts open across their flesh. Neutral creatures that are adjacent to the barbarian are shaken, but do not take any damage. Evil creatures are unaffected. A barbarian must have the fiend totem rage power to select this rage power. A barbarian must be at least 10th level to select this rage power.'''

[[entry]]
id = "ref/ragepower/lesser-fiend-totem"
anchor = "lesser-fiend-totem"
print = '''
While raging, the barbarian grows a pair of large horns, gaining a [gore attack](ref/umr/natural-attacks). This attack is a primary attack (unless she is also attacking with weapons, in which case it is a secondary attack) and is made at the barbarian's full base attack bonus (-5 if it is a secondary attack). The gore attack deals 1d8 points of piercing damage (1d6 if Small) plus the barbarian's Strength modifier (1/2 if it is a secondary attack).

_Flesh Wound (Ex)_: Once per rage, the barbarian can try to avoid serious harm from an attack. The barbarian must make a Fortitude save with a DC equal to the damage that would be dealt by the attack. The barbarian's armor check penalty applies on this saving throw. If the save succeeds, the barbarian takes half damage from the attack and the damage is nonlethal. The barbarian must elect to use this ability after the attack roll is made, but before the damage is rolled. A barbarian must be at least 10th level to select this rage power.

_Good for What Ails You (Ex)_: While raging, the barbarian who takes a drink of alcohol may attempt a new saving throw against one of the following conditions that may be affecting her: blinded, confused, dazzled, deafened, exhausted, fatigued, frightened, nauseated, panicked, shaken, or sickened. If she succeeds at the save, the effect is suppressed for the duration of the rage. She also may attempt a new saving throw if poisoned; a successful save counts against those required for a cure, but a failed save has no ill effect.

_Ground Breaker (Ex)_: Once per rage, the barbarian can attack the floor around her as a standard action. This attack automatically hits and deals damage normally. If the barbarian manages to deal more damage than the floor's hardness, the space she occupies and all of the squares adjacent to her become difficult terrain. Creatures in these squares, except the barbarian, must make a DC 15 Reflex save or be knocked prone. A barbarian must be at least 6th level to select this rage power.

_Guarded Life (Ex)_: While raging, if the barbarian is reduced below 0 hit points, 1 hit point of lethal damage per barbarian level is converted to nonlethal damage. If the barbarian is at negative hit points due to lethal damage, she immediately stabilizes.

_Hurling (Ex)_: As lesser hurling, but the barbarian can increase the range increment to 20 feet or increase the size of a hurled object by one size category. A barbarian must have the lesser hurling rage power to select this rage power. A barbarian must be at least 8th level to select this rage power.

_Hurling, Greater (Ex)_: As hurling, but the barbarian can increase the range increment to 30 feet or increase the size of a hurled object by two size categories. A barbarian must have the hurling rage power to select this rage power. A barbarian must be at least 12th level to select this rage power.

_Hurling, Lesser (Ex)_: As a full-round action while raging, the barbarian can lift and hurl an object up to one size category smaller than herself with both hands or two size categories smaller with one hand as an improvised weapon with a range increment of 10 feet. This inflicts damage as a falling object (_Core Rulebook_ 443) plus the barbarian's Strength bonus. This damage is halved if the object is not made of stone, metal, or similar material. This is a ranged touch attack, and the target may attempt a Reflex save (DC 10 + 1/2 the barbarian's level + the barbarian's Strength modifier) for half damage. The barbarian may apply Power Attack to this attack as a one- or two-handed weapon, as appropriate.

_Hurling Charge (Ex)_: While raging and making a charge attack, the barbarian may draw and throw a hurled weapon during her charge, gaining the normal +2 attack roll bonus on the thrown weapon attack as well as on the melee attack at the end of the charge. The barbarian must move at least 10 feet before using a thrown weapon and at least 10 additional feet before making a melee attack at the end of her charge. The barbarian must have a thrown weapon in hand or have one hand free at the beginning of her charge. A barbarian must have the lesser hurling rage power to select this rage power. A barbarian must be at least 6th level to select this rage power.'''

[[entry]]
id = "ref/ragepower/lesser-spirit-totem"
anchor = "lesser-spirit-totem"
print = '''
While raging, the barbarian is surrounded by spirit wisps that harass her foes. These spirits make one slam attack each round against a living foe that is adjacent to the barbarian. This slam attack is made using the barbarian's full base attack bonus, plus the barbarian's Charisma modifier. The slam deals 1d4 points of negative energy damage, plus the barbarian's Charisma modifier.

_Staggering Drunk (Ex)_: While raging, a barbarian gains a +1 dodge bonus to AC against attacks of opportunity for each alcoholic drink she has consumed during her rage, to a maximum of +1 per four barbarian levels.'''

[[entry]]
id = "ref/ragepower/reckless-abandon"
anchor = "reckless-abandon"
print = '''
While raging, the barbarian can take a -1 penalty to AC to gain a +1 bonus on attack rolls. The AC penalty increases by -1 and the attack roll bonus increases by +1 at 4th level and every four levels thereafter.

_Roaring Drunk (Ex)_: While raging, the barbarian gains a +1 morale bonus on Intimidate checks and to the save DC of any fear effects she creates for each alcoholic drink she has consumed during her rage, to a maximum of +1 per four barbarian levels.

_Smasher (Ex)_: Once per rage, whenever the barbarian makes an attack against an unattended object or a sunder combat maneuver, she can ignore the object's hardness. This ability must be used before the attack roll or sunder check is made.'''

[[entry]]
id = "ref/ragepower/spellbreaker"
anchor = "spellbreaker"
print = '''
When raging, the barbarian gains [Spellbreaker](ref/feat/spellbreaker) as a bonus feat. A barbarian must have the [disruptive](ref/ragepower/disruptive) rage power and be at least 12th level to select this rage power.

_Spirit Steed (Su)_: While raging and mounted, the barbarian's mount gains DR/magic equal to 1/2 the barbarian's level. The mount's natural weapons count as magical for the purpose of overcoming damage reduction. A barbarian must have the ferocious mount rage power to select this rage power. A barbarian must be at least 6th level to select this rage power.

_Spirit Totem (Su)_: While raging, the spirits that surround the barbarian make it difficult for her enemies to see her. The spirits grant the barbarian a 20% miss chance against ranged attacks and melee attacks made by creatures that are not adjacent to the barbarian (typically due to reach). A barbarian must have the lesser spirit totem rage power to select this rage power. A barbarian must be at least 6th level to select this rage power.'''

[[entry]]
id = "ref/ragepower/witch-hunter"
anchor = "witch-hunter"
print = "While raging, the barbarian gains a +1 bonus on damage rolls against creatures possessing spells or [spell-like abilities](ref/umr/spell-like-abilities). This damage bonus increases by +1 for every four levels the barbarian has obtained. A barbarian must have the [superstition](ref/ragepower/superstition) rage power to select this rage power."
