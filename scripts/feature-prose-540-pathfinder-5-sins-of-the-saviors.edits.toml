parent = ""
after = "exotic-companion"
note = "hand-written by the batch lead from print (Pathfinder #5 Sins of the Saviors p. 72, ruling 14): after the features print lists the abilities that the variant class does not give, each in a paragraph led by its name in bold; the import has them only as the trades. An unlisted section of the entry, as print has it; no feature, no `by` for the trade (the book states it as a list and not as a sentence of a feature)."
text = '''
The druid does not gain this ability.
'''

