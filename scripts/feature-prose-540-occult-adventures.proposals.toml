[[entry]]
id = "ref/arc-alchemist/promethean-alchemist"
opening = ["Obsessed with discovering the origins of life, promethean alchemists build constructs they gradually endow with life."]

[[entry.feature]]
anchor = "craft-construct"
head = "Craft Construct"
listed = true
level = 1
print = "At 1st level, a promethean alchemist gains the [promethean disciple](ref/discovery/promethean-disciple) discovery (see above). This ability replaces Brew Potion and Throw Anything."
import_trades = ["Brew Potion, Throw Anything", "Brew Potion", "Throw Anything"]

[[entry.feature]]
anchor = "homunculus-companion"
head = "Homunculus Companion (Ex)"
listed = true
level = 1
print = "At 1st level, a promethean alchemist gains the service of a homunculus companion. The means for creating this special homunculus are more exotic than normal and require investiture of the promethean alchemist's own life essence into the homunculus. This construct generally resembles a small humanoid or child when first created; the specific appearance is up to its creator, though a homunculus is always humanoid in shape and obviously unnatural on close inspection. While every homunculus companion is absolutely devoted to its master, some homunculi's loyalty borders on the unsettling; such companions jealously protect their masters from threats or construct strange shrines in their masters' honor. A homunculus companion can be of any alignment, even one that is different from its master's. A destroyed homunculus companion can be restored to life by performing a ritual with its corpse that requires 1 pint of its creator's blood per Hit Die of the homunculus and rare materials worth 100 gp per Hit Die of the homunculus. Performing this ritual takes 1 hour (though it may take some time to gather enough blood at higher levels, so many promethean alchemists keep chilled blood samples in storage just in case). A promethean alchemist can't take the mutagen or cognatogen discoveries. This ability replaces bombs and mutagen."
import_trades = ["Bombs, mutagen", "Bombs", "mutagen"]

[[entry.feature]]
anchor = "discoveries"
head = "Discoveries"
listed = false
print = "The following discoveries complement this archetype: [alchemical simulacrum](ref/discovery/alchemical-simulacrum), [doppelganger simulacrum](ref/discovery/doppelganger-simulacrum), and [greater alchemical simulacrum](ref/discovery/greater-alchemical-simulacrum)."

[[entry.feature]]
anchor = "homunculus-companion-base-statistics"
head = "Homunculus Companion Base Statistics"
listed = true
print = "A homunculus companion has the following features, as described on Table 2–2 on page 114."

[[entry.feature]]
anchor = "level"
head = "Level"
listed = true
print = "This is the homunculus's master's alchemist level."

[[entry.feature]]
anchor = "hd"
head = "HD"
listed = true
print = "This is the homunculus's total number of 10-sided (d10) Hit Dice. The homunculus doesn't have a Constitution score, but it gains bonus hit points based on its size."

[[entry.feature]]
anchor = "bab"
head = "BAB"
listed = true
print = "This is the base attack bonus of the homunculus, which is equal to its number of Hit Dice."

[[entry.feature]]
anchor = "saves"
head = "Saves"
listed = true
print = "These are the base saving throw bonuses of the homunculus."

[[entry.feature]]
anchor = "skills"
head = "Skills"
listed = false
print = '''
This entry lists the homunculus's total number of skill ranks. A homunculus with a high Intelligence score modifies these totals as normal (the homunculus gains a number of skill ranks equal to 2 + its Intelligence modifier per HD). A homunculus can't have more ranks in a skill than it has Hit Dice.

_Homunculus Class Skills_: The following skills are class skills for a homunculus: Bluff (Cha), Craft (Int), Fly (Dex), Knowledge (arcana) (Int), Perception (Wis), Sense Motive (Wis), and Stealth (Dex). In addition, at 1st level, a promethean alchemist can choose two additional skills to be class skills for his homunculus.'''

[[entry.feature]]
anchor = "feats"
head = "Feats"
listed = true
print = "This is the total number of feats the homunculus has. A homunculus can select any feats it qualifies for, but must possess the appropriate appendages in order to use some feats."

[[entry.feature]]
anchor = "str-dex-bonus"
head = "Str/Dex Bonus"
listed = true
print = "Add this modifier to the homunculus's Strength and Dexterity."

[[entry.feature]]
anchor = "special"
head = "Special"
listed = true
print = "As the homunculus increases in power, it gains the special abilities described below."

[[entry.feature]]
anchor = "darkvision"
head = "Darkvision (Ex)"
listed = true
print = "The homunculus has [darkvision](ref/rule/darkvision) out to a range of 60 feet."

[[entry.feature]]
anchor = "low-light-vision"
head = "Low-Light Vision (Ex)"
listed = true
print = "Homunculi see twice as far as humans in [dim light](ref/rule/vision-and-light)."

[[entry.feature]]
anchor = "sympathetic-alchemy"
head = "Sympathetic Alchemy (Su)"
listed = true
print = "The bond between a promethean alchemist and his homunculus is so close that the alchemist's extracts function for the homunculus as if it were the alchemist, allowing the homunculus companion to benefit from extracts without the alchemist needing the infusion discovery. The homunculus is treated as a humanoid or a construct—whichever is more beneficial—for the purposes of what extracts can affect it. Additionally, the homunculus can prepare its master's extracts from his formula book for him each day, as long as it's within the range of its telepathic link."

[[entry.feature]]
anchor = "telepathic-link"
head = "Telepathic Link (Su)"
listed = true
print = "A homunculus can't initially speak, but shares a telepathic link with its creator. It knows what its master knows and can convey to him everything it sees and hears, out to a range of 1,500 feet."

[[entry.feature]]
anchor = "weapon-and-armor-proficiency"
head = "Weapon and Armor Proficiency (Ex)"
listed = true
print = "A homunculus is proficient with simple weapons, but not armor or shields."

[[entry.feature]]
anchor = "evasion"
head = "Evasion (Ex)"
listed = true
level = 3
print = "At 3rd level, if a homunculus is subjected to an attack that normally allows a Reflex save for half damage, it takes no damage if it succeeds at its saving throw."

[[entry.feature]]
anchor = "ability-score-increase"
head = "Ability Score Increase (Ex)"
listed = true
print = "The homunculus adds 1 to one of its ability scores at 5th level and every 5 levels thereafter."

[[entry.feature]]
anchor = "speech"
head = "Speech (Ex)"
listed = true
level = 6
print = "At 6th level, the homunculus gains the ability to speak any languages it knows."

[[entry.feature]]
anchor = "spell-resistance"
head = "Spell Resistance (Su)"
listed = true
level = 9
print = "At 9th level, the homunculus gains [spell resistance](ref/rule/spell-resistance) equal to 11 + its master's alchemist level."

[[entry.feature]]
anchor = "improved-evasion"
head = "Improved Evasion (Ex)"
listed = true
level = 15
print = '''
At 15th level, when subjected to an attack that allows a Reflex save for half damage, the homunculus takes no damage if it succeeds at the saving throw and only half damage if it fails the saving throw.

Homunculus Starting Statistics Size Small; Speed 20 ft., fly 30 ft. (poor); AC +2 natural armor; Attack bite (1d4); Ability Scores Str 10, Dex 15, Con —, Int 10, Wis 12, Cha 7; Special Qualities [darkvision](ref/rule/darkvision), [low-light vision](ref/rule/low-light-vision);

Languages Common (can't speak).

4th-Level Advancement Size Medium; Speed 30 ft., fly 40 ft.

(average); Attack bite (1d6 plus poison), 2 claws (1d6); Ability Scores Str +4, Dex -2; Special Attacks poison (bite—injury _frequency_ 1/minute for 60 minutes, _effect_ sleep for 1 minute, _cure_ 1 save, Con-based DC with a +2 racial bonus).'''

[[entry.feature]]
anchor = "table-2-2-homunculus-companions"
head = "Table 2–2: Homunculus Companions"
listed = true
print = "Level HD BAB Saves Skills Feats Str/Dex Bonus 1st 1 +1 +0 2 1 +0 2nd 2 +2 +0 4 1 +0 3rd 3 +3 +1 8 2 +1 4th 3 +3 +1 8 2 +1 5th 4 +4 +1 10 2 +1 6th 5 +5 +1 12 3 +2 7th 6 +6 +2 14 3 +2 8th 6 +6 +2 14 3 +2 9th 7 +7 +2 16 4 +3 10th 8 +8 +2 18 4 +3 11th 9 +9 +3 20 5 +3 12th 9 +9 +3 20 5 +4 13th 10 +10 +3 22 5 +4 14th 11 +11 +3 24 6 +4 15th 12 +12 +4 26 6 +5 16th 12 +12 +4 26 6 +5 17th 13 +13 +4 28 7 +5 18th 14 +14 +4 30 7 +6 19th 15 +15 +5 32 8 +6 20th 15 +15 +5 32 8 +6"

[[entry]]
id = "ref/arc-barbarian/flesheater"
hold = "Unbound Form (Su): the sentence \"This ability alters self, beast shape IV, form of the dragon III, or giant form II, as appropriate\" names no trade"
opening = ["A flesheater eats flesh to create a spiritual bond between herself and the consumed creature, allowing her to take on aspects of the creature that served as the meal."]

[[entry.feature]]
anchor = "rage"
head = "Rage"
listed = true
print = "In additional to the standard bonuses and penalties of rage, a flesheater takes a -2 penalty to Intelligence while raging. The additional benefits and penalties from a flesheater's abilities last only as long as her rage does, and she cannot use these abilities if they would bring the total penalty to Intelligence to an amount equal to or greater than her Intelligence score. This ability alters the rage ability."
import_trades = ["Rage"]

[[entry.feature]]
anchor = "one-flesh"
head = "One Flesh (Su)"
listed = true
level = 2
print = "At 2nd level when entering a rage, a flesheater can spend an additional round of rage and take an additional -2 penalty to Intelligence to take on a single ability of the valid consumed creature whose flesh she ate most recently. For the purpose of this ability, a valid consumed creature is any dead animal, dragon, humanoid, or magical beast that died and was consumed by the flesheater within the past 24 hours. She can choose any ability listed under _[beast shape I](ref/spell/beast-shape-1)_, as long as the creature possessed that ability. At 5th level, the flesheater can take on any number of the creature's abilities that are listed under _[beast shape I](ref/spell/beast-shape-1)_. At 8th level, the flesheater can instead take on one of the creature's abilities listed under _[beast shape II](ref/spell/beast-shape-2)_. The flesheater's appearance alters to resemble the consumed creature, but she does not change shape. This is a polymorph effect. This ability replaces uncanny dodge, improved uncanny dodge, and the 2nd- and 8th-level rage powers."
import_trades = ["Uncanny dodge, improved uncanny dodge, the 2nd- and 8th-level rage powers", "Uncanny dodge", "improved uncanny dodge", "the 2nd-", "8th-level rage powers"]

[[entry.feature]]
anchor = "unbound-rage"
head = "Unbound Rage (Su)"
listed = true
level = 11
print = "At 11th level, a flesheater can draw in mass from the Ethereal Plane to enlarge herself when she enters a rage, as long as the creature whose flesh she last consumed was at least one size category larger than her base size. Unbound rage affects her as _[enlarge person](ref/spell/enlarge-person)_, except she receives a +4 size bonus to Strength and an additional -2 penalty to Intelligence. This ability replaces greater rage."
import_trades = ["Greater rage"]

[[entry.feature]]
anchor = "feast"
head = "Feast (Su)"
listed = true
level = 14
print = "At 14th level, a flesheater can use her one flesh and unbound rage abilities to emulate any one valid consumed creature of her choice, rather than only the one she consumed most recently. This ability replaces the 14th-level rage power."
import_trades = ["The 14th-level rage power"]

[[entry.feature]]
anchor = "unbound-form"
head = "Unbound Form (Su)"
listed = true
level = 20
print = "At 20th level, a flesheater can use her one flesh ability to assume the shape of a valid consumed creature. This ability functions as _[alter self](ref/spell/alter-self)_, _[beast shape IV](ref/spell/beast-shape-4)_, _[form of the dragon III](ref/spell/form-of-the-dragon-3)_, or _[giant form II](ref/spell/giant-form-2)_, as appropriate. This is a polymorph effect. This ability replaces mighty rage."
import_trades = ["Mighty rage"]

[[entry.feature]]
anchor = "rage-powers"
head = "Rage Powers"
listed = false
print = "The following rage powers complement the flesheater archetype: [animal fury](ref/ragepower/animal-fury), [beast totem](ref/ragepower/beast-totem) (any), [inspire ferocity](ref/ragepower/inspire-ferocity), [internal fortitude](ref/ragepower/internal-fortitude), and [terrifying howl](ref/ragepower/terrifying-howl)."

[[entry]]
id = "ref/arc-magus/mindblade"
hold = "checker: [fields] trades = \"replaces: Arcane pool\" disagrees with the trade sentences of the feature `psychic-pool` = \"replaces: arcane pool, and counts as arcane pool for the purpose of feats, abilities, and class features\" (line 68)"
opening = ["A mindblade blends psychic talent and martial skill to lethal effect. By forming weapons with her mind, she always has the right tool for any situation."]

[[entry.feature]]
anchor = "spells"
head = "Spells"
listed = true
print = '''
A mindblade casts spells from the magus spell list as psychic spells. She can cast any spell she knows without preparing it ahead of time. To learn or cast a spell, a mindblade must have an Intelligence score equal to at least 10 + the spell's level. The saving throw DC to resist a mindblade's spell is equal to 10 + the spell's level + the mindblade's Intelligence modifier.

Like other spellcasters, a mindblade can cast only a certain number of spells of each spell level per day. She knows the same number of spells and receives the same number of spells slots per day as a [bard](ref/class/bard) of her magus level, and knows and uses 0-level knacks as a bard uses cantrips. In addition, she receives [bonus spells per day](ref/rule/determine-bonuses) if she has a high Intelligence score (see Table 1–3 on page 17 of the _Core Rulebook_).

At 5th level and every 3 levels thereafter, a mindblade can learn a new spell in place of one she already knows, using the same rules as a bard. In effect, the mindblade loses the old spell in exchange for the new one. The new spell's level must be the same as that of the spell being exchanged, and the new spell must be at least 1 level lower than the highest-level spell the mindblade can cast.

A mindblade need not prepare her spells in advance. She can cast any magus spell she knows at any time, assuming she has not yet used up her allotment of spells per day for the spell's level.

This ability replaces the magus's spellcasting.'''
import_trades = ["Spellcasting"]

[[entry.feature]]
anchor = "psychic-pool"
head = "Psychic Pool (Su)"
listed = true
level = 1
print = '''
A mindblade gains a psychic pool, similar to a normal magus's arcane pool. At 1st level, a mindblade can expend 1 point from her psychic pool as a standard action to manifest a light melee weapon of her choice, formed from psychic energy. By spending 2 points, the mindblade can manifest a one-handed melee weapon, and by spending 3 points, she can manifest a two-handed melee weapon (but not a [double](ref/misc/double) weapon). This psychic weapon can last indefinitely, but it vanishes if it leaves the mindblade's hand. The mindblade can dismiss a held psychic weapon as a free action. When a psychic weapon vanishes, the mindblade regains the psychic energy used to create it. She can maintain only one weapon at a time.

At 1st level, a psychic weapon counts as a magic weapon of whatever type the mindblade selected, with a +1 enhancement bonus. At 3rd level and every 3 levels thereafter, the weapon's enhancement bonus increases by 1, up to maximum of +5 at 12th level. Starting at 5th level, the mindblade can add any of the weapon special abilities listed in the arcane pool class feature in place of these bonuses, although the weapon must maintain at least a +1 bonus to benefit from any weapon special abilities. At 15th and 18th levels, the weapon gains an additional +1 enhancement bonus, which the mindblade can spend only on weapon special abilities.

This ability replaces arcane pool, and counts as arcane pool for the purpose of feats, abilities, and class features.'''
import_trades = ["Arcane pool"]

[[entry.feature]]
anchor = "psychic-access"
head = "Psychic Access (Su)"
listed = true
level = 4
print = '''
At 4th level, the mindblade gains access to an expanded spell list. She adds two spells from the psychic class spell list to her magus spell list as magus spells of the same spell level. These must be spells of levels the mindblade is able to cast. At 7th, 11th, 14th, and 19th levels, she adds two more psychic class spells to her spell list, following the same restrictions. When a mindblade takes the [spell blending](ref/arcana/spell-blending) arcana, she gains spells from the psychic class spell list instead of the wizard spell list.

This ability replaces spell recall, knowledge pool, improved spell recall, greater spell combat, and greater spell access.'''
import_trades = ["Spell recall, knowledge pool, improved spell recall, greater spell combat, greater spell access", "Spell recall", "knowledge pool", "improved spell recall", "greater spell combat", "greater spell access"]

[[entry.feature]]
anchor = "dual-weapons"
head = "Dual Weapons (Su)"
listed = true
level = 7
print = "At 7th level, a mindblade can maintain two psychic weapons at a time or a psychic double weapon, though each weapon (or each end of a double weapon) has an enhancement bonus 1 lower than normal. Starting at 12th level, each of the two psychic weapons (or each end of a double weapon) instead has an enhancement bonus 2 lower than normal. When using two-weapon fighting with two psychic weapons or a psychic double weapon, the mindblade can use her spell combat ability as though she had a hand free. This ability replaces medium armor."
import_trades = ["Medium armor"]

[[entry.feature]]
anchor = "rapid-manifest"
head = "Rapid Manifest (Su)"
listed = true
level = 8
print = "At 8th level, a mindblade can manifest a psychic weapon as a swift action. This ability replaces improved spell combat."
import_trades = ["Improved spell combat"]

[[entry.feature]]
anchor = "dual-manifest"
head = "Dual Manifest (Su)"
listed = true
level = 13
print = "At 13th level, a mindblade can manifest two psychic weapons with the same action. She must pay the cost for both weapons. Also, when wielding a weapon two-handed, she can use her spell combat ability as though she had a hand free. This ability replaces heavy armor."
import_trades = ["Heavy armor"]

[[entry]]
id = "ref/arc-mesmerist/vexing-daredevil"
hold = "checker: [fields] trades = \"replaces: Touch treatment\" disagrees with the trade sentences of the text outside any feature = \"none\" (line 25)"
opening_from_print = true
opening = ["Vexing daredevils train their psychic powers for combat, specializing in momentarily blinding and confusing their foes with sudden feints and tricks."]

[[entry.feature]]
anchor = "class-skills"
head = "Class Skills"
listed = true
print = "A vexing daredevil adds Acrobatics (Dex) to her list of class skills. This alters the mesmerist's class skills."

[[entry.feature]]
anchor = "martial-weapon-proficiency"
head = "Martial Weapon Proficiency (Ex)"
listed = true
level = 1
print = "At 1st level, a vexing daredevil picks one martial weapon and becomes proficient in its use. This ability replaces the 1st-level mesmerist trick."
import_trades = ["1st-level mesmerist trick"]

[[entry.feature]]
anchor = "bonus-feats"
head = "Bonus Feats"
listed = false
print = "A vexing daredevil gains [Improved Feint](ref/feat/improved-feint) as a bonus feat at 3rd level, [Greater Feint](ref/feat/greater-feint) as a bonus feat at 6th level, and [Greater Mesmerizing Feint](ref/feat/greater-mesmerizing-feint) as a bonus feat at 10th level. She doesn't need to meet the prerequisites for these feats. At 14th level, she gains a bonus stare feat; she must meet the prerequisites of that feat. These bonus feats replace touch treatment."
import_trades = ["Touch treatment"]

[[entry.feature]]
anchor = "dazzling-feint"
head = "Dazzling Feint (Su)"
listed = true
level = 3
print = "At 3rd level, each time a vexing daredevil successfully feints against a creature under the effect of her hypnotic stare, she also chooses one of her dazzling feint benefits to activate. Unless otherwise stated, a dazzling feint's benefit applies only on the vexing daredevil's next attack this round. She selects one dazzling feint at 3rd level and another every 4 levels thereafter. The DC for any saving throw against a dazzling feint's effect is equal to 10 + 1/2 the vexing daredevil's class level + her Charisma modifier. The vexing daredevil can't choose the same dazzling feint more than once."
import_trades = ["Bold stare"]

[[entry.feature]]
anchor = "blinding-strike"
head = "Blinding Strike"
listed = false
parent = "dazzling-feint"
print = "The vexing daredevil's weapon emits a bright flash of light into the opponent's eyes. If the vexing daredevil's next attack hits, the target must succeed at a Fortitude saving throw or be [blinded](ref/misc/blinded) for 1 round."

[[entry.feature]]
anchor = "combat-maneuver"
head = "Combat Maneuver"
listed = false
parent = "dazzling-feint"
print = "The vexing daredevil's attack patterns become more difficult to discern. The vexing daredevil chooses one [combat maneuver](ref/rule/combat-maneuvers) when making this dazzling feint. For the rest of the round, she doesn't provoke an attack of opportunity when performing that combat maneuver against the target of her dazzling feint. This dazzling feint benefit applies on combat maneuvers instead of on the vexing daredevil's next attack."

[[entry.feature]]
anchor = "critical-strike"
head = "Critical Strike"
listed = false
parent = "dazzling-feint"
print = "Ever alert, the vexing daredevil hones in on the target's weak points. If her next attack is a critical threat against the target of this dazzling feint, the vexing daredevil gains a circumstance bonus on the roll to confirm that critical hit equal to +1 for every 3 mesmerist levels she possesses."

[[entry.feature]]
anchor = "outmanuever"
head = "Outmanuever"
listed = false
parent = "dazzling-feint"
print = "The vexing daredevil's darting movements foil the target's attempts to box her in. If her next attack hits, the vexing daredevil gains a +4 circumstance bonus on Acrobatics checks to move through the target's space or threatened area for 1 round. She can also move up to half her speed after the attack hits as a free action. If she wants to use Acrobatics to move through the target's threatened area or an enemy's space during this movement, she must reduce her speed or the DC of the Acrobatics check increases by 10, as normal."

[[entry.feature]]
anchor = "piercing-strike"
head = "Piercing Strike"
listed = false
parent = "dazzling-feint"
print = "By psychically amplifying the target's pain, the vexing daredevil causes more damage. If she hits with her next attack and deals damage with her painful stare, she increases the damage dice from d6s to d8s."

[[entry.feature]]
anchor = "sloppy-defense"
head = "Sloppy Defense"
listed = false
parent = "dazzling-feint"
print = "The vexing daredevil's attacks effortlessly penetrate the target's defenses; she gains a +1 circumstance bonus on her next attack roll for every 5 mesmerist levels she possesses."

[[entry.feature]]
anchor = "surprise-strike"
head = "Surprise Strike"
listed = false
parent = "dazzling-feint"
print = "The vexing daredevil creates an opening so she can squeeze in another strike. If her next attack hits, she can make another attack at her highest attack bonus - 5 as a free action. The vexing daredevil must be at least 7th level to select this dazzling feint. This ability replaces bold stare."

[[entry.feature]]
anchor = "shimmering-body"
head = "Shimmering Body (Sp)"
listed = true
level = 11
print = "At 11th level, when a vexing daredevil moves in a round, until the beginning of her next turn, any target of her hypnotic stare sees her as a constantly shimmering form of light and treats her as if she were under a _[blur](ref/spell/blur)_ spell. This ability replaces glib lie."
import_trades = ["Glib lie"]

[[entry]]
id = "ref/arc-psychic/amnesiac"
opening_from_print = true
opening = ["The amnesiac once possessed great psychic power, but mental blocks—resulting from either a traumatic event or intentional implantation—have caused her to forget what she knew before. The amnesiac's struggle to control her psychic magic leads to wild and unpredictable results."]

[[entry.feature]]
anchor = "repressed-memories"
head = "Repressed Memories"
listed = true
print = "All the amnesiac's older memories have been deeply hidden, as though she had been affected by multiple _[repress memory](ref/spell/repress-memory)_ spells. She isn't prevented from remembering things that happen over the course of a game, but might be forgetful. If the amnesiac's memories are ever restored, she loses this archetype and reverts to a standard psychic."

[[entry.feature]]
anchor = "spells"
head = "Spells"
listed = true
print = '''
An amnesiac's ability to cast psychic spells is the same as that of the psychic class, with the following exceptions.

An amnesiac's faulty memory makes remembering and casting spells difficult, but the increased flexibility can be a great benefit. Instead of choosing a number of spells known from Table 1–8: Psychic Spells Known, an amnesiac accesses spells she knew the previous day from the recesses of her mind. This requires 1 hour of meditation. Each day, for each spell level the amnesiac can cast, she retains a number of spells known equal to half the number listed on Table 1–8, rounded up. These spells must be selected from spells the amnesiac knew the previous day (including any spells she remembered using spell recollection; see below). The remainder of her spells known (half the number on Table 1–8, rounded down) become amnesia slots, which the amnesiac can use with her spell recollection ability (see below). To determine the spells she knows on the day when she first takes this archetype, the amnesiac picks any one 1st-level spell from the psychic spell list.

This change to spells doesn't apply to knacks (0-level spells) or discipline spells, which function the same way they do for a normal psychic. When the amnesiac gains access to 3rd-level spells, she gains full recall of her 1st-level spells and no longer gains 1st-level amnesia slots, instead gaining the full number of 1st-level spells known from Table 1–8 and casting them as a normal psychic. When this happens, the amnesiac can select any level-appropriate spells from the psychic spell list as her spells known, even if they were never among the spells she prepared or recalled; once selected, these spells can no longer be changed, as with a normal psychic. Each time the psychic gains access to a new level of spells, she gains full memory of spells 2 levels lower in the same way (gaining full memory and permanently selecting her 2nd-level spells when she gains access to 4th-level spells, and so on). This ability alters spellcasting.'''
import_trades = ["Spellcasting"]

[[entry.feature]]
anchor = "spell-recollection"
head = "Spell Recollection (Ex)"
listed = true
print = '''
Once per hour as a swift action, an amnesiac can attempt to remember any spell from the psychic spell list of her choice from either of the 2 highest spell levels she can cast. When she does, she rolls on Table 2–1: Spell Recollection to determine the result. Because the mental stress of combat brings memories to the surface more easily, the amnesiac adds 1d10 to this roll's result if she's in combat when she attempts to recall a spell. Regardless of the result, the amnesiac expends an amnesia slot of the appropriate level for the spell she is attempting to remember; she must cast the spell remembered (if any) using that amnesia slot during the same round, or the spell slot is lost without effect.

Once a spell has been remembered in this way, the amnesiac can cast it as one of her spells known for the rest of the day (even if she failed to cast the spell during the round in which she remembered it), unless spell recollection allowed her to cast a spell of a higher level than she would normally be able to cast.'''

[[entry]]
id = "ref/arc-psychic/formless-adept"
opening = ["Formless adepts master their psychic powers to", "unshackle themselves", "from the confines of the", "flesh and empower their", "spellcasting. They learn", "to assume increasingly", "insubstantial forms", "until they become like", "living ghosts."]

[[entry.feature]]
anchor = "phrenic-charisma"
head = "Phrenic Charisma"
listed = true
print = "A formless adept uses his Charisma modifier to determine the number of points in his phrenic pool. This ability alters phrenic pool."
import_trades = ["Phrenic pool"]

[[entry.feature]]
anchor = "formless-body"
head = "Formless Body"
listed = true
print = "A formless adept gradually sheds his body, taking on increasingly nebulous forms. A formless adept can assume a formless body as a standard action. He can remain in each formless body type for a number of rounds per day equal to 3 + his Charisma modifier. The rounds don't have to be used consecutively, but must be used in 1-round increments. Resuming his physical form takes another standard action; otherwise, the formless adept continues spending rounds of formless body until he runs out of them. The formless adept must return to his physical form before assuming a different formless body."
import_trades = ["Psychic discipline, discipline powers", "Psychic discipline", "discipline powers"]

[[entry.feature]]
anchor = "blurred-body"
head = "Blurred Body (Su)"
listed = true
level = 1
print = "At 1st level, a formless adept can act under the effect of a _[blur](ref/spell/blur)_ spell. At 5th level, the formless adept can use this ability for a number of minutes per day instead of rounds per day. These minutes don't have to be used consecutively, but must be used in 1-minute increments."

[[entry.feature]]
anchor = "gaseous-body"
head = "Gaseous Body (Su)"
listed = true
level = 5
print = "At 5th level, a formless adept can become gaseous as _[gaseous form](ref/spell/gaseous-form)._ At 13th level, the formless adept can use this ability for a number of minutes per day instead of rounds per day. These minutes don't have to be used consecutively, but must be used in 1-minute increments."

[[entry.feature]]
anchor = "incorporeal-body"
head = "Incorporeal Body (Su)"
listed = true
level = 13
print = '''
At 13th level, a formless adept can become [incorporeal](ref/umr/incorporeal).

This ability replaces the psychic discipline and discipline powers class features.'''

[[entry.feature]]
anchor = "formless-spell"
head = "Formless Spell"
listed = true
level = 1
print = "At 1st level, a formless adept gains the formless spell phrenic amplification. He can spend 1 point from his phrenic pool to cast a spell with a standard-action casting time as part of the action he uses to assume his formless body, expending the spell slot as normal. This ability replaces the 1st-level phrenic amplification."
import_trades = ["1st-level phrenic amplification"]

[[entry.feature]]
anchor = "bonus-spells"
head = "Bonus Spells"
listed = false
print = "The formless adept adds extra spells to his list of spells known while he's in a formless body (including when he uses the formless spell phrenic amplification). Spells with a duration last for their full duration, even if the psychic reverts to his physical form. For feats and other abilities that require these spells as prerequisites, the psychic counts as knowing the spells but can benefit from the feats and abilities only while in a formless body. The formless adept gains the following spells at the appropriate levels: _chill touch_ and _expeditious retreat_ (1st), _levitate_ and _stricken heart_ (4th), _gaseous form_ and _vampiric touch_ (6th), _shadow step_ and _telekinesis_ (8th), _dominate person_ and _synapse overload_ (10th), _disintegrate_ and _enemy hammer_ (12th), _finger of death_ and _telekinetic sphere_ (14th), _etherealness_ and _power word stun_ (16th), and _dominate monster_ and _telekinetic storm_ (18th). This ability replaces discipline spells."
import_trades = ["Discipline spells"]

[[entry.feature]]
anchor = "psychic-possession"
head = "Psychic Possession (Su)"
listed = true
level = 15
print = "At 15th level, while using his incorporeal body ability, a formless adept can attempt to psychically possess another living creature. To use this"
import_trades = ["15th-level phrenic amplification"]

[[entry.feature]]
anchor = "table-2-1-spell-recollection"
head = "Table 2–1: Spell Recollection"
listed = true
level = 15
print = "d% Result 1–10 The amnesiac is unable to cast spells this round. 11–35 The amnesiac can't remember the new spell (but can still cast spells this round). 36–95 The amnesiac remembers and can cast the new spell. 96+ The amnesiac can choose to treat this result as 36–95. Alternatively, once per day, she can instead temporarily recall any spell from the psychic spell list that's 1 level higher than the spell she's attempting to remember. When she does, her caster level counts as the minimum caster level required to cast the higher-level spell, and she forgets the spell after it's cast. ability, the formless adept must be adjacent to the target. This effect works as the _greater possession_ spell and can be maintained only as long as the formless adept maintains his incorporeal body form. The target can attempt a Will save with a DC equal to 10 + 1/2 the formless adept's class level + the formless adept's Intelligence modifier to resist the effect. A creature that successfully saves is immune to the formless adept's psychic possession for 24 hours. This ability replaces the 15th-level phrenic amplification."

[[entry.feature]]
anchor = "formless-master"
head = "Formless Master (Su)"
listed = true
level = 20
print = "At 20th level, a formless adept can assume any formless body as a swift action and change between formless body types as a standard action (without returning to his physical form first). He can use the formless spell phrenic amplification to cast any spell with a swift-action casting time when assuming a formless body or any spell with a standard-action casting time while switching between formless bodies. The formless adept also adds his Charisma bonus as a deflection bonus to his AC while in a formless body. A formless adept can attempt a saving throw to bypass any spells that prevent entry of incorporeal creatures (such as _[anti-incorporeal shell](ref/spell/anti-incorporeal-shell)_), even if the spells don't normally allow one. This ability replaces remade self."
import_trades = ["Remade self"]
