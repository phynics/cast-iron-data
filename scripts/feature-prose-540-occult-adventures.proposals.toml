[[entry]]
id = "ref/arc-alchemist/promethean-alchemist"
opening = ["Obsessed with discovering the origins of life, promethean alchemists build constructs they gradually endow with life."]

[[entry.feature]]
anchor = "craft-construct"
head = "Craft Construct"
listed = true
level = 1
print = "At 1st level, a promethean alchemist gains the [promethean disciple](ref/discovery/promethean-disciple) discovery (see above). This ability replaces Brew Potion and Throw Anything."
import_trades = ["Brew Potion, Throw Anything", "Brew Potion", "Throw Anything"]

[[entry.feature]]
anchor = "homunculus-companion"
head = "Homunculus Companion (Ex)"
listed = true
level = 1
print = "At 1st level, a promethean alchemist gains the service of a homunculus companion. The means for creating this special homunculus are more exotic than normal and require investiture of the promethean alchemist's own life essence into the homunculus. This construct generally resembles a small humanoid or child when first created; the specific appearance is up to its creator, though a homunculus is always humanoid in shape and obviously unnatural on close inspection. While every homunculus companion is absolutely devoted to its master, some homunculi's loyalty borders on the unsettling; such companions jealously protect their masters from threats or construct strange shrines in their masters' honor. A homunculus companion can be of any alignment, even one that is different from its master's. A destroyed homunculus companion can be restored to life by performing a ritual with its corpse that requires 1 pint of its creator's blood per Hit Die of the homunculus and rare materials worth 100 gp per Hit Die of the homunculus. Performing this ritual takes 1 hour (though it may take some time to gather enough blood at higher levels, so many promethean alchemists keep chilled blood samples in storage just in case). A promethean alchemist can't take the mutagen or cognatogen discoveries. This ability replaces bombs and mutagen."
import_trades = ["Bombs, mutagen", "Bombs", "mutagen"]

[[entry.feature]]
anchor = "discoveries"
head = "Discoveries"
listed = false
print = "The following discoveries complement this archetype: [alchemical simulacrum](ref/discovery/alchemical-simulacrum), [doppelganger simulacrum](ref/discovery/doppelganger-simulacrum), and [greater alchemical simulacrum](ref/discovery/greater-alchemical-simulacrum)."

[[entry.feature]]
anchor = "homunculus-companion-base-statistics"
head = "Homunculus Companion Base Statistics"
listed = true
print = "A homunculus companion has the following features, as described on Table 2–2 on page 114."

[[entry.feature]]
anchor = "level"
head = "Level"
listed = true
print = "This is the homunculus's master's alchemist level."

[[entry.feature]]
anchor = "hd"
head = "HD"
listed = true
print = "This is the homunculus's total number of 10-sided (d10) Hit Dice. The homunculus doesn't have a Constitution score, but it gains bonus hit points based on its size."

[[entry.feature]]
anchor = "bab"
head = "BAB"
listed = true
print = "This is the base attack bonus of the homunculus, which is equal to its number of Hit Dice."

[[entry.feature]]
anchor = "saves"
head = "Saves"
listed = true
print = "These are the base saving throw bonuses of the homunculus."

[[entry.feature]]
anchor = "skills"
head = "Skills"
listed = false
print = '''
This entry lists the homunculus's total number of skill ranks. A homunculus with a high Intelligence score modifies these totals as normal (the homunculus gains a number of skill ranks equal to 2 + its Intelligence modifier per HD). A homunculus can't have more ranks in a skill than it has Hit Dice.

_Homunculus Class Skills_: The following skills are class skills for a homunculus: Bluff (Cha), Craft (Int), Fly (Dex), Knowledge (arcana) (Int), Perception (Wis), Sense Motive (Wis), and Stealth (Dex). In addition, at 1st level, a promethean alchemist can choose two additional skills to be class skills for his homunculus.'''

[[entry.feature]]
anchor = "feats"
head = "Feats"
listed = true
print = "This is the total number of feats the homunculus has. A homunculus can select any feats it qualifies for, but must possess the appropriate appendages in order to use some feats."

[[entry.feature]]
anchor = "str-dex-bonus"
head = "Str/Dex Bonus"
listed = true
print = "Add this modifier to the homunculus's Strength and Dexterity."

[[entry.feature]]
anchor = "special"
head = "Special"
listed = true
print = "As the homunculus increases in power, it gains the special abilities described below."

[[entry.feature]]
anchor = "darkvision"
head = "Darkvision (Ex)"
listed = true
print = "The homunculus has [darkvision](ref/rule/darkvision) out to a range of 60 feet."

[[entry.feature]]
anchor = "low-light-vision"
head = "Low-Light Vision (Ex)"
listed = true
print = "Homunculi see twice as far as humans in [dim light](ref/rule/vision-and-light)."

[[entry.feature]]
anchor = "sympathetic-alchemy"
head = "Sympathetic Alchemy (Su)"
listed = true
print = "The bond between a promethean alchemist and his homunculus is so close that the alchemist's extracts function for the homunculus as if it were the alchemist, allowing the homunculus companion to benefit from extracts without the alchemist needing the infusion discovery. The homunculus is treated as a humanoid or a construct—whichever is more beneficial—for the purposes of what extracts can affect it. Additionally, the homunculus can prepare its master's extracts from his formula book for him each day, as long as it's within the range of its telepathic link."

[[entry.feature]]
anchor = "telepathic-link"
head = "Telepathic Link (Su)"
listed = true
print = "A homunculus can't initially speak, but shares a telepathic link with its creator. It knows what its master knows and can convey to him everything it sees and hears, out to a range of 1,500 feet."

[[entry.feature]]
anchor = "weapon-and-armor-proficiency"
head = "Weapon and Armor Proficiency (Ex)"
listed = false
print = "A homunculus is proficient with simple weapons, but not armor or shields."

[[entry.feature]]
anchor = "evasion"
head = "Evasion (Ex)"
listed = true
level = 3
print = "At 3rd level, if a homunculus is subjected to an attack that normally allows a Reflex save for half damage, it takes no damage if it succeeds at its saving throw."

[[entry.feature]]
anchor = "ability-score-increase"
head = "Ability Score Increase (Ex)"
listed = true
print = "The homunculus adds 1 to one of its ability scores at 5th level and every 5 levels thereafter."

[[entry.feature]]
anchor = "speech"
head = "Speech (Ex)"
listed = true
level = 6
print = "At 6th level, the homunculus gains the ability to speak any languages it knows."

[[entry.feature]]
anchor = "spell-resistance"
head = "Spell Resistance (Su)"
listed = true
level = 9
print = "At 9th level, the homunculus gains [spell resistance](ref/rule/spell-resistance) equal to 11 + its master's alchemist level."

[[entry.feature]]
anchor = "improved-evasion"
head = "Improved Evasion (Ex)"
listed = true
level = 15
print = '''
At 15th level, when subjected to an attack that allows a Reflex save for half damage, the homunculus takes no damage if it succeeds at the saving throw and only half damage if it fails the saving throw.

Homunculus Starting Statistics Size Small; Speed 20 ft., fly 30 ft. (poor); AC +2 natural armor; Attack bite (1d4); Ability Scores Str 10, Dex 15, Con —, Int 10, Wis 12, Cha 7; Special Qualities [darkvision](ref/rule/darkvision), [low-light vision](ref/rule/low-light-vision);

Languages Common (can't speak).

4th-Level Advancement Size Medium; Speed 30 ft., fly 40 ft.

(average); Attack bite (1d6 plus poison), 2 claws (1d6); Ability Scores Str +4, Dex -2; Special Attacks poison (bite—injury _frequency_ 1/minute for 60 minutes, _effect_ sleep for 1 minute, _cure_ 1 save, Con-based DC with a +2 racial bonus).'''

