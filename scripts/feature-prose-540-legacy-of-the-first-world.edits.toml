anchor = "patron"
note = "the script's text with the printed citations \"(Pathfinder Player Companion: Heroes of the Wild 11)\" and \"(Heroes of the Wild 13)\" dropped after the linked patrons plant and thorns (ruling 26)"
text = '''
A seducer must select [deception](ref/patron/deception), [enchantment](ref/patron/enchantment), [plant](ref/patron/plant), [thorns](ref/patron/thorns), or [trickery](ref/patron/trickery) as her patron.
'''

