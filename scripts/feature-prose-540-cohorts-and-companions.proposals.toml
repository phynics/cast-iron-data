er gains a +1 sacred bonus to caster level for effects with the emotion descriptor (except fear effects) Torag LG Cavalier, fighter, paladin Leader gains a +2 sacred bonus on Craft checks dealing with metal and on Profession (soldier) checks Urgathoa NE Cleric, witch, wizard Leader gains a +1 profane bonus to caster level for disease and death effects Zon-Kuthon LE Alchemist, inquisitor, magus Leader gains a +1 profane bonus to caster level for effects with the darkness or pain descriptor"
