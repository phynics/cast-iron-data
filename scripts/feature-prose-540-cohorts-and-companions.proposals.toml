[[entry.feature]]
anchor = "emotional-appeal"
head = "Emotional Appeal"
listed = true
print = '''
A proselytizer has great power over the emotions of others, wielding his voice like a weapon to pierce the heart of listeners and bring them closer to communion with his deity's power. The warpriest adds the following spells to his warpriest spell list at the indicated levels. He casts these as divine warpriest spells: 1st—_charm person_, _rally point_, _wrath_; 2nd—_castigate_, _heroism_, _suggestion_; 3rd—_charm monster_, _geas (lesser)_; 4th—_forced repentance_, _serenity_; 5th—_castigate (mass)_, _suggestion (mass)_; 6th—_antipathy_, _sympathy_.

This ability replaces sacred armor and the bonus feat gained at 3rd level.'''
