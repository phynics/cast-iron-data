[[entry]]
id = "ref/arc-alchemist/construct-rider"
opening_from_print = true
opening = ["A construct rider creates arcane devices to emulate and surpass weak flesh. Class Skills: The construct rider gains Ride (Dex) and Knowledge (engineering) (Int) as class skills."]

[[entry.feature]]
anchor = "craft-mount"
head = "Craft Mount (Su)"
listed = true
level = 1
print = '''
A construct rider assembles a construct mount shaped like a riding animal. A Medium alchemist can select a [camel](ref/companion/camel) or a [horse](ref/companion/horse). A Small alchemist can select a [pony](ref/companion/pony) or [wolf](ref/companion/wolf), but can also select a [boar](ref/companion/boar) or a [dog](ref/companion/dog) if he's at least 4th level.

The GM may approve other animals as mounts.

This construct mount acts in most ways as a druid [animal companion](ref/sidekick/animal-companion), using the character's alchemist level as his effective druid level. A construct mount is a construct, but uses the appropriate animal companion's statistics, gaining Hit Dice, skills, feats, and Strength and Dexterity adjustments as the alchemist advances in level. A construct mount has no Constitution score, and instead gains bonus hit points appropriate for a construct of its size. It has an Intelligence score (and skill points), a lower base attack bonus, and better saving throws than a normal construct of its Hit Dice. The mount has all the immunities of a construct (except immunity to mind-affecting effects, since it has a mind). A construct rider can use Craft (alchemy) instead of Handle Animal for all purposes involving his construct mount, though the check still takes a -5 penalty due to the construct mount's unusual nature.

To create a construct with a mind and body that are constantly changing and improving, the construct rider must manufacture vast quantities of clockwork or animating reagents. As such, the construct rider can never gain the mutagen or cognatogen ability, even from a discovery or another class.

At first, his mount is a singular masterpiece created during a momentary stroke of brilliance. At 4th level, the construct rider gains [Craft Construct](ref/feat/craft-construct) as a bonus feat and can use his extracts instead of spells to meet spell prerequisites when crafting other constructs.

This ability replaces Brew Potion, mutagen, and the discovery gained at 4th level.'''
import_trades = ["Brew Potion, mutagen, the discovery gained at 4th level", "Brew Potion", "mutagen", "the discovery gained at 4th level"]

[[entry.feature]]
anchor = "diminished-extracts"
head = "Diminished Extracts"
listed = true
print = "A construct rider may prepare one fewer extract of each level than normal. If this reduces the number to 0, he may prepare extracts of that level only if his Intelligence allows bonus extracts of that level."

[[entry.feature]]
anchor = "construct-rider-discoveries"
head = "Construct Rider Discoveries (Su)"
listed = true
print = "The construct rider can select from the following archetype-specific discoveries in place of an alchemist discovery."

[[entry.feature]]
anchor = "internal-reservoir"
head = "Internal Reservoir (Ex, Sp)"
listed = true
print = "The construct mount contains a reservoir tank than the construct rider can fill with one dose of a potion or extract the construct rider created. As a move action that doesn't provoke an attack of opportunity, the construct mount can apply the potion or extract to itself. Refilling the reservoir is a complicated process that requires a DC 20 Craft (alchemy) check. Failure destroys the potion or extract. The process requires 1 minute, and provokes attacks of opportunity. A construct rider must be at least 6th level before selecting this discovery."

[[entry.feature]]
anchor = "vaporizing-reservoir"
head = "Vaporizing Reservoir (Ex, Su)"
listed = true
print = "The construct rider upgrades his mount's reservoir, adding a compartment near the mouth which stores a bomb. Loading the bomb requires the same process as loading an extract or potion. A construct mount loaded with a bomb can unleash it as a breath weapon in a 15-foot cone or a 30-foot line as a standard action, dealing damage as a direct hit against all targets in the area of effect. The alchemist selects a line or cone area when loading the reservoir. Because the construct mount lacks the alchemist's Throw Anything ability, the alchemist's Intelligence bonus doesn't apply to this damage. A construct rider must be at least 8th level and possess the internal reservoir discovery before selecting this discovery."

[[entry.feature]]
anchor = "widened-vaporizer"
head = "Widened Vaporizer (Su)"
listed = true
print = "When the construct mount uses its breath weapon from the vaporizing reservoir discovery, it can also unleash a 30-foot cone or a 60-foot line. A construct rider must be at least 10th level and possess the internal reservoir and vaporizing reservoir discoveries before selecting this discovery."

[[entry]]
id = "ref/arc-cavalier/esquire"
opening_from_print = true
opening = ["The esquire is a roving knight who acquires the services of a faithful follower—an aide-de-camp—who serves as the esquire's assistant, spear carrier, and guard."]

[[entry.feature]]
anchor = "aide-de-camp"
head = "Aide-De-Camp (Ex)"
listed = true
level = 3
print = '''
At 3rd level, an esquire acquires the services of a loyal aide-de-camp. This NPC functions similarly to a cohort, though the aide-de-camp must advance in a class that grants proficiency with all martial weapons and cannot multiclass until the esquire reaches 7th level (though the aide-de-camp can select an archetype). If the aide-de-camp is a cavalier, he must follow the same order as the esquire.

The aide-de-camp gains [Swift Aid](ref/feat/swift-aid) as a bonus feat, and provides a +2 (rather than +1) bonus when using this feat to aid the esquire. As a move action, the aide-de-camp can retrieve a stored item or an item on the ground and hand it to the esquire. The esquire does not have to take an action to receive the item, though he must be conscious and have a free hand. This action does not provoke attacks of opportunity for the aide-de-camp or esquire.

If the aide-de-camp dies performing an act that directly supports the edicts of the esquire's order (GM's discretion), the esquire does not take a penalty to his [Leadership](ref/feat/leadership) score. If an aide-de-camp dies, or is released from the esquire's service, the esquire may gain a new aide-de-camp by scouting for potential candidates in a city or large town. This requires 1 day per 5 levels of the aide-de-camp to be recruited. This ability replaces mount.'''
import_trades = ["Mount"]

[[entry.feature]]
anchor = "teamwork"
head = "Teamwork (Ex)"
listed = true
level = 3
print = "At 3rd level, as long as an esquire and his aide-de-camp are adjacent, the aide-de-camp is treated as having any teamwork feats the esquire has. They also share any teamwork feats that function when two or more allies threaten the same target, as long as they both threaten the same target. This ability replaces cavalier's charge."
import_trades = ["Cavalier's charge"]

[[entry.feature]]
anchor = "shared-challenge"
head = "Shared Challenge (Ex)"
listed = true
level = 4
print = "At 4th level, whenever an esquire challenges an opponent when his aide-de-camp is within 30 feet, he may grant his aide-de-camp bonuses equal to one-[half](ref/misc/fractions-and-rounding) of the bonuses he gains from challenge, including bonuses derived from the cavalier's order. If the aide-de-camp is also a cavalier and challenges the same target, these bonuses do not stack. Like the esquire, his aide-de-camp takes a -2 penalty to Armor Class against attacks from creatures other than the challenged opponent. This ability replaces expert trainer."
import_trades = ["Expert trainer"]

[[entry.feature]]
anchor = "banner"
head = "Banner (Ex)"
listed = true
print = "An aide-de-camp can carry an esquire's banner for him and still grant allies within range the banner's bonuses. While doing so the aide-de-camp gains double the normal morale bonuses provided by the banner. This ability modifies banner."
import_trades = ["Banner"]

[[entry.feature]]
anchor = "avenge-me"
head = "Avenge Me (Ex)"
listed = true
level = 11
print = '''
At 11th level, whenever the esquire is killed, dying, stunned, dazed, or otherwise unable to take actions, his aide-de-camp gains the full benefits of the esquire's challenge and order abilities against all creatures that attacked the esquire in the previous round. If the aide-de-camp is also a cavalier and challenges the same target, these bonuses do not stack. These benefits last until the esquire regains the ability to take actions, or until the aide-de-camp or the triggering opponents are killed.

If his aide-de-camp is killed, dying, or otherwise unable to take actions the esquire may declare one creature of his choice that attacked the aide-de-camp in the past round as his quarry; this functions identically to the [ranger](ref/class/ranger) class ability. These bonuses last until the aide-de-camp recovers or until the cavalier or the triggering opponents are killed. This ability replaces mighty charge.'''
import_trades = ["Mighty charge"]

[[entry.feature]]
anchor = "fight-as-one"
head = "Fight As One (Ex)"
listed = true
level = 20
print = "At 20th level, the shared challenge ability increases in power, granting the aide-de-camp full benefit of the esquire's challenge. In addition, if the esquire and aide-de-camp both confirm a critical hit against the same target within the same round, the target must make a Fortitude save (DC 10 +1/2 the esquire's cavalier level + the esquire's Charisma bonus) or be [staggered](ref/misc/staggered) for 1d4 rounds. This ability replaces supreme charge."
import_trades = ["Supreme charge"]

[[entry]]
id = "ref/arc-investigator/dread-investigator"
opening_from_print = true
opening = ["The dread investigator observes human behavior after the fact, honing their intuition by delving into the mysteries of death. They breach sealed tombs to recover research material rather than riches. Many join—or found—cults dedicated to [Urgathoa](ref/faith/urgathoa), while others are simply researchers or Osirionologists who must become accustomed to undeath to pursue their work."]

[[entry.feature]]
anchor = "delayed-inspiration"
head = "Delayed Inspiration"
listed = true
level = 1
print = "A dread investigator gains inspiration at 4th level instead of 1st and gains studied combat and studied strike at 7th level instead of 4th. A dread investigator's studied strike deals 1d6 fewer points of damage than normal. This alters inspiration, studied combat, and studied strike."
import_trades = ["Inspiration, studied combat, studied strike", "Inspiration", "studied combat", "studied strike"]

[[entry.feature]]
anchor = "embalming-fluids"
head = "Embalming Fluids (Ex)"
listed = true
print = "A dread investigator adds the following spells to his class list of extracts: 1st—_hide from undead_, _sanctify corpse_; 2nd—_gentle repose_, _lesser animate dead_; 3rd—_animate dead_, _speak with dead_; 4th—_rest eternal_. A dread investigator can use these extracts to affect dead bodies as if using the [infusion](ref/discovery/infusion) discovery to affect another creature. This ability replaces poison lore."
import_trades = ["Poison lore"]

[[entry.feature]]
anchor = "negative-energy-resistance"
head = "Negative Energy Resistance (Ex)"
listed = true
level = 2
print = "At 2nd level, a dread investigator gains a +2 bonus on saving throws against death effects, [energy drain](ref/rule/energy-drain-and-negative-levels), and negative energy. This bonus increases to +4 at 5th level and +6 at 8th level. At 11th level, effects created by undead that inflict [ability drain, ability damage](ref/rule/ability-damage-drain), or energy drain have only half their normal effect on a dread investigator (minimum 1 point of ability damage or ability drain, or 1 negative level). This ability replaces poison resistance and immunity."
import_trades = ["Poison resistance, immunity", "Poison resistance", "immunity"]

[[entry.feature]]
anchor = "investigator-talent"
head = "Investigator Talent"
listed = true
print = "When a dread investigator selects the alchemical discovery talent, he can select from the following additional discoveries: [alchemical zombie](ref/discovery/alchemical-zombie), [mummification](ref/discovery/mummification), or [preserve organs](ref/discovery/preserve-organs)."

[[entry.feature]]
anchor = "reanimation-fluid"
head = "Reanimation Fluid (Ex)"
listed = true
level = 7
print = '''
At 7th level, a dread investigator adds _[undead anatomy I](ref/spell/undead-anatomy-1)_ to his formula book, and he can share this extract with an unconscious creature as if he had the infusion discovery. If the creature is dying when it receives the infusion, it stabilizes and gains [temporary hit points](ref/rule/temporary-hit-points) equal to twice the dread investigator's level. Rather than having the extract take effect immediately, the dread investigator may choose for the extract to remain latent for up to 10 minutes per level. He can trigger the extract's effect at any point by touching the creature as a standard action, and it automatically triggers if the creature using it is reduced to 0 or fewer hit points. The dread investigator can also amplify the effect of the extract, allowing it to function as _[undead anatomy II](ref/spell/undead-anatomy-2)_, but this reduces the extract's duration to 1 round per level and at the end of its duration the creature using the extract is reduced to -1 hit points.

At 13th level, a dread investigator adds _[undead anatomy II](ref/spell/undead-anatomy-2)_ to his formula book, and at 19th level _[undead anatomy III](ref/spell/undead-anatomy-3)_, which he can use in the same way, including amplifying the effect of the extract to the next-higher-level undead anatomy spell. This ability replaces the investigator talents gained at 7th, 13th, and 19th level.'''
import_trades = ["Investigator talents gained at 7th, 13th, and 19th level", "Investigator talents gained at 7th", "13th", "19th level"]

