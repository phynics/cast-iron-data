[[entry.feature]]
anchor = "weapon-and-armor-proficiencies"
head = "Weapon and Armor Proficiencies"
listed = false
print = "A proselytizer does not gain proficiency with heavy armor or with all martial weapons, though he does gain proficiency in his deity's favored weapon. If his deity's favored weapon is unarmed strike, he gains [Improved Unarmed Strike](ref/feat/improved-unarmed-strike) as a bonus feat. This ability alters the warpriest's weapon and armor proficiencies."
