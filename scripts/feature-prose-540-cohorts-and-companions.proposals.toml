[[entry.feature]]
anchor = "hidden-bond"
head = "Hidden Bond (Sp)"
listed = true
level = 1
print = "A bonded wizard can change the appearance and magical aura of her bonded item at will, as if using _[disguise self](ref/spell/disguise-self)_ and _[magic aura](ref/spell/magic-aura)_, but affecting only the item; for the purpose of _[disguise self](ref/spell/disguise-self)_, the item's item type (such as weapon or ring) is its creature type. This ability replaces Scribe Scroll."
import_trades = ["Scribe Scroll"]

[[entry.feature]]
anchor = "bonded-force"
head = "Bonded Force (Su)"
listed = true
level = 5
print = '''
At 5th level, a bonded wizard wearing or wielding her bonded object can channel magical energies through it to create tools, armor, and weapons from pure force. She gains a pool of force points equal to half his wizard level. She can expend 1 point from his force pool as a standard action to create an effect that acts as _[mage armor](ref/spell/mage-armor)_ (lasting 1 hour), _[shield](ref/spell/shield)_ (lasting 1 minute), or _[spiritual weapon](ref/spell/spiritual-weapon)_ (any simple or martial weapon, using her Intelligence modifier to determine its attack bonus rather than Wisdom and lasting 1 round per wizard level). These effects are visible; they take the appearance of armor, shields, or weapons as appropriate, and they always have some visual detail reminiscent of the wizard's bonded item (such as the pattern of a bonded ring appearing as decoration on a _[mage armor](ref/spell/mage-armor)_ or _[shield](ref/spell/shield)_ effect).

At 9th level, when the bonded wizard uses bonded force for _[mage armor](ref/spell/mage-armor)_, the armor bonus increases by 1; when she uses bonded force for _[shield](ref/spell/shield)_, the [shield](ref/spell/shield) bonus increases by 1; and she gains a +1 enhancement bonus on attack and damage rolls when using bonded force for _[spiritual weapon](ref/spell/spiritual-weapon)_. The increases for _[mage armor](ref/spell/mage-armor)_ and _shield_ and the enhancement bonus for _[spiritual weapon](ref/spell/spiritual-weapon)_ improve by an additional 1 at 13th level and again at 17th level. When she uses bonded force for _[spiritual weapon](ref/spell/spiritual-weapon)_, the bonded wizard can choose to reduce this enhancement bonus by 1 to double the _spiritual weapon's_ critical threat range as the _[keen](ref/magic-enh/keen)_ weapon property, and for _mage armor_ or _shield_, she can choose to reduce the armor or shield bonus by 1 to protect herself from critical hits and sneak attacks as the _[light fortification](ref/magic-enh/fortification-light)_ armor property.

Alternatively, the bonded wizard can expend a point from her force pool to create a tool of force, which functions as a masterwork version of a simple tool of her choice that could be reproduced by a _[traveler's any-tool](ref/magic-wondrous/travelers-any-tool)_. The tool has the same AC and durability as a'''
import_trades = ["5th- and 15th-level bonus feats", "5th-", "15th-level bonus feats"]

