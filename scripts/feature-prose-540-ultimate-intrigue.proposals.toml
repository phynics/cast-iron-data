[[entry]]
id = "ref/arc-rogue/phantom-thief"
hold = "the replaces trade `Debilitating injury` is not printed in a sentence, and no listed feature of that name prints it; the alters trade `Rogue's edge (unchained rogue only)` is not printed in a sentence, and no listed feature of that name prints it; Refined Education (Ex): the sentence \"This ability alters the rogue's class skills\" names no trade"
opening_from_print = true
opening = ["Also known as gentleman thieves or lady thieves, phantom thieves don't know the desperation of a hard life like many rogues. Instead, they come from the ranks of the elite, having grown bored with their finery, and seek thrills from acts of daring, skill, and crime. Phantom thieves don't need the money, so they often perform acts such as breaking into a secure vault for the thrill, leaving a calling card rather than robbing the place."]

[[entry.feature]]
anchor = "refined-education"
head = "Refined Education (Ex)"
listed = true
level = 1
print = '''
A phantom thief adds Handle Animal, Heal, Ride, Spellcraft, Survival, and all Knowledge skills to her list of class skills. Furthermore, she selects one of her rogue class skills and adds half her rogue level on all skill checks using that skill. At 3rd level and every 2 rogue levels thereafter, she selects an additional rogue class skill and adds half her rogue level on all skill checks using that skill as well. Starting at 4th level, if the phantom thief is an unchained rogue, she gains rogue's edge skill unlocks with each of these skills rather than selecting one skill every 5 levels, and she adds half her rogue level to her number of ranks to determine when she receives a skill unlock (so a 7th level rogue (phantom thief) with 7 ranks in a chosen skill would count as having 10 ranks and receive the second skill unlock).

This ability alters the rogue's class skills and replaces sneak attack and trapfinding. For an unchained rogue, it also alters rogue's edge and replaces debilitating injury.'''
import_trades = ["Rogue's edge (unchained rogue only)", "Debilitating injury, sneak attack, trapfinding", "Debilitating injury", "sneak attack", "trapfinding"]

[[entry.feature]]
anchor = "broad-education"
head = "Broad Education (Ex)"
listed = true
print = '''
A phantom thief 's broad studies with expensive tutors keep her up to speed in both martial and magical knowledge, as well as in her skills. She can select the [combat trick](ref/talent/combat-trick), [minor magic](ref/talent/minor-magic), and [major magic](ref/talent/major-magic) rogue talents as many times as she likes, and she can select the [Skill Focus](ref/feat/skill-focus) feat as a rogue talent, also as many times as she likes. Finally, she can select a vigilante social talent instead of a rogue talent, except for social grace and vigilante social talents that would require her to be a craftsman or professional. For the purpose of vigilante social talents, a phantom thief does not have a vigilante identity and is always considered to be in her social identity.

This ability alters rogue talent.'''
import_trades = ["Rogue talent"]

[[entry.feature]]
anchor = "social-sense"
head = "Social Sense (Ex)"
listed = true
level = 3
print = '''
At 3rd level, a phantom thief's social sixth sense allows her to avoid danger in social situations and to act first when it breaks out. She receives a +1 bonus on Sense Motive checks to avoid being surprised by a foe, on Bluff checks to surprise a foe, and on initiative checks for surprise rounds that involved Bluff and Sense Motive checks to determine surprise. This bonus increases by 1 at 3rd level and every 3 rogue levels thereafter.

This ability replaces trap sense.'''
import_trades = ["Trap sense"]

[[entry.feature]]
anchor = "master-of-all"
