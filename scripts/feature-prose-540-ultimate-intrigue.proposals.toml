At 4th level, a sage counselor can spend 1 ki point while performing a flurry of blows to [feint](ref/skill/bluff) an opponent as a swift action, but he can't spend 1 ki point to make an additional attack when making a flurry of blows. At 10th level, he can also choose to replace his first attack during a flurry of blows with a feint check.

