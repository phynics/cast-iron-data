[[entry.feature]]
anchor = "shapechanger"
head = "Shapechanger (Su)"
listed = true
level = 1
print = '''
At 1st level, a metamorph gains the ability to transform herself into another form. This ability functions like _[alter self](ref/spell/alter-self)_, except as noted here. The effect lasts for 1 hour per metamorph's alchemist level, or until she changes back. Changing form (to another form or back) is a standard action that doesn't provoke attacks of opportunity. The metamorph is [fatigued](ref/misc/fatigued) for 1 round each time she changes shape.

A metamorph can use this ability once per day at 1st level, and an additional time per day at 4th level, and every 2 alchemist levels thereafter, for a total of nine times at 18th level. At 20th level, a metamorph can use shapechanger as a free action once per round, either before or after all her other actions, with no daily limit.

This ability can also function as _[monstrous physique I](ref/spell/monstrous-physique-1)_ at 5th level, as _[monstrous physique II](ref/spell/monstrous-physique-2)_ at 9th level, as _[monstrous physique III](ref/spell/monstrous-physique-3)_ at 11th level, as _[monstrous physique IV](ref/spell/monstrous-physique-4)_ or _[giant form I](ref/spell/giant-form-1)_ at 13th level, and as _[giant form II](ref/spell/giant-form-2)_ at 15th level.

This ability replaces alchemy (which also includes bombs, extracts, and mutagen) and Throw Anything.'''
import_trades = ["Alchemy, bombs, extracts, mutagen, Throw Anything", "Alchemy", "bombs", "extracts", "mutagen", "Throw Anything"]

