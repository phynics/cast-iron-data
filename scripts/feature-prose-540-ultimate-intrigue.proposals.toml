[[entry]]
id = "ref/arc-alchemist/metamorph"
hold = "Shapechanger (Su): the sentence \"This ability alters self, except as noted here\" names no trade"
opening_from_print = true
opening = ["Metamorphs eschew traditional alchemy, focusing on internal chemistry and the transfiguration of living forms."]

[[entry.feature]]
anchor = "class-skills"
head = "Class Skills"
listed = false
print = '''
A metamorph adds Disguise to her list of class skills.

This alters the alchemist's class skills.'''

[[entry.feature]]
anchor = "shapechanger"
head = "Shapechanger (Su)"
listed = true
level = 1
print = '''
At 1st level, a metamorph gains the ability to transform herself into another form. This ability functions like _[alter self](ref/spell/alter-self)_, except as noted here. The effect lasts for 1 hour per metamorph's alchemist level, or until she changes back. Changing form (to another form or back) is a standard action that doesn't provoke attacks of opportunity. The metamorph is [fatigued](ref/misc/fatigued) for 1 round each time she changes shape.

A metamorph can use this ability once per day at 1st level, and an additional time per day at 4th level, and every 2 alchemist levels thereafter, for a total of nine times at 18th level. At 20th level, a metamorph can use shapechanger as a free action once per round, either before or after all her other actions, with no daily limit.

This ability can also function as _[monstrous physique I](ref/spell/monstrous-physique-1)_ at 5th level, as _[monstrous physique II](ref/spell/monstrous-physique-2)_ at 9th level, as _[monstrous physique III](ref/spell/monstrous-physique-3)_ at 11th level, as _[monstrous physique IV](ref/spell/monstrous-physique-4)_ or _[giant form I](ref/spell/giant-form-1)_ at 13th level, and as _[giant form II](ref/spell/giant-form-2)_ at 15th level.

This ability replaces alchemy (which also includes bombs, extracts, and mutagen) and Throw Anything.'''
import_trades = ["Alchemy, bombs, extracts, mutagen, Throw Anything", "Alchemy", "bombs", "extracts", "mutagen", "Throw Anything"]

[[entry.feature]]
anchor = "mutagen"
head = "Mutagen (Ex)"
listed = true
level = 1
print = "At 1st level, a metamorph gains mutagen as a normal alchemist. She can take mutagen and cognatogen discoveries despite not possessing the alchemy class feature that normally grants mutagen."

[[entry.feature]]
anchor = "adaptive-physiology"
head = "Adaptive Physiology (Ex)"
listed = true
level = 3
print = '''
At 3rd level, a metamorph gains a 25% chance to negate critical hits and precision damage, similar to the [preserve organs](ref/discovery/preserve-organs) discovery. This chance increases to 50% at 6th level, and to 75% at 18th level.

This ability replaces swift alchemy, swift poisoning, and instant alchemy.'''
import_trades = ["Swift alchemy, swift poisoning, instant alchemy", "Swift alchemy", "swift poisoning", "instant alchemy"]

[[entry]]
id = "ref/arc-inquisitor/faith-hunter"
hold = "the replaces trade `justice` is not printed in a sentence, and no listed feature of that name prints it; the replaces trade `destruction judgments` is not printed in a sentence, and no listed feature of that name prints it"
opening = ["Certain relentless inquisitors burn with special hatred for an enemy of specific convictions, and they stop at nothing when obsessively hunting these foes down."]

[[entry.feature]]
anchor = "sworn-enemy"
head = "Sworn Enemy (Sp, Su)"
listed = true
level = 1
print = '''
A faith hunter chooses a single alignment (such as chaotic evil, rather than simply chaotic or evil) that directly opposes her own along either the law/ chaos axis or the good/evil axis (so a lawful good faith hunter can choose chaotic good, chaotic neutral, chaotic evil, neutral evil, or lawful evil, whereas a neutral good faith hunter can only choose chaotic evil, neutral evil, or lawful evil). Creatures of this alignment are her sworn enemies. She can detect creatures of that specific alignment at will, functioning as _[detect evil](ref/spell/detect-evil),_ except this ability works only on creatures and detects the specific alignment.

At 6th level, once per day as a swift action, a faith hunter can smite one foe she can see. If the foe is of the faith hunter's sworn enemy alignment, the faith hunter gains a +4 sacred bonus on attack rolls against that foe and a sacred bonus equal to half her inquisitor level on damage rolls made against the foe. Smites against targets of the faith hunter's sworn enemy alignment automatically bypass any DR the creature might possess. If the faith hunter targets a creature that is not of her sworn enemy alignment, the smite is wasted with no effect.

The smite effect remains until the foe is dead or the next time the faith hunter rests and regains her uses of this ability. At 10th level and every 4 inquisitor levels thereafter, a faith hunter can smite her enemies one additional time per day, to a maximum of four times per day at 18th level.

A faith hunter does not gain the justice or destruction judgments.

This ability replaces domain and alters judgment.'''
import_trades = ["Judgment", "Domain, justice, destruction judgments", "Domain", "justice", "destruction judgments"]

[[entry.feature]]
anchor = "enemy-revealed"
head = "Enemy Revealed (Su)"
listed = true
level = 2
print = '''
At 2nd level, when a faith hunter uses her sworn enemy ability to identify a creature's alignment (typically on the third round of concentrating on an area including the creature), she can reveal that creature's alignment aura, causing it to glow for 1 round per inquisitor level so that even creatures with regular vision can see the aura. This not only allows others to recognize the creature's alignment, potentially exposing its true nature, it also allows them to track its location easily by the glow. Even if such a creature is invisible, the telltale glow pinpoints the creature's square or squares. The faith hunter can use this ability a number of times per day equal to her Wisdom modifier (minimum 1), and it doesn't take any extra action on her part to do so; it is part of the same action as concentrating on her sworn enemy detect ability.

This ability replaces detect alignment.'''
import_trades = ["Detect alignment"]

[[entry.feature]]
anchor = "hateful-bane"
head = "Hateful Bane (Su)"
listed = true
level = 5
print = '''
At 5th level, a faith hunter's [bane](ref/spell/bane) ability functions only against creatures that are both the selected creature type and her sworn enemy alignment.

This ability alters bane.'''
import_trades = ["Bane"]

