[[entry.feature]]
anchor = "adaptive-physiology"
head = "Adaptive Physiology (Ex)"
listed = true
level = 3
print = '''
At 3rd level, a metamorph gains a 25% chance to negate critical hits and precision damage, similar to the [preserve organs](ref/discovery/preserve-organs) discovery. This chance increases to 50% at 6th level, and to 75% at 18th level.

This ability replaces swift alchemy, swift poisoning, and instant alchemy.'''
import_trades = ["Swift alchemy, swift poisoning, instant alchemy", "Swift alchemy", "swift poisoning", "instant alchemy"]

