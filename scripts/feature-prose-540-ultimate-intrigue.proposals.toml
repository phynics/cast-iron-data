A sage counselor gains [Combat Expertise](ref/feat/combat-expertise) as a bonus feat, even if he doesn't meet the prerequisites, and he can ignore the Intelligence prerequisite on feats that have Combat Expertise as a prerequisite. At 2nd level, he gains [Improved Feint](ref/feat/improved-feint), and at 6th level, he gains [Greater Feint](ref/feat/greater-feint), even if he doesn't meet the prerequisites.

