print = "Starting at 1st level, a master summoner can cast _[summon monster I](ref/spell/summon-monster-1)_ as a [spell-like ability](ref/umr/spell-like-abilities) a number of times per day equal to 5 + his Charisma modifier. The summoner can use this ability when his eidolon is summoned. Only one _[summon monster](ref/spell/summon-monster)_ spell may be in effect while the eidolon is summoned. If the summoner's eidolon is not summoned, the number of creatures that can be summoned with this ability is only limited by its uses per day. This ability otherwise functions as the summoner's normal _[summon monster I](ref/spell/summon-monster-1)_ ability. Other than these restrictions, there is no limit to how many _[summon monster](ref/spell/summon-monster)_ or _[gate](ref/spell/gate)_ spells the summoner can have active at one time. This ability replaces the summoner's normal _summon monster I_ ability and shield ally."
