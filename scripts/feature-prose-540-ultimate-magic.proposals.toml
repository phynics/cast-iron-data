[[entry.feature]]
anchor = "a-nd-so-it-came-to-pass-that-in-the-last-days-of-the-thassilonian-empire-the-very-heavens-themselves-rebelled-against-its-blasphemy-the-starstone-fell-shaking-the-world-and-driving-the-seas-forth-across-continents-nearly-extinguishing-the-light-of-humanity-yet-even-in-the-rubble-of-their-nations-the-runelords-continued-to-spar-from-the-mountains-of-the-rasp-the-runelord-karzoug-ignored-his-people-and-struck-out-at-alaznist-runelord-of-wrath-driving-her-realm-deeper-beneath-the-waves-and-in-these-last-futile-scramblings-we-see-how-even-the-mightiest-of-spellcasters-may-be-brought-low-by-sin"
head = "A nd so it came to pass that in the last days of the Thassilonian Empire, the very heavens themselves rebelled against its blasphemy. The Starstone fell, shaking the world and driving the seas forth across continents, nearly extinguishing the light of humanity. Yet even in the rubble of their nations, the runelords continued to spar. From the mountains of the Rasp, the Runelord Karzoug ignored his people and struck out at Alaznist, Runelord of Wrath, driving her realm deeper beneath the waves. And in these last, futile scramblings, we see how even the mightiest of spellcasters may be brought low by sin."
listed = true
print = ""

[[entry.feature]]
anchor = "introduction"
head = "Introduction"
listed = true
print = '''
Anyone can be a spellcaster. If you can crack open a book and knuckle down in your studies, you can probably become a passable wizard. If you can devote yourself in body and soul to a god—and why wouldn't you, when there's such a variety to choose from?—you may find yourself endowed with magical powers simply for having faith in your god's (and your own) righteousness. Oracles are chosen without their consent, far-roving rangers pick up magical tricks and traps, druids channel the will of nature, sorcerers get their abilities as dubious presents from philandering ancestors, and bards find magical inspiration in performance and art. Magic is everywhere in the Pathfinder Roleplaying Game, and many of the movers and shakers in towns and cities of any significant size have a spell or two up their sleeves.

But those are just ordinary people who have access to magic. Basic hedge wizards may make a fine living crafting glowing swords, and a priest with the ability to heal broken bones is a must for any church that wants to win itself a congregation, but such everyday spellcasters are hardly the stuff of legend. Instead, those magic users who get remembered as heroes and legends—rather than simply magical craftsmen and merchants—take these same techniques and build upon them, seeking out ever-more-elusive knowledge and crafting new spells of magnificent power. It is with these esoteric practices that the greatest make names for themselves; these potent arts set the masters apart from mundane practitioners.

This chapter introduces several new subsystems and guidelines that help true acolytes of the magical arts hone their skills, and take them beyond the simple spells and constraints of lesser casters. In addition to in-game systems for crafting constructs, binding outsiders, and more, this section also includes dangerous new conditions called spellblights that afflict only casters, plus details for both players and Game Masters alike on how to design new spells for the Pathfinder Roleplaying Game and make sure that they're properly balanced and thought through ahead of time—before they wreak havoc at your gaming table.

Major subjects and subsystems covered in this chapter include the following.'''

[[entry.feature]]
anchor = "spellblights"
head = "Spellblights"
listed = true
print = "Just as spellcasters have strange and extraordinary abilities unavailable to the common person, so too are they susceptible to unique maladies. Spellblights are specific curses that only affect spellcasters and creatures that use spell-like abilities, saddling them with a host of unfortunate conditions that are extremely difficult to get rid of and greatly hinder the victim's use of magic. (Fortunately, some of these curses have also been discovered to have beneficial side effects that cursed casters can use to their advantage.) Divided into both major and minor categories, spellblights include such grotesque conditions as hemoculysis—in which the caster bleeds from the eyes each time she casts a spell—as well as gentler but more inconvenient afflictions such as phase blight and spell addiction. Spellblights are described in full beginning on page 94."

[[entry.feature]]
anchor = "spell-duels"
head = "Spell Duels"
listed = true
print = "When two competent spellcasters come to blows, the result is always impressive, if not downright frightening. Yet not every matter of honor is meant to be settled on the battlefield in standard, no-holds-barred combat. To this end, many of the more civilized casters (especially those in magical universities, military orders, and other situations in which the combatants might regret killing their opponents, or need to prove that their victory was through skill alone) settle such matters using a highly ritualized form of combat known as the spell duel. Sample rules for running a spell duel begin on page 99."

[[entry.feature]]
anchor = "binding-outsiders"
head = "Binding Outsiders"
listed = true
print = "What better way for an accomplished arcanist or theological miracle-worker to display his abilities than to summon and bind a powerful outsider as his servant? Whether it's a cleric of Asmodeus f launting a chained angel or the wizard who binds an inevitable to seek out and punish those who break contracts with him, binders are both feared and respected by beings from all planes—and for good reason. This section begins with general notes on binding, then goes on to present inside information on the various gifts and offerings that help secure the allegiance of each individual type of outsider, from akhana aeons to shoggti qlippoth. These dangerous secrets begin on page 101."

[[entry.feature]]
anchor = "building-and-modifying-constructs"
head = "Building and Modifying Constructs"
listed = true
print = "Constructs can be far more than just lumbering golems and awkward animated bureaus. Those who devote their lives to unlocking the inner workings of animating magic have uncovered numerous new abilities with which to imbue their constructs, as well as strange new ways to utilize the constructs themselves. Learn new animated object abilities, as well as how to price, modify, and repair unique constructs. Or dive deeper into more complex modifications: give your golem a brain to store feats, wear it as armor, see through its eyes, inscribe a rune on its forehead to protect it, or turn its limbs into grenades ready to shatter and splash liquid death over those who attack it. Construct building and modification begins on page 111."

[[entry.feature]]
anchor = "new-familiars"
head = "New Familiars"
listed = true
print = "A distinctive spellcaster deserves a distinctive familiar. This section presents statistics from a number of new and highly recognizable familiars, from the blue-ringed octopus and the donkey rat to the king crab and the ever-popular pig. These new minions begin their campaigns to become your next arcane assistants on page 117."

[[entry.feature]]
anchor = "spellbooks"
head = "Spellbooks"
listed = true
print = "As with all scholarly practices, wizards and other arcane casters who follow an academic course to power achieve greatness by standing on the shoulders of giants. Presented in this section are numerous unique spellbooks ready to be dropped in front of arcane adventurers as treasure, or perhaps sought out as the objects of scholarly quests. In addition to spell lists and brief descriptions of each book's theme, these listings also include preparation rituals—boons a spellcaster can receive by preparing her spells using the spellbook in question. But beware, for not all of the spellcasters who penned these tomes take kindly to interlopers plagiarizing their work, and some spellbooks carry dangerous wards to defend their pages against prying eyes. The section detailing new spellbooks begins on page 121."

[[entry.feature]]
anchor = "designing-spells"
head = "Designing Spells"
listed = true
print = "While this book contains a host of new spells, you can never have enough variety in your magical arsenal, and one of the great joys of playing a spellcaster (or Game Mastering for one!) is designing new spells unique to a given character or situation. This section takes a detailed look at the design process for spells, a delicate balancing act that is as much art as science. How much damage should a spell of a given level do? Is a spell that kills or controls more powerful? Which bonus type should a given spell grant? What spells are good benchmarks to compare your new creation against? The secrets of the Pathfinder RPG's key designers await, beginning on page 128."
