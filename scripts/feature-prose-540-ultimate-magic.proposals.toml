[[entry]]
id = "ref/arc-summoner/broodmaster"
hold = "checker: [fields] trades = \"replaces: Eidolon\" disagrees with the trade sentences of the feature `eidolon-brood` = \"replaces: the summoner's normal eidolon ability\" (line 44)"
opening = ["Most summoners bond with one eidolon for their entire lives, but the broodmaster forges a link with multiple smaller eidolons that make up his brood. Separately, a broodmaster's eidolons are no match for a summoner's single eidolon, but taken as a whole, an eidolon brood makes up in quantity what it lacks in individual power."]

[[entry.feature]]
anchor = "eidolon-brood"
head = "Eidolon Brood"
listed = true
level = 2
print = '''
At 2nd level, instead of a single eidolon, a broodmaster summons two Small [eidolons](ref/sidekick/eidolon) to his side, each less powerful than the single eidolon of a standard summoner. Each eidolon has it own base form and associated base statistics and free evolutions. Regardless of the number of eidolons in the brood, each eidolon has the same base attack bonus and base saving throw bonuses, but the rest of the eidolons' base statistics must be divided between the eidolons, including Hit Dice (minimum 1), skill points, number of feats, armor bonus, Str/Dex bonus, evolution pool (but see below), and maximum number of natural attacks. Individual eidolons in the brood must purchase evolutions separately. Once a broodmaster decides on the forms and abilities of his eidolons, they cannot be changed until the summoner gains a level.

_Example_: A 2nd-level broodmaster can summon two eidolons. Each eidolon has 1 Hit Dice, BAB +2, +3 on its two good saves and +0 on its bad save. The broodmaster decides to give the first eidolon 4 skill points, one feat, a +1 armor bonus, a +1 bonus to Strength, 2 points from the evolution pool, and a maximum of two attacks. The remaining 4 skill points, +1 armor bonus, +1 bonus to Dexterity, and 2 points from the evolution pool go to the second eidolon, but it gains no feats and can have only one natural attack.

The broodmaster must dismiss all of his eidolons at one time. Likewise, all of the eidolons in a brood are banished if the broodmaster is unconscious, asleep, or killed. However, each eidolon in the brood is sent back to its home plane individually when its hit points are reduced to a negative number equal to or greater than its Constitution score. This ability replaces the summoner's normal eidolon ability.

The following are new class features of the broodmaster archetype. Those with the same name as the standard summoner class have slightly different rules, but otherwise work as and replace the standard summoner class features of the same name.'''
import_trades = ["Eidolon", "Eidolon"]

[[entry.feature]]
anchor = "brood-link"
head = "Brood Link (Su)"
listed = true
level = 2
print = "At 2nd level, a broodmaster forms a close bond with his eidolons. This ability works like the standard summoner life link ability, except the broodmaster can only sacrifice hit points to prevent damage to one eidolon in the brood at a time. If two or more eidolons in the brood take enough damage to send them back to their home plane, the broodmaster can only sacrifice hit points to prevent damage to one of them. This ability replaces life link."
import_trades = ["Life link", "Life link"]

[[entry.feature]]
anchor = "bond-senses"
head = "Bond Senses (Su)"
listed = true
print = "The broodmaster can only share the senses of one eidolon in his brood at a time."

[[entry.feature]]
anchor = "shield-ally"
head = "Shield Ally (Ex)"
listed = true
print = "The broodmaster or an ally can only gain the bonuses from these abilities once, regardless of how many eidolons in the brood are within reach."

[[entry.feature]]
anchor = "maker-s-call"
head = "Maker's Call (Su)"
listed = true
print = "The broodmaster can only call one eidolon in the brood to his side with each use of this ability."

[[entry.feature]]
anchor = "transposition"
head = "Transposition (Su)"
listed = true
print = "The broodmaster swaps his location with that of one eidolon in the brood with each use of this ability."

[[entry.feature]]
anchor = "larger-brood"
head = "Larger Brood"
listed = true
level = 8
print = '''
At 8th level, the broodmaster can spend 4 evolution points from the evolution pool for the [large](ref/evolution/large) evolution; unlike with other evolutions, he spends these 4 points before he assigns evolution points to his individual eidolons (for an 8th-level broodmaster with 11 evolution points, this leaves 7 evolution points to distribute among the eidolons). This allows him to summon two Medium eidolons, four Small eidolons, or one Medium eidolon and two Small eidolons.

At 13th level, if the broodmaster has purchased the large evolution for his brood, he can spend an additional 6 evolution points from the evolution pool for the huge evolution, distributing the remaining points among his eidolons. This allows him to call two Large eidolons, four Medium eidolons, eight Small eidolons, or any similar combination in which two smaller eidolons count as one eidolon of one size larger.'''

[[entry.feature]]
anchor = "greater-shield-ally"
head = "Greater Shield Ally (Su)"
listed = true
print = "The broodmaster or an ally can only gain the bonuses from these abilities once, regardless of how many eidolons in the brood are within reach."

[[entry.feature]]
anchor = "hordes-of-summoned-monsters"
head = "Hordes of Summoned Monsters"
listed = true
print = "The broodmaster and master summoner archetypes can potentially have 5, 10, or even more summoned creatures in play. This is a deliberate feature of these archetypes, and means that the summoner can potentially be a strong candidate for \"solo\" adventuring by one player. However, in the hands of an inexperienced or moderately experienced player, dealing with all of those creatures in combat can take a long time, forcing other players to wait extended periods between their turns in the initiative. It is strongly recommended that GMs only allow these archetypes for experienced players, or decide on a way to speed up the summoner's turn (such as by allowing other players to control some of the summoned monsters). Brood Bond (Su): At 14th level, a summoner's life becomes linked to his brood. This functions as the life bond ability, except the broodmaster can only transfer damage to one eidolon in the brood at a time. If that eidolon takes enough damage to send it back to its home plane, all excess damage remains with the broodmaster, killing him. This ability replaces life bond."

[[entry.feature]]
anchor = "merge-forms"
head = "Merge Forms (Su)"
listed = true
print = "The broodmaster can only merge with one eidolon in the brood at a time. This ability otherwise works like and replaces merge forms."
import_trades = ["Merge forms", "Merge forms"]

[[entry]]
id = "ref/arc-summoner/master-summoner"
hold = "checker: [fields] trades = \"replaces: Eidolon\" disagrees with the trade sentences of the feature `lesser-eidolon` = \"replaces: the summoner's normal eidolon ability\" (line 36)"
opening = ["Most summoners forge a bond with a single, powerful eidolon, but some summoners seek to control a variety of creatures. The master summoner sacrifices the power of his eidolon in favor of summoning a plethora of otherworldly creatures to aid him."]

[[entry.feature]]
anchor = "lesser-eidolon"
head = "Lesser Eidolon"
listed = true
print = "A master summoner's class level is halved (minimum 1) for the purposes of determining his [eidolon's](ref/sidekick/eidolon) abilities, Hit Dice, evolution pool, and so on. The eidolon otherwise functions as normal. This ability replaces the summoner's normal eidolon ability."
import_trades = ["Eidolon", "Eidolon"]

[[entry.feature]]
anchor = "summoning-mastery"
head = "Summoning Mastery (Sp)"
listed = true
level = 1
print = "Starting at 1st level, a master summoner can cast _[summon monster I](ref/spell/summon-monster-1)_ as a [spell-like ability](ref/umr/spell-like-abilities) a number of times per day equal to 5 + his Charisma modifier. The summoner can use this ability when his eidolon is summoned. Only one _[summon monster](ref/spell/summon-monster)_ spell may be in effect while the eidolon is summoned. If the summoner's eidolon is not summoned, the number of creatures that can be summoned with this ability is only limited by its uses per day. This ability otherwise functions as the summoner's normal _[summon monster I](ref/spell/summon-monster-1)_ ability. Other than these restrictions, there is no limit to how many _[summon monster](ref/spell/summon-monster)_ or _[gate](ref/spell/gate)_ spells the summoner can have active at one time. This ability replaces the summoner's normal _summon monster I_ ability and shield ally."
import_trades = ["Summon monster I, shield ally", "Summon monster I", "shield ally"]

[[entry.feature]]
anchor = "augment-summoning"
head = "Augment Summoning"
listed = true
level = 2
print = "At 2nd level, a master summoner gains [Augment Summoning](ref/feat/augment-summoning) as a bonus feat. He does not have to meet any requirements for this feat. This ability replaces bond senses."
import_trades = ["Bond senses", "Bond senses"]

[[entry]]
id = "ref/arc-wizard/scrollmaster"
hold = "checker: [fields] trades = \"replaces: 10th-level bonus feat\" disagrees with the trade sentences of the feature `improved-scroll-casting` = \"replaces: the 10th-level wizard bonus feat\" (line 101)"
opening = ["To some wizards, a scroll is not just a written form of a spell, it is a physical weapon meant to be used in combat like a sword or a shield. These strange wizards enter battle armed with scrolls, often one in each in each hand, practicing combat techniques resembling some monk martial arts."]

[[entry.feature]]
anchor = "scroll-blade"
head = "Scroll Blade (Su)"
listed = true
print = '''
A scrollmaster can wield any paper, parchment, or cloth scroll as if it were a melee weapon. In the hands of the wizard, the scroll acts as a [short sword](ref/eq-weapon/short-sword) with an enhancement bonus equal to 1/2 the level of the highest-level wizard spell on the scroll; a scroll with only a cantrip or 1st-level spell on it counts as a [masterwork](ref/rule/masterwork-weapons) short sword. The scrollmaster is proficient in this weapon, and feats and abilities that affect short swords (such as [Weapon Focus](ref/feat/weapon-focus)) apply to this weapon. A scrollmaster cannot wield two scrollblades at the same time.

Activating this ability is a free action. A scroll blade only retains its abilities in the hands of the scrollmaster. The scroll blade has [hardness](ref/umr/hardness) 0 and hit points equal to the highest-level wizard spell on the scroll. Each successful hit by the scroll blade reduces its hit points by 1; this damage cannot be repaired, but does not affect casting from the scroll. When its hit points [reach](ref/misc/reach) 0, the scroll is destroyed.

If a scroll contains a spell with a metamagic feat, this ability uses the original spell level of the spell (a _scroll of [empowered](ref/feat/empower-spell) [fireball](ref/spell/fireball)_ counts as a 3rd-level spell).

At 3rd level, when using a 4th-level or higher wizard scroll as a scroll blade, the scrollmaster can choose to reduce its enhancement bonus by 1 (minimum +1 enhancement bonus) to treat it as a reach weapon. For example, he could use a _scroll of [charm monster](ref/spell/charm-monster)_ (a 4th-level wizard spell) as either a _+2 short sword_ or a _+1 short sword_ with reach.

At 5th level, when using a 4th-level or higher wizard scroll as a scroll blade, the scrollmaster can choose to reduce its enhancement bonus (to a minimum of a +1 enhancement bonus) to give any of the following weapon properties: _[defending](ref/magic-enh/defending)_, _[frost](ref/magic-enh/frost)_, _[icy burst](ref/magic-enh/icy-burst)_, _[keen](ref/magic-enh/keen)_, _[ki focus](ref/magic-enh/ki-focus)_, _[shock](ref/magic-enh/shock)_, _[shocking burst](ref/magic-enh/shocking-burst)_, _[speed](ref/magic-enh/speed)_. Adding any of these properties consumes an amount of enhancement bonus equal to the property's cost (see Table 15–9: Melee Weapon Special Abilities in the _Core Rulebook_). The scrollmaster must know the prerequisite spell or spells to craft the weapon property in question (for example, he must know _[haste](ref/spell/haste)_ to be able to give his scroll blade the _speed_ property). This ability replaces the wizard's arcane bond.'''
import_trades = ["Arcane bond", "Arcane bond"]

[[entry.feature]]
anchor = "scroll-shield"
head = "Scroll Shield (Su)"
listed = true
print = '''
A scrollmaster can wield any paper, parchment, or cloth scroll as if it were a [light wooden shield](ref/eq-armor/light-wooden-shield). In the hands of the wizard, the scroll grants a +1 shield bonus with an enhancement bonus equal to 1/2 the level of the highest-level wizard spell on the scroll; a scroll with only a cantrip or 1st-level spell counts as a [masterwork](ref/rule/masterwork-armor) light shield. The scroll shield has no armor check penalty, arcane spell failure chance, or maximum Dexterity bonus. The scrollmaster is considered proficient in this shield. A scrollmaster can use a scrollblade in one hand and a scroll shield in the other hand.

Activating this ability is a free action. A scroll shield only retains its abilities in the hands of the scrollmaster. The scroll shield has [hardness](ref/umr/hardness) 0 and hit points equal to the highest-level wizard spell on the scroll. Each successful attack roll against the wizard reduces the scroll shield's hit points by 1; this damage cannot be repaired, but does not affect casting from the scroll. When its hit points reach 0, the scroll is destroyed.

At 5th level, when using a 3rd-level or higher wizard scroll as a scroll shield, the scrollmaster can choose to reduce its enhancement bonus (to a minimum of a +1 enhancement bonus) to give it any of the following shield properties: _[ghost touch](ref/magic-enh/ghost-touch-armor)_, _[light fortification](ref/magic-enh/fortification-light)_, _[moderate fortification](ref/magic-enh/fortification-moderate)_. Adding any of these properties consumes an amount of bonus equal to the property's cost (see Table 15–5: Shield Special Abilities in the _Core Rulebook_). The scrollmaster must know the prerequisite spell or spells to craft the shield property in question (for example, he must know _[limited wish](ref/spell/limited-wish)_ to be able to give his scroll shield the _fortification_ property).

If a scroll contains a spell with a metamagic feat, this ability uses the original spell level of the spell (a _scroll of empowered fireball_ counts as a 3rd-level spell).'''

[[entry.feature]]
anchor = "improved-scroll-casting"
head = "Improved Scroll Casting (Su)"
listed = true
level = 10
print = "At 10th level, the scrollmaster can cast a wizard spell from a scroll and use his own Intelligence score and relevant feats to set the DC for the spell, and can use his own caster level if it is higher than that of the scroll (similar to a caster using a [staff](ref/rule/staves)). The scrollmaster must have already deciphered the writing on the scroll to use this ability. This ability replaces the 10th-level wizard bonus feat."
import_trades = ["10th-level bonus feat", "10th-level bonus feat"]
