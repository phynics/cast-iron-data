[[entry]]
id = "ref/arc-cleric/cloistered-cleric"
opening = ["Cloistered clerics typically live in a temple and rarely interact with the outside world. They are bookish and well learned in the lore of the faith, paying less attention to its magical and martial aspects. A cloistered cleric has the following class features."]

[[entry.feature]]
anchor = "weapon-and-armor-proficiency"
head = "Weapon and Armor Proficiency"
listed = false
print = "Cloistered clerics are proficient with light armor and with the following weapons: [club](ref/eq-weapon/club), [heavy mace](ref/eq-weapon/heavy-mace), [light mace](ref/eq-weapon/light-mace), [quarterstaff](ref/eq-weapon/quarterstaff), and [sling](ref/eq-weapon/sling). They are not proficient with shields."

[[entry.feature]]
anchor = "class-skills"
head = "Class Skills"
listed = false
print = "The cloistered cleric's class skills are Appraise (Int), Craft (Int), Diplomacy (Cha), Heal (Wis), Knowledge (all) (Int), Linguistics (Int), Profession (Wis), Sense Motive (Wis), and Spellcraft (Int)."

[[entry.feature]]
anchor = "skill-ranks-per-level"
head = "Skill Ranks per Level"
listed = false
print = "4 + Int modifier."

[[entry.feature]]
anchor = "diminished-spellcasting"
head = "Diminished Spellcasting"
listed = true
print = "A cloistered cleric chooses only one domain from her deity's list of domains, and her number of non-domain spells per day for each spell level is one less than normal (for example, a 4th-level cloistered cleric has three cantrips, two 1st-level spells, one 1st-level domain spell, one 2nd-level spell, and one 2nd-level domain spell). If this reduces the number of spells per day for that level to 0, she gains only the bonus spells she would be entitled to based on her Wisdom score for that level, plus her domain spell for that level."

[[entry.feature]]
anchor = "breadth-of-knowledge"
head = "Breadth of Knowledge"
listed = true
level = 1
print = "At 1st level, a cloistered cleric gains a bonus on Knowledge skill checks equal to [half](ref/misc/fractions-and-rounding) her class level (minimum +1) and can make Knowledge skill checks untrained."

[[entry.feature]]
anchor = "well-read"
head = "Well-Read (Ex)"
listed = true
level = 2
print = "At 2nd level, a cloistered cleric gains a +2 bonus on skill checks, caster level checks, and saving throws if such rolls pertain to mundane or magical glyphs, runes, scrolls, symbols, and other writings."

[[entry.feature]]
anchor = "verbal-instruction"
head = "Verbal Instruction (Ex)"
listed = true
level = 3
print = "At 3rd level, a cloistered cleric can use the [aid another](ref/rule/aid-another) action to assist an ally within 30 feet on a skill or ability check. The ally must be able to hear and understand the cleric's instructions. For every three class levels beyond 3rd, the cloistered cleric can instruct one additional ally. If all allies are not engaged in the same task, using this ability is a full-round action rather than a standard action."

[[entry.feature]]
anchor = "scribe-scroll"
head = "Scribe Scroll (Su)"
listed = true
level = 4
print = "At 4th level, a cloistered cleric gains [Scribe Scroll](ref/feat/scribe-scroll) as a bonus feat."

[[entry]]
id = "ref/arc-sorcerer/crossblooded"
hold = "head not printed: Bloodlines"
opening_from_print = true
opening = ["A crossblooded bloodline combines the powers of two distinct heritages. In most cases, sorcerers with this bloodline are the offspring of two sorcerers from different ancestries, but occasionally a crossblooded sorcerer arises from the conjunction of other powers. A draconic sorcerer who is also the culmination of a great destiny, an abyssal sorcerer from a family that dealt with devils, and an arcane sorcerer raised from birth by fey are all possible sources for crossblooded bloodlines.", "A crossblooded sorcerer selects two different bloodlines. The sorcerer may gain access to the skills, feats, and some of the powers of both bloodlines she is descended from, but at the cost of reduced mental clarity and choice (see Drawbacks)."]

[[entry.feature]]
anchor = "class-skill"
head = "Class Skill"
listed = true
print = "A crossblooded sorcerer receives the bonus class skill from both of her bloodlines. If these are the same skill, this does not grant any additional benefit."

[[entry.feature]]
anchor = "bonus-spells"
head = "Bonus Spells"
listed = false
print = '''
A crossblooded sorcerer may select her bonus spells from either of her bloodlines. The sorcerer also has the choice to learn a lower-level bonus spell she did not choose in place of the higher-level bonus spell she would normally gain. Lower-level bonus spells learned this way always use the spell level that they would be if the sorcerer had learned them with the appropriate bonus spell.

_Example_: A 3rd-level [aberrant](ref/sorcbloodline/aberrant)/[abyssal](ref/sorcbloodline/abyssal) crossblooded sorcerer has the choice of learning _[cause fear](ref/spell/cause-fear)_ or _[enlarge person](ref/spell/enlarge-person)_ as her bloodline bonus spell. If she selected _[cause fear](ref/spell/cause-fear)_ as her 3rd-level bonus spell, at 5th level she could use her new bonus spell to learn _[enlarge person](ref/spell/enlarge-person)_ instead of _[bull's strength](ref/spell/bulls-strength)_ or _[see invisibility](ref/spell/see-invisibility)_, and she would add it to her list of 1st-level spells known (just as if she had learned it as her 3rd-level bonus spell).'''

[[entry.feature]]
anchor = "bonus-feat"
head = "Bonus Feat"
listed = true
print = "A crossblooded sorcerer combines the bonus feat lists from both of her bloodlines and may select her bloodline bonus feats from this combined list."

[[entry.feature]]
anchor = "bloodline-arcana"
head = "Bloodline Arcana"
listed = true
print = "A crossblooded sorcerer gains the bloodline arcana of both her bloodlines."

[[entry.feature]]
anchor = "bloodline-powers"
head = "Bloodline Powers"
listed = true
print = "At 1st, 3rd, 9th, 15th, and 20th levels, a crossblooded sorcerer gains one of the two new bloodline powers available to her at that level. She may instead select a lower-level bloodline power she did not choose in place of one of these higher-level powers."

[[entry.feature]]
anchor = "drawbacks"
head = "Drawbacks"
listed = true
print = "A crossblooded sorcerer has one fewer spell known at each spell level (including cantrips) than is presented on Table 3-15: Sorcerer Spells Known on page 73 of the _Core Rulebook_. Furthermore, the conflicting urges created by the divergent nature of the crossblooded sorcerer's dual heritage forces her to constantly take some mental effort just to remain focused on her current situation and needs. This leaves her with less mental resolve to deal with external threats. A crossblooded sorcerer always takes a -2 penalty on Will saves."

