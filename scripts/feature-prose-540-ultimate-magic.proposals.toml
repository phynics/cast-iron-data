print = "At 12th level, the evolutionist can cast _[transmogrify](ref/spell/transmogrify)_ as a [spell-like ability](ref/umr/spell-like-abilities) once per day without the need for a material component. This ability has a casting time of 1 minute. This ability replaces greater shield ally."
import_trades = ["Greater shield ally"]

[[entry]]
id = "ref/arc-summoner/master-summoner"
opening = ["Most summoners forge a bond with a single, powerful eidolon, but some summoners seek to control a variety of creatures. The master summoner sacrifices the power of his eidolon in favor of summoning a plethora of otherworldly creatures to aid him."]

[[entry.feature]]
anchor = "lesser-eidolon"
head = "Lesser Eidolon"
listed = true
print = "A master summoner's class level is halved (minimum 1) for the purposes of determining his [eidolon's](ref/sidekick/eidolon) abilities, Hit Dice, evolution pool, and so on. The eidolon otherwise functions as normal. This ability replaces the summoner's normal eidolon ability."
import_trades = ["Eidolon"]

[[entry.feature]]
anchor = "summoning-mastery"
head = "Summoning Mastery (Sp)"
listed = true
level = 1
print = "Starting at 1st level, a master summoner can cast _[summon monster I](ref/spell/summon-monster-1)_ as a [spell-like ability](ref/umr/spell-like-abilities) a number of times per day equal to 5 + his Charisma modifier. The summoner can use this ability when his eidolon is summoned. Only one _[summon monster](ref/spell/summon-monster)_ spell may be in effect while the eidolon is summoned. If the summoner's eidolon is not summoned, the number of creatures that can be summoned with this ability is only limited by its uses per day. This ability otherwise functions as the summoner's normal _[summon monster I](ref/spell/summon-monster-1)_ ability. Other than these restrictions, there is no limit to how many _[summon monster](ref/spell/summon-monster)_ or _[gate](ref/spell/gate)_ spells the summoner can have active at one time. This ability replaces the summoner's normal _summon monster I_ ability and shield ally."
import_trades = ["Summon monster I", "shield ally"]

[[entry.feature]]
anchor = "augment-summoning"
head = "Augment Summoning"
listed = true
level = 2
print = "At 2nd level, a master summoner gains [Augment Summoning](ref/feat/augment-summoning) as a bonus feat. He does not have to meet any requirements for this feat. This ability replaces bond senses."
import_trades = ["Bond senses"]

[[entry]]
id = "ref/arc-summoner/synthesist"
opening = ["Rather than summon an eidolon to serve by his side, the synthesist fuses his eidolon's essence to his own. Instead of two creatures, the synthesist is a fusion of the summoner and eidolon into a single being."]

[[entry.feature]]
anchor = "fused-eidolon"
head = "Fused Eidolon"
listed = true
print = '''
A synthesist summons the essence of a powerful outsider to meld with his own being. The synthesist wears the eidolon like translucent, living armor. The eidolon mimics all of the synthesist's movements, and the synthesist perceives through the eidolon's senses and speaks through its voice, as the two are now one creature. The synthesist directs all of the eidolon's actions while fused, perceives through its senses, and speaks through its voice, as the two are now one creature.

While fused with his eidolon, the synthesist uses the eidolon's Strength, Dexterity, and Constitution, but retains his own Intelligence, Wisdom, and Charisma. The synthesist gains the eidolon's hit points as [temporary hit points](ref/rule/temporary-hit-points). When these hit points reach 0, the eidolon is killed and sent back to its home plane. The synthesist uses the eidolon's base attack bonus, and gains the eidolon's armor and natural armor bonuses and modifiers to ability scores. The synthesist also gains access to the eidolon's special abilities and the eidolon's evolutions. The synthesist is still limited to the eidolon's maximum number of natural attacks. The eidolon has no skills or feats of its own. The eidolon must be at least the same size as the synthesist. The eidolon must have [limbs](ref/evolution/limbs) for the synthesist to cast spells with somatic components. The eidolon's temporary hit points can be restored with the _[rejuvenate eidolon](ref/spell/rejuvenate-eidolon)_ spell.

While fused, the synthesist loses the benefits of his armor. He counts both as his original type and as an outsider for any effect related to type, whichever is worse for the synthesist. Spells such as _[banishment](ref/spell/banishment)_ or _[dismissal](ref/spell/dismissal)_ work normally on the eidolon, but the synthesist is unaffected. Neither the synthesist nor his eidolon can be targeted separately, as they are fused into one creature. The synthesist and eidolon cannot take separate actions. While fused with his eidolon, the synthesist can use all of his own abilities and gear, except for his armor. In all other cases, this ability functions as the summoner's normal eidolon ability (for example, the synthesist cannot use his _[summon monster](ref/spell/summon-monster)_ ability while the eidolon is present). This ability replaces the class's eidolon ability, bond senses, and life bond.

The following class abilities function differently for synthesist summoners.'''
import_trades = ["Eidolon", "bond senses", "life bond"]

