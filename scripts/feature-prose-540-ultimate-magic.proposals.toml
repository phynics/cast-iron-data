listed = false
print = "The following discoveries complement the psychonaut archetype: [confusion bomb](ref/discovery/confusion-bomb), [eternal potion](ref/discovery/eternal-potion), [extend potion](ref/discovery/extend-potion), [lingering spirit](ref/discovery/lingering-spirit), and [madness bomb](ref/discovery/madness-bomb)."

[[entry]]
id = "ref/arc-alchemist/reanimator"
