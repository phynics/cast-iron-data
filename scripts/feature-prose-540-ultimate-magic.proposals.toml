[[entry.feature]]
anchor = "black-blade-basics"
head = "Black Blade Basics"
listed = true
print = '''
A black blade is bonded to a particular magus, much like a familiar, but in more of a partnership than a master-servant relationship.

_Intelligence_: This is the intelligence score of the _black blade_. It starts at 10 and increases by 1 for every two levels of the bladebound magus (at 3rd level, 5th level, and so on).

_Wisdom and Charisma_: As the bladebound magus increases in level, so do the Wisdom and Charisma of the _black blade_. These abilities start at 6 and increase by 1 for every two levels of magus.

_Ego_: A _black blade_ starts with an ego of 5, and that ego increases as the blade becomes more powerful, as per Table 1–3 below. In cases where a wielder and the _black blade_ come into conflict, like any intelligent item, a _black blade_ can attempt to exert its dominance using the rules on page 535 of the _Core Rulebook_. Due to its flexible and powerful nature, a _black blade_ has a nonstandard ego progression.

_Languages and Skills_: A _black blade_ starts with Common as a language. As the _black blade_ increases in Intelligence, it manifests knowledge of languages and arcane lore. Upon reaching an Intelligence of 12, it gains a bonus language of the GM's choice, and gains 1 rank in Knowledge (arcana). Each time the sword gains a bonus to Intelligence, it gains another language and another rank in Knowledge (arcana).

_Senses_: A _black blade_ is aware of everything around it like a creature that can see and hear. It can be blinded and deafened as if it were a creature. It uses the saving throws of its magus, even if the magus is not currently wielding the _black blade_.

_Black Blade Arcane Pool_: A _black blade_ has an arcane pool with a number of points equal to 1 + its Intelligence bonus.'''

[[entry.feature]]
anchor = "black-blade-ability-descriptions"
head = "Black Blade Ability Descriptions"
listed = true
print = '''
A _black blade_ has special abilities (or imparts abilities to its wielder) depending on the wielder's magus level. The abilities are cumulative. A Ego Special 5 Alertness, _black blade_ strike, telepathy, unbreakable 8 Energy attunement 10 — 12 Teleport blade 14 —

Transfer arcana 18 — 22 Spell defense 24 Life drinker'''

[[entry.feature]]
anchor = "black-blades"
head = "Black Blades"
listed = true
print = '''
A _black blade_ is a particular form of intelligent weapon gained by a magus with the bladebound archetype. There are several ways a magus might gain this weapon. Sometimes it just appears among the magus's possessions, and its origin is a mystery. Other times the magus finds a _black blade_ during an adventure or event of some kind. Sometimes a _black blade_ is passed down generation to generation in an ongoing search for a magus who can unlock its true potential.

A _black blade_ is always a one-handed slashing weapon, a rapier, or a sword cane. The magus chooses the blade's type upon gaining the blade, and once chosen, it can't be changed. As a bladebound magus increases in level, his _black blade_ gains power.

_A black blade_ is independently conscious but features some personality traits reflecting its wielder. A _black blade_ always has the same alignment as its wielder and even changes its alignment if its wielder does. The blade typically works toward its wielder's goals, but not always without argument or backlash. Each _black blade_ has a mission, and while sometimes two or more _black blades_ will work in concert, each mission is singular in purpose (the _black blade_'s mission is usually up to the GM and the needs of the campaign or the adventure, or a GM can roll randomly for the weapon's purpose using Table 15–25 on page 534 of the _Core Rulebook)._ Some _black blades_ are very open about their missions, but most are secretive. Certain sages have speculated that an invisible hand or arcane purpose moves these weapons. _black blade_ normally refuses to use any of its abilities when wielded by anyone other than its magus, and acts as a masterwork weapon of its type.'''

[[entry.feature]]
anchor = "alertness"
head = "Alertness (Ex)"
listed = true
print = "While a magus is wielding his _black blade_, he gains the Alertness feat."

[[entry.feature]]
anchor = "black-blade-strike"
head = "Black Blade Strike (Sp)"
listed = true
print = "As a free action, the magus can spend a point from the _black blade_'s arcane pool to grant the _black blade_ a +1 bonus on damage rolls for 1 minute. For every four levels beyond 1st, this ability gives the _black blade_ another +1 on damage rolls."

[[entry.feature]]
anchor = "telepathy"
head = "Telepathy (Su)"
listed = true
print = "While a magus is wielding or carrying his _black blade_, he can communicate telepathically with the blade in a language that the magus and the _black blade_ share."

[[entry.feature]]
anchor = "unbreakable"
head = "Unbreakable (Ex)"
listed = true
print = "As long as it has at least 1 point in its arcane pool, a _black blade_ is immune to the broken condition. If broken, the _black blade_ is unconscious and powerless until repaired. If destroyed, the _black blade_ can be reforged 1 week later through a special ritual that costs 200 gp per magus level. The ritual takes 24 hours to complete."

[[entry.feature]]
anchor = "energy-attunement"
head = "Energy Attunement (Su)"
listed = true
level = 5
print = "At 5th level, as a free action, a magus can spend a point of his _black blade_'s arcane pool to have it deal one of the following types of damage instead of weapon damage: cold, electricity, or fire. He can spend 2 points from the _black blade_'s arcane pool to deal sonic or force damage instead of weapon damage. This effect lasts until the start of the magus's next turn."

[[entry.feature]]
anchor = "teleport-blade"
head = "Teleport Blade (Sp)"
listed = true
print = "As a standard action, a magus of 9th level or higher can expend an arcane point from his or his _black blade_'s arcane pool, and can call his _black blade_ from as far as 1 mile away, causing it to instantaneously teleport to his hand."

[[entry.feature]]
anchor = "transfer-arcana"
head = "Transfer Arcana (Su)"
listed = true
level = 13
print = "At 13th level, once per day, a magus can attempt to siphon points from his _black blade_'s arcane pool into his own arcane pool. Doing so takes a full-round action and the magus must succeed at a Will saving throw with a DC equal to the _black blade_'s ego. If the magus succeeds, he regains 1 point to his arcane pool for every 2 points he saps from his _black blade_. If he fails the saving throw, the magus becomes fatigued (but can try again). If he is fatigued, he becomes exhausted instead. He cannot use this ability if he is exhausted."

[[entry.feature]]
anchor = "spell-defense"
head = "Spell Defense (Sp)"
listed = true
print = "A magus of 17th level or higher can expend an arcane point from his weapon's arcane pool as a free action; he then gains SR equal to his _black blade_'s ego until the start of his next turn."

[[entry.feature]]
anchor = "life-drinker"
head = "Life Drinker (Su)"
listed = true
level = 19
print = "At 19th level, each time the magus kills a living creature with the _black blade_, he can pick one of the following effects: the _black blade_ restores 2 points to its arcane pool; the _black blade_ restores 1 point to its arcane pool and the magus restores 1 point to his arcane pool; the magus gains a number of temporary hit points equal to the _black blade_'s ego (these temporary hit points last until spent or 1 minute, whichever is shorter). The creature killed must have a number of Hit Dice equal to half the magus's character level for this to occur."

