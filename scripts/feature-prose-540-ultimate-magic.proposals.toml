listed = true
print = "The broodmaster can only merge with one eidolon in the brood at a time. This ability otherwise works like and replaces merge forms."
import_trades = ["Merge forms"]

[[entry]]
id = "ref/arc-summoner/evolutionist"
opening = ["Changing an eidolon's evolutions is normally a slow process. As a summoner progresses in levels, his control over his eidolon's abilities increases. But an evolutionist possesses greater power over his eidolon's form, and is able to evolve his eidolon and its abilities to meet any challenge or face any threat as it comes up, seemingly on a whim."]

[[entry.feature]]
anchor = "mutate-eidolon"
head = "Mutate Eidolon (Su)"
listed = true
level = 6
print = "At 6th level, an evolutionist can change his eidolon's evolutions as if he had gained a level. To mutate his eidolon, the evolutionist must perform an arcane ritual that requires 24 hours of uninterrupted concentration and costs 200 gp per summoner level in material components. This ability replaces maker's call."
