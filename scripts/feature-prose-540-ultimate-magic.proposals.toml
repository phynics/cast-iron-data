[[entry.feature]]
anchor = "bomb"
head = "Bomb"
listed = true
print = "A psychonaut's bombs deal damage [one die step](ref/misc/damage-die-adjustments) lower than normal (regular bombs deal d4s, [concussive bombs](ref/discovery/concussive-bomb) deal 1d3s, and so on). This ability otherwise functions as and replaces the standard alchemist bomb class feature."
import_trades = ["Bombs"]

[[entry.feature]]
anchor = "precognition"
head = "Precognition"
listed = true
