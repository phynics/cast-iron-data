[[entry]]
id = "ref/arc-magus/hexcrafter"
opening = ["A hexcrafter magus has uncovered the secret of using his arcane pool to recreate witch hexes. These magi can hex friend and foe, curse those they strike, and expand their spell selection to include many curses and harmful spells."]

[[entry.feature]]
anchor = "hex-magus"
head = "Hex Magus (Su)"
listed = true
level = 4
print = "At 4th level, the hexcrafter magus gains access to a small number of witch's hexes. The hexcrafter magus picks one hex from the witch's hex class feature. He gains the benefit of or uses that hex as if he were a witch of a level equal to his magus level. This feature replaces spell recall."
import_trades = ["Spell recall"]

[[entry.feature]]
anchor = "hex-arcana"
head = "Hex Arcana"
listed = true
print = "A hexcrafter gains access to the following magus arcana, or may select any witch hex in place of a magus arcana. At 12th level, the hexcrafter may select a hex or major hex in place of a magus arcana. At 18th level, a hexcrafter can select a hex, major hex, or grand hex in place of a magus arcana. He cannot select any hex or arcana more than once."

[[entry.feature]]
anchor = "accursed-strike"
head = "Accursed Strike (Sp)"
listed = true
print = "A hexcrafter magus who can cast _[bestow curse](ref/spell/bestow-curse)_, _[major curse](ref/spell/curse-major)_, or any spell with the [curse](ref/spelldef/curse) descriptor can deliver these prepared spells using the spellstrike ability, even if the spells are not touch attack spells."

[[entry.feature]]
anchor = "spells"
head = "Spells"
listed = true
print = "A hexcrafter magus adds the following spells to his magus spell list: _bestow curse_, _major curse_, and all other spells of 6th level or lower that have the curse descriptor."

[[entry.feature]]
anchor = "magus-arcana"
head = "Magus Arcana"
listed = false
print = "The following magus arcana complement the hexcrafter archetype: [arcane accuracy](ref/arcana/arcane-accuracy), [broad study](ref/arcana/broad-study), [familiar](ref/arcana/familiar), and quicken magic."

[[entry]]
id = "ref/arc-magus/spellblade"
opening = ["A spellblade magus can manifest a ghostly blade of force that can be used as an off-hand weapon."]

[[entry.feature]]
anchor = "force-athame"
head = "Force Athame (Sp)"
listed = true
level = 2
print = "At 2nd level, a spellblade magus can sacrifice a prepared magus spell of 1st level or higher as a swift action to create a [dagger](ref/eq-weapon/dagger) of [force](ref/spelldef/force) in his off hand. The athame lasts for 1 minute or until dismissed, has an enhancement bonus on attack and damage rolls equal to the level of the spell sacrificed (maximum +5), and is considered a weapon the spellblade is holding for purposes of his arcane pool feature (using the pool to add abilities to a held weapon applies to the magus's physical weapon and to the athame for no additional cost). The athame acts as a dagger, but the hand holding it is still considered free for the purpose of casting spells and delivering touch attacks. The magus can use the athame as if he were [fighting with two weapons](ref/rule/two-weapon-fighting), or can use that hand to cast spells as part of the spell combat class ability (but not both in the same round). Attacks with the athame are force attacks and deal force damage. This ability replaces the spellstrike class feature."
import_trades = ["Spellstrike"]

[[entry.feature]]
anchor = "spellblade-arcana"
head = "Spellblade Arcana"
listed = true
print = "A spellblade gains access to the following magus arcana. He cannot select any arcana more than once."

[[entry.feature]]
anchor = "pool-sourced-athame"
head = "Pool-Sourced Athame (Su)"
listed = true
print = "Instead of sacrificing a prepared spell to create the force athame, the magus can spend points from his arcane pool to do so. An athame created this way has an enhancement bonus equal to the number of arcane pool points spent."

[[entry.feature]]
anchor = "spellblade-parry"
head = "Spellblade Parry (Su)"
listed = true
print = "When an enemy makes a melee attack roll against the magus, as an immediate action the magus can end the athame's duration to gain a deflection bonus to his Armor Class until the end of his next turn. This bonus is equal to the level of the spell sacrificed to create the athame (maximum +5)."

[[entry.feature]]
anchor = "throw-athame"
head = "Throw Athame (Su)"
listed = true
print = "As a standard action, a spellblade magus can throw his athame up to 60 feet as a ranged attack (no range penalty). If the athame misses, it returns automatically to the magus' hand just before his next turn. If the athame hits, it deals damage and its duration ends; the magus can choose to spend up to 2 points from his arcane pool to increase the thrown athame's damage by +1d6 for each point spent."

[[entry.feature]]
anchor = "magus-arcana"
head = "Magus Arcana"
listed = false
print = "The following magus arcana complement the spellblade archetype: [critical strike](ref/arcana/critical-strike), [hasted assault](ref/arcana/hasted-assault), [pool strike](ref/arcana/pool-strike), and [spell shield](ref/arcana/spell-shield)."

[[entry]]
id = "ref/arc-magus/staff-magus"
opening = ["While most magi use a one-handed weapon as their melee implement of choice, one group of magi uses the quarterstaff instead. These lightly armored magi use staves for both defense and inflicting their spells upon enemies. Skilled in manipulating these weapons with one hand or two, they eventually learn how to use arcane staves as well, and are just as formidable in combat as their sword-swinging brethren."]

[[entry.feature]]
anchor = "weapon-and-armor-proficiency"
head = "Weapon and Armor Proficiency"
listed = false
print = "A staff magus is proficient with simple weapons only. He can cast magus spells while wearing light armor without incurring the normal arcane spell failure chance. Like any other arcane spellcaster, a magus wearing medium armor or heavy armor or using a shield incurs a chance of arcane spell failure if the spell in question has a somatic component. A multiclass magus still incurs the normal arcane spell failure chance for arcane spells received from other classes. This replaces the normal magus weapon and armor proficiency feature."
import_trades = ["Weapon", "armor proficiencies"]

[[entry.feature]]
anchor = "quarterstaff-master"
head = "Quarterstaff Master (Ex)"
listed = true
level = 1
print = "At 1st level, the staff magus gains the [Quarterstaff Master](ref/feat/quarterstaff-master) feat as a bonus feat, even if he does not meet the normal prerequisites. He only gains the benefit of this feat when wearing no armor or light armor."

[[entry.feature]]
anchor = "quarterstaff-defense"
head = "Quarterstaff Defense (Ex)"
listed = true
level = 7
print = "At 7th level, while wielding a quarterstaff, the staff magus gains a shield bonus to his Armor Class equal to the enhancement bonus of the quarterstaff, including any enhancement bonus on that staff from his arcane pool class feature. At 13th level, this bonus increases by +3. This ability replaces the medium armor and heavy armor class abilities."
import_trades = ["Medium armor", "heavy armor"]

[[entry.feature]]
anchor = "staff-weapon"
head = "Staff Weapon (Su)"
listed = true
level = 10
print = "At 10th level, a staff magus treats any magical staff he is wielding as a magical quarterstaff with an enhancement bonus to attack and damage equal to the staff 's caster level divided by 4 (minimum +1). The staff must have at least 1 charge for the magus to use this ability. A staff magus can restore 1 charge to a staff by expending a number of points from his arcane pool equal to the level of the highest-level spell cast in the staff, as long as at least one spell in the staff is on the magus spell list. The magus cannot restore charges to more than one staff per day. This ability replaces fighter training."
import_trades = ["Fighter training"]

[[entry.feature]]
anchor = "magus-arcana"
head = "Magus Arcana"
listed = false
print = "The following magus arcana complement the staff magus archetype: [critical strike](ref/arcana/critical-strike), [dispelling strike](ref/arcana/dispelling-strike), maneuver master, and [spell shield](ref/arcana/spell-shield)."

[[entry]]
id = "ref/arc-monk/qinggong-monk"
hold = "head not printed: List of Ki Powers; the replaces trade `The monk class abilities the qinggong monk gives up for a ki power` is not printed in a sentence, and no listed feature of that name prints it"
opening = ["The qinggong monk is a master of her _ki_, using it to perform superhuman stunts or even blast opponents with supernatural energy. Some achieve their power over _ki_ through extreme discipline, while others attain this power by intentionally or accidentally ingesting rare herbs or strange mystical fruits, and a few are gifted these abilities by a dying qinggong master."]

[[entry.feature]]
anchor = "ki-power"
head = "Ki Power"
listed = true
print = '''
A qinggong monk can select a _ki_ power for which she qualifies in place of the following monk class abilities: slow fall (4th), high jump (5th), wholeness of body (7th), diamond body (11th), abundant step (12th), diamond soul (13th), quivering palm (15th), timeless body (17th), tongue of the sun and moon (17th), empty body (19th), and perfect self (20th). This replaces the monk class ability the qinggong monk gives up for this _ki_ power.

Ki Powers

_Ki_ powers are abilities that draw on the power of a monk's _ki_. The standard monk presented in the _Core Rulebook_ has several abilities that count as _ki_ powers, such as wholeness of body, abundant step, and empty body. A qinggong monk can learn additional _ki_ powers, which often replaces a non-_ki_ monk ability such as purity of body. _Ki_ powers are divided into three categories: feats, monk abilities, and spells.'''
import_trades = ["The monk class abilities the qinggong monk gives up for a ki power."]

[[entry.feature]]
anchor = "feats"
head = "Feats"
listed = false
parent = "ki-power"
print = '''
These _ki_ powers duplicate the effects of specific feats. A monk does not need to qualify for a feat to select it as a _ki_ power. For example, a qinggong monk can select

Spring Attack as a _ki_ power

even if she doesn't meet

the prerequisites for

selecting Spring Attack

as a feat. Activating

one of these _ki_ powers

is a free action on

the monk's turn;

until the start of her

next turn, the monk is treated

as if she had that feat. Some of these _ki_

powers that duplicate feats may also be

activated as an immediate action; these

powers are noted in the _ki_ powers list.'''

[[entry.feature]]
anchor = "monk-abilities"
head = "Monk Abilities"
listed = false
parent = "ki-power"
print = '''
Some _ki_ powers are standard

monk abilities described in the _Core Rulebook_.

Even if a qinggong monk selects a different

_ki_ power in place of a standard

monk ability, she can select

that monk ability later as

one of her _ki_ powers.'''

[[entry.feature]]
anchor = "spells"
head = "Spells"
listed = false
parent = "ki-power"
print = '''
These _ki_ powers

duplicate the effects of a

spell, and are [spell-like

abilities](ref/umr/spell-like-abilities). A qinggong

monk's class level

is the caster level

for these spell-like

abilities, and she uses

Wisdom to determine her

[concentration](ref/rule/concentration) check bonus.'''

[[entry.feature]]
anchor = "requirements"
head = "Requirements"
listed = true
print = '''
All _ki_ powers have

a minimum monk level requirement to

select them. A monk who does not meet this

requirement cannot select that _ki_ power.'''

[[entry.feature]]
anchor = "activation"
head = "Activation"
listed = true
print = "Most _ki_ powers require the monk to spend _ki_ points; the exact amount is listed after the _ki_ power. _Ki_ powers that cost 0 _ki_ do not require the monk to have any _ki_ points in her _ki_ pool to use the ability.\n\nThe saving throw against a monk's _ki_ power, if any, is equal to 10 + 1/2 the monk's level + the monk's Wisdom bonus.\n\nFeats or spells marked with a single asterisk (\\*) are described in this book. Feats or spells marked with two asterisks (\\*\\*) are in the _Advanced Player's Guide_. Feats marked with a dagger (†) are _ki_ powers that can be activated as an immediate action."

