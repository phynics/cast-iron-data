[[entry]]
id = "ref/arc-bard/animal-speaker"
opening = ["An animal speaker focuses not on the ears and minds of humans, but on the creatures of the wild and those in the underbellies of cities."]

[[entry.feature]]
anchor = "animal-friend"
head = "Animal Friend"
listed = true
print = '''
An animal speaker selects a particular kind of animal, such as apes, badgers, bears, boars, cats, snakes, and so on. The bard gains a +4 bonus on Handle Animal checks to influence animals of his chosen kind. Animals of this kind have a starting attitude of at least "indifferent" toward the bard and never attack him unless he attacks them first.

Animal companions and magically controlled animals of the bard's chosen kind can be directed to attack the bard if the controlling creature wins an opposed Charisma check against the bard (this check can be made once per round until it succeeds, after which no further checks are needed). Supernatural versions of animals (such as animals with the [fiendish](ref/template/fiendish) template) can attempt an opposed Charisma check against the bard with a +4 bonus on its roll to overcome this hesitation. This ability has no effect on creatures other than animals. This ability replaces fascinate.'''
import_trades = ["Fascinate"]

[[entry.feature]]
anchor = "nature-s-speaker"
head = "Nature's Speaker"
listed = true
print = "At 5th, 11th, and 17th level, the animal speaker selects another kind of animal friend. The bard can use _[speak with animals](ref/spell/speak-with-animals)_ at will on animals of his selected kinds. This ability replaces well-versed."
import_trades = ["Well-versed"]

[[entry.feature]]
anchor = "bardic-performance"
head = "Bardic Performance"
listed = true
print = "An animal speaker gains the following types of bardic performance."

[[entry.feature]]
anchor = "soothing-performance"
head = "Soothing Performance"
listed = false
parent = "bardic-performance"
print = "At 3rd level, an animal speaker can use bardic performance to influence animals. This works like the druid ability [wild empathy](ref/ability/wild-empathy), except he expends 1 round of bardic performance and makes a Perform check. If the bard already has wild empathy from another class, he adds the class levels that provide wild empathy to the result of his Perform check to influence an animal. This ability replaces inspire competence."
import_trades = ["Inspire competence"]

[[entry.feature]]
anchor = "attract-rats"
head = "Attract Rats"
listed = false
parent = "bardic-performance"
print = "At 6th level, the animal speaker can use bardic performance to summon 1d3 [rat swarms](ref/monster/rat-rat-swarm); they remain as long as he continues performing. At 11th level, he summons 2d3 swarms instead of 1d3 and the swarms have the [advanced](ref/template/advanced) creature simple template. At 17th level, the number of swarms he summons increases to 3d3. This ability replaces _suggestion_."
import_trades = ["Suggestion"]

[[entry.feature]]
anchor = "summon-nature-s-ally"
head = "Summon Nature's Ally"
listed = true
level = 1
print = "At 1st level, the animal speaker adds _[summon nature's ally I](ref/spell/summon-natures-ally-1)_ to his bard spell list and bard spells known as a 1st-level spell. At 4th level (when he gains access to 2nd-level spells) he adds _[summon nature's ally II](ref/spell/summon-natures-ally-2)_ to his spell list and spells known as a 2nd-level spell, and so on every 3 levels thereafter, until 16th level when he adds _[summon nature's ally VI](ref/spell/summon-natures-ally-6)_ to his 6th-level spell list and spells known. This replaces mass suggestion."
import_trades = ["Mass suggestion"]

[[entry]]
id = "ref/arc-bard/celebrity"
opening = ["Known for being known, a celebrity bard is a master of performance who captures the imagination and attention of his audience. He trades on his charisma, his wit, and his exploits to build his renown—and that of his companions."]

[[entry.feature]]
anchor = "famous"
head = "Famous"
listed = true
level = 1
print = '''
At 1st level, a celebrity bard may choose a region where he is famous, and within that region, the locals are more likely to react favorably toward the bard. The bard gains a bonus on Diplomacy and Intimidate checks in that area and to influence people from that area.

At 1st level, this region is a settlement or settlements with a total population of 1,000 or fewer people, and the modifier on Diplomacy and Intimidate checks is +1. As the celebrity grows more famous, additional areas learn of him (typically places where he has lived or traveled, or settlements adjacent to those where he is known) and his bonuses apply to even more people. At 5th level, the region is a settlement or settlements with a total population of 5,000 or fewer people, and the modifier on Diplomacy and Intimidate checks is +2. At 9th level, the region is a settlement or settlements with a total population of up to 25,000 people, and the modifier on Diplomacy and Intimidate checks is +3. At 13th level, the region is a settlement or settlements with a total population of up to 100,000 people, and the modifier to Diplomacy and Intimidate is +4. At 17th level and above, the bard's renown has spread far, and most civilized folk know of him (GM's discretion); the bard's modifier on Diplomacy and Intimidate checks is +5.

This ability replaces inspire courage.'''
import_trades = ["Inspire courage"]

[[entry.feature]]
anchor = "bardic-performance"
head = "Bardic Performance"
listed = true
print = "A celebrity gains the following type of bardic performance."

[[entry.feature]]
anchor = "gather-crowd"
head = "Gather Crowd (Ex)"
listed = true
level = 5
print = "At 5th level, the celebrity is skilled at drawing an audience to his performances. If he is in a settlement or populated area, he can shout, sing, or otherwise make himself noticed in order to attract an audience to his impromptu stage. The size of the crowd depends on the local population, but typically is a number of people equal to 1/2 the bard's class level × the result of the bard's Perform check. The crowd gathers over the next 1d10 rounds. If the bard fails to engage the crowd (such as by performing, kissing babies, trying to use fascinate, and so on), it disperses over the next 1d10 rounds. This ability replaces lore master."
import_trades = ["Lore master"]

[[entry.feature]]
anchor = "shining-star"
head = "Shining Star (Su)"
listed = true
level = 8
print = "At 8th level, the celebrity has learned how to focus attention on himself so thoroughly that even the presence of danger does not distract his adoring crowd. When using fascinate, a target making a save to break the effect because of a potential threat takes a -4 penalty on that save, and even obvious threats require a save rather than automatically breaking the effect. Creatures affected by the bard's fascinate ability ignore the shaken condition. The ability replaces dirge of doom."
import_trades = ["Dirge of doom"]

[[entry]]
id = "ref/arc-bard/demagogue"
opening = ["Not content with providing amusing and occasionally instructive performances, the demagogue seeks to inflame and ignite his audience, driving them toward a specific purpose with carefully chosen words and tones that may spark momentous change."]

[[entry.feature]]
anchor = "famous"
head = "Famous"
listed = true
level = 1
print = "At 1st level, a demagogue is famous in a particular region. This works like the famous ability of the celebrity bard archetype, except the demagogue's skill bonuses apply to Bluff and Intimidate instead of Diplomacy and Intimidate. This ability replaces inspire courage +1."
import_trades = ["Inspire courage +1"]

[[entry.feature]]
anchor = "bardic-performance"
head = "Bardic Performance"
listed = true
print = "A demagogue gains the following type of bardic performance."

[[entry.feature]]
anchor = "gather-crowd"
head = "Gather Crowd (Ex)"
listed = true
level = 5
print = "At 5th level, the demagogue gains the ability to quickly gather a crowd. This is identical to the gather crowd ability of the celebrity bard archetype. This ability replaces lore master."
import_trades = ["Lore master"]

[[entry.feature]]
anchor = "incite-violence"
head = "Incite Violence (Ex)"
listed = true
level = 6
print = "At 6th level, the demagogue can use his performance to fan the fury of a crowd of people he has fascinated. Using this ability does not disrupt the fascinate effect, but does require a standard action to activate (in addition to the free action to continue the fascinate effect). The bard selects a number of targets equal to his level, who must make Will saves (DC 10 + 1/2 the bard's level + the bard's Charisma modifier) or be affected by _[rage](ref/spell/rage)_ for a number of rounds equal to the bard's level. The bard indicates who is the intended target of violence (either after using this ability or as part of the performance leading to it) and the enraged members of the crowd immediately attack the target if possible. The target does not need to be present (\"kill the king\" is a suitable choice) and can be an object instead of a person (\"destroy the prison!\" is likewise appropriate). Other members of the crowd may follow suit, though they do not gain the benefits of _rage_. This is a sound-based effect and is affected by countersong. If two or more bards are attempting to direct the crowd against different targets, they must make opposed Charisma checks, with the crowd following the directions of the winner. This ability replaces suggestion."
import_trades = ["Suggestion"]

[[entry.feature]]
anchor = "righteous-cause"
head = "Righteous Cause (Ex)"
listed = true
level = 18
print = "At 18th level, the demagogue can lift a crowd's emotions and turn them toward a common purpose. First, he must fascinate the crowd, and then use incite violence without designating a target, at which point he can use righteous cause. Instead of driving the crowd with anger, he fills them with purpose. Fascinated creatures must make Will saves (DC 10 + 1/2 the bard's level + the bard's Charisma modifier) to resist. Those who fail are affected by _[mass suggestion](ref/spell/suggestion-mass)_ of a plausible idea that lingers with them for one day. Typical uses of this ability are to spark rebellion, overthrow a king, build a beneficial structure such as an orphanage, or donate money to a cause. This ability replaces mass suggestion."
import_trades = ["Mass suggestion"]

[[entry]]
id = "ref/arc-bard/dirge-bard"
opening = ["A composer of sonorous laments for the dead and elaborate requiems for those lost yet long remembered, dirge bards master musical tools and tropes that must appeal to the ears and hearts of both the living and the dead."]

[[entry.feature]]
anchor = "bardic-performance"
head = "Bardic Performance"
listed = true
print = "A dirge bard gains the following type of bardic performance."

[[entry.feature]]
anchor = "dance-of-the-dead"
head = "Dance of the Dead (Su)"
listed = true
level = 10
print = "At 10th level, a dirge bard can use his bardic performance to cause dead bones or bodies to rise up and move or fight at his command. This ability functions like _[animate dead](ref/spell/animate-dead)_, but the created skeletons or zombies remain fully animate only as long as the dirge bard continues the performance. Once it stops, any created undead collapse into carrion. Bodies or bones cannot be animated more than once using this ability. Unlike _[animate dead](ref/spell/animate-dead)_, dance of the dead requires no components and does not have the evil descriptor. This performance replaces jack-of-all-trades."
import_trades = ["Jack-of-all-trades"]

[[entry.feature]]
anchor = "haunted-eyes"
head = "Haunted Eyes (Ex)"
listed = true
level = 2
print = "At 2nd level, a dirge bard gains a +4 bonus on saves against fear, energy drain, death effects, and necromantic effects. This ability replaces well-versed."
import_trades = ["Well-versed"]

[[entry.feature]]
anchor = "secrets-of-the-grave"
head = "Secrets of the Grave (Ex)"
listed = true
level = 2
print = "At 2nd level, a dirge bard gains a bonus equal to [half](ref/misc/fractions-and-rounding) his bard level on Knowledge (religion) checks made to identify undead creatures and their abilities. A dirge bard may use mind-affecting spells to affect undead as if they were living creatures, even if they are mindless (though spells that affect only humanoids do not affect them, even if they were humanoids in life). In addition, he may add one necromancy spell from the spell list of any arcane spellcasting class to his list of spells known at 2nd level and every four levels thereafter. This ability replaces versatile performance."
import_trades = ["Versatile performance"]

[[entry.feature]]
anchor = "haunting-refrain"
head = "Haunting Refrain (Su)"
listed = true
level = 5
print = "At 5th level, a dirge bard is able to stir primal terrors in the hearts of listeners. He can use a Perform (keyboard) or Perform (percussion) check in place of an Intimidate check to demoralize an opponent, with a bonus equal to half his bard level. In addition, saving throws against any fear effect he creates are made with a -2 penalty, and this penalty increases by -1 every 5 levels beyond 5th. This ability replaces lore master."
import_trades = ["Lore master"]

[[entry]]
id = "ref/arc-bard/geisha"
hold = "the alters trade `Armor and weapon proficiencies` is not printed in a sentence, and no listed feature of that name prints it"
opening = ["In some cultures, the professional entertainer is a prestigious role. Specially trained entertainers called geisha are praised for their appearance and skill at conversation, music, dancing, singing, poetry, and calligraphy. A geisha provides social intimacy and status but not physical intimacy."]

[[entry.feature]]
anchor = "weapon-and-armor-proficiency"
head = "Weapon and Armor Proficiency"
listed = false
print = "Geisha are proficient in all simple weapons and one [monk](ref/class/monk) weapon. Geisha are not proficient in any armor or shield; unlike bards, geisha are subject to arcane spell failure even when casting in light armor or when using a shield. This replaces the normal bard armor and weapon proficiencies."
import_trades = ["Armor", "weapon proficiencies"]

[[entry.feature]]
anchor = "tea-ceremony"
head = "Tea Ceremony (Su)"
listed = true
print = "By spending 10 minutes preparing an elaborate tea ceremony, a geisha may affect her allies with inspire courage, inspire competence, inspire greatness, or inspire heroics. The ceremony's effects last 10 minutes. The geisha must spend 4 rounds of bardic performance for each creature to be affected."

[[entry.feature]]
anchor = "geisha-knowledge"
head = "Geisha Knowledge"
listed = true
print = "A geisha adds [half](ref/misc/fractions-and-rounding) her class level (minimum 1) on Craft (calligraphy) checks, Diplomacy checks, Knowledge (nobility) checks, and one type of Perform check (act, dance, oratory, percussion, string instruments, or sing); she may make checks with these skills untrained. This replaces bardic knowledge."
import_trades = ["Bardic knowledge"]

[[entry.feature]]
anchor = "scribe-scroll"
head = "Scribe Scroll"
listed = true
print = "A geisha gains [Scribe Scroll](ref/feat/scribe-scroll) as a bonus feat."

[[entry]]
id = "ref/arc-bard/songhealer"
opening = ["Words can harm, but they also heal. The songhealer brings peace and surcease of pain, calming wild emotions and providing a balm for the wounded body."]

[[entry.feature]]
anchor = "enhance-healing"
head = "Enhance Healing (Su)"
listed = true
print = "A number of times per day equal to his Charisma modifier, a songhealer can cause any healing effect from a spell completion or spell trigger item to function at a caster level equal to his class level. This ability replaces versatile performance."
import_trades = ["Versatile performance"]

[[entry.feature]]
anchor = "bardic-performance"
head = "Bardic Performance"
listed = true
print = "A songhealer gains the following type of bardic performance."

[[entry.feature]]
anchor = "healing-performance"
head = "Healing Performance (Su)"
listed = true
print = "A bard of 14th level or higher can use his performance to create an effect equivalent to _[heal](ref/spell/heal)_ on a living target (or _[harm](ref/spell/harm)_ on an undead target), using the bard's level as the caster level. Using this ability requires 5 rounds of continuous performance, and the target must be able to see and hear the bard throughout the performance. The healing performance relies on audible and visual components. This ability replaces frightening tune."
import_trades = ["Frightening tune"]

[[entry.feature]]
anchor = "funereal-ballad"
head = "Funereal Ballad (Su)"
listed = true
print = "A bard of 20th level or higher can use his performance to create an effect equivalent to _[resurrection](ref/spell/resurrection)_ on a dead creature, using the bard's level as the caster level. Using this ability requires 20 rounds of continuous performance, and the target must be within 10 feet of the bard for the entire performance. Funereal ballad relies on audible and visual components. This ability replaces deadly performance."
import_trades = ["Deadly performance"]

[[entry]]
id = "ref/arc-bard/sound-striker"
opening = ["They say that words can cut deeper than any blade, and the sound striker proves this true. Using music and words as a weapon, he can focus his performances into a deadly delivery."]

[[entry.feature]]
anchor = "bardic-performance"
head = "Bardic Performance"
listed = true
print = "A sound striker gains the following type of bardic performance. Neither performance can be performed more quickly than a standard action."

[[entry.feature]]
anchor = "wordstrike"
head = "Wordstrike (Su)"
listed = true
level = 3
print = "At 3rd level, the sound striker bard can spend 1 round of bardic performance as a standard action to direct a burst of sonically charged words at a creature or object. This performance deals 1d4 points of damage plus the bard's level to an object, or half this damage to a living creature. This performance replaces inspire competence."
import_trades = ["Inspire competence"]

[[entry.feature]]
anchor = "weird-words"
head = "Weird Words (Su)"
listed = true
level = 6
print = "At 6th level, a sound striker can start a performance as a standard action, lashing out with 1 potent sound per bard level (maximum 10), each sound affecting one target within 30 feet. These are ranged touch attacks. Each weird word deals 1d8 points of damage plus the bard's Charisma bonus (Fortitude half), and the bard chooses whether it deals bludgeoning, piercing, or slashing damage for each word. This performance replaces _suggestion_."
import_trades = ["Suggestion"]

[[entry]]
id = "ref/arc-cleric/separatist"
opening = ["A radical cleric, unsatisfied with the orthodoxy of her deity's teachings, forges her own path of defiant divine expression. Though most members of her faith would call her a separatist or heretic, she continues to receive spells from her deity. Charismatic separatists may develop a large following of like-minded believers and eventually found a splinter church of their deity—and they are just as likely to be the cause of a holy civil war as the branches of the religion fight to determine which is the true faith.", "A cleric who does not serve a deity cannot take the separatist archetype. A separatist has the following class features."]

[[entry.feature]]
anchor = "weapon-and-armor-proficiency"
head = "Weapon and Armor Proficiency"
listed = false
print = "Separatists do not gain proficiency in their deity's favored weapon (though they are not prohibited from using it or learning its use)."

[[entry.feature]]
anchor = "forbidden-rites"
head = "Forbidden Rites"
listed = true
print = '''
A separatist selects one domain from her deity's domain list, and a second domain that is not on her deity's domain list. This second domain cannot be an alignment domain that doesn't match the cleric's or her deity's alignment. For example, a lawful good separatist cleric of a neutral good deity cannot choose the Chaos or Evil domain with this ability, but can select the Lawful domain even though her deity isn't lawful.

Granted powers from the cleric's second domain function as if the cleric's level, Wisdom, and Charisma were 2 lower than normal (minimum level 1) in terms of effect, DC, and uses per day. This also means the separatist doesn't gain the domain's higher-level ability until 2 levels later than normal. If the second domain grants additional class skills, the separatist gains these as normal. In all other respects, this ability works like and replaces the standard cleric's domain ability.'''
import_trades = ["Domains"]

[[entry]]
id = "ref/arc-cleric/theologian"
opening = ["A theologian is an expert on one particular area of her religion. She is so focused on that area that she eschews the broader sweep of her deity's dogma and focuses intensely upon that aspect of it, embodying its power in all she does. Theologians tend to be more zealous than other clerics, and many crusades are started by theologians. A theologian has the following class features."]

[[entry.feature]]
anchor = "focused-domain"
head = "Focused Domain"
listed = true
print = '''
A theologian chooses only one domain from her deity's portfolio rather than the normal two domains. All level-dependent effects of the granted powers from the theologian's domain function as if she were two cleric levels higher than her actual cleric level. This does not allow her to gain domain-granted powers earlier than normal.

A theologian can prepare domain spells using her non-domain slots. She cannot use her spontaneous casting ability on domain spells, even if they are prepared in non-domain slots. In all other respects, this works like and replaces the standard cleric domain ability.'''
import_trades = ["Domains"]

[[entry.feature]]
anchor = "domain-secret"
head = "Domain Secret (Ex)"
listed = true
level = 5
print = "At 5th level, the theologian chooses one domain spell. That spell becomes permanently modified with one of the following metamagic feats: [Bouncing Spell](ref/feat/bouncing-spell), [Disruptive Spell](ref/feat/disruptive-spell), [Ectoplasmic Spell](ref/feat/ectoplasmic-spell), [Enlarge Spell](ref/feat/enlarge-spell), [Extend Spell](ref/feat/extend-spell), [Focused Spell](ref/feat/focused-spell), [Intensified Spell](ref/feat/intensified-spell), [Silent Spell](ref/feat/silent-spell), [Still Spell](ref/feat/still-spell). This metamagic feat does not increase the level of the spell. Once chosen, this modification cannot be changed. The domain specialist need not have the metamagic feat to apply it to a spell using this ability. At every 5 levels after 5th, the domain specialist may choose an additional domain spell to modify in this way. She cannot modify the same spell more than once."

[[entry]]
id = "ref/arc-cleric/undead-lord"
opening = ["An undead lord is a cleric focused on using necromancy to control undead. Her flock is the walking dead and her choir the keening spirits of the damned. This unliving congregation is the manifestation of her unceasing love affair with death.", "A cleric cannot take the undead lord archetype unless her deity's portfolio includes the Death domain or a similar domain that promotes undeath. An undead lord has the following class features."]

[[entry.feature]]
anchor = "death-magic"
head = "Death Magic"
listed = true
print = "An undead lord must select the Death domain (and the Undead subdomain from the _Advanced Player's Guide_, if available in the campaign). She does not gain a second domain. In all other respects, this works like and replaces the standard cleric's domain ability."
import_trades = ["Domains"]

[[entry.feature]]
anchor = "corpse-companion"
head = "Corpse Companion (Su)"
listed = true
print = "With a ritual requiring 8 hours, an undead lord can animate a single [skeleton](ref/template/skeleton) or [zombie](ref/template/zombie) whose Hit Dice do not exceed her cleric level. This corpse companion automatically follows her commands and does not need to be controlled by her. She cannot have more than one corpse companion at a time. It does not count against the number of Hit Dice of undead controlled by other methods. She can use this ability to create a variant skeleton such as a bloody or burning skeleton, but its Hit Dice cannot exceed [half](ref/misc/fractions-and-rounding) her cleric level. She can dismiss her companion as a standard action, which destroys it."

[[entry.feature]]
anchor = "bonus-feats"
head = "Bonus Feats"
listed = false
print = "All undead lords gain [Command Undead](ref/feat/command-undead) as a bonus feat. In addition, at 10th level, she may select one of the following as a bonus feat: [Channel Smite](ref/feat/channel-smite), [Extra Channel](ref/feat/extra-channel), [Improved Channel](ref/feat/improved-channel), [Quick Channel](ref/feat/quick-channel), [Skeleton Summoner](ref/feat/skeleton-summoner), [Undead Master](ref/feat/undead-master)."

[[entry.feature]]
anchor = "unlife-healer"
head = "Unlife Healer (Su)"
listed = true
level = 8
print = "At 8th level, the undead lord's spells, [spell-like abilities](ref/umr/spell-like-abilities), and supernatural abilities used to heal undead heal an extra 50% damage. At 16th level, these effects automatically heal the maximum possible damage for the effect + the extra 50%. This does not stack with abilities or feats such as [Empower Spell](ref/feat/empower-spell) or [Maximize Spell](ref/feat/maximize-spell)."

[[entry]]
id = "ref/arc-druid/dragon-shaman"
opening = ["Your totem is the legendary dragon, fearsome and deadly yet cunning and wise, a creature born of pure magic and raw elemental fury, bound within a shell of fangs, claws, and scales that few dare to challenge. Though your initial focus is on dragons' mundane cousins, as your powers grow you become attuned to actual dragons."]

[[entry.feature]]
anchor = "nature-bond"
head = "Nature Bond"
listed = true
print = "A dragon shaman who chooses an animal companion must select a [crocodile](ref/companion/crocodile) or [monitor lizard](ref/companion/lizard-monitor-lizard). If choosing a domain, the dragon shaman must choose from the [Air](ref/domain/air), [Animal](ref/domain/animal), [Destruction](ref/domain/destruction), [Earth](ref/domain/earth), [Fire](ref/domain/fire), [War](ref/domain/war), and [Water](ref/domain/water) domains."
import_trades = ["Nature bond"]

[[entry.feature]]
anchor = "wild-empathy"
head = "Wild Empathy (Ex)"
listed = true
print = "A dragon shaman can use her wild empathy ability with lizards as a full-round action with a +4 bonus."
import_trades = ["Wild empathy"]

[[entry.feature]]
anchor = "totem-transformation"
head = "Totem Transformation (Su)"
listed = true
level = 2
print = "At 2nd level, a dragon shaman may adopt an aspect of the dragon while retaining her normal form. She gains one of the following bonuses: movement (fly speed 30 feet \\[average\\], the druid must be 5th level to select this bonus), senses ([low-light vision](ref/rule/low-light-vision), +4 racial bonus to Perception), toughness (+2 natural armor bonus to AC, [Endurance](ref/feat/endurance) feat), or [natural weapons](ref/umr/natural-attacks) (bite \\[1d6\\] and 2 claws \\[1d4\\] for a Medium shaman, +2 bonus on CMB on grapple checks). While using totem transformation, the dragon shaman may speak normally and can cast _[speak with animals](ref/spell/speak-with-animals)_ (lizards only) at will. Using this ability is a standard action at 2nd level, a move action at 7th level, and a swift action at 12th level. The dragon shaman can use this ability for a number of minutes per day equal to her druid level. These minutes do not need to be consecutive, but they must be used in 1-minute increments. This is a polymorph effect and cannot be used while the druid is using another polymorph effect, such as wild shape."
import_trades = ["Woodland stride"]

[[entry.feature]]
anchor = "totemic-summons"
head = "Totemic Summons (Su)"
listed = true
level = 5
print = "At 5th level, a dragon shaman may cast _[summon nature's ally](ref/spell/summon-natures-ally)_ as a standard action when summoning lizards, and summoned lizards gain [temporary hit points](ref/rule/temporary-hit-points) equal to her druid level. She can apply the [young](ref/template/young) template to any lizard to reduce the level of the summoning spell required by one. She can also increase the level of summoning required by one in order to apply either the [advanced](ref/template/advanced) or the [giant](ref/template/giant) template, or increase it by two to apply both the advanced and giant templates. This ability replaces a thousand faces."
import_trades = ["A thousand faces"]

[[entry.feature]]
anchor = "wild-shape"
head = "Wild Shape (Su)"
listed = true
level = 6
print = "At 6th level, a dragon shaman's wild shape ability functions at her druid level - 4. If she takes on the form of a lizard, she instead uses her unmodified druid level."
import_trades = ["Wild shape"]

[[entry.feature]]
anchor = "dragon-bite"
head = "Dragon Bite (Su)"
listed = true
level = 8
print = "At 8th level, a dragon shaman's bite attack (whether using totem transformation or wild shape to take the form of a lizard) deals +1d6 points of energy damage (acid, cold, electricity, or fire). She chooses what kind of energy damage that she deals each time she bites. This ability replaces the additional use of wild shape at 8th level."
import_trades = ["The additional use of _wild shape_ at 8th level"]

[[entry.feature]]
anchor = "bonus-feat"
head = "Bonus Feat"
listed = true
level = 9
print = "At 9th level and every 4 levels thereafter, a dragon shaman gains one of the following bonus feats: [Combat Casting](ref/feat/combat-casting), [Dazzling Display](ref/feat/dazzling-display), [Magical Aptitude](ref/feat/magical-aptitude), [Skill Focus](ref/feat/skill-focus) (Knowledge \\[arcana\\]), and [Spell Penetration](ref/feat/spell-penetration). She must meet the prerequisites for these bonus feats. This ability replaces venom immunity."
import_trades = ["Venom immunity"]

[[entry]]
id = "ref/arc-druid/menhir-savant"
opening = ["Some druids study the paths of nature's power through the nodes and ley lines that connect standing stones and megalithic circles, learning to tap into their energies."]

[[entry.feature]]
anchor = "spirit-sense"
head = "Spirit Sense (Sp)"
listed = true
level = 1
print = "At 1st level, a menhir savant can detect the presence of undead; fey; outsiders; and astral, ethereal, or incorporeal creatures. This ability functions like _[detect undead](ref/spell/detect-undead)_, and the druid detects all of these creatures rather than trying to detect one kind. This ability replaces nature sense and wild empathy."
import_trades = ["Nature sense", "wild empathy"]

[[entry.feature]]
anchor = "place-magic"
head = "Place Magic (Su)"
listed = true
level = 2
print = "At 2nd level, a menhir savant learns to identify and tap into ley lines in different types of terrain. As a free action, she can tap into the magic of a nearby ley line and increase her caster level by +1 for 1 round. She can use this ability a number of times per day equal to 3 + her Wisdom bonus. This ability replaces woodland stride and trackless step."
import_trades = ["Woodland stride", "trackless step"]

[[entry.feature]]
anchor = "walk-the-lines"
head = "Walk the Lines (Su)"
listed = true
level = 9
print = "At 9th level, a menhir savant can use her connection to ley lines to cast _[transport via plants](ref/spell/transport-via-plants)_ a number of times per day equal to her Wisdom bonus."

[[entry.feature]]
anchor = "empty-body"
head = "Empty Body (Su)"
listed = true
level = 13
print = "At 13th level, a menhir savant can become ethereal as a standard action, as if using _[ethereal jaunt](ref/spell/ethereal-jaunt)_. She can remain ethereal for a number of rounds per day equal to her druid level. These rounds do not need to be consecutive. This ability replaces a thousand faces."
import_trades = ["A thousand faces"]

[[entry]]
id = "ref/arc-druid/mooncaller"
opening = ["A mooncaller is bound to the subtle influences of the ever-changing moon and its endless cycles from light to dark and back again."]

[[entry.feature]]
anchor = "night-sight"
head = "Night Sight (Ex)"
listed = true
level = 2
print = "At 2nd level, a mooncaller gains [low-light vision](ref/rule/low-light-vision). If she already has low-light vision, she gains [darkvision](ref/rule/darkvision) with a range of 30 feet. If she already has darkvision, the range of her darkvision is increased by 30 feet. This ability replaces woodland stride."
import_trades = ["Woodland stride"]

[[entry.feature]]
anchor = "resist-call-of-the-wild"
head = "Resist Call of the Wild (Ex)"
listed = true
level = 4
print = "At 4th level, a mooncaller gains a +4 bonus on saving throws to avoid confusion, daze, feeblemind, and insanity effects. She also gains a +4 bonus against the exceptional, spell-like, and supernatural abilities of creatures with the shapechanger subtype. This ability replaces resist nature's lure."
import_trades = ["Resist nature's lure"]

[[entry.feature]]
anchor = "purity-of-body"
head = "Purity of Body (Ex)"
listed = true
level = 9
print = "At 9th level, a mooncaller gains immunity to all diseases, including supernatural and magical diseases. This ability replaces venom immunity."
import_trades = ["Venom immunity"]

[[entry.feature]]
anchor = "wolfsbane"
head = "Wolfsbane (Su)"
listed = true
level = 13
print = "At 13th level, a mooncaller gains DR 3/ silver, increasing to DR 4/silver at 16th level and DR 5/silver at 19th level. This ability replaces a thousand faces."
import_trades = ["A thousand faces"]

[[entry]]
id = "ref/arc-druid/pack-lord"
opening = ["Some druids bond with many animal companions rather than just one, achieving a level of communion rare even in druidic circles and leading their pack brothers and pack sisters with total authority."]

[[entry.feature]]
anchor = "pack-bond"
head = "Pack Bond (Ex)"
listed = true
print = '''
A pack lord druid may not select a domain and must choose an animal companion. The druid gains a +2 bonus on wild empathy and Handle Animal checks made regarding her animal companion. The pack lord may have more than one animal companion, but she must divide up her effective druid level between her companions to determine the abilities of each companion. For example, a 4th-level pack lord can have one 4th-level companion, two 2nd-level companions, or one 1st-level and one 3rd-level companion.

Each time a pack lord's druid level increases, she must decide how to allocate the increase among her animal companions (including the option of adding a new 1st-level companion). Once a druid level is allocated to a particular companion, it cannot be redistributed while that companion is in the pack lord's service (she must release the companion or wait until the companion dies to allocate its levels to another companion, which she can do the next time she prepares spells). The share spells animal companion ability only applies to one animal companion at a time—the pack lord cannot use it to cast a one-target spell and have it affect all of her animal companions. This ability replaces nature bond.'''
import_trades = ["Nature bond"]

[[entry.feature]]
anchor = "improved-empathic-link"
head = "Improved Empathic Link (Su)"
listed = true
level = 6
print = "The pack lord gains an empathic link with all of her animal companions. This functions like an empathic link with a [familiar](ref/sidekick/familiar). In addition, as a swift action the pack lord can shift her perception to one of her companions, allowing her to experience what it sees, hears, and so on. She can maintain this connection as long as she likes (as long as the companion is within 1 mile) and end it as a free action. The druid can only use this ability on one companion at a time, and cannot see, hear, or smell with her own body while maintaining this connection. This ability replaces the 6th-level additional use of wild shape."
import_trades = ["The 6th-level additional use of _wild shape_"]

[[entry]]
id = "ref/arc-druid/reincarnated-druid"
opening = ["Spun off into the endless circle of life, a reincarnated druid is an embodiment of nature's eternal renewal. She lives many lives and wanders the world devoid of attachments, a stranger to all yet one with all life."]

[[entry.feature]]
anchor = "mysterious-stranger"
head = "Mysterious Stranger (Ex)"
listed = true
level = 2
print = "At 2nd level, a reincarnated druids adds 1/2 her druid level to the DC of Sense Motive, Diplomacy, and Knowledge checks to learn about her. This ability replaces woodland stride."
import_trades = ["Woodland stride"]

[[entry.feature]]
anchor = "resist-death-s-touch"
head = "Resist Death's Touch (Ex)"
listed = true
level = 4
print = "At 4th level, a reincarnated druid gains a +4 bonus on saving throws against death effects, energy drain, and necromancy effects, and on stabilization checks when dying. This ability replaces resist nature's lure."
import_trades = ["Resist nature's lure"]

[[entry.feature]]
anchor = "many-lives"
head = "Many Lives (Ex)"
listed = true
level = 5
print = "At 5th level, if a reincarnated druid is killed, she may automatically _[reincarnate](ref/spell/reincarnate)_ (as the spell) 1 day later. The reincarnated druid appears in a safe location within 1 mile of her previous body. At will for the next 7 days, she can sense the presence of her remains as if using _[locate object](ref/spell/locate-object)_ as a [spell-like ability](ref/umr/spell-like-abilities). If she is killed during these 7 days, she remains dead and does not reincarnate. The many lives ability does not function if the reincarnated druid is slain by a death effect. A reincarnated druid cannot be [raised from the dead](ref/spell/raise-dead) or [resurrected](ref/spell/resurrection), though she can be reincarnated."

[[entry.feature]]
anchor = "wild-shape"
head = "Wild Shape (Su)"
listed = true
level = 6
print = "A reincarnated druid gains this ability at 6th level, and it functions at her druid level - 2."
import_trades = ["Wild shape"]

[[entry.feature]]
anchor = "cheat-death"
head = "Cheat Death (Ex)"
listed = true
level = 9
print = "At 9th level, once per day, a reincarnated druid may reroll a save against a death effect, energy drain, or necromancy effect before the result of the roll is revealed, or reroll a failed stabilization check while dying. She must take the result of the second roll, even if it is worse than the original roll. This ability replaces venom immunity."
import_trades = ["Venom immunity"]

[[entry.feature]]
anchor = "tongue-of-the-sun-and-moon"
head = "Tongue of the Sun and Moon (Ex)"
listed = true
level = 15
print = "At 15th level, a reincarnated druid can speak with any living creature. This ability replaces timeless body."
import_trades = ["Timeless body"]

[[entry]]
id = "ref/arc-druid/saurian-shaman"
opening = ["A shaman with this focus calls upon the primeval dinosaur, the archaic terror that lingers as a hungering, atavistic stranger at the fringes of the ecosystem, a destroyer and despoiler whose coming other animals dread."]

[[entry.feature]]
anchor = "nature-bond"
head = "Nature Bond"
listed = true
