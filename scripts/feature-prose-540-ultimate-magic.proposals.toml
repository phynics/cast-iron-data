print = "At 1st level, the staff magus gains the [Quarterstaff Master](ref/feat/quarterstaff-master) feat (see Chapter 3) as a bonus feat, even if he does not meet the normal prerequisites. He only gains the benefit of this feat when wearing no armor or light armor."

[[entry.feature]]
anchor = "quarterstaff-defense"
head = "Quarterstaff Defense (Ex)"
listed = true
level = 7
print = "At 7th level, while wielding a quarterstaff, the staff magus gains a shield bonus to his Armor Class equal to the enhancement bonus of the quarterstaff, including any enhancement bonus on that staff from his arcane pool class feature. At 13th level, this bonus increases by +3. This ability replaces the medium armor and heavy armor class abilities."
