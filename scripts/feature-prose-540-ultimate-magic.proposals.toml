head = "Launch Trap"
listed = true
level = 10
print = '''
At 10th level, a trapper can affix a magical ranger trap to an arrow, crossbow bolt, or thrown weapon, allowing her to set the trap remotely or use it as a direct attack. Attaching the trap to the projectile is part of the full-round action of creating a new trap. The trapped projectile is fired or thrown in the normal manner. If fired at a square, the trap is treated as if the ranger had set the trap in that square, except the DC is 5 lower than normal. If fired at a creature, the target takes damage from the ranged weapon and is treated as if it had triggered

the trap (saving throw applies, if any). The attack has

a maximum range of 60 feet, and range increments

apply to the attack roll. The duration of the trapped

projectile starts from when it is created, not from

when it is used.'''

[[entry]]
id = "ref/arc-summoner/broodmaster"
hold = "head not printed: Brood Bond (Su)"
opening = ["Most summoners bond with one eidolon for their entire lives, but the broodmaster forges a link with multiple smaller eidolons that make up his brood. Separately, a broodmaster's eidolons are no match for a summoner's single eidolon, but taken as a whole, an eidolon brood makes up in quantity what it lacks in individual power."]

[[entry.feature]]
anchor = "eidolon-brood"
head = "Eidolon Brood"
listed = true
level = 2
print = '''
At 2nd level, instead of a single eidolon, a broodmaster summons two Small [eidolons](ref/sidekick/eidolon) to his side, each less powerful than the single eidolon of a standard summoner. Each eidolon has it own base form and associated base statistics and free evolutions. Regardless of the number of eidolons in the brood, each eidolon has the same base attack bonus and base saving throw bonuses, but the rest of the eidolons' base statistics must be divided between the eidolons, including Hit Dice (minimum 1), skill points, number of feats, armor bonus, Str/Dex bonus, evolution pool (but see below), and maximum number of natural attacks. Individual eidolons in the brood must purchase evolutions separately. Once a broodmaster decides on the forms and abilities of his eidolons, they cannot be changed until the summoner gains a level.

_Example_: A 2nd-level broodmaster can summon two eidolons. Each eidolon has 1 Hit Dice, BAB +2, +3 on its two good saves and +0 on its bad save. The broodmaster decides to give the first eidolon 4 skill points, one feat, a +1 armor bonus, a +1 bonus to Strength, 2 points from the evolution pool, and a maximum of two attacks. The remaining 4 skill points, +1 armor bonus, +1 bonus to Dexterity, and 2 points from the evolution pool go to the second eidolon, but it gains no feats and can have only one natural attack.

The broodmaster must dismiss all of his eidolons at one time. Likewise, all of the eidolons in a brood are banished if the broodmaster is unconscious, asleep, or killed. However, each eidolon in the brood is sent back to its home plane individually when its hit points are reduced to a negative number equal to or greater than its Constitution score. This ability replaces the summoner's normal eidolon ability.

The following are new class features of the broodmaster archetype. Those with the same name as the standard summoner class have slightly different rules, but otherwise work as and replace the standard summoner class features of the same name.'''
import_trades = ["Eidolon"]

[[entry.feature]]
anchor = "brood-link"
head = "Brood Link (Su)"
listed = true
level = 2
print = "At 2nd level, a broodmaster forms a close bond with his eidolons. This ability works like the standard summoner life link ability, except the broodmaster can only sacrifice hit points to prevent damage to one eidolon in the brood at a time. If two or more eidolons in the brood take enough damage to send them back to their home plane, the broodmaster can only sacrifice hit points to prevent damage to one of them. This ability replaces life link."
import_trades = ["Life link"]

[[entry.feature]]
anchor = "bond-senses"
head = "Bond Senses (Su)"
listed = true
print = "The broodmaster can only share the senses of one eidolon in his brood at a time."

[[entry.feature]]
anchor = "shield-ally"
head = "Shield Ally (Ex)"
listed = true
print = "The broodmaster or an ally can only gain the bonuses from these abilities once, regardless of how many eidolons in the brood are within reach."

[[entry.feature]]
anchor = "maker-s-call"
head = "Maker's Call (Su)"
listed = true
print = "The broodmaster can only call one eidolon in the brood to his side with each use of this ability."

[[entry.feature]]
anchor = "transposition"
head = "Transposition (Su)"
listed = true
print = "The broodmaster swaps his location with that of one eidolon in the brood with each use of this ability."

[[entry.feature]]
anchor = "larger-brood"
head = "Larger Brood"
listed = true
level = 8
print = '''
At 8th level, the broodmaster can spend 4 evolution points from the evolution pool for the [large](ref/evolution/large) evolution; unlike with other evolutions, he spends these 4 points before he assigns evolution points to his individual eidolons (for an 8th-level broodmaster with 11 evolution points, this leaves 7 evolution points to distribute among the eidolons). This allows him to summon two Medium eidolons, four Small eidolons, or one Medium eidolon and two Small eidolons.

At 13th level, if the broodmaster has purchased the large evolution for his brood, he can spend an additional 6 evolution points from the evolution pool for the huge evolution, distributing the remaining points among his eidolons. This allows him to call two Large eidolons, four Medium eidolons, eight Small eidolons, or any similar combination in which two smaller eidolons count as one eidolon of one size larger.'''

[[entry.feature]]
anchor = "greater-shield-ally"
head = "Greater Shield Ally (Su)"
listed = true
print = "The broodmaster or an ally can only gain the bonuses from these abilities once, regardless of how many eidolons in the brood are within reach."

[[entry.feature]]
anchor = "hordes-of-summoned-monsters"
head = "Hordes of Summoned Monsters"
listed = true
print = "The broodmaster and master summoner archetypes can potentially have 5, 10, or even more summoned creatures in play. This is a deliberate feature of these archetypes, and means that the summoner can potentially be a strong candidate for \"solo\" adventuring by one player. However, in the hands of an inexperienced or moderately experienced player, dealing with all of those creatures in combat can take a long time, forcing other players to wait extended periods between their turns in the initiative. It is strongly recommended that GMs only allow these archetypes for experienced players, or decide on a way to speed up the summoner's turn (such as by allowing other players to control some of the summoned monsters). Brood Bond (Su): At 14th level, a summoner's life becomes linked to his brood. This functions as the life bond ability, except the broodmaster can only transfer damage to one eidolon in the brood at a time. If that eidolon takes enough damage to send it back to its home plane, all excess damage remains with the broodmaster, killing him. This ability replaces life bond."

[[entry.feature]]
