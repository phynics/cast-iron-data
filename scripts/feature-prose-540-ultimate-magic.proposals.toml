print = "At 5th level, a shark shaman may use _[summon nature's ally I](ref/spell/summon-natures-ally-1)_ to summon a [stingray](ref/monster/ray-stingray) (_Bestiary 2_) and _[summon nature's ally II](ref/spell/summon-natures-ally-2)_ to summon a [manta ray](ref/monster/ray-manta-ray) (_Bestiary 2_). She may cast _summon nature's ally_ as a standard action when summoning rays and sharks, and summoned rays and sharks gain a number of [temporary hit points](ref/rule/temporary-hit-points) equal to her druid level. This ability otherwise functions as the dragon shaman's totemic summons ability."

[[entry.feature]]
anchor = "wild-shape"
