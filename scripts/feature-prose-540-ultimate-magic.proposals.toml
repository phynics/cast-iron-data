[[entry.feature]]
anchor = "bonus-feat"
head = "Bonus Feat"
listed = true
level = 9
print = "At 9th level and every 4 levels thereafter, a saurian shaman gains one of the following bonus feats: [Improved Overrun](ref/feat/improved-overrun), [Nimble Moves](ref/feat/nimble-moves), [Power Attack](ref/feat/power-attack), [Skill Focus](ref/feat/skill-focus) (Intimidate), or [Vital Strike](ref/feat/vital-strike). She must meet the prerequisites for these bonus feats. This ability replaces venom immunity."
import_trades = ["Venom immunity"]

[[entry]]
id = "ref/arc-druid/shark-shaman"
