listed = true
print = "A [shark](ref/companion/shark) shaman who chooses an animal companion must select a shark. If choosing a domain, a shark shaman may choose the [Animal](ref/domain/animal), Death, [War](ref/domain/war), or [Water](ref/domain/water) domain."
import_trades = ["Nature bond"]

[[entry.feature]]
anchor = "wild-empathy"
head = "Wild Empathy (Ex)"
listed = true
print = "A shark shaman can use wild empathy with fish as a full-round action with a +4 bonus."
