listed = true
level = 6
print = "At 6th level, a shark shaman's wild shape ability functions at her druid level -2. If she takes on the form of a shark, she instead uses her druid level +2."
import_trades = ["Wild shape"]

[[entry.feature]]
anchor = "bonus-feat"
head = "Bonus Feat"
listed = true
level = 9
print = "At 9th level and every 4 levels thereafter, a shark shaman gains one of the following bonus feats: [Bleeding Critical](ref/feat/bleeding-critical), [Improved Initiative](ref/feat/improved-initiative), [Lightning Reflexes](ref/feat/lightning-reflexes), [Self- Sufficient](ref/feat/self-sufficient), or [Skill Focus](ref/feat/skill-focus) (Swim). She must meet prerequisites for these bonus feats. This ability replaces venom immunity."
import_trades = ["Venom immunity"]

[[entry]]
id = "ref/arc-druid/storm-druid"
opening = ["While most druids focus their attention upon the rich earth and the bounty of nature that springs forth from it, the storm druid's eyes have ever been cast to the skies and the endless expanse of blue, channeling the most raw and untamed aspects of nature."]

[[entry.feature]]
anchor = "spontaneous-domain-casting"
head = "Spontaneous Domain Casting"
listed = true
print = "A storm druid can channel stored spell energy into domain spells that she has not prepared ahead of time. She can \"lose\" a prepared spell in order to cast any domain spell of the same level or lower. This replaces spontaneous casting."
import_trades = ["Spontaneous casting"]

[[entry.feature]]
anchor = "nature-bond"
head = "Nature Bond (Ex)"
listed = true
print = "A storm druid may not choose an animal companion. A storm druid must choose the [Air](ref/domain/air) or [Weather](ref/domain/weather) domain, or the Cloud, Storm, or Wind subdomain."

[[entry.feature]]
anchor = "windwalker"
head = "Windwalker (Ex)"
listed = true
level = 2
print = "At 2nd level, the penalties from natural or magical wind effects are treated as one step less severe for a storm druid. This ability replaces woodland stride."
import_trades = ["Woodland stride"]

[[entry.feature]]
anchor = "stormvoice"
head = "Stormvoice (Ex)"
listed = true
level = 3
print = "At 3rd level, a storm druid's voice can magically carry over howling winds and peals of thunder. Whenever a Perception check is needed to hear the druid's voice, the DC is reduced by an amount equal to the druid's level. This ability replaces trackless step."
import_trades = ["Trackless step"]

[[entry.feature]]
anchor = "eyes-of-the-storm"
head = "Eyes of the Storm (Ex)"
listed = true
level = 4
print = "At 4th level, a storm druid can see through 10 feet of magical fog, mist, gas, wind, rain, or similar inclement weather conditions, ignoring any concealment it might grant. This distance increases by 5 feet for every 4 levels beyond 4th. This ability replaces resist nature's lure."
import_trades = ["Resist nature's lure"]

[[entry.feature]]
anchor = "windlord"
head = "Windlord"
listed = true
level = 9
print = "At 9th level, a storm druid can select another domain or subdomain from those available to her through her nature bond. This ability replaces venom immunity."
import_trades = ["Venom immunity"]

[[entry.feature]]
anchor = "storm-lord"
head = "Storm Lord (Ex)"
listed = true
level = 13
print = "At 13th level, a storm druid is unaffected by natural and magical wind effects. She also becomes immune to deafness and gains +2 bonus on saving throws against sonic effects. This ability replaces a thousand faces."
import_trades = ["A thousand faces"]

[[entry]]
id = "ref/arc-inquisitor/exorcist"
opening = ["Some inquisitors, as they learn more about the threat of possession and the machinations of the planes, task themselves to expel possessing spirits and conniving outsiders from the world whenever possible. Eventually they learn the secret of the verdicts of exorcism, exile, and anathema."]

[[entry.feature]]
anchor = "verdict-of-exorcism"
head = "Verdict of Exorcism (Su)"
listed = true
level = 8
print = "At 8th level, an inquisitor using judgment can unleash the verdict of exorcism on a creature. When she does, her judgment ends, but the creature is [dazed](ref/misc/dazed) for 1 round (Will negates); if the creature is possessed, the possessing entity must succeed at a Will saving throw (DC 10 + 1/2 inquisitor level + inquisitor's Wisdom bonus), or be exorcised and never again allowed in that same body. This ability replaces second judgment."
import_trades = ["Second judgment"]

[[entry.feature]]
anchor = "verdict-of-exile"
head = "Verdict of Exile (Su)"
listed = true
level = 16
print = "At 16th level, an inquisitor using judgment can unleash the verdict of exile on a creature. When she does, her judgment ends, but the creature subject to that judgment is dazed for 1 round (Will negates, DC of 10 + 1/2 inquisitor level + Wisdom bonus). If the creature is possessed or an outsider, the possessing entity or the outsider is affected by _[dismissal](ref/spell/dismissal)_ (Will negates). This ability replaces third judgment."
import_trades = ["Third judgment"]

[[entry.feature]]
anchor = "closed-mind"
head = "Closed Mind (Su)"
listed = true
print = "An exorcist inquisitor must close off her mind to deny her enemies even a foothold. At 17th level, the inquisitor becomes immune to compulsion effects and possession attempts (including _[magic jar](ref/spell/magic-jar)_). This ability replaces slayer."
import_trades = ["Slayer"]

[[entry.feature]]
anchor = "verdict-of-anathema"
head = "Verdict of Anathema (Su)"
listed = true
level = 20
print = "At 20th level, an inquisitor using judgment can unleash the verdict of anathema on her enemies. When she does, her judgment ends, and all enemy creatures within 10 feet are affected by her verdict of exorcism. This ability replaces true judgment."
import_trades = ["True judgment"]

[[entry]]
id = "ref/arc-inquisitor/heretic"
opening = ["While all inquisitors hunt the enemies of the faith, sometimes, either through political maneuvering by her enemies or an unyielding tenacity that breaks her faith's basic tenets, an inquisitor can find herself a heretic. Still unyielding in her cause, these heretics are accustomed to using guile and deception to hide themselves and their activities while they continue to hunt their enemies."]

[[entry.feature]]
anchor = "judgment"
head = "Judgment (Su)"
listed = true
print = "A heretic gains the following judgment in addition to the normal list of inquisitor judgments."

[[entry.feature]]
anchor = "escape"
head = "Escape (Su)"
listed = true
print = "Each time the inquisitor using this judgment hits an opponent with a melee or ranged attack, she can use a move action attempt to create a diversion to hide."

[[entry.feature]]
anchor = "lore-of-escape"
head = "Lore of Escape (Ex)"
listed = true
level = 1
print = "At 1st level, the heretic uses every trick she knows to escape those now pursuing her. She adds her Wisdom modifier on Bluff and Stealth skill checks in addition to the normal ability score modifiers. This ability replaces monster lore."
import_trades = ["Monster lore"]

[[entry.feature]]
anchor = "hide-tracks"
head = "Hide Tracks (Ex)"
listed = true
level = 1
print = '''
At 1st level, a heretical inquisitor is adept at hiding her tracks. Creatures attempting to track her take a -5 penalty on rolls to find or follow her tracks.

Ex-Inquisitors

An inquisitor who becomes an ex-inquisitor can, with the GM's permission, take the heretic archetype, replacing her class abilities with the appropriate archetype abilities. If the character atones or joins a different faith, she loses her heretic abilities and regains her previous inquisitor class abilities.'''

[[entry]]
id = "ref/arc-inquisitor/infiltrator"
hold = "the alters trade `Stern gaze` is not printed in a sentence, and no listed feature of that name prints it; Misdirection (Sp): the sentence \"This ability replaces stern gaze\" names no trade"
opening = ["This inquisitor uses guile and deception to blend in among the enemies of the faith rather than confronting them head-on."]

[[entry.feature]]
anchor = "misdirection"
head = "Misdirection (Sp)"
listed = true
level = 1
print = "At 1st level, each day when the infiltrator prepares spells, she may choose an alignment. She detects as that alignment as if she had used _[misdirection](ref/spell/misdirection)_ on a creature with that alignment (this does not change any divination results about her other than her alignment). This power replaces stern gaze."
import_trades = ["Stern gaze"]

[[entry.feature]]
anchor = "guileful-lore"
head = "Guileful Lore (Ex)"
listed = true
level = 1
print = "At 1st level, the infiltrator's will is bent toward subterfuge and deception. She adds her Wisdom modifier on Bluff and Diplomacy skill checks in addition to the normal ability score modifiers. This ability replaces monster lore."
import_trades = ["Monster lore"]

[[entry.feature]]
anchor = "forbidden-lore"
head = "Forbidden Lore (Ex)"
listed = true
print = "While other inquisitors learned to track unbelievers, an infiltrator learns how to cast their spells. An infiltrator can cast spells of an alignment opposed to her or her deity (ignoring the restriction in the Chaotic, Evil, Good, and Lawful Spells class ability). This ability replaces track."
import_trades = ["Track"]

[[entry.feature]]
anchor = "necessary-lies"
head = "Necessary Lies (Su)"
listed = true
print = "An infiltrator adds her class level on saving throws against abilities that detect lies or reveal or force the truth, such as _detect lies_ and _[zone of truth](ref/spell/zone-of-truth)_. This power replaces [discern lies](ref/spell/discern-lies)."
import_trades = ["Discern lies"]

[[entry]]
id = "ref/arc-inquisitor/preacher"
hold = "the alters trade `Teamwork feats` is not printed in a sentence, and no listed feature of that name prints it"
opening = ["Some inquisitors wander the land to spread the true word of their faith. Often they come into conflict with those hostile to their teachings or to the preacher's need to help those who cannot help themselves. The leaders of evil or aggressive religions send these preachers into new territories to win converts and hopefully allies. Often, they start uprisings against powers hostile to their religion, or defend a group of honest believers from the depredations of the unfaithful."]

[[entry.feature]]
anchor = "determination"
head = "Determination (Ex)"
listed = true
level = 3
print = "At 3rd level, the preacher is a person of few words on the battlefield, but those words hold great power and authority. Once per day, the inquisitor can use this ability to create one of the following effects. Each is a free action to use unless stated otherwise."
import_trades = ["Teamwork feats", "Solo tactics"]

[[entry.feature]]
anchor = "aggression"
head = "Aggression"
listed = false
parent = "determination"
print = "The preacher may reroll an attack roll that she just made before the results of the roll are revealed. She must take the result of the reroll, even if it's worse than the original roll."

[[entry.feature]]
anchor = "defense"
head = "Defense"
listed = false
parent = "determination"
print = "When the inquisitor would be hit by a melee or ranged attack, as an immediate action she may add a +4 insight bonus to her Armor Class against that attack, and if this makes the inquisitor's AC higher than the opponent's attack roll, the attack misses."

[[entry.feature]]
anchor = "warning"
head = "Warning"
listed = false
parent = "determination"
print = '''
When a preacher's ally within line of sight would be hit by a melee or ranged attack, she may call out a warning to that ally, and the attacker must reroll the attack and use the results of the second roll. The ally must be able to hear the preacher and must not be [helpless](ref/misc/helpless) for this ability to have any effect.

Whenever the preacher could select a bonus teamwork feat (at 3rd, 6th, 9th, 12th, 15th, and 18th level), she can instead choose to increase her number of uses per day of this ability by one. This ability replaces solo tactics.'''

[[entry]]
id = "ref/arc-inquisitor/sin-eater"
opening = ["There is a sect of inquisitors in some religions that believes it is not enough to hunt the enemies of the church— one must also devour those enemies' sins. More benign versions of the practice believe that sin, or evil, is taken out of the world when a sin is devoured, denying the enemy's soul to the enemy's god and purifying the world of its taint. Followers of malevolent churches believe that consuming the sins of good folk not only corrupts the enemy soul to keep it from the celestial planes, but also taints the souls of those who witness the sin-eating or the corpse of its victim. Consuming sins empowers the sin eater, at least for a time."]

[[entry.feature]]
anchor = "eat-sin"
head = "Eat Sin (Sp)"
listed = true
level = 1
print = '''
At 1st level, as a free action, when the sin eater inquisitor kills an enemy, she may eat the sins of that enemy by spending 1 minute adjacent to its corpse. This provokes attacks of opportunity. The inquisitor can rush this ritual, performing it as a full-round action that provokes attacks of opportunity, but she only gains half the normal benefit.

Eating the enemy's sins heals the inquisitor of a number of hit points of damage equal to 1d8 + her inquisitor level (maximum +5). The enemy must have been killed by the sin eater within the last hour, and it must have had at least as many Hit Dice as half the inquisitor's level. The inquisitor can use this ability once for each enemy she kills. This ability has no effect on mindless creatures or those with Intelligence 2 or less.

At 5th level, the healing increases to 2d8 plus her inquisitor level (maximum +10); it increases to 3d8 + her inquisitor level (maximum +15) at 9th level and to 4d8 + her inquisitor level (maximum +20) at 13th level.

In some faiths, this "eating" is a purely symbolic act, while in others, the inquisitor must eat a small amount of food and water as part of the ritual. A few extreme faiths actually require the inquisitor to eat some of the body of the slain enemy.

At 8th level, when a sin eater eats the sins of a creature that would rise as an undead (such as someone slain by a [shadow](ref/monster/shadow), [spectre](ref/monster/spectre), or [vampire](ref/template/vampire)), the sin eater may choose to accept 1 temporary [negative level](ref/rule/energy-drain-and-negative-levels) to absorb the taint in the corpse, preventing it from rising as an undead. This negative level can be removed with the appropriate magic, though it automatically expires after 24 hours, and never becomes a permanent negative level. At the GM's discretion, this ability may prevent a [ghost](ref/template/ghost) from using its rejuvenation ability.

This ability replaces an inquisitor's domain.'''
import_trades = ["Domain"]

[[entry.feature]]
anchor = "speak-with-dead"
head = "Speak with Dead (Sp)"
listed = true
level = 6
print = "At 6th level, when the inquisitor eats an enemy's sins, within 10 minutes of doing so, she can ask the remnants of the enemy's soul questions as if using _[speak with dead](ref/spell/speak-with-dead)_, with a caster level equal to her inquisitor level. She does not need the enemy's corpse to use this ability (she can eat sin, move away from the corpse, then use _[speak with dead](ref/spell/speak-with-dead)_), though the soul gets a saving throw just as a corpse would. This ability replaces the bonus teamwork feat gained at 6th level."
import_trades = ["Teamwork feat gained at 6th level"]

[[entry.feature]]
anchor = "burden-of-sin"
head = "Burden of Sin (Sp)"
listed = true
level = 14
print = "At 14th level, a sin eater may spend a full-round action to transfer one harmful affliction, condition, or spell effect from another creature to herself (this includes curses, possessions, and permanent effects such as petrification, or any condition that _[break enchantment](ref/spell/break-enchantment)_ can end or reverse). The effect to be transferred is chosen by the sin eater and affects her as if she were the original target, continuing its duration (if any) and preventing any further effect on the original bearer. For example, the inquisitor could transfer a lethal disease to herself, or petrify herself to restore a petrified comrade. The sin eater can use this ability as often as desired, even using it multiple times on the same creature. This ability replaces exploit weakness."
import_trades = ["Exploit weakness"]

[[entry]]
id = "ref/arc-magus/bladebound"
hold = "head not printed: Black Blade Basics, Black Blade Ability Descriptions, Alertness (Ex), Black Blade Strike (Sp), Telepathy (Su), Unbreakable (Ex), Energy Attunement (Su), Teleport Blade (Sp), Transfer Arcana (Su), Spell Defense (Sp), Life Drinker (Su)"
opening = ["A select group of magi are called to carry a _black blade_—a sentient weapon of often unknown and possibly unknowable purpose. These weapons become valuable tools and allies, as both the magus and weapon typically crave arcane power, but as a _black blade_ becomes more aware, its true motivations manifest, and as does its ability to influence its wielder with its ever-increasing ego."]

[[entry.feature]]
anchor = "black-blade"
head = "Black Blade (Ex)"
listed = true
level = 3
print = '''
At 3rd level, the bladebound magus gains a powerful sentient weapon called a _black blade_, whose weapon type is chosen by the magus. A magus with this class feature cannot take the [familiar](ref/arcana/familiar) magus arcana, and cannot have a familiar of any kind, even from another class.

Instead of the normal arcane pool amount, the bladebound magus's arcane pool has a number of points equal to 1/3 his

Table 1—3: Black Blade Progression'''
import_trades = ["Arcane Pool", "Magus arcana gained at 3rd level"]

