hold = "checker: [fields] trades = \"replaces: Mystery bonus spells at these levels\" disagrees with the trade sentences of the text outside any feature = \"none\" (line 26)"
opening_from_print = true
opening = ["All oracles are cursed to some degree, but some oracles bear an even heavier burden. Though doubly afflicted with supernatural or physical hindrances, a dual-cursed oracle can manipulate fortune and gains greater insights into her mystery."]

[[entry.feature]]
anchor = "recommended-mysteries"
head = "Recommended Mysteries"
listed = true
print = "Any."

[[entry.feature]]
anchor = "oracle-s-curse"
head = "Oracle's Curse"
listed = true
print = "A dual-cursed oracle must choose two curses at 1st level. One of these curses (oracle's choice) never changes its abilities as the oracle gains levels; for example, an oracle with [clouded vision](ref/oraclecurse/clouded-vision) never gains [darkvision](ref/rule/darkvision) 60 feet, [blindsense](ref/rule/blindsight-and-blindsense), or blindsight. The other curse comes with its normal benefits."
import_trades = ["Oracle's curse"]

[[entry.feature]]
anchor = "class-skills"
head = "Class Skills"
listed = false
print = "A dual-cursed oracle gains no additional class skills from her mystery."

[[entry.feature]]
anchor = "bonus-spells"
head = "Bonus Spells"
listed = false
print = "_ill omen_ (2nd), _oracle's burden_ (4th), _bestow curse_ (6th). These bonus spells replace the oracle's mystery bonus spells at these levels."
import_trades = ["The bonus spells gained at 2nd, 4th, and 6th levels from the oracle's mystery", "The bonus spells gained at 2nd", "4th", "6th levels from the oracle's mystery"]

[[entry.feature]]
anchor = "revelations"
head = "Revelations"
listed = true
print = "A dual-cursed oracle gains a new revelation at 5th level and 13th level. These are in addition to the normal revelations she receives at 3rd level, 7th level, and so on. In addition, the cursed oracle may select the following revelations in place of a mystery revelation."

[[entry.feature]]
anchor = "misfortune"
head = "Misfortune (Ex)"
listed = true
level = 1
print = "At 1st level, as an immediate action, you can force a creature within 30 feet to reroll any one d20 roll that it has just made before the results of the roll are revealed. The creature must take the result of the reroll, even if it's worse than the original roll. Once a creature has suffered from your misfortune, it cannot be the target of this revelation again for 1 day."

[[entry.feature]]
anchor = "fortune"
head = "Fortune (Ex)"
listed = true
level = 5
print = "At 5th level, as an immediate action, you can reroll any one d20 roll that you have just made before the results of the roll are revealed. You must take the result of the reroll, even if it's worse than the original roll. You can use this ability once per day at 5th level, and one additional time per day for every six oracle level beyond 5th."

