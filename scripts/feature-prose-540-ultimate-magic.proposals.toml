opening = ["A reanimator is an alchemist who has discovered how to infuse a corpse with a semblance of life. Many work in tandem with necromancers to explore the fine border between the worlds of the living and the dead. A reanimator has the following class features."]

[[entry.feature]]
anchor = "bomb"
head = "Bomb"
listed = true
print = "A reanimator's bombs deal damage [one die step](ref/misc/damage-die-adjustments) lower than normal (regular bombs deal d4s, [concussive bombs](ref/discovery/concussive-bomb) deal 1d3s, and so on). This ability otherwise functions as and replaces the standard alchemist bomb class feature."
import_trades = ["Bombs"]

[[entry.feature]]
anchor = "simple-reanimation"
head = "Simple Reanimation"
listed = true
level = 7
print = "At 7th level, a reanimator adds _[lesser animate dead](ref/spell/animate-dead-lesser)_ to his formula book as a 3rd-level extract. When he uses that extract, rather than drinking it, he injects it into the corpse he intends to animate, which rises as an undead creature under his control 1 hour later. The extract can only create [zombies](ref/template/zombie) (including variant zombies). This ability replaces the increase to bomb damage at this level."
import_trades = ["7th-level bomb damage increase"]

[[entry.feature]]
anchor = "create-undead"
head = "Create Undead"
listed = true
level = 13
print = "At 13th level, a reanimator adds _[create undead](ref/spell/create-undead)_ to his formula book as a 4th-level extract. When he uses that extract, rather than drinking it, he injects it into the corpse he intends to animate, which rises as an uncontrolled undead 1 hour later. The extract can only create corporeal undead. This ability replaces the increase to bomb damage at this level."
import_trades = ["13th-level bomb damage increase"]

[[entry.feature]]
anchor = "create-greater-undead"
head = "Create Greater Undead"
listed = true
level = 15
print = "At 15th level, a reanimator adds _[create greater undead](ref/spell/create-greater-undead)_ to his formula book as a 5th-level extract. This otherwise acts similarly to a _[create undead](ref/spell/create-undead)_ extract. This ability replaces the increase to bomb damage at this level."
import_trades = ["15th-level bomb damage increase"]

[[entry.feature]]
anchor = "discoveries"
head = "Discoveries"
listed = false
print = "The following discoveries complement the reanimator archetype: [alchemical zombie](ref/discovery/alchemical-zombie), [elixir of life](ref/discovery/elixir-of-life), [eternal potion](ref/discovery/eternal-potion), [mummification](ref/discovery/mummification), and [preserve organs](ref/discovery/preserve-organs)."

[[entry]]
id = "ref/arc-alchemist/vivisectionist"
hold = "head not printed: Bleeding Attack"
opening = ["A vivisectionist studies bodies to better understand how they function and how their parts interact. Unlike a chirurgeon, a vivisectionist's goals are not related to healing, but rather to experimentation and knowledge that most people would consider evil. A vivisectionist has the following class features."]

[[entry.feature]]
anchor = "sneak-attack"
head = "Sneak Attack"
listed = true
level = 1
print = "At 1st level, a vivisectionist gains the [sneak attack](ref/ability/sneak-attack) ability as a rogue of the same level. If a character already has sneak attack from another class, the levels from the classes that grant sneak attack stack to determine the effective rogue level for the sneak attack's extra damage dice (so an alchemist 1/rogue 1 has a +1d6 sneak attack like a 2nd-level rogue, an alchemist 2/rogue 1 has a +2d6 sneak attack like a 3rd-level rogue, and so on). This ability replaces bomb."
import_trades = ["Bomb"]

[[entry.feature]]
anchor = "torturer-s-eye"
head = "Torturer's Eye"
listed = true
level = 2
print = "At 2nd level, a vivisectionist adds _[deathwatch](ref/spell/deathwatch)_ to his formula book as a 1st-level extract."

[[entry.feature]]
anchor = "cruel-anatomist"
head = "Cruel Anatomist"
listed = true
level = 3
print = "At 3rd level, a vivisectionist may use his Knowledge (nature) skill bonus in place of his Heal skill bonus."

[[entry.feature]]
anchor = "torturous-transformation"
head = "Torturous Transformation"
listed = true
level = 7
print = '''
At 7th level, a vivisectionist adds _[anthropomorphic animal](ref/spell/anthropomorphic-animal)_ to his formula book as a 2nd-level extract. When he uses this extract, he injects it into an animal as part of a 2-hour surgical procedure. By using multiple doses of this extract as part of the surgery, he multiplies the duration by the number of extracts used.

At 9th level, a vivisectionist adds _[awaken](ref/spell/awaken)_ and _[baleful polymorph](ref/spell/baleful-polymorph)_ to his formula book as 3rd-level extracts. When he uses the _[awaken](ref/spell/awaken)_ or _[baleful polymorph](ref/spell/baleful-polymorph)_ extract, he injects it into the target (not a plant) as part of a 24-hour surgical procedure. He can make _[anthropomorphic animal](ref/spell/anthropomorphic-animal)_ [permanent](ref/spell/permanency) on a creature by spending 7,500 gp.

At 15th level, a vivisectionist adds _[regenerate](ref/spell/regenerate)_ to his formula book as a 5th-level extract.'''

[[entry.feature]]
anchor = "bleeding-attack"
head = "Bleeding Attack"
listed = true
print = "A vivisectionist may select the bleeding attack rogue talent in place of a discovery."

[[entry.feature]]
anchor = "crippling-strike"
head = "Crippling Strike"
listed = true
level = 10
print = "At 10th level or later, a vivisectionist may select the [crippling strike](ref/talent/crippling-strike) rogue talent in place of a discovery."

[[entry.feature]]
anchor = "discoveries"
head = "Discoveries"
listed = false
print = "The following discoveries complement the vivisectionist archetype: [alchemical simulacrum](ref/discovery/alchemical-simulacrum), [concentrate poison](ref/discovery/concentrate-poison), [doppelganger simulacrum](ref/discovery/doppelganger-simulacrum), [feral mutagen](ref/discovery/feral-mutagen), [parasitic twin](ref/discovery/parasitic-twin), [preserve organs](ref/discovery/preserve-organs), [tentacle](ref/discovery/tentacle), [tumor familiar](ref/discovery/tumor-familiar), [vestigial arm](ref/discovery/vestigial-arm), and [wings](ref/discovery/wings)."

