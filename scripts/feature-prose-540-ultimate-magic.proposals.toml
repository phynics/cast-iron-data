[[entry.feature]]
anchor = "master-precognition"
head = "Master Precognition"
listed = true
level = 17
print = "At 17th level, a psychonaut adds _[foresight](ref/spell/foresight)_ to his formula book as a 6th-level extract. This ability replaces the increase to bomb damage at this level."
