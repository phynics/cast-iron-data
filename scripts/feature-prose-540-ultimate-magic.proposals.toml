[[entry]]
id = "ref/arc-alchemist/chirurgeon"
opening = ["An alchemist who studies anatomy and uses this knowledge to heal is a chirurgeon. A chirurgeon has the following class features."]

[[entry.feature]]
anchor = "infused-curative"
head = "Infused Curative"
listed = true
level = 2
print = "At 2nd level, a chirurgeon's extracts of _cure_ spells automatically act as infusions, and can be used by non-alchemists. When a chirurgeon prepares his extracts, he may choose to render any or all of his infused curatives inert and prepare other extracts to replace them (unlike infusions, which continue to occupy the alchemist's daily extract slots until consumed or used). This ability replaces poison use."
import_trades = ["Poison use"]

[[entry.feature]]
anchor = "anaesthetic"
head = "Anaesthetic"
listed = true
level = 5
print = "At 5th level, a chirurgeon learns how to supplement uses of the Heal skill with pain-killing drugs. He gains [Skill Focus](ref/feat/skill-focus) (Heal) as a bonus feat. Any use of the Heal skill that has a risk of harming the patient (such as extracting a barb) only deals the minimum damage when performed by a chirurgeon. This ability replaces poison resistance +4."
import_trades = ["Poison resistance +4"]

[[entry.feature]]
anchor = "power-over-death"
head = "Power Over Death"
listed = true
level = 10
print = "At 10th level, a chirurgeon adds _[breath of life](ref/spell/breath-of-life)_ to his formula book as a 4th-level extract. His infused curative ability applies to this extract. This ability replaces poison immunity."
import_trades = ["Poison immunity"]

[[entry.feature]]
anchor = "discoveries"
head = "Discoveries"
listed = false
print = "The following discoveries complement the chirurgeon archetype: [elixir of life](ref/discovery/elixir-of-life), [healing touch](ref/discovery/healing-touch), [infusion](ref/discovery/infusion), and [spontaneous healing](ref/discovery/spontaneous-healing)."

[[entry]]
id = "ref/arc-alchemist/clone-master"
opening = ["Clone masters practice duplicating existing creatures in order to better understand how to create new life. A clone master has the following class features."]

[[entry.feature]]
anchor = "bomb"
head = "Bomb"
listed = true
print = "A clone master's bombs deal damage one die step lower than normal (regular bombs deal d4s, [concussive bombs](ref/discovery/concussive-bomb) deal 1d3s, and so on). This otherwise functions as and replaces the standard alchemist bomb class feature."
import_trades = ["Bombs"]

[[entry.feature]]
anchor = "lesser-simulacrum"
head = "Lesser Simulacrum"
listed = true
level = 7
print = "At 7th level, a clone master adds _[lesser simulacrum](ref/spell/simulacrum-lesser)_ to his formula book as a 3rd-level extract."

[[entry.feature]]
anchor = "rebirth"
head = "Rebirth"
listed = true
level = 8
print = "At 8th level, a [clone](ref/spell/clone) master can prepare a clone of himself that awakens if he is slain. Creating the clone costs 5,000 gp, takes 1 week of work, and requires 3 additional weeks for the clone to grow to maturity. If he dies, the clone awakens as if the alchemist had used the _clone_ spell on himself. He can have one inert of himself at a time. Unused clones created by a clone master do not rot. This ability replaces poison resistance +6 and poison immunity."
import_trades = ["Poison resistance +6", "poison immunity"]

[[entry.feature]]
anchor = "simulacrum"
head = "Simulacrum"
listed = true
level = 13
print = "At 13th level, a clone master adds _[simulacrum](ref/spell/simulacrum)_ to his formula book as a 5th-level extract."

[[entry.feature]]
anchor = "clone"
head = "Clone"
listed = true
level = 16
print = "At 16th level, a [clone](ref/spell/clone) master adds _clone_ to his formula book as a 6th-level extract."

[[entry.feature]]
anchor = "discoveries"
head = "Discoveries"
listed = false
print = "The following discoveries complement the clone master archetype: [alchemical simulacrum](ref/discovery/alchemical-simulacrum), [doppelganger simulacrum](ref/discovery/doppelganger-simulacrum), [preserve organs](ref/discovery/preserve-organs), and [parasitic twin](ref/discovery/parasitic-twin)."

[[entry]]
id = "ref/arc-alchemist/internal-alchemist"
opening = ["An internal alchemist studies medicine, diet, and the living body to purify the self in the hope of gaining immortality by means of alchemical concoctions and controlling vital energy. Internal alchemists develop unusual physical abilities from heightened knowledge of how their bodies work. An internal alchemist has the following class features."]

[[entry.feature]]
anchor = "breath-mastery"
head = "Breath Mastery"
listed = true
level = 1
print = "At 1st level, the internal alchemist can control his breath and the flow of vital energy within his body. Without preparation, he can [hold his breath](ref/misc/hold-your-breath) for a number of minutes equal to his Constitution score (after this, he must begin making Constitution checks or risk suffocation); by spending a full-round action preparing himself, he can increase this duration to 1 hour per point of Constitution. The alchemist can survive twice as long as normal without food or water before he starts to take penalties. He can put himself into a state of suspended animation as a move action, and is then unconscious and appears completely dead; he awakens at a preset time or in response to a condition set by him when he enters this state. This ability replaces Throw Anything."
import_trades = ["Throw Anything"]

[[entry.feature]]
anchor = "bonus-feats"
head = "Bonus Feats"
listed = false
print = "An internal alchemist can select [Alertness](ref/feat/alertness), Extra _Ki_, [Great Fortitude](ref/feat/great-fortitude), [Improved Critical](ref/feat/improved-critical) (unarmed strike), [Improved Initiative](ref/feat/improved-initiative), [Improved Unarmed Strike](ref/feat/improved-unarmed-strike), [Iron Will](ref/feat/iron-will), [Lightning Reflexes](ref/feat/lightning-reflexes), [Stunning Fist](ref/feat/stunning-fist), or [Weapon Focus](ref/feat/weapon-focus) (unarmed strike) in place of an alchemical discovery."

[[entry.feature]]
anchor = "disease-resistance"
head = "Disease Resistance"
listed = true
level = 3
print = "At 3rd level, an internal alchemist gains a bonus on all saving throws against disease equal to his alchemist class bonus against poison. When he gains the poison immunity alchemist class ability, he becomes immune to disease as well. This ability replaces swift alchemy."
import_trades = ["Swift alchemy"]

[[entry.feature]]
anchor = "uncanny-dodge"
head = "Uncanny Dodge"
listed = true
level = 6
print = "Starting at 6th level, an internal alchemist can react to danger before his senses would normally allow him to do so. He cannot be caught [flat-footed](ref/rule/flat-footed), nor does he lose his Dexterity bonus to AC if the attacker is invisible. However, he still loses his Dexterity bonus to AC if he is immobilized, or if an opponent successfully uses the feint action against him. If the internal alchemist already has uncanny dodge from a different class, he automatically gains [improved uncanny dodge](ref/ability/improved-uncanny-dodge) (as a rogue) instead. This ability replaces swift poisoning."
import_trades = ["Swift poisoning"]

[[entry.feature]]
anchor = "discoveries"
head = "Discoveries"
listed = false
print = "The following discoveries complement the internal alchemist archetype: [cognatogen](ref/discovery/cognatogen), [elixir of life](ref/discovery/elixir-of-life), [grand cognatogen](ref/discovery/grand-cognatogen), [greater cognatogen](ref/discovery/greater-cognatogen), [lingering spirit](ref/discovery/lingering-spirit), [mummification](ref/discovery/mummification), and [spontaneous healing](ref/discovery/spontaneous-healing)."

[[entry]]
id = "ref/arc-alchemist/mindchemist"
opening = ["While most alchemists use mutagens to boost their physical ability at the cost of mental ability, some use alchemy for the opposite purpose—to boost the power of the mind and memory. A mindchemist can reach incredible levels of mental acuity, but suffers lingering debilitating effects to his physique. A mindchemist has the following class features."]

[[entry.feature]]
anchor = "cognatogen"
head = "Cognatogen"
listed = true
level = 1
print = "At 1st level, a mindchemist learns how to create a [cognatogen](ref/discovery/cognatogen), as per the cognatogen discovery. This ability replaces the [mutagen](ref/discovery/mutagen) class ability (a mindchemist cannot create mutagens unless he selects mutagen as a discovery)."
import_trades = ["Mutagen"]

[[entry.feature]]
anchor = "perfect-recall"
head = "Perfect Recall"
listed = true
level = 2
print = "At 2nd level, a mindchemist has honed his memory. When making a Knowledge check, he may add his Intelligence bonus on the check a second time. Thus, a mindchemist with 5 ranks in Knowledge (history) and a +2 Intelligence bonus has a total skill bonus of +9 (5 + 2 + 2) using this ability. The mindchemist can also use this ability when making an Intelligence check to remember something. This ability replaces poison use."
import_trades = ["Poison use"]

[[entry.feature]]
anchor = "bonus-feats"
head = "Bonus Feats"
listed = false
print = "A mindchemist may select [Skill Focus](ref/feat/skill-focus) (Disable Device, Disguise, Heal, any Knowledge skill, Sense Motive, or Spellcraft) in place of a discovery."

[[entry.feature]]
anchor = "languages"
head = "Languages"
listed = true
print = "A mindchemist may learn three languages in place of a discovery."

[[entry.feature]]
anchor = "discoveries"
head = "Discoveries"
listed = false
print = "The following discoveries complement the mindchemist archetype: [grand cognatogen](ref/discovery/grand-cognatogen), [greater cognatogen](ref/discovery/greater-cognatogen), [infuse mutagen](ref/discovery/infuse-mutagen)."

[[entry]]
id = "ref/arc-alchemist/preservationist"
opening = ["Some alchemists are obsessed with collecting and preserving exotic creatures. These preservationists may use bottled animals and monsters as teaching tools, but some learn how to reanimate them for short periods to battle on the alchemist's behalf. A preservationist has the following class features."]

[[entry.feature]]
anchor = "bottled-ally-i"
head = "Bottled Ally I"
listed = true
level = 2
print = "At 2nd level, a preservationist adds [Handle Animal](ref/skill/handle-animal) to his list of class skills. He adds _[summon nature's ally I](ref/spell/summon-natures-ally-1)_ to his formula book as a 1st-level extract. When he prepares that extract, he actually prepares a tiny, preserved specimen in a bottle (as with a caster casting the spell, the preservationist doesn't have to choose the creature until he uses the extract). When the alchemist opens the bottle, the specimen animates and grows to normal size, serving the preservationist as per the spell and otherwise being treated as a summoned creature. When the duration expires, the preserved creature decays into powder. If the preservationist has the [infusion](ref/discovery/infusion) discovery, another character can use the infused specimen. The [Augment Summoning](ref/feat/augment-summoning) feat can be applied to these specimens. This ability replaces poison use."
import_trades = ["Poison use"]

[[entry.feature]]
anchor = "bottled-ally-ii"
head = "Bottled Ally II"
listed = true
level = 5
print = "At 5th level, a preservationist adds _[summon nature's ally II](ref/spell/summon-natures-ally-2)_ to his formula book as a 2nd-level extract. This ability replaces poison resistance +4."
import_trades = ["Poison resistance +4"]

[[entry.feature]]
anchor = "bottled-ally-iii"
head = "Bottled Ally III"
listed = true
level = 8
print = "At 8th level, a preservationist adds _[summon nature's ally IV](ref/spell/summon-natures-ally-4)_ to his formula book as a 3rd-level extract. This ability replaces poison resistance +6."
import_trades = ["Poison resistance +6"]

[[entry.feature]]
anchor = "bottled-ally-iv"
head = "Bottled Ally IV"
listed = true
level = 10
print = "At 10th level, a preservationist adds _[summon nature's ally V](ref/spell/summon-natures-ally-5)_ to his formula book as a 4th-level extract. This ability replaces poison immunity."
import_trades = ["Poison immunity"]

[[entry.feature]]
anchor = "bottled-ally-v"
head = "Bottled Ally V"
listed = true
level = 14
print = "At 14th level, a preservationist adds _[summon nature's ally VII](ref/spell/summon-natures-ally-7)_ to his formula book as a 5th-level extract. This ability replaces persistent mutagen."
import_trades = ["Persistent mutagen"]

[[entry.feature]]
anchor = "bottled-ally-vi"
head = "Bottled Ally VI"
listed = true
level = 18
print = "At 18 level, a preservationist adds _[summon nature's ally IX](ref/spell/summon-natures-ally-9)_ to his formula book as a 6th-level extract. This ability replaces his 18th-level discovery."
import_trades = ["18th-level discovery"]

[[entry.feature]]
anchor = "discoveries"
head = "Discoveries"
listed = false
print = "The following discoveries complement the preservationist archetype: [bottled ooze](ref/discovery/bottled-ooze), [preserve organs](ref/discovery/preserve-organs), [tentacle](ref/discovery/tentacle), [vestigial arm](ref/discovery/vestigial-arm), and [wings](ref/discovery/wings)."

