A saurian shaman who chooses

an animal companion must select a dinosaur.

If choosing a domain, a saurian shaman

must choose from the [Animal](ref/domain/animal), [Destruction](ref/domain/destruction),

Strength, and [War](ref/domain/war) domains.'''
import_trades = ["Nature bond"]

[[entry.feature]]
anchor = "wild-empathy"
head = "Wild Empathy (Ex)"
listed = true
print = "A saurian shaman can use wild empathy with dinosaurs and reptiles as a full-round action with a +4 bonus."
import_trades = ["Wild empathy"]

[[entry.feature]]
anchor = "totem-transformation"
head = "Totem Transformation (Su)"
listed = true
level = 2
print = "At 2nd level, a saurian shaman may adopt an aspect of the saurian while retaining her normal form. This ability functions as the dragon shaman's totem transformation ability, but the druid may select from the following bonuses: movement (+10 enhancement bonus to land speed), scales (+2 natural armor bonus to AC), senses ([low-light vision](ref/rule/low-light-vision), [scent](ref/umr/scent)), or [natural weapons](ref/umr/natural-attacks) (bite \\[1d6\\], 2 claws \\[1d4\\] for a Medium druid, rake, +2 CMB to grapple). While using totem transformation, a saurian shaman may speak normally and can cast _[speak with animals](ref/spell/speak-with-animals)_ (reptiles and dinosaurs only) at will."
import_trades = ["Woodland stride"]

[[entry.feature]]
anchor = "totemic-summons"
head = "Totemic Summons (Su)"
listed = true
level = 5
print = "At 5th level, a saurian shaman may cast _[summon nature's ally](ref/spell/summon-natures-ally)_ as a standard action when summoning reptiles and dinosaurs, and these summoned creatures gain [temporary hit points](ref/rule/temporary-hit-points) equal to her druid level. This ability otherwise functions as the dragon shaman's totemic summons ability."

[[entry.feature]]
anchor = "wild-shape"
head = "Wild Shape (Su)"
listed = true
level = 6
print = "At 6th level, a saurian shaman's wild shape ability functions at her druid level -2. If she takes on the form of a reptile or a dinosaur, she instead uses her druid level +2."
