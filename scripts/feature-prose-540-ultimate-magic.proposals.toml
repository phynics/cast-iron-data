print = "At 5th level, a psychonaut adds _[augury](ref/spell/augury)_ to his formula book as a 2nd-level extract (this extract does not require a divine focus component). This replaces poison resistance +4."
import_trades = ["Poison resistance +4"]

[[entry.feature]]
anchor = "psychic-senses"
head = "Psychic Senses"
listed = true
level = 8
print = "At 8th level, a psychonaut adds _[clairaudience/clairvoyance](ref/spell/clairaudience-clairvoyance)_, _[detect scrying](ref/spell/detect-scrying)_, _[scrying](ref/spell/scrying)_, and _[speak with dead](ref/spell/speak-with-dead)_ to his formula book as 3rd-level extracts (a _[scrying](ref/spell/scrying)_ extract does not require a focus or divine focus component). When a psychonaut uses a _[speak with dead](ref/spell/speak-with-dead)_ extract, he gains the power to hear the lingering spirit within a corpse rather than enabling the corpse to audibly speak, but the extract otherwise works as the spell. This ability replaces poison resistance +6."
import_trades = ["Poison resistance +6"]

[[entry.feature]]
