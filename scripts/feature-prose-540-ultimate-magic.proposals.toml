[[entry]]
id = "ref/arc-alchemist/mindchemist"
hold = "checker: [fields] trades = \"replaces: Mutagen\" disagrees with the trade sentences of the feature `cognatogen` = \"replaces: the mutagen class ability (a mindchemist cannot create mutagens unless he selects mutagen as a discovery)\" (line 35)"
opening = ["While most alchemists use mutagens to boost their physical ability at the cost of mental ability, some use alchemy for the opposite purpose—to boost the power of the mind and memory. A mindchemist can reach incredible levels of mental acuity, but suffers lingering debilitating effects to his physique. A mindchemist has the following class features."]

[[entry.feature]]
anchor = "cognatogen"
head = "Cognatogen"
listed = true
level = 1
print = "At 1st level, a mindchemist learns how to create a [cognatogen](ref/discovery/cognatogen), as per the cognatogen discovery. This ability replaces the [mutagen](ref/discovery/mutagen) class ability (a mindchemist cannot create mutagens unless he selects mutagen as a discovery)."
import_trades = ["Mutagen", "Mutagen"]

[[entry.feature]]
anchor = "perfect-recall"
head = "Perfect Recall"
listed = true
level = 2
print = "At 2nd level, a mindchemist has honed his memory. When making a Knowledge check, he may add his Intelligence bonus on the check a second time. Thus, a mindchemist with 5 ranks in Knowledge (history) and a +2 Intelligence bonus has a total skill bonus of +9 (5 + 2 + 2) using this ability. The mindchemist can also use this ability when making an Intelligence check to remember something. This ability replaces poison use."
import_trades = ["Poison use", "Poison use"]

[[entry.feature]]
anchor = "bonus-feats"
head = "Bonus Feats"
listed = false
print = "A mindchemist may select [Skill Focus](ref/feat/skill-focus) (Disable Device, Disguise, Heal, any Knowledge skill, Sense Motive, or Spellcraft) in place of a discovery."

[[entry.feature]]
anchor = "languages"
head = "Languages"
listed = true
print = "A mindchemist may learn three languages in place of a discovery."

[[entry.feature]]
anchor = "discoveries"
head = "Discoveries"
listed = false
print = "The following discoveries complement the mindchemist archetype: [grand cognatogen](ref/discovery/grand-cognatogen), [greater cognatogen](ref/discovery/greater-cognatogen), [infuse mutagen](ref/discovery/infuse-mutagen)."

[[entry]]
id = "ref/arc-bard/geisha"
hold = "checker: [fields] trades = \"replaces: Armor and weapon proficiencies\" disagrees with the trade sentences of the text outside any feature = \"replaces: the normal bard armor and weapon proficiencies\" (line 24)"
opening = ["In some cultures, the professional entertainer is a prestigious role. Specially trained entertainers called geisha are praised for their appearance and skill at conversation, music, dancing, singing, poetry, and calligraphy. A geisha provides social intimacy and status but not physical intimacy."]

[[entry.feature]]
anchor = "weapon-and-armor-proficiency"
head = "Weapon and Armor Proficiency"
listed = false
print = "Geisha are proficient in all simple weapons and one [monk](ref/class/monk) weapon. Geisha are not proficient in any armor or shield; unlike bards, geisha are subject to arcane spell failure even when casting in light armor or when using a shield. This replaces the normal bard armor and weapon proficiencies."
import_trades = ["Armor and weapon proficiencies", "Armor", "weapon proficiencies"]

[[entry.feature]]
anchor = "tea-ceremony"
head = "Tea Ceremony (Su)"
listed = true
print = "By spending 10 minutes preparing an elaborate tea ceremony, a geisha may affect her allies with inspire courage, inspire competence, inspire greatness, or inspire heroics. The ceremony's effects last 10 minutes. The geisha must spend 4 rounds of bardic performance for each creature to be affected."

[[entry.feature]]
anchor = "geisha-knowledge"
head = "Geisha Knowledge"
listed = true
print = "A geisha adds [half](ref/misc/fractions-and-rounding) her class level (minimum 1) on Craft (calligraphy) checks, Diplomacy checks, Knowledge (nobility) checks, and one type of Perform check (act, dance, oratory, percussion, string instruments, or sing); she may make checks with these skills untrained. This replaces bardic knowledge."
import_trades = ["Bardic knowledge", "Bardic knowledge"]

[[entry.feature]]
anchor = "scribe-scroll"
head = "Scribe Scroll"
listed = true
print = "A geisha gains [Scribe Scroll](ref/feat/scribe-scroll) as a bonus feat."

[[entry]]
id = "ref/arc-inquisitor/preacher"
hold = "checker: [fields] trades = \"alters: Teamwork feats\" disagrees with the trade sentences of the feature `determination` = \"replaces: solo tactics\" (line 34)"
opening = ["Some inquisitors wander the land to spread the true word of their faith. Often they come into conflict with those hostile to their teachings or to the preacher's need to help those who cannot help themselves. The leaders of evil or aggressive religions send these preachers into new territories to win converts and hopefully allies. Often, they start uprisings against powers hostile to their religion, or defend a group of honest believers from the depredations of the unfaithful."]

[[entry.feature]]
anchor = "determination"
head = "Determination (Ex)"
listed = true
level = 3
print = "At 3rd level, the preacher is a person of few words on the battlefield, but those words hold great power and authority. Once per day, the inquisitor can use this ability to create one of the following effects. Each is a free action to use unless stated otherwise."
import_trades = ["Teamwork feats", "Teamwork feats", "Solo tactics", "Solo tactics"]

[[entry.feature]]
anchor = "aggression"
head = "Aggression"
listed = false
parent = "determination"
print = "The preacher may reroll an attack roll that she just made before the results of the roll are revealed. She must take the result of the reroll, even if it's worse than the original roll."

[[entry.feature]]
anchor = "defense"
head = "Defense"
listed = false
parent = "determination"
print = "When the inquisitor would be hit by a melee or ranged attack, as an immediate action she may add a +4 insight bonus to her Armor Class against that attack, and if this makes the inquisitor's AC higher than the opponent's attack roll, the attack misses."

[[entry.feature]]
anchor = "warning"
head = "Warning"
listed = false
parent = "determination"
print = '''
When a preacher's ally within line of sight would be hit by a melee or ranged attack, she may call out a warning to that ally, and the attacker must reroll the attack and use the results of the second roll. The ally must be able to hear the preacher and must not be [helpless](ref/misc/helpless) for this ability to have any effect.

Whenever the preacher could select a bonus teamwork feat (at 3rd, 6th, 9th, 12th, 15th, and 18th level), she can instead choose to increase her number of uses per day of this ability by one. This ability replaces solo tactics.'''

[[entry]]
