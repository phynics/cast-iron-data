[[entry]]
id = "ref/arc-brawler/strangler"
hold = "the replaces trade `Unarmed strike` is not printed in a sentence, and no listed feature of that name prints it"
opening_from_print = true
opening = ["A strangler is trained to choke the life out of her victims with her vise-like grip. Some stranglers are self-taught and are little more than brutish murderers, unhinged sociopaths, or opportunistic alley-bashers. Others are members of murder cults or specialized schools of assassination, trained since the cradle to kill with their bare hands."]

[[entry.feature]]
anchor = "class-skills"
head = "Class Skills"
listed = true
print = "A strangler gains Stealth as a class skill."

[[entry.feature]]
anchor = "strangle"
head = "Strangle (Ex)"
listed = true
level = 1
print = "At 1st level, a strangler deals +1d6 [sneak attack](ref/ability/sneak-attack) damage whenever she succeeds at a [grapple](ref/rule/grapple) check to damage or pin an opponent. The strangler is always considered flanking her target for the purpose of using this ability. This damage increases by +1d6 at 2nd, 8th and 15th levels. This ability replaces unarmed strike and brawler's flurry."
import_trades = ["Unarmed strike, brawler's flurry", "Unarmed strike", "brawler's flurry"]

[[entry.feature]]
anchor = "practiced-strangler"
head = "Practiced Strangler (Ex)"
listed = true
level = 2
print = "At 2nd level, when a strangler has the [grappled](ref/rule/grapple-conditions) condition, she does not take a -4 penalty to Dexterity and does not lose her Dexterity bonus to AC. At 9th level, a grappling or grappled strangler still threatens an area and is still able to make attacks of opportunity while grappling or grappled; when pinned, she is not denied her Dexterity bonus and does not take a -4 penalty to Armor Class. This ability replaces AC bonus."
import_trades = ["AC bonus", "AC bonus"]

[[entry.feature]]
anchor = "sleeper-hold"
head = "Sleeper Hold (Ex)"
listed = true
level = 4
print = "At 4th level, a strangler can instantly render a pinned opponent unconscious. This works like the knockout ability, but requires a successful grapple combat maneuver check against the pinned opponent and does not have to damage the opponent. Creatures that do not need to breathe, are immune to critical hits, or are immune to nonlethal damage are immune to this ability. At 10th level, a strangler can use this ability twice per day. At 16th level, she can use it three times per day. This alters knockout."
import_trades = ["Knockout", "Knockout"]

[[entry.feature]]
anchor = "neckbreaker"
head = "Neckbreaker (Ex)"
listed = true
level = 16
print = "At 16th level, a strangler can attempt to instantly kill a pinned opponent as a standard action. This works like the sleeper hold ability, but imposes a -5 penalty on her grapple combat maneuver check. If the opponent succeeds at its Fortitude save, the strangler deals damage as if she had attempted the grapple check to damage her opponent; if the opponent fails its Fortitude save, it dies. Creatures that are immune to critical hits are immune to this ability. At 20th level, the strangler can attempt this as a move action instead of a standard action. This ability replaces awesome blow and improved awesome blow."
import_trades = ["Awesome blow, improved awesome blow", "Awesome blow", "improved awesome blow"]

[[entry]]
id = "ref/arc-hunter/verminous-hunter"
hold = "the alters trade `hunter tactics` is not printed in a sentence, and no listed feature of that name prints it"
opening = ["A verminous hunter calls on the ceaseless, single-minded dedication of vermin to hunt and overwhelm her prey. Where other hunters invoke the cunning, animalistic powers of the alpha predators, she calls on the powers of the lowest life forms, reaching out to the spider instead of the monkey, the mantis instead of the snake, or the moth instead of the owl."]

[[entry.feature]]
anchor = "vermin-companion"
head = "Vermin Companion (Ex)"
listed = true
level = 1
print = "At 1st level, a verminous hunter must choose a vermin companion instead of an animal companion. This ability alters animal companion. The hunter tactics class ability allows a verminous hunter to grant her teamwork feats to a mindless vermin companion."
import_trades = ["Animal companion, hunter tactics", "Animal companion", "hunter tactics"]

[[entry.feature]]
anchor = "vermin-empathy"
head = "Vermin Empathy (Ex)"
listed = true
print = "A verminous hunter gains the wild empathy ability, but can use it only to influence vermin (not animals or magical beasts). This ability alters wild empathy."
import_trades = ["Wild empathy", "Wild empathy"]

[[entry.feature]]
anchor = "vermin-focus"
head = "Vermin Focus (Su)"
listed = true
level = 1
print = "A verminous hunter can take on the aspect of a vermin. This functions as [animal focus](ref/ability/animal-foci), but allows only the following choices."

[[entry.feature]]
anchor = "ant"
head = "Ant"
listed = false
parent = "vermin-focus"
print = "The creature gains a +2 enhancement bonus to Strength. This bonus increases to +4 at 8th level and +6 at 15th level."

[[entry.feature]]
anchor = "beetle"
head = "Beetle"
listed = false
parent = "vermin-focus"
print = "The creature gains a +2 enhancement bonus to its natural armor bonus. This bonus increases to +4 at 8th level and +6 at 15th level. (A creature without natural armor has an effective natural armor bonus of +0.)"

[[entry.feature]]
anchor = "centipede"
head = "Centipede"
listed = false
parent = "vermin-focus"
print = "The creature gains a +2 competence bonus on Climb checks and a +2 bonus to CMD against pull, push, reposition, and trip combat maneuvers. These bonuses increase to +4 at 8th level and +6 at 15th level."

[[entry.feature]]
anchor = "cockroach"
head = "Cockroach"
listed = false
parent = "vermin-focus"
print = "The creature gains a +4 bonus on saves against cold dangers, disease, heat dangers, starvation, thirst, and on Constitution checks to avoid [suffocation](ref/rule/suffocation). These bonuses increase to +6 at 8th level and +8 at 15th level."

[[entry.feature]]
anchor = "crab"
head = "Crab"
listed = false
parent = "vermin-focus"
print = "The creature gains a +4 competence bonus on Swim checks and a +2 competence bonus on [grapple](ref/rule/grapple) combat maneuver checks. These bonuses increase to +6 and +4 respectively at 8th level, and +8 and +6 at 15th level."

[[entry.feature]]
anchor = "flea"
head = "Flea"
listed = false
parent = "vermin-focus"
print = "The creature gains a +4 competence bonus on saves against disease and Acrobatics checks to jump. These bonuses increase to +6 at 8th level and +8 at 15th level."

[[entry.feature]]
anchor = "fly"
head = "Fly"
listed = false
parent = "vermin-focus"
print = "The creature gains a +2 bonus on Perception checks and on Acrobatics checks to balance or fall safely. These bonuses increase to +4 at 8th level and +6 at 15th level."

[[entry.feature]]
anchor = "leech"
head = "Leech"
listed = false
parent = "vermin-focus"
print = "The creature gains a +2 competence bonus on grapple combat maneuver checks, and deals 1 point of [bleed](ref/rule/bleed) damage every time it succeeds at a grapple combat maneuver check to damage an opponent. These benefits increase to a +4 bonus and 3 points of bleed at 8th level, and a +6 bonus and 5 points of bleed at 15th level. Bleed damage from this ability does not stack with itself."

[[entry.feature]]
anchor = "mantis"
head = "Mantis"
listed = false
parent = "vermin-focus"
print = "The creature gains a +2 bonus on attack of opportunity attack rolls and a +2 competence bonus on grapple combat maneuver checks. These bonuses increase to +4 at 8th level and +6 at 15th level."

[[entry.feature]]
anchor = "moth"
head = "Moth"
listed = false
parent = "vermin-focus"
print = "The creature gains [darkvision](ref/rule/darkvision) to a range of 60 feet. At 8th level, the range increases by 30 feet. At 15th level, the creature gains [blindsense](ref/umr/blindsense) to a range of 10 feet."

[[entry.feature]]
anchor = "phasmid"
head = "Phasmid"
listed = false
parent = "vermin-focus"
print = "The creature gains [low-light vision](ref/rule/low-light-vision) and a +4 competence bonus on Stealth checks in forests or plains. This bonus increases to +6 at 8th level and +8 at 15th level."

[[entry.feature]]
anchor = "scorpion"
head = "Scorpion"
listed = false
parent = "vermin-focus"
print = "The creature gains a +2 competence bonus on Stealth checks and grapple combat maneuver checks. These bonuses increase to +6 and +4 respectively at 8th level, and +8 and +6 at 15th level."

[[entry.feature]]
anchor = "spider"
head = "Spider"
listed = false
parent = "vermin-focus"
print = "The creature gains a +2 competence bonus on Stealth checks, saving throws against [web](ref/spell/web) effects (magical or otherwise), and checks to break free of webs. This bonus increases to +4 at 8th level and +6 at 15th level."

[[entry.feature]]
anchor = "wasp"
head = "Wasp"
listed = false
parent = "vermin-focus"
print = "The creature gains a +4 competence bonus on Perception checks. This bonus increases to +6 at 8th level and +8 at 15th level."

[[entry.feature]]
anchor = "worm"
head = "Worm"
listed = false
parent = "vermin-focus"
print = '''
The creature gains a 25% chance to treat any critical hit or sneak attack as a normal hit (as the _[fortification](ref/magic-enh/fortification)_ armor special ability). This increases to 50% at 8th level, and 75% at 15th level.

This ability replaces animal focus.'''
import_trades = ["Animal focus", "Animal focus"]

[[entry.feature]]
anchor = "swarm-stride"
head = "Swarm Stride (Ex)"
listed = true
level = 5
print = "At 5th level, a verminous hunter learns to move through vermin without danger. He can safely pass through [swarms](ref/subtype/swarm) of vermin and does not take swarm damage while within a vermin swarm's space. In addition, he is immune to a swarm's distraction ability. If the hunter or his animal companion attacks a swarm, they lose this protection against only that swarm. This ability replaces woodland stride."
import_trades = ["Woodland stride", "Woodland stride"]

[[entry]]
id = "ref/arc-oracle/psychic-searcher"
hold = "the replaces trade `The bonus spells gained at 4th, 6th, 8th, 12th, 16th, and 18th levels from the oracle's mystery` is not printed in a sentence, and no listed feature of that name prints it"
opening = ["A psychic searcher is devoted to revealing the hidden within the world around her by sensing and communing with residual mental energy, haunts, and fragments of living spirits that can dwell in objects or rooms."]

[[entry.feature]]
anchor = "bonus-spells"
head = "Bonus Spells"
listed = false
print = "_Augury_ (4th), _locate object_ (6th), _divination_ (8th), _find the path_ (12th), _discern location_ (16th), _foresight_ (18th). These bonus spells replace the oracle's normal mystery bonus spells at these levels."
import_trades = ["The bonus spells gained at 4th, 6th, 8th, 12th, 16th, and 18th levels from the oracle's mystery", "The bonus spells gained at 4th", "6th", "8th", "12th", "16th", "18th levels from the oracle's mystery"]

[[entry.feature]]
anchor = "inspiration"
head = "Inspiration (Ex)"
listed = true
level = 2
print = "At 2nd level, a psychic searcher gains an inspiration pool, as the [investigator](ref/class/investigator) class ability. A psychic searcher uses her oracle level as her investigator level to determine the effects of this ability. She gains free uses of inspiration on Diplomacy, Knowledge (arcana, history, local, nobility, planes, religion), and Sense Motive skill checks without spending a use of inspiration, provided she's trained in that skill. A psychic searcher's inspiration pool refreshes each day, usually when she refreshes her spells. A psychic searcher's inspiration pool is based on her Charisma modifier, not her Intelligence modifier. This ability replaces the mystery spell gained at 2nd level."
import_trades = ["Mystery spell gained at 2nd level", "Mystery spell gained at 2nd level"]

[[entry.feature]]
anchor = "psychic-talent"
head = "Psychic Talent (Su)"
listed = true
level = 3
print = "At 3rd level, a psychic searcher's mastery of her supernatural insight grows, granting her a new investigator talent from the following list: [amazing inspiration](ref/invtalent/amazing-inspiration), [eidetic recollection](ref/invtalent/eidetic-recollection), [empathy](ref/invtalent/empathy), [inspired alertness](ref/invtalent/inspired-alertness), [item lore](ref/invtalent/item-lore), [perceptive tracking](ref/invtalent/perceptive-tracking) (except using Sense Motive instead of Perception or Survival), [rogue talent](ref/invtalent/rogue-talent) (only for [hard to fool](ref/talent/hard-to-fool)), and [tenacious inspiration](ref/invtalent/tenacious-inspiration). Whenever a psychic searcher can select a new revelation, she can instead select an investigator or rogue talent from the above list. This ability replaces the revelation gained at 3rd level."
import_trades = ["Revelations gained after 3rd level", "Revelations gained after 3rd level", "Revelation gained at 3rd level", "Revelation gained at 3rd level"]

[[entry.feature]]
anchor = "recommended-mysteries"
head = "Recommended Mysteries"
listed = false
print = "[Ancestor](ref/mystery/ancestor), [lore](ref/mystery/lore), [nature](ref/mystery/nature)."

[[entry]]
id = "ref/arc-oracle/spirit-guide"
hold = "the replaces trade `Bonus skills from the oracle's mystery` is not printed in a sentence, and no listed feature of that name prints it"
opening_from_print = true
opening = ["Through her exploration of the universe's mysteries, a spirit guide opens connections to the spirit world and forms bonds with the entities that inhabit it."]

[[entry.feature]]
anchor = "class-skills"
head = "Class Skills"
listed = true
print = "A spirit guide gains all Knowledge skills as class skills. This replaces the bonus class skills gained from the oracle's mystery."

[[entry.feature]]
anchor = "bonded-spirit"
head = "Bonded Spirit (Su)"
listed = true
level = 3
print = '''
At 3rd level, a [spirit](ref/ability/shaman-spirits) guide can form a temporary bond with a spirit, as the [shaman's](ref/class/shaman) wandering spirit class feature (see page 37). She must make this selection each day when she refreshes her spells. A spirit guide cannot bond with a spirit that is incompatible with her alignment, ethos, or mystery (GM's discretion).

A spirit guide gains one hex of her choice from the list of hexes available from that spirit. She uses her oracle level as her shaman level, and she switches Wisdom for Charisma and vice versa for the purpose of determining the hex's effects.

At 4th level, she adds the bonded spirit's spirit magic spells to her oracle spells known for that day, but only of spell levels she can cast. At 7th level, she gains the spirit ability of her current bonded spirit. At 15th level, she gains the greater spirit ability of her current bonded spirit.

This ability replaces the revelations gained at 3rd, 7th, and 15th levels.'''
import_trades = ["Revelations gained at 3rd, 7th, and 15th levels", "Revelations gained at 3rd", "7th", "15th levels"]

[[entry.feature]]
anchor = "recommended-mysteries"
head = "Recommended Mysteries"
listed = false
print = "[Ancestor](ref/mystery/ancestor), [heavens](ref/mystery/heavens), [lore](ref/mystery/lore)."

[[entry]]
id = "ref/arc-sorcerer/eldritch-scrapper"
hold = "the replaces trade `Bloodline powers gained at 1st, 9th, and 15th level` is not printed in a sentence, and no listed feature of that name prints it; Martial Flexibility (Ex): the sentence \"This ability replaces the sorcerer's bloodline powers gained 1st, 9th, and 15th levels\" names no trade"
opening = ["An eldritch scrapper is usually spoiling for a fight, looking to prove that she's just as tough as a martial character. A veteran of many brawls against opponents who were suspicious of her manifesting magic, an eldritch scrapper has a thick skin and a fighting style that blends weapons with spells."]

[[entry.feature]]
anchor = "martial-flexibility"
head = "Martial Flexibility (Ex)"
listed = true
level = 1
print = '''
At 1st level, an eldritch scrapper gains the [brawler's](ref/class/brawler) martial flexibility class feature, using her sorcerer level as her brawler level for the purposes of uses per day. The scrapper treats [Arcane Strike](ref/feat/arcane-strike) and [Combat Casting](ref/feat/combat-casting) as combat feats for the purpose of this ability.

At 9th level, an eldritch scrapper can use this ability to gain the benefit of two combat feats at the same time. She can select one feat as a move action or two feats as a standard action. She can use one of these feats to meet a prerequisite of the second feat; doing so means she cannot replace the feat that is currently fulfilling another feat's prerequisites without also replacing all feats that require it. Each individual feat selected counts toward her daily uses of this ability.

At 15th level, an eldritch scrapper can use this ability to gain the benefit of three combat feats at the same time. She can select one feat as a swift action, two feats as a move action, or three feats as a standard action. She can use one of the feats to meet a prerequisite of the second and third feats, and use the second feat to meet a prerequisite of the third feat. Each individual feat selected counts toward her daily uses of this ability.

This ability replaces the sorcerer's bloodline powers gained 1st, 9th, and 15th levels.'''
import_trades = ["Bloodline powers gained at 1st, 9th, and 15th level", "Bloodline powers gained at 1st", "9th", "15th level"]

[[entry.feature]]
anchor = "bloodline-weapons"
head = "Bloodline Weapons"
listed = true
print = "If an eldritch scrapper's 1st-level bloodline power would normally grant her natural attacks (such as bite or claws), at 3rd level she can select that 1st-level bloodline power in place of her 3rd-level bloodline power."

[[entry]]
id = "ref/arc-swashbuckler/daring-infiltrator"
hold = "checker: [fields] trades = \"alters: Bonus feats\" disagrees with the trade sentences of the text outside any feature = \"none\" (line 27)"
opening_from_print = true
opening = ["Not known for their flashy entrances or for standing out in a crowd, a daring infiltrator uses stealth, disguise, and ruthless guile to pursue her goals. Some of these swashbucklers work to undermine evil organizations, while others are master thieves or mysterious assassins."]

[[entry.feature]]
anchor = "class-skills"
head = "Class Skills"
listed = true
print = "A daring infiltrator gains Disguise and Stealth as class skills, but does not gain Diplomacy, Perform, and Profession as class skills. This alters the swashbuckler's class skill list."

[[entry.feature]]
anchor = "bonus-feats"
head = "Bonus Feats"
listed = false
print = "In addition to combat feats, a daring infiltrator's bonus feats at 4th, 8th, 12th, 16th, and 20th level can come from the following list: [Alertness](ref/feat/alertness), [Antagonize](ref/feat/antagonize), [Cosmopolitan](ref/feat/cosmopolitan), [Deceitful](ref/feat/deceitful), [Deft Hands](ref/feat/deft-hands), Disarming Threat\\*, [Persuasive](ref/feat/persuasive), [Prodigy](ref/feat/prodigy), and [Skill Focus](ref/feat/skill-focus). (Those marked with an asterisk \\[\\*\\] are detailed in this book.) This alters the bonus feat class ability."
import_trades = ["Bonus feats", "Bonus feats"]

[[entry.feature]]
anchor = "quick-tongued"
head = "Quick-Tongued (Ex)"
listed = true
level = 2
print = "At 2nd level, a daring infiltrator gains a +1 bonus on Bluff checks. This bonus increases by 1 for every 4 levels beyond 2nd. This ability replaces charmed life."
import_trades = ["Charmed life", "Charmed life"]

[[entry.feature]]
anchor = "deeds"
head = "Deeds"
listed = true
print = "A daring infiltrator gains the following deeds, each of which replaces an existing deed."

[[entry.feature]]
anchor = "clandestine-expertise"
head = "Clandestine Expertise (Ex)"
listed = true
level = 3
print = "At 3rd level, a daring infiltrator with at least 1 panache point gains a +2 bonus on Disguise and Stealth checks. Also, as long as she has at least 1 panache point, when she successfully aids another with a Disguise or Stealth check, she grants the subject a +4 bonus on the skill check instead of the normal +2. This deed replaces swashbuckler initiative."
import_trades = ["Swashbuckler initiative", "Swashbuckler initiative"]

[[entry.feature]]
anchor = "silence-is-golden"
head = "Silence Is Golden (Ex)"
listed = true
level = 3
print = "At 3rd level, when a daring infiltrator with at least 1 panache point succeeds at a [trip](ref/rule/trip) or [grapple](ref/rule/grapple) combat maneuver check, the target is rendered mute for 1 round. For every 5 by which the result of the combat maneuver check exceeds the opponent's CMD, the target remains mute for an additional round. A mute creature cannot speak, use language-dependent effects or verbal components, or use command words. This deed replaces menacing swordplay."
import_trades = ["Menacing swordplay", "Menacing swordplay"]

[[entry.feature]]
anchor = "authoritative-bluff"
head = "Authoritative Bluff (Ex)"
listed = true
level = 11
print = "At 11th level, a daring infiltrator can spend 1 panache point to reroll a Bluff check after the roll is made but before the results are revealed. She must take the result of the second roll, even if it is lower. Additionally, a daring infiltrator with at least 1 panache point gains a +5 bonus on Bluff checks to pretend to be someone's superior (socially or in the military). If she succeeds at the check, the target obeys any reasonable orders she gives as it would those of an actual superior in the situation. This deed replaces bleeding wound."
import_trades = ["Bleeding wound", "Bleeding wound"]

[[entry]]
id = "ref/arc-swashbuckler/mysterious-avenger"
hold = "the replaces trade `4th-level bonus feat` is not printed in a sentence, and no listed feature of that name prints it; Greater Charmed Life (Ex): the sentence \"This ability replaces the bonus feat gained at 4th level\" names no trade"
opening = ["While some swashbucklers fight for queen and country, and others for coin, glory, or just the enhancement of their own reputations, the mysterious avenger fights directly for a cause. Instead of gaining personal glory for her heroic deeds, she keeps her identity hidden in order to fight for those who cannot fight for themselves."]

[[entry.feature]]
anchor = "alignment"
head = "Alignment"
listed = false
print = "A mysterious avenger must be of a good alignment, and must be dedicated to the protection of the good and the powerless under her care. If she ceases to be good or betrays the trust of those she was sworn to protect, she loses her secret identity and greater charmed life class features. She can regain them if she atones for her violations by some means that the GM sees fit (possibly by way of the _[atonement](ref/spell/atonement)_ spell if the mysterious avenger is especially religious)."

[[entry.feature]]
anchor = "class-skills"
head = "Class Skills"
listed = true
print = "A mysterious avenger adds Disguise to her list of class skills. This alters the swashbuckler's class skills."

[[entry.feature]]
anchor = "weapon-and-armor-proficiency"
head = "Weapon and Armor Proficiency"
listed = false
print = "A mysterious avenger loses her proficiency with bucklers, but gains proficiency in the [whip](ref/eq-weapon/whip) exotic weapon. This alters the swashbuckler's weapon and armor proficiency."
import_trades = ["Weapon and armor proficiency", "Weapon", "armor proficiency"]

[[entry.feature]]
anchor = "avenger-finesse"
head = "Avenger Finesse (Ex)"
listed = true
print = "A mysterious avenger gains all of the benefits of the swashbuckler's finesse class feature, and gains the ability to use a whip in place of a light or one-handed piercing melee weapon for all swashbuckler class features and deeds. This ability alters swashbuckler finesse."
import_trades = ["Swashbuckler finesse", "Swashbuckler finesse"]

[[entry.feature]]
anchor = "secret-identity"
head = "Secret Identity (Su)"
listed = true
level = 3
print = "At 3rd level, a mysterious avenger's force of personality and dedication to her cause give her the ability to keep her true identity secret, even from magical prying. She gains a +4 bonus on Disguise checks in a single disguise of her choice, typically her avenger persona. Once this disguise has been chosen, it can't be changed. She also gains a +4 bonus on saving throws against divination effect. At 11th level, she becomes immune to all _[scrying](ref/spelldef/scrying)_ effects and other magical effects used in attempts to uncover her secret identity. This ability replaces nimble."
import_trades = ["Nimble", "Nimble"]

[[entry.feature]]
anchor = "greater-charmed-life"
head = "Greater Charmed Life (Ex)"
listed = true
level = 4
print = "At 4th level, the mysterious avenger gains three extra uses of charmed life. As an immediate action, she can expend one use of charmed life to gain a bonus to her AC equal to her Charisma modifier (minimum 1). She must choose to do this before the attack roll is made against her. This ability replaces the bonus feat gained at 4th level."
import_trades = ["4th-level bonus feat", "4th-level bonus feat"]

[[entry.feature]]
anchor = "avenger-s-target"
head = "Avenger's Target (Ex)"
listed = true
level = 5
print = '''
At 5th level, a mysterious avenger gains a +1 bonus on attack and damage rolls with light or one-handed piercing melee weapons and whips. Furthermore, a mysterious avenger can study an opponent she can see as a move action. The mysterious avenger then gains a +1 bonus on Bluff, Knowledge, Perception, Sense Motive, and Survival checks against that opponent, a +1 bonus on weapon attack and damage rolls against it, and a +1 bonus to DCs of any deeds used against that opponent. A mysterious avenger can maintain these bonuses against only one opponent at a time; these bonuses remain in effect until either the opponent is dead or the mysterious avenger studies a new target.

At 10th, 15th, and 20th levels, these mysterious avenger's bonuses against a studied target increase by 1. In addition, at each such interval, a mysterious avenger is able to maintain these bonuses against an additional studied target at the same time. A mysterious avenger can discard this connection to a studied target as a free action, allowing her to study another target in its place.

At 10th level, a mysterious avenger can study an opponent as a move or swift action. This ability replaces swashbuckler weapon training.'''
import_trades = ["Swashbuckler weapon training", "Swashbuckler weapon training"]

[[entry]]
id = "ref/arc-wizard/spirit-whisperer"
hold = "the replaces trade `20th-level bonus feat` is not printed in a sentence, and no listed feature of that name prints it; the alters trade `5th-, 10th-, and 15th-level bonus feats` is not printed in a sentence, and no listed feature of that name prints it; Spirit Hex: the sentence \"This ability alters bonus feats\" names no trade"
opening = ["Spirit whisperers are a breed apart among wizards, and are often mistaken for witches. While spirit whisperers do gain and store their spells by communing with familiars, the spirits they gain guidance from are somewhat closer to the world and more direct than the powers with which witches typically traffic. These wizards treat such spirits as mentors and friends, conversing with them rather than appeasing them in the effort to gain and use arcane knowledge."]

[[entry.feature]]
anchor = "arcane-bond"
head = "Arcane Bond (Ex)"
listed = true
print = "When a spirit whisperer chooses an arcane bond, he must choose the familiar arcane bond, and the familiar gains the spirit animal ability of his selected spirit (see spirit link, below). The spirit whisperer does not need a spellbook, but instead stores and prepares his spell by communing with the familiar as the [witch's](ref/class/witch) familiar class feature. This ability alters arcane bond and replaces the spellbooks class feature."
import_trades = ["Arcane bond", "Arcane bond", "Spellbook", "Spellbook"]

[[entry.feature]]
anchor = "spirit-link"
head = "Spirit Link (Su)"
listed = true
level = 1
print = "At 1st level, a spirit whisperer forms a mystical bond with a spirit. The spirit whisperer picks a spirit from the [shaman's list of spirits](ref/ability/shaman-spirits) (see page 37). At 1st level, he gains a spirit ability granted by that spirit. At 8th level, he gains the greater spirit ability granted by that spirit. At 20th level, the spirit whisperer gains the manifestation ability granted by the spirit. He uses his wizard level as his shaman level for determining the effects and DCs of abilities granted by the spirit. In addition, he uses his Intelligence modifier in place of his Wisdom modifier for these abilities. He does not gain hexes, spirit magic spells, or the true spirit ability typically granted to a shaman by these spirits. This ability replaces arcane school and the bonus feat gained at 20th level."
import_trades = ["Arcane school, 20th-level bonus feat", "Arcane school", "20th-level bonus feat"]

[[entry.feature]]
anchor = "spirit-hex"
head = "Spirit Hex"
listed = true
level = 5
print = "At 5th level, a spirit whisperer can select one hex from the list of those granted by his chosen spirit. He uses his wizard level as his shaman level when determining the effects and DC of this hex. In addition, he uses his Intelligence modifier in place of his Wisdom modifier for these hexes. At 10th and 15th level, he can select another hex from those granted by his spirit. Each hex selected in this way replaces the bonus feat gained at that level. This ability alters bonus feats."
import_trades = ["5th-, 10th-, and 15th-level bonus feats", "5th-", "10th-", "15th-level bonus feats"]
