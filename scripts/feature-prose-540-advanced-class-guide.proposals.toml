import_trades = ["The bonus spells gained at 4th, 6th, 8th, 12th, 16th, and 18th levels from the oracle's mystery", "The bonus spells gained at 4th", "6th", "8th", "12th", "16th", "18th levels from the oracle's mystery"]

[[entry.feature]]
anchor = "inspiration"
head = "Inspiration (Ex)"
listed = true
level = 2
print = "At 2nd level, a psychic searcher gains an inspiration pool, as the [investigator](ref/class/investigator) class ability. A psychic searcher uses her oracle level as her investigator level to determine the effects of this ability. She gains free uses of inspiration on Diplomacy, Knowledge (arcana, history, local, nobility, planes, religion), and Sense Motive skill checks without spending a use of inspiration, provided she's trained in that skill. A psychic searcher's inspiration pool refreshes each day, usually when she refreshes her spells. A psychic searcher's inspiration pool is based on her Charisma modifier, not her Intelligence modifier. This ability replaces the mystery spell gained at 2nd level."
import_trades = ["Mystery spell gained at 2nd level", "Mystery spell gained at 2nd level"]

[[entry.feature]]
anchor = "psychic-talent"
head = "Psychic Talent (Su)"
listed = true
level = 3
print = "At 3rd level, a psychic searcher's mastery of her supernatural insight grows, granting her a new investigator talent from the following list: [amazing inspiration](ref/invtalent/amazing-inspiration), [eidetic recollection](ref/invtalent/eidetic-recollection), [empathy](ref/invtalent/empathy), [inspired alertness](ref/invtalent/inspired-alertness), [item lore](ref/invtalent/item-lore), [perceptive tracking](ref/invtalent/perceptive-tracking) (except using Sense Motive instead of Perception or Survival), [rogue talent](ref/invtalent/rogue-talent) (only for [hard to fool](ref/talent/hard-to-fool)), and [tenacious inspiration](ref/invtalent/tenacious-inspiration). Whenever a psychic searcher can select a new revelation, she can instead select an investigator or rogue talent from the above list. This ability replaces the revelation gained at 3rd level."
import_trades = ["Revelations gained after 3rd level", "Revelations gained after 3rd level", "Revelation gained at 3rd level", "Revelation gained at 3rd level"]

[[entry.feature]]
anchor = "recommended-mysteries"
head = "Recommended Mysteries"
listed = false
print = "[Ancestor](ref/mystery/ancestor), [lore](ref/mystery/lore), [nature](ref/mystery/nature)."

[[entry]]
id = "ref/arc-skald/spell-warrior"
hold = "checker: [fields] trades = \"replaces: Inspired rage\" disagrees with the trade sentences of the feature `enhance-weapons` = \"replaces: the inspired rage raging song\" (line 52)"
opening = ["The spell warrior uses his arcane knowledge rather than his rage to turn the tide of battle in favor of himself and his allies. With a clash of bracers and a sonorous chant, the Spell Warrior's song reaches out to touch the weapons of his allies, lending them arcane power. While his song does not inspire rage, he can use the power of his music to enchant the weapons of his allies and counter the spells of his foes."]

[[entry.feature]]
anchor = "improved-counterspell"
head = "Improved Counterspell"
listed = true
level = 1
print = "At 1st level, the spell warrior receives the [Improved Counterspell](ref/feat/improved-counterspell) feat as a bonus feat. This ability replaces Scribe Scroll."
import_trades = ["Scribe Scroll", "Scribe Scroll"]

[[entry.feature]]
anchor = "weapon-song"
head = "Weapon Song (Su)"
listed = true
print = "A spell warrior gains the following raging song, allowing him to grant his ally's weapons enhancement bonuses and special powers."

[[entry.feature]]
anchor = "enhance-weapons"
head = "Enhance Weapons (Su)"
listed = true
level = 1
print = '''
At 1st level, the spell warrior can grant a +1 enhancement bonus to the weapons (including ammunition) of allies within 60 feet. At 5th level and every 5 levels thereafter, this enhancement bonus increases by 1. The maximum bonus gained is based upon the number of weapons affected: +5 to one weapon, +4 to two weapons, +3 to three weapons, or +2 to four or more weapons. Fifty pieces of ammunition count as one weapon for this purpose. The wielder of a weapon enhanced by this raging song counts as if he were under the effect of an inspired rage raging song for all purposes involving the skald's rage powers.

These bonuses can also be used to add any of the following weapon special abilities to the weapons enhanced by this ability: _[dancing](ref/magic-enh/dancing)_, _[defending](ref/magic-enh/defending)_, _[distance](ref/magic-enh/distance)_, _[flaming](ref/magic-enh/flaming)_, _[frost](ref/magic-enh/frost)_, _[ghost touch](ref/magic-enh/ghost-touch-weapon)_, _[keen](ref/magic-enh/keen)_, _[mighty cleaving](ref/magic-enh/mighty-cleaving)_, _[returning](ref/magic-enh/returning)_, _[shock](ref/magic-enh/shock)_, _[seeking](ref/magic-enh/seeking)_, or _[speed](ref/magic-enh/speed)_. Adding these weapon special abilities consumes an amount of bonus equal to the special ability's cost (see Table 15–9: Melee Weapon Special Abilities on page 469 of the _Core Rulebook_). These enhancement bonuses and special abilities overlap with any enhancements or special abilities the weapon already has, though duplicate special abilities do not stack. If an affected weapon is not magical, at least a +1 enhancement bonus must be added before any other special abilities can be.

The bonus and special abilities granted by this raging song are determined when the song begins, and cannot be changed until the raging song ends and another is begun. These bonuses apply to only one end of a double weapon. This ability replaces the inspired rage raging song.'''
import_trades = ["Inspired rage", "Inspired rage"]

[[entry.feature]]
anchor = "greater-counterspell"
head = "Greater Counterspell (Su)"
listed = true
level = 5
print = '''
At 5th level, the spell warrior gains increased versatility when attempting to counteract enemy spellcasting. When counterspelling, he can expend two skald spell slots of the same level or higher than the opponent's spell, regardless of the school of that spell.

At 11th level, when counterspelling an opponent's spell, the spell warrior only has to expend one skald spell slot of the level of the spell being cast.

At 17th level, the spell warrior gains [Parry Spell](ref/feat/parry-spell) as a bonus feat. The skald does not have to meet the prerequisites for this feat.

This ability replaces spell kenning.'''
import_trades = ["Spell kenning", "Spell kenning"]

[[entry.feature]]
anchor = "song-of-arcane-manipulation"
head = "Song of Arcane Manipulation (Su)"
listed = true
level = 10
print = "At 10th level, a spell warrior can sacrifice his own rage magic to counter an opponent's spell. When using raging song, he can counterspell as an immediate action without interrupting his raging song. However, in addition to expending a spell slot (or spell slots) to attempt to counter the opponent's spell, the skald must expend 1 round of raging song per spell level of the opponent's spell (for example, if attempting to counterspell a 3rd-level spell, the skald must expend one of his own 3rd-level spell slots and 3 rounds of raging song). This ability replaces the dirge of doom raging song."
import_trades = ["Dirge of doom", "Dirge of doom"]

[[entry.feature]]
anchor = "spell-tamper"
head = "Spell Tamper (Su)"
listed = true
level = 20
print = "At 20th level, when a spell warrior successfully counterspells an opponent's spell, the opponent suffers a backlash of magical energy and takes 1d6 points of damage per spell level of the countered spell. If the opponent succeeds at a Will saving throw (DC = 10 + 1/2 the skald's level + the skald's Charisma modifier), the damage is reduced by half. This damage is magical and is not subject to [damage reduction](ref/rule/damage-reduction) or energy resistance. This ability replaces master skald."
import_trades = ["Master skald", "Master skald"]

[[entry.feature]]
anchor = "rage-powers"
head = "Rage Powers"
listed = false
print = "The following rage powers complement the spell warrior archetype: clear mind, disruptive, eater of magic, elemental rage (lesser, normal, and greater), energy resistance, spell sunder, spellbreaker, sunder enchantment, superstition, and witch hunter."

[[entry]]
id = "ref/arc-summoner/naturalist"
hold = "checker: [fields] trades = \"replaces: Aspect\" disagrees with the trade sentences of the feature `second-animal-focus` = \"replaces: the aspect summoner class ability\" (line 69)"
opening = ["A naturalist is a summoner who is in tune with the natural world, using his magic like a lens to focus various animal aspects onto his eidolon. More akin to a hunter than to other arcane spellcasters, a naturalist instinctively masters the power of such creatures as the bear, wolf, mouse, or tiger to make his exotic eidolon the perfect living tool for battle or stealth, and he eventually discovers how to apply these transformations to himself as well."]

[[entry.feature]]
anchor = "nature-s-call"
head = "Nature's Call (Sp)"
listed = true
level = 1
print = "Starting at 1st level, the naturalist can cast _[summon nature's ally I](ref/spell/summon-natures-ally-1)_ as a [spell like ability](ref/umr/spell-like-abilities) a number of times per day equal to 3 + his Charisma modifier. He can only use this ability to summon creatures of the animal, magical beast, or vermin type. This ability otherwise functions as the _[summon monster I](ref/spell/summon-monster-1)_ class feature (increasing in level as the naturalist goes up in level and with the same restrictions). This ability replaces _summon monster I_."
import_trades = ["Summon monster I", "Summon monster I"]

[[entry.feature]]
anchor = "animal-focus"
head = "Animal Focus (Su)"
listed = true
level = 4
print = '''
At 4th level, as a swift action a naturalist can enhance his eidolon with the aspect of an animal. Each time he uses this ability, he can select a hunter's [animal aspect](ref/ability/animal-foci) (see page 27) and apply it to his eidolon. His hunter level for this ability is equal to his summoner level - 2. He does not gain the ability to add an animal aspect to himself (see Shared Focus, below). This effect lasts until the eidolon is dismissed or sent back to its home plane.

When an animal aspect is applied to an eidolon, its form is altered by superficial physical changes appropriate to that aspect. For example, using aspect of the [bat](ref/aspect/bat) might give the eidolon larger ears and eyes and perhaps membranes of skin connecting its limbs to its body, while using aspect of the [stag](ref/aspect/stag) might give the eidolon antlers and hoof like nails on its feat. None of these changes interfere with any of the eidolon's natural or magical abilities.

This ability replaces shield ally and greater shield ally.'''
import_trades = ["Shield ally, greater shield ally", "Shield ally", "greater shield ally"]

[[entry.feature]]
anchor = "second-animal-focus"
head = "Second Animal Focus (Su)"
listed = true
level = 10
print = "At 10th level, whenever a naturalist uses animal focus, he may apply two different animal aspects to his eidolon. The eidolon's form gains superficial physical charges appropriate to the chosen aspect. This replaces the aspect summoner class ability."
import_trades = ["Aspect", "Aspect"]

[[entry.feature]]
anchor = "shared-focus"
head = "Shared Focus (Su)"
listed = true
level = 14
print = "At 14th level, the naturalist begins to take on some of the feral nature of his eidolon. Whenever the naturalist uses animal focus to grant an aspect to his eidolon, he also gains the effects of the chosen aspect. The naturalist keeps this aspect until his eidolon is dismissed or sent back to its home plane. The naturalist gains the effects of only one aspect, even if the eidolon gains more than one (naturalist's choice). This ability replaces life bond."
import_trades = ["Life bond", "Life bond"]

[[entry.feature]]
anchor = "third-animal-focus"
head = "Third Animal Focus (Su)"
listed = true
level = 18
print = "At 18th level, whenever a naturalist uses his animal focus ability, he can apply three different animal aspects to his eidolon (one of which lasts until he decides to change it). This ability replaces greater aspect."
import_trades = ["Greater aspect", "Greater aspect"]

[[entry]]
id = "ref/arc-swashbuckler/daring-infiltrator"
hold = "checker: [fields] trades = \"alters: Bonus feats\" disagrees with the trade sentences of the text outside any feature = \"none\" (line 26)"
opening_from_print = true
opening = ["Not known for their flashy entrances or for standing out in a crowd, a daring infiltrator uses stealth, disguise, and ruthless guile to pursue her goals. Some of these swashbucklers work to undermine evil organizations, while others are master thieves or mysterious assassins."]

[[entry.feature]]
anchor = "class-skills"
head = "Class Skills"
listed = false
print = "A daring infiltrator gains Disguise and Stealth as class skills, but does not gain Diplomacy, Perform, and Profession as class skills. This alters the swashbuckler's class skill list."

[[entry.feature]]
anchor = "bonus-feats"
head = "Bonus Feats"
listed = false
print = "In addition to combat feats, a daring infiltrator's bonus feats at 4th, 8th, 12th, 16th, and 20th level can come from the following list: [Alertness](ref/feat/alertness), [Antagonize](ref/feat/antagonize), [Cosmopolitan](ref/feat/cosmopolitan), [Deceitful](ref/feat/deceitful), [Deft Hands](ref/feat/deft-hands), Disarming Threat\\*, [Persuasive](ref/feat/persuasive), [Prodigy](ref/feat/prodigy), and [Skill Focus](ref/feat/skill-focus). (Those marked with an asterisk \\[\\*\\] are detailed in this book.) This alters the bonus feat class ability."
import_trades = ["Bonus feats", "Bonus feats"]

[[entry.feature]]
anchor = "quick-tongued"
head = "Quick-Tongued (Ex)"
listed = true
level = 2
print = "At 2nd level, a daring infiltrator gains a +1 bonus on Bluff checks. This bonus increases by 1 for every 4 levels beyond 2nd. This ability replaces charmed life."
import_trades = ["Charmed life", "Charmed life"]

[[entry.feature]]
anchor = "deeds"
head = "Deeds"
listed = true
print = "A daring infiltrator gains the following deeds, each of which replaces an existing deed."

[[entry.feature]]
anchor = "clandestine-expertise"
head = "Clandestine Expertise (Ex)"
listed = true
level = 3
print = "At 3rd level, a daring infiltrator with at least 1 panache point gains a +2 bonus on Disguise and Stealth checks. Also, as long as she has at least 1 panache point, when she successfully aids another with a Disguise or Stealth check, she grants the subject a +4 bonus on the skill check instead of the normal +2. This deed replaces swashbuckler initiative."
import_trades = ["Swashbuckler initiative", "Swashbuckler initiative"]

[[entry.feature]]
anchor = "silence-is-golden"
head = "Silence Is Golden (Ex)"
listed = true
level = 3
print = "At 3rd level, when a daring infiltrator with at least 1 panache point succeeds at a [trip](ref/rule/trip) or [grapple](ref/rule/grapple) combat maneuver check, the target is rendered mute for 1 round. For every 5 by which the result of the combat maneuver check exceeds the opponent's CMD, the target remains mute for an additional round. A mute creature cannot speak, use language-dependent effects or verbal components, or use command words. This deed replaces menacing swordplay."
import_trades = ["Menacing swordplay", "Menacing swordplay"]

[[entry.feature]]
anchor = "authoritative-bluff"
head = "Authoritative Bluff (Ex)"
listed = true
level = 11
print = "At 11th level, a daring infiltrator can spend 1 panache point to reroll a Bluff check after the roll is made but before the results are revealed. She must take the result of the second roll, even if it is lower. Additionally, a daring infiltrator with at least 1 panache point gains a +5 bonus on Bluff checks to pretend to be someone's superior (socially or in the military). If she succeeds at the check, the target obeys any reasonable orders she gives as it would those of an actual superior in the situation. This deed replaces bleeding wound."
import_trades = ["Bleeding wound", "Bleeding wound"]
