[[entry]]
id = "ref/arc-alchemist/inspired-chemist"
hold = "checker: [fields] trades = \"replaces: Mutagen\" disagrees with the trade sentences of the feature `inspiring-cognatogen` = \"replaces: the mutagen class ability\" (line 33)"
opening = ["Akin to a mindchemist, inspired chemists use a type of cognatogen that instead of increasing their mental ability scores grants them inspiration like an investigator. This inspiration also grants an inspired chemist amazing powers to avoid danger, but takes a toll on both physical power and health."]

[[entry.feature]]
anchor = "inspiring-cognatogen"
head = "Inspiring Cognatogen"
listed = true
level = 1
print = "At 1st level, an inspired chemist learns how to create an [inspiring cognatogen](ref/discovery/inspiring-cognatogen), as the inspiring cognatogen discovery. This ability replaces the [mutagen](ref/discovery/mutagen) class ability. (This means that an inspired chemist cannot create mutagens unless he selects the mutagen discovery)."
import_trades = ["Mutagen"]

[[entry.feature]]
anchor = "bonus-feats"
head = "Bonus Feats"
listed = false
print = "An inspired chemist can select [Skill Focus](ref/feat/skill-focus) (Disable Device, Disguise, Heal, any Knowledge skill, Sense Motive, Spellcraft, or Use Magic Device) in place of a discovery."

[[entry.feature]]
anchor = "bonus-investigator-talents"
head = "Bonus Investigator Talents"
listed = true
print = "An inspired chemist can select any two investigator talents in place of a discovery, but can only use these talents while under the effect of an inspiring cognatogen."

[[entry.feature]]
anchor = "languages"
head = "Languages"
listed = true
print = "An inspired chemist can learn three languages in place of a discovery."

[[entry.feature]]
anchor = "discoveries"
head = "Discoveries"
listed = false
print = "The following discoveries complement the inspired chemist archetype: [grand inspiring cognatogen](ref/discovery/grand-inspiring-cognatogen), [greater inspiring cognatogen](ref/discovery/greater-inspiring-cognatogen), and [inspired bomb](ref/discovery/inspired-bomb)."

[[entry]]
id = "ref/arc-arcanist/blood-arcanist"
hold = "checker: [fields] trades = \"replaces: Arcanist exploits gained at 1st, 3rd, 9th, and 15th levels; replaces: magical supremacy\" disagrees with the trade sentences of the feature `bloodline` = \"replaces: the arcanist exploits gained at 1st, 3rd, 9th, and 15th levels, as well as magical supremacy\" (line 31)"
opening = ["Though most arcanists possess only a rudimentary innate arcane gift, the blood arcanist has the full power of a bloodline to draw upon."]

[[entry.feature]]
anchor = "bloodline"
head = "Bloodline"
listed = true
print = '''
A blood arcanist selects one bloodline from those available through the [sorcerer bloodline](ref/ability/sorcerer-bloodlines) class feature. The blood arcanist gains the bloodline arcana and bloodline powers of that bloodline, treating her arcanist level as her sorcerer level. The blood arcanist does not gain the class skill, bonus feats, or bonus spells from her bloodline.

If the blood arcanist takes levels in another class that grants a bloodline, the bloodlines must be the same type, even if that means that the bloodline of one of her classes must change. Subject to GM discretion, the blood arcanist can change her former bloodline to make them conform.

This ability replaces the arcanist exploits gained at 1st, 3rd, 9th, and 15th levels, as well as magical supremacy. A blood arcanist cannot select the [bloodline development](ref/exploit/bloodline-development) arcanist exploit.'''
import_trades = ["Arcanist exploits gained at 1st", "3rd", "9th", "15th levels", "magical supremacy"]

[[entry]]
id = "ref/arc-bard/voice-of-the-wild"
hold = "checker: [fields] trades = \"replaces: Countersong; replaces: versatile performance; replaces: jack-of-all-trades\" disagrees with the trade sentences of the feature `nature-magic` = \"replaces: countersong, all instances of versatile performance, and jack-of-all-trades\" (line 47)"
opening = ["Most bards are inspired by the art of civilization, yet the voice of the wild's muse is the grandeur and beauty of nature. The voice of the wild has discovered some of nature's magical secrets, and can use his performance to bring out the bestial side in his allies."]

[[entry.feature]]
anchor = "wild-knowledge"
head = "Wild Knowledge (Ex)"
listed = true
level = 1
print = '''
At 1st level, a voice of the wild adds 1/2 his level (minimum 1)

to all Knowledge (nature) checks. He can use Knowledge (geography) and Knowledge (nature) untrained. This ability replaces bardic knowledge.'''
import_trades = ["Bardic knowledge"]

[[entry.feature]]
anchor = "nature-magic"
head = "Nature Magic"
listed = true
level = 1
print = "At 1st level, a voice of the wild can select a 1st-level druid or ranger spell as a bard spell known instead of a spell from the bard spell list. The voice of the wild can select another druid or ranger spell (of any bard spell level he can cast) at 4th, 7th, 10th, 13th, and 16th levels. If he chooses to learn a new spell in place of an old one, he can exchange a druid or ranger spell for another. This ability replaces countersong, all instances of versatile performance, and jack-of-all-trades."
import_trades = ["Countersong", "versatile performance", "jack-of-all-trades"]

[[entry.feature]]
anchor = "bardic-performance"
head = "Bardic Performance"
listed = true
print = "Voices of the wild gain the following bardic performance."

[[entry.feature]]
anchor = "song-of-the-wild"
head = "Song of the Wild (Su)"
listed = true
level = 3
print = '''
At 3rd level, the voice of the wild can use bardic performance to grant an animal aspect to an ally, as if using the hunter's [animal focus](ref/ability/animal-foci) class feature.

The ally must be able to hear or see the performance. The voice of the wild uses his bard level as his hunter level for determining the effect of the animal aspect.

The bard can affect a second ally with this performance at 10th level and a third at 17th level. Song of the wild relies on audible or visual components. This ability replaces all increments of inspire competence, dirge of doom, and inspire heroics.'''
import_trades = ["Inspire competence", "dirge of doom", "inspire heroics"]

[[entry]]
id = "ref/arc-bloodrager/blood-conduit"
hold = "the alters trade `Bloodline feats` is not printed in a sentence, and no listed feature of that name prints it"
opening = ["Blood conduits learn to channel their arcane might directly through their flesh, without the need for mystical words or gestures."]

[[entry.feature]]
anchor = "contact-specialist"
head = "Contact Specialist (Ex)"
listed = true
level = 1
print = "At 1st level, a blood conduit selects a bonus feat from the following: [Improved Bull Rush](ref/feat/improved-bull-rush), [Improved Grapple](ref/feat/improved-grapple), [Improved Reposition](ref/feat/improved-reposition), [Improved Trip](ref/feat/improved-trip), and [Improved Unarmed Strike](ref/feat/improved-unarmed-strike). He does not need to meet the prerequisites to take this feat. He also adds those feats to his list of bloodline feats. This ability replaces fast movement and alters bloodline feats."
import_trades = ["Bloodline feats", "Fast movement"]

[[entry.feature]]
anchor = "spell-conduit"
head = "Spell Conduit (Su)"
listed = true
level = 5
print = "At 5th level, as long as a blood conduit is wearing light or no armor, he can deliver bloodrager spells with a range of touch through bodily contact. When he succeeds at a [combat maneuver](ref/rule/combat-maneuvers) check to bull rush, grapple, pin, reposition, or trip an opponent, or makes an unarmed strike against an enemy, he can as a swift action cast a touch spell on the creature that he affected with the combat maneuver, requiring no further touch attack roll. If this spell would usually require a successful touch attack, his successful combat maneuver check counts as this attack. This ability replaces uncanny dodge and improved uncanny dodge."
import_trades = ["Uncanny dodge", "improved uncanny dodge"]

[[entry.feature]]
anchor = "reflexive-conduit"
head = "Reflexive Conduit (Ex)"
listed = true
level = 14
print = "At 14th level, a blood conduit can discharge his power into foes that attempt bodily contact with him. While wearing light or no armor, when the blood conduit is subject to a combat maneuver check made to bull rush, grapple, pin, reposition, or trip him, as an immediate action he can target his attacker with a bloodrager spell that has a range of touch. If the spell would normally require a touch attack, a blood conduit can attempt a combat maneuver check for this attack instead. This ability replaces indomitable will."
import_trades = ["Indomitable will"]

[[entry]]
id = "ref/arc-gunslinger/bolt-ace"
hold = "the replaces trade `Gunsmith` is not printed in a sentence, and no listed feature of that name prints it"
opening = ["While gunslingers are full of sound and fury, there is a class of gunslingers that never soil their hands with powder or feel the sting of gun smoke. They commit their deeds in a more hushed manner, but with just as much flair."]

[[entry.feature]]
anchor = "crossbow-maven"
head = "Crossbow Maven"
listed = true
print = "A bolt ace is proficient with all crossbows instead of all firearms and begins play with a masterwork crossbow of her choice. This ability alters the gunslinger's weapon proficiencies and replaces gunsmith."

[[entry.feature]]
anchor = "grit"
head = "Grit (Ex)"
listed = true
print = "A bolt ace regains grit when she scores a critical hit or deals a killing blow with any kind of crossbow. This ability modifies the grit class feature."
import_trades = ["Grit"]

[[entry.feature]]
anchor = "deeds"
head = "Deeds"
listed = true
print = "A bolt ace can perform the following deeds with a crossbow instead of a firearm: [gunslinger initiative](ref/deed/gunslinger-initiative), [pistol-whip](ref/deed/pistol-whip), [dead shot](ref/deed/dead-shot), targeting, [bleeding wound](ref/deed/bleeding-wound), [death's shot](ref/deed/deaths-shot), and [stunning shot](ref/deed/stunning-shot). The bolt ace swaps the following deeds."

[[entry.feature]]
anchor = "sharp-shoot"
head = "Sharp Shoot (Ex)"
listed = true
level = 1
print = "At 1st level, a bolt ace can resolve an attack against touch AC instead of normal AC when firing a crossbow at a target within its first range increment. Performing this deed costs 1 grit point. This deed's cost cannot be reduced by any ability or effect that reduces the amount of grit points a deed costs (such as [Signature Deed](ref/feat/signature-deed)). This deed replaces deadeye."
import_trades = ["Deadeye"]

[[entry.feature]]
anchor = "vigilant-loading"
head = "Vigilant Loading (Ex)"
listed = true
level = 1
print = "At 1st level, as long as a bolt ace has at least 1 grit point, she does not provoke attacks of opportunity when loading a crossbow. This deed replaces quick clear."
import_trades = ["Quick clear"]

[[entry.feature]]
anchor = "shooter-s-resolve"
head = "Shooter's Resolve (Ex)"
listed = true
level = 3
print = "At 3rd level, a bolt ace can spend 1 grit point when making a crossbow attack as a standard action and ignore the effects of [concealment](ref/rule/concealment) (though not total concealment) and [cover](ref/rule/cover) (other than total cover) against that shot. This deed replaces utility shot."
import_trades = ["Utility shot"]

[[entry.feature]]
anchor = "distracting-shot"
head = "Distracting Shot (Ex)"
listed = true
level = 7
print = "At 7th level, a bolt ace can spend 1 grit point and choose to miss a target that she could normally attack within her range with a crossbow attack. When she does, the target loses its Dexterity bonus to AC (if any) for 1 round. This deed replaces startling shot."
import_trades = ["Startling shot"]

[[entry.feature]]
anchor = "vigilant-shooter"
head = "Vigilant Shooter (Ex)"
listed = true
level = 11
print = "At 11th level, as long as a bolt ace spends 1 grit point when she does so, she does not provoke attacks of opportunity when firing a crossbow. This deed replaces expert loading."
import_trades = ["Expert loading"]

[[entry.feature]]
anchor = "inexplicable-reload"
head = "Inexplicable Reload (Ex)"
listed = true
level = 11
print = "At 11th level, loading a crossbow becomes unthinking and automatic for a bolt ace. As long as she has at least 1 grit point, she always starts each round of combat (even a surprise round) with her crossbow loaded. Also the amount of time needed to reload a crossbow decreases by one step: a standard action becomes a move action, a move action becomes a swift action, a swift action becomes a free action, and a free action becomes not an action. This deed replaces lightning reload."
import_trades = ["Lightning reload"]

[[entry.feature]]
anchor = "pinning-shot"
head = "Pinning Shot (Ex)"
listed = true
level = 15
print = "At 15th level, the bolt ace can spend 1 grit point while shooting a crossbow and attempt to pin down its target with the bolt. If the crossbow attack hits, it pins the target to a nearby object, to a wall, or to the ground, [entangling](ref/rule/entangled) and [staggering](ref/misc/staggered) the target. While pinned by the bolt, the target cannot move out of its space until it takes a standard action to free itself from the pinning bolt, except by means of teleportation. This deed replaces menacing shot."
import_trades = ["Menacing shot"]

[[entry.feature]]
anchor = "crossbow-training"
head = "Crossbow Training (Ex)"
listed = true
level = 5
print = '''
Starting at 5th level, a bolt ace can select one specific type of crossbow, such as [hand crossbow](ref/eq-weapon/hand-crossbow) or [heavy crossbow](ref/eq-weapon/heavy-crossbow). She gains a bonus on damage rolls equal to her Dexterity modifier with that crossbow. Furthermore, when she scores a critical hit with that type of crossbow, her critical modifier increases by 1 (a ×2 becomes a ×3, for example).

Every 4 levels thereafter, she can pick a different type of crossbow, gaining the bonus damage and increased critical multiplier with that type of crossbow as well. This ability replaces gun training.'''
import_trades = ["Gun training"]

[[entry]]
id = "ref/arc-hunter/feral-hunter"
hold = "the replaces trade `Hunter tactics` is not printed in a sentence, and no listed feature of that name prints it; the replaces trade `speak with master` is not printed in a sentence, and no listed feature of that name prints it"
opening = ["A feral hunter has forged a bond with nature that's so strong that she doesn't merely channel the aspects of animals— she actually becomes an animal herself. Though she lacks an animal companion, a feral hunter is in tune with the beast lurking within her flesh and spirit, and lives in a near-wild state of being. A feral hunter often resembles a lycanthrope, but her power comes from her own nature and is not influenced by moonlight or silver."]

[[entry.feature]]
anchor = "solitary"
head = "Solitary"
listed = true
print = "Unlike most hunters, a feral hunter does not gain an animal companion."

[[entry.feature]]
anchor = "feral-focus"
head = "Feral Focus (Su)"
listed = true
level = 1
print = '''
At 1st level, a feral hunter gains a limited ability to change her shape into hybrid animal forms. This functions as the animal focus class feature, except that the hunter always applies the animal aspect to herself, and there is no limit to this ability's duration. She can end this ability as a free action.

When a feral hunter uses this ability, her body takes on cosmetic aspects of an animal, such as furry skin, longer nails, elongated teeth, and oddly colored eyes; these changes do not grant her any abilities other than what is stated in the animal focus, and end when she takes on a different aspect or ends the ability. This physical change is a [polymorph](ref/spelldef/polymorph) effect, though the effects of the animal focus are not.

This ability alters animal focus and replaces the hunter tactics and speak with master class abilities.'''
import_trades = ["Animal focus", "Hunter tactics", "speak with master"]

[[entry.feature]]
anchor = "precise-summoned-animal"
head = "Precise Summoned Animal (Ex)"
listed = true
print = "This functions like the precise companion class ability, except the hunter grants all her teamwork feats to all animals she summons with _[summon nature's ally](ref/spell/summon-natures-ally)_. This ability alters precise companion."
import_trades = ["Precise companion"]

[[entry.feature]]
anchor = "wild-shape"
head = "Wild Shape (Su)"
listed = true
level = 4
print = "At 4th level, a feral hunter gains the ability to change shape. This ability functions like the [druid](ref/class/druid) wild shape ability, except the hunter can take only animal forms (not elemental or plant forms). The hunter's effective druid level is equal to her class level. This ability replaces the bonus tricks, improved empathic link, greater empathic link, master of the wild, and raise animal companion class abilities."
import_trades = ["Bonus tricks", "improved empathic link", "greater empathic link", "master of the wild", "raise animal companion"]

[[entry.feature]]
anchor = "summon-pack"
head = "Summon Pack (Sp)"
listed = true
level = 6
print = "Starting at 6th level, whenever a feral hunter casts a _[summon nature's ally](ref/spell/summon-natures-ally)_ spell to summon one or more animals, she summons one additional animal of the same type. The summoned creature or creatures must be animals and must be of the same type as the hunter's current aspect or of a similar type (bears for bear aspect, dogs or wolves for wolf aspect, great cats for the tiger aspect, and so on). The additional creature immediately vanishes if the hunter chooses a different aspect or ends his feral focus ability. She can increase the duration of any one [summon nature's ally](ref/spell/summon-natures-ally) spell affected by this ability to 1 minute per level. She can have only one spell with a duration increased by this ability active at a time. This ability replaces the teamwork feats gained at 6th, 9th, 12th, 15th, and 18th levels."
import_trades = ["Teamwork feats gained at 6th", "9th", "12th", "15th", "18th levels"]

[[entry]]
id = "ref/arc-hunter/packmaster"
hold = "the alters trade `Precise companion` is not printed in a sentence, and no listed feature of that name prints it; the alters trade `woodland stride` is not printed in a sentence, and no listed feature of that name prints it"
opening = ["Some hunters form bonds with packs of well-trained creatures. Whether such a hunter is a northern berserker running with a pack of timber wolves or a savage warrior dashing through the jungle alongside her herd of dimetrodons, the packmaster revels in the thrill of the hunt and the glory of the kill. A packmaster is more comfortable in groups than alone, and although her animal companions may be weaker than a typical hunter's, what they lack in strength they make up for in numbers."]

[[entry.feature]]
anchor = "pack-bond"
head = "Pack Bond (Ex)"
listed = true
print = '''
A packmaster can have more than one animal companion, but she must divide her effective druid level between her companions to determine the abilities of each one. For example, a 4th-level packmaster can have one 4th-level animal companion, two 2nd-level companions, one 3rd-level companion and one 1st-level companion, or four 1st-level companions.

When a packmaster gains a level, she must decide how to allocate the increase among her animal companions, including whether or not to add a new 1st-level companion. Once a hunter level is allocated to a particular companion, it cannot be redistributed while that companion is in the packmaster's service. She must release the companion or wait until the companion dies to allocate its levels to another companion, which she can then do the next time she refreshes her spell slots for the day. The share spells animal companion ability applies to only one animal companion at a time—the packmaster cannot use it to cast a spell that affects only a single target and have the spell affect all of her animal companions.

A packmaster's precise companion, woodland stride, and teamwork feats apply to only one of her animal companions at a time. (For example, a packmaster can apply precise companion to one companion, woodland stride to another, and a given teamwork feat to a third, but cannot apply any of those to two animal companions at once.) As a swift action, she can change which companion gains any or all of these benefits. This ability replaces animal companion.'''
import_trades = ["Precise companion", "woodland stride", "teamwork feats", "Animal companion"]

[[entry.feature]]
anchor = "pack-focus"
head = "Pack Focus (Su)"
listed = true
print = "This ability functions like [animal focus](ref/ability/animal-foci), with the following exceptions. A packmaster can apply her animal aspect to only one of her animal companions at a time without it counting against the number of minutes per day she can use that ability. When using animal focus on herself or her other animal companion, the ability counts against her minutes per day as normal. She can have only two animal aspects in effect at a time—one that counts against her minutes per day and one that doesn't—and they can't both target the same companion. Unless both her companions are dead, the hunter can't apply the companion's aspect to herself (and thereby gain the benefit of its unlimited duration). This ability replaces animal focus."
import_trades = ["Animal focus"]

[[entry.feature]]
anchor = "teamwork-feat"
head = "Teamwork Feat (Ex)"
listed = true
level = 3
print = "At 3rd level or any level at which a packmaster would gain a bonus teamwork feat, she can instead increase the number of her animal companions that gain the benefits of her precise companion, woodland stride, and teamwork feats by 1. She can select this ability multiple times. This ability alters teamwork feats."
import_trades = ["Teamwork feats"]

[[entry.feature]]
anchor = "second-pack-focus"
head = "Second Pack Focus (Su)"
listed = true
level = 8
print = "At 8th level, the hunter gains an ability that functions like the second animal focus, but the hunter can either assign each companion one aspect each or assign both aspects to the same companion. The foci on the companions don't need to be the same, nor do they need to be the same as the one assigned to the packmaster. This ability replaces second animal focus."
import_trades = ["Second animal focus"]

[[entry.feature]]
anchor = "master-of-the-pack"
head = "Master of the Pack (Ex)"
listed = true
level = 20
print = "At 20th level, a packmaster and her animal companions can always move at full speed while using Survival to follow tracks without penalty. Each day when a packmaster gains new spells for the day, she chooses one animal focus to be active on herself or one of her animal companions for the entire day (if all of her animal companions are dead, she instead chooses two animal foci to be active on herself for the entire day). This focus is in addition to her pack focus class ability. This ability replaces master hunter."
import_trades = ["Master hunter"]

[[entry]]
id = "ref/arc-hunter/verminous-hunter"
hold = "the alters trade `hunter tactics` is not printed in a sentence, and no listed feature of that name prints it"
opening = ["A verminous hunter calls on the ceaseless, single-minded dedication of vermin to hunt and overwhelm her prey. Where other hunters invoke the cunning, animalistic powers of the alpha predators, she calls on the powers of the lowest life forms, reaching out to the spider instead of the monkey, the mantis instead of the snake, or the moth instead of the owl."]

[[entry.feature]]
anchor = "vermin-companion"
head = "Vermin Companion (Ex)"
listed = true
level = 1
print = "At 1st level, a verminous hunter must choose a vermin companion instead of an animal companion (_Ultimate Magic_ 36). This ability alters animal companion. The hunter tactics class ability allows a verminous hunter to grant her teamwork feats to a mindless vermin companion."
import_trades = ["Animal companion", "hunter tactics"]

[[entry.feature]]
anchor = "vermin-empathy"
head = "Vermin Empathy (Ex)"
listed = true
print = "A verminous hunter gains the wild empathy ability, but can use it only to influence vermin (not animals or magical beasts). This ability alters wild empathy."
import_trades = ["Wild empathy"]

[[entry.feature]]
anchor = "vermin-focus"
head = "Vermin Focus (Su)"
listed = true
print = "A verminous hunter can take on the aspect of a vermin. This functions as [animal focus](ref/ability/animal-foci), but allows only the following choices."

