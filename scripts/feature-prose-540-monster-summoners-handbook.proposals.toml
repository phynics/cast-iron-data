[[entry]]
id = "ref/arc-bloodrager/ancestral-harbinger"
opening = ["While all bloodragers tap into their bloodlines to fuel the arcane energies they use in battle, some have the ability to call directly to the spirits of their ancestors to aid them, summoning spirits to fight for them or inspire their allies. Ancestral harbingers are particularly common among Shoanti bloodragers and among Bonuwat tribes living along the coast of western Garund."]

[[entry.feature]]
anchor = "spirit-guardian"
head = "Spirit Guardian (Sp)"
listed = true
level = 2
print = '''
At 2nd level, an ancestral harbinger can call upon her ancestors to aid her in combat, summoning a weapon of force that functions as per _[spiritual weapon](ref/spell/spiritual-weapon)_. At 6th level, her ancestral spirit can take the form of a savage creature, functioning as per _[summon nature's ally II](ref/spell/summon-natures-ally-2) (_this can't be used to summon multiple creatures from the _[summon nature's ally I](ref/spell/summon-natures-ally-1)_ list). At 12th level, her ancestor can manifest physically as a ghostly figure, functioning as per _[spiritual ally](ref/spell/spiritual-ally)_. At 18th level, her ancestral spirit can manifest either as a single powerful creature or as multiple lesser ancestors, functioning as per _[summon nature's ally VI](ref/spell/summon-natures-ally-6)_. The harbinger chooses which spell this ability functions as at the time of casting, and can use this ability while in a bloodrage. The ancestral harbinger can use this ability once per day, plus an additional time per day for every 4 bloodrager levels she possesses beyond 2nd.

This ability replaces uncanny dodge and the bloodline feats gained at 6th and 18th levels.'''
import_trades = ["Uncanny dodge, bloodline feats gained at 6th and 18th levels", "Uncanny dodge", "bloodline feats gained at 6th", "18th levels"]

[[entry.feature]]
anchor = "spirit-servants"
head = "Spirit Servants"
listed = true
level = 5
print = '''
At 5th level, an ancestral harbinger adds _[summon monster](ref/spell/summon-monster) I_ to her class spell list and gains it as a bonus spell known. She also gains _summon monster II_ at 8th level, _summon monster III_ at 11th level, and _summon monster IV_ at 14th level. These spells can be used only to summon types of monsters with strong ties to the ancestral harbinger's family history, ranging from clan totems to monsters of the same type as those famously killed by her forebears. For each of these spells, the ancestral harbinger selects a number of monsters she can summon equal to her Charisma bonus (minimum 1) to represent these spirits. These monsters are selected from the options on the _summon monster_ creature list or the expanded summoning list (see page 28) that are appropriate for the spell level. At 7th level and every 2 bloodrager levels thereafter, the ancestral harbinger can swap one selected monster from one of these spells for a new monster from the same level's summoning lists.

The ancestral harbinger has a mystic tie to the spirit servants summoned with this ability. When the ancestral harbinger is in a bloodrage, all of her spirit servants gain a +2 morale bonus to AC and on attack rolls, damage rolls, and saving throws. The spirit servants also gain 2 [temporary hit points](ref/rule/temporary-hit-points) per Hit Die. At 11th level, the morale bonus increases to +3 and the number of temporary hit points per Hit Die increases to 3. At 20th level, the morale bonus increases to +4 and the number of temporary hit points per Hit Die increases to 4. The morale bonus and temporary hit points last until the bloodrage ends. This ability replaces improved uncanny dodge and the bloodline feat gained at 12th level.'''
import_trades = ["Improved uncanny dodge, the bloodline feat gained at 12th level", "Improved uncanny dodge", "the bloodline feat gained at 12th level"]

[[entry]]
id = "ref/arc-cleric/herald-caller"
opening = ["Unlike warpriests or paladins, who charge headlong into battle in the name of their patron deities, herald callers are adept at calling powerful outsiders to aid their brethren in battle."]

[[entry.feature]]
anchor = "skill-ranks-per-level"
head = "Skill Ranks per Level"
listed = false
print = "4 + Int modifier. This alters the cleric's class skills."
import_trades = ["Class skills"]

[[entry.feature]]
anchor = "dedicated-summoner"
head = "Dedicated Summoner"
listed = true
level = 1
print = "A herald caller depends on summoned allies to overcome her foes, which affords her little experience with the martial pursuits typical of other clerics and a narrower spiritual focus. A herald caller can choose only one domain from her deity's list of domains, rather than the normal two domains, and she doesn't gain proficiency with medium armor or shields. This ability alters the cleric's domains and armor proficiencies."
import_trades = ["Domains, armor proficiencies", "Domains", "armor proficiencies"]

[[entry.feature]]
anchor = "call-heralds"
head = "Call Heralds (Su)"
listed = true
print = "A herald caller can channel stored spell energy into summoning spells that she hasn't prepared ahead of time. She can lose a prepared spell in order to cast any _[summon monster](ref/spell/summon-monster)_ spell of the same level or lower. She gains a +1 bonus on [concentration](ref/rule/concentration) checks to cast a _[summon monster](ref/spell/summon-monster)_ spell defensively. This bonus increases to +2 at 5th level, and increases by 1 every 5 cleric levels thereafter."

[[entry.feature]]
anchor = "divine-heralds"
head = "Divine Heralds (Su)"
listed = true
print = '''
A herald caller can use _[summon monster](ref/spell/summon-monster)_ spells only to summon creatures particularly appropriate to her deity. This includes all creatures listed as _[summon monster](ref/spell/summon-monster)_ options for priests of her deity (see Expanded Summoning for Priests on page 30), creatures whose alignment matches at least one aspect of her deity's alignment, and creatures of an elemental subtype that matches a domain granted by the deity (if any). When summoning a creature that is normally summoned with the [celestial](ref/template/celestial) or [fiendish](ref/template/fiendish) template, a herald caller of a chaotic deity can instead summon it with the [entropic](ref/template/entropic) template, and a herald caller of a lawful deity can instead summon it with the [resolute](ref/template/resolute) template (see pages 292–293 of _Pathfinder RPG Bestiary 2_ for more information on these simple templates).

Because of these summoned monsters' strong ties to the herald caller's deity, the herald caller also gains specific benefits with creatures she summons with _[summon monster](ref/spell/summon-monster)_ spells gained from her cleric spell list. The herald caller and her summoned monsters can understand each other's spoken words as if they shared a common language (though this doesn't give summoned monsters the ability to speak if they normally lack it). Whenever the herald caller uses channel energy to heal, she can include all of her summoned monsters, even if they are out of her normal channel energy radius or of a creature type that would not normally be affected. If she channels energy to deal damage, she can exclude any of her summoned monsters that would normally be affected.'''

[[entry.feature]]
anchor = "mighty-heralds"
head = "Mighty Heralds"
listed = true
level = 4
print = "At 4th level, a herald caller receives [Augment Summoning](ref/feat/augment-summoning) as a bonus feat, and is considered to have [Spell Focus](ref/feat/spell-focus) (conjuration) for the purposes of prerequisites for feats that have Augment Summoning as a prerequisite (such as [Evolved Summoned Monster](ref/feat/evolved-summoned-monster) on page 146 of the P_athfinder RPG Advanced Class Guide_). At 8th level, she gains [Superior Summoning](ref/feat/superior-summoning) as a bonus feat."

[[entry]]
id = "ref/arc-druid/elemental-ally"
opening = ["An elemental ally is a druid who has crafted powerful bonds of trust and friendship with one ally from each of the four primary elemental planes. Elemental allies are most common in Qadira, where they are considered similar to genie-binders."]

[[entry.feature]]
anchor = "elemental-eidolons"
head = "Elemental Eidolons"
listed = true
level = 1
print = '''
At 1st level, an [elemental](ref/eidolon/elemental) ally has four elemental eidolons she can summon, one each for the elements of air, earth, fire, and water. Their abilities and statistics are determined using the rules for elemental eidolons for the summoner class from page 33 of _Pathfinder RPG Pathfinder Unchained_, as if the elemental ally were a summoner of her druid level, except they gain no additional evolution pool (just those evolutions from their base form and base evolutions from their subtype).

Each of the four elementals has its own base form, skills, and feats. The elemental ally can summon one of these elementals with the same 1-minute ritual a summoner normally uses to do so. The elemental ally can't summon an eidolon or cast _[summon nature's ally](ref/spell/summon-natures-ally)_ if she currently has an eidolon summoned. She also can't summon an eidolon if she currently has a creature summoned through other means. If one of the elemental ally's eidolons is killed, she cannot summon any eidolons for 24 hours. The elemental ally can dismiss her eidolon as a standard action.

As the elemental ally gains levels, her elemental eidolons' base statistics and base evolutions increase as if her druid level were her summoner level. The eidolons gain the darkvision, link, share spells, evasion, ability score increase, devotion, multiattack, and improved evasion abilities at the appropriate levels, but never gain an evolution pool. Abilities and spells that grant additional evolution points to eidolons do not function for elemental eidolons, though any ability that would grant evolution points to an animal companion does work. The elemental ally does not gain life link or any other class features a summoner gains in relation to her eidolon.

This ability replaces nature's bond and wild shape.'''
import_trades = ["Nature's bond, wild shape", "Nature's bond", "wild shape"]

[[entry.feature]]
anchor = "elemental-empathy"
head = "Elemental Empathy (Ex)"
listed = true
level = 1
print = '''
An elemental ally can improve the attitude of a creature of the elemental subtype. This ability functions just like a Diplomacy check to improve the attitude of a person. The elemental ally rolls 1d20 and adds her druid level and her Charisma modifier to determine the elemental empathy check result.

To use elemental empathy, the elemental ally and the elemental must be able to study each other, which means that they must be within 30 feet of one another under normal conditions. Generally, influencing an elemental in this way takes 1 minute, but as with influencing people, it might take more or less time.

An elemental ally can also use this ability to influence a non-elemental outsider with the air, earth, fire, or water subtype, but she takes a -4 penalty on the check.

This ability replaces wild empathy.'''
import_trades = ["Wild empathy"]

[[entry.feature]]
anchor = "elemental-magic"
head = "Elemental Magic"
listed = true
print = "The elemental ally can target elementals (including her elemental eidolons) with any spell she casts that targets animals, even though elementals can't normally be targeted by such spells."

[[entry.feature]]
anchor = "elemental-resistance"
head = "Elemental Resistance (Ex)"
listed = true
level = 4
print = "At 4th level, an elemental ally gains [resist](ref/umr/resistance) acid, cold, electricity, and fire 5. This ability replaces resist nature's lure."
import_trades = ["Resist nature's lure"]

[[entry]]
id = "ref/arc-inquisitor/monster-tactician"
opening = ["While most inquisitors have learned to take advantage of the movements of their opponents and allies in combat, some instead summon creatures as a means of claiming strategic advantage, exploiting the mystic connection between themselves and their summoned creatures to impart a bit of their own tactical knowledge."]

[[entry.feature]]
anchor = "summon-monster"
head = "Summon Monster (Sp)"
listed = true
level = 1
print = '''
Starting at 1st level, a monster tactician can cast _[summon monster I](ref/spell/summon-monster-1)_ as a [spell-like ability](ref/umr/spell-like-abilities) a number of times per day equal to 3 + her Wisdom modifier. She can cast this spell as a standard action, and the creatures remain for 1 minute per level (instead of 1 round per level). At 3rd level and every 2 inquisitor levels thereafter, the power of this ability increases by 1 spell level, allowing her to summon more powerful creatures (to a maximum of _[summon monster IX](ref/spell/summon-monster-9)_ at 17th level). A monster tactician cannot have more than one _[summon monster](ref/spell/summon-monster)_ spell active in this way at a time; if she uses another, any existing _[summon monster](ref/spell/summon-monster)_ immediately ends. These _[summon monster](ref/spell/summon-monster)_ spells are considered to be part of the monster tactician's spell list for the purposes of spell trigger and spell completion items. In addition, she can expend uses of this ability to fulfill the construction requirements of any magic items she creates, so long as she can use this ability to cast the required spells.

At 2nd level and each level thereafter, the monster tactician can add one monster from the expanded _[summon monster](ref/spell/summon-monster)_ list (see pages 28–29) to her list of available summoned creatures. She can add a new option to any _summon monster_ spell she can cast at the time she chooses the monster; once made, these choices cannot be changed.

This ability replaces judgment.'''
import_trades = ["Judgment"]

[[entry.feature]]
anchor = "summon-tactics"
head = "Summon Tactics (Su)"
listed = true
level = 5
print = "At 5th level, every time a monster tactician casts a summoning spell, she can choose any one teamwork feat she knows. All creatures summoned by the spell are treated as if they had the chosen feat for all purposes, without needing to meet any prerequisites. At 8th level and again at 16th level, the number of teamwork feats that she can choose when casting a summoning spell increases by 1. She cannot choose the same feat twice. At 20th level, all creatures summoned by the spell are treated as if they knew all of the monster tactician's teamwork feats. This ability replaces _discern lies_, second judgment, third judgment, slayer, and true judgment."
import_trades = ["Discern lies, second judgment, third judgment, slayer, true judgment", "Discern lies", "second judgment", "third judgment", "slayer", "true judgment"]

[[entry]]
id = "ref/arc-summoner/counter-summoner"
opening = ["While most summoners excel at conjuring monsters, there are those who focus instead on disrupting the conjurations of opponents. The counter-summoner harnesses powerful abjuration magic to instantly thwart the conjuration and summoning abilities of other casters, though at the cost of weakening his own powers of conjuration."]

[[entry.feature]]
anchor = "counter-summon"
head = "Counter-Summon (Su)"
listed = true
level = 1
print = "At 1st level, a counter-summoner can attempt to counter a conjuration spell cast by another creature. He must identify the spell being cast as normal for [counterspelling](ref/rule/counterspells). If he does so, he can attempt to counter the spell as a swift or immediate action. To counter the spell, the counter-summoner must attempt a dispel check as if using _[dispel magic](ref/spell/dispel-magic)_. If the spell being countered is a _[summon monster](ref/spell/summon-monster)_ or _[summon nature's ally](ref/spell/summon-natures-ally)_ spell, the counter-summoner gains a +5 bonus on the dispel check. The counter-summoner can use this ability a number of times per day equal to 3 + his Charisma modifier. This replaces _summon monster_."
import_trades = ["Summon monster"]

[[entry.feature]]
anchor = "detect-summons"
head = "Detect Summons (Su)"
listed = true
level = 2
print = "At 2nd level, as a swift action, a counter-summoner can target a single creature he can see and determine if it has been summoned to its current plane from another. This ability reveals whether the target has been conjured by a conjuration (summoning) or (calling) spell, and allows the counter-summoner to attempt a Spellcraft check to identify the spell that conjured it (using the same DC as if the counter-summoner had witnessed the spell being cast). This ability replaces bond senses."
import_trades = ["Bond senses"]

[[entry.feature]]
anchor = "weaken-summons"
head = "Weaken Summons (Su)"
listed = true
level = 10
print = "At 10th level, as a standard action, a counter-summoner can attempt to weaken a summoned or called creature within 60 feet. The targeted creature takes a -2 penalty on attack and damage rolls and to Armor Class for 1 minute per summoner level. A successful Will save (DC = 10 + 1/2 the counter-summoner's class level + his Charisma modifier) negates this effect. A given summoned creature can't be targeted by this ability more than once per 24-hour period. This ability replaces aspect."
import_trades = ["Aspect"]

[[entry.feature]]
anchor = "improved-weaken-summons"
head = "Improved Weaken Summons (Su)"
listed = true
level = 18
print = "At 18th level, the penalty for the counter-summoner's weaken summons ability changes to -4. This ability replaces greater aspect."
import_trades = ["Greater aspect"]

[[entry]]
id = "ref/arc-summoner/morphic-savant"
opening_from_print = true
opening = ["A morphic savant is an agent of change who draws power from the Abyss, Elysium, or the Maelstrom to fulfill whatever goals strike his fancy. Chaotic evil and chaotic neutral morphic savants often train with [Blackfire Adepts](ref/pclass/blackfire-adept) in the hopes of learning greater powers of chaotic unmaking, and chaotic good morphic savants are most common as agents of the [Bellflower Network](ref/rule/aff-antislavery)."]

[[entry.feature]]
anchor = "alignment"
head = "Alignment"
listed = false
print = "Any chaotic."

[[entry.feature]]
anchor = "eidolon-of-chaos"
head = "Eidolon of Chaos"
listed = true
level = 1
print = "A morphic savant's eidolon must be of a chaotic alignment (if using the summoner from _Pathfinder Unchained_, the eidolon must have the azata, demon, or protean subtype). The morphic savant's eidolon has three base forms: biped, quadruped, and serpentine. Each form has the same feats and skills, but has its own set of evolutions. When the summoner meditates and regains his spell slots for the day, he can select any of the three base forms of his eidolon. The eidolon has 1 fewer evolution point than normal for an eidolon of the morphic savant's summoner level, and has 1 fewer skill point per Hit Die. This ability alters eidolon."
import_trades = ["Eidolon"]

[[entry.feature]]
anchor = "morphic-monsters"
head = "Morphic Monsters"
listed = true
print = '''
Since a morphic savant's power is drawn from planar energies aligned with chaos, all the creatures he summons must be of a chaotic alignment. If a creature would normally be celestial or fiendish, it is instead an [entropic creature](ref/template/entropic).

This also causes the morphic savant's summoning power to be less reliable than a standard summoner's. Each time he uses his _[summon monster](ref/spell/summon-monster)_ [spell-like ability](ref/umr/spell-like-abilities) to summon multiple creatures, there is a 50% chance he summons one more monster than normal for the _[summon monster](ref/spell/summon-monster)_ spell he uses, in which case the creatures remain for only 1 round per level (instead of 1 minute per level).

Also, starting at 2nd level, the morphic savant can grant one 1-point evolution to all the creatures he summons with his _[summon monster](ref/spell/summon-monster)_ [spell-like ability](ref/umr/spell-like-abilities). He can't grant an evolution that duplicates the function of, or has the same name as, any ability the summoned creatures already possess (for example, he can't grant a creature with a bite attack another bite attack), nor can he add an evolution that causes the summoned monsters to have more attacks than his eidolon's maximum number of attacks. The creatures do not have to be of the correct subtype to gain an evolution, but do have to meet any other prerequisites.

This ability alters _summon monster_.'''
import_trades = ["Summon monster"]

[[entry.feature]]
anchor = "chaos-magic"
head = "Chaos Magic"
listed = true
print = "A morphic savant gains the following bonus spells known at the listed spell level: 1st—_protection from law_, 2nd—_shard of chaos_, 3rd —_magic circle against law_, 4th—_chaos hammer_, 5th—_dispel law_, 6th—_word of chaos_. The morphic savant gains one fewer spell known per spell level for spell levels 1–6. This ability alters the summoner's spells known."
import_trades = ["Spells known"]

[[entry]]
id = "ref/arc-summoner/unwavering-conduit"
opening_from_print = true
opening = ["Unwavering conduits work to keep everything ordered and regimented, drawing on power from the Eternal City of Axis, Heaven, or Hell to enforce whichever laws the summoner finds paramount. Lawful good unwavering conduits often work with Riftwardens to protect the integrity of the Great Beyond, while lawful evil unwavering conduits are commonly diabolists in Cheliax."]

[[entry.feature]]
anchor = "alignment"
head = "Alignment"
listed = false
print = "Any lawful."

[[entry.feature]]
anchor = "eidolon-of-law"
head = "Eidolon of Law"
listed = true
level = 1
print = "An unwavering conduit's eidolon must be of a lawful alignment (if using the summoner from _Pathfinder Unchained_, the eidolon must be of the archon, devil, or inevitable subtype). Once selected, the evolutions of the unwavering conduit's eidolon cannot be changed when a new class level is gained (though they can be altered normally with the _[transmogrify](ref/spell/transmogrify)_ spell; see _Pathfinder RPG Advanced Player's Guide_ 250). At least half the eidolon's skill points must be spent on skills in which the unwavering conduit also has ranks. The eidolon gains a +1 resistance bonus on saving throws against spells and abilities of the conjuration, enchantment, and transmutation schools. This bonus increases to +2 at 3rd level, and by an additional 1 for every 3 levels thereafter. The eidolon has 1 fewer evolution point than normal for an eidolon of the unwavering conduit's summoner level. This ability alters eidolon."
import_trades = ["Eidolon"]

[[entry.feature]]
anchor = "unwavering-monsters"
head = "Unwavering Monsters"
listed = true
print = '''
Since an unwavering conduit's power is drawn from planar energies aligned with law, all the creatures he summons must be of a lawful alignment. If a creature would normally be celestial or fiendish, it is instead a [resolute creature](ref/template/resolute).

This also causes the unwavering conduit's summoning power to be more set than a standard summoner's. Beginning at 3rd level, each time he uses _[summon monster](ref/spell/summon-monster)_ to summon multiple monsters, rather than rolling a die to see how many creatures he summons, he receives a specific number (two creatures for 1d3, or four creatures for 1d4+1). If an item, spell, or ability would increase the number of creatures summoned, the set number increases by that amount.

Also, starting at 2nd level, creatures summoned by the unwavering conduit receive a +1 resistance bonus on saving throws against spells and abilities of the conjuration, enchantment, and transmutation schools. This bonus increases to +2 at 6th level, and by an additional 1 every 4 class levels thereafter.

This ability alters _summon monster_.'''
import_trades = ["Summon monster"]

[[entry.feature]]
anchor = "law-magic"
head = "Law Magic"
listed = true
print = "The unwavering conduit gains the following bonus spells known at the listed spell level: 1st—_protection from chaos_, 2nd—_arrow of law_, 3rd—_magic circle against chaos_, 4th—_order's wrath_, 5th—_dispel chaos_, 6th—_dictum_. The unwavering conduit gains one fewer spell known per spell level for spell levels 1–6. This ability alters the summoner's spells known."
import_trades = ["Spells known"]

