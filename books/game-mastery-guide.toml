[[books]]
source = "game-mastery-guide"
title = "GameMastery Guide"
basis = "The chapter titles, their order, and their first pages are checked against the printed contents page of the GameMastery Guide. Each chapter holds its printed section headings in page order. The corpus imported the same book twice; the second tree is merged into this publication id, and its records without a printed page sit at the end of the printed section their dataset group names. See docs/research/book-order-evidence.md. Canonical ids were substituted through the reviewed alias map; chapters and order are unchanged."
review = ["Nested placement follows the printed section headings; entries that share a printed page keep the dataset order.", "The records that only the retired page-order tree placed carry no GameMastery Guide page; they sit at the end of their printed section.", "The printed Appendix (310) has no corpus entries."]

