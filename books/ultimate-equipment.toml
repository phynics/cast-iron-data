[[books]]
source = "ultimate-equipment"
title = "Ultimate Equipment"
basis = "The main chapter titles, their order, and their first pages are checked against the printed contents page of Ultimate Equipment. Each chapter holds its printed section headings and entries in page order. See docs/research/book-order-evidence.md. Canonical ids were substituted through the reviewed alias map; chapters and order are unchanged."
review = ["Each chapter holds its printed sections and page order; entries that share a printed page keep the dataset order.", "Magic item variants sit under their base item: parenthetical rows, the ioun stones, the cube of force variants, and the metamagic-rod rows.", "The printed Appendix 2: Gems and Jewelry has its own heading inside the Appendices chapter. Appendix 3: Art Objects has no corpus entries and no group.", "The residual New entries (page order) chapter keeps only the two cross-book hubs with no Ultimate Equipment page: Advanced GM Topics and Savage Breaker.", "Canonical ids were substituted through sources/canonical/id-map.toml. A legacy entry with no installed target is omitted and listed in coverage."]

