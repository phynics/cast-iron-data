[[books]]
source = "technology-guide"
title = "Technology Guide"
basis = "The main chapter titles, their order, and their first pages are checked against the printed contents page of Technology Guide. Each chapter holds its printed section headings and entries in page order. See docs/research/book-order-evidence.md. Canonical ids were substituted through the reviewed alias map; chapters and order are unchanged."
review = ["Each chapter holds its printed sections and page order; entries that share a printed page keep the dataset order.", "The printed Introduction has no corpus chapter. The printed Technological Equipment and Technological Hazards and Artifacts titles replace the dataset's Equipment and Hazards and Artifacts.", "The dataset group headings On Signals and Traps and Technology are gone because an entry now carries each printed heading; no entry id or entry file changed.", "A canonical duplicate of a dataset section intro opens the printed section it repeats: Technological Adventures, Technological Feats, Feats and Crafting High-Tech Items, Artificial Intelligence, Tech Artifacts, and Miscellaneous Gear.", "The final New entries (page order) chapter keeps only entries with no Technology Guide page: the base Make Whole spell, which Technology Guide refers to but does not print, and the cross-book Specific Campaign Types hub.", "Canonical ids were substituted through sources/canonical/id-map.toml. A legacy entry with no installed target is omitted and listed in coverage."]

