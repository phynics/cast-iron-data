[[books]]
source = "core-rulebook"
title = "Core Rulebook"
basis = "The 15 chapter titles, their order, and their first pages are checked against the printed contents page of the Core Rulebook. Its appendices are Special Abilities, Conditions, Inspiring Reading, and Game Aids; the first two are top-level groups and the last two have no corpus entries. The dataset's Glossary aggregate opens Special Abilities. See docs/research/book-order-evidence.md. Canonical ids were substituted through the reviewed alias map; chapters and order are unchanged."
review = ["Canonical ids were substituted through sources/canonical/id-map.toml. A legacy entry with no installed target is omitted and listed in coverage."]

