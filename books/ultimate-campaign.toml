source = "ultimate-campaign"
title = "Ultimate Campaign"
basis = "The chapter titles, their order, and their first pages are checked against the printed contents page of Ultimate Campaign. Each chapter holds its printed section headings, and each entry sits in its printed section in page order. See docs/research/book-order-evidence.md. Canonical ids were substituted through the reviewed alias map; chapters and order are unchanged."
